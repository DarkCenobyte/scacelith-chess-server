          description: '`server_busy` (paroļu jaukšanas rinda vai datubāze palika bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: Mainīt e-pasta adresi
      description: |-
        Maina konta e-pasta adresi. Laukam `newEmail` tiek noņemtas sākuma un beigu atstarpes, tas tiek pārveidots mazajiem burtiem un pēc tam pārbaudīts tāpat kā reģistrēšanās adrese.

        **Ar e-pasta apstiprināšanu** (noklusējums): 202 `verification_sent`. Uz jauno adresi tiek nosūtīta saite, kas derīga 24 stundas; tā atver `/confirm-email-change`, un adrese mainās tikai tad, kad spēlētājs nospiež šīs lapas pogu. Līdz tam `GET /account/me` rāda jauno adresi kā `pendingEmail`. Jauns pieprasījums aizstāj gaidošo; paroles maiņa vai atiestatīšana to atceļ. Uz konkrētu jauno adresi tiek nosūtīta ne vairāk kā viena saite 5 minūtēs, neatkarīgi no tā, kurš to pieprasa (pieprasījums par jau gaidošo maiņu saglabā iepriekš nosūtīto saiti, kas paliek derīga); atbilde ir tāda pati. Uz pašreizējo adresi tiek nosūtīts paziņojums, ka pieprasīta maiņa uz maskētu adresi (`a***@example.org`). Atbilde un `pendingEmail` ir tādas pašas, ja jauno adresi jau izmanto cits konts: tad saite netiek nosūtīta, tāpēc šī maiņa nekad netiek pabeigta, un tās vietā šīs adreses īpašnieks saņem paziņojumu (ne vairāk kā vienu stundā).

        Kad saite ir apstiprināta, adrese mainās un tiek uzskatīta par apstiprinātu, ierīces paliek pierakstītas, iepriekš nosūtītās saites (apstiprinājuma, paroles atiestatīšanas, citu maiņu) vairs nedarbojas, un iepriekšējā adrese saņem paziņojumu, kurā jaunā adrese ir maskēta.

        **Bez e-pasta apstiprināšanas** (`REQUIRE_EMAIL_VERIFICATION=false`): adrese mainās uzreiz (200 `email_changed`), un iepriekšējā adrese saņem paziņojumu. Ja adresi izmanto cits konts, atbilde ir 409 `email_taken`, un šīs adreses īpašnieks saņem paziņojumu.

        **Atkārtota autentifikācija:** parole un, ja ir ieslēgta divu faktoru autentifikācija, autentifikācijas lietotnes kods vai atkopšanas kods. `invalid_email` un `same_email` tiek pārbaudīti pirms paroles, tāpēc tie neskaitās kā neveiksme. **Ierobežojumi:** `reauth`, pēc tam `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Adrese tika mainīta uzreiz (šajā serverī nav e-pasta apstiprināšanas).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: Jaunā adrese, kā tā saglabāta.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: Uz jauno adresi tika nosūtīta apstiprinājuma saite (vai arī adrese pieder citam kontam; atbilde to neatklāj).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email` (konta pašreizējā adrese), `password_not_set` (konts, kurā pierakstās tikai ar Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` (arī tad, ja paroles maiņa vai atiestatīšana apsteidza pieprasījumu: saite netiek nosūtīta), `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: tikai bez e-pasta apstiprināšanas.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neveiksmīgas atkārtotās autentifikācijas vai šajā kontā izmēģināts pārāk daudz kodu) vai `rate_limited` (ierobežojums `reauth` vai `reauth_user`, konta budžets, paroļu jaukšanas rinda).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: paroļu jaukšanas rinda vai datubāze palika bloķēta (`retryAfter: 1`: nekas netika mainīts, un to pašu pieprasījumu var nosūtīt vēlreiz). `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: Lejupielādēt konta datus
      description: |-
        Viss, ko serveris glabā par kontu, kā viens saglabājams JSON fails (`format` `scacelith-account-export`, `version` 1). Eksports reģistrē drošības notikumu (`account_exported`). Dokumenta masīvs `notes` vienkāršā angļu valodā paskaidro spēlētājam, kas nav iekļauts.

        **Eksportā nekad nav:** paroles jaucējvērtības, divu faktoru autentifikācijas slepenās atslēgas un atkopšanas kodu; neviena sesijas vai saites marķiera, ne arī tā jaucējvērtības; pretkrāpšanas sistēmas datu (godīguma līmeņa un vērtējuma, anomāliju, partiju analīzes, ziņojuma svara); ziņojumu, ko citi spēlētāji iesnieguši par šo spēlētāju; moderatoru identitāšu; citu spēlētāju privāto datu (pretinieki redzami ar savu publisko vārdu un reitingu, nekas neatklāj, vai citam spēlētājam piemērota sankcija, un netiek iekļauta neviena IP adrese, kas varētu piederēt citai personai).

        **Atkārtota autentifikācija:** parole un, ja ir ieslēgta divu faktoru autentifikācija, autentifikācijas lietotnes kods vai atkopšanas kods. **Ierobežojumi:** `account_export` (5 stundā katram spēlētājam, visa servera mērogā; tiek skaitīts katrs mēģinājums, arī neveiksmīgie; pārbauda vispirms), pēc tam `reauth` un `reauth_user`. **Laika ierobežojums:** 60 sekundes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Eksporta dokuments kā pielikums.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-account-<username>.json"`. Lietotājvārdā rakstzīmes, kas nav burti, cipari, `_`, `.` un `-`, tiek aizstātas ar `_`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-account-[A-Za-z0-9_.-]+\.json"$'
              example: attachment; filename="scacelith-account-alice.json"
          content:
