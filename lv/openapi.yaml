        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: tika nosūtīts marķieris, un tas nav derīgs.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: šāda spēlētāja nav, vai konts ir dzēsts.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `public_read` vai konta budžets.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (datubāze palika bloķēta; `retryAfter: 1` pamattekstā, bez galvenes `Retry-After`), `server_busy` (sesijas uzmeklēšanas laikā datubāze bija bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /players/{username}/games:
    get:
      operationId: listPlayerGames
      tags:
        - players
      summary: Uzskaitīt spēlētāja nesenās partijas
      description: |-
        Spēlētāja nesenās partijas, sākot ar jaunākajām, sadalītas lapās tāpat kā vēsture, bet bez filtriem un kopskaita. `color` ir šī spēlētāja puse. Ja lapa ir pilna, `next` ir pēdējās partijas ID, tāpēc nākamā lapa var būt tukša. Vispirms tiek uzmeklēts spēlētājs: nezināms spēlētājs dod 404 neatkarīgi no vaicājuma.

        **Ierobežojums:** `public_read` (ar marķieri — katram spēlētājam, bez tā — katram klientam).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Viena spēlētāja partiju lapa.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerGamesPage'
              example:
                username: alice
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                next: 4100000000001
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_cursor` (`before` nav partijas ID), `invalid_limit` (šie divi bez `field`).'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: tika nosūtīts marķieris, un tas nav derīgs.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: šāda spēlētāja nav, vai konts ir dzēsts.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `public_read` vai konta budžets.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (datubāze palika bloķēta; `retryAfter: 1` pamattekstā, bez galvenes `Retry-After`), `server_busy` (sesijas uzmeklēšanas laikā datubāze bija bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: Iegūt kategorijas labākos spēlētājus
      description: |-
        Oficiālās kategorijas 100 labākie reitinga ieraksti ar vismaz `minGames` (`PROVISIONAL_GAMES`) ieskaitītām partijām, izņemot dzēstus kontus un apstiprinātus krāpniekus. Serveris katru sarakstu pārrēķina ne biežāk kā reizi 10 sekundēs; `updatedAt` norāda, kad. Vienā kategorijā vienlaikus notiek tikai viens aprēķins: tikmēr pārējie pieprasījumi saņem iepriekšējo sarakstu vai, ja saraksta vēl nav, gaida aprēķinu.

        **Ierobežojumi:** tikai adrešu slānis.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: Oficiālās kategorijas ID (`3+2` vai `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: Cik spēlētāju, no 1 līdz 100. Lielāks skaitlis ar ne vairāk kā 3 cipariem tiek uzskatīts par 100; tukša vērtība tiek uzskatīta par neesošu.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: Līderu saraksts.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (trūkst vai nav oficiāla kategorija), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: adrešu slānis.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (datubāze palika bloķēta; `retryAfter: 1` pamattekstā, bez galvenes `Retry-After`), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Ziņot par nesenas partijas pretinieku
      description: |-
        Ziņo par pretinieku vienā no paša spēlētāja partijām, kas beigusies pēdējo 7 dienu laikā. Ziņojums pats par sevi nekad nemaina reitingu, sankciju vai godīguma līmeni. Tas paaugstina pārskatīšanas prioritāti, ko redz moderatori, un, izņemot `abuse`, pieprasa partijas analīzi ar šaha dzinēju.

        Ziņojums par to pašu pretinieku tajā pašā partijā saņem tādu pašu atbildi un neko nemaina; atbilde nekad neko neatklāj par kontu, par kuru ziņots. `GET /games/{id}` jau iepriekš paziņo partijas spēlētājiem, vai ziņojums tiktu pieņemts (`reportable`).

        Šis galapunkts pats pārbauda savu pamattekstu secībā `gameId`, `reported`, `category`, `comment`: kļūdas gadījumā tas atbild ar 400 `invalid_request` bez `field`. Lauki, ko tas nepazīst, tiek ignorēti.

        **Ierobežojumi:** `reports` (katram spēlētājam), pēc tam `REPORTS_PER_DAY` (5) ziņojumi katram spēlētājam 24 stundās (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Ziņojums ir saņemts (vai jau bija iesniegts).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (bez `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: nav ziņotāja pretinieks partijā, kas beigusies pēdējo 7 dienu laikā.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, ar galveni `Retry-After`): pēdējās 24 stundās iesniegti `REPORTS_PER_DAY` ziņojumi. `rate_limited`: ierobežojums `reports` vai konta budžets.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (sesijas uzmeklēšanas laikā datubāze bija bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /verify-email:
