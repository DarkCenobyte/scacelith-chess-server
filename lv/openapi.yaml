  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: Dzēst kontu
      description: |-
        Dzēš kontu; šo darbību nevar atcelt.

        - Visas sesijas tiek nekavējoties atsauktas: no šī brīža marķieris saņem 401 `invalid_token`.
        - Lietotājvārds kļūst par `deleted#<id>` gan kontā, gan katrā partijas pierakstā.
        - Tiek izdzēsti: e-pasta adrese, paroles jaucējvērtība, divu faktoru autentifikācijas slepenā atslēga un atkopšanas kodi, sesijas un saišu marķieri, sasaiste ar Google, pretkrāpšanas sistēmas godīguma ieraksts un IP adreses, kas saglabātas kopā ar drošības notikumiem.
        - Reitingi un partijas tiek saglabāti. Partijas joprojām var skatīt ar anonīmo vārdu, un `GET /players/{username}` iepriekšējam vārdam atbild ar 404.

        **Atkārtota autentifikācija:** parole un, ja ir ieslēgta divu faktoru autentifikācija, autentifikācijas lietotnes kods vai atkopšanas kods. **Ierobežojumi:** `reauth`, pēc tam `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Konts ir dzēsts.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (konts, kurā pierakstās tikai ar Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neveiksmīgas atkārtotās autentifikācijas vai šajā kontā izmēģināts pārāk daudz kodu) vai `rate_limited` (ierobežojums `reauth` vai `reauth_user`, konta budžets, paroļu jaukšanas rinda).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (paroļu jaukšanas rinda vai datubāze palika bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Uzskaitīt spēlētāja partijas ar filtriem un lapošanu
      description: |-
        Pierakstītā spēlētāja partijas, sākot ar jaunākajām, filtrētas un sadalītas lapās, kopā ar filtram atbilstošo partiju skaitu. Visi vaicājuma parametri ir neobligāti, un tukša vērtība tiek uzskatīta par neesošu.

        Lapošana: nododiet iepriekšējās lapas `next` kā `before`; pēdējā lapā `next` ir `null`. `total` skaita filtram atbilstošās partijas visās lapās kopā.

        **Ierobežojums:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: Oficiālās kategorijas ID (`3+2` vai `3%2B2`) vai `custom` visām partijām ar citu laika kontroli.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Tikai reitinga (`true`) vai nereitinga (`false`) partijas.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Tikai uzvarētās, zaudētās vai neizšķirtās partijas no spēlētāja viedokļa. Anulētās partijas parādās tikai bez šī filtra.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Viena vēstures lapa.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` nav partijas ID), `invalid_limit` vai `invalid_filter` (`category`, `rated` vai `result`), katrs ar `field`, kas nosauc parametru.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `account_games` vai konta budžets.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (datubāze palika bloķēta; `retryAfter: 1` pamattekstā, bez galvenes `Retry-After`), `server_busy` (sesijas uzmeklēšanas laikā datubāze bija bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /games/{id}:
    get:
      operationId: getGame
      tags:
        - games
      summary: Iegūt partijas pierakstu ar gājieniem un pulksteņiem
      description: |-
        Viens partijas pieraksts ar gājieniem un pulksteņiem. Bez marķiera vai ar tāda spēlētāja marķieri, kurš šo partiju nespēlēja, atbilde ir publiskā. Ja marķiera spēlētājs šo partiju spēlēja, atbildei tiek pievienoti `you` un `reportable`.

        **Ierobežojums:** `public_read` (ar marķieri — katram spēlētājam, bez tā — katram klientam).
      security:
        - {}
