paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Iegūt servera nosaukumu, versijas, portus un reģistrēšanās noteikumus
      description: |-
        Kas klientam vajadzīgs, pirms tas pierakstās vai izveido savienojumu: servera nosaukums un ID, WebSocket protokola versijas un WebSocket atrašanās vieta, reģistrēšanās noteikumi, oficiālās laika kontroles un ierobežojumi, ko klients var pārbaudīt pirms veidlapas nosūtīšanas.

        **Ierobežojumi:** tikai adrešu slānis.
      security: []
      responses:
        '200':
          description: Servera apraksts.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: adrešu slānis.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Izveidot kontu
      description: |-
        Izveido kontu: kad tā e-pasta adrese ir apstiprināta ar uz to nosūtīto saiti, vai nekavējoties, ja e-pasta apstiprināšana netiek prasīta.

        **Ar e-pasta apstiprināšanu** (`REQUIRE_EMAIL_VERIFICATION`, noklusējums): 202 `verification_sent`. Konts vēl neeksistē: reģistrēšanās gaida 24 stundas un tikmēr rezervē savu lietotājvārdu. Uz adresi tiek nosūtīta saite, kas derīga šīs 24 stundas, ne vairāk kā viena uz adresi ik pēc 5 minūtēm (`POST /auth/verify-email/resend` nosūta jaunu); konts tiek izveidots un tā adrese apstiprināta, kad saite tiek izmantota (lapas `/verify-email` poga), un pēc tam spēlētājs var pierakstīties. Līdz tam uz pierakstīšanos ar šo lietotājvārdu atbilde ir `invalid_credentials`, tāpat kā nezināmam kontam, un publiskā profila nav. Jauna reģistrēšanās ar to pašu adresi aizstāj gaidošo. Atbilde ir tāda pati, ja adresi jau izmanto cits konts: tad saite netiek nosūtīta, tā vietā konta īpašnieks saņem paziņojumu (ne vairāk kā vienu stundā), un lietotājvārds tiek rezervēts tāpat, lai nekas neatklātu, vai adresei ir konts. Reģistrēšanās, kuras saite netika izmantota, pēc 24 stundām tiek atmesta, un tās lietotājvārds atkal ir brīvs.

        **Bez e-pasta apstiprināšanas** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, konts tiek izveidots nekavējoties, un ar to var pierakstīties.

        **Noteikumi.** `username`: no `USERNAME_MIN` līdz `USERNAME_MAX` rakstzīmēm (no 3 līdz 20), burti, cipari, `_` un `-`, sākas ar burtu vai ciparu (`GET /info` tos norāda kā `limits`); rezervēti vārdi (`admin`, `moderator`, `deleted`...) un daži prefiksi tiek noraidīti; unikāls neatkarīgi no burtu reģistra. `email`: bez sākuma un beigu atstarpēm, glabāts mazajiem burtiem, tikai ASCII ar domēnu, kurā ir punkts. `password`: vismaz `PASSWORD_MIN_LENGTH` (10) rakstzīmes un ne vairāk kā 256 baiti UTF-8 kodējumā; tā nedrīkst saturēt lietotājvārdu vai e-pasta adreses vietējo daļu un nedrīkst būt bieži lietota parole.

        **Kļūdas**, pārbaudītas šādā secībā: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; paroļu jaukšanas rindas kļūdas; 409 `email_taken` (tikai bez e-pasta apstiprināšanas).

        **Ierobežojumi:** `auth`, pēc tam `auth_register` (10 reģistrēšanās pieprasījumi stundā katram klientam). **Darba apliecinājums:** vienmēr, ja `POW_REGISTER_BITS` ir lielāks par 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Pirmais mēģinājums bez darba apliecinājuma
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Nosūtīts vēlreiz ar darba apliecinājumu
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Konts ir izveidots, un ar to var pierakstīties (šajā serverī e-pasta apstiprināšana netiek prasīta).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Reģistrēšanās gaida, kad tiks izmantota tās apstiprinājuma saite (vai adresei jau ir konts; atbilde to neatklāj).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (ar `field`), `invalid_json`, `invalid_username`, `invalid_email` vai `weak_password` ar `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` vai `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: šajā serverī reģistrēšanās ir slēgta (`GET /info` norāda `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: lietotājvārds pieder kādam kontam, vai to rezervējusi citas adreses gaidoša reģistrēšanās. `email_taken`: adresi izmanto cits konts (tikai bez e-pasta apstiprināšanas).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `auth` vai `auth_register`, vai paroļu jaukšanas rinda.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (paroļu jaukšanas rinda vai datubāze palika bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Pierakstīties ar paroli
      description: |-
        Pierakstās ar lietotājvārdu vai e-pasta adresi un paroli. Iespējamas divas atbildes, abas ar statusu 200: sesija vai, ja ir ieslēgta divu faktoru autentifikācija, otrais solis, kas 5 minūšu laikā jāpabeidz ar `POST /auth/login/mfa`.

        Nezināms konts, nepareiza parole un konts bez paroles saņem vienādu atbildi pēc vienāda laika: 401 `invalid_credentials`. Konta pārbaudes (`banned`, `email_unverified`) notiek tikai pēc pareizas paroles. Sākot no `AUTH_FAILURES_PER_ACCOUNT` (5) neveiksmēm ar vienu pierakstīšanās vārdu, katram mēģinājumam jāgaida (429 `too_many_attempts`).

        **Ierobežojums:** `auth`. **Darba apliecinājums:** tikai neveiksmīgu pierakstīšanos viļņa laikā (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Sesija vai pierakstīšanās otrais solis, ja ir ieslēgta divu faktoru autentifikācija.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Pierakstīšanās izdevās
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Divu faktoru autentifikācija ir ieslēgta
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: nezināms konts, nepareiza parole vai konts bez paroles.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Tikai pēc pareizas paroles: `banned` ar `until` (Unix laiks, ms; `null`, ja konts apturēts uz visiem laikiem) vai `email_unverified` (vecāks konts, kura adrese vēl nav apstiprināta).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (šī pierakstīšanās vārda neveiksmju aizture) vai `rate_limited` (ierobežojums `auth`, paroļu jaukšanas rinda).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (paroļu jaukšanas rinda vai datubāze palika bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Pabeigt pierakstīšanos ar otro faktoru
      description: |-
        Pierakstīšanās otrais solis, ja ir ieslēgta divu faktoru autentifikācija, pēc tam, kad `POST /auth/login` vai pierakstīšanās ar Google (`POST /auth/sso/google/finish` vai `POST /auth/sso/google/link`) atbildēja ar `mfaRequired`. Nosūtiet `code` (6 ciparu autentifikācijas lietotnes kodu vai atkopšanas kodu) vai `recoveryCode`. Šeit izmantots atkopšanas kods vairs nav derīgs.

        Viens solis pieņem ne vairāk kā 5 nepareizus kodus; solis beidzas arī tad, ja parole tiek atiestatīta vai nomainīta. Pēc Google saistīšanas paroles soļa saistījums tiek saglabāts tikai tad, ja kods šeit tiek pieņemts.

        **Ierobežojumi:** `auth` un ne vairāk kā `AUTH_MFA_PER_ACCOUNT` (10) kodi 15 minūtēs kontam, no jebkuras adreses; virs tā kods netiek pārbaudīts, tāpēc atkopšanas kods netiek iztērēts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Autentifikācijas lietotnes kods
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Atkopšanas kods
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Pierakstīšanās izdevās.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: netika nosūtīts ne `code`, ne `recoveryCode`, vai pamatteksts pārkāpj shēmu; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: soļa termiņš beidzās, tas jau tika izmantots vai beidzās pēc 5 nepareiziem kodiem, vai arī kopš pirmā soļa parole tika atiestatīta vai nomainīta (pierakstieties vēlreiz). `invalid_code`: nepareizs vai jau izmantots kods.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (ar `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: tikai pēc Google saistīšanas paroles soļa — Google konts pa to laiku tika saistīts ar citu kontu.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: tikai pēc Google saistīšanas paroles soļa — konts pa to laiku mainījās; sāciet pierakstīšanos no jauna.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: konta neveiksmju aizture, vai tā `AUTH_MFA_PER_ACCOUNT` kodi pēdējās 15 minūtēs ir izsmelti. `rate_limited`: ierobežojums `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` ar `retryAfter: 1`: datubāze palika bloķēta (pēc Google saistīšanas soļa nekas netika saistīts: sāciet pierakstīšanos no jauna). `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Izrakstīt šo sesiju
      description: |-
        Atsauc izmantotā marķiera sesiju. Ar to atvērtais WebSocket tiek aizvērts. Bez pamatteksta (vai `{}`).

        **Ierobežojums:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Izrakstīšanās izdevās.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: pamatteksts, kas nav `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `sessions` vai konta budžets.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (datubāze palika bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
