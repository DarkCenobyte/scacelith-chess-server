  /healthz:
    servers:
      - url: https://caissa.scacelith.com
        description: Oficiālais serveris, saknē.
      - url: https://caissa.scacelith.com/api/v1
        description: Oficiālais serveris, zem `/api/v1`.
      - url: https://{host}:{port}
        description: Jebkurš Scacelith serveris, saknē.
        variables:
          host:
            default: caissa.scacelith.com
            description: Servera publiskais resursdatora nosaukums (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Publiskais API ports (`PUBLIC_API_PORT`, citādi `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Jebkurš Scacelith serveris, zem `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: Servera publiskais resursdatora nosaukums (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Publiskais API ports (`PUBLIC_API_PORT`, citādi `API_PORT`).
    get:
      operationId: getLiveness
      tags:
        - health
      summary: Pārbaudīt, vai process darbojas
      description: |-
        Atbild ar 200 `ok`, kamēr process darbojas. Darbojas arī `HEAD`. Jebkura cita metode saņem atbildi 405 `method_not_allowed` ar `Allow: GET, HEAD` (arī `OPTIONS`).

        **Ierobežojumi:** tikai adrešu slānis.
      security: []
      responses:
        '200':
          description: Process darbojas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
              example:
                status: ok
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: adrešu slānis.'
  /readyz:
    servers:
      - url: https://caissa.scacelith.com
        description: Oficiālais serveris, saknē.
      - url: https://caissa.scacelith.com/api/v1
        description: Oficiālais serveris, zem `/api/v1`.
      - url: https://{host}:{port}
        description: Jebkurš Scacelith serveris, saknē.
        variables:
          host:
            default: caissa.scacelith.com
            description: Servera publiskais resursdatora nosaukums (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Publiskais API ports (`PUBLIC_API_PORT`, citādi `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Jebkurš Scacelith serveris, zem `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: Servera publiskais resursdatora nosaukums (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Publiskais API ports (`PUBLIC_API_PORT`, citādi `API_PORT`).
    get:
      operationId: getReadiness
      tags:
        - health
      summary: Pārbaudīt, vai serveris pieņem spēlētājus
      description: |-
        Atbild ar 200 `ready`, kad serveris pieņem spēlētājus, un ar 503 `not_ready`, kamēr tas startē vai apstājas. Darbojas arī `HEAD`. Jebkura cita metode saņem atbildi 405 `method_not_allowed` ar `Allow: GET, HEAD` (arī `OPTIONS`).

        **Ierobežojumi:** tikai adrešu slānis.
      security: []
      responses:
        '200':
          description: Serveris pieņem spēlētājus.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: adrešu slānis.'
        '503':
          description: Serveris startē vai apstājas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Sesijas marķieris (`sct_`, kam seko 43 base64url rakstzīmes) no pierakstīšanās atbildes, galvenē `Authorization`: `Authorization: Bearer <token>`. Prefikss ir tieši `Bearer` (reģistrjutīgs) un viena atstarpe; vērtība bez tā vai marķieris, kas nav no 1 līdz 512 drukājamām ASCII rakstzīmēm, saņem atbildi 401 `invalid_token` tāpat kā jebkurš cits nederīgs marķieris. Tukša galvene tiek uzskatīta par galvenes neesamību.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: Partijas ID — pozitīvs decimāls vesels skaitlis ar ne vairāk kā 16 cipariem, bez sākuma nullēm, mazāks par 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: Sesijas ID, kā to sniedz `GET /auth/sessions`, rakstīts bez sākuma nullēm (`03` nav sesija 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Spēlētāja lietotājvārds, neatkarīgi no burtu reģistra. Serveris pieņem jebkuru vārdu no 2 līdz 24 rakstzīmēm no `[A-Za-z0-9_.-]` (plašākais noteikums, ko tas jebkad ir atļāvis).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Partijas ID; tiek uzskaitītas tikai vecākas partijas. Nododiet iepriekšējās lapas `next`. Tukša vērtība tiek uzskatīta par neesošu.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Lapas izmērs, no 1 līdz 50. Lielāks skaitlis ar ne vairāk kā 3 cipariem tiek uzskatīts par 50; tukša vērtība tiek uzskatīta par neesošu.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: E-pasta saites marķieris (43 base64url rakstzīmes). Ja tā nav vai tas ir nepareizs, tiek parādīta lapa „link invalid or expired” (saite ir nederīga vai novecojusi).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Katra servera atbilde aizliedz kešošanu.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Sekundes, kas jāgaida pirms atkārtota mēģinājuma; tā pati vērtība kā `retryAfter` pamattekstā.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Bearer izaicinājums ar `error="invalid_token"` nederīgam marķierim.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Pēc šīs atbildes serveris aizver savienojumu.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (ar `field`, ja vainīgs kāds pamatteksta lauks) vai `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Lauks neatbilst shēmai
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Pamatteksts nav JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Vāja parole
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: PGN, ko nevar nolasīt
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (nav galvenes `Authorization`) vai `invalid_token` (marķieris ir nepareizi veidots, novecojis, atsaukts vai pieder dzēstam kontam).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Nav sesijas
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Nederīgs marķieris
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Pieprasījums ir noraidīts.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Nepareiza parole atkārtotas autentifikācijas laikā
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Apturēts konts
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found` vai funkcija, ko šis serveris ir izslēdzis.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: pamatteksts nepienāca 10 sekunžu laikā. Serveris aizver savienojumu.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Pieprasījums ir pretrunā ar servera stāvokli.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: pierakstīšanās ar Google mēģinājums vai biļete ir nezināma, jau izmantota vai novecojusi; sāciet pierakstīšanos no jauna.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: pamatteksts pārsniedz `HTTP_BODY_LIMIT` (pēc noklusējuma 16 384 baiti). Serveris aizver savienojumu.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: pieprasījuma mērķis pārsniedz 4096 rakstzīmes.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: pamatteksts nav `application/json`, vai tā rakstzīmju kopa nav UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: partijā ir vairāk nekā `GIF_MAX_PLIES` (600) pusgājienu.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: atrisiniet izaicinājumu `pow` un nosūtiet to pašu pieprasījumu vēlreiz ar `pow: { challenge, nonce }`. `reason` norāda iemeslu: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` vai `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (pieprasījumu biežuma ierobežojums, konta budžets vai paroļu jaukšanas rinda) vai `too_many_attempts` (konta palēninājums), ar `retryAfter` un galveni `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Pieprasījumu biežuma ierobežojums
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Pārāk daudz neveiksmju šajā kontā
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: neparedzēta kļūme. Serveris to reģistrē žurnālā.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: nepareizs `state` vai `iss`, vai arī Google noraidīja kodu vai nosūtīja ID marķieri, kas neiztur pārbaudi (ieskaitot otra klienta — spēles vai vietnes — kodu vai ID marķieri). Tas nekad nesatur Google tekstu.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` vai `timeout`: mēģiniet vēlreiz pēc `retryAfter`, ja tas ir norādīts.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Serveris ir aizņemts
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Datubāze palika bloķēta (lasīšana)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Serverim apstrāde aizņēma pārāk ilgu laiku
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Animētais GIF kā pielikums.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` šī servera partijai, `attachment; filename="scacelith-game.gif"` PGN tekstam, kas nosūtīts ar `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Faila izmērs baitos.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: HTML lapa.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: HTML lapa, kas izskaidro atteikumu.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Veidlapa nepienāca 10 sekunžu laikā (HTML lapa). Serveris aizver savienojumu.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: HTML lapa, kas izskaidro konfliktu.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Veidlapa pārsniedz `HTTP_BODY_LIMIT` (HTML lapa). Serveris aizver savienojumu.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Pamatteksts nav ne veidlapa (`application/x-www-form-urlencoded`), ne JSON, vai tā rakstzīmju kopa nav UTF-8 (HTML lapa).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Pieprasījumu biežuma ierobežojums (HTML lapa) ar `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Neparedzēta kļūme (HTML lapa ar virsrakstu „Server error”). Serveris to reģistrē žurnālā.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Serveris ir aizņemts (datubāze palika bloķēta vai serveris ir stipri atpalicis; ar `Retry-After`), vai apstrāde aizņēma pārāk ilgu laiku (HTML lapa ar virsrakstu „Server error”).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: Vienotā forma visām JSON API kļūdu atbildēm.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Kļūdas kods formātā `snake_case`. Klients pēc tā izvēlas, ko rādīt.
          examples:
            - rate_limited
        message:
          type: string
          description: Teikums angļu valodā, paredzēts žurnāliem un kā rezerves variants.
        retryAfter:
          type: integer
          minimum: 1
          description: Sekundes, kas jāgaida pirms atkārtota mēģinājuma; ir tikai tiem atteikumiem, kas ar laiku beidzas. Tad atbildē ir arī galvene `Retry-After` ar to pašu vērtību, izņemot 503 `busy` vēstures, partijas, spēlētāja un līderu saraksta lasīšanā.
        field:
          type: string
          description: Vainīgais lauks vai vaicājuma parametrs (`invalid_request`, `invalid_option`, kā arī `GET /account/games` kļūdām `invalid_cursor`, `invalid_limit` un `invalid_filter`). Ligzdots lauks tiek rakstīts ar punktu (`pow.nonce`).
        reason:
          type: string
          description: 'Iemesls: noteikums, ko pārkāpj `weak_password`, vai tas, kāpēc darba apliecinājums tika pieprasīts vai noraidīts (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Tikai `banned`: apturēšanas beigas (Unix laiks, ms), `null` apturēšanai uz visiem laikiem.'
        line:
          type: integer
          minimum: 1
          description: 'Tikai `invalid_pgn`: kļūdas rinda, sākot no 1.'
        column:
          type: integer
          minimum: 1
          description: 'Tikai `invalid_pgn`: kļūdas kolonna, sākot no 1, rakstzīmēs.'
    PowChallenge:
      type: object
      description: Darba apliecinājuma izaicinājums (atbildes 428 `pow_required` lauks `pow`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Parakstītais izaicinājums, kas jānosūta atpakaļ nemainīts.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Cik sākuma nulles bitu jābūt vērtībai `SHA-256(challenge + ":" + nonce)`.
        expiresAt:
          type: integer
          format: int64
          description: Kad izaicinājuma derīgums beidzas (Unix laiks, ms) — 2 minūtes pēc tā izsniegšanas.
    PowAnswer:
      type: object
      description: Atbilde uz darba apliecinājuma izaicinājumu.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: Atbildes 428 `challenge` tieši tāds, kāds tas tika izsniegts.
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Decimāla virkne ar ne vairāk kā 20 cipariem, tāda, ka `SHA-256(challenge + ":" + nonce)` sākas ar `bits` nulles bitiem.
    ServerInfo:
      type: object
      description: Tas, kas klientam nepieciešams pirms pierakstīšanās vai savienojuma izveides.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Servera nosaukums (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: UUID, ko datubāze saņem pirmajā startēšanas reizē. Tas paliek nemainīgs arī pēc restartēšanas. Tas ir `null`, ja datubāze to nevar sniegt.
        motd:
          type: string
          description: Dienas ziņa (`SERVER_MOTD`), var būt tukša.
        protocol:
          type: object
          description: WebSocket protokols (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Vecākā protokola versija, ko serveris atbalsta.
            max:
              type: integer
              minimum: 1
              description: Jaunākā protokola versija, ko serveris atbalsta.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'Protokola shēmas nospiedums (tās kanoniskās formas SHA-256 pirmie 4 baiti kā vesels skaitlis bez zīmes: `0xc649140f`, 3326678031, protokola apakšversijai 2); informatīvs, nekad netiek salīdzināts.'
            subprotocol:
              type: string
              description: WebSocket apakšprotokola identifikators (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: WebSocket ports, ko izmanto spēlētāji (`PUBLIC_WS_PORT`, citādi `WS_PORT`, citādi `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: WebSocket ceļš.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Vai var izveidot jaunus kontus.
        emailVerification:
          type: boolean
          description: Vai jaunajiem kontiem jāapstiprina sava adrese (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Vai spēlei tiek piedāvāta pierakstīšanās ar Google.
            googleWeb:
              type: boolean
              description: Vai pierakstīšanās ar Google tiek piedāvāta arī vietnei (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: Divu faktoru autentifikācija vienmēr ir pieejama.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Darba apliecinājuma biti, kas nepieciešami reģistrēšanās laikā (0 — nav nepieciešams).
        categories:
          type: array
          description: Oficiālās (reitinga) laika kontroles (`RATED_CATEGORIES`) servera noteiktajā secībā. Jebkura cita laika kontrole ir `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Noteikumi, ko klients var pārbaudīt pirms veidlapas nosūtīšanas.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: Lietotājvārda minimālais garums (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: Lietotājvārda maksimālais garums (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Regulārā izteiksme, kurai jāatbilst jaunam lietotājvārdam.
            passwordMinLength:
              type: integer
              description: Paroles minimālais garums rakstzīmēs (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Paroles maksimālais garums UTF-8 baitos.
            customTimeControls:
              type: boolean
              description: Vai izaicinājumos un privātās partijās var izmantot pielāgotas laika kontroles.
            reportsPerDay:
              type: integer
              description: Cik ziņojumu spēlētājs drīkst iesniegt 24 stundās (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Lielākā WebSocket ziņa, ko klients drīkst nosūtīt, baitos.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Oficiāla laika kontrole.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 'Kategorijas ID: minūtes un pieskaitījuma sekundes (`3+2`).'
        baseSec:
          type: number
          minimum: 0
          description: Pamatlaiks sekundēs.
        incSec:
          type: number
          minimum: 0
          description: Pieskaitījums par gājienu sekundēs.
    AccountView:
      type: object
      description: Konts, kā to redz tā spēlētājs (pierakstīšanās atbilžu un `GET /account/me` lauks `user`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: Konta ID.
        username:
          type: string
          description: Lietotājvārds.
        email:
          type: string
          format: email
          description: E-pasta adrese.
        emailVerified:
          type: boolean
          description: Vai adrese ir apstiprināta.
        mfaEnabled:
          type: boolean
          description: Vai divu faktoru autentifikācija ir ieslēgta.
        googleLinked:
          type: boolean
          description: Vai ir saistīts Google konts.
        hasPassword:
          type: boolean
          description: '`false` kontam, kas izveidots ar Google un kuram vēl nav iestatīta parole.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Vai tiek pieņemti tiešie izaicinājumi pēc vārda (skatiet `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Kad konts tika izveidots (Unix laiks, ms).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Pēdējā pierakstīšanās (Unix laiks, ms) vai `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Jaunā adrese e-pasta maiņai, kas gaida apstiprinājumu ar saiti, vai `null`.
    SessionAnswer:
      type: object
      description: Jauna sesija.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Sesijas marķieris galvenei `Authorization` un WebSocket savienojumam.
        expiresAt:
          type: integer
          format: int64
          description: Sesijas absolūtās beigas (Unix laiks, ms); dīkstāves ierobežojums to var izbeigt ātrāk.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Pierakstīšanās otrais solis ar divu faktoru autentifikāciju; turpiniet ar `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Šī soļa marķieris pieprasījumam `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Atlikušās sekundes soļa pabeigšanai.
    LoginAnswer:
      description: Sesija vai pierakstīšanās otrais solis ar divu faktoru autentifikāciju.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Pirmā pierakstīšanās ar Google; turpiniet ar `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Biļete pieprasījumam `POST /auth/sso/complete`, derīga 10 minūtes.
        suggestedUsername:
          type: string
          description: Lietotājvārds, kas izveidots no Google vārda vai adreses, vai `""`, ja nekas neder.
    SsoNeedsPassword:
      type: object
      description: Šo adresi izmanto konts ar paroli; turpiniet ar `POST /auth/sso/google/link`. Pagaidām nekas nav sasaistīts.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Biļete pieprasījumam `POST /auth/sso/google/link`.
        username:
          type: string
          description: Šī konta lietotājvārds (to redz tikai tas, kurš ir apliecinājis šo adresi Google).
        expiresIn:
          type: integer
          const: 600
          description: Cik sekundes biļete paliek derīga.
    SsoFinishAnswer:
      description: Pieprasījuma `POST /auth/sso/google/finish` atbilde.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Pierakstīšanās ar Google mēģinājums.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Mēģinājums pieprasījumam `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: Google URL, kas pēc pārbaudes jāatver sistēmas pārlūkprogrammā.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state`, kas Google jānosūta atpakaļ.'
        expiresIn:
          type: integer
          const: 600
          description: Cik sekundes mēģinājums paliek derīgs.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Lietotājvārds; pēc tam piemēro servera noteikumus (skatiet aprakstu).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: E-pasta adrese. Tiek noņemtas sākuma un beigu atstarpes, un tā tiek saglabāta mazajiem burtiem.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Parole; pēc tam piemēro paroles noteikumus.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Lietotājvārds vai e-pasta adrese (jebkurš teksts ar `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Neobligāts. Tiek rādīts pierakstīto ierīču sarakstā (piemēram, `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: Pierakstīšanās atbildes (vai pierakstīšanās ar Google atbildes) `mfaToken`.
        code:
          type: string
          maxLength: 32
          description: Neobligāts. 6 ciparu autentifikācijas lietotnes kods vai atkopšanas kods.
        recoveryCode:
          type: string
          maxLength: 32
          description: Neobligāts. Atkopšanas kods. Nepieciešams viens no `code` un `recoveryCode`.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: E-pasta adrese.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Atiestatīšanas saites parametrs `token`.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Jaunā parole; piemēro reģistrēšanās paroles noteikumus.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Klienta `codeVerifier` S256 PKCE izaicinājums (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Klienta klausītāja ports adresē `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Lapas `codeVerifier` S256 PKCE izaicinājums (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`attemptId` no `POST /auth/sso/google/start`.'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: PKCE verificētājs; tā SHA-256 jāatbilst izaicinājumam, kas tika nodots `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state` tāds, kādu Google nosūtīja atpakaļ.'
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: '`code` tāds, kādu Google nosūtīja atpakaļ (drukājams ASCII bez atstarpēm).'
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Neobligāts. `iss` tāds, kādu Google nosūtīja atpakaļ, ja nosūtīja.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`linkTicket` no `finish`, derīgs 10 minūtes.'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Konta parole.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`ssoTicket` no `finish`, derīgs 10 minūtes.'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Lietotājvārds; piemēro reģistrēšanās noteikumus.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Aktīvās sesijas, sākot ar pēdējo izmantoto.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Aktīva sesija (pierakstīta ierīce).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: Sesijas ID pieprasījumam `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: Pierakstīšanās (Unix laiks, ms).
        lastSeenAt:
          type: integer
          format: int64
          description: Pēdējā izmantošana (Unix laiks, ms), tiek atjaunināta ne biežāk kā reizi 5 minūtēs (vēlāk, kamēr serveris ir stipri atpalicis).
        expiresAt:
          type: integer
          format: int64
          description: Absolūtās beigas (Unix laiks, ms); dīkstāves ierobežojums var sesiju izbeigt ātrāk.
        clientLabel:
          type:
            - string
            - 'null'
          description: Pierakstīšanās `clientLabel` vai `null`, ja tas netika nosūtīts.
        current:
          type: boolean
          description: Vai šī ir sesija, kas veic pieprasījumu.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Pa vienam ierakstam katrā kategorijā, kurā spēlētājs ir spēlējis reitinga partijas.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Aktīvās sankcijas.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }`, kamēr konts ir apturēts, citādi `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Vienas kategorijas reitinga ieraksts.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: Kategorijas ID.
        rating:
          type: integer
          description: Reitings.
        games:
          type: integer
          minimum: 0
          description: Kategorijā nospēlētās partijas (ieskaitītas vai ne).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Augstākais sasniegtais reitings.
        provisional:
          type: boolean
          description: '`true`, kamēr reitings vēl nav noteikts vai tam ir mazāk nekā `PROVISIONAL_GAMES` ieskaitītu partiju (spēle to rāda kā `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Sankcijas veids.
        reason:
          type:
            - string
            - 'null'
          description: Norādītais iemesls, ja tāds ir.
        startsAt:
          type: integer
          format: int64
          description: Sākums (Unix laiks, ms).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Beigas (Unix laiks, ms), `null`, ja sankcija ir pastāvīga.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Apturēšanas beigas (Unix laiks, ms), `null`, ja tā ir uz visiem laikiem.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` — pieņemt tiešos izaicinājumus pēc vārda, `none` — tos noraidīt.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Pašreizējā parole.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Jaunā parole; piemēro reģistrēšanās paroles noteikumus.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Konta parole.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Gaidošās slepenās atslēgas kods, tieši 6 cipari.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Konta parole.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Neobligāts; nepieciešams, ja ir ieslēgta divu faktoru autentifikācija (vai `recoveryCode`). Autentifikācijas lietotnes kods vai atkopšanas kods.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Neobligāts. Atkopšanas kods (`xxxx-xxxx-xx`; burtu reģistrs, atstarpes un defises nav svarīgas).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Konta parole.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Autentifikācijas lietotnes kods (atkopšanas kods tiek noraidīts).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Jaunā adrese; tiek noņemtas sākuma un beigu atstarpes, tā tiek pārveidota mazajiem burtiem un pēc tam pārbaudīta tāpat kā reģistrēšanās adrese.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Konta parole.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Neobligāts; nepieciešams, ja ir ieslēgta divu faktoru autentifikācija (vai `recoveryCode`). Autentifikācijas lietotnes kods vai atkopšanas kods.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Neobligāts. Atkopšanas kods.
    TotpSetup:
      type: object
      description: Gaidošā slepenā atslēga autentifikācijas lietotnei.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Slepenā atslēga base32 formātā, ko ievadīt lietotnē.
        uri:
          type: string
          format: uri
          description: URI `otpauth://totp/...`, ko parādīt kā QR kodu.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Viena soļa ilgums sekundēs.
    RecoveryCodeList:
      type: array
      description: 10 atkopšanas kodi, kas tiek parādīti tikai šoreiz. Katrs darbojas vienu reizi.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Viena partijas puse.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Vārds partijas pierakstā (`deleted#<id>` dzēstam kontam).
        rating:
          type:
            - integer
            - 'null'
          description: Reitings sākumā, `null`, ja nav zināms.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Reitings pēc partijas. Reitinga partijai tas ir vienmēr; `null` tikai partijai, kas netiek ieskaitīta reitingos (nereitinga, ar pielāgotu laika kontroli, anulēta).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Reitinga izmaiņa, `0`, ja reitinga noteikumi atstāj reitingu nemainīgu (FIDE nulles rezultāta noteikums, pretinieks bez noteikta reitinga, spēlētāja bez noteikta reitinga pirmās partijas); `null` tāpat kā `ratingAfter`.
    GameSummary:
      type: object
      description: Saglabātas partijas kopsavilkums.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Partijas ID.
        category:
          type: string
          description: Oficiālās kategorijas ID (`3+2`) vai `custom`.
        rated:
          type: boolean
          description: Vai partija tiek ieskaitīta reitingos.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Laika kontrole sekundēs (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (skatiet partiju kodus).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Beigu iemesla kods (skatiet partiju kodus).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Rezultāts, `*` anulētai partijai.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Pusgājienu skaits.
        startedAt:
          type: integer
          format: int64
          description: Sākums (Unix laiks, ms).
        endedAt:
          type: integer
          format: int64
          description: Beigas (Unix laiks, ms).
    Termination:
      type: string
      description: Beigu iemesla nosaukums (skatiet partiju kodus); `Unknown` kodam, ko protokols nepazīst.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Partijas kopsavilkums no viena spēlētāja puses.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Spēlētāja puse.
    HistoryGameSummary:
      description: Partija no pierakstītā spēlētāja vēstures.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Pamatlaiks milisekundēs.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Pieskaitījums milisekundēs.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: Iznākums no spēlētāja viedokļa.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Lapas partijas, sākot ar jaunākajām.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: ID, kas jānodod kā `before` nākamajai lapai, vai `null` pēdējā lapā.
        total:
          type: integer
          minimum: 0
          description: Filtram atbilstošo partiju skaits visās lapās kopā.
    MoveRecord:
      type: object
      description: Viens partijas pusgājiens.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: Gājiens UCI notācijā, bandinieka pārvēršanai pievienojot `n`, `b`, `r` vai `q`.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Gājienam patērētais laiks (ms), `null`, ja pierakstā tā nav.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Gājiena izdarītāja pulksteņa laiks pēc gājiena (ms), `null`, ja pierakstā tā nav.
    PgnTagsView:
      type: object
      description: Galvenās PGN birkas attēlošanai. `Termination` šeit ir beigu iemesla nosaukums; PGN failā tiek izmantotas PGN standarta vērtības.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` vai `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: Sākuma datums pēc UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Reitings sākumā vai `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Reitings sākumā vai `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Partijas pieraksts ar gājieniem un pulksteņiem. Tam ir partijas kopsavilkuma lauki, bez `color` un `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Pamatlaiks milisekundēs.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Pieskaitījums milisekundēs.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: Lauka `status` nosaukums.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: Tās partijas ID, kuras revanšs ir šī partija, vai `null`.
            moves:
              type: array
              description: Viens ieraksts katram pusgājienam.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Tikai tad, ja marķiera spēlētājs spēlēja šo partiju; šī spēlētāja puse.
            reportable:
              type: boolean
              description: Tikai tad, ja marķiera spēlētājs spēlēja šo partiju; `true`, ja `POST /reports` tagad pieņemtu ziņojumu par pretinieku šajā partijā (partija beidzās pēdējo 7 dienu laikā, dienas kvota nav izlietota, un par pretinieku šajā partijā vēl nav ziņots).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Lietotājvārds, kā to uzrakstījis spēlētājs.
        createdAt:
          type: integer
          format: int64
          description: Kad konts tika izveidots (Unix laiks, ms).
        ratings:
          type: array
          description: Tikai oficiālās kategorijas, servera noteiktajā secībā.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Visas saglabātās partijas, ieskaitot nereitinga un anulētās partijas.
            rated:
              type: integer
              minimum: 0
              description: Reitinga partijas, summētas pa reitinga ierakstiem.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Lietotājvārds, kā to uzrakstījis spēlētājs.
        games:
          type: array
          description: Lapas partijas, sākot ar jaunākajām.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Pēdējās partijas ID, ja lapa ir pilna (nākamā lapa tad var būt tukša), citādi `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: Kategorijas ID.
        minGames:
          type: integer
          minimum: 0
          description: Ieskaitīto partiju skaits, kas ierakstam nepieciešams, lai tas tiktu iekļauts sarakstā (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Kad saraksts tika aprēķināts (Unix laiks, ms).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: PGN teksts, ne vairāk kā 65 536 UTF-8 baiti. Tiek izmantota tikai pirmā partija.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Neobligāts. Attēla izmērs.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Neobligāts. Puse, kas atrodas galdiņa apakšā.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Neobligāts. Milisekundes uz gājienu, JSON skaitlis ar veselu vērtību.
        coords:
          type: boolean
          default: true
          description: Neobligāts. Vai ap galdiņu tiek attēloti vertikāļu burti un horizontāļu numuri.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Partija kā vesels skaitlis vai virkne no 1 līdz 16 cipariem.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Pretinieka lietotājvārds, kā partijas pierakstā vai kā tas ir tagad, neatkarīgi no burtu reģistra. Tas nedrīkst būt tukšs.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Par ko ir ziņojums.
        comment:
          type:
            - string
            - 'null'
          description: Neobligāts. Ne vairāk kā 500 rakstzīmes pēc tam, kad ir noņemtas vadības rakstzīmes (izņemot tabulēšanas un jaunas rindas rakstzīmi) un tekstam noņemtas sākuma un beigu atstarpes.
    AccountExport:
      type: object
      description: Viss, ko serveris glabā par kontu (laiki — Unix laiks, ms).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Kad eksports tika izveidots.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Ko fails satur un ko neiekļauj, vienkāršā angļu valodā spēlētājam.
          items:
            type: string
        account:
          description: Konta skats no `GET /account/me` ar `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Saistītā Google konta adrese vai `null`.
        ratings:
          type: array
          description: Pilnie reitinga ieraksti.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Reitinga punkti, kas atdoti atpakaļ pēc tam, kad pretinieks tika atzīts par krāpnieku, summēti pa UTC dienām un kategorijām, sākot ar jaunākajiem. Netiek nosauktas ne partijas, ne krāpnieki.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Visas saglabātās sesijas, sākot ar jaunākajām, bez neviena marķiera. Glabāšanas termiņa tīrīšana dzēš novecojušu sesiju, bet izrakstītu sesiju — dienu pēc izrakstīšanās.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Drošības notikumi, sākot ar jaunākajiem; tiek glabāti `RETENTION_SECURITY_DAYS` dienas.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Visas sankcijas, ieskaitot atceltās. Moderatora vārds nekad netiek iekļauts.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Uzvedības notikumi, kas reģistrēti spēlētāja pamestajās un anulētajās partijās un partijās, kurās pirmais gājiens netika izdarīts laikā; tiek glabāti 30 dienas.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Spēlētāja iesniegtie ziņojumi.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Partiju skaits.
            list:
              type: array
              description: Visas partijas, sākot ar jaunākajām, kā `GET /account/games` kopsavilkumi. Gājieni ir pieejami `GET /games/{id}`, bet PGN — `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Pilns reitinga ieraksts.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Vai spēlētājs ir pametis fāzi, kurā reitings vēl nav noteikts.
            countedGames:
              type: integer
              minimum: 0
              description: Partijas, kas ieskaitītas reitingā.
            updatedAt:
              type: integer
              format: int64
              description: Kad ieraksts pēdējo reizi mainījās.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: Dienas 00:00 UTC (Unix laiks, ms).
        category:
          type: string
        points:
          type: integer
          description: Tajā dienā šajā kategorijā atdotie punkti.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Kad sesija tika izrakstīta, vai `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Pierakstīšanās adrese, tiek izdzēsta pēc `RETENTION_IP_DAYS` dienām.
    SecurityEvent:
      type: object
      description: |-
        Drošības notikums. `ip` tiek norādīts tikai darbībām, kas veiktas pierakstītā sesijā, ar konta paroli (un otro faktoru) vai ar saiti, kas nosūtīta uz konta adresi: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` un `account_exported`; visiem pārējiem veidiem ir `ip: null`, un `ip` tiek izdzēsts pēc `RETENTION_IP_DAYS` dienām.

        `detail` saglabā tikai šos laukus: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` un `method` (`password` vai `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` un `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Notikums `moderator_action` saglabā tikai `{ action }` darbībām `ban`, `unban`, `reset_mfa`, `verify_email` un `revoke_sessions` (pārējās moderatoru darbības netiek iekļautas). Visiem pārējiem veidiem ir `detail: null`. Notikumi `rating_refund` netiek iekļauti: to punkti ir laukā `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Notikuma veids (`login`, `password_changed`...).
        at:
          type: integer
          format: int64
          description: Kad tas notika.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: Spēlētāja, par kuru ziņots, pašreizējais publiskais vārds.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Vai ziņojums joprojām ir atvērts (vai spēlētājam, par kuru ziņots, tika piemērota sankcija, netiek atklāts).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: E-pasta saites marķieris (lapas veidlapas slēptais lauks).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Atiestatīšanas saites marķieris (veidlapas slēptais lauks).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Jaunā parole; piemēro reģistrēšanās paroles noteikumus.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Jaunā parole vēlreiz; tai jābūt tādai pašai.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: HTML lapa UTF-8 kodējumā (`text/html; charset=utf-8`) bez JavaScript un ārējiem resursiem.
