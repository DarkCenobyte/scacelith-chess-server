      Servera darbspēja un gatavība uzraudzībai. Šie galapunkti atbild API portā pirms autentifikācijas un visiem galapunktu ierobežojumiem, taču, tāpat kā jebkurš pieprasījums, paņem vienu adrešu slāņa žetonu; uzraudzības resursdatoru var norādīt `ABUSE_EXEMPT`. Katram galapunktam darbojas abi ceļi: servera saknē un zem `/api/v1`.

