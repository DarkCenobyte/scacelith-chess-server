        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (datubāze palika bloķēta; `retryAfter: 1` pamattekstā, bez galvenes `Retry-After`), `server_busy` (sesijas uzmeklēšanas laikā datubāze bija bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Lejupielādēt partiju kā PGN failu
      description: |-
        Tā pati partija kā PGN fails: viena partija ar rindu beigām `\n` un gājienu tekstu rindās, kas īsākas par 80 kolonnām. Atbilde ir tāda pati ar marķieri un bez tā.

        Birkas šādā secībā: `Event` (`<SERVER_NAME> rated <category>` vai `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (sākuma datums pēc UTC), `Round`, `White`, `Black`, `Result` (`*` anulētai partijai), `UTCDate` un `UTCTime` (sākums), `WhiteElo` un `BlackElo` (reitingi sākumā vai `-`), `WhiteRatingDiff` un `BlackRatingDiff` (izmaiņas, piemēram, `+10` un `-10`, katrā reitinga partijā, `+0`, ja reitinga noteikumi atstāj reitingu nemainīgu; nereitinga partijai, partijai ar pielāgotu laika kontroli un anulētai partijai nav neviena no tām), `TimeControl` (sekundēs), `Termination` (PGN standarta vērtība: `normal`; `time forfeit` — karodziņa nokrišana, arī tad, ja partija beidzas neizšķirti; `abandoned`; `rules infraction` — otrais neatļautais gājiens vai tehniskais zaudējums par godīgas spēles pārkāpumu; `unterminated` — anulēta partija), `PlyCount`, `ScacelithGameId` (decimālais ID).

        Katram gājienam ir `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: gājiena izdarītāja pulksteņa laiks pēc gājiena un gājienam patērētais laiks, sekundes desmitdaļās (noapaļots uz leju). Vērtība tiek izlaista, ja pierakstā tās nav. Pēc pēdējā gājiena seko beigu iemesls vārdos, pēc tam rezultāts.

        **Ierobežojums:** `public_read` (ar marķieri — katram spēlētājam, bez tā — katram klientam).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: PGN fails.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'PGN teksts UTF-8 kodējumā (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: nav pozitīvs vesels skaitlis ar ne vairāk kā 16 cipariem (mazāks par 2^53); `invalid_request`: nederīgs URL kodējums.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: tika nosūtīts marķieris, un tas nav derīgs.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: šādas partijas nav.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `public_read` vai konta budžets.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: cita starpā, ja saglabātos gājienus nevar izspēlēt no jauna līdz saglabātajām beigām (serveris to reģistrē žurnālā).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (datubāze palika bloķēta; `retryAfter: 1` pamattekstā, bez galvenes `Retry-After`), `server_busy` (sesijas uzmeklēšanas laikā datubāze bija bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Lejupielādēt šī servera partiju kā animētu GIF
      description: |-
        Partija kā animēts GIF. Vārdi un reitingi ir no partijas pieraksta (reitingi sākumā, dzēsts konts kā `deleted#<id>`), tāpat arī rezultāts un beigas (`Resignation`, `Loss on time`...).

        Pārbaudes notiek šādā secībā: `gif_disabled`, attēla opcijas (`size`, `orientation`, `delay`, `coords`), partijas ID, partija, tās garums.

        **Nepieciešama sesija:** kvotas tiek skaitītas katram kontam. **Ierobežojumi:** `gif` katram pieprasījumam; `gif_user_min`, `gif_user_hour`, `gif_ip_min` un `gif_ip_hour` tikai tad, kad GIF ir jāizveido (skatiet sadaļas aprakstu). **Laika ierobežojums:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 sekundes (pēc noklusējuma 45 sekundes).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 'Attēla izmērs: `small` (32 px lauciņi), `medium` (48 px) vai `large` (72 px).'
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Puse, kas atrodas galdiņa apakšā.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Milisekundes uz gājienu (no 1 līdz 6 decimālcipariem).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Vai ap galdiņu tiek attēloti vertikāļu burti un horizontāļu numuri (`1`) vai ne (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` ar `field` (`size`, `orientation`, `delay` vai `coords`): vērtība nav starp atļautajām. `invalid_game_id`. `invalid_request`: nederīgs URL kodējums.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: šādas partijas nav. `gif_disabled`: serveris ir izslēdzis GIF (`GIF_ENABLED=false`; ierobežojuma `gif` žetons tiek atdots atpakaļ).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `gif`, renderēšanas ierobežojums vai konta budžets.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF nevarēja izveidot (iemeslu serveris reģistrē žurnālā). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` ar `retryAfter` (no 3 līdz 10 sekundēm) un `Retry-After`: renderēšanas rinda ir pilna, vai GIF gaidīja brīvu pavedienu `GIF_QUEUE_TIMEOUT_MS` (10 sekundes); visi ierobežojumu žetoni, ko pieprasījums paņēma, tiek atdoti atpakaļ. `busy`: datubāze palika bloķēta (`retryAfter: 1` tikai pamattekstā). `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Izveidot animētu GIF no jebkuras partijas, kas nosūtīta kā PGN
      description: |-
        Tāds pats attēls kā `GET /games/{id}/gif` jebkurai partijai, kas nosūtīta kā PGN teksts: spēles saglabātai partijai, citas vietnes eksportam, ar roku ierakstītai partijai. Tiek izmantota tikai teksta pirmā partija.

        - PGN lasītājs pieņem to pašu, ko pieņem spēles lasītājs: katru PGN, ko raksta šis serveris, un citu vietņu ierastos eksportus (komentāri, varianti, NAG un pulksteņa anotācijas tiek izlaisti; gājienu numuri un SAN tiek lasīti iecietīgi; birka `FEN` nosaka sākuma pozīciju, ja vien `SetUp` nav `"0"`).
        - Vārdi un reitingi tiek ņemti no birkām `White`, `Black`, `WhiteElo` un `BlackElo`. Burtiem tiek noņemtas diakritiskās zīmes, citas rakstzīmes ārpus drukājamā ASCII kļūst par `?`, un gari vārdi tiek saīsināti (48 rakstzīmes). Rezultāts tiek ņemts no birkas `Result`, citādi no gājienu teksta beigām. Birka `Termination` tiek parādīta, ja vien tā nav `normal`: tad par notikušo liecina beigu pozīcija (mats, pats).
        - Šis galapunkts pats pārbauda savu pamattekstu: uz nezināmu lauku vai uz `pgn`, kas trūkst vai nav virkne, tas atbild ar 400 `invalid_request` ar `field`; uz nepareizu opciju — ar 400 `invalid_option` (`delayMs` ir jābūt JSON skaitlim, `coords` — Būla vērtībai; `null` tiek noraidīts).

        **Nepieciešama sesija:** kvotas tiek skaitītas katram kontam. **Ierobežojumi:** kā `GET /games/{id}/gif`. **Pamatteksta ierobežojums:** 135 168 baiti neatkarīgi no `HTTP_BODY_LIMIT` (PGN kā JSON virkne, ieskaitot tās atsoļa secības). **Laika ierobežojums:** pēc noklusējuma 45 sekundes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Īsa ierakstīta partija bez koordinātām
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: PGN fails ar visām opcijām
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` ar `field` (nezināms lauks vai `pgn` trūkst vai nav virkne; bez `field`, ja pamatteksts nav objekts); `invalid_json`; `invalid_option` ar `field` (`size`, `orientation`, `delayMs` vai `coords`); `invalid_pgn` ar `line` un `column` (no 1, kolonnas rakstzīmēs) un lasītāja `message`: neatļauts vai neviennozīmīgs gājiens, bojāta birka, nezināms šaha paveids, vairāk nekā 65 536 baiti.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: serveris ir izslēdzis GIF (`GIF_ENABLED=false`; ierobežojuma `gif` žetons tiek atdots atpakaļ).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: pamatteksts, kas lielāks par 135 168 baitiem.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `gif`, renderēšanas ierobežojums vai konta budžets.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF nevarēja izveidot (iemeslu serveris reģistrē žurnālā). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` ar `retryAfter` (no 3 līdz 10 sekundēm) un `Retry-After`: renderēšanas rinda ir pilna, vai GIF pārāk ilgi gaidīja brīvu pavedienu; visi ierobežojumu žetoni, ko pieprasījums paņēma, tiek atdoti atpakaļ. `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /players/{username}:
    get:
      operationId: getPlayer
      tags:
        - players
      summary: Iegūt spēlētāja publisko profilu
      description: |-
        Spēlētāja publiskais profils: reitingi oficiālajās kategorijās (servera noteiktajā secībā) un partiju skaits. `games.total` skaita visas saglabātās partijas, ieskaitot nereitinga un anulētās partijas; `games.rated`, `wins`, `draws` un `losses` tiek summēti pa reitinga ierakstiem, tātad ietver tikai reitinga partijas. Atbilde ir tāda pati ar marķieri un bez tā.

        **Ierobežojums:** `public_read` (ar marķieri — katram spēlētājam, bez tā — katram klientam).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Profils.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
              example:
                username: alice
                createdAt: 1790882839743
                ratings:
                  - category: '3+2'
                    rating: 1510
                    provisional: true
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                games:
                  total: 3
                  rated: 2
                  wins: 1
                  draws: 1
                  losses: 0
        '400':
