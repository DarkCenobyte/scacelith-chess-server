        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `sessions` vai konta budžets.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (datubāze palika bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Nosūtīt apstiprinājuma saiti vēlreiz
      description: |-
        Vēlreiz nosūta e-pasta apstiprinājuma saiti. Atbilde ir 202 `accepted` neatkarīgi no adreses, lai tā nekad neatklātu, vai adresi izmanto kāds konts vai reģistrēšanās.

        Pieprasījums iedarbojas ne biežāk kā reizi 5 minūtēs katrai adresei. Gaidoša reģistrēšanās ar šo adresi atkal saņem savas 24 stundas neatkarīgi no tā, vai adresi izmanto cits konts, lai tās lietotājvārds abos gadījumos paliktu rezervēts tikpat ilgi. Saite tiek nosūtīta tikai par šo reģistrēšanos, ja adresei nav konta (jauna saite, derīga 24 stundas, aizstāj iepriekšējo), vai par aktīvu, neapstiprinātu kontu ar šo adresi.

        **Ierobežojumi:** `auth`, pēc tam `auth_mail` (10 stundā katram klientam).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Pieņemts (neatkarīgi no adreses).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `auth` vai `auth_mail` (neatkarīgi no adreses).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` ar `retryAfter: 1`: datubāze palika bloķēta, kamēr tika uzmeklēts konts vai saglabāta neapstiprināta konta saite (gaidošas reģistrēšanās atjaunošana tiek veikta pēc iespējas un nekad neizraisa pieprasījuma kļūmi); adreses 5 minūtes tik un tā sākas, tāpēc jauns pieprasījums šajā laikā neko nedara. `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Nosūtīt paroles atiestatīšanas saiti
      description: |-
        Nosūta paroles atiestatīšanas saiti, kas derīga vienu stundu un atver lapu `/reset-password`. Atbilde ir 202 `accepted` neatkarīgi no adreses. Saite tiek nosūtīta tikai aktīvam kontam, ne biežāk kā reizi 5 minūtēs katrai adresei. Konts, kas izmanto tikai Google, šādi iestata savu pirmo paroli.

        Paroles atkopšanai ir visstingrākie API ierobežojumi, un tos visus skaita visam serverim kopumā: 3 pieprasījumi stundā (`AUTH_FORGOT_PER_HOUR`) un 10 pieprasījumi 24 stundās (`AUTH_FORGOT_PER_DAY`) katram klientam (IPv4 adresei vai IPv6 /64), 3 reizes vairāk katram IPv6 /48, papildus ierobežojumam `auth` (20 pieprasījumi 10 minūtēs) un vienai e-pasta vēstulei uz adresi ik pēc 5 minūtēm. Ne 202, ne 429 neatklāj, vai adresi izmanto kāds konts. Jaunās paroles iestatīšanai ir savs ierobežojums (`auth_reset`).

        **Ierobežojumi:** `auth`, `auth_forgot`, pēc tam `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Pieņemts (neatkarīgi no adreses).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `auth`, `auth_forgot` vai `auth_forgot_day` (neatkarīgi no adreses).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` ar `retryAfter: 1`: datubāze palika bloķēta, kamēr tika uzmeklēts konts vai saglabāta saite; adreses 5 minūtes tik un tā sākas, tāpēc jauns pieprasījums šajā laikā saiti nenosūta. `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Iestatīt jaunu paroli ar atiestatīšanas saites marķieri
      description: |-
        Iestata jaunu paroli ar atiestatīšanas saites marķieri (lapa `/reset-password` dara to pašu). Jaunajai parolei ir spēkā reģistrēšanās noteikumi.

        Atiestatīšanai ir šādas sekas vienā transakcijā (visas vai neviena): tā atsauc visas sesijas un atceļ gaidošu e-pasta maiņu; pārējās konta atiestatīšanas saites pārstāj darboties; adrese tiek uzskatīta par apstiprinātu (saite to pierādīja); īpašnieks saņem e-pasta vēstuli. Divu faktoru autentifikācija netiek skarta. Pēc paroļu jaukšanas rindas kļūdas, 503 vai 500 nekas nav mainījies: vecā parole un sesijas paliek, un saite paliek derīga.

        **Ierobežojumi:** `auth`, pēc tam `auth_reset` (10 stundā katram klientam, 30 katram IPv6 /48, kopīgs ar lapu: katrs mēģinājums aprēķina paroles jaucējvērtību).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Parole ir nomainīta, un visas sesijas ir izrakstītas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: saite ir nederīga, izmantota vai novecojusi, vai arī tika nosūtīta uz adresi, kas kontam vairs nepieder. `weak_password` (ar `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `auth` vai `auth_reset`, vai paroļu jaukšanas rinda.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: paroļu jaukšanas rinda vai datubāze palika bloķēta (`retryAfter: 1`, nekas nav mainījies). `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Sākt pierakstīšanos ar Google
      description: |-
        Sāk pierakstīšanās ar Google mēģinājumu PKCE izaicinājumam un spēles klausītāja portam adresē `127.0.0.1`. Atbilde sniedz Google URL, kas jāatver sistēmas pārlūkā, un mēģinājuma `state`; mēģinājums ir derīgs 10 minūtes.

        `authUrl` satur `client_id`, `redirect_uri` (veidots no `redirectPort` un servera izcelsmes birkas), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (servera paša Google verificētāja S256) ar `code_challenge_method=S256` un `prompt=select_account`. Spēle to pārbauda, pirms to atver (skatiet sadaļas aprakstu).

        **Ierobežojums:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Mēģinājums.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: šajā serverī pierakstīšanās ar Google netiek piedāvāta.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (datubāze palika bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Sākt pierakstīšanos ar Google tīmekļa vietnē
      description: |-
        Sāk tīmekļa vietnes pierakstīšanās ar Google mēģinājumu tās lapas PKCE izaicinājumam. Atbilde ir tāda pati kā spēlei: Google URL, uz kuru jāpāriet, un mēģinājuma `state`; mēģinājums ir derīgs 10 minūtes. Pieejams, ja `GET /info` norāda `sso.googleWeb: true`.

        `authUrl` satur vietnes `client_id` un `redirect_uri=GOOGLE_WEB_REDIRECT_URI`, un pārējie parametri ir tādi paši kā spēlei. Lapa to pārbauda, pirms pāriet uz to (skatiet **Tīmekļa vietnē** sadaļas aprakstā).

        **Ierobežojums:** `sso_start`, kopīgs ar spēles sākumu.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: Mēģinājums.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: trūkst `codeChallenge` vai tas ir nepareizi veidots, vai ir norādīts jebkurš cits lauks (arī `redirectPort`).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: šajā serverī pierakstīšanās ar Google netiek piedāvāta vai netiek piedāvāta tīmekļa vietnēm.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `sso_start` (kopīgs ar spēles sākumu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (datubāze palika bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Nodot Google atbildi serverim
      description: |-
        Nodod serverim `code` un `state`, ko Google nosūtīja spēles klausītājam vai vietnes lapai, kopā ar mēģinājuma ID un PKCE verificētāju. Mēģinājuma ID bez verificētāja ir bezjēdzīgs, un kods ir bezjēdzīgs bez servera paša PKCE verificētāja un klienta noslēpuma.

        Serveris pārbauda mēģinājumu (nezināms, izmantots vai novecojis: 410), pēc tam verificētāju (nepareizs verificētājs atstāj mēģinājumu izmantojamu), tad vienreiz izmanto mēģinājumu, pārbauda `state` un `iss`, apmaina kodu ar Google un pārbauda ID marķieri. Atbilde (200) ir viena no šīm:

        - `{ token, expiresAt, user }`: pierakstīšanās saistītajā kontā izdevās;
        - `{ mfaRequired, mfaToken, expiresIn }`: turpiniet ar `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: jauns konts; 10 minūšu laikā turpiniet ar `POST /auth/sso/complete`. `suggestedUsername` tiek veidots no Google vārda vai adreses un ir `""`, ja nekas neder;
        - `{ needsPassword, linkTicket, username, expiresIn }`: kontam ar šo adresi ir parole; turpiniet ar `POST /auth/sso/google/link`. Pagaidām nekas nav saistīts.

        **Ierobežojums:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Sesija, otrais solis vai pirmās pierakstīšanās ar Google nākamais solis.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Pierakstīšanās saistītajā kontā izdevās
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Divu faktoru autentifikācija ir ieslēgta
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Jauns spēlētājs
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Adresi izmanto konts ar paroli
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: verificētājs neatbilst mēģinājuma izaicinājumam (mēģinājums paliek izmantojams). `sso_email_unverified`: Google nav apstiprinājis adresi. `registration_closed`. `account_disabled`. Tikai saistītam kontam: `banned` (ar `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: šajā serverī pierakstīšanās ar Google netiek piedāvāta.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: adresi izmanto aktīvs konts bez paroles (tas netiek nosaukts).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: nezināms, izmantots vai novecojis mēģinājums.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (datubāze palika bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Saistīt Google ar esošu kontu, izmantojot tā paroli
      description: |-
        Pēc tam, kad `finish` atbildēja ar `needsPassword`: saista Google ar esošo kontu, izmantojot šī konta paroli, kas ievadīta spēlē. Atbilde (200) ir sesija (saistījums ir saglabāts, un spēlētājs ir pierakstījies) vai, ja ir ieslēgta divu faktoru autentifikācija, `{ mfaRequired, mfaToken, expiresIn }`: turpiniet ar `POST /auth/login/mfa`, un saistījums tiek saglabāts tikai tad, ja tur tiek pieņemts kods.

        Nepareiza parole atstāj biļeti izmantojamu, kopā 5 mēģinājumiem. Mēģinājums tiek ieskaitīts tieši pirms paroles pārbaudes: 429 `too_many_attempts` vai 428 `pow_required` neieskaita nevienu, bet paroļu jaukšanas rindas atteikums (503 `server_busy`, 429 `rate_limited`) vienu jau ir ieskaitījis, un tas skaitās kā konta neveiksme. Neveiksmju aizturei tiek izmantots tas pats skaitītājs, kas `POST /auth/login`.

        **Ierobežojums:** `auth` (ar tā IPv6 /48 skaitīšanu). **Darba apliecinājums:** tāpat kā `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Sesija vai pierakstīšanās otrais solis.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: nepareiza parole; biļete saglabājas, kopā 5 mēģinājumiem.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (ar `until`), tikai pēc pareizas paroles.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: šajā serverī pierakstīšanās ar Google netiek piedāvāta.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: Google konts pa to laiku tika saistīts ar citu kontu.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: biļete ir nezināma, jau izmantota vai novecojusi; 5. nepareizā parole; konts, kura statuss vai adrese mainījās kopš `finish`; vai konts, kura statuss, adrese, parole vai divu faktoru autentifikācija mainījās, kamēr tika saglabāta sasaiste. Sāciet pierakstīšanos no jauna.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (konta neveiksmju aizture) vai `rate_limited` (ierobežojums `auth`, paroļu jaukšanas rinda).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: paroļu jaukšanas rinda vai datubāze palika bloķēta (`retryAfter: 1`, nekas netika sasaistīts). `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Izveidot kontu pirmajā pierakstīšanās reizē ar Google
      description: |-
        Pēc tam, kad `finish` atbildēja ar `needsUsername`: izveido kontu ar izvēlēto lietotājvārdu (piemēro reģistrēšanās noteikumus), un tajā tiek veikta pierakstīšanās. Kontam nav paroles: `hasPassword` ir `false`, un ar „Aizmirsāt paroli?” (`POST /auth/password/forgot`) tam var iestatīt paroli.

        **Ierobežojums:** `auth` (ar tā IPv6 /48 uzskaiti).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Konts ir izveidots, un tajā ir veikta pierakstīšanās.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: šajā serverī pierakstīšanās ar Google netiek piedāvāta.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (lietotājvārds pieder kādam kontam, vai to aizņem citas adreses gaidoša reģistrēšanās), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: biļete ir nezināma, jau izmantota vai novecojusi.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (datubāze palika bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Uzskaitīt pierakstītās ierīces
      description: |-
        Konta aktīvās sesijas (pierakstītās ierīces), sākot ar pēdējo izmantoto. `current` apzīmē sesiju, kas veic pieprasījumu. `lastSeenAt` tiek atjaunināts ne biežāk kā reizi 5 minūtēs (vēlāk, kamēr serveris ir stipri atpalicis); `expiresAt` ir absolūtās beigas, un dīkstāves ierobežojums var sesiju izbeigt ātrāk.

        **Ierobežojums:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aktīvās sesijas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `sessions` vai konta budžets.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (datubāze palika bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Izrakstīt vienu ierīci
      description: |-
        Izraksta vienu konta sesiju; izrakstīt var arī pašreizējo. Ar to atvērtais WebSocket tiek aizvērts. Bez pamatteksta (vai `{}`).

        **Ierobežojums:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Sesija ir izrakstīta.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: pamatteksts, kas nav `{}`, vai `id`, kas nav derīgā URL kodējumā; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: šim kontam nav aktīvas sesijas ar šādu ID.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `sessions` vai konta budžets.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (datubāze palika bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Iegūt kontu, tā reitingus un aktīvās sankcijas
      description: |-
        Konts, kā to redz tā spēlētājs: konta skats (arī katras pierakstīšanās atbildes `user`), pa vienam reitinga ierakstam katrā kategorijā, kurā spēlētājs ir spēlējis reitinga partijas, aktīvās sankcijas un konta apturēšana. Pretkrāpšanas sistēmas godīguma līmenis nekad netiek rādīts.

        **Ierobežojums:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Konts.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized` vai `invalid_token` (arī tad, ja konts ir dzēsts).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `account` vai konta budžets.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (datubāze palika bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Pieņemt vai noraidīt tiešos izaicinājumus
      description: |-
        Nosaka, vai citi spēlētāji var izaicināt šo spēlētāju pēc vārda. Ar `none` tiešie izaicinājumi tiek noraidīti: izaicinātājam tiek paziņots, ka spēlētājs nav pieejams. Bez atkārtotas autentifikācijas.

        **Ierobežojums:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: Pašlaik spēkā esošās preferences.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ierobežojums `account` vai konta budžets.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (datubāze palika bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Mainīt paroli
      description: |-
        Maina paroli. Nepieciešama pašreizējā parole, bet ne otrais faktors, pat ja ir ieslēgta divu faktoru autentifikācija. Jaunajai parolei piemēro reģistrēšanās noteikumus (tos pārbauda pēc pašreizējās paroles).

        Maiņai ir šādas sekas, vienā transakcijā (visas vai neviena): tā atsauc visas pārējās sesijas (šī paliek pierakstīta), atceļ gaidošu e-pasta maiņu, padara konta paroles atiestatīšanas saites nederīgas un nosūta īpašniekam e-pasta vēstuli.

        **Atkārtota autentifikācija:** tikai parole. **Ierobežojumi:** `reauth`, pēc tam `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Parole ir nomainīta.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (konts, kurā pierakstās tikai ar Google), `weak_password` (ar `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: nepareiza pašreizējā parole, vai arī paroles atiestatīšana vai maiņa notika, kamēr pieprasījums tika pārbaudīts.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (konta neveiksmīgās atkārtotās autentifikācijas) vai `rate_limited` (ierobežojums `reauth` vai `reauth_user`, konta budžets, paroļu jaukšanas rinda).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: paroļu jaukšanas rinda vai datubāze palika bloķēta (`retryAfter: 1`, nekas netika mainīts). `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Sākt divu faktoru autentifikācijas ieslēgšanu
      description: |-
        Saglabā jaunu gaidošu autentifikācijas lietotnes slepeno atslēgu, kas aizstāj jebkuru iepriekšējo gaidošo, un atgriež to autentifikācijas lietotnei (kā tekstu un kā `otpauth://` URI, ko parādīt kā QR kodu). Divu faktoru autentifikācija vēl nav ieslēgta: `POST /account/mfa/totp/enable` to ieslēdz ar šīs slepenās atslēgas kodu.

        **Atkārtota autentifikācija:** tikai parole. **Ierobežojumi:** `reauth`, pēc tam `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Gaidošā slepenā atslēga.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (konts, kurā pierakstās tikai ar Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (pārbauda pirms paroles).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (konta neveiksmīgās atkārtotās autentifikācijas) vai `rate_limited` (ierobežojums `reauth` vai `reauth_user`, konta budžets, paroļu jaukšanas rinda).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (paroļu jaukšanas rinda vai datubāze palika bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Pabeigt divu faktoru autentifikācijas ieslēgšanu un saņemt atkopšanas kodus
      description: |-
        Ieslēdz divu faktoru autentifikāciju ar gaidošās slepenās atslēgas kodu (tieši 6 cipari). Parole šeit netiek prasīta; tā tika norādīta iestatīšanas laikā. Atbildē ir 10 atkopšanas kodu, kas tiek parādīti tikai šoreiz.

        **Ierobežojumi:** `reauth`, pēc tam `reauth_user`; nepareizs kods tiek ieskaitīts konta atkārtotās autentifikācijas neveiksmēs.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Divu faktoru autentifikācija ir ieslēgta.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` nav tieši 6 cipari, vai pamatteksts neatbilst shēmai; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: nepareizs kods (pārbaudiet ierīces laiku).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: nav gaidošas slepenās atslēgas (vispirms izsauciet `POST /account/mfa/totp/setup`).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (konta neveiksmīgās atkārtotās autentifikācijas) vai `rate_limited` (ierobežojums `reauth` vai `reauth_user`, konta budžets).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (datubāze palika bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: Izslēgt divu faktoru autentifikāciju
      description: |-
        Izslēdz divu faktoru autentifikāciju. Slepenā atslēga un atkopšanas kodi tiek dzēsti, un īpašnieks saņem e-pasta vēstuli.

        **Atkārtota autentifikācija:** parole un autentifikācijas lietotnes kods vai atkopšanas kods (nepieciešams viens no `code` vai `recoveryCode`). **Ierobežojumi:** `reauth`, pēc tam `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Divu faktoru autentifikācija ir izslēgta.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (konts, kurā pierakstās tikai ar Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required` (nav ne `code`, ne `recoveryCode`; pārbauda pirms paroles), `invalid_password`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neveiksmīgas atkārtotās autentifikācijas vai šajā kontā izmēģināts pārāk daudz kodu) vai `rate_limited` (ierobežojums `reauth` vai `reauth_user`, konta budžets, paroļu jaukšanas rinda).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (paroļu jaukšanas rinda vai datubāze palika bloķēta), `timeout`. Arī `server_busy` ar `retryAfter` no 2 līdz 5, ja serveris ir stipri atpalicis (skatiet ievadu): pieprasījums netika izpildīts.'
  /account/mfa/recovery-codes:
