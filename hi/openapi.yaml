  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: हाल की किसी बाज़ी के प्रतिद्वंद्वी की शिकायत करें
      description: |-
        खिलाड़ी की अपनी उन बाज़ियों में से किसी एक के प्रतिद्वंद्वी की शिकायत करता है जो पिछले 7 दिनों में ख़त्म हुई हों। कोई शिकायत अपने आप में कभी रेटिंग, दंड या इंटीग्रिटी लेवल नहीं बदलती। वह मॉडरेटरों को दिखने वाली समीक्षा प्राथमिकता बढ़ाती है, और `abuse` को छोड़कर, बाज़ी के इंजन विश्लेषण का अनुरोध करती है।

        उसी बाज़ी के लिए उसी प्रतिद्वंद्वी की शिकायत को वही जवाब मिलता है और उससे कुछ नहीं बदलता; जवाब शिकायत किए गए खाते के बारे में कभी कुछ नहीं बताता। `GET /games/{id}` बाज़ी के खिलाड़ियों को पहले से बता देता है कि शिकायत ली जाएगी या नहीं (`reportable`)।

        यह एंडपॉइंट अपनी बॉडी ख़ुद जाँचता है, इस क्रम में: `gameId`, `reported`, `category`, `comment`; विफलता पर जवाब `field` के बिना 400 `invalid_request` होता है। जिन फ़ील्ड को यह नहीं जानता, उन्हें अनदेखा किया जाता है।

        **लिमिट:** `reports` (प्रति खिलाड़ी), फिर प्रति खिलाड़ी 24 घंटे में `REPORTS_PER_DAY` (5) शिकायतें (429 `report_limit`)।
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: शिकायत मिल गई है (या पहले ही दर्ज की जा चुकी थी)।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (`field` के बिना), `invalid_json`।'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: पिछले 7 दिनों में ख़त्म हुई किसी बाज़ी में शिकायत करने वाले का प्रतिद्वंद्वी नहीं है।'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, `Retry-After` हेडर के साथ): पिछले 24 घंटों में `REPORTS_PER_DAY` शिकायतें। `rate_limited`: `reports` लिमिट या खाते का बजट।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (सेशन की जाँच में डेटाबेस लॉक मिला), `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
