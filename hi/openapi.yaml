        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (डेटाबेस लॉक रहा), `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: एक डिवाइस को साइन आउट करें
      description: |-
        खाते के एक सेशन को साइन आउट करता है; मौजूदा सेशन को भी साइन आउट किया जा सकता है। उस सेशन से खोला गया WebSocket बंद कर दिया जाता है। कोई बॉडी नहीं (या `{}`)।

        **लिमिट:** `sessions`।
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: सेशन साइन आउट हो गया है।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `{}` के अलावा कोई और बॉडी, या ऐसा `id` जो मान्य URL एन्कोडिंग नहीं है; `invalid_json`।'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: इस खाते पर इस आईडी वाला कोई सक्रिय सेशन नहीं है।'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `sessions` लिमिट या खाते का बजट।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (डेटाबेस लॉक रहा), `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: खाता, उसकी रेटिंग और सक्रिय दंड पाएँ
      description: |-
        खाता, जैसा उसका खिलाड़ी उसे देखता है: खाते का व्यू (हर साइन-इन जवाब का `user` भी यही है), हर उस श्रेणी का एक रेटिंग रिकॉर्ड जिसमें खिलाड़ी ने रेटेड बाज़ियाँ खेली हैं, सक्रिय दंड और निलंबन। एंटी-चीट का इंटीग्रिटी लेवल कभी नहीं दिखाया जाता।

        **लिमिट:** `account`।
      security:
        - bearerAuth: []
      responses:
        '200':
          description: खाता।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`, या `invalid_token` (खाता हटा दिए जाने पर भी)।'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `account` लिमिट या खाते का बजट।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (डेटाबेस लॉक रहा), `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: सीधी चुनौतियाँ स्वीकार या अस्वीकार करें
      description: |-
        तय करता है कि दूसरे खिलाड़ी इस खिलाड़ी को नाम से चुनौती दे सकते हैं या नहीं। `none` होने पर सीधी चुनौतियाँ अस्वीकार कर दी जाती हैं: चुनौती देने वाले को बताया जाता है कि खिलाड़ी उपलब्ध नहीं है। कोई री-ऑथेंटिकेशन नहीं।

        **लिमिट:** `account`।
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: अब लागू वरीयताएँ।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `account` लिमिट या खाते का बजट।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (डेटाबेस लॉक रहा), `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: पासवर्ड बदलें
      description: |-
        पासवर्ड बदलता है। मौजूदा पासवर्ड ज़रूरी है, पर दूसरा फ़ैक्टर नहीं, दो-चरणीय सत्यापन चालू होने पर भी नहीं। नया पासवर्ड रजिस्ट्रेशन के नियमों का पालन करता है (मौजूदा पासवर्ड के बाद जाँचा जाता है)।

        इस बदलाव के ये असर होते हैं, एक ही ट्रांज़ैक्शन में (या तो सभी, या कोई नहीं): यह बाक़ी सभी सेशन निरस्त करता है (यह सेशन साइन इन रहता है), लंबित ईमेल बदलाव रद्द करता है, खाते के पासवर्ड रीसेट लिंक बेकार कर देता है, और खाते के मालिक को ईमेल भेजता है।

        **री-ऑथेंटिकेशन:** केवल पासवर्ड। **लिमिट:** `reauth`, फिर `reauth_user`।
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: पासवर्ड बदल दिया गया है।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (केवल Google वाला खाता), `weak_password` (`reason` के साथ), `invalid_request`, `invalid_json`।'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: ग़लत मौजूदा पासवर्ड, या ऐसा पासवर्ड रीसेट या बदलाव जो अनुरोध की जाँच के दौरान हो गया।'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (खाते के विफल री-ऑथेंटिकेशन), या `rate_limited` (`reauth` या `reauth_user` लिमिट, खाते का बजट, पासवर्ड हैश कतार)।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: पासवर्ड हैश कतार, या डेटाबेस लॉक रहा (`retryAfter: 1`, कुछ नहीं बदला)। `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: दो-चरणीय सत्यापन चालू करना शुरू करें
      description: |-
        एक नया लंबित ऑथेंटिकेटर सीक्रेट सहेजता है, जो पहले के किसी भी लंबित सीक्रेट की जगह लेता है, और उसे ऑथेंटिकेटर ऐप के लिए लौटाता है (टेक्स्ट के रूप में, और QR कोड के रूप में दिखाने के लिए `otpauth://` URI के रूप में)। दो-चरणीय सत्यापन अभी चालू नहीं है: `POST /account/mfa/totp/enable` इस सीक्रेट के एक कोड से उसे चालू करता है।

        **री-ऑथेंटिकेशन:** केवल पासवर्ड। **लिमिट:** `reauth`, फिर `reauth_user`।
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: लंबित सीक्रेट।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (केवल Google वाला खाता), `invalid_request`, `invalid_json`।'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`।'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (पासवर्ड से पहले जाँचा जाता है)।'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (खाते के विफल री-ऑथेंटिकेशन), या `rate_limited` (`reauth` या `reauth_user` लिमिट, खाते का बजट, पासवर्ड हैश कतार)।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (पासवर्ड हैश कतार, या डेटाबेस लॉक रहा), `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: दो-चरणीय सत्यापन चालू करना पूरा करें और रिकवरी कोड पाएँ
      description: |-
        लंबित सीक्रेट के एक कोड (ठीक 6 अंक) से दो-चरणीय सत्यापन चालू करता है। यहाँ पासवर्ड नहीं माँगा जाता; वह सेटअप के समय दिया जा चुका है। जवाब में 10 रिकवरी कोड होते हैं, जो केवल इसी एक बार दिखाए जाते हैं।

        **लिमिट:** `reauth`, फिर `reauth_user`; ग़लत कोड खाते की री-ऑथेंटिकेशन विफलताओं में गिना जाता है।
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: दो-चरणीय सत्यापन चालू है।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` ठीक 6 अंकों का नहीं है, या बॉडी स्कीमा का उल्लंघन करती है; `invalid_json`।'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: ग़लत कोड (डिवाइस का समय जाँचें)।'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: कोई लंबित सीक्रेट नहीं (पहले `POST /account/mfa/totp/setup` कॉल करें)।'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (खाते के विफल री-ऑथेंटिकेशन), या `rate_limited` (`reauth` या `reauth_user` लिमिट, खाते का बजट)।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (डेटाबेस लॉक रहा), `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: दो-चरणीय सत्यापन बंद करें
      description: |-
        दो-चरणीय सत्यापन बंद करता है। सीक्रेट और रिकवरी कोड हटा दिए जाते हैं, और खाते के मालिक को ईमेल भेजा जाता है।

        **री-ऑथेंटिकेशन:** पासवर्ड, और ऑथेंटिकेटर कोड या रिकवरी कोड (`code` या `recoveryCode` में से एक ज़रूरी है)। **लिमिट:** `reauth`, फिर `reauth_user`।
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: दो-चरणीय सत्यापन बंद है।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (केवल Google वाला खाता), `invalid_request`, `invalid_json`।'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required` (न `code` है, न `recoveryCode`; पासवर्ड से पहले जाँचा जाता है), `invalid_password`, `invalid_code`।'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`।'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (विफल री-ऑथेंटिकेशन, या इस खाते पर बहुत ज़्यादा कोड आज़माए गए), या `rate_limited` (`reauth` या `reauth_user` लिमिट, खाते का बजट, पासवर्ड हैश कतार)।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (पासवर्ड हैश कतार, या डेटाबेस लॉक रहा), `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /account/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags:
        - two-step-verification
      summary: रिकवरी कोड बदलें
      description: |-
        रिकवरी कोड की जगह 10 नए कोड बनाता है; पुराने कोड काम करना बंद कर देते हैं।

        **री-ऑथेंटिकेशन:** पासवर्ड, और `code` में ऑथेंटिकेटर कोड (रिकवरी कोड 403 `invalid_code` के साथ अस्वीकार किया जाता है)। **लिमिट:** `reauth`, फिर `reauth_user`।
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodesRequest'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: नए रिकवरी कोड, जो केवल इसी एक बार दिखाए जाते हैं।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - recoveryCodes
                properties:
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (केवल Google वाला खाता), `invalid_request`, `invalid_json`।'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code` (रिकवरी कोड के लिए भी)।'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`।'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (विफल री-ऑथेंटिकेशन, या इस खाते पर बहुत ज़्यादा कोड आज़माए गए), या `rate_limited` (`reauth` या `reauth_user` लिमिट, खाते का बजट, पासवर्ड हैश कतार)।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (पासवर्ड हैश कतार, या डेटाबेस लॉक रहा), `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: ईमेल पता बदलें
      description: |-
        खाते का ईमेल पता बदलता है। `newEmail` के आगे-पीछे के ख़ाली स्थान हटाए जाते हैं और उसे छोटे अक्षरों में बदला जाता है, फिर उसे रजिस्ट्रेशन के पते की तरह जाँचा जाता है।

        **ईमेल पुष्टि के साथ** (डिफ़ॉल्ट): 202 `verification_sent`। 24 घंटे तक मान्य एक लिंक नए पते पर जाता है; वह `/confirm-email-change` खोलता है, और पता तभी बदलता है जब खिलाड़ी उस पेज का बटन दबाता है। तब तक `GET /account/me` नए पते को `pendingEmail` के रूप में दिखाता है। नया अनुरोध लंबित अनुरोध की जगह ले लेता है; पासवर्ड बदलने या रीसेट होने पर वह रद्द हो जाता है। किसी एक नए पते पर हर 5 मिनट में अधिक से अधिक एक लिंक जाता है, चाहे कोई भी माँगे (पहले से लंबित बदलाव के लिए किया गया अनुरोध पहले भेजा गया लिंक ही रखता है, जो मान्य रहता है); जवाब वही रहता है। मौजूदा पते को सूचना मिलती है कि आंशिक रूप से छिपाए गए एक पते (`a***@example.org`) पर बदलाव का अनुरोध किया गया है। जब कोई दूसरा खाता पहले से नया पता इस्तेमाल करता है, तब भी जवाब और `pendingEmail` वही रहते हैं: तब कोई लिंक नहीं भेजा जाता, इसलिए वह बदलाव कभी पूरा नहीं होता, और उसकी जगह उस पते के मालिक को सूचना मिलती है (प्रति घंटे अधिक से अधिक एक)।

        लिंक की पुष्टि होने पर पता बदल जाता है और पुष्ट माना जाता है, डिवाइस साइन इन रहते हैं, पहले भेजे गए लिंक (पुष्टि, पासवर्ड रीसेट, दूसरे बदलाव) काम करना बंद कर देते हैं, और पुराने पते को सूचना दी जाती है, जिसमें नया पता आंशिक रूप से छिपा होता है।

        **ईमेल पुष्टि के बिना** (`REQUIRE_EMAIL_VERIFICATION=false`): पता तुरंत बदल जाता है (200 `email_changed`), और पुराने पते को सूचना दी जाती है। अगर कोई दूसरा खाता वह पता इस्तेमाल करता है, तो जवाब 409 `email_taken` होता है, और उस पते के मालिक को सूचना मिलती है।

        **री-ऑथेंटिकेशन:** पासवर्ड, और दो-चरणीय सत्यापन होने पर ऑथेंटिकेटर कोड या रिकवरी कोड। `invalid_email` और `same_email` पासवर्ड से पहले जाँचे जाते हैं, इसलिए उनसे कोई विफलता नहीं गिनी जाती। **लिमिट:** `reauth`, फिर `reauth_user`।
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: पता तुरंत बदल गया (इस सर्वर पर ईमेल पुष्टि नहीं होती)।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: नया पता, जैसा सहेजा गया।
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: नए पते पर पुष्टि का लिंक भेजा गया (या पता किसी दूसरे खाते का है; जवाब यह नहीं बताता)।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email` (खाते का मौजूदा पता), `password_not_set` (केवल Google वाला खाता), `invalid_request`, `invalid_json`।'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` (तब भी, जब अनुरोध पूरा होने से पहले पासवर्ड बदल गया या रीसेट हो गया: कोई लिंक नहीं भेजा जाता), `mfa_code_required`, `invalid_code`।'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: केवल ईमेल पुष्टि के बिना।'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (विफल री-ऑथेंटिकेशन, या इस खाते पर बहुत ज़्यादा कोड आज़माए गए), या `rate_limited` (`reauth` या `reauth_user` लिमिट, खाते का बजट, पासवर्ड हैश कतार)।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: पासवर्ड हैश कतार, या डेटाबेस लॉक रहा (`retryAfter: 1`: कुछ नहीं बदला, और वही अनुरोध फिर से भेजा जा सकता है)। `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: खाते का डेटा डाउनलोड करें
      description: |-
        सर्वर खाते के बारे में जो कुछ भी रखता है, वह सब, सहेजने के लिए एक JSON फ़ाइल के रूप में (`format` `scacelith-account-export`, `version` 1)। एक्सपोर्ट एक सुरक्षा घटना (`account_exported`) दर्ज करता है। दस्तावेज़ का `notes` ऐरे खिलाड़ी को सरल अंग्रेज़ी में बताता है कि क्या छोड़ा गया है।

        **एक्सपोर्ट में कभी नहीं:** पासवर्ड हैश, दो-चरणीय सत्यापन का सीक्रेट और रिकवरी कोड; कोई भी सेशन या लिंक टोकन, या उसका हैश; एंटी-चीट का डेटा (इंटीग्रिटी लेवल और स्कोर, विसंगतियाँ, बाज़ियों का विश्लेषण, किसी शिकायत का वज़न); दूसरे खिलाड़ियों द्वारा इस खिलाड़ी के बारे में की गई शिकायतें; मॉडरेटरों की पहचान; दूसरे खिलाड़ियों का निजी डेटा (प्रतिद्वंद्वी अपने सार्वजनिक नाम और रेटिंग से दिखते हैं, कुछ भी यह नहीं बताता कि किसी दूसरे खिलाड़ी को दंड मिला या नहीं, और ऐसा कोई IP पता शामिल नहीं होता जो किसी दूसरे व्यक्ति का हो सकता है)।

        **री-ऑथेंटिकेशन:** पासवर्ड, और दो-चरणीय सत्यापन होने पर ऑथेंटिकेटर कोड या रिकवरी कोड। **लिमिट:** `account_export` (प्रति खिलाड़ी प्रति घंटे 5, पूरे सर्वर के लिए; हर प्रयास गिना जाता है, विफल प्रयास भी; सबसे पहले जाँची जाती है), फिर `reauth` और `reauth_user`। **समय सीमा:** 60 सेकंड।
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: एक्सपोर्ट दस्तावेज़, अटैचमेंट के रूप में।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-account-<username>.json"`। उपयोगकर्ता नाम में अक्षरों, अंकों, `_`, `.` और `-` के अलावा बाक़ी वर्ण `_` बन जाते हैं।'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-account-[A-Za-z0-9_.-]+\.json"$'
              example: attachment; filename="scacelith-account-alice.json"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
