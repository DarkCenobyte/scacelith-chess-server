    x-displayName: ब्राउज़र पेज
    tags:
      - pages
paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: सर्वर का नाम, संस्करण, पोर्ट और साइन-अप के नियम पाएँ
      description: |-
        साइन इन करने या कनेक्ट करने से पहले क्लाइंट को जो चाहिए: सर्वर का नाम और आईडी, WebSocket प्रोटोकॉल के संस्करण और WebSocket कहाँ है, साइन-अप के नियम, आधिकारिक टाइम कंट्रोल और वे सीमाएँ जिन्हें क्लाइंट कोई फ़ॉर्म भेजने से पहले जाँच सकता है।

        **लिमिट:** केवल प्रति-पता लेयर।
      security: []
      responses:
        '200':
          description: सर्वर का विवरण।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: प्रति-पता लेयर।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: खाता बनाएँ
      description: |-
        खाता बनाता है: उसके ईमेल पते की पुष्टि उस पर भेजे गए लिंक से हो जाने के बाद, या ईमेल पुष्टि न होने पर तुरंत।

        **ईमेल पुष्टि के साथ** (`REQUIRE_EMAIL_VERIFICATION`, डिफ़ॉल्ट): 202 `verification_sent`। अभी कोई खाता नहीं बनता: साइन-अप 24 घंटे तक प्रतीक्षा करता है और इस बीच अपना उपयोगकर्ता नाम रोके रखता है। उन 24 घंटों तक मान्य एक लिंक उस पते पर जाता है, हर पते पर हर 5 मिनट में अधिकतम एक (`POST /auth/verify-email/resend` नया लिंक भेजता है); लिंक इस्तेमाल होने पर (`/verify-email` पेज का बटन) खाता बनता है, उसके पते की पुष्टि के साथ, और फिर उससे साइन इन किया जा सकता है। तब तक उस उपयोगकर्ता नाम से साइन-इन का जवाब `invalid_credentials` होता है, जैसा अज्ञात खाते के लिए, और सार्वजनिक प्रोफ़ाइल मौजूद नहीं होती। उसी पते से किया गया नया साइन-अप प्रतीक्षारत साइन-अप की जगह ले लेता है। जब कोई दूसरा खाता पहले से उस पते का इस्तेमाल करता है, तब भी जवाब यही होता है: तब कोई लिंक नहीं भेजा जाता, उसके बजाय उस खाते के मालिक को एक सूचना मिलती है (प्रति घंटा अधिकतम एक), और उपयोगकर्ता नाम इसी तरह रोका जाता है, ताकि किसी भी चीज़ से यह पता न चले कि उस पते का कोई खाता है या नहीं। जिस साइन-अप का लिंक इस्तेमाल नहीं हुआ, वह 24 घंटे बाद हटा दिया जाता है, और उसका उपयोगकर्ता नाम फिर से उपलब्ध हो जाता है।

        **ईमेल पुष्टि के बिना** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, खाता तुरंत बनता है और उससे साइन इन किया जा सकता है।

        **नियम।** `username`: `USERNAME_MIN` से `USERNAME_MAX` वर्ण (3 से 20), अक्षर, अंक, `_` और `-`, जो किसी अक्षर या अंक से शुरू हो (`GET /info` इन्हें `limits` के रूप में देता है); आरक्षित नाम (`admin`, `moderator`, `deleted`...) और कुछ प्रीफ़िक्स अस्वीकार किए जाते हैं; छोटे-बड़े अक्षरों का भेद किए बिना अद्वितीय। `email`: आगे-पीछे के स्पेस हटाकर छोटे अक्षरों में सहेजा जाता है, सादा ASCII, डॉट वाले डोमेन के साथ। `password`: कम से कम `PASSWORD_MIN_LENGTH` (10) वर्ण और UTF-8 में अधिकतम 256 बाइट; इसमें उपयोगकर्ता नाम या ईमेल का लोकल पार्ट नहीं होना चाहिए, और यह कोई आम पासवर्ड नहीं होना चाहिए।

        **त्रुटियाँ**, इस क्रम में जाँची जाती हैं: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; पासवर्ड हैश कतार की त्रुटियाँ; 409 `email_taken` (केवल ईमेल पुष्टि के बिना)।

        **लिमिट:** `auth`, फिर `auth_register` (प्रति क्लाइंट प्रति घंटा 10 रजिस्ट्रेशन)। **प्रूफ़ ऑफ़ वर्क:** हमेशा, जब `POW_REGISTER_BITS` 0 से ज़्यादा हो।
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: पहला प्रयास, प्रूफ़ ऑफ़ वर्क के बिना
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: प्रूफ़ ऑफ़ वर्क के साथ दोबारा भेजा गया
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: खाता बन गया है और उससे साइन इन किया जा सकता है (इस सर्वर पर ईमेल पुष्टि नहीं होती)।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: साइन-अप अपने पुष्टि लिंक की प्रतीक्षा में है (या उस पते का पहले से कोई खाता है; जवाब यह नहीं बताता)।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (`field` के साथ), `invalid_json`, `invalid_username`, `invalid_email`, या `reason` के साथ `weak_password`: `too_short`, `too_long`, `contains_username`, `contains_email` या `too_common`।'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: इस सर्वर पर रजिस्ट्रेशन बंद है (`GET /info` में `registration: closed` है)।'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: किसी खाते के पास यह उपयोगकर्ता नाम है, या किसी दूसरे पते का प्रतीक्षारत साइन-अप उसे रोके हुए है। `email_taken`: कोई दूसरा खाता इस पते का इस्तेमाल करता है (केवल ईमेल पुष्टि के बिना)।'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth` या `auth_register` लिमिट, या पासवर्ड हैश कतार।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (पासवर्ड हैश कतार, या डेटाबेस लॉक रहा), `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: पासवर्ड से साइन इन करें
      description: |-
        उपयोगकर्ता नाम या ईमेल पते और पासवर्ड से साइन इन करता है। दो संभावित जवाब हैं, दोनों स्टेटस 200 के साथ: एक सेशन, या, दो-चरणीय सत्यापन चालू होने पर, एक दूसरा चरण जिसे 5 मिनट के भीतर `POST /auth/login/mfa` से पूरा करना होता है।

        अज्ञात खाते, ग़लत पासवर्ड और बिना पासवर्ड वाले खाते को एक ही जवाब मिलता है, उतने ही समय बाद: 401 `invalid_credentials`। खाते की जाँचें (`banned`, `email_unverified`) सही पासवर्ड के बाद ही होती हैं। एक लॉगिन नाम पर `AUTH_FAILURES_PER_ACCOUNT` (5) विफलताएँ हो जाने के बाद से, हर प्रयास को इंतज़ार करना होता है (429 `too_many_attempts`)।

        **लिमिट:** `auth`। **प्रूफ़ ऑफ़ वर्क:** केवल विफल साइन-इन की लहर के दौरान (428 `pow_required`)।
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: एक सेशन, या दो-चरणीय सत्यापन वाले साइन-इन का दूसरा चरण।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: साइन इन हो गया
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: दो-चरणीय सत्यापन चालू है
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: अज्ञात खाता, ग़लत पासवर्ड, या बिना पासवर्ड वाला खाता।'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'केवल सही पासवर्ड के बाद: `until` के साथ `banned` (epoch से मिलीसेकंड, स्थायी निलंबन के लिए `null`), या `email_unverified` (कोई पुराना खाता जिसके पते की अभी पुष्टि नहीं हुई है)।'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (इस लॉगिन नाम की विफलताओं के बाद की प्रतीक्षा), या `rate_limited` (`auth` लिमिट, पासवर्ड हैश कतार)।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (पासवर्ड हैश कतार, या डेटाबेस लॉक रहा), `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: दूसरे फ़ैक्टर से साइन-इन पूरा करें
      description: |-
        दो-चरणीय सत्यापन वाले साइन-इन का दूसरा चरण, जब `POST /auth/login` या Google साइन-इन (`POST /auth/sso/google/finish` या `POST /auth/sso/google/link`) ने `mfaRequired` जवाब दिया हो। `code` (6 अंकों का ऑथेंटिकेटर कोड, या रिकवरी कोड) या `recoveryCode` भेजें। यहाँ इस्तेमाल हुआ रिकवरी कोड ख़त्म हो जाता है।

        एक चरण अधिकतम 5 ग़लत कोड स्वीकार करता है; पासवर्ड रीसेट होने या बदले जाने पर भी चरण ख़त्म हो जाता है। Google जुड़ाव के पासवर्ड वाले चरण के बाद, जुड़ाव तभी सहेजा जाता है जब यहाँ कोड सही निकले।

        **लिमिट:** `auth`, और खाते के लिए हर 15 मिनट में अधिकतम `AUTH_MFA_PER_ACCOUNT` (10) कोड, किसी भी पते से; इससे ज़्यादा पर कोड जाँचा नहीं जाता, इसलिए रिकवरी कोड ख़र्च नहीं होता।
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: ऑथेंटिकेटर कोड
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: रिकवरी कोड
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: साइन इन हो गया।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: न `code` भेजा गया, न `recoveryCode`, या बॉडी स्कीमा का उल्लंघन करती है; `invalid_json`।'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: चरण की अवधि ख़त्म हो गई, उसका इस्तेमाल हो चुका है, या 5 ग़लत कोड के बाद वह ख़त्म हो गया, या पहले चरण के बाद पासवर्ड रीसेट किया गया या बदला गया (फिर से साइन इन करें)। `invalid_code`: ग़लत या पहले से इस्तेमाल हो चुका कोड।'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (`until` के साथ), `email_unverified`।'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: केवल Google जुड़ाव के पासवर्ड वाले चरण के बाद, इस बीच Google खाता किसी दूसरे खाते से जोड़ दिया गया।'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: केवल Google जुड़ाव के पासवर्ड वाले चरण के बाद, इस बीच खाता बदल गया; साइन-इन फिर से शुरू करें।'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: खाते की विफलताओं के बाद की प्रतीक्षा, या पिछले 15 मिनट के उसके `AUTH_MFA_PER_ACCOUNT` कोड ख़त्म हो चुके हैं। `rate_limited`: `auth` लिमिट।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`retryAfter: 1` के साथ `server_busy`: डेटाबेस लॉक रहा (Google जुड़ाव के चरण के बाद, कुछ भी नहीं जोड़ा गया: साइन-इन फिर से शुरू करें)। `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: इस सेशन से साइन आउट करें
      description: |-
        इस्तेमाल किए गए टोकन का सेशन निरस्त करता है। उससे खोला गया WebSocket बंद कर दिया जाता है। कोई बॉडी नहीं (या `{}`)।

        **लिमिट:** `sessions`।
      security:
        - bearerAuth: []
      responses:
        '200':
          description: साइन आउट हो गया।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `{}` के अलावा कोई और बॉडी; `invalid_json`।'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `sessions` लिमिट या खाते का बजट।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (डेटाबेस लॉक रहा), `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
