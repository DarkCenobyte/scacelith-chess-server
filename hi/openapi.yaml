          description: '`server_busy` (डेटाबेस लॉक रहा), `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: पुष्टि लिंक दोबारा भेजें
      description: |-
        ईमेल पुष्टि का लिंक दोबारा भेजता है। पता चाहे जो हो, जवाब 202 `accepted` होता है, ताकि इससे कभी यह पता न चले कि कोई खाता या साइन-अप उस पते का इस्तेमाल करता है या नहीं।

        हर पते के लिए अनुरोध हर 5 मिनट में अधिकतम एक बार असर करता है। उस पते वाले प्रतीक्षारत साइन-अप को फिर से पूरे 24 घंटे मिल जाते हैं, चाहे कोई दूसरा खाता उस पते का इस्तेमाल करता हो या नहीं, ताकि दोनों ही मामलों में उसका उपयोगकर्ता नाम उतनी ही देर रुका रहे। लिंक केवल दो स्थितियों में भेजा जाता है: उस साइन-अप के लिए, जब उस पते का कोई खाता न हो (24 घंटे तक मान्य नया लिंक पिछले लिंक की जगह ले लेता है), या उस पते वाले किसी सक्रिय, अपुष्ट खाते के लिए।

        **लिमिट:** `auth`, फिर `auth_mail` (प्रति क्लाइंट प्रति घंटा 10)।
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: स्वीकार किया गया (पता चाहे जो हो)।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth` या `auth_mail` लिमिट (पता चाहे जो हो)।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`retryAfter: 1` के साथ `server_busy`: खाता खोजते समय या किसी अपुष्ट खाते का लिंक सहेजते समय डेटाबेस लॉक रहा (प्रतीक्षारत साइन-अप का नवीनीकरण यथासंभव किया जाता है और उससे अनुरोध कभी विफल नहीं होता); पते के 5 मिनट फिर भी शुरू हो जाते हैं, इसलिए उनके भीतर आया नया अनुरोध कुछ नहीं करता। `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: पासवर्ड रीसेट लिंक भेजें
      description: |-
        एक घंटे तक मान्य पासवर्ड रीसेट लिंक भेजता है, जो `/reset-password` पेज खोलता है। पता चाहे जो हो, जवाब 202 `accepted` होता है। लिंक केवल सक्रिय खाते को जाता है, हर पते पर हर 5 मिनट में अधिकतम एक बार। केवल Google वाला खाता इसी तरह अपना पहला पासवर्ड सेट करता है।

        पासवर्ड रिकवरी की लिमिट API में सबसे सख़्त हैं, और सभी पूरे सर्वर के लिए गिनी जाती हैं: प्रति क्लाइंट (एक IPv4 पता या एक IPv6 /64) प्रति घंटा 3 अनुरोध (`AUTH_FORGOT_PER_HOUR`) और प्रति 24 घंटे 10 (`AUTH_FORGOT_PER_DAY`), प्रति IPv6 /48 इन संख्याओं का 3 गुना, और इनके ऊपर `auth` लिमिट (प्रति 10 मिनट 20) और हर पते पर हर 5 मिनट में एक मेल। न 202 से पता चलता है, न 429 से, कि कोई खाता उस पते का इस्तेमाल करता है या नहीं। नया पासवर्ड सेट करने की अपनी अलग लिमिट है (`auth_reset`)।

        **लिमिट:** `auth`, `auth_forgot`, फिर `auth_forgot_day`।
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: स्वीकार किया गया (पता चाहे जो हो)।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth`, `auth_forgot` या `auth_forgot_day` लिमिट (पता चाहे जो हो)।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`retryAfter: 1` के साथ `server_busy`: खाता खोजते समय या लिंक सहेजते समय डेटाबेस लॉक रहा; पते के 5 मिनट फिर भी शुरू हो जाते हैं, इसलिए उनके भीतर आया नया अनुरोध कोई लिंक नहीं भेजता। `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: रीसेट लिंक के टोकन से नया पासवर्ड सेट करें
      description: |-
        रीसेट लिंक के टोकन से नया पासवर्ड सेट करता है (`/reset-password` पेज भी यही करता है)। नया पासवर्ड रजिस्ट्रेशन के नियमों का पालन करता है।

        रीसेट के ये असर होते हैं, एक ही ट्रांज़ैक्शन में (या तो सभी, या कोई नहीं): यह हर सेशन निरस्त करता है और लंबित ईमेल बदलाव को रद्द करता है; खाते के दूसरे रीसेट लिंक काम करना बंद कर देते हैं; पते को पुष्ट माना जाता है (लिंक ने यह साबित कर दिया); मालिक को एक मेल मिलता है। दो-चरणीय सत्यापन को छुआ नहीं जाता। पासवर्ड हैश कतार की त्रुटि, 503 या 500 के बाद, कुछ नहीं बदला: पुराना पासवर्ड और सेशन बने रहते हैं, और लिंक मान्य रहता है।

        **लिमिट:** `auth`, फिर `auth_reset` (प्रति क्लाइंट प्रति घंटा 10, प्रति IPv6 /48 30, पेज के साथ साझा: हर प्रयास एक पासवर्ड हैश करता है)।
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: पासवर्ड बदल दिया गया है और हर सेशन से साइन आउट हो गया है।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: लिंक अमान्य है, इस्तेमाल हो चुका है या उसकी अवधि ख़त्म हो चुकी है, या वह ऐसे पते पर भेजा गया था जो अब खाते का नहीं है। `weak_password` (`reason` के साथ)। `invalid_request`, `invalid_json`।'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth` या `auth_reset` लिमिट, या पासवर्ड हैश कतार।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: पासवर्ड हैश कतार, या डेटाबेस लॉक रहा (`retryAfter: 1`, कुछ नहीं बदला)। `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Google साइन-इन शुरू करें
      description: |-
        PKCE चैलेंज और `127.0.0.1` पर गेम के लिसनर के पोर्ट के लिए Google साइन-इन का एक प्रयास शुरू करता है। जवाब में सिस्टम ब्राउज़र में खोलने के लिए Google URL और प्रयास का `state` होता है; प्रयास 10 मिनट तक मान्य रहता है।

        `authUrl` में `client_id`, `redirect_uri` (`redirectPort` और सर्वर के ओरिजिन टैग से बना), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge_method=S256` के साथ `code_challenge` (Google के लिए सर्वर के अपने वेरिफ़ायर का S256), और `prompt=select_account` होते हैं। गेम इसे खोलने से पहले इसकी जाँच करता है (अनुभाग का विवरण देखें)।

        **लिमिट:** `sso_start`।
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: प्रयास।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: इस सर्वर पर Google साइन-इन उपलब्ध नहीं है।'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `sso_start` लिमिट।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (डेटाबेस लॉक रहा), `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: वेबसाइट पर Google साइन-इन शुरू करें
      description: |-
        किसी वेबसाइट के पेज के PKCE चैलेंज के लिए उस वेबसाइट का Google साइन-इन प्रयास शुरू करता है। जवाब वही होता है जो गेम के लिए: जिस Google URL पर नेविगेट करना है, और प्रयास का `state`; प्रयास 10 मिनट तक मान्य रहता है। तब उपलब्ध है जब `GET /info` में `sso.googleWeb: true` हो।

        `authUrl` में वेबसाइट का `client_id` और `redirect_uri=GOOGLE_WEB_REDIRECT_URI` होते हैं, और बाकी पैरामीटर वही होते हैं जो गेम के लिए। पेज उस पर नेविगेट करने से पहले उसकी जाँच करता है (अनुभाग के विवरण में **वेबसाइट पर** देखें)।

        **लिमिट:** `sso_start`, गेम के start के साथ साझा।
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: प्रयास।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
