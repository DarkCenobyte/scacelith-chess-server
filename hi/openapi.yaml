        '200':
          $ref: '#/components/responses/HtmlPage'
          description: पासवर्ड बदल दिया गया है, और हर डिवाइस साइन आउट हो गया है।
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: त्रुटि के साथ फ़ॉर्म दोबारा (पासवर्ड अलग-अलग हैं, कमज़ोर पासवर्ड), लिंक अमान्य है, या फ़ॉर्म अमान्य है (HTML पेज)।
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: '`auth` या `auth_reset` लिमिट (HTML पेज), इस क्लाइंट के बहुत ज़्यादा पासवर्ड हैश प्रतीक्षा में होने पर `Retry-After` के साथ फ़ॉर्म दोबारा (लिंक मान्य रहता है), या प्रति-पता लेयर (JSON `rate_limited`)।'
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'सर्वर व्यस्त होने पर (पासवर्ड हैश कतार, या डेटाबेस लॉक रहा) `Retry-After` के साथ फ़ॉर्म दोबारा; लिंक मान्य रहता है। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), इसकी जगह `Retry-After` (2 से 5) के साथ "Server error" (सर्वर त्रुटि) पेज: कुछ भी प्रोसेस नहीं किया गया और लिंक मान्य रहता है। हैंडलर टाइमआउट भी।'
