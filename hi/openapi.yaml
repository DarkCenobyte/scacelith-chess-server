  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: खिलाड़ी की बाज़ियों की सूची देखें, फ़िल्टर और पेजिंग के साथ
      description: |-
        साइन इन किए हुए खिलाड़ी की बाज़ियाँ, सबसे नई पहले, फ़िल्टर और पेजिंग के साथ, और फ़िल्टर से मेल खाने वाली बाज़ियों की संख्या के साथ। हर क्वेरी पैरामीटर वैकल्पिक है, और ख़ाली मान को अनुपस्थित माना जाता है।

        पेजिंग: पिछले पेज का `next` `before` के रूप में भेजें; आख़िरी पेज पर `next` `null` होता है। `total` सभी पेजों में फ़िल्टर से मेल खाने वाली बाज़ियाँ गिनता है।

        **लिमिट:** `account_games`।
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: आधिकारिक श्रेणी की आईडी (`3+2`, या `3%2B2`), या किसी दूसरे टाइम कंट्रोल वाली हर बाज़ी के लिए `custom`।
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: केवल रेटेड (`true`) या कैज़ुअल (`false`) बाज़ियाँ।
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: केवल जीती, हारी या ड्रॉ रही बाज़ियाँ, खिलाड़ी की ओर से। रद्द बाज़ियाँ केवल इस फ़िल्टर के बिना दिखती हैं।
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: इतिहास का एक पेज।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` बाज़ी की आईडी नहीं है), `invalid_limit`, या `invalid_filter` (`category`, `rated` या `result`), हर एक `field` के साथ, जो पैरामीटर का नाम बताता है।'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `account_games` लिमिट या खाते का बजट।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (डेटाबेस लॉक रहा; बॉडी में `retryAfter: 1`, कोई `Retry-After` हेडर नहीं), `server_busy` (सेशन की जाँच में डेटाबेस लॉक मिला), `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /games/{id}:
    get:
