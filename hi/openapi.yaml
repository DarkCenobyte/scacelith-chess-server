  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Google का जवाब सर्वर को सौंपें
      description: |-
        Google ने गेम के लिसनर या वेबसाइट के पेज को जो `code` और `state` भेजे, उन्हें प्रयास की आईडी और PKCE वेरिफ़ायर के साथ सर्वर को सौंपता है। वेरिफ़ायर के बिना प्रयास की आईडी बेकार है, और सर्वर के अपने PKCE वेरिफ़ायर और क्लाइंट सीक्रेट के बिना कोड बेकार है।

        सर्वर प्रयास की जाँच करता है (अज्ञात, इस्तेमाल हो चुका या अवधि ख़त्म: 410), फिर वेरिफ़ायर की (ग़लत वेरिफ़ायर होने पर प्रयास इस्तेमाल योग्य बना रहता है), फिर प्रयास को एक बार इस्तेमाल करता है, `state` और `iss` जाँचता है, Google के साथ कोड एक्सचेंज करता है और ID टोकन सत्यापित करता है। जवाब (200) इनमें से एक होता है:

        - `{ token, expiresAt, user }`: जुड़े हुए खाते में साइन इन हो गया;
        - `{ mfaRequired, mfaToken, expiresIn }`: `POST /auth/login/mfa` से आगे बढ़ें;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: नया खाता; 10 मिनट के भीतर `POST /auth/sso/complete` से आगे बढ़ें। `suggestedUsername` Google नाम या पते से आता है, और कुछ भी उपयुक्त न होने पर `""` होता है;
        - `{ needsPassword, linkTicket, username, expiresIn }`: उस पते वाले खाते का पासवर्ड है; `POST /auth/sso/google/link` से आगे बढ़ें। अभी कुछ भी जोड़ा नहीं गया है।

        **लिमिट:** `sso_finish`।
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: एक सेशन, दूसरा चरण, या पहली बार के Google साइन-इन का अगला चरण।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: जुड़े हुए खाते में साइन इन हो गया
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: दो-चरणीय सत्यापन चालू है
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: नया खिलाड़ी
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: पासवर्ड वाला कोई खाता इस पते का इस्तेमाल करता है
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: वेरिफ़ायर प्रयास के चैलेंज से मेल नहीं खाता (प्रयास इस्तेमाल योग्य बना रहता है)। `sso_email_unverified`: Google ने पते की पुष्टि नहीं की है। `registration_closed`। `account_disabled`। केवल जुड़े हुए खाते के लिए: `banned` (`until` के साथ), `email_unverified`।'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: इस सर्वर पर Google साइन-इन उपलब्ध नहीं है।'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: बिना पासवर्ड वाला कोई सक्रिय खाता इस पते का इस्तेमाल करता है (उसका नाम नहीं बताया जाता)।'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: अज्ञात प्रयास, इस्तेमाल हो चुका प्रयास, या ऐसा प्रयास जिसकी अवधि ख़त्म हो चुकी है।'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `sso_finish` लिमिट।'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (डेटाबेस लॉक रहा), `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: पासवर्ड के ज़रिए Google को मौजूदा खाते से जोड़ें
      description: |-
        `finish` के `needsPassword` जवाब देने के बाद: गेम में टाइप किए गए मौजूदा खाते के पासवर्ड से Google को उस खाते से जोड़ता है। जवाब (200) एक सेशन होता है (जुड़ाव सहेज लिया जाता है और साइन-इन हो जाता है), या, दो-चरणीय सत्यापन चालू होने पर, `{ mfaRequired, mfaToken, expiresIn }`: `POST /auth/login/mfa` से आगे बढ़ें, और जुड़ाव तभी सहेजा जाता है जब वहाँ कोई कोड सही निकले।

        ग़लत पासवर्ड होने पर टिकट इस्तेमाल योग्य बना रहता है, कुल 5 कोशिशों तक। पासवर्ड जाँचे जाने से ठीक पहले एक कोशिश ली जाती है: 429 `too_many_attempts` या 428 `pow_required` कोई कोशिश नहीं लेते, जबकि पासवर्ड हैश कतार की अस्वीकृति (503 `server_busy`, 429 `rate_limited`) एक कोशिश ले चुकी होती है और खाते की विफलता के रूप में गिनी जाती है। विफलताओं के बाद की प्रतीक्षा के लिए वही काउंटर इस्तेमाल होता है जो `POST /auth/login` के लिए।

        **लिमिट:** `auth` (उसकी IPv6 /48 गिनती के साथ)। **प्रूफ़ ऑफ़ वर्क:** `POST /auth/login` की तरह।
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: एक सेशन, या साइन-इन का दूसरा चरण।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: ग़लत पासवर्ड; टिकट बना रहता है, कुल 5 कोशिशों तक।'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (`until` के साथ), केवल सही पासवर्ड के बाद।'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: इस सर्वर पर Google साइन-इन उपलब्ध नहीं है।'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: इस बीच Google खाता किसी दूसरे खाते से जोड़ दिया गया।'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: टिकट अज्ञात है, इस्तेमाल हो चुका है या उसकी अवधि ख़त्म हो चुकी है; पाँचवाँ ग़लत पासवर्ड; ऐसा खाता जिसकी स्थिति या पता `finish` के बाद बदल गया; या ऐसा खाता जिसकी स्थिति, पता, पासवर्ड या दो-चरणीय सत्यापन तब बदल गया जब जुड़ाव सहेजा जा रहा था। साइन-इन फिर से शुरू करें।'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (खाते की विफलताओं के बाद की प्रतीक्षा), या `rate_limited` (`auth` लिमिट, पासवर्ड हैश कतार)।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: पासवर्ड हैश कतार, या डेटाबेस लॉक रहा (`retryAfter: 1`, कुछ भी नहीं जोड़ा गया)। `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: पहले Google साइन-इन का खाता बनाएँ
      description: |-
        `finish` के `needsUsername` जवाब देने के बाद: चुने गए उपयोगकर्ता नाम से खाता बनाता है (रजिस्ट्रेशन के नियम लागू होते हैं) और उसे साइन इन करता है। खाते का कोई पासवर्ड नहीं होता: `hasPassword` `false` होता है, और "पासवर्ड याद नहीं?" (`POST /auth/password/forgot`) से उसे पासवर्ड मिलता है।

        **लिमिट:** `auth` (IPv6 /48 की गिनती सहित)।
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: खाता बन गया है और साइन इन हो गया है।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`।'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`।'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: इस सर्वर पर Google साइन-इन उपलब्ध नहीं है।'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (किसी खाते के पास यह उपयोगकर्ता नाम है, या किसी दूसरे पते का प्रतीक्षारत साइन-अप उसे रोके हुए है), `sso_already_linked`, `email_taken`।'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: टिकट अज्ञात है, इस्तेमाल हो चुका है या उसकी अवधि ख़त्म हो चुकी है।'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth` लिमिट।'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (डेटाबेस लॉक रहा), `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /auth/sessions:
