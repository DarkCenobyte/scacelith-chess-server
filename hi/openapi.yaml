            description: सार्वजनिक API पोर्ट (`PUBLIC_API_PORT`, नहीं तो `API_PORT`)।
    get:
      operationId: getLiveness
      tags:
        - health
      summary: जाँचें कि प्रोसेस चल रहा है
      description: |-
        जब तक प्रोसेस चल रहा है, 200 `ok` जवाब देता है। `HEAD` भी काम करता है। कोई भी दूसरा मेथड (`OPTIONS` सहित) `Allow: GET, HEAD` के साथ 405 `method_not_allowed` जवाब देता है।

        **लिमिट:** केवल प्रति-पता लेयर।
      security: []
      responses:
        '200':
          description: प्रोसेस चल रहा है।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
              example:
                status: ok
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: प्रति-पता लेयर।'
  /readyz:
    servers:
      - url: https://caissa.scacelith.com
        description: आधिकारिक सर्वर, रूट पर।
      - url: https://caissa.scacelith.com/api/v1
        description: आधिकारिक सर्वर, `/api/v1` के अंतर्गत।
      - url: https://{host}:{port}
        description: कोई भी Scacelith सर्वर, रूट पर।
        variables:
          host:
            default: caissa.scacelith.com
            description: सर्वर का सार्वजनिक होस्ट नाम (`SERVER_PUBLIC_HOST`)।
          port:
            default: "443"
            description: सार्वजनिक API पोर्ट (`PUBLIC_API_PORT`, नहीं तो `API_PORT`)।
      - url: https://{host}:{port}/api/v1
        description: कोई भी Scacelith सर्वर, `/api/v1` के अंतर्गत।
        variables:
          host:
            default: caissa.scacelith.com
            description: सर्वर का सार्वजनिक होस्ट नाम (`SERVER_PUBLIC_HOST`)।
          port:
            default: "443"
            description: सार्वजनिक API पोर्ट (`PUBLIC_API_PORT`, नहीं तो `API_PORT`)।
    get:
      operationId: getReadiness
      tags:
        - health
      summary: जाँचें कि सर्वर खिलाड़ियों को स्वीकार कर रहा है
      description: |-
        जब सर्वर खिलाड़ियों को स्वीकार कर रहा हो, तब 200 `ready` जवाब देता है, और उसके शुरू या बंद होते समय 503 `not_ready`। `HEAD` भी काम करता है। कोई भी दूसरा मेथड (`OPTIONS` सहित) `Allow: GET, HEAD` के साथ 405 `method_not_allowed` जवाब देता है।

        **लिमिट:** केवल प्रति-पता लेयर।
      security: []
      responses:
        '200':
          description: सर्वर खिलाड़ियों को स्वीकार कर रहा है।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: प्रति-पता लेयर।'
        '503':
          description: सर्वर शुरू या बंद हो रहा है।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        साइन-इन जवाब से मिला सेशन टोकन (`sct_` के बाद 43 base64url वर्ण), `Authorization` हेडर में: `Authorization: Bearer <token>`। प्रीफ़िक्स ठीक `Bearer` (केस-सेंसिटिव) और एक स्पेस है; जिस मान में यह न हो, या जो टोकन 1 से 512 प्रिंट होने योग्य ASCII वर्णों का न हो, उस पर किसी भी दूसरे अमान्य टोकन की तरह जवाब 401 `invalid_token` होता है। ख़ाली हेडर को हेडर न होने जैसा माना जाता है।
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: बाज़ी की आईडी, अधिकतम 16 अंकों का धनात्मक दशमलव पूर्णांक, शुरुआती शून्यों के बिना, 2^53 से कम।
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: सेशन की आईडी, जैसी `GET /auth/sessions` देता है, शुरुआती शून्यों के बिना लिखी हुई (`03` सेशन 3 नहीं है)।
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: खिलाड़ी का उपयोगकर्ता नाम, छोटे-बड़े अक्षरों का भेद किए बिना। सर्वर `[A-Za-z0-9_.-]` के 2 से 24 वर्णों वाला कोई भी नाम स्वीकार करता है (अब तक कभी अनुमत सबसे व्यापक नियम)।
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: बाज़ी की आईडी; केवल उससे पुरानी बाज़ियाँ सूची में आती हैं। पिछले पेज का `next` भेजें। ख़ाली मान को अनुपस्थित माना जाता है।
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: पेज का आकार, 1 से 50। 3 अंकों तक की बड़ी संख्या 50 मानी जाती है; ख़ाली मान को अनुपस्थित माना जाता है।
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: ईमेल लिंक का टोकन (43 base64url वर्ण)। टोकन न होने या ग़लत होने पर "link invalid or expired" (लिंक अमान्य या अवधि ख़त्म) पेज दिखता है।
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: सर्वर का हर जवाब कैशिंग की मनाही करता है।
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: दोबारा कोशिश करने से पहले इंतज़ार के सेकंड; बॉडी के `retryAfter` जैसा ही मान।
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: बेयरर चैलेंज, अमान्य टोकन के लिए `error="invalid_token"` के साथ।
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: इस जवाब के बाद सर्वर कनेक्शन बंद कर देता है।
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (जब बॉडी का कोई फ़ील्ड ग़लत हो, तो `field` के साथ) या `invalid_json`।'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: कोई फ़ील्ड स्कीमा का उल्लंघन करता है
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: बॉडी JSON नहीं है
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: कमज़ोर पासवर्ड
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: ऐसा PGN जो पढ़ा नहीं जा सकता
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (कोई `Authorization` हेडर नहीं) या `invalid_token` (टोकन ग़लत रूप में है, उसकी अवधि ख़त्म हो चुकी है, वह निरस्त है, या किसी हटाए गए खाते का है)।'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: कोई सेशन नहीं
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: अमान्य टोकन
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: अनुरोध अस्वीकार कर दिया गया है।
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: री-ऑथेंटिकेशन में ग़लत पासवर्ड
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: निलंबित खाता
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found`, या ऐसी सुविधा जिसे इस सर्वर ने बंद कर रखा है।'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: बॉडी 10 सेकंड के भीतर नहीं पहुँची। सर्वर कनेक्शन बंद कर देता है।'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: अनुरोध सर्वर की स्थिति से टकराता है।
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: Google साइन-इन का प्रयास या टिकट अज्ञात है, इस्तेमाल हो चुका है या उसकी अवधि ख़त्म हो चुकी है; साइन-इन फिर से शुरू करें।'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: बॉडी `HTTP_BODY_LIMIT` (डिफ़ॉल्ट रूप से 16,384 बाइट) से बड़ी है। सर्वर कनेक्शन बंद कर देता है।'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: अनुरोध टारगेट 4096 वर्णों से लंबा है।'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: बॉडी `application/json` नहीं है, या उसका charset UTF-8 नहीं है।'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: बाज़ी में `GIF_MAX_PLIES` (600) से ज़्यादा अर्ध-चालें हैं।'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: `pow` चैलेंज हल करें और वही अनुरोध `pow: { challenge, nonce }` के साथ दोबारा भेजें। `reason` कारण बताता है: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` या `replayed`।'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (कोई रेट लिमिट, खाते का बजट, या पासवर्ड हैश कतार) या `too_many_attempts` (खाते पर लगी कोई पाबंदी), `retryAfter` और `Retry-After` हेडर के साथ।'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: रेट लिमिट
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: इस खाते पर बहुत ज़्यादा विफलताएँ
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: अनपेक्षित विफलता। सर्वर इसे लॉग करता है।'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: ग़लत `state` या `iss`, या Google ने कोड अस्वीकार कर दिया या ऐसा ID टोकन भेजा जिसका सत्यापन नहीं होता (दूसरे क्लाइंट, यानी गेम या वेबसाइट, का कोड या ID टोकन भी)। इसमें Google का टेक्स्ट कभी नहीं होता।'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` या `timeout`: `retryAfter` दिया गया हो, तो उसके बाद फिर कोशिश करें।'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: सर्वर व्यस्त है
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: डेटाबेस लॉक रहा (पढ़ने का अनुरोध)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: सर्वर ने बहुत देर लगाई
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: एनिमेटेड GIF, अटैचमेंट के रूप में।
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: 'इस सर्वर की बाज़ी के लिए `attachment; filename="scacelith-<id>.gif"`, `POST /gif` से भेजे गए PGN के लिए `attachment; filename="scacelith-game.gif"`।'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: फ़ाइल का आकार, बाइट में।
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: एक HTML पेज।
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: अस्वीकार का कारण समझाने वाला HTML पेज।
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: फ़ॉर्म 10 सेकंड के भीतर नहीं पहुँचा (HTML पेज)। सर्वर कनेक्शन बंद कर देता है।
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: टकराव समझाने वाला HTML पेज।
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: फ़ॉर्म `HTTP_BODY_LIMIT` से बड़ा है (HTML पेज)। सर्वर कनेक्शन बंद कर देता है।
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: बॉडी न फ़ॉर्म (`application/x-www-form-urlencoded`) है, न JSON, या उसका charset UTF-8 नहीं है (HTML पेज)।
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: रेट लिमिट (HTML पेज), `Retry-After` के साथ।
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: अनपेक्षित विफलता ("Server error" (सर्वर त्रुटि) शीर्षक वाला HTML पेज)। सर्वर इसे लॉग करता है।
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: सर्वर व्यस्त है (डेटाबेस लॉक रहा, या सर्वर काफ़ी पीछे चल रहा है; `Retry-After` के साथ) या उसने बहुत देर लगाई ("Server error" (सर्वर त्रुटि) शीर्षक वाला HTML पेज)।
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: JSON API के हर त्रुटि जवाब का एकमात्र स्वरूप।
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: '`snake_case` त्रुटि कोड। क्लाइंट इसी के आधार पर तय करता है कि क्या दिखाना है।'
          examples:
            - rate_limited
        message:
          type: string
          description: अंग्रेज़ी का एक वाक्य, लॉग के लिए और फ़ॉलबैक के रूप में।
        retryAfter:
          type: integer
          minimum: 1
          description: दोबारा कोशिश करने से पहले इंतज़ार के सेकंड, केवल उन अस्वीकारों में मौजूद जो समय बीतने पर ख़त्म हो जाते हैं। तब जवाब में उसी मान वाला `Retry-After` हेडर भी होता है, सिवाय इतिहास, बाज़ी, खिलाड़ी और लीडरबोर्ड पढ़ने वाले अनुरोधों के 503 `busy` के।
        field:
          type: string
          description: ग़लत फ़ील्ड या क्वेरी पैरामीटर (`invalid_request`, `invalid_option`, और `GET /account/games` के `invalid_cursor`, `invalid_limit` और `invalid_filter`)। नेस्टेड फ़ील्ड बिंदु से लिखा जाता है (`pow.nonce`)।
        reason:
          type: string
          description: 'कारण: वह नियम जिसे `weak_password` तोड़ता है, या प्रूफ़ ऑफ़ वर्क क्यों माँगा या अस्वीकार किया गया (`pow_required`)।'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'केवल `banned`: निलंबन का अंत (epoch से मिलीसेकंड), स्थायी निलंबन के लिए `null`।'
        line:
          type: integer
          minimum: 1
          description: 'केवल `invalid_pgn`: त्रुटि की पंक्ति, 1 से शुरू।'
        column:
          type: integer
          minimum: 1
          description: 'केवल `invalid_pgn`: त्रुटि का कॉलम, 1 से शुरू, वर्णों में।'
    PowChallenge:
      type: object
      description: प्रूफ़ ऑफ़ वर्क चैलेंज (428 `pow_required` का `pow`)।
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: हस्ताक्षरित चैलेंज, जिसे जैसा है वैसा ही वापस भेजना है।
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: शुरुआती शून्य बिट की वह संख्या जो `SHA-256(challenge + ":" + nonce)` में होनी चाहिए।
        expiresAt:
          type: integer
          format: int64
          description: चैलेंज की अवधि कब ख़त्म होती है (epoch से मिलीसेकंड), जारी होने के 2 मिनट बाद।
    PowAnswer:
      type: object
      description: प्रूफ़ ऑफ़ वर्क चैलेंज का जवाब।
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: 428 जवाब का `challenge`, जैसा दिया गया था।
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: अधिकतम 20 अंकों की दशमलव स्ट्रिंग, ऐसी कि `SHA-256(challenge + ":" + nonce)` `bits` शून्य बिट से शुरू हो।
    ServerInfo:
      type: object
      description: साइन इन करने या कनेक्ट होने से पहले क्लाइंट को जो चाहिए।
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: सर्वर का नाम (`SERVER_NAME`)।
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: एक UUID, जो डेटाबेस को पहली बार शुरू होने पर मिलता है। रीस्टार्ट के बाद भी यह वही रहता है। जब डेटाबेस इसे नहीं दे पाता, तब यह `null` होता है।
        motd:
          type: string
          description: आज का संदेश (`SERVER_MOTD`), ख़ाली भी हो सकता है।
        protocol:
          type: object
          description: WebSocket प्रोटोकॉल (`PROTOCOL.md`)।
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: प्रोटोकॉल का सबसे पुराना संस्करण जिसे सर्वर समझता है।
            max:
              type: integer
              minimum: 1
              description: प्रोटोकॉल का सबसे नया संस्करण जिसे सर्वर समझता है।
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'प्रोटोकॉल स्कीमा का फ़िंगरप्रिंट (उसके कैनोनिकल रूप के SHA-256 के पहले 4 बाइट, अनसाइन्ड पूर्णांक के रूप में: प्रोटोकॉल के माइनर संस्करण 2 के लिए `0xc649140f`, 3326678031); केवल जानकारी के लिए, इसकी कभी तुलना नहीं की जाती।'
            subprotocol:
              type: string
              description: WebSocket सबप्रोटोकॉल टोकन (`Sec-WebSocket-Protocol`)।
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: खिलाड़ियों द्वारा इस्तेमाल किया जाने वाला WebSocket पोर्ट (`PUBLIC_WS_PORT`, नहीं तो `WS_PORT`, नहीं तो `API_PORT`)।
        wsPath:
          type: string
          const: /ws
          description: WebSocket का पाथ।
        registration:
          type: string
          enum:
            - open
            - closed
          description: क्या नए खाते बनाए जा सकते हैं।
        emailVerification:
          type: boolean
          description: क्या नए खाते अपने पते की पुष्टि करते हैं (`REQUIRE_EMAIL_VERIFICATION`)।
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: क्या गेम के लिए Google साइन-इन उपलब्ध है।
            googleWeb:
              type: boolean
              description: क्या किसी वेबसाइट के लिए भी Google साइन-इन उपलब्ध है (`POST /auth/sso/google/web/start`)।
        mfa:
          type: boolean
          const: true
          description: दो-चरणीय सत्यापन हमेशा उपलब्ध है।
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: रजिस्ट्रेशन के लिए ज़रूरी प्रूफ़ ऑफ़ वर्क बिट (0 हो तो कोई नहीं)।
        categories:
          type: array
          description: आधिकारिक (रेटेड) टाइम कंट्रोल (`RATED_CATEGORIES`), सर्वर के क्रम में। कोई भी दूसरा टाइम कंट्रोल `custom` है।
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: वे नियम जिन्हें क्लाइंट फ़ॉर्म भेजने से पहले जाँच सकता है।
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: उपयोगकर्ता नाम की न्यूनतम लंबाई (`USERNAME_MIN`)।
            usernameMax:
              type: integer
              description: उपयोगकर्ता नाम की अधिकतम लंबाई (`USERNAME_MAX`)।
            usernamePattern:
              type: string
              description: वह रेगुलर एक्सप्रेशन जिससे नया उपयोगकर्ता नाम मेल खाना चाहिए।
            passwordMinLength:
              type: integer
              description: पासवर्ड की न्यूनतम लंबाई, वर्णों में (`PASSWORD_MIN_LENGTH`)।
            passwordMaxBytes:
              type: integer
              description: पासवर्ड की अधिकतम लंबाई, UTF-8 के बाइट में।
            customTimeControls:
              type: boolean
              description: क्या चुनौतियों और निजी बाज़ियों में कस्टम टाइम कंट्रोल इस्तेमाल हो सकते हैं।
            reportsPerDay:
              type: integer
              description: एक खिलाड़ी 24 घंटे में कितनी शिकायतें दर्ज कर सकता है (`REPORTS_PER_DAY`)।
            wsMaxMessageBytes:
              type: integer
              description: क्लाइंट द्वारा भेजा जा सकने वाला सबसे बड़ा WebSocket संदेश, बाइट में।
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: एक आधिकारिक टाइम कंट्रोल।
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: श्रेणी की आईडी, मिनट और इंक्रीमेंट के सेकंड (`3+2`)।
        baseSec:
          type: number
          minimum: 0
          description: मूल समय, सेकंड में।
        incSec:
          type: number
          minimum: 0
          description: प्रति चाल इंक्रीमेंट, सेकंड में।
    AccountView:
      type: object
      description: खाता, जैसा उसका खिलाड़ी उसे देखता है (साइन-इन जवाबों और `GET /account/me` का `user`)।
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: खाते की आईडी।
        username:
          type: string
          description: उपयोगकर्ता नाम।
        email:
          type: string
          format: email
          description: ईमेल पता।
        emailVerified:
          type: boolean
          description: क्या पते की पुष्टि हो चुकी है।
        mfaEnabled:
          type: boolean
          description: क्या दो-चरणीय सत्यापन चालू है।
        googleLinked:
          type: boolean
          description: क्या कोई Google खाता जुड़ा है।
        hasPassword:
          type: boolean
          description: 'Google के ज़रिए बने ऐसे खाते के लिए `false`, जिसने अभी तक पासवर्ड सेट नहीं किया है।'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: क्या नाम से दी गई सीधी चुनौतियाँ स्वीकार की जाती हैं (`PUT /account/preferences` देखें)।
        createdAt:
          type: integer
          format: int64
          description: खाता कब बनाया गया (epoch से मिलीसेकंड)।
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: पिछला साइन-इन (epoch से मिलीसेकंड), या `null`।
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: लिंक की प्रतीक्षा कर रहे ईमेल बदलाव का नया पता, या `null`।
    SessionAnswer:
      type: object
      description: एक नया सेशन।
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: सेशन टोकन, `Authorization` हेडर और WebSocket के लिए।
        expiresAt:
          type: integer
          format: int64
          description: सेशन का निश्चित अंत (epoch से मिलीसेकंड); निष्क्रियता सीमा उसे इससे पहले भी ख़त्म कर सकती है।
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: दो-चरणीय सत्यापन वाले साइन-इन का दूसरा चरण; `POST /auth/login/mfa` से आगे बढ़ें।
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: इस चरण का टोकन, `POST /auth/login/mfa` के लिए।
        expiresIn:
          type: integer
          const: 300
          description: चरण पूरा करने के लिए बचे सेकंड।
    LoginAnswer:
      description: एक सेशन, या दो-चरणीय सत्यापन वाले साइन-इन का दूसरा चरण।
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: पहला Google साइन-इन; `POST /auth/sso/complete` से आगे बढ़ें।
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: '`POST /auth/sso/complete` के लिए टिकट, 10 मिनट तक मान्य।'
        suggestedUsername:
          type: string
          description: Google नाम या पते से बना उपयोगकर्ता नाम, या कुछ भी उपयुक्त न हो तो `""`।
    SsoNeedsPassword:
      type: object
      description: पासवर्ड वाला एक खाता यह पता इस्तेमाल करता है; `POST /auth/sso/google/link` से आगे बढ़ें। अभी कुछ भी जोड़ा नहीं गया है।
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: '`POST /auth/sso/google/link` के लिए टिकट।'
        username:
          type: string
          description: उस खाते का उपयोगकर्ता नाम (इसे केवल वही देखता है जिसने Google के सामने साबित किया है कि यह पता उसका है)।
        expiresIn:
          type: integer
          const: 600
          description: टिकट कितने सेकंड तक मान्य रहता है।
    SsoFinishAnswer:
      description: '`POST /auth/sso/google/finish` का जवाब।'
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Google साइन-इन का एक प्रयास।
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: प्रयास, `POST /auth/sso/google/finish` के लिए।
        authUrl:
          type: string
          format: uri
          description: सिस्टम ब्राउज़र में खोलने के लिए Google URL, जाँचने के बाद।
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: वह `state` जिसे Google को वापस भेजना होगा।
        expiresIn:
          type: integer
          const: 600
          description: प्रयास कितने सेकंड तक मान्य रहता है।
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: उपयोगकर्ता नाम; फिर सर्वर के नियम लागू होते हैं (विवरण देखें)।
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: ईमेल पता। आगे-पीछे के ख़ाली स्थान हटाकर छोटे अक्षरों में सहेजा जाता है।
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: पासवर्ड; फिर पासवर्ड के नियम लागू होते हैं।
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: उपयोगकर्ता नाम, या ईमेल पता (`@` वाला कोई भी टेक्स्ट)।
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: वैकल्पिक। साइन-इन वाले डिवाइस की सूची में दिखाया जाता है (जैसे `Scacelith 1.4 (Windows)`)।
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: साइन-इन जवाब (या Google साइन-इन के जवाब) का `mfaToken`।
        code:
          type: string
          maxLength: 32
          description: वैकल्पिक। 6 अंकों का ऑथेंटिकेटर कोड, या रिकवरी कोड।
        recoveryCode:
          type: string
          maxLength: 32
          description: वैकल्पिक। रिकवरी कोड। `code` और `recoveryCode` में से एक ज़रूरी है।
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: ईमेल पता।
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: रीसेट लिंक का `token` पैरामीटर।
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: नया पासवर्ड; रजिस्ट्रेशन के पासवर्ड नियम लागू होते हैं।
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: क्लाइंट के `codeVerifier` का S256 PKCE चैलेंज (`BASE64URL(SHA-256(codeVerifier))`)।
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: '`127.0.0.1` पर क्लाइंट के लिसनर का पोर्ट।'
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: पेज के `codeVerifier` का S256 PKCE चैलेंज (`BASE64URL(SHA-256(codeVerifier))`)।
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`POST /auth/sso/google/start` का `attemptId`।'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: PKCE वेरिफ़ायर; इसका SHA-256 `start` को दिए गए चैलेंज से मेल खाना चाहिए।
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state`, जैसा Google ने वापस भेजा।'
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: '`code`, जैसा Google ने वापस भेजा (स्पेस के बिना प्रिंट होने योग्य ASCII)।'
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: वैकल्पिक। `iss`, जैसा Google ने वापस भेजा, अगर भेजा हो।
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`finish` का `linkTicket`, 10 मिनट तक मान्य।'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: खाते का पासवर्ड।
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`finish` का `ssoTicket`, 10 मिनट तक मान्य।'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: उपयोगकर्ता नाम; रजिस्ट्रेशन के नियम लागू होते हैं।
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: सक्रिय सेशन, सबसे हाल में इस्तेमाल हुआ सबसे पहले।
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: एक सक्रिय सेशन (साइन-इन वाला डिवाइस)।
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: सेशन की आईडी, `DELETE /auth/sessions/{id}` के लिए।
        createdAt:
          type: integer
          format: int64
          description: साइन-इन का समय (epoch से मिलीसेकंड)।
        lastSeenAt:
          type: integer
          format: int64
          description: पिछला इस्तेमाल (epoch से मिलीसेकंड), अधिक से अधिक हर 5 मिनट में अपडेट होता है (सर्वर के काफ़ी पीछे चलने पर इससे भी देर से)।
        expiresAt:
          type: integer
          format: int64
          description: निश्चित अंत (epoch से मिलीसेकंड); निष्क्रियता सीमा सेशन को इससे पहले भी ख़त्म कर सकती है।
        clientLabel:
          type:
            - string
            - 'null'
          description: साइन-इन का `clientLabel`, या अगर उसने कोई नहीं भेजा तो `null`।
        current:
          type: boolean
          description: क्या यही वह सेशन है जिससे अनुरोध किया जा रहा है।
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: हर उस श्रेणी का एक रिकॉर्ड जिसमें खिलाड़ी ने रेटेड बाज़ियाँ खेली हैं।
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: सक्रिय दंड।
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: 'निलंबन के दौरान `{ until }`, नहीं तो `null`।'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: एक श्रेणी का रेटिंग रिकॉर्ड।
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: श्रेणी की आईडी।
        rating:
          type: integer
          description: रेटिंग।
        games:
          type: integer
          minimum: 0
          description: इस श्रेणी में खेली गई बाज़ियाँ (गिनी गई हों या नहीं)।
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: अब तक की सबसे ऊँची रेटिंग।
        provisional:
          type: boolean
          description: 'जब तक रेटिंग अनरेटेड है या उसमें `PROVISIONAL_GAMES` से कम गिनी गई बाज़ियाँ हैं, तब तक `true` (गेम इसे `1510?` के रूप में दिखाता है)।'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: दंड का प्रकार।
        reason:
          type:
            - string
            - 'null'
          description: बताया गया कारण, अगर कोई हो।
        startsAt:
          type: integer
          format: int64
          description: शुरुआत (epoch से मिलीसेकंड)।
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: अंत (epoch से मिलीसेकंड), दंड स्थायी होने पर `null`।
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: निलंबन का अंत (epoch से मिलीसेकंड), स्थायी होने पर `null`।
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: 'नाम से दी गई सीधी चुनौतियाँ स्वीकार करने के लिए `all`, अस्वीकार करने के लिए `none`।'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: मौजूदा पासवर्ड।
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: नया पासवर्ड; रजिस्ट्रेशन के पासवर्ड नियम लागू होते हैं।
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: खाते का पासवर्ड।
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: लंबित सीक्रेट का एक कोड, ठीक 6 अंक।
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: खाते का पासवर्ड।
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: वैकल्पिक; दो-चरणीय सत्यापन होने पर ज़रूरी (या `recoveryCode`)। ऑथेंटिकेटर कोड, या रिकवरी कोड।
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: वैकल्पिक। रिकवरी कोड (`xxxx-xxxx-xx`; छोटे-बड़े अक्षर, स्पेस और डैश से फ़र्क़ नहीं पड़ता)।
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: खाते का पासवर्ड।
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: ऑथेंटिकेटर कोड (रिकवरी कोड अस्वीकार किया जाता है)।
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: नया पता; आगे-पीछे के ख़ाली स्थान हटाकर और छोटे अक्षरों में बदलकर, फिर रजिस्ट्रेशन के पते की तरह जाँचा जाता है।
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: खाते का पासवर्ड।
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: वैकल्पिक; दो-चरणीय सत्यापन होने पर ज़रूरी (या `recoveryCode`)। ऑथेंटिकेटर कोड, या रिकवरी कोड।
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: वैकल्पिक। रिकवरी कोड।
    TotpSetup:
      type: object
      description: ऑथेंटिकेटर ऐप के लिए लंबित सीक्रेट।
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: base32 में सीक्रेट, ऐप में टाइप करने के लिए।
        uri:
          type: string
          format: uri
          description: '`otpauth://totp/...` URI, QR कोड के रूप में दिखाने के लिए।'
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: प्रति चरण सेकंड।
    RecoveryCodeList:
      type: array
      description: 10 रिकवरी कोड, जो केवल इसी एक बार दिखाए जाते हैं। हर कोड एक बार काम करता है।
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: बाज़ी का एक पक्ष।
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: बाज़ी के रिकॉर्ड में नाम (हटाए गए खाते के लिए `deleted#<id>`)।
        rating:
          type:
            - integer
            - 'null'
          description: शुरुआत में रेटिंग, अज्ञात होने पर `null`।
        ratingAfter:
          type:
            - integer
            - 'null'
          description: बाज़ी के बाद की रेटिंग। रेटेड बाज़ी में यह हमेशा होती है; `null` केवल उस बाज़ी के लिए जो रेटिंग में नहीं गिनी जाती (कैज़ुअल, कस्टम, रद्द)।
        ratingDiff:
          type:
            - integer
            - 'null'
          description: रेटिंग में बदलाव; जब रेटिंग के नियमों के अनुसार रेटिंग नहीं बदलती, तब `0` (FIDE का शून्य स्कोर, अनरेटेड प्रतिद्वंद्वी, किसी अनरेटेड खिलाड़ी की शुरुआती बाज़ियाँ); `ratingAfter` की तरह `null`।
    GameSummary:
      type: object
      description: सहेजी गई बाज़ी का सारांश।
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: बाज़ी की आईडी।
        category:
          type: string
          description: आधिकारिक श्रेणी की आईडी (`3+2`), या `custom`।
        rated:
          type: boolean
          description: क्या बाज़ी रेटिंग में गिनी जाती है।
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: सेकंड में टाइम कंट्रोल (`180+2`)।
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (बाज़ी के कोड देखें)।'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: समाप्ति के कारण का कोड (बाज़ी के कोड देखें)।
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: परिणाम, रद्द बाज़ी के लिए `*`।
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: अर्ध-चालों की संख्या।
        startedAt:
          type: integer
          format: int64
          description: शुरुआत (epoch से मिलीसेकंड)।
        endedAt:
          type: integer
          format: int64
          description: अंत (epoch से मिलीसेकंड)।
    Termination:
      type: string
      description: समाप्ति के कारण का नाम (बाज़ी के कोड देखें); ऐसे कोड के लिए `Unknown`, जिसे प्रोटोकॉल नहीं जानता।
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: एक खिलाड़ी की ओर से बाज़ी का सारांश।
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: खिलाड़ी का पक्ष।
    HistoryGameSummary:
      description: साइन इन किए हुए खिलाड़ी के इतिहास की एक बाज़ी।
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: मूल समय, मिलीसेकंड में।
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: इंक्रीमेंट, मिलीसेकंड में।
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: खिलाड़ी की ओर से नतीजा।
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: इस पेज की बाज़ियाँ, सबसे नई पहले।
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: अगले पेज के लिए `before` के रूप में भेजी जाने वाली आईडी, या आख़िरी पेज पर `null`।
        total:
          type: integer
          minimum: 0
          description: सभी पेजों में फ़िल्टर से मेल खाने वाली बाज़ियों की संख्या।
    MoveRecord:
      type: object
      description: बाज़ी की एक अर्ध-चाल।
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: UCI नोटेशन में चाल, प्रमोशन के लिए `n`, `b`, `r` या `q` जोड़कर।
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: चाल के लिए गिना गया समय (ms), रिकॉर्ड में न हो तो `null`।
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: चाल के बाद चाल चलने वाले की घड़ी (ms), रिकॉर्ड में न हो तो `null`।
    PgnTagsView:
      type: object
      description: मुख्य PGN टैग, दिखाने के लिए। यहाँ `Termination` समाप्ति के कारण का नाम है; PGN फ़ाइल PGN मानक के मान इस्तेमाल करती है।
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` या `<SERVER_NAME> casual <category>`।'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`।'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: UTC में शुरुआत की तारीख़।
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: शुरुआत में रेटिंग, या `"-"`।
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: शुरुआत में रेटिंग, या `"-"`।
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: बाज़ी का रिकॉर्ड, उसकी चालों और घड़ियों के साथ। इसमें बाज़ी के सारांश के फ़ील्ड होते हैं, `color` और `outcome` के बिना।
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: मूल समय, मिलीसेकंड में।
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: इंक्रीमेंट, मिलीसेकंड में।
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: '`status` का नाम।'
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: उस बाज़ी की आईडी जिसका यह रीमैच है, या `null`।
            moves:
              type: array
              description: हर अर्ध-चाल के लिए एक प्रविष्टि।
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: केवल तब, जब टोकन वाले खिलाड़ी ने यह बाज़ी खेली हो; उसका पक्ष।
            reportable:
              type: boolean
              description: केवल तब, जब टोकन वाले खिलाड़ी ने यह बाज़ी खेली हो; `true` जब `POST /reports` अभी इस बाज़ी के लिए प्रतिद्वंद्वी की शिकायत स्वीकार करेगा (बाज़ी 7 दिनों के भीतर ख़त्म हुई, दैनिक कोटा पूरा नहीं हुआ है, और इस बाज़ी के लिए प्रतिद्वंद्वी की शिकायत पहले से नहीं की गई है)।
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: उपयोगकर्ता नाम, जैसा खिलाड़ी ने लिखा।
        createdAt:
          type: integer
          format: int64
          description: खाता कब बनाया गया (epoch से मिलीसेकंड)।
        ratings:
          type: array
          description: केवल आधिकारिक श्रेणियाँ, सर्वर के क्रम में।
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: हर सहेजी गई बाज़ी, कैज़ुअल और रद्द बाज़ियों सहित।
            rated:
              type: integer
              minimum: 0
              description: रेटेड बाज़ियाँ, रेटिंग रिकॉर्ड से जोड़कर।
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: उपयोगकर्ता नाम, जैसा खिलाड़ी ने लिखा।
        games:
          type: array
          description: इस पेज की बाज़ियाँ, सबसे नई पहले।
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: जब भी पेज भरा हो, आख़िरी बाज़ी की आईडी (तब अगला पेज ख़ाली हो सकता है), नहीं तो `null`।
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: श्रेणी की आईडी।
        minGames:
          type: integer
          minimum: 0
          description: सूची में आने के लिए किसी रिकॉर्ड को जितनी गिनी गई बाज़ियाँ चाहिए (`PROVISIONAL_GAMES`)।
        updatedAt:
          type: integer
          format: int64
          description: लीडरबोर्ड की गणना कब हुई (epoch से मिलीसेकंड)।
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: PGN टेक्स्ट, UTF-8 के अधिकतम 65,536 बाइट। केवल पहली बाज़ी इस्तेमाल होती है।
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: वैकल्पिक। चित्र का आकार।
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: वैकल्पिक। बोर्ड पर नीचे की ओर दिखने वाला पक्ष।
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: वैकल्पिक। प्रति चाल मिलीसेकंड, पूर्णांक मान वाली JSON संख्या।
        coords:
          type: boolean
          default: true
          description: वैकल्पिक। क्या बोर्ड के चारों ओर फ़ाइल के अक्षर और रैंक की संख्याएँ बनाई जाएँ।
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: बाज़ी, पूर्णांक के रूप में या 1 से 16 अंकों की स्ट्रिंग के रूप में।
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: प्रतिद्वंद्वी का उपयोगकर्ता नाम, जैसा बाज़ी के रिकॉर्ड में है या जैसा अभी है, छोटे-बड़े अक्षरों का भेद किए बिना। यह ख़ाली नहीं हो सकता।
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: शिकायत किस बारे में है।
        comment:
          type:
            - string
            - 'null'
          description: वैकल्पिक। कंट्रोल वर्ण (टैब और लाइन फ़ीड को छोड़कर) और टेक्स्ट के आगे-पीछे के ख़ाली स्थान हटाने के बाद अधिकतम 500 वर्ण।
    AccountExport:
      type: object
      description: सर्वर खाते के बारे में जो कुछ भी रखता है (समय epoch से मिलीसेकंड में)।
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: एक्सपोर्ट कब बनाया गया।
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`।'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`।'
        notes:
          type: array
          description: फ़ाइल में क्या है और क्या छोड़ा गया है, खिलाड़ी के लिए सरल अंग्रेज़ी में।
          items:
            type: string
        account:
          description: '`GET /account/me` वाला खाते का व्यू, `googleEmail` के साथ।'
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: जुड़े हुए Google खाते का पता, या `null`।
        ratings:
          type: array
          description: पूरे रेटिंग रिकॉर्ड।
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: किसी प्रतिद्वंद्वी के धोखाधड़ी करते पाए जाने के बाद लौटाए गए रेटिंग अंक, हर UTC दिन और श्रेणी के हिसाब से जोड़कर, सबसे नए पहले। न बाज़ियाँ बताई जाती हैं, न धोखेबाज़ों के नाम।
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: हर सहेजा गया सेशन, सबसे नया पहले, बिना किसी टोकन के। रिटेंशन की सफ़ाई अवधि ख़त्म हो चुके सेशन को हटा देती है, और साइन आउट हुए सेशन को साइन-आउट के एक दिन बाद।
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: सुरक्षा घटनाएँ, सबसे नई पहले, `RETENTION_SECURITY_DAYS` तक रखी जाती हैं।
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: हर दंड, हटाए जा चुके दंडों सहित। मॉडरेटर का नाम कभी शामिल नहीं होता।
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: खिलाड़ी की छोड़ी गई, रद्द और "समय पर पहली चाल नहीं" वाली बाज़ियों के लिए दर्ज आचरण घटनाएँ, 30 दिन तक रखी जाती हैं।
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: खिलाड़ी द्वारा की गई शिकायतें।
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: बाज़ियों की संख्या।
            list:
              type: array
              description: हर बाज़ी, सबसे नई पहले, `GET /account/games` के सारांशों के रूप में। चालें `GET /games/{id}` पर हैं और PGN `GET /games/{id}/pgn` पर।
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: पूरा रेटिंग रिकॉर्ड।
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: क्या खिलाड़ी अनरेटेड चरण से बाहर आ चुका है।
            countedGames:
              type: integer
              minimum: 0
              description: रेटिंग में गिनी गई बाज़ियाँ।
            updatedAt:
              type: integer
              format: int64
              description: रिकॉर्ड आख़िरी बार कब बदला।
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: उस दिन का 00:00 UTC (epoch से मिलीसेकंड)।
        category:
          type: string
        points:
          type: integer
          description: उस दिन उस श्रेणी में लौटाए गए अंक।
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: सेशन कब साइन आउट हुआ, या `null`।
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: साइन-इन का पता, `RETENTION_IP_DAYS` के बाद मिटा दिया जाता है।
    SecurityEvent:
      type: object
      description: |-
        एक सुरक्षा घटना। `ip` केवल उन कामों के लिए दिया जाता है जो साइन इन रहते हुए, खाते के पासवर्ड (और दूसरे फ़ैक्टर) से, या खाते के पते पर भेजे गए लिंक से किए गए: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` और `account_exported`; हर दूसरे प्रकार में `ip: null` होता है, और `ip` `RETENTION_IP_DAYS` के बाद मिटा दिया जाता है।

        `detail` में केवल ये फ़ील्ड रहते हैं: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` और `method` (`password`, या `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` और `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`। `moderator_action` घटना में केवल `{ action }` रहता है, `ban`, `unban`, `reset_mfa`, `verify_email` और `revoke_sessions` कार्रवाइयों के लिए (मॉडरेटर की बाक़ी कार्रवाइयाँ छोड़ दी जाती हैं)। हर दूसरे प्रकार में `detail: null` होता है। `rating_refund` घटनाएँ छोड़ दी जाती हैं: उनके अंक `ratingRefunds` में हैं।
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: घटना का प्रकार (`login`, `password_changed`...)।
        at:
          type: integer
