          description: '`busy` (डेटाबेस लॉक रहा; बॉडी में `retryAfter: 1`, कोई `Retry-After` हेडर नहीं), `server_busy` (सेशन की जाँच में डेटाबेस लॉक मिला), `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: बाज़ी को PGN फ़ाइल के रूप में डाउनलोड करें
      description: |-
        वही बाज़ी PGN फ़ाइल के रूप में: `\n` लाइन एंडिंग वाली एक बाज़ी, और चालों का टेक्स्ट 80 कॉलम से छोटी पंक्तियों में। टोकन के साथ या उसके बिना, जवाब एक जैसा होता है।

        टैग, इसी क्रम में: `Event` (`<SERVER_NAME> rated <category>` या `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (UTC में शुरुआत की तारीख़), `Round`, `White`, `Black`, `Result` (रद्द बाज़ी के लिए `*`), `UTCDate` और `UTCTime` (शुरुआत), `WhiteElo` और `BlackElo` (शुरुआत की रेटिंग, या `-`), `WhiteRatingDiff` और `BlackRatingDiff` (बदलाव, जैसे `+10` और `-10`, हर रेटेड बाज़ी में; जब रेटिंग के नियमों के अनुसार रेटिंग नहीं बदलती, तब `+0`; कैज़ुअल, कस्टम या रद्द बाज़ी में दोनों में से कोई नहीं होता), `TimeControl` (सेकंड में), `Termination` (PGN मानक का एक मान: `normal`; `time forfeit`, यानी फ़्लैग गिरना, तब भी जब बाज़ी ड्रॉ पर ख़त्म हो; `abandoned`; `rules infraction`, यानी दूसरी अवैध चाल या फ़ेयर-प्ले के कारण हार; `unterminated`, यानी रद्द बाज़ी), `PlyCount`, `ScacelithGameId` (दशमलव आईडी)।

        हर चाल के साथ `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}` होता है: चाल चलने वाले की घड़ी चाल के बाद, और उस चाल के लिए गिना गया समय, सेकंड के दसवें हिस्से में (काटकर, पूर्णांकन के बिना)। रिकॉर्ड में कोई मान न हो, तो उसे छोड़ दिया जाता है। आख़िरी चाल के बाद समाप्ति का कारण शब्दों में आता है, फिर परिणाम।

        **लिमिट:** `public_read` (टोकन होने पर प्रति खिलाड़ी, टोकन के बिना प्रति क्लाइंट)।
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: PGN फ़ाइल।
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`।'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'PGN टेक्स्ट, UTF-8 में (`Content-Type: application/x-chess-pgn; charset=utf-8`)।'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: अधिकतम 16 अंकों का धनात्मक पूर्णांक (2^53 से कम) नहीं है; `invalid_request`: मान्य URL एन्कोडिंग नहीं है।'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: टोकन भेजा गया, पर वह मान्य नहीं है।'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: ऐसी कोई बाज़ी नहीं है।'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `public_read` लिमिट या खाते का बजट।'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: अन्य कारणों के साथ, तब भी जब सहेजी गई चालों को दोबारा चलाकर सहेजे गए अंत तक नहीं पहुँचा जा सकता (सर्वर इसे लॉग करता है)।'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (डेटाबेस लॉक रहा; बॉडी में `retryAfter: 1`, कोई `Retry-After` हेडर नहीं), `server_busy` (सेशन की जाँच में डेटाबेस लॉक मिला), `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: इस सर्वर की किसी बाज़ी को एनिमेटेड GIF के रूप में डाउनलोड करें
      description: |-
        बाज़ी, एनिमेटेड GIF के रूप में। नाम और रेटिंग बाज़ी के रिकॉर्ड से लिए जाते हैं (शुरुआत की रेटिंग, हटाया गया खाता `deleted#<id>` के रूप में), और परिणाम व समाप्ति (`Resignation`, `Loss on time`...) भी।

        जाँच इस क्रम में होती है: `gif_disabled`, चित्र के विकल्प (`size`, `orientation`, `delay`, `coords`), बाज़ी की आईडी, बाज़ी, उसकी लंबाई।

        **सेशन ज़रूरी:** कोटा प्रति खाता गिना जाता है। **लिमिट:** हर अनुरोध पर `gif`; `gif_user_min`, `gif_user_hour`, `gif_ip_min` और `gif_ip_hour` केवल तब, जब GIF बनाना पड़े (अनुभाग का विवरण देखें)। **समय सीमा:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 सेकंड (डिफ़ॉल्ट रूप से 45 सेकंड)।
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: चित्र का आकार, `small` (32 px के खाने), `medium` (48 px) या `large` (72 px)।
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: बोर्ड पर नीचे की ओर दिखने वाला पक्ष।
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: प्रति चाल मिलीसेकंड (1 से 6 दशमलव अंक)।
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: बोर्ड के चारों ओर फ़ाइल के अक्षर और रैंक की संख्याएँ बनाई जाएँ (`1`) या नहीं (`0`)।
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option`, `field` के साथ (`size`, `orientation`, `delay` या `coords`): अनुमत मानों से बाहर का मान। `invalid_game_id`। `invalid_request`: मान्य URL एन्कोडिंग नहीं है।'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: ऐसी कोई बाज़ी नहीं है। `gif_disabled`: सर्वर ने GIF बंद कर रखे हैं (`GIF_ENABLED=false`; `gif` का टोकन लौटा दिया जाता है)।'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `gif` लिमिट, कोई रेंडर लिमिट, या खाते का बजट।'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF नहीं बन सका (सर्वर कारण लॉग करता है)। `internal_error`।'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`, `retryAfter` (3 से 10 सेकंड) और `Retry-After` के साथ: रेंडरिंग कतार भरी है, या GIF ने ख़ाली थ्रेड के लिए `GIF_QUEUE_TIMEOUT_MS` (10 सेकंड) इंतज़ार किया; अनुरोध ने लिमिट के जो भी टोकन लिए थे, सब लौटा दिए जाते हैं। `busy`: डेटाबेस लॉक रहा (`retryAfter: 1` केवल बॉडी में)। `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: PGN के रूप में भेजी गई किसी भी बाज़ी का एनिमेटेड GIF बनाएँ
      description: |-
        `GET /games/{id}/gif` जैसा ही चित्र, PGN टेक्स्ट के रूप में भेजी गई किसी भी बाज़ी के लिए: गेम में सहेजी गई बाज़ी, किसी दूसरी साइट का एक्सपोर्ट, हाथ से टाइप की गई बाज़ी। टेक्स्ट की केवल पहली बाज़ी इस्तेमाल होती है।

        - PGN रीडर वह सब स्वीकार करता है जो गेम का अपना रीडर स्वीकार करता है: यह सर्वर जो भी PGN लिखता है, और दूसरी साइटों के सामान्य एक्सपोर्ट (टिप्पणियाँ, वेरिएशन, NAG और घड़ी के एनोटेशन छोड़ दिए जाते हैं; चाल संख्याएँ और SAN लचीलेपन से पढ़े जाते हैं; `FEN` टैग शुरुआती स्थिति देता है, जब तक `SetUp` `"0"` न हो)।
        - नाम और रेटिंग `White`, `Black`, `WhiteElo` और `BlackElo` टैग से आते हैं। एक्सेंट वाले अक्षरों के एक्सेंट हटा दिए जाते हैं, प्रिंट होने योग्य ASCII से बाहर के बाक़ी वर्ण `?` बन जाते हैं, और लंबे नाम काट दिए जाते हैं (48 वर्ण)। परिणाम `Result` टैग से आता है, नहीं तो चालों के टेक्स्ट के अंत से। `Termination` टैग दिखाया जाता है, जब तक वह `normal` न हो: तब अंतिम स्थिति ही सब बता देती है (मात, स्टेलमेट)।
        - यह एंडपॉइंट अपनी बॉडी ख़ुद जाँचता है: अज्ञात फ़ील्ड पर, या `pgn` के न होने या स्ट्रिंग न होने पर जवाब `field` के साथ 400 `invalid_request` होता है; ग़लत विकल्प पर जवाब 400 `invalid_option` होता है (`delayMs` JSON संख्या होनी चाहिए, `coords` बूलियन; `null` अस्वीकार किया जाता है)।

        **सेशन ज़रूरी:** कोटा प्रति खाता गिना जाता है। **लिमिट:** `GET /games/{id}/gif` की तरह। **बॉडी की सीमा:** 1,35,168 बाइट, `HTTP_BODY_LIMIT` चाहे जो हो (JSON स्ट्रिंग के रूप में PGN, उसके एस्केप सहित)। **समय सीमा:** डिफ़ॉल्ट रूप से 45 सेकंड।
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: टाइप की गई एक छोटी बाज़ी, निर्देशांकों के बिना
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: हर विकल्प के साथ एक PGN फ़ाइल
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`, `field` के साथ (अज्ञात फ़ील्ड, या `pgn` मौजूद नहीं या स्ट्रिंग नहीं; बॉडी ऑब्जेक्ट न होने पर `field` के बिना); `invalid_json`; `invalid_option`, `field` के साथ (`size`, `orientation`, `delayMs` या `coords`); `invalid_pgn`, `line` और `column` (1 से शुरू, कॉलम वर्णों में) और रीडर के `message` के साथ: अवैध या अस्पष्ट चाल, टूटा हुआ टैग, अज्ञात वेरिएंट, 65,536 बाइट से ज़्यादा।'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: सर्वर ने GIF बंद कर रखे हैं (`GIF_ENABLED=false`; `gif` का टोकन लौटा दिया जाता है)।'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: 1,35,168 बाइट से बड़ी बॉडी।'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `gif` लिमिट, कोई रेंडर लिमिट, या खाते का बजट।'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF नहीं बन सका (सर्वर कारण लॉग करता है)। `internal_error`।'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`, `retryAfter` (3 से 10 सेकंड) और `Retry-After` के साथ: रेंडरिंग कतार भरी है, या GIF ने ख़ाली थ्रेड के लिए बहुत देर इंतज़ार किया; अनुरोध ने लिमिट के जो भी टोकन लिए थे, सब लौटा दिए जाते हैं। `timeout`। सर्वर के काफ़ी पीछे चलने पर (परिचय देखें), `retryAfter` 2 से 5 के साथ `server_busy` भी: अनुरोध प्रोसेस नहीं किया गया।'
