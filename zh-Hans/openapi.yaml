  - name: pages
    x-displayName: HTML 页面
    description: |-
      供浏览器使用的页面，从邮件中的链接打开。这些链接指向 `https://<SERVER_PUBLIC_HOST>`（端口不是 443 时附加 `:<PUBLIC_API_PORT>`），不在 `/api/v1` 下。

      - 这些页面不运行 JavaScript，也不加载任何外部资源。提供页面时带有 `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'`。
      - `GET` 只显示一个按钮或表单，这样邮件扫描程序打开链接时不会把它用掉。更改在 `POST` 时才发生：以 `application/x-www-form-urlencoded` 发送的表单（也接受 JSON 请求体），链接的令牌放在一个隐藏字段中。重复给出的字段会被拒绝。
      - 错误（速率限制、无效字段）也以 HTML 页面返回，标题为“Request refused”（请求被拒绝），状态码为 500 及以上时为“Server error”（服务器错误）。只有在匹配到页面之前就发现的失败（请求目标过长或格式错误、按地址限制层）才以 JSON 返回。
