openapi: 3.1.1
info:
  title: Scacelith 服务器 HTTPS API
  version: "0.9.0"
  summary: 所有 Scacelith 服务器（官方服务器和社区服务器）共用的 HTTPS API。
  description: |-
    每台 Scacelith 服务器，无论是官方的 `caissa.scacelith.com` 还是任何社区服务器，都提供此 HTTPS API。游戏用它处理对局本身以外的一切：注册和登录（包括双重验证和 Google 登录）、账号页面、对局记录、PGN 下载和对局的 GIF 动图、已登录的设备、数据下载、删除账号以及举报。

    实时对弈（匹配、挑战、着法、棋钟）通过同一服务器的 WebSocket（`wss://<host>/ws`）进行，该连接使用本 API 的会话令牌打开；相关说明见 `PROTOCOL.md`，不在本文档中。

    下文给出的默认值是未改动配置的服务器所用的值；社区服务器可能会更改它们（`CONFIG.md` 列出了所有配置项）。

    ## 基础 URL、端口和传输

    - 官方服务器：`https://caissa.scacelith.com/api/v1`，TCP 端口 443。
    - 社区服务器：`https://<SERVER_PUBLIC_HOST>[:<port>]/api/v1`。`API_PORT` 默认为 443；位于 NAT 或代理之后时，棋手使用的端口是 `PUBLIC_API_PORT`。
    - 游戏的 WebSocket 默认使用同一端口（可用 `WS_PORT` 更改；`GET /info` 会告诉客户端它在哪个端口）。
    - 基于 TLS 的 HTTP/1.1。使用 `TLS_MODE=proxy` 时，由服务器前面的反向代理终止 TLS。`TLS_MODE=off`（明文 HTTP）仅用于本地开发。
    - 从邮件链接打开的 HTML 页面（`/verify-email`、`/reset-password`、`/confirm-email-change`）位于服务器根路径下，不在 `/api/v1` 中。健康检查端点在根路径和 `/api/v1` 下都会响应。Google 登录在服务器上没有页面：Google 会把浏览器送回游戏本身，地址为 `127.0.0.1`。
    - 末尾的斜杠会被忽略（`/api/v1/info/` 等同于 `/api/v1/info`），路径参数会经过 URL 解码（不是有效 URL 编码的参数返回 400 `invalid_request`）。

    ## 请求

    - **JSON 请求体。** `POST`、`PUT` 和 `DELETE` 请求携带一个 JSON 对象，并带有 `Content-Type: application/json`。UTF-8 以外的 `charset` 会被拒绝，其他任何内容类型也会被拒绝（415 `unsupported_media_type`）。空请求体视为 `{}`，没有参数的端点接受的正是它（`POST /auth/logout`、`POST /auth/logout-all`、`DELETE /auth/sessions/{id}`）。
    - **大小和时间。** 请求体最多 `HTTP_BODY_LIMIT` 字节（默认 16,384；`POST /gif` 有自己的上限，为 135,168 字节），超出时返回 413 `payload_too_large`。请求体必须在 10 秒内到达，否则返回 408 `request_timeout`。出现这两种错误中的任何一种后，服务器都会关闭连接。
    - **严格的结构定义。** 端点不认识的字段会被拒绝，未标记为可选的字段均为必填，类型和长度都会经过检查。任一检查失败都返回 400 `invalid_request`，并由 `field` 指出字段名（嵌套字段用点号连接，例如 `pow.nonce`）。字符串不得包含控制字符。长度按 UTF-16 码元计算，因此基本多文种平面之外的字符（如表情符号）计为两个。不是 JSON 的请求体返回 400 `invalid_json`。`POST /gif` 和 `POST /reports` 自行检查其请求体（见各端点）。
    - **查询字符串。** 同一参数以第一次出现的为准，未知参数会被忽略，`+` 解码为空格：接受用时类别的端点同时接受 `3%2B2` 和 `3+2`。
    - **方法。** `HEAD` 就是不带响应体的 `GET`。对存在的路径使用 `OPTIONS` 返回 204，并带有 `Allow` 标头。该路径不支持的其他任何方法返回 405 `method_not_allowed`，并带有 `Allow`。
    - **请求目标。** 不得超过 4096 个字符（414 `uri_too_long`）。完全无法解析的请求，或请求头过大、到达过慢的请求，会得到一个空的 400、431 或 408 响应，并且连接会被关闭。
    - **不支持 CORS。** 本 API 为游戏服务，而不是为网页服务。服务器从不发送任何 `Access-Control-*` 标头，因此网页无法读取响应；由于只接受 JSON 请求体，跨站写入需要预检请求，而预检会失败。

    ## 响应和错误

    - 响应为 UTF-8 编码的 JSON，但 PGN 下载（`application/x-chess-pgn`）、GIF 动图（`image/gif`）和 HTML 页面除外。时间为自 1970-01-01 UTC 起的毫秒数。ID 均为整数。对局 ID 最多 16 位数字，但始终小于 2^53，因此 JSON 数字（双精度浮点数）可以精确表示。
    - API 的每个响应都带有 `Cache-Control: no-store`、`X-Content-Type-Options: nosniff`、`Referrer-Policy: no-referrer`、`X-Frame-Options: DENY`、`Cross-Origin-Resource-Policy: same-origin` 和 `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'`（HTML 页面有自己的策略）。使用 `TLS_MODE=native` 时，还带有 `Strict-Transport-Security: max-age=31536000`。
    - 从服务器准备好响应的那一刻起，响应必须在 60 秒内被读完，这只对大型响应（GIF、数据导出、很长的 PGN）有影响。服务器准备响应所花的时间既不计入这 60 秒，也不计入“30 秒内没有任何字节收发即关闭连接”的那 30 秒。

    错误只有一种格式（`Error` 结构）：

    ```json
    { "error": "snake_case_code", "message": "An English sentence.", "retryAfter": 30 }
    ```

    `message` 用于日志记录和兜底显示；客户端应根据 `error` 决定显示什么。`retryAfter`（秒）仅出现在会随时间解除的拒绝中，此时响应还会带有值相同的 `Retry-After` 标头；唯一的例外是读取对局记录、对局、棋手和排行榜时的 503 `busy`，它只有该字段。部分错误会附加字段：`field`（无效输入）、`reason`（`weak_password`、`pow_required`）、`pow`（`pow_required`）、`until`（`banned`）、`line` 和 `column`（`invalid_pgn`）。

    任何端点都可能返回的错误：

    | 状态码 | `error` | 情形 |
    |---|---|---|
    | 400 | `invalid_request` | 请求体不符合端点的结构定义（由 `field` 指出位置），请求目标或 `Content-Length` 格式错误，路径参数不是有效的 URL 编码，或请求体被截断。 |
    | 400 | `invalid_json` | 请求体不是 JSON。 |
    | 401 | `unauthorized` | 在需要会话的端点上没有 `Authorization` 标头。 |
    | 401 | `invalid_token` | 令牌格式错误、已过期、已被吊销或属于已删除的账号；在会话可选的端点上也会如此。 |
    | 404 | `not_found` | 没有该端点。部分端点也使用它：没有该对局、棋手或会话。 |
    | 405 | `method_not_allowed` | 该路径存在，但只支持其他方法（见 `Allow`）。 |
    | 408 | `request_timeout` | 请求体未在 10 秒内到达。 |
    | 413 | `payload_too_large` | 请求体超过 `HTTP_BODY_LIMIT`（`POST /gif` 为 135,168 字节）。 |
    | 414 | `uri_too_long` | 请求目标超过 4096 个字符。 |
    | 415 | `unsupported_media_type` | 请求体不是 `application/json`，或其字符集不是 UTF-8。 |
    | 429 | `rate_limited` | 触发了速率限制（见下文）：带有 `retryAfter` 和 `Retry-After` 标头。 |
    | 500 | `internal_error` | 意外故障。服务器会将其记入日志。 |
    | 503 | `timeout` | 服务器未在 30 秒内响应（默认设置下，导出为 60 秒，GIF 为 45 秒）。 |
    | 503 | `server_busy` | 查询会话或更改账号时发现数据库被锁定（`retryAfter` 为 1），或密码哈希队列已满（见下文）。 |

    读取类端点（对局记录、对局、棋手、排行榜）和导出在数据库持续被锁定时返回 503 `busy`，并带有 `retryAfter: 1`。

    校验或哈希密码的端点还可能返回以下错误之一，两者都带有 5 到 15 秒之间的随机 `retryAfter`：

    - 503 `server_busy`：服务器的密码哈希队列（`PASSWORD_HASH_QUEUE_MAX`）已满，或等待超时。
    - 429 `rate_limited`：队列已半满，而该客户端（一个 IPv4 地址或一个 IPv6 /48）已有 `PASSWORD_HASH_WAITERS_PER_SOURCE` 个哈希在等待。此 429 会退还该请求所占用的速率限制令牌。

    此时没有任何更改，也不计入失败尝试（`POST /auth/sso/google/link` 除外，它的票据尝试次数和账号失败计数在哈希之前就已扣除），重置链接也仍然有效。

    HTML 页面以 HTML 页面的形式返回错误，状态码相同。

    ## 身份验证

    需要会话的端点在 `Authorization` 标头中接受 Bearer 令牌（`bearerAuth` 方案）：

    ```
    Authorization: Bearer sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
    ```

    - **获取令牌。** 令牌（`sct_` 后跟 43 个 base64url 字符）来自 `POST /auth/login`（开启双重验证时，随后还需调用 `POST /auth/login/mfa`）、`POST /auth/sso/google/finish` 和 `POST /auth/sso/google/link`（Google 登录），以及 `POST /auth/sso/complete`。它们都返回 `{ token, expiresAt, user }`。服务器只存储令牌的 SHA-256 哈希值。
    - **必需会话。** 缺少该标头时返回 401 `unauthorized`，并带有 `WWW-Authenticate: Bearer realm="scacelith"`。令牌无效时返回 401 `invalid_token`，并带有 `WWW-Authenticate: Bearer realm="scacelith", error="invalid_token"`。客户端收到 `invalid_token` 时，应丢弃该令牌并重新登录。
    - **可选会话。** 在 `GET /games/{id}`、`GET /games/{id}/pgn`、`GET /players/{username}` 和 `GET /players/{username}/games` 上，会话是可选的。不带该标头时，它们返回公开视图；如果发送了该标头，其中的令牌必须有效。
    - **有效期。** 会话在以下两者中先到者结束：登录后满 `SESSION_MAX_DAYS`（90）天（即 `expiresAt`），或连续 `SESSION_IDLE_DAYS`（30）天未使用。每次使用都会推迟空闲期限；服务器最多每 5 分钟写入一次新值。一个账号最多保留 `MAX_SESSIONS_PER_USER`（10）个会话：超出此数量时，新的登录会吊销最旧的会话。
    - **吊销。** 退出登录（`POST /auth/logout`、`POST /auth/logout-all`、`DELETE /auth/sessions/{id}`）会吊销会话；修改密码（吊销其他会话）、重置密码和删除账号（吊销所有会话）以及管理员也会吊销会话。通过 API 进行的吊销立即生效，用已吊销会话打开的 WebSocket 会被关闭。服务器会将会话查询结果缓存 30 秒，因此通过管理命令（一个独立的进程）进行的吊销会在 30 秒内生效。
    - **作用范围。** 令牌只属于一台服务器，也用于打开该服务器的 WebSocket。切勿将其发送到其他服务器。

    ## 速率限制和其他限流

    限制按以下两种范围之一计算。**客户端：** 一个 IPv4 地址或一个 IPv6 /64（在代理模式下，地址取自 `TRUSTED_PROXIES` 中的地址所发送的 `X-Forwarded-For`）；部分限制除了分别计算每个 /64 网络外，还会把每个 IPv6 /48 作为一个整体计算。**棋手：** 已登录的账号，无论其地址为何；在会话可选的端点上按棋手计算的限制，对不带令牌的请求改为按客户端计算。

    每个限制都是一个令牌桶，可容纳 `limit` 个请求，并以 `limit / window` 的速率持续补充；`retryAfter` 是距下一个令牌的时间。标为*共享*的限制还会在同样长度的滑动窗口内计数，使任何窗口内的请求数都不会明显超过 `limit`。所有限制都在整台服务器范围内计数。当端点的某个限制拒绝请求时，其他限制为该请求占用的令牌会被退还。拒绝时返回 429 `rate_limited`，并带有 `retryAfter` 和 `Retry-After`。

    - **按地址限制层。** 每个请求（任何路径和方法，包括健康检查端点和 WebSocket 升级）首先从其客户端的额度中占用一个令牌：每分钟 `HTTP_RATE_PER_IP`（600）个，允许半分钟的突发量；每个 IPv6 /48 为 `HTTP_RATE_PER_PREFIX`（4 x `HTTP_RATE_PER_IP`）。一个客户端同时进行中的请求最多为 `IP_MAX_INFLIGHT`（32 x `WORKERS`）个（超出时 `retryAfter` 为 1）。被拒绝后仍继续请求的客户端会被封锁：一分钟内被拒绝 `ABUSE_BLOCK_REFUSALS_PER_MIN`（600）次将被封锁 1 分钟，此后 6 小时内每次再被封锁，时长依次为 4、16 和 60 分钟。`auth`、`auth_*` 和 `reauth` 限制的一次拒绝计为 5 次；按棋手计算的限制从不计入。`ABUSE_EXEMPT` 中的地址跳过这一层，但不跳过账号额度和端点限制。
    - **账号额度。** 每个携带有效会话令牌的请求还会计入其账号：所有端点合计每分钟 `USER_RATE_PER_MIN`（120）个，无论来自哪个地址，允许半分钟的突发量。
    - **端点限制：**

    | 限制 | 默认值 | 计数单位 | 端点 |
    |---|---|---|---|
    | `auth` | `AUTH_RATE_PER_IP`（20）/ 10 分钟，共享 | 客户端；每个 IPv6 /48 为 `AUTH_RATE_PER_PREFIX`（5 x `AUTH_RATE_PER_IP`） | `POST /auth/register`、`/auth/login`、`/auth/login/mfa`、`/auth/verify-email/resend`、`/auth/password/forgot`、`/auth/password/reset`、`/auth/sso/google/link`、`/auth/sso/complete`；`POST /verify-email`、`/reset-password`、`/confirm-email-change` |
    | `auth_register` | `AUTH_REGISTER_PER_HOUR`（10）/ 小时，共享 | 客户端；每个 IPv6 /48 为其 3 倍 | `POST /auth/register` |
    | `auth_mail` | `AUTH_MAIL_PER_HOUR`（10）/ 小时，共享 | 客户端；每个 IPv6 /48 为其 3 倍 | `POST /auth/verify-email/resend` |
    | `auth_forgot` | `AUTH_FORGOT_PER_HOUR`（3）/ 小时，共享 | 客户端；每个 IPv6 /48 为其 3 倍 | `POST /auth/password/forgot` |
    | `auth_forgot_day` | `AUTH_FORGOT_PER_DAY`（10）/ 24 小时，共享 | 客户端；每个 IPv6 /48 为其 3 倍 | `POST /auth/password/forgot` |
    | `auth_reset` | `AUTH_RESET_PER_HOUR`（10）/ 小时，共享 | 客户端；每个 IPv6 /48 为其 3 倍 | `POST /auth/password/reset`、`POST /reset-password` |
    | `reauth` | 数值同 `auth`，但使用独立的令牌桶，共享 | 客户端和 IPv6 /48 | 需要输入密码的账号更改（见“重新验证身份”），以及 `POST /account/export` |
    | `reauth_user` | `AUTH_REAUTH_PER_USER`（10）/ 10 分钟，共享 | 棋手 | 与 `reauth` 相同的端点 |
    | `account` | 60 / 分钟 | 棋手 | `GET /account/me`、`PUT /account/preferences` |
    | `account_games` | 60 / 分钟 | 棋手 | `GET /account/games` |
    | `account_export` | 5 / 小时，共享 | 棋手 | `POST /account/export`（在 `reauth` 之前检查；每次尝试都计数） |
    | `sessions` | 60 / 分钟 | 棋手 | `POST /auth/logout`、`/auth/logout-all`、`GET /auth/sessions`、`DELETE /auth/sessions/{id}` |
    | `public_read` | 60 / 分钟 | 棋手（不带令牌时按客户端） | `GET /players/{username}`、`/players/{username}/games`、`/games/{id}`、`/games/{id}/pgn`（四者共用一个令牌桶） |
    | `gif` | 30 / 分钟 | 棋手 | `GET /games/{id}/gif`、`POST /gif`（两者共用一个令牌桶） |
    | `gif_user_min`、`gif_user_hour` | `GIF_USER_RENDERS_PER_MIN`（4）/ 分钟和 `GIF_USER_RENDERS_PER_HOUR`（30）/ 小时，共享 | 棋手 | 同样这两个端点，仅在需要生成 GIF 时（而非取自缓存） |
    | `gif_ip_min`、`gif_ip_hour` | `GIF_IP_RENDERS_PER_MIN`（12）/ 分钟和 `GIF_IP_RENDERS_PER_HOUR`（120）/ 小时，共享 | 客户端（其所有账号合计）；每个 IPv6 /48 为其 3 倍 | 同上，条件相同 |
    | `reports` | 30 / 小时 | 棋手 | `POST /reports` |
    | `sso_start` | 30 / 10 分钟，共享 | 客户端；每个 IPv6 /48 为 90 | `POST /auth/sso/google/start` |
    | `sso_finish` | 30 / 分钟 | 客户端 | `POST /auth/sso/google/finish` |
    | `page` | 60 / 分钟 | 客户端 | `GET /verify-email`、`/reset-password`、`/confirm-email-change` |

    `GET /info` 和 `GET /leaderboard` 没有自己的限制，只受按地址限制层约束。有多个限制的端点按其说明中给出的顺序检查这些限制。

    服务器按以下顺序处理请求：按地址限制层，然后是健康检查端点；端点匹配；身份验证；账号额度（请求携带会话时）；端点的限制；请求体；端点本身（GIF 端点仅在确实需要生成 GIF 时才占用其渲染限制）。因此，因令牌问题被拒绝的请求不会消耗端点的任何令牌，而请求体无效的请求则会消耗。

    其他限流，由端点自身返回：

    - **同一登录名的登录失败**（用户名或邮箱）：从第 `AUTH_FAILURES_PER_ACCOUNT`（5）次失败起，每次尝试都必须等待前一次的两倍时长（2 秒、4 秒，依此类推，最长 15 分钟）：返回 429 `too_many_attempts`，并带有 `retryAfter`。连续一小时没有失败后，计数器清零。
    - **登录时的第二重验证失败：** 从该账号第 5 次输错验证码起，适用同样的规则。一个登录步骤最多接受 5 次错误的验证码。
    - **同一账号的第二重验证码：** 每 15 分钟最多 `AUTH_MFA_PER_ACCOUNT`（10）个验证码（身份验证器验证码或恢复码，无论对错），无论来自哪个地址，登录和重新验证身份时都计算在内；超出后，在检查验证码之前就返回 429 `too_many_attempts`，因此恢复码不会被消耗。
    - **同一账号的重新验证身份失败**（密码或验证码错误）：同样的规则（429 `too_many_attempts`），由所有需要重新验证身份的端点共享。
    - **邮件：** 每个地址每 5 分钟最多一封确认或重置邮件（响应保持不变）；每个地址每小时最多一封“有人试图使用你的地址”通知。
    - **举报：** 每位棋手 24 小时内最多 `REPORTS_PER_DAY`（5）次，超出时返回 429 `report_limit`。

    ## 工作量证明

    当 `POW_REGISTER_BITS` 大于 0 时（默认 18；`GET /info` 以 `pow.register` 给出），`POST /auth/register` 始终需要工作量证明。`POST /auth/login` 和 `POST /auth/sso/google/link`（两者使用同一种质询）仅在服务器发现一波登录失败后的 5 分钟内才需要（由 `POW_LOGIN_TRIGGER_PER_MIN` 触发，难度为 `POW_LOGIN_BITS`）；客户端可从响应中得知。

    1. 不带证明（或证明被拒绝）的请求返回 428 `pow_required`，并带有 `reason` 和一个 `pow` 质询 `{ challenge, bits, expiresAt }`。
    2. 找出一个随机数（nonce）：一个最多 20 位数字的十进制字符串，使 `SHA-256(challenge + ":" + nonce)` 以 `bits` 个零位开头（从第一个字节的最高有效位算起）。18 位平均约需 260,000 次哈希。
    3. 再次发送同一请求，并在请求体中加入 `"pow": { "challenge": "...", "nonce": "123456" }`。

    质询的有效期为 2 分钟，只能使用一次，并且只适用于一个端点和一个客户端网络（一个 IPv4 地址或 IPv6 /64）。质询带有签名，因此在它被送回之前，服务器不保存任何与之相关的信息。`reason` 说明证明被拒绝的原因：`required`、`malformed`、`signature`、`endpoint`、`network`、`expired`、`bits`、`work` 或 `replayed`。

    ## 重新验证身份

    更改账号时需要再次输入密码；开启双重验证时，还需要第二重验证：

    - 仅需密码：`POST /account/password` 和 `POST /account/mfa/totp/setup`；
    - 密码和身份验证器验证码（不接受恢复码）：`POST /account/mfa/recovery-codes`；
    - 密码和身份验证器验证码或恢复码：`POST /account/mfa/totp/disable`、`POST /account/email`、`POST /account/export` 和 `POST /account/delete`。

    在请求体中，`code` 填写 6 位身份验证器验证码，`recoveryCode` 填写恢复码（`xxxx-xxxx-xx`；大小写、空格和连字符均不影响）。在接受恢复码的地方，也可以把恢复码放在 `code` 中发送。每个验证码只能使用一次：已用过的身份验证器验证码在下一个 30 秒时间步到来之前都会被拒绝，恢复码一经使用即失效。

    | 状态码 | `error` | 情形 |
    |---|---|---|
    | 403 | `invalid_password` | 密码错误。 |
    | 403 | `mfa_code_required` | 已开启双重验证，但既未发送 `code` 也未发送 `recoveryCode`。 |
    | 403 | `invalid_code` | 验证码错误或已被使用。 |
    | 400 | `password_not_set` | 仅使用 Google 登录的账号尚未设置密码（可通过“忘记密码”设置）。 |
    | 429 | `too_many_attempts` | 此账号失败次数过多，或尝试的验证码过多。 |
    | 503 / 429 | `server_busy` / `rate_limited` | 密码哈希队列繁忙。 |

    密码和验证码的失败会计入该账号的失败计数器，并记录为安全事件。

    ## 指标端口

    除 API 端口外，服务器还在指标端口上以明文 HTTP 响应（`METRICS_PORT`，默认 9464，绑定到 `METRICS_BIND`，默认 127.0.0.1；请勿对外公开）。它不属于本 API：`GET /healthz` 返回 `ok`；`GET /readyz` 在启动完成后（每个分片都已重放其日志，所有监听器均已绑定）直到开始关闭之前返回 `ready`，否则返回 503 `not ready`；`GET /metrics` 提供 Prometheus 指标，设置了 `METRICS_TOKEN` 时，需要带有与之完全一致的令牌的 `Authorization: Bearer <token>`。
