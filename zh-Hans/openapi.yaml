    x-displayName: 服务器信息
    description: 客户端在登录或连接之前需要了解的信息。
  - name: health
    x-displayName: 健康检查
    description: |-
      服务器的存活状态和就绪状态，供监控使用。它们在 API 端口上响应，先于身份验证和所有端点限制，但与任何请求一样，会占用按地址限制层的一个令牌；可以把监控主机列入 `ABUSE_EXEMPT`。每个端点都有两个可用路径：服务器根路径下和 `/api/v1` 下。

      指标端口有自己的健康检查端点，见简介部分。
  - name: auth
    x-displayName: 注册和登录
    description: |-
      创建账号、使用密码（及第二重验证）登录、确认邮件和密码重置邮件。

      `POST /auth/login`、`POST /auth/login/mfa`、`POST /auth/sso/google/finish`、`POST /auth/sso/google/link` 和 `POST /auth/sso/complete` 返回一个会话 `{ token, expiresAt, user }`（其中前几个也可能返回第二步）。
  - name: google-sign-in
    x-displayName: Google 登录
    description: |-
      仅当 `GET /info` 给出 `sso.google: true` 时提供；否则下列所有端点都返回 404 `sso_disabled`。游戏通过系统浏览器，按 RFC 8252 的已安装应用流程（“桌面应用”类型的客户端）登录：Google 把浏览器送回游戏在 `127.0.0.1` 上的监听器，而从不送到本服务器，游戏也从不接触任何 Google 凭据。

      1. 客户端在 `127.0.0.1:0` 上监听（由系统选择端口），并生成一对 PKCE 值：由 43 到 128 个 `[A-Za-z0-9._~-]` 字符组成的 `codeVerifier`，以及 `codeChallenge = BASE64URL(SHA-256(codeVerifier))`，后者为 43 个字符，不带填充。
      2. 带上质询值和端口调用 `POST /auth/sso/google/start`，返回 Google URL 和本次尝试的 `state`。客户端检查该 URL（见下文），然后在浏览器中打开它。
      3. Google 把浏览器重定向到 `http://127.0.0.1:<port>/oauth2/google/<tag>?code=...&state=...`。客户端只接受第 2 步响应中的 `state`，遇到 `error=` 重定向时不发送任何内容。
      4. 带上尝试 ID、`codeVerifier`、`state` 和 `code`（如果 Google 发送了 `iss`，也一并带上）调用 `POST /auth/sso/google/finish`。
      5. 响应为以下之一：一个会话；一个双重验证步骤（继续调用 `POST /auth/login/mfa`）；新棋手的 `needsUsername`（继续调用 `POST /auth/sso/complete`）；或者当某个设有密码的账号使用该邮箱地址时，返回 `needsPassword`（继续调用 `POST /auth/sso/google/link`）。

      **来源标记。** 重定向 URI 带有棋手所添加服务器的标记，这样，其他服务器为自己的棋手获取的 URL 会被游戏拒绝。来源由小写主机名（IPv6 字面量需加方括号）、`:` 和十进制 API 端口组成，端口始终写出，443 也不例外：服务器使用 `SERVER_PUBLIC_HOST` 及其公开 API 端口，游戏则使用它所连接的地址。标记是 SHA-256(UTF-8 `"scacelith-sso-origin-v1\n"` + 来源) 经 base64url 编码（不带填充）后的前 22 个字符。重定向 URI 为 `"http://127.0.0.1:" + port + "/oauth2/google/" + tag`：始终使用 IPv4 字面量，端口为游戏监听器的端口（1024 到 65535）。服务器从不接收客户端提供的 URI、主机名或路径。

      | 来源 | 标记 |
      |---|---|
      | `play.scacelith.example:443` | `IhcScoV7eDOzTEcSnqPUPt` |
      | `localhost:8443` | `TFGx7zQ_8QlGZW5zpqznCr` |
      | `[::1]:8443` | `XToJm0DG5PjciEVmZa9Cho` |
      | `127.0.0.1:50443` | `3r653wM5ZjYsHcAJljmCwY` |

      因此，只有以与 `SERVER_PUBLIC_HOST` 及其公开 API 端口完全一致的地址添加服务器的棋手，才能使用 Google 登录。

      **游戏在打开浏览器之前检查的内容。** `authUrl` 必须恰好以 `https://accounts.google.com/o/oauth2/v2/auth?` 开头，由可打印 ASCII 字符组成且少于 4096 个字符；其查询部分必须恰好有一个 `response_type=code`，恰好有一个 `redirect_uri` 且等于游戏根据其端口和来源标记算出的 URI，恰好有一个 `state` 且等于响应中的 `state`，还必须有 `code_challenge_method=S256` 和一个 43 个字符的 `code_challenge`。否则，游戏会停止监听器，不打开任何页面。游戏只向响应了 `start` 的那台服务器发送 `finish` 和 `link` 请求。

      **Google 登录会进入哪个账号：** 已关联该 Google 账号的账号；否则为使用 Google 已确认邮箱地址的有效账号（若该账号设有密码，`finish` 返回 `needsPassword`，只有在其密码以及（若已开启）第二重验证都通过后才会保存关联；若没有密码，则返回 409 `sso_account_exists`）；否则为新账号（`needsUsername`）。Google 账号绝不会仅凭邮箱地址就关联到现有账号。当 Google 登录创建了账号，或被添加到现有账号时，该账号的邮箱地址都会收到一封邮件。
