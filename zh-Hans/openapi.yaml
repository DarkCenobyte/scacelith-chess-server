  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: 以 PGN 文件下载对局
      description: |-
        以 PGN 文件提供的同一对局：文件包含一局对局，使用 `\n` 换行，着法部分每行少于 80 列。无论是否带有令牌，响应都相同。

        标签按以下顺序排列：`Event`（`<SERVER_NAME> rated <category>` 或 `<SERVER_NAME> casual <category>`）、`Site`（`SERVER_PUBLIC_HOST`）、`Date`（UTC 开始日期）、`Round`、`White`、`Black`、`Result`（已中止的对局为 `*`）、`UTCDate` 和 `UTCTime`（开始时间）、`WhiteElo` 和 `BlackElo`（开始时的等级分，或 `-`）、`WhiteRatingDiff` 和 `BlackRatingDiff`（等级分变化，例如 `+10` 和 `-10`，每局计分对局都有；若等级分规则使等级分保持不变，则为 `+0`；不计分对局、自定义用时对局和已中止的对局都没有这两个标签）、`TimeControl`（以秒为单位）、`Termination`（PGN 标准值：`normal`；`time forfeit`，即超时，包括以和棋告终的情况；`abandoned`；`rules infraction`，即第二次违例着法或因违反公平对弈而判负；`unterminated`，即已中止的对局）、`PlyCount`、`ScacelithGameId`（十进制 ID）。

        每步着法都带有 `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`：走棋方在该步之后的棋钟剩余时间，以及该步所计的用时，精确到十分之一秒（截断）。若记录中缺少某个值，则省略该值。最后一步之后，先以英文文字写出结束原因，然后是结果。

        **限制：** `public_read`（带令牌时按棋手计算，不带令牌时按客户端计算）。
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: PGN 文件。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`。'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'PGN 文本，采用 UTF-8 编码（`Content-Type: application/x-chess-pgn; charset=utf-8`）。'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`：不是最多 16 位数字（小于 2^53）的正整数；`invalid_request`：不是有效的 URL 编码。'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`：发送了令牌，但令牌无效。'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`：没有该对局。'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`public_read` 限制或账号额度。'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`：原因之一是已存储的着法无法重放到已存储的结局（服务器会记入日志）。'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`（数据库持续被锁定；响应体中带有 `retryAfter: 1`，但没有 `Retry-After` 标头）、`server_busy`（查询会话时发现数据库被锁定）、`timeout`。'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: 以 GIF 动图下载本服务器上的对局
      description: |-
        以 GIF 动图呈现的对局。名字和等级分取自棋谱（开始时的等级分，已删除的账号显示为 `deleted#<id>`），结果和结束方式（`Resignation`、`Loss on time`……）也同样取自棋谱。

        检查按以下顺序进行：`gif_disabled`、图像选项（`size`、`orientation`、`delay`、`coords`）、对局 ID、对局、对局长度。

        **需要会话：** 配额按账号计算。**限制：** 每个请求都计入 `gif`；仅在需要生成 GIF 时才计入 `gif_user_min`、`gif_user_hour`、`gif_ip_min` 和 `gif_ip_hour`（见本分组的说明）。**时间限制：** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 秒（默认 45 秒）。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 图像尺寸：`small`（每格 32 像素）、`medium`（48 像素）或 `large`（72 像素）。
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: 位于棋盘下方的一方。
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: 每步着法的毫秒数（1 到 6 位十进制数字）。
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: 是否在棋盘四周绘制坐标（直线字母和横线数字）：绘制为 `1`，不绘制为 `0`。
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '带有 `field`（`size`、`orientation`、`delay` 或 `coords`）的 `invalid_option`：值不在允许范围内。`invalid_game_id`。`invalid_request`：不是有效的 URL 编码。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`：没有该对局。`gif_disabled`：服务器已关闭 GIF 功能（`GIF_ENABLED=false`；`gif` 令牌会被退还）。'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`gif` 限制、某项渲染限制或账号额度。'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`：无法生成 GIF（服务器会在日志中记录原因）。`internal_error`。'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '带有 `retryAfter`（3 到 10 秒）和 `Retry-After` 的 `server_busy`：渲染队列已满，或 GIF 等待空闲线程已达 `GIF_QUEUE_TIMEOUT_MS`（10 秒）；该请求占用的所有限制令牌都会被退还。`busy`：数据库持续被锁定（仅在响应体中带有 `retryAfter: 1`）。`timeout`。'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: 将以 PGN 发送的任意对局制作成 GIF 动图
      description: |-
        为以 PGN 文本发送的任意对局生成与 `GET /games/{id}/gif` 相同的图像：游戏保存的对局、从其他网站导出的对局、手工输入的对局均可。只使用文本中的第一局对局。

        - PGN 解析器接受游戏自带解析器所接受的内容：本服务器写出的所有 PGN，以及其他网站的常见导出格式（注释、变着、数字注释符号（NAG）和棋钟标注会被跳过；回合编号和 SAN 着法以宽松方式读取；除非 `SetUp` 为 `"0"`，否则由 `FEN` 标签给出起始局面）。
        - 名字和等级分取自 `White`、`Black`、`WhiteElo` 和 `BlackElo` 标签。带重音符号的字母会去掉重音符号，可打印 ASCII 以外的其他字符变为 `?`，过长的名字会被截断（48 个字符）。结果取自 `Result` 标签，若没有则取自着法部分的末尾。除非 `Termination` 标签为 `normal`，否则会显示它；为该值时，最终局面本身就说明了一切（将死、逼和）。
        - 此端点自行检查请求体：未知字段，或 `pgn` 缺失或不是字符串时，返回带有 `field` 的 400 `invalid_request`；选项错误时返回 400 `invalid_option`（`delayMs` 必须是 JSON 数字，`coords` 必须是布尔值；不接受 `null`）。

        **需要会话：** 配额按账号计算。**限制：** 与 `GET /games/{id}/gif` 相同。**请求体上限：** 135,168 字节，与 `HTTP_BODY_LIMIT` 无关（按 JSON 字符串形式的 PGN 计算，包括其转义字符）。**时间限制：** 默认 45 秒。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: 手工输入的短对局，不带坐标
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: 使用所有选项的 PGN 文件
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '带有 `field` 的 `invalid_request`（未知字段，或 `pgn` 缺失或不是字符串；请求体不是对象时不带 `field`）；`invalid_json`；带有 `field`（`size`、`orientation`、`delayMs` 或 `coords`）的 `invalid_option`；带有 `line` 和 `column`（从 1 开始，列按字符计算）以及解析器 `message` 的 `invalid_pgn`：不合规则或有歧义的着法、损坏的标签、未知的变体、超过 65,536 字节。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`：服务器已关闭 GIF 功能（`GIF_ENABLED=false`；`gif` 令牌会被退还）。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`：请求体超过 135,168 字节。'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`gif` 限制、某项渲染限制或账号额度。'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`：无法生成 GIF（服务器会在日志中记录原因）。`internal_error`。'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '带有 `retryAfter`（3 到 10 秒）和 `Retry-After` 的 `server_busy`：渲染队列已满，或 GIF 等待空闲线程的时间过长；该请求占用的所有限制令牌都会被退还。`timeout`。'
  /players/{username}:
    get:
      operationId: getPlayer
      tags:
        - players
      summary: 获取棋手的公开资料
      description: |-
        棋手的公开资料：各官方用时类别的等级分（按服务器的顺序）和对局数。`games.total` 统计所有已存储的对局，包括不计分对局和已中止的对局；`games.rated`、`wins`、`draws` 和 `losses` 是对各条等级分记录求和得出的，因此只包含计分对局。无论是否带有令牌，响应都相同。

        **限制：** `public_read`（带令牌时按棋手计算，不带令牌时按客户端计算）。
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: 公开资料。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
              example:
                username: alice
                createdAt: 1790882839743
                ratings:
                  - category: '3+2'
                    rating: 1510
                    provisional: true
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                games:
                  total: 3
                  rated: 2
                  wins: 1
                  draws: 1
                  losses: 0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`：不是由 2 到 24 个 `[A-Za-z0-9_.-]` 字符组成。'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`：发送了令牌，但令牌无效。'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`：没有该棋手，或该账号已删除。'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`public_read` 限制或账号额度。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`（数据库持续被锁定；响应体中带有 `retryAfter: 1`，但没有 `Retry-After` 标头）、`server_busy`（查询会话时发现数据库被锁定）、`timeout`。'
  /players/{username}/games:
    get:
      operationId: listPlayerGames
      tags:
        - players
      summary: 列出棋手最近的对局
      description: |-
        该棋手最近的对局，最新的排在最前，分页方式与对局记录相同，但没有筛选条件和总数。`color` 是该棋手所执的一方。只要本页已满，`next` 就是最后一局的 ID，因此下一页可能为空。服务器会先查找棋手：无论查询参数如何，未知棋手都返回 404。

        **限制：** `public_read`（带令牌时按棋手计算，不带令牌时按客户端计算）。
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: 该棋手对局的一页。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerGamesPage'
              example:
                username: alice
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                next: 4100000000001
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`、`invalid_cursor`（`before` 不是对局 ID）、`invalid_limit`（后两者不带 `field`）。'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`：发送了令牌，但令牌无效。'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`：没有该棋手，或该账号已删除。'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`public_read` 限制或账号额度。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`（数据库持续被锁定；响应体中带有 `retryAfter: 1`，但没有 `Retry-After` 标头）、`server_busy`（查询会话时发现数据库被锁定）、`timeout`。'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: 获取某个用时类别的顶尖棋手
      description: |-
        某个官方用时类别中排名前 100 的等级分记录，要求已计入的对局至少为 `minGames`（`PROVISIONAL_GAMES`）局，已删除的账号和已确认的作弊者不在其中。服务器最多每 10 秒重新计算一次各个排行榜；`updatedAt` 给出计算时间。

        **限制：** 仅按地址限制层。
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: 官方用时类别 ID（`3+2` 或 `3%2B2`）。
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: 棋手人数，1 到 100。不超过 3 位数字的更大数值按 100 计；空值视为未提供。
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: 排行榜。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category`（缺失，或不是官方用时类别）、`invalid_limit`。'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：按地址限制层。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`（数据库持续被锁定；响应体中带有 `retryAfter: 1`，但没有 `Retry-After` 标头）、`timeout`。'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: 举报最近一局对局的对手
      description: |-
        举报棋手自己在最近 7 天内结束的某局对局中的对手。举报本身绝不会改变等级分、处罚或诚信等级。它会提高管理员所看到的审核优先级；除 `abuse` 外，还会请求对该对局进行引擎分析。

        针对同一对局再次举报同一对手会得到相同的响应，且不会有任何改变；响应绝不会透露有关被举报账号的任何信息。`GET /games/{id}` 会事先告知对局双方举报是否会被受理（`reportable`）。

        此端点自行检查请求体，顺序为 `gameId`、`reported`、`category`、`comment`：检查失败时返回不带 `field` 的 400 `invalid_request`。未知字段会被忽略。

        **限制：** `reports`（按棋手计算），然后是每位棋手 24 小时内 `REPORTS_PER_DAY`（5）次举报（429 `report_limit`）。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: 举报已收到（或此前已提交过）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`（不带 `field`）、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`：被举报者不是举报者在最近 7 天内结束的对局中的对手。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit`（`retryAfter: 3600`，带有 `Retry-After` 标头）：最近 24 小时内已提交 `REPORTS_PER_DAY` 次举报。`rate_limited`：`reports` 限制或账号额度。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（查询会话时发现数据库被锁定）、`timeout`。'
  /verify-email:
