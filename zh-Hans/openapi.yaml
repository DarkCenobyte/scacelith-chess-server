  - name: games
    x-displayName: 对局和 PGN
    description: |-
      包含着法和棋钟时间的棋谱，以及对应的 PGN 文件。

      **对局代码。** `status`：1 `WhiteWins`、2 `BlackWins`、3 `Draw`、4 `Aborted`（只保存已结束的对局）。`result`：`1-0`、`0-1`、`1/2-1/2` 或 `*`（已中止）。`reason` 及其名称（`termination`）和 PGN 文件着法部分末尾所写的（英文）文字见下表；代码 7 和 21 为和棋（超时或弃局的一方所面对的对手无法将死），服务器从不以代码 4 和 13 结束对局（它们属于共用的结束原因列表）：

      | 代码 | `termination` | PGN 中的文字 |
      |---|---|---|
      | 1 | `Checkmate` | Checkmate（将死） |
      | 2 | `Resignation` | Resignation（认输） |
      | 3 | `Timeout` | Loss on time（超时判负） |
      | 4 | `IllegalMoves` | Second illegal move (forfeit)（第二次违例着法，判负） |
      | 5 | `Stalemate` | Stalemate（逼和） |
      | 6 | `InsufficientMaterial` | Dead position (insufficient material)（死局面，子力不足） |
      | 7 | `TimeoutVsInsufficient` | Flag fall, but the opponent cannot checkmate（超时，但对方无法将死） |
      | 8 | `FivefoldRepetition` | Fivefold repetition（五次重复局面） |
      | 9 | `SeventyFiveMoves` | 75-move rule（七十五回合规则） |
      | 10 | `ThreefoldClaim` | Threefold repetition (claimed)（三次重复局面，提出要求） |
      | 11 | `FiftyMoveClaim` | 50-move rule (claimed)（五十回合规则，提出要求） |
      | 12 | `Agreement` | Draw by agreement（协议和棋） |
      | 13 | `IllegalMovesVsInsufficient` | Second illegal move, but the opponent cannot checkmate（第二次违例着法，但对方无法将死） |
      | 20 | `Abandonment` | Abandoned (disconnected for too long)（弃局，断线时间过长） |
      | 21 | `AbandonmentVsInsufficient` | Abandoned, but the opponent cannot checkmate（弃局，但对方无法将死） |
      | 22 | `Aborted` | Game aborted（对局中止） |
      | 23 | `NoShow` | Aborted: first move not played in time（中止：未按时走出第一步） |
      | 24 | `Forfeit` | Forfeit (fair play violation)（弃权判负，违反公平对弈） |
      | 25 | `ServerAborted` | Aborted by the server（被服务器中止） |
      | 26 | `BothDisconnected` | Aborted: both players disconnected（中止：双方均已断开连接） |
  - name: gifs
    x-displayName: GIF 动图
    description: |-
      以 GIF 动图呈现的对局，可保存或分享：俯视的棋盘，从初始局面到最终局面每个局面一帧，棋盘上方是双方棋手的名字和等级分，下方是最后一步着法，最后一帧显示结果和对局的结束方式。

      **开销、缓存和配额。** GIF 在专用的渲染线程上以最低的 CPU 优先级生成，从不占用运行对局的线程：共 `GIF_THREADS` 个线程（默认等于 `WORKERS`），在生成第一个 GIF 时启动，一分钟内没有新的 GIF 时停止。最多 `GIF_QUEUE_MAX`（4 x `WORKERS`）个 GIF 排队等待线程，每个最多等待 `GIF_QUEUE_TIMEOUT_MS`（10 秒）；一次渲染最长可持续 `GIF_RENDER_TIMEOUT_MS`（30 秒）。服务器把已生成的 GIF 保存在大小为 `GIF_CACHE_MB` MB（32 x `WORKERS`）的缓存中，最久未使用的最先淘汰；取自缓存的 GIF，或正在为另一个请求生成的 GIF，不消耗渲染次数。缓存键涵盖所有会改变画面的因素，包括名字。

      每个请求都计入 `gif`（两个端点合计，每位棋手每分钟 30 次）。需要生成的 GIF 还计入渲染限制：每位棋手每分钟 `GIF_USER_RENDERS_PER_MIN`（4）次、每小时 `GIF_USER_RENDERS_PER_HOUR`（30）次；每个客户端（其所有账号合计）每分钟 `GIF_IP_RENDERS_PER_MIN`（12）次、每小时 `GIF_IP_RENDERS_PER_HOUR`（120）次，每个 IPv6 /48 为其 3 倍。客户端应保留已下载的文件，而不是再次请求；收到 429 或 503 后，应等待 `retryAfter`。

      尺寸：`small`（每格 32 像素：284 x 350 像素）、`medium`（48 像素：424 x 515）、`large`（72 像素：628 x 762）；不带坐标时分别为 268 x 342、400 x 503 和 600 x 748。初始局面至少停留 1 秒（若设定的帧间隔更长，则按帧间隔），最终局面停留 3 秒，GIF 循环播放；第一帧之后，只存储画面中发生变化的部分。一盘 40 回合的对局约为 135、205 和 325 KiB（小、中、大），150 回合的对局约为 0.5、0.8 和 1.2 MiB。
