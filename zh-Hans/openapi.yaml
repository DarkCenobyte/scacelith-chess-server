  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: 删除账号
      description: |-
        删除账号；此操作无法撤销。

        - 所有会话立即被吊销：此后使用该令牌会得到 401 `invalid_token`。
        - 用户名在账号和所有棋谱中都变为 `deleted#<id>`。
        - 以下内容会被清除：邮箱地址、密码哈希、双重验证密钥和恢复码、会话和链接令牌、Google 关联、反作弊系统的诚信记录，以及随安全事件存储的 IP 地址。
        - 等级分和对局会保留。对局仍可在匿名名称下查看，`GET /players/{username}` 对原用户名返回 404。

        **重新验证身份：** 密码；开启双重验证时，还需身份验证器验证码或恢复码。**限制：** `reauth`，然后是 `reauth_user`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: 账号已删除。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set`（仅使用 Google 登录的账号）、`invalid_request`、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`、`mfa_code_required`、`invalid_code`。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（重新验证身份失败，或此账号尝试的验证码过多），或 `rate_limited`（`reauth` 或 `reauth_user` 限制、账号额度、密码哈希队列）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（密码哈希队列，或数据库持续被锁定）、`timeout`。'
  /account/games:
