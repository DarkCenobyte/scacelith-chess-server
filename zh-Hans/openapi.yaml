paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: 获取服务器的名称、版本、端口和注册规则
      description: |-
        客户端在登录或连接之前需要的信息：服务器的名称和 ID、WebSocket 协议版本及 WebSocket 的位置、注册规则、官方用时，以及客户端在提交表单之前可以自行检查的各项限制。

        **限制：** 仅按地址限制层。
      security: []
      responses:
        '200':
          description: 服务器的描述信息。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：按地址限制层。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`。'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: 创建账号
      description: |-
        创建账号：在通过发送到邮箱的链接确认邮箱地址后创建；若不需要邮件确认，则立即创建。

        **需要邮件确认时**（`REQUIRE_EMAIL_VERIFICATION`，默认）：返回 202 `verification_sent`。此时账号尚不存在：注册申请等待 24 小时，并在此期间保留其用户名。一个在这 24 小时内有效的链接会发送到该地址，每个地址每 5 分钟最多一封（`POST /auth/verify-email/resend` 可发送新链接）；使用该链接时（`/verify-email` 页面上的按钮），账号才会被创建，其邮箱地址也随之确认，棋手随后即可登录。在此之前，用该用户名登录会返回 `invalid_credentials`，与未知账号相同，公开资料也不存在。使用同一地址的新注册申请会取代正在等待的那个。如果该地址已被另一个账号使用，响应也完全相同：此时不发送链接，改为向该账号的所有者发送一条通知（每小时最多一条），用户名也同样被保留，因此无从判断该地址是否已有账号。链接未被使用的注册申请在 24 小时后被丢弃，其用户名重新可用。

        **不需要邮件确认时**（`REQUIRE_EMAIL_VERIFICATION=false`）：返回 201 `ready`，账号立即创建，可以登录。

        **规则。** `username`：`USERNAME_MIN` 到 `USERNAME_MAX` 个字符（3 到 20），由字母、数字、`_` 和 `-` 组成，以字母或数字开头（`GET /info` 在 `limits` 中给出这些值）；保留名称（`admin`、`moderator`、`deleted`……）和某些前缀会被拒绝；不区分大小写地保持唯一。`email`：去除首尾空白并以小写存储，须为纯 ASCII，且域名中含有点号。`password`：至少 `PASSWORD_MIN_LENGTH`（10）个字符，最多 256 字节 UTF-8；不得包含用户名或邮箱地址的本地部分，也不得是常见密码。

        **错误**，按以下顺序检查：403 `registration_closed`；400 `invalid_username`；400 `invalid_email`；400 `weak_password`；409 `username_taken`；428 `pow_required`；密码哈希队列错误；409 `email_taken`（仅在不需要邮件确认时）。

        **限制：** `auth`，然后是 `auth_register`（每个客户端每小时 10 次注册）。**工作量证明：** 当 `POW_REGISTER_BITS` 大于 0 时始终需要。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: 第一次尝试，不带工作量证明
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: 带上工作量证明再次发送
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: 账号已创建，可以登录（此服务器不需要邮件确认）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: 注册申请正在等待其确认链接被使用（也可能该地址已有账号；响应不会透露这一点）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`（带有 `field`）、`invalid_json`、`invalid_username`、`invalid_email`，或带有 `reason` 的 `weak_password`：`too_short`、`too_long`、`contains_username`、`contains_email` 或 `too_common`。'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`：此服务器已关闭注册（`GET /info` 给出 `registration: closed`）。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`：已有账号使用该用户名，或另一个地址的待确认注册申请保留了它。`email_taken`：另一个账号正在使用该地址（仅在不需要邮件确认时）。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`auth` 或 `auth_register` 限制，或密码哈希队列。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（密码哈希队列，或数据库持续被锁定）、`timeout`。'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: 使用密码登录
      description: |-
        使用用户名或邮箱地址加密码登录。可能有两种响应，状态码均为 200：一个会话；或者在开启双重验证时，返回一个需在 5 分钟内通过 `POST /auth/login/mfa` 完成的第二步。

        未知账号、密码错误和没有密码的账号都会在相同的时间后得到相同的响应：401 `invalid_credentials`。账号状态检查（`banned`、`email_unverified`）只在密码正确之后进行。同一登录名失败达到 `AUTH_FAILURES_PER_ACCOUNT`（5）次后，每次尝试都必须等待（429 `too_many_attempts`）。

        **限制：** `auth`。**工作量证明：** 仅在出现一波登录失败期间需要（428 `pow_required`）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: 一个会话，或开启双重验证时登录的第二步。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: 已登录
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: 已开启双重验证
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`：未知账号、密码错误，或账号没有密码。'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '仅在密码正确之后：`banned`，带有 `until`（Unix 毫秒时间戳，永久封禁时为 `null`）；或 `email_unverified`（邮箱地址尚未确认的较早账号）。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（该登录名的失败延迟），或 `rate_limited`（`auth` 限制、密码哈希队列）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（密码哈希队列，或数据库持续被锁定）、`timeout`。'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: 使用第二重验证完成登录
      description: |-
        开启双重验证时登录的第二步，在 `POST /auth/login` 或 Google 登录（`POST /auth/sso/google/finish` 或 `POST /auth/sso/google/link`）返回 `mfaRequired` 之后调用。发送 `code`（6 位身份验证器验证码或恢复码）或 `recoveryCode`。在此使用的恢复码即告失效。

        一个步骤最多接受 5 次错误的验证码；密码被重置或修改时，该步骤也会结束。在 Google 关联的密码步骤之后，只有在此处验证码通过，关联才会被保存。

        **限制：** `auth`，以及每个账号每 15 分钟最多 `AUTH_MFA_PER_ACCOUNT`（10）个验证码，无论来自哪个地址；超出后不再检查验证码，因此恢复码不会被消耗。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: 身份验证器验证码
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: 恢复码
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: 已登录。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`：既未发送 `code` 也未发送 `recoveryCode`，或请求体不符合结构定义；`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`：该步骤已过期、已被使用、或因 5 次错误验证码而结束，或者自第一步以来密码已被重置或修改（请重新登录）。`invalid_code`：验证码错误或已被使用。'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned`（带有 `until`）、`email_unverified`。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`：仅在 Google 关联的密码步骤之后出现，表示该 Google 账号在此期间已被关联到另一个账号。'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`：仅在 Google 关联的密码步骤之后出现，表示账号在此期间发生了变化；请从游戏中重新开始。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`：账号的失败延迟，或最近 15 分钟内的 `AUTH_MFA_PER_ACCOUNT` 个验证码额度已用完。`rate_limited`：`auth` 限制。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '带有 `retryAfter: 1` 的 `server_busy`：数据库持续被锁定（若发生在 Google 关联步骤之后，则未进行任何关联：请从游戏中重新开始）。`timeout`。'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: 退出当前会话
      description: |-
        吊销所用令牌对应的会话。用它打开的 WebSocket 会被关闭。无请求体（或 `{}`）。

        **限制：** `sessions`。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 已退出登录。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`：请求体不是 `{}`；`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`sessions` 限制或账号额度。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（数据库持续被锁定）、`timeout`。'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
        - sessions
      summary: 退出所有会话
      description: |-
        吊销该账号的所有会话，包括当前会话。用这些会话打开的 WebSocket 都会被关闭。无请求体（或 `{}`）。

        **限制：** `sessions`。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 所有会话均已退出登录。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`：请求体不是 `{}`；`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`sessions` 限制或账号额度。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（数据库持续被锁定）、`timeout`。'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: 重新发送确认链接
      description: |-
        重新发送邮箱确认链接。无论地址为何，响应都是 202 `accepted`，因此绝不会透露是否有账号或注册申请在使用该地址。

        每个地址每 5 分钟最多处理一次请求。使用该地址等待确认的注册申请会重新获得 24 小时，无论另一个账号是否在使用该地址，这样两种情况下其用户名被保留的时间都一样长。只有在以下情况下才会发送链接：该地址没有账号时，为该注册申请发送（新链接有效期 24 小时，取代之前的链接）；或者为使用该地址、状态正常但尚未确认的账号发送。

        **限制：** `auth`，然后是 `auth_mail`（每个客户端每小时 10 次）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: 已接受（无论地址为何）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`auth` 或 `auth_mail` 限制（无论地址为何）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '带有 `retryAfter: 1` 的 `server_busy`：查询账号时数据库持续被锁定（为等待中的注册申请续期只是尽力而为，从不导致请求失败）。`timeout`。'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: 发送密码重置链接
      description: |-
        发送一个有效期为一小时的密码重置链接，该链接会打开 `/reset-password` 页面。无论地址为何，响应都是 202 `accepted`。链接只发送给状态正常的账号，每个地址每 5 分钟最多一次。仅使用 Google 登录的账号通过这种方式设置第一个密码。

        找回密码的限制是本 API 中最严格的，全部在整台服务器范围内计数：每个客户端（一个 IPv4 地址或一个 IPv6 /64）每小时 3 次（`AUTH_FORGOT_PER_HOUR`）、每 24 小时 10 次（`AUTH_FORGOT_PER_DAY`），每个 IPv6 /48 为这些数值的 3 倍；此外还有 `auth` 限制（每 10 分钟 20 次）以及每个地址每 5 分钟一封邮件的限制。202 和 429 都不会透露是否有账号使用该地址。设置新密码有自己的限制（`auth_reset`）。

        **限制：** `auth`、`auth_forgot`，然后是 `auth_forgot_day`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: 已接受（无论地址为何）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`auth`、`auth_forgot` 或 `auth_forgot_day` 限制（无论地址为何）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '带有 `retryAfter: 1` 的 `server_busy`：数据库持续被锁定。`timeout`。'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: 使用重置链接的令牌设置新密码
      description: |-
        使用重置链接中的令牌设置新密码（`/reset-password` 页面的作用相同）。新密码须遵守注册时的规则。

        重置会吊销所有会话，并取消待处理的邮箱更改；该账号的其他重置链接随即失效；邮箱地址视为已确认（链接已证明这一点）；账号所有者会收到一封邮件。双重验证不受影响。发生密码哈希队列错误或 503 后，链接仍然有效。

        **限制：** `auth`，然后是 `auth_reset`（每个客户端每小时 10 次，每个 IPv6 /48 为 30 次，与该页面共享：每次尝试都要对密码进行哈希）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: 密码已修改，所有会话均已退出登录。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`：链接无效、已被使用或已过期，或者它被发送到了该账号已不再使用的地址。`weak_password`（带有 `reason`）。`invalid_request`、`invalid_json`。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`auth` 或 `auth_reset` 限制，或密码哈希队列。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`：密码哈希队列，或数据库持续被锁定（`retryAfter: 1`，未做任何更改）。`timeout`。'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: 开始 Google 登录
      description: |-
        针对 PKCE 质询值和游戏在 `127.0.0.1` 上的监听端口，开始一次 Google 登录尝试。响应给出要在系统浏览器中打开的 Google URL 以及本次尝试的 `state`；尝试的有效期为 10 分钟。

        `authUrl` 包含 `client_id`、`redirect_uri`（由 `redirectPort` 和服务器的来源标记构成）、`response_type=code`、`scope=openid email profile`、`state`、`nonce`、`code_challenge`（服务器自己面向 Google 的 PKCE 验证值的 S256 结果）及 `code_challenge_method=S256`，以及 `prompt=select_account`。游戏在打开它之前会先进行检查（见本分组的说明）。

        **限制：** `sso_start`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: 本次登录尝试。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`：此服务器不提供 Google 登录。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`sso_start` 限制。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（数据库持续被锁定）、`timeout`。'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: 将 Google 的响应交给服务器
      description: |-
        把 Google 发送到游戏监听器的 `code` 和 `state`，连同尝试 ID 和 PKCE 验证值一起交给服务器。没有验证值，尝试 ID 毫无用处；没有服务器自己的 PKCE 验证值和客户端密钥，授权码也毫无用处。

        服务器先检查尝试（未知、已使用或已过期：410），然后检查验证值（错误的验证值不会使尝试失效），随后使用该尝试（仅一次），检查 `state` 和 `iss`，向 Google 兑换授权码并验证 ID 令牌。响应（200）为以下之一：

        - `{ token, expiresAt, user }`：已登录到关联的账号；
        - `{ mfaRequired, mfaToken, expiresIn }`：继续调用 `POST /auth/login/mfa`；
        - `{ needsUsername, ssoTicket, suggestedUsername }`：新账号；请在 10 分钟内继续调用 `POST /auth/sso/complete`。`suggestedUsername` 取自 Google 名称或邮箱地址，没有合适的名称时为 `""`；
        - `{ needsPassword, linkTicket, username, expiresIn }`：使用该地址的账号设有密码；继续调用 `POST /auth/sso/google/link`。此时尚未进行任何关联。

        **限制：** `sso_finish`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: 一个会话、第二步，或首次 Google 登录的下一步。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: 已登录到关联的账号
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: 已开启双重验证
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: 新棋手
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: 设有密码的账号正在使用该地址
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`：验证值与该尝试的质询值不匹配（尝试仍可使用）。`sso_email_unverified`：Google 尚未确认该地址。`registration_closed`。`account_disabled`。仅针对已关联的账号：`banned`（带有 `until`）、`email_unverified`。'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`：此服务器不提供 Google 登录。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`：某个没有密码的有效账号正在使用该地址（不会透露是哪个账号）。'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`：尝试未知、已使用或已过期。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`sso_finish` 限制。'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（数据库持续被锁定）、`timeout`。'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: 凭密码将 Google 关联到现有账号
      description: |-
        在 `finish` 返回 `needsPassword` 之后调用：使用棋手在游戏中输入的该账号密码，将 Google 关联到现有账号。响应（200）为一个会话（关联已保存，棋手已登录）；或者在开启双重验证时，为 `{ mfaRequired, mfaToken, expiresIn }`：继续调用 `POST /auth/login/mfa`，只有在那里验证码通过后，关联才会被保存。

        密码错误时票据仍可使用，总共可尝试 5 次。尝试次数在检查密码之前扣除：429 `too_many_attempts` 或 428 `pow_required` 不扣除次数，而被密码哈希队列拒绝（503 `server_busy`、429 `rate_limited`）时已扣除一次，并计为该账号的一次失败。失败延迟与 `POST /auth/login` 使用同一个计数器。

        **限制：** `auth`（包括其 IPv6 /48 计数）。**工作量证明：** 与 `POST /auth/login` 相同。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: 一个会话，或登录的第二步。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`：密码错误；票据仍然保留，总共可尝试 5 次。'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned`（带有 `until`），仅在密码正确之后。'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`：此服务器不提供 Google 登录。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`：该 Google 账号在此期间已被关联到另一个账号。'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`：票据未知、已使用或已过期；第 5 次密码错误；账号的状态或地址自 `finish` 以来已发生变化；或者在保存关联期间，账号的状态、地址、密码或双重验证发生了变化。请从游戏中重新开始。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（账号的失败延迟），或 `rate_limited`（`auth` 限制、密码哈希队列）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`：密码哈希队列，或数据库持续被锁定（`retryAfter: 1`，未进行任何关联）。`timeout`。'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: 为首次 Google 登录创建账号
      description: |-
        在 `finish` 返回 `needsUsername` 之后调用：使用所选用户名创建账号（适用注册规则）并登录。该账号没有密码：`hasPassword` 为 `false`，可通过“忘记密码”（`POST /auth/password/forgot`）为它设置密码。

        **限制：** `auth`（包括其 IPv6 /48 计数）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: 账号已创建并已登录。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`、`invalid_request`、`invalid_json`。'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`。'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`：此服务器不提供 Google 登录。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`（已有账号使用该用户名，或另一个地址的待确认注册申请保留了它）、`sso_already_linked`、`email_taken`。'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`：票据未知、已使用或已过期。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`auth` 限制。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（数据库持续被锁定）、`timeout`。'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: 列出已登录的设备
      description: |-
        账号的有效会话（已登录的设备），最近使用的排在最前。`current` 标记发出此请求的会话。`lastSeenAt` 最多每 5 分钟更新一次；`expiresAt` 是绝对截止时间，空闲期限可能使会话更早结束。

        **限制：** `sessions`。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 有效会话。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`sessions` 限制或账号额度。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（数据库持续被锁定）、`timeout`。'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
