      description: |-
        重置页面的表单；其作用与 `POST /auth/password/reset` 相同：所有设备都会退出登录，待处理的邮箱更改会被取消，其他重置链接失效，邮箱地址视为已确认，账号所有者会收到一封邮件。

        先检查链接，然后检查两次输入的密码是否一致，最后检查密码规则。服务器繁忙时，会重新返回表单并带有 `Retry-After`，链接仍然有效。

