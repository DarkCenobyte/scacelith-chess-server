          description: 显示新地址及其确认按钮的页面。
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: 链接无效或已过期（自发出请求以来账号的地址已发生变化时也是如此）。
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: '`page` 限制（HTML 页面），或按地址限制层（JSON `rate_limited`）。'
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
    post:
      operationId: submitConfirmEmailChangePage
      tags:
        - pages
      summary: 确认新邮箱地址
      description: |-
        邮箱更改页面的表单。地址随即更改并视为已确认；各设备保持登录状态；先前发送的链接（确认、密码重置、其他更改）失效；原地址会收到通知，其中的新地址经过打码处理。

        **限制：** `auth`。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: lZ50AvPxUwbGqQCwWPIO28ONray7SzW0Cl_sLImwF3Q
          application/json:
            schema:
              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: lZ50AvPxUwbGqQCwWPIO28ONray7SzW0Cl_sLImwF3Q
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: 地址已更改。
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: 链接无效、已被使用或已过期，或表单无效（HTML 页面）。
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '409':
          $ref: '#/components/responses/HtmlConflict'
          description: 该地址在此期间已被另一个账号占用（HTML 页面）。
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: '`auth` 限制（HTML 页面），或按地址限制层（JSON `rate_limited`）。'
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: '数据库持续被锁定（`Retry-After: 1`）：未做任何更改，链接仍然有效。处理程序超时时也返回此状态码。'
  /healthz:
    servers:
      - url: https://caissa.scacelith.com
        description: 官方服务器，根路径下。
      - url: https://caissa.scacelith.com/api/v1
        description: 官方服务器，`/api/v1` 下。
      - url: https://{host}:{port}
        description: 任意 Scacelith 服务器，根路径下。
        variables:
          host:
            default: caissa.scacelith.com
            description: 服务器的公开主机名（`SERVER_PUBLIC_HOST`）。
          port:
            default: "443"
            description: 公开的 API 端口（`PUBLIC_API_PORT`，未设置时为 `API_PORT`）。
      - url: https://{host}:{port}/api/v1
        description: 任意 Scacelith 服务器，`/api/v1` 下。
        variables:
          host:
            default: caissa.scacelith.com
            description: 服务器的公开主机名（`SERVER_PUBLIC_HOST`）。
          port:
            default: "443"
            description: 公开的 API 端口（`PUBLIC_API_PORT`，未设置时为 `API_PORT`）。
    get:
      operationId: getLiveness
      tags:
        - health
      summary: 检查进程是否在运行
      description: |-
        进程运行期间返回 200 `ok`。也可以使用 `HEAD`。其他任何方法（包括 `OPTIONS`）都返回 405 `method_not_allowed`，并带有 `Allow: GET, HEAD`。

        **限制：** 仅按地址限制层。
      security: []
      responses:
        '200':
          description: 进程正在运行。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
              example:
                status: ok
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：按地址限制层。'
  /readyz:
    servers:
      - url: https://caissa.scacelith.com
        description: 官方服务器，根路径下。
      - url: https://caissa.scacelith.com/api/v1
        description: 官方服务器，`/api/v1` 下。
      - url: https://{host}:{port}
        description: 任意 Scacelith 服务器，根路径下。
        variables:
          host:
            default: caissa.scacelith.com
            description: 服务器的公开主机名（`SERVER_PUBLIC_HOST`）。
          port:
            default: "443"
            description: 公开的 API 端口（`PUBLIC_API_PORT`，未设置时为 `API_PORT`）。
      - url: https://{host}:{port}/api/v1
        description: 任意 Scacelith 服务器，`/api/v1` 下。
        variables:
          host:
            default: caissa.scacelith.com
            description: 服务器的公开主机名（`SERVER_PUBLIC_HOST`）。
          port:
            default: "443"
            description: 公开的 API 端口（`PUBLIC_API_PORT`，未设置时为 `API_PORT`）。
    get:
      operationId: getReadiness
      tags:
        - health
      summary: 检查服务器是否接受棋手
      description: |-
        服务器接受棋手时返回 200 `ready`，启动或停止期间返回 503 `not_ready`。也可以使用 `HEAD`。其他任何方法（包括 `OPTIONS`）都返回 405 `method_not_allowed`，并带有 `Allow: GET, HEAD`。

        **限制：** 仅按地址限制层。
      security: []
      responses:
        '200':
          description: 服务器正在接受棋手。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：按地址限制层。'
        '503':
          description: 服务器正在启动或停止。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        从登录响应中得到的会话令牌（`sct_` 后跟 43 个 base64url 字符），放在 `Authorization` 标头中：`Authorization: Bearer <token>`。前缀必须恰好是 `Bearer`（区分大小写）加一个空格；没有该前缀的值，或者不是由 1 到 512 个可打印 ASCII 字符组成的令牌，都会像其他无效令牌一样返回 401 `invalid_token`。空标头视为没有标头。
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: 对局 ID，最多 16 位、无前导零的十进制正整数，小于 2^53。
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: 会话 ID，与 `GET /auth/sessions` 给出的一致，不带前导零（`03` 不是会话 3）。
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: 棋手的用户名，不区分大小写。服务器接受任何由 2 到 24 个 `[A-Za-z0-9_.-]` 字符组成的名称（这是它曾经允许过的最宽松的规则）。
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: 一个对局 ID；只列出比它更早的对局。传入上一页的 `next`。空值视为未提供。
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: 每页数量，1 到 50。不超过 3 位数字的更大数值按 50 计；空值视为未提供。
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: 邮件链接中的令牌（43 个 base64url 字符）。缺失或错误时，显示“链接无效或已过期”页面。
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: 服务器的每个响应都禁止缓存。
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: 重试前需等待的秒数；与响应体中的 `retryAfter` 值相同。
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Bearer 质询，令牌无效时带有 `error="invalid_token"`。
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: 服务器在发送此响应后关闭连接。
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request`（请求体中某个字段有问题时带有 `field`）或 `invalid_json`。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: 某个字段不符合结构定义
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: 请求体不是 JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: 密码太弱
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: 无法读取的 PGN
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized`（没有 `Authorization` 标头）或 `invalid_token`（令牌格式错误、已过期、已被吊销或属于已删除的账号）。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: 没有会话
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: 无效的令牌
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: 请求被拒绝。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: 重新验证身份时密码错误
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: 已被封禁的账号
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found`，或此服务器已关闭的功能。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`：请求体未在 10 秒内到达。服务器会关闭连接。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: 请求与服务器的当前状态冲突。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`：Google 登录尝试或票据未知、已使用或已过期；请从游戏中重新开始。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`：请求体超过 `HTTP_BODY_LIMIT`（默认 16,384 字节）。服务器会关闭连接。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`：请求目标超过 4096 个字符。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`：请求体不是 `application/json`，或其字符集不是 UTF-8。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`：对局超过 `GIF_MAX_PLIES`（600）个半回合。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`：解出 `pow` 质询，然后带上 `pow: { challenge, nonce }` 再次发送同一请求。`reason` 说明原因：`required`、`malformed`、`signature`、`endpoint`、`network`、`expired`、`bits`、`work` 或 `replayed`。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited`（速率限制、账号额度或密码哈希队列）或 `too_many_attempts`（账号限流），带有 `retryAfter` 和 `Retry-After` 标头。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: 速率限制
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: 此账号失败次数过多
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`：意外故障。服务器会将其记入日志。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`：`state` 或 `iss` 错误，或者 Google 拒绝了授权码，或发送了无法通过验证的 ID 令牌。此错误绝不包含 Google 返回的文字。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`、`busy` 或 `timeout`：如果给出了 `retryAfter`，请在其后重试。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: 服务器繁忙
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: 数据库持续被锁定（读取操作）
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: 服务器响应超时
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: GIF 动图，以附件形式提供。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '本服务器上的对局为 `attachment; filename="scacelith-<id>.gif"`，通过 `POST /gif` 发送的 PGN 为 `attachment; filename="scacelith-game.gif"`。'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: 文件大小，以字节为单位。
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: 一个 HTML 页面。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: 说明拒绝原因的 HTML 页面。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: 表单未在 10 秒内到达（HTML 页面）。服务器会关闭连接。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: 说明冲突的 HTML 页面。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: 表单超过 `HTTP_BODY_LIMIT`（HTML 页面）。服务器会关闭连接。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: 请求体既不是表单（`application/x-www-form-urlencoded`）也不是 JSON，或其字符集不是 UTF-8（HTML 页面）。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: 速率限制（HTML 页面），带有 `Retry-After`。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: 意外故障（HTML 页面，标题为“Server error”，即“服务器错误”）。服务器会将其记入日志。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: 服务器繁忙（数据库持续被锁定，带有 `Retry-After`）或处理超时（HTML 页面，标题为“Server error”，即“服务器错误”）。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: JSON API 所有错误响应的统一格式。
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: '`snake_case` 形式的错误代码。客户端据此决定显示什么。'
          examples:
            - rate_limited
        message:
          type: string
          description: 一句英文，用于日志记录和兜底显示。
        retryAfter:
          type: integer
          minimum: 1
          description: 重试前需等待的秒数，仅出现在会随时间解除的拒绝中。此时响应还会带有值相同的 `Retry-After` 标头，但读取对局记录、对局、棋手和排行榜时的 503 `busy` 除外。
        field:
          type: string
          description: 出错的字段或查询参数（用于 `invalid_request`、`invalid_option`，以及 `GET /account/games` 的 `invalid_cursor`、`invalid_limit` 和 `invalid_filter`）。嵌套字段用点号连接（`pow.nonce`）。
        reason:
          type: string
          description: '原因：`weak_password` 违反的规则，或要求或拒绝工作量证明的原因（`pow_required`）。'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: '仅用于 `banned`：封禁的结束时间（Unix 毫秒时间戳），永久封禁时为 `null`。'
        line:
          type: integer
          minimum: 1
          description: '仅用于 `invalid_pgn`：错误所在的行，从 1 开始。'
        column:
          type: integer
          minimum: 1
          description: '仅用于 `invalid_pgn`：错误所在的列，从 1 开始，按字符计算。'
    PowChallenge:
      type: object
      description: 工作量证明质询（428 `pow_required` 中的 `pow`）。
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: 已签名的质询，须原样发回。
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: '`SHA-256(challenge + ":" + nonce)` 必须具有的前导零位数。'
        expiresAt:
          type: integer
          format: int64
          description: 质询的过期时间（Unix 毫秒时间戳），为签发后 2 分钟。
    PowAnswer:
      type: object
      description: 对工作量证明质询的应答。
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: 428 响应中的 `challenge`，原样提供。
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: 最多 20 位数字的十进制字符串，使 `SHA-256(challenge + ":" + nonce)` 以 `bits` 个零位开头。
    ServerInfo:
      type: object
      description: 客户端在登录或连接之前需要的信息。
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: 服务器的名称（`SERVER_NAME`）。
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: 数据库首次启动时获得的 UUID。重启后保持不变。数据库无法提供时为 `null`。
        motd:
          type: string
          description: 每日消息（`SERVER_MOTD`），可能为空。
        protocol:
          type: object
          description: WebSocket 协议（`PROTOCOL.md`）。
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: 服务器支持的最旧协议版本。
            max:
              type: integer
              minimum: 1
              description: 服务器支持的最新协议版本。
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 协议结构定义的指纹（其规范形式的 SHA-256 的前 4 个字节，表示为无符号整数）；仅供参考。
            subprotocol:
              type: string
              description: WebSocket 子协议标识（`Sec-WebSocket-Protocol`）。
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: 棋手使用的 WebSocket 端口（`PUBLIC_WS_PORT`；未设置时为 `WS_PORT`；仍未设置时为 `API_PORT`）。
        wsPath:
          type: string
          const: /ws
          description: WebSocket 的路径。
        registration:
          type: string
          enum:
            - open
            - closed
          description: 是否可以创建新账号。
        emailVerification:
          type: boolean
          description: 新账号是否需要确认其邮箱地址（`REQUIRE_EMAIL_VERIFICATION`）。
        sso:
          type: object
          required:
            - google
          properties:
            google:
              type: boolean
              description: 是否提供 Google 登录。
        mfa:
          type: boolean
          const: true
          description: 双重验证始终可用。
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: 注册所需的工作量证明位数（0 表示不需要）。
        categories:
          type: array
          description: 官方（计分）用时（`RATED_CATEGORIES`），按服务器的顺序排列。其他任何用时都属于 `custom`。
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: 客户端在提交表单之前可以自行检查的规则。
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: 用户名的最短长度（`USERNAME_MIN`）。
            usernameMax:
              type: integer
              description: 用户名的最大长度（`USERNAME_MAX`）。
            usernamePattern:
              type: string
              description: 新用户名必须匹配的正则表达式。
            passwordMinLength:
              type: integer
              description: 密码的最短长度，以字符计（`PASSWORD_MIN_LENGTH`）。
            passwordMaxBytes:
              type: integer
              description: 密码的最大长度，以 UTF-8 字节计。
            customTimeControls:
              type: boolean
              description: 挑战和私人对局是否可以使用自定义用时。
            reportsPerDay:
              type: integer
              description: 每位棋手每 24 小时可提交的举报次数（`REPORTS_PER_DAY`）。
            wsMaxMessageBytes:
              type: integer
              description: 客户端可发送的最大 WebSocket 消息，以字节计。
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 97842216
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: 一种官方用时。
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 用时类别 ID，由分钟数和加秒秒数组成（`3+2`）。
        baseSec:
          type: number
          minimum: 0
          description: 基本用时，以秒计。
        incSec:
          type: number
          minimum: 0
          description: 每步的加秒，以秒计。
    AccountView:
      type: object
      description: 棋手自己所见的账号信息（登录响应和 `GET /account/me` 中的 `user`）。
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: 账号 ID。
        username:
          type: string
          description: 用户名。
        email:
          type: string
          format: email
          description: 邮箱地址。
        emailVerified:
          type: boolean
          description: 邮箱地址是否已确认。
        mfaEnabled:
          type: boolean
          description: 是否已开启双重验证。
        googleLinked:
          type: boolean
          description: 是否已关联 Google 账号。
        hasPassword:
          type: boolean
          description: '对于通过 Google 创建、尚未设置密码的账号，为 `false`。'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: 是否接受通过用户名发起的直接挑战（见 `PUT /account/preferences`）。
        createdAt:
          type: integer
          format: int64
          description: 账号的创建时间（Unix 毫秒时间戳）。
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: 上次登录时间（Unix 毫秒时间戳），或 `null`。
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: 等待链接确认的邮箱更改中的新地址，或 `null`。
    SessionAnswer:
      type: object
      description: 一个新会话。
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: 会话令牌，用于 `Authorization` 标头和 WebSocket。
        expiresAt:
          type: integer
          format: int64
          description: 会话的绝对截止时间（Unix 毫秒时间戳）；空闲期限可能使其更早结束。
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: 开启双重验证时登录的第二步；继续调用 `POST /auth/login/mfa`。
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: 该步骤的令牌，用于 `POST /auth/login/mfa`。
        expiresIn:
          type: integer
          const: 300
          description: 完成该步骤剩余的秒数。
    LoginAnswer:
      description: 一个会话，或开启双重验证时登录的第二步。
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: 首次 Google 登录；继续调用 `POST /auth/sso/complete`。
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: 用于 `POST /auth/sso/complete` 的票据，有效期 10 分钟。
        suggestedUsername:
          type: string
          description: 根据 Google 名称或邮箱地址生成的用户名；没有合适的名称时为 `""`。
    SsoNeedsPassword:
      type: object
      description: 设有密码的账号正在使用该地址；继续调用 `POST /auth/sso/google/link`。此时尚未进行任何关联。
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: 用于 `POST /auth/sso/google/link` 的票据。
        username:
          type: string
          description: 该账号的用户名（只有已向 Google 证明拥有该地址的人才能看到）。
        expiresIn:
          type: integer
          const: 600
          description: 票据的剩余有效秒数。
    SsoFinishAnswer:
      description: '`POST /auth/sso/google/finish` 的响应。'
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: 一次 Google 登录尝试。
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: 尝试的标识，用于 `POST /auth/sso/google/finish`。
        authUrl:
          type: string
          format: uri
          description: 经检查后在系统浏览器中打开的 Google URL。
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Google 必须发回的 `state`。
        expiresIn:
          type: integer
          const: 600
          description: 尝试的剩余有效秒数。
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: 用户名；须符合服务器的规则（见端点说明）。
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: 邮箱地址。去除首尾空白并以小写存储。
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: 密码；须符合密码规则。
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: 用户名或邮箱地址（任何包含 `@` 的文本都视为邮箱地址）。
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: 可选。显示在已登录设备列表中（例如 `Scacelith 1.4 (Windows)`）。
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: 登录响应（或 Google 登录响应）中的 `mfaToken`。
        code:
          type: string
          maxLength: 32
          description: 可选。6 位身份验证器验证码或恢复码。
        recoveryCode:
          type: string
          maxLength: 32
          description: 可选。恢复码。`code` 和 `recoveryCode` 必须提供其一。
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: 邮箱地址。
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: 重置链接中的 `token` 参数。
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: 新密码；适用注册时的密码规则。
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: 客户端 `codeVerifier` 的 S256 PKCE 质询值（`BASE64URL(SHA-256(codeVerifier))`）。
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: 客户端在 `127.0.0.1` 上的监听端口。
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`POST /auth/sso/google/start` 返回的 `attemptId`。'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: PKCE 验证值；其 SHA-256 必须与提供给 `start` 的质询值相符。
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Google 发回的 `state`，原样提供。
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: Google 发回的 `code`，原样提供（不含空格的可打印 ASCII 字符）。
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: 可选。Google 发回了 `iss` 时，原样提供。
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`finish` 返回的 `linkTicket`，有效期 10 分钟。'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: 该账号的密码。
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`finish` 返回的 `ssoTicket`，有效期 10 分钟。'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: 用户名；适用注册规则。
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: 有效会话，最近使用的排在最前。
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: 一个有效会话（一台已登录的设备）。
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: 会话 ID，用于 `DELETE /auth/sessions/{id}`。
        createdAt:
          type: integer
          format: int64
          description: 登录时间（Unix 毫秒时间戳）。
        lastSeenAt:
          type: integer
          format: int64
          description: 最后使用时间（Unix 毫秒时间戳），最多每 5 分钟更新一次。
        expiresAt:
          type: integer
          format: int64
          description: 绝对截止时间（Unix 毫秒时间戳）；空闲期限可能使会话更早结束。
        clientLabel:
          type:
            - string
            - 'null'
          description: 登录时提供的 `clientLabel`；未提供时为 `null`。
        current:
          type: boolean
          description: 是否为发出此请求的会话。
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: 棋手下过计分对局的每个用时类别各一条记录。
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: 生效中的处罚。
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '封禁期间为 `{ until }`，否则为 `null`。'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: 某个用时类别的等级分记录。
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: 用时类别 ID。
        rating:
          type: integer
          description: 等级分。
        games:
          type: integer
          minimum: 0
          description: 在该用时类别中下过的对局数（无论是否计入等级分）。
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: 曾达到的最高等级分。
        provisional:
          type: boolean
          description: '等级分尚未定级，或计入的对局少于 `PROVISIONAL_GAMES` 局时为 `true`（游戏中显示为 `1510?`）。'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: 处罚类型。
        reason:
          type:
            - string
            - 'null'
          description: 给出的理由（如有）。
        startsAt:
          type: integer
          format: int64
          description: 开始时间（Unix 毫秒时间戳）。
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: 结束时间（Unix 毫秒时间戳），永久处罚时为 `null`。
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 封禁的结束时间（Unix 毫秒时间戳），永久封禁时为 `null`。
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` 表示接受通过用户名发起的直接挑战，`none` 表示拒绝。'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: 当前密码。
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: 新密码；适用注册时的密码规则。
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: 该账号的密码。
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: 由待启用密钥生成的验证码，恰好 6 位数字。
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: 该账号的密码。
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: 可选；开启双重验证时必须提供（或改为提供 `recoveryCode`）。身份验证器验证码或恢复码。
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: 可选。恢复码（`xxxx-xxxx-xx`；大小写、空格和连字符均不影响）。
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: 该账号的密码。
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: 身份验证器验证码（不接受恢复码）。
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: 新地址；去除首尾空白并转为小写，然后按注册时的地址规则检查。
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: 该账号的密码。
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: 可选；开启双重验证时必须提供（或改为提供 `recoveryCode`）。身份验证器验证码或恢复码。
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: 可选。恢复码。
    TotpSetup:
      type: object
      description: 供身份验证器应用使用的待启用密钥。
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: base32 编码的密钥，用于手动输入到应用中。
        uri:
          type: string
          format: uri
          description: '`otpauth://totp/...` URI，用于显示为二维码。'
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: 每个时间步的秒数。
    RecoveryCodeList:
      type: array
      description: 10 个恢复码，仅显示这一次。每个恢复码只能使用一次。
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: 对局中的一方。
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: 棋谱中的名字（已删除的账号为 `deleted#<id>`）。
        rating:
          type:
            - integer
            - 'null'
          description: 开始时的等级分，未知时为 `null`。
        ratingAfter:
          type:
            - integer
            - 'null'
          description: 对局后的等级分。计分对局总会有此值；仅当对局不计入等级分时（不计分、自定义用时、已中止）为 `null`。
        ratingDiff:
          type:
            - integer
            - 'null'
          description: 等级分变化；若等级分规则使等级分保持不变（FIDE 的零分规则、对手尚未定级、尚未定级棋手的最初几局），则为 `0`；为 `null` 的情况与 `ratingAfter` 相同。
    GameSummary:
      type: object
      description: 已存储对局的摘要。
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: 对局 ID。
        category:
          type: string
          description: 官方用时类别 ID（`3+2`），或 `custom`。
        rated:
          type: boolean
          description: 该对局是否计入等级分。
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 以秒表示的用时（`180+2`）。
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`、2 `BlackWins`、3 `Draw`、4 `Aborted`（见对局代码）。'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: 结束原因代码（见对局代码）。
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: 结果，已中止的对局为 `*`。
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: 半回合数。
        startedAt:
          type: integer
          format: int64
          description: 开始时间（Unix 毫秒时间戳）。
        endedAt:
          type: integer
          format: int64
          description: 结束时间（Unix 毫秒时间戳）。
    Termination:
      type: string
      description: 结束原因的名称（见对局代码）；协议不认识的代码为 `Unknown`。
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: 从某一方棋手角度看的对局摘要。
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: 该棋手所执的一方。
    HistoryGameSummary:
      description: 已登录棋手对局记录中的一局。
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: 基本用时，以毫秒计。
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: 加秒，以毫秒计。
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: 从该棋手一方来看的胜负结果。
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: 本页的对局，最新的排在最前。
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: 获取下一页时作为 `before` 传入的 ID；最后一页为 `null`。
        total:
          type: integer
          minimum: 0
          description: 所有页中符合筛选条件的对局数。
    MoveRecord:
      type: object
      description: 对局中的一个半回合。
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: 以 UCI 记法表示的着法；升变时附加 `n`、`b`、`r` 或 `q`。
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: 该步所计的用时（毫秒），记录中没有时为 `null`。
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: 走棋方在该步之后的棋钟剩余时间（毫秒），记录中没有时为 `null`。
    PgnTagsView:
      type: object
      description: 主要的 PGN 标签，用于显示。此处的 `Termination` 是结束原因的名称；PGN 文件中使用的是 PGN 标准值。
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` 或 `<SERVER_NAME> casual <category>`。'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`。'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: UTC 开始日期。
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: 开始时的等级分，或 `"-"`。
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: 开始时的等级分，或 `"-"`。
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: 包含着法和棋钟时间的棋谱。它具有对局摘要的各个字段，但没有 `color` 和 `outcome`。
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: 基本用时，以毫秒计。
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: 加秒，以毫秒计。
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: '`status` 的名称。'
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: 本局作为再战所对应的原对局 ID，或 `null`。
            moves:
              type: array
              description: 每个半回合一条记录。
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: 仅当令牌所属棋手参加了该对局时出现；表示其所执的一方。
            reportable:
              type: boolean
              description: 仅当令牌所属棋手参加了该对局时出现；如果 `POST /reports` 此刻会受理针对该对局中对手的举报（对局在 7 天内结束、每日配额尚未用完、且尚未因该对局举报过该对手），则为 `true`。
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: 用户名，保留棋手书写时的大小写形式。
        createdAt:
          type: integer
          format: int64
          description: 账号的创建时间（Unix 毫秒时间戳）。
        ratings:
          type: array
          description: 仅包含官方用时类别，按服务器的顺序排列。
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: 所有已存储的对局，包括不计分对局和已中止的对局。
            rated:
              type: integer
              minimum: 0
              description: 计分对局数，对各条等级分记录求和得出。
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: 用户名，保留棋手书写时的大小写形式。
        games:
          type: array
          description: 本页的对局，最新的排在最前。
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: 只要本页已满，即为最后一局的 ID（此时下一页可能为空），否则为 `null`。
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: 用时类别 ID。
        minGames:
          type: integer
          minimum: 0
          description: 记录进入排行榜所需的已计入对局数（`PROVISIONAL_GAMES`）。
        updatedAt:
          type: integer
          format: int64
          description: 排行榜的计算时间（Unix 毫秒时间戳）。
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: PGN 文本，最多 65,536 字节 UTF-8。只使用第一局对局。
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: 可选。图像尺寸。
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: 可选。位于棋盘下方的一方。
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: 可选。每步着法的毫秒数，值为整数的 JSON 数字。
        coords:
          type: boolean
          default: true
          description: 可选。是否在棋盘四周绘制坐标（直线字母和横线数字）。
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: 对局，以整数或由 1 到 16 位数字组成的字符串表示。
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: 对手的用户名，可以是棋谱中的名字，也可以是其当前的名字，不区分大小写。不得为空白。
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: 举报的内容类别。
        comment:
          type:
            - string
            - 'null'
          description: 可选。去除控制字符（制表符和换行符除外）并去除首尾空白后，最多 500 个字符。
    AccountExport:
      type: object
      description: 服务器保存的有关该账号的全部信息（时间均为 Unix 毫秒时间戳）。
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: 导出的时间。
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`。'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`。'
        notes:
          type: array
          description: 以简明的英文向棋手说明文件包含和不包含哪些内容。
          items:
            type: string
        account:
          description: '`GET /account/me` 的账号视图，外加 `googleEmail`。'
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: 已关联 Google 账号的邮箱地址，或 `null`。
        ratings:
          type: array
          description: 完整的等级分记录。
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: 因对手被查出作弊而退还的等级分，按 UTC 日期和用时类别汇总，最新的排在最前。既不列出相关对局，也不点名作弊者。
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: 所有已存储的会话，最新的排在最前，不含任何令牌。保留期清理会删除已过期的会话；已退出登录的会话则在退出登录一天后删除。
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: 安全事件，最新的排在最前，保留 `RETENTION_SECURITY_DAYS` 天。
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: 所有处罚，包括已解除的处罚。绝不包含管理员的名字。
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: 针对棋手弃局、中止和未按时走出第一步的对局所记录的行为事件，保留 30 天。
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: 该棋手提交的举报。
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: 对局数。
            list:
              type: array
              description: 所有对局，最新的排在最前，格式与 `GET /account/games` 的摘要相同。着法可通过 `GET /games/{id}` 获取，PGN 可通过 `GET /games/{id}/pgn` 获取。
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: 一条完整的等级分记录。
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: 棋手是否已结束未定级阶段。
            countedGames:
              type: integer
              minimum: 0
              description: 计入等级分的对局数。
            updatedAt:
              type: integer
              format: int64
              description: 该记录最后一次变更的时间。
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: 当天的 UTC 00:00（Unix 毫秒时间戳）。
        category:
          type: string
        points:
          type: integer
          description: 当天在该用时类别中退还的分数。
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: 会话退出登录的时间，或 `null`。
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: 登录时的 IP 地址，在 `RETENTION_IP_DAYS` 天后清除。
    SecurityEvent:
      type: object
      description: |-
        一个安全事件。只有通过已登录的会话、凭账号密码（及第二重验证）或凭发送到其邮箱地址的链接所进行的操作，才会给出 `ip`：`register`、`email_verified`、`login`、`sso_login`、`sso_linked`、`sso_account_created`、`recovery_code_used`、`password_reset`、`password_changed`、`reauth_failed`、`mfa_setup_started`、`mfa_enabled`、`mfa_disabled`、`recovery_codes_regenerated`、`session_revoked`、`sessions_revoked_all`、`email_change_requested`、`email_changed`、`email_change_refused` 和 `account_exported`；其他所有类型均为 `ip: null`，且 `ip` 会在 `RETENTION_IP_DAYS` 天后清除。

        `detail` 只保留以下字段：`login`：`method`；`sso_login`、`sso_account_created`：`provider`；`sso_linked`：`provider` 和 `method`（`password` 或 `password+totp`）；`login_failed`：`failures`；`login_lockout`：`retryAfterMs`；`mfa_failed`：`attempts`；`recovery_code_used`：`remaining`；`reauth_failed`：`factor`；`session_revoked` 和 `sessions_revoked_all`：`reason`；`email_change_refused`：`reason`；`sanction_auto`：`kind`、`gameId`、`until`。`moderator_action` 事件只保留 `{ action }`，且仅限 `ban`、`unban`、`reset_mfa`、`verify_email` 和 `revoke_sessions` 这几种操作（其他管理员操作不包含在内）。其他所有类型均为 `detail: null`。`rating_refund` 事件不包含在内：其分数见 `ratingRefunds`。
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: 事件类型（`login`、`password_changed`……）。
        at:
          type: integer
          format: int64
          description: 发生时间。
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: 被举报棋手当前的公开名称。
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: 举报是否仍在处理中（不会透露被举报棋手是否受到处罚）。
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: 邮件链接中的令牌（页面表单中的隐藏字段）。
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: 重置链接中的令牌（表单中的隐藏字段）。
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: 新密码；适用注册时的密码规则。
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: 再次输入新密码；必须与新密码一致。
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: UTF-8 编码的 HTML 页面（`text/html; charset=utf-8`），不含 JavaScript 或外部资源。
