        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`account` 限制或账号额度。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（数据库持续被锁定）、`timeout`。'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: 修改密码
      description: |-
        修改密码。需要当前密码，但即使开启了双重验证，也不需要第二重验证。新密码须遵守注册规则（在检查当前密码之后检查）。

        修改密码会吊销其他所有会话（当前会话保持登录），取消待处理的邮箱更改，使该账号的密码重置链接失效，并向账号所有者发送一封邮件。

        **重新验证身份：** 仅需密码。**限制：** `reauth`，然后是 `reauth_user`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: 密码已修改。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set`（仅使用 Google 登录的账号）、`weak_password`（带有 `reason`）、`invalid_request`、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`：当前密码错误，或者在检查请求期间密码恰好被重置或修改。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（该账号重新验证身份失败），或 `rate_limited`（`reauth` 或 `reauth_user` 限制、账号额度、密码哈希队列）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（密码哈希队列，或数据库持续被锁定）、`timeout`。'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: 开始开启双重验证
      description: |-
        保存一个新的待启用身份验证器密钥（取代之前任何待启用的密钥），并返回它供身份验证器应用使用（以文本形式，以及可显示为二维码的 `otpauth://` URI）。此时双重验证尚未开启：`POST /account/mfa/totp/enable` 使用由该密钥生成的验证码将其开启。

        **重新验证身份：** 仅需密码。**限制：** `reauth`，然后是 `reauth_user`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: 待启用的密钥。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set`（仅使用 Google 登录的账号）、`invalid_request`、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`（在检查密码之前检查）。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（该账号重新验证身份失败），或 `rate_limited`（`reauth` 或 `reauth_user` 限制、账号额度、密码哈希队列）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（密码哈希队列，或数据库持续被锁定）、`timeout`。'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: 完成开启双重验证并获取恢复码
      description: |-
        使用由待启用密钥生成的验证码（恰好 6 位数字）开启双重验证。此处不要求密码；密码已在设置步骤中提供。响应包含 10 个恢复码，仅显示这一次。

        **限制：** `reauth`，然后是 `reauth_user`；错误的验证码计入该账号的重新验证身份失败次数。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: 双重验证已开启。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`：`code` 不是恰好 6 位数字，或请求体不符合结构定义；`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`：验证码错误（请检查设备的时间）。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`；`mfa_setup_required`：没有待启用的密钥（请先调用 `POST /account/mfa/totp/setup`）。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（该账号重新验证身份失败），或 `rate_limited`（`reauth` 或 `reauth_user` 限制、账号额度）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（数据库持续被锁定）、`timeout`。'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: 关闭双重验证
      description: |-
        关闭双重验证。密钥和恢复码会被删除，账号所有者会收到一封邮件。

        **重新验证身份：** 密码，以及身份验证器验证码或恢复码（`code` 和 `recoveryCode` 必须提供其一）。**限制：** `reauth`，然后是 `reauth_user`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: 双重验证已关闭。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set`（仅使用 Google 登录的账号）、`invalid_request`、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required`（既没有 `code` 也没有 `recoveryCode`，在检查密码之前检查）、`invalid_password`、`invalid_code`。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（重新验证身份失败，或此账号尝试的验证码过多），或 `rate_limited`（`reauth` 或 `reauth_user` 限制、账号额度、密码哈希队列）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（密码哈希队列，或数据库持续被锁定）、`timeout`。'
  /account/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags:
        - two-step-verification
      summary: 更换恢复码
      description: |-
        用 10 个新恢复码替换现有恢复码；旧恢复码随即失效。

        **重新验证身份：** 密码，以及放在 `code` 中的身份验证器验证码（恢复码会被拒绝，返回 403 `invalid_code`）。**限制：** `reauth`，然后是 `reauth_user`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodesRequest'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: 新的恢复码，仅显示这一次。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - recoveryCodes
                properties:
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set`（仅使用 Google 登录的账号）、`invalid_request`、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`、`mfa_code_required`、`invalid_code`（提供恢复码时也是如此）。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（重新验证身份失败，或此账号尝试的验证码过多），或 `rate_limited`（`reauth` 或 `reauth_user` 限制、账号额度、密码哈希队列）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（密码哈希队列，或数据库持续被锁定）、`timeout`。'
  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: 修改邮箱地址
      description: |-
        修改账号的邮箱地址。`newEmail` 会去除首尾空白并转为小写，然后按注册时的地址规则检查。

        **需要邮件确认时**（默认）：返回 202 `verification_sent`。一个有效期为 24 小时的链接会发送到新地址；它会打开 `/confirm-email-change`，只有当棋手按下该页面上的按钮时，地址才会更改。在此之前，`GET /account/me` 将新地址显示为 `pendingEmail`。新的请求会取代待处理的请求；修改或重置密码会取消它。无论由谁发起，每个新地址每 5 分钟最多收到一个链接（针对已在待处理中的同一更改再次请求时，保留先前发送的链接，该链接仍然有效）；响应保持不变。当前地址会收到一条通知，告知有人请求将地址改为某个经过打码的地址（`a***@example.org`）。如果新地址已被另一个账号使用，响应和 `pendingEmail` 也完全相同：此时不发送链接，因此这次更改永远不会完成，改为向该地址的所有者发送一条通知（每小时最多一条）。

        链接确认后，地址随即更改并视为已确认，各设备保持登录状态，先前发送的链接（确认、密码重置、其他更改）失效，原地址会收到通知，其中的新地址经过打码处理。

        **不需要邮件确认时**（`REQUIRE_EMAIL_VERIFICATION=false`）：地址立即更改（200 `email_changed`），原地址会收到通知。如果另一个账号正在使用该地址，响应为 409 `email_taken`，该地址的所有者会收到通知。

        **重新验证身份：** 密码；开启双重验证时，还需身份验证器验证码或恢复码。`invalid_email` 和 `same_email` 在检查密码之前检查，因此不计为失败。**限制：** `reauth`，然后是 `reauth_user`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: 地址已立即更改（此服务器不需要邮件确认）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: 新地址，与存储的形式一致。
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: 确认链接已发送到新地址（也可能该地址属于另一个账号；响应不会透露这一点）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`、`same_email`（即账号当前的地址）、`password_not_set`（仅使用 Google 登录的账号）、`invalid_request`、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`（若在处理请求期间密码先被修改或重置，也会返回此错误：不发送链接）、`mfa_code_required`、`invalid_code`。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`：仅在不需要邮件确认时。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（重新验证身份失败，或此账号尝试的验证码过多），或 `rate_limited`（`reauth` 或 `reauth_user` 限制、账号额度、密码哈希队列）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`：密码哈希队列，或数据库持续被锁定（`retryAfter: 1`：未做任何更改，可以再次发送相同的请求）。`timeout`。'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: 下载账号数据
      description: |-
        服务器保存的有关该账号的全部信息，以一个可保存的 JSON 文件提供（`format` 为 `scacelith-account-export`，`version` 为 1）。导出会记录一个安全事件（`account_exported`）。文档中的 `notes` 数组用简明的英文告诉棋手哪些内容未包含在内。

        **导出中绝不包含：** 密码哈希、双重验证密钥和恢复码；任何会话令牌或链接令牌，或其哈希值；反作弊系统的数据（诚信等级和评分、异常情况、对局分析、举报的权重）；其他棋手对该棋手的举报；管理员的身份；其他棋手的私人数据（对手仅以其公开名称和等级分出现，不会透露其他棋手是否受到处罚，也不包含任何可能属于他人的 IP 地址）。

        **重新验证身份：** 密码；开启双重验证时，还需身份验证器验证码或恢复码。**限制：** `account_export`（每位棋手每小时 5 次，在整台服务器范围内计数；每次尝试都计数，包括失败的尝试；最先检查），然后是 `reauth` 和 `reauth_user`。**时间限制：** 60 秒。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: 导出文档，以附件形式提供。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-account-<username>.json"`。用户名中除字母、数字、`_`、`.` 和 `-` 以外的字符都会变为 `_`。'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-account-[A-Za-z0-9_.-]+\.json"$'
              example: attachment; filename="scacelith-account-alice.json"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
              example:
                format: scacelith-account-export
                version: 1
                exportedAt: 1790882839708
                server:
                  name: Scacelith
                  host: caissa.scacelith.com
                notes:
                  - This file holds the data Scacelith keeps about your account. Times are milliseconds since 1970-01-01 UTC.
                account:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  pendingEmail: null
                  mfaEnabled: false
                  googleLinked: false
                  googleEmail: null
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882839743
                  lastLoginAt: 1790882839708
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                    rated: true
                    countedGames: 2
                    updatedAt: 1790882839809
                ratingRefunds:
                  - day: 1790812800000
                    category: '3+2'
                    points: 9
                sessions:
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
