  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Liên kết Google với tài khoản hiện có bằng mật khẩu của tài khoản đó
      description: |-
        Sau khi `finish` trả về `needsPassword`: liên kết Google với tài khoản hiện có bằng mật khẩu của tài khoản đó, được nhập trong trò chơi. Phản hồi (200) là một phiên (liên kết được lưu và người chơi đã đăng nhập), hoặc, khi xác thực hai yếu tố được bật, `{ mfaRequired, mfaToken, expiresIn }`: tiếp tục với `POST /auth/login/mfa`, và liên kết chỉ được lưu khi một mã được chấp nhận ở đó.

        Mật khẩu sai vẫn để vé dùng được, tổng cộng 5 lượt thử. Một lượt thử bị tính ngay trước khi kiểm tra mật khẩu: 429 `too_many_attempts` hoặc 428 `pow_required` không tính lượt nào, còn lần từ chối của hàng đợi băm mật khẩu (503 `server_busy`, 429 `rate_limited`) đã tính một lượt và được coi là một lần thất bại của tài khoản. Độ trễ sau thất bại dùng cùng bộ đếm với `POST /auth/login`.

        **Giới hạn:** `auth` (kèm cách tính theo IPv6 /48 của nó). **Bằng chứng công việc:** như với `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Một phiên, hoặc bước thứ hai của quá trình đăng nhập.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: sai mật khẩu; vé vẫn còn, tổng cộng được thử 5 lần.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (kèm `until`), chỉ sau khi nhập đúng mật khẩu.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: máy chủ này không cung cấp đăng nhập bằng Google.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: trong lúc đó, tài khoản Google đã được liên kết với một tài khoản khác.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: vé không xác định, đã được dùng hoặc đã hết hạn, lần sai mật khẩu thứ 5, tài khoản có trạng thái hoặc địa chỉ đã thay đổi kể từ `finish`, hoặc tài khoản có trạng thái, địa chỉ, mật khẩu hoặc xác thực hai yếu tố thay đổi trong lúc liên kết đang được lưu. Hãy bắt đầu đăng nhập lại.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (độ trễ sau thất bại của tài khoản), hoặc `rate_limited` (giới hạn `auth`, hàng đợi băm mật khẩu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: hàng đợi băm mật khẩu, hoặc cơ sở dữ liệu vẫn bị khóa (`retryAfter: 1`, chưa liên kết gì). `timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
