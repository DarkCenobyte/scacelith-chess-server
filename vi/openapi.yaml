                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: phần thân khác `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: giới hạn `sessions` hoặc hạn mức tài khoản.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (cơ sở dữ liệu vẫn bị khóa), `timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Gửi lại liên kết xác nhận
      description: |-
        Gửi lại liên kết xác nhận email. Phản hồi luôn là 202 `accepted` bất kể địa chỉ nào, để không bao giờ tiết lộ có tài khoản hay lượt đăng ký nào đang dùng địa chỉ đó hay không.

        Yêu cầu chỉ có tác dụng tối đa một lần mỗi 5 phút cho mỗi địa chỉ. Lượt đăng ký đang chờ với địa chỉ đó được tính lại đủ 24 giờ, dù có tài khoản khác dùng địa chỉ đó hay không, để tên người dùng của nó được giữ chỗ lâu như nhau trong cả hai trường hợp. Liên kết chỉ được gửi cho lượt đăng ký đó khi địa chỉ chưa có tài khoản (một liên kết mới, có hiệu lực 24 giờ, thay thế liên kết trước), hoặc cho một tài khoản đang hoạt động, chưa xác nhận, có địa chỉ đó.

        **Giới hạn:** `auth`, rồi `auth_mail` (10 mỗi giờ cho mỗi client).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Đã chấp nhận (bất kể địa chỉ nào).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: giới hạn `auth` hoặc `auth_mail` (bất kể địa chỉ nào).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` với `retryAfter: 1`: cơ sở dữ liệu vẫn bị khóa trong lúc tra cứu tài khoản hoặc lưu liên kết của một tài khoản chưa xác nhận (việc gia hạn lượt đăng ký đang chờ chỉ được thực hiện ở mức cố gắng tối đa và không bao giờ làm yêu cầu thất bại); khoảng 5 phút của địa chỉ vẫn bắt đầu tính, nên một yêu cầu mới trong khoảng đó không có tác dụng gì. `timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Gửi liên kết đặt lại mật khẩu
      description: |-
        Gửi liên kết đặt lại mật khẩu, có hiệu lực trong một giờ, mở trang `/reset-password`. Phản hồi luôn là 202 `accepted` bất kể địa chỉ nào. Liên kết chỉ được gửi tới một tài khoản đang hoạt động, tối đa một lần mỗi 5 phút cho mỗi địa chỉ. Tài khoản chỉ dùng Google đặt mật khẩu đầu tiên theo cách này.

        Việc khôi phục mật khẩu có các giới hạn nghiêm ngặt nhất của API, tất cả đều được tính cho toàn bộ máy chủ: 3 yêu cầu mỗi giờ (`AUTH_FORGOT_PER_HOUR`) và 10 yêu cầu mỗi 24 giờ (`AUTH_FORGOT_PER_DAY`) cho mỗi client (một địa chỉ IPv4 hoặc một mạng IPv6 /64), gấp 3 lần các con số đó cho mỗi IPv6 /48, cộng thêm giới hạn `auth` (20 mỗi 10 phút) và giới hạn một thư cho mỗi địa chỉ mỗi 5 phút. Cả 202 lẫn 429 đều không cho biết có tài khoản nào đang dùng địa chỉ đó hay không. Việc đặt mật khẩu mới có giới hạn riêng (`auth_reset`).

        **Giới hạn:** `auth`, `auth_forgot`, rồi `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Đã chấp nhận (bất kể địa chỉ nào).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: giới hạn `auth`, `auth_forgot` hoặc `auth_forgot_day` (bất kể địa chỉ nào).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` với `retryAfter: 1`: cơ sở dữ liệu vẫn bị khóa trong lúc tra cứu tài khoản hoặc lưu liên kết; khoảng 5 phút của địa chỉ vẫn bắt đầu tính, nên một yêu cầu mới trong khoảng đó không gửi liên kết nào. `timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Đặt mật khẩu mới bằng token của liên kết đặt lại mật khẩu
      description: |-
        Đặt mật khẩu mới bằng token của một liên kết đặt lại mật khẩu (trang `/reset-password` cũng làm điều tương tự). Mật khẩu mới tuân theo các quy tắc khi đăng ký.

        Việc đặt lại có các tác động sau, trong một giao dịch duy nhất (tất cả hoặc không gì cả): thu hồi mọi phiên và hủy việc đổi email đang chờ; các liên kết đặt lại mật khẩu khác của tài khoản ngừng hoạt động; địa chỉ được coi là đã xác nhận (liên kết đã chứng minh điều đó); chủ sở hữu nhận một thư. Xác thực hai yếu tố không bị ảnh hưởng. Sau lỗi của hàng đợi băm mật khẩu, lỗi 503 hoặc 500, không có gì thay đổi: mật khẩu cũ và các phiên vẫn giữ nguyên, và liên kết vẫn còn hiệu lực.

        **Giới hạn:** `auth`, rồi `auth_reset` (10 mỗi giờ cho mỗi client, 30 cho mỗi IPv6 /48, dùng chung với trang: mỗi lần thử đều băm một mật khẩu).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Mật khẩu đã được thay đổi và mọi phiên đã được đăng xuất.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: liên kết không hợp lệ, đã được dùng hoặc đã hết hạn, hoặc đã được gửi tới một địa chỉ mà tài khoản không còn dùng. `weak_password` (kèm `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: giới hạn `auth` hoặc `auth_reset`, hoặc hàng đợi băm mật khẩu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: hàng đợi băm mật khẩu, hoặc cơ sở dữ liệu vẫn bị khóa (`retryAfter: 1`, không có gì thay đổi). `timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Bắt đầu đăng nhập bằng Google
      description: |-
        Bắt đầu một lượt đăng nhập bằng Google cho challenge PKCE và cổng của trình lắng nghe của trò chơi trên `127.0.0.1`. Phản hồi cung cấp URL Google cần mở trong trình duyệt của hệ thống và `state` của lượt đăng nhập; lượt đăng nhập có hiệu lực trong 10 phút.

        `authUrl` chứa `client_id`, `redirect_uri` (tạo từ `redirectPort` và nhãn origin của máy chủ), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 của verifier riêng của máy chủ dành cho Google) với `code_challenge_method=S256`, và `prompt=select_account`. Trò chơi kiểm tra URL này trước khi mở (xem phần mô tả của mục).

        **Giới hạn:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Lượt đăng nhập.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: máy chủ này không cung cấp đăng nhập bằng Google.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: giới hạn `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (cơ sở dữ liệu vẫn bị khóa), `timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Bắt đầu đăng nhập bằng Google trên website
      description: |-
        Bắt đầu một lượt đăng nhập bằng Google của website cho challenge PKCE của trang. Phản hồi giống như với trò chơi: URL Google cần điều hướng tới, và `state` của lượt đăng nhập; lượt đăng nhập có hiệu lực trong 10 phút. Có sẵn khi `GET /info` báo `sso.googleWeb: true`.

        `authUrl` chứa `client_id` của website và `redirect_uri=GOOGLE_WEB_REDIRECT_URI`, cùng các tham số khác giống như với trò chơi. Trang kiểm tra URL này trước khi điều hướng tới (xem **Trên website** trong phần mô tả của mục).

        **Giới hạn:** `sso_start`, dùng chung với start của trò chơi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: Lượt đăng nhập.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `codeChallenge` bị thiếu hoặc sai định dạng, hoặc có bất kỳ trường nào khác (kể cả `redirectPort`).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: máy chủ này không cung cấp đăng nhập bằng Google, hoặc không cung cấp cho website.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: giới hạn `sso_start` (dùng chung với start của trò chơi).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (cơ sở dữ liệu vẫn bị khóa), `timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Chuyển phản hồi của Google cho máy chủ
      description: |-
        Chuyển cho máy chủ `code` và `state` mà Google đã gửi tới trình lắng nghe của trò chơi hoặc tới trang của website, kèm id của lượt đăng nhập và verifier PKCE. Id của lượt đăng nhập vô dụng nếu không có verifier, và mã vô dụng nếu không có verifier PKCE riêng của máy chủ cùng client secret.

        Máy chủ kiểm tra lượt đăng nhập (không xác định, đã dùng hoặc đã hết hạn: 410), rồi kiểm tra verifier (verifier sai vẫn để lượt đăng nhập dùng được), rồi sử dụng lượt đăng nhập một lần, kiểm tra `state` và `iss`, trao đổi mã với Google và xác minh ID token. Phản hồi (200) là một trong các dạng sau:

        - `{ token, expiresAt, user }`: đã đăng nhập vào tài khoản được liên kết;
        - `{ mfaRequired, mfaToken, expiresIn }`: tiếp tục với `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: một tài khoản mới; tiếp tục với `POST /auth/sso/complete` trong vòng 10 phút. `suggestedUsername` lấy từ tên Google hoặc địa chỉ email, và là `""` khi không có tên nào phù hợp;
        - `{ needsPassword, linkTicket, username, expiresIn }`: tài khoản có địa chỉ đó có mật khẩu; tiếp tục với `POST /auth/sso/google/link`. Chưa có gì được liên kết.

        **Giới hạn:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Một phiên, một bước thứ hai, hoặc bước tiếp theo của lần đăng nhập bằng Google đầu tiên.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Đã đăng nhập vào tài khoản được liên kết
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Xác thực hai yếu tố đang bật
                  value:
                    mfaRequired: true
