  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Tải xuống một ván cờ dưới dạng tệp PGN
      description: |-
        Cùng ván cờ đó dưới dạng tệp PGN: một ván với ký tự xuống dòng `\n`, và phần nước đi được chia thành các dòng dưới 80 cột. Phản hồi như nhau dù có hay không có token.

        Các thẻ PGN, theo thứ tự này: `Event` (`<SERVER_NAME> rated <category>` hoặc `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (ngày bắt đầu theo UTC), `Round`, `White`, `Black`, `Result` (`*` cho ván bị hủy), `UTCDate` và `UTCTime` (thời điểm bắt đầu), `WhiteElo` và `BlackElo` (hệ số Elo lúc bắt đầu, hoặc `-`), `WhiteRatingDiff` và `BlackRatingDiff` (mức thay đổi, chẳng hạn `+10` và `-10`, trong mọi ván tính điểm, `+0` khi các quy tắc tính hệ số giữ nguyên hệ số; ván giao hữu, ván có thời gian thi đấu tùy chỉnh hoặc ván bị hủy không có hai thẻ này), `TimeControl` (tính bằng giây), `Termination` (một giá trị chuẩn của PGN: `normal`; `time forfeit`, hết giờ, kể cả khi ván kết thúc hòa; `abandoned`; `rules infraction`, nước đi không hợp lệ thứ hai hoặc bị xử thua vì vi phạm chơi công bằng; `unterminated`, ván bị hủy), `PlyCount`, `ScacelithGameId` (id dạng thập phân).

        Mỗi nước đi mang `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: đồng hồ của người vừa đi sau nước đi đó và thời gian bị tính cho nước đi, theo phần mười giây (cắt bỏ phần lẻ). Một giá trị được lược bỏ khi bản ghi không có giá trị đó. Sau nước đi cuối cùng là lý do kết thúc viết bằng chữ, rồi đến kết quả.

        **Giới hạn:** `public_read` (theo người chơi khi có token, theo client khi không có).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Tệp PGN.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'Văn bản PGN, mã hóa UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: không phải số nguyên dương có tối đa 16 chữ số (nhỏ hơn 2^53); `invalid_request`: không phải mã hóa URL hợp lệ.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: đã gửi một token và token đó không hợp lệ.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: không có ván cờ này.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: giới hạn `public_read` hoặc hạn mức tài khoản.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: chẳng hạn khi các nước đi đã lưu không thể phát lại đến đúng kết thúc đã lưu (máy chủ ghi lỗi này vào nhật ký).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (cơ sở dữ liệu vẫn bị khóa; `retryAfter: 1` trong phần thân, không có header `Retry-After`), `server_busy` (việc tra cứu phiên gặp cơ sở dữ liệu bị khóa), `timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Tải xuống một ván cờ của máy chủ này dưới dạng ảnh GIF động
      description: |-
        Ván cờ dưới dạng ảnh GIF động. Tên và hệ số Elo lấy từ bản ghi ván cờ (hệ số lúc bắt đầu, tài khoản đã xóa hiện là `deleted#<id>`), kết quả và cách kết thúc cũng vậy (`Resignation`, `Loss on time`…).

        Các bước kiểm tra theo thứ tự: `gif_disabled`, các tùy chọn hình ảnh (`size`, `orientation`, `delay`, `coords`), id ván cờ, ván cờ, độ dài của ván.

        **Yêu cầu phiên:** hạn ngạch được tính theo tài khoản. **Giới hạn:** `gif` cho mọi yêu cầu; `gif_user_min`, `gif_user_hour`, `gif_ip_min` và `gif_ip_hour` chỉ khi phải tạo ảnh GIF (xem phần mô tả của mục). **Giới hạn thời gian:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 giây (mặc định là 45 giây).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: Kích thước hình ảnh, `small` (ô 32 px), `medium` (48 px) hoặc `large` (72 px).
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Bên ở phía dưới bàn cờ.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Số mili giây cho mỗi nước đi (từ 1 đến 6 chữ số thập phân).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Có vẽ chữ cái của cột và số của hàng quanh bàn cờ (`1`) hay không (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` kèm `field` (`size`, `orientation`, `delay` hoặc `coords`): một giá trị nằm ngoài các giá trị cho phép. `invalid_game_id`. `invalid_request`: không phải mã hóa URL hợp lệ.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: không có ván cờ này. `gif_disabled`: máy chủ đã tắt ảnh GIF (`GIF_ENABLED=false`; token `gif` được hoàn lại).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: giới hạn `gif`, một giới hạn kết xuất, hoặc hạn mức tài khoản.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: không thể tạo ảnh GIF (máy chủ ghi lý do vào nhật ký). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` kèm `retryAfter` (từ 3 đến 10 giây) và `Retry-After`: hàng đợi kết xuất đã đầy, hoặc ảnh GIF đã chờ một luồng rảnh trong `GIF_QUEUE_TIMEOUT_MS` (10 giây); mọi token giới hạn mà yêu cầu đã lấy đều được hoàn lại. `busy`: cơ sở dữ liệu vẫn bị khóa (`retryAfter: 1` chỉ có trong phần thân). `timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Tạo ảnh GIF động của bất kỳ ván cờ nào được gửi dưới dạng PGN
      description: |-
        Cùng hình ảnh như `GET /games/{id}/gif` cho bất kỳ ván cờ nào được gửi dưới dạng văn bản PGN: một ván do trò chơi lưu, một tệp xuất từ trang web khác, một ván gõ bằng tay. Chỉ ván đầu tiên trong văn bản được dùng.

        - Trình đọc PGN chấp nhận những gì trình đọc của chính trò chơi chấp nhận: mọi PGN mà máy chủ này ghi ra và các tệp xuất thông thường của các trang web khác (chú thích, biến thể, NAG và chú thích đồng hồ được bỏ qua; số thứ tự nước đi và SAN được đọc một cách linh hoạt; thẻ `FEN` cho thế cờ xuất phát, trừ khi `SetUp` là `"0"`).
        - Tên và hệ số Elo lấy từ các thẻ `White`, `Black`, `WhiteElo` và `BlackElo`. Các chữ cái có dấu bị bỏ dấu, các ký tự khác nằm ngoài ASCII in được trở thành `?`, và tên dài bị cắt bớt (48 ký tự). Kết quả lấy từ thẻ `Result`, nếu không có thì từ cuối phần nước đi. Thẻ `Termination` được hiển thị trừ khi nó là `normal`: khi đó thế cờ cuối cùng tự nói lên diễn biến (chiếu hết, hết nước đi).
        - Endpoint này tự kiểm tra phần thân của nó: một trường không xác định hoặc `pgn` bị thiếu hay không phải chuỗi trả về 400 `invalid_request` kèm `field`; một tùy chọn sai trả về 400 `invalid_option` (`delayMs` phải là số JSON, `coords` phải là boolean; `null` bị từ chối).

        **Yêu cầu phiên:** hạn ngạch được tính theo tài khoản. **Giới hạn:** như với `GET /games/{id}/gif`. **Giới hạn phần thân:** 135.168 byte, bất kể `HTTP_BODY_LIMIT` (PGN dưới dạng chuỗi JSON, tính cả các ký tự thoát). **Giới hạn thời gian:** mặc định là 45 giây.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Một ván ngắn được gõ vào, không có tọa độ
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: Một tệp PGN với mọi tùy chọn
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` kèm `field` (một trường không xác định, hoặc `pgn` bị thiếu hay không phải chuỗi; không có `field` khi phần thân không phải object); `invalid_json`; `invalid_option` kèm `field` (`size`, `orientation`, `delayMs` hoặc `coords`); `invalid_pgn` kèm `line` và `column` (đếm từ 1, cột tính theo ký tự) và `message` của trình đọc: một nước đi không hợp lệ hoặc mơ hồ, một thẻ bị hỏng, một biến thể cờ không xác định, hơn 65.536 byte.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: máy chủ đã tắt ảnh GIF (`GIF_ENABLED=false`; token `gif` được hoàn lại).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: phần thân lớn hơn 135.168 byte.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: giới hạn `gif`, một giới hạn kết xuất, hoặc hạn mức tài khoản.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: không thể tạo ảnh GIF (máy chủ ghi lý do vào nhật ký). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` kèm `retryAfter` (từ 3 đến 10 giây) và `Retry-After`: hàng đợi kết xuất đã đầy, hoặc ảnh GIF đã chờ một luồng rảnh quá lâu; mọi token giới hạn mà yêu cầu đã lấy đều được hoàn lại. `timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
