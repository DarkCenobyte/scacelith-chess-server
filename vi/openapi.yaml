        - pages
      summary: Đặt mật khẩu mới từ biểu mẫu đặt lại mật khẩu
      description: |-
        Biểu mẫu của trang đặt lại mật khẩu; biểu mẫu làm đúng những gì `POST /auth/password/reset` làm, trong một giao dịch: mọi thiết bị bị đăng xuất, yêu cầu đổi email đang chờ bị hủy, các liên kết đặt lại mật khẩu khác hết hiệu lực, địa chỉ được coi là đã xác nhận và chủ tài khoản nhận được một thư.

        Liên kết được kiểm tra trước tiên, sau đó đến việc hai mật khẩu có giống nhau không, rồi đến các quy tắc mật khẩu. Khi máy chủ bận, biểu mẫu được trả lại kèm `Retry-After` và liên kết vẫn còn hiệu lực.

        **Giới hạn:** `auth`, sau đó `auth_reset` (dùng chung với `POST /auth/password/reset`).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Mật khẩu đã được đổi, và mọi thiết bị đã bị đăng xuất.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Biểu mẫu được hiển thị lại kèm lỗi (hai mật khẩu khác nhau, mật khẩu yếu), liên kết không hợp lệ, hoặc biểu mẫu không hợp lệ (một trang HTML).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Giới hạn `auth` hoặc `auth_reset` (một trang HTML), biểu mẫu được hiển thị lại kèm `Retry-After` khi client này có quá nhiều lượt băm mật khẩu đang chờ (liên kết vẫn còn hiệu lực), hoặc tầng theo địa chỉ (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'Biểu mẫu được hiển thị lại kèm `Retry-After` khi máy chủ bận (hàng đợi băm mật khẩu, hoặc cơ sở dữ liệu vẫn bị khóa); liên kết vẫn còn hiệu lực. Khi máy chủ bị tồn đọng nặng (xem phần giới thiệu), thay vào đó là một trang “Server error” (Lỗi máy chủ) kèm `Retry-After` (từ 2 đến 5): chưa có gì được thực thi và liên kết vẫn còn hiệu lực. Cũng có thể do handler hết thời gian chờ.'
