                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` không phải đúng 6 chữ số, hoặc phần thân vi phạm schema; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: mã sai (hãy kiểm tra giờ của thiết bị).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: không có khóa bí mật đang chờ (hãy gọi `POST /account/mfa/totp/setup` trước).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (các lần xác thực lại thất bại của tài khoản), hoặc `rate_limited` (giới hạn `reauth` hoặc `reauth_user`, hạn mức tài khoản).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (cơ sở dữ liệu vẫn bị khóa), `timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
  /account/mfa/totp/disable:
