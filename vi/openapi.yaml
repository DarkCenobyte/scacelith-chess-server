            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Chỉ các ván thắng, thua hoặc hòa, xét từ phía người chơi. Ván bị hủy chỉ xuất hiện khi không dùng bộ lọc này.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
