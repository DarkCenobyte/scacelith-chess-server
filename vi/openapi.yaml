  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Đổi mật khẩu
      description: |-
        Đổi mật khẩu. Cần mật khẩu hiện tại, nhưng không cần yếu tố thứ hai, kể cả khi xác thực hai yếu tố đang bật. Mật khẩu mới tuân theo các quy tắc đăng ký (được kiểm tra sau mật khẩu hiện tại).

        Việc đổi mật khẩu có các tác động sau, trong một giao dịch (tất cả hoặc không gì cả): thu hồi mọi phiên khác (phiên này vẫn đăng nhập), hủy yêu cầu đổi email đang chờ, làm các liên kết đặt lại mật khẩu của tài khoản hết hiệu lực, và gửi thư cho chủ tài khoản.

        **Xác thực lại:** chỉ mật khẩu. **Giới hạn:** `reauth`, sau đó `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Mật khẩu đã được đổi.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (tài khoản chỉ dùng Google), `weak_password` (kèm `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: sai mật khẩu hiện tại, hoặc mật khẩu đã được đặt lại hoặc đổi trong lúc yêu cầu đang được kiểm tra.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (các lần xác thực lại thất bại của tài khoản), hoặc `rate_limited` (giới hạn `reauth` hoặc `reauth_user`, hạn mức tài khoản, hàng đợi băm mật khẩu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: hàng đợi băm mật khẩu, hoặc cơ sở dữ liệu vẫn bị khóa (`retryAfter: 1`, không có gì thay đổi). `timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Bắt đầu bật xác thực hai yếu tố
      description: |-
        Lưu một khóa bí mật mới đang chờ cho ứng dụng xác thực, thay thế mọi khóa bí mật đang chờ trước đó, và trả về khóa này cho ứng dụng xác thực (dạng văn bản và dạng URI `otpauth://` để hiển thị thành mã QR). Xác thực hai yếu tố chưa được bật: `POST /account/mfa/totp/enable` bật nó bằng một mã của khóa bí mật này.

        **Xác thực lại:** chỉ mật khẩu. **Giới hạn:** `reauth`, sau đó `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Khóa bí mật đang chờ.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (tài khoản chỉ dùng Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (được kiểm tra trước mật khẩu).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (các lần xác thực lại thất bại của tài khoản), hoặc `rate_limited` (giới hạn `reauth` hoặc `reauth_user`, hạn mức tài khoản, hàng đợi băm mật khẩu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (hàng đợi băm mật khẩu, hoặc cơ sở dữ liệu vẫn bị khóa), `timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Hoàn tất bật xác thực hai yếu tố và nhận mã khôi phục
      description: |-
        Bật xác thực hai yếu tố bằng một mã của khóa bí mật đang chờ (đúng 6 chữ số). Ở đây không hỏi mật khẩu; mật khẩu đã được nhập ở bước thiết lập. Phản hồi chứa 10 mã khôi phục, chỉ hiển thị lần này.

        **Giới hạn:** `reauth`, sau đó `reauth_user`; một mã sai được tính vào số lần xác thực lại thất bại của tài khoản.
      security:
