      summary: Lấy tên, phiên bản, cổng và quy tắc đăng ký của máy chủ
      description: |-
        Những gì client cần trước khi đăng nhập hoặc kết nối: tên và id của máy chủ, các phiên bản giao thức WebSocket và vị trí của WebSocket, quy tắc đăng ký, các mức thời gian thi đấu chính thức và các giới hạn mà client có thể kiểm tra trước khi gửi biểu mẫu.

        **Giới hạn:** chỉ có tầng theo địa chỉ.
      security: []
      responses:
        '200':
          description: Mô tả của máy chủ.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: tầng theo địa chỉ.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Tạo tài khoản
      description: |-
        Tạo tài khoản: sau khi địa chỉ email được xác nhận bằng liên kết gửi tới địa chỉ đó, hoặc ngay lập tức nếu không yêu cầu xác nhận email.

        **Có xác nhận email** (`REQUIRE_EMAIL_VERIFICATION`, mặc định): 202 `verification_sent`. Tài khoản chưa tồn tại: lượt đăng ký chờ trong 24 giờ và giữ chỗ tên người dùng trong thời gian đó. Một liên kết có hiệu lực trong 24 giờ đó được gửi tới địa chỉ, tối đa một liên kết cho mỗi địa chỉ mỗi 5 phút (`POST /auth/verify-email/resend` gửi một liên kết mới); tài khoản được tạo, với địa chỉ đã được xác nhận, khi liên kết được dùng (nút của trang `/verify-email`), và sau đó người chơi có thể đăng nhập. Trước đó, việc đăng nhập bằng tên người dùng đó nhận phản hồi `invalid_credentials`, như với một tài khoản không xác định, và hồ sơ công khai không tồn tại. Một lượt đăng ký mới với cùng địa chỉ sẽ thay thế lượt đang chờ. Phản hồi vẫn như vậy khi một tài khoản khác đã dùng địa chỉ đó: khi đó không có liên kết nào được gửi, thay vào đó chủ sở hữu tài khoản nhận một thông báo (tối đa một lần mỗi giờ), và tên người dùng được giữ chỗ theo cùng cách, để không có gì tiết lộ địa chỉ đó đã có tài khoản hay chưa. Lượt đăng ký có liên kết không được dùng sẽ bị hủy sau 24 giờ, và tên người dùng của nó được giải phóng.

        **Không xác nhận email** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, tài khoản được tạo ngay và có thể đăng nhập.

        **Quy tắc.** `username`: từ `USERNAME_MIN` đến `USERNAME_MAX` ký tự (3 đến 20), gồm chữ cái, chữ số, `_` và `-`, bắt đầu bằng chữ cái hoặc chữ số (`GET /info` cung cấp các giá trị này trong `limits`); các tên dành riêng (`admin`, `moderator`, `deleted`...) và một số tiền tố bị từ chối; duy nhất, không phân biệt chữ hoa chữ thường. `email`: được cắt khoảng trắng hai đầu và lưu bằng chữ thường, chỉ gồm ASCII thuần với tên miền có dấu chấm. `password`: ít nhất `PASSWORD_MIN_LENGTH` (10) ký tự và tối đa 256 byte UTF-8; không được chứa tên người dùng hoặc phần cục bộ của email, và không được là mật khẩu phổ biến.

        **Lỗi**, được kiểm tra theo thứ tự sau: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; các lỗi của hàng đợi băm mật khẩu; 409 `email_taken` (chỉ khi không xác nhận email).

        **Giới hạn:** `auth`, rồi `auth_register` (10 lượt đăng ký mỗi giờ cho mỗi client). **Bằng chứng công việc:** luôn luôn, khi `POW_REGISTER_BITS` lớn hơn 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Lần thử đầu tiên, không có bằng chứng công việc
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Gửi lại kèm bằng chứng công việc
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Tài khoản đã được tạo và có thể đăng nhập (máy chủ này không yêu cầu xác nhận email).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Lượt đăng ký đang chờ liên kết xác nhận (hoặc địa chỉ đã có tài khoản; phản hồi không cho biết điều đó).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (kèm `field`), `invalid_json`, `invalid_username`, `invalid_email`, hoặc `weak_password` kèm `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` hoặc `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: máy chủ này đã đóng đăng ký (`GET /info` báo `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: đã có tài khoản mang tên người dùng này, hoặc một lượt đăng ký đang chờ của địa chỉ khác đang giữ chỗ tên này. `email_taken`: một tài khoản khác đang dùng địa chỉ này (chỉ khi không xác nhận email).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: giới hạn `auth` hoặc `auth_register`, hoặc hàng đợi băm mật khẩu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (hàng đợi băm mật khẩu, hoặc cơ sở dữ liệu vẫn bị khóa), `timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Đăng nhập bằng mật khẩu
      description: |-
        Đăng nhập bằng tên người dùng hoặc địa chỉ email và mật khẩu. Có hai phản hồi khả dĩ, cả hai đều có mã trạng thái 200: một phiên, hoặc, khi xác thực hai yếu tố được bật, một bước thứ hai cần hoàn tất trong vòng 5 phút bằng `POST /auth/login/mfa`.

        Tài khoản không xác định, sai mật khẩu và tài khoản không có mật khẩu đều nhận cùng một phản hồi, sau cùng một khoảng thời gian: 401 `invalid_credentials`. Các bước kiểm tra tài khoản (`banned`, `email_unverified`) chỉ diễn ra sau khi mật khẩu đúng. Từ `AUTH_FAILURES_PER_ACCOUNT` (5) lần thất bại trên cùng một tên đăng nhập, mỗi lần thử phải chờ (429 `too_many_attempts`).

        **Giới hạn:** `auth`. **Bằng chứng công việc:** chỉ trong một làn sóng đăng nhập thất bại (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Một phiên, hoặc bước thứ hai của lần đăng nhập có xác thực hai yếu tố.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Đã đăng nhập
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Xác thực hai yếu tố đang bật
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: tài khoản không xác định, sai mật khẩu, hoặc tài khoản không có mật khẩu.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Chỉ sau khi mật khẩu đúng: `banned`, kèm `until` (mili giây Unix, `null` nếu đình chỉ vĩnh viễn), hoặc `email_unverified` (một tài khoản cũ hơn có địa chỉ chưa được xác nhận).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (độ trễ sau thất bại của tên đăng nhập này), hoặc `rate_limited` (giới hạn `auth`, hàng đợi băm mật khẩu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (hàng đợi băm mật khẩu, hoặc cơ sở dữ liệu vẫn bị khóa), `timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Hoàn tất đăng nhập bằng yếu tố thứ hai
      description: |-
        Bước thứ hai của lần đăng nhập có xác thực hai yếu tố, sau khi `POST /auth/login` hoặc một lần đăng nhập bằng Google (`POST /auth/sso/google/finish` hoặc `POST /auth/sso/google/link`) trả về `mfaRequired`. Gửi `code` (mã 6 chữ số từ ứng dụng xác thực, hoặc mã khôi phục) hoặc `recoveryCode`. Mã khôi phục dùng ở đây sẽ mất hiệu lực.

        Một bước chấp nhận tối đa 5 mã sai; bước này cũng kết thúc khi mật khẩu được đặt lại hoặc thay đổi. Sau bước mật khẩu của việc liên kết Google, liên kết chỉ được lưu khi mã được chấp nhận ở đây.

        **Giới hạn:** `auth`, và tối đa `AUTH_MFA_PER_ACCOUNT` (10) mã mỗi 15 phút cho tài khoản, từ bất kỳ địa chỉ nào; vượt quá thì mã không được kiểm tra, nên mã khôi phục không bị tiêu hao.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Mã từ ứng dụng xác thực
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Mã khôi phục
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Đã đăng nhập.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: không gửi `code` lẫn `recoveryCode`, hoặc phần thân vi phạm schema; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: bước này đã hết hạn, đã được dùng, hoặc đã kết thúc sau 5 mã sai, hoặc mật khẩu đã được đặt lại hay thay đổi kể từ bước đầu tiên (hãy đăng nhập lại). `invalid_code`: mã sai hoặc đã được dùng.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (kèm `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: chỉ sau bước mật khẩu của việc liên kết Google, tài khoản Google đã được liên kết với một tài khoản khác trong lúc đó.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: chỉ sau bước mật khẩu của việc liên kết Google, tài khoản đã thay đổi trong lúc đó; hãy bắt đầu đăng nhập lại.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: độ trễ sau thất bại của tài khoản, hoặc tài khoản đã dùng hết `AUTH_MFA_PER_ACCOUNT` mã trong 15 phút gần nhất. `rate_limited`: giới hạn `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` với `retryAfter: 1`: cơ sở dữ liệu vẫn bị khóa (sau một bước liên kết Google, chưa có gì được liên kết: hãy bắt đầu đăng nhập lại). `timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Đăng xuất phiên này
      description: |-
        Thu hồi phiên của token được dùng. WebSocket được mở bằng phiên này sẽ bị đóng. Không có phần thân (hoặc `{}`).

        **Giới hạn:** `sessions`.
      security:
