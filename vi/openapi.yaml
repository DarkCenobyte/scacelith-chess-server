        variables:
          host:
            default: caissa.scacelith.com
            description: Tên host công khai của máy chủ (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Cổng API công khai (`PUBLIC_API_PORT`, nếu không có thì `API_PORT`).
    get:
      operationId: getReadiness
      tags:
        - health
      summary: Kiểm tra máy chủ có đang nhận người chơi
      description: |-
        Trả về 200 `ready` khi máy chủ nhận người chơi, và 503 `not_ready` khi máy chủ đang khởi động hoặc đang dừng. `HEAD` cũng dùng được. Mọi phương thức khác trả về 405 `method_not_allowed` kèm `Allow: GET, HEAD` (kể cả `OPTIONS`).

        **Giới hạn:** chỉ có tầng theo địa chỉ.
      security: []
      responses:
        '200':
          description: Máy chủ đang nhận người chơi.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: tầng theo địa chỉ.'
        '503':
          description: Máy chủ đang khởi động hoặc đang dừng.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Một token phiên (`sct_` theo sau là 43 ký tự base64url) lấy từ phản hồi đăng nhập, đặt trong header `Authorization`: `Authorization: Bearer <token>`. Tiền tố phải đúng là `Bearer` (phân biệt chữ hoa chữ thường) và một dấu cách; một giá trị không có tiền tố này, hoặc một token không gồm từ 1 đến 512 ký tự ASCII in được, trả về 401 `invalid_token` như mọi token không hợp lệ khác. Header rỗng được coi như không có header.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: Id ván cờ, một số nguyên thập phân dương có tối đa 16 chữ số, không có số 0 ở đầu, nhỏ hơn 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: Id phiên, như `GET /auth/sessions` cung cấp, viết không có số 0 ở đầu (`03` không phải phiên 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Tên người dùng của người chơi, không phân biệt chữ hoa chữ thường. Máy chủ chấp nhận mọi tên gồm từ 2 đến 24 ký tự thuộc `[A-Za-z0-9_.-]` (quy tắc rộng nhất mà máy chủ từng cho phép).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Một id ván cờ; chỉ các ván cũ hơn được liệt kê. Truyền `next` của trang trước. Giá trị rỗng được coi như không có.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Kích thước trang, từ 1 đến 50. Một số lớn hơn có tối đa 3 chữ số được tính là 50; giá trị rỗng được coi như không có.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: Token của liên kết email (43 ký tự base64url). Token bị thiếu hoặc sai sẽ hiển thị trang “link invalid or expired” (Liên kết không hợp lệ hoặc đã hết hạn).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Mọi phản hồi của máy chủ đều cấm lưu vào bộ nhớ đệm.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Số giây cần chờ trước khi thử lại; cùng giá trị với `retryAfter` trong phần thân.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Challenge xác thực kiểu Bearer, kèm `error="invalid_token"` khi token không hợp lệ.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Máy chủ đóng kết nối sau phản hồi này.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (kèm `field` khi một trường của phần thân có lỗi) hoặc `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Một trường vi phạm schema
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Phần thân không phải JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Mật khẩu yếu
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: Một PGN không đọc được
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (không có header `Authorization`) hoặc `invalid_token` (token sai định dạng, đã hết hạn, đã bị thu hồi, hoặc thuộc về một tài khoản đã bị xóa).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Không có phiên
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Token không hợp lệ
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Yêu cầu bị từ chối.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Sai mật khẩu khi xác thực lại
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Tài khoản bị đình chỉ
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found`, hoặc một tính năng mà máy chủ này đã tắt.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: phần thân không đến trong vòng 10 giây. Máy chủ đóng kết nối.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Yêu cầu xung đột với trạng thái của máy chủ.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: lượt đăng nhập bằng Google hoặc vé không xác định, đã được dùng hoặc đã hết hạn; hãy bắt đầu đăng nhập lại.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: phần thân vượt quá `HTTP_BODY_LIMIT` (mặc định 16.384 byte). Máy chủ đóng kết nối.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: đích yêu cầu vượt quá 4096 ký tự.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: phần thân không phải `application/json`, hoặc charset của nó không phải UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: ván cờ có hơn `GIF_MAX_PLIES` (600) nửa nước.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: hãy giải thử thách `pow` và gửi lại đúng yêu cầu đó kèm `pow: { challenge, nonce }`. `reason` cho biết lý do: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` hoặc `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (một giới hạn tần suất, hạn mức tài khoản, hoặc hàng đợi băm mật khẩu) hoặc `too_many_attempts` (một cơ chế hạn chế của tài khoản), kèm `retryAfter` và header `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Một giới hạn tần suất
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Quá nhiều lần thất bại trên tài khoản này
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: một lỗi ngoài dự kiến. Máy chủ ghi lỗi này vào nhật ký.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: `state` hoặc `iss` sai, hoặc Google đã từ chối mã hay gửi một ID token không xác minh được (kể cả mã hoặc ID token của client kia, của trò chơi hoặc của trang web). Lỗi này không bao giờ mang nội dung văn bản của Google.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` hoặc `timeout`: hãy thử lại sau `retryAfter` khi có giá trị này.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Máy chủ đang bận
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Cơ sở dữ liệu vẫn bị khóa (một thao tác đọc)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Máy chủ mất quá nhiều thời gian
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Ảnh GIF động, dưới dạng tệp đính kèm.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` cho một ván cờ của máy chủ này, `attachment; filename="scacelith-game.gif"` cho một PGN được gửi bằng `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Kích thước của tệp, tính bằng byte.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: Một trang HTML.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: Một trang HTML giải thích lý do từ chối.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Biểu mẫu không đến trong vòng 10 giây (một trang HTML). Máy chủ đóng kết nối.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: Một trang HTML giải thích xung đột.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Biểu mẫu vượt quá `HTTP_BODY_LIMIT` (một trang HTML). Máy chủ đóng kết nối.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Phần thân không phải biểu mẫu (`application/x-www-form-urlencoded`) cũng không phải JSON, hoặc charset của nó không phải UTF-8 (một trang HTML).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Một giới hạn tần suất (một trang HTML), kèm `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Một lỗi ngoài dự kiến (trang HTML có tiêu đề “Server error” (Lỗi máy chủ)). Máy chủ ghi lỗi này vào nhật ký.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Máy chủ đang bận (cơ sở dữ liệu vẫn bị khóa, hoặc máy chủ bị tồn đọng nặng; kèm `Retry-After`) hoặc mất quá nhiều thời gian (trang HTML có tiêu đề “Server error” (Lỗi máy chủ)).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: Dạng duy nhất của mọi phản hồi lỗi trong API JSON.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Mã lỗi dạng `snake_case`. Client dựa vào mã này để chọn nội dung hiển thị.
          examples:
            - rate_limited
        message:
          type: string
          description: Một câu tiếng Anh, dùng cho nhật ký và làm phương án dự phòng.
        retryAfter:
          type: integer
          minimum: 1
          description: Số giây cần chờ trước khi thử lại, chỉ có ở những lần từ chối sẽ hết hiệu lực theo thời gian. Khi đó phản hồi cũng mang header `Retry-After` với cùng giá trị, trừ 503 `busy` của các thao tác đọc lịch sử, ván cờ, người chơi và bảng xếp hạng.
        field:
          type: string
          description: Trường hoặc tham số truy vấn có lỗi (`invalid_request`, `invalid_option`, và `invalid_cursor`, `invalid_limit` và `invalid_filter` của `GET /account/games`). Trường lồng nhau được viết bằng dấu chấm (`pow.nonce`).
        reason:
          type: string
          description: 'Lý do: quy tắc mà một `weak_password` vi phạm, hoặc lý do bằng chứng công việc được yêu cầu hay bị từ chối (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Chỉ với `banned`: thời điểm kết thúc đình chỉ (mili giây Unix), `null` nếu đình chỉ vĩnh viễn.'
        line:
          type: integer
          minimum: 1
          description: 'Chỉ với `invalid_pgn`: dòng có lỗi, đếm từ 1.'
        column:
          type: integer
          minimum: 1
          description: 'Chỉ với `invalid_pgn`: cột có lỗi, đếm từ 1, tính theo ký tự.'
    PowChallenge:
      type: object
      description: Một thử thách bằng chứng công việc (`pow` của 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Thử thách đã ký, cần gửi lại nguyên vẹn.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Số bit 0 ở đầu mà `SHA-256(challenge + ":" + nonce)` phải có.
        expiresAt:
          type: integer
          format: int64
          description: Thời điểm thử thách hết hạn (mili giây Unix), 2 phút sau khi được cấp.
    PowAnswer:
      type: object
      description: Lời giải cho một thử thách bằng chứng công việc.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: '`challenge` của phản hồi 428, giữ nguyên như đã nhận.'
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Một chuỗi số thập phân có tối đa 20 chữ số sao cho `SHA-256(challenge + ":" + nonce)` bắt đầu bằng `bits` bit 0.
    ServerInfo:
      type: object
      description: Những gì client cần trước khi đăng nhập hoặc kết nối.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Tên của máy chủ (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: Một UUID mà cơ sở dữ liệu nhận được ở lần khởi động đầu tiên. Giá trị này không đổi qua các lần khởi động lại. Giá trị là `null` khi cơ sở dữ liệu không thể cung cấp nó.
        motd:
          type: string
          description: Thông điệp trong ngày (`SERVER_MOTD`), có thể rỗng.
        protocol:
          type: object
          description: Giao thức WebSocket (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Phiên bản giao thức cũ nhất mà máy chủ hỗ trợ.
            max:
              type: integer
              minimum: 1
              description: Phiên bản giao thức mới nhất mà máy chủ hỗ trợ.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'Dấu vân tay của schema giao thức (4 byte đầu của SHA-256 dạng chuẩn tắc của nó, dưới dạng số nguyên không dấu: `0xc649140f`, 3326678031, với phiên bản phụ 2 của giao thức); chỉ mang tính thông tin, không bao giờ được so sánh.'
            subprotocol:
              type: string
              description: Token giao thức con của WebSocket (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: Cổng WebSocket mà người chơi sử dụng (`PUBLIC_WS_PORT`, nếu không có thì `WS_PORT`, nếu cũng không có thì `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: Đường dẫn của WebSocket.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Có thể tạo tài khoản mới hay không.
        emailVerification:
          type: boolean
          description: Tài khoản mới có phải xác nhận địa chỉ hay không (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Đăng nhập bằng Google có được cung cấp cho trò chơi hay không.
            googleWeb:
              type: boolean
              description: Đăng nhập bằng Google có được cung cấp cho cả trang web hay không (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: Xác thực hai yếu tố luôn khả dụng.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Số bit bằng chứng công việc mà việc đăng ký cần (0 nếu không cần).
        categories:
          type: array
          description: Các mức thời gian thi đấu chính thức, tức được tính điểm (`RATED_CATEGORIES`), theo thứ tự của máy chủ. Mọi thời gian thi đấu khác là `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Các quy tắc mà client có thể kiểm tra trước khi gửi biểu mẫu.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: Độ dài tối thiểu của tên người dùng (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: Độ dài tối đa của tên người dùng (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Biểu thức chính quy mà tên người dùng mới phải khớp.
            passwordMinLength:
              type: integer
              description: Độ dài tối thiểu của mật khẩu, tính bằng ký tự (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Độ dài tối đa của mật khẩu, tính bằng byte UTF-8.
            customTimeControls:
              type: boolean
              description: Lời thách đấu và ván riêng tư có được dùng thời gian thi đấu tùy chỉnh hay không.
            reportsPerDay:
              type: integer
              description: Số báo cáo mà một người chơi có thể gửi trong mỗi 24 giờ (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Kích thước tối đa của một thông điệp WebSocket mà client có thể gửi, tính bằng byte.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Một mức thời gian thi đấu chính thức.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Id hạng mục, gồm số phút và số giây cộng thêm (`3+2`).
        baseSec:
          type: number
          minimum: 0
          description: Thời gian cơ bản, tính bằng giây.
        incSec:
          type: number
          minimum: 0
          description: Thời gian cộng thêm cho mỗi nước đi, tính bằng giây.
    AccountView:
      type: object
      description: Tài khoản như chính người chơi sở hữu nó nhìn thấy (`user` của các phản hồi đăng nhập và của `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: Id tài khoản.
        username:
          type: string
          description: Tên người dùng.
        email:
          type: string
          format: email
          description: Địa chỉ email.
        emailVerified:
          type: boolean
          description: Địa chỉ đã được xác nhận hay chưa.
        mfaEnabled:
          type: boolean
          description: Xác thực hai yếu tố có đang bật hay không.
        googleLinked:
          type: boolean
          description: Có tài khoản Google nào được liên kết hay không.
        hasPassword:
          type: boolean
          description: '`false` với tài khoản được tạo qua Google và chưa đặt mật khẩu.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Có nhận lời thách đấu trực tiếp qua tên hay không (xem `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Thời điểm tài khoản được tạo (mili giây Unix).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Lần đăng nhập gần nhất (mili giây Unix), hoặc `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Địa chỉ mới của một yêu cầu đổi email đang chờ xác nhận qua liên kết, hoặc `null`.
    SessionAnswer:
      type: object
      description: Một phiên mới.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Token phiên, dùng cho header `Authorization` và WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: Thời điểm kết thúc tuyệt đối của phiên (mili giây Unix); hạn không hoạt động có thể kết thúc phiên sớm hơn.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Bước thứ hai của một lần đăng nhập có xác thực hai yếu tố; tiếp tục với `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Token của bước này, dùng cho `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Số giây còn lại để hoàn tất bước này.
    LoginAnswer:
      description: Một phiên, hoặc bước thứ hai của một lần đăng nhập có xác thực hai yếu tố.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Lần đăng nhập bằng Google đầu tiên; tiếp tục với `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Vé dùng cho `POST /auth/sso/complete`, có hiệu lực trong 10 phút.
        suggestedUsername:
          type: string
          description: Một tên người dùng tạo từ tên Google hoặc địa chỉ email, hoặc `""` khi không có tên nào phù hợp.
    SsoNeedsPassword:
      type: object
      description: Một tài khoản có mật khẩu đang dùng địa chỉ này; tiếp tục với `POST /auth/sso/google/link`. Chưa có gì được liên kết.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Vé dùng cho `POST /auth/sso/google/link`.
        username:
          type: string
          description: Tên người dùng của tài khoản đó (chỉ người đã chứng minh với Google quyền sở hữu địa chỉ mới thấy được).
        expiresIn:
          type: integer
          const: 600
          description: Số giây vé còn hiệu lực.
    SsoFinishAnswer:
      description: Phản hồi của `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Một lượt đăng nhập bằng Google.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Lượt đăng nhập, dùng cho `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: URL của Google để mở trong trình duyệt của hệ thống, sau khi đã kiểm tra.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state` mà Google phải gửi lại.'
        expiresIn:
          type: integer
          const: 600
          description: Số giây lượt đăng nhập còn hiệu lực.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Tên người dùng; sau đó áp dụng các quy tắc của máy chủ (xem phần mô tả).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Địa chỉ email. Được cắt bỏ khoảng trắng ở hai đầu và lưu bằng chữ thường.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Mật khẩu; sau đó áp dụng các quy tắc mật khẩu.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Tên người dùng, hoặc địa chỉ email (bất kỳ văn bản nào có `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Không bắt buộc. Hiển thị trong danh sách thiết bị đã đăng nhập (chẳng hạn `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: '`mfaToken` của phản hồi đăng nhập (hoặc của phản hồi đăng nhập bằng Google).'
        code:
          type: string
          maxLength: 32
          description: Không bắt buộc. Một mã 6 chữ số từ ứng dụng xác thực, hoặc một mã khôi phục.
        recoveryCode:
          type: string
          maxLength: 32
          description: 'Không bắt buộc. Một mã khôi phục. Cần có một trong hai: `code` hoặc `recoveryCode`.'
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Địa chỉ email.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Tham số `token` của liên kết đặt lại mật khẩu.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Mật khẩu mới; áp dụng các quy tắc mật khẩu khi đăng ký.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Challenge PKCE S256 của `codeVerifier` của client (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Cổng của trình lắng nghe của client trên `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Challenge PKCE S256 của `codeVerifier` của trang (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`attemptId` của `POST /auth/sso/google/start`.'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: Verifier PKCE; SHA-256 của nó phải khớp với challenge đã gửi cho `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state` đúng như Google đã gửi lại.'
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: '`code` đúng như Google đã gửi lại (ASCII in được, không có dấu cách).'
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Không bắt buộc. `iss` đúng như Google đã gửi lại, nếu Google có gửi.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`linkTicket` của `finish`, có hiệu lực trong 10 phút.'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Mật khẩu của tài khoản.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`ssoTicket` của `finish`, có hiệu lực trong 10 phút.'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Tên người dùng; áp dụng các quy tắc đăng ký.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Các phiên đang hoạt động, phiên được dùng gần đây nhất đứng trước.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Một phiên đang hoạt động (một thiết bị đã đăng nhập).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: Id phiên, dùng cho `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: Thời điểm đăng nhập (mili giây Unix).
        lastSeenAt:
          type: integer
          format: int64
          description: Lần sử dụng gần nhất (mili giây Unix), được cập nhật nhiều nhất 5 phút một lần (chậm hơn khi máy chủ bị tồn đọng nặng).
        expiresAt:
          type: integer
          format: int64
          description: Thời điểm kết thúc tuyệt đối (mili giây Unix); hạn không hoạt động có thể kết thúc phiên sớm hơn.
        clientLabel:
          type:
            - string
            - 'null'
          description: '`clientLabel` của lần đăng nhập, hoặc `null` khi lần đăng nhập không gửi nhãn nào.'
        current:
          type: boolean
          description: Đây có phải là phiên đang gửi yêu cầu hay không.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Một bản ghi cho mỗi hạng mục mà người chơi đã chơi ván tính điểm.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Các hình phạt đang có hiệu lực.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }` khi đang bị đình chỉ, nếu không thì `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Bản ghi hệ số của một hạng mục.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: Id hạng mục.
        rating:
          type: integer
          description: Hệ số Elo.
        games:
          type: integer
          minimum: 0
          description: Số ván đã chơi trong hạng mục (dù có được tính hay không).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Hệ số cao nhất từng đạt được.
        provisional:
          type: boolean
          description: '`true` khi bản ghi còn ở giai đoạn chưa có hệ số hoặc có ít hơn `PROVISIONAL_GAMES` ván được tính (trò chơi hiển thị hệ số này dạng `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Loại hình phạt.
        reason:
          type:
            - string
            - 'null'
          description: Lý do được đưa ra, nếu có.
        startsAt:
          type: integer
          format: int64
          description: Thời điểm bắt đầu (mili giây Unix).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Thời điểm kết thúc (mili giây Unix), `null` khi hình phạt là vĩnh viễn.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Thời điểm kết thúc đình chỉ (mili giây Unix), `null` nếu đình chỉ vĩnh viễn.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` để nhận lời thách đấu trực tiếp qua tên, `none` để từ chối.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Mật khẩu hiện tại.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Mật khẩu mới; áp dụng các quy tắc mật khẩu khi đăng ký.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Mật khẩu của tài khoản.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Một mã của khóa bí mật đang chờ, đúng 6 chữ số.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Mật khẩu của tài khoản.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Không bắt buộc; cần khi bật xác thực hai yếu tố (hoặc `recoveryCode`). Một mã từ ứng dụng xác thực, hoặc một mã khôi phục.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Không bắt buộc. Một mã khôi phục (`xxxx-xxxx-xx`; chữ hoa chữ thường, dấu cách và dấu gạch ngang không quan trọng).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Mật khẩu của tài khoản.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Một mã từ ứng dụng xác thực (mã khôi phục bị từ chối).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Địa chỉ mới; được cắt bỏ khoảng trắng ở hai đầu và chuyển thành chữ thường, rồi được kiểm tra như một địa chỉ đăng ký.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Mật khẩu của tài khoản.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Không bắt buộc; cần khi bật xác thực hai yếu tố (hoặc `recoveryCode`). Một mã từ ứng dụng xác thực, hoặc một mã khôi phục.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Không bắt buộc. Một mã khôi phục.
    TotpSetup:
      type: object
      description: Khóa bí mật đang chờ dành cho ứng dụng xác thực.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Khóa bí mật dạng base32, để nhập vào ứng dụng.
        uri:
          type: string
          format: uri
          description: URI `otpauth://totp/...`, để hiển thị thành mã QR.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Số giây của mỗi bước.
    RecoveryCodeList:
      type: array
      description: 10 mã khôi phục, chỉ hiển thị lần này. Mỗi mã chỉ dùng được một lần.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Một bên của ván cờ.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Tên trong bản ghi ván cờ (`deleted#<id>` với tài khoản đã bị xóa).
        rating:
          type:
            - integer
            - 'null'
          description: Hệ số lúc bắt đầu, `null` khi không rõ.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Hệ số sau ván cờ. Ván tính điểm luôn có giá trị này; chỉ là `null` với ván không được tính hệ số (giao hữu, thời gian thi đấu tùy chỉnh, bị hủy).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Mức thay đổi hệ số, `0` khi các quy tắc tính hệ số giữ nguyên hệ số (trường hợp điểm số bằng 0 theo quy định của FIDE, đối thủ chưa có hệ số, các ván đầu tiên của người chơi chưa có hệ số); `null` như với `ratingAfter`.
    GameSummary:
      type: object
      description: Tóm tắt của một ván cờ đã lưu.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Id ván cờ.
        category:
          type: string
          description: Id hạng mục chính thức (`3+2`), hoặc `custom`.
        rated:
          type: boolean
          description: Ván cờ có được tính hệ số hay không.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Thời gian thi đấu tính bằng giây (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (xem phần mã ván cờ).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Mã lý do kết thúc (xem phần mã ván cờ).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Kết quả, `*` với ván bị hủy.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Số nửa nước.
        startedAt:
          type: integer
          format: int64
          description: Thời điểm bắt đầu (mili giây Unix).
        endedAt:
          type: integer
          format: int64
          description: Thời điểm kết thúc (mili giây Unix).
    Termination:
      type: string
      description: Tên của lý do kết thúc (xem phần mã ván cờ); `Unknown` với mã mà giao thức không biết.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Tóm tắt ván cờ xét từ phía một người chơi.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Bên của người chơi.
    HistoryGameSummary:
      description: Một ván trong lịch sử ván đấu của người chơi đã đăng nhập.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Thời gian cơ bản tính bằng mili giây.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Thời gian cộng thêm tính bằng mili giây.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: Kết cục xét từ phía người chơi.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Các ván của trang, mới nhất trước.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Id cần truyền làm `before` cho trang tiếp theo, hoặc `null` ở trang cuối.
        total:
          type: integer
          minimum: 0
          description: Số ván khớp với bộ lọc, trên tất cả các trang.
    MoveRecord:
      type: object
      description: Một nửa nước của ván cờ.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: Nước đi theo ký hiệu UCI, thêm `n`, `b`, `r` hoặc `q` khi phong cấp.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Thời gian bị tính cho nước đi (ms), `null` khi bản ghi không có giá trị này.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Đồng hồ của người vừa đi sau nước đi đó (ms), `null` khi bản ghi không có giá trị này.
    PgnTagsView:
      type: object
      description: Các thẻ PGN chính, để hiển thị. Ở đây `Termination` là tên của lý do kết thúc; tệp PGN dùng các giá trị chuẩn của PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` hoặc `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: Ngày bắt đầu theo UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Hệ số lúc bắt đầu, hoặc `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Hệ số lúc bắt đầu, hoặc `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Một bản ghi ván cờ kèm các nước đi và đồng hồ. Bản ghi có các trường của một bản tóm tắt ván cờ, không có `color` và `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Thời gian cơ bản tính bằng mili giây.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Thời gian cộng thêm tính bằng mili giây.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: Tên của `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: Id của ván cờ được tái đấu bằng ván này, hoặc `null`.
            moves:
              type: array
              description: Một mục cho mỗi nửa nước.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Chỉ khi người chơi của token đã chơi ván này; bên của người chơi đó.
            reportable:
              type: boolean
              description: Chỉ khi người chơi của token đã chơi ván này; `true` khi `POST /reports` sẽ tiếp nhận ngay lúc này một báo cáo về đối thủ cho ván này (ván đã kết thúc trong vòng 7 ngày, hạn ngạch trong ngày chưa dùng hết, và đối thủ chưa bị báo cáo cho ván này).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Tên người dùng, như người chơi đã viết.
        createdAt:
          type: integer
          format: int64
          description: Thời điểm tài khoản được tạo (mili giây Unix).
        ratings:
          type: array
          description: Chỉ các hạng mục chính thức, theo thứ tự của máy chủ.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Mọi ván đã lưu, kể cả ván giao hữu và ván bị hủy.
            rated:
              type: integer
              minimum: 0
              description: Các ván tính điểm, cộng dồn trên các bản ghi hệ số.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Tên người dùng, như người chơi đã viết.
        games:
          type: array
          description: Các ván của trang, mới nhất trước.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Id của ván cuối cùng mỗi khi trang đầy (khi đó trang tiếp theo có thể trống), nếu không thì `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: Id hạng mục.
        minGames:
          type: integer
          minimum: 0
          description: Số ván được tính mà một bản ghi cần có để được liệt kê (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Thời điểm bảng xếp hạng được tính (mili giây Unix).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: Văn bản PGN, tối đa 65.536 byte UTF-8. Chỉ ván đầu tiên được dùng.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Không bắt buộc. Kích thước hình ảnh.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Không bắt buộc. Bên ở phía dưới bàn cờ.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Không bắt buộc. Số mili giây cho mỗi nước đi, một số JSON có giá trị nguyên.
        coords:
          type: boolean
          default: true
          description: Không bắt buộc. Có vẽ chữ cái của cột và số của hàng quanh bàn cờ hay không.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Ván cờ, dưới dạng số nguyên hoặc chuỗi gồm từ 1 đến 16 chữ số.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Tên người dùng của đối thủ, như trong bản ghi ván cờ hoặc như hiện tại, không phân biệt chữ hoa chữ thường. Không được để trống.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Báo cáo về vấn đề gì.
        comment:
          type:
            - string
            - 'null'
          description: Không bắt buộc. Tối đa 500 ký tự sau khi đã loại bỏ các ký tự điều khiển (trừ tab và xuống dòng) và cắt bỏ khoảng trắng ở hai đầu văn bản.
    AccountExport:
      type: object
      description: Mọi thông tin máy chủ lưu giữ về tài khoản (thời gian tính bằng mili giây Unix).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Thời điểm tạo bản xuất dữ liệu.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Những gì tệp chứa và không chứa, viết bằng tiếng Anh đơn giản cho người chơi.
          items:
            type: string
        account:
          description: Dạng xem tài khoản của `GET /account/me`, kèm `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Địa chỉ của tài khoản Google đã liên kết, hoặc `null`.
        ratings:
          type: array
          description: Các bản ghi hệ số đầy đủ.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Số điểm hệ số được hoàn lại sau khi một đối thủ bị phát hiện gian lận, cộng dồn theo ngày UTC và theo hạng mục, mới nhất trước. Không nêu tên các ván cờ cũng như những người gian lận.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Mọi phiên đã lưu, mới nhất trước, không kèm token nào. Đợt dọn dữ liệu theo thời hạn lưu giữ xóa phiên đã hết hạn, và xóa phiên đã đăng xuất một ngày sau khi đăng xuất.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Các sự kiện bảo mật, mới nhất trước, được lưu giữ trong `RETENTION_SECURITY_DAYS` ngày.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Mọi hình phạt, kể cả những hình phạt đã gỡ bỏ. Tên của người kiểm duyệt không bao giờ được đưa vào.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Các sự kiện về hành vi được ghi lại cho các ván cờ bị bỏ dở, bị hủy và các ván không đi nước đầu tiên kịp giờ của người chơi, được lưu giữ 30 ngày.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Các báo cáo mà người chơi đã gửi.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Số ván.
            list:
              type: array
              description: Mọi ván cờ, mới nhất trước, dưới dạng các bản tóm tắt của `GET /account/games`. Các nước đi có ở `GET /games/{id}` và PGN ở `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Một bản ghi hệ số đầy đủ.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Người chơi đã ra khỏi giai đoạn chưa có hệ số hay chưa.
            countedGames:
              type: integer
              minimum: 0
              description: Số ván đã được tính vào hệ số.
            updatedAt:
              type: integer
              format: int64
              description: Thời điểm bản ghi thay đổi lần gần nhất.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: 00:00 UTC của ngày đó (mili giây Unix).
        category:
          type: string
        points:
          type: integer
          description: Số điểm được hoàn lại trong ngày đó ở hạng mục đó.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Thời điểm phiên được đăng xuất, hoặc `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Địa chỉ IP của lần đăng nhập, bị xóa sau `RETENTION_IP_DAYS` ngày.
    SecurityEvent:
      type: object
      description: |-
        Một sự kiện bảo mật. `ip` chỉ được cung cấp cho những việc đã làm khi đang đăng nhập, bằng mật khẩu của tài khoản (và yếu tố thứ hai) hoặc bằng một liên kết được gửi tới địa chỉ email của tài khoản: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` và `account_exported`; mọi loại khác có `ip: null`, và `ip` bị xóa sau `RETENTION_IP_DAYS` ngày.

        `detail` chỉ giữ các trường sau: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` và `method` (`password`, hoặc `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` và `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Một sự kiện `moderator_action` chỉ giữ `{ action }`, với các thao tác `ban`, `unban`, `reset_mfa`, `verify_email` và `revoke_sessions` (các thao tác khác của người kiểm duyệt không được đưa vào). Mọi loại khác có `detail: null`. Các sự kiện `rating_refund` không được đưa vào: số điểm của chúng nằm trong `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Loại sự kiện (`login`, `password_changed`…).
        at:
          type: integer
          format: int64
          description: Thời điểm xảy ra.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: Tên công khai hiện tại của người chơi bị báo cáo.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Báo cáo còn đang mở hay không (không cho biết người chơi bị báo cáo có bị áp dụng hình phạt hay không).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Token của liên kết email (trường ẩn trong biểu mẫu của trang).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Token của liên kết đặt lại mật khẩu (trường ẩn của biểu mẫu).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Mật khẩu mới; áp dụng các quy tắc mật khẩu khi đăng ký.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Nhập lại mật khẩu mới; hai mật khẩu phải giống nhau.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: Một trang HTML mã hóa UTF-8 (`text/html; charset=utf-8`), không có JavaScript hay tài nguyên bên ngoài.
