      summary: Báo cáo đối thủ của một ván gần đây
      description: |-
        Báo cáo đối thủ trong một ván cờ của chính người chơi đã kết thúc trong vòng 7 ngày qua. Bản thân một báo cáo không bao giờ thay đổi hệ số Elo, hình phạt hay mức độ liêm chính. Báo cáo nâng mức ưu tiên xem xét mà người kiểm duyệt nhìn thấy, và, trừ trường hợp `abuse`, yêu cầu phân tích ván cờ bằng chương trình cờ.

        Một báo cáo trùng đối thủ cho cùng ván cờ nhận cùng phản hồi và không thay đổi gì; phản hồi không bao giờ cho biết điều gì về tài khoản bị báo cáo. `GET /games/{id}` cho những người chơi của ván biết trước liệu một báo cáo có được tiếp nhận hay không (`reportable`).

        Endpoint này tự kiểm tra phần thân của nó, theo thứ tự `gameId`, `reported`, `category`, `comment`: một lỗi trả về 400 `invalid_request` không kèm `field`. Các trường mà nó không biết sẽ bị bỏ qua.

        **Giới hạn:** `reports` (theo người chơi), sau đó `REPORTS_PER_DAY` (5) báo cáo cho mỗi người chơi trong 24 giờ (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Báo cáo đã được tiếp nhận (hoặc đã được gửi từ trước).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (không kèm `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: không phải đối thủ của người báo cáo trong một ván cờ đã kết thúc trong vòng 7 ngày qua.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, kèm header `Retry-After`): đã gửi `REPORTS_PER_DAY` báo cáo trong 24 giờ qua. `rate_limited`: giới hạn `reports` hoặc hạn mức tài khoản.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (việc tra cứu phiên gặp cơ sở dữ liệu bị khóa), `timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
