          description: '`server_busy` (hàng đợi băm mật khẩu, hoặc cơ sở dữ liệu vẫn bị khóa), `timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
