          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: máy chủ này không cung cấp đăng nhập bằng Google.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
