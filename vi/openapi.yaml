      summary: Liệt kê các ván cờ của người chơi, có lọc và phân trang
      description: |-
        Các ván cờ của người chơi đã đăng nhập, mới nhất trước, có lọc và phân trang, kèm số ván khớp với bộ lọc. Mọi tham số truy vấn đều không bắt buộc, và giá trị rỗng được coi như không có.

        Phân trang: truyền `next` của trang trước làm `before`; `next` là `null` ở trang cuối. `total` đếm số ván khớp với bộ lọc, trên tất cả các trang.

        **Giới hạn:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: Một id hạng mục chính thức (`3+2`, hoặc `3%2B2`), hoặc `custom` cho mọi ván có thời gian thi đấu khác.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
