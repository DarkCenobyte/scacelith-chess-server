          description: '`rate_limited`: giới hạn `sessions` hoặc hạn mức tài khoản.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (cơ sở dữ liệu vẫn bị khóa), `timeout`. Ngoài ra, `server_busy` với `retryAfter` từ 2 đến 5 khi máy chủ bị tồn đọng nặng (xem phần giới thiệu): yêu cầu chưa được thực thi.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
        - sessions
      summary: Đăng xuất mọi phiên
      description: |-
        Thu hồi mọi phiên của tài khoản, kể cả phiên này. Các WebSocket được mở bằng những phiên đó sẽ bị đóng. Không có phần thân (hoặc `{}`).

        **Giới hạn:** `sessions`.
      security:
