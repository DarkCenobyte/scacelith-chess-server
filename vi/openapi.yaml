        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Giới hạn `page` (một trang HTML), hoặc tầng theo địa chỉ (JSON `rate_limited`).
        '500':
