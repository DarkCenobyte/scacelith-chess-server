    GameSummary:
      type: object
      description: Sažetak spremljene partije.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: ID partije.
        category:
          type: string
          description: ID službene kategorije (`3+2`) ili `custom`.
        rated:
          type: boolean
          description: Računa li se partija za rejting.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Tempo igre u sekundama (`180+2`).
