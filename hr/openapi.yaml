    PgnTagsView:
      type: object
      description: Glavne oznake PGN-a, za prikaz. `Termination` je ovdje naziv razloga završetka; PGN datoteka koristi standardne vrijednosti PGN-a.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` ili `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: Datum početka u UTC-u.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Rejting na početku ili `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Rejting na početku ili `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Zapis partije s potezima i satovima. Ima polja sažetka partije, bez `color` i `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Osnovno vrijeme u milisekundama.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Dodatak u milisekundama.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: Naziv za `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: ID partije čiji je ova partija revanš ili `null`.
            moves:
              type: array
              description: Jedan unos po polupotezu.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Samo kad je igrač tokena igrao ovu partiju; njegova strana.
            reportable:
              type: boolean
              description: Samo kad je igrač tokena igrao ovu partiju; `true` kad bi `POST /reports` sada prihvatio prijavu protivnika za ovu partiju (partija je završila u posljednjih 7 dana, dnevna kvota nije potrošena, a za ovu partiju još nije podnesena prijava protiv protivnika).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Korisničko ime, onako kako ga je igrač napisao.
        createdAt:
          type: integer
          format: int64
          description: Kad je račun izrađen (ms od Unix epohe).
        ratings:
          type: array
          description: Samo službene kategorije, redoslijedom poslužitelja.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Svaka spremljena partija, uključujući one bez rejtinga i poništene.
            rated:
              type: integer
              minimum: 0
              description: Partije za rejting, zbrojene po zapisima rejtinga.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Korisničko ime, onako kako ga je igrač napisao.
        games:
          type: array
          description: Partije na stranici, od najnovije.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: ID posljednje partije kad god je stranica puna (sljedeća stranica tada može biti prazna), inače `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: ID kategorije.
        minGames:
          type: integer
          minimum: 0
          description: Broj uračunatih partija koji zapis treba da bi bio naveden (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Kad je ljestvica izračunana (ms od Unix epohe).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: PGN tekst, najviše 65.536 bajtova UTF-8. Koristi se samo prva partija.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Neobavezno. Veličina slike.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Neobavezno. Strana koja je na dnu ploče.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Neobavezno. Milisekunde po potezu, JSON broj s cjelobrojnom vrijednošću.
        coords:
          type: boolean
          default: true
          description: Neobavezno. Crtaju li se oko ploče slova linija i brojevi redova.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Partija, kao cijeli broj ili niz od 1 do 16 znamenki.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Korisničko ime protivnika, kao u zapisu partije ili kakvo je sada, bez obzira na velika i mala slova. Ne smije biti prazno.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Na što se prijava odnosi.
        comment:
          type:
            - string
            - 'null'
          description: Neobavezno. Najviše 500 znakova nakon uklanjanja kontrolnih znakova (osim tabulatora i prijelaza u novi red) i razmaka na početku i kraju teksta.
    AccountExport:
      type: object
      description: Sve što poslužitelj čuva o računu (vremena u ms od Unix epohe).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Kad je izvoz napravljen.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Što datoteka sadrži i što izostavlja, na jednostavnom engleskom za igrača.
          items:
            type: string
        account:
          description: Prikaz računa iz `GET /account/me`, s `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Adresa povezanog Google računa ili `null`.
        ratings:
          type: array
          description: Potpuni zapisi rejtinga.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Bodovi rejtinga vraćeni nakon što je utvrđeno da je protivnik varao, zbrojeni po danu (UTC) i kategoriji, od najnovijih. Ne navode se ni partije ni varalice.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Svaka spremljena sesija, od najnovije, bez ikakvog tokena. Čišćenje zastarjelih podataka briše isteklu sesiju, a odjavljenu dan nakon odjave.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Sigurnosni događaji, od najnovijeg, koji se čuvaju `RETENTION_SECURITY_DAYS` dana.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Svaka sankcija, uključujući ukinute. Ime moderatora nikad nije uključeno.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Događaji ponašanja zabilježeni za igračeve partije koje su napuštene, poništene ili u kojima prvi potez nije odigran na vrijeme; čuvaju se 30 dana.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Prijave koje je igrač podnio.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Broj partija.
            list:
              type: array
              description: Svaka partija, od najnovije, kao sažeci iz `GET /account/games`. Potezi su na `GET /games/{id}`, a PGN na `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Potpuni zapis rejtinga.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Je li igrač izašao iz faze u kojoj rejting još nije utvrđen.
            countedGames:
              type: integer
              minimum: 0
              description: Partije koje su ušle u rejting.
            updatedAt:
              type: integer
              format: int64
              description: Kad se zapis posljednji put promijenio.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: 00:00 UTC tog dana (ms od Unix epohe).
        category:
          type: string
        points:
          type: integer
          description: Bodovi vraćeni tog dana u toj kategoriji.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Kad je sesija odjavljena ili `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Adresa s koje je obavljena prijava, briše se nakon `RETENTION_IP_DAYS` dana.
    SecurityEvent:
      type: object
      description: |-
        Sigurnosni događaj. `ip` se navodi samo za ono što je učinjeno u prijavljenom stanju, lozinkom računa (i drugim faktorom) ili poveznicom poslanom na njegovu adresu: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` i `account_exported`; svaka druga vrsta ima `ip: null`, a `ip` se briše nakon `RETENTION_IP_DAYS` dana.

        `detail` zadržava samo ova polja: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` i `method` (`password` ili `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` i `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Događaj `moderator_action` zadržava samo `{ action }`, za radnje `ban`, `unban`, `reset_mfa`, `verify_email` i `revoke_sessions` (ostale radnje moderatora izostavljaju se). Svaka druga vrsta ima `detail: null`. Događaji `rating_refund` izostavljaju se: njihovi su bodovi u `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Vrsta događaja (`login`, `password_changed`...).
        at:
          type: integer
          format: int64
          description: Kad se dogodio.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: Trenutno javno ime igrača protiv kojeg je podnesena prijava.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Je li prijava još otvorena (ne navodi se je li igrač protiv kojeg je podnesena prijava sankcioniran).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Token poveznice iz e-poruke (skriveno polje obrasca stranice).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Token poveznice za ponovno postavljanje lozinke (skriveno polje obrasca).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Nova lozinka; vrijede pravila za lozinku pri registraciji.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Ponovno nova lozinka; mora biti ista.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: HTML stranica u UTF-8 (`text/html; charset=utf-8`), bez JavaScripta i vanjskih resursa.
