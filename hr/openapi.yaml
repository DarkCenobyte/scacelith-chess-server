        plies:
          type: integer
          minimum: 0
          description: Broj polupoteza.
        startedAt:
          type: integer
          format: int64
          description: Početak (ms od Unix epohe).
        endedAt:
          type: integer
          format: int64
          description: Kraj (ms od Unix epohe).
    Termination:
