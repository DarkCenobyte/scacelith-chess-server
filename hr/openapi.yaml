      description: |-
        Zamjenjuje kodove za oporavak s 10 novih; stari prestaju raditi.

        **Ponovna autentifikacija:** lozinka i kod iz aplikacije u `code` (kod za oporavak odbija se s 403 `invalid_code`). **Ograničenja:** `reauth`, zatim `reauth_user`.
      security:
