  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Ponovno slanje poveznice za potvrdu
      description: |-
        Ponovno šalje poveznicu za potvrdu adrese e-pošte. Odgovor je 202 `accepted` bez obzira na adresu, tako da nikad ne otkriva koristi li je neki račun ili registracija.

        Zahtjev djeluje najviše jednom svakih 5 minuta po adresi. Registracija na čekanju s tom adresom ponovno dobiva svojih 24 sata, bez obzira na to koristi li adresu drugi račun, tako da njezino korisničko ime u oba slučaja ostaje zadržano jednako dugo. Poveznica se šalje samo za tu registraciju kad adresa nema račun (nova poveznica, valjana 24 sata, zamjenjuje prethodnu) ili za aktivni, nepotvrđeni račun s tom adresom.

        **Ograničenja:** `auth`, zatim `auth_mail` (10 na sat po klijentu).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Prihvaćeno (bez obzira na adresu).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ograničenje `auth` ili `auth_mail` (bez obzira na adresu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` s `retryAfter: 1`: baza podataka ostala je zaključana dok se tražio račun ili spremala poveznica nepotvrđenog računa (obnova registracije na čekanju izvodi se prema mogućnostima i nikad ne uzrokuje neuspjeh zahtjeva); 5 minuta za adresu ipak počinje teći, pa novi zahtjev unutar njih ne čini ništa. `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Slanje poveznice za ponovno postavljanje lozinke
      description: |-
        Šalje poveznicu za ponovno postavljanje lozinke, valjanu jedan sat, koja otvara stranicu `/reset-password`. Odgovor je 202 `accepted` bez obzira na adresu. Poveznica se šalje samo aktivnom računu, najviše jednom svakih 5 minuta po adresi. Račun samo s prijavom putem Googlea na ovaj način postavlja svoju prvu lozinku.

        Oporavak lozinke ima najstroža ograničenja API-ja, sva brojena za cijeli poslužitelj: 3 zahtjeva na sat (`AUTH_FORGOT_PER_HOUR`) i 10 u 24 sata (`AUTH_FORGOT_PER_DAY`) po klijentu (IPv4 adresa ili IPv6 /64), triput toliko po IPv6 /48, uz ograničenje `auth` (20 u 10 minuta) i jednu e-poruku po adresi svakih 5 minuta. Ni 202 ni 429 ne otkrivaju koristi li adresu neki račun. Postavljanje nove lozinke ima vlastito ograničenje (`auth_reset`).

        **Ograničenja:** `auth`, `auth_forgot`, zatim `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Prihvaćeno (bez obzira na adresu).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ograničenje `auth`, `auth_forgot` ili `auth_forgot_day` (bez obzira na adresu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` s `retryAfter: 1`: baza podataka ostala je zaključana dok se tražio račun ili spremala poveznica; 5 minuta za adresu ipak počinje teći, pa novi zahtjev unutar njih ne šalje poveznicu. `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Postavljanje nove lozinke tokenom iz poveznice za ponovno postavljanje
      description: |-
        Postavlja novu lozinku tokenom iz poveznice za ponovno postavljanje lozinke (stranica `/reset-password` čini isto). Nova lozinka slijedi pravila registracije.

        Ponovno postavljanje ima ove učinke, u jednoj transakciji (svi ili nijedan): opoziva sve sesije i otkazuje promjenu e-pošte na čekanju; ostale poveznice za ponovno postavljanje lozinke tog računa prestaju vrijediti; adresa se smatra potvrđenom (poveznica je to dokazala); vlasnik dobiva e-poruku. Dvofaktorska provjera ostaje netaknuta. Nakon pogreške reda za hashiranje lozinki, 503 ili 500, ništa se nije promijenilo: stara lozinka i sesije ostaju, a poveznica ostaje valjana.

        **Ograničenja:** `auth`, zatim `auth_reset` (10 na sat po klijentu, 30 po IPv6 /48, zajedničko sa stranicom: svaki pokušaj hashira lozinku).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Lozinka je promijenjena i sve su sesije odjavljene.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: poveznica je nevaljana, upotrijebljena ili istekla, ili je poslana na adresu koju račun više nema. `weak_password` (s `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ograničenje `auth` ili `auth_reset` ili red za hashiranje lozinki.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: red za hashiranje lozinki ili je baza podataka ostala zaključana (`retryAfter: 1`, ništa nije promijenjeno). `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Pokretanje prijave putem Googlea
      description: |-
        Pokreće pokušaj prijave putem Googlea za PKCE izazov i port slušatelja igre na `127.0.0.1`. Odgovor daje Googleov URL koji treba otvoriti u pregledniku sustava i `state` pokušaja; pokušaj vrijedi 10 minuta.

        `authUrl` sadrži `client_id`, `redirect_uri` (sastavljen od `redirectPort` i oznake podrijetla poslužitelja), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 vlastitog verifikatora poslužitelja za Google) s `code_challenge_method=S256` te `prompt=select_account`. Igra ga provjerava prije nego što ga otvori (vidi opis odjeljka).

        **Ograničenje:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Pokušaj.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: prijava putem Googlea nije ponuđena na ovom poslužitelju.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ograničenje `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza podataka ostala je zaključana), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Pokretanje prijave putem Googlea na web-mjestu
      description: |-
        Pokreće pokušaj prijave putem Googlea s web-mjesta za PKCE izazov njegove stranice. Odgovor je isti kao za igru: Googleov URL na koji treba prijeći i `state` pokušaja; pokušaj vrijedi 10 minuta. Ponuđeno kad `GET /info` kaže `sso.googleWeb: true`.

        `authUrl` sadrži `client_id` web-mjesta i `redirect_uri=GOOGLE_WEB_REDIRECT_URI`, s istim ostalim parametrima kao za igru. Stranica ga provjerava prije nego što prijeđe na njega (vidi **Na web-mjestu** u opisu odjeljka).

        **Ograničenje:** `sso_start`, zajedničko s pokretanjem iz igre.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: Pokušaj.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `codeChallenge` nedostaje ili je neispravnog oblika, ili je poslano bilo koje drugo polje (uključujući `redirectPort`).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: prijava putem Googlea nije ponuđena na ovom poslužitelju ili nije ponuđena web-mjestima.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ograničenje `sso_start` (zajedničko s pokretanjem iz igre).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza podataka ostala je zaključana), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Prosljeđivanje Googleova odgovora poslužitelju
      description: |-
        Prosljeđuje poslužitelju `code` i `state` koje je Google poslao slušatelju igre ili stranici web-mjesta, zajedno s ID-om pokušaja i PKCE verifikatorom. Id pokušaja beskoristan je bez verifikatora, a kod je beskoristan bez vlastitog PKCE verifikatora poslužitelja i tajne klijenta.

        Poslužitelj provjerava pokušaj (nepoznat, upotrijebljen ili istekao: 410), zatim verifikator (pogrešan verifikator ostavlja pokušaj upotrebljivim), zatim troši pokušaj (jednokratno), provjerava `state` i `iss`, razmjenjuje kod s Googleom i provjerava ID token. Odgovor (200) je jedno od sljedećeg:

        - `{ token, expiresAt, user }`: prijava u povezani račun je uspjela;
        - `{ mfaRequired, mfaToken, expiresIn }`: nastavite s `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: novi račun; nastavite s `POST /auth/sso/complete` u roku od 10 minuta. `suggestedUsername` dolazi iz imena na Googleu ili iz adrese, a `""` je kad ništa ne odgovara;
        - `{ needsPassword, linkTicket, username, expiresIn }`: račun s tom adresom ima lozinku; nastavite s `POST /auth/sso/google/link`. Još ništa nije povezano.

        **Ograničenje:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Sesija, drugi korak ili sljedeći korak prve prijave putem Googlea.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Prijava u povezani račun je uspjela
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Dvofaktorska provjera je uključena
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Novi igrač
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Adresu koristi račun s lozinkom
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: verifikator ne odgovara izazovu pokušaja (pokušaj ostaje upotrebljiv). `sso_email_unverified`: Google nije potvrdio adresu. `registration_closed`. `account_disabled`. Samo za povezani račun: `banned` (s `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: prijava putem Googlea nije ponuđena na ovom poslužitelju.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: adresu koristi aktivni račun bez lozinke (ne navodi se koji).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: nepoznat, upotrijebljen ili istekao pokušaj.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ograničenje `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza podataka ostala je zaključana), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Povezivanje Googlea s postojećim računom pomoću njegove lozinke
      description: |-
        Nakon što je `finish` odgovorio s `needsPassword`: povezuje Google s postojećim računom pomoću lozinke tog računa, upisane u igri. Odgovor (200) je sesija (povezivanje je spremljeno i igrač je prijavljen) ili, kad je dvofaktorska provjera uključena, `{ mfaRequired, mfaToken, expiresIn }`: nastavite s `POST /auth/login/mfa`, a povezivanje se sprema tek kad ondje prođe kod.

        Pogrešna lozinka ostavlja tiket upotrebljivim, ukupno za 5 pokušaja. Pokušaj se troši neposredno prije provjere lozinke: 429 `too_many_attempts` ili 428 `pow_required` ne troše nijedan, dok je odbijanje reda za hashiranje lozinki (503 `server_busy`, 429 `rate_limited`) već potrošilo jedan i broji se kao neuspjeh računa. Odgoda nakon neuspjeha isti je brojač kao kod `POST /auth/login`.

        **Ograničenje:** `auth` (s brojanjem po IPv6 /48). **Dokaz rada:** kao za `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Sesija ili drugi korak prijave.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: pogrešna lozinka; tiket ostaje upotrebljiv, ukupno za 5 pokušaja.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (s `until`), tek nakon točne lozinke.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: prijava putem Googlea nije ponuđena na ovom poslužitelju.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: Google račun u međuvremenu je povezan s drugim računom.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: nepoznat, upotrijebljen ili istekao tiket, peta pogrešna lozinka, račun čiji su se status ili adresa promijenili nakon `finish` ili račun čiji su se status, adresa, lozinka ili dvofaktorska provjera promijenili dok se povezivanje spremalo. Ponovno pokrenite prijavu.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (odgoda nakon neuspjeha računa) ili `rate_limited` (ograničenje `auth`, red za hashiranje lozinki).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: red za hashiranje lozinki ili je baza podataka ostala zaključana (`retryAfter: 1`, ništa nije povezano). `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Izrada računa pri prvoj prijavi putem Googlea
      description: |-
        Nakon što je `finish` odgovorio s `needsUsername`: izrađuje račun s odabranim korisničkim imenom (vrijede pravila registracije) i prijavljuje ga. Račun nema lozinku: `hasPassword` je `false`, a „Zaboravljena lozinka?“ (`POST /auth/password/forgot`) postavlja mu lozinku.

        **Ograničenje:** `auth` (uključujući njegovo brojanje po IPv6 /48).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Račun je izrađen i prijavljen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: prijava putem Googlea nije ponuđena na ovom poslužitelju.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (neki račun ima to korisničko ime ili ga drži registracija na čekanju s drugom adresom), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: nepoznat, upotrijebljen ili istekao tiket.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ograničenje `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza podataka ostala je zaključana), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Popis prijavljenih uređaja
      description: |-
        Aktivne sesije računa (prijavljeni uređaji), počevši od posljednje korištene. `current` označava sesiju koja šalje zahtjev. `lastSeenAt` se ažurira najviše svakih 5 minuta (i rjeđe dok poslužitelj jako kasni); `expiresAt` je apsolutni kraj, a ograničenje neaktivnosti može sesiju završiti i ranije.

        **Ograničenje:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aktivne sesije.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ograničenje `sessions` ili kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza podataka ostala je zaključana), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Odjava jednog uređaja
      description: |-
        Odjavljuje jednu sesiju računa; može se odjaviti i trenutna. WebSocket otvoren s tom sesijom zatvara se. Bez tijela (ili `{}`).

        **Ograničenje:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Sesija je odjavljena.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: tijelo različito od `{}` ili `id` koji nije valjano URL kodiran; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: na ovom računu nema aktivne sesije s tim ID-om.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ograničenje `sessions` ili kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza podataka ostala je zaključana), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Dohvaćanje računa, njegovih rejtinga i aktivnih sankcija
      description: |-
        Račun onako kako ga vidi njegov igrač: prikaz računa (ujedno `user` svakog odgovora na prijavu), po jedan zapis rejtinga za svaku kategoriju u kojoj je igrač igrao partije za rejting, aktivne sankcije i suspenzija. Razina integriteta iz sustava protiv varanja nikad se ne prikazuje.

        **Ograničenje:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Račun.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized` ili `invalid_token` (i kad je račun izbrisan).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ograničenje `account` ili kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza podataka ostala je zaključana), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Prihvaćanje ili odbijanje izravnih izazova
      description: |-
        Određuje smiju li drugi igrači izazvati ovog igrača po imenu. Uz `none` izravni se izazovi odbijaju: izazivaču se javlja da igrač nije dostupan. Bez ponovne autentifikacije.

        **Ograničenje:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: Postavke koje sada vrijede.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ograničenje `account` ili kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza podataka ostala je zaključana), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Promjena lozinke
      description: |-
        Mijenja lozinku. Potrebna je trenutna lozinka, ali ne i drugi faktor, čak ni kad je dvofaktorska provjera uključena. Nova lozinka podliježe pravilima registracije (provjerava se nakon trenutne lozinke).

        Promjena ima ove učinke, u jednoj transakciji (svi ili nijedan): opoziva sve ostale sesije (ova ostaje prijavljena), otkazuje promjenu e-pošte na čekanju, poveznice za ponovno postavljanje lozinke tog računa prestaju raditi, a vlasniku se šalje e-poruka.

        **Ponovna autentifikacija:** samo lozinka. **Ograničenja:** `reauth`, zatim `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Lozinka je promijenjena.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (račun samo s prijavom putem Googlea), `weak_password` (s `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: pogrešna trenutna lozinka ili ponovno postavljanje odnosno promjena lozinke koja je stigla dok se zahtjev provjeravao.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neuspjele ponovne autentifikacije računa) ili `rate_limited` (ograničenje `reauth` ili `reauth_user`, kvota računa, red za hashiranje lozinki).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: red za hashiranje lozinki ili je baza podataka ostala zaključana (`retryAfter: 1`, ništa nije promijenjeno). `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Početak uključivanja dvofaktorske provjere
      description: |-
        Sprema novi tajni ključ za autentifikaciju na čekanju, koji zamjenjuje svaki raniji ključ na čekanju, i vraća ga za aplikaciju za autentifikaciju (kao tekst i kao URI `otpauth://` za prikaz u obliku QR koda). Dvofaktorska provjera još nije uključena: `POST /account/mfa/totp/enable` uključuje je kodom iz ovog tajnog ključa.

        **Ponovna autentifikacija:** samo lozinka. **Ograničenja:** `reauth`, zatim `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Tajni ključ na čekanju.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (račun samo s prijavom putem Googlea), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (provjerava se prije lozinke).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neuspjele ponovne autentifikacije računa) ili `rate_limited` (ograničenje `reauth` ili `reauth_user`, kvota računa, red za hashiranje lozinki).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (red za hashiranje lozinki ili je baza podataka ostala zaključana), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Dovršetak uključivanja dvofaktorske provjere i dohvaćanje kodova za oporavak
      description: |-
        Uključuje dvofaktorsku provjeru kodom iz tajnog ključa na čekanju (točno 6 znamenki). Ovdje se lozinka ne traži; unesena je pri postavljanju. Odgovor sadrži 10 kodova za oporavak, koji se prikazuju samo ovaj put.

        **Ograničenja:** `reauth`, zatim `reauth_user`; pogrešan kod ubraja se u neuspjele ponovne autentifikacije računa.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Dvofaktorska provjera je uključena.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` nema točno 6 znamenki ili tijelo krši shemu; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: pogrešan kod (provjerite vrijeme na uređaju).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: nema tajnog ključa na čekanju (najprije pozovite `POST /account/mfa/totp/setup`).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neuspjele ponovne autentifikacije računa) ili `rate_limited` (ograničenje `reauth` ili `reauth_user`, kvota računa).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza podataka ostala je zaključana), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: Isključivanje dvofaktorske provjere
      description: |-
        Isključuje dvofaktorsku provjeru. Tajni ključ i kodovi za oporavak brišu se, a vlasnik dobiva e-poruku.

        **Ponovna autentifikacija:** lozinka i kod iz aplikacije ili kod za oporavak (potrebno je jedno od `code` ili `recoveryCode`). **Ograničenja:** `reauth`, zatim `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Dvofaktorska provjera je isključena.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (račun samo s prijavom putem Googlea), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required` (ni `code` ni `recoveryCode`, provjerava se prije lozinke), `invalid_password`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neuspjele ponovne autentifikacije ili previše isprobanih kodova na ovom računu) ili `rate_limited` (ograničenje `reauth` ili `reauth_user`, kvota računa, red za hashiranje lozinki).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (red za hashiranje lozinki ili je baza podataka ostala zaključana), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /account/mfa/recovery-codes:
