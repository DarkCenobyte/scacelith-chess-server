        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Lozinka računa.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Neobavezno; potrebno uz dvofaktorsku provjeru (ili `recoveryCode`). Kod iz aplikacije ili kod za oporavak.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
