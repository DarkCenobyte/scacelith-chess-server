        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (red za hashiranje lozinki ili je baza podataka ostala zaključana), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: Promjena adrese e-pošte
      description: |-
        Mijenja adresu e-pošte računa. Iz `newEmail` uklanjaju se razmaci na početku i kraju, adresa se pretvara u mala slova, a zatim se provjerava kao adresa pri registraciji.

        **S potvrdom e-pošte** (zadano): 202 `verification_sent`. Poveznica valjana 24 sata šalje se na novu adresu; otvara `/confirm-email-change`, a adresa se mijenja tek kad igrač pritisne gumb na toj stranici. Do tada `GET /account/me` prikazuje novu adresu kao `pendingEmail`. Novi zahtjev zamjenjuje onaj na čekanju; promjena ili ponovno postavljanje lozinke otkazuje ga. Na određenu novu adresu šalje se najviše jedna poveznica svakih 5 minuta, bez obzira na to tko je traži (zahtjev za promjenu koja je već na čekanju zadržava ranije poslanu poveznicu, koja ostaje valjana); odgovor je isti. Trenutna adresa dobiva obavijest da je zatražena promjena na maskiranu adresu (`a***@example.org`). Odgovor i `pendingEmail` isti su i kad neki drugi račun već koristi novu adresu: tada se ne šalje nikakva poveznica, pa se ta promjena nikad ne dovršava, a vlasnik te adrese umjesto toga dobiva obavijest (najviše jednu na sat).

        Kad se poveznica potvrdi, adresa se mijenja i smatra se potvrđenom, uređaji ostaju prijavljeni, ranije poslane poveznice (potvrda, ponovno postavljanje lozinke, druge promjene) prestaju raditi, a prethodna adresa dobiva obavijest u kojoj je nova adresa maskirana.

        **Bez potvrde e-pošte** (`REQUIRE_EMAIL_VERIFICATION=false`): adresa se odmah mijenja (200 `email_changed`), a prethodna adresa dobiva obavijest. Ako adresu koristi neki drugi račun, odgovor je 409 `email_taken`, a vlasnik te adrese dobiva obavijest.

        **Ponovna autentifikacija:** lozinka i, uz dvofaktorsku provjeru, kod iz aplikacije ili kod za oporavak. `invalid_email` i `same_email` provjeravaju se prije lozinke, pa se ne broje kao neuspjeh. **Ograničenja:** `reauth`, zatim `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Adresa je odmah promijenjena (na ovom poslužitelju nema potvrde e-pošte).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: Nova adresa, onako kako je spremljena.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: Poveznica za potvrdu poslana je na novu adresu (ili adresa pripada drugom računu; odgovor to ne otkriva).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email` (trenutna adresa računa), `password_not_set` (račun samo s prijavom putem Googlea), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` (i kad je promjena ili ponovno postavljanje lozinke preteklo zahtjev: poveznica se ne šalje), `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: samo bez potvrde e-pošte.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neuspjele ponovne autentifikacije ili previše isprobanih kodova na ovom računu) ili `rate_limited` (ograničenje `reauth` ili `reauth_user`, kvota računa, red za hashiranje lozinki).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: red za hashiranje lozinki ili je baza podataka ostala zaključana (`retryAfter: 1`: ništa nije promijenjeno i isti se zahtjev može ponovno poslati). `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /account/export:
