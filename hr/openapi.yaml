        expiresAt:
          type: integer
          format: int64
          description: Apsolutni kraj (ms od Unix epohe); ograničenje neaktivnosti može sesiju završiti i ranije.
        clientLabel:
          type:
            - string
            - 'null'
          description: '`clientLabel` prijave ili `null` ako ga prijava nije poslala.'
        current:
          type: boolean
          description: Je li to sesija koja šalje zahtjev.
    AccountMe:
