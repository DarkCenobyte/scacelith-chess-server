          $ref: '#/components/responses/NotFound'
          description: '`not_found`: takva partija ne postoji.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ograničenje `public_read` ili kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (baza podataka ostala je zaključana; `retryAfter: 1` u tijelu, bez zaglavlja `Retry-After`), `server_busy` (dohvat sesije naišao je na zaključanu bazu podataka), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Preuzimanje partije kao PGN datoteke
      description: |-
        Ista partija kao PGN datoteka: jedna partija sa završecima redaka `\n` i tekstom poteza u recima kraćima od 80 stupaca. Odgovor je isti s tokenom i bez njega.

        Oznake, ovim redoslijedom: `Event` (`<SERVER_NAME> rated <category>` ili `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (datum početka u UTC-u), `Round`, `White`, `Black`, `Result` (`*` za poništenu partiju), `UTCDate` i `UTCTime` (početak), `WhiteElo` i `BlackElo` (rejtinzi na početku ili `-`), `WhiteRatingDiff` i `BlackRatingDiff` (promjene, primjerice `+10` i `-10`, u svakoj partiji za rejting, `+0` kad pravila rejtinga ostave rejting nepromijenjenim; partija bez rejtinga, s prilagođenim tempom igre ili poništena partija nema ni jednu ni drugu), `TimeControl` (u sekundama), `Termination` (standardna vrijednost PGN-a: `normal`; `time forfeit`, istek vremena, i kad završi remijem; `abandoned`; `rules infraction`, drugi nepravilan potez ili kontumacija zbog kršenja pravila poštene igre; `unterminated`, poništena partija), `PlyCount`, `ScacelithGameId` (decimalni ID).

        Svaki potez nosi `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: sat igrača koji je odigrao potez, nakon tog poteza, i vrijeme obračunato za potez, u desetinkama sekunde (odsječeno). Vrijednost se izostavlja kad je zapis nema. Nakon posljednjeg poteza slijedi razlog završetka riječima, zatim rezultat.

        **Ograničenje:** `public_read` (po igraču s tokenom, po klijentu bez tokena).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: PGN datoteka.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'PGN tekst, u UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: nije pozitivan cijeli broj od najviše 16 znamenki (manji od 2^53); `invalid_request`: nije valjano URL kodiran.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: poslan je token koji nije valjan.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: takva partija ne postoji.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ograničenje `public_read` ili kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: među ostalim, spremljeni potezi ne mogu se ponovno odigrati do spremljenog završetka (poslužitelj to bilježi u dnevnik).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (baza podataka ostala je zaključana; `retryAfter: 1` u tijelu, bez zaglavlja `Retry-After`), `server_busy` (dohvat sesije naišao je na zaključanu bazu podataka), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Preuzimanje partije s ovog poslužitelja kao animiranog GIF-a
      description: |-
        Partija kao animirani GIF. Imena i rejtinzi preuzimaju se iz zapisa partije (rejtinzi na početku, izbrisani račun kao `deleted#<id>`), kao i rezultat i način završetka (`Resignation`, `Loss on time`...).

        Provjere se obavljaju ovim redoslijedom: `gif_disabled`, mogućnosti slike (`size`, `orientation`, `delay`, `coords`), ID partije, partija, njezina duljina.

        **Potrebna sesija:** kvote se broje po računu. **Ograničenja:** `gif` na svakom zahtjevu; `gif_user_min`, `gif_user_hour`, `gif_ip_min` i `gif_ip_hour` samo kad GIF treba izraditi (vidi opis odjeljka). **Vremensko ograničenje:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 sekundi (prema zadanim postavkama 45 sekundi).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 'Veličina slike: `small` (polja od 32 px), `medium` (48 px) ili `large` (72 px).'
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Strana koja je na dnu ploče.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Milisekunde po potezu (od 1 do 6 decimalnih znamenki).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Crtaju li se oko ploče slova linija i brojevi redova (`1`) ili ne (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` s `field` (`size`, `orientation`, `delay` ili `coords`): vrijednost izvan dopuštenih. `invalid_game_id`. `invalid_request`: nije valjano URL kodiran.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: takva partija ne postoji. `gif_disabled`: poslužitelj je isključio GIF-ove (`GIF_ENABLED=false`; žeton `gif` se vraća).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ograničenje `gif`, ograničenje iscrtavanja ili kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF nije bilo moguće izraditi (poslužitelj razlog bilježi u dnevnik). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` s `retryAfter` (od 3 do 10 sekundi) i `Retry-After`: red za iscrtavanje je pun ili je GIF `GIF_QUEUE_TIMEOUT_MS` (10 sekundi) čekao slobodnu dretvu; vraćaju se svi žetoni ograničenja koje je zahtjev uzeo. `busy`: baza podataka ostala je zaključana (`retryAfter: 1` samo u tijelu). `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Izrada animiranog GIF-a bilo koje partije poslane kao PGN
      description: |-
        Ista slika kao kod `GET /games/{id}/gif` za bilo koju partiju poslanu kao PGN tekst: partiju koju je spremila igra, izvoz s nekog drugog web-mjesta, partiju upisanu ručno. Koristi se samo prva partija iz teksta.

        - Čitač PGN-a prihvaća ono što prihvaća i vlastiti čitač igre: svaki PGN koji ovaj poslužitelj zapisuje i uobičajene izvoze drugih web-mjesta (komentari, varijante, NAG-ovi i bilješke sata preskaču se; brojevi poteza i SAN čitaju se tolerantno; oznaka `FEN` daje početnu poziciju osim ako je `SetUp` `"0"`).
        - Imena i rejtinzi uzimaju se iz oznaka `White`, `Black`, `WhiteElo` i `BlackElo`. Slova s dijakritičkim znakovima gube ih, ostali znakovi izvan ispisivog ASCII-ja postaju `?`, a duga se imena skraćuju (48 znakova). Rezultat se uzima iz oznake `Result`, inače s kraja teksta poteza. Oznaka `Termination` prikazuje se osim ako je `normal`: završna pozicija tada sama govori kako je partija završila (mat, pat).
        - Ova krajnja točka sama provjerava svoje tijelo: na nepoznato polje ili na `pgn` koji nedostaje ili nije niz znakova odgovara s 400 `invalid_request` s `field`; na pogrešnu mogućnost odgovara s 400 `invalid_option` (`delayMs` mora biti JSON broj, `coords` logička vrijednost; `null` se odbija).

        **Potrebna sesija:** kvote se broje po računu. **Ograničenja:** kao za `GET /games/{id}/gif`. **Ograničenje veličine tijela:** 135.168 bajtova, bez obzira na `HTTP_BODY_LIMIT` (PGN kao JSON niz znakova, uključujući njegove escape sekvence). **Vremensko ograničenje:** prema zadanim postavkama 45 sekundi.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Kratka ručno upisana partija, bez koordinata
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: PGN datoteka sa svim mogućnostima
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` s `field` (nepoznato polje ili `pgn` nedostaje ili nije niz znakova; bez `field` kad tijelo nije objekt); `invalid_json`; `invalid_option` s `field` (`size`, `orientation`, `delayMs` ili `coords`); `invalid_pgn` s `line` i `column` (od 1, stupci u znakovima) i porukom čitača u `message`: nepravilan ili dvosmislen potez, neispravna oznaka, nepoznata varijanta šaha, više od 65.536 bajtova.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: poslužitelj je isključio GIF-ove (`GIF_ENABLED=false`; žeton `gif` se vraća).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: tijelo veće od 135.168 bajtova.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ograničenje `gif`, ograničenje iscrtavanja ili kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF nije bilo moguće izraditi (poslužitelj razlog bilježi u dnevnik). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` s `retryAfter` (od 3 do 10 sekundi) i `Retry-After`: red za iscrtavanje je pun ili je GIF predugo čekao slobodnu dretvu; vraćaju se svi žetoni ograničenja koje je zahtjev uzeo. `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /players/{username}:
