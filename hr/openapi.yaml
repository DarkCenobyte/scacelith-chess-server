components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Token sesije (`sct_` iza kojeg slijede 43 base64url znaka) iz odgovora na prijavu, u zaglavlju `Authorization`: `Authorization: Bearer <token>`. Prefiks je točno `Bearer` (razlikuju se velika i mala slova) i jedan razmak; vrijednost koja ga nema ili token koji nema od 1 do 512 ispisivih ASCII znakova dobiva odgovor 401 `invalid_token` kao i svaki drugi nevaljani token. Prazno zaglavlje smatra se nepostojećim zaglavljem.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: ID partije, pozitivan decimalni cijeli broj od najviše 16 znamenki bez vodećih nula, manji od 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: ID sesije, onako kako ga daje `GET /auth/sessions`, napisan bez vodećih nula (`03` nije sesija 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Korisničko ime igrača, bez obzira na velika i mala slova. Poslužitelj prihvaća svako ime od 2 do 24 znaka iz `[A-Za-z0-9_.-]` (najšire pravilo koje je ikad dopuštao).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: ID partije; navode se samo starije partije. Pošaljite `next` prethodne stranice. Prazna vrijednost smatra se izostavljenom.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Veličina stranice, od 1 do 50. Veći broj od najviše 3 znamenke smatra se brojem 50; prazna vrijednost smatra se izostavljenom.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: Token poveznice iz e-poruke (43 base64url znaka). Ako nedostaje ili je pogrešan, prikazuje se stranica „link invalid or expired“ (poveznica nije valjana ili je istekla).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Svaki odgovor poslužitelja zabranjuje spremanje u predmemoriju.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Broj sekundi čekanja prije ponovnog pokušaja; ista vrijednost kao `retryAfter` u tijelu.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Izazov sheme bearer, s `error="invalid_token"` za nevaljani token.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Poslužitelj zatvara vezu nakon ovog odgovora.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (s `field` kad je problem u nekom polju tijela) ili `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Polje krši shemu
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Tijelo nije JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Slaba lozinka
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: PGN koji se ne može pročitati
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (nema zaglavlja `Authorization`) ili `invalid_token` (token je neispravnog oblika, istekao, opozvan ili pripada izbrisanom računu).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Nema sesije
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Nevaljani token
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Zahtjev je odbijen.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Pogrešna lozinka pri ponovnoj autentifikaciji
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Suspendirani račun
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found` ili značajka koju je ovaj poslužitelj isključio.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: tijelo nije stiglo u roku od 10 sekundi. Poslužitelj zatvara vezu.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Zahtjev je u sukobu sa stanjem poslužitelja.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: pokušaj prijave putem Googlea ili tiket nepoznat je, upotrijebljen ili istekao; ponovno pokrenite prijavu.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: tijelo premašuje `HTTP_BODY_LIMIT` (prema zadanim postavkama 16.384 bajta). Poslužitelj zatvara vezu.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: cilj zahtjeva premašuje 4096 znakova.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: tijelo nije `application/json` ili njegov skup znakova nije UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: partija ima više od `GIF_MAX_PLIES` (600) polupoteza.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: riješite izazov `pow` i ponovno pošaljite isti zahtjev s `pow: { challenge, nonce }`. `reason` kaže zašto: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` ili `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (ograničenje učestalosti, kvota računa ili red za hashiranje lozinki) ili `too_many_attempts` (ograničenje na razini računa), s `retryAfter` i zaglavljem `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Ograničenje učestalosti
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Previše neuspjeha na ovom računu
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: neočekivana pogreška. Poslužitelj je bilježi u dnevnik.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: pogrešan `state` ili `iss`, ili je Google odbio kod ili poslao ID token koji ne prolazi provjeru (uključujući kod ili ID token drugog klijenta, igre ili web-mjesta). Nikad ne sadrži Googleov tekst.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` ili `timeout`: pokušajte ponovno nakon `retryAfter` kad je naveden.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Poslužitelj je zauzet
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Baza podataka ostala je zaključana (čitanje)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Poslužitelj je predugo odgovarao
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Animirani GIF, kao privitak.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` za partiju s ovog poslužitelja, `attachment; filename="scacelith-game.gif"` za PGN poslan s `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Veličina datoteke u bajtovima.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: HTML stranica.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: HTML stranica koja objašnjava odbijanje.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Obrazac nije stigao u roku od 10 sekundi (HTML stranica). Poslužitelj zatvara vezu.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: HTML stranica koja objašnjava sukob.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Obrazac premašuje `HTTP_BODY_LIMIT` (HTML stranica). Poslužitelj zatvara vezu.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Tijelo nije ni obrazac (`application/x-www-form-urlencoded`) ni JSON ili njegov skup znakova nije UTF-8 (HTML stranica).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Ograničenje učestalosti (HTML stranica), s `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Neočekivana pogreška (HTML stranica s naslovom „Server error“, tj. pogreška poslužitelja). Poslužitelj je bilježi u dnevnik.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Poslužitelj je zauzet (baza podataka ostala je zaključana ili poslužitelj jako kasni; s `Retry-After`) ili je predugo odgovarao (HTML stranica s naslovom „Server error“, tj. pogreška poslužitelja).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: Jedinstveni oblik svakog odgovora s pogreškom u JSON API-ju.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Kod pogreške u obliku `snake_case`. Na temelju njega klijent odabire što će prikazati.
          examples:
            - rate_limited
        message:
          type: string
          description: Rečenica na engleskom, namijenjena dnevnicima i kao zamjenski tekst.
        retryAfter:
          type: integer
          minimum: 1
          description: Broj sekundi čekanja prije ponovnog pokušaja, prisutan samo kod odbijanja koja s vremenom prestaju. Odgovor tada nosi i zaglavlje `Retry-After` s istom vrijednošću, osim kod 503 `busy` pri čitanju povijesti, partija, igrača i ljestvice.
        field:
          type: string
          description: Polje ili parametar upita u kojem je problem (`invalid_request`, `invalid_option` te `invalid_cursor`, `invalid_limit` i `invalid_filter` kod `GET /account/games`). Ugniježđeno polje piše se s točkom (`pow.nonce`).
        reason:
          type: string
          description: 'Razlog: pravilo koje `weak_password` krši ili zašto je dokaz rada zatražen ili odbijen (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Samo `banned`: kraj suspenzije (ms od Unix epohe), `null` za trajnu suspenziju.'
        line:
          type: integer
          minimum: 1
          description: 'Samo `invalid_pgn`: redak pogreške, od 1.'
        column:
          type: integer
          minimum: 1
          description: 'Samo `invalid_pgn`: stupac pogreške, od 1, u znakovima.'
    PowChallenge:
      type: object
      description: Izazov dokaza rada (`pow` iz odgovora 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Potpisani izazov, koji treba vratiti nepromijenjen.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Broj vodećih nultih bitova koje `SHA-256(challenge + ":" + nonce)` mora imati.
        expiresAt:
          type: integer
          format: int64
          description: Kad izazov istječe (ms od Unix epohe), 2 minute nakon izdavanja.
    PowAnswer:
      type: object
      description: Odgovor na izazov dokaza rada.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: '`challenge` iz odgovora 428, onako kako je dan.'
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Decimalni niz od najviše 20 znamenki takav da `SHA-256(challenge + ":" + nonce)` počinje s `bits` nultih bitova.
    ServerInfo:
      type: object
      description: Ono što klijentu treba prije nego što se prijavi ili poveže.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Naziv poslužitelja (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: UUID koji baza podataka dobiva pri prvom pokretanju. Ostaje isti nakon ponovnih pokretanja. Ima vrijednost `null` kad ga baza podataka ne može dati.
        motd:
          type: string
          description: Poruka dana (`SERVER_MOTD`), moguće prazna.
        protocol:
          type: object
          description: Protokol WebSocketa (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Najstarija verzija protokola koju poslužitelj podržava.
            max:
              type: integer
              minimum: 1
              description: Najnovija verzija protokola koju poslužitelj podržava.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'Otisak sheme protokola (prva 4 bajta SHA-256 njezina kanonskog oblika, kao cijeli broj bez predznaka: `0xc649140f`, 3326678031, za sporednu verziju protokola 2); informativno, nikad se ne uspoređuje.'
            subprotocol:
              type: string
              description: Token podprotokola WebSocketa (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: Port WebSocketa koji igrači koriste (`PUBLIC_WS_PORT`, inače `WS_PORT`, inače `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: Putanja WebSocketa.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Mogu li se izrađivati novi računi.
        emailVerification:
          type: boolean
          description: Potvrđuju li novi računi svoju adresu (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Nudi li se igri prijava putem Googlea.
            googleWeb:
              type: boolean
              description: Nudi li se prijava putem Googlea i web-mjestu (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: Dvofaktorska provjera uvijek je dostupna.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Broj bitova dokaza rada koji registracija zahtijeva (0 ako ga ne zahtijeva).
        categories:
          type: array
          description: Službeni tempovi igre, tj. oni za rejting (`RATED_CATEGORIES`), redoslijedom poslužitelja. Svaki drugi tempo igre je `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Pravila koja klijent može provjeriti prije slanja obrasca.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: Najmanja duljina korisničkog imena (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: Najveća duljina korisničkog imena (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Regularni izraz kojem novo korisničko ime mora odgovarati.
            passwordMinLength:
              type: integer
              description: Najmanja duljina lozinke, u znakovima (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Najveća duljina lozinke, u bajtovima UTF-8.
            customTimeControls:
              type: boolean
              description: Smiju li izazovi i privatne partije koristiti prilagođene tempove igre.
            reportsPerDay:
              type: integer
              description: Koliko prijava igrač smije podnijeti u 24 sata (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Najveća poruka WebSocketa koju klijent smije poslati, u bajtovima.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Službeni tempo igre.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 'ID kategorije: minute i sekunde dodatka (`3+2`).'
        baseSec:
          type: number
          minimum: 0
          description: Osnovno vrijeme, u sekundama.
        incSec:
          type: number
          minimum: 0
          description: Dodatak po potezu, u sekundama.
    AccountView:
      type: object
      description: Račun onako kako ga vidi njegov igrač (`user` u odgovorima na prijavu i u `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: ID računa.
        username:
          type: string
          description: Korisničko ime.
        email:
          type: string
          format: email
          description: Adresa e-pošte.
        emailVerified:
          type: boolean
          description: Je li adresa potvrđena.
        mfaEnabled:
          type: boolean
          description: Je li dvofaktorska provjera uključena.
        googleLinked:
          type: boolean
          description: Je li povezan Google račun.
        hasPassword:
          type: boolean
          description: '`false` za račun izrađen putem Googlea koji još nije postavio lozinku.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Prihvaćaju li se izravni izazovi po imenu (vidi `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Kad je račun izrađen (ms od Unix epohe).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Posljednja prijava (ms od Unix epohe) ili `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Nova adresa promjene e-pošte koja čeka svoju poveznicu ili `null`.
    SessionAnswer:
      type: object
      description: Nova sesija.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Token sesije, za zaglavlje `Authorization` i WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: Apsolutni kraj sesije (ms od Unix epohe); ograničenje neaktivnosti može je završiti i ranije.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Drugi korak prijave s dvofaktorskom provjerom; nastavite s `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Token koraka, za `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Broj preostalih sekundi za dovršetak koraka.
    LoginAnswer:
      description: Sesija ili drugi korak prijave s dvofaktorskom provjerom.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Prva prijava putem Googlea; nastavite s `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Tiket za `POST /auth/sso/complete`, valjan 10 minuta.
        suggestedUsername:
          type: string
          description: Korisničko ime izvedeno iz imena na Googleu ili iz adrese, ili `""` kad ništa ne odgovara.
    SsoNeedsPassword:
      type: object
      description: Adresu koristi račun s lozinkom; nastavite s `POST /auth/sso/google/link`. Još ništa nije povezano.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Tiket za `POST /auth/sso/google/link`.
        username:
          type: string
          description: Korisničko ime tog računa (vidi ga samo onaj tko je Googleu dokazao vlasništvo nad adresom).
        expiresIn:
          type: integer
          const: 600
          description: Broj sekundi koliko tiket ostaje valjan.
    SsoFinishAnswer:
      description: Odgovor krajnje točke `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Pokušaj prijave putem Googlea.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Pokušaj, za `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: Googleov URL koji treba otvoriti u pregledniku sustava, nakon provjere.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state` koji Google mora vratiti.'
        expiresIn:
          type: integer
          const: 600
          description: Broj sekundi koliko pokušaj ostaje valjan.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Korisničko ime; zatim pravila poslužitelja (vidi opis).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Adresa e-pošte. Uklanjaju se razmaci na početku i kraju, a sprema se malim slovima.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Lozinka; zatim pravila za lozinku.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Korisničko ime ili adresa e-pošte (svaki tekst s `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Neobavezno. Prikazuje se na popisu prijavljenih uređaja (primjerice `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: '`mfaToken` iz odgovora na prijavu (ili iz odgovora na prijavu putem Googlea).'
        code:
          type: string
          maxLength: 32
          description: Neobavezno. Šesteroznamenkasti kod iz aplikacije ili kod za oporavak.
        recoveryCode:
          type: string
          maxLength: 32
          description: Neobavezno. Kod za oporavak. Potrebno je jedno od `code` i `recoveryCode`.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Adresa e-pošte.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Parametar `token` poveznice za ponovno postavljanje lozinke.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Nova lozinka; vrijede pravila za lozinku pri registraciji.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: PKCE izazov S256 za klijentov `codeVerifier` (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Port klijentova slušatelja na `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: PKCE izazov S256 za `codeVerifier` stranice (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`attemptId` iz `POST /auth/sso/google/start`.'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: PKCE verifikator; njegov SHA-256 mora odgovarati izazovu predanom u `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state` onako kako ga je Google vratio.'
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: '`code` onako kako ga je Google vratio (ispisivi ASCII bez razmaka).'
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Neobavezno. `iss` onako kako ga je Google vratio, ako ga je vratio.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`linkTicket` iz `finish`, valjan 10 minuta.'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Lozinka računa.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
