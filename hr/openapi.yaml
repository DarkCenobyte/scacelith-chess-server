          description: '`server_busy` (red za hashiranje lozinki ili je baza podataka ostala zaključana), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Popis igračevih partija, filtriran i podijeljen na stranice
      description: |-
        Partije prijavljenog igrača, od najnovije, filtrirane i podijeljene na stranice, uz broj partija koje odgovaraju filtru. Svi su parametri upita neobavezni, a prazna vrijednost smatra se izostavljenom.

        Straničenje: pošaljite `next` prethodne stranice kao `before`; `next` je `null` na posljednjoj stranici. `total` broji partije koje odgovaraju filtru, na svim stranicama.

        **Ograničenje:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: ID službene kategorije (`3+2` ili `3%2B2`) ili `custom` za svaku partiju s drugim tempom igre.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Samo partije za rejting (`true`) ili bez rejtinga (`false`).
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Samo dobivene, izgubljene ili remizirane partije, gledano s igračeve strane. Poništene partije pojavljuju se samo bez ovog filtra.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Jedna stranica povijesti.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` nije ID partije), `invalid_limit` ili `invalid_filter` (`category`, `rated` ili `result`), svaki s `field` koji navodi parametar.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ograničenje `account_games` ili kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (baza podataka ostala je zaključana; `retryAfter: 1` u tijelu, bez zaglavlja `Retry-After`), `server_busy` (dohvat sesije naišao je na zaključanu bazu podataka), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /games/{id}:
