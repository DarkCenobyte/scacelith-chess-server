      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`ssoTicket` iz `finish`, valjan 10 minuta.'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Korisničko ime; vrijede pravila registracije.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
