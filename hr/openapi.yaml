        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (vidi kodove partija).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Kod razloga završetka (vidi kodove partija).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Rezultat, `*` za poništenu partiju.
        termination:
