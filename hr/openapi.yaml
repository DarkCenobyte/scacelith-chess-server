        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neuspjele ponovne autentifikacije ili previše isprobanih kodova na ovom računu) ili `rate_limited` (ograničenje `reauth` ili `reauth_user`, kvota računa, red za hashiranje lozinki).'
        '500':
