  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: Dohvaćanje najboljih igrača kategorije
      description: |-
        100 najboljih zapisa rejtinga službene kategorije s najmanje `minGames` (`PROVISIONAL_GAMES`) uračunatih partija, bez izbrisanih računa i potvrđenih varalica. Poslužitelj svaku ljestvicu ponovno izračunava najviše svakih 10 sekundi; `updatedAt` kaže kada. Za jednu kategoriju istodobno se izvodi samo jedan izračun: u međuvremenu ostali zahtjevi dobivaju prethodni popis ili čekaju izračun ako popisa još nema.

        **Ograničenja:** samo sloj po adresi.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: ID službene kategorije (`3+2` ili `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: Broj igrača, od 1 do 100. Veći broj od najviše 3 znamenke smatra se brojem 100; prazna vrijednost smatra se izostavljenom.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: Ljestvica.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (nedostaje ili nije službena kategorija), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: sloj po adresi.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (baza podataka ostala je zaključana; `retryAfter: 1` u tijelu, bez zaglavlja `Retry-After`), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Prijava protivnika iz nedavne partije
      description: |-
        Prijavljuje protivnika iz jedne od igračevih vlastitih partija koja je završila u posljednjih 7 dana. Prijava sama po sebi nikad ne mijenja rejting, sankciju ni razinu integriteta. Podiže prioritet pregleda koji vide moderatori i, osim za `abuse`, traži analizu partije šahovskim programom.

        Prijava istog protivnika za istu partiju dobiva isti odgovor i ništa ne mijenja; odgovor nikad ništa ne otkriva o računu protiv kojeg je podnesena prijava. `GET /games/{id}` igračima partije unaprijed govori bi li prijava bila prihvaćena (`reportable`).

        Ova krajnja točka sama provjerava svoje tijelo, redoslijedom `gameId`, `reported`, `category`, `comment`: na neuspjeh odgovara s 400 `invalid_request` bez `field`. Polja koja ne poznaje zanemaruju se.

        **Ograničenja:** `reports` (po igraču), zatim `REPORTS_PER_DAY` (5) prijava po igraču u 24 sata (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Prijava je primljena (ili je već bila podnesena).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (bez `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: nije protivnik prijavitelja u partiji koja je završila u posljednjih 7 dana.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, sa zaglavljem `Retry-After`): `REPORTS_PER_DAY` prijava u posljednja 24 sata. `rate_limited`: ograničenje `reports` ili kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (dohvat sesije naišao je na zaključanu bazu podataka), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
