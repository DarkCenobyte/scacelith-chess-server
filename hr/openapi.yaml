paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Dohvaćanje naziva, verzija, portova i pravila registracije poslužitelja
      description: |-
        Ono što klijentu treba prije nego što se prijavi ili poveže: naziv i id poslužitelja, verzije protokola WebSocketa i gdje se WebSocket nalazi, pravila registracije, službeni tempovi igre i ograničenja koja klijent može provjeriti prije slanja obrasca.

        **Ograničenja:** samo sloj po adresi.
      security: []
      responses:
        '200':
          description: Opis poslužitelja.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: sloj po adresi.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Izrada računa
      description: |-
        Izrađuje račun: kad se njegova adresa e-pošte potvrdi poveznicom poslanom na nju ili odmah, bez potvrde e-pošte.

        **S potvrdom e-pošte** (`REQUIRE_EMAIL_VERIFICATION`, zadano): 202 `verification_sent`. Račun još ne postoji: registracija čeka 24 sata i za to vrijeme drži svoje korisničko ime. Na adresu stiže poveznica valjana tih 24 sata, najviše jedna po adresi svakih 5 minuta (`POST /auth/verify-email/resend` šalje novu); račun se izrađuje, s potvrđenom adresom, kad se poveznica upotrijebi (gumb na stranici `/verify-email`), i igrač se tada može prijaviti. Do tada se na prijavu s tim korisničkim imenom odgovara s `invalid_credentials`, kao za nepoznati račun, a javni profil ne postoji. Nova registracija s istom adresom zamjenjuje onu na čekanju. Odgovor je isti kad adresu već koristi drugi račun: tada se poveznica ne šalje, nego njegov vlasnik dobiva obavijest (najviše jednu na sat), a korisničko ime drži se na isti način, tako da ništa ne otkriva ima li adresa račun. Registracija čija poveznica nije upotrijebljena odbacuje se nakon 24 sata, a njezino korisničko ime ponovno je slobodno.

        **Bez potvrde e-pošte** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, račun se izrađuje odmah i može se prijaviti.

        **Pravila.** `username`: od `USERNAME_MIN` do `USERNAME_MAX` znakova (od 3 do 20), slova, znamenke, `_` i `-`, s početnim slovom ili znamenkom (`GET /info` daje ih kao `limits`); rezervirana imena (`admin`, `moderator`, `deleted`...) i neki prefiksi odbijaju se; jedinstveno bez obzira na velika i mala slova. `email`: bez razmaka na početku i kraju, sprema se malim slovima, običan ASCII s domenom koja sadrži točku. `password`: najmanje `PASSWORD_MIN_LENGTH` (10) znakova i najviše 256 bajtova UTF-8; ne smije sadržavati korisničko ime ni lokalni dio adrese e-pošte i ne smije biti uobičajena lozinka.

        **Pogreške**, provjeravane ovim redoslijedom: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; pogreške reda za hashiranje lozinki; 409 `email_taken` (samo bez potvrde e-pošte).

        **Ograničenja:** `auth`, zatim `auth_register` (10 registracija na sat po klijentu). **Dokaz rada:** uvijek, kad je `POW_REGISTER_BITS` veći od 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Prvi pokušaj, bez dokaza rada
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Ponovno poslano s dokazom rada
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Račun je izrađen i može se prijaviti (na ovom poslužitelju nema potvrde e-pošte).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Registracija čeka svoju poveznicu za potvrdu (ili adresa već ima račun; odgovor to ne otkriva).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (s `field`), `invalid_json`, `invalid_username`, `invalid_email` ili `weak_password` s `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` ili `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: registracija je na ovom poslužitelju zatvorena (`GET /info` kaže `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: neki račun ima to korisničko ime ili ga drži registracija na čekanju s drugom adresom. `email_taken`: adresu koristi drugi račun (samo bez potvrde e-pošte).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ograničenje `auth` ili `auth_register` ili red za hashiranje lozinki.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (red za hashiranje lozinki ili je baza podataka ostala zaključana), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Prijava lozinkom
      description: |-
        Prijava korisničkim imenom ili adresom e-pošte i lozinkom. Moguća su dva odgovora, oba sa statusom 200: sesija ili, kad je dvofaktorska provjera uključena, drugi korak koji treba dovršiti u roku od 5 minuta s `POST /auth/login/mfa`.

        Nepoznati račun, pogrešna lozinka i račun bez lozinke dobivaju isti odgovor, nakon jednakog vremena: 401 `invalid_credentials`. Provjere računa (`banned`, `email_unverified`) dolaze tek nakon točne lozinke. Od `AUTH_FAILURES_PER_ACCOUNT` (5) neuspjeha s jednim imenom za prijavu svaki pokušaj mora čekati (429 `too_many_attempts`).

        **Ograničenje:** `auth`. **Dokaz rada:** samo tijekom vala neuspjelih prijava (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Sesija ili drugi korak prijave s dvofaktorskom provjerom.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Prijava je uspjela
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Dvofaktorska provjera je uključena
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: nepoznati račun, pogrešna lozinka ili račun bez lozinke.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Samo nakon točne lozinke: `banned`, s `until` (ms od Unix epohe, `null` za trajnu suspenziju), ili `email_unverified` (stariji račun čija adresa još nije potvrđena).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (odgoda nakon neuspjeha za ovo ime za prijavu) ili `rate_limited` (ograničenje `auth`, red za hashiranje lozinki).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (red za hashiranje lozinki ili je baza podataka ostala zaključana), `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Dovršetak prijave drugim faktorom
      description: |-
        Drugi korak prijave s dvofaktorskom provjerom, nakon odgovora `mfaRequired` na `POST /auth/login` ili na prijavu putem Googlea (`POST /auth/sso/google/finish` ili `POST /auth/sso/google/link`). Pošaljite `code` (šesteroznamenkasti kod iz aplikacije za autentifikaciju ili kod za oporavak) ili `recoveryCode`. Kod za oporavak upotrijebljen ovdje nestaje.

        Jedan korak prihvaća najviše 5 pogrešnih kodova; korak završava i kad se lozinka ponovno postavi ili promijeni. Nakon koraka lozinke pri povezivanju s Googleom povezivanje se sprema tek kad kod ovdje prođe.

        **Ograničenja:** `auth` te najviše `AUTH_MFA_PER_ACCOUNT` (10) kodova u 15 minuta za račun, s bilo koje adrese; iznad toga kod se ne provjerava, pa se kod za oporavak ne troši.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Kod iz aplikacije za autentifikaciju
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Kod za oporavak
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Prijava je uspjela.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: nije poslan ni `code` ni `recoveryCode` ili tijelo krši shemu; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: korak je istekao, upotrijebljen je ili je završio nakon 5 pogrešnih kodova, ili je lozinka ponovno postavljena ili promijenjena nakon prvog koraka (ponovno se prijavite). `invalid_code`: pogrešan ili već upotrijebljen kod.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (s `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: samo nakon koraka lozinke pri povezivanju s Googleom; Google račun u međuvremenu je povezan s drugim računom.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: samo nakon koraka lozinke pri povezivanju s Googleom; račun se u međuvremenu promijenio; ponovno pokrenite prijavu.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: odgoda nakon neuspjeha računa ili je račun u posljednjih 15 minuta potrošio svojih `AUTH_MFA_PER_ACCOUNT` kodova. `rate_limited`: ograničenje `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` s `retryAfter: 1`: baza podataka ostala je zaključana (nakon koraka povezivanja s Googleom ništa nije povezano: ponovno pokrenite prijavu). `timeout`. Također `server_busy` s `retryAfter` od 2 do 5 kad poslužitelj jako kasni (vidi uvod): zahtjev nije izvršen.'
