          description: '`busy` (die Datenbank blieb gesperrt; `retryAfter: 1` im Body, kein `Retry-After`-Header), `server_busy` (die Sitzungsabfrage fand die Datenbank gesperrt vor), `timeout`.'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: Beste Spieler einer Kategorie abrufen
      description: |-
        Die 100 besten Wertungseinträge einer offiziellen Kategorie mit mindestens `minGames` (`PROVISIONAL_GAMES`) gezählten Partien, ohne gelöschte Konten und nachgewiesene Betrüger. Der Server berechnet jede Rangliste höchstens alle 10 Sekunden neu; `updatedAt` gibt an, wann.

        **Limits:** nur die Adressebene.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: Eine offizielle Kategorie-ID (`3+2` oder `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: Wie viele Spieler, 1 bis 100. Eine größere Zahl mit bis zu 3 Stellen gilt als 100; ein leerer Wert gilt als nicht angegeben.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
