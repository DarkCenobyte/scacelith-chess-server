              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Das Passwort ist geändert, und alle Geräte sind abgemeldet.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Erneut das Formular mit dem Fehler (die Passwörter stimmen nicht überein, ein zu schwaches Passwort), der Link ist ungültig, oder das Formular ist ungültig (eine HTML-Seite).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Das Limit `auth` oder `auth_reset` (eine HTML-Seite), erneut das Formular mit `Retry-After`, wenn dieser Client zu viele wartende Passwort-Hashes hat (der Link bleibt gültig), oder die Adressebene (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: Erneut das Formular mit `Retry-After`, wenn der Server ausgelastet ist (die Passwort-Hash-Warteschlange, oder die Datenbank blieb gesperrt); der Link bleibt gültig. Ebenso bei einer Zeitüberschreitung des Handlers.
