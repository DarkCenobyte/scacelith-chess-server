  - url: https://caissa.scacelith.com/api/v1
    description: Der offizielle Server.
  - url: https://{host}:{port}/api/v1
    description: Ein beliebiger Scacelith-Server, etwa ein Community-Server.
    variables:
      host:
        default: caissa.scacelith.com
        description: Der öffentliche Hostname des Servers (`SERVER_PUBLIC_HOST`).
