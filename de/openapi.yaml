            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: ein anderer Body als `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: das Limit `sessions` oder das Kontobudget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (die Datenbank blieb gesperrt), `timeout`.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Bestätigungslink erneut senden
      description: |-
        Sendet den Link zur Bestätigung der E-Mail-Adresse erneut. Die Antwort ist unabhängig von der Adresse 202 `accepted`, sodass sie nie verrät, ob ein Konto oder eine Registrierung die Adresse verwendet.

        Eine Anfrage wirkt höchstens einmal alle 5 Minuten pro Adresse. Eine mit dieser Adresse wartende Registrierung erhält wieder volle 24 Stunden, unabhängig davon, ob ein anderes Konto die Adresse verwendet, sodass ihr Benutzername in beiden Fällen gleich lange reserviert bleibt. Ein Link wird nur für diese Registrierung gesendet, wenn zu der Adresse kein Konto existiert (ein neuer, 24 Stunden gültiger Link ersetzt den vorherigen), oder für ein aktives, unbestätigtes Konto mit dieser Adresse.

        **Limits:** `auth`, dann `auth_mail` (10 pro Stunde und Client).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Angenommen (unabhängig von der Adresse).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: das Limit `auth` oder `auth_mail` (unabhängig von der Adresse).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` mit `retryAfter: 1`: Die Datenbank blieb beim Nachschlagen des Kontos gesperrt (die Verlängerung einer wartenden Registrierung erfolgt nach bestem Bemühen und lässt die Anfrage nie scheitern). `timeout`.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Link zum Zurücksetzen des Passworts senden
      description: |-
        Sendet einen eine Stunde lang gültigen Link zum Zurücksetzen des Passworts, der die Seite `/reset-password` öffnet. Die Antwort ist unabhängig von der Adresse 202 `accepted`. Ein Link geht nur an ein aktives Konto, höchstens einmal alle 5 Minuten pro Adresse. Ein Konto, das sich nur mit Google anmeldet, legt auf diesem Weg sein erstes Passwort fest.

        Die Passwortwiederherstellung hat die strengsten Limits der API, alle für den gesamten Server gezählt: 3 Anfragen pro Stunde (`AUTH_FORGOT_PER_HOUR`) und 10 pro 24 Stunden (`AUTH_FORGOT_PER_DAY`) pro Client (eine IPv4-Adresse oder ein IPv6-/64-Netz), das Dreifache pro IPv6-/48-Netz, zusätzlich zum Limit `auth` (20 pro 10 Minuten) und zu der einen E-Mail pro Adresse alle 5 Minuten. Weder das 202 noch das 429 verrät, ob ein Konto die Adresse verwendet. Das Festlegen des neuen Passworts hat ein eigenes Limit (`auth_reset`).

        **Limits:** `auth`, `auth_forgot`, dann `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Angenommen (unabhängig von der Adresse).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: das Limit `auth`, `auth_forgot` oder `auth_forgot_day` (unabhängig von der Adresse).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` mit `retryAfter: 1`: Die Datenbank blieb gesperrt. `timeout`.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Neues Passwort mit dem Token eines Links zum Zurücksetzen festlegen
      description: |-
        Legt mit dem Token eines Links zum Zurücksetzen ein neues Passwort fest (die Seite `/reset-password` tut dasselbe). Für das neue Passwort gelten die Regeln der Registrierung.

        Das Zurücksetzen widerruft alle Sitzungen und bricht eine ausstehende Änderung der E-Mail-Adresse ab; die anderen Links zum Zurücksetzen des Kontos werden ungültig; die Adresse gilt als bestätigt (der Link hat sie nachgewiesen); der Inhaber erhält eine E-Mail. Die Zwei-Faktor-Authentifizierung bleibt unberührt. Nach einem Fehler der Passwort-Hash-Warteschlange oder einem 503 bleibt der Link gültig.

        **Limits:** `auth`, dann `auth_reset` (10 pro Stunde und Client, 30 pro IPv6-/48-Netz, gemeinsam mit der Seite: Jeder Versuch hasht ein Passwort).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Das Passwort ist geändert, und alle Sitzungen sind abgemeldet.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: Der Link ist ungültig, verwendet oder abgelaufen, oder er wurde an eine Adresse gesendet, die das Konto nicht mehr hat. `weak_password` (mit `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: das Limit `auth` oder `auth_reset` oder die Passwort-Hash-Warteschlange.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: die Passwort-Hash-Warteschlange, oder die Datenbank blieb gesperrt (`retryAfter: 1`, nichts geändert). `timeout`.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Anmeldung mit Google starten
      description: |-
        Startet einen Versuch der Anmeldung mit Google für die PKCE-Challenge und den Port des Listeners des Spiels auf `127.0.0.1`. Die Antwort liefert die im Systembrowser zu öffnende Google-URL und den `state` des Versuchs; der Versuch ist 10 Minuten gültig.

        `authUrl` enthält `client_id`, `redirect_uri` (gebildet aus `redirectPort` und dem Herkunfts-Tag des Servers), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 des eigenen Verifiers des Servers gegenüber Google) mit `code_challenge_method=S256` sowie `prompt=select_account`. Das Spiel prüft sie, bevor es sie öffnet (siehe die Einleitung dieses Abschnitts).

        **Limit:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Der Versuch.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: Die Anmeldung mit Google wird auf diesem Server nicht angeboten.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: das Limit `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (die Datenbank blieb gesperrt), `timeout`.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Die Antwort von Google an den Server übergeben
      description: |-
        Übergibt dem Server den `code` und den `state`, die Google an den Listener des Spiels gesendet hat, zusammen mit der ID des Versuchs und dem PKCE-Verifier. Eine Versuchs-ID ist ohne den Verifier nutzlos, und der Code ist ohne den eigenen PKCE-Verifier und den Clientschlüssel des Servers nutzlos.

        Der Server prüft den Versuch (unbekannt, verwendet oder abgelaufen: 410), dann den Verifier (ein falscher lässt den Versuch verwendbar), verbraucht dann den Versuch, prüft `state` und `iss`, tauscht den Code bei Google ein und verifiziert das ID-Token. Die Antwort (200) ist eine der folgenden:

        - `{ token, expiresAt, user }`: beim verknüpften Konto angemeldet;
        - `{ mfaRequired, mfaToken, expiresIn }`: weiter mit `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: ein neues Konto; weiter mit `POST /auth/sso/complete` innerhalb von 10 Minuten. `suggestedUsername` stammt aus dem Google-Namen oder der Adresse und ist `""`, wenn nichts passt;
        - `{ needsPassword, linkTicket, username, expiresIn }`: Das Konto mit dieser Adresse hat ein Passwort; weiter mit `POST /auth/sso/google/link`. Noch ist nichts verknüpft.

        **Limit:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Eine Sitzung, ein zweiter Schritt oder der nächste Schritt einer ersten Anmeldung mit Google.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Beim verknüpften Konto angemeldet
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Zwei-Faktor-Authentifizierung ist eingeschaltet
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Ein neuer Spieler
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Ein Konto mit Passwort verwendet die Adresse
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: Der Verifier passt nicht zur Challenge des Versuchs (der Versuch bleibt verwendbar). `sso_email_unverified`: Google hat die Adresse nicht bestätigt. `registration_closed`. `account_disabled`. Nur bei einem verknüpften Konto: `banned` (mit `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: Die Anmeldung mit Google wird auf diesem Server nicht angeboten.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: Ein aktives Konto ohne Passwort verwendet die Adresse (es wird nicht genannt).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: ein unbekannter, bereits verwendeter oder abgelaufener Versuch.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: das Limit `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (die Datenbank blieb gesperrt), `timeout`.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Google mit dem Passwort eines bestehenden Kontos verknüpfen
      description: |-
        Nachdem `finish` mit `needsPassword` geantwortet hat: verknüpft Google mit dem bestehenden Konto, mithilfe des im Spiel eingegebenen Passworts dieses Kontos. Die Antwort (200) ist eine Sitzung (die Verknüpfung ist gespeichert und der Spieler angemeldet) oder, wenn die Zwei-Faktor-Authentifizierung eingeschaltet ist, `{ mfaRequired, mfaToken, expiresIn }`: weiter mit `POST /auth/login/mfa`; die Verknüpfung wird erst gespeichert, wenn dort ein Code bestanden ist.

        Ein falsches Passwort lässt das Ticket verwendbar, für insgesamt 5 Versuche. Ein Versuch wird unmittelbar vor der Prüfung des Passworts verbraucht: Ein 429 `too_many_attempts` oder ein 428 `pow_required` verbraucht keinen, während eine Ablehnung durch die Passwort-Hash-Warteschlange (503 `server_busy`, 429 `rate_limited`) einen verbraucht hat und als Fehlversuch des Kontos zählt. Die Wartezeit nach Fehlversuchen verwendet denselben Zähler wie `POST /auth/login`.

        **Limit:** `auth` (mit seiner Zählung pro IPv6-/48-Netz). **Arbeitsnachweis:** wie bei `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Eine Sitzung oder der zweite Schritt der Anmeldung.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: ein falsches Passwort; das Ticket bleibt gültig, für insgesamt 5 Versuche.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (mit `until`), nur nach einem richtigen Passwort.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: Die Anmeldung mit Google wird auf diesem Server nicht angeboten.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: Das Google-Konto wurde inzwischen mit einem anderen Konto verknüpft.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: ein unbekanntes, bereits verwendetes oder abgelaufenes Ticket, das 5. falsche Passwort, ein Konto, dessen Status oder Adresse sich seit `finish` geändert hat, oder eines, dessen Status, Adresse, Passwort oder Zwei-Faktor-Authentifizierung sich geändert hat, während die Verknüpfung gespeichert wurde. Beginnen Sie im Spiel von vorn.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (die Wartezeit des Kontos nach Fehlversuchen) oder `rate_limited` (das Limit `auth`, die Passwort-Hash-Warteschlange).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: die Passwort-Hash-Warteschlange, oder die Datenbank blieb gesperrt (`retryAfter: 1`, nichts wurde verknüpft). `timeout`.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Konto bei der ersten Anmeldung mit Google erstellen
      description: |-
        Nachdem `finish` mit `needsUsername` geantwortet hat: erstellt das Konto mit dem gewählten Benutzernamen (es gelten die Regeln der Registrierung) und meldet es an. Das Konto hat kein Passwort: `hasPassword` ist `false`, und „Passwort vergessen?“ (`POST /auth/password/forgot`) gibt ihm eines.

        **Limit:** `auth` (mit seiner Zählung pro IPv6-/48-Netz).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Das Konto ist erstellt und angemeldet.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request` oder `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: Die Anmeldung mit Google wird auf diesem Server nicht angeboten.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (ein Konto hat diesen Benutzernamen, oder eine wartende Registrierung mit einer anderen Adresse reserviert ihn), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: ein unbekanntes, bereits verwendetes oder abgelaufenes Ticket.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: das Limit `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (die Datenbank blieb gesperrt), `timeout`.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Angemeldete Geräte auflisten
      description: |-
        Die aktiven Sitzungen des Kontos (angemeldete Geräte), die zuletzt verwendete zuerst. `current` kennzeichnet die Sitzung, die die Anfrage stellt. `lastSeenAt` wird höchstens alle 5 Minuten aktualisiert; `expiresAt` ist das absolute Ende, und die Inaktivitätsgrenze kann die Sitzung früher beenden.

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Die aktiven Sitzungen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: das Limit `sessions` oder das Kontobudget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (die Datenbank blieb gesperrt), `timeout`.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Ein Gerät abmelden
      description: |-
        Meldet eine Sitzung des Kontos ab; auch die aktuelle kann abgemeldet werden. Der damit geöffnete WebSocket wird geschlossen. Kein Body (oder `{}`).

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Die Sitzung ist abgemeldet.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: ein anderer Body als `{}` oder eine `id`, die keine gültige URL-Kodierung ist; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: keine aktive Sitzung mit dieser ID in diesem Konto.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: das Limit `sessions` oder das Kontobudget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (die Datenbank blieb gesperrt), `timeout`.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Konto, Wertungen und aktive Sanktionen abrufen
      description: |-
        Das Konto, wie sein Spieler es sieht: die Kontoansicht (auch der `user` jeder Anmeldeantwort), ein Wertungseintrag pro Kategorie, in der der Spieler gewertete Partien gespielt hat, die aktiven Sanktionen und die Sperre. Die Integritätsstufe der Betrugserkennung wird nie angezeigt.

        **Limit:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Das Konto.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized` oder `invalid_token` (auch wenn das Konto gelöscht wurde).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: das Limit `account` oder das Kontobudget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (die Datenbank blieb gesperrt), `timeout`.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Direkte Herausforderungen annehmen oder ablehnen
      description: |-
        Legt fest, ob andere Spieler diesen Spieler über seinen Namen herausfordern dürfen. Mit `none` werden direkte Herausforderungen abgelehnt: Dem Herausforderer wird mitgeteilt, dass der Spieler nicht verfügbar ist. Keine erneute Authentifizierung.

        **Limit:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: Die jetzt geltenden Einstellungen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: das Limit `account` oder das Kontobudget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (die Datenbank blieb gesperrt), `timeout`.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Passwort ändern
      description: |-
        Ändert das Passwort. Das aktuelle Passwort ist erforderlich, aber kein zweiter Faktor, auch nicht bei eingeschalteter Zwei-Faktor-Authentifizierung. Für das neue Passwort gelten die Regeln der Registrierung (geprüft nach dem aktuellen Passwort).

        Die Änderung widerruft alle anderen Sitzungen (diese bleibt angemeldet), bricht eine ausstehende Änderung der E-Mail-Adresse ab, macht die Links zum Zurücksetzen des Passworts des Kontos ungültig und sendet dem Inhaber eine E-Mail.

        **Erneute Authentifizierung:** nur das Passwort. **Limits:** `reauth`, dann `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Das Passwort ist geändert.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (Konto nur mit Google-Anmeldung), `weak_password` (mit `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: ein falsches aktuelles Passwort oder ein Zurücksetzen oder Ändern des Passworts, das während der Prüfung der Anfrage eingetroffen ist.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (fehlgeschlagene erneute Authentifizierungen des Kontos) oder `rate_limited` (das Limit `reauth` oder `reauth_user`, das Kontobudget, die Passwort-Hash-Warteschlange).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (die Passwort-Hash-Warteschlange, oder die Datenbank blieb gesperrt), `timeout`.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Einschalten der Zwei-Faktor-Authentifizierung beginnen
      description: |-
        Speichert ein neues ausstehendes Authenticator-Geheimnis, das jedes frühere ausstehende ersetzt, und gibt es für die Authenticator-App zurück (als Text und als `otpauth://`-URI zur Anzeige als QR-Code). Die Zwei-Faktor-Authentifizierung ist noch nicht eingeschaltet: `POST /account/mfa/totp/enable` schaltet sie mit einem Code dieses Geheimnisses ein.

        **Erneute Authentifizierung:** nur das Passwort. **Limits:** `reauth`, dann `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Das ausstehende Geheimnis.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (Konto nur mit Google-Anmeldung), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (vor dem Passwort geprüft).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (fehlgeschlagene erneute Authentifizierungen des Kontos) oder `rate_limited` (das Limit `reauth` oder `reauth_user`, das Kontobudget, die Passwort-Hash-Warteschlange).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (die Passwort-Hash-Warteschlange, oder die Datenbank blieb gesperrt), `timeout`.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Einschalten der Zwei-Faktor-Authentifizierung abschließen und Wiederherstellungscodes erhalten
      description: |-
        Schaltet die Zwei-Faktor-Authentifizierung mit einem Code des ausstehenden Geheimnisses ein (genau 6 Ziffern). Hier wird kein Passwort verlangt; es wurde beim Einrichten angegeben. Die Antwort enthält 10 Wiederherstellungscodes, die nur dieses eine Mal angezeigt werden.

        **Limits:** `reauth`, dann `reauth_user`; ein falscher Code zählt zu den fehlgeschlagenen erneuten Authentifizierungen des Kontos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Die Zwei-Faktor-Authentifizierung ist eingeschaltet.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` besteht nicht aus genau 6 Ziffern, oder der Body verletzt das Schema; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: ein falscher Code (prüfen Sie die Uhrzeit des Geräts).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: kein ausstehendes Geheimnis (rufen Sie zuerst `POST /account/mfa/totp/setup` auf).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (fehlgeschlagene erneute Authentifizierungen des Kontos) oder `rate_limited` (das Limit `reauth` oder `reauth_user`, das Kontobudget).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (die Datenbank blieb gesperrt), `timeout`.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: Zwei-Faktor-Authentifizierung ausschalten
      description: |-
        Schaltet die Zwei-Faktor-Authentifizierung aus. Das Geheimnis und die Wiederherstellungscodes werden gelöscht, und der Inhaber erhält eine E-Mail.

        **Erneute Authentifizierung:** das Passwort und ein Authenticator-Code oder ein Wiederherstellungscode (`code` oder `recoveryCode` ist erforderlich). **Limits:** `reauth`, dann `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
