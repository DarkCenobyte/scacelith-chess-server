                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Ein Sitzungstoken (`sct_` gefolgt von 43 base64url-Zeichen) aus einer Anmeldeantwort, im `Authorization`-Header: `Authorization: Bearer <token>`. Das Präfix ist genau `Bearer` (Groß- und Kleinschreibung wird unterschieden) mit einem Leerzeichen; ein Wert ohne dieses Präfix oder ein Token, das nicht aus 1 bis 512 druckbaren ASCII-Zeichen besteht, wird wie jedes andere ungültige Token mit 401 `invalid_token` beantwortet. Ein leerer Header gilt als fehlender Header.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: Die Partie-ID, eine positive dezimale Ganzzahl mit höchstens 16 Stellen ohne führende Nullen, unter 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: Die Sitzungs-ID, wie `GET /auth/sessions` sie liefert, ohne führende Nullen geschrieben (`03` ist nicht Sitzung 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Der Benutzername des Spielers, ohne Berücksichtigung der Groß- und Kleinschreibung. Der Server akzeptiert jeden Namen aus 2 bis 24 Zeichen aus `[A-Za-z0-9_.-]` (die weiteste Regel, die er je erlaubt hat).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Eine Partie-ID; nur ältere Partien werden aufgelistet. Übergeben Sie `next` der vorherigen Seite. Ein leerer Wert gilt als nicht angegeben.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Die Seitengröße, 1 bis 50. Eine größere Zahl mit bis zu 3 Stellen gilt als 50; ein leerer Wert gilt als nicht angegeben.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: Das Token des E-Mail-Links (43 base64url-Zeichen). Fehlt es oder ist es falsch, erscheint die Seite „link invalid or expired“ (Link ungültig oder abgelaufen).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Jede Antwort des Servers verbietet das Caching.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Sekunden bis zum nächsten Versuch; derselbe Wert wie `retryAfter` im Body.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Die Bearer-Challenge, mit `error="invalid_token"` bei einem ungültigen Token.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Der Server schließt die Verbindung nach dieser Antwort.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (mit `field`, wenn ein Feld des Bodys fehlerhaft ist) oder `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Ein Feld verletzt das Schema
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Der Body ist kein JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Ein zu schwaches Passwort
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: Eine unlesbare PGN
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (kein `Authorization`-Header) oder `invalid_token` (das Token ist fehlerhaft, abgelaufen, widerrufen oder gehört zu einem gelöschten Konto).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Keine Sitzung
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Ein ungültiges Token
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Die Anfrage wird abgelehnt.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Ein falsches Passwort bei der erneuten Authentifizierung
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Ein gesperrtes Konto
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found` oder eine Funktion, die dieser Server abgeschaltet hat.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: Der Body ist nicht innerhalb von 10 Sekunden eingetroffen. Der Server schließt die Verbindung.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Die Anfrage steht im Widerspruch zum Zustand des Servers.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: Der Versuch oder das Ticket der Anmeldung mit Google ist unbekannt, verwendet oder abgelaufen; beginnen Sie im Spiel von vorn.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: Der Body überschreitet `HTTP_BODY_LIMIT` (standardmäßig 16.384 Bytes). Der Server schließt die Verbindung.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: Das Anfrageziel überschreitet 4096 Zeichen.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: Der Body ist nicht `application/json`, oder sein Zeichensatz ist nicht UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: Die Partie hat mehr als `GIF_MAX_PLIES` (600) Halbzüge.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: Lösen Sie die `pow`-Challenge und senden Sie dieselbe Anfrage erneut mit `pow: { challenge, nonce }`. `reason` gibt den Grund an: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` oder `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (ein Ratenlimit, das Kontobudget oder die Passwort-Hash-Warteschlange) oder `too_many_attempts` (eine Drosselung des Kontos), mit `retryAfter` und einem `Retry-After`-Header.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Ein Ratenlimit
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Zu viele Fehlversuche bei diesem Konto
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: ein unerwarteter Fehler. Der Server protokolliert ihn.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: ein falscher `state` oder `iss`, oder Google hat den Code abgelehnt oder ein ID-Token gesendet, das sich nicht verifizieren lässt. Die Antwort enthält nie den Text von Google.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` oder `timeout`: Versuchen Sie es nach `retryAfter` erneut, sofern angegeben.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Der Server ist ausgelastet
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Die Datenbank blieb gesperrt (ein Lesezugriff)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Der Server hat zu lange gebraucht
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Das animierte GIF, als Anhang.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` für eine Partie dieses Servers, `attachment; filename="scacelith-game.gif"` für eine mit `POST /gif` gesendete PGN.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Die Größe der Datei in Bytes.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: Eine HTML-Seite.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: Eine HTML-Seite, die die Ablehnung erklärt.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Das Formular ist nicht innerhalb von 10 Sekunden eingetroffen (eine HTML-Seite). Der Server schließt die Verbindung.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: Eine HTML-Seite, die den Konflikt erklärt.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Das Formular überschreitet `HTTP_BODY_LIMIT` (eine HTML-Seite). Der Server schließt die Verbindung.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Der Body ist weder ein Formular (`application/x-www-form-urlencoded`) noch JSON, oder sein Zeichensatz ist nicht UTF-8 (eine HTML-Seite).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Ein Ratenlimit (eine HTML-Seite), mit `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Ein unerwarteter Fehler, als HTML-Seite mit dem Titel „Server error“ (Serverfehler). Der Server protokolliert ihn.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Der Server ist ausgelastet (die Datenbank blieb gesperrt, mit `Retry-After`) oder hat zu lange gebraucht, jeweils als HTML-Seite mit dem Titel „Server error“ (Serverfehler).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: Die einheitliche Form jeder Fehlerantwort der JSON-API.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Der Fehlercode in `snake_case`. Ein Client wählt anhand dessen, was er anzeigt.
          examples:
            - rate_limited
        message:
          type: string
          description: Ein englischer Satz, gedacht für Logs und als Rückfalltext.
        retryAfter:
          type: integer
          minimum: 1
          description: Sekunden bis zum nächsten Versuch, nur bei Ablehnungen vorhanden, die mit der Zeit enden. Die Antwort trägt dann auch einen `Retry-After`-Header mit demselben Wert, außer beim 503 `busy` der Lesezugriffe auf Partieverlauf, Partien, Spieler und Rangliste.
        field:
          type: string
          description: Das fehlerhafte Feld oder der fehlerhafte Abfrageparameter (`invalid_request`, `invalid_option` sowie `invalid_cursor`, `invalid_limit` und `invalid_filter` von `GET /account/games`). Ein verschachteltes Feld wird mit Punkten geschrieben (`pow.nonce`).
        reason:
          type: string
          description: 'Der Grund: die Regel, gegen die ein `weak_password` verstößt, oder warum ein Arbeitsnachweis verlangt oder abgelehnt wurde (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Nur bei `banned`: das Ende der Sperre (Epoch-Millisekunden), `null` bei einer dauerhaften Sperre.'
        line:
          type: integer
          minimum: 1
          description: 'Nur bei `invalid_pgn`: die Zeile des Fehlers, ab 1.'
        column:
          type: integer
          minimum: 1
          description: 'Nur bei `invalid_pgn`: die Spalte des Fehlers, ab 1, in Zeichen.'
    PowChallenge:
      type: object
      description: Eine Challenge für den Arbeitsnachweis (das `pow` eines 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Die signierte Challenge, unverändert zurückzusenden.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Die Anzahl führender Nullbits, die `SHA-256(challenge + ":" + nonce)` haben muss.
        expiresAt:
          type: integer
          format: int64
          description: Wann die Challenge abläuft (Epoch-Millisekunden), 2 Minuten nach ihrer Ausstellung.
    PowAnswer:
      type: object
      description: Die Antwort auf eine Challenge für den Arbeitsnachweis.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: Die `challenge` der 428-Antwort, so wie sie geliefert wurde.
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Eine Dezimalzeichenkette aus höchstens 20 Ziffern, sodass `SHA-256(challenge + ":" + nonce)` mit `bits` Nullbits beginnt.
    ServerInfo:
      type: object
      description: Was ein Client braucht, bevor er sich anmeldet oder verbindet.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Der Name des Servers (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: Eine UUID, die die Datenbank bei ihrem ersten Start erhält. Sie bleibt über Neustarts hinweg gleich. Sie ist `null`, wenn die Datenbank sie nicht liefern kann.
        motd:
          type: string
          description: Die Nachricht des Tages (`SERVER_MOTD`), möglicherweise leer.
        protocol:
          type: object
          description: Das WebSocket-Protokoll (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Die älteste Protokollversion, die der Server spricht.
            max:
              type: integer
              minimum: 1
              description: Die neueste Protokollversion, die der Server spricht.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: Der Fingerabdruck des Protokollschemas (die ersten 4 Bytes des SHA-256 seiner kanonischen Form, als vorzeichenlose Ganzzahl); nur zur Information.
            subprotocol:
              type: string
              description: Das Token des WebSocket-Subprotokolls (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: Der WebSocket-Port, den die Spieler verwenden (`PUBLIC_WS_PORT`, sonst `WS_PORT`, sonst `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: Der Pfad des WebSockets.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Ob neue Konten erstellt werden können.
        emailVerification:
          type: boolean
          description: Ob neue Konten ihre Adresse bestätigen müssen (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
          properties:
            google:
              type: boolean
              description: Ob die Anmeldung mit Google angeboten wird.
        mfa:
          type: boolean
          const: true
          description: Die Zwei-Faktor-Authentifizierung ist immer verfügbar.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Die Bits des Arbeitsnachweises, die die Registrierung verlangt (0 für keinen).
        categories:
          type: array
          description: Die offiziellen (gewerteten) Bedenkzeiten (`RATED_CATEGORIES`), in der Reihenfolge des Servers. Jede andere Bedenkzeit ist `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Die Regeln, die ein Client prüfen kann, bevor er ein Formular sendet.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: Die Mindestlänge eines Benutzernamens (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: Die Höchstlänge eines Benutzernamens (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Der reguläre Ausdruck, dem ein neuer Benutzername entsprechen muss.
            passwordMinLength:
              type: integer
              description: Die Mindestlänge eines Passworts, in Zeichen (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Die Höchstlänge eines Passworts, in Bytes UTF-8.
            customTimeControls:
              type: boolean
              description: Ob Herausforderungen und private Partien eigene Bedenkzeiten verwenden dürfen.
            reportsPerDay:
              type: integer
              description: Wie viele Meldungen ein Spieler pro 24 Stunden erstatten darf (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Die größte WebSocket-Nachricht, die ein Client senden darf, in Bytes.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 97842216
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Eine offizielle Bedenkzeit.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 'Die Kategorie-ID: Minuten und Inkrement in Sekunden (`3+2`).'
        baseSec:
          type: number
          minimum: 0
          description: Die Grundzeit, in Sekunden.
        incSec:
          type: number
          minimum: 0
          description: Das Inkrement pro Zug, in Sekunden.
    AccountView:
      type: object
      description: Das Konto, wie sein Spieler es sieht (`user` der Anmeldeantworten und von `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: Die Konto-ID.
        username:
          type: string
          description: Der Benutzername.
        email:
          type: string
          format: email
          description: Die E-Mail-Adresse.
        emailVerified:
          type: boolean
          description: Ob die Adresse bestätigt ist.
        mfaEnabled:
          type: boolean
          description: Ob die Zwei-Faktor-Authentifizierung eingeschaltet ist.
        googleLinked:
          type: boolean
          description: Ob ein Google-Konto verknüpft ist.
        hasPassword:
          type: boolean
          description: '`false` bei einem über Google erstellten Konto, das noch kein Passwort festgelegt hat.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Ob direkte Herausforderungen über den Namen angenommen werden (siehe `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Wann das Konto erstellt wurde (Epoch-Millisekunden).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Die letzte Anmeldung (Epoch-Millisekunden) oder `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Die neue Adresse einer Änderung der E-Mail-Adresse, die auf ihren Link wartet, oder `null`.
    SessionAnswer:
      type: object
      description: Eine neue Sitzung.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Das Sitzungstoken, für den `Authorization`-Header und den WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: Das absolute Ende der Sitzung (Epoch-Millisekunden); die Inaktivitätsgrenze kann sie früher beenden.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Der zweite Schritt einer Anmeldung mit Zwei-Faktor-Authentifizierung; weiter mit `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Das Token des Schritts, für `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Verbleibende Sekunden, um den Schritt abzuschließen.
    LoginAnswer:
      description: Eine Sitzung oder der zweite Schritt einer Anmeldung mit Zwei-Faktor-Authentifizierung.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Eine erste Anmeldung mit Google; weiter mit `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Das Ticket für `POST /auth/sso/complete`, 10 Minuten gültig.
        suggestedUsername:
          type: string
          description: Ein aus dem Google-Namen oder der Adresse gebildeter Benutzername oder `""`, wenn nichts passt.
    SsoNeedsPassword:
      type: object
      description: Ein Konto mit Passwort verwendet die Adresse; weiter mit `POST /auth/sso/google/link`. Noch ist nichts verknüpft.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Das Ticket für `POST /auth/sso/google/link`.
        username:
          type: string
          description: Der Benutzername dieses Kontos (nur wer die Adresse gegenüber Google nachgewiesen hat, sieht ihn).
        expiresIn:
          type: integer
          const: 600
          description: Sekunden, die das Ticket gültig bleibt.
    SsoFinishAnswer:
      description: Die Antwort von `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Ein Versuch der Anmeldung mit Google.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Der Versuch, für `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: Die Google-URL, die nach ihrer Prüfung im Systembrowser zu öffnen ist.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Der `state`, den Google zurücksenden muss.
        expiresIn:
          type: integer
          const: 600
          description: Sekunden, die der Versuch gültig bleibt.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Der Benutzername; es gelten die Regeln des Servers (siehe die Beschreibung).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Die E-Mail-Adresse. Ohne umgebende Leerzeichen und in Kleinbuchstaben gespeichert.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Das Passwort; es gelten die Passwortregeln.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Der Benutzername oder die E-Mail-Adresse (jeder Text mit `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Optional. Wird in der Liste der angemeldeten Geräte angezeigt (etwa `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: Das `mfaToken` der Anmeldeantwort (oder der Antwort einer Anmeldung mit Google).
        code:
          type: string
          maxLength: 32
          description: Optional. Ein 6-stelliger Authenticator-Code oder ein Wiederherstellungscode.
        recoveryCode:
          type: string
          maxLength: 32
          description: Optional. Ein Wiederherstellungscode. `code` oder `recoveryCode` ist erforderlich.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Die E-Mail-Adresse.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Der Parameter `token` des Links zum Zurücksetzen.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Das neue Passwort; es gelten die Passwortregeln der Registrierung.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Die S256-PKCE-Challenge des `codeVerifier` des Clients (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Der Port des Listeners des Clients auf `127.0.0.1`.
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: Die `attemptId` aus `POST /auth/sso/google/start`.
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: Der PKCE-Verifier; sein SHA-256 muss zu der an `start` übergebenen Challenge passen.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Der `state`, wie Google ihn zurückgesendet hat.
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: Der `code`, wie Google ihn zurückgesendet hat (druckbares ASCII ohne Leerzeichen).
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Optional. Der `iss`, wie Google ihn zurückgesendet hat, falls Google ihn gesendet hat.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: Das `linkTicket` aus `finish`, 10 Minuten gültig.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Das Passwort des Kontos.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: Das `ssoTicket` aus `finish`, 10 Minuten gültig.
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Der Benutzername; es gelten die Regeln der Registrierung.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Die aktiven Sitzungen, die zuletzt verwendete zuerst.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Eine aktive Sitzung (ein angemeldetes Gerät).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: Die Sitzungs-ID, für `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: Die Anmeldung (Epoch-Millisekunden).
        lastSeenAt:
          type: integer
          format: int64
          description: Die letzte Nutzung (Epoch-Millisekunden), höchstens alle 5 Minuten aktualisiert.
        expiresAt:
          type: integer
          format: int64
          description: Das absolute Ende (Epoch-Millisekunden); die Inaktivitätsgrenze kann die Sitzung früher beenden.
        clientLabel:
          type:
            - string
            - 'null'
          description: Das `clientLabel` der Anmeldung oder `null`, wenn keines gesendet wurde.
        current:
          type: boolean
          description: Ob dies die Sitzung ist, die die Anfrage stellt.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Ein Eintrag pro Kategorie, in der der Spieler gewertete Partien gespielt hat.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Die aktiven Sanktionen.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }` während einer Sperre, sonst `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Der Wertungseintrag einer Kategorie.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: Die Kategorie-ID.
        rating:
          type: integer
          description: Die Wertung.
        games:
          type: integer
          minimum: 0
          description: Die in der Kategorie gespielten Partien (gezählt oder nicht).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Die höchste erreichte Wertung.
        provisional:
          type: boolean
          description: '`true`, solange sich die Wertung noch in der ungewerteten Anfangsphase befindet oder weniger als `PROVISIONAL_GAMES` gezählte Partien hat (das Spiel zeigt sie als `1510?` an).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Die Art der Sanktion.
        reason:
          type:
            - string
            - 'null'
          description: Der angegebene Grund, falls vorhanden.
        startsAt:
          type: integer
          format: int64
          description: Der Beginn (Epoch-Millisekunden).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Das Ende (Epoch-Millisekunden), `null`, wenn die Sanktion dauerhaft ist.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Das Ende der Sperre (Epoch-Millisekunden), `null`, wenn sie dauerhaft ist.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all`, um direkte Herausforderungen über den Namen anzunehmen, `none`, um sie abzulehnen.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Das aktuelle Passwort.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Das neue Passwort; es gelten die Passwortregeln der Registrierung.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Das Passwort des Kontos.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Ein Code des ausstehenden Geheimnisses, genau 6 Ziffern.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Das Passwort des Kontos.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Optional; bei Zwei-Faktor-Authentifizierung erforderlich (oder `recoveryCode`). Ein Authenticator-Code oder ein Wiederherstellungscode.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Optional. Ein Wiederherstellungscode (`xxxx-xxxx-xx`; Groß- und Kleinschreibung, Leerzeichen und Bindestriche spielen keine Rolle).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Das Passwort des Kontos.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Ein Authenticator-Code (ein Wiederherstellungscode wird abgelehnt).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Die neue Adresse; von umgebenden Leerzeichen befreit, in Kleinbuchstaben umgewandelt und dann wie eine Adresse bei der Registrierung geprüft.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Das Passwort des Kontos.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Optional; bei Zwei-Faktor-Authentifizierung erforderlich (oder `recoveryCode`). Ein Authenticator-Code oder ein Wiederherstellungscode.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Optional. Ein Wiederherstellungscode.
    TotpSetup:
      type: object
      description: Das ausstehende Geheimnis für die Authenticator-App.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Das Geheimnis in Base32, zum Eintippen in die App.
        uri:
          type: string
          format: uri
          description: Die URI `otpauth://totp/...`, zur Anzeige als QR-Code.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Sekunden pro Schritt.
    RecoveryCodeList:
      type: array
      description: Die 10 Wiederherstellungscodes, nur dieses eine Mal angezeigt. Jeder funktioniert genau einmal.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Eine Seite einer Partie.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Der Name in der Partieaufzeichnung (`deleted#<id>` bei einem gelöschten Konto).
        rating:
          type:
            - integer
            - 'null'
          description: Die Wertung zu Beginn, `null`, wenn unbekannt.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Die Wertung nach der Partie. Eine gewertete Partie hat sie immer; `null` nur bei einer Partie, die nicht für die Wertungen zählt (ungewertet, eigene Bedenkzeit, abgebrochen).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Die Änderung der Wertung, `0`, wenn die Wertungsregeln die Wertung unverändert lassen (die Null-Punkte-Regel der FIDE, ein Gegner ohne Wertung, die ersten Partien eines Spielers ohne Wertung); `null` wie bei `ratingAfter`.
    GameSummary:
      type: object
      description: Die Zusammenfassung einer gespeicherten Partie.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Die Partie-ID.
        category:
          type: string
          description: Die offizielle Kategorie-ID (`3+2`) oder `custom`.
        rated:
          type: boolean
          description: Ob die Partie für die Wertungen zählt.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Die Bedenkzeit in Sekunden (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (siehe die Partiecodes).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Der Code des Beendigungsgrunds (siehe die Partiecodes).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Das Ergebnis, `*` bei einer abgebrochenen Partie.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Die Anzahl der Halbzüge.
        startedAt:
          type: integer
          format: int64
          description: Der Beginn (Epoch-Millisekunden).
        endedAt:
          type: integer
          format: int64
          description: Das Ende (Epoch-Millisekunden).
    Termination:
      type: string
      description: Der Name des Beendigungsgrunds (siehe die Partiecodes); `Unknown` bei einem Code, den das Protokoll nicht kennt.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Eine Partiezusammenfassung aus Sicht eines Spielers.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Die Farbe des Spielers.
    HistoryGameSummary:
      description: Eine Partie aus dem Verlauf des angemeldeten Spielers.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Die Grundzeit in Millisekunden.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Das Inkrement in Millisekunden.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: Der Ausgang aus Sicht des Spielers.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Die Partien der Seite, neueste zuerst.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Die ID, die für die nächste Seite als `before` zu übergeben ist, oder `null` auf der letzten Seite.
        total:
          type: integer
          minimum: 0
          description: Die Anzahl der zum Filter passenden Partien über alle Seiten hinweg.
    MoveRecord:
      type: object
      description: Ein Halbzug einer Partie.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: Der Zug in UCI-Notation, bei einer Umwandlung ergänzt um `n`, `b`, `r` oder `q`.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Die für den Zug angerechnete Zeit (ms), `null`, wenn die Aufzeichnung sie nicht enthält.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Die Uhr des Ziehenden nach dem Zug (ms), `null`, wenn die Aufzeichnung sie nicht enthält.
    PgnTagsView:
      type: object
      description: Die wichtigsten PGN-Tags, zur Anzeige. `Termination` ist hier der Name des Beendigungsgrunds; die PGN-Datei verwendet die Standardwerte von PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` oder `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: Das Startdatum in UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Die Wertung zu Beginn oder `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Die Wertung zu Beginn oder `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Eine Partieaufzeichnung mit ihren Zügen und Uhrständen. Sie hat die Felder einer Partiezusammenfassung, ohne `color` und `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Die Grundzeit in Millisekunden.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Das Inkrement in Millisekunden.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: Der Name von `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: Die ID der Partie, deren Revanche diese ist, oder `null`.
            moves:
              type: array
              description: Ein Eintrag pro Halbzug.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: 'Nur wenn der Spieler des Tokens diese Partie gespielt hat: seine Farbe.'
            reportable:
              type: boolean
              description: 'Nur wenn der Spieler des Tokens diese Partie gespielt hat: `true`, wenn `POST /reports` jetzt eine Meldung des Gegners für diese Partie annehmen würde (die Partie endete innerhalb von 7 Tagen, das Tageskontingent ist nicht aufgebraucht, und der Gegner wurde für diese Partie noch nicht gemeldet).'
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Der Benutzername in der Schreibweise des Spielers.
        createdAt:
          type: integer
          format: int64
          description: Wann das Konto erstellt wurde (Epoch-Millisekunden).
        ratings:
          type: array
          description: Nur die offiziellen Kategorien, in der Reihenfolge des Servers.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Jede gespeicherte Partie, auch ungewertete und abgebrochene.
            rated:
              type: integer
              minimum: 0
              description: Gewertete Partien, über die Wertungseinträge summiert.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Der Benutzername in der Schreibweise des Spielers.
        games:
          type: array
          description: Die Partien der Seite, neueste zuerst.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Die ID der letzten Partie, sobald die Seite voll ist (die nächste Seite kann dann leer sein), sonst `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: Die Kategorie-ID.
        minGames:
          type: integer
          minimum: 0
          description: Die Zahl gezählter Partien, die ein Eintrag braucht, um in der Liste zu erscheinen (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Wann die Rangliste berechnet wurde (Epoch-Millisekunden).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: Der PGN-Text, höchstens 65.536 Bytes UTF-8. Nur die erste Partie wird verwendet.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Optional. Die Bildgröße.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Optional. Die Farbe, die unten auf dem Brett steht.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Optional. Millisekunden pro Zug, eine JSON-Zahl mit ganzzahligem Wert.
        coords:
          type: boolean
          default: true
          description: Optional. Ob die Linienbuchstaben und Reihenzahlen um das Brett gezeichnet werden.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Die Partie, als Ganzzahl oder als Zeichenkette aus 1 bis 16 Ziffern.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Der Benutzername des Gegners, wie in der Partieaufzeichnung oder wie er jetzt lautet, ohne Berücksichtigung der Groß- und Kleinschreibung. Er darf nicht leer sein.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Worum es in der Meldung geht.
        comment:
          type:
            - string
            - 'null'
          description: Optional. Höchstens 500 Zeichen, nachdem Steuerzeichen (außer Tabulator und Zeilenvorschub) entfernt und umgebende Leerzeichen abgeschnitten wurden.
    AccountExport:
      type: object
      description: Alles, was der Server über das Konto speichert (Zeitangaben in Epoch-Millisekunden).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Wann der Export erstellt wurde.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Was die Datei enthält und was sie auslässt, in einfachem Englisch für den Spieler.
          items:
            type: string
        account:
          description: Die Kontoansicht von `GET /account/me`, mit `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Die Adresse des verknüpften Google-Kontos oder `null`.
        ratings:
          type: array
          description: Die vollständigen Wertungseinträge.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Wertungspunkte, die zurückgegeben wurden, nachdem ein Gegner des Betrugs überführt wurde, summiert pro UTC-Tag und Kategorie, neueste zuerst. Weder die Partien noch die Betrüger werden genannt.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Jede gespeicherte Sitzung, neueste zuerst, ohne jegliches Token. Die Bereinigung nach Ablauf der Aufbewahrungsfrist löscht eine abgelaufene Sitzung, und eine abgemeldete einen Tag nach der Abmeldung.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Die Sicherheitsereignisse, neueste zuerst, aufbewahrt für `RETENTION_SECURITY_DAYS` Tage.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Jede Sanktion, auch aufgehobene. Der Name des Moderators ist nie enthalten.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Die Verhaltensereignisse, die für verlassene, abgebrochene und nicht angetretene Partien des Spielers erfasst wurden, 30 Tage lang aufbewahrt.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Die Meldungen, die der Spieler erstattet hat.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Die Anzahl der Partien.
            list:
              type: array
              description: Jede Partie, neueste zuerst, als Zusammenfassungen wie bei `GET /account/games`. Die Züge liefert `GET /games/{id}`, die PGN `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Ein vollständiger Wertungseintrag.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Ob der Spieler die ungewertete Anfangsphase verlassen hat.
            countedGames:
              type: integer
              minimum: 0
              description: Die Partien, die in die Wertung eingegangen sind.
            updatedAt:
              type: integer
              format: int64
              description: Wann sich der Eintrag zuletzt geändert hat.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: 00:00 UTC des Tages (Epoch-Millisekunden).
        category:
          type: string
        points:
          type: integer
          description: Die an diesem Tag in dieser Kategorie zurückgegebenen Punkte.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Wann die Sitzung abgemeldet wurde, oder `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Die Adresse der Anmeldung, gelöscht nach `RETENTION_IP_DAYS` Tagen.
    SecurityEvent:
      type: object
      description: |-
        Ein Sicherheitsereignis. `ip` wird nur für Handlungen angegeben, die im angemeldeten Zustand, mit dem Passwort des Kontos (und dem zweiten Faktor) oder mit einem an seine Adresse gesendeten Link vorgenommen wurden: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` und `account_exported`; jede andere Art hat `ip: null`, und `ip` wird nach `RETENTION_IP_DAYS` Tagen gelöscht.

        `detail` behält nur diese Felder: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` und `method` (`password` oder `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` und `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Ein Ereignis `moderator_action` behält nur `{ action }`, für die Aktionen `ban`, `unban`, `reset_mfa`, `verify_email` und `revoke_sessions` (die anderen Moderatorenaktionen werden ausgelassen). Jede andere Art hat `detail: null`. Die Ereignisse `rating_refund` werden ausgelassen: Ihre Punkte stehen in `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Die Art des Ereignisses (`login`, `password_changed`...).
        at:
          type: integer
          format: int64
          description: Wann es geschah.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: Der aktuelle öffentliche Name des gemeldeten Spielers.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Ob die Meldung noch offen ist (ob der gemeldete Spieler sanktioniert wurde, wird nicht mitgeteilt).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Das Token des E-Mail-Links (das versteckte Feld des Formulars der Seite).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Das Token des Links zum Zurücksetzen (das versteckte Feld des Formulars).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Das neue Passwort; es gelten die Passwortregeln der Registrierung.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Das neue Passwort noch einmal; es muss übereinstimmen.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: Eine HTML-Seite in UTF-8 (`text/html; charset=utf-8`), ohne JavaScript oder externe Ressourcen.
