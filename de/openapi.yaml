        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: Ein Token wurde gesendet und ist ungültig.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: Partie nicht vorhanden.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: das Limit `public_read` oder das Kontobudget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (die Datenbank blieb gesperrt; `retryAfter: 1` im Body, kein `Retry-After`-Header), `server_busy` (die Sitzungsabfrage fand die Datenbank gesperrt vor), `timeout`.'
  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Partie als PGN-Datei herunterladen
      description: |-
        Dieselbe Partie als PGN-Datei: eine Partie mit `\n`-Zeilenenden und Zugtext in Zeilen unter 80 Spalten. Die Antwort ist mit und ohne Token dieselbe.

        Tags, in dieser Reihenfolge: `Event` (`<SERVER_NAME> rated <category>` oder `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (das Startdatum in UTC), `Round`, `White`, `Black`, `Result` (`*` bei einer abgebrochenen Partie), `UTCDate` und `UTCTime` (der Start), `WhiteElo` und `BlackElo` (die Wertungen zu Beginn oder `-`), `WhiteRatingDiff` und `BlackRatingDiff` (die Änderungen, etwa `+10` und `-10`, in jeder gewerteten Partie, `+0`, wenn die Wertungsregeln die Wertung unverändert lassen; eine ungewertete, eine abgebrochene oder eine Partie mit eigener Bedenkzeit hat keines von beiden), `TimeControl` (in Sekunden), `Termination` (ein Standardwert von PGN: `normal`; `time forfeit`, eine Zeitüberschreitung, auch wenn sie mit Remis endet; `abandoned`; `rules infraction`, ein zweiter regelwidriger Zug oder ein kampfloser Verlust wegen eines Fairplay-Verstoßes; `unterminated`, eine abgebrochene Partie), `PlyCount`, `ScacelithGameId` (die dezimale ID).

        Jeder Zug trägt `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: die Uhr des Ziehenden nach dem Zug und die dafür angerechnete Zeit, in Zehntelsekunden (abgeschnitten). Ein Wert fehlt, wenn die Aufzeichnung ihn nicht enthält. Nach dem letzten Zug folgt der Grund für das Ende in Worten (auf Englisch), dann das Ergebnis.

        **Limit:** `public_read` (pro Spieler mit Token, pro Client ohne).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Die PGN-Datei.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: 'Wert: `attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'Der PGN-Text in UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: keine positive Ganzzahl mit höchstens 16 Stellen (unter 2^53); `invalid_request`: keine gültige URL-Kodierung.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: Ein Token wurde gesendet und ist ungültig.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: Partie nicht vorhanden.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: das Limit `public_read` oder das Kontobudget.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: unter anderem, wenn sich die gespeicherten Züge nicht bis zum gespeicherten Ende nachspielen lassen (der Server protokolliert es).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (die Datenbank blieb gesperrt; `retryAfter: 1` im Body, kein `Retry-After`-Header), `server_busy` (die Sitzungsabfrage fand die Datenbank gesperrt vor), `timeout`.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Partie dieses Servers als animiertes GIF herunterladen
      description: |-
        Die Partie als animiertes GIF. Namen und Wertungen stammen aus der Partieaufzeichnung (die Wertungen zu Beginn, ein gelöschtes Konto als `deleted#<id>`), ebenso das Ergebnis und das Ende (`Resignation`, `Loss on time`...).

        Die Prüfungen erfolgen in dieser Reihenfolge: `gif_disabled`, die Bildoptionen (`size`, `orientation`, `delay`, `coords`), die Partie-ID, die Partie, ihre Länge.

        **Sitzung erforderlich:** Die Kontingente zählen pro Konto. **Limits:** `gif` bei jeder Anfrage; `gif_user_min`, `gif_user_hour`, `gif_ip_min` und `gif_ip_hour` nur, wenn das GIF erstellt werden muss (siehe die Einleitung dieses Abschnitts). **Zeitlimit:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 Sekunden (standardmäßig 45 Sekunden).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 'Die Bildgröße: `small` (Felder von 32 px), `medium` (48 px) oder `large` (72 px).'
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Die Farbe, die unten auf dem Brett steht.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Millisekunden pro Zug (1 bis 6 Dezimalziffern).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Ob die Linienbuchstaben und Reihenzahlen um das Brett gezeichnet werden (`1`) oder nicht (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` mit `field` (`size`, `orientation`, `delay` oder `coords`): ein Wert außerhalb der erlaubten. `invalid_game_id`. `invalid_request`: keine gültige URL-Kodierung.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: Partie nicht vorhanden. `gif_disabled`: Der Server hat GIFs abgeschaltet (`GIF_ENABLED=false`; das Token von `gif` wird zurückgegeben).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: das Limit `gif`, ein Render-Limit oder das Kontobudget.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: Das GIF konnte nicht erstellt werden (der Server protokolliert den Grund). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` mit `retryAfter` (3 bis 10 Sekunden) und `Retry-After`: Die Render-Warteschlange ist voll, oder das GIF hat `GIF_QUEUE_TIMEOUT_MS` (10 Sekunden) auf einen freien Thread gewartet; jedes Limit-Token, das die Anfrage verbraucht hat, wird zurückgegeben. `busy`: Die Datenbank blieb gesperrt (`retryAfter: 1` nur im Body). `timeout`.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Animiertes GIF einer beliebigen, als PGN gesendeten Partie erstellen
      description: |-
        Dasselbe Bild wie `GET /games/{id}/gif` für eine beliebige, als PGN-Text gesendete Partie: eine vom Spiel gespeicherte Partie, ein Export einer anderen Website, eine von Hand eingegebene Partie. Nur die erste Partie des Textes wird verwendet.

        - Der PGN-Leser akzeptiert, was auch der eigene Leser des Spiels akzeptiert: jede PGN, die dieser Server schreibt, und die üblichen Exporte anderer Websites (Kommentare, Varianten, NAGs und Uhr-Annotationen werden übersprungen; Zugnummern und SAN werden tolerant gelesen; ein `FEN`-Tag gibt die Anfangsstellung vor, sofern `SetUp` nicht `"0"` ist).
        - Namen und Wertungen stammen aus den Tags `White`, `Black`, `WhiteElo` und `BlackElo`. Buchstaben mit diakritischen Zeichen verlieren diese, andere Zeichen außerhalb des druckbaren ASCII werden zu `?`, und lange Namen werden gekürzt (48 Zeichen). Das Ergebnis stammt aus dem Tag `Result`, sonst vom Ende des Zugtexts. Das Tag `Termination` wird angezeigt, sofern es nicht `normal` ist: Dann spricht die Schlussstellung für sich (Matt, Patt).
        - Dieser Endpunkt prüft seinen Body selbst: Ein unbekanntes Feld oder ein fehlendes oder nicht als Zeichenkette angegebenes `pgn` wird mit 400 `invalid_request` und `field` beantwortet; eine falsche Option mit 400 `invalid_option` (`delayMs` muss eine JSON-Zahl sein, `coords` ein Boolean; `null` wird abgelehnt).

        **Sitzung erforderlich:** Die Kontingente zählen pro Konto. **Limits:** wie bei `GET /games/{id}/gif`. **Body-Limit:** 135.168 Bytes, unabhängig von `HTTP_BODY_LIMIT` (die PGN als JSON-Zeichenkette, einschließlich ihrer Escape-Sequenzen). **Zeitlimit:** standardmäßig 45 Sekunden.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Eine kurze, von Hand eingegebene Partie, ohne Koordinaten
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: Eine PGN-Datei mit allen Optionen
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` mit `field` (ein unbekanntes Feld, oder `pgn` fehlt oder ist keine Zeichenkette; ohne `field`, wenn der Body kein Objekt ist); `invalid_json`; `invalid_option` mit `field` (`size`, `orientation`, `delayMs` oder `coords`); `invalid_pgn` mit `line` und `column` (ab 1, Spalten in Zeichen) und der `message` des Lesers: ein regelwidriger oder mehrdeutiger Zug, ein fehlerhaftes Tag, eine unbekannte Schachvariante, mehr als 65.536 Bytes.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: Der Server hat GIFs abgeschaltet (`GIF_ENABLED=false`; das Token von `gif` wird zurückgegeben).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: ein Body über 135.168 Bytes.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: das Limit `gif`, ein Render-Limit oder das Kontobudget.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: Das GIF konnte nicht erstellt werden (der Server protokolliert den Grund). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` mit `retryAfter` (3 bis 10 Sekunden) und `Retry-After`: Die Render-Warteschlange ist voll, oder das GIF hat zu lange auf einen freien Thread gewartet; jedes Limit-Token, das die Anfrage verbraucht hat, wird zurückgegeben. `timeout`.'
  /players/{username}:
