  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: Konto löschen
      description: |-
        Löscht das Konto; dies kann nicht rückgängig gemacht werden.

        - Alle Sitzungen werden sofort widerrufen: Das Token erhält von da an 401 `invalid_token`.
        - Der Benutzername wird zu `deleted#<id>`, im Konto und in jeder Partieaufzeichnung.
        - Gelöscht werden: die E-Mail-Adresse, der Passwort-Hash, das Geheimnis der Zwei-Faktor-Authentifizierung und die Wiederherstellungscodes, die Sitzungen und Link-Tokens, die Google-Verknüpfung, der Integritätseintrag der Betrugserkennung und die mit Sicherheitsereignissen gespeicherten IP-Adressen.
        - Wertungen und Partien bleiben erhalten. Partien bleiben unter dem anonymen Namen lesbar, und `GET /players/{username}` antwortet für den früheren Namen mit 404.

        **Erneute Authentifizierung:** das Passwort und, bei Zwei-Faktor-Authentifizierung, ein Authenticator-Code oder ein Wiederherstellungscode. **Limits:** `reauth`, dann `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Das Konto ist gelöscht.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (Konto nur mit Google-Anmeldung), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required` oder `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (fehlgeschlagene erneute Authentifizierungen oder zu viele ausprobierte Codes bei diesem Konto) oder `rate_limited` (das Limit `reauth` oder `reauth_user`, das Kontobudget, die Passwort-Hash-Warteschlange).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
