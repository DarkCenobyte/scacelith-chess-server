paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Name, Versionen, Ports und Registrierungsregeln des Servers abrufen
      description: |-
        Was ein Client braucht, bevor er sich anmeldet oder verbindet: Name und ID des Servers, die Versionen des WebSocket-Protokolls und wo der WebSocket liegt, die Registrierungsregeln, die offiziellen Bedenkzeiten und die Grenzwerte, die ein Client prüfen kann, bevor er ein Formular sendet.

        **Limits:** nur die Adressebene.
      security: []
      responses:
        '200':
          description: Die Beschreibung des Servers.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: die Adressebene.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Konto erstellen
      description: |-
        Erstellt ein Konto: sobald seine E-Mail-Adresse mit dem an sie gesendeten Link bestätigt ist, oder sofort, wenn keine E-Mail-Bestätigung verlangt wird.

        **Mit E-Mail-Bestätigung** (`REQUIRE_EMAIL_VERIFICATION`, der Standard): 202 `verification_sent`. Noch existiert kein Konto: Die Registrierung wartet 24 Stunden und reserviert so lange ihren Benutzernamen. Ein für diese 24 Stunden gültiger Link geht an die Adresse, höchstens einer pro Adresse alle 5 Minuten (`POST /auth/verify-email/resend` sendet einen neuen); das Konto wird mit bestätigter Adresse erstellt, wenn der Link verwendet wird (die Schaltfläche der Seite `/verify-email`), und der Spieler kann sich dann anmelden. Bis dahin wird eine Anmeldung mit diesem Benutzernamen wie bei einem unbekannten Konto mit `invalid_credentials` beantwortet, und das öffentliche Profil existiert nicht. Eine neue Registrierung mit derselben Adresse ersetzt die wartende. Die Antwort ist dieselbe, wenn bereits ein anderes Konto die Adresse verwendet: Dann wird kein Link gesendet, sondern dessen Inhaber erhält einen Hinweis (höchstens einen pro Stunde), und der Benutzername wird auf dieselbe Weise reserviert, sodass nichts verrät, ob zu der Adresse ein Konto existiert. Eine Registrierung, deren Link nicht verwendet wurde, wird nach 24 Stunden verworfen, und ihr Benutzername ist wieder frei.

        **Ohne E-Mail-Bestätigung** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, das Konto wird sofort erstellt und kann sich anmelden.

        **Regeln.** `username`: `USERNAME_MIN` bis `USERNAME_MAX` Zeichen (3 bis 20), Buchstaben, Ziffern, `_` und `-`, beginnend mit einem Buchstaben oder einer Ziffer (`GET /info` liefert die Werte als `limits`); reservierte Namen (`admin`, `moderator`, `deleted`...) und einige Präfixe werden abgelehnt; eindeutig ohne Berücksichtigung der Groß- und Kleinschreibung. `email`: ohne umgebende Leerzeichen und in Kleinbuchstaben gespeichert, reines ASCII mit einer Domain, die einen Punkt enthält. `password`: mindestens `PASSWORD_MIN_LENGTH` (10) Zeichen und höchstens 256 Bytes UTF-8; es darf weder den Benutzernamen noch den lokalen Teil der E-Mail-Adresse enthalten und darf kein gängiges Passwort sein.

        **Fehler**, in dieser Reihenfolge geprüft: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; die Fehler der Passwort-Hash-Warteschlange; 409 `email_taken` (nur ohne E-Mail-Bestätigung).

        **Limits:** `auth`, dann `auth_register` (10 Registrierungen pro Stunde und Client). **Arbeitsnachweis:** immer, wenn `POW_REGISTER_BITS` größer als 0 ist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Erster Versuch, ohne Arbeitsnachweis
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Erneut gesendet, mit dem Arbeitsnachweis
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Das Konto ist erstellt und kann sich anmelden (keine E-Mail-Bestätigung auf diesem Server).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Die Registrierung wartet auf ihren Bestätigungslink (oder zu der Adresse gibt es bereits ein Konto; die Antwort verrät es nicht).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (mit `field`), `invalid_json`, `invalid_username`, `invalid_email` oder `weak_password` mit `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` oder `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: Die Registrierung ist auf diesem Server geschlossen (`GET /info` meldet `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: Ein Konto hat diesen Benutzernamen, oder eine wartende Registrierung mit einer anderen Adresse reserviert ihn. `email_taken`: Ein anderes Konto verwendet die Adresse (nur ohne E-Mail-Bestätigung).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: das Limit `auth` oder `auth_register` oder die Passwort-Hash-Warteschlange.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (die Passwort-Hash-Warteschlange, oder die Datenbank blieb gesperrt), `timeout`.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Mit Passwort anmelden
      description: |-
        Meldet mit einem Benutzernamen oder einer E-Mail-Adresse und einem Passwort an. Es gibt zwei mögliche Antworten, beide mit Status 200: eine Sitzung oder, wenn die Zwei-Faktor-Authentifizierung eingeschaltet ist, einen zweiten Schritt, der innerhalb von 5 Minuten mit `POST /auth/login/mfa` abzuschließen ist.

        Unbekanntes Konto, falsches Passwort und Konto ohne Passwort erhalten dieselbe Antwort nach derselben Zeit: 401 `invalid_credentials`. Die Kontoprüfungen (`banned`, `email_unverified`) folgen erst nach einem richtigen Passwort. Ab `AUTH_FAILURES_PER_ACCOUNT` (5) Fehlversuchen mit einem Anmeldenamen muss jeder Versuch warten (429 `too_many_attempts`).

        **Limit:** `auth`. **Arbeitsnachweis:** nur während einer Welle fehlgeschlagener Anmeldungen (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Eine Sitzung oder der zweite Schritt einer Anmeldung mit Zwei-Faktor-Authentifizierung.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Angemeldet
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Zwei-Faktor-Authentifizierung ist eingeschaltet
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: unbekanntes Konto, falsches Passwort oder ein Konto ohne Passwort.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Nur nach einem richtigen Passwort: `banned` mit `until` (Epoch-Millisekunden, `null` bei einer dauerhaften Sperre) oder `email_unverified` (ein älteres Konto, dessen Adresse noch nicht bestätigt ist).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (die Wartezeit nach Fehlversuchen für diesen Anmeldenamen) oder `rate_limited` (das Limit `auth`, die Passwort-Hash-Warteschlange).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (die Passwort-Hash-Warteschlange, oder die Datenbank blieb gesperrt), `timeout`.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Anmeldung mit einem zweiten Faktor abschließen
      description: |-
        Der zweite Schritt einer Anmeldung mit Zwei-Faktor-Authentifizierung, nachdem `POST /auth/login` oder eine Anmeldung mit Google (`POST /auth/sso/google/finish` oder `POST /auth/sso/google/link`) mit `mfaRequired` geantwortet hat. Senden Sie `code` (einen 6-stelligen Authenticator-Code oder einen Wiederherstellungscode) oder `recoveryCode`. Ein hier verwendeter Wiederherstellungscode ist verbraucht.

        Ein Schritt akzeptiert höchstens 5 falsche Codes; der Schritt endet auch, wenn das Passwort zurückgesetzt oder geändert wird. Nach dem Passwortschritt einer Google-Verknüpfung wird die Verknüpfung erst gespeichert, wenn der Code hier bestanden ist.

        **Limits:** `auth` und höchstens `AUTH_MFA_PER_ACCOUNT` (10) Codes pro 15 Minuten für das Konto, von jeder Adresse; darüber hinaus wird der Code nicht geprüft, sodass kein Wiederherstellungscode verbraucht wird.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Ein Authenticator-Code
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Ein Wiederherstellungscode
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Angemeldet.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: Weder `code` noch `recoveryCode` wurde gesendet, oder der Body verletzt das Schema; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: Der Schritt ist abgelaufen, wurde bereits verwendet oder endete nach 5 falschen Codes, oder das Passwort wurde seit dem ersten Schritt zurückgesetzt oder geändert (erneut anmelden). `invalid_code`: ein falscher oder bereits verwendeter Code.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (mit `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: nur nach dem Passwortschritt einer Google-Verknüpfung; das Google-Konto wurde inzwischen mit einem anderen Konto verknüpft.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: nur nach dem Passwortschritt einer Google-Verknüpfung; das Konto hat sich inzwischen geändert. Beginnen Sie im Spiel von vorn.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: die Wartezeit des Kontos nach Fehlversuchen, oder seine `AUTH_MFA_PER_ACCOUNT` Codes der letzten 15 Minuten sind aufgebraucht. `rate_limited`: das Limit `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` mit `retryAfter: 1`: Die Datenbank blieb gesperrt (nach einem Schritt einer Google-Verknüpfung wurde nichts verknüpft: Beginnen Sie im Spiel von vorn). `timeout`.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Diese Sitzung abmelden
      description: |-
        Widerruft die Sitzung des verwendeten Tokens. Der damit geöffnete WebSocket wird geschlossen. Kein Body (oder `{}`).

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Abgemeldet.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: ein anderer Body als `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: das Limit `sessions` oder das Kontobudget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (die Datenbank blieb gesperrt), `timeout`.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
        - sessions
      summary: Alle Sitzungen abmelden
      description: |-
        Widerruft alle Sitzungen des Kontos, auch diese. Die damit geöffneten WebSockets werden geschlossen. Kein Body (oder `{}`).

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Alle Sitzungen sind abgemeldet.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
