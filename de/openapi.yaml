          $ref: '#/components/responses/HtmlServiceUnavailable'
    post:
      operationId: submitResetPasswordPage
      tags:
        - pages
      summary: Neues Passwort über das Formular zum Zurücksetzen festlegen
      description: |-
        Das Formular der Seite zum Zurücksetzen; es tut dasselbe wie `POST /auth/password/reset`: Alle Geräte werden abgemeldet, eine ausstehende Änderung der E-Mail-Adresse wird abgebrochen, die anderen Links zum Zurücksetzen werden ungültig, die Adresse gilt als bestätigt, und der Inhaber erhält eine E-Mail.

        Zuerst wird der Link geprüft, dann, ob beide Passwörter übereinstimmen, dann die Passwortregeln. Ist der Server ausgelastet, kommt das Formular mit `Retry-After` zurück, und der Link bleibt gültig.

        **Limits:** `auth`, dann `auth_reset` (gemeinsam mit `POST /auth/password/reset`).
      security: []
      requestBody:
        required: true
        content:
