  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Partien des Spielers auflisten, gefiltert und seitenweise
      description: |-
        Die Partien des angemeldeten Spielers, neueste zuerst, gefiltert und seitenweise, mit der Anzahl der zum Filter passenden Partien. Jeder Abfrageparameter ist optional, und ein leerer Wert gilt als nicht angegeben.

        Blättern: Übergeben Sie `next` der vorherigen Seite als `before`; auf der letzten Seite ist `next` gleich `null`. `total` zählt die zum Filter passenden Partien über alle Seiten hinweg.

        **Limit:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: Eine offizielle Kategorie-ID (`3+2` oder `3%2B2`) oder `custom` für jede Partie mit einer anderen Bedenkzeit.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Nur gewertete (`true`) oder ungewertete (`false`) Partien.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Nur die gewonnenen, verlorenen oder remis gespielten Partien, aus Sicht des Spielers. Abgebrochene Partien erscheinen nur ohne diesen Filter.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Eine Seite des Verlaufs.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` ist keine Partie-ID), `invalid_limit` oder `invalid_filter` (`category`, `rated` oder `result`), jeweils mit `field`, das den Parameter nennt.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: das Limit `account_games` oder das Kontobudget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (die Datenbank blieb gesperrt; `retryAfter: 1` im Body, kein `Retry-After`-Header), `server_busy` (die Sitzungsabfrage fand die Datenbank gesperrt vor), `timeout`.'
  /games/{id}:
