        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (die Datenbank blieb gesperrt; `retryAfter: 1` im Body, kein `Retry-After`-Header), `timeout`.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Gegner einer kürzlich gespielten Partie melden
      description: |-
        Meldet den Gegner einer eigenen Partie des Spielers, die innerhalb der letzten 7 Tage endete. Eine Meldung ändert nie von sich aus eine Wertung, eine Sanktion oder eine Integritätsstufe. Sie erhöht die Prüfpriorität, die die Moderatoren sehen, und fordert, außer bei `abuse`, die Engine-Analyse der Partie an.

        Eine erneute Meldung desselben Gegners für dieselbe Partie erhält dieselbe Antwort und ändert nichts; die Antwort verrät nie etwas über das gemeldete Konto. `GET /games/{id}` teilt den Spielern der Partie vorab mit, ob eine Meldung angenommen würde (`reportable`).

        Dieser Endpunkt prüft seinen Body selbst, in der Reihenfolge `gameId`, `reported`, `category`, `comment`: Ein Fehler wird mit 400 `invalid_request` ohne `field` beantwortet. Felder, die er nicht kennt, werden ignoriert.

        **Limits:** `reports` (pro Spieler), dann `REPORTS_PER_DAY` (5) Meldungen pro Spieler in 24 Stunden (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Die Meldung ist eingegangen (oder wurde bereits erstattet).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (ohne `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: nicht der Gegner des Meldenden in einer Partie, die innerhalb der letzten 7 Tage endete.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, mit einem `Retry-After`-Header): `REPORTS_PER_DAY` Meldungen in den letzten 24 Stunden. `rate_limited`: das Limit `reports` oder das Kontobudget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (die Sitzungsabfrage fand die Datenbank gesperrt vor), `timeout`.'
  /verify-email:
    servers:
      - url: https://caissa.scacelith.com
