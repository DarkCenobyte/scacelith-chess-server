openapi: 3.1.1
info:
  title: HTTPS-API des Scacelith-Servers
  version: "0.9.0"
  summary: Die HTTPS-API jedes Scacelith-Servers, des offiziellen wie der Community-Server.
  description: |-
    Jeder Scacelith-Server, der offizielle `caissa.scacelith.com` ebenso wie jeder Community-Server, beantwortet diese HTTPS-API. Das Spiel nutzt sie für alles außerhalb der eigentlichen Partie: Registrierung und Anmeldung (einschließlich Zwei-Faktor-Authentifizierung und Google), die Kontoseite, den Partieverlauf, PGN-Downloads und animierte GIFs von Partien, die angemeldeten Geräte, das Herunterladen der eigenen Daten, die Löschung des Kontos und Meldungen.

    Das Live-Spiel (Gegnersuche, Herausforderungen, Züge, Uhren) läuft über den WebSocket desselben Servers (`wss://<host>/ws`), der mit einem Sitzungstoken dieser API geöffnet wird; es ist in `PROTOCOL.md` beschrieben, nicht hier.

    Die unten genannten Standardwerte sind die eines Servers mit unveränderter Konfiguration; ein Community-Server kann sie ändern (`CONFIG.md` nennt jede Einstellung).

    ## Basis-URL, Port und Transport

    - Offizieller Server: `https://caissa.scacelith.com/api/v1`, TCP-Port 443.
    - Ein Community-Server: `https://<SERVER_PUBLIC_HOST>[:<port>]/api/v1`. `API_PORT` ist standardmäßig 443; hinter einem NAT oder einem Proxy ist der Port, den die Spieler verwenden, `PUBLIC_API_PORT`.
    - Der WebSocket des Spiels liegt standardmäßig auf demselben Port (`WS_PORT` verlegt ihn; `GET /info` teilt dem Client mit, wo er liegt).
    - HTTP/1.1 über TLS. Mit `TLS_MODE=proxy` terminiert ein Reverse Proxy vor dem Server das TLS. `TLS_MODE=off` (reines HTTP) ist nur für die lokale Entwicklung gedacht.
    - Die HTML-Seiten, die über die Links in E-Mails geöffnet werden (`/verify-email`, `/reset-password`, `/confirm-email-change`), liegen im Wurzelpfad des Servers, außerhalb von `/api/v1`. Die Endpunkte zur Zustandsprüfung antworten sowohl im Wurzelpfad als auch unter `/api/v1`. Die Anmeldung mit Google hat keine Seite auf dem Server: Google schickt den Browser direkt zum Spiel zurück, auf `127.0.0.1`.
    - Ein abschließender Schrägstrich wird ignoriert (`/api/v1/info/` ist `/api/v1/info`), und Pfadparameter werden URL-dekodiert (ein Parameter, der keine gültige URL-Kodierung ist, wird mit 400 `invalid_request` beantwortet).

    ## Anfragen

    - **JSON-Bodys.** `POST`-, `PUT`- und `DELETE`-Anfragen enthalten ein JSON-Objekt mit `Content-Type: application/json`. Ein anderer `charset` als UTF-8 wird abgelehnt, ebenso jeder andere Inhaltstyp (415 `unsupported_media_type`). Ein leerer Body gilt als `{}`, und genau das erwarten die Endpunkte ohne Parameter (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`).
    - **Größe und Zeit.** Ein Body ist auf `HTTP_BODY_LIMIT` Bytes begrenzt (standardmäßig 16.384; `POST /gif` hat ein eigenes Limit von 135.168 Bytes): 413 `payload_too_large`. Er muss innerhalb von 10 Sekunden eintreffen: 408 `request_timeout`. Nach jedem dieser beiden Fehler schließt der Server die Verbindung.
    - **Strikte Schemas.** Ein Feld, das der Endpunkt nicht kennt, wird abgelehnt, ein nicht als optional gekennzeichnetes Feld ist Pflicht, und Typen und Längen werden geprüft. Jeder dieser Fehler wird mit 400 `invalid_request` beantwortet, wobei `field` das Feld nennt (bei einem verschachtelten Feld mit Punkten, etwa `pow.nonce`). Zeichenketten dürfen keine Steuerzeichen enthalten. Längen werden in UTF-16-Codeeinheiten gezählt, sodass ein Zeichen außerhalb der mehrsprachigen Basisebene (BMP), etwa ein Emoji, doppelt zählt. Ein Body, der kein JSON ist, wird mit 400 `invalid_json` beantwortet. `POST /gif` und `POST /reports` prüfen ihre Bodys selbst (siehe den jeweiligen Endpunkt).
    - **Abfrageparameter.** Es zählt das erste Vorkommen eines Parameters, unbekannte Parameter werden ignoriert, und ein `+` wird als Leerzeichen dekodiert: Die Endpunkte, die eine Bedenkzeitkategorie annehmen, akzeptieren sowohl `3%2B2` als auch `3+2`.
    - **Methoden.** `HEAD` ist `GET` ohne Body. `OPTIONS` auf einem existierenden Pfad antwortet mit 204 und einem `Allow`-Header. Jede andere Methode, die der Pfad nicht hat, wird mit 405 `method_not_allowed` und `Allow` beantwortet.
    - **Anfrageziel.** Es darf 4096 Zeichen nicht überschreiten (414 `uri_too_long`). Eine Anfrage, die sich überhaupt nicht parsen lässt oder deren Kopf zu groß ist oder zu langsam eintrifft, erhält eine leere Antwort 400, 431 oder 408, und die Verbindung wird geschlossen.
    - **Kein CORS.** Die API bedient das Spiel, keine Webseiten. Es wird nie ein `Access-Control-*`-Header gesendet, sodass eine Webseite keine Antwort lesen kann; da nur JSON-Bodys angenommen werden, bräuchte ein seitenübergreifender Schreibzugriff eine Preflight-Anfrage, und diese schlägt fehl.

    ## Antworten und Fehler

    - Antworten sind JSON in UTF-8, außer dem PGN-Download (`application/x-chess-pgn`), den animierten GIFs (`image/gif`) und den HTML-Seiten. Zeitangaben sind Millisekunden seit dem 1970-01-01 UTC. IDs sind Ganzzahlen. Partie-IDs haben bis zu 16 Stellen, bleiben aber unter 2^53, sodass eine JSON-Zahl (ein Double) sie exakt darstellt.
    - Jede Antwort der API trägt `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`, `X-Frame-Options: DENY`, `Cross-Origin-Resource-Policy: same-origin` und `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'` (die HTML-Seiten haben eine eigene Richtlinie). Mit `TLS_MODE=native` trägt sie außerdem `Strict-Transport-Security: max-age=31536000`.
    - Eine Antwort muss innerhalb von 60 Sekunden ab dem Moment gelesen werden, in dem der Server sie bereithält, was nur bei großen Antworten eine Rolle spielt (ein GIF, der Datenexport, eine lange PGN). Die Zeit, die der Server zum Erstellen einer Antwort braucht, zählt weder hierfür noch für die 30 Sekunden ohne ein- oder ausgehendes Byte, nach denen eine Verbindung geschlossen wird.

    Fehler haben eine einheitliche Form (das Schema `Error`):

    ```json
    { "error": "snake_case_code", "message": "An English sentence.", "retryAfter": 30 }
    ```

    `message` ist für Logs und als Rückfalltext gedacht; ein Client wählt anhand von `error`, was er anzeigt. `retryAfter` (Sekunden) ist nur bei Ablehnungen vorhanden, die mit der Zeit enden, und die Antwort trägt dann auch einen `Retry-After`-Header mit demselben Wert; die einzige Ausnahme ist das 503 `busy` der Lesezugriffe auf Partieverlauf, Partien, Spieler und Rangliste, das nur das Feld enthält. Manche Fehler fügen Felder hinzu: `field` (ungültige Eingabe), `reason` (`weak_password`, `pow_required`), `pow` (`pow_required`), `until` (`banned`), `line` und `column` (`invalid_pgn`).

    Fehler, die jeder Endpunkt liefern kann:

    | Status | `error` | Wann |
    |---|---|---|
    | 400 | `invalid_request` | Der Body verletzt das Schema des Endpunkts (`field` sagt, wo), das Anfrageziel oder `Content-Length` ist fehlerhaft, ein Pfadparameter ist keine gültige URL-Kodierung, oder der Body wurde abgeschnitten. |
    | 400 | `invalid_json` | Der Body ist kein JSON. |
    | 401 | `unauthorized` | Kein `Authorization`-Header bei einem Endpunkt, der eine Sitzung benötigt. |
    | 401 | `invalid_token` | Das Token ist fehlerhaft, abgelaufen, widerrufen oder gehört zu einem gelöschten Konto; auch bei Endpunkten, an denen die Sitzung optional ist. |
    | 404 | `not_found` | Endpunkt nicht vorhanden. Manche Endpunkte verwenden ihn auch: Partie, Spieler oder Sitzung nicht vorhanden. |
    | 405 | `method_not_allowed` | Der Pfad existiert für andere Methoden (siehe `Allow`). |
    | 408 | `request_timeout` | Der Body ist nicht innerhalb von 10 Sekunden eingetroffen. |
    | 413 | `payload_too_large` | Der Body überschreitet `HTTP_BODY_LIMIT` (135.168 Bytes bei `POST /gif`). |
    | 414 | `uri_too_long` | Das Anfrageziel überschreitet 4096 Zeichen. |
    | 415 | `unsupported_media_type` | Der Body ist nicht `application/json`, oder sein Zeichensatz ist nicht UTF-8. |
    | 429 | `rate_limited` | Ein Ratenlimit (siehe unten): `retryAfter` plus ein `Retry-After`-Header. |
    | 500 | `internal_error` | Ein unerwarteter Fehler. Der Server protokolliert ihn. |
    | 503 | `timeout` | Der Server hat nicht innerhalb von 30 Sekunden geantwortet (60 Sekunden beim Export, 45 Sekunden bei den GIFs mit den Standardeinstellungen). |
    | 503 | `server_busy` | Eine Sitzungsabfrage oder eine Kontoänderung fand die Datenbank gesperrt vor (`retryAfter` 1), oder die Passwort-Hash-Warteschlange ist voll (siehe unten). |

    Die Lese-Endpunkte (Partieverlauf, Partien, Spieler, Rangliste) und der Export antworten mit 503 `busy` und `retryAfter: 1`, wenn die Datenbank gesperrt blieb.

    Endpunkte, die ein Passwort prüfen oder hashen, können außerdem einen der folgenden Fehler liefern, beide mit einem zufälligen `retryAfter` von 5 bis 15 Sekunden:

    - 503 `server_busy`: Die Passwort-Hash-Warteschlange des Servers (`PASSWORD_HASH_QUEUE_MAX`) ist voll, oder die Wartezeit ist abgelaufen.
    - 429 `rate_limited`: Sobald die Warteschlange halb voll ist, hat dieser Client (eine IPv4-Adresse oder ein IPv6-/48-Netz) bereits `PASSWORD_HASH_WAITERS_PER_SOURCE` wartende Hashes. Dieses 429 gibt die Ratenlimit-Tokens zurück, die die Anfrage verbraucht hat.

    In beiden Fällen wurde nichts geändert und kein Fehlversuch gezählt (außer bei `POST /auth/sso/google/link`, dessen Ticketversuch und Kontofehlversuch schon vor dem Hashen gezählt wurden), und ein Link zum Zurücksetzen bleibt gültig.

    Die HTML-Seiten liefern ihre Fehler als HTML-Seiten mit denselben Statuscodes.

    ## Authentifizierung

    Die Endpunkte, die eine Sitzung benötigen, erwarten ein Bearer-Token im `Authorization`-Header (das Schema `bearerAuth`):

    ```
    Authorization: Bearer sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
    ```

    - **Ein Token erhalten.** Ein Token (`sct_` gefolgt von 43 base64url-Zeichen) stammt von `POST /auth/login`, danach von `POST /auth/login/mfa`, wenn die Zwei-Faktor-Authentifizierung eingeschaltet ist, von `POST /auth/sso/google/finish` und `POST /auth/sso/google/link` (Anmeldung mit Google) sowie von `POST /auth/sso/complete`. Jeder dieser Endpunkte antwortet mit `{ token, expiresAt, user }`. Der Server speichert nur einen SHA-256-Hash des Tokens.
    - **Erforderliche Sitzung.** Ein fehlender Header wird mit 401 `unauthorized` und `WWW-Authenticate: Bearer realm="scacelith"` beantwortet. Ein ungültiges Token wird mit 401 `invalid_token` und `WWW-Authenticate: Bearer realm="scacelith", error="invalid_token"` beantwortet. Ein Client sollte ein Token, das `invalid_token` erhält, verwerfen und sich erneut anmelden.
    - **Optionale Sitzung.** Bei `GET /games/{id}`, `GET /games/{id}/pgn`, `GET /players/{username}` und `GET /players/{username}/games` ist die Sitzung optional. Ohne den Header liefern sie die öffentliche Ansicht; wird ein Header gesendet, muss sein Token gültig sein.
    - **Lebensdauer.** Eine Sitzung endet beim früheren von zwei Zeitpunkten: `SESSION_MAX_DAYS` (90) Tage nach der Anmeldung (das ist `expiresAt`) oder nach `SESSION_IDLE_DAYS` (30) Tagen ohne Nutzung. Jede Nutzung schiebt die Inaktivitätsgrenze hinaus; der Server schreibt den neuen Wert höchstens alle 5 Minuten. Ein Konto behält höchstens `MAX_SESSIONS_PER_USER` (10) Sitzungen: Eine neue Anmeldung widerruft die ältesten über diese Anzahl hinaus.
    - **Widerruf.** Das Abmelden (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`) widerruft Sitzungen; ebenso eine Passwortänderung (die anderen Sitzungen), das Zurücksetzen des Passworts und die Löschung des Kontos (alle Sitzungen) sowie ein Administrator. Ein Widerruf über die API wirkt sofort, und der mit einer widerrufenen Sitzung geöffnete WebSocket wird geschlossen. Der Server speichert Sitzungsabfragen 30 Sekunden lang zwischen, sodass ein Widerruf über den Admin-Befehl, einen separaten Prozess, innerhalb von 30 Sekunden wirksam wird.
    - **Geltungsbereich.** Ein Token gehört zu genau einem Server und öffnet auch dessen WebSocket. Senden Sie es nie an einen anderen Server.

    ## Ratenlimits und andere Drosselungen

    Limits gelten für einen von zwei Bereichen. **Client:** eine IPv4-Adresse oder ein IPv6-/64-Netz (im Proxy-Modus stammt die Adresse aus `X-Forwarded-For`, gesendet von einer `TRUSTED_PROXIES`-Adresse); manche Limits zählen zusätzlich jedes IPv6-/48-Netz als Ganzes, über jedes seiner /64-Netze hinaus. **Spieler:** das angemeldete Konto, unabhängig von seiner Adresse; ein pro Spieler gezähltes Limit an einem Endpunkt mit optionaler Sitzung zählt bei einer Anfrage ohne Token pro Client.

    Jedes Limit ist ein Token-Bucket, der `limit` Anfragen fasst und sich kontinuierlich mit `limit / window` auffüllt; `retryAfter` ist die Zeit bis zum nächsten Token. Als *geteilt* markierte Limits werden zusätzlich über ein gleitendes Fenster derselben Länge gezählt, sodass kein Fenster wesentlich mehr als `limit` Anfragen enthält. Jedes Limit wird für den gesamten Server gezählt. Wenn eines der Limits eines Endpunkts eine Anfrage ablehnt, werden die Tokens zurückgegeben, die seine anderen Limits für diese Anfrage verbraucht haben. Eine Ablehnung wird mit 429 `rate_limited` samt `retryAfter` und `Retry-After` beantwortet.

    - **Adressebene.** Jede Anfrage (jeder Pfad und jede Methode, einschließlich der Endpunkte zur Zustandsprüfung und der WebSocket-Upgrades) verbraucht zuerst ein Token aus dem Budget ihres Clients: `HTTP_RATE_PER_IP` (600) pro Minute mit einem Burst von einer halben Minute und `HTTP_RATE_PER_PREFIX` (4 x `HTTP_RATE_PER_IP`) für ein IPv6-/48-Netz. Ein Client darf außerdem höchstens `IP_MAX_INFLIGHT` (32 x `WORKERS`) Anfragen gleichzeitig in Bearbeitung haben (darüber hinaus `retryAfter` 1). Ein Client, der nach seinen Ablehnungen weitermacht, wird gesperrt: `ABUSE_BLOCK_REFUSALS_PER_MIN` (600) Ablehnungen in einer Minute sperren ihn für 1 Minute, dann bei jeder neuen Sperre innerhalb von 6 Stunden für 4, 16 und 60 Minuten. Eine Ablehnung durch die Limits `auth`, `auth_*` und `reauth` zählt fünffach; pro Spieler gezählte Limits zählen nie. Adressen in `ABUSE_EXEMPT` überspringen diese Ebene, nicht aber das Kontobudget oder die Endpunktlimits.
    - **Kontobudget.** Jede Anfrage mit einem gültigen Sitzungstoken zählt außerdem gegen ihr Konto: `USER_RATE_PER_MIN` (120) pro Minute für alle Endpunkte zusammen, unabhängig von der Adresse, mit einem Burst von einer halben Minute.
    - **Endpunktlimits:**

    | Limit | Standardwert | Gezählt pro | Endpunkte |
    |---|---|---|---|
    | `auth` | `AUTH_RATE_PER_IP` (20) / 10 min, geteilt | Client und `AUTH_RATE_PER_PREFIX` (5 x `AUTH_RATE_PER_IP`) pro IPv6-/48-Netz | `POST /auth/register`, `/auth/login`, `/auth/login/mfa`, `/auth/verify-email/resend`, `/auth/password/forgot`, `/auth/password/reset`, `/auth/sso/google/link`, `/auth/sso/complete`; `POST /verify-email`, `/reset-password`, `/confirm-email-change` |
    | `auth_register` | `AUTH_REGISTER_PER_HOUR` (10) / Stunde, geteilt | Client, das Dreifache pro IPv6-/48-Netz | `POST /auth/register` |
    | `auth_mail` | `AUTH_MAIL_PER_HOUR` (10) / Stunde, geteilt | Client, das Dreifache pro IPv6-/48-Netz | `POST /auth/verify-email/resend` |
    | `auth_forgot` | `AUTH_FORGOT_PER_HOUR` (3) / Stunde, geteilt | Client, das Dreifache pro IPv6-/48-Netz | `POST /auth/password/forgot` |
    | `auth_forgot_day` | `AUTH_FORGOT_PER_DAY` (10) / 24 Stunden, geteilt | Client, das Dreifache pro IPv6-/48-Netz | `POST /auth/password/forgot` |
    | `auth_reset` | `AUTH_RESET_PER_HOUR` (10) / Stunde, geteilt | Client, das Dreifache pro IPv6-/48-Netz | `POST /auth/password/reset`, `POST /reset-password` |
    | `reauth` | die Werte von `auth`, eigener Bucket, geteilt | Client und IPv6-/48-Netz | die Kontoänderungen, die das Passwort verlangen (siehe Erneute Authentifizierung), und `POST /account/export` |
    | `reauth_user` | `AUTH_REAUTH_PER_USER` (10) / 10 min, geteilt | Spieler | dieselben Endpunkte wie `reauth` |
    | `account` | 60 / min | Spieler | `GET /account/me`, `PUT /account/preferences` |
    | `account_games` | 60 / min | Spieler | `GET /account/games` |
    | `account_export` | 5 / Stunde, geteilt | Spieler | `POST /account/export` (vor `reauth` geprüft; jeder Versuch zählt) |
    | `sessions` | 60 / min | Spieler | `POST /auth/logout`, `/auth/logout-all`, `GET /auth/sessions`, `DELETE /auth/sessions/{id}` |
    | `public_read` | 60 / min | Spieler (Client ohne Token) | `GET /players/{username}`, `/players/{username}/games`, `/games/{id}`, `/games/{id}/pgn` (ein Bucket für alle vier) |
    | `gif` | 30 / min | Spieler | `GET /games/{id}/gif`, `POST /gif` (ein Bucket für beide) |
    | `gif_user_min`, `gif_user_hour` | `GIF_USER_RENDERS_PER_MIN` (4) / min und `GIF_USER_RENDERS_PER_HOUR` (30) / Stunde, geteilt | Spieler | dieselben beiden, nur wenn das GIF erstellt werden muss (nicht aus dem Cache) |
    | `gif_ip_min`, `gif_ip_hour` | `GIF_IP_RENDERS_PER_MIN` (12) / min und `GIF_IP_RENDERS_PER_HOUR` (120) / Stunde, geteilt | Client (alle seine Konten zusammen), das Dreifache pro IPv6-/48-Netz | dieselben, wie oben |
    | `reports` | 30 / Stunde | Spieler | `POST /reports` |
    | `sso_start` | 30 / 10 min, geteilt | Client und 90 pro IPv6-/48-Netz | `POST /auth/sso/google/start` |
    | `sso_finish` | 30 / min | Client | `POST /auth/sso/google/finish` |
    | `page` | 60 / min | Client | `GET /verify-email`, `/reset-password`, `/confirm-email-change` |

    `GET /info` und `GET /leaderboard` haben kein eigenes Limit, nur die Adressebene. Ein Endpunkt mit mehreren Limits prüft sie in der Reihenfolge, die in seiner Beschreibung angegeben ist.

    Der Server bearbeitet eine Anfrage in dieser Reihenfolge: die Adressebene, dann die Endpunkte zur Zustandsprüfung; Zuordnung des Endpunkts; Authentifizierung; das Kontobudget, wenn die Anfrage eine Sitzung trägt; die Limits des Endpunkts; der Body; der Endpunkt selbst (die GIF-Endpunkte verbrauchen ihre Render-Limits nur, wenn sie ein GIF erstellen müssen). Eine wegen ihres Tokens abgelehnte Anfrage verbraucht also keine Tokens des Endpunkts, eine Anfrage mit ungültigem Body dagegen schon.

    Weitere Drosselungen, die die Endpunkte selbst beantworten:

    - **Fehlgeschlagene Anmeldungen mit einem Anmeldenamen** (Benutzername oder E-Mail): Ab `AUTH_FAILURES_PER_ACCOUNT` (5) Fehlversuchen muss jeder Versuch doppelt so lange warten wie der vorherige (2 s, 4 s usw., bis zu 15 Minuten): 429 `too_many_attempts` mit `retryAfter`. Der Zähler vergisst nach einer Stunde ohne Fehlversuche.
    - **Fehlgeschlagene zweite Faktoren bei der Anmeldung:** dieselbe Regel ab dem 5. falschen Code des Kontos. Ein Anmeldeschritt akzeptiert höchstens 5 falsche Codes.
    - **Codes des zweiten Faktors eines Kontos:** höchstens `AUTH_MFA_PER_ACCOUNT` (10) Codes (Authenticator- oder Wiederherstellungscodes, richtig oder falsch) pro 15 Minuten, von jeder Adresse, bei der Anmeldung und bei erneuten Authentifizierungen; darüber hinaus 429 `too_many_attempts`, bevor der Code geprüft wird, sodass kein Wiederherstellungscode verbraucht wird.
    - **Fehlgeschlagene erneute Authentifizierungen eines Kontos** (falsches Passwort oder falscher Code): dieselbe Regel (429 `too_many_attempts`), gemeinsam für alle Endpunkte, die erneut authentifizieren.
    - **E-Mails:** eine Bestätigungs- oder Zurücksetzungs-E-Mail pro Adresse alle 5 Minuten (die Antwort bleibt dieselbe); ein Hinweis „Jemand hat versucht, Ihre Adresse zu verwenden“ pro Adresse und Stunde.
    - **Meldungen:** `REPORTS_PER_DAY` (5) pro Spieler in 24 Stunden: 429 `report_limit`.

    ## Arbeitsnachweis (Proof of Work)

    `POST /auth/register` verlangt immer einen Arbeitsnachweis, wenn `POW_REGISTER_BITS` größer als 0 ist (standardmäßig 18; `GET /info` liefert den Wert als `pow.register`). `POST /auth/login` und `POST /auth/sso/google/link` (eine gemeinsame Art von Challenge für beide) verlangen einen nur für 5 Minuten, nachdem der Server eine Welle fehlgeschlagener Anmeldungen bemerkt hat (`POW_LOGIN_TRIGGER_PER_MIN`, dann `POW_LOGIN_BITS`); ein Client erfährt es aus der Antwort.

    1. Die Anfrage ohne Nachweis (oder mit einem abgelehnten) wird mit 428 `pow_required` beantwortet, samt `reason` und einer `pow`-Challenge `{ challenge, bits, expiresAt }`.
    2. Finden Sie eine Nonce: eine Dezimalzeichenkette aus höchstens 20 Ziffern, sodass `SHA-256(challenge + ":" + nonce)` mit `bits` Nullbits beginnt (höchstwertiges Bit des ersten Bytes zuerst). 18 Bits erfordern im Mittel etwa 260.000 Hashes.
    3. Senden Sie dieselbe Anfrage erneut mit `"pow": { "challenge": "...", "nonce": "123456" }` im Body.

    Eine Challenge ist 2 Minuten lang und nur einmal gültig, für einen Endpunkt und ein Client-Netz (eine IPv4-Adresse oder ein IPv6-/64-Netz). Sie ist signiert, sodass der Server nichts über sie speichert, bis sie zurückkommt. `reason` gibt an, warum ein Nachweis abgelehnt wurde: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` oder `replayed`.

    ## Erneute Authentifizierung

    Kontoänderungen verlangen erneut das Passwort und, wenn die Zwei-Faktor-Authentifizierung eingeschaltet ist, einen zweiten Faktor:

    - nur das Passwort: `POST /account/password` und `POST /account/mfa/totp/setup`;
    - das Passwort und einen Authenticator-Code, wobei ein Wiederherstellungscode abgelehnt wird: `POST /account/mfa/recovery-codes`;
    - das Passwort und einen Authenticator-Code oder einen Wiederherstellungscode: `POST /account/mfa/totp/disable`, `POST /account/email`, `POST /account/export` und `POST /account/delete`.

    In Bodys enthält `code` einen 6-stelligen Authenticator-Code und `recoveryCode` einen Wiederherstellungscode (`xxxx-xxxx-xx`; Groß- und Kleinschreibung, Leerzeichen und Bindestriche spielen keine Rolle). Wo Wiederherstellungscodes akzeptiert werden, darf ein Wiederherstellungscode auch in `code` gesendet werden. Jeder Code funktioniert nur einmal: Ein verwendeter Authenticator-Code wird bis zum nächsten 30-Sekunden-Schritt abgelehnt, und ein Wiederherstellungscode ist nach seiner Verwendung verbraucht.

    | Status | `error` | Wann |
    |---|---|---|
    | 403 | `invalid_password` | Falsches Passwort. |
    | 403 | `mfa_code_required` | Die Zwei-Faktor-Authentifizierung ist eingeschaltet, und weder `code` noch `recoveryCode` wurde gesendet. |
    | 403 | `invalid_code` | Falscher oder bereits verwendeter Code. |
    | 400 | `password_not_set` | Ein Konto, das sich nur mit Google anmeldet, hat noch kein Passwort („Passwort vergessen?“ legt eines fest). |
    | 429 | `too_many_attempts` | Zu viele Fehlversuche oder zu viele ausprobierte Codes bei diesem Konto. |
    | 503 / 429 | `server_busy` / `rate_limited` | Die Passwort-Hash-Warteschlange ist ausgelastet. |

    Falsche Passwörter und Codes zählen im Fehlversuchszähler des Kontos und werden als Sicherheitsereignisse protokolliert.

    ## Metrik-Port

    Neben dem API-Port antwortet der Server mit reinem HTTP auf dem Metrik-Port (`METRICS_PORT`, 9464, gebunden an `METRICS_BIND`, standardmäßig 127.0.0.1; halten Sie ihn privat). Er ist nicht Teil dieser API: `GET /healthz` antwortet mit `ok`; `GET /readyz` antwortet mit `ready`, sobald der Start abgeschlossen ist (jeder Shard hat sein Journal erneut abgespielt und die Listener sind gebunden) und bis das Herunterfahren beginnt, sonst mit 503 `not ready`; `GET /metrics` liefert die Prometheus-Metriken und verlangt, wenn `METRICS_TOKEN` gesetzt ist, `Authorization: Bearer <token>` mit genau diesem Token.
