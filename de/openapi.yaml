  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: E-Mail-Adresse ändern
      description: |-
        Ändert die E-Mail-Adresse des Kontos. `newEmail` wird von umgebenden Leerzeichen befreit, in Kleinbuchstaben umgewandelt und dann wie eine Adresse bei der Registrierung geprüft.

        **Mit E-Mail-Bestätigung** (der Standard): 202 `verification_sent`. Ein 24 Stunden gültiger Link geht an die neue Adresse; er öffnet `/confirm-email-change`, und die Adresse ändert sich erst, wenn der Spieler die Schaltfläche dieser Seite drückt. Bis dahin zeigt `GET /account/me` die neue Adresse als `pendingEmail`. Eine neue Anfrage ersetzt die ausstehende; eine Änderung oder ein Zurücksetzen des Passworts bricht sie ab. Höchstens ein Link geht alle 5 Minuten an eine bestimmte neue Adresse, gleich wer ihn anfordert (eine Anfrage für die bereits ausstehende Änderung behält den früher gesendeten Link, der gültig bleibt); die Antwort ist dieselbe. Die aktuelle Adresse erhält einen Hinweis, dass eine Änderung auf eine maskierte Adresse (`a***@example.org`) angefordert wurde. Antwort und `pendingEmail` sind dieselben, wenn bereits ein anderes Konto die neue Adresse verwendet: Dann wird kein Link gesendet, sodass diese Änderung nie abgeschlossen wird, und stattdessen erhält der Inhaber dieser Adresse einen Hinweis (höchstens einen pro Stunde).

        Wenn der Link bestätigt wird, ändert sich die Adresse und gilt als bestätigt, die Geräte bleiben angemeldet, die früher gesendeten Links (Bestätigung, Zurücksetzen des Passworts, andere Änderungen) werden ungültig, und die bisherige Adresse wird benachrichtigt, wobei die neue maskiert ist.

        **Ohne E-Mail-Bestätigung** (`REQUIRE_EMAIL_VERIFICATION=false`): Die Adresse ändert sich sofort (200 `email_changed`), und die bisherige Adresse wird benachrichtigt. Verwendet ein anderes Konto die Adresse, lautet die Antwort 409 `email_taken`, und der Inhaber dieser Adresse erhält den Hinweis.

        **Erneute Authentifizierung:** das Passwort und, bei Zwei-Faktor-Authentifizierung, ein Authenticator-Code oder ein Wiederherstellungscode. `invalid_email` und `same_email` werden vor dem Passwort geprüft und zählen daher nicht als Fehlversuch. **Limits:** `reauth`, dann `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Die Adresse wurde sofort geändert (keine E-Mail-Bestätigung auf diesem Server).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: Die neue Adresse, wie sie gespeichert ist.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: Ein Bestätigungslink wurde an die neue Adresse gesendet (oder die Adresse gehört zu einem anderen Konto; die Antwort verrät es nicht).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email` (die aktuelle Adresse des Kontos), `password_not_set` (Konto nur mit Google-Anmeldung), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` (auch wenn eine Änderung oder ein Zurücksetzen des Passworts der Anfrage zuvorkam: Es wird kein Link gesendet), `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: nur ohne E-Mail-Bestätigung.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (fehlgeschlagene erneute Authentifizierungen oder zu viele ausprobierte Codes bei diesem Konto) oder `rate_limited` (das Limit `reauth` oder `reauth_user`, das Kontobudget, die Passwort-Hash-Warteschlange).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: die Passwort-Hash-Warteschlange, oder die Datenbank blieb gesperrt (`retryAfter: 1`: nichts geändert, und dieselbe Anfrage kann erneut gesendet werden). `timeout`.'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: Daten des Kontos herunterladen
      description: |-
        Alles, was der Server über das Konto speichert, als eine JSON-Datei zum Speichern (`format` `scacelith-account-export`, `version` 1). Der Export erzeugt ein Sicherheitsereignis (`account_exported`). Das Array `notes` des Dokuments erklärt dem Spieler in einfachem Englisch, was ausgelassen ist.

        **Nie im Export:** der Passwort-Hash, das Geheimnis der Zwei-Faktor-Authentifizierung und die Wiederherstellungscodes; jegliche Sitzungs- oder Link-Tokens oder deren Hashes; die Daten der Betrugserkennung (Integritätsstufe und -wert, Anomalien, die Analyse der Partien, das Gewicht einer Meldung); die Meldungen anderer Spieler über den Spieler; die Identitäten der Moderatoren; private Daten anderer Spieler (Gegner erscheinen mit ihrem öffentlichen Namen und ihrer Wertung, nichts verrät, ob ein anderer Spieler sanktioniert wurde, und keine IP-Adresse, die einer anderen Person gehören könnte, ist enthalten).

        **Erneute Authentifizierung:** das Passwort und, bei Zwei-Faktor-Authentifizierung, ein Authenticator-Code oder ein Wiederherstellungscode. **Limits:** `account_export` (5 pro Stunde und Spieler, für den gesamten Server; jeder Versuch zählt, auch fehlgeschlagene; wird zuerst geprüft), dann `reauth` und `reauth_user`. **Zeitlimit:** 60 Sekunden.
