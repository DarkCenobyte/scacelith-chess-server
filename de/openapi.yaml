tags:
  - name: server-info
    x-displayName: Serverinformationen
    description: Was ein Client wissen muss, bevor er sich anmeldet oder verbindet.
  - name: health
    x-displayName: Zustandsprüfung
    description: |-
      Erreichbarkeit und Betriebsbereitschaft des Servers, für die Überwachung. Diese Endpunkte antworten auf dem API-Port vor der Authentifizierung und vor allen Endpunktlimits, verbrauchen aber wie jede Anfrage ein Token der Adressebene; ein Überwachungshost kann in `ABUSE_EXEMPT` eingetragen werden. Für jeden Endpunkt funktionieren beide Pfade: im Wurzelpfad des Servers und unter `/api/v1`.

      Der Metrik-Port hat eigene Endpunkte zur Zustandsprüfung, die in der Einleitung beschrieben sind.
  - name: auth
    x-displayName: Registrierung und Anmeldung
    description: |-
      Konto erstellen, Anmeldung mit Passwort (und zweitem Faktor), E-Mails zur Bestätigung und zum Zurücksetzen des Passworts.

      `POST /auth/login`, `POST /auth/login/mfa`, `POST /auth/sso/google/finish`, `POST /auth/sso/google/link` und `POST /auth/sso/complete` antworten mit einer Sitzung `{ token, expiresAt, user }` (oder, bei den ersten von ihnen, mit einem zweiten Schritt).
  - name: google-sign-in
    x-displayName: Anmeldung mit Google
    description: |-
      Verfügbar, wenn `GET /info` `sso.google: true` meldet; andernfalls antwortet jeder der folgenden Endpunkte mit 404 `sso_disabled`. Das Spiel meldet sich über den Systembrowser mit dem Ablauf für installierte Apps nach RFC 8252 an (ein Client vom Typ „Desktop-App“): Google schickt den Browser zu einem Listener des Spiels auf `127.0.0.1` zurück, nie zu diesem Server, und das Spiel sieht nie Google-Anmeldedaten.

      1. Der Client lauscht auf `127.0.0.1:0` (das System wählt den Port) und erzeugt ein PKCE-Paar: einen `codeVerifier` aus 43 bis 128 Zeichen `[A-Za-z0-9._~-]` und `codeChallenge = BASE64URL(SHA-256(codeVerifier))` mit 43 Zeichen ohne Padding.
      2. `POST /auth/sso/google/start` mit der Code-Challenge und dem Port liefert die Google-URL und den `state` des Versuchs. Der Client prüft die URL (siehe unten) und öffnet sie im Browser.
      3. Google schickt den Browser zu `http://127.0.0.1:<port>/oauth2/google/<tag>?code=...&state=...`. Der Client akzeptiert nur den `state` aus der Antwort auf den Start und sendet nach einer Weiterleitung mit `error=` nichts.
      4. `POST /auth/sso/google/finish` mit der ID des Versuchs, dem `codeVerifier`, dem `state` und dem `code` (und `iss`, wenn Google ihn gesendet hat).
      5. Die Antwort ist eine Sitzung, ein Schritt der Zwei-Faktor-Authentifizierung (weiter mit `POST /auth/login/mfa`), `needsUsername` für einen neuen Spieler (weiter mit `POST /auth/sso/complete`) oder `needsPassword`, wenn ein Konto mit Passwort die Adresse verwendet (weiter mit `POST /auth/sso/google/link`).

      **Das Herkunfts-Tag.** Die Weiterleitungs-URI trägt ein Tag des Servers, den der Spieler hinzugefügt hat, sodass das Spiel eine URL ablehnt, die ein anderer Server für seine eigenen Spieler erhalten hat. Die Herkunft ist der Host in Kleinbuchstaben (ein IPv6-Literal in eckigen Klammern), `:` und der dezimale API-Port, immer ausgeschrieben, auch 443: Der Server nimmt `SERVER_PUBLIC_HOST` und seinen öffentlichen API-Port, das Spiel die Adresse, mit der es verbunden ist. Das Tag sind die ersten 22 Zeichen der base64url-Kodierung (ohne Padding) von SHA-256(UTF-8 `"scacelith-sso-origin-v1\n"` + Herkunft). Die Weiterleitungs-URI ist `"http://127.0.0.1:" + port + "/oauth2/google/" + tag`: immer das IPv4-Literal und der Port des Listeners des Spiels (1024 bis 65535). Der Server übernimmt nie eine URI, einen Host oder einen Pfad vom Client.

      | Herkunft | Tag |
      |---|---|
      | `play.scacelith.example:443` | `IhcScoV7eDOzTEcSnqPUPt` |
      | `localhost:8443` | `TFGx7zQ_8QlGZW5zpqznCr` |
      | `[::1]:8443` | `XToJm0DG5PjciEVmZa9Cho` |
      | `127.0.0.1:50443` | `3r653wM5ZjYsHcAJljmCwY` |

      Die Anmeldung mit Google funktioniert daher nur für Spieler, die den Server unter genau `SERVER_PUBLIC_HOST` und seinem öffentlichen API-Port hinzugefügt haben.

      **Was das Spiel prüft, bevor es den Browser öffnet.** Die `authUrl` beginnt mit genau `https://accounts.google.com/o/oauth2/v2/auth?`, besteht aus druckbarem ASCII mit weniger als 4096 Zeichen, und ihr Query-Teil enthält genau ein `response_type=code`, genau eine `redirect_uri`, die der URI entspricht, die das Spiel aus seinem Port und seinem Herkunfts-Tag berechnet, genau einen `state`, der dem `state` der Antwort entspricht, `code_challenge_method=S256` und eine `code_challenge` aus 43 Zeichen. Andernfalls beendet das Spiel seinen Listener und öffnet nichts. Es sendet `finish` und `link` nur an den Server, der auf `start` geantwortet hat.

      **Welches Konto die Anmeldung mit Google erreicht:** das bereits mit diesem Google-Konto verknüpfte Konto; andernfalls ein aktives Konto mit der von Google bestätigten Adresse (hat es ein Passwort, antwortet `finish` mit `needsPassword`, und die Verknüpfung wird erst gespeichert, wenn sein Passwort und danach, falls eingeschaltet, sein zweiter Faktor bestanden sind; ohne Passwort 409 `sso_account_exists`); andernfalls ein neues Konto (`needsUsername`). Ein Google-Konto wird nie allein anhand seiner Adresse mit einem bestehenden Konto verknüpft. Die Adresse des Kontos erhält eine E-Mail, wenn die Anmeldung mit Google ein Konto erstellt und wenn sie einem bestehenden Konto hinzugefügt wird.
  - name: sessions
    x-displayName: Sitzungen
    description: Die angemeldeten Geräte des Kontos und das Abmelden.
  - name: account
    x-displayName: Konto
    description: Die Ansicht des Kontos, seine Einstellungen und sein Passwort.
  - name: two-step-verification
    x-displayName: Zwei-Faktor-Authentifizierung
    description: Authenticator-Apps (TOTP, RFC 6238) mit SHA-1, 6 Ziffern, 30-Sekunden-Schritten und einem Schritt Toleranz in beide Richtungen, dazu einmal verwendbare Wiederherstellungscodes.
  - name: email-change
    x-displayName: Änderung der E-Mail-Adresse
    description: Ändern der Adresse des Kontos, bestätigt über einen Link, der an die neue Adresse gesendet wird.
  - name: data-export
    x-displayName: Datenexport
    description: Alles, was der Server über das Konto speichert, als eine einzige JSON-Datei.
  - name: account-deletion
    x-displayName: Kontolöschung
    description: Endgültiges Löschen des Kontos.
  - name: game-history
    x-displayName: Partieverlauf
    description: Die eigenen Partien des angemeldeten Spielers, gefiltert und seitenweise.
  - name: games
    x-displayName: Partien und PGN
    description: |-
      Partieaufzeichnungen mit ihren Zügen und Uhrständen sowie ihre PGN-Dateien.

      **Partiecodes.** `status`: 1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (nur beendete Partien werden gespeichert). `result`: `1-0`, `0-1`, `1/2-1/2` oder `*` (abgebrochen). `reason`, mit seinem Namen (`termination`) und den Wörtern, mit denen der Zugtext der PGN-Datei endet (auf Englisch, hier mit Übersetzung); die Codes 7 und 21 sind Remis (der Spieler, dessen Zeit ablief oder der die Partie verließ, stand einem Gegner gegenüber, der nicht mattsetzen konnte), und der Server beendet nie eine Partie mit den Codes 4 und 13 (sie gehören zur gemeinsamen Liste der Gründe):

      | Code | `termination` | Wörter im PGN |
      |---|---|---|
      | 1 | `Checkmate` | Checkmate (Schachmatt) |
      | 2 | `Resignation` | Resignation (Aufgabe) |
      | 3 | `Timeout` | Loss on time (Zeitüberschreitung) |
      | 4 | `IllegalMoves` | Second illegal move (forfeit) (Zweiter regelwidriger Zug, verloren) |
      | 5 | `Stalemate` | Stalemate (Patt) |
      | 6 | `InsufficientMaterial` | Dead position (insufficient material) (Tote Stellung, ungenügendes Material) |
      | 7 | `TimeoutVsInsufficient` | Flag fall, but the opponent cannot checkmate (Zeit überschritten, aber der Gegner kann nicht mattsetzen) |
      | 8 | `FivefoldRepetition` | Fivefold repetition (Fünffache Stellungswiederholung) |
      | 9 | `SeventyFiveMoves` | 75-move rule (75-Züge-Regel) |
      | 10 | `ThreefoldClaim` | Threefold repetition (claimed) (Dreifache Stellungswiederholung, reklamiert) |
      | 11 | `FiftyMoveClaim` | 50-move rule (claimed) (50-Züge-Regel, reklamiert) |
      | 12 | `Agreement` | Draw by agreement (Remis durch Vereinbarung) |
      | 13 | `IllegalMovesVsInsufficient` | Second illegal move, but the opponent cannot checkmate (Zweiter regelwidriger Zug, aber der Gegner kann nicht mattsetzen) |
      | 20 | `Abandonment` | Abandoned (disconnected for too long) (Partie verlassen, zu lange getrennt) |
      | 21 | `AbandonmentVsInsufficient` | Abandoned, but the opponent cannot checkmate (Partie verlassen, aber der Gegner kann nicht mattsetzen) |
      | 22 | `Aborted` | Game aborted (Partie abgebrochen) |
      | 23 | `NoShow` | Aborted: first move not played in time (Abgebrochen: erster Zug nicht rechtzeitig gespielt) |
      | 24 | `Forfeit` | Forfeit (fair play violation) (Kampflos verloren, Verstoß gegen das Fairplay) |
      | 25 | `ServerAborted` | Aborted by the server (Vom Server abgebrochen) |
      | 26 | `BothDisconnected` | Aborted: both players disconnected (Abgebrochen: beide Spieler getrennt) |
  - name: gifs
    x-displayName: Animierte GIFs
    description: |-
      Eine Partie als animiertes GIF, zum Aufbewahren oder Teilen: das Brett von oben gesehen, ein Bild pro Stellung von der Anfangs- bis zur Schlussstellung, die Namen und Wertungen der Spieler über dem Brett, der letzte Zug darunter und auf dem letzten Bild das Ergebnis und wie die Partie endete.

      **Kosten, Cache und Kontingente.** Ein GIF wird auf einem eigenen Render-Thread erstellt, nie auf den Threads, die die Partien ausführen, und mit der niedrigsten CPU-Priorität: `GIF_THREADS` Threads (standardmäßig `WORKERS`), die mit dem ersten GIF gestartet und nach einer Minute ohne GIF beendet werden. Bis zu `GIF_QUEUE_MAX` (4 x `WORKERS`) GIFs warten auf einen Thread, jedes höchstens `GIF_QUEUE_TIMEOUT_MS` (10 s); ein Rendervorgang darf `GIF_RENDER_TIMEOUT_MS` (30 s) dauern. Der Server bewahrt die erstellten GIFs in einem Cache von `GIF_CACHE_MB` MB (32 x `WORKERS`) auf, wobei die am längsten nicht verwendeten zuerst weichen; ein GIF aus dem Cache oder eines, das gerade für eine andere Anfrage erstellt wird, kostet keinen Rendervorgang. Der Cache-Schlüssel umfasst alles, was das Bild verändert, auch die Namen.

      Jede Anfrage zählt in `gif` (30 pro Minute und Spieler für beide Endpunkte). Ein GIF, das erstellt werden muss, zählt außerdem in den Render-Limits: pro Spieler `GIF_USER_RENDERS_PER_MIN` (4) pro Minute und `GIF_USER_RENDERS_PER_HOUR` (30) pro Stunde; pro Client, alle seine Konten zusammen, `GIF_IP_RENDERS_PER_MIN` (12) pro Minute und `GIF_IP_RENDERS_PER_HOUR` (120) pro Stunde, sowie das Dreifache pro IPv6-/48-Netz. Ein Client sollte die heruntergeladene Datei aufbewahren, statt sie erneut anzufordern, und nach einem 429 oder 503 `retryAfter` abwarten.

      Größen: `small` (Felder von 32 px: 284 x 350 Pixel), `medium` (48 px: 424 x 515), `large` (72 px: 628 x 762); ohne Koordinaten 268 x 342, 400 x 503 und 600 x 748. Die Anfangsstellung bleibt mindestens 1 s stehen (die Verzögerung, wenn diese länger ist), die Schlussstellung 3 s, und das GIF läuft in einer Schleife; nach dem ersten Bild wird nur der Teil des Bildes gespeichert, der sich ändert. Eine Partie mit 40 Zügen belegt etwa 135, 205 und 325 KiB (klein, mittel, groß), eine Partie mit 150 Zügen 0,5, 0,8 und 1,2 MiB.
  - name: players
    x-displayName: Spieler
    description: Öffentliche Profile und letzte Partien. Nur öffentliche Daten, nie eine E-Mail-Adresse, eine Sitzung, eine Sanktion oder eine Integritätsstufe. Ein gelöschtes Konto hat kein Profil.
  - name: leaderboard
    x-displayName: Rangliste
    description: Die besten Spieler jeder offiziellen Kategorie.
  - name: reports
    x-displayName: Meldungen
    description: Den Gegner einer kürzlich gespielten Partie den Moderatoren melden.
  - name: pages
    x-displayName: HTML-Seiten
    description: |-
      Seiten für einen Browser, die über die Links in E-Mails geöffnet werden. Ihre Links zeigen auf `https://<SERVER_PUBLIC_HOST>` (mit `:<PUBLIC_API_PORT>`, wenn dieser nicht 443 ist), außerhalb von `/api/v1`.

      - Die Seiten führen kein JavaScript aus und laden keine externen Ressourcen. Sie werden mit `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'` ausgeliefert.
      - Ein `GET` zeigt nur eine Schaltfläche oder ein Formular, damit ein Mail-Scanner, der den Link öffnet, ihn nicht verbraucht. Die Änderung erfolgt per `POST`: ein Formular, gesendet als `application/x-www-form-urlencoded` (ein JSON-Body wird ebenfalls akzeptiert), mit dem Token des Links in einem versteckten Feld. Ein doppelt angegebenes Feld wird abgelehnt.
      - Auch Fehler (Ratenlimits, ungültige Felder) sind HTML-Seiten, mit dem Titel „Request refused“ (Anfrage abgelehnt) oder, ab 500, „Server error“ (Serverfehler). Nur die Fehler, die festgestellt werden, bevor die Seite zugeordnet ist (ein zu langes oder fehlerhaftes Anfrageziel, die Adressebene), werden in JSON beantwortet.
