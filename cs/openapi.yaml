paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Získat název, verze a porty serveru a pravidla registrace
      description: |-
        Co klient potřebuje, než se přihlásí nebo připojí: název a ID serveru, verze protokolu WebSocket a umístění WebSocketu, pravidla registrace, oficiální tempa hry a limity, které klient může zkontrolovat ještě před odesláním formuláře.

        **Limity:** jen vrstva podle adresy.
      security: []
      responses:
        '200':
          description: Popis serveru.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: vrstva podle adresy.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Vytvořit účet
      description: |-
        Vytvoří účet: jakmile je jeho e-mailová adresa potvrzena odkazem, který na ni byl odeslán, nebo ihned, pokud se e-mail nepotvrzuje.

        **S potvrzením e-mailu** (`REQUIRE_EMAIL_VERIFICATION`, výchozí stav): 202 `verification_sent`. Účet zatím neexistuje: registrace čeká 24 hodin a mezitím rezervuje své uživatelské jméno. Na adresu přijde odkaz platný po dobu těchto 24 hodin, nejvýše jeden na adresu za 5 minut (nový pošle `POST /auth/verify-email/resend`); účet se vytvoří, s potvrzenou adresou, při použití odkazu (tlačítkem na stránce `/verify-email`) a hráč se pak může přihlásit. Do té doby přihlášení s tímto uživatelským jménem vrací `invalid_credentials`, jako u neznámého účtu, a veřejný profil neexistuje. Nová registrace se stejnou adresou nahradí tu čekající. Odpověď je stejná, i když adresu už používá jiný účet: odkaz se pak neposílá, vlastník tohoto účtu místo toho dostane upozornění (nejvýše jedno za hodinu) a uživatelské jméno se rezervuje stejně, takže nic neprozradí, zda adresa má účet. Registrace, jejíž odkaz nebyl použit, se po 24 hodinách zahodí a její uživatelské jméno je opět volné.

        **Bez potvrzení e-mailu** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, účet se vytvoří ihned a může se přihlásit.

        **Pravidla.** `username`: `USERNAME_MIN` až `USERNAME_MAX` znaků (3 až 20), písmena, číslice, `_` a `-`, na začátku písmeno nebo číslice (`GET /info` je uvádí jako `limits`); rezervovaná jména (`admin`, `moderator`, `deleted`...) a některé předpony se odmítají; jedinečné bez ohledu na velikost písmen. `email`: oříznutý o mezery na okrajích a uložený malými písmeny, čisté ASCII s doménou obsahující tečku. `password`: alespoň `PASSWORD_MIN_LENGTH` (10) znaků a nejvýše 256 bajtů v UTF-8; nesmí obsahovat uživatelské jméno ani místní část e-mailu a nesmí být běžně používaným heslem.

        **Chyby**, kontrolované v tomto pořadí: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; chyby fronty hashování hesel; 409 `email_taken` (jen bez potvrzení e-mailu).

        **Limity:** `auth`, pak `auth_register` (10 registrací za hodinu na klienta). **Důkaz práce:** vždy, když je `POW_REGISTER_BITS` větší než 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: První pokus, bez důkazu práce
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Znovu odesláno s důkazem práce
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Účet je vytvořen a může se přihlásit (tento server e-mail nepotvrzuje).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Registrace čeká na svůj potvrzovací odkaz (nebo adresa už má účet; odpověď to neprozradí).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (s `field`), `invalid_json`, `invalid_username`, `invalid_email` nebo `weak_password` s `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` nebo `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: registrace je na tomto serveru uzavřená (`GET /info` uvádí `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: uživatelské jméno má některý účet, nebo ho rezervuje čekající registrace s jinou adresou. `email_taken`: adresu používá jiný účet (jen bez potvrzení e-mailu).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `auth` nebo `auth_register`, nebo fronta hashování hesel.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (fronta hashování hesel, nebo databáze zůstala zamčená), `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Přihlásit se heslem
      description: |-
        Přihlášení pomocí uživatelského jména nebo e-mailové adresy a hesla. Jsou možné dvě odpovědi, obě se stavem 200: relace, nebo, když je zapnuté dvoufázové ověření, druhý krok, který je třeba dokončit do 5 minut přes `POST /auth/login/mfa`.

        Neznámý účet, chybné heslo a účet bez hesla dostanou stejnou odpověď za stejnou dobu: 401 `invalid_credentials`. Kontroly účtu (`banned`, `email_unverified`) přicházejí až po správném hesle. Od `AUTH_FAILURES_PER_ACCOUNT` (5) neúspěchů na jedno přihlašovací jméno musí každý pokus čekat (429 `too_many_attempts`).

        **Limit:** `auth`. **Důkaz práce:** jen během vlny neúspěšných přihlášení (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Relace, nebo druhý krok přihlášení s dvoufázovým ověřením.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Přihlášení proběhlo
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Dvoufázové ověření je zapnuté
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: neznámý účet, chybné heslo nebo účet bez hesla.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Jen po správném hesle: `banned` s `until` (ms od epochy Unixu, `null` při trvalém pozastavení), nebo `email_unverified` (starší účet, jehož adresa ještě není potvrzená).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (prodleva po neúspěších u tohoto přihlašovacího jména), nebo `rate_limited` (limit `auth`, fronta hashování hesel).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (fronta hashování hesel, nebo databáze zůstala zamčená), `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Dokončit přihlášení druhým faktorem
      description: |-
        Druhý krok přihlášení s dvoufázovým ověřením, poté co `POST /auth/login` nebo přihlášení přes Google (`POST /auth/sso/google/finish` nebo `POST /auth/sso/google/link`) vrátí `mfaRequired`. Pošlete `code` (šestimístný kód z ověřovací aplikace, nebo záložní kód) nebo `recoveryCode`. Záložní kód použitý zde zaniká.

        Jeden krok přijme nejvýše 5 chybných kódů; krok skončí také při obnovení nebo změně hesla. Po kroku s heslem při propojení s Googlem se propojení uloží, jen když zde kód projde.

        **Limity:** `auth` a nejvýše `AUTH_MFA_PER_ACCOUNT` (10) kódů za 15 minut na účet, z jakékoli adresy; nad tento počet se kód nekontroluje, takže se záložní kód nespotřebuje.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Kód z ověřovací aplikace
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Záložní kód
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Přihlášení proběhlo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: nebylo odesláno ani `code`, ani `recoveryCode`, nebo tělo porušuje schéma; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: krok vypršel, byl použit nebo skončil po 5 chybných kódech, nebo bylo od prvního kroku heslo obnoveno či změněno (přihlaste se znovu). `invalid_code`: chybný nebo už použitý kód.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (s `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: jen po kroku s heslem při propojení s Googlem; účet Google byl mezitím propojen s jiným účtem.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: jen po kroku s heslem při propojení s Googlem; účet se mezitím změnil, zahajte přihlášení znovu.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: prodleva po neúspěších u účtu, nebo jsou vyčerpány jeho kódy `AUTH_MFA_PER_ACCOUNT` za posledních 15 minut. `rate_limited`: limit `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` s `retryAfter: 1`: databáze zůstala zamčená (po kroku propojení s Googlem se nic nepropojilo: zahajte přihlášení znovu). `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Odhlásit tuto relaci
      description: |-
        Zneplatní relaci použitého tokenu. WebSocket otevřený s touto relací se zavře. Bez těla (nebo `{}`).

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Odhlášení proběhlo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: jiné tělo než `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sessions` nebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáze zůstala zamčená), `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
        - sessions
      summary: Odhlásit všechny relace
      description: |-
        Zneplatní všechny relace účtu včetně této. WebSockety otevřené s nimi se zavřou. Bez těla (nebo `{}`).

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Všechny relace jsou odhlášené.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: jiné tělo než `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sessions` nebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáze zůstala zamčená), `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Znovu poslat potvrzovací odkaz
      description: |-
        Znovu pošle odkaz pro potvrzení e-mailu. Odpověď je 202 `accepted` bez ohledu na adresu, takže nikdy neprozradí, zda ji používá účet nebo registrace.

        Požadavek se projeví nejvýše jednou za 5 minut na adresu. Čekající registrace s touto adresou dostane znovu svých 24 hodin, ať už adresu používá jiný účet, nebo ne, takže její uživatelské jméno zůstane v obou případech rezervované stejně dlouho. Odkaz se pošle jen pro tuto registraci, pokud adresa nemá účet (nový odkaz platný 24 hodin nahradí předchozí), nebo pro aktivní nepotvrzený účet s touto adresou.

        **Limity:** `auth`, pak `auth_mail` (10 za hodinu na klienta).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Přijato (bez ohledu na adresu).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `auth` nebo `auth_mail` (bez ohledu na adresu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` s `retryAfter: 1`: databáze zůstala zamčená při vyhledávání účtu nebo při ukládání odkazu nepotvrzeného účtu (prodloužení čekající registrace se provádí jen podle možností (best effort) a nikdy nezpůsobí selhání požadavku); pětiminutový interval adresy přesto začne běžet, takže nový požadavek během něj nic neudělá. `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Poslat odkaz pro obnovení hesla
      description: |-
        Pošle odkaz pro obnovení hesla, platný jednu hodinu, který otevře stránku `/reset-password`. Odpověď je 202 `accepted` bez ohledu na adresu. Odkaz se pošle jen aktivnímu účtu, nejvýše jednou za 5 minut na adresu. Účet jen s přihlášením přes Google si takto nastaví své první heslo.

        Obnovení hesla má nejpřísnější limity celého API, všechny počítané pro celý server: 3 požadavky za hodinu (`AUTH_FORGOT_PER_HOUR`) a 10 za 24 hodin (`AUTH_FORGOT_PER_DAY`) na klienta (adresu IPv4 nebo IPv6 /64), 3krát tolik na IPv6 /48, navíc k limitu `auth` (20 za 10 minut) a k jednomu e-mailu na adresu za 5 minut. Ani 202, ani 429 neprozradí, zda adresu používá nějaký účet. Nastavení nového hesla má vlastní limit (`auth_reset`).

        **Limity:** `auth`, `auth_forgot`, pak `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Přijato (bez ohledu na adresu).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `auth`, `auth_forgot` nebo `auth_forgot_day` (bez ohledu na adresu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` s `retryAfter: 1`: databáze zůstala zamčená při vyhledávání účtu nebo při ukládání odkazu; pětiminutový interval adresy přesto začne běžet, takže nový požadavek během něj žádný odkaz nepošle. `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Nastavit nové heslo tokenem z odkazu pro obnovení hesla
      description: |-
        Nastaví nové heslo pomocí tokenu z odkazu pro obnovení hesla (totéž dělá stránka `/reset-password`). Pro nové heslo platí pravidla registrace.

        Obnovení má tyto účinky, v jedné transakci (buď všechny, nebo žádný): zneplatní všechny relace a zruší čekající změnu e-mailu; ostatní odkazy pro obnovení hesla k účtu přestanou fungovat; adresa se považuje za potvrzenou (odkaz to prokázal); vlastník dostane e-mail. Dvoufázového ověření se obnovení nedotkne. Po chybě fronty hashování hesel, po 503 nebo po 500 se nic nezměnilo: staré heslo i relace zůstávají a odkaz zůstává platný.

        **Limity:** `auth`, pak `auth_reset` (10 za hodinu na klienta, 30 na IPv6 /48, sdílený se stránkou: každý pokus hashuje heslo).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Heslo je změněno a všechny relace jsou odhlášené.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: odkaz je neplatný, použitý nebo vypršel, nebo byl poslán na adresu, kterou účet už nemá. `weak_password` (s `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `auth` nebo `auth_reset`, nebo fronta hashování hesel.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: fronta hashování hesel, nebo databáze zůstala zamčená (`retryAfter: 1`, nic se nezměnilo). `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Zahájit přihlášení přes Google
      description: |-
        Zahájí pokus o přihlášení přes Google pro výzvu PKCE a port naslouchacího procesu hry na `127.0.0.1`. Odpověď obsahuje URL Google, kterou je třeba otevřít v systémovém prohlížeči, a `state` pokusu; pokus platí 10 minut.

        `authUrl` obsahuje `client_id`, `redirect_uri` (sestavené z `redirectPort` a značky původu serveru), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 vlastního verifikátoru serveru pro Google) s `code_challenge_method=S256` a `prompt=select_account`. Hra ji před otevřením zkontroluje (viz popis sekce).

        **Limit:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Pokus.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: tento server přihlášení přes Google nenabízí.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáze zůstala zamčená), `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Zahájit přihlášení přes Google na webu
      description: |-
        Zahájí pokus webu o přihlášení přes Google pro výzvu PKCE jeho stránky. Odpověď je stejná jako pro hru: URL Google, na kterou se má přejít, a `state` pokusu; pokus platí 10 minut. K dispozici, když `GET /info` uvádí `sso.googleWeb: true`.

        `authUrl` obsahuje `client_id` webu a `redirect_uri=GOOGLE_WEB_REDIRECT_URI` se stejnými ostatními parametry jako pro hru. Stránka ji před přechodem na ni zkontroluje (viz **Na webu** v popisu sekce).

        **Limit:** `sso_start`, sdílený se zahájením přihlášení ze hry.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: Pokus.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: chybějící nebo chybně utvořené `codeChallenge`, nebo jakékoli jiné pole (včetně `redirectPort`).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: tento server přihlášení přes Google nenabízí, nebo ho nenabízí webům.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sso_start` (sdílený se zahájením přihlášení ze hry).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáze zůstala zamčená), `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Předat odpověď Googlu serveru
      description: |-
        Předá serveru `code` a `state`, které Google poslal naslouchacímu procesu hry nebo stránce webu, spolu s ID pokusu a verifikátorem PKCE. ID pokusu je bez verifikátoru k ničemu a kód je k ničemu bez vlastního verifikátoru PKCE serveru a tajného klíče klienta.

        Server zkontroluje pokus (neznámý, použitý nebo vypršelý: 410), pak verifikátor (chybný ponechá pokus použitelný), pak pokus jednou použije, zkontroluje `state` a `iss`, vymění kód s Googlem a ověří ID token. Odpověď (200) je jedna z těchto:

        - `{ token, expiresAt, user }`: přihlášení k propojenému účtu proběhlo;
        - `{ mfaRequired, mfaToken, expiresIn }`: pokračujte přes `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: nový účet; pokračujte přes `POST /auth/sso/complete` do 10 minut. `suggestedUsername` pochází ze jména u Googlu nebo z adresy a je `""`, když nic nevyhovuje;
        - `{ needsPassword, linkTicket, username, expiresIn }`: účet s touto adresou má heslo; pokračujte přes `POST /auth/sso/google/link`. Zatím není nic propojeno.

        **Limit:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Relace, druhý krok, nebo další krok prvního přihlášení přes Google.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Přihlášení k propojenému účtu proběhlo
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Dvoufázové ověření je zapnuté
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Nový hráč
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Adresu používá účet s heslem
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: verifikátor neodpovídá výzvě pokusu (pokus zůstává použitelný). `sso_email_unverified`: Google adresu nepotvrdil. `registration_closed`. `account_disabled`. Jen u propojeného účtu: `banned` (s `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: tento server přihlášení přes Google nenabízí.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: adresu používá aktivní účet bez hesla (není uvedeno, který).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: neznámý, použitý nebo vypršelý pokus.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáze zůstala zamčená), `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Propojit Google s existujícím účtem pomocí jeho hesla
      description: |-
        Poté, co `finish` odpověděl `needsPassword`: propojí Google s existujícím účtem pomocí hesla tohoto účtu, zadaného ve hře. Odpovědí (200) je relace (propojení je uloženo a hráč přihlášen), nebo, když je zapnuté dvoufázové ověření, `{ mfaRequired, mfaToken, expiresIn }`: pokračujte přes `POST /auth/login/mfa` a propojení se uloží, jen když tam kód projde.

        Chybné heslo ponechá tiket použitelný, celkem pro 5 pokusů. Pokus se započítá těsně před kontrolou hesla: 429 `too_many_attempts` ani 428 `pow_required` žádný nespotřebují, zatímco odmítnutí frontou hashování hesel (503 `server_busy`, 429 `rate_limited`) už jeden spotřebovalo a počítá se jako neúspěch účtu. Prodleva po neúspěších používá stejné počítadlo jako `POST /auth/login`.

        **Limit:** `auth` (včetně počítání na IPv6 /48). **Důkaz práce:** jako u `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Relace, nebo druhý krok přihlášení.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: nesprávné heslo; tiket zůstává platný, celkem na 5 pokusů.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (s `until`), jen po zadání správného hesla.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: tento server přihlášení přes Google nenabízí.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: účet Google byl mezitím propojen s jiným účtem.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: neznámý, použitý nebo vypršelý tiket, páté nesprávné heslo, účet, jehož stav nebo adresa se od `finish` změnily, nebo účet, jehož stav, adresa, heslo nebo dvoufázové ověření se změnily během ukládání propojení. Zahajte přihlášení znovu.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (prodleva po neúspěších u účtu), nebo `rate_limited` (limit `auth`, fronta hashování hesel).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: fronta hashování hesel, nebo databáze zůstala zamčená (`retryAfter: 1`, nic nebylo propojeno). `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Vytvořit účet při prvním přihlášení přes Google
      description: |-
        Poté, co `finish` odpověděl `needsUsername`: vytvoří účet se zvoleným uživatelským jménem (platí pravidla registrace) a přihlásí ho. Účet nemá heslo: `hasPassword` je `false` a heslo mu nastaví „Zapomenuté heslo?“ (`POST /auth/password/forgot`).

        **Limit:** `auth` (včetně jeho počítání pro IPv6 /48).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Účet je vytvořen a přihlášen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: tento server přihlášení přes Google nenabízí.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (uživatelské jméno má některý účet, nebo ho drží čekající registrace jiné adresy), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: neznámý, použitý nebo vypršelý tiket.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáze zůstala zamčená), `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Vypsat přihlášená zařízení
      description: |-
        Aktivní relace účtu (přihlášená zařízení), naposledy použité jako první. `current` označuje relaci, ze které požadavek přichází. `lastSeenAt` se aktualizuje nejvýše jednou za 5 minut (když server výrazně nestíhá, i později); `expiresAt` je absolutní konec a limit nečinnosti může relaci ukončit dříve.

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aktivní relace.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sessions` nebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáze zůstala zamčená), `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Odhlásit jedno zařízení
      description: |-
        Odhlásí jednu relaci účtu; odhlásit lze i tu aktuální. WebSocket otevřený s touto relací se zavře. Bez těla (nebo `{}`).

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Relace je odhlášena.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: jiné tělo než `{}`, nebo `id`, které není v platném kódování URL; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: tento účet nemá aktivní relaci s tímto ID.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sessions` nebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáze zůstala zamčená), `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Získat účet, jeho ratingy a aktivní sankce
      description: |-
        Účet tak, jak ho vidí jeho hráč: pohled na účet (také `user` v každé odpovědi na přihlášení), jeden záznam ratingu pro každou kategorii, ve které hráč odehrál partie na rating, aktivní sankce a pozastavení účtu. Úroveň integrity podle anti-cheatu se nikdy nezobrazuje.

        **Limit:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Účet.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`, nebo `invalid_token` (také když byl účet smazán).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `account` nebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáze zůstala zamčená), `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Přijímat nebo odmítat přímé výzvy
      description: |-
        Nastaví, zda ostatní hráči smějí tohoto hráče vyzvat podle jména. S `none` se přímé výzvy odmítají: vyzyvatel se dozví, že hráč není k dispozici. Bez opětovné autentizace.

        **Limit:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: Nyní platné předvolby.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `account` nebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáze zůstala zamčená), `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Změnit heslo
      description: |-
        Změní heslo. Je potřeba současné heslo, ale žádný druhý faktor, ani při zapnutém dvoufázovém ověření. Nové heslo se řídí pravidly registrace (kontroluje se až po současném hesle).

        Změna má v jedné transakci (buď všechny, nebo žádný) tyto účinky: zneplatní všechny ostatní relace (tato zůstane přihlášená), zruší čekající změnu e-mailu, odkazy pro obnovení hesla k účtu přestanou fungovat a vlastníkovi odejde e-mail.

        **Opětovná autentizace:** jen heslo. **Limity:** `reauth`, potom `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Heslo je změněno.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (účet jen s přihlášením přes Google), `weak_password` (s `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: nesprávné současné heslo, nebo obnovení či změna hesla, ke které došlo během kontroly požadavku.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neúspěšné opětovné autentizace účtu), nebo `rate_limited` (limit `reauth` nebo `reauth_user`, kvóta účtu, fronta hashování hesel).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: fronta hashování hesel, nebo databáze zůstala zamčená (`retryAfter: 1`, nic se nezměnilo). `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Začít zapínat dvoufázové ověření
      description: |-
        Uloží nový čekající tajný klíč pro ověřovací aplikaci, který nahradí případný dřívější čekající klíč, a vrátí ho pro tuto aplikaci (jako text a jako URI `otpauth://` k zobrazení v podobě QR kódu). Dvoufázové ověření ještě není zapnuté: zapne ho `POST /account/mfa/totp/enable` s kódem z tohoto tajného klíče.

        **Opětovná autentizace:** jen heslo. **Limity:** `reauth`, potom `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Čekající tajný klíč.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (účet jen s přihlášením přes Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (kontroluje se před heslem).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neúspěšné opětovné autentizace účtu), nebo `rate_limited` (limit `reauth` nebo `reauth_user`, kvóta účtu, fronta hashování hesel).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (fronta hashování hesel, nebo databáze zůstala zamčená), `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Dokončit zapnutí dvoufázového ověření a získat záložní kódy
      description: |-
        Zapne dvoufázové ověření kódem z čekajícího tajného klíče (přesně 6 číslic). Heslo se tu nepožaduje; bylo zadáno při nastavení. Odpověď obsahuje 10 záložních kódů, které se zobrazí jen tentokrát.

        **Limity:** `reauth`, potom `reauth_user`; nesprávný kód se počítá mezi neúspěšné opětovné autentizace účtu.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Dvoufázové ověření je zapnuté.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` nemá přesně 6 číslic, nebo tělo porušuje schéma; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: nesprávný kód (zkontrolujte čas na zařízení).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: žádný čekající tajný klíč (nejprve zavolejte `POST /account/mfa/totp/setup`).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neúspěšné opětovné autentizace účtu), nebo `rate_limited` (limit `reauth` nebo `reauth_user`, kvóta účtu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáze zůstala zamčená), `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: Vypnout dvoufázové ověření
      description: |-
        Vypne dvoufázové ověření. Tajný klíč i záložní kódy se smažou a vlastník dostane e-mail.

        **Opětovná autentizace:** heslo a kód z ověřovací aplikace nebo záložní kód (je povinné jedno z `code` nebo `recoveryCode`). **Limity:** `reauth`, potom `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Dvoufázové ověření je vypnuté.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (účet jen s přihlášením přes Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required` (ani `code`, ani `recoveryCode`; kontroluje se před heslem), `invalid_password`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
