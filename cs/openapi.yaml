    description: Vše, co server o účtu uchovává, jako jeden soubor JSON.
  - name: account-deletion
    x-displayName: Smazání účtu
    description: Trvalé smazání účtu.
  - name: game-history
    x-displayName: Historie partií
    description: Vlastní partie přihlášeného hráče, s filtry a stránkováním.
  - name: games
    x-displayName: Partie a PGN
    description: |-
      Záznamy partií s jejich tahy a časy na hodinách a jejich soubory PGN.

      **Kódy partií.** `status`: 1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (ukládají se jen skončené partie). `result`: `1-0`, `0-1`, `1/2-1/2` nebo `*` (zrušená). `reason` s jeho názvem (`termination`) a slovy, kterými končí text tahů v souboru PGN (v souboru anglicky, níže s českým překladem); kódy 7, 14 a 21 jsou remízy (hráč, kterému vypršel čas, který se vzdal nebo opustil partii, stál proti soupeři, který nemohl dát mat: FIDE 6.9 a 5.1.2; pravidlo uvádí `DESIGN.md` 6.3), a server nikdy neukončí partii kódy 4 a 13 (patří do společného seznamu důvodů):

      | Kód | `termination` | Slova v PGN |
      |---|---|---|
      | 1 | `Checkmate` | Checkmate (mat) |
      | 2 | `Resignation` | Resignation (vzdání se) |
      | 3 | `Timeout` | Loss on time (prohra na čas) |
      | 4 | `IllegalMoves` | Second illegal move (forfeit) (druhý nepřípustný tah, kontumace) |
      | 5 | `Stalemate` | Stalemate (pat) |
      | 6 | `InsufficientMaterial` | Dead position (insufficient material) (mrtvá pozice, nedostatečný materiál) |
      | 7 | `TimeoutVsInsufficient` | Flag fall, but the opponent cannot checkmate (překročení času, ale soupeř nemůže dát mat) |
      | 8 | `FivefoldRepetition` | Fivefold repetition (pětinásobné opakování pozice) |
      | 9 | `SeventyFiveMoves` | 75-move rule (pravidlo 75 tahů) |
      | 10 | `ThreefoldClaim` | Threefold repetition (claimed) (trojí opakování pozice, reklamováno) |
      | 11 | `FiftyMoveClaim` | 50-move rule (claimed) (pravidlo 50 tahů, reklamováno) |
      | 12 | `Agreement` | Draw by agreement (remíza dohodou) |
      | 13 | `IllegalMovesVsInsufficient` | Second illegal move, but the opponent cannot checkmate (druhý nepřípustný tah, ale soupeř nemůže dát mat) |
      | 14 | `ResignationVsInsufficient` | Resignation, but the opponent cannot checkmate (vzdání se, ale soupeř nemůže dát mat) |
      | 20 | `Abandonment` | Abandoned (disconnected for too long) (opuštění partie, odpojení na příliš dlouho) |
      | 21 | `AbandonmentVsInsufficient` | Abandoned, but the opponent cannot checkmate (opuštění partie, ale soupeř nemůže dát mat) |
      | 22 | `Aborted` | Game aborted (partie zrušena) |
      | 23 | `NoShow` | Aborted: first move not played in time (zrušeno: první tah nebyl zahrán včas) |
      | 24 | `Forfeit` | Forfeit (fair play violation) (kontumace, porušení fair play) |
      | 25 | `ServerAborted` | Aborted by the server (zrušeno serverem) |
      | 26 | `BothDisconnected` | Aborted: both players disconnected (zrušeno: oba hráči se odpojili) |

      Kód 14 je nový v minoritní verzi protokolu 1: klient napsaný před ní by měl neznámý kód zobrazit jako prosté ukončení partie s jejím `result`.
  - name: gifs
    x-displayName: Animované GIFy
    description: |-
      Partie jako animovaný GIF k uložení nebo ke sdílení: šachovnice viděná shora, jeden snímek na každou pozici od výchozí po konečnou, jména a ratingy hráčů nad šachovnicí, poslední tah pod ní a na posledním snímku výsledek a způsob, jakým partie skončila.

      **Náklady, mezipaměť a kvóty.** GIF se vytváří ve vlastním vykreslovacím vlákně, nikdy ve vláknech, která obsluhují partie, a s nejnižší prioritou CPU: `GIF_THREADS` vláken (ve výchozím nastavení `WORKERS`), spuštěných s prvním GIFem a zastavených po minutě bez GIFu. Až `GIF_QUEUE_MAX` (4 × `WORKERS`) GIFů čeká na vlákno, každý nejvýše `GIF_QUEUE_TIMEOUT_MS` (10 s); vykreslení smí trvat `GIF_RENDER_TIMEOUT_MS` (30 s). Server uchovává vytvořené GIFy v mezipaměti o velikosti `GIF_CACHE_MB` MB (32 × `WORKERS`), přičemž jako první odcházejí nejdéle nepoužité; GIF z mezipaměti nebo GIF, který se právě vytváří pro jiný požadavek, nestojí žádné vykreslení. Klíč mezipaměti zahrnuje vše, co mění obrázek, včetně jmen.

      Každý požadavek se započítává do `gif` (30 za minutu na hráče pro oba endpointy). GIF, který se musí vytvořit, se navíc započítává do limitů vykreslování: na hráče `GIF_USER_RENDERS_PER_MIN` (4) za minutu a `GIF_USER_RENDERS_PER_HOUR` (30) za hodinu; na klienta, všechny jeho účty dohromady, `GIF_IP_RENDERS_PER_MIN` (12) za minutu a `GIF_IP_RENDERS_PER_HOUR` (120) za hodinu, a 3krát tolik na IPv6 /48. Klient by si měl stažený soubor ponechat, místo aby o něj žádal znovu, a po 429 nebo 503 počkat `retryAfter`.

      Velikosti: `small` (pole 32 px: 284 × 350 pixelů), `medium` (48 px: 424 × 515), `large` (72 px: 628 × 762); bez souřadnic 268 × 342, 400 × 503 a 600 × 748. Výchozí pozice zůstane zobrazená alespoň 1 s (případně po dobu zpoždění, je-li delší), konečná pozice 3 s a GIF se přehrává ve smyčce; po prvním snímku se ukládá jen ta část obrázku, která se mění. Partie o 40 tazích zabere asi 135, 205 a 325 KiB (small, medium, large), partie o 150 tazích 0,5, 0,8 a 1,2 MiB.
