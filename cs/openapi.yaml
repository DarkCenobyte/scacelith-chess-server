        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Druh sankce.
        reason:
          type:
            - string
            - 'null'
          description: Uvedený důvod, pokud nějaký je.
        startsAt:
          type: integer
          format: int64
          description: Začátek (ms od epochy Unixu).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Konec (ms od epochy Unixu), `null`, když je sankce trvalá.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Konec pozastavení (ms od epochy Unixu), `null`, když je trvalé.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` pro přijímání přímých výzev podle jména, `none` pro jejich odmítání.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Současné heslo.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Nové heslo; platí pravidla pro hesla z registrace.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Heslo účtu.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Kód z čekajícího tajného klíče, přesně 6 číslic.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Heslo účtu.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Nepovinné; nutné při dvoufázovém ověření (nebo `recoveryCode`). Kód z ověřovací aplikace, nebo záložní kód.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Nepovinné. Záložní kód (`xxxx-xxxx-xx`; na velikosti písmen, mezerách a pomlčkách nezáleží).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Heslo účtu.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Kód z ověřovací aplikace (záložní kód se odmítne).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Nová adresa; ořízne se o mezery na začátku a na konci, převede na malá písmena a pak se kontroluje stejně jako adresa při registraci.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Heslo účtu.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Nepovinné; nutné při dvoufázovém ověření (nebo `recoveryCode`). Kód z ověřovací aplikace, nebo záložní kód.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Nepovinné. Záložní kód.
    TotpSetup:
      type: object
      description: Čekající tajný klíč pro ověřovací aplikaci.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Tajný klíč v base32 k zadání do aplikace.
        uri:
          type: string
          format: uri
          description: URI `otpauth://totp/...` k zobrazení jako QR kód.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Počet sekund na jeden krok.
    RecoveryCodeList:
      type: array
      description: 10 záložních kódů, zobrazených jen tentokrát. Každý funguje jednou.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Jedna strana partie.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Jméno v záznamu partie (`deleted#<id>` u smazaného účtu).
        rating:
          type:
            - integer
            - 'null'
          description: Rating na začátku, `null`, když není znám.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Rating po partii. Partie na rating ho má vždy; `null` jen u partie, která se do ratingů nezapočítává (bez ratingu, s vlastním tempem, zrušená).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Změna ratingu, `0`, když pravidla ratingu nechají rating beze změny (nulové skóre podle pravidel FIDE, soupeř bez ratingu, první partie hráče bez ratingu); `null` stejně jako `ratingAfter`.
    GameSummary:
      type: object
      description: Souhrn uložené partie.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: ID partie.
        category:
          type: string
          description: ID oficiální kategorie (`3+2`), nebo `custom`.
        rated:
          type: boolean
          description: Zda se partie započítává do ratingů.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Tempo hry v sekundách (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (viz kódy partií).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Kód důvodu ukončení (viz kódy partií).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Výsledek, `*` u zrušené partie.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Počet půltahů.
        startedAt:
          type: integer
          format: int64
          description: Začátek (ms od epochy Unixu).
        endedAt:
          type: integer
          format: int64
          description: Konec (ms od epochy Unixu).
    Termination:
      type: string
      description: Název důvodu ukončení (viz kódy partií); `Unknown` u kódu, který protokol nezná.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Souhrn partie z pohledu jednoho hráče.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Strana hráče.
    HistoryGameSummary:
      description: Partie z historie přihlášeného hráče.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Základní čas v milisekundách.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Přídavek v milisekundách.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: Výsledek z pohledu hráče.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Partie na stránce, od nejnovějších.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: ID, které je třeba předat jako `before` pro další stránku, nebo `null` na poslední stránce.
        total:
          type: integer
          minimum: 0
          description: Počet partií odpovídajících filtru napříč všemi stránkami.
    MoveRecord:
      type: object
      description: Jeden půltah partie.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: Tah v notaci UCI, při proměně s přidaným `n`, `b`, `r` nebo `q`.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Čas započítaný za tah (ms), `null`, když ho záznam nemá.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Čas na hodinách táhnoucího hráče po tahu (ms), `null`, když ho záznam nemá.
    PgnTagsView:
      type: object
      description: Hlavní značky PGN pro zobrazení. `Termination` je zde název důvodu ukončení; soubor PGN používá standardní hodnoty PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` nebo `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: Datum začátku v UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Rating na začátku, nebo `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Rating na začátku, nebo `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Záznam partie s tahy a stavem hodin. Má pole souhrnu partie, bez `color` a `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Základní čas v milisekundách.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Přídavek v milisekundách.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: Název hodnoty `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: ID partie, jejíž odvetou tato partie je, nebo `null`.
            moves:
              type: array
              description: Jedna položka na každý půltah.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Jen když hráč tokenu tuto partii hrál; jeho strana.
            reportable:
              type: boolean
              description: Jen když hráč tokenu tuto partii hrál; `true`, když by `POST /reports` teď přijal hlášení soupeře za tuto partii (partie skončila během posledních 7 dní, denní kvóta není vyčerpaná a soupeř ještě nebyl za tuto partii nahlášen).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Uživatelské jméno tak, jak ho hráč zapsal.
        createdAt:
          type: integer
          format: int64
          description: Kdy byl účet vytvořen (ms od epochy Unixu).
        ratings:
          type: array
          description: Jen oficiální kategorie, v pořadí serveru.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Všechny uložené partie včetně partií bez ratingu a zrušených.
            rated:
              type: integer
              minimum: 0
              description: Partie na rating, sečtené přes záznamy ratingu.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Uživatelské jméno tak, jak ho hráč zapsal.
        games:
          type: array
          description: Partie na stránce, od nejnovějších.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: ID poslední partie vždy, když je stránka plná (další stránka pak může být prázdná), jinak `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: ID kategorie.
        minGames:
          type: integer
          minimum: 0
          description: Počet započítaných partií, který záznam potřebuje, aby byl uveden (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Kdy byl žebříček vypočten (ms od epochy Unixu).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: Text PGN, nejvýše 65 536 bajtů v UTF-8. Použije se jen první partie.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Nepovinné. Velikost obrázku.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Nepovinné. Strana dole na šachovnici.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Nepovinné. Milisekundy na tah, číslo JSON s celočíselnou hodnotou.
        coords:
          type: boolean
          default: true
          description: Nepovinné. Zda se kolem šachovnice vykreslí písmena sloupců a čísla řad.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Partie, jako celé číslo nebo řetězec o 1 až 16 číslicích.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Uživatelské jméno soupeře, jak je uvedeno v záznamu partie nebo jak zní teď, bez ohledu na velikost písmen. Nesmí být prázdné.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Čeho se hlášení týká.
        comment:
          type:
            - string
            - 'null'
          description: Nepovinné. Nejvýše 500 znaků po odstranění řídicích znaků (kromě tabulátoru a odřádkování) a oříznutí mezer na začátku a na konci.
    AccountExport:
      type: object
      description: Vše, co server o účtu uchovává (časy v ms od epochy Unixu).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Kdy byl export vytvořen.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Co soubor obsahuje a co vynechává, jednoduchou angličtinou pro hráče.
          items:
            type: string
        account:
          description: Pohled na účet z `GET /account/me`, s `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Adresa propojeného účtu Google, nebo `null`.
        ratings:
          type: array
          description: Úplné záznamy ratingu.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Body ratingu vrácené poté, co byl soupeř přistižen při podvádění, sečtené po dnech (UTC) a kategoriích, od nejnovějších. Neuvádějí se partie ani podvodníci.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Všechny uložené relace, od nejnovějších, bez jakéhokoli tokenu. Pravidelné mazání podle doby uchovávání odstraní vypršelou relaci a odhlášenou relaci den po odhlášení.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Bezpečnostní události, od nejnovějších, uchovávané `RETENTION_SECURITY_DAYS` dní.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Všechny sankce včetně zrušených. Jméno moderátora se nikdy neuvádí.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Události chování zaznamenané u hráčových opuštěných, zrušených a nenastoupených partií, uchovávané 30 dní.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Hlášení, která hráč podal.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Počet partií.
            list:
              type: array
              description: Všechny partie od nejnovějších jako souhrny z `GET /account/games`. Tahy jsou v `GET /games/{id}` a PGN v `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Úplný záznam ratingu.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Zda už hráč opustil úvodní fázi bez ratingu.
            countedGames:
              type: integer
              minimum: 0
              description: Partie, které se započítaly do ratingu.
            updatedAt:
              type: integer
              format: int64
              description: Kdy se záznam naposledy změnil.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: 00:00 UTC daného dne (ms od epochy Unixu).
        category:
          type: string
        points:
          type: integer
          description: Body vrácené toho dne v dané kategorii.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Kdy byla relace odhlášena, nebo `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Adresa, ze které proběhlo přihlášení, vymazaná po `RETENTION_IP_DAYS` dnech.
    SecurityEvent:
      type: object
      description: |-
        Bezpečnostní událost. `ip` se uvádí jen u akcí provedených po přihlášení, s heslem účtu (a druhým faktorem) nebo pomocí odkazu zaslaného na jeho adresu: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` a `account_exported`; každý jiný druh má `ip: null` a `ip` se vymaže po `RETENTION_IP_DAYS` dnech.

        `detail` uchovává jen tato pole: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` a `method` (`password` nebo `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` a `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Událost `moderator_action` uchovává jen `{ action }`, a to u akcí `ban`, `unban`, `reset_mfa`, `verify_email` a `revoke_sessions` (ostatní akce moderátorů se vynechávají). Každý jiný druh má `detail: null`. Události `rating_refund` se vynechávají: jejich body jsou v `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Druh události (`login`, `password_changed`…).
        at:
          type: integer
          format: int64
          description: Kdy k ní došlo.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: Současné veřejné jméno nahlášeného hráče.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Zda je hlášení stále otevřené (zda byl nahlášený hráč sankcionován, se neuvádí).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Token odkazu z e-mailu (skryté pole formuláře stránky).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Token odkazu pro obnovení hesla (skryté pole formuláře).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Nové heslo; platí pravidla pro hesla z registrace.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Nové heslo znovu; musí být stejné.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: Stránka HTML v UTF-8 (`text/html; charset=utf-8`), bez JavaScriptu a externích zdrojů.
