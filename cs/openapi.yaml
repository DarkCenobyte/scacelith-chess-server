  - name: pages
    x-displayName: HTML stránky
    description: |-
      Stránky pro prohlížeč, otevírané z odkazů v e-mailech. Jejich odkazy vedou na `https://<SERVER_PUBLIC_HOST>` (s `:<PUBLIC_API_PORT>`, pokud není 443), mimo `/api/v1`.

      - Stránky nespouštějí žádný JavaScript a nenačítají žádné externí zdroje. Jsou poskytovány s `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'`.
      - `GET` jen zobrazí tlačítko nebo formulář, aby odkaz nespotřeboval poštovní skener, který ho otevře. Změna proběhne při `POST`: formulář odeslaný jako `application/x-www-form-urlencoded` (přijímá se i tělo JSON) s tokenem odkazu ve skrytém poli. Pole uvedené dvakrát se odmítá.
      - Chyby (limity počtu požadavků, neplatná pole) jsou také HTML stránky, s nadpisem „Request refused“ (požadavek odmítnut), nebo od 500 výš „Server error“ (chyba serveru). Jen selhání zjištěná ještě před přiřazením stránky (příliš dlouhý nebo chybně utvořený cíl požadavku, vrstva podle adresy) mají odpověď v JSON.
