      Živost (liveness) a připravenost (readiness) serveru pro monitorování. Tyto endpointy odpovídají na portu API ještě před autentizací a všemi limity endpointů, ale jako každý požadavek spotřebují žeton vrstvy podle adresy; monitorovacího hostitele lze uvést v `ABUSE_EXEMPT`. U každého endpointu fungují obě cesty: v kořeni serveru i pod `/api/v1`.

      Port metrik má vlastní endpointy kontroly stavu, popsané v úvodu.
  - name: auth
    x-displayName: Registrace a přihlášení
    description: |-
      Vytvoření účtu, přihlášení heslem (a druhým faktorem), potvrzovací e-maily a e-maily pro obnovení hesla.

      `POST /auth/login`, `POST /auth/login/mfa`, `POST /auth/sso/google/finish`, `POST /auth/sso/google/link` a `POST /auth/sso/complete` vracejí relaci `{ token, expiresAt, user }` (nebo, u prvních z nich, druhý krok).
  - name: google-sign-in
    x-displayName: Přihlášení přes Google
    description: |-
      K dispozici, když `GET /info` uvádí `sso.google: true`; jinak každý z níže uvedených endpointů odpoví 404 `sso_disabled`. Web se přihlašuje stejně, svým vlastním klientem, když je `sso.googleWeb` true (níže, **Na webu**). Hra se přihlašuje přes systémový prohlížeč tokem pro nainstalované aplikace podle RFC 8252 (klient typu „Desktop app“, aplikace pro počítač): Google pošle prohlížeč zpět na naslouchací proces hry na `127.0.0.1`, nikdy na tento server, a hra nikdy nevidí přihlašovací údaje Google.

      1. Klient naslouchá na `127.0.0.1:0` (port vybere systém) a vytvoří dvojici PKCE: `codeVerifier` o délce 43 až 128 znaků `[A-Za-z0-9._~-]` a `codeChallenge = BASE64URL(SHA-256(codeVerifier))`, který má 43 znaků a žádné doplnění (padding).
      2. `POST /auth/sso/google/start` s výzvou a portem vrátí URL Google a `state` pokusu. Klient URL zkontroluje (viz níže) a otevře ji v prohlížeči.
      3. Google pošle prohlížeč na `http://127.0.0.1:<port>/oauth2/google/<tag>?code=...&state=...`. Klient přijme jen `state` z odpovědi na start a po přesměrování s `error=` nic neposílá.
      4. `POST /auth/sso/google/finish` s ID pokusu, `codeVerifier`, `state` a `code` (a `iss`, pokud ho Google poslal).
      5. Odpovědí je relace, krok dvoufázového ověření (pokračujte přes `POST /auth/login/mfa`), `needsUsername` pro nového hráče (pokračujte přes `POST /auth/sso/complete`), nebo `needsPassword`, když adresu používá účet s heslem (pokračujte přes `POST /auth/sso/google/link`).

      **Značka původu.** URI přesměrování nese značku serveru, který hráč přidal, aby hra odmítla URL, kterou jiný server získal pro své vlastní hráče. Původ je hostitel malými písmeny (literál IPv6 v hranatých závorkách), `:` a desítkový port API, vždy vypsaný, včetně 443: server použije `SERVER_PUBLIC_HOST` a svůj veřejný port API, hra adresu, ke které je připojena. Značka je prvních 22 znaků base64url (bez doplnění) z SHA-256(UTF-8 `"scacelith-sso-origin-v1\n"` + původ). URI přesměrování je `"http://127.0.0.1:" + port + "/oauth2/google/" + tag`: vždy literál IPv4 a port naslouchacího procesu hry (1024 až 65535). Server od klienta nikdy nepřebírá URI, hostitele ani cestu.

      | Původ | Značka |
      |---|---|
      | `play.scacelith.example:443` | `IhcScoV7eDOzTEcSnqPUPt` |
      | `localhost:8443` | `TFGx7zQ_8QlGZW5zpqznCr` |
      | `[::1]:8443` | `XToJm0DG5PjciEVmZa9Cho` |
      | `127.0.0.1:50443` | `3r653wM5ZjYsHcAJljmCwY` |

      Přihlášení přes Google proto funguje jen hráčům, kteří server přidali přesně pod `SERVER_PUBLIC_HOST` s jeho veřejným portem API.

      **Co hra kontroluje, než otevře prohlížeč.** `authUrl` začíná přesně `https://accounts.google.com/o/oauth2/v2/auth?`, je to tisknutelné ASCII kratší než 4096 znaků a její dotaz obsahuje právě jeden `response_type=code`, právě jeden `redirect_uri` rovný URI, které hra spočítá ze svého portu a své značky původu, právě jeden `state` rovný `state` z odpovědi, `code_challenge_method=S256` a `code_challenge` o 43 znacích. Jinak hra zastaví svůj naslouchací proces a nic neotevře. `finish` a `link` posílá jen serveru, který odpověděl na `start`.

      **Na webu.** Web (ten oficiální: <https://scacelith.com/>) se přihlašuje klientem typu „Web application“ (webová aplikace) téhož projektu Google (`GOOGLE_WEB_CLIENT_ID`). Google pošle prohlížeč zpět na jednu stránku webu, kterou nastavil provozovatel (`GOOGLE_WEB_REDIRECT_URI`, zapsaná u klienta v seznamu „Authorized redirect URIs“, tj. autorizovaných URI přesměrování), a tato stránka pošle kód na `finish`; ani zde server od klienta nepřebírá žádné URI přesměrování.

      1. Stránka vytvoří dvojici PKCE jako výše, uchová verifikátor v kartě (`sessionStorage`) a pošle `POST /auth/sso/google/web/start` s výzvou.
      2. Zkontroluje `authUrl` stejně jako hra, jen s tím rozdílem, že její `redirect_uri` musí být stránkou vlastního původu webu, a pak na ni přejde. Nenačítá se žádný skript Google.
      3. Google pošle prohlížeč na `GOOGLE_WEB_REDIRECT_URI?code=...&state=...`. Stránka přijme jen `state` z odpovědi na start a po přesměrování s `error=` nic neposílá.
      4. `finish`, `link` a `complete` následují jako u hry. Pokus si pamatuje, že ho zahájil web: kód se vymění s klientem a stránkou webu a ID token musí uvádět tohoto klienta (kód nebo ID token klienta hry selže s 502 `sso_failed`, a naopak).

      Účet Google vede ke stejnému účtu Scacelith ze hry i z webu: propojení uchovává subjekt Google (`sub`), který identifikuje účet Google bez ohledu na klienta. Původ webu musí být v `CORS_ORIGINS` (jinak `check-config` varuje).

      **K jakému účtu přihlášení přes Google vede:** k účtu už propojenému s tímto účtem Google; jinak k aktivnímu účtu s adresou, kterou Google potvrdil (má-li heslo, `finish` odpoví `needsPassword` a propojení se uloží teprve tehdy, když projde jeho heslo a pak jeho druhý faktor, je-li zapnutý; bez hesla 409 `sso_account_exists`); jinak k novému účtu (`needsUsername`). Účet Google se nikdy nepropojí s existujícím účtem jen na základě adresy. Na adresu účtu přijde e-mail, když přihlášení přes Google vytvoří účet a když je přidáno k existujícímu účtu.
