  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Stáhnout partii jako soubor PGN
      description: |-
        Tatáž partie jako soubor PGN: jedna partie s konci řádků `\n` a textem tahů v řádcích kratších než 80 sloupců. Odpověď je stejná s tokenem i bez něj.

        Značky v tomto pořadí: `Event` (`<SERVER_NAME> rated <category>` nebo `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (datum začátku v UTC), `Round`, `White`, `Black`, `Result` (`*` u zrušené partie), `UTCDate` a `UTCTime` (začátek), `WhiteElo` a `BlackElo` (ratingy na začátku, nebo `-`), `WhiteRatingDiff` a `BlackRatingDiff` (změny, například `+10` a `-10`, v každé partii na rating, `+0`, když pravidla ratingu nechají rating beze změny; partie bez ratingu, s vlastním tempem nebo zrušená nemá ani jednu z nich), `TimeControl` (v sekundách), `Termination` (standardní hodnota PGN: `normal`; `time forfeit`, překročení času, i když partie skončí remízou; `abandoned`; `rules infraction`, druhý nepřípustný tah nebo kontumace kvůli fair play; `unterminated`, zrušená partie), `PlyCount`, `ScacelithGameId` (desítkové ID).

        Každý tah nese `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: čas na hodinách táhnoucího hráče po tahu a čas, který se mu za tah započítal, v desetinách sekundy (oříznuto). Hodnota chybí, když ji záznam nemá. Po posledním tahu následuje slovy důvod ukončení, potom výsledek.

        **Limit:** `public_read` (s tokenem na hráče, bez něj na klienta).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Soubor PGN.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'Text PGN v UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: není kladné celé číslo o nejvýše 16 číslicích (menší než 2^53); `invalid_request`: neplatné kódování URL.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: byl poslán token a není platný.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: taková partie neexistuje.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `public_read` nebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: mimo jiné tehdy, když uložené tahy nelze přehrát až k uloženému konci (server to zaznamená do logu).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (databáze zůstala zamčená; `retryAfter: 1` v těle, bez hlavičky `Retry-After`), `server_busy` (vyhledání relace narazilo na zamčenou databázi), `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Stáhnout partii z tohoto serveru jako animovaný GIF
      description: |-
        Partie jako animovaný GIF. Jména a ratingy jsou ze záznamu partie (ratingy na začátku, smazaný účet jako `deleted#<id>`), stejně jako výsledek a způsob ukončení (`Resignation`, `Loss on time`…).

        Kontroly probíhají v tomto pořadí: `gif_disabled`, volby obrázku (`size`, `orientation`, `delay`, `coords`), ID partie, partie, její délka.

        **Vyžaduje se relace:** kvóty se počítají na účet. **Limity:** `gif` u každého požadavku; `gif_user_min`, `gif_user_hour`, `gif_ip_min` a `gif_ip_hour` jen tehdy, když se GIF musí vytvořit (viz popis sekce). **Časový limit:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 sekund (ve výchozím nastavení 45 sekund).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 'Velikost obrázku: `small` (pole 32 px), `medium` (48 px) nebo `large` (72 px).'
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Strana dole na šachovnici.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Milisekundy na tah (1 až 6 desítkových číslic).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Zda se kolem šachovnice vykreslí písmena sloupců a čísla řad (`1`), nebo ne (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` s `field` (`size`, `orientation`, `delay` nebo `coords`): hodnota mimo povolené. `invalid_game_id`. `invalid_request`: neplatné kódování URL.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: taková partie neexistuje. `gif_disabled`: server má GIFy vypnuté (`GIF_ENABLED=false`; žeton limitu `gif` se vrátí).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `gif`, limit vykreslování, nebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF se nepodařilo vytvořit (server do logu zaznamená důvod). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` s `retryAfter` (3 až 10 sekund) a `Retry-After`: fronta vykreslování je plná, nebo GIF čekal `GIF_QUEUE_TIMEOUT_MS` (10 sekund) na volné vlákno; všechny žetony limitů, které požadavek spotřeboval, se vrátí. `busy`: databáze zůstala zamčená (`retryAfter: 1` jen v těle). `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Vytvořit animovaný GIF libovolné partie poslané jako PGN
      description: |-
        Stejný obrázek jako `GET /games/{id}/gif` pro libovolnou partii poslanou jako text PGN: partii uloženou hrou, export z jiného webu, partii napsanou ručně. Použije se jen první partie z textu.

        - Čtečka PGN přijímá to, co přijímá čtečka samotné hry: každé PGN, které tento server zapíše, i běžné exporty jiných webů (komentáře, varianty, NAG a anotace hodin se přeskakují; čísla tahů a SAN se čtou benevolentně; značka `FEN` určuje výchozí pozici, pokud `SetUp` není `"0"`).
        - Jména a ratingy pocházejí ze značek `White`, `Black`, `WhiteElo` a `BlackElo`. Písmena s diakritikou o ni přijdou, ostatní znaky mimo tisknutelné ASCII se změní na `?` a dlouhá jména se zkrátí (48 znaků). Výsledek pochází ze značky `Result`, jinak z konce textu tahů. Značka `Termination` se zobrazí, pokud není `normal`: o konci partie pak vypovídá koncová pozice (mat, pat).
        - Tento endpoint si tělo kontroluje sám: na neznámé pole nebo chybějící či neřetězcové `pgn` odpoví 400 `invalid_request` s `field`; na chybnou volbu 400 `invalid_option` (`delayMs` musí být číslo JSON, `coords` boolean; `null` se odmítá).

        **Vyžaduje se relace:** kvóty se počítají na účet. **Limity:** jako u `GET /games/{id}/gif`. **Limit velikosti těla:** 135 168 bajtů bez ohledu na `HTTP_BODY_LIMIT` (PGN jako řetězec JSON včetně escape sekvencí). **Časový limit:** ve výchozím nastavení 45 sekund.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Krátká ručně zadaná partie, bez souřadnic
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: Soubor PGN se všemi volbami
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` s `field` (neznámé pole, nebo `pgn` chybí či není řetězec; bez `field`, když tělo není objekt); `invalid_json`; `invalid_option` s `field` (`size`, `orientation`, `delayMs` nebo `coords`); `invalid_pgn` s `line` a `column` (od 1, sloupce ve znacích) a `message` čtečky: nepřípustný nebo nejednoznačný tah, poškozená značka, neznámá šachová varianta, více než 65 536 bajtů.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: server má GIFy vypnuté (`GIF_ENABLED=false`; žeton limitu `gif` se vrátí).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: tělo větší než 135 168 bajtů.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `gif`, limit vykreslování, nebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF se nepodařilo vytvořit (server do logu zaznamená důvod). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` s `retryAfter` (3 až 10 sekund) a `Retry-After`: fronta vykreslování je plná, nebo GIF čekal na volné vlákno příliš dlouho; všechny žetony limitů, které požadavek spotřeboval, se vrátí. `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
