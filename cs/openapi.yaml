  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: Změnit e-mailovou adresu
      description: |-
        Změní e-mailovou adresu účtu. `newEmail` se ořízne o mezery na začátku a na konci, převede na malá písmena a pak se kontroluje stejně jako adresa při registraci.

        **S potvrzením e-mailem** (výchozí): 202 `verification_sent`. Na novou adresu odejde odkaz platný 24 hodin; otevírá `/confirm-email-change` a adresa se změní, teprve až hráč stiskne tlačítko na této stránce. Do té doby `GET /account/me` ukazuje novou adresu jako `pendingEmail`. Nový požadavek nahradí ten čekající; změna nebo obnovení hesla ho zruší. Na danou novou adresu odejde nejvýše jeden odkaz za 5 minut, ať o něj žádá kdokoli (požadavek na změnu, která už čeká, ponechá dříve odeslaný odkaz, který zůstává platný); odpověď je stejná. Současná adresa dostane upozornění, že byla vyžádána změna na maskovanou adresu (`a***@example.org`). Odpověď i `pendingEmail` jsou stejné, když novou adresu už používá jiný účet: odkaz se pak neodešle, takže se tato změna nikdy nedokončí, a vlastník té adresy místo toho dostane upozornění (nejvýše jedno za hodinu).

        Po potvrzení odkazu se adresa změní a platí za potvrzenou, zařízení zůstanou přihlášená, dříve odeslané odkazy (potvrzení, obnovení hesla, jiné změny) přestanou fungovat a na dosavadní adresu přijde zpráva s maskovanou novou adresou.

        **Bez potvrzení e-mailem** (`REQUIRE_EMAIL_VERIFICATION=false`): adresa se změní hned (200 `email_changed`) a na dosavadní adresu přijde zpráva. Pokud adresu používá jiný účet, odpověď je 409 `email_taken` a vlastník té adresy dostane upozornění.

        **Opětovná autentizace:** heslo a při dvoufázovém ověření kód z ověřovací aplikace nebo záložní kód. `invalid_email` a `same_email` se kontrolují před heslem, takže se nepočítají jako neúspěšný pokus. **Limity:** `reauth`, potom `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Adresa se změnila hned (na tomto serveru bez potvrzení e-mailem).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: Nová adresa, tak jak je uložená.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: Na novou adresu byl odeslán potvrzovací odkaz (nebo adresa patří jinému účtu; odpověď to neprozradí).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email` (současná adresa účtu), `password_not_set` (účet jen s přihlášením přes Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` (také když požadavek předběhla změna nebo obnovení hesla: žádný odkaz se neodešle), `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: jen bez potvrzení e-mailem.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neúspěšné opětovné autentizace, nebo příliš mnoho zkoušených kódů na tomto účtu), nebo `rate_limited` (limit `reauth` nebo `reauth_user`, kvóta účtu, fronta hashování hesel).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: fronta hashování hesel, nebo databáze zůstala zamčená (`retryAfter: 1`: nic se nezměnilo a stejný požadavek lze poslat znovu). `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: Stáhnout data účtu
      description: |-
        Vše, co server o účtu uchovává, jako jeden soubor JSON k uložení (`format` `scacelith-account-export`, `version` 1). Export zaznamená bezpečnostní událost (`account_exported`). Pole `notes` v dokumentu hráči jednoduchou angličtinou sdělí, co je vynecháno.

        **V exportu nikdy není:** hash hesla, tajný klíč dvoufázového ověření a záložní kódy; žádný token relace ani odkazu, ani jeho hash; data anti-cheatu (úroveň a skóre integrity, anomálie, analýza partií, váha hlášení); hlášení, která na hráče podali jiní hráči; totožnost moderátorů; soukromá data jiných hráčů (soupeři jsou uvedeni pod svým veřejným jménem a ratingem, nic neprozrazuje, zda byl jiný hráč sankcionován, a není zahrnuta žádná IP adresa, která by mohla patřit jiné osobě).

        **Opětovná autentizace:** heslo a při dvoufázovém ověření kód z ověřovací aplikace nebo záložní kód. **Limity:** `account_export` (5 za hodinu na hráče, pro celý server; počítá se každý pokus včetně neúspěšných; kontroluje se jako první), potom `reauth` a `reauth_user`. **Časový limit:** 60 sekund.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
