  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: Smazat účet
      description: |-
        Smaže účet; to nelze vrátit zpět.

        - Všechny relace se okamžitě zneplatní: token od té chvíle dostává 401 `invalid_token`.
        - Uživatelské jméno se změní na `deleted#<id>`, v účtu i ve všech záznamech partií.
        - Vymažou se: e-mailová adresa, hash hesla, tajný klíč dvoufázového ověření a záložní kódy, relace a tokeny odkazů, propojení s Googlem, záznam integrity z anti-cheatu a IP adresy uložené u bezpečnostních událostí.
        - Ratingy a partie zůstávají. Partie zůstanou čitelné pod anonymním jménem a `GET /players/{username}` pro dřívější jméno odpoví 404.

        **Opětovná autentizace:** heslo a při dvoufázovém ověření kód z ověřovací aplikace nebo záložní kód. **Limity:** `reauth`, potom `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Účet je smazán.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (účet jen s přihlášením přes Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neúspěšné opětovné autentizace, nebo příliš mnoho zkoušených kódů na tomto účtu), nebo `rate_limited` (limit `reauth` nebo `reauth_user`, kvóta účtu, fronta hashování hesel).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (fronta hashování hesel, nebo databáze zůstala zamčená), `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Vypsat partie hráče s filtrem a stránkováním
      description: |-
        Partie přihlášeného hráče od nejnovějších, filtrované a stránkované, s počtem partií odpovídajících filtru. Všechny parametry dotazu jsou nepovinné a prázdná hodnota se počítá jako chybějící.

        Stránkování: předejte `next` z předchozí stránky jako `before`; na poslední stránce je `next` rovno `null`. `total` počítá partie odpovídající filtru napříč všemi stránkami.

        **Limit:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: ID oficiální kategorie (`3+2` nebo `3%2B2`), nebo `custom` pro všechny partie s jiným tempem hry.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Jen partie na rating (`true`), nebo bez ratingu (`false`).
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Jen partie vyhrané, prohrané nebo remizované, z pohledu hráče. Zrušené partie se zobrazí jen bez tohoto filtru.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Jedna stránka historie.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` není ID partie), `invalid_limit`, nebo `invalid_filter` (`category`, `rated` nebo `result`), vždy s `field`, které uvádí parametr.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `account_games` nebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (databáze zůstala zamčená; `retryAfter: 1` v těle, bez hlavičky `Retry-After`), `server_busy` (vyhledání relace narazilo na zamčenou databázi), `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /games/{id}:
    get:
      operationId: getGame
      tags:
        - games
      summary: Získat záznam partie s tahy a stavem hodin
      description: |-
        Jeden záznam partie s tahy a stavem hodin. Bez tokenu, nebo s tokenem hráče, který partii nehrál, je odpověď veřejná. Pokud hráč tokenu partii hrál, odpověď navíc obsahuje `you` a `reportable`.

        **Limit:** `public_read` (s tokenem na hráče, bez něj na klienta).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Záznam partie.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameRecord'
              example:
                id: 4100000000001
                category: '3+2'
                rated: true
                timeControl: '180+2'
                white:
                  name: alice
                  rating: 1500
                  ratingAfter: 1510
                  ratingDiff: 10
                black:
                  name: bob
                  rating: 1520
                  ratingAfter: 1510
                  ratingDiff: -10
