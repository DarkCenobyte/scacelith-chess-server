info:
  title: HTTPS API serveru Scacelith
  version: "1.1.0"
  summary: HTTPS API každého serveru Scacelith, oficiálního i komunitních.
  description: |-
    Toto HTTPS API poskytuje každý server Scacelith, oficiální `caissa.scacelith.com` i každý komunitní server. Hra ho používá na vše mimo samotnou partii: registraci a přihlášení (včetně dvoufázového ověření a přihlášení přes Google), stránku účtu, historii partií, stahování PGN a animované GIFy partií, přihlášená zařízení, stažení dat, smazání účtu a hlášení.

    Hraní naživo (hledání soupeře, výzvy, tahy, hodiny) probíhá přes WebSocket téhož serveru (`wss://<host>/ws`), otevřený tokenem relace z tohoto API; je popsán v `PROTOCOL.md`, ne zde.

    Níže uvedené výchozí hodnoty platí pro server s nezměněnou konfigurací; komunitní server je může změnit (`CONFIG.md` uvádí každé nastavení).

    ## Základní URL, port a přenos

    - Oficiální server: `https://caissa.scacelith.com/api/v1`, port TCP 443.
    - Komunitní server: `https://<SERVER_PUBLIC_HOST>[:<port>]/api/v1`. `API_PORT` je ve výchozím nastavení 443; za NAT nebo proxy je port, který používají hráči, `PUBLIC_API_PORT`.
    - WebSocket hry je ve výchozím nastavení na stejném portu (`WS_PORT` ho přesune jinam; `GET /info` klientovi sdělí, kde je).
    - HTTP/1.1 přes TLS. S `TLS_MODE=proxy` ukončuje TLS reverzní proxy před serverem. `TLS_MODE=off` (prosté HTTP) je jen pro lokální vývoj.
    - HTML stránky otevírané z odkazů v e-mailech (`/verify-email`, `/reset-password`, `/confirm-email-change`) jsou v kořeni serveru, mimo `/api/v1`. Endpointy kontroly stavu odpovídají jak v kořeni, tak pod `/api/v1`. Přihlášení přes Google nemá na serveru žádnou stránku: Google pošle prohlížeč zpět přímo do hry, na `127.0.0.1`, nebo na stránku webu, který přihlášení zahájil (`GOOGLE_WEB_REDIRECT_URI`).
    - Koncové lomítko se ignoruje (`/api/v1/info/` je `/api/v1/info`) a parametry cesty se dekódují z kódování URL (na parametr, který není platným kódováním URL, server odpoví 400 `invalid_request`).

    ## Požadavky

    - **Těla JSON.** Požadavky `POST`, `PUT` a `DELETE` nesou objekt JSON s `Content-Type: application/json`. Jiný `charset` než UTF-8 se odmítá, stejně jako jakýkoli jiný typ obsahu (415 `unsupported_media_type`). Prázdné tělo se počítá jako `{}`, což je právě to, co přijímají endpointy bez parametrů (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`).
    - **Velikost a čas.** Tělo je omezeno na `HTTP_BODY_LIMIT` bajtů (ve výchozím nastavení 16 384; `POST /gif` má vlastní limit 135 168 bajtů): 413 `payload_too_large`. Musí dorazit do 10 sekund: 408 `request_timeout`. Po kterékoli z těchto chyb server spojení ukončí.
    - **Striktní schémata.** Pole, které endpoint nezná, se odmítá, pole neoznačené jako nepovinné je povinné a kontrolují se typy a délky. Na každé takové selhání server odpoví 400 `invalid_request` s `field`, které uvádí název pole (u vnořeného pole s tečkami, například `pow.nonce`). Řetězce nesmějí obsahovat řídicí znaky. Délky se počítají v kódových jednotkách UTF-16, takže znak mimo základní vícejazyčnou rovinu (emoji) se počítá dvakrát. Na tělo, které není JSON, server odpoví 400 `invalid_json`. `POST /gif` a `POST /reports` svá těla kontrolují samy (viz jednotlivé endpointy).
    - **Řetězce dotazu.** Platí první výskyt parametru, neznámé parametry se ignorují a `+` se dekóduje jako mezera: endpointy, které přijímají kategorii tempa hry, přijmou `3%2B2` i `3+2`.
    - **Metody.** `HEAD` je `GET` bez těla. `OPTIONS` na existující cestě vrátí 204 s hlavičkou `Allow` (a s hlavičkami předběžného požadavku CORS, viz níže). Na jakoukoli jinou metodu, kterou cesta nemá, server odpoví 405 `method_not_allowed` s `Allow`.
    - **Cíl požadavku.** Nesmí přesáhnout 4096 znaků (414 `uri_too_long`). Požadavek, který vůbec nelze zpracovat, nebo jehož záhlaví je příliš velké či přichází příliš pomalu, dostane prázdnou odpověď 400, 431 nebo 408 a spojení se ukončí.
    - **CORS: seznam povolených původů, ve výchozím nastavení vypnutý.** API slouží hře, která `Origin` neposílá. S prázdným `CORS_ORIGINS` (výchozí stav) se nikdy neposílá žádná hlavička `Access-Control-*`, takže žádná webová stránka nemůže odpověď přečíst. `CORS_ORIGINS` uvádí webové původy, jejichž stránky smějí volat API z prohlížeče, každý přesně tak, jak ho prohlížeče posílají v `Origin`: `https://host` nebo `https://host:port`, malými písmeny, bez cesty, koncového lomítka a výchozího portu; `http://` jen pro `localhost`, `127.0.0.1` a `[::1]` (lokální vývoj); žádné zástupné znaky. Oficiální server pro svůj web nastavuje `CORS_ORIGINS=https://scacelith.com,https://www.scacelith.com`. Pak platí:
      - Každá odpověď pro cestu pod `/api/v1` kromě endpointů kontroly stavu, úspěšná i chybová (včetně 429 vrstvy podle adresy), nese `Vary: Origin`. Když je `Origin` požadavku bajt po bajtu shodný s jedním z uvedených původů, nese také `Access-Control-Allow-Origin: <that origin>` a, kromě odpovědi na předběžný požadavek, `Access-Control-Expose-Headers: Retry-After, Content-Disposition`, aby stránka mohla přečíst chybové kódy, `Retry-After` a názvy souborů stahovaných PGN a GIFů.
      - Na předběžný požadavek (preflight; `OPTIONS` s `Access-Control-Request-Method`) z uvedeného původu na existující cestu server odpoví 204 bez těla, s `Allow`, `Access-Control-Allow-Origin`, `Access-Control-Allow-Methods` (metody z `Allow`), `Access-Control-Allow-Headers: Authorization, Content-Type`, `Access-Control-Max-Age: 600` a `Vary: Origin`. Nepotřebuje žádný token a nezapočítává se do žádné kvóty účtu ani do žádného limitu endpointu; jako každý požadavek spotřebuje jeden žeton vrstvy podle adresy. Prohlížeč předběžný požadavek znovu používá po dobu 10 minut, ale jen pro přesně tutéž URL včetně řetězce dotazu. Požadavek bez `Authorization` a bez těla JSON, například `GET /info` nebo `GET /leaderboard`, předběžný požadavek nepotřebuje.
      - Jakákoli jiná odpověď na předběžný požadavek znamená jeho selhání, i když nese hlavičky CORS: 404 pro neexistující cestu nebo 429 vrstvy podle adresy. Prohlížeč pak požadavek neodešle a stránka uvidí síťovou chybu, bez odpovědi i bez jejího `Retry-After`.
      - `Access-Control-Allow-Credentials` se nikdy neposílá, stejně jako `Access-Control-Allow-Origin: *`: stránka posílá svůj token relace v `Authorization: Bearer`, stejně jako hra, a API nenastavuje žádné cookie. HTML stránky, endpointy kontroly stavu a prázdné odpovědi na nezpracovatelné požadavky nenesou žádnou hlavičku CORS. WebSocket CORS nepoužívá: stránky, které ho smějí otevřít, uvádí `WS_ALLOWED_ORIGINS`.
      - Stránka z neuvedeného původu nepřečte nic a její zápisy napříč weby (cross-site) se nikdy neodešlou: těla JSON a `Authorization` vyžadují předběžný požadavek, jehož odpověď pro tento původ nemá `Access-Control-Allow-Origin`. `Cross-Origin-Resource-Policy: same-origin` zůstává na každé odpovědi: uplatní se jen u požadavků `no-cors` (jiný web vkládá odpověď do své stránky), nikdy u požadavků `cors` uvedené stránky.

    ## Odpovědi a chyby

    - Odpovědi jsou JSON v UTF-8, kromě stahování PGN (`application/x-chess-pgn`), animovaných GIFů (`image/gif`) a HTML stránek. Časy jsou v milisekundách od 1970-01-01 UTC. ID jsou celá čísla. ID partií mají až 16 číslic, ale zůstávají pod 2^53, takže je číslo JSON (double) uchová přesně.
    - Každá odpověď API nese `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`, `X-Frame-Options: DENY`, `Cross-Origin-Resource-Policy: same-origin` a `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'` (HTML stránky mají vlastní politiku). S `TLS_MODE=native` nese také `Strict-Transport-Security: max-age=31536000`. Odpovědi, které naslouchací proces zapisuje sám, ještě před API (`GET` a `HEAD` endpointů kontroly stavu, 429 vrstvy podle adresy a 500 `internal_error`, když API úplně selže), nesou stejné hlavičky kromě `Cross-Origin-Resource-Policy` a jejich `Content-Type` je `application/json` bez znakové sady.
    - Odpověď musí být přečtena do 60 sekund od chvíle, kdy ji server má připravenou, což má význam jen u velkých odpovědí (GIF, export dat, dlouhé PGN). Doba, kterou server potřebuje na přípravu odpovědi, se nezapočítává do této lhůty ani do 30 sekund bez jediného přijatého či odeslaného bajtu, po kterých se spojení ukončí.

    Chyby mají jednotný tvar (schéma `Error`):

    ```json
    { "error": "snake_case_code", "message": "An English sentence.", "retryAfter": 30 }
    ```

    `message` slouží pro logy a jako záložní text; klient vybírá, co zobrazí, podle `error`. `retryAfter` (v sekundách) se objevuje jen u odmítnutí, která časem pominou, a odpověď pak nese i hlavičku `Retry-After` se stejnou hodnotou; jedinou výjimkou je 503 `busy` při čtení historie, partií, hráčů a žebříčku, které má jen toto pole. Některé chyby přidávají další pole: `field` (neplatný vstup), `reason` (`weak_password`, `pow_required`), `pow` (`pow_required`), `until` (`banned`), `line` a `column` (`invalid_pgn`).

    Chyby, které může vrátit jakýkoli endpoint:

    | Stav | `error` | Kdy |
    |---|---|---|
    | 400 | `invalid_request` | Tělo porušuje schéma endpointu (`field` uvádí kde), cíl požadavku nebo `Content-Length` má chybný formát, parametr cesty není platným kódováním URL, nebo bylo tělo useknuto. |
    | 400 | `invalid_json` | Tělo není JSON. |
    | 401 | `unauthorized` | Chybí hlavička `Authorization` u endpointu, který vyžaduje relaci. |
    | 401 | `invalid_token` | Token má chybný formát, vypršel, byl zneplatněn nebo patří smazanému účtu; i u endpointů, kde je relace nepovinná. |
    | 404 | `not_found` | Takový endpoint neexistuje. Používají ho i některé endpointy: taková partie, hráč nebo relace neexistuje. |
    | 405 | `method_not_allowed` | Cesta existuje pro jiné metody (viz `Allow`). |
    | 408 | `request_timeout` | Tělo nedorazilo do 10 sekund. |
    | 413 | `payload_too_large` | Tělo přesahuje `HTTP_BODY_LIMIT` (u `POST /gif` 135 168 bajtů). |
    | 414 | `uri_too_long` | Cíl požadavku přesahuje 4096 znaků. |
    | 415 | `unsupported_media_type` | Tělo není `application/json` nebo jeho znaková sada není UTF-8. |
    | 429 | `rate_limited` | Limit počtu požadavků (viz níže): `retryAfter` a k tomu hlavička `Retry-After`. |
    | 500 | `internal_error` | Neočekávané selhání. Server ho zaznamená do logu. |
    | 503 | `timeout` | Server neodpověděl do 30 sekund (do 60 sekund u exportu, do 45 sekund u GIFů při výchozím nastavení). |
    | 503 | `server_busy` | Vyhledání relace nebo změna účtu narazily na zamčenou databázi (`retryAfter` 1), nebo je plná fronta hashování hesel (viz níže). Také s `retryAfter` 2 až 5, když server výrazně nestíhá: u `POST`, `PUT`, `PATCH` nebo `DELETE` čeká v databázi příliš mnoho zápisů; u jakéhokoli požadavku stále běží příliš mnoho dřívějších požadavků po vypršení jejich časového limitu, nebo se token relace nepodařilo ověřit do 5 sekund. Požadavek nebyl proveden a jeho limity počtu požadavků nic nespotřebovaly. |

    Endpointy pro čtení (historie partií, partie, hráči, žebříček) a export odpovídají 503 `busy` s `retryAfter: 1`, když databáze zůstala zamčená.

    Endpointy, které ověřují nebo hashují heslo, mohou odpovědět také jednou z těchto chyb, obě s náhodným `retryAfter` 5 až 15 sekund:

    - 503 `server_busy`: fronta hashování hesel na serveru (`PASSWORD_HASH_QUEUE_MAX`) je plná, nebo vypršela doba čekání.
    - 429 `rate_limited`: fronta je zaplněná alespoň z poloviny a tento klient (adresa IPv4 nebo IPv6 /48) v ní už má `PASSWORD_HASH_WAITERS_PER_SOURCE` čekajících hashů. Tato odpověď 429 vrací žetony limitů počtu požadavků, které požadavek spotřeboval.

    Nic se nezměnilo a žádný neúspěšný pokus se nezapočítal (kromě `POST /auth/sso/google/link`, kde se pokus tiketu a neúspěch účtu započítaly už před hashováním) a odkaz pro obnovení hesla zůstává platný.

    HTML stránky vracejí své chyby jako HTML stránky se stejnými stavovými kódy.

    ## Autentizace

    Endpointy, které vyžadují relaci, přijímají token typu bearer v hlavičce `Authorization` (schéma `bearerAuth`):

    ```
    Authorization: Bearer sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
    ```

    - **Získání tokenu.** Token (`sct_` následované 43 znaky base64url) vydává `POST /auth/login`, po něm `POST /auth/login/mfa`, když je zapnuté dvoufázové ověření, dále `POST /auth/sso/google/finish` a `POST /auth/sso/google/link` (přihlášení přes Google) a `POST /auth/sso/complete`. Každý z nich odpoví `{ token, expiresAt, user }`. Server ukládá jen hash SHA-256 tokenu.
    - **Povinná relace.** Na chybějící hlavičku server odpoví 401 `unauthorized` s `WWW-Authenticate: Bearer realm="scacelith"`. Na neplatný token odpoví 401 `invalid_token` s `WWW-Authenticate: Bearer realm="scacelith", error="invalid_token"`. Klient by měl token, který dostane `invalid_token`, zapomenout a přihlásit se znovu.
    - **Nepovinná relace.** U `GET /games/{id}`, `GET /games/{id}/pgn`, `GET /players/{username}` a `GET /players/{username}/games` je relace nepovinná. Bez hlavičky vracejí veřejný pohled; pokud je hlavička odeslána, její token musí být platný.
    - **Zaneprázdněné úložiště.** Když databáze během ověřování tokenu zůstane zamčená, endpoint, který relaci vyžaduje nebo přijímá, odpoví 503 `server_busy` s `retryAfter: 1` (a `Retry-After`); když ověření trvá déle než 5 sekund, odpoví 503 `server_busy` s `retryAfter` 2 až 5. V obou případech token nebyl posouzen: ponechte si ho a pošlete požadavek znovu.
    - **Životnost.** Relace skončí při tom z obou termínů, který nastane dřív: `SESSION_MAX_DAYS` (90) dní po přihlášení (to je `expiresAt`), nebo `SESSION_IDLE_DAYS` (30) dní bez použití. Každé použití limit nečinnosti posune; server zapisuje novou hodnotu nejvýše jednou za 5 minut, na pozadí. Dokud má jeho databáze mnoho čekajících zápisů, odkládá tento zápis na pozdější požadavek, kromě poslední hodiny před limitem nečinnosti, takže používaná relace nevyprší. Účet má nejvýše `MAX_SESSIONS_PER_USER` (10) relací: nové přihlášení nad tento počet zneplatní nejstarší relaci.
    - **Zneplatnění.** Odhlášení (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`) zneplatňuje relace; stejně tak změna hesla (ostatní relace), obnovení hesla a smazání účtu (všechny relace) a administrátor. Zneplatnění přes API platí okamžitě a WebSocket otevřený se zneplatněnou relací se zavře. Změna nebo obnovení hesla a smazání účtu zneplatňují relace ve stejné transakci jako samotnou změnu: když některá z nich selže, žádná relace nebyla zneplatněna a nic jiného se také nezměnilo. Server ukládá výsledky vyhledání relací do mezipaměti na 30 sekund, takže zneplatnění administrátorským příkazem, který běží jako samostatný proces, se projeví do 30 sekund.
    - **Rozsah.** Token patří jednomu serveru a otevírá i jeho WebSocket. Nikdy ho neposílejte na jiný server.

    ## Limity počtu požadavků a další omezení

    Limity platí pro jeden ze dvou rozsahů. **Klient:** adresa IPv4 nebo IPv6 /64 (v režimu proxy pochází adresa z `X-Forwarded-For` odeslané adresou z `TRUSTED_PROXIES`); některé limity navíc počítají každou IPv6 /48 jako celek, nad rámec každé z jejích sítí /64. **Hráč:** přihlášený účet bez ohledu na adresu; limit počítaný na hráče u endpointu, kde je relace nepovinná, se u požadavku bez tokenu počítá na klienta.

    Každý limit je kbelík žetonů (token bucket), který pojme `limit` požadavků a průběžně se doplňuje rychlostí `limit / window`; `retryAfter` je doba do dalšího žetonu. Limity označené jako *sdílené* se navíc počítají v klouzavém okně stejné délky, takže žádné okno neobsahuje o mnoho víc než `limit` požadavků. Každý limit se počítá pro celý server. Když jeden z limitů endpointu požadavek odmítne, žetony, které za tento požadavek spotřebovaly jeho ostatní limity, se vrátí. Na odmítnutí server odpoví 429 `rate_limited` s `retryAfter` a `Retry-After`.

    - **Vrstva podle adresy.** Každý požadavek (jakákoli cesta a metoda, včetně endpointů kontroly stavu a přechodů na WebSocket) nejprve spotřebuje jeden žeton z kvóty svého klienta: `HTTP_RATE_PER_IP` (600) za minutu s nárazovou rezervou (burst) na půl minuty a `HTTP_RATE_PER_PREFIX` (4 × `HTTP_RATE_PER_IP`) pro IPv6 /48. Klient může mít také nejvýše `IP_MAX_INFLIGHT` (32 × `WORKERS`) rozpracovaných požadavků (nad tento počet `retryAfter` 1). Klient, který po odmítnutích pokračuje dál, je zablokován: `ABUSE_BLOCK_REFUSALS_PER_MIN` (600) odmítnutí za minutu ho zablokuje na 1 minutu, pak na 4, 16 a 60 minut při každém dalším zablokování během 6 hodin. Odmítnutí limity `auth`, `auth_*` a `reauth` se počítá za 5; odmítnutí limity počítanými na hráče se nepočítají nikdy. Adresy v `ABUSE_EXEMPT` tuto vrstvu přeskakují, kvótu účtu a limity endpointů však ne.
    - **Kvóta účtu.** Každý požadavek s platným tokenem relace se navíc započítává svému účtu: `USER_RATE_PER_MIN` (120) za minutu pro všechny endpointy dohromady, bez ohledu na adresu, s nárazovou rezervou (burst) na půl minuty.
    - **Limity endpointů:**

    | Limit | Výchozí hodnota | Počítá se na | Endpointy |
    |---|---|---|---|
    | `auth` | `AUTH_RATE_PER_IP` (20) / 10 min, sdílený | klienta a `AUTH_RATE_PER_PREFIX` (5 × `AUTH_RATE_PER_IP`) na IPv6 /48 | `POST /auth/register`, `/auth/login`, `/auth/login/mfa`, `/auth/verify-email/resend`, `/auth/password/forgot`, `/auth/password/reset`, `/auth/sso/google/link`, `/auth/sso/complete`; `POST /verify-email`, `/reset-password`, `/confirm-email-change` |
    | `auth_register` | `AUTH_REGISTER_PER_HOUR` (10) / hodinu, sdílený | klienta, 3krát tolik na IPv6 /48 | `POST /auth/register` |
    | `auth_mail` | `AUTH_MAIL_PER_HOUR` (10) / hodinu, sdílený | klienta, 3krát tolik na IPv6 /48 | `POST /auth/verify-email/resend` |
    | `auth_forgot` | `AUTH_FORGOT_PER_HOUR` (3) / hodinu, sdílený | klienta, 3krát tolik na IPv6 /48 | `POST /auth/password/forgot` |
    | `auth_forgot_day` | `AUTH_FORGOT_PER_DAY` (10) / 24 hodin, sdílený | klienta, 3krát tolik na IPv6 /48 | `POST /auth/password/forgot` |
    | `auth_reset` | `AUTH_RESET_PER_HOUR` (10) / hodinu, sdílený | klienta, 3krát tolik na IPv6 /48 | `POST /auth/password/reset`, `POST /reset-password` |
    | `reauth` | hodnoty limitu `auth`, ve vlastním kbelíku, sdílený | klienta a IPv6 /48 | `POST /account/password`, `/account/mfa/totp/setup`, `/account/mfa/totp/enable`, `/account/mfa/totp/disable`, `/account/mfa/recovery-codes`, `/account/email`, `/account/export`, `/account/delete` |
    | `reauth_user` | `AUTH_REAUTH_PER_USER` (10) / 10 min, sdílený | hráče | tytéž endpointy jako `reauth` |
    | `account` | 60 / min | hráče | `GET /account/me`, `PUT /account/preferences` |
    | `account_games` | 60 / min | hráče | `GET /account/games` |
    | `account_export` | 5 / hodinu, sdílený | hráče | `POST /account/export` (kontroluje se před `reauth`; počítá se každý pokus) |
    | `sessions` | 60 / min | hráče | `POST /auth/logout`, `/auth/logout-all`, `GET /auth/sessions`, `DELETE /auth/sessions/{id}` |
    | `public_read` | 60 / min | hráče (klienta bez tokenu) | `GET /players/{username}`, `/players/{username}/games`, `/games/{id}`, `/games/{id}/pgn` (jeden kbelík pro všechny čtyři) |
    | `gif` | 30 / min | hráče | `GET /games/{id}/gif`, `POST /gif` (jeden kbelík pro oba) |
    | `gif_user_min`, `gif_user_hour` | `GIF_USER_RENDERS_PER_MIN` (4) / min a `GIF_USER_RENDERS_PER_HOUR` (30) / hodinu, sdílené | hráče | tytéž dva, jen když se GIF musí vytvořit (ne z mezipaměti) |
    | `gif_ip_min`, `gif_ip_hour` | `GIF_IP_RENDERS_PER_MIN` (12) / min a `GIF_IP_RENDERS_PER_HOUR` (120) / hodinu, sdílené | klienta (všechny jeho účty dohromady), 3krát tolik na IPv6 /48 | tytéž, za stejných podmínek jako výše |
    | `reports` | 30 / hodinu | hráče | `POST /reports` |
    | `sso_start` | 30 / 10 min, sdílený | klienta a 90 na IPv6 /48 | `POST /auth/sso/google/start`, `POST /auth/sso/google/web/start` (dohromady) |
    | `sso_finish` | 30 / min | klienta | `POST /auth/sso/google/finish` |
    | `page` | 60 / min | klienta | `GET /verify-email`, `/reset-password`, `/confirm-email-change` |

    `GET /info` a `GET /leaderboard` nemají vlastní limit: platí pro ně jen vrstva podle adresy. Endpoint s několika limity je kontroluje v pořadí uvedeném v jeho popisu.

    Server zpracovává požadavek v tomto pořadí: vrstva podle adresy, pak endpointy kontroly stavu; přiřazení endpointu; kontroly, zda server výrazně nestíhá (503 `server_busy`): příliš mnoho dřívějších požadavků stále běžících po vypršení časového limitu a u `POST`, `PUT`, `PATCH` nebo `DELETE` nevyřízené zápisy databáze; autentizace, do 5 sekund (při delší době 503 `server_busy`); kvóta účtu, pokud požadavek nese relaci; limity endpointu; tělo; samotný endpoint (endpointy GIF spotřebují své limity vykreslování, jen když mají GIF vytvořit). Požadavek odmítnutý kvůli tokenu tedy nespotřebuje žádné žetony endpointu, kdežto požadavek s neplatným tělem je spotřebuje.

    Další omezení, která uplatňují samy endpointy:

    - **Neúspěšná přihlášení na jedno přihlašovací jméno** (uživatelské jméno nebo e-mail): od `AUTH_FAILURES_PER_ACCOUNT` (5) neúspěchů musí každý pokus čekat dvakrát déle než předchozí (2 s, 4 s a tak dále, až 15 minut): 429 `too_many_attempts` s `retryAfter`. Počítadlo se vynuluje po hodině bez neúspěchů.
    - **Neúspěšné druhé faktory při přihlášení:** stejné pravidlo od 5. chybného kódu účtu. Jeden krok přihlášení přijme nejvýše 5 chybných kódů.
    - **Kódy druhého faktoru jednoho účtu:** nejvýše `AUTH_MFA_PER_ACCOUNT` (10) kódů (z ověřovací aplikace nebo záložních, správných i chybných) za 15 minut, z jakékoli adresy, při přihlášení i při opětovné autentizaci; nad tento počet 429 `too_many_attempts` ještě před kontrolou kódu, takže se záložní kód nespotřebuje.
    - **Neúspěšné opětovné autentizace účtu** (chybné heslo nebo kód): stejné pravidlo (429 `too_many_attempts`), společné pro všechny endpointy, které vyžadují opětovnou autentizaci.
    - **E-maily:** jeden potvrzovací e-mail nebo e-mail pro obnovení hesla na adresu za 5 minut (odpověď zůstává stejná); jedno upozornění „someone tried to use your address“ (někdo se pokusil použít vaši adresu) na adresu za hodinu.
    - **Hlášení:** `REPORTS_PER_DAY` (5) na hráče za 24 hodin: 429 `report_limit`.

    ## Důkaz práce

    `POST /auth/register` vyžaduje důkaz práce vždy, když je `POW_REGISTER_BITS` větší než 0 (ve výchozím nastavení 18; `GET /info` ho uvádí jako `pow.register`). `POST /auth/login` a `POST /auth/sso/google/link` (jeden druh výzvy pro oba) ho vyžadují jen po dobu 5 minut poté, co server zaznamená vlnu neúspěšných přihlášení (`POW_LOGIN_TRIGGER_PER_MIN`, pak `POW_LOGIN_BITS`); klient se to dozví z odpovědi.

    1. Na požadavek bez důkazu (nebo s odmítnutým důkazem) server odpoví 428 `pow_required` s `reason` a výzvou `pow` `{ challenge, bits, expiresAt }`.
    2. Najděte nonce: desítkový řetězec nejvýše 20 číslic takový, že `SHA-256(challenge + ":" + nonce)` začíná `bits` nulovými bity (nejvýznamnější bit prvního bajtu jako první). 18 bitů vyžaduje v průměru asi 260 000 hashů.
    3. Pošlete stejný požadavek znovu s `"pow": { "challenge": "...", "nonce": "123456" }` v těle.

    Výzva platí 2 minuty a jen jednou, pro jeden endpoint a jednu síť klienta (adresu IPv4 nebo IPv6 /64). Je podepsaná, takže si o ní server až do jejího návratu nic neuchovává. `reason` uvádí, proč byl důkaz odmítnut: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` nebo `replayed`.

    ## Opětovná autentizace

    Změny účtu znovu vyžadují heslo a při zapnutém dvoufázovém ověření i druhý faktor:

    - jen heslo: `POST /account/password` a `POST /account/mfa/totp/setup`;
    - heslo a kód z ověřovací aplikace, přičemž záložní kód se odmítá: `POST /account/mfa/recovery-codes`;
    - heslo a kód z ověřovací aplikace nebo záložní kód: `POST /account/mfa/totp/disable`, `POST /account/email`, `POST /account/export` a `POST /account/delete`.

    V tělech obsahuje `code` šestimístný kód z ověřovací aplikace a `recoveryCode` záložní kód (`xxxx-xxxx-xx`; na velikosti písmen, mezerách a pomlčkách nezáleží). Tam, kde se záložní kódy přijímají, lze záložní kód poslat i v `code`. Každý kód funguje jen jednou: použitý kód z ověřovací aplikace se odmítá až do dalšího třicetisekundového kroku a záložní kód po použití zaniká.

    | Stav | `error` | Kdy |
    |---|---|---|
    | 403 | `invalid_password` | Chybné heslo, nebo bylo heslo během zpracování požadavku obnoveno či změněno (nic se nezměnilo). |
    | 403 | `mfa_code_required` | Dvoufázové ověření je zapnuté a nebylo odesláno ani `code`, ani `recoveryCode`. |
    | 403 | `invalid_code` | Chybný nebo už použitý kód. |
    | 400 | `password_not_set` | Účet jen s přihlášením přes Google zatím nemá heslo (nastaví ho „Zapomenuté heslo?“). |
    | 429 | `too_many_attempts` | Příliš mnoho neúspěchů nebo příliš mnoho vyzkoušených kódů u tohoto účtu. |
    | 503 / 429 | `server_busy` / `rate_limited` | Fronta hashování hesel je přetížená. |

    Chybná hesla a kódy se započítávají do počítadla neúspěchů účtu a zaznamenávají se jako bezpečnostní události.

    ## Port metrik

    Kromě portu API odpovídá server prostým HTTP na portu metrik (`METRICS_PORT`, 9464, na adrese `METRICS_BIND`, ve výchozím nastavení 127.0.0.1; nezpřístupňujte ho veřejně). Není součástí tohoto API: `GET /healthz` odpoví `ok`; `GET /readyz` odpoví `ready`, jakmile je spuštění dokončeno (každý shard přehrál svůj žurnál a naslouchací procesy jsou navázané), a to až do začátku vypínání, jinak 503 `not ready`; `GET /metrics` poskytuje metriky Prometheus a s nastaveným `METRICS_TOKEN` vyžaduje `Authorization: Bearer <token>` s přesně tímto tokenem.
