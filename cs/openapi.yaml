components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Token relace (`sct_` a za ním 43 znaků base64url) z odpovědi na přihlášení, v hlavičce `Authorization`: `Authorization: Bearer <token>`. Předpona je přesně `Bearer` (rozlišují se velká a malá písmena) a jedna mezera; na hodnotu bez ní, nebo na token, který nemá 1 až 512 tisknutelných znaků ASCII, server odpoví 401 `invalid_token` jako na každý jiný neplatný token. Prázdná hlavička se počítá jako chybějící.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: ID partie, kladné desítkové celé číslo o nejvýše 16 číslicích bez úvodních nul, menší než 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: ID relace, jak ho uvádí `GET /auth/sessions`, zapsané bez úvodních nul (`03` není relace 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Uživatelské jméno hráče, bez ohledu na velikost písmen. Server přijme jakékoli jméno o 2 až 24 znacích z `[A-Za-z0-9_.-]` (nejširší pravidlo, jaké kdy povolil).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: ID partie; vypíšou se jen starší partie. Předejte `next` z předchozí stránky. Prázdná hodnota se počítá jako chybějící.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Velikost stránky, 1 až 50. Větší číslo o nejvýše 3 číslicích se počítá jako 50; prázdná hodnota se počítá jako chybějící.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: Token odkazu z e-mailu (43 znaků base64url). Když chybí nebo je nesprávný, zobrazí se stránka „link invalid or expired“ (odkaz je neplatný nebo vypršel).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Každá odpověď serveru zakazuje ukládání do mezipaměti.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Počet sekund, které je třeba počkat před dalším pokusem; stejná hodnota jako `retryAfter` v těle.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Výzva typu Bearer, u neplatného tokenu s `error="invalid_token"`.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Server po této odpovědi zavře spojení.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (s `field`, když je chyba v některém poli těla), nebo `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Pole porušuje schéma
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Tělo není JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Slabé heslo
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: PGN, které nelze přečíst
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (chybí hlavička `Authorization`), nebo `invalid_token` (token má chybný formát, vypršel, byl zneplatněn nebo patří smazanému účtu).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Bez relace
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Neplatný token
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Požadavek je odmítnut.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Nesprávné heslo při opětovné autentizaci
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Pozastavený účet
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found`, nebo funkce, kterou tento server vypnul.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: tělo nedorazilo do 10 sekund. Server zavře spojení.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Požadavek je v konfliktu se stavem serveru.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: pokus o přihlášení přes Google nebo tiket je neznámý, použitý nebo vypršelý; zahajte přihlášení znovu.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: tělo překračuje `HTTP_BODY_LIMIT` (ve výchozím nastavení 16 384 bajtů). Server zavře spojení.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: cíl požadavku překračuje 4096 znaků.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: tělo není `application/json`, nebo jeho znaková sada není UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: partie má více než `GIF_MAX_PLIES` (600) půltahů.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: vyřešte výzvu `pow` a pošlete stejný požadavek znovu s `pow: { challenge, nonce }`. `reason` uvádí proč: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` nebo `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (limit počtu požadavků, kvóta účtu nebo fronta hashování hesel), nebo `too_many_attempts` (omezení na úrovni účtu), s `retryAfter` a hlavičkou `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Limit počtu požadavků
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Příliš mnoho neúspěchů na tomto účtu
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: neočekávané selhání. Server ho zaznamená do logu.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: chybný `state` nebo `iss`, nebo Google odmítl kód či poslal ID token, který neprojde ověřením (to zahrnuje i kód nebo ID token druhého z klientů, hry či webu). Nikdy neobsahuje text od Googlu.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` nebo `timeout`: zkuste to znovu po `retryAfter`, pokud je uvedeno.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Server je přetížený
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Databáze zůstala zamčená (čtení)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Serveru to trvalo příliš dlouho
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Animovaný GIF jako příloha.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` pro partii z tohoto serveru, `attachment; filename="scacelith-game.gif"` pro PGN poslané přes `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Velikost souboru v bajtech.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: Stránka HTML.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: Stránka HTML, která vysvětluje odmítnutí.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Formulář nedorazil do 10 sekund (stránka HTML). Server zavře spojení.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: Stránka HTML, která vysvětluje konflikt.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Formulář překračuje `HTTP_BODY_LIMIT` (stránka HTML). Server zavře spojení.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Tělo není ani formulář (`application/x-www-form-urlencoded`), ani JSON, nebo jeho znaková sada není UTF-8 (stránka HTML).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Limit počtu požadavků (stránka HTML), s `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Neočekávané selhání (stránka HTML s názvem „Server error“, tj. chyba serveru). Server ho zaznamená do logu.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Server je přetížený (databáze zůstala zamčená, nebo server výrazně nestíhá; s `Retry-After`), nebo mu odpověď trvala příliš dlouho (stránka HTML s názvem „Server error“, tj. chyba serveru).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: Jediný tvar všech chybových odpovědí JSON API.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Kód chyby ve tvaru `snake_case`. Podle něj klient volí, co zobrazí.
          examples:
            - rate_limited
        message:
          type: string
          description: Anglická věta, určená pro logy a jako náhradní text.
        retryAfter:
          type: integer
          minimum: 1
          description: Počet sekund, které je třeba počkat před dalším pokusem; uvádí se jen u odmítnutí, která časem pominou. Odpověď pak nese i hlavičku `Retry-After` se stejnou hodnotou, kromě 503 `busy` při čtení historie, partií, hráčů a žebříčku.
        field:
          type: string
          description: Chybné pole nebo parametr dotazu (`invalid_request`, `invalid_option` a `invalid_cursor`, `invalid_limit` a `invalid_filter` u `GET /account/games`). Vnořené pole se zapisuje s tečkou (`pow.nonce`).
        reason:
          type: string
          description: 'Důvod: pravidlo, které `weak_password` porušuje, nebo proč byl vyžádán či odmítnut důkaz práce (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Jen u `banned`: konec pozastavení (ms od epochy Unixu), `null` u trvalého pozastavení.'
        line:
          type: integer
          minimum: 1
          description: 'Jen u `invalid_pgn`: řádek chyby, od 1.'
        column:
          type: integer
          minimum: 1
          description: 'Jen u `invalid_pgn`: sloupec chyby, od 1, ve znacích.'
    PowChallenge:
      type: object
      description: Výzva důkazu práce (`pow` v odpovědi 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Podepsaná výzva, kterou je třeba poslat zpět beze změny.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Počet úvodních nulových bitů, které musí mít `SHA-256(challenge + ":" + nonce)`.
        expiresAt:
          type: integer
          format: int64
          description: Kdy výzva vyprší (ms od epochy Unixu), 2 minuty po vydání.
    PowAnswer:
      type: object
      description: Odpověď na výzvu důkazu práce.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: '`challenge` z odpovědi 428, beze změny.'
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Desítkový řetězec o nejvýše 20 číslicích takový, že `SHA-256(challenge + ":" + nonce)` začíná `bits` nulovými bity.
    ServerInfo:
      type: object
      description: Co klient potřebuje, než se přihlásí nebo připojí.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Název serveru (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: UUID, které databáze dostane při prvním spuštění. Po restartech zůstává stejné. Je `null`, když ho databáze nemůže poskytnout.
        motd:
          type: string
          description: Zpráva dne (`SERVER_MOTD`), případně prázdná.
        protocol:
          type: object
          description: Protokol WebSocketu (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Nejstarší verze protokolu, kterou server podporuje.
            max:
              type: integer
              minimum: 1
              description: Nejnovější verze protokolu, kterou server podporuje.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'Otisk schématu protokolu (první 4 bajty SHA-256 jeho kanonické podoby jako celé číslo bez znaménka: `0xc649140f`, 3326678031, pro vedlejší verzi protokolu 2); jen informativní, nikdy se neporovnává.'
            subprotocol:
              type: string
              description: Token subprotokolu WebSocketu (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: Port WebSocketu, který používají hráči (`PUBLIC_WS_PORT`, jinak `WS_PORT`, jinak `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: Cesta WebSocketu.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Zda lze vytvářet nové účty.
        emailVerification:
          type: boolean
          description: Zda nové účty potvrzují svou adresu (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Zda se hře nabízí přihlášení přes Google.
            googleWeb:
              type: boolean
              description: Zda se přihlášení přes Google nabízí i webu (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: Dvoufázové ověření je vždy k dispozici.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Počet bitů důkazu práce, který vyžaduje registrace (0 znamená žádný).
        categories:
          type: array
          description: Oficiální tempa hry pro partie na rating (`RATED_CATEGORIES`), v pořadí serveru. Každé jiné tempo hry je `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Pravidla, která klient může zkontrolovat před odesláním formuláře.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: Nejmenší délka uživatelského jména (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: Největší délka uživatelského jména (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Regulární výraz, kterému musí nové uživatelské jméno odpovídat.
            passwordMinLength:
              type: integer
              description: Nejmenší délka hesla ve znacích (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Největší délka hesla v bajtech UTF-8.
            customTimeControls:
              type: boolean
              description: Zda výzvy a soukromé partie smějí používat vlastní tempa hry.
            reportsPerDay:
              type: integer
              description: Kolik hlášení smí hráč podat za 24 hodin (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Největší zpráva WebSocketu, kterou smí klient poslat, v bajtech.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Oficiální tempo hry.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 'ID kategorie: minuty a přídavek v sekundách (`3+2`).'
        baseSec:
          type: number
          minimum: 0
          description: Základní čas v sekundách.
        incSec:
          type: number
          minimum: 0
          description: Přídavek na tah v sekundách.
    AccountView:
      type: object
      description: Účet tak, jak ho vidí jeho hráč (`user` v odpovědích na přihlášení a v `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: ID účtu.
        username:
          type: string
          description: Uživatelské jméno.
        email:
          type: string
          format: email
          description: E-mailová adresa.
        emailVerified:
          type: boolean
          description: Zda je adresa potvrzená.
        mfaEnabled:
          type: boolean
          description: Zda je zapnuté dvoufázové ověření.
        googleLinked:
          type: boolean
          description: Zda je propojen účet Google.
        hasPassword:
          type: boolean
          description: '`false` u účtu vytvořeného přes Google, který si ještě nenastavil heslo.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Zda se přijímají přímé výzvy podle jména (viz `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Kdy byl účet vytvořen (ms od epochy Unixu).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Poslední přihlášení (ms od epochy Unixu), nebo `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Nová adresa ze změny e-mailu, která čeká na svůj odkaz, nebo `null`.
    SessionAnswer:
      type: object
      description: Nová relace.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Token relace pro hlavičku `Authorization` a pro WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: Absolutní konec relace (ms od epochy Unixu); limit nečinnosti ji může ukončit dříve.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Druhý krok přihlášení s dvoufázovým ověřením; pokračujte přes `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Token tohoto kroku pro `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Počet sekund zbývajících na dokončení kroku.
    LoginAnswer:
      description: Relace, nebo druhý krok přihlášení s dvoufázovým ověřením.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: První přihlášení přes Google; pokračujte přes `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Tiket pro `POST /auth/sso/complete`, platný 10 minut.
        suggestedUsername:
          type: string
          description: Uživatelské jméno odvozené ze jména u Googlu nebo z adresy, nebo `""`, když nic nevyhovuje.
    SsoNeedsPassword:
      type: object
      description: Adresu používá účet s heslem; pokračujte přes `POST /auth/sso/google/link`. Zatím není nic propojeno.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Tiket pro `POST /auth/sso/google/link`.
        username:
          type: string
          description: Uživatelské jméno toho účtu (vidí ho jen ten, kdo adresu prokázal u Googlu).
        expiresIn:
          type: integer
          const: 600
          description: Počet sekund, po které tiket zůstává platný.
    SsoFinishAnswer:
      description: Odpověď `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Pokus o přihlášení přes Google.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Pokus pro `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: URL Googlu, kterou je po kontrole třeba otevřít v systémovém prohlížeči.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state`, který musí Google poslat zpět.'
        expiresIn:
          type: integer
          const: 600
          description: Počet sekund, po které pokus zůstává platný.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Uživatelské jméno; dále pravidla serveru (viz popis).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: E-mailová adresa. Ořízne se o mezery na začátku a na konci a uloží se malými písmeny.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Heslo; dále pravidla pro hesla.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Uživatelské jméno, nebo e-mailová adresa (jakýkoli text s `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Nepovinné. Zobrazí se v seznamu přihlášených zařízení (například `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: '`mfaToken` z odpovědi na přihlášení (nebo z odpovědi na přihlášení přes Google).'
        code:
          type: string
          maxLength: 32
          description: Nepovinné. Šestimístný kód z ověřovací aplikace, nebo záložní kód.
        recoveryCode:
          type: string
          maxLength: 32
          description: Nepovinné. Záložní kód. Je potřeba jedno z `code` a `recoveryCode`.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: E-mailová adresa.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Parametr `token` z odkazu pro obnovení hesla.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Nové heslo; platí pravidla pro hesla z registrace.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Výzva PKCE S256 pro `codeVerifier` klienta (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Port naslouchacího procesu klienta na `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Výzva PKCE S256 pro `codeVerifier` stránky (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`attemptId` z `POST /auth/sso/google/start`.'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: Verifikátor PKCE; jeho SHA-256 musí odpovídat výzvě předané do `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state` tak, jak ho Google poslal zpět.'
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: '`code` tak, jak ho Google poslal zpět (tisknutelné ASCII bez mezer).'
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Nepovinné. `iss` tak, jak ho Google poslal zpět, pokud ho poslal.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`linkTicket` z `finish`, platný 10 minut.'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Heslo účtu.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`ssoTicket` z `finish`, platný 10 minut.'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Uživatelské jméno; platí pravidla registrace.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Aktivní relace, naposledy použité jako první.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Aktivní relace (přihlášené zařízení).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: ID relace pro `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: Přihlášení (ms od epochy Unixu).
        lastSeenAt:
          type: integer
          format: int64
          description: Poslední použití (ms od epochy Unixu), aktualizované nejvýše jednou za 5 minut (když server výrazně nestíhá, i později).
        expiresAt:
          type: integer
          format: int64
          description: Absolutní konec (ms od epochy Unixu); limit nečinnosti může relaci ukončit dříve.
        clientLabel:
          type:
            - string
            - 'null'
          description: '`clientLabel` z přihlášení, nebo `null`, když žádný neposlalo.'
        current:
          type: boolean
          description: Zda jde o relaci, ze které požadavek přichází.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Jeden záznam pro každou kategorii, ve které hráč odehrál partie na rating.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Aktivní sankce.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }`, dokud je účet pozastavený, jinak `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Záznam ratingu jedné kategorie.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: ID kategorie.
        rating:
          type: integer
          description: Rating.
        games:
          type: integer
          minimum: 0
          description: Partie odehrané v kategorii (započítané i nezapočítané).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Nejvyšší dosažený rating.
        provisional:
          type: boolean
          description: '`true`, dokud je záznam ještě v úvodní fázi bez ratingu nebo má méně než `PROVISIONAL_GAMES` započítaných partií (hra ho zobrazuje jako `1510?`).'
    ActiveSanction:
      type: object
