        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (databáze zůstala zamčená; `retryAfter: 1` v těle, bez hlavičky `Retry-After`), `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Nahlásit soupeře z nedávné partie
      description: |-
        Nahlásí soupeře z jedné z vlastních partií hráče, která skončila během posledních 7 dní. Hlášení samo o sobě nikdy nemění rating, sankci ani úroveň integrity. Zvyšuje prioritu prověření, kterou vidí moderátoři, a kromě `abuse` vyžádá analýzu partie enginem.

        Hlášení stejného soupeře za stejnou partii dostane stejnou odpověď a nic nezmění; odpověď o nahlášeném účtu nikdy nic neprozradí. `GET /games/{id}` hráčům partie předem sdělí, zda by hlášení bylo přijato (`reportable`).

        Tento endpoint si tělo kontroluje sám, v pořadí `gameId`, `reported`, `category`, `comment`: při chybě odpoví 400 `invalid_request` bez `field`. Pole, která nezná, ignoruje.

        **Limity:** `reports` (na hráče), potom `REPORTS_PER_DAY` (5) hlášení na hráče za 24 hodin (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Hlášení je přijato (nebo už bylo podáno dříve).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (bez `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: nejde o soupeře nahlašujícího hráče v partii, která skončila během posledních 7 dní.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, s hlavičkou `Retry-After`): `REPORTS_PER_DAY` hlášení za posledních 24 hodin. `rate_limited`: limit `reports` nebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (vyhledání relace narazilo na zamčenou databázi), `timeout`. Také `server_busy` s `retryAfter` 2 až 5, když server výrazně nestíhá (viz úvod): požadavek nebyl proveden.'
