openapi: 3.1.1
info:
  title: Scacelith 伺服器 HTTPS API
  version: "0.9.0"
  summary: 每一台 Scacelith 伺服器（官方伺服器與社群伺服器）共用的 HTTPS API。
  description: |-
    每一台 Scacelith 伺服器，包括官方的 `caissa.scacelith.com` 與任何社群伺服器，都提供這個 HTTPS API。對局本身以外的一切功能，遊戲都透過它進行：註冊與登入（含雙重驗證與 Google 登入）、帳號頁面、對局紀錄、PGN 下載與對局的 GIF 動畫、已登入的裝置、資料下載、刪除帳號，以及檢舉。

    即時對弈（配對、挑戰、著法、棋鐘）則經由同一台伺服器的 WebSocket（`wss://<host>/ws`）進行，並以本 API 的工作階段權杖開啟；相關說明請見 `PROTOCOL.md`，不在本文件範圍內。

    下文所列的預設值，是指未修改任何設定的伺服器；社群伺服器可能會調整這些值（所有設定項目請見 `CONFIG.md`）。

    ## 基礎 URL、連接埠與傳輸

    - 官方伺服器：`https://caissa.scacelith.com/api/v1`，TCP 連接埠 443。
    - 社群伺服器：`https://<SERVER_PUBLIC_HOST>[:<port>]/api/v1`。`API_PORT` 預設為 443；位於 NAT 或代理伺服器之後時，棋手連線所用的連接埠是 `PUBLIC_API_PORT`。
    - 遊戲的 WebSocket 預設位於同一個連接埠（可用 `WS_PORT` 改到其他連接埠；`GET /info` 會告訴用戶端它在哪裡）。
    - 採用 TLS 之上的 HTTP/1.1。設為 `TLS_MODE=proxy` 時，由伺服器前方的反向代理伺服器終止 TLS。`TLS_MODE=off`（純 HTTP）僅供本機開發使用。
    - 從電子郵件中的連結開啟的 HTML 頁面（`/verify-email`、`/reset-password`、`/confirm-email-change`）位於伺服器的根路徑，不在 `/api/v1` 之下。健康檢查端點在根路徑與 `/api/v1` 之下都會回應。Google 登入在伺服器上沒有任何頁面：Google 會將瀏覽器直接導回遊戲本身，位址為 `127.0.0.1`。
    - 結尾的斜線會被忽略（`/api/v1/info/` 等同於 `/api/v1/info`），路徑參數會經過 URL 解碼（不是有效 URL 編碼的參數會得到 400 `invalid_request`）。

    ## 要求

    - **JSON 本文**：`POST`、`PUT` 與 `DELETE` 要求以 `Content-Type: application/json` 傳送一個 JSON 物件。UTF-8 以外的 `charset` 會被拒絕，其他任何內容類型也一樣（415 `unsupported_media_type`）。空白本文視同 `{}`，而這正是不帶參數的端點所接受的內容（`POST /auth/logout`、`POST /auth/logout-all`、`DELETE /auth/sessions/{id}`）。
    - **大小與時間**：本文上限為 `HTTP_BODY_LIMIT` 位元組（預設為 16,384；`POST /gif` 另有 135,168 位元組的上限），超過時回應 413 `payload_too_large`。本文必須在 10 秒內送達，否則回應 408 `request_timeout`。發生這兩種錯誤後，伺服器都會關閉連線。
    - **嚴格的結構描述**：端點不認得的欄位會被拒絕，未標示為選用的欄位皆為必填，型別與長度也都會檢查。任何一項不符都會回應 400 `invalid_request`，並以 `field` 指出該欄位（巢狀欄位以點號連接，例如 `pow.nonce`）。字串不得包含控制字元。長度以 UTF-16 程式碼單位計算，因此基本多語言平面以外的字元（例如表情符號）算作兩個。不是 JSON 的本文會回應 400 `invalid_json`。`POST /gif` 與 `POST /reports` 會自行檢查本文（請見各端點的說明）。
    - **查詢字串**：同一個參數只採用第一次出現的值，未知的參數會被忽略，`+` 會解碼為空格：因此接受時限類別的端點，`3%2B2` 與 `3+2` 兩種寫法都接受。
    - **方法**：`HEAD` 即不含本文的 `GET`。對既有路徑使用 `OPTIONS` 會回應 204，並附上 `Allow` 標頭。該路徑不支援的其他任何方法都會回應 405 `method_not_allowed`，並附上 `Allow`。
    - **要求目標**：長度不得超過 4096 個字元（414 `uri_too_long`）。完全無法剖析的要求，或是標頭過大、送達過慢的要求，會得到內容為空的 400、431 或 408 回應，並且連線會被關閉。
    - **不支援 CORS**：本 API 服務的是遊戲，而不是網頁。伺服器從不傳送任何 `Access-Control-*` 標頭，因此網頁無法讀取回應；又因為只接受 JSON 本文，跨網站的寫入必須先經過預檢要求，而預檢一定會失敗。

    ## 回應與錯誤

    - 回應皆為 UTF-8 編碼的 JSON，但 PGN 下載（`application/x-chess-pgn`）、GIF 動畫（`image/gif`）與 HTML 頁面除外。時間皆為自 1970-01-01 UTC 起算的毫秒數。ID 皆為整數。對局 ID 最多 16 位數，但一律小於 2^53，因此 JSON 數值（雙精度浮點數）可以精確表示。
    - API 的每個回應都帶有 `Cache-Control: no-store`、`X-Content-Type-Options: nosniff`、`Referrer-Policy: no-referrer`、`X-Frame-Options: DENY`、`Cross-Origin-Resource-Policy: same-origin` 與 `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'`（HTML 頁面另有自己的政策）。設為 `TLS_MODE=native` 時，還會帶有 `Strict-Transport-Security: max-age=31536000`。
    - 從伺服器備妥回應的那一刻起，用戶端必須在 60 秒內讀取完畢，這只對大型回應（GIF、資料匯出、很長的 PGN）有影響。伺服器準備回應所花的時間，既不計入這 60 秒，也不計入「連續 30 秒沒有任何位元組進出即關閉連線」的時限。

    錯誤只有一種格式（`Error` 結構描述）：

    ```json
    { "error": "snake_case_code", "message": "An English sentence.", "retryAfter": 30 }
    ```

    `message` 供記錄使用，或作為備用文字；用戶端應依據 `error` 決定要顯示的內容。`retryAfter`（秒）只會出現在經過一段時間即會解除的拒絕中，此時回應也會帶有相同值的 `Retry-After` 標頭；唯一的例外是讀取對局紀錄、對局、棋手與排行榜時的 503 `busy`，它只有這個欄位。部分錯誤會附加其他欄位：`field`（輸入無效）、`reason`（`weak_password`、`pow_required`）、`pow`（`pow_required`）、`until`（`banned`）、`line` 與 `column`（`invalid_pgn`）。

    任何端點都可能回傳的錯誤：

    | 狀態 | `error` | 時機 |
    |---|---|---|
    | 400 | `invalid_request` | 本文不符合端點的結構描述（由 `field` 指出位置）、要求目標或 `Content-Length` 格式錯誤、路徑參數不是有效的 URL 編碼，或本文被截斷。 |
    | 400 | `invalid_json` | 本文不是 JSON。 |
    | 401 | `unauthorized` | 需要工作階段的端點沒有收到 `Authorization` 標頭。 |
    | 401 | `invalid_token` | 權杖格式錯誤、已過期、已撤銷，或屬於已刪除的帳號；在工作階段為選用的端點上也是如此。 |
    | 404 | `not_found` | 沒有這個端點。部分端點也會使用此錯誤：找不到該對局、棋手或工作階段。 |
    | 405 | `method_not_allowed` | 該路徑只支援其他方法（請見 `Allow`）。 |
    | 408 | `request_timeout` | 本文未在 10 秒內送達。 |
    | 413 | `payload_too_large` | 本文超過 `HTTP_BODY_LIMIT`（`POST /gif` 為 135,168 位元組）。 |
    | 414 | `uri_too_long` | 要求目標超過 4096 個字元。 |
    | 415 | `unsupported_media_type` | 本文不是 `application/json`，或其字元集不是 UTF-8。 |
    | 429 | `rate_limited` | 觸及速率限制（請見下文）：附有 `retryAfter` 與 `Retry-After` 標頭。 |
    | 500 | `internal_error` | 非預期的失敗。伺服器會將其記錄下來。 |
    | 503 | `timeout` | 伺服器未在 30 秒內回應（使用預設設定時，匯出為 60 秒，GIF 為 45 秒）。 |
    | 503 | `server_busy` | 查詢工作階段或變更帳號時發現資料庫遭到鎖定（`retryAfter` 為 1），或密碼雜湊佇列已滿（請見下文）。 |

    讀取端點（對局紀錄、對局、棋手、排行榜）與匯出在資料庫持續鎖定時，會回應 503 `busy` 並附上 `retryAfter: 1`。

    會檢查或雜湊密碼的端點，還可能回應下列其中一種錯誤，兩者都附有 5 至 15 秒之間的隨機 `retryAfter`：

    - 503 `server_busy`：伺服器的密碼雜湊佇列（`PASSWORD_HASH_QUEUE_MAX`）已滿，或等候逾時。
    - 429 `rate_limited`：佇列已達半滿，而此用戶端（一個 IPv4 位址或一個 IPv6 /48）已有 `PASSWORD_HASH_WAITERS_PER_SOURCE` 個雜湊在等候。這個 429 會退還該要求所取用的速率限制權杖。

    此時不會有任何變更，也不會計入失敗嘗試（`POST /auth/sso/google/link` 除外，它的票證嘗試次數與帳號失敗次數在雜湊之前就已計入），重設連結也依然有效。

    HTML 頁面會以 HTML 頁面回應錯誤，狀態碼相同。

    ## 驗證

    需要工作階段的端點，從 `Authorization` 標頭接受 Bearer 權杖（`bearerAuth` 配置）：

    ```
    Authorization: Bearer sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
    ```

    - **取得權杖**：權杖（`sct_` 後接 43 個 base64url 字元）來自 `POST /auth/login`（啟用雙重驗證時，再接著 `POST /auth/login/mfa`）、`POST /auth/sso/google/finish` 與 `POST /auth/sso/google/link`（Google 登入），以及 `POST /auth/sso/complete`。它們都會回應 `{ token, expiresAt, user }`。伺服器只儲存權杖的 SHA-256 雜湊值。
    - **必要的工作階段**：缺少標頭時回應 401 `unauthorized`，並附上 `WWW-Authenticate: Bearer realm="scacelith"`。權杖無效時回應 401 `invalid_token`，並附上 `WWW-Authenticate: Bearer realm="scacelith", error="invalid_token"`。用戶端收到 `invalid_token` 時，應捨棄該權杖並重新登入。
    - **選用的工作階段**：在 `GET /games/{id}`、`GET /games/{id}/pgn`、`GET /players/{username}` 與 `GET /players/{username}/games` 上，工作階段為選用。沒有標頭時，這些端點回應公開的內容；若有傳送標頭，其中的權杖就必須有效。
    - **有效期限**：工作階段在以下兩者中較早到來的時間點結束：登入後 `SESSION_MAX_DAYS`（90）天（即 `expiresAt`），或連續 `SESSION_IDLE_DAYS`（30）天未使用。每次使用都會延後閒置期限；伺服器最多每 5 分鐘寫入一次新值。一個帳號最多保留 `MAX_SESSIONS_PER_USER`（10）個工作階段：超過此數量時，新的登入會撤銷最舊的工作階段。
    - **撤銷**：登出（`POST /auth/logout`、`POST /auth/logout-all`、`DELETE /auth/sessions/{id}`）會撤銷工作階段；變更密碼（撤銷其他工作階段）、重設密碼與刪除帳號（撤銷所有工作階段），以及管理員，也會撤銷工作階段。透過 API 撤銷會立即生效，以已撤銷工作階段開啟的 WebSocket 也會被關閉。伺服器會將工作階段的查詢結果快取 30 秒，因此透過管理命令（一個獨立的處理程序）進行的撤銷，會在 30 秒內生效。
    - **範圍**：權杖只屬於一台伺服器，也可用來開啟該伺服器的 WebSocket。切勿將它傳送給其他伺服器。

    ## 速率限制與其他節流機制

    限制套用於以下兩種範圍之一。**用戶端**：一個 IPv4 位址，或一個 IPv6 /64（在代理模式下，位址取自 `TRUSTED_PROXIES` 位址所傳送的 `X-Forwarded-For`）；部分限制除了個別計算每個 /64 網路之外，還會將每個 IPv6 /48 視為整體來計算。**棋手**：已登入的帳號，不論其位址為何；在工作階段為選用的端點上，按棋手計算的限制，對未帶權杖的要求改按用戶端計算。

    每項限制都是一個權杖桶，可容納 `limit` 個要求，並以 `limit / window` 的速率持續補充；`retryAfter` 是距離下一個權杖的時間。標示為*共用*的限制，還會以等長的滑動視窗計算，使任何一個視窗內的要求數都不會明顯超過 `limit`。每項限制都以整台伺服器為範圍計算。當端點的某一項限制拒絕要求時，該要求在其他限制中取用的權杖會被退還。拒絕時回應 429 `rate_limited`，並附上 `retryAfter` 與 `Retry-After`。

    - **每位址層**：每個要求（任何路徑與方法，包括健康檢查端點與 WebSocket 升級）都會先從其用戶端的額度中取用一個權杖：每分鐘 `HTTP_RATE_PER_IP`（600）個，突發上限相當於半分鐘的量；IPv6 /48 則為 `HTTP_RATE_PER_PREFIX`（4 x `HTTP_RATE_PER_IP`）。每個用戶端同時進行中的要求也最多只能有 `IP_MAX_INFLIGHT`（32 x `WORKERS`）個（超過時 `retryAfter` 為 1）。被拒絕後仍持續發送要求的用戶端會遭到封鎖：一分鐘內被拒絕 `ABUSE_BLOCK_REFUSALS_PER_MIN`（600）次即封鎖 1 分鐘，6 小時內每次再遭封鎖，時間依序為 4、16 與 60 分鐘。`auth`、`auth_*` 與 `reauth` 限制的拒絕，每次算作 5 次；按棋手計算的限制則一律不計入。`ABUSE_EXEMPT` 中的位址會略過這一層，但不會略過帳號額度與端點限制。
    - **帳號額度**：每個帶有有效工作階段權杖的要求，也會計入其帳號：所有端點合計每分鐘 `USER_RATE_PER_MIN`（120）個，不論位址為何，突發上限相當於半分鐘的量。
    - **端點限制**：

    | 限制 | 預設值 | 計算單位 | 端點 |
    |---|---|---|---|
    | `auth` | `AUTH_RATE_PER_IP`（20）/ 10 分鐘，共用 | 用戶端；每個 IPv6 /48 為 `AUTH_RATE_PER_PREFIX`（5 x `AUTH_RATE_PER_IP`） | `POST /auth/register`、`/auth/login`、`/auth/login/mfa`、`/auth/verify-email/resend`、`/auth/password/forgot`、`/auth/password/reset`、`/auth/sso/google/link`、`/auth/sso/complete`；`POST /verify-email`、`/reset-password`、`/confirm-email-change` |
    | `auth_register` | `AUTH_REGISTER_PER_HOUR`（10）/ 小時，共用 | 用戶端；每個 IPv6 /48 為其 3 倍 | `POST /auth/register` |
    | `auth_mail` | `AUTH_MAIL_PER_HOUR`（10）/ 小時，共用 | 用戶端；每個 IPv6 /48 為其 3 倍 | `POST /auth/verify-email/resend` |
    | `auth_forgot` | `AUTH_FORGOT_PER_HOUR`（3）/ 小時，共用 | 用戶端；每個 IPv6 /48 為其 3 倍 | `POST /auth/password/forgot` |
    | `auth_forgot_day` | `AUTH_FORGOT_PER_DAY`（10）/ 24 小時，共用 | 用戶端；每個 IPv6 /48 為其 3 倍 | `POST /auth/password/forgot` |
    | `auth_reset` | `AUTH_RESET_PER_HOUR`（10）/ 小時，共用 | 用戶端；每個 IPv6 /48 為其 3 倍 | `POST /auth/password/reset`、`POST /reset-password` |
    | `reauth` | 數值與 `auth` 相同，但使用獨立的權杖桶，共用 | 用戶端與 IPv6 /48 | 需要輸入密碼的帳號變更（請見「重新驗證」），以及 `POST /account/export` |
    | `reauth_user` | `AUTH_REAUTH_PER_USER`（10）/ 10 分鐘，共用 | 棋手 | 與 `reauth` 相同的端點 |
    | `account` | 60 / 分鐘 | 棋手 | `GET /account/me`、`PUT /account/preferences` |
    | `account_games` | 60 / 分鐘 | 棋手 | `GET /account/games` |
    | `account_export` | 5 / 小時，共用 | 棋手 | `POST /account/export`（在 `reauth` 之前檢查；每次嘗試都會計入） |
    | `sessions` | 60 / 分鐘 | 棋手 | `POST /auth/logout`、`/auth/logout-all`、`GET /auth/sessions`、`DELETE /auth/sessions/{id}` |
    | `public_read` | 60 / 分鐘 | 棋手（未帶權杖時為用戶端） | `GET /players/{username}`、`/players/{username}/games`、`/games/{id}`、`/games/{id}/pgn`（四者共用一個權杖桶） |
    | `gif` | 30 / 分鐘 | 棋手 | `GET /games/{id}/gif`、`POST /gif`（兩者共用一個權杖桶） |
    | `gif_user_min`、`gif_user_hour` | `GIF_USER_RENDERS_PER_MIN`（4）/ 分鐘與 `GIF_USER_RENDERS_PER_HOUR`（30）/ 小時，共用 | 棋手 | 同上兩個端點，僅在必須實際製作 GIF 時（而非取自快取） |
    | `gif_ip_min`、`gif_ip_hour` | `GIF_IP_RENDERS_PER_MIN`（12）/ 分鐘與 `GIF_IP_RENDERS_PER_HOUR`（120）/ 小時，共用 | 用戶端（其所有帳號合計）；每個 IPv6 /48 為其 3 倍 | 同上，條件亦同 |
    | `reports` | 30 / 小時 | 棋手 | `POST /reports` |
    | `sso_start` | 30 / 10 分鐘，共用 | 用戶端；每個 IPv6 /48 為 90 | `POST /auth/sso/google/start` |
    | `sso_finish` | 30 / 分鐘 | 用戶端 | `POST /auth/sso/google/finish` |
    | `page` | 60 / 分鐘 | 用戶端 | `GET /verify-email`、`/reset-password`、`/confirm-email-change` |

    `GET /info` 與 `GET /leaderboard` 沒有自己的限制，只受每位址層約束。具有多項限制的端點，會依其說明中列出的順序逐一檢查。

    伺服器依下列順序處理要求：每位址層，接著是健康檢查端點；比對端點；驗證；帳號額度（要求帶有工作階段時）；端點的限制；本文；端點本身（GIF 端點只在確實需要製作 GIF 時，才會計入其製作限制）。因此，因權杖問題而被拒絕的要求，不會耗用端點的任何權杖；而本文無效的要求則會耗用。

    其他節流機制，由端點自行回應：

    - **同一登入名稱的登入失敗**（使用者名稱或電子郵件）：自第 `AUTH_FAILURES_PER_ACCOUNT`（5）次失敗起，每次嘗試的等待時間都是前一次的兩倍（2 秒、4 秒，依此類推，最長 15 分鐘）：回應 429 `too_many_attempts` 並附上 `retryAfter`。連續一小時沒有失敗後，計數即會清除。
    - **登入時第二驗證因素失敗**：自該帳號的第 5 個錯誤驗證碼起，適用相同規則。每個登入步驟最多接受 5 個錯誤的驗證碼。
    - **同一帳號的第二驗證因素驗證碼**：不論來自哪個位址，在登入與重新驗證時，每 15 分鐘最多 `AUTH_MFA_PER_ACCOUNT`（10）個驗證碼（驗證器驗證碼或復原碼，不論正確與否）；超過時會在檢查驗證碼之前就回應 429 `too_many_attempts`，因此復原碼不會被用掉。
    - **帳號的重新驗證失敗**（密碼或驗證碼錯誤）：適用相同規則（429 `too_many_attempts`），由所有進行重新驗證的端點共用。
    - **電子郵件**：每個地址每 5 分鐘最多一封確認或重設郵件（回應不變）；每個地址每小時最多一則「someone tried to use your address」（有人嘗試使用你的地址）通知。
    - **檢舉**：每位棋手 24 小時內最多 `REPORTS_PER_DAY`（5）次，超過時回應 429 `report_limit`。

    ## 工作量證明

    當 `POW_REGISTER_BITS` 大於 0（預設為 18；`GET /info` 以 `pow.register` 提供此值）時，`POST /auth/register` 一律需要工作量證明。`POST /auth/login` 與 `POST /auth/sso/google/link`（兩者使用同一種挑戰）只有在伺服器偵測到一波登入失敗之後的 5 分鐘內才需要（觸發門檻為 `POW_LOGIN_TRIGGER_PER_MIN`，難度為 `POW_LOGIN_BITS`）；用戶端可從回應得知。

    1. 未附證明（或證明遭拒）的要求會回應 428 `pow_required`，並附上 `reason` 與 `pow` 挑戰 `{ challenge, bits, expiresAt }`。
    2. 找出一個 nonce：最多 20 位數的十進位字串，使 `SHA-256(challenge + ":" + nonce)` 以 `bits` 個零位元開頭（從第一個位元組的最高有效位元算起）。18 位元平均約需計算 260,000 次雜湊。
    3. 在本文中加上 `"pow": { "challenge": "...", "nonce": "123456" }`，再次傳送同一個要求。

    挑戰的有效期為 2 分鐘，且只能使用一次，僅適用於單一端點與單一用戶端網路（一個 IPv4 位址或 IPv6 /64）。挑戰經過簽章，因此在它被送回之前，伺服器不必保存任何相關資料。`reason` 說明證明被拒的原因：`required`、`malformed`、`signature`、`endpoint`、`network`、`expired`、`bits`、`work` 或 `replayed`。

    ## 重新驗證

    變更帳號時須再次輸入密碼；若已啟用雙重驗證，還須提供第二驗證因素：

    - 只需密碼：`POST /account/password` 與 `POST /account/mfa/totp/setup`；
    - 密碼與驗證器驗證碼（不接受復原碼）：`POST /account/mfa/recovery-codes`；
    - 密碼與驗證器驗證碼或復原碼：`POST /account/mfa/totp/disable`、`POST /account/email`、`POST /account/export` 與 `POST /account/delete`。

    在本文中，`code` 存放 6 位數的驗證器驗證碼，`recoveryCode` 存放復原碼（`xxxx-xxxx-xx`；不分大小寫，空格與連字號也不影響）。在接受復原碼的地方，也可以將復原碼放在 `code` 中傳送。每個驗證碼只能使用一次：用過的驗證器驗證碼在下一個 30 秒時間步驟到來之前都會被拒絕，復原碼一經使用即失效。

    | 狀態 | `error` | 時機 |
    |---|---|---|
    | 403 | `invalid_password` | 密碼錯誤。 |
    | 403 | `mfa_code_required` | 已啟用雙重驗證，但 `code` 與 `recoveryCode` 都沒有傳送。 |
    | 403 | `invalid_code` | 驗證碼錯誤或已使用過。 |
    | 400 | `password_not_set` | 僅使用 Google 登入的帳號尚未設定密碼（可透過「忘記密碼」設定）。 |
    | 429 | `too_many_attempts` | 此帳號的失敗次數過多，或嘗試的驗證碼過多。 |
    | 503 / 429 | `server_busy` / `rate_limited` | 密碼雜湊佇列忙碌中。 |

    密碼與驗證碼的失敗會計入帳號的失敗計數，並記錄為安全事件。

    ## 指標連接埠

    除了 API 連接埠之外，伺服器還會在指標連接埠（`METRICS_PORT`，9464，繫結至 `METRICS_BIND`，預設為 127.0.0.1；請勿對外公開）上以純 HTTP 回應。它不屬於本 API：`GET /healthz` 回應 `ok`；`GET /readyz` 自啟動完成（每個分片都已重播其日誌，且所有監聽器都已繫結）起、直到開始關閉之前回應 `ready`，其餘時間回應 503 `not ready`；`GET /metrics` 提供 Prometheus 指標，若已設定 `METRICS_TOKEN`，則須以 `Authorization: Bearer <token>` 附上與其完全相同的權杖。
