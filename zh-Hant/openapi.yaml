paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: 取得伺服器的名稱、版本、連接埠與註冊規則
      description: |-
        用戶端在登入或連線之前需要的資訊：伺服器的名稱與 ID、WebSocket 通訊協定版本與 WebSocket 的位置、註冊規則、官方時限，以及用戶端在送出表單之前可以先行檢查的各項限制。

        **限制**：只有每位址層。
      security: []
      responses:
        '200':
          description: 伺服器的描述資訊。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：每位址層。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`。'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: 建立帳號
      description: |-
        建立帳號：在以寄出的連結確認電子郵件地址之後建立；若不需要電子郵件確認，則立即建立。

        **需要電子郵件確認時**（`REQUIRE_EMAIL_VERIFICATION`，預設值）：回應 202 `verification_sent`。此時帳號尚未建立：這筆註冊會等候 24 小時，並在這段期間保留其使用者名稱。伺服器會將一個在這 24 小時內有效的連結寄到該地址，每個地址每 5 分鐘最多一封（`POST /auth/verify-email/resend` 會寄出新的連結）；連結被使用時（按下 `/verify-email` 頁面上的按鈕），帳號隨即建立，地址也同時確認，棋手即可登入。在此之前，以該使用者名稱登入會回應 `invalid_credentials`，與未知帳號相同，公開個人資料也不存在。以相同地址進行的新註冊，會取代等候中的那一筆。若該地址已被其他帳號使用，回應也完全相同：此時不會寄出連結，改為通知該帳號的擁有者（每小時最多一次），使用者名稱也同樣會被保留，因此無從得知該地址是否已有帳號。連結未被使用的註冊會在 24 小時後捨棄，其使用者名稱也會重新開放。

        **不需要電子郵件確認時**（`REQUIRE_EMAIL_VERIFICATION=false`）：回應 201 `ready`，帳號立即建立，並可登入。

        **規則**：`username`：`USERNAME_MIN` 至 `USERNAME_MAX` 個字元（3 至 20），可使用字母、數字、`_` 與 `-`，須以字母或數字開頭（`GET /info` 以 `limits` 提供這些值）；保留名稱（`admin`、`moderator`、`deleted` 等）與部分前綴會被拒絕；不分大小寫，必須唯一。`email`：去除前後空白並以小寫儲存，須為純 ASCII，且網域須含點號。`password`：至少 `PASSWORD_MIN_LENGTH`（10）個字元，且 UTF-8 編碼後最多 256 位元組；不得包含使用者名稱或電子郵件地址的本機部分，也不得為常見密碼。

        **錯誤**，依下列順序檢查：403 `registration_closed`；400 `invalid_username`；400 `invalid_email`；400 `weak_password`；409 `username_taken`；428 `pow_required`；密碼雜湊佇列錯誤；409 `email_taken`（僅限不需要電子郵件確認時）。

        **限制**：`auth`，接著是 `auth_register`（每個用戶端每小時 10 次註冊）。**工作量證明**：當 `POW_REGISTER_BITS` 大於 0 時一律需要。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: 第一次嘗試，未附工作量證明
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: 附上工作量證明後再次傳送
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: 帳號已建立，可以登入（此伺服器不需要電子郵件確認）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: 註冊正在等候確認連結（或該地址已有帳號；回應不會透露是哪一種）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`（附 `field`）、`invalid_json`、`invalid_username`、`invalid_email`，或附有 `reason` 的 `weak_password`：`too_short`、`too_long`、`contains_username`、`contains_email` 或 `too_common`。'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`：此伺服器已關閉註冊（`GET /info` 顯示 `registration: closed`）。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`：已有帳號使用該使用者名稱，或另一個地址的等候中註冊保留了它。`email_taken`：另一個帳號已使用該地址（僅限不需要電子郵件確認時）。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`auth` 或 `auth_register` 限制，或密碼雜湊佇列。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（密碼雜湊佇列，或資料庫持續鎖定）、`timeout`。'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: 以密碼登入
      description: |-
        以使用者名稱或電子郵件地址加上密碼登入。可能的回應有兩種，狀態碼都是 200：一個工作階段；或在啟用雙重驗證時，一個須在 5 分鐘內以 `POST /auth/login/mfa` 完成的第二步驟。

        未知帳號、密碼錯誤與未設密碼的帳號，都會在相同的時間後得到相同的回應：401 `invalid_credentials`。帳號檢查（`banned`、`email_unverified`）只在密碼正確之後才會進行。同一登入名稱失敗達 `AUTH_FAILURES_PER_ACCOUNT`（5）次起，每次嘗試都必須等待（429 `too_many_attempts`）。

        **限制**：`auth`。**工作量證明**：只在發生一波登入失敗期間需要（428 `pow_required`）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: 一個工作階段，或啟用雙重驗證時登入的第二步驟。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: 已登入
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: 已啟用雙重驗證
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`：未知帳號、密碼錯誤，或帳號未設密碼。'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '僅在密碼正確之後：`banned`，附有 `until`（紀元毫秒數，永久停權時為 `null`），或 `email_unverified`（地址尚未確認的舊帳號）。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（此登入名稱的失敗延遲），或 `rate_limited`（`auth` 限制、密碼雜湊佇列）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（密碼雜湊佇列，或資料庫持續鎖定）、`timeout`。'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: 以第二驗證因素完成登入
      description: |-
        啟用雙重驗證時登入的第二步驟，在 `POST /auth/login` 或 Google 登入（`POST /auth/sso/google/finish` 或 `POST /auth/sso/google/link`）回應 `mfaRequired` 之後進行。請傳送 `code`（6 位數的驗證器驗證碼，或復原碼）或 `recoveryCode`。在此使用的復原碼隨即失效。

        每個步驟最多接受 5 個錯誤的驗證碼；密碼被重設或變更時，該步驟也會結束。在 Google 連結的密碼步驟之後，只有驗證碼在此通過，連結才會儲存。

        **限制**：`auth`，以及不論來自哪個位址，該帳號每 15 分鐘最多 `AUTH_MFA_PER_ACCOUNT`（10）個驗證碼；超過時不會檢查驗證碼，因此復原碼不會被耗用。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: 驗證器驗證碼
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: 復原碼
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: 已登入。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`：`code` 與 `recoveryCode` 都沒有傳送，或本文不符合結構描述；`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`：此步驟已過期、已使用、已因 5 個錯誤驗證碼而結束，或自第一步驟以來密碼已被重設或變更（請重新登入）。`invalid_code`：驗證碼錯誤或已使用過。'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned`（附 `until`）、`email_unverified`。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`：僅限 Google 連結的密碼步驟之後：該 Google 帳號在此期間已連結到另一個帳號。'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`：僅限 Google 連結的密碼步驟之後：帳號在此期間有所變更；請從遊戲中重新開始。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`：帳號的失敗延遲，或過去 15 分鐘內的 `AUTH_MFA_PER_ACCOUNT` 個驗證碼已用完。`rate_limited`：`auth` 限制。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` 附 `retryAfter: 1`：資料庫持續鎖定（若發生在 Google 連結步驟之後，則未建立任何連結：請從遊戲中重新開始）。`timeout`。'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: 登出此工作階段
      description: |-
        撤銷所用權杖的工作階段。以它開啟的 WebSocket 會被關閉。不需要本文（或傳送 `{}`）。

        **限制**：`sessions`。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 已登出。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`：本文不是 `{}`；`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`sessions` 限制或帳號額度。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（資料庫持續鎖定）、`timeout`。'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
        - sessions
      summary: 登出所有工作階段
      description: |-
        撤銷帳號的所有工作階段，包括目前這一個。以它們開啟的 WebSocket 都會被關閉。不需要本文（或傳送 `{}`）。

        **限制**：`sessions`。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 所有工作階段皆已登出。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`：本文不是 `{}`；`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`sessions` 限制或帳號額度。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（資料庫持續鎖定）、`timeout`。'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: 重新寄送確認連結
      description: |-
        重新寄送電子郵件確認連結。不論地址為何，回應都是 202 `accepted`，因此絕不會透露是否有帳號或註冊使用該地址。

        每個地址每 5 分鐘最多處理一次要求。使用該地址的等候中註冊，不論該地址是否已被其他帳號使用，都會重新獲得 24 小時，使其使用者名稱在兩種情況下保留同樣長的時間。只有在下列情況才會寄出連結：該地址沒有帳號時，寄給該筆註冊（新連結有效期為 24 小時，並取代先前的連結）；或寄給使用該地址、啟用中但尚未確認的帳號。

        **限制**：`auth`，接著是 `auth_mail`（每個用戶端每小時 10 次）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: 已受理（不論地址為何）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`auth` 或 `auth_mail` 限制（不論地址為何）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` 附 `retryAfter: 1`：查詢帳號時資料庫持續鎖定（等候中註冊的延期只會盡力而為，絕不會導致要求失敗）。`timeout`。'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: 寄送密碼重設連結
      description: |-
        寄送有效期一小時的密碼重設連結，開啟後會進入 `/reset-password` 頁面。不論地址為何，回應都是 202 `accepted`。連結只會寄給啟用中的帳號，每個地址每 5 分鐘最多一次。僅使用 Google 登入的帳號，可藉此設定第一組密碼。

        密碼找回的限制是整個 API 中最嚴格的，且全部以整台伺服器為範圍計算：每個用戶端（一個 IPv4 位址或一個 IPv6 /64）每小時 3 次（`AUTH_FORGOT_PER_HOUR`）、每 24 小時 10 次（`AUTH_FORGOT_PER_DAY`），每個 IPv6 /48 為這些數字的 3 倍；此外還有 `auth` 限制（每 10 分鐘 20 次），以及每個地址每 5 分鐘一封郵件的限制。不論是 202 還是 429，都不會透露是否有帳號使用該地址。設定新密碼另有自己的限制（`auth_reset`）。

        **限制**：`auth`、`auth_forgot`，接著是 `auth_forgot_day`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: 已受理（不論地址為何）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`auth`、`auth_forgot` 或 `auth_forgot_day` 限制（不論地址為何）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` 附 `retryAfter: 1`：資料庫持續鎖定。`timeout`。'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: 以重設連結的權杖設定新密碼
      description: |-
        以重設連結的權杖設定新密碼（`/reset-password` 頁面的作用相同）。新密碼須遵守註冊時的規則。

        重設會撤銷所有工作階段，並取消待處理的電子郵件地址變更；該帳號的其他重設連結隨即失效；地址視為已確認（連結已證明這一點）；帳號擁有者會收到一封郵件。雙重驗證不受影響。發生密碼雜湊佇列錯誤或 503 之後，連結依然有效。

        **限制**：`auth`，接著是 `auth_reset`（每個用戶端每小時 10 次，每個 IPv6 /48 為 30 次，與該頁面共用：每次嘗試都會雜湊一次密碼）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: 密碼已變更，所有工作階段皆已登出。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`：連結無效、已使用或已過期，或當初寄往的地址已不再屬於該帳號。`weak_password`（附 `reason`）。`invalid_request`、`invalid_json`。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`auth` 或 `auth_reset` 限制，或密碼雜湊佇列。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`：密碼雜湊佇列，或資料庫持續鎖定（`retryAfter: 1`，未做任何變更）。`timeout`。'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: 開始 Google 登入
      description: |-
        針對 PKCE 挑戰值與遊戲在 `127.0.0.1` 上之監聽器的連接埠，開始一次 Google 登入嘗試。回應會提供要在系統瀏覽器中開啟的 Google URL，以及此次嘗試的 `state`；嘗試的有效期為 10 分鐘。

        `authUrl` 包含 `client_id`、`redirect_uri`（由 `redirectPort` 與伺服器的來源標記組成）、`response_type=code`、`scope=openid email profile`、`state`、`nonce`、`code_challenge`（伺服器自己對 Google 使用之 PKCE 驗證值的 S256 值）及 `code_challenge_method=S256`，以及 `prompt=select_account`。遊戲會在開啟前檢查它（請見此標籤的說明）。

        **限制**：`sso_start`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: 此次嘗試。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`：此伺服器未提供 Google 登入。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`sso_start` 限制。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（資料庫持續鎖定）、`timeout`。'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: 將 Google 的回應交給伺服器
      description: |-
        將 Google 傳送到遊戲監聽器的 `code` 與 `state`，連同嘗試 ID 與 PKCE 驗證值一起交給伺服器。沒有驗證值，嘗試 ID 毫無用處；而沒有伺服器自己的 PKCE 驗證值與用戶端密碼，授權碼同樣毫無用處。

        伺服器先檢查嘗試（未知、已使用或已過期：410），再檢查驗證值（錯誤的驗證值不會使嘗試失效），接著將嘗試標記為已使用，檢查 `state` 與 `iss`，向 Google 兌換授權碼，並驗證 ID 權杖。回應（200）為下列其中之一：

        - `{ token, expiresAt, user }`：已登入連結的帳號；
        - `{ mfaRequired, mfaToken, expiresIn }`：接著呼叫 `POST /auth/login/mfa`；
        - `{ needsUsername, ssoTicket, suggestedUsername }`：新帳號；請在 10 分鐘內接著呼叫 `POST /auth/sso/complete`。`suggestedUsername` 取自 Google 名稱或電子郵件地址，若都不合用則為 `""`；
        - `{ needsPassword, linkTicket, username, expiresIn }`：使用該地址的帳號設有密碼；接著呼叫 `POST /auth/sso/google/link`。此時尚未建立任何連結。

        **限制**：`sso_finish`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: 一個工作階段、第二步驟，或首次 Google 登入的下一個步驟。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: 已登入連結的帳號
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: 已啟用雙重驗證
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: 新棋手
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: 設有密碼的帳號正在使用該地址
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`：驗證值與此次嘗試的挑戰值不符（嘗試仍可使用）。`sso_email_unverified`：Google 尚未確認該地址。`registration_closed`。`account_disabled`。僅限已連結的帳號：`banned`（附 `until`）、`email_unverified`。'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`：此伺服器未提供 Google 登入。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`：有一個未設密碼的啟用中帳號正在使用該地址（不會透露是哪個帳號）。'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`：嘗試未知、已使用或已過期。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`sso_finish` 限制。'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（資料庫持續鎖定）、`timeout`。'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: 以密碼將 Google 連結到現有帳號
      description: |-
        在 `finish` 回應 `needsPassword` 之後：以棋手在遊戲中輸入的該帳號密碼，將 Google 連結到這個現有帳號。回應（200）是一個工作階段（連結已儲存，棋手已登入）；或在啟用雙重驗證時為 `{ mfaRequired, mfaToken, expiresIn }`：接著呼叫 `POST /auth/login/mfa`，只有驗證碼在那裡通過，連結才會儲存。

        密碼錯誤不會使票證失效，總共可嘗試 5 次。嘗試次數在即將檢查密碼之前才扣除：429 `too_many_attempts` 或 428 `pow_required` 不會扣除次數，而密碼雜湊佇列的拒絕（503 `server_busy`、429 `rate_limited`）則已扣除一次，並計為帳號的一次失敗。失敗延遲與 `POST /auth/login` 使用同一個計數器。

        **限制**：`auth`（含其 IPv6 /48 計數）。**工作量證明**：與 `POST /auth/login` 相同。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: 一個工作階段，或登入的第二步驟。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`：密碼錯誤；票證仍然有效，總共可嘗試 5 次。'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned`（附 `until`），僅在密碼正確之後。'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`：此伺服器未提供 Google 登入。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`：該 Google 帳號在此期間已連結到另一個帳號。'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`：票證未知、已使用或已過期；第 5 次密碼錯誤；帳號的狀態或地址在 `finish` 之後有所變更；或在儲存連結期間，帳號的狀態、地址、密碼或雙重驗證有所變更。請從遊戲中重新開始。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（帳號的失敗延遲），或 `rate_limited`（`auth` 限制、密碼雜湊佇列）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`：密碼雜湊佇列，或資料庫持續鎖定（`retryAfter: 1`，未建立任何連結）。`timeout`。'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: 為首次 Google 登入建立帳號
      description: |-
        在 `finish` 回應 `needsUsername` 之後：以選定的使用者名稱建立帳號（適用註冊規則），並將其登入。此帳號沒有密碼：`hasPassword` 為 `false`，可透過「忘記密碼」（`POST /auth/password/forgot`）為它設定密碼。

        **限制**：`auth`（含其 IPv6 /48 計數）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: 帳號已建立並已登入。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`、`invalid_request`、`invalid_json`。'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`。'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`：此伺服器未提供 Google 登入。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`（已有帳號使用該使用者名稱，或另一個地址的等候中註冊保留了它）、`sso_already_linked`、`email_taken`。'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`：票證未知、已使用或已過期。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`auth` 限制。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（資料庫持續鎖定）、`timeout`。'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: 列出已登入的裝置
      description: |-
        帳號目前有效的工作階段（已登入的裝置），最近使用的排在最前面。`current` 標示發出此要求的工作階段。`lastSeenAt` 最多每 5 分鐘更新一次；`expiresAt` 是絕對的結束時間，閒置期限可能使工作階段更早結束。

        **限制**：`sessions`。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 有效的工作階段。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`sessions` 限制或帳號額度。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（資料庫持續鎖定）、`timeout`。'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: 登出單一裝置
      description: |-
        登出帳號的某一個工作階段；目前的工作階段也可以登出。以它開啟的 WebSocket 會被關閉。不需要本文（或傳送 `{}`）。

        **限制**：`sessions`。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 該工作階段已登出。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`：本文不是 `{}`，或 `id` 不是有效的 URL 編碼；`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`：此帳號沒有這個 ID 的有效工作階段。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`sessions` 限制或帳號額度。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（資料庫持續鎖定）、`timeout`。'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: 取得帳號、等級分與生效中的處分
      description: |-
        棋手本人所見的帳號：帳號資訊（也就是每個登入回應中的 `user`）、棋手下過計分對局的每個類別各一筆等級分紀錄、生效中的處分，以及停權狀態。反作弊系統的誠信等級從不顯示。

        **限制**：`account`。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 帳號。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`，或 `invalid_token`（帳號已刪除時也是如此）。'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`account` 限制或帳號額度。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（資料庫持續鎖定）、`timeout`。'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: 接受或拒絕直接挑戰
      description: |-
        設定其他棋手是否可以透過使用者名稱向此棋手發起挑戰。設為 `none` 時，直接挑戰會被拒絕：發起挑戰的一方會被告知該棋手目前無法對局。不需要重新驗證。

        **限制**：`account`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: 目前生效的偏好設定。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`account` 限制或帳號額度。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（資料庫持續鎖定）、`timeout`。'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: 變更密碼
      description: |-
        變更密碼。需要提供目前的密碼，但即使已啟用雙重驗證，也不需要第二驗證因素。新密碼須遵守註冊規則（在檢查目前的密碼之後才檢查）。

        變更會撤銷所有其他工作階段（目前這一個仍保持登入）、取消待處理的電子郵件地址變更、使該帳號的密碼重設連結失效，並寄一封郵件給帳號擁有者。

        **重新驗證**：只需密碼。**限制**：`reauth`，接著是 `reauth_user`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: 密碼已變更。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set`（僅使用 Google 登入的帳號）、`weak_password`（附 `reason`）、`invalid_request`、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`：目前的密碼錯誤，或在檢查此要求期間，密碼剛好被重設或變更。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（帳號的重新驗證失敗），或 `rate_limited`（`reauth` 或 `reauth_user` 限制、帳號額度、密碼雜湊佇列）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（密碼雜湊佇列，或資料庫持續鎖定）、`timeout`。'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: 開始啟用雙重驗證
      description: |-
        儲存一組新的待啟用驗證器金鑰（取代先前任何待啟用的金鑰），並將它傳回給驗證器應用程式使用（提供文字形式，以及可顯示為 QR 碼的 `otpauth://` URI）。此時雙重驗證尚未啟用：須以此金鑰產生的驗證碼呼叫 `POST /account/mfa/totp/enable` 才會啟用。

        **重新驗證**：只需密碼。**限制**：`reauth`，接著是 `reauth_user`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: 待啟用的金鑰。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set`（僅使用 Google 登入的帳號）、`invalid_request`、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`（在檢查密碼之前檢查）。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（帳號的重新驗證失敗），或 `rate_limited`（`reauth` 或 `reauth_user` 限制、帳號額度、密碼雜湊佇列）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（密碼雜湊佇列，或資料庫持續鎖定）、`timeout`。'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: 完成雙重驗證的啟用並取得復原碼
      description: |-
        以待啟用金鑰產生的驗證碼（正好 6 位數）啟用雙重驗證。此處不要求密碼，因為在設定步驟時已經提供過。回應包含 10 組復原碼，只會顯示這一次。

        **限制**：`reauth`，接著是 `reauth_user`；錯誤的驗證碼會計入帳號的重新驗證失敗次數。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: 雙重驗證已啟用。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`：`code` 不是正好 6 位數，或本文不符合結構描述；`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`：驗證碼錯誤（請檢查裝置的時間）。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`；`mfa_setup_required`：沒有待啟用的金鑰（請先呼叫 `POST /account/mfa/totp/setup`）。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（帳號的重新驗證失敗），或 `rate_limited`（`reauth` 或 `reauth_user` 限制、帳號額度）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（資料庫持續鎖定）、`timeout`。'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: 停用雙重驗證
      description: |-
        停用雙重驗證。金鑰與復原碼會被刪除，帳號擁有者會收到一封郵件。

        **重新驗證**：密碼，以及驗證器驗證碼或復原碼（必須提供 `code` 或 `recoveryCode` 其中之一）。**限制**：`reauth`，接著是 `reauth_user`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: 雙重驗證已停用。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set`（僅使用 Google 登入的帳號）、`invalid_request`、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required`（`code` 與 `recoveryCode` 都沒有提供，在檢查密碼之前檢查）、`invalid_password`、`invalid_code`。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（重新驗證失敗，或此帳號嘗試的驗證碼過多），或 `rate_limited`（`reauth` 或 `reauth_user` 限制、帳號額度、密碼雜湊佇列）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（密碼雜湊佇列，或資料庫持續鎖定）、`timeout`。'
  /account/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags:
        - two-step-verification
      summary: 更換復原碼
      description: |-
        以 10 組新的復原碼取代現有的復原碼；舊的復原碼隨即失效。

        **重新驗證**：密碼，以及放在 `code` 中的驗證器驗證碼（復原碼會被拒絕，回應 403 `invalid_code`）。**限制**：`reauth`，接著是 `reauth_user`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodesRequest'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: 新的復原碼，只會顯示這一次。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - recoveryCodes
                properties:
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set`（僅使用 Google 登入的帳號）、`invalid_request`、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`、`mfa_code_required`、`invalid_code`（提供復原碼時也是如此）。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（重新驗證失敗，或此帳號嘗試的驗證碼過多），或 `rate_limited`（`reauth` 或 `reauth_user` 限制、帳號額度、密碼雜湊佇列）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（密碼雜湊佇列，或資料庫持續鎖定）、`timeout`。'
  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: 變更電子郵件地址
      description: |-
        變更帳號的電子郵件地址。`newEmail` 會先去除前後空白並轉為小寫，再以與註冊地址相同的方式檢查。

        **需要電子郵件確認時**（預設）：回應 202 `verification_sent`。一個有效期 24 小時的連結會寄到新地址；連結會開啟 `/confirm-email-change`，只有在棋手按下該頁面的按鈕時，地址才會變更。在此之前，`GET /account/me` 會以 `pendingEmail` 顯示新地址。新的要求會取代待處理的要求；變更或重設密碼則會將其取消。不論由誰提出，同一個新地址每 5 分鐘最多只會收到一個連結（針對已在待處理中之變更的要求，會沿用先前寄出且仍然有效的連結）；回應都相同。目前的地址會收到通知，告知有人要求將地址變更為某個經遮蔽處理的地址（`a***@example.org`）。若新地址已被其他帳號使用，回應與 `pendingEmail` 也都相同：此時不會寄出連結，因此該變更永遠不會完成，改為通知該地址的擁有者（每小時最多一次）。

        連結經確認後，地址隨即變更並視為已確認，各裝置仍保持登入，先前寄出的連結（確認、密碼重設、其他變更）都會失效，原地址也會收到通知，其中的新地址經過遮蔽處理。

        **不需要電子郵件確認時**（`REQUIRE_EMAIL_VERIFICATION=false`）：地址立即變更（200 `email_changed`），原地址會收到通知。若該地址已被其他帳號使用，回應為 409 `email_taken`，該地址的擁有者會收到通知。

        **重新驗證**：密碼；若已啟用雙重驗證，還需要驗證器驗證碼或復原碼。`invalid_email` 與 `same_email` 在檢查密碼之前檢查，因此不會計為失敗。**限制**：`reauth`，接著是 `reauth_user`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: 地址已立即變更（此伺服器不需要電子郵件確認）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: 新地址（儲存時的形式）。
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: 確認連結已寄到新地址（或該地址屬於另一個帳號；回應不會透露是哪一種）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`、`same_email`（帳號目前的地址）、`password_not_set`（僅使用 Google 登入的帳號）、`invalid_request`、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`（密碼變更或重設搶先於此要求完成時也是如此：不會寄出連結）、`mfa_code_required`、`invalid_code`。'
        '408':
