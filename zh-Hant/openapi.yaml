        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
    post:
      operationId: submitResetPasswordPage
      tags:
        - pages
      summary: 透過重設表單設定新密碼
      description: |-
        重設頁面的表單；作用與 `POST /auth/password/reset` 相同：所有裝置都會登出，待處理的電子郵件地址變更會被取消，其他重設連結隨即失效，地址視為已確認，帳號擁有者會收到一封郵件。

        先檢查連結，再檢查兩次輸入的密碼是否相同，最後檢查密碼規則。伺服器忙碌時，會重新顯示表單並附上 `Retry-After`，連結依然有效。

        **限制**：`auth`，接著是 `auth_reset`（與 `POST /auth/password/reset` 共用）。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
      responses:
