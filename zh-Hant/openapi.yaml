        '503':
          description: 伺服器正在啟動或關閉。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        登入回應所提供的工作階段權杖（`sct_` 後接 43 個 base64url 字元），放在 `Authorization` 標頭中：`Authorization: Bearer <token>`。前綴必須正好是 `Bearer`（區分大小寫）加上一個空格；缺少此前綴的值，或不是由 1 至 512 個可列印 ASCII 字元組成的權杖，都會與其他無效權杖一樣回應 401 `invalid_token`。空白標頭視同沒有標頭。
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: 對局 ID：最多 16 位數、不含前導零的正十進位整數，小於 2^53。
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: 工作階段 ID，與 `GET /auth/sessions` 提供的相同，寫法不含前導零（`03` 不是工作階段 3）。
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: 棋手的使用者名稱，不分大小寫。伺服器接受任何由 2 至 24 個 `[A-Za-z0-9_.-]` 字元組成的名稱（這是它曾經允許過的最寬鬆規則）。
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: 對局 ID；只會列出比它更早的對局。請傳入上一頁的 `next`。空白值視同未提供。
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: 每頁筆數，1 至 50。最多 3 位數的更大數字視為 50；空白值視同未提供。
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: 電子郵件連結的權杖（43 個 base64url 字元）。缺少或錯誤時，會顯示「link invalid or expired」（連結無效或已過期）頁面。
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: 伺服器的每個回應都禁止快取。
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: 重試前須等待的秒數；與本文中的 `retryAfter` 值相同。
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Bearer 驗證挑戰，權杖無效時附有 `error="invalid_token"`。
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: 伺服器在此回應之後關閉連線。
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request`（本文中的某個欄位有問題時附 `field`）或 `invalid_json`。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: 某個欄位不符合結構描述
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: 本文不是 JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: 密碼強度太弱
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: 無法讀取的 PGN
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized`（沒有 `Authorization` 標頭）或 `invalid_token`（權杖格式錯誤、已過期、已撤銷，或屬於已刪除的帳號）。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: 沒有工作階段
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: 無效的權杖
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: 要求遭到拒絕。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: 重新驗證時密碼錯誤
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: 已停權的帳號
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found`，或此伺服器已關閉的功能。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`：本文未在 10 秒內送達。伺服器會關閉連線。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: 要求與伺服器的狀態衝突。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`：Google 登入嘗試或票證未知、已使用或已過期；請從遊戲中重新開始。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`：本文超過 `HTTP_BODY_LIMIT`（預設為 16,384 位元組）。伺服器會關閉連線。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`：要求目標超過 4096 個字元。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`：本文不是 `application/json`，或其字元集不是 UTF-8。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`：對局超過 `GIF_MAX_PLIES`（600）個半回合。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`：請解出 `pow` 挑戰，並附上 `pow: { challenge, nonce }` 再次傳送相同的要求。`reason` 說明原因：`required`、`malformed`、`signature`、`endpoint`、`network`、`expired`、`bits`、`work` 或 `replayed`。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited`（速率限制、帳號額度或密碼雜湊佇列）或 `too_many_attempts`（帳號的節流機制），附有 `retryAfter` 與 `Retry-After` 標頭。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: 速率限制
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: 此帳號失敗次數過多
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`：非預期的失敗。伺服器會將其記錄下來。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`：`state` 或 `iss` 錯誤，或 Google 拒絕了授權碼，或傳來無法通過驗證的 ID 權杖。回應絕不會包含 Google 的原文訊息。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`、`busy` 或 `timeout`：若有提供 `retryAfter`，請在其後重試。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: 伺服器忙碌中
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: 資料庫持續鎖定（讀取時）
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: 伺服器處理時間過長
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: GIF 動畫，以附件形式提供。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '本伺服器的對局為 `attachment; filename="scacelith-<id>.gif"`，以 `POST /gif` 傳送的 PGN 則為 `attachment; filename="scacelith-game.gif"`。'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: 檔案大小，以位元組為單位。
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: HTML 頁面。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: 說明拒絕原因的 HTML 頁面。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: 表單未在 10 秒內送達（HTML 頁面）。伺服器會關閉連線。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: 說明衝突原因的 HTML 頁面。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: 表單超過 `HTTP_BODY_LIMIT`（HTML 頁面）。伺服器會關閉連線。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: 本文既不是表單（`application/x-www-form-urlencoded`）也不是 JSON，或其字元集不是 UTF-8（HTML 頁面）。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: 觸及速率限制（HTML 頁面），附 `Retry-After`。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: 非預期的失敗（標題為「Server error」（伺服器錯誤）的 HTML 頁面）。伺服器會將其記錄下來。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: 伺服器忙碌中（資料庫持續鎖定，附 `Retry-After`）或處理時間過長（標題為「Server error」（伺服器錯誤）的 HTML 頁面）。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: JSON API 所有錯誤回應的統一格式。
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: '`snake_case` 格式的錯誤代碼。用戶端應依據它決定要顯示的內容。'
          examples:
            - rate_limited
        message:
          type: string
          description: 一句英文句子，供記錄使用，或作為備用文字。
        retryAfter:
          type: integer
          minimum: 1
          description: 重試前須等待的秒數，只會出現在經過一段時間即會解除的拒絕中。此時回應也會帶有相同值的 `Retry-After` 標頭，但讀取對局紀錄、對局、棋手與排行榜時的 503 `busy` 除外。
        field:
          type: string
          description: 有問題的欄位或查詢參數（`invalid_request`、`invalid_option`，以及 `GET /account/games` 的 `invalid_cursor`、`invalid_limit` 與 `invalid_filter`）。巢狀欄位以點號連接（`pow.nonce`）。
        reason:
          type: string
          description: '原因：`weak_password` 所違反的規則，或要求、拒絕工作量證明的原因（`pow_required`）。'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: '僅限 `banned`：停權結束時間（紀元毫秒數），永久停權時為 `null`。'
        line:
          type: integer
          minimum: 1
          description: '僅限 `invalid_pgn`：錯誤所在的行，從 1 起算。'
        column:
          type: integer
          minimum: 1
          description: '僅限 `invalid_pgn`：錯誤所在的欄，從 1 起算，以字元計。'
    PowChallenge:
      type: object
      description: 工作量證明挑戰（428 `pow_required` 中的 `pow`）。
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: 經簽章的挑戰，須原封不動地送回。
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: '`SHA-256(challenge + ":" + nonce)` 開頭必須具有的零位元數。'
        expiresAt:
          type: integer
          format: int64
          description: 挑戰的到期時間（紀元毫秒數），即發出後 2 分鐘。
    PowAnswer:
      type: object
      description: 工作量證明挑戰的解答。
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: 428 回應中的 `challenge`，須與收到時完全相同。
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: 最多 20 位數的十進位字串，使 `SHA-256(challenge + ":" + nonce)` 以 `bits` 個零位元開頭。
    ServerInfo:
      type: object
      description: 用戶端在登入或連線之前需要的資訊。
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: 伺服器的名稱（`SERVER_NAME`）。
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: 資料庫首次啟動時取得的 UUID。重新啟動後仍維持不變。資料庫無法提供時為 `null`。
        motd:
          type: string
          description: 今日訊息（`SERVER_MOTD`），可能為空。
        protocol:
          type: object
          description: WebSocket 通訊協定（`PROTOCOL.md`）。
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: 伺服器支援的最舊通訊協定版本。
            max:
              type: integer
              minimum: 1
              description: 伺服器支援的最新通訊協定版本。
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 通訊協定結構描述的指紋（其標準形式之 SHA-256 的前 4 個位元組，以無號整數表示）；僅供參考。
            subprotocol:
              type: string
              description: WebSocket 子通訊協定名稱（`Sec-WebSocket-Protocol`）。
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: 棋手所用的 WebSocket 連接埠（`PUBLIC_WS_PORT`；未設定時為 `WS_PORT`，再未設定則為 `API_PORT`）。
        wsPath:
          type: string
          const: /ws
          description: WebSocket 的路徑。
        registration:
          type: string
          enum:
            - open
            - closed
          description: 是否可以建立新帳號。
        emailVerification:
          type: boolean
          description: 新帳號是否需要確認電子郵件地址（`REQUIRE_EMAIL_VERIFICATION`）。
        sso:
          type: object
          required:
            - google
          properties:
            google:
              type: boolean
              description: 是否提供 Google 登入。
        mfa:
          type: boolean
          const: true
          description: 雙重驗證一律可用。
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: 註冊所需的工作量證明位元數（0 表示不需要）。
        categories:
          type: array
          description: 官方（計分）時限（`RATED_CATEGORIES`），依伺服器的順序排列。其他任何時限皆為 `custom`。
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: 用戶端在送出表單之前可以先行檢查的規則。
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: 使用者名稱的最短長度（`USERNAME_MIN`）。
            usernameMax:
              type: integer
              description: 使用者名稱的最長長度（`USERNAME_MAX`）。
            usernamePattern:
              type: string
              description: 新使用者名稱必須符合的規則運算式。
            passwordMinLength:
              type: integer
              description: 密碼的最短長度，以字元計（`PASSWORD_MIN_LENGTH`）。
            passwordMaxBytes:
              type: integer
              description: 密碼的最長長度，以 UTF-8 位元組計。
            customTimeControls:
              type: boolean
              description: 挑戰與私人對局是否可以使用自訂時限。
            reportsPerDay:
              type: integer
              description: 每位棋手每 24 小時可提出的檢舉次數（`REPORTS_PER_DAY`）。
            wsMaxMessageBytes:
              type: integer
              description: 用戶端可傳送的 WebSocket 訊息大小上限，以位元組計。
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 97842216
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: 官方時限。
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 類別 ID，由分鐘數與加秒秒數組成（`3+2`）。
        baseSec:
          type: number
          minimum: 0
          description: 基本時間，以秒為單位。
        incSec:
          type: number
          minimum: 0
          description: 每步加秒，以秒為單位。
    AccountView:
      type: object
      description: 棋手本人所見的帳號（登入回應與 `GET /account/me` 中的 `user`）。
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: 帳號 ID。
        username:
          type: string
          description: 使用者名稱。
        email:
          type: string
          format: email
          description: 電子郵件地址。
        emailVerified:
          type: boolean
          description: 地址是否已確認。
        mfaEnabled:
          type: boolean
          description: 是否已啟用雙重驗證。
        googleLinked:
          type: boolean
          description: 是否已連結 Google 帳號。
        hasPassword:
          type: boolean
          description: '透過 Google 建立且尚未設定密碼的帳號為 `false`。'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: 是否接受透過使用者名稱發起的直接挑戰（請見 `PUT /account/preferences`）。
        createdAt:
          type: integer
          format: int64
          description: 帳號建立時間（紀元毫秒數）。
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: 上次登入時間（紀元毫秒數），或 `null`。
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: 等候連結確認之電子郵件地址變更的新地址，或 `null`。
    SessionAnswer:
      type: object
      description: 新的工作階段。
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: 工作階段權杖，用於 `Authorization` 標頭與 WebSocket。
        expiresAt:
          type: integer
          format: int64
          description: 工作階段的絕對結束時間（紀元毫秒數）；閒置期限可能使其更早結束。
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: 啟用雙重驗證時登入的第二步驟；接著呼叫 `POST /auth/login/mfa`。
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: 此步驟的權杖，用於 `POST /auth/login/mfa`。
        expiresIn:
          type: integer
          const: 300
          description: 完成此步驟的剩餘秒數。
    LoginAnswer:
      description: 一個工作階段，或啟用雙重驗證時登入的第二步驟。
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: 首次 Google 登入；接著呼叫 `POST /auth/sso/complete`。
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: 用於 `POST /auth/sso/complete` 的票證，有效期 10 分鐘。
        suggestedUsername:
          type: string
          description: 根據 Google 名稱或電子郵件地址產生的使用者名稱，若都不合用則為 `""`。
    SsoNeedsPassword:
      type: object
      description: 設有密碼的帳號正在使用該地址；接著呼叫 `POST /auth/sso/google/link`。此時尚未建立任何連結。
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: 用於 `POST /auth/sso/google/link` 的票證。
        username:
          type: string
          description: 該帳號的使用者名稱（只有已向 Google 證明擁有該地址的人才看得到）。
        expiresIn:
          type: integer
          const: 600
          description: 票證的剩餘有效秒數。
    SsoFinishAnswer:
      description: '`POST /auth/sso/google/finish` 的回應。'
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: 一次 Google 登入嘗試。
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: 此次嘗試，用於 `POST /auth/sso/google/finish`。
        authUrl:
          type: string
          format: uri
          description: 要在系統瀏覽器中開啟的 Google URL（須先通過檢查）。
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Google 必須送回的 `state`。
        expiresIn:
          type: integer
          const: 600
          description: 嘗試的剩餘有效秒數。
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: 使用者名稱；另須符合伺服器的規則（請見說明）。
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: 電子郵件地址。會去除前後空白並以小寫儲存。
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: 密碼；另須符合密碼規則。
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: 使用者名稱或電子郵件地址（任何含有 `@` 的文字）。
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: 選用。顯示於已登入裝置的清單中（例如 `Scacelith 1.4 (Windows)`）。
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: 登入回應（或 Google 登入回應）中的 `mfaToken`。
        code:
          type: string
          maxLength: 32
          description: 選用。6 位數的驗證器驗證碼，或復原碼。
        recoveryCode:
          type: string
          maxLength: 32
          description: 選用。復原碼。必須提供 `code` 與 `recoveryCode` 其中之一。
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: 電子郵件地址。
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: 重設連結的 `token` 參數。
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: 新密碼；適用註冊時的密碼規則。
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: 用戶端 `codeVerifier` 的 S256 PKCE 挑戰值（`BASE64URL(SHA-256(codeVerifier))`）。
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: 用戶端在 `127.0.0.1` 上之監聽器的連接埠。
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`POST /auth/sso/google/start` 傳回的 `attemptId`。'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: PKCE 驗證值；其 SHA-256 必須與提供給 `start` 的挑戰值相符。
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Google 送回的 `state`，原樣傳送。
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: Google 送回的 `code`，原樣傳送（不含空格的可列印 ASCII 字元）。
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: 選用。Google 有送回 `iss` 時，原樣傳送。
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`finish` 傳回的 `linkTicket`，有效期 10 分鐘。'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: 帳號的密碼。
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`finish` 傳回的 `ssoTicket`，有效期 10 分鐘。'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: 使用者名稱；適用註冊規則。
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: 有效的工作階段，最近使用的排在最前面。
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: 一個有效的工作階段（一台已登入的裝置）。
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: 工作階段 ID，用於 `DELETE /auth/sessions/{id}`。
        createdAt:
          type: integer
          format: int64
          description: 登入時間（紀元毫秒數）。
        lastSeenAt:
          type: integer
          format: int64
          description: 上次使用時間（紀元毫秒數），最多每 5 分鐘更新一次。
        expiresAt:
          type: integer
          format: int64
          description: 絕對結束時間（紀元毫秒數）；閒置期限可能使工作階段更早結束。
        clientLabel:
          type:
            - string
            - 'null'
          description: 登入時提供的 `clientLabel`，未提供時為 `null`。
        current:
          type: boolean
          description: 是否為發出此要求的工作階段。
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: 棋手下過計分對局的每個類別各一筆紀錄。
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: 生效中的處分。
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '停權期間為 `{ until }`，否則為 `null`。'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: 單一類別的等級分紀錄。
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: 類別 ID。
        rating:
          type: integer
          description: 等級分。
        games:
          type: integer
          minimum: 0
          description: 在該類別下過的對局數（不論是否計入）。
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: 曾達到的最高等級分。
        provisional:
          type: boolean
          description: '等級分尚未定級，或計入的對局少於 `PROVISIONAL_GAMES` 局時為 `true`（遊戲中顯示為 `1510?`）。'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: 處分的種類。
        reason:
          type:
            - string
            - 'null'
          description: 給出的理由（如有）。
        startsAt:
          type: integer
          format: int64
          description: 開始時間（紀元毫秒數）。
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: 結束時間（紀元毫秒數），永久處分時為 `null`。
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 停權結束時間（紀元毫秒數），永久停權時為 `null`。
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` 表示接受透過使用者名稱發起的直接挑戰，`none` 表示拒絕。'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: 目前的密碼。
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: 新密碼；適用註冊時的密碼規則。
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: 帳號的密碼。
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: 以待啟用金鑰產生的驗證碼，正好 6 位數。
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: 帳號的密碼。
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: 選用；啟用雙重驗證時必須提供（或改為提供 `recoveryCode`）。驗證器驗證碼或復原碼。
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: 選用。復原碼（`xxxx-xxxx-xx`；不分大小寫，空格與連字號也不影響）。
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: 帳號的密碼。
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: 驗證器驗證碼（不接受復原碼）。
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: 新地址；會先去除前後空白並轉為小寫，再以與註冊地址相同的方式檢查。
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: 帳號的密碼。
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: 選用；啟用雙重驗證時必須提供（或改為提供 `recoveryCode`）。驗證器驗證碼或復原碼。
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: 選用。復原碼。
    TotpSetup:
      type: object
      description: 供驗證器應用程式使用的待啟用金鑰。
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: 以 base32 表示的金鑰，可手動輸入應用程式。
        uri:
          type: string
          format: uri
          description: '`otpauth://totp/...` URI，可顯示為 QR 碼。'
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: 每個時間步驟的秒數。
    RecoveryCodeList:
      type: array
      description: 10 組復原碼，只會顯示這一次。每組只能使用一次。
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: 對局中的一方。
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: 棋譜中的名字（已刪除的帳號為 `deleted#<id>`）。
        rating:
          type:
            - integer
            - 'null'
          description: 開始時的等級分，未知時為 `null`。
        ratingAfter:
          type:
            - integer
            - 'null'
          description: 對局後的等級分。計分對局一定會有此值；只有不計入等級分的對局（不計分、自訂、已中止）才為 `null`。
        ratingDiff:
          type:
            - integer
            - 'null'
          description: 等級分的變化；若等級分規則使等級分維持不變則為 `0`（FIDE 的零分規則、對手尚未定級、尚未定級棋手的最初幾局）；為 `null` 的情況與 `ratingAfter` 相同。
    GameSummary:
      type: object
      description: 已儲存對局的摘要。
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: 對局 ID。
        category:
          type: string
          description: 官方類別 ID（`3+2`），或 `custom`。
        rated:
          type: boolean
          description: 對局是否計入等級分。
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 以秒表示的時限（`180+2`）。
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`、2 `BlackWins`、3 `Draw`、4 `Aborted`（請見對局代碼）。'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: 結束原因代碼（請見對局代碼）。
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: 結果，已中止的對局為 `*`。
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: 半回合數。
        startedAt:
          type: integer
          format: int64
          description: 開始時間（紀元毫秒數）。
        endedAt:
          type: integer
          format: int64
          description: 結束時間（紀元毫秒數）。
    Termination:
      type: string
      description: 結束原因的名稱（請見對局代碼）；通訊協定不認得的代碼為 `Unknown`。
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: 從某一位棋手的角度呈現的對局摘要。
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: 棋手所執的一方。
    HistoryGameSummary:
      description: 已登入棋手對局紀錄中的一局。
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: 基本時間，以毫秒為單位。
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: 加秒，以毫秒為單位。
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: 從棋手角度而言的勝負結果。
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: 本頁的對局，最新的排在最前面。
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: 取得下一頁時要作為 `before` 傳入的 ID；最後一頁為 `null`。
        total:
          type: integer
          minimum: 0
          description: 所有頁面中符合篩選條件的對局總數。
    MoveRecord:
      type: object
      description: 對局中的一個半回合。
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: 以 UCI 記譜法表示的著法，升變時加上 `n`、`b`、`r` 或 `q`。
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: 該步耗用的時間（毫秒），棋譜中沒有此資料時為 `null`。
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: 走棋方在該步之後的棋鐘時間（毫秒），棋譜中沒有此資料時為 `null`。
    PgnTagsView:
      type: object
      description: 主要的 PGN 標籤，供顯示使用。此處的 `Termination` 是結束原因的名稱；PGN 檔案中則使用 PGN 標準值。
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` 或 `<SERVER_NAME> casual <category>`。'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`。'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: UTC 開始日期。
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: 開始時的等級分，或 `"-"`。
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: 開始時的等級分，或 `"-"`。
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: 一份棋譜，含著法與棋鐘時間。它具有對局摘要的欄位，但沒有 `color` 與 `outcome`。
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: 基本時間，以毫秒為單位。
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: 加秒，以毫秒為單位。
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: '`status` 的名稱。'
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: 若本局是某局的再戰，則為該原對局的 ID，否則為 `null`。
            moves:
              type: array
              description: 每個半回合一筆。
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: 僅在權杖所屬棋手參與此對局時提供：該棋手所執的一方。
            reportable:
              type: boolean
              description: 僅在權杖所屬棋手參與此對局時提供；若此時 `POST /reports` 會受理針對此對局對手的檢舉，則為 `true`（對局在 7 天內結束、每日配額尚未用完，且尚未針對此對局檢舉過該對手）。
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: 使用者名稱，保留棋手當初輸入的寫法。
        createdAt:
          type: integer
          format: int64
          description: 帳號建立時間（紀元毫秒數）。
        ratings:
          type: array
          description: 僅限官方類別，依伺服器的順序排列。
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: 所有已儲存的對局，包括不計分與已中止的對局。
            rated:
              type: integer
              minimum: 0
              description: 計分對局數，為各等級分紀錄的合計。
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: 使用者名稱，保留棋手當初輸入的寫法。
        games:
          type: array
          description: 本頁的對局，最新的排在最前面。
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: 該頁已滿時為最後一局的 ID（此時下一頁可能是空的），否則為 `null`。
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: 類別 ID。
        minGames:
          type: integer
          minimum: 0
          description: 一筆紀錄要列入排行榜所需的計入對局數（`PROVISIONAL_GAMES`）。
        updatedAt:
          type: integer
          format: int64
          description: 排行榜的計算時間（紀元毫秒數）。
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: PGN 文字，UTF-8 編碼最多 65,536 位元組。只會使用第一局。
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: 選用。畫面尺寸。
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: 選用。位於棋盤下方的一方。
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: 選用。每步著法的毫秒數，須為整數值的 JSON 數值。
        coords:
          type: boolean
          default: true
          description: 選用。是否在棋盤周圍繪製直行字母與橫列數字。
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: 對局，以整數或 1 至 16 位數字的字串表示。
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: 對手的使用者名稱，可使用棋譜中的名稱或目前的名稱，不分大小寫。不得為空白。
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: 檢舉的類別。
        comment:
          type:
            - string
            - 'null'
          description: 選用。移除控制字元（定位字元與換行字元除外）並去除前後空白後，最多 500 個字元。
    AccountExport:
      type: object
      description: 伺服器保存的有關該帳號的一切資料（時間皆為紀元毫秒數）。
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: 匯出的時間。
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`。'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`。'
        notes:
          type: array
          description: 以淺白的英文向棋手說明檔案包含與未包含的內容。
          items:
            type: string
        account:
          description: '`GET /account/me` 的帳號資訊，另加上 `googleEmail`。'
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: 已連結之 Google 帳號的電子郵件地址，或 `null`。
        ratings:
          type: array
          description: 完整的等級分紀錄。
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: 因對手被查出作弊而恢復的等級分，按 UTC 日與類別加總，最新的排在最前面。不會列出相關對局，也不會指明作弊者。
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: 所有已儲存的工作階段，最新的排在最前面，不含任何權杖。保留期限清除作業會刪除已過期的工作階段，已登出的工作階段則在登出一天後刪除。
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: 安全事件，最新的排在最前面，保留 `RETENTION_SECURITY_DAYS` 天。
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: 所有處分，包括已解除的處分。絕不包含管理員的名字。
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: 針對棋手棄局、中止與未按時走出第一步之對局所記錄的行為事件，保留 30 天。
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: 棋手提出的檢舉。
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: 對局數。
            list:
              type: array
              description: 所有對局，最新的排在最前面，格式同 `GET /account/games` 的摘要。著法請見 `GET /games/{id}`，PGN 請見 `GET /games/{id}/pgn`。
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: 完整的等級分紀錄。
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: 棋手是否已脫離尚未定級的階段。
            countedGames:
              type: integer
              minimum: 0
              description: 計入等級分的對局數。
            updatedAt:
              type: integer
              format: int64
              description: 紀錄最後一次變更的時間。
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: 當日 UTC 00:00（紀元毫秒數）。
        category:
          type: string
        points:
          type: integer
          description: 當日在該類別中恢復的分數。
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: 工作階段登出的時間，或 `null`。
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: 登入時的 IP 位址，於 `RETENTION_IP_DAYS` 天後清除。
    SecurityEvent:
      type: object
      description: |-
        一筆安全事件。只有在已登入狀態下、使用帳號密碼（及第二驗證因素），或使用寄到帳號地址的連結所進行的操作，才會提供 `ip`：`register`、`email_verified`、`login`、`sso_login`、`sso_linked`、`sso_account_created`、`recovery_code_used`、`password_reset`、`password_changed`、`reauth_failed`、`mfa_setup_started`、`mfa_enabled`、`mfa_disabled`、`recovery_codes_regenerated`、`session_revoked`、`sessions_revoked_all`、`email_change_requested`、`email_changed`、`email_change_refused` 與 `account_exported`；其他所有種類皆為 `ip: null`，且 `ip` 會在 `RETENTION_IP_DAYS` 天後清除。

        `detail` 只保留下列欄位：`login`：`method`；`sso_login`、`sso_account_created`：`provider`；`sso_linked`：`provider` 與 `method`（`password` 或 `password+totp`）；`login_failed`：`failures`；`login_lockout`：`retryAfterMs`；`mfa_failed`：`attempts`；`recovery_code_used`：`remaining`；`reauth_failed`：`factor`；`session_revoked` 與 `sessions_revoked_all`：`reason`；`email_change_refused`：`reason`；`sanction_auto`：`kind`、`gameId`、`until`。`moderator_action` 事件只保留 `{ action }`，且僅限 `ban`、`unban`、`reset_mfa`、`verify_email` 與 `revoke_sessions` 這幾種操作（其他管理員操作不包含在內）。其他所有種類皆為 `detail: null`。`rating_refund` 事件不包含在內：其分數已列於 `ratingRefunds`。
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: 事件種類（`login`、`password_changed` 等）。
        at:
          type: integer
          format: int64
          description: 發生時間。
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: 被檢舉棋手目前的公開名稱。
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: 檢舉是否仍在處理中（不會透露被檢舉棋手是否受到處分）。
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: 電子郵件連結的權杖（頁面表單中的隱藏欄位）。
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: 重設連結的權杖（表單中的隱藏欄位）。
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: 新密碼；適用註冊時的密碼規則。
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: 再次輸入新密碼；兩者必須相同。
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: UTF-8 編碼的 HTML 頁面（`text/html; charset=utf-8`），不含 JavaScript 或外部資源。
