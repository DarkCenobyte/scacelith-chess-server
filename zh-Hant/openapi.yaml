  - name: account-deletion
    x-displayName: 刪除帳號
    description: 永久刪除帳號。
  - name: game-history
    x-displayName: 對局紀錄
    description: 已登入棋手自己的對局，可篩選並分頁。
  - name: games
    x-displayName: 對局與 PGN
    description: |-
      棋譜（含著法與棋鐘時間）及其 PGN 檔案。

      **對局代碼**：`status`：1 `WhiteWins`、2 `BlackWins`、3 `Draw`、4 `Aborted`（只會儲存已結束的對局）。`result`：`1-0`、`0-1`、`1/2-1/2` 或 `*`（已中止）。`reason` 附有其名稱（`termination`），以及 PGN 檔案著法文字結尾處的文字（PGN 中為英文，下表括號內為中譯）；代碼 7 與 21 為和棋（超時或棄局的一方，其對手無法將死），而伺服器從不以代碼 4 與 13 結束對局（這兩個代碼屬於共用的結束原因清單）：

      | 代碼 | `termination` | PGN 中的文字 |
      |---|---|---|
      | 1 | `Checkmate` | Checkmate（將死） |
      | 2 | `Resignation` | Resignation（認輸） |
      | 3 | `Timeout` | Loss on time（超時判負） |
      | 4 | `IllegalMoves` | Second illegal move (forfeit)（第二次違例著法，判負） |
      | 5 | `Stalemate` | Stalemate（逼和） |
      | 6 | `InsufficientMaterial` | Dead position (insufficient material)（死局面，子力不足） |
      | 7 | `TimeoutVsInsufficient` | Flag fall, but the opponent cannot checkmate（超時，但對方無法將死） |
      | 8 | `FivefoldRepetition` | Fivefold repetition（五次重複局面） |
      | 9 | `SeventyFiveMoves` | 75-move rule（七十五回合規則） |
      | 10 | `ThreefoldClaim` | Threefold repetition (claimed)（三次重複局面，提出要求） |
      | 11 | `FiftyMoveClaim` | 50-move rule (claimed)（五十回合規則，提出要求） |
      | 12 | `Agreement` | Draw by agreement（協議和棋） |
      | 13 | `IllegalMovesVsInsufficient` | Second illegal move, but the opponent cannot checkmate（第二次違例著法，但對方無法將死） |
      | 20 | `Abandonment` | Abandoned (disconnected for too long)（棄局：斷線過久） |
      | 21 | `AbandonmentVsInsufficient` | Abandoned, but the opponent cannot checkmate（棄局，但對方無法將死） |
      | 22 | `Aborted` | Game aborted（對局中止） |
      | 23 | `NoShow` | Aborted: first move not played in time（中止：未按時走出第一步） |
      | 24 | `Forfeit` | Forfeit (fair play violation)（棄權判負：違反公平對弈） |
      | 25 | `ServerAborted` | Aborted by the server（被伺服器中止） |
      | 26 | `BothDisconnected` | Aborted: both players disconnected（中止：雙方皆已斷線） |
  - name: gifs
    x-displayName: GIF 動畫
    description: |-
      將對局製作成 GIF 動畫，方便保存或分享：從上方俯視的棋盤，從起始局面到最終局面，每個局面一格畫面；棋盤上方顯示雙方棋手的名字與等級分，下方顯示最後一步著法，最後一格畫面則顯示結果與對局的結束方式。

      **成本、快取與配額**：GIF 在專屬的算繪執行緒上製作，絕不佔用執行對局的執行緒，並以最低的 CPU 優先順序執行：共 `GIF_THREADS` 個執行緒（預設為 `WORKERS`），在製作第一個 GIF 時啟動，閒置一分鐘後停止。最多可有 `GIF_QUEUE_MAX`（4 x `WORKERS`）個 GIF 排隊等候執行緒，每個最多等候 `GIF_QUEUE_TIMEOUT_MS`（10 秒）；每次算繪最長可達 `GIF_RENDER_TIMEOUT_MS`（30 秒）。伺服器會將製作好的 GIF 保存在 `GIF_CACHE_MB` MB（32 x `WORKERS`）的快取中，最久未使用者最先移除；取自快取的 GIF，或正在為其他要求製作中的 GIF，都不會產生算繪。快取的索引鍵涵蓋所有會改變畫面的因素，名字也包括在內。

      每個要求都計入 `gif`（兩個端點合計，每位棋手每分鐘 30 次）。必須實際製作的 GIF 還會計入算繪限制：每位棋手每分鐘 `GIF_USER_RENDERS_PER_MIN`（4）次、每小時 `GIF_USER_RENDERS_PER_HOUR`（30）次；每個用戶端（其所有帳號合計）每分鐘 `GIF_IP_RENDERS_PER_MIN`（12）次、每小時 `GIF_IP_RENDERS_PER_HOUR`（120）次，每個 IPv6 /48 則為其 3 倍。用戶端應保存已下載的檔案，而不是重複要求；收到 429 或 503 後，應等待 `retryAfter` 再重試。

      尺寸：`small`（每格 32 px：284 x 350 像素）、`medium`（48 px：424 x 515）、`large`（72 px：628 x 762）；不含座標時分別為 268 x 342、400 x 503 與 600 x 748。起始局面至少停留 1 秒（若影格間隔更長，則停留該間隔），最終局面停留 3 秒，GIF 會循環播放；第一格畫面之後，只儲存畫面中有變化的部分。40 回合的對局約為 135、205 與 325 KiB（small、medium、large），150 回合的對局約為 0.5、0.8 與 1.2 MiB。
