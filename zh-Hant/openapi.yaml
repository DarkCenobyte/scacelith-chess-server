    x-displayName: 棋手
    description: 公開的個人資料與近期對局。僅包含公開資料，絕不包含電子郵件地址、工作階段、處分或誠信等級。已刪除的帳號沒有個人資料。
  - name: leaderboard
    x-displayName: 排行榜
    description: 各官方類別的頂尖棋手。
  - name: reports
    x-displayName: 檢舉
    description: 向管理員檢舉近期對局的對手。
  - name: pages
    x-displayName: HTML 頁面
    description: |-
      供瀏覽器使用的頁面，從電子郵件中的連結開啟。這些連結指向 `https://<SERVER_PUBLIC_HOST>`（連接埠不是 443 時加上 `:<PUBLIC_API_PORT>`），不在 `/api/v1` 之下。

      - 這些頁面不執行任何 JavaScript，也不載入任何外部資源。提供頁面時會附上 `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'`。
      - `GET` 只會顯示按鈕或表單，以免郵件掃描程式開啟連結時就把它用掉。變更在 `POST` 時才會發生：以 `application/x-www-form-urlencoded` 傳送的表單（也接受 JSON 本文），連結的權杖放在隱藏欄位中。重複出現的欄位會被拒絕。
      - 錯誤（速率限制、無效欄位）也以 HTML 頁面呈現，標題為「Request refused」（要求遭拒），500 以上則為「Server error」（伺服器錯誤）。只有在比對到頁面之前就發現的失敗（要求目標過長或格式錯誤、每位址層）才會以 JSON 回應。
