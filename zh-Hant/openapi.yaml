        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: '資料庫持續鎖定（`Retry-After: 1`）：未做任何變更，連結仍然有效。處理常式逾時也會回應此狀態。'
  /reset-password:
