        電子郵件確認連結的頁面（註冊時，或重新寄送的確認郵件）。頁面只顯示一個「Confirm my e-mail address」（確認我的電子郵件地址）按鈕，以免郵件掃描程式開啟連結時就把它用掉；按下按鈕會將表單送到 `POST /verify-email`。

        **限制**：`page`。
      security: []
      parameters:
        - $ref: '#/components/parameters/LinkTokenQuery'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: 附有確認按鈕的頁面。
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: 連結無效或已過期（HTML 頁面）。
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: '`page` 限制（HTML 頁面），或每位址層（JSON `rate_limited`）。'
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
    post:
      operationId: submitVerifyEmailPage
      tags:
        - pages
      summary: 確認電子郵件地址
      description: |-
        確認頁面的表單。它會確認地址；若是新註冊，此時才會建立帳號，棋手即可登入。

        **限制**：`auth`。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
          application/json:
            schema:
              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: 地址已確認（新註冊的帳號也已建立）。
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
