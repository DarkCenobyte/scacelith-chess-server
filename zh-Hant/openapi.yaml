                  Result: 1-0
                  WhiteElo: 1500
                  BlackElo: 1520
                  TimeControl: '180+2'
                  Termination: Resignation
                  PlyCount: 2
                you: white
                reportable: true
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`：不是最多 16 位數（小於 2^53）的正整數；`invalid_request`：不是有效的 URL 編碼。'
        '401':
