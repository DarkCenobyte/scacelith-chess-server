  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: 刪除帳號
      description: |-
        刪除帳號；此操作無法復原。

        - 所有工作階段立即撤銷：此後該權杖都會得到 401 `invalid_token`。
        - 使用者名稱會變成 `deleted#<id>`，帳號本身與每一份棋譜中皆是如此。
        - 下列資料會被清除：電子郵件地址、密碼雜湊值、雙重驗證金鑰與復原碼、工作階段與連結權杖、Google 連結、反作弊系統的誠信紀錄，以及與安全事件一同儲存的 IP 位址。
        - 等級分與對局會保留。對局仍可在匿名名稱下讀取，而 `GET /players/{username}` 對原名稱會回應 404。

        **重新驗證**：密碼；若已啟用雙重驗證，還需要驗證器驗證碼或復原碼。**限制**：`reauth`，接著是 `reauth_user`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: 帳號已刪除。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set`（僅使用 Google 登入的帳號）、`invalid_request`、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`、`mfa_code_required`、`invalid_code`。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（重新驗證失敗，或此帳號嘗試的驗證碼過多），或 `rate_limited`（`reauth` 或 `reauth_user` 限制、帳號額度、密碼雜湊佇列）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（密碼雜湊佇列，或資料庫持續鎖定）、`timeout`。'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: 列出棋手的對局（可篩選並分頁）
      description: |-
        已登入棋手的對局，最新的排在最前面，可篩選並分頁，並附上符合篩選條件的對局數。所有查詢參數皆為選用，空白值視同未提供。

        分頁：將上一頁的 `next` 作為 `before` 傳入；最後一頁的 `next` 為 `null`。`total` 是所有頁面中符合篩選條件的對局總數。

        **限制**：`account_games`。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: 官方類別 ID（`3+2` 或 `3%2B2`），或以 `custom` 表示所有採用其他時限的對局。
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: 只列出計分（`true`）或不計分（`false`）對局。
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: 只列出棋手獲勝、落敗或和棋的對局（從棋手的角度而言）。已中止的對局只在不使用此篩選條件時才會出現。
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: 對局紀錄的其中一頁。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor`（`before` 不是對局 ID）、`invalid_limit`，或 `invalid_filter`（`category`、`rated` 或 `result`），皆附有指出該參數的 `field`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`account_games` 限制或帳號額度。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`（資料庫持續鎖定；本文中附 `retryAfter: 1`，但沒有 `Retry-After` 標頭）、`server_busy`（查詢工作階段時發現資料庫遭到鎖定）、`timeout`。'
  /games/{id}:
    get:
      operationId: getGame
