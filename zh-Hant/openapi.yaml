    description: |-
      伺服器的存活與就緒狀態，供監控使用。這些端點在 API 連接埠上回應，處理順序早於驗證與所有端點限制，但和任何要求一樣，會取用每位址層的一個權杖；監控主機可以列入 `ABUSE_EXEMPT`。每個端點都有兩條可用的路徑：伺服器的根路徑，以及 `/api/v1` 之下。

      指標連接埠另有自己的健康檢查端點，請見簡介中的說明。
  - name: auth
    x-displayName: 註冊與登入
    description: |-
      建立帳號、以密碼（及第二驗證因素）登入，以及確認郵件與密碼重設郵件。

      `POST /auth/login`、`POST /auth/login/mfa`、`POST /auth/sso/google/finish`、`POST /auth/sso/google/link` 與 `POST /auth/sso/complete` 會回應一個工作階段 `{ token, expiresAt, user }`（前幾個端點也可能改為回應第二個步驟）。
  - name: google-sign-in
    x-displayName: Google 登入
    description: |-
      當 `GET /info` 顯示 `sso.google: true` 時提供；否則下列所有端點都會回應 404 `sso_disabled`。遊戲透過系統瀏覽器，以 RFC 8252 的已安裝應用程式流程登入（Google 用戶端類型為「Desktop app」，即電腦版應用程式）：Google 會將瀏覽器導回遊戲在 `127.0.0.1` 上的監聽器，絕不會導向本伺服器，遊戲也從不會接觸到任何 Google 憑證。

      1. 用戶端在 `127.0.0.1:0` 上監聽（由系統選擇連接埠），並產生一組 PKCE：由 43 至 128 個 `[A-Za-z0-9._~-]` 字元組成的 `codeVerifier`，以及 `codeChallenge = BASE64URL(SHA-256(codeVerifier))`，後者長度為 43 個字元，不含填補字元。
      2. 以挑戰值與連接埠呼叫 `POST /auth/sso/google/start`，會傳回 Google URL 與此次嘗試的 `state`。用戶端檢查該 URL（見下文）後，在瀏覽器中開啟。
      3. Google 將瀏覽器導向 `http://127.0.0.1:<port>/oauth2/google/<tag>?code=...&state=...`。用戶端只接受開始時回應的 `state`；若重新導向帶有 `error=`，則不傳送任何內容。
      4. 以嘗試 ID、`codeVerifier`、`state` 與 `code`（以及 Google 有傳送時的 `iss`）呼叫 `POST /auth/sso/google/finish`。
      5. 回應可能是工作階段、雙重驗證步驟（接著呼叫 `POST /auth/login/mfa`）、新棋手的 `needsUsername`（接著呼叫 `POST /auth/sso/complete`），或在某個設有密碼的帳號使用該地址時回應 `needsPassword`（接著呼叫 `POST /auth/sso/google/link`）。

      **來源標記**：重新導向 URI 帶有棋手所新增之伺服器的標記，使遊戲能拒絕其他伺服器為其自家棋手取得的 URL。來源由小寫的主機名稱（IPv6 位址字面值須加上方括號）、`:` 與十進位的 API 連接埠組成，連接埠一律寫出，443 也不例外：伺服器使用 `SERVER_PUBLIC_HOST` 及其公開 API 連接埠，遊戲則使用它所連線的位址。標記是 SHA-256(UTF-8 `"scacelith-sso-origin-v1\n"` + 來源) 經 base64url 編碼（不含填補字元）後的前 22 個字元。重新導向 URI 為 `"http://127.0.0.1:" + port + "/oauth2/google/" + tag`：一律使用 IPv4 位址字面值，連接埠則是遊戲監聽器的連接埠（1024 至 65535）。伺服器從不採用用戶端提供的 URI、主機或路徑。

      | 來源 | 標記 |
      |---|---|
      | `play.scacelith.example:443` | `IhcScoV7eDOzTEcSnqPUPt` |
      | `localhost:8443` | `TFGx7zQ_8QlGZW5zpqznCr` |
      | `[::1]:8443` | `XToJm0DG5PjciEVmZa9Cho` |
      | `127.0.0.1:50443` | `3r653wM5ZjYsHcAJljmCwY` |

      因此，只有以完全相同的 `SERVER_PUBLIC_HOST` 及其公開 API 連接埠新增伺服器的棋手，才能使用 Google 登入。

      **遊戲開啟瀏覽器前的檢查**：`authUrl` 必須正好以 `https://accounts.google.com/o/oauth2/v2/auth?` 開頭，由可列印的 ASCII 字元組成且少於 4096 個字元；其查詢字串必須恰好包含一個 `response_type=code`、恰好一個與遊戲依其連接埠與來源標記算出之 URI 相同的 `redirect_uri`、恰好一個與回應中 `state` 相同的 `state`、`code_challenge_method=S256`，以及一個長度為 43 個字元的 `code_challenge`。否則遊戲會停止監聽器，不開啟任何頁面。遊戲只會將 `finish` 與 `link` 傳送給回應 `start` 的那台伺服器。

      **Google 登入會進入哪個帳號**：已與該 Google 帳號連結的帳號；若沒有，則為使用 Google 所確認之地址的啟用中帳號（設有密碼時，`finish` 會回應 `needsPassword`，必須先通過密碼、若已啟用雙重驗證再通過第二驗證因素，才會儲存連結；未設密碼時，回應 409 `sso_account_exists`）；若仍沒有，則建立新帳號（`needsUsername`）。Google 帳號絕不會僅憑地址就連結到現有帳號。當 Google 登入建立了帳號，或被新增到現有帳號時，該帳號的地址都會收到一封郵件。
