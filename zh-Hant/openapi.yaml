  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: 以 PGN 檔案下載對局
      description: |-
        以 PGN 檔案提供同一個對局：單一對局，行尾為 `\n`，著法文字每行少於 80 欄。不論是否帶權杖，回應都相同。

        標籤依下列順序排列：`Event`（`<SERVER_NAME> rated <category>` 或 `<SERVER_NAME> casual <category>`）、`Site`（`SERVER_PUBLIC_HOST`）、`Date`（UTC 開始日期）、`Round`、`White`、`Black`、`Result`（已中止的對局為 `*`）、`UTCDate` 與 `UTCTime`（開始時間）、`WhiteElo` 與 `BlackElo`（開始時的等級分，或 `-`）、`WhiteRatingDiff` 與 `BlackRatingDiff`（等級分變化，例如 `+10` 與 `-10`，每場計分對局都有；若等級分規則使等級分維持不變則為 `+0`；不計分、自訂或已中止的對局則兩者皆無）、`TimeControl`（以秒為單位）、`Termination`（PGN 標準值：`normal`；`time forfeit`，即超時，結果為和棋時亦同；`abandoned`；`rules infraction`，即第二次違例著法或違反公平對弈而判負；`unterminated`，即已中止的對局）、`PlyCount`、`ScacelithGameId`（十進位 ID）。

        每一步著法都附有 `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`：走棋方在該步之後的棋鐘時間，以及該步所耗用的時間，以十分之一秒為單位（無條件捨去）。棋譜中缺少的值會省略。最後一步之後，接著以文字寫出結束原因，然後是結果。

        **限制**：`public_read`（帶權杖時按棋手計算，未帶時按用戶端計算）。
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: PGN 檔案。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`。'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'PGN 文字，採用 UTF-8 編碼（`Content-Type: application/x-chess-pgn; charset=utf-8`）。'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`：不是最多 16 位數（小於 2^53）的正整數；`invalid_request`：不是有效的 URL 編碼。'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`：有傳送權杖，但權杖無效。'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`：沒有這個對局。'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`public_read` 限制或帳號額度。'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`：原因之一是儲存的著法無法重播出所儲存的結局（伺服器會記錄下來）。'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`（資料庫持續鎖定；本文中附 `retryAfter: 1`，但沒有 `Retry-After` 標頭）、`server_busy`（查詢工作階段時發現資料庫遭到鎖定）、`timeout`。'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: 以 GIF 動畫下載本伺服器的對局
      description: |-
        將對局製作成 GIF 動畫。名字與等級分取自棋譜（開始時的等級分；已刪除的帳號顯示為 `deleted#<id>`），結果與結束方式也是如此（`Resignation`、`Loss on time` 等）。

        檢查依下列順序進行：`gif_disabled`、畫面選項（`size`、`orientation`、`delay`、`coords`）、對局 ID、對局本身、對局長度。

        **需要工作階段**：配額按帳號計算。**限制**：每個要求都計入 `gif`；只有在必須實際製作 GIF 時，才計入 `gif_user_min`、`gif_user_hour`、`gif_ip_min` 與 `gif_ip_hour`（請見此標籤的說明）。**時間限制**：`GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 秒（預設為 45 秒）。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 畫面尺寸：`small`（每格 32 px）、`medium`（48 px）或 `large`（72 px）。
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: 位於棋盤下方的一方。
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: 每步著法的毫秒數（1 至 6 位十進位數字）。
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: 是否在棋盤周圍繪製直行字母與橫列數字（`1`）或不繪製（`0`）。
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` 附 `field`（`size`、`orientation`、`delay` 或 `coords`）：值不在允許的範圍內。`invalid_game_id`。`invalid_request`：不是有效的 URL 編碼。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`：沒有這個對局。`gif_disabled`：伺服器已關閉 GIF 功能（`GIF_ENABLED=false`；`gif` 權杖會被退還）。'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`gif` 限制、算繪限制或帳號額度。'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`：無法製作 GIF（伺服器會記錄原因）。`internal_error`。'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` 附 `retryAfter`（3 至 10 秒）與 `Retry-After`：算繪佇列已滿，或 GIF 等候空閒執行緒已達 `GIF_QUEUE_TIMEOUT_MS`（10 秒）；該要求取用的所有限制權杖都會被退還。`busy`：資料庫持續鎖定（`retryAfter: 1` 只出現在本文中）。`timeout`。'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: 將以 PGN 傳送的任何對局製作成 GIF 動畫
      description: |-
        為以 PGN 文字傳送的任何對局，製作與 `GET /games/{id}/gif` 相同的畫面：遊戲儲存的對局、從其他網站匯出的對局，或手動輸入的對局皆可。只會使用文字中的第一局。

        - PGN 讀取器接受的內容與遊戲本身的讀取器相同：本伺服器輸出的所有 PGN，以及其他網站常見的匯出格式（註解、變化、NAG 與棋鐘標註會被略過；回合編號與 SAN 採寬鬆方式讀取；除非 `SetUp` 為 `"0"`，否則 `FEN` 標籤會提供起始局面）。
        - 名字與等級分取自 `White`、`Black`、`WhiteElo` 與 `BlackElo` 標籤。帶重音符號的字母會去掉重音，其他可列印 ASCII 以外的字元會變成 `?`，過長的名字會被截斷（48 個字元）。結果取自 `Result` 標籤，若沒有則取自著法文字的結尾。`Termination` 標籤會顯示出來，除非其值為 `normal`：此時由最終局面說明一切（將死、逼和）。
        - 此端點會自行檢查本文：未知欄位，或 `pgn` 缺少或不是字串時，回應 400 `invalid_request` 並附上 `field`；選項錯誤時回應 400 `invalid_option`（`delayMs` 必須是 JSON 數值，`coords` 必須是布林值；不接受 `null`）。

        **需要工作階段**：配額按帳號計算。**限制**：與 `GET /games/{id}/gif` 相同。**本文上限**：135,168 位元組，不受 `HTTP_BODY_LIMIT` 影響（以 JSON 字串表示的 PGN，包括其中的跳脫字元）。**時間限制**：預設為 45 秒。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: 手動輸入的短對局，不含座標
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: 使用所有選項的 PGN 檔案
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` 附 `field`（未知欄位，或 `pgn` 缺少或不是字串；本文不是物件時則不附 `field`）；`invalid_json`；`invalid_option` 附 `field`（`size`、`orientation`、`delayMs` 或 `coords`）；`invalid_pgn` 附 `line` 與 `column`（從 1 起算，欄以字元計），以及讀取器的 `message`：不合規則或有歧義的著法、損壞的標籤、未知的變體、超過 65,536 位元組。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`：伺服器已關閉 GIF 功能（`GIF_ENABLED=false`；`gif` 權杖會被退還）。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`：本文超過 135,168 位元組。'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`gif` 限制、算繪限制或帳號額度。'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`：無法製作 GIF（伺服器會記錄原因）。`internal_error`。'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` 附 `retryAfter`（3 至 10 秒）與 `Retry-After`：算繪佇列已滿，或 GIF 等候空閒執行緒過久；該要求取用的所有限制權杖都會被退還。`timeout`。'
  /players/{username}:
    get:
      operationId: getPlayer
      tags:
        - players
      summary: 取得棋手的公開個人資料
      description: |-
        棋手的公開個人資料：各官方類別的等級分（依伺服器的順序）與對局數。`games.total` 計算所有已儲存的對局，包括不計分與已中止的對局；`games.rated`、`wins`、`draws` 與 `losses` 是各等級分紀錄的合計，因此只包含計分對局。不論是否帶權杖，回應都相同。

        **限制**：`public_read`（帶權杖時按棋手計算，未帶時按用戶端計算）。
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: 個人資料。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
              example:
                username: alice
                createdAt: 1790882839743
                ratings:
                  - category: '3+2'
                    rating: 1510
                    provisional: true
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                games:
                  total: 3
                  rated: 2
                  wins: 1
                  draws: 1
                  losses: 0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`：不是由 2 至 24 個 `[A-Za-z0-9_.-]` 字元組成。'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`：有傳送權杖，但權杖無效。'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`：沒有這位棋手，或帳號已刪除。'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`public_read` 限制或帳號額度。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`（資料庫持續鎖定；本文中附 `retryAfter: 1`，但沒有 `Retry-After` 標頭）、`server_busy`（查詢工作階段時發現資料庫遭到鎖定）、`timeout`。'
  /players/{username}/games:
    get:
      operationId: listPlayerGames
      tags:
        - players
      summary: 列出棋手的近期對局
      description: |-
        棋手的近期對局，最新的排在最前面，分頁方式與對局紀錄相同，但沒有篩選條件，也沒有總數。`color` 是這位棋手所執的一方。只要該頁已滿，`next` 就是最後一局的 ID，因此下一頁可能是空的。伺服器會先查詢棋手：未知的棋手一律回應 404，不論查詢參數為何。

        **限制**：`public_read`（帶權杖時按棋手計算，未帶時按用戶端計算）。
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: 棋手對局的其中一頁。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerGamesPage'
              example:
                username: alice
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                next: 4100000000001
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`、`invalid_cursor`（`before` 不是對局 ID）、`invalid_limit`（後兩者不附 `field`）。'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`：有傳送權杖，但權杖無效。'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`：沒有這位棋手，或帳號已刪除。'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`public_read` 限制或帳號額度。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`（資料庫持續鎖定；本文中附 `retryAfter: 1`，但沒有 `Retry-After` 標頭）、`server_busy`（查詢工作階段時發現資料庫遭到鎖定）、`timeout`。'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: 取得某個類別的頂尖棋手
      description: |-
        某個官方類別中，計入的對局數至少達 `minGames`（`PROVISIONAL_GAMES`）的前 100 筆等級分紀錄，已刪除的帳號與經確認的作弊者除外。伺服器最多每 10 秒重新計算一次各個排行榜；`updatedAt` 標示計算的時間。

        **限制**：只有每位址層。
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: 官方類別 ID（`3+2` 或 `3%2B2`）。
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: 棋手人數，1 至 100。最多 3 位數的更大數字視為 100；空白值視同未提供。
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: 排行榜。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category`（缺少，或不是官方類別）、`invalid_limit`。'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：每位址層。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`（資料庫持續鎖定；本文中附 `retryAfter: 1`，但沒有 `Retry-After` 標頭）、`timeout`。'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: 檢舉近期對局的對手
      description: |-
        檢舉棋手本人在過去 7 天內結束的某一局對局中的對手。檢舉本身絕不會改變等級分、處分或誠信等級。它會提高管理員所見的審查優先順序，而且除了 `abuse` 之外，還會要求對該局進行引擎分析。

        針對同一局的同一位對手重複檢舉，會得到相同的回應，且不會有任何改變；回應絕不會透露被檢舉帳號的任何資訊。`GET /games/{id}` 會事先告知該局的棋手是否可以提出檢舉（`reportable`）。

        此端點會自行檢查本文，順序為 `gameId`、`reported`、`category`、`comment`：檢查失敗時回應 400 `invalid_request`，不附 `field`。不認得的欄位會被忽略。

        **限制**：`reports`（按棋手計算），接著是每位棋手 24 小時內 `REPORTS_PER_DAY`（5）次檢舉（429 `report_limit`）。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: 檢舉已收到（或先前已提出過）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`（不附 `field`）、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`：對方並非檢舉人在過去 7 天內結束之對局中的對手。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit`（`retryAfter: 3600`，附 `Retry-After` 標頭）：過去 24 小時內已達 `REPORTS_PER_DAY` 次檢舉。`rate_limited`：`reports` 限制或帳號額度。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（查詢工作階段時發現資料庫遭到鎖定）、`timeout`。'
  /verify-email:
    servers:
      - url: https://caissa.scacelith.com
        description: 官方伺服器（頁面位於根路徑，不在 `/api/v1` 之下）。
      - url: https://{host}:{port}
        description: 任何 Scacelith 伺服器（頁面位於根路徑，不在 `/api/v1` 之下）。
        variables:
          host:
            default: caissa.scacelith.com
            description: 伺服器的公開主機名稱（`SERVER_PUBLIC_HOST`）。
          port:
