        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set`（Googleでのみログインするアカウント）、`invalid_request`、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`、`mfa_code_required`、`invalid_code`。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（再認証の失敗、またはこのアカウントで試したコードが多すぎる）、または`rate_limited`（`account_export`、`reauth`、`reauth_user`のいずれかの制限、アカウント単位の割り当て、パスワードハッシュのキュー）。'
        '500':
          $ref: '#/components/responses/InternalError'
