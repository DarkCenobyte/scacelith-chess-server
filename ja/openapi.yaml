openapi: 3.1.1
info:
  title: ScacelithサーバーのHTTPS API
  version: "0.9.1"
  summary: 公式サーバーとコミュニティサーバーを含む、すべてのScacelithサーバーに共通のHTTPS API。
  description: |-
    公式の`caissa.scacelith.com`からコミュニティサーバーまで、すべてのScacelithサーバーがこのHTTPS APIを提供します。ゲームは、対局そのもの以外のすべてにこのAPIを使います。アカウント作成とログイン（二要素認証とGoogleログインを含む）、アカウントページ、対局履歴、PGNのダウンロードと対局のアニメーションGIF、ログイン中のデバイス、データのダウンロード、アカウントの削除、そして報告です。

    リアルタイムの対局（マッチメイキング、対局の申し込み、指し手、時計）は、同じサーバーのWebSocket（`wss://<host>/ws`）を通じて行われます。このWebSocketは、このAPIのセッショントークンで開きます。その仕様はここではなく`PROTOCOL.md`に記載されています。

    以下に示す既定値は、設定を変更していないサーバーのものです。コミュニティサーバーでは変更されている場合があります（すべての設定項目は`CONFIG.md`に記載されています）。

    ## ベースURL、ポート、トランスポート

    - 公式サーバー：`https://caissa.scacelith.com/api/v1`、TCPポート443。
    - コミュニティサーバー：`https://<SERVER_PUBLIC_HOST>[:<port>]/api/v1`。`API_PORT`の既定値は443です。NATやプロキシの背後では、プレイヤーが使うポートは`PUBLIC_API_PORT`です。
    - ゲームのWebSocketは、既定ではAPIと同じポートにあります（`WS_PORT`で変更できます。その場所は`GET /info`がクライアントに伝えます）。
    - TLS上のHTTP/1.1を使います。`TLS_MODE=proxy`では、サーバーの前段にあるリバースプロキシがTLSを終端します。`TLS_MODE=off`（平文のHTTP）はローカル開発専用です。
    - メールのリンクから開くHTMLページ（`/verify-email`、`/reset-password`、`/confirm-email-change`）は、`/api/v1`の外、サーバーのルートにあります。ヘルスチェックのエンドポイントは、ルートと`/api/v1`の下の両方で応答します。Googleログインにはサーバー上のページがありません。Googleはブラウザーをゲーム自体（`127.0.0.1`）に戻します。
    - 末尾のスラッシュは無視され（`/api/v1/info/`は`/api/v1/info`と同じです）、パスパラメーターはURLデコードされます（有効なURLエンコーディングでないパラメーターには400 `invalid_request`が返ります）。

    ## リクエスト

    - **JSONボディ**。`POST`、`PUT`、`DELETE`のリクエストは、`Content-Type: application/json`でJSONオブジェクトを送ります。UTF-8以外の`charset`は拒否され、ほかのコンテンツタイプも同様に拒否されます（415 `unsupported_media_type`）。空のボディは`{}`として扱われ、パラメーターのないエンドポイント（`POST /auth/logout`、`POST /auth/logout-all`、`DELETE /auth/sessions/{id}`）はこれを受け取ります。
    - **サイズと時間**。ボディの上限は`HTTP_BODY_LIMIT`バイトです（既定値は16,384。`POST /gif`には135,168バイトという独自の上限があります）。超えると413 `payload_too_large`が返ります。ボディは10秒以内に届く必要があり、届かなければ408 `request_timeout`が返ります。どちらのエラーの後も、サーバーは接続を閉じます。
    - **厳密なスキーマ**。エンドポイントが知らないフィールドは拒否され、任意と記されていないフィールドは必須で、型と長さも検査されます。これらのいずれかに違反すると400 `invalid_request`が返り、`field`がそのフィールドを示します（入れ子のフィールドは`pow.nonce`のようにドット区切りです）。文字列に制御文字を含めることはできません。長さはUTF-16のコード単位で数えるため、基本多言語面の外の文字（絵文字など）は2文字と数えられます。JSONでないボディには400 `invalid_json`が返ります。`POST /gif`と`POST /reports`は、ボディを独自に検査します（各エンドポイントを参照）。
    - **クエリ文字列**。パラメーターは最初に現れたものが有効で、未知のパラメーターは無視されます。また`+`はスペースにデコードされます。持ち時間カテゴリーを受け取るエンドポイントは、`3%2B2`と`3+2`の両方を受け付けます。
    - **メソッド**。`HEAD`はボディのない`GET`です。存在するパスへの`OPTIONS`は、`Allow`ヘッダー（と、後述するCORSのプリフライトのヘッダー）付きで204を返します。そのパスにないその他のメソッドには、`Allow`付きで405 `method_not_allowed`が返ります。
    - **リクエストターゲット**。4096文字を超えることはできません（414 `uri_too_long`）。まったく解析できないリクエスト、またはヘッダー部が大きすぎるか届くのが遅すぎるリクエストには、ボディが空の400、431または408が返り、接続が閉じられます。
    - **CORS：許可リスト方式、既定では無効**。このAPIは`Origin`を送らないゲームのためのものです。`CORS_ORIGINS`が空（既定値）の場合、`Access-Control-*`ヘッダーは一切送られないため、Webページはレスポンスを読めません。`CORS_ORIGINS`には、ブラウザからAPIを呼び出してよいページのWebオリジンを列挙します。それぞれ、ブラウザが`Origin`で送る形そのままで書きます：`https://host`または`https://host:port`、小文字で、パス、末尾のスラッシュ、既定のポートは付けません。`http://`は`localhost`、`127.0.0.1`、`[::1]`（ローカル開発）に限ります。ワイルドカードは使えません。公式サーバーは自身のWebサイトのために`CORS_ORIGINS=https://scacelith.com,https://www.scacelith.com`を設定しています。このとき：
      - `/api/v1`以下のパスへのレスポンスは、ヘルスチェックのエンドポイントを除き、成功でもエラーでも（アドレス単位の層の429を含む）`Vary: Origin`を持ちます。リクエストの`Origin`がリストのオリジンのいずれかとバイト単位で一致する場合は、さらに`Access-Control-Allow-Origin: <that origin>`と、プリフライトへのレスポンスを除いて`Access-Control-Expose-Headers: Retry-After, Content-Disposition`も持つため、ページはエラーコード、`Retry-After`、PGNとGIFのダウンロードのファイル名を読めます。
      - リストのオリジンから既存のパスへのプリフライト（`Access-Control-Request-Method`付きの`OPTIONS`）には、ボディなしの204が返り、`Allow`、`Access-Control-Allow-Origin`、`Access-Control-Allow-Methods`（`Allow`のメソッド）、`Access-Control-Allow-Headers: Authorization, Content-Type`、`Access-Control-Max-Age: 600`、`Vary: Origin`が付きます。トークンは不要で、アカウント単位の割り当てにもエンドポイントの制限にも数えられません。ただし、ほかのリクエストと同じく、アドレス単位の層のトークンを1つ消費します。ブラウザはプリフライトの結果を10分間再利用しますが、クエリ文字列を含めてまったく同じURLに対してだけです。`GET /info`や`GET /leaderboard`のように、`Authorization`もJSONのボディもないリクエストにはプリフライトは不要です。
      - プリフライトへのそれ以外のレスポンスは、CORSのヘッダーが付いていても、プリフライトの失敗です：存在しないパスへの404や、アドレス単位の層の429です。このときブラウザはリクエストを送らず、ページにはネットワークエラーが見えるだけで、レスポンスもその`Retry-After`も読めません。
      - `Access-Control-Allow-Credentials`は一切送られず、`Access-Control-Allow-Origin: *`も送られません：ページはゲームと同じくセッショントークンを`Authorization: Bearer`で送り、APIはクッキーを設定しません。HTMLページ、ヘルスチェックのエンドポイント、読み取れないリクエストへの空のレスポンスにはCORSのヘッダーは付きません。WebSocketはCORSを使いません：WebSocketを開いてよいページは`WS_ALLOWED_ORIGINS`に列挙します。
      - リストにないオリジンのページは何も読めず、そのクロスサイトの書き込みが送られることもありません：JSONのボディと`Authorization`にはプリフライトが必要で、そのレスポンスにはそのオリジン向けの`Access-Control-Allow-Origin`がないためです。`Cross-Origin-Resource-Policy: same-origin`はすべてのレスポンスに付いたままです：これは`no-cors`リクエスト（別のサイトがレスポンスを埋め込む場合）にだけ適用され、リストにあるページの`cors`リクエストには適用されません。

    ## レスポンスとエラー

    - レスポンスはUTF-8のJSONです。ただし、PGNのダウンロード（`application/x-chess-pgn`）、アニメーションGIF（`image/gif`）、HTMLページは除きます。時刻は1970-01-01 UTCからのミリ秒です。IDは整数です。対局IDは最大16桁ですが2^53未満に収まるため、JSONの数値（倍精度浮動小数点数）で正確に表せます。
    - APIのすべてのレスポンスには、`Cache-Control: no-store`、`X-Content-Type-Options: nosniff`、`Referrer-Policy: no-referrer`、`X-Frame-Options: DENY`、`Cross-Origin-Resource-Policy: same-origin`、`Content-Security-Policy: default-src 'none'; frame-ancestors 'none'`が付きます（HTMLページには独自のポリシーがあります）。`TLS_MODE=native`では、`Strict-Transport-Security: max-age=31536000`も付きます。
    - レスポンスは、サーバーが準備を終えた時点から60秒以内に読み取る必要があります。これが問題になるのは大きなレスポンス（GIF、データのエクスポート、長いPGN）だけです。サーバーがレスポンスの準備にかけた時間は、この60秒にも、送受信が1バイトもないまま30秒たつと接続が閉じられる制限にも数えられません。

    エラーの形式は1つだけです（`Error`スキーマ）：

    ```json
    { "error": "snake_case_code", "message": "An English sentence.", "retryAfter": 30 }
    ```

    `message`はログ用およびフォールバック用です。クライアントは`error`をもとに表示内容を選びます。`retryAfter`（秒）は時間がたてば解除される拒否にのみ含まれ、その場合レスポンスには同じ値の`Retry-After`ヘッダーも付きます。唯一の例外は、履歴、対局、プレイヤー、ランキングの読み取りで返る503 `busy`で、こちらにはフィールドしかありません。一部のエラーにはフィールドが追加されます：`field`（無効な入力）、`reason`（`weak_password`、`pow_required`）、`pow`（`pow_required`）、`until`（`banned`）、`line`と`column`（`invalid_pgn`）。

    どのエンドポイントでも返りうるエラー：

    | ステータス | `error` | 条件 |
    |---|---|---|
    | 400 | `invalid_request` | ボディがエンドポイントのスキーマに違反している（場所は`field`が示します）、リクエストターゲットまたは`Content-Length`の形式が不正、パスパラメーターが有効なURLエンコーディングでない、またはボディが途中で切れている。 |
    | 400 | `invalid_json` | ボディがJSONではない。 |
    | 401 | `unauthorized` | セッションが必要なエンドポイントに`Authorization`ヘッダーがない。 |
    | 401 | `invalid_token` | トークンの形式が不正、期限切れ、失効済み、または削除されたアカウントのもの。セッションが任意のエンドポイントでも返ります。 |
    | 404 | `not_found` | そのようなエンドポイントがない。一部のエンドポイントは、対局、プレイヤー、セッションが存在しない場合にも使います。 |
    | 405 | `method_not_allowed` | そのパスはほかのメソッドでのみ存在する（`Allow`を参照）。 |
    | 408 | `request_timeout` | ボディが10秒以内に届かなかった。 |
    | 413 | `payload_too_large` | ボディが`HTTP_BODY_LIMIT`（`POST /gif`では135,168バイト）を超えている。 |
    | 414 | `uri_too_long` | リクエストターゲットが4096文字を超えている。 |
    | 415 | `unsupported_media_type` | ボディが`application/json`ではない、またはその文字セットがUTF-8ではない。 |
    | 429 | `rate_limited` | レート制限（後述）。`retryAfter`と`Retry-After`ヘッダーが付きます。 |
    | 500 | `internal_error` | 予期しない障害。サーバーがログに記録します。 |
    | 503 | `timeout` | サーバーが30秒以内に応答しなかった（既定の設定では、エクスポートは60秒、GIFは45秒）。 |
    | 503 | `server_busy` | セッションの照会またはアカウントの変更でデータベースがロックされていた（`retryAfter` 1）、またはパスワードハッシュのキューが満杯（後述）。また、`POST`、`PUT`、`PATCH`、`DELETE`の場合：データベースの書き込み待ちが多すぎる。リクエストは実行されず、レート制限も何も消費していない（`retryAfter` 2～5）。 |

    読み取り系のエンドポイント（対局履歴、対局、プレイヤー、ランキング）とエクスポートは、データベースのロックが解除されなかった場合に`retryAfter: 1`付きで503 `busy`を返します。

    パスワードを検証またはハッシュ化するエンドポイントは、次のいずれかを返すこともあります。どちらも`retryAfter`は5～15秒のランダムな値です：

    - 503 `server_busy`：サーバーのパスワードハッシュのキュー（`PASSWORD_HASH_QUEUE_MAX`）が満杯か、待ち時間が尽きた。
    - 429 `rate_limited`：キューが半分埋まった状態で、このクライアント（IPv4アドレスまたはIPv6の/48）の待機中のハッシュがすでに`PASSWORD_HASH_WAITERS_PER_SOURCE`件ある。この429では、リクエストが消費したレート制限のトークンが返却されます。

    いずれの場合も何も変更されず、失敗した試行としても数えられません（ただし`POST /auth/sso/google/link`は例外で、チケットの試行とアカウントの失敗はハッシュの前に計上済みです）。リセットリンクも有効なままです。

    HTMLページは、エラーを同じステータスコードのHTMLページとして返します。

    ## 認証

    セッションが必要なエンドポイントは、`Authorization`ヘッダーでBearerトークンを受け取ります（`bearerAuth`スキーム）：

    ```
    Authorization: Bearer sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
    ```

    - **トークンの取得**。トークン（`sct_`に続く43文字のbase64url）は、`POST /auth/login`（二要素認証がオンの場合はその後の`POST /auth/login/mfa`）、`POST /auth/sso/google/finish`と`POST /auth/sso/google/link`（Googleログイン）、および`POST /auth/sso/complete`から得られます。いずれも`{ token, expiresAt, user }`を返します。サーバーはトークンのSHA-256しか保存しません。
    - **必須のセッション**。ヘッダーがない場合は、`WWW-Authenticate: Bearer realm="scacelith"`付きで401 `unauthorized`が返ります。無効なトークンには、`WWW-Authenticate: Bearer realm="scacelith", error="invalid_token"`付きで401 `invalid_token`が返ります。クライアントは`invalid_token`を受け取ったトークンを破棄し、ログインし直してください。
    - **任意のセッション**。`GET /games/{id}`、`GET /games/{id}/pgn`、`GET /players/{username}`、`GET /players/{username}/games`では、セッションは任意です。ヘッダーがなければ公開ビューを返します。ヘッダーを送る場合、そのトークンは有効でなければなりません。
    - **有効期間**。セッションは、ログインから`SESSION_MAX_DAYS`（90）日後（これが`expiresAt`です）と、`SESSION_IDLE_DAYS`（30）日間使われなかった時点の、どちらか早いほうで終了します。使うたびにアイドル期限は延長されますが、サーバーが新しい値を書き込むのは最大で5分に1回です。1つのアカウントが保持できるセッションは最大`MAX_SESSIONS_PER_USER`（10）個で、新たなログインでこの数を超えると、最も古いセッションが失効します。
    - **失効**。ログアウト（`POST /auth/logout`、`POST /auth/logout-all`、`DELETE /auth/sessions/{id}`）はセッションを失効させます。パスワードの変更（ほかのセッション）、パスワードのリセットとアカウントの削除（すべてのセッション）、そして管理者によっても失効します。APIからの失効はただちに有効になり、失効したセッションで開かれたWebSocketは閉じられます。パスワードの変更やリセット、アカウントの削除では、変更そのものと同じトランザクションで失効が行われます：そのいずれかが失敗した場合、どのセッションも失効しておらず、ほかにも何も変更されていません。サーバーはセッションの照会結果を30秒間キャッシュするため、別プロセスである管理コマンドによる失効は30秒以内に有効になります。
    - **スコープ**。トークンは1つのサーバーに属し、そのサーバーのWebSocketを開くのにも使えます。ほかのサーバーには決して送らないでください。

    ## レート制限とその他の制限

    制限は2つのスコープのいずれかに適用されます。**クライアント**：IPv4アドレス、またはIPv6の/64（プロキシモードでは、`TRUSTED_PROXIES`のアドレスから送られた`X-Forwarded-For`からアドレスを得ます）。一部の制限は、各/64ネットワークに加えて、IPv6の/48全体もまとめて数えます。**プレイヤー**：アドレスにかかわらず、ログインしているアカウント。セッションが任意のエンドポイントでプレイヤー単位に数える制限は、トークンのないリクエストではクライアント単位で数えます。

    各制限は、`limit`件のリクエストを保持し、`limit / window`の速度で連続的に補充されるトークンバケットです。`retryAfter`は次のトークンまでの時間です。*共有*と記された制限は、同じ長さのスライディングウィンドウでも数えられ、どのウィンドウにも`limit`件を大きく超えるリクエストが入らないようになっています。すべての制限はサーバー全体で数えられます。エンドポイントの制限の1つがリクエストを拒否すると、ほかの制限がそのリクエストのために消費したトークンは返却されます。拒否には`retryAfter`と`Retry-After`付きで429 `rate_limited`が返ります。

    - **アドレス単位の層**。すべてのリクエスト（あらゆるパスとメソッド。ヘルスチェックのエンドポイントとWebSocketのアップグレードを含む）は、まずクライアントの割り当てからトークンを1つ消費します。割り当ては`HTTP_RATE_PER_IP`（600）件/分でバーストは30秒分、IPv6の/48には`HTTP_RATE_PER_PREFIX`（4 × `HTTP_RATE_PER_IP`）です。また、1つのクライアントが同時に処理中にできるリクエストは最大`IP_MAX_INFLIGHT`（32 × `WORKERS`）件です（超えると`retryAfter` 1）。拒否された後もリクエストを続けるクライアントはブロックされます。1分間に`ABUSE_BLOCK_REFUSALS_PER_MIN`（600）回拒否されると1分間ブロックされ、6時間以内に再びブロックされるたびに4分、16分、60分と延びます。`auth`、`auth_*`、`reauth`の制限による拒否は5回分と数えられ、プレイヤー単位の制限による拒否は数えられません。`ABUSE_EXEMPT`に含まれるアドレスはこの層の対象外ですが、アカウント単位の割り当てとエンドポイントの制限は適用されます。
    - **アカウント単位の割り当て**。有効なセッショントークンを持つすべてのリクエストは、そのアカウントの割り当ても消費します。アドレスにかかわらず、全エンドポイント合計で`USER_RATE_PER_MIN`（120）件/分、バーストは30秒分です。
    - **エンドポイントごとの制限**：

    | 制限 | 既定値 | 数える単位 | エンドポイント |
    |---|---|---|---|
    | `auth` | `AUTH_RATE_PER_IP`（20）/ 10分、共有 | クライアント。IPv6の/48ごとに`AUTH_RATE_PER_PREFIX`（5 × `AUTH_RATE_PER_IP`） | `POST /auth/register`、`/auth/login`、`/auth/login/mfa`、`/auth/verify-email/resend`、`/auth/password/forgot`、`/auth/password/reset`、`/auth/sso/google/link`、`/auth/sso/complete`、および`POST /verify-email`、`/reset-password`、`/confirm-email-change` |
    | `auth_register` | `AUTH_REGISTER_PER_HOUR`（10）/ 1時間、共有 | クライアント。IPv6の/48ごとにその3倍 | `POST /auth/register` |
    | `auth_mail` | `AUTH_MAIL_PER_HOUR`（10）/ 1時間、共有 | クライアント。IPv6の/48ごとにその3倍 | `POST /auth/verify-email/resend` |
    | `auth_forgot` | `AUTH_FORGOT_PER_HOUR`（3）/ 1時間、共有 | クライアント。IPv6の/48ごとにその3倍 | `POST /auth/password/forgot` |
    | `auth_forgot_day` | `AUTH_FORGOT_PER_DAY`（10）/ 24時間、共有 | クライアント。IPv6の/48ごとにその3倍 | `POST /auth/password/forgot` |
    | `auth_reset` | `AUTH_RESET_PER_HOUR`（10）/ 1時間、共有 | クライアント。IPv6の/48ごとにその3倍 | `POST /auth/password/reset`、`POST /reset-password` |
    | `reauth` | `auth`と同じ数値、独自のバケット、共有 | クライアントとIPv6の/48 | パスワードを求めるアカウント変更（「再認証」を参照）と`POST /account/export` |
    | `reauth_user` | `AUTH_REAUTH_PER_USER`（10）/ 10分、共有 | プレイヤー | `reauth`と同じエンドポイント |
    | `account` | 60 / 分 | プレイヤー | `GET /account/me`、`PUT /account/preferences` |
    | `account_games` | 60 / 分 | プレイヤー | `GET /account/games` |
    | `account_export` | 5 / 1時間、共有 | プレイヤー | `POST /account/export`（`reauth`より先に検査。すべての試行を数えます） |
    | `sessions` | 60 / 分 | プレイヤー | `POST /auth/logout`、`/auth/logout-all`、`GET /auth/sessions`、`DELETE /auth/sessions/{id}` |
    | `public_read` | 60 / 分 | プレイヤー（トークンがなければクライアント） | `GET /players/{username}`、`/players/{username}/games`、`/games/{id}`、`/games/{id}/pgn`（4つで1つのバケット） |
    | `gif` | 30 / 分 | プレイヤー | `GET /games/{id}/gif`、`POST /gif`（2つで1つのバケット） |
    | `gif_user_min`、`gif_user_hour` | `GIF_USER_RENDERS_PER_MIN`（4）/ 分と`GIF_USER_RENDERS_PER_HOUR`（30）/ 1時間、共有 | プレイヤー | 同じ2つ。GIFを作成する必要がある場合のみ（キャッシュから返さない場合） |
    | `gif_ip_min`、`gif_ip_hour` | `GIF_IP_RENDERS_PER_MIN`（12）/ 分と`GIF_IP_RENDERS_PER_HOUR`（120）/ 1時間、共有 | クライアント（そのすべてのアカウントの合計）。IPv6の/48ごとにその3倍 | 同上 |
    | `reports` | 30 / 1時間 | プレイヤー | `POST /reports` |
    | `sso_start` | 30 / 10分、共有 | クライアント。IPv6の/48ごとに90 | `POST /auth/sso/google/start` |
    | `sso_finish` | 30 / 分 | クライアント | `POST /auth/sso/google/finish` |
    | `page` | 60 / 分 | クライアント | `GET /verify-email`、`/reset-password`、`/confirm-email-change` |

    `GET /info`と`GET /leaderboard`には独自の制限はなく、アドレス単位の層だけが適用されます。複数の制限を持つエンドポイントは、その説明に記載された順に制限を検査します。

    サーバーはリクエストを次の順に処理します：アドレス単位の層、次にヘルスチェックのエンドポイント、エンドポイントの照合、`POST`・`PUT`・`PATCH`・`DELETE`の場合はデータベースの書き込み待ちの確認（503 `server_busy`）、認証、リクエストがセッションを持つ場合はアカウント単位の割り当て、エンドポイントの制限、ボディ、エンドポイント本体（GIFのエンドポイントは、作成すべきGIFがある場合にのみ描画の制限を消費します）。したがって、トークンが原因で拒否されたリクエストはエンドポイントのトークンを消費しませんが、ボディが無効なリクエストは消費します。

    エンドポイント自体が応答するその他の制限：

    - **1つのログイン名でのログイン失敗**（ユーザー名またはメールアドレス）：失敗が`AUTH_FAILURES_PER_ACCOUNT`（5）回に達すると、以降の試行ごとに前回の2倍の待ち時間が必要になります（2秒、4秒と続き、最大15分）。`retryAfter`付きで429 `too_many_attempts`が返ります。失敗のない状態が1時間続くと、カウンターはリセットされます。
    - **ログイン時の第二要素の失敗**：アカウントの5回目の誤ったコードから同じ規則が適用されます。1回のログイン手順で受け付ける誤ったコードは最大5回です。
    - **1つのアカウントの第二要素コード**：ログイン時と再認証時を合わせ、どのアドレスからでも、15分あたり最大`AUTH_MFA_PER_ACCOUNT`（10）個のコード（認証アプリのコードまたはリカバリーコード。正誤を問いません）。これを超えるとコードを検査する前に429 `too_many_attempts`が返るため、リカバリーコードは消費されません。
    - **アカウントの再認証の失敗**（誤ったパスワードまたはコード）：同じ規則（429 `too_many_attempts`）で、再認証を行うすべてのエンドポイントで共有されます。
    - **メール**：確認メールまたはリセットメールは、アドレスごとに5分に1通まで（レスポンスは変わりません）。"someone tried to use your address"（誰かがあなたのアドレスを使おうとしました）という通知は、アドレスごとに1時間に1通までです。
    - **報告**：プレイヤーごとに24時間で`REPORTS_PER_DAY`（5）件まで。超えると429 `report_limit`が返ります。

    ## プルーフ・オブ・ワーク

    `POW_REGISTER_BITS`が0より大きい場合（既定値は18。`GET /info`はこれを`pow.register`として返します）、`POST /auth/register`には常にプルーフ・オブ・ワークが必要です。`POST /auth/login`と`POST /auth/sso/google/link`（両者で同じ種類のチャレンジを使います）では、サーバーがログイン失敗の急増を検知してから5分間だけ必要になります（`POW_LOGIN_TRIGGER_PER_MIN`、その後`POW_LOGIN_BITS`）。必要かどうかは、クライアントがレスポンスから知ります。

    1. プルーフのない（または拒否されたプルーフ付きの）リクエストには、`reason`と`pow`チャレンジ`{ challenge, bits, expiresAt }`付きで428 `pow_required`が返ります。
    2. ナンスを見つけます。ナンスは最大20桁の10進数の文字列で、`SHA-256(challenge + ":" + nonce)`が`bits`個のゼロビットで始まるもの（先頭バイトの最上位ビットから順に数えます）です。18ビットでは、平均して約260,000回のハッシュ計算が必要です。
    3. ボディに`"pow": { "challenge": "...", "nonce": "123456" }`を入れて、同じリクエストをもう一度送ります。

    チャレンジは2分間、1回だけ、1つのエンドポイントと1つのクライアントネットワーク（IPv4アドレスまたはIPv6の/64）に対して有効です。チャレンジは署名されているため、戻ってくるまでサーバーはそれについて何も保持しません。`reason`はプルーフが拒否された理由を示します：`required`、`malformed`、`signature`、`endpoint`、`network`、`expired`、`bits`、`work`、`replayed`のいずれかです。

    ## 再認証

    アカウントの変更では、パスワードの再入力と、二要素認証がオンの場合は第二要素が求められます：

    - パスワードのみ：`POST /account/password`と`POST /account/mfa/totp/setup`。
    - パスワードと認証アプリのコード（リカバリーコードは不可）：`POST /account/mfa/recovery-codes`。
    - パスワードと、認証アプリのコードまたはリカバリーコード：`POST /account/mfa/totp/disable`、`POST /account/email`、`POST /account/export`、`POST /account/delete`。

    ボディでは、`code`に6桁の認証アプリのコードを、`recoveryCode`にリカバリーコード（`xxxx-xxxx-xx`。大文字と小文字、スペース、ハイフンは区別されません）を入れます。リカバリーコードを受け付ける場面では、リカバリーコードを`code`で送ることもできます。各コードは1回しか使えません。使用済みの認証アプリのコードは次の30秒ステップまで拒否され、リカバリーコードは一度使うと無効になります。

    | ステータス | `error` | 条件 |
    |---|---|---|
    | 403 | `invalid_password` | パスワードが誤っている、またはリクエストの処理中にパスワードがリセットまたは変更された（何も変更されていない）。 |
    | 403 | `mfa_code_required` | 二要素認証がオンで、`code`も`recoveryCode`も送られていない。 |
    | 403 | `invalid_code` | コードが誤っているか、使用済み。 |
    | 400 | `password_not_set` | Googleでのみログインするアカウントに、まだパスワードがない（「パスワードをお忘れですか？」で設定できます）。 |
    | 429 | `too_many_attempts` | このアカウントで失敗した回数、または試したコードが多すぎる。 |
    | 503 / 429 | `server_busy` / `rate_limited` | パスワードハッシュのキューが混雑している。 |

    誤ったパスワードとコードは、アカウントの失敗カウンターに数えられ、セキュリティイベントとして記録されます。

    ## メトリクスポート

    サーバーはAPIポートのほかに、メトリクスポート（`METRICS_PORT`、9464。`METRICS_BIND`にバインドされ、既定値は127.0.0.1です。非公開にしてください）で平文のHTTPに応答します。これはこのAPIの一部ではありません。`GET /healthz`は`ok`を返します。`GET /readyz`は、起動が完了してから（すべてのシャードがジャーナルを再生し、リスナーがバインドされた後）シャットダウンが始まるまで`ready`を返し、それ以外のときは503 `not ready`を返します。`GET /metrics`はPrometheusのメトリクスを返し、`METRICS_TOKEN`が設定されている場合は、そのトークンと完全に一致する`Authorization: Bearer <token>`が必要です。
