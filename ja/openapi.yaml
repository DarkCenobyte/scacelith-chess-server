        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: 対戦相手のユーザー名。対局記録上の名前でも現在の名前でもよく、大文字と小文字は区別しません。空白のみにはできません。
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: 報告の内容の種類。
        comment:
          type:
            - string
            - 'null'
          description: 任意。制御文字（タブと改行を除く）を取り除き、前後の空白を除いた後で最大500文字。
    AccountExport:
      type: object
      description: サーバーがアカウントについて保持しているすべての情報（時刻はエポックからのミリ秒）。
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: エクスポートの作成日時。
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`。'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`。'
        notes:
          type: array
          description: ファイルに含まれるものと除かれるものの、プレイヤー向けの平易な英語による説明。
          items:
            type: string
        account:
          description: '`GET /account/me`のアカウント情報に`googleEmail`を加えたもの。'
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: 連携しているGoogleアカウントのアドレス、または`null`。
        ratings:
          type: array
          description: 完全なレーティング記録。
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: 対戦相手の不正が判明した後に返還されたレーティングポイント。UTCの日とカテゴリーごとに合計され、新しい順に並びます。対局も、不正を行ったプレイヤーも示されません。
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: 保存されているすべてのセッション（新しい順。トークンは含みません）。保持期間による削除処理で、期限切れのセッションは削除され、ログアウトしたセッションはログアウトの1日後に削除されます。
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: セキュリティイベント（新しい順）。`RETENTION_SECURITY_DAYS`日間保持されます。
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: 解除されたものを含む、すべての制裁。モデレーターの名前は決して含まれません。
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: プレイヤーが放棄した対局、中止した対局、最初の一手を指さなかった対局について記録された行動イベント。30日間保持されます。
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: プレイヤーが行った報告。
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: 対局数。
            list:
              type: array
              description: すべての対局（新しい順）を、`GET /account/games`の概要の形式で示します。指し手は`GET /games/{id}`、PGNは`GET /games/{id}/pgn`で取得できます。
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: 完全なレーティング記録。
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: プレイヤーが未レーティングの段階を抜けたかどうか。
            countedGames:
              type: integer
              minimum: 0
              description: レーティングの計算に入った対局の数。
            updatedAt:
              type: integer
              format: int64
              description: 記録が最後に変更された日時。
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: その日の00:00 UTC（エポックからのミリ秒）。
        category:
          type: string
        points:
          type: integer
          description: その日にそのカテゴリーで返還されたポイント。
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: セッションがログアウトされた日時、または`null`。
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: ログイン時のアドレス。`RETENTION_IP_DAYS`日後に消去されます。
    SecurityEvent:
      type: object
      description: |-
        セキュリティイベント。`ip`が示されるのは、ログイン中に行われた操作、アカウントのパスワード（と第二要素）を使って行われた操作、またはアドレスにメールで送られたリンクで行われた操作だけです：`register`、`email_verified`、`login`、`sso_login`、`sso_linked`、`sso_account_created`、`recovery_code_used`、`password_reset`、`password_changed`、`reauth_failed`、`mfa_setup_started`、`mfa_enabled`、`mfa_disabled`、`recovery_codes_regenerated`、`session_revoked`、`sessions_revoked_all`、`email_change_requested`、`email_changed`、`email_change_refused`、`account_exported`。その他の種類はすべて`ip: null`で、`ip`は`RETENTION_IP_DAYS`日後に消去されます。

        `detail`が保持するのは次のフィールドだけです：`login`は`method`、`sso_login`と`sso_account_created`は`provider`、`sso_linked`は`provider`と`method`（`password`または`password+totp`）、`login_failed`は`failures`、`login_lockout`は`retryAfterMs`、`mfa_failed`は`attempts`、`recovery_code_used`は`remaining`、`reauth_failed`は`factor`、`session_revoked`と`sessions_revoked_all`は`reason`、`email_change_refused`は`reason`、`sanction_auto`は`kind`、`gameId`、`until`。`moderator_action`イベントは、`ban`、`unban`、`reset_mfa`、`verify_email`、`revoke_sessions`の操作についてのみ、`{ action }`だけを保持します（モデレーターのその他の操作は除かれます）。その他の種類はすべて`detail: null`です。`rating_refund`イベントは除かれます。そのポイントは`ratingRefunds`にあります。
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: イベントの種類（`login`、`password_changed`など）。
        at:
          type: integer
          format: int64
          description: 発生日時。
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
