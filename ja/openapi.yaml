  - name: pages
    x-displayName: HTMLページ
    description: |-
      メールのリンクから開く、ブラウザー向けのページ。リンク先は`/api/v1`の外の`https://<SERVER_PUBLIC_HOST>`です（443以外の場合は`:<PUBLIC_API_PORT>`付き）。

      - ページはJavaScriptを実行せず、外部リソースも読み込みません。`Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'`付きで配信されます。
      - `GET`はボタンまたはフォームを表示するだけなので、メールスキャナーがリンクを開いてもリンクは消費されません。変更は`POST`で行われます。`application/x-www-form-urlencoded`として送られるフォームで（JSONボディも受け付けます）、リンクのトークンは隠しフィールドに入ります。同じフィールドが2回指定されると拒否されます。
      - エラー（レート制限、無効なフィールド）もHTMLページで、タイトルは"Request refused"（リクエスト拒否）、500以上では"Server error"（サーバーエラー）です。ページの照合より前に見つかった失敗（長すぎるか形式が不正なリクエストターゲット、アドレス単位の層）だけは、JSONで返ります。
