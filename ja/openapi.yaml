  - name: game-history
    x-displayName: 対局履歴
    description: ログイン中のプレイヤー自身の対局（絞り込みとページ分割付き）。
  - name: games
    x-displayName: 対局とPGN
    description: |-
      指し手と時計を含む対局の記録と、そのPGNファイル。

      **対局のコード**。`status`：1 `WhiteWins`、2 `BlackWins`、3 `Draw`、4 `Aborted`（保存されるのは終了した対局だけです）。`result`：`1-0`、`0-1`、`1/2-1/2`、または`*`（中止）。`reason`とその名前（`termination`）、およびPGNファイルの棋譜テキストの末尾に書かれる文言は下表のとおりです。コード7、14、21は引き分けです（時間切れになった、投了した、または対局を放棄したプレイヤーの相手が、チェックメイトできなかった場合。FIDE 6.9と5.1.2。規則は`DESIGN.md` 6.3にあります）。また、サーバーがコード4と13で対局を終えることはありません（これらは共通の終局理由リストに含まれているだけです）：

      | コード | `termination` | PGN内の文言（訳） |
      |---|---|---|
      | 1 | `Checkmate` | Checkmate（チェックメイト） |
      | 2 | `Resignation` | Resignation（投了） |
      | 3 | `Timeout` | Loss on time（時間切れ負け） |
      | 4 | `IllegalMoves` | Second illegal move (forfeit)（2回目の反則手による負け） |
      | 5 | `Stalemate` | Stalemate（ステイルメイト） |
      | 6 | `InsufficientMaterial` | Dead position (insufficient material)（駒不足によるデッドポジション） |
      | 7 | `TimeoutVsInsufficient` | Flag fall, but the opponent cannot checkmate（時間切れ、ただし相手はメイトできない） |
      | 8 | `FivefoldRepetition` | Fivefold repetition（5回同一局面） |
      | 9 | `SeventyFiveMoves` | 75-move rule（75手ルール） |
      | 10 | `ThreefoldClaim` | Threefold repetition (claimed)（3回同一局面の申告） |
      | 11 | `FiftyMoveClaim` | 50-move rule (claimed)（50手ルールの申告） |
      | 12 | `Agreement` | Draw by agreement（合意による引き分け） |
      | 13 | `IllegalMovesVsInsufficient` | Second illegal move, but the opponent cannot checkmate（2回目の反則手、ただし相手はメイトできない） |
      | 14 | `ResignationVsInsufficient` | Resignation, but the opponent cannot checkmate（投了、ただし相手はメイトできない） |
      | 20 | `Abandonment` | Abandoned (disconnected for too long)（長時間の接続切れによる対局放棄） |
      | 21 | `AbandonmentVsInsufficient` | Abandoned, but the opponent cannot checkmate（対局放棄、ただし相手はメイトできない） |
      | 22 | `Aborted` | Game aborted（対局中止） |
      | 23 | `NoShow` | Aborted: first move not played in time（中止：時間内に最初の一手が指されなかった） |
      | 24 | `Forfeit` | Forfeit (fair play violation)（フェアプレー違反による不戦敗） |
      | 25 | `ServerAborted` | Aborted by the server（サーバーにより中止） |
      | 26 | `BothDisconnected` | Aborted: both players disconnected（中止：両者の接続が切断） |

      コード14はプロトコルのマイナーバージョン1で追加されました：それ以前に書かれたクライアントは、未知のコードを、その`result`とともに通常の終局として表示してください。
  - name: gifs
    x-displayName: アニメーションGIF
    description: |-
      保存や共有のための、対局のアニメーションGIF。真上から見た盤面を、開始局面から最終局面まで1局面につき1フレームで表示し、盤の上に対局者の名前とレーティング、盤の下に最後の指し手、最終フレームには結果と終局の理由を示します。

      **コスト、キャッシュ、割り当て**。GIFは、対局を処理するスレッドではなく専用の描画スレッドで、最低のCPU優先度で作成されます。スレッドは`GIF_THREADS`個（既定値は`WORKERS`）で、最初のGIFとともに起動し、GIFのない状態が1分続くと停止します。スレッドを待てるGIFは最大`GIF_QUEUE_MAX`（4 × `WORKERS`）個で、それぞれ最大`GIF_QUEUE_TIMEOUT_MS`（10秒）まで待ちます。1回の描画には最大`GIF_RENDER_TIMEOUT_MS`（30秒）かけられます。サーバーは作成したGIFを`GIF_CACHE_MB` MB（32 × `WORKERS`）のキャッシュに保持し、最も長く使われていないものから破棄します。キャッシュにあるGIFや、別のリクエストのために作成中のGIFは、描画の回数に数えられません。キャッシュのキーには、名前を含め、画像を変えるすべての要素が含まれます。

      すべてのリクエストは`gif`に数えられます（2つのエンドポイント合計で、プレイヤーごとに毎分30件）。作成が必要なGIFは描画の制限にも数えられます。プレイヤーごとに毎分`GIF_USER_RENDERS_PER_MIN`（4）件と毎時`GIF_USER_RENDERS_PER_HOUR`（30）件、クライアントごと（そのすべてのアカウントの合計）に毎分`GIF_IP_RENDERS_PER_MIN`（12）件と毎時`GIF_IP_RENDERS_PER_HOUR`（120）件、IPv6の/48ごとにはその3倍です。クライアントは、ダウンロードしたファイルを再度要求せずに保持し、429または503の後は`retryAfter`だけ待ってください。

      サイズ：`small`（マス32 px：284 × 350ピクセル）、`medium`（48 px：424 × 515）、`large`（72 px：628 × 762）。座標なしでは268 × 342、400 × 503、600 × 748です。開始局面は少なくとも1秒（指定したフレーム間隔のほうが長ければその時間）、最終局面は3秒表示され、GIFはループします。最初のフレームの後は、画像の変化した部分だけが保存されます。ファイルサイズは小・中・大の順に、40手の対局でおよそ135、205、325 KiB、150手の対局で0.5、0.8、1.2 MiBです。
  - name: players
    x-displayName: プレイヤー
    description: 公開プロフィールと最近の対局。公開データのみで、メールアドレス、セッション、制裁、インテグリティレベルは決して含まれません。削除されたアカウントにはプロフィールがありません。
  - name: leaderboard
