        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: 指した側の、指し手後の時計の残り時間（ミリ秒）。記録にない場合は`null`。
    PgnTagsView:
      type: object
      description: 表示用の主なPGNタグ。ここでの`Termination`は終局理由の名前です。PGNファイルではPGN標準の値を使います。
      required:
