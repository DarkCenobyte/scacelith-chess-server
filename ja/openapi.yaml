          description: 任意。画像のサイズ。
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: 任意。盤の下側（手前）に置く側。
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: 任意。1手あたりのミリ秒。整数値のJSONの数値です。
        coords:
          type: boolean
          default: true
          description: 任意。盤の周囲にファイルの文字とランクの数字を描くかどうか。
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: 対局。整数、または1～16桁の数字の文字列で指定します。
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
