  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: メールアドレスを変更
      description: |-
        アカウントのメールアドレスを変更します。`newEmail`は前後の空白が除かれて小文字に変換された後、登録時のアドレスと同様に検査されます。

        **メール確認あり**（既定）：202 `verification_sent`。24時間有効なリンクが新しいアドレスに送られます。リンクは`/confirm-email-change`を開き、プレイヤーがそのページのボタンを押した時点で初めてアドレスが変更されます。それまでは、`GET /account/me`が新しいアドレスを`pendingEmail`として示します。新しいリクエストは保留中のリクエストを置き換え、パスワードの変更やリセットは保留中のリクエストを取り消します。同じ新しいアドレスに送られるリンクは、誰が要求しても5分に1通までです（すでに保留中の変更と同じ要求では、先に送られたリンクがそのまま有効です）。レスポンスは変わりません。現在のアドレスには、マスクされたアドレス（`a***@example.org`）への変更が要求されたという通知が届きます。別のアカウントがすでに新しいアドレスを使っている場合も、レスポンスと`pendingEmail`は同じです。その場合リンクは送られないため変更は完了せず、代わりにそのアドレスの所有者に通知が届きます（1時間に1通まで）。

        リンクで確認されると、アドレスが変更されて確認済みとみなされ、デバイスはログインしたままとなり、以前に送られたリンク（確認、パスワードリセット、ほかの変更）は使えなくなり、以前のアドレスには新しいアドレスをマスクした通知が届きます。

        **メール確認なし**（`REQUIRE_EMAIL_VERIFICATION=false`）：アドレスはただちに変更され（200 `email_changed`）、以前のアドレスに通知が届きます。別のアカウントがそのアドレスを使っている場合は409 `email_taken`が返り、そのアドレスの所有者に通知が届きます。

        **再認証**：パスワードと、二要素認証がオンの場合は認証アプリのコードまたはリカバリーコード。`invalid_email`と`same_email`はパスワードより先に検査されるため、失敗には数えられません。**制限**：`reauth`、次に`reauth_user`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: アドレスがただちに変更されました（このサーバーではメール確認なし）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: 保存された新しいアドレス。
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: 確認リンクが新しいアドレスに送られました（または、そのアドレスは別のアカウントのものです。レスポンスからはどちらかわかりません）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`、`same_email`（アカウントの現在のアドレス）、`password_not_set`（Googleでのみログインするアカウント）、`invalid_request`、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`（パスワードの変更やリセットがリクエストより先に完了した場合も。リンクは送られません）、`mfa_code_required`、`invalid_code`。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`：メール確認なしの場合のみ。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（再認証の失敗、またはこのアカウントで試したコードが多すぎる）、または`rate_limited`（`reauth`または`reauth_user`の制限、アカウント単位の割り当て、パスワードハッシュのキュー）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`：パスワードハッシュのキュー、またはデータベースのロックが解除されなかった（`retryAfter: 1`。何も変更されておらず、同じリクエストを再送できます）。`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: アカウントのデータをダウンロード
      description: |-
        サーバーがアカウントについて保持しているすべての情報を、保存用の1つのJSONファイルとして返します（`format`は`scacelith-account-export`、`version`は1）。エクスポートはセキュリティイベント（`account_exported`）として記録されます。ドキュメントの`notes`配列は、何が除かれているかを平易な英語でプレイヤーに説明します。

        **エクスポートに決して含まれないもの**：パスワードハッシュ、二要素認証のシークレットとリカバリーコード。あらゆるセッションやリンクのトークン、およびそのハッシュ。アンチチートのデータ（インテグリティレベルとスコア、異常、対局の解析、報告の重み）。ほかのプレイヤーがこのプレイヤーについて行った報告。モデレーターの身元。ほかのプレイヤーの非公開データ（対戦相手は公開名とレーティングで示され、ほかのプレイヤーが制裁を受けたかどうかを示すものはなく、他人のものである可能性のあるIPアドレスは含まれません）。

        **再認証**：パスワードと、二要素認証がオンの場合は認証アプリのコードまたはリカバリーコード。**制限**：`account_export`（サーバー全体で、プレイヤーごとに1時間あたり5件。失敗も含めすべての試行を数え、最初に検査されます）、次に`reauth`と`reauth_user`。**時間制限**：60秒。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
