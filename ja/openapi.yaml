paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: サーバーの名前、バージョン、ポート、登録ルールを取得
      description: |-
        ログインや接続の前にクライアントが必要とする情報：サーバーの名前とID、WebSocketプロトコルのバージョンとWebSocketの場所、登録ルール、公式の持ち時間、そしてクライアントがフォームを送信する前に確認できる制限。

        **制限**：アドレス単位の層のみ。
      security: []
      responses:
        '200':
          description: サーバーの情報。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：アドレス単位の層。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`。'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: アカウントを作成
      description: |-
        アカウントを作成します。メールアドレスに送られたリンクでアドレスが確認された時点で作成されるか、メール確認なしの場合はただちに作成されます。

        **メール確認あり**（`REQUIRE_EMAIL_VERIFICATION`、既定）：202 `verification_sent`。この時点ではまだアカウントは存在しません。仮登録が24時間確認を待ち、その間ユーザー名を確保します。この24時間有効なリンクがアドレスに送られます（アドレスごとに5分に1通まで。`POST /auth/verify-email/resend`で新しいリンクを送れます）。リンクが使われた時点（`/verify-email`ページのボタン）で、アドレスが確認済みのアカウントが作成され、プレイヤーはログインできるようになります。それまでは、そのユーザー名でのログインには未知のアカウントと同じく`invalid_credentials`が返り、公開プロフィールも存在しません。同じアドレスで新たに登録すると、確認待ちの仮登録は置き換えられます。別のアカウントがすでにそのアドレスを使っている場合もレスポンスは同じです。その場合リンクは送られず、代わりにそのアカウントの所有者に通知が届き（1時間に1通まで）、ユーザー名も同様に確保されるため、そのアドレスにアカウントがあるかどうかは何からもわかりません。リンクが使われなかった仮登録は24時間後に破棄され、そのユーザー名は再び使えるようになります。

        **メール確認なし**（`REQUIRE_EMAIL_VERIFICATION=false`）：201 `ready`。アカウントはただちに作成され、ログインできます。

        **ルール**。`username`：`USERNAME_MIN`～`USERNAME_MAX`文字（3～20）の英字、数字、`_`、`-`で、英字または数字で始まること（`GET /info`はこれらを`limits`として返します）。予約名（`admin`、`moderator`、`deleted`など）と一部の接頭辞は拒否されます。大文字と小文字を区別せずに一意であること。`email`：前後の空白を除き、小文字で保存されます。ドットを含むドメインを持つ、ASCII文字だけのアドレスであること。`password`：`PASSWORD_MIN_LENGTH`（10）文字以上、UTF-8で256バイト以下。ユーザー名やメールアドレスのローカル部を含まず、よく使われるパスワードでないこと。

        **エラー**（この順に検査）：403 `registration_closed`、400 `invalid_username`、400 `invalid_email`、400 `weak_password`、409 `username_taken`、428 `pow_required`、パスワードハッシュのキューのエラー、409 `email_taken`（メール確認なしの場合のみ）。

        **制限**：`auth`、次に`auth_register`（クライアントごとに1時間あたり10件の登録）。**プルーフ・オブ・ワーク**：`POW_REGISTER_BITS`が0より大きい場合は常に必要。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: 1回目の試行（プルーフ・オブ・ワークなし）
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: プルーフ・オブ・ワークを付けて再送信
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: アカウントが作成され、ログインできます（このサーバーではメール確認なし）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: 仮登録が確認リンクを待っています（または、そのアドレスにはすでにアカウントがあります。レスポンスからはどちらかわかりません）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`（`field`付き）、`invalid_json`、`invalid_username`、`invalid_email`、または`reason`付きの`weak_password`（`too_short`、`too_long`、`contains_username`、`contains_email`、`too_common`）。'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`：このサーバーでは登録を受け付けていません（`GET /info`が`registration: closed`を示します）。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`：そのユーザー名を持つアカウントがあるか、別のアドレスの確認待ちの仮登録がそのユーザー名を確保している。`email_taken`：別のアカウントがそのアドレスを使っている（メール確認なしの場合のみ）。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`auth`または`auth_register`の制限、またはパスワードハッシュのキュー。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（パスワードハッシュのキュー、またはデータベースのロックが解除されなかった）、`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: パスワードでログイン
      description: |-
        ユーザー名またはメールアドレスとパスワードでログインします。レスポンスは2通りで、どちらもステータス200です：セッション、または二要素認証がオンの場合は、5分以内に`POST /auth/login/mfa`で完了させる第2段階です。

        未知のアカウント、誤ったパスワード、パスワードのないアカウントには、同じ時間をかけて同じレスポンス（401 `invalid_credentials`）が返ります。アカウントの検査（`banned`、`email_unverified`）は、パスワードが正しい場合にのみ行われます。1つのログイン名で`AUTH_FAILURES_PER_ACCOUNT`（5）回失敗すると、以降の試行ごとに待ち時間が必要になります（429 `too_many_attempts`）。

        **制限**：`auth`。**プルーフ・オブ・ワーク**：ログイン失敗の急増中のみ（428 `pow_required`）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: セッション、または二要素認証付きログインの第2段階。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: ログイン完了
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: 二要素認証がオン
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`：未知のアカウント、誤ったパスワード、またはパスワードのないアカウント。'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'パスワードが正しい場合のみ：`until`（エポックからのミリ秒。無期限の利用停止では`null`）付きの`banned`、または`email_unverified`（アドレスがまだ確認されていない古いアカウント）。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（このログイン名の失敗による待ち時間）、または`rate_limited`（`auth`の制限、パスワードハッシュのキュー）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（パスワードハッシュのキュー、またはデータベースのロックが解除されなかった）、`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: 第二要素でログインを完了
      description: |-
        `POST /auth/login`またはGoogleログイン（`POST /auth/sso/google/finish`または`POST /auth/sso/google/link`）が`mfaRequired`を返した後の、二要素認証付きログインの第2段階です。`code`（6桁の認証アプリのコード、またはリカバリーコード）か`recoveryCode`を送ります。ここで使ったリカバリーコードは無効になります。

        1つの段階で受け付ける誤ったコードは最大5回です。パスワードがリセットまたは変更された場合も、その段階は終了します。Googleアカウント連携のパスワード段階の後では、ここでコードが通った時点で初めて連携が保存されます。

        **制限**：`auth`、およびアカウントごとに、どのアドレスからでも15分あたり最大`AUTH_MFA_PER_ACCOUNT`（10）個のコード。これを超えるとコードは検査されないため、リカバリーコードは消費されません。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: 認証アプリのコード
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: リカバリーコード
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: ログインしました。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`：`code`も`recoveryCode`も送られていない、またはボディがスキーマに違反している。`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`：段階が期限切れ、使用済み、または5回の誤ったコードで終了した、あるいは第1段階の後にパスワードがリセットまたは変更された（ログインし直してください）。`invalid_code`：誤ったコード、または使用済みのコード。'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned`（`until`付き）、`email_unverified`。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`：Googleアカウント連携のパスワード段階の後のみ。その間に、Googleアカウントが別のアカウントと連携された。'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`：Googleアカウント連携のパスワード段階の後のみ。その間にアカウントが変更された。ゲームから最初からやり直してください。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`：アカウントの失敗による待ち時間、または直近15分間の`AUTH_MFA_PER_ACCOUNT`個のコードを使い切った。`rate_limited`：`auth`の制限。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`retryAfter: 1`付きの`server_busy`：データベースのロックが解除されなかった（Googleアカウント連携の段階の後であれば、何も連携されていません。ゲームから最初からやり直してください）。`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: このセッションからログアウト
      description: |-
        使用したトークンのセッションを失効させます。そのセッションで開かれたWebSocketは閉じられます。ボディはなし（または`{}`）。

        **制限**：`sessions`。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ログアウトしました。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`：`{}`以外のボディ。`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`sessions`の制限、またはアカウント単位の割り当て。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（データベースのロックが解除されなかった）、`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
        - sessions
      summary: すべてのセッションからログアウト
      description: |-
        このセッションを含め、アカウントのすべてのセッションを失効させます。それらのセッションで開かれたWebSocketは閉じられます。ボディはなし（または`{}`）。

        **制限**：`sessions`。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: すべてのセッションがログアウトしました。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`：`{}`以外のボディ。`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`sessions`の制限、またはアカウント単位の割り当て。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（データベースのロックが解除されなかった）、`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: 確認リンクを再送
      description: |-
        メールアドレス確認のリンクを再送します。アドレスにかかわらずレスポンスは202 `accepted`なので、アカウントや仮登録がそのアドレスを使っているかどうかは決してわかりません。

        リクエストが実際に処理されるのは、アドレスごとに5分に1回までです。そのアドレスで確認待ちの仮登録は、別のアカウントがそのアドレスを使っているかどうかにかかわらず、改めて24時間の期限を得ます。これにより、どちらの場合もユーザー名が同じ期間だけ確保されます。リンクが送られるのは、そのアドレスにアカウントがない場合のその仮登録（24時間有効な新しいリンクが以前のリンクに置き換わります）か、そのアドレスを持つ有効で未確認のアカウントに対してだけです。

        **制限**：`auth`、次に`auth_mail`（クライアントごとに1時間あたり10件）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: 受け付けました（アドレスにかかわらず）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`auth`または`auth_mail`の制限（アドレスにかかわらず）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`retryAfter: 1`付きの`server_busy`：アカウントの照会中にデータベースのロックが解除されなかった（確認待ちの仮登録の更新はベストエフォートで、リクエストを失敗させることはありません）。`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: パスワードリセットのリンクを送信
      description: |-
        `/reset-password`ページを開く、1時間有効なパスワードリセットのリンクを送ります。アドレスにかかわらず、レスポンスは202 `accepted`です。リンクは有効なアカウントにのみ、アドレスごとに5分に1回まで送られます。Googleでのみログインするアカウントは、この方法で最初のパスワードを設定します。

        パスワードの再設定にはAPIで最も厳しい制限があり、すべてサーバー全体で数えられます。クライアント（IPv4アドレスまたはIPv6の/64）ごとに1時間あたり3件（`AUTH_FORGOT_PER_HOUR`）と24時間あたり10件（`AUTH_FORGOT_PER_DAY`）、IPv6の/48ごとにはその3倍で、さらに`auth`の制限（10分あたり20件）と、アドレスごとに5分に1通というメールの制限も加わります。202からも429からも、アカウントがそのアドレスを使っているかどうかはわかりません。新しいパスワードの設定には独自の制限（`auth_reset`）があります。

        **制限**：`auth`、`auth_forgot`、次に`auth_forgot_day`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: 受け付けました（アドレスにかかわらず）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`auth`、`auth_forgot`、`auth_forgot_day`のいずれかの制限（アドレスにかかわらず）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`retryAfter: 1`付きの`server_busy`：データベースのロックが解除されなかった。`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: リセットリンクのトークンで新しいパスワードを設定
      description: |-
        リセットリンクのトークンで新しいパスワードを設定します（`/reset-password`ページも同じことを行います）。新しいパスワードは登録時のルールに従います。

        リセットは、1つのトランザクションで（すべてを行うか、何も行わないか）次の効果をもたらします：すべてのセッションが失効し、保留中のメールアドレス変更は取り消されます。アカウントのほかのリセットリンクは使えなくなり、アドレスは確認済みとみなされ（リンクがそれを証明したため）、所有者にはメールが届きます。二要素認証は変更されません。パスワードハッシュのキューのエラー、503、または500の後は、何も変更されていません：古いパスワードもセッションもそのままで、リンクも有効なままです。

        **制限**：`auth`、次に`auth_reset`（クライアントごとに1時間あたり10件、IPv6の/48ごとに30件。ページと共有。各試行でパスワードをハッシュ化するため）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: パスワードが変更され、すべてのセッションがログアウトしました。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`：リンクが無効、使用済み、期限切れ、またはアカウントがもう使っていないアドレスに送られたもの。`weak_password`（`reason`付き）。`invalid_request`、`invalid_json`。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`auth`または`auth_reset`の制限、またはパスワードハッシュのキュー。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`：パスワードハッシュのキュー、またはデータベースのロックが解除されなかった（`retryAfter: 1`。何も変更されていません）。`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Googleログインを開始
      description: |-
        PKCEのチャレンジと、`127.0.0.1`で待ち受けるゲームのリスナーのポートに対して、Googleログインの試行を開始します。レスポンスは、システムのブラウザーで開くGoogleのURLと、この試行の`state`を返します。試行は10分間有効です。

        `authUrl`には、`client_id`、`redirect_uri`（`redirectPort`とサーバーのオリジンタグから構築）、`response_type=code`、`scope=openid email profile`、`state`、`nonce`、`code_challenge`（サーバーがGoogle用に持つ独自のベリファイアのS256）と`code_challenge_method=S256`、そして`prompt=select_account`が含まれます。ゲームは開く前にこれを検査します（タグの説明を参照）。

        **制限**：`sso_start`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: 試行の情報。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`：このサーバーではGoogleログインを提供していません。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`sso_start`の制限。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（データベースのロックが解除されなかった）、`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Googleからの応答をサーバーに渡す
      description: |-
        Googleがゲームのリスナーに送った`code`と`state`を、試行のIDとPKCEのベリファイアとともにサーバーに渡します。試行のIDはベリファイアがなければ役に立たず、コードはサーバー自身のPKCEのベリファイアとクライアントシークレットがなければ役に立ちません。

        サーバーは試行（未知、使用済み、期限切れなら410）、次にベリファイア（誤っていても試行は引き続き使えます）を検査し、その後試行を1回分消費して、`state`と`iss`を検査し、Googleとコードを交換してIDトークンを検証します。レスポンス（200）は次のいずれかです：

        - `{ token, expiresAt, user }`：連携済みのアカウントにログインしました。
        - `{ mfaRequired, mfaToken, expiresIn }`：`POST /auth/login/mfa`に進みます。
        - `{ needsUsername, ssoTicket, suggestedUsername }`：新しいアカウント。10分以内に`POST /auth/sso/complete`に進みます。`suggestedUsername`はGoogleの名前またはアドレスから作られ、適したものがなければ`""`です。
        - `{ needsPassword, linkTicket, username, expiresIn }`：そのアドレスのアカウントにパスワードがあります。`POST /auth/sso/google/link`に進みます。この時点ではまだ何も連携されていません。

        **制限**：`sso_finish`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: セッション、第2段階、または初回のGoogleログインの次の段階。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: 連携済みのアカウントにログイン
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: 二要素認証がオン
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: 新しいプレイヤー
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: パスワードを持つアカウントがそのアドレスを使用中
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`：ベリファイアが試行のチャレンジと一致しない（試行は引き続き使えます）。`sso_email_unverified`：Googleがアドレスを確認していない。`registration_closed`。`account_disabled`。連携済みのアカウントの場合のみ：`banned`（`until`付き）、`email_unverified`。'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`：このサーバーではGoogleログインを提供していません。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`：パスワードのない有効なアカウントがそのアドレスを使っている（どのアカウントかは示されません）。'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`：未知、使用済み、または期限切れの試行。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`sso_finish`の制限。'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（データベースのロックが解除されなかった）、`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: パスワードを使ってGoogleを既存のアカウントと連携
      description: |-
        `finish`が`needsPassword`を返した後に使います。ゲームで入力されたそのアカウントのパスワードを使って、Googleを既存のアカウントと連携します。レスポンス（200）はセッション（連携が保存され、プレイヤーはログイン済み）か、二要素認証がオンの場合は`{ mfaRequired, mfaToken, expiresIn }`です。後者の場合は`POST /auth/login/mfa`に進み、そこでコードが通った時点で初めて連携が保存されます。

        パスワードが誤っていてもチケットは引き続き使えますが、試行は合計5回までです。試行はパスワードを検査する直前に1回分消費されます。429 `too_many_attempts`や428 `pow_required`では消費されませんが、パスワードハッシュのキューによる拒否（503 `server_busy`、429 `rate_limited`）ではすでに1回分が消費されており、アカウントの失敗として数えられます。失敗による待ち時間は、`POST /auth/login`と同じカウンターを使います。

        **制限**：`auth`（IPv6の/48単位のカウントを含む）。**プルーフ・オブ・ワーク**：`POST /auth/login`と同様。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: セッション、またはログインの第2段階。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`：誤ったパスワード。チケットは、合計5回の試行まで有効なままです。'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned`（`until`付き）。パスワードが正しい場合のみ。'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`：このサーバーではGoogleログインを提供していません。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`：その間に、Googleアカウントが別のアカウントと連携された。'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`：未知、使用済み、または期限切れのチケット、5回目の誤ったパスワード、`finish`の後に状態またはアドレスが変わったアカウント、あるいは連携の保存中に状態、アドレス、パスワード、二要素認証のいずれかが変わったアカウント。ゲームから最初からやり直してください。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（アカウントの失敗による待ち時間）、または`rate_limited`（`auth`の制限、パスワードハッシュのキュー）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`：パスワードハッシュのキュー、またはデータベースのロックが解除されなかった（`retryAfter: 1`。何も連携されていません）。`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: 初回のGoogleログインでアカウントを作成
      description: |-
        `finish`が`needsUsername`を返した後に使います。選んだユーザー名（登録時のルールが適用されます）でアカウントを作成し、ログインさせます。このアカウントにはパスワードがありません。`hasPassword`は`false`で、「パスワードをお忘れですか？」（`POST /auth/password/forgot`）でパスワードを設定できます。

        **制限**：`auth`（IPv6の/48単位のカウントを含む）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: アカウントが作成され、ログインしました。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`、`invalid_request`、`invalid_json`。'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`。'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`：このサーバーではGoogleログインを提供していません。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`（そのユーザー名を持つアカウントがあるか、別のアドレスの確認待ちの仮登録がそのユーザー名を確保している）、`sso_already_linked`、`email_taken`。'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`：未知、使用済み、または期限切れのチケット。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`auth`の制限。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（データベースのロックが解除されなかった）、`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: ログイン中のデバイスを一覧表示
      description: |-
        アカウントの有効なセッション（ログイン中のデバイス）を、最近使われた順に返します。`current`は、リクエストを行っているセッションを示します。`lastSeenAt`の更新は最大で5分に1回です。`expiresAt`は絶対的な終了時刻で、アイドル期限によってそれより早くセッションが終了することもあります。

        **制限**：`sessions`。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 有効なセッション。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`sessions`の制限、またはアカウント単位の割り当て。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（データベースのロックが解除されなかった）、`timeout`。'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: 1台のデバイスをログアウト
      description: |-
        アカウントのセッションを1つログアウトさせます。現在のセッションもログアウトできます。そのセッションで開かれたWebSocketは閉じられます。ボディはなし（または`{}`）。

        **制限**：`sessions`。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: セッションをログアウトさせました。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`：`{}`以外のボディ、または有効なURLエンコーディングでない`id`。`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`：このアカウントには、このIDの有効なセッションがない。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`sessions`の制限、またはアカウント単位の割り当て。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（データベースのロックが解除されなかった）、`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: アカウント、レーティング、有効な制裁を取得
      description: |-
        プレイヤー本人から見たアカウント：アカウント情報（すべてのログインのレスポンスの`user`と同じもの）、プレイヤーがレーティング戦を指したカテゴリーごとに1つのレーティング記録、有効な制裁、利用停止。アンチチートのインテグリティレベルは決して表示されません。

        **制限**：`account`。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: アカウント。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`、または`invalid_token`（アカウントが削除された場合も）。'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`account`の制限、またはアカウント単位の割り当て。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（データベースのロックが解除されなかった）、`timeout`。'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: 直接の対局申し込みを受け付けるか拒否するかを設定
      description: |-
        ほかのプレイヤーが、名前を指定してこのプレイヤーに対局を申し込めるかどうかを設定します。`none`の場合、直接の申し込みは拒否され、申し込んだ側にはそのプレイヤーが対局できないと伝えられます。再認証は不要です。

        **制限**：`account`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: 現在有効な設定。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`account`の制限、またはアカウント単位の割り当て。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（データベースのロックが解除されなかった）、`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: パスワードを変更
      description: |-
        パスワードを変更します。現在のパスワードが必要ですが、二要素認証がオンでも第二要素は不要です。新しいパスワードは登録時のルールに従います（現在のパスワードの後に検査されます）。

        変更は、1つのトランザクションで（すべてを行うか、何も行わないか）次の効果をもたらします：ほかのすべてのセッションが失効し（このセッションはログインしたままです）、保留中のメールアドレス変更は取り消され、アカウントのパスワードリセットのリンクは使えなくなり、所有者にメールが送られます。

        **再認証**：パスワードのみ。**制限**：`reauth`、次に`reauth_user`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: パスワードを変更しました。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set`（Googleでのみログインするアカウント）、`weak_password`（`reason`付き）、`invalid_request`、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`：現在のパスワードが誤っている、またはリクエストの検査中にパスワードのリセットや変更が行われた。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（アカウントの再認証の失敗）、または`rate_limited`（`reauth`または`reauth_user`の制限、アカウント単位の割り当て、パスワードハッシュのキュー）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`：パスワードハッシュのキュー、またはデータベースのロックが解除されなかった（`retryAfter: 1`。何も変更されていません）。`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: 二要素認証の有効化を開始
      description: |-
        保留中の新しい認証アプリ用シークレットを保存し（以前の保留中のシークレットは置き換えられます）、認証アプリ向けに返します（テキストと、QRコードとして表示する`otpauth://` URIの両方で）。二要素認証はまだオンになっていません。このシークレットのコードを使って、`POST /account/mfa/totp/enable`でオンにします。

        **再認証**：パスワードのみ。**制限**：`reauth`、次に`reauth_user`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: 保留中のシークレット。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set`（Googleでのみログインするアカウント）、`invalid_request`、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`（パスワードより先に検査）。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（アカウントの再認証の失敗）、または`rate_limited`（`reauth`または`reauth_user`の制限、アカウント単位の割り当て、パスワードハッシュのキュー）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（パスワードハッシュのキュー、またはデータベースのロックが解除されなかった）、`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: 二要素認証の有効化を完了し、リカバリーコードを取得
      description: |-
        保留中のシークレットのコード（ちょうど6桁）で二要素認証をオンにします。パスワードはセットアップ時に入力済みなので、ここでは求められません。レスポンスには10個のリカバリーコードが含まれ、表示されるのはこの1回だけです。

        **制限**：`reauth`、次に`reauth_user`。誤ったコードは、アカウントの再認証の失敗として数えられます。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: 二要素認証がオンになりました。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`：`code`がちょうど6桁ではない、またはボディがスキーマに違反している。`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`：誤ったコード（デバイスの時刻を確認してください）。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`。`mfa_setup_required`：保留中のシークレットがない（先に`POST /account/mfa/totp/setup`を呼び出してください）。'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（アカウントの再認証の失敗）、または`rate_limited`（`reauth`または`reauth_user`の制限、アカウント単位の割り当て）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（データベースのロックが解除されなかった）、`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: 二要素認証をオフにする
      description: |-
        二要素認証をオフにします。シークレットとリカバリーコードは削除され、所有者にメールが送られます。

        **再認証**：パスワードと、認証アプリのコードまたはリカバリーコード（`code`か`recoveryCode`のどちらかが必須）。**制限**：`reauth`、次に`reauth_user`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: 二要素認証がオフになりました。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
