          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`（データベースのロックが解除されなかった。`Retry-After: 1`ヘッダー付き）、`server_busy`（パスワードハッシュのキュー）、`timeout`（60秒）。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: アカウントを削除
      description: |-
        アカウントを削除します。元に戻すことはできません。

        - すべてのセッションがただちに失効します。以降、そのトークンには401 `invalid_token`が返ります。
        - アカウントとすべての対局記録で、ユーザー名は`deleted#<id>`になります。
        - 次のものが消去されます：メールアドレス、パスワードハッシュ、二要素認証のシークレットとリカバリーコード、セッションとリンクのトークン、Googleアカウントとの連携、アンチチートのインテグリティ記録、セキュリティイベントとともに保存されたIPアドレス。
        - レーティングと対局は保持されます。対局は匿名の名前で引き続き閲覧でき、以前の名前に対する`GET /players/{username}`は404を返します。

        **再認証**：パスワードと、二要素認証がオンの場合は認証アプリのコードまたはリカバリーコード。**制限**：`reauth`、次に`reauth_user`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: アカウントを削除しました。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set`（Googleでのみログインするアカウント）、`invalid_request`、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`、`mfa_code_required`、`invalid_code`。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`（再認証の失敗、またはこのアカウントで試したコードが多すぎる）、または`rate_limited`（`reauth`または`reauth_user`の制限、アカウント単位の割り当て、パスワードハッシュのキュー）。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（パスワードハッシュのキュー、またはデータベースのロックが解除されなかった）、`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: プレイヤーの対局を一覧表示（絞り込みとページ分割付き）
      description: |-
        ログイン中のプレイヤーの対局を新しい順に、絞り込みとページ分割を適用して、条件に一致する対局の数とともに返します。クエリパラメーターはすべて任意で、空の値は指定なしとみなされます。

        ページ送り：前のページの`next`を`before`として渡します。最後のページでは`next`は`null`です。`total`は、全ページを通じて条件に一致する対局の数です。

        **制限**：`account_games`。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: 公式カテゴリーのID（`3+2`、または`3%2B2`）、またはそれ以外の持ち時間のすべての対局を表す`custom`。
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: レーティング戦（`true`）またはカジュアル戦（`false`）の対局のみ。
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: プレイヤーから見て勝った、負けた、または引き分けた対局のみ。中止された対局は、この絞り込みがない場合にだけ表示されます。
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: 履歴の1ページ。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor`（`before`が対局IDではない）、`invalid_limit`、または`invalid_filter`（`category`、`rated`、`result`）。いずれも、`field`がパラメーターを示します。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`account_games`の制限、またはアカウント単位の割り当て。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`（データベースのロックが解除されなかった。ボディに`retryAfter: 1`があり、`Retry-After`ヘッダーはありません）、`server_busy`（セッションの照会でデータベースがロックされていた）、`timeout`。'
  /games/{id}:
    get:
      operationId: getGame
      tags:
        - games
      summary: 指し手と時計を含む対局の記録を取得
      description: |-
        指し手と時計を含む、1局の対局記録。トークンがない場合、またはその対局を指していないプレイヤーのトークンの場合は、公開版のレスポンスが返ります。トークンのプレイヤーがその対局を指した場合は、レスポンスに`you`と`reportable`が加わります。

        **制限**：`public_read`（トークンがあればプレイヤー単位、なければクライアント単位）。
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: 対局の記録。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameRecord'
              example:
                id: 4100000000001
                category: '3+2'
                rated: true
                timeControl: '180+2'
                white:
                  name: alice
                  rating: 1500
                  ratingAfter: 1510
                  ratingDiff: 10
                black:
                  name: bob
                  rating: 1520
                  ratingAfter: 1510
                  ratingDiff: -10
                status: 1
                reason: 2
                result: 1-0
                termination: Resignation
                plies: 2
                startedAt: 1790620205000
                endedAt: 1790620611000
                baseMs: 180000
                incMs: 2000
                statusName: WhiteWins
                rematchOf: null
                moves:
                  - uci: e2e4
                    spentMs: 0
                    clockMs: 180000
                  - uci: e7e5
                    spentMs: 1700
                    clockMs: 180300
                pgn:
                  Event: Scacelith rated 3+2
                  Site: caissa.scacelith.com
                  Date: '2026.09.28'
                  Round: '-'
                  White: alice
                  Black: bob
                  Result: 1-0
                  WhiteElo: 1500
                  BlackElo: 1520
                  TimeControl: '180+2'
                  Termination: Resignation
                  PlyCount: 2
                you: white
                reportable: true
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`：最大16桁（2^53未満）の正の整数ではない。`invalid_request`：有効なURLエンコーディングではない。'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`：トークンが送られたが、有効ではない。'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`：その対局は存在しない。'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`public_read`の制限、またはアカウント単位の割り当て。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`（データベースのロックが解除されなかった。ボディに`retryAfter: 1`があり、`Retry-After`ヘッダーはありません）、`server_busy`（セッションの照会でデータベースがロックされていた）、`timeout`。'
  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: 対局をPGNファイルとしてダウンロード
      description: |-
        同じ対局をPGNファイルとして返します。改行コードが`\n`の1局分の対局で、棋譜テキストは1行80桁未満です。レスポンスはトークンの有無にかかわらず同じです。

        タグは次の順に並びます：`Event`（`<SERVER_NAME> rated <category>`または`<SERVER_NAME> casual <category>`）、`Site`（`SERVER_PUBLIC_HOST`）、`Date`（UTCでの開始日）、`Round`、`White`、`Black`、`Result`（中止された対局では`*`）、`UTCDate`と`UTCTime`（開始時点）、`WhiteElo`と`BlackElo`（開始時点のレーティング、または`-`）、`WhiteRatingDiff`と`BlackRatingDiff`（`+10`や`-10`のような変動。すべてのレーティング戦に付き、レーティングの規則によってレーティングが変わらなかった場合は`+0`。カジュアル戦、カスタムの持ち時間の対局、中止された対局にはどちらもありません）、`TimeControl`（秒単位）、`Termination`（PGN標準の値：`normal`。`time forfeit`は時間切れで、引き分けに終わった場合も含みます。`abandoned`。`rules infraction`は2回目の反則手またはフェアプレー違反による不戦敗。`unterminated`は中止された対局）、`PlyCount`、`ScacelithGameId`（10進数のID）。

        各指し手には`{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`が付きます。指した側の指し手後の時計の残り時間と、その手に費やした時間で、単位は0.1秒（切り捨て）です。記録に値がない場合は省略されます。最後の指し手の後には、終局理由の文言、続いて結果が書かれます。

        **制限**：`public_read`（トークンがあればプレイヤー単位、なければクライアント単位）。
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: PGNファイル。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`。'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'UTF-8のPGNテキスト（`Content-Type: application/x-chess-pgn; charset=utf-8`）。'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`：最大16桁（2^53未満）の正の整数ではない。`invalid_request`：有効なURLエンコーディングではない。'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`：トークンが送られたが、有効ではない。'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`：その対局は存在しない。'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`public_read`の制限、またはアカウント単位の割り当て。'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`：たとえば、保存された指し手を再生しても保存された終局に到達できない場合（サーバーがログに記録します）。'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`（データベースのロックが解除されなかった。ボディに`retryAfter: 1`があり、`Retry-After`ヘッダーはありません）、`server_busy`（セッションの照会でデータベースがロックされていた）、`timeout`。'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: このサーバーの対局をアニメーションGIFとしてダウンロード
      description: |-
        対局をアニメーションGIFとして返します。名前とレーティングは対局記録のもので（開始時点のレーティング。削除されたアカウントは`deleted#<id>`）、結果と終局理由（`Resignation`、`Loss on time`など）も同様です。

        検査は次の順に行われます：`gif_disabled`、画像のオプション（`size`、`orientation`、`delay`、`coords`）、対局ID、対局、その長さ。

        **セッション必須**：割り当てはアカウント単位で数えられます。**制限**：すべてのリクエストで`gif`。GIFを作成する必要がある場合のみ`gif_user_min`、`gif_user_hour`、`gif_ip_min`、`gif_ip_hour`（タグの説明を参照）。**時間制限**：`GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5秒（既定では45秒）。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 画像のサイズ。`small`（マス32 px）、`medium`（48 px）、`large`（72 px）のいずれか。
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: 盤の下側（手前）に置く側。
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: 1手あたりのミリ秒（10進数で1～6桁）。
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: 盤の周囲にファイルの文字とランクの数字を描くか（`1`）、描かないか（`0`）。
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`field`（`size`、`orientation`、`delay`、`coords`）付きの`invalid_option`：許可されていない値。`invalid_game_id`。`invalid_request`：有効なURLエンコーディングではない。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`：その対局は存在しない。`gif_disabled`：サーバーがGIFを無効にしている（`GIF_ENABLED=false`。`gif`のトークンは返却されます）。'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`gif`の制限、描画の制限、またはアカウント単位の割り当て。'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`：GIFを作成できなかった（理由はサーバーがログに記録します）。`internal_error`。'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`retryAfter`（3～10秒）と`Retry-After`付きの`server_busy`：描画キューが満杯、またはGIFが空きスレッドを`GIF_QUEUE_TIMEOUT_MS`（10秒）待った。リクエストが消費した制限のトークンはすべて返却されます。`busy`：データベースのロックが解除されなかった（`retryAfter: 1`はボディのみ）。`timeout`。'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: PGNとして送った任意の対局のアニメーションGIFを作成
      description: |-
        PGNテキストとして送った任意の対局について、`GET /games/{id}/gif`と同じ画像を作成します。ゲームが保存した対局、ほかのサイトからのエクスポート、手入力した対局などに使えます。テキスト内の最初の対局だけが使われます。

        - PGNリーダーは、ゲーム自体のリーダーと同じものを受け付けます。このサーバーが書き出すすべてのPGNと、ほかのサイトの一般的なエクスポートです（コメント、変化、NAG、時計の注釈は読み飛ばされ、手番号とSANは寛容に読み取られます。`SetUp`が`"0"`でない限り、`FEN`タグが開始局面を指定します）。
        - 名前とレーティングは、`White`、`Black`、`WhiteElo`、`BlackElo`タグから取られます。アクセント付きの文字はアクセントが除かれ、それ以外で印字可能なASCIIでない文字は`?`になり、長い名前は切り詰められます（48文字）。結果は`Result`タグから、なければ棋譜テキストの末尾から取られます。`Termination`タグは、`normal`でない限り表示されます。表示されない場合は、最終局面が結末を物語ります（チェックメイト、ステイルメイトなど）。
        - このエンドポイントはボディを独自に検査します。未知のフィールドがある場合、または`pgn`がないか文字列でない場合は、`field`付きで400 `invalid_request`が返ります。誤ったオプションには400 `invalid_option`が返ります（`delayMs`はJSONの数値、`coords`は真偽値でなければならず、`null`は拒否されます）。

        **セッション必須**：割り当てはアカウント単位で数えられます。**制限**：`GET /games/{id}/gif`と同様。**ボディの上限**：`HTTP_BODY_LIMIT`にかかわらず135,168バイト（JSON文字列としてのPGN。エスケープを含みます）。**時間制限**：既定では45秒。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: 手入力した短い対局（座標なし）
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: すべてのオプションを指定したPGNファイル
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`field`付きの`invalid_request`（未知のフィールド、または`pgn`がないか文字列でない。ボディがオブジェクトでない場合は`field`なし）。`invalid_json`。`field`（`size`、`orientation`、`delayMs`、`coords`）付きの`invalid_option`。`line`と`column`（1始まり。列は文字単位）とリーダーの`message`付きの`invalid_pgn`：反則手またはあいまいな指し手、壊れたタグ、未知のバリアント、65,536バイト超。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`：サーバーがGIFを無効にしている（`GIF_ENABLED=false`。`gif`のトークンは返却されます）。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`：135,168バイトを超えるボディ。'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`gif`の制限、描画の制限、またはアカウント単位の割り当て。'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`：GIFを作成できなかった（理由はサーバーがログに記録します）。`internal_error`。'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`retryAfter`（3～10秒）と`Retry-After`付きの`server_busy`：描画キューが満杯、またはGIFが空きスレッドを長く待ちすぎた。リクエストが消費した制限のトークンはすべて返却されます。`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
