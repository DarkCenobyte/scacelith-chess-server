          port:
            default: "443"
            description: 公開APIポート（`PUBLIC_API_PORT`、未設定なら`API_PORT`）。
    get:
      operationId: getReadiness
      tags:
        - health
      summary: サーバーがプレイヤーを受け付けていることを確認
      description: |-
        サーバーがプレイヤーを受け付けているときは200 `ready`を、起動中または停止中は503 `not_ready`を返します。`HEAD`も使えます。その他のメソッド（`OPTIONS`を含む）には、`Allow: GET, HEAD`付きで405 `method_not_allowed`が返ります。

        **制限**：アドレス単位の層のみ。
      security: []
      responses:
        '200':
          description: サーバーはプレイヤーを受け付けています。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：アドレス単位の層。'
        '503':
          description: サーバーは起動中または停止中です。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        ログインのレスポンスで得たセッショントークン（`sct_`に続く43文字のbase64url）を、`Authorization`ヘッダーに`Authorization: Bearer <token>`の形で入れます。接頭辞は正確に`Bearer`（大文字と小文字を区別）と1つのスペースです。これがない値や、印字可能なASCII文字1～512文字でないトークンには、ほかの無効なトークンと同様に401 `invalid_token`が返ります。空のヘッダーはヘッダーなしとみなされます。
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: 対局ID。先頭にゼロのない最大16桁の正の10進整数で、2^53未満です。
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: '`GET /auth/sessions`が返すセッションID。先頭にゼロを付けずに書きます（`03`はセッション3ではありません）。'
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: プレイヤーのユーザー名（大文字と小文字は区別しません）。サーバーは`[A-Za-z0-9_.-]`の2～24文字からなる任意の名前を受け付けます（これまでに許可したことのある最も広いルールです）。
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: 対局ID。これより古い対局だけが一覧に含まれます。前のページの`next`を渡します。空の値は指定なしとみなされます。
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: ページサイズ（1～50）。それより大きい3桁までの数は50とみなされ、空の値は指定なしとみなされます。
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: メールのリンクのトークン（43文字のbase64url）。ないか誤っている場合は、"link invalid or expired"（リンクが無効または期限切れ）のページが表示されます。
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: サーバーのすべてのレスポンスはキャッシュを禁止します。
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: 再試行までに待つ秒数。ボディの`retryAfter`と同じ値です。
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Bearer認証のチャレンジ。無効なトークンの場合は`error="invalid_token"`付き。
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: サーバーはこのレスポンスの後に接続を閉じます。
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request`（ボディのフィールドに問題がある場合は`field`付き）または`invalid_json`。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: フィールドがスキーマに違反
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: ボディがJSONではない
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: 弱いパスワード
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: 読み取れないPGN
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized`（`Authorization`ヘッダーがない）または`invalid_token`（トークンの形式が不正、期限切れ、失効済み、または削除されたアカウントのもの）。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: セッションなし
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: 無効なトークン
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: リクエストは拒否されました。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: 再認証時の誤ったパスワード
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: 利用停止中のアカウント
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found`、またはこのサーバーで無効にされている機能。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`：ボディが10秒以内に届かなかった。サーバーは接続を閉じます。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: リクエストがサーバーの状態と競合しています。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`：Googleログインの試行またはチケットが未知、使用済み、または期限切れ。ゲームから最初からやり直してください。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`：ボディが`HTTP_BODY_LIMIT`（既定値は16,384バイト）を超えている。サーバーは接続を閉じます。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`：リクエストターゲットが4096文字を超えている。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`：ボディが`application/json`ではない、またはその文字セットがUTF-8ではない。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`：対局の手数が`GIF_MAX_PLIES`（600）半手を超えている。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`：`pow`チャレンジを解き、`pow: { challenge, nonce }`を付けて同じリクエストをもう一度送ってください。理由は`reason`が示します：`required`、`malformed`、`signature`、`endpoint`、`network`、`expired`、`bits`、`work`、`replayed`のいずれかです。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited`（レート制限、アカウント単位の割り当て、またはパスワードハッシュのキュー）または`too_many_attempts`（アカウントに対する制限）。`retryAfter`と`Retry-After`ヘッダー付き。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: レート制限
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: このアカウントでの失敗が多すぎる
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`：予期しない障害。サーバーがログに記録します。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`：`state`または`iss`が誤っている、あるいはGoogleがコードを拒否したか、検証できないIDトークンを送ってきた。Googleからのテキストが含まれることはありません。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`、`busy`、または`timeout`：`retryAfter`が示されている場合は、その時間がたってから再試行してください。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: サーバーが混雑している
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: データベースのロックが解除されなかった（読み取り）
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: サーバーの処理に時間がかかりすぎた
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: アニメーションGIF（添付ファイルとして）。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: 'このサーバーの対局では`attachment; filename="scacelith-<id>.gif"`、`POST /gif`で送ったPGNでは`attachment; filename="scacelith-game.gif"`。'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: ファイルのサイズ（バイト）。
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: HTMLページ。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: 拒否の理由を説明するHTMLページ。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: フォームが10秒以内に届かなかった（HTMLページ）。サーバーは接続を閉じます。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: 競合を説明するHTMLページ。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: フォームが`HTTP_BODY_LIMIT`を超えている（HTMLページ）。サーバーは接続を閉じます。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: ボディがフォーム（`application/x-www-form-urlencoded`）でもJSONでもない、またはその文字セットがUTF-8ではない（HTMLページ）。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: レート制限（HTMLページ）。`Retry-After`付き。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: 予期しない障害。タイトルが"Server error"（サーバーエラー）のHTMLページです。サーバーがログに記録します。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: サーバーが混雑している（データベースのロックが解除されなかった。`Retry-After`付き）、または処理に時間がかかりすぎた。タイトルが"Server error"（サーバーエラー）のHTMLページです。
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: JSON APIのすべてのエラーレスポンスに共通の形式。
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: '`snake_case`のエラーコード。クライアントはこれをもとに表示内容を選びます。'
          examples:
            - rate_limited
        message:
          type: string
          description: 英語の文。ログ用およびフォールバック用です。
        retryAfter:
          type: integer
          minimum: 1
          description: 再試行までに待つ秒数。時間がたてば解除される拒否にのみ含まれます。その場合、レスポンスには同じ値の`Retry-After`ヘッダーも付きます。ただし、履歴、対局、プレイヤー、ランキングの読み取りで返る503 `busy`は例外です。
        field:
          type: string
          description: 問題のあるフィールドまたはクエリパラメーター（`invalid_request`、`invalid_option`、および`GET /account/games`の`invalid_cursor`、`invalid_limit`、`invalid_filter`）。入れ子のフィールドはドット区切りです（`pow.nonce`）。
        reason:
          type: string
          description: '理由：`weak_password`が違反したルール、またはプルーフ・オブ・ワークが要求された理由や拒否された理由（`pow_required`）。'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: '`banned`のみ：利用停止の終了時刻（エポックからのミリ秒）。無期限の利用停止では`null`。'
        line:
          type: integer
          minimum: 1
          description: '`invalid_pgn`のみ：エラーの行（1始まり）。'
        column:
          type: integer
          minimum: 1
          description: '`invalid_pgn`のみ：エラーの列（1始まり、文字単位）。'
    PowChallenge:
      type: object
      description: プルーフ・オブ・ワークのチャレンジ（428 `pow_required`の`pow`）。
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: 署名されたチャレンジ。そのまま送り返します。
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: '`SHA-256(challenge + ":" + nonce)`の先頭に必要なゼロビットの数。'
        expiresAt:
          type: integer
          format: int64
          description: チャレンジの有効期限（エポックからのミリ秒）。発行から2分後です。
    PowAnswer:
      type: object
      description: プルーフ・オブ・ワークのチャレンジへの解答。
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: 428のレスポンスで受け取った`challenge`（そのままの値）。
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: '`SHA-256(challenge + ":" + nonce)`が`bits`個のゼロビットで始まるような、最大20桁の10進数の文字列。'
    ServerInfo:
      type: object
      description: ログインや接続の前にクライアントが必要とする情報。
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: サーバーの名前（`SERVER_NAME`）。
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: データベースが初回起動時に取得するUUID。再起動しても変わりません。データベースから取得できない場合は`null`です。
        motd:
          type: string
          description: お知らせメッセージ（`SERVER_MOTD`）。空の場合もあります。
        protocol:
          type: object
          description: WebSocketプロトコル（`PROTOCOL.md`）。
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: サーバーが対応する最も古いプロトコルバージョン。
            max:
              type: integer
              minimum: 1
              description: サーバーが対応する最も新しいプロトコルバージョン。
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: プロトコルスキーマのフィンガープリント（正規形のSHA-256の先頭4バイトを符号なし整数にしたもの）。参考情報です。
            subprotocol:
              type: string
              description: WebSocketのサブプロトコルのトークン（`Sec-WebSocket-Protocol`）。
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: プレイヤーが使うWebSocketのポート（`PUBLIC_WS_PORT`、未設定なら`WS_PORT`、それも未設定なら`API_PORT`）。
        wsPath:
          type: string
          const: /ws
          description: WebSocketのパス。
        registration:
          type: string
          enum:
            - open
            - closed
          description: 新しいアカウントを作成できるかどうか。
        emailVerification:
          type: boolean
          description: 新しいアカウントがアドレスを確認する必要があるかどうか（`REQUIRE_EMAIL_VERIFICATION`）。
        sso:
          type: object
          required:
            - google
          properties:
            google:
              type: boolean
              description: Googleログインを提供しているかどうか。
        mfa:
          type: boolean
          const: true
          description: 二要素認証は常に利用できます。
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: 登録に必要なプルーフ・オブ・ワークのビット数（不要なら0）。
        categories:
          type: array
          description: 公式の（レーティング戦の）持ち時間（`RATED_CATEGORIES`）を、サーバーの順序で並べたもの。それ以外の持ち時間はすべて`custom`です。
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: クライアントがフォームを送信する前に確認できるルール。
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: ユーザー名の最小文字数（`USERNAME_MIN`）。
            usernameMax:
              type: integer
              description: ユーザー名の最大文字数（`USERNAME_MAX`）。
            usernamePattern:
              type: string
              description: 新しいユーザー名が一致しなければならない正規表現。
            passwordMinLength:
              type: integer
              description: パスワードの最小文字数（`PASSWORD_MIN_LENGTH`）。
            passwordMaxBytes:
              type: integer
              description: パスワードの最大長（UTF-8のバイト数）。
            customTimeControls:
              type: boolean
              description: 対局の申し込みとプライベート対局で、カスタムの持ち時間を使えるかどうか。
            reportsPerDay:
              type: integer
              description: プレイヤーが24時間あたりに行える報告の件数（`REPORTS_PER_DAY`）。
            wsMaxMessageBytes:
              type: integer
              description: クライアントが送信できるWebSocketメッセージの最大サイズ（バイト）。
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 1852590473
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: 公式の持ち時間。
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: カテゴリーのID。分と加算秒数で表します（`3+2`）。
        baseSec:
          type: number
          minimum: 0
          description: 基本の持ち時間（秒）。
        incSec:
          type: number
          minimum: 0
          description: 1手ごとの加算時間（秒）。
    AccountView:
      type: object
      description: プレイヤー本人から見たアカウント（ログインのレスポンスと`GET /account/me`の`user`）。
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: アカウントID。
        username:
          type: string
          description: ユーザー名。
        email:
          type: string
          format: email
          description: メールアドレス。
        emailVerified:
          type: boolean
          description: アドレスが確認済みかどうか。
        mfaEnabled:
          type: boolean
          description: 二要素認証がオンかどうか。
        googleLinked:
          type: boolean
          description: Googleアカウントと連携しているかどうか。
        hasPassword:
          type: boolean
          description: 'Google経由で作成され、まだパスワードを設定していないアカウントでは`false`。'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: 名前を指定した直接の対局申し込みを受け付けるかどうか（`PUT /account/preferences`を参照）。
        createdAt:
          type: integer
          format: int64
          description: アカウントの作成日時（エポックからのミリ秒）。
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: 最後のログイン日時（エポックからのミリ秒）、または`null`。
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: リンクによる確認待ちのメールアドレス変更の、新しいアドレス。なければ`null`。
    SessionAnswer:
      type: object
      description: 新しいセッション。
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: セッショントークン。`Authorization`ヘッダーとWebSocketで使います。
        expiresAt:
          type: integer
          format: int64
          description: セッションの絶対的な終了時刻（エポックからのミリ秒）。アイドル期限によって、それより早く終了することもあります。
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: 二要素認証付きログインの第2段階。`POST /auth/login/mfa`に進みます。
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: この段階のトークン。`POST /auth/login/mfa`で使います。
        expiresIn:
          type: integer
          const: 300
          description: 段階を完了するまでの残り秒数。
    LoginAnswer:
      description: セッション、または二要素認証付きログインの第2段階。
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: 初回のGoogleログイン。`POST /auth/sso/complete`に進みます。
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: '`POST /auth/sso/complete`用のチケット。10分間有効です。'
        suggestedUsername:
          type: string
          description: Googleの名前またはアドレスから作られたユーザー名。適したものがなければ`""`。
    SsoNeedsPassword:
      type: object
      description: パスワードを持つアカウントがそのアドレスを使っています。`POST /auth/sso/google/link`に進みます。この時点ではまだ何も連携されていません。
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: '`POST /auth/sso/google/link`用のチケット。'
        username:
          type: string
          description: そのアカウントのユーザー名（Googleに対してそのアドレスの所有を証明した人だけが目にします）。
        expiresIn:
          type: integer
          const: 600
          description: チケットが有効な残り秒数。
    SsoFinishAnswer:
      description: '`POST /auth/sso/google/finish`のレスポンス。'
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Googleログインの試行。
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: 試行のID。`POST /auth/sso/google/finish`で使います。
        authUrl:
          type: string
          format: uri
          description: 検査した後にシステムのブラウザーで開く、GoogleのURL。
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Googleが送り返すべき`state`。
        expiresIn:
          type: integer
          const: 600
          description: 試行が有効な残り秒数。
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: ユーザー名。サーバーのルールに従います（説明を参照）。
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: メールアドレス。前後の空白が除かれ、小文字で保存されます。
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: パスワード。パスワードのルールに従います。
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: ユーザー名、またはメールアドレス（`@`を含む任意のテキスト）。
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: 任意。ログイン中のデバイスの一覧に表示されます（`Scacelith 1.4 (Windows)`など）。
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: ログインのレスポンス（またはGoogleログインのレスポンス）の`mfaToken`。
        code:
          type: string
          maxLength: 32
          description: 任意。6桁の認証アプリのコード、またはリカバリーコード。
        recoveryCode:
          type: string
          maxLength: 32
          description: 任意。リカバリーコード。`code`と`recoveryCode`のどちらかが必要です。
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: メールアドレス。
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: リセットリンクの`token`パラメーター。
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: 新しいパスワード。登録時のパスワードのルールが適用されます。
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: クライアントの`codeVerifier`から作るS256のPKCEチャレンジ（`BASE64URL(SHA-256(codeVerifier))`）。
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: '`127.0.0.1`で待ち受けるクライアントのリスナーのポート。'
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`POST /auth/sso/google/start`で得た`attemptId`。'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: PKCEのベリファイア。そのSHA-256が、`start`に渡したチャレンジと一致しなければなりません。
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Googleが送り返したままの`state`。
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: Googleが送り返したままの`code`（スペースを含まない印字可能なASCII）。
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: 任意。Googleが送り返した場合は、そのままの`iss`。
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`finish`で得た`linkTicket`。10分間有効です。'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: アカウントのパスワード。
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`finish`で得た`ssoTicket`。10分間有効です。'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: ユーザー名。登録時のルールが適用されます。
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: 有効なセッション（最近使われた順）。
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: 有効なセッション（ログイン中のデバイス）。
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: セッションID。`DELETE /auth/sessions/{id}`で使います。
        createdAt:
          type: integer
          format: int64
          description: ログイン日時（エポックからのミリ秒）。
        lastSeenAt:
          type: integer
          format: int64
          description: 最後に使われた日時（エポックからのミリ秒）。更新は最大で5分に1回です。
        expiresAt:
          type: integer
          format: int64
          description: 絶対的な終了時刻（エポックからのミリ秒）。アイドル期限によって、それより早くセッションが終了することもあります。
        clientLabel:
          type:
            - string
            - 'null'
          description: ログイン時の`clientLabel`。送られなかった場合は`null`。
        current:
          type: boolean
          description: リクエストを行っているセッションかどうか。
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: プレイヤーがレーティング戦を指したカテゴリーごとに1つの記録。
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: 有効な制裁。
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '利用停止中は`{ until }`、それ以外は`null`。'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: 1つのカテゴリーのレーティング記録。
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: カテゴリーのID。
        rating:
          type: integer
          description: レーティング。
        games:
          type: integer
          minimum: 0
          description: そのカテゴリーで指した対局数（集計対象かどうかを問いません）。
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: 到達した最高レーティング。
        provisional:
          type: boolean
          description: '未レーティングの段階にあるか、集計対象の対局が`PROVISIONAL_GAMES`局未満のあいだは`true`（ゲームでは`1510?`のように表示されます）。'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: 制裁の種類。
        reason:
          type:
            - string
            - 'null'
          description: 示された理由（ある場合）。
        startsAt:
          type: integer
          format: int64
          description: 開始日時（エポックからのミリ秒）。
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: 終了日時（エポックからのミリ秒）。無期限の制裁では`null`。
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 利用停止の終了日時（エポックからのミリ秒）。無期限の場合は`null`。
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '名前を指定した直接の対局申し込みを受け付けるなら`all`、拒否するなら`none`。'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: 現在のパスワード。
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: 新しいパスワード。登録時のパスワードのルールが適用されます。
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: アカウントのパスワード。
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: 保留中のシークレットのコード（ちょうど6桁）。
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: アカウントのパスワード。
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: 任意。二要素認証がオンの場合は必要です（または`recoveryCode`）。認証アプリのコード、またはリカバリーコード。
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: 任意。リカバリーコード（`xxxx-xxxx-xx`。大文字と小文字、スペース、ハイフンは区別されません）。
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: アカウントのパスワード。
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: 認証アプリのコード（リカバリーコードは拒否されます）。
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: 新しいアドレス。前後の空白が除かれて小文字に変換された後、登録時のアドレスと同様に検査されます。
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: アカウントのパスワード。
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: 任意。二要素認証がオンの場合は必要です（または`recoveryCode`）。認証アプリのコード、またはリカバリーコード。
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: 任意。リカバリーコード。
    TotpSetup:
      type: object
      description: 認証アプリ用の保留中のシークレット。
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: アプリに入力するための、base32のシークレット。
        uri:
          type: string
          format: uri
          description: QRコードとして表示するための`otpauth://totp/...` URI。
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: 1ステップの秒数。
    RecoveryCodeList:
      type: array
      description: 10個のリカバリーコード。表示されるのはこの1回だけです。各コードは1回だけ使えます。
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: 対局の一方の側。
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: 対局記録上の名前（削除されたアカウントは`deleted#<id>`）。
        rating:
          type:
            - integer
            - 'null'
          description: 開始時点のレーティング。不明な場合は`null`。
        ratingAfter:
          type:
            - integer
            - 'null'
          description: 対局後のレーティング。レーティング戦には常にあります。`null`になるのは、レーティングに反映されない対局（カジュアル、カスタム、中止）だけです。
        ratingDiff:
          type:
            - integer
            - 'null'
          description: レーティングの変動。レーティングの規則によってレーティングが変わらない場合（FIDEのゼロスコア規定、未レーティングの相手、未レーティングのプレイヤーの最初の対局）は`0`。`null`になる条件は`ratingAfter`と同じです。
    GameSummary:
      type: object
      description: 保存された対局の概要。
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: 対局ID。
        category:
          type: string
          description: 公式カテゴリーのID（`3+2`）、または`custom`。
        rated:
          type: boolean
          description: 対局がレーティングに反映されるかどうか。
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 秒単位の持ち時間（`180+2`）。
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`、2 `BlackWins`、3 `Draw`、4 `Aborted`（対局のコードを参照）。'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: 終局理由のコード（対局のコードを参照）。
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: 結果。中止された対局では`*`。
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: 手数（半手単位）。
        startedAt:
          type: integer
          format: int64
          description: 開始日時（エポックからのミリ秒）。
        endedAt:
          type: integer
          format: int64
          description: 終了日時（エポックからのミリ秒）。
    Termination:
      type: string
      description: 終局理由の名前（対局のコードを参照）。プロトコルが知らないコードの場合は`Unknown`。
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: 一方のプレイヤーから見た対局の概要。
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: プレイヤーの色。
    HistoryGameSummary:
      description: ログイン中のプレイヤーの履歴にある対局。
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: 基本の持ち時間（ミリ秒）。
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: 加算時間（ミリ秒）。
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: プレイヤーから見た勝敗。
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: このページの対局（新しい順）。
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: 次のページのために`before`として渡すID。最後のページでは`null`。
        total:
          type: integer
          minimum: 0
          description: 全ページを通じて条件に一致する対局の数。
    MoveRecord:
      type: object
      description: 対局の1半手。
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
