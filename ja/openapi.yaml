        variables:
          host:
            default: caissa.scacelith.com
            description: サーバーの公開ホスト名（`SERVER_PUBLIC_HOST`）。
          port:
            default: "443"
            description: 公開APIポート（`PUBLIC_API_PORT`、未設定なら`API_PORT`）。
    get:
      operationId: showResetPasswordPage
      tags:
        - pages
      summary: パスワードリセットのフォームを表示
      description: |-
        パスワードリセットリンクのページ：新しいパスワードのフォーム（パスワードを2回入力）。フォームは`POST /reset-password`に送信されます。

        **制限**：`page`。
      security: []
      parameters:
        - $ref: '#/components/parameters/LinkTokenQuery'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: 新しいパスワードのフォーム。
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: リンクが無効（アカウントがもう使っていないアドレスに送られたリンクの場合も）。
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: '`page`の制限（HTMLページ）、またはアドレス単位の層（JSONの`rate_limited`）。'
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
    post:
      operationId: submitResetPasswordPage
      tags:
        - pages
      summary: リセットフォームから新しいパスワードを設定
      description: |-
        リセットページのフォーム。`POST /auth/password/reset`と同じ処理を1つのトランザクションで行います：すべてのデバイスがログアウトされ、保留中のメールアドレス変更は取り消され、ほかのリセットリンクは使えなくなり、アドレスは確認済みとみなされ、所有者にメールが届きます。

        まずリンク、次に2つのパスワードが一致すること、最後にパスワードのルールが検査されます。サーバーが混雑している場合は`Retry-After`付きでフォームが再表示され、リンクは有効なままです。

        **制限**：`auth`、次に`auth_reset`（`POST /auth/password/reset`と共有）。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: パスワードが変更され、すべてのデバイスがログアウトしました。
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: エラー付きで再表示されたフォーム（パスワードが一致しない、弱いパスワード）、リンクが無効、またはフォームが無効（HTMLページ）。
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: '`auth`または`auth_reset`の制限（HTMLページ）、このクライアントの待機中のパスワードハッシュが多すぎる場合に`Retry-After`付きで再表示されたフォーム（リンクは有効なままです）、またはアドレス単位の層（JSONの`rate_limited`）。'
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'サーバーが混雑している場合（パスワードハッシュのキュー、またはデータベースのロックが解除されなかった）に`Retry-After`付きで再表示されたフォーム。リンクは有効なままです。データベースの書き込み待ちが多すぎる場合は、代わりに`Retry-After`（2～5）付きの"Server error"（サーバーエラー）ページになります：何も実行されておらず、リンクは有効なままです。ハンドラーのタイムアウトの場合もこのステータスです。'
