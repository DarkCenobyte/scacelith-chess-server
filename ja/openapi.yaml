        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>`または`<SERVER_NAME> casual <category>`。'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`。'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: UTCでの開始日。
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: 開始時点のレーティング、または`"-"`。
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: 開始時点のレーティング、または`"-"`。
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: 指し手と時計を含む対局の記録。対局の概要のフィールドを持ちますが、`color`と`outcome`はありません。
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: 基本の持ち時間（ミリ秒）。
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: 加算時間（ミリ秒）。
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: '`status`の名前。'
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: この対局が再戦である場合の元の対局のID、または`null`。
            moves:
              type: array
              description: 1半手につき1エントリー。
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: トークンのプレイヤーがこの対局を指した場合のみ。そのプレイヤーの色。
            reportable:
              type: boolean
              description: トークンのプレイヤーがこの対局を指した場合のみ。この対局の相手についての報告を現時点で`POST /reports`が受け付ける場合は`true`（対局が7日以内に終了し、1日の上限を使い切っておらず、この対局で相手をまだ報告していない）。
    PlayerProfile:
