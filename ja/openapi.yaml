tags:
  - name: server-info
    x-displayName: サーバー情報
    description: ログインや接続の前に、クライアントが知っておくべき情報。
  - name: health
    x-displayName: ヘルスチェック
    description: |-
      監視のための、サーバーの死活状態と準備完了状態の確認。APIポートで、認証とすべてのエンドポイントの制限より前に応答しますが、ほかのリクエストと同様にアドレス単位の層のトークンを消費します。監視用のホストは`ABUSE_EXEMPT`に登録できます。各エンドポイントは、サーバーのルートと`/api/v1`の下の両方のパスで動作します。

      メトリクスポートには独自のヘルスチェックのエンドポイントがあり、冒頭の説明に記載されています。
  - name: auth
    x-displayName: 登録とログイン
    description: |-
      アカウントの作成、パスワード（と第二要素）によるログイン、確認メールとパスワードリセットのメール。

      `POST /auth/login`、`POST /auth/login/mfa`、`POST /auth/sso/google/finish`、`POST /auth/sso/google/link`、`POST /auth/sso/complete`は、セッション`{ token, expiresAt, user }`を返します（はじめのいくつかは、代わりにログインの第2段階を返すこともあります）。
  - name: google-sign-in
    x-displayName: Googleログイン
    description: |-
      `GET /info`が`sso.google: true`を示す場合に提供されます。そうでなければ、以下のすべてのエンドポイントは404 `sso_disabled`を返します。ゲームは、RFC 8252のインストール型アプリのフロー（「デスクトップアプリ」タイプのクライアント）により、システムのブラウザーを通じてログインします。Googleはブラウザーを、このサーバーではなく、`127.0.0.1`で待ち受けるゲームのリスナーに戻します。ゲームがGoogleの認証情報を目にすることはありません。

      1. クライアントは`127.0.0.1:0`で待ち受け（ポートはシステムが選びます）、PKCEのペアを作ります。43～128文字の`[A-Za-z0-9._~-]`からなる`codeVerifier`と、`codeChallenge = BASE64URL(SHA-256(codeVerifier))`です。後者は43文字で、パディングはありません。
      2. チャレンジとポートを指定した`POST /auth/sso/google/start`が、GoogleのURLとこの試行の`state`を返します。クライアントはURLを検査し（後述）、ブラウザーで開きます。
      3. Googleはブラウザーを`http://127.0.0.1:<port>/oauth2/google/<tag>?code=...&state=...`に送ります。クライアントは開始時のレスポンスの`state`だけを受け付け、`error=`のリダイレクトの後には何も送りません。
      4. 試行のID、`codeVerifier`、`state`、`code`（Googleが送ってきた場合は`iss`も）を指定して、`POST /auth/sso/google/finish`を呼び出します。
      5. レスポンスは、セッション、二要素認証の段階（`POST /auth/login/mfa`に進みます）、新しいプレイヤーの場合の`needsUsername`（`POST /auth/sso/complete`に進みます）、またはパスワードを持つアカウントがそのアドレスを使っている場合の`needsPassword`（`POST /auth/sso/google/link`に進みます）のいずれかです。

      **オリジンタグ**。リダイレクトURIには、プレイヤーが追加したサーバーのタグが含まれます。これにより、別のサーバーが自分のプレイヤー向けに取得したURLを、ゲームが拒否できます。オリジンは、小文字のホスト（IPv6リテラルは角括弧で囲みます）、`:`、10進数のAPIポートをつなげたもので、ポートは443も含めて常に書きます。サーバーは`SERVER_PUBLIC_HOST`と公開APIポートを、ゲームは接続先のアドレスを使います。タグは、SHA-256(UTF-8の`"scacelith-sso-origin-v1\n"` + オリジン)のbase64url（パディングなし）の先頭22文字です。リダイレクトURIは`"http://127.0.0.1:" + port + "/oauth2/google/" + tag`です。常にIPv4リテラルを使い、ポートはゲームのリスナーのポート（1024～65535）です。サーバーがクライアントからURI、ホスト、パスを受け取ることはありません。

      | オリジン | タグ |
      |---|---|
      | `play.scacelith.example:443` | `IhcScoV7eDOzTEcSnqPUPt` |
      | `localhost:8443` | `TFGx7zQ_8QlGZW5zpqznCr` |
      | `[::1]:8443` | `XToJm0DG5PjciEVmZa9Cho` |
      | `127.0.0.1:50443` | `3r653wM5ZjYsHcAJljmCwY` |

      したがって、Googleログインが使えるのは、サーバーを`SERVER_PUBLIC_HOST`と公開APIポートのとおりに追加したプレイヤーだけです。

      **ブラウザーを開く前にゲームが検査すること**。`authUrl`は正確に`https://accounts.google.com/o/oauth2/v2/auth?`で始まり、4096文字未満の印字可能なASCIIで構成され、そのクエリには、`response_type=code`がちょうど1つ、ゲームが自身のポートとオリジンタグから計算したURIに等しい`redirect_uri`がちょうど1つ、レスポンスの`state`に等しい`state`がちょうど1つ、そして`code_challenge_method=S256`と43文字の`code_challenge`が含まれていなければなりません。そうでなければ、ゲームはリスナーを停止し、何も開きません。ゲームは`finish`と`link`を、`start`に応答したサーバーにだけ送信します。

      **Googleログインでどのアカウントに入るか**：そのGoogleアカウントとすでに連携しているアカウント。なければ、Googleが確認したアドレスを持つ有効なアカウント（パスワードがある場合、`finish`は`needsPassword`を返し、パスワード、続いて二要素認証がオンならその第二要素が通った時点で初めて連携が保存されます。パスワードがない場合は409 `sso_account_exists`）。それもなければ新しいアカウント（`needsUsername`）。Googleアカウントが、アドレスだけを根拠に既存のアカウントと連携されることはありません。Googleログインによってアカウントが作成されたとき、および既存のアカウントにGoogleログインが追加されたときには、そのアカウントのアドレスにメールが送られます。
