        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：`public_read`の制限、またはアカウント単位の割り当て。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`（データベースのロックが解除されなかった。ボディに`retryAfter: 1`があり、`Retry-After`ヘッダーはありません）、`server_busy`（セッションの照会でデータベースがロックされていた）、`timeout`。'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: カテゴリーの上位プレイヤーを取得
      description: |-
        公式カテゴリーで、集計対象の対局が`minGames`（`PROVISIONAL_GAMES`）局以上あるレーティング記録の上位100件。削除されたアカウントと、不正が確認されたプレイヤーは除かれます。サーバーは各ランキングを最大で10秒に1回計算し直します。その時刻は`updatedAt`が示します。1つのカテゴリーの計算は同時に1つしか実行されません：その間、ほかのリクエストは前回のリストを受け取るか、まだリストがない場合は計算を待ちます。

        **制限**：アドレス単位の層のみ。
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: 公式カテゴリーのID（`3+2`、または`3%2B2`）。
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: プレイヤーの人数（1～100）。それより大きい3桁までの数は100とみなされ、空の値は指定なしとみなされます。
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: ランキング。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category`（指定がない、または公式カテゴリーではない）、`invalid_limit`。'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`：アドレス単位の層。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`（データベースのロックが解除されなかった。ボディに`retryAfter: 1`があり、`Retry-After`ヘッダーはありません）、`timeout`。'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: 最近の対局の相手を報告
      description: |-
        プレイヤー自身の対局のうち、直近7日以内に終了した対局の相手を報告します。報告それ自体がレーティング、制裁、インテグリティレベルを変えることはありません。報告は、モデレーターが見る審査の優先度を上げ、`abuse`以外の場合は、その対局のエンジン解析を要求します。

        同じ対局で同じ相手を再度報告しても、同じレスポンスが返り、何も変わりません。レスポンスが報告されたアカウントについて何かを伝えることはありません。報告が受け付けられるかどうかは、`GET /games/{id}`が対局者に事前に伝えます（`reportable`）。

        このエンドポイントは、ボディを`gameId`、`reported`、`category`、`comment`の順に独自に検査します。失敗すると、`field`なしで400 `invalid_request`が返ります。未知のフィールドは無視されます。

        **制限**：`reports`（プレイヤー単位）、次にプレイヤーごとに24時間あたり`REPORTS_PER_DAY`（5）件の報告（429 `report_limit`）。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: 報告を受け付けました（または、すでに受け付け済みです）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`（`field`なし）、`invalid_json`。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`：直近7日以内に終了した対局における、報告者の対戦相手ではない。'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit`（`retryAfter: 3600`、`Retry-After`ヘッダー付き）：直近24時間に`REPORTS_PER_DAY`件の報告を行った。`rate_limited`：`reports`の制限、またはアカウント単位の割り当て。'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`（セッションの照会でデータベースがロックされていた）、`timeout`。また、`retryAfter`（2～5）付きの`server_busy`：データベースの書き込み待ちが多すぎるため、リクエストは実行されていません。'
  /verify-email:
