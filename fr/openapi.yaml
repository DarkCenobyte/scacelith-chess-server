        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` : un corps autre que `{}` ; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited` : la limite `sessions` ou le budget du compte.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la base de données est restée verrouillée), `timeout`. Aussi `server_busy` avec `retryAfter` de 2 à 5 : la base de données a trop d’écritures en attente, et la requête n’a pas été exécutée.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Renvoyer le lien de confirmation
      description: |-
        Renvoie le lien de confirmation de l’adresse e-mail. La réponse est 202 `accepted` quelle que soit l’adresse, pour ne jamais révéler si un compte ou une inscription l’utilise.

        Une requête n’agit qu’au plus une fois toutes les 5 minutes par adresse. Une inscription en attente avec cette adresse retrouve ses 24 heures, qu’un autre compte utilise l’adresse ou non, pour que son nom d’utilisateur reste réservé aussi longtemps dans les deux cas. Un lien n’est envoyé que pour cette inscription quand l’adresse n’a pas de compte (un nouveau lien, valable 24 heures, remplace le précédent), ou pour un compte actif non confirmé ayant cette adresse.

        **Limites :** `auth`, puis `auth_mail` (10 par heure et par client).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Acceptée (quelle que soit l’adresse).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited` : la limite `auth` ou `auth_mail` (quelle que soit l’adresse).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` avec `retryAfter: 1` : la base de données est restée verrouillée pendant la recherche du compte (le renouvellement d’une inscription en attente se fait au mieux et ne fait jamais échouer la requête). `timeout`. Aussi `server_busy` avec `retryAfter` de 2 à 5 : la base de données a trop d’écritures en attente, et la requête n’a pas été exécutée.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Envoyer un lien de réinitialisation du mot de passe
      description: |-
        Envoie un lien de réinitialisation du mot de passe, valable une heure, qui ouvre la page `/reset-password`. La réponse est 202 `accepted` quelle que soit l’adresse. Un lien n’est envoyé qu’à un compte actif, au plus une fois toutes les 5 minutes par adresse. Un compte uniquement Google définit ainsi son premier mot de passe.

        La récupération du mot de passe a les limites les plus strictes de l’API, toutes comptées pour l’ensemble du serveur : 3 requêtes par heure (`AUTH_FORGOT_PER_HOUR`) et 10 par 24 heures (`AUTH_FORGOT_PER_DAY`) par client (une adresse IPv4 ou un /64 IPv6), 3 fois plus par /48 IPv6, en plus de la limite `auth` (20 par 10 minutes) et d’un seul e-mail par adresse toutes les 5 minutes. Ni le 202 ni le 429 ne révèlent si un compte utilise l’adresse. La définition du nouveau mot de passe a sa propre limite (`auth_reset`).

        **Limites :** `auth`, `auth_forgot`, puis `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Acceptée (quelle que soit l’adresse).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited` : la limite `auth`, `auth_forgot` ou `auth_forgot_day` (quelle que soit l’adresse).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` avec `retryAfter: 1` : la base de données est restée verrouillée. `timeout`. Aussi `server_busy` avec `retryAfter` de 2 à 5 : la base de données a trop d’écritures en attente, et la requête n’a pas été exécutée.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Définir un nouveau mot de passe avec le jeton d’un lien de réinitialisation
      description: |-
        Définit un nouveau mot de passe avec le jeton d’un lien de réinitialisation (la page `/reset-password` fait de même). Le nouveau mot de passe suit les règles de l’inscription.

        La réinitialisation a ces effets, en une seule transaction (tous, ou aucun) : elle révoque toutes les sessions et annule un changement d’adresse e-mail en attente ; les autres liens de réinitialisation du compte cessent de fonctionner ; l’adresse est considérée comme confirmée (le lien l’a prouvé) ; le titulaire reçoit un e-mail. La double authentification n’est pas modifiée. Après une erreur de la file de hachage des mots de passe, un 503 ou un 500, rien n’a changé : l’ancien mot de passe et les sessions restent, et le lien reste valide.

        **Limites :** `auth`, puis `auth_reset` (10 par heure et par client, 30 par /48 IPv6, partagée avec la page : chaque tentative hache un mot de passe).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Le mot de passe est changé et toutes les sessions sont déconnectées.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token` : le lien est invalide, déjà utilisé ou expiré, ou a été envoyé à une adresse que le compte n’a plus. `weak_password` (avec `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited` : la limite `auth` ou `auth_reset`, ou la file de hachage des mots de passe.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` : la file de hachage des mots de passe, ou la base de données est restée verrouillée (`retryAfter: 1`, rien n’a changé). `timeout`. Aussi `server_busy` avec `retryAfter` de 2 à 5 : la base de données a trop d’écritures en attente, et la requête n’a pas été exécutée.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Démarrer une connexion Google
      description: |-
        Démarre une tentative de connexion Google pour le défi PKCE et le port de l’écouteur du jeu sur `127.0.0.1`. La réponse donne l’URL Google à ouvrir dans le navigateur du système et le `state` de la tentative ; la tentative est valable 10 minutes.

        `authUrl` contient `client_id`, `redirect_uri` (construit à partir de `redirectPort` et de l’étiquette d’origine du serveur), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 du vérificateur propre au serveur pour Google) avec `code_challenge_method=S256`, et `prompt=select_account`. Le jeu la vérifie avant de l’ouvrir (voir la description de la section).

        **Limite :** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: La tentative.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled` : la connexion Google n’est pas proposée sur ce serveur.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited` : la limite `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la base de données est restée verrouillée), `timeout`. Aussi `server_busy` avec `retryAfter` de 2 à 5 : la base de données a trop d’écritures en attente, et la requête n’a pas été exécutée.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Transmettre la réponse de Google au serveur
      description: |-
        Transmet au serveur le `code` et le `state` que Google a envoyés à l’écouteur du jeu, avec l’identifiant de la tentative et le vérificateur PKCE. Un identifiant de tentative ne sert à rien sans le vérificateur, et le code ne sert à rien sans le vérificateur PKCE propre au serveur et son secret client.

        Le serveur vérifie la tentative (inconnue, déjà utilisée ou expirée : 410), puis le vérificateur (un vérificateur erroné laisse la tentative utilisable), puis consomme la tentative, vérifie `state` et `iss`, échange le code auprès de Google et vérifie le jeton d’identité. La réponse (200) est l’une des suivantes :

        - `{ token, expiresAt, user }` : connecté au compte associé ;
        - `{ mfaRequired, mfaToken, expiresIn }` : continuez avec `POST /auth/login/mfa` ;
        - `{ needsUsername, ssoTicket, suggestedUsername }` : un nouveau compte ; continuez avec `POST /auth/sso/complete` dans les 10 minutes. `suggestedUsername` est tiré du nom Google ou de l’adresse, et vaut `""` quand rien ne convient ;
        - `{ needsPassword, linkTicket, username, expiresIn }` : le compte qui a cette adresse a un mot de passe ; continuez avec `POST /auth/sso/google/link`. Rien n’est encore associé.

        **Limite :** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Une session, une seconde étape, ou l’étape suivante d’une première connexion Google.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Connecté au compte associé
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: La double authentification est activée
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Un nouveau joueur
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Un compte doté d’un mot de passe utilise l’adresse
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier` : le vérificateur ne correspond pas au défi de la tentative (la tentative reste utilisable). `sso_email_unverified` : Google n’a pas confirmé l’adresse. `registration_closed`. `account_disabled`. Pour un compte associé seulement : `banned` (avec `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled` : la connexion Google n’est pas proposée sur ce serveur.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists` : un compte actif sans mot de passe utilise l’adresse (il n’est pas nommé).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired` : une tentative inconnue, déjà utilisée ou expirée.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited` : la limite `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la base de données est restée verrouillée), `timeout`. Aussi `server_busy` avec `retryAfter` de 2 à 5 : la base de données a trop d’écritures en attente, et la requête n’a pas été exécutée.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Associer Google à un compte existant avec son mot de passe
      description: |-
        Après que `finish` a répondu `needsPassword` : associe Google au compte existant avec le mot de passe de ce compte, saisi dans le jeu. La réponse (200) est une session (l’association est enregistrée et le joueur connecté) ou, quand la double authentification est activée, `{ mfaRequired, mfaToken, expiresIn }` : continuez avec `POST /auth/login/mfa`, et l’association n’est enregistrée que lorsqu’un code y est validé.

        Un mot de passe erroné laisse le ticket utilisable, pour 5 essais en tout. Un essai est décompté juste avant la vérification du mot de passe : un 429 `too_many_attempts` ou un 428 `pow_required` n’en décompte aucun, alors qu’un refus de la file de hachage des mots de passe (503 `server_busy`, 429 `rate_limited`) en a décompté un et compte comme un échec du compte. Le délai d’attente après échecs utilise le même compteur que `POST /auth/login`.

        **Limite :** `auth` (avec son décompte par /48 IPv6). **Preuve de travail :** comme pour `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Une session, ou la seconde étape de la connexion.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials` : un mot de passe erroné ; le ticket reste valable, pour 5 essais en tout.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (avec `until`), seulement après un mot de passe correct.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled` : la connexion Google n’est pas proposée sur ce serveur.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked` : le compte Google a été associé à un autre compte entre-temps.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired` : un ticket inconnu, déjà utilisé ou expiré, le 5e mot de passe erroné, un compte dont le statut ou l’adresse a changé depuis `finish`, ou dont le statut, l’adresse, le mot de passe ou la double authentification a changé pendant l’enregistrement de l’association. Recommencez depuis le jeu.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (le délai d’attente après échecs du compte), ou `rate_limited` (la limite `auth`, la file de hachage des mots de passe).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` : la file de hachage des mots de passe, ou la base de données est restée verrouillée (`retryAfter: 1`, rien n’a été associé). `timeout`. Aussi `server_busy` avec `retryAfter` de 2 à 5 : la base de données a trop d’écritures en attente, et la requête n’a pas été exécutée.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Créer le compte d’une première connexion Google
      description: |-
        Après que `finish` a répondu `needsUsername` : crée le compte avec le nom d’utilisateur choisi (les règles de l’inscription s’appliquent) et le connecte. Le compte n’a pas de mot de passe : `hasPassword` vaut `false`, et « Mot de passe oublié ? » (`POST /auth/password/forgot`) lui en donne un.

        **Limite :** `auth` (avec son décompte par /48 IPv6).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Le compte est créé et connecté.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request` ou `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled` : la connexion Google n’est pas proposée sur ce serveur.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (un compte porte ce nom d’utilisateur, ou une inscription en attente avec une autre adresse le réserve), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired` : un ticket inconnu, déjà utilisé ou expiré.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited` : la limite `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la base de données est restée verrouillée), `timeout`. Aussi `server_busy` avec `retryAfter` de 2 à 5 : la base de données a trop d’écritures en attente, et la requête n’a pas été exécutée.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Lister les appareils connectés
      description: |-
        Les sessions actives du compte (appareils connectés), de la plus récemment utilisée à la plus ancienne. `current` marque la session qui fait la requête. `lastSeenAt` est mis à jour au plus toutes les 5 minutes ; `expiresAt` est la fin absolue, et la limite d’inactivité peut mettre fin à la session plus tôt.

        **Limite :** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Les sessions actives.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited` : la limite `sessions` ou le budget du compte.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la base de données est restée verrouillée), `timeout`.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Déconnecter un appareil
      description: |-
        Déconnecte une session du compte ; la session courante peut aussi être déconnectée. Le WebSocket ouvert avec elle est fermé. Pas de corps (ou `{}`).

        **Limite :** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: La session est déconnectée.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` : un corps autre que `{}`, ou un `id` dont l’encodage URL n’est pas valide ; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found` : aucune session active avec cet identifiant sur ce compte.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited` : la limite `sessions` ou le budget du compte.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la base de données est restée verrouillée), `timeout`. Aussi `server_busy` avec `retryAfter` de 2 à 5 : la base de données a trop d’écritures en attente, et la requête n’a pas été exécutée.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Obtenir le compte, ses classements et ses sanctions en cours
      description: |-
        Le compte tel que son joueur le voit : la vue du compte (aussi le `user` de toute réponse de connexion), une fiche de classement par catégorie dans laquelle le joueur a disputé des parties classées, les sanctions en cours et le bannissement. Le niveau d’intégrité de l’anti-triche n’est jamais montré.

        **Limite :** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Le compte.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`, ou `invalid_token` (y compris quand le compte a été supprimé).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited` : la limite `account` ou le budget du compte.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la base de données est restée verrouillée), `timeout`.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Accepter ou refuser les défis directs
      description: |-
        Indique si les autres joueurs peuvent défier ce joueur par son nom. Avec `none`, les défis directs sont refusés : le joueur qui lance le défi apprend que ce joueur n’est pas disponible. Pas de réauthentification.

        **Limite :** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: Les préférences désormais en vigueur.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited` : la limite `account` ou le budget du compte.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la base de données est restée verrouillée), `timeout`. Aussi `server_busy` avec `retryAfter` de 2 à 5 : la base de données a trop d’écritures en attente, et la requête n’a pas été exécutée.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Changer le mot de passe
      description: |-
        Change le mot de passe. Le mot de passe actuel est nécessaire, mais pas de second facteur, même avec la double authentification activée. Le nouveau mot de passe suit les règles de l’inscription (vérifiées après le mot de passe actuel).

        Le changement a ces effets, en une seule transaction (tous, ou aucun) : il révoque toutes les autres sessions (celle-ci reste connectée), annule un changement d’adresse e-mail en attente, rend inopérants les liens de réinitialisation du mot de passe du compte et envoie un e-mail au titulaire.

        **Réauthentification :** le mot de passe seul. **Limites :** `reauth`, puis `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Le mot de passe est changé.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (un compte uniquement Google), `weak_password` (avec `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` : un mot de passe actuel erroné, ou une réinitialisation ou un changement de mot de passe survenu pendant la vérification de la requête.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (réauthentifications échouées du compte), ou `rate_limited` (la limite `reauth` ou `reauth_user`, le budget du compte, la file de hachage des mots de passe).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` : la file de hachage des mots de passe, ou la base de données est restée verrouillée (`retryAfter: 1`, rien n’a changé). `timeout`. Aussi `server_busy` avec `retryAfter` de 2 à 5 : la base de données a trop d’écritures en attente, et la requête n’a pas été exécutée.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Commencer l’activation de la double authentification
      description: |-
        Enregistre un nouveau secret d’authentification en attente, qui remplace un éventuel secret en attente antérieur, et le renvoie pour l’application d’authentification (en texte et sous forme d’URI `otpauth://` à afficher en QR code). La double authentification n’est pas encore activée : `POST /account/mfa/totp/enable` l’active avec un code issu de ce secret.

        **Réauthentification :** le mot de passe seul. **Limites :** `reauth`, puis `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Le secret en attente.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
