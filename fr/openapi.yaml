  - name: account-deletion
    x-displayName: Suppression du compte
    description: Supprimer le compte définitivement.
  - name: game-history
    x-displayName: Historique des parties
    description: Les parties du joueur connecté, filtrées et paginées.
  - name: games
    x-displayName: Parties et PGN
    description: |-
      Les parties enregistrées, avec leurs coups et leurs pendules, et leurs fichiers PGN.

      **Codes des parties.** `status` : 1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (seules les parties terminées sont enregistrées). `result` : `1-0`, `0-1`, `1/2-1/2`, ou `*` (annulée). `reason`, avec son nom (`termination`) et les mots qui terminent le texte des coups du fichier PGN (en anglais dans le fichier, suivis ci-dessous de leur traduction) ; les codes 7, 14 et 21 sont des nulles (le joueur dont le temps s’est écoulé, qui a abandonné ou qui a quitté la partie faisait face à un adversaire incapable de mater : FIDE 6.9 et 5.1.2 ; `DESIGN.md` 6.3 donne la règle), et le serveur ne termine jamais une partie avec les codes 4 et 13 (ils appartiennent à la liste commune des motifs) :

      | Code | `termination` | Mots dans le PGN |
      |---|---|---|
      | 1 | `Checkmate` | Checkmate (échec et mat) |
      | 2 | `Resignation` | Resignation (abandon) |
      | 3 | `Timeout` | Loss on time (perte au temps) |
      | 4 | `IllegalMoves` | Second illegal move (forfeit) (second coup illégal, partie perdue) |
      | 5 | `Stalemate` | Stalemate (pat) |
      | 6 | `InsufficientMaterial` | Dead position (insufficient material) (position morte, matériel insuffisant) |
      | 7 | `TimeoutVsInsufficient` | Flag fall, but the opponent cannot checkmate (drapeau tombé, mais l’adversaire ne peut pas mater) |
      | 8 | `FivefoldRepetition` | Fivefold repetition (quintuple répétition) |
      | 9 | `SeventyFiveMoves` | 75-move rule (règle des 75 coups) |
      | 10 | `ThreefoldClaim` | Threefold repetition (claimed) (triple répétition réclamée) |
      | 11 | `FiftyMoveClaim` | 50-move rule (claimed) (règle des 50 coups réclamée) |
      | 12 | `Agreement` | Draw by agreement (nulle par accord mutuel) |
      | 13 | `IllegalMovesVsInsufficient` | Second illegal move, but the opponent cannot checkmate (second coup illégal, mais l’adversaire ne peut pas mater) |
      | 14 | `ResignationVsInsufficient` | Resignation, but the opponent cannot checkmate (abandon, mais l’adversaire ne peut pas mater) |
      | 20 | `Abandonment` | Abandoned (disconnected for too long) (partie quittée, déconnexion trop longue) |
      | 21 | `AbandonmentVsInsufficient` | Abandoned, but the opponent cannot checkmate (partie quittée, mais l’adversaire ne peut pas mater) |
      | 22 | `Aborted` | Game aborted (partie annulée) |
      | 23 | `NoShow` | Aborted: first move not played in time (annulée : premier coup non joué à temps) |
      | 24 | `Forfeit` | Forfeit (fair play violation) (forfait pour manquement au fair-play) |
      | 25 | `ServerAborted` | Aborted by the server (annulée par le serveur) |
      | 26 | `BothDisconnected` | Aborted: both players disconnected (annulée : les deux joueurs se sont déconnectés) |

      Le code 14 est nouveau dans la version mineure 1 du protocole : un client écrit avant elle devrait afficher un code inconnu comme une simple fin de partie, avec son `result`.
  - name: gifs
    x-displayName: GIF animés
    description: |-
      Une partie sous forme de GIF animé, à conserver ou à partager : l’échiquier vu de dessus, une image par position, de la position de départ à la position finale, les noms et classements des joueurs au-dessus de l’échiquier, le dernier coup en dessous, et sur la dernière image le résultat et la façon dont la partie s’est terminée.

      **Coût, cache et quotas.** Un GIF est fabriqué sur un fil d’exécution de rendu dédié, jamais sur ceux qui font tourner les parties, et avec la priorité CPU la plus basse : `GIF_THREADS` fils (`WORKERS` par défaut), démarrés avec le premier GIF et arrêtés après une minute sans GIF. Jusqu’à `GIF_QUEUE_MAX` (4 × `WORKERS`) GIF attendent un fil, au plus `GIF_QUEUE_TIMEOUT_MS` (10 s) chacun ; un rendu peut durer `GIF_RENDER_TIMEOUT_MS` (30 s). Le serveur garde les GIF qu’il a fabriqués dans un cache de `GIF_CACHE_MB` Mo (32 × `WORKERS`), les moins récemment utilisés partant en premier ; un GIF pris dans le cache, ou en cours de fabrication pour une autre requête, ne coûte aucun rendu. La clé du cache tient compte de tout ce qui change l’image, noms compris.

      Chaque requête compte dans `gif` (30 par minute et par joueur pour les deux points de terminaison). Un GIF qui doit être fabriqué compte aussi dans les limites de rendu : par joueur, `GIF_USER_RENDERS_PER_MIN` (4) par minute et `GIF_USER_RENDERS_PER_HOUR` (30) par heure ; par client, tous ses comptes ensemble, `GIF_IP_RENDERS_PER_MIN` (12) par minute et `GIF_IP_RENDERS_PER_HOUR` (120) par heure, et 3 fois plus par /48 IPv6. Un client doit conserver le fichier qu’il a téléchargé plutôt que de le redemander, et attendre `retryAfter` après un 429 ou un 503.

      Tailles : `small` (cases de 32 px : 284 × 350 pixels), `medium` (48 px : 424 × 515), `large` (72 px : 628 × 762) ; sans coordonnées, 268 × 342, 400 × 503 et 600 × 748. La position de départ reste affichée au moins 1 s (ou le délai, s’il est plus long), la position finale 3 s, et le GIF tourne en boucle ; après la première image, seule la partie de l’image qui change est stockée. Une partie de 40 coups pèse environ 135, 205 et 325 Kio (petit, moyen, grand format), une partie de 150 coups 0,5, 0,8 et 1,2 Mio.
  - name: players
    x-displayName: Joueurs
    description: 'Profils publics et parties récentes. Uniquement des données publiques : jamais d’adresse e-mail, de session, de sanction ni de niveau d’intégrité. Un compte supprimé n’a pas de profil.'
  - name: leaderboard
    x-displayName: Classement général
    description: Les meilleurs joueurs de chaque catégorie officielle.
  - name: reports
    x-displayName: Signalements
    description: Signaler aux modérateurs l’adversaire d’une partie récente.
  - name: pages
    x-displayName: Pages HTML
    description: |-
      Pages destinées à un navigateur, ouvertes depuis les liens des e-mails. Leurs liens pointent vers `https://<SERVER_PUBLIC_HOST>` (avec `:<PUBLIC_API_PORT>` quand il ne vaut pas 443), hors de `/api/v1`.

      - Les pages n’exécutent aucun JavaScript et ne chargent aucune ressource externe. Elles sont servies avec `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'`.
      - Un `GET` ne fait qu’afficher un bouton ou un formulaire, pour qu’un analyseur de courrier qui ouvre le lien ne le consomme pas. La modification a lieu sur `POST` : un formulaire envoyé en `application/x-www-form-urlencoded` (un corps JSON est aussi accepté), avec le jeton du lien dans un champ caché. Un champ fourni deux fois est refusé.
      - Les erreurs (limites de débit, champs invalides) sont aussi des pages HTML, intitulées "Request refused" (requête refusée) ou, à partir de 500, "Server error" (erreur du serveur). Seuls les échecs constatés avant que la page soit identifiée (une cible de requête trop longue ou mal formée, la couche par adresse) reçoivent une réponse en JSON.
