  - name: account
    x-displayName: Compte
    description: La vue du compte, ses préférences et son mot de passe.
  - name: two-step-verification
    x-displayName: Double authentification
    description: Applications d’authentification (TOTP, RFC 6238), avec SHA-1, 6 chiffres, des pas de 30 secondes et une tolérance d’un pas dans chaque sens, plus des codes de récupération à usage unique.
  - name: email-change
    x-displayName: Changement d’adresse e-mail
    description: Changer l’adresse du compte, avec confirmation par un lien envoyé à la nouvelle adresse.
  - name: data-export
