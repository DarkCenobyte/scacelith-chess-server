openapi: 3.1.1
info:
  title: API HTTPS du serveur Scacelith
  version: "0.9.1"
  summary: L’API HTTPS de tout serveur Scacelith, le serveur officiel comme les serveurs communautaires.
  description: |-
    Tout serveur Scacelith, qu’il s’agisse du serveur officiel `caissa.scacelith.com` ou d’un serveur communautaire, répond à cette API HTTPS. Le jeu s’en sert pour tout ce qui se passe en dehors des parties elles-mêmes : l’inscription et la connexion (double authentification et connexion Google comprises), la page du compte, l’historique des parties, les téléchargements PGN et les GIF animés des parties, les appareils connectés, le téléchargement des données, la suppression du compte et les signalements.

    Le jeu en direct (recherche d’adversaire, défis, coups, pendules) passe par le WebSocket du même serveur (`wss://<host>/ws`), ouvert avec un jeton de session de cette API ; il est décrit dans `PROTOCOL.md`, pas ici.

    Les valeurs par défaut indiquées ci-dessous sont celles d’un serveur dont la configuration n’a pas été modifiée ; un serveur communautaire peut les changer (`CONFIG.md` décrit chaque réglage).

    ## URL de base, port et transport

    - Serveur officiel : `https://caissa.scacelith.com/api/v1`, port TCP 443.
    - Serveur communautaire : `https://<SERVER_PUBLIC_HOST>[:<port>]/api/v1`. `API_PORT` vaut 443 par défaut ; derrière un NAT ou un proxy, le port qu’utilisent les joueurs est `PUBLIC_API_PORT`.
    - Le WebSocket du jeu est sur le même port par défaut (`WS_PORT` le déplace ; `GET /info` indique au client où il se trouve).
    - HTTP/1.1 sur TLS. Avec `TLS_MODE=proxy`, un proxy inverse placé devant le serveur se charge de TLS. `TLS_MODE=off` (HTTP en clair) est réservé au développement local.
    - Les pages HTML ouvertes depuis les liens des e-mails (`/verify-email`, `/reset-password`, `/confirm-email-change`) se trouvent à la racine du serveur, hors de `/api/v1`. Les points de terminaison de santé répondent à la fois à la racine et sous `/api/v1`. La connexion Google n’a aucune page sur le serveur : Google renvoie le navigateur vers le jeu lui-même, sur `127.0.0.1`.
    - Une barre oblique finale est ignorée (`/api/v1/info/` équivaut à `/api/v1/info`), et les paramètres de chemin sont décodés (un paramètre dont l’encodage URL n’est pas valide reçoit 400 `invalid_request`).

    ## Requêtes

    - **Corps JSON.** Les requêtes `POST`, `PUT` et `DELETE` portent un objet JSON avec `Content-Type: application/json`. Un `charset` autre que UTF-8 est refusé, de même que tout autre type de contenu (415 `unsupported_media_type`). Un corps vide vaut `{}`, ce qu’attendent les points de terminaison sans paramètres (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`).
    - **Taille et délai.** Un corps est limité à `HTTP_BODY_LIMIT` octets (16 384 par défaut ; `POST /gif` a sa propre limite de 135 168 octets) : 413 `payload_too_large`. Il doit arriver en moins de 10 secondes : 408 `request_timeout`. Après l’une ou l’autre de ces erreurs, le serveur ferme la connexion.
    - **Schémas stricts.** Un champ que le point de terminaison ne connaît pas est refusé, un champ qui n’est pas marqué facultatif est obligatoire, et les types et les longueurs sont vérifiés. Chacun de ces échecs donne 400 `invalid_request`, avec `field` qui nomme le champ (en notation pointée pour un champ imbriqué, comme `pow.nonce`). Les chaînes ne peuvent pas contenir de caractères de contrôle. Les longueurs se comptent en unités de code UTF-16 : un caractère hors du plan multilingue de base (un emoji) compte donc double. Un corps qui n’est pas du JSON donne 400 `invalid_json`. `POST /gif` et `POST /reports` vérifient eux-mêmes leur corps (voir chacun de ces points de terminaison).
    - **Chaînes de requête.** Seule la première occurrence d’un paramètre compte, les paramètres inconnus sont ignorés, et un `+` se décode en espace : les points de terminaison qui prennent une catégorie de cadence acceptent aussi bien `3%2B2` que `3+2`.
    - **Méthodes.** `HEAD` est un `GET` sans le corps. `OPTIONS` sur un chemin existant répond 204 avec un en-tête `Allow` (et les en-têtes d’une requête de pré-vérification CORS, voir plus bas). Toute autre méthode que le chemin ne prend pas reçoit 405 `method_not_allowed` avec `Allow`.
    - **Cible de la requête.** Elle ne peut pas dépasser 4096 caractères (414 `uri_too_long`). Une requête impossible à analyser, ou dont la ligne de requête et les en-têtes sont trop volumineux ou arrivent trop lentement, reçoit une réponse 400, 431 ou 408 vide, et la connexion est fermée.
    - **CORS : une liste d’autorisation, désactivée par défaut.** L’API sert le jeu, qui n’envoie pas d’en-tête `Origin`. Avec `CORS_ORIGINS` vide (la valeur par défaut), aucun en-tête `Access-Control-*` n’est jamais envoyé, si bien qu’aucune page web ne peut lire une réponse. `CORS_ORIGINS` liste les origines web dont les pages peuvent appeler l’API depuis un navigateur, chacune exactement telle que les navigateurs l’envoient dans `Origin` : `https://host` ou `https://host:port`, en minuscules, sans chemin, sans barre oblique finale et sans le port par défaut ; `http://` seulement pour `localhost`, `127.0.0.1` et `[::1]` (développement local) ; pas de caractère générique. Le serveur officiel définit `CORS_ORIGINS=https://scacelith.com,https://www.scacelith.com` pour son site web. Alors :
      - Toute réponse pour un chemin sous `/api/v1`, sauf les points de terminaison de santé, succès comme erreurs (le 429 de la couche par adresse compris), porte `Vary: Origin`. Quand l’en-tête `Origin` de la requête est, octet pour octet, l’une des origines listées, elle porte aussi `Access-Control-Allow-Origin: <that origin>` et, sauf dans la réponse à une requête de pré-vérification, `Access-Control-Expose-Headers: Retry-After, Content-Disposition`, de sorte que la page lit les codes d’erreur, `Retry-After` et les noms de fichier des téléchargements PGN et GIF.
      - Une requête de pré-vérification (`OPTIONS` avec `Access-Control-Request-Method`) venant d’une origine listée, sur un chemin existant, reçoit 204, sans corps, avec `Allow`, `Access-Control-Allow-Origin`, `Access-Control-Allow-Methods` (les méthodes de `Allow`), `Access-Control-Allow-Headers: Authorization, Content-Type`, `Access-Control-Max-Age: 600` et `Vary: Origin`. Elle n’a besoin d’aucun jeton et ne compte ni dans le budget d’un compte ni dans aucune limite de point de terminaison ; comme toute requête, elle prend un jeton de la couche par adresse. Un navigateur réutilise une pré-vérification pendant 10 minutes, mais seulement pour cette URL exacte, chaîne de requête comprise. Une requête sans `Authorization` et sans corps JSON, comme `GET /info` ou `GET /leaderboard`, n’a pas besoin de pré-vérification.
      - Toute autre réponse à une requête de pré-vérification est une pré-vérification échouée, même avec les en-têtes CORS : un 404 pour un chemin qui n’existe pas, ou le 429 de la couche par adresse. Le navigateur n’envoie alors pas la requête, et la page voit une erreur réseau, sans la réponse ni son `Retry-After`.
      - `Access-Control-Allow-Credentials` n’est jamais envoyé, ni `Access-Control-Allow-Origin: *` : une page envoie son jeton de session dans `Authorization: Bearer`, comme le jeu, et l’API ne dépose aucun cookie. Les pages HTML, les points de terminaison de santé et les réponses vides aux requêtes impossibles à analyser ne portent aucun en-tête CORS. Le WebSocket n’utilise pas CORS : `WS_ALLOWED_ORIGINS` liste les pages qui peuvent l’ouvrir.
      - Une page d’une origine non listée ne lit rien, et ses écritures intersites ne sont jamais envoyées : les corps JSON et `Authorization` exigent une pré-vérification, dont la réponse ne porte pas d’`Access-Control-Allow-Origin` pour cette origine. `Cross-Origin-Resource-Policy: same-origin` reste sur toute réponse : il ne s’applique qu’aux requêtes `no-cors` (un autre site qui intègre une réponse), jamais aux requêtes `cors` d’une page listée.

    ## Réponses et erreurs

    - Les réponses sont en JSON encodé en UTF-8, sauf le téléchargement PGN (`application/x-chess-pgn`), les GIF animés (`image/gif`) et les pages HTML. Les instants sont exprimés en millisecondes depuis le 1970-01-01 UTC. Les identifiants sont des entiers. Les identifiants de partie ont jusqu’à 16 chiffres mais restent inférieurs à 2^53 : un nombre JSON (un double) les représente donc exactement.
    - Toute réponse de l’API porte `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`, `X-Frame-Options: DENY`, `Cross-Origin-Resource-Policy: same-origin` et `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'` (les pages HTML ont leur propre politique). Avec `TLS_MODE=native`, elle porte aussi `Strict-Transport-Security: max-age=31536000`.
    - Une réponse doit être lue dans les 60 secondes qui suivent le moment où le serveur l’a prête, ce qui ne compte que pour les grosses réponses (un GIF, l’export des données, un long PGN). Le temps que met le serveur à préparer une réponse ne compte ni dans ce délai, ni dans les 30 secondes sans aucun octet entrant ou sortant au bout desquelles une connexion est fermée.

    Les erreurs ont toutes la même forme (le schéma `Error`) :

    ```json
    { "error": "snake_case_code", "message": "An English sentence.", "retryAfter": 30 }
    ```

    `message` est destiné aux journaux et sert de solution de repli ; un client choisit ce qu’il affiche d’après `error`. `retryAfter` (en secondes) n’est présent que sur les refus qui prennent fin avec le temps, et la réponse porte alors aussi un en-tête `Retry-After` de même valeur ; la seule exception est le 503 `busy` des lectures de l’historique, des parties, des joueurs et du classement général, qui n’a que le champ. Certaines erreurs ajoutent des champs : `field` (saisie invalide), `reason` (`weak_password`, `pow_required`), `pow` (`pow_required`), `until` (`banned`), `line` et `column` (`invalid_pgn`).

    Erreurs que tout point de terminaison peut renvoyer :

    | Statut | `error` | Quand |
    |---|---|---|
    | 400 | `invalid_request` | Le corps enfreint le schéma du point de terminaison (`field` indique où), la cible de la requête ou `Content-Length` est mal formé, un paramètre de chemin n’est pas un encodage URL valide, ou le corps a été tronqué. |
    | 400 | `invalid_json` | Le corps n’est pas du JSON. |
    | 401 | `unauthorized` | Pas d’en-tête `Authorization` sur un point de terminaison qui exige une session. |
    | 401 | `invalid_token` | Le jeton est mal formé, expiré, révoqué ou appartient à un compte supprimé ; y compris sur les points de terminaison où la session est facultative. |
    | 404 | `not_found` | Point de terminaison inexistant. Certains points de terminaison l’emploient aussi : partie, joueur ou session inexistants. |
    | 405 | `method_not_allowed` | Le chemin existe pour d’autres méthodes (voir `Allow`). |
    | 408 | `request_timeout` | Le corps n’est pas arrivé dans les 10 secondes. |
    | 413 | `payload_too_large` | Le corps dépasse `HTTP_BODY_LIMIT` (135 168 octets pour `POST /gif`). |
    | 414 | `uri_too_long` | La cible de la requête dépasse 4096 caractères. |
    | 415 | `unsupported_media_type` | Le corps n’est pas en `application/json`, ou son jeu de caractères n’est pas UTF-8. |
    | 429 | `rate_limited` | Une limite de débit (voir plus bas) : `retryAfter` plus un en-tête `Retry-After`. |
    | 500 | `internal_error` | Une défaillance inattendue. Le serveur la journalise. |
    | 503 | `timeout` | Le serveur n’a pas répondu dans les 30 secondes (60 secondes pour l’export, 45 secondes pour les GIF avec les réglages par défaut). |
    | 503 | `server_busy` | Une recherche de session ou une modification du compte a trouvé la base de données verrouillée (`retryAfter` 1), ou la file de hachage des mots de passe est pleine (voir plus bas). Aussi, pour un `POST`, `PUT`, `PATCH` ou `DELETE`, la base de données a trop d’écritures en attente : la requête n’a pas été exécutée et ses limites de débit n’ont rien pris (`retryAfter` de 2 à 5). |

    Les points de terminaison de lecture (historique des parties, parties, joueurs, classement général) et l’export répondent 503 `busy` avec `retryAfter: 1` quand la base de données est restée verrouillée.

    Les points de terminaison qui vérifient ou hachent un mot de passe peuvent aussi répondre par l’une de ces erreurs, toutes deux avec un `retryAfter` aléatoire de 5 à 15 secondes :

    - 503 `server_busy` : la file de hachage des mots de passe du serveur (`PASSWORD_HASH_QUEUE_MAX`) est pleine, ou l’attente a expiré.
    - 429 `rate_limited` : la file étant au moins à moitié pleine, ce client (une adresse IPv4 ou un /48 IPv6) a déjà `PASSWORD_HASH_WAITERS_PER_SOURCE` hachages en attente. Ce 429 restitue les jetons de limite de débit que la requête avait pris.

    Rien n’a été modifié et aucune tentative échouée n’a été comptée (sauf sur `POST /auth/sso/google/link`, dont l’essai du ticket et l’échec sur le compte ont été comptés avant le hachage), et un lien de réinitialisation reste valide.

    Les pages HTML renvoient leurs erreurs sous forme de pages HTML, avec les mêmes codes de statut.

    ## Authentification

    Les points de terminaison qui exigent une session prennent un jeton Bearer dans l’en-tête `Authorization` (le schéma `bearerAuth`) :

    ```
    Authorization: Bearer sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
    ```

    - **Obtenir un jeton.** Un jeton (`sct_` suivi de 43 caractères base64url) est délivré par `POST /auth/login`, puis `POST /auth/login/mfa` quand la double authentification est activée, par `POST /auth/sso/google/finish` et `POST /auth/sso/google/link` (connexion Google), et par `POST /auth/sso/complete`. Chacun d’eux répond `{ token, expiresAt, user }`. Le serveur ne conserve qu’une empreinte SHA-256 du jeton.
    - **Session obligatoire.** Un en-tête absent donne 401 `unauthorized` avec `WWW-Authenticate: Bearer realm="scacelith"`. Un jeton invalide donne 401 `invalid_token` avec `WWW-Authenticate: Bearer realm="scacelith", error="invalid_token"`. Un client doit oublier un jeton qui reçoit `invalid_token` et se reconnecter.
    - **Session facultative.** Sur `GET /games/{id}`, `GET /games/{id}/pgn`, `GET /players/{username}` et `GET /players/{username}/games`, la session est facultative. Sans l’en-tête, ces points de terminaison renvoient la vue publique ; si un en-tête est envoyé, son jeton doit être valide.
    - **Durée de vie.** Une session prend fin au premier de ces deux termes : `SESSION_MAX_DAYS` (90) jours après la connexion (c’est `expiresAt`), ou `SESSION_IDLE_DAYS` (30) jours sans utilisation. Chaque utilisation repousse la limite d’inactivité ; le serveur enregistre la nouvelle valeur au plus toutes les 5 minutes. Un compte conserve au plus `MAX_SESSIONS_PER_USER` (10) sessions : au-delà, une nouvelle connexion révoque la plus ancienne.
    - **Révocation.** La déconnexion (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`) révoque des sessions ; c’est aussi le cas d’un changement de mot de passe (les autres sessions), d’une réinitialisation du mot de passe et de la suppression du compte (toutes les sessions), ainsi que d’un administrateur. Une révocation faite par l’API prend effet immédiatement, et le WebSocket ouvert avec une session révoquée est fermé. Un changement ou une réinitialisation du mot de passe et la suppression du compte révoquent dans la même transaction que la modification elle-même : si l’une d’elles échoue, aucune session n’a été révoquée et rien d’autre n’a changé non plus. Le serveur garde en cache les recherches de session pendant 30 secondes : une révocation par la commande d’administration, qui est un processus distinct, prend donc effet dans les 30 secondes.
    - **Portée.** Un jeton appartient à un seul serveur et ouvre aussi son WebSocket. Ne l’envoyez jamais à un autre serveur.

    ## Limites de débit et autres freins

    Les limites s’appliquent à l’une de deux portées. **Client :** une adresse IPv4, ou un /64 IPv6 (en mode proxy, l’adresse provient de `X-Forwarded-For` envoyé par une adresse de `TRUSTED_PROXIES`) ; certaines limites comptent aussi chaque /48 IPv6 dans son ensemble, en plus de chacun de ses réseaux /64. **Joueur :** le compte connecté, quelle que soit son adresse ; une limite comptée par joueur sur un point de terminaison où la session est facultative se compte par client pour une requête sans jeton.

    Chaque limite est un seau à jetons qui contient `limit` requêtes et se remplit en continu au rythme de `limit / window` ; `retryAfter` est le temps qui reste jusqu’au prochain jeton. Les limites marquées *partagées* sont aussi comptées sur une fenêtre glissante de même durée, de sorte qu’aucune fenêtre ne contienne beaucoup plus de `limit` requêtes. Chaque limite est comptée pour l’ensemble du serveur. Quand l’une des limites d’un point de terminaison refuse une requête, les jetons que ses autres limites avaient pris pour cette requête sont restitués. Un refus donne 429 `rate_limited` avec `retryAfter` et `Retry-After`.

    - **Couche par adresse.** Toute requête (quels que soient le chemin et la méthode, points de terminaison de santé et passages en WebSocket compris) prend d’abord un jeton du budget de son client : `HTTP_RATE_PER_IP` (600) par minute avec une rafale d’une demi-minute, et `HTTP_RATE_PER_PREFIX` (4 × `HTTP_RATE_PER_IP`) pour un /48 IPv6. Un client peut aussi avoir au plus `IP_MAX_INFLIGHT` (32 × `WORKERS`) requêtes en cours (`retryAfter` 1 au-delà). Un client qui insiste malgré ses refus est bloqué : `ABUSE_BLOCK_REFUSALS_PER_MIN` (600) refus en une minute le bloquent pendant 1 minute, puis 4, 16 et 60 minutes à chaque nouveau blocage dans les 6 heures. Un refus des limites `auth`, `auth_*` et `reauth` compte pour 5 ; les refus des limites comptées par joueur ne comptent jamais. Les adresses de `ABUSE_EXEMPT` échappent à cette couche, mais pas au budget du compte ni aux limites des points de terminaison.
    - **Budget du compte.** Toute requête qui porte un jeton de session valide est aussi décomptée de son compte : `USER_RATE_PER_MIN` (120) par minute pour l’ensemble des points de terminaison, quelle que soit l’adresse, avec une rafale d’une demi-minute.
    - **Limites des points de terminaison :**

    | Limite | Par défaut | Comptée par | Points de terminaison |
    |---|---|---|---|
    | `auth` | `AUTH_RATE_PER_IP` (20) / 10 min, partagée | client, et `AUTH_RATE_PER_PREFIX` (5 × `AUTH_RATE_PER_IP`) par /48 IPv6 | `POST /auth/register`, `/auth/login`, `/auth/login/mfa`, `/auth/verify-email/resend`, `/auth/password/forgot`, `/auth/password/reset`, `/auth/sso/google/link`, `/auth/sso/complete` ; `POST /verify-email`, `/reset-password`, `/confirm-email-change` |
    | `auth_register` | `AUTH_REGISTER_PER_HOUR` (10) / heure, partagée | client, 3 fois plus par /48 IPv6 | `POST /auth/register` |
    | `auth_mail` | `AUTH_MAIL_PER_HOUR` (10) / heure, partagée | client, 3 fois plus par /48 IPv6 | `POST /auth/verify-email/resend` |
    | `auth_forgot` | `AUTH_FORGOT_PER_HOUR` (3) / heure, partagée | client, 3 fois plus par /48 IPv6 | `POST /auth/password/forgot` |
    | `auth_forgot_day` | `AUTH_FORGOT_PER_DAY` (10) / 24 heures, partagée | client, 3 fois plus par /48 IPv6 | `POST /auth/password/forgot` |
    | `auth_reset` | `AUTH_RESET_PER_HOUR` (10) / heure, partagée | client, 3 fois plus par /48 IPv6 | `POST /auth/password/reset`, `POST /reset-password` |
    | `reauth` | les valeurs de `auth`, dans un seau distinct, partagée | client et /48 IPv6 | les modifications du compte qui demandent le mot de passe (voir Réauthentification), et `POST /account/export` |
    | `reauth_user` | `AUTH_REAUTH_PER_USER` (10) / 10 min, partagée | joueur | les mêmes points de terminaison que `reauth` |
    | `account` | 60 / min | joueur | `GET /account/me`, `PUT /account/preferences` |
    | `account_games` | 60 / min | joueur | `GET /account/games` |
    | `account_export` | 5 / heure, partagée | joueur | `POST /account/export` (vérifiée avant `reauth` ; chaque tentative compte) |
    | `sessions` | 60 / min | joueur | `POST /auth/logout`, `/auth/logout-all`, `GET /auth/sessions`, `DELETE /auth/sessions/{id}` |
    | `public_read` | 60 / min | joueur (client sans jeton) | `GET /players/{username}`, `/players/{username}/games`, `/games/{id}`, `/games/{id}/pgn` (un seul seau pour les quatre) |
    | `gif` | 30 / min | joueur | `GET /games/{id}/gif`, `POST /gif` (un seul seau pour les deux) |
    | `gif_user_min`, `gif_user_hour` | `GIF_USER_RENDERS_PER_MIN` (4) / min et `GIF_USER_RENDERS_PER_HOUR` (30) / heure, partagées | joueur | les deux mêmes, seulement quand le GIF doit être fabriqué (pas pris dans le cache) |
    | `gif_ip_min`, `gif_ip_hour` | `GIF_IP_RENDERS_PER_MIN` (12) / min et `GIF_IP_RENDERS_PER_HOUR` (120) / heure, partagées | client (tous ses comptes ensemble), 3 fois plus par /48 IPv6 | les mêmes, dans les mêmes conditions |
    | `reports` | 30 / heure | joueur | `POST /reports` |
    | `sso_start` | 30 / 10 min, partagée | client, et 90 par /48 IPv6 | `POST /auth/sso/google/start` |
    | `sso_finish` | 30 / min | client | `POST /auth/sso/google/finish` |
    | `page` | 60 / min | client | `GET /verify-email`, `/reset-password`, `/confirm-email-change` |

    `GET /info` et `GET /leaderboard` n’ont pas de limite propre : seulement la couche par adresse. Un point de terminaison qui a plusieurs limites les vérifie dans l’ordre donné dans sa description.

    Le serveur traite une requête dans cet ordre : la couche par adresse, puis les points de terminaison de santé ; la recherche du point de terminaison ; pour un `POST`, `PUT`, `PATCH` ou `DELETE`, la vérification des écritures en attente dans la base de données (503 `server_busy`) ; l’authentification ; le budget du compte, quand la requête porte une session ; les limites du point de terminaison ; le corps ; le point de terminaison lui-même (les points de terminaison GIF ne prennent leurs limites de rendu que lorsqu’ils ont un GIF à fabriquer). Ainsi, une requête refusée à cause de son jeton ne dépense aucun jeton du point de terminaison, alors qu’une requête dont le corps est invalide les dépense.

    Autres freins, appliqués par les points de terminaison eux-mêmes :

    - **Connexions échouées sur un même identifiant** (nom d’utilisateur ou e-mail) : à partir de `AUTH_FAILURES_PER_ACCOUNT` (5) échecs, chaque tentative doit attendre deux fois plus longtemps que la précédente (2 s, 4 s, et ainsi de suite, jusqu’à 15 minutes) : 429 `too_many_attempts` avec `retryAfter`. Le compteur s’efface après une heure sans échec.
    - **Seconds facteurs échoués à la connexion :** la même règle, à partir du 5e code erroné du compte. Une étape de connexion accepte au plus 5 codes erronés.
    - **Codes de second facteur d’un même compte :** au plus `AUTH_MFA_PER_ACCOUNT` (10) codes (codes de l’application ou codes de récupération, justes ou erronés) par période de 15 minutes, depuis n’importe quelle adresse, à la connexion et lors des réauthentifications ; au-delà, 429 `too_many_attempts` avant que le code soit vérifié, si bien qu’un code de récupération n’est pas consommé.
    - **Réauthentifications échouées d’un compte** (mot de passe ou code erroné) : la même règle (429 `too_many_attempts`), commune à tous les points de terminaison qui réauthentifient.
    - **E-mails :** un e-mail de confirmation ou de réinitialisation par adresse toutes les 5 minutes (la réponse reste la même) ; un avis "someone tried to use your address" (quelqu’un a essayé d’utiliser votre adresse) par adresse et par heure.
    - **Signalements :** `REPORTS_PER_DAY` (5) par joueur sur 24 heures : 429 `report_limit`.

    ## Preuve de travail

    `POST /auth/register` exige toujours une preuve de travail quand `POW_REGISTER_BITS` est supérieur à 0 (18 par défaut ; `GET /info` le donne dans `pow.register`). `POST /auth/login` et `POST /auth/sso/google/link` (un même type de défi pour les deux) n’en exigent une que pendant les 5 minutes qui suivent une vague de connexions échouées constatée par le serveur (`POW_LOGIN_TRIGGER_PER_MIN`, puis `POW_LOGIN_BITS`) ; le client l’apprend par la réponse.

    1. La requête sans preuve (ou avec une preuve refusée) reçoit 428 `pow_required` avec `reason` et un défi `pow` `{ challenge, bits, expiresAt }`.
    2. Trouvez un nonce : une chaîne décimale d’au plus 20 chiffres telle que `SHA-256(challenge + ":" + nonce)` commence par `bits` bits à zéro (bit de poids fort du premier octet en premier). 18 bits demandent environ 260 000 hachages en moyenne.
    3. Renvoyez la même requête avec `"pow": { "challenge": "...", "nonce": "123456" }` dans le corps.

    Un défi est valable 2 minutes et une seule fois, pour un seul point de terminaison et un seul réseau client (une adresse IPv4 ou un /64 IPv6). Il est signé : le serveur n’en conserve rien tant qu’il ne revient pas. `reason` indique pourquoi une preuve a été refusée : `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` ou `replayed`.

    ## Réauthentification

    Les modifications du compte redemandent le mot de passe et, quand la double authentification est activée, un second facteur :

    - le mot de passe seul : `POST /account/password` et `POST /account/mfa/totp/setup` ;
    - le mot de passe et un code de l’application, un code de récupération étant refusé : `POST /account/mfa/recovery-codes` ;
    - le mot de passe et un code de l’application ou un code de récupération : `POST /account/mfa/totp/disable`, `POST /account/email`, `POST /account/export` et `POST /account/delete`.

    Dans les corps, `code` contient un code à 6 chiffres de l’application d’authentification et `recoveryCode` un code de récupération (`xxxx-xxxx-xx` ; la casse, les espaces et les tirets ne comptent pas). Un code de récupération peut aussi être envoyé dans `code` là où les codes de récupération sont acceptés. Chaque code ne sert qu’une fois : un code de l’application déjà utilisé est refusé jusqu’au pas de 30 secondes suivant, et un code de récupération disparaît une fois utilisé.

    | Statut | `error` | Quand |
    |---|---|---|
    | 403 | `invalid_password` | Mot de passe incorrect, ou le mot de passe a été réinitialisé ou changé pendant la requête (rien n’a été modifié). |
    | 403 | `mfa_code_required` | La double authentification est activée et ni `code` ni `recoveryCode` n’a été envoyé. |
    | 403 | `invalid_code` | Code erroné ou déjà utilisé. |
    | 400 | `password_not_set` | Un compte uniquement Google n’a pas encore de mot de passe (« Mot de passe oublié ? » permet d’en définir un). |
    | 429 | `too_many_attempts` | Trop d’échecs, ou trop de codes essayés, sur ce compte. |
    | 503 / 429 | `server_busy` / `rate_limited` | La file de hachage des mots de passe est saturée. |

    Les mots de passe et codes erronés comptent dans le compteur d’échecs du compte et sont enregistrés comme événements de sécurité.

    ## Port des métriques

    En plus du port de l’API, le serveur répond en HTTP simple sur le port des métriques (`METRICS_PORT`, 9464, lié à `METRICS_BIND`, 127.0.0.1 par défaut ; gardez-le privé). Il ne fait pas partie de cette API : `GET /healthz` répond `ok` ; `GET /readyz` répond `ready` une fois le démarrage terminé (chaque partition a rejoué son journal et les écouteurs sont ouverts) et jusqu’au début de l’arrêt, sinon 503 `not ready` ; `GET /metrics` sert les métriques Prometheus et, si `METRICS_TOKEN` est défini, exige `Authorization: Bearer <token>` avec exactement ce jeton.
