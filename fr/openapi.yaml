paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Obtenir le nom, les versions, les ports et les règles d’inscription du serveur
      description: |-
        Ce dont un client a besoin avant de se connecter à un compte ou d’ouvrir le WebSocket : le nom et l’identifiant du serveur, les versions du protocole WebSocket et l’emplacement du WebSocket, les règles d’inscription, les cadences officielles et les limites qu’un client peut vérifier avant d’envoyer un formulaire.

        **Limites :** seulement la couche par adresse.
      security: []
      responses:
        '200':
          description: La description du serveur.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited` : la couche par adresse.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Créer un compte
      description: |-
        Crée un compte : une fois son adresse e-mail confirmée par le lien qui lui est envoyé, ou immédiatement sans confirmation par e-mail.

        **Avec confirmation par e-mail** (`REQUIRE_EMAIL_VERIFICATION`, par défaut) : 202 `verification_sent`. Aucun compte n’existe encore : l’inscription attend pendant 24 heures et réserve son nom d’utilisateur entre-temps. Un lien valable ces 24 heures est envoyé à l’adresse, au plus un par adresse toutes les 5 minutes (`POST /auth/verify-email/resend` en envoie un nouveau) ; le compte est créé, avec son adresse confirmée, quand le lien est utilisé (le bouton de la page `/verify-email`), et le joueur peut alors se connecter. D’ici là, une connexion avec ce nom d’utilisateur reçoit `invalid_credentials`, comme pour un compte inconnu, et le profil public n’existe pas. Une nouvelle inscription avec la même adresse remplace celle qui attend. La réponse est la même quand un autre compte utilise déjà l’adresse : aucun lien n’est alors envoyé, son titulaire reçoit un avis à la place (au plus un par heure), et le nom d’utilisateur est réservé de la même façon, si bien que rien ne révèle si l’adresse a un compte. Une inscription dont le lien n’a pas été utilisé est abandonnée au bout de 24 heures, et son nom d’utilisateur redevient libre.

        **Sans confirmation par e-mail** (`REQUIRE_EMAIL_VERIFICATION=false`) : 201 `ready`, le compte est créé immédiatement et peut se connecter.

        **Règles.** `username` : de `USERNAME_MIN` à `USERNAME_MAX` caractères (3 à 20), lettres, chiffres, `_` et `-`, commençant par une lettre ou un chiffre (`GET /info` les donne dans `limits`) ; les noms réservés (`admin`, `moderator`, `deleted`…) et certains préfixes sont refusés ; unique sans tenir compte de la casse. `email` : débarrassé des espaces de début et de fin et stocké en minuscules, en ASCII simple avec un domaine contenant un point. `password` : au moins `PASSWORD_MIN_LENGTH` (10) caractères et au plus 256 octets en UTF-8 ; il ne doit contenir ni le nom d’utilisateur ni la partie locale de l’e-mail, et ne doit pas être un mot de passe courant.

        **Erreurs**, vérifiées dans cet ordre : 403 `registration_closed` ; 400 `invalid_username` ; 400 `invalid_email` ; 400 `weak_password` ; 409 `username_taken` ; 428 `pow_required` ; les erreurs de la file de hachage des mots de passe ; 409 `email_taken` (seulement sans confirmation par e-mail).

        **Limites :** `auth`, puis `auth_register` (10 inscriptions par heure et par client). **Preuve de travail :** toujours, quand `POW_REGISTER_BITS` est supérieur à 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Première tentative, sans preuve de travail
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Renvoyée avec la preuve de travail
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Le compte est créé et peut se connecter (pas de confirmation par e-mail sur ce serveur).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: L’inscription attend son lien de confirmation (ou l’adresse a déjà un compte ; la réponse ne le dit pas).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (avec `field`), `invalid_json`, `invalid_username`, `invalid_email`, ou `weak_password` avec `reason` : `too_short`, `too_long`, `contains_username`, `contains_email` ou `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed` : les inscriptions sont fermées sur ce serveur (`GET /info` indique `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` : un compte porte ce nom d’utilisateur, ou une inscription en attente avec une autre adresse le réserve. `email_taken` : un autre compte utilise l’adresse (seulement sans confirmation par e-mail).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited` : la limite `auth` ou `auth_register`, ou la file de hachage des mots de passe.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la file de hachage des mots de passe, ou la base de données est restée verrouillée), `timeout`. Aussi `server_busy` avec `retryAfter` de 2 à 5 : la base de données a trop d’écritures en attente, et la requête n’a pas été exécutée.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Se connecter avec un mot de passe
      description: |-
        Connecte avec un nom d’utilisateur ou une adresse e-mail et un mot de passe. Deux réponses sont possibles, toutes deux avec le statut 200 : une session, ou, quand la double authentification est activée, une seconde étape à terminer dans les 5 minutes avec `POST /auth/login/mfa`.

        Un compte inconnu, un mot de passe erroné et un compte sans mot de passe reçoivent la même réponse, au bout du même temps : 401 `invalid_credentials`. Les vérifications du compte (`banned`, `email_unverified`) n’interviennent qu’après un mot de passe correct. À partir de `AUTH_FAILURES_PER_ACCOUNT` (5) échecs sur un même identifiant, chaque tentative doit attendre (429 `too_many_attempts`).

        **Limite :** `auth`. **Preuve de travail :** seulement pendant une vague de connexions échouées (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Une session, ou la seconde étape d’une connexion avec double authentification.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Connecté
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: La double authentification est activée
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials` : compte inconnu, mot de passe erroné, ou compte sans mot de passe.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Seulement après un mot de passe correct : `banned`, avec `until` (instant en ms, `null` pour un bannissement définitif), ou `email_unverified` (un compte plus ancien dont l’adresse n’est pas encore confirmée).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (le délai d’attente après échecs de cet identifiant), ou `rate_limited` (la limite `auth`, la file de hachage des mots de passe).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la file de hachage des mots de passe, ou la base de données est restée verrouillée), `timeout`. Aussi `server_busy` avec `retryAfter` de 2 à 5 : la base de données a trop d’écritures en attente, et la requête n’a pas été exécutée.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Terminer une connexion avec un second facteur
      description: |-
        La seconde étape d’une connexion avec double authentification, après que `POST /auth/login` ou une connexion Google (`POST /auth/sso/google/finish` ou `POST /auth/sso/google/link`) a répondu `mfaRequired`. Envoyez `code` (un code à 6 chiffres de l’application, ou un code de récupération) ou `recoveryCode`. Un code de récupération utilisé ici est consommé.

        Une étape accepte au plus 5 codes erronés ; l’étape prend fin aussi quand le mot de passe est réinitialisé ou changé. Après l’étape du mot de passe d’une association Google, l’association n’est enregistrée que si le code est validé ici.

        **Limites :** `auth`, et au plus `AUTH_MFA_PER_ACCOUNT` (10) codes par période de 15 minutes pour le compte, depuis n’importe quelle adresse ; au-delà, le code n’est pas vérifié, si bien qu’un code de récupération n’est pas consommé.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Un code de l’application
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Un code de récupération
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Connecté.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` : ni `code` ni `recoveryCode` n’a été envoyé, ou le corps enfreint le schéma ; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token` : l’étape a expiré, a déjà servi ou a pris fin après 5 codes erronés, ou le mot de passe a été réinitialisé ou changé depuis la première étape (reconnectez-vous). `invalid_code` : un code erroné ou déjà utilisé.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (avec `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked` : seulement après l’étape du mot de passe d’une association Google ; le compte Google a été associé à un autre compte entre-temps.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired` : seulement après l’étape du mot de passe d’une association Google ; le compte a changé entre-temps, recommencez depuis le jeu.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` : le délai d’attente après échecs du compte, ou ses `AUTH_MFA_PER_ACCOUNT` codes des 15 dernières minutes sont épuisés. `rate_limited` : la limite `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` avec `retryAfter: 1` : la base de données est restée verrouillée (après une étape d’association Google, rien n’a été associé : recommencez depuis le jeu). `timeout`. Aussi `server_busy` avec `retryAfter` de 2 à 5 : la base de données a trop d’écritures en attente, et la requête n’a pas été exécutée.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Déconnecter cette session
      description: |-
        Révoque la session du jeton utilisé. Le WebSocket ouvert avec elle est fermé. Pas de corps (ou `{}`).

        **Limite :** `sessions`.
      security:
