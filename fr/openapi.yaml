        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: La limite `auth` ou `auth_reset` (une page HTML), le formulaire de nouveau avec `Retry-After` quand ce client a trop de hachages de mot de passe en attente (le lien reste valide), ou la couche par adresse (`rate_limited` en JSON).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'Le formulaire de nouveau avec `Retry-After` quand le serveur est occupé (la file de hachage des mots de passe, ou la base de données est restée verrouillée) ; le lien reste valide. Quand la base de données a trop d’écritures en attente, une page "Server error" (erreur du serveur) avec `Retry-After` (de 2 à 5) à la place : rien n’a été exécuté et le lien reste valide. Également en cas de dépassement du délai de traitement.'
