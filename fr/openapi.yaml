          description: '`rate_limited` : la limite `public_read` ou le budget du compte.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (la base de données est restée verrouillée ; `retryAfter: 1` dans le corps, pas d’en-tête `Retry-After`), `server_busy` (la recherche de session a trouvé la base de données verrouillée), `timeout`.'
  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Télécharger une partie sous forme de fichier PGN
      description: |-
        La même partie sous forme de fichier PGN : une seule partie, avec des fins de ligne `\n` et le texte des coups en lignes de moins de 80 colonnes. La réponse est la même avec ou sans jeton.

        En-têtes PGN, dans cet ordre : `Event` (`<SERVER_NAME> rated <category>` ou `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (la date de début, en UTC), `Round`, `White`, `Black`, `Result` (`*` pour une partie annulée), `UTCDate` et `UTCTime` (le début), `WhiteElo` et `BlackElo` (les classements au début, ou `-`), `WhiteRatingDiff` et `BlackRatingDiff` (les variations, par exemple `+10` et `-10`, dans toute partie classée, `+0` quand les règles de classement laissent le classement inchangé ; une partie amicale, à cadence libre ou annulée n’en a pas), `TimeControl` (en secondes), `Termination` (une valeur standard du PGN : `normal` ; `time forfeit`, une chute du drapeau, y compris quand elle aboutit à une nulle ; `abandoned` ; `rules infraction`, un second coup illégal ou un forfait pour manquement au fair-play ; `unterminated`, une partie annulée), `PlyCount`, `ScacelithGameId` (l’identifiant décimal).

        Chaque coup porte `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}` : la pendule du joueur qui a joué, après le coup, et le temps décompté pour ce coup, en dixièmes de seconde (tronqués). Une valeur est omise quand la partie enregistrée ne l’a pas. Après le dernier coup viennent le motif de fin en toutes lettres, puis le résultat.

        **Limite :** `public_read` (par joueur avec un jeton, par client sans jeton).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Le fichier PGN.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: 'Valeur : `attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'Le texte PGN, en UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id` : pas un entier positif d’au plus 16 chiffres (inférieur à 2^53) ; `invalid_request` : encodage URL non valide.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token` : un jeton a été envoyé et il n’est pas valide.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found` : partie inexistante.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited` : la limite `public_read` ou le budget du compte.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error` : entre autres, les coups enregistrés ne peuvent pas être rejoués jusqu’à la fin enregistrée (le serveur le journalise).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (la base de données est restée verrouillée ; `retryAfter: 1` dans le corps, pas d’en-tête `Retry-After`), `server_busy` (la recherche de session a trouvé la base de données verrouillée), `timeout`.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Télécharger une partie de ce serveur sous forme de GIF animé
      description: |-
        La partie sous forme de GIF animé. Les noms et les classements sont ceux de la partie enregistrée (les classements au début, un compte supprimé sous la forme `deleted#<id>`), de même que le résultat et la fin de partie (`Resignation`, `Loss on time`…).

        Les vérifications se font dans cet ordre : `gif_disabled`, les options de l’image (`size`, `orientation`, `delay`, `coords`), l’identifiant de la partie, la partie, sa longueur.

        **Session obligatoire :** les quotas se comptent par compte. **Limites :** `gif` sur chaque requête ; `gif_user_min`, `gif_user_hour`, `gif_ip_min` et `gif_ip_hour` seulement quand le GIF doit être fabriqué (voir la description de la section). **Délai maximal :** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 secondes (45 secondes par défaut).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: La taille de l’image, `small` (cases de 32 px), `medium` (48 px) ou `large` (72 px).
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Le camp placé en bas de l’échiquier.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Millisecondes par coup (1 à 6 chiffres décimaux).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Indique si les lettres des colonnes et les numéros des rangées sont dessinés autour de l’échiquier (`1`) ou non (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` avec `field` (`size`, `orientation`, `delay` ou `coords`) : une valeur hors des valeurs permises. `invalid_game_id`. `invalid_request` : encodage URL non valide.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found` : partie inexistante. `gif_disabled` : le serveur a désactivé les GIF (`GIF_ENABLED=false` ; le jeton `gif` est restitué).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited` : la limite `gif`, une limite de rendu, ou le budget du compte.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed` : le GIF n’a pas pu être fabriqué (le serveur journalise la cause). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` avec `retryAfter` (3 à 10 secondes) et `Retry-After` : la file de rendu est pleine, ou le GIF a attendu `GIF_QUEUE_TIMEOUT_MS` (10 secondes) un fil d’exécution libre ; tous les jetons de limite pris par la requête sont restitués. `busy` : la base de données est restée verrouillée (`retryAfter: 1` dans le corps seulement). `timeout`.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Fabriquer un GIF animé de n’importe quelle partie envoyée en PGN
      description: |-
        La même image que `GET /games/{id}/gif` pour n’importe quelle partie envoyée sous forme de texte PGN : une partie sauvegardée par le jeu, un export d’un autre site, une partie saisie à la main. Seule la première partie du texte est utilisée.

        - Le lecteur PGN accepte ce qu’accepte le lecteur du jeu lui-même : tout PGN écrit par ce serveur et les exports habituels des autres sites (les commentaires, les variantes, les NAG et les annotations de pendule sont ignorés ; les numéros de coup et la notation SAN sont lus avec tolérance ; un en-tête `FEN` donne la position de départ, sauf si `SetUp` vaut `"0"`).
        - Les noms et les classements proviennent des en-têtes `White`, `Black`, `WhiteElo` et `BlackElo`. Les lettres accentuées perdent leurs accents, les autres caractères hors de l’ASCII imprimable deviennent `?`, et les noms longs sont tronqués (48 caractères). Le résultat provient de l’en-tête `Result`, sinon de la fin du texte des coups. L’en-tête `Termination` est affiché sauf s’il vaut `normal` : la position finale dit alors d’elle-même comment la partie s’est terminée (mat, pat).
        - Ce point de terminaison vérifie lui-même son corps : un champ inconnu, ou un `pgn` absent ou qui n’est pas une chaîne, donne 400 `invalid_request` avec `field` ; une option erronée donne 400 `invalid_option` (`delayMs` doit être un nombre JSON, `coords` un booléen ; `null` est refusé).

        **Session obligatoire :** les quotas se comptent par compte. **Limites :** comme pour `GET /games/{id}/gif`. **Taille maximale du corps :** 135 168 octets, quel que soit `HTTP_BODY_LIMIT` (le PGN sous forme de chaîne JSON, échappements compris). **Délai maximal :** 45 secondes par défaut.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Une courte partie saisie à la main, sans coordonnées
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: Un fichier PGN avec toutes les options
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` avec `field` (un champ inconnu, ou `pgn` absent ou qui n’est pas une chaîne ; sans `field` quand le corps n’est pas un objet) ; `invalid_json` ; `invalid_option` avec `field` (`size`, `orientation`, `delayMs` ou `coords`) ; `invalid_pgn` avec `line` et `column` (à partir de 1, colonnes comptées en caractères) et le `message` du lecteur : un coup illégal ou ambigu, un en-tête mal formé, une variante inconnue, plus de 65 536 octets.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled` : le serveur a désactivé les GIF (`GIF_ENABLED=false` ; le jeton `gif` est restitué).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large` : un corps de plus de 135 168 octets.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited` : la limite `gif`, une limite de rendu, ou le budget du compte.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed` : le GIF n’a pas pu être fabriqué (le serveur journalise la cause). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` avec `retryAfter` (3 à 10 secondes) et `Retry-After` : la file de rendu est pleine, ou le GIF a attendu trop longtemps un fil d’exécution libre ; tous les jetons de limite pris par la requête sont restitués. `timeout`. Aussi `server_busy` avec `retryAfter` de 2 à 5 : la base de données a trop d’écritures en attente, et la requête n’a pas été exécutée.'
  /players/{username}:
