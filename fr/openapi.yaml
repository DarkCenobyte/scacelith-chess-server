components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Un jeton de session (`sct_` suivi de 43 caractères base64url) issu d’une réponse de connexion, dans l’en-tête `Authorization` : `Authorization: Bearer <token>`. Le préfixe est exactement `Bearer` (sensible à la casse) suivi d’une espace ; une valeur sans ce préfixe, ou un jeton qui ne compte pas de 1 à 512 caractères ASCII imprimables, reçoit 401 `invalid_token` comme tout autre jeton invalide. Un en-tête vide compte comme une absence d’en-tête.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: L’identifiant de la partie, un entier décimal positif d’au plus 16 chiffres sans zéros initiaux, inférieur à 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: L’identifiant de la session, tel que `GET /auth/sessions` le donne, écrit sans zéros initiaux (`03` n’est pas la session 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Le nom d’utilisateur du joueur, sans tenir compte de la casse. Le serveur accepte tout nom de 2 à 24 caractères parmi `[A-Za-z0-9_.-]` (la règle la plus large qu’il ait jamais admise).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Un identifiant de partie ; seules les parties plus anciennes sont listées. Passez le `next` de la page précédente. Une valeur vide compte comme absente.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: La taille de la page, de 1 à 50. Un nombre plus grand, de 3 chiffres au plus, compte pour 50 ; une valeur vide compte comme absente.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: Le jeton du lien de l’e-mail (43 caractères base64url). Un jeton absent ou erroné affiche la page "link invalid or expired" (lien invalide ou expiré).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Toute réponse du serveur interdit la mise en cache.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Secondes à attendre avant de réessayer ; la même valeur que `retryAfter` dans le corps.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Le défi Bearer, avec `error="invalid_token"` pour un jeton invalide.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Le serveur ferme la connexion après cette réponse.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (avec `field` quand un champ du corps est en cause) ou `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Un champ enfreint le schéma
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Le corps n’est pas du JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Un mot de passe trop faible
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: Un PGN illisible
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (pas d’en-tête `Authorization`) ou `invalid_token` (le jeton est mal formé, expiré, révoqué, ou appartient à un compte supprimé).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Pas de session
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Un jeton invalide
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: La requête est refusée.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Un mot de passe erroné lors d’une réauthentification
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Un compte banni
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found`, ou une fonctionnalité que ce serveur a désactivée.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout` : le corps n’est pas arrivé dans les 10 secondes. Le serveur ferme la connexion.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: La requête est en conflit avec l’état du serveur.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired` : la tentative ou le ticket de connexion Google est inconnu, déjà utilisé ou expiré ; recommencez depuis le jeu.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large` : le corps dépasse `HTTP_BODY_LIMIT` (16 384 octets par défaut). Le serveur ferme la connexion.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long` : la cible de la requête dépasse 4096 caractères.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type` : le corps n’est pas en `application/json`, ou son jeu de caractères n’est pas UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long` : la partie compte plus de `GIF_MAX_PLIES` (600) demi-coups.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required` : résolvez le défi `pow` et renvoyez la même requête avec `pow: { challenge, nonce }`. `reason` en indique la raison : `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` ou `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (une limite de débit, le budget du compte, ou la file de hachage des mots de passe) ou `too_many_attempts` (un frein propre au compte), avec `retryAfter` et un en-tête `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Une limite de débit
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Trop d’échecs sur ce compte
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error` : une défaillance inattendue. Le serveur la journalise.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed` : un `state` ou un `iss` erroné, ou Google a refusé le code ou envoyé un jeton d’identité dont la vérification échoue. L’erreur ne reprend jamais le texte de Google.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` ou `timeout` : réessayez après `retryAfter` quand il est fourni.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Le serveur est occupé
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: La base de données est restée verrouillée (une lecture)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Le serveur a mis trop de temps
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Le GIF animé, en pièce jointe.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` pour une partie de ce serveur, `attachment; filename="scacelith-game.gif"` pour un PGN envoyé avec `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: La taille du fichier en octets.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: Une page HTML.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: Une page HTML qui explique le refus.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Le formulaire n’est pas arrivé dans les 10 secondes (une page HTML). Le serveur ferme la connexion.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: Une page HTML qui explique le conflit.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Le formulaire dépasse `HTTP_BODY_LIMIT` (une page HTML). Le serveur ferme la connexion.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Le corps n’est ni un formulaire (`application/x-www-form-urlencoded`) ni du JSON, ou son jeu de caractères n’est pas UTF-8 (une page HTML).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Une limite de débit (une page HTML), avec `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Une défaillance inattendue, sous forme d’une page HTML intitulée "Server error" (erreur du serveur). Le serveur la journalise.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Le serveur est occupé (la base de données est restée verrouillée, avec `Retry-After`) ou a mis trop de temps ; la réponse est une page HTML intitulée "Server error" (erreur du serveur).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: La forme unique de toute réponse d’erreur de l’API JSON.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Le code d’erreur, en `snake_case`. Un client choisit d’après lui ce qu’il affiche.
          examples:
            - rate_limited
        message:
          type: string
          description: Une phrase en anglais, destinée aux journaux et servant de solution de repli.
        retryAfter:
          type: integer
          minimum: 1
          description: Secondes à attendre avant de réessayer, présent seulement sur les refus qui prennent fin avec le temps. La réponse porte alors aussi un en-tête `Retry-After` de même valeur, sauf le 503 `busy` des lectures de l’historique, des parties, des joueurs et du classement général.
        field:
          type: string
          description: Le champ ou le paramètre de requête en cause (`invalid_request`, `invalid_option`, ainsi que `invalid_cursor`, `invalid_limit` et `invalid_filter` de `GET /account/games`). Un champ imbriqué est en notation pointée (`pow.nonce`).
        reason:
          type: string
          description: 'La raison : la règle qu’enfreint un `weak_password`, ou la raison pour laquelle une preuve de travail a été demandée ou refusée (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: '`banned` seulement : la fin du bannissement (instant en ms), `null` pour un bannissement définitif.'
        line:
          type: integer
          minimum: 1
          description: '`invalid_pgn` seulement : la ligne de l’erreur, à partir de 1.'
        column:
          type: integer
          minimum: 1
          description: '`invalid_pgn` seulement : la colonne de l’erreur, à partir de 1, en caractères.'
    PowChallenge:
      type: object
      description: Un défi de preuve de travail (le `pow` d’un 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Le défi signé, à renvoyer tel quel.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Le nombre de bits à zéro en tête que doit avoir `SHA-256(challenge + ":" + nonce)`.
        expiresAt:
          type: integer
          format: int64
          description: L’expiration du défi (instant en ms), 2 minutes après son émission.
    PowAnswer:
      type: object
      description: La réponse à un défi de preuve de travail.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: Le `challenge` de la réponse 428, tel qu’il a été donné.
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Une chaîne décimale d’au plus 20 chiffres telle que `SHA-256(challenge + ":" + nonce)` commence par `bits` bits à zéro.
    ServerInfo:
      type: object
      description: Ce dont un client a besoin avant de se connecter à un compte ou d’ouvrir le WebSocket.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Le nom du serveur (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: Un UUID attribué à la base de données à son premier démarrage. Il reste le même d’un redémarrage à l’autre. Il vaut `null` quand la base de données ne peut pas le fournir.
        motd:
          type: string
          description: Le message du jour (`SERVER_MOTD`), éventuellement vide.
        protocol:
          type: object
          description: Le protocole WebSocket (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: La plus ancienne version du protocole que parle le serveur.
            max:
              type: integer
              minimum: 1
              description: La plus récente version du protocole que parle le serveur.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: L’empreinte du schéma du protocole (les 4 premiers octets du SHA-256 de sa forme canonique, sous forme d’entier non signé) ; à titre indicatif.
            subprotocol:
              type: string
              description: Le jeton de sous-protocole WebSocket (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: Le port WebSocket qu’utilisent les joueurs (`PUBLIC_WS_PORT`, sinon `WS_PORT`, sinon `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: Le chemin du WebSocket.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Indique si de nouveaux comptes peuvent être créés.
        emailVerification:
          type: boolean
          description: Indique si les nouveaux comptes confirment leur adresse (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
          properties:
            google:
              type: boolean
              description: Indique si la connexion Google est proposée.
        mfa:
          type: boolean
          const: true
          description: La double authentification est toujours disponible.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Les bits de preuve de travail qu’exige l’inscription (0 pour aucune).
        categories:
          type: array
          description: Les cadences officielles, celles des parties classées (`RATED_CATEGORIES`), dans l’ordre du serveur. Toute autre cadence est `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Les règles qu’un client peut vérifier avant d’envoyer un formulaire.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: La longueur minimale d’un nom d’utilisateur (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: La longueur maximale d’un nom d’utilisateur (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: L’expression régulière à laquelle doit correspondre un nouveau nom d’utilisateur.
            passwordMinLength:
              type: integer
              description: La longueur minimale d’un mot de passe, en caractères (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: La longueur maximale d’un mot de passe, en octets UTF-8.
            customTimeControls:
              type: boolean
              description: Indique si les défis et les parties privées peuvent utiliser des cadences libres.
            reportsPerDay:
              type: integer
              description: Le nombre de signalements qu’un joueur peut déposer par période de 24 heures (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: La taille maximale d’un message WebSocket qu’un client peut envoyer, en octets.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 1852590473
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Une cadence officielle.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 'L’identifiant de la catégorie : les minutes et les secondes d’incrément (`3+2`).'
        baseSec:
          type: number
          minimum: 0
          description: Le temps de base, en secondes.
        incSec:
          type: number
          minimum: 0
          description: L’incrément par coup, en secondes.
    AccountView:
      type: object
      description: Le compte tel que son joueur le voit (`user` des réponses de connexion et de `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: L’identifiant du compte.
        username:
          type: string
          description: Le nom d’utilisateur.
        email:
          type: string
          format: email
          description: L’adresse e-mail.
        emailVerified:
          type: boolean
          description: Indique si l’adresse est confirmée.
        mfaEnabled:
          type: boolean
          description: Indique si la double authentification est activée.
        googleLinked:
          type: boolean
          description: Indique si un compte Google est associé.
        hasPassword:
          type: boolean
          description: '`false` pour un compte créé par Google qui n’a pas encore défini de mot de passe.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Indique si les défis directs par nom sont acceptés (voir `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: La date de création du compte (instant en ms).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: La dernière connexion (instant en ms), ou `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: La nouvelle adresse d’un changement d’adresse e-mail qui attend son lien, ou `null`.
    SessionAnswer:
      type: object
      description: Une nouvelle session.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Le jeton de session, pour l’en-tête `Authorization` et le WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: La fin absolue de la session (instant en ms) ; la limite d’inactivité peut y mettre fin plus tôt.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: La seconde étape d’une connexion avec double authentification ; continuez avec `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Le jeton de l’étape, pour `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Les secondes restantes pour terminer l’étape.
    LoginAnswer:
      description: Une session, ou la seconde étape d’une connexion avec double authentification.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Une première connexion Google ; continuez avec `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Le ticket pour `POST /auth/sso/complete`, valable 10 minutes.
        suggestedUsername:
          type: string
          description: Un nom d’utilisateur tiré du nom Google ou de l’adresse, ou `""` quand rien ne convient.
    SsoNeedsPassword:
      type: object
      description: Un compte doté d’un mot de passe utilise l’adresse ; continuez avec `POST /auth/sso/google/link`. Rien n’est encore associé.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Le ticket pour `POST /auth/sso/google/link`.
        username:
          type: string
          description: Le nom d’utilisateur de ce compte (seule une personne qui a prouvé à Google qu’elle détient l’adresse le voit).
        expiresIn:
          type: integer
          const: 600
          description: La durée de validité restante du ticket, en secondes.
    SsoFinishAnswer:
      description: La réponse de `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Une tentative de connexion Google.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: La tentative, pour `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: L’URL Google à ouvrir dans le navigateur du système, une fois vérifiée.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Le `state` que Google doit renvoyer.
        expiresIn:
          type: integer
          const: 600
          description: La durée de validité restante de la tentative, en secondes.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Le nom d’utilisateur ; les règles du serveur s’appliquent ensuite (voir la description).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: L’adresse e-mail. Débarrassée des espaces de début et de fin et stockée en minuscules.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Le mot de passe ; les règles des mots de passe s’appliquent ensuite.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Le nom d’utilisateur, ou l’adresse e-mail (tout texte contenant `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Facultatif. Affiché dans la liste des appareils connectés (par exemple `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: Le `mfaToken` de la réponse de connexion (ou de celle d’une connexion Google).
        code:
          type: string
          maxLength: 32
          description: Facultatif. Un code à 6 chiffres de l’application, ou un code de récupération.
        recoveryCode:
          type: string
          maxLength: 32
          description: Facultatif. Un code de récupération. `code` ou `recoveryCode` est nécessaire.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: L’adresse e-mail.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Le paramètre `token` du lien de réinitialisation.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Le nouveau mot de passe ; les règles de mot de passe de l’inscription s’appliquent.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Le défi PKCE S256 du `codeVerifier` du client (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Le port de l’écouteur du client sur `127.0.0.1`.
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: L’`attemptId` de `POST /auth/sso/google/start`.
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: Le vérificateur PKCE ; son SHA-256 doit correspondre au défi donné à `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Le `state` tel que Google l’a renvoyé.
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: Le `code` tel que Google l’a renvoyé (ASCII imprimable sans espaces).
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Facultatif. L’`iss` tel que Google l’a renvoyé, s’il l’a fait.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: Le `linkTicket` de `finish`, valable 10 minutes.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Le mot de passe du compte.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: Le `ssoTicket` de `finish`, valable 10 minutes.
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Le nom d’utilisateur ; les règles de l’inscription s’appliquent.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Les sessions actives, de la plus récemment utilisée à la plus ancienne.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Une session active (un appareil connecté).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: L’identifiant de la session, pour `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: La connexion (instant en ms).
        lastSeenAt:
          type: integer
          format: int64
          description: La dernière utilisation (instant en ms), mise à jour au plus toutes les 5 minutes.
        expiresAt:
          type: integer
          format: int64
          description: La fin absolue (instant en ms) ; la limite d’inactivité peut mettre fin à la session plus tôt.
        clientLabel:
          type:
            - string
            - 'null'
          description: Le `clientLabel` de la connexion, ou `null` si elle n’en a pas envoyé.
        current:
          type: boolean
          description: Indique s’il s’agit de la session qui fait la requête.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Une fiche par catégorie dans laquelle le joueur a disputé des parties classées.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Les sanctions en cours.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }` pendant un bannissement, sinon `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: La fiche de classement d’une catégorie.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: L’identifiant de la catégorie.
        rating:
          type: integer
          description: Le classement.
        games:
          type: integer
          minimum: 0
          description: Les parties jouées dans la catégorie (comptées ou non).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Le classement le plus élevé atteint.
        provisional:
          type: boolean
          description: '`true` tant que le joueur n’est pas encore classé ou compte moins de `PROVISIONAL_GAMES` parties comptées (le jeu l’affiche sous la forme `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Le type de sanction.
        reason:
          type:
            - string
            - 'null'
          description: Le motif indiqué, s’il y en a un.
        startsAt:
          type: integer
          format: int64
          description: Le début (instant en ms).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: La fin (instant en ms), `null` quand la sanction est définitive.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: La fin du bannissement (instant en ms), `null` s’il est définitif.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` pour accepter les défis directs par nom, `none` pour les refuser.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Le mot de passe actuel.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Le nouveau mot de passe ; les règles de mot de passe de l’inscription s’appliquent.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Le mot de passe du compte.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Un code issu du secret en attente, exactement 6 chiffres.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Le mot de passe du compte.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Facultatif ; nécessaire avec la double authentification (ou `recoveryCode`). Un code de l’application, ou un code de récupération.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Facultatif. Un code de récupération (`xxxx-xxxx-xx` ; la casse, les espaces et les tirets ne comptent pas).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Le mot de passe du compte.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Un code de l’application (un code de récupération est refusé).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: La nouvelle adresse ; débarrassée des espaces de début et de fin et mise en minuscules, puis vérifiée comme une adresse d’inscription.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Le mot de passe du compte.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Facultatif ; nécessaire avec la double authentification (ou `recoveryCode`). Un code de l’application, ou un code de récupération.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Facultatif. Un code de récupération.
    TotpSetup:
      type: object
      description: Le secret en attente, pour l’application d’authentification.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Le secret en base32, à saisir dans l’application.
        uri:
          type: string
          format: uri
          description: L’URI `otpauth://totp/...`, à afficher en QR code.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Secondes par pas.
    RecoveryCodeList:
      type: array
      description: Les 10 codes de récupération, affichés cette seule fois. Chacun ne sert qu’une fois.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Un camp d’une partie.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Le nom dans la partie enregistrée (`deleted#<id>` pour un compte supprimé).
        rating:
          type:
            - integer
            - 'null'
          description: Le classement au début, `null` s’il est inconnu.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Le classement après la partie. Une partie classée l’a toujours ; `null` seulement pour une partie qui ne compte pas pour les classements (amicale, à cadence libre, annulée).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: La variation de classement, `0` quand les règles de classement laissent le classement inchangé (score de zéro point selon la FIDE, adversaire non classé, premières parties d’un joueur non classé) ; `null` dans les mêmes cas que `ratingAfter`.
    GameSummary:
      type: object
      description: Le résumé d’une partie enregistrée.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: L’identifiant de la partie.
        category:
          type: string
          description: L’identifiant de la catégorie officielle (`3+2`), ou `custom`.
        rated:
          type: boolean
          description: Indique si la partie compte pour les classements.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: La cadence en secondes (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (voir les codes des parties).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Le code du motif de fin (voir les codes des parties).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Le résultat, `*` pour une partie annulée.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Le nombre de demi-coups.
        startedAt:
          type: integer
          format: int64
          description: Le début (instant en ms).
        endedAt:
          type: integer
          format: int64
          description: La fin (instant en ms).
    Termination:
      type: string
      description: Le nom du motif de fin (voir les codes des parties) ; `Unknown` pour un code que le protocole ne connaît pas.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Le résumé d’une partie du point de vue d’un joueur.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Le camp du joueur.
    HistoryGameSummary:
      description: Une partie de l’historique du joueur connecté.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Le temps de base en millisecondes.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: L’incrément en millisecondes.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: L’issue du point de vue du joueur.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Les parties de la page, de la plus récente à la plus ancienne.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: L’identifiant à passer comme `before` pour la page suivante, ou `null` sur la dernière page.
        total:
          type: integer
          minimum: 0
          description: Le nombre de parties qui correspondent au filtre, toutes pages confondues.
    MoveRecord:
      type: object
      description: Un demi-coup d’une partie.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: Le coup en notation UCI, avec `n`, `b`, `r` ou `q` ajouté pour une promotion.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Le temps décompté pour le coup (ms), `null` quand la partie enregistrée ne l’a pas.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: La pendule du joueur qui a joué, après le coup (ms), `null` quand la partie enregistrée ne l’a pas.
    PgnTagsView:
      type: object
      description: Les principaux en-têtes PGN, pour l’affichage. `Termination` est ici le nom du motif de fin ; le fichier PGN utilise les valeurs standard du PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` ou `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: La date de début, en UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Le classement au début, ou `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Le classement au début, ou `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Une partie enregistrée avec ses coups et ses pendules. Elle a les champs d’un résumé de partie, sans `color` ni `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Le temps de base en millisecondes.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: L’incrément en millisecondes.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: Le nom de `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: L’identifiant de la partie dont celle-ci est la revanche, ou `null`.
            moves:
              type: array
              description: Une entrée par demi-coup.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Seulement quand le joueur du jeton a joué cette partie ; son camp.
            reportable:
              type: boolean
              description: Seulement quand le joueur du jeton a joué cette partie ; `true` quand `POST /reports` accepterait maintenant un signalement de l’adversaire pour cette partie (la partie s’est terminée il y a moins de 7 jours, le quota quotidien n’est pas épuisé, et l’adversaire n’est pas déjà signalé pour cette partie).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Le nom d’utilisateur, tel que le joueur l’a écrit.
        createdAt:
          type: integer
          format: int64
          description: La date de création du compte (instant en ms).
        ratings:
          type: array
          description: Les catégories officielles seulement, dans l’ordre du serveur.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Toutes les parties enregistrées, amicales et annulées comprises.
            rated:
              type: integer
              minimum: 0
              description: Les parties classées, additionnées sur les fiches de classement.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Le nom d’utilisateur, tel que le joueur l’a écrit.
        games:
          type: array
          description: Les parties de la page, de la plus récente à la plus ancienne.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: L’identifiant de la dernière partie chaque fois que la page est pleine (la page suivante peut alors être vide), sinon `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: L’identifiant de la catégorie.
        minGames:
          type: integer
          minimum: 0
          description: Le nombre de parties comptées qu’il faut à une fiche pour figurer dans la liste (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Le moment où le tableau a été calculé (instant en ms).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: Le texte PGN, au plus 65 536 octets en UTF-8. Seule la première partie est utilisée.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Facultatif. La taille de l’image.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Facultatif. Le camp placé en bas de l’échiquier.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Facultatif. Millisecondes par coup, un nombre JSON de valeur entière.
        coords:
          type: boolean
          default: true
          description: Facultatif. Indique si les lettres des colonnes et les numéros des rangées sont dessinés autour de l’échiquier.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: La partie, sous forme d’entier ou de chaîne de 1 à 16 chiffres.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Le nom d’utilisateur de l’adversaire, tel qu’il figure dans la partie enregistrée ou tel qu’il est aujourd’hui, sans tenir compte de la casse. Il ne peut pas être vide.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: L’objet du signalement.
        comment:
          type:
            - string
            - 'null'
          description: Facultatif. Au plus 500 caractères, une fois retirés les caractères de contrôle (autres que la tabulation et le saut de ligne) et les espaces de début et de fin.
    AccountExport:
      type: object
      description: Tout ce que le serveur conserve sur le compte (instants en ms).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Le moment où l’export a été fait.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Ce que le fichier contient et ce qu’il omet, en anglais courant, pour le joueur.
          items:
            type: string
        account:
          description: La vue du compte de `GET /account/me`, avec `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: L’adresse du compte Google associé, ou `null`.
        ratings:
          type: array
          description: Les fiches de classement complètes.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Les points de classement restitués après qu’un adversaire a été reconnu coupable de triche, additionnés par jour UTC et par catégorie, du plus récent au plus ancien. Ni les parties ni les tricheurs ne sont nommés.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Toutes les sessions enregistrées, de la plus récente à la plus ancienne, sans aucun jeton. La purge de conservation supprime une session expirée, et une session déconnectée un jour après la déconnexion.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Les événements de sécurité, du plus récent au plus ancien, conservés `RETENTION_SECURITY_DAYS` jours.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Toutes les sanctions, levées comprises. Le nom du modérateur n’est jamais inclus.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Les événements de conduite enregistrés pour les parties du joueur quittées, annulées ou sans premier coup, conservés 30 jours.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Les signalements faits par le joueur.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Le nombre de parties.
            list:
              type: array
              description: Toutes les parties, de la plus récente à la plus ancienne, sous forme de résumés de `GET /account/games`. Les coups s’obtiennent par `GET /games/{id}` et le PGN par `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Une fiche de classement complète.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Indique si le joueur est sorti de la phase non classée.
            countedGames:
              type: integer
              minimum: 0
              description: Les parties prises en compte dans le classement.
            updatedAt:
              type: integer
              format: int64
              description: La dernière modification de la fiche.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: 00:00 UTC du jour (instant en ms).
        category:
          type: string
        points:
          type: integer
          description: Les points restitués ce jour-là dans cette catégorie.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Le moment où la session a été déconnectée, ou `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: L’adresse de la connexion, effacée après `RETENTION_IP_DAYS` jours.
    SecurityEvent:
      type: object
      description: |-
        Un événement de sécurité. `ip` n’est fourni que pour ce qui a été fait en étant connecté, avec le mot de passe du compte (et le second facteur) ou avec un lien envoyé à son adresse : `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` et `account_exported` ; tout autre type a `ip: null`, et `ip` est effacé après `RETENTION_IP_DAYS` jours.

        `detail` ne conserve que ces champs : `login` : `method` ; `sso_login`, `sso_account_created` : `provider` ; `sso_linked` : `provider` et `method` (`password`, ou `password+totp`) ; `login_failed` : `failures` ; `login_lockout` : `retryAfterMs` ; `mfa_failed` : `attempts` ; `recovery_code_used` : `remaining` ; `reauth_failed` : `factor` ; `session_revoked` et `sessions_revoked_all` : `reason` ; `email_change_refused` : `reason` ; `sanction_auto` : `kind`, `gameId`, `until`. Un événement `moderator_action` ne conserve que `{ action }`, pour les actions `ban`, `unban`, `reset_mfa`, `verify_email` et `revoke_sessions` (les autres actions de modération sont omises). Tout autre type a `detail: null`. Les événements `rating_refund` sont omis : leurs points figurent dans `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Le type d’événement (`login`, `password_changed`…).
        at:
          type: integer
          format: int64
          description: Le moment où il s’est produit.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: Le nom public actuel du joueur signalé.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Indique si le signalement est encore ouvert (rien n’indique si le joueur signalé a été sanctionné).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Le jeton du lien de l’e-mail (le champ caché du formulaire de la page).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Le jeton du lien de réinitialisation (le champ caché du formulaire).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Le nouveau mot de passe ; les règles de mot de passe de l’inscription s’appliquent.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Le nouveau mot de passe, une seconde fois ; il doit être identique.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: Une page HTML en UTF-8 (`text/html; charset=utf-8`), sans JavaScript ni ressources externes.
