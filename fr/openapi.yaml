  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: Supprimer le compte
      description: |-
        Supprime le compte ; cette action est irréversible.

        - Toutes les sessions sont révoquées immédiatement : le jeton reçoit désormais 401 `invalid_token`.
        - Le nom d’utilisateur devient `deleted#<id>`, dans le compte et dans chaque partie enregistrée.
        - Sont effacés : l’adresse e-mail, l’empreinte du mot de passe, le secret de double authentification et les codes de récupération, les sessions et les jetons de lien, l’association Google, la fiche d’intégrité de l’anti-triche, et les adresses IP enregistrées avec les événements de sécurité.
        - Les classements et les parties sont conservés. Les parties restent lisibles sous le nom anonyme, et `GET /players/{username}` répond 404 pour l’ancien nom.

        **Réauthentification :** le mot de passe et, avec la double authentification, un code de l’application ou un code de récupération. **Limites :** `reauth`, puis `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Le compte est supprimé.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (un compte uniquement Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required` ou `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (réauthentifications échouées, ou trop de codes essayés sur ce compte), ou `rate_limited` (la limite `reauth` ou `reauth_user`, le budget du compte, la file de hachage des mots de passe).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la file de hachage des mots de passe, ou la base de données est restée verrouillée), `timeout`. Aussi `server_busy` avec `retryAfter` de 2 à 5 : la base de données a trop d’écritures en attente, et la requête n’a pas été exécutée.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Lister les parties du joueur, filtrées et paginées
      description: |-
        Les parties du joueur connecté, de la plus récente à la plus ancienne, filtrées et paginées, avec le nombre de parties qui correspondent au filtre. Tous les paramètres de requête sont facultatifs, et une valeur vide compte comme absente.

        Pagination : passez le `next` de la page précédente comme `before` ; `next` vaut `null` sur la dernière page. `total` compte les parties qui correspondent au filtre, toutes pages confondues.

        **Limite :** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: Un identifiant de catégorie officielle (`3+2`, ou `3%2B2`), ou `custom` pour toutes les parties jouées à une autre cadence.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Seulement les parties classées (`true`) ou amicales (`false`).
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Seulement les parties gagnées, perdues ou nulles, du point de vue du joueur. Les parties annulées n’apparaissent que sans ce filtre.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Une page de l’historique.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` n’est pas un identifiant de partie), `invalid_limit`, ou `invalid_filter` (`category`, `rated` ou `result`), chacun avec `field` qui nomme le paramètre.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited` : la limite `account_games` ou le budget du compte.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (la base de données est restée verrouillée ; `retryAfter: 1` dans le corps, pas d’en-tête `Retry-After`), `server_busy` (la recherche de session a trouvé la base de données verrouillée), `timeout`.'
  /games/{id}:
    get:
      operationId: getGame
      tags:
        - games
      summary: Obtenir une partie enregistrée avec ses coups et ses pendules
      description: |-
        Une partie enregistrée, avec ses coups et ses pendules. Sans jeton, ou avec le jeton d’un joueur qui n’a pas joué la partie, la réponse est la réponse publique. Quand le joueur du jeton a joué la partie, la réponse ajoute `you` et `reportable`.

        **Limite :** `public_read` (par joueur avec un jeton, par client sans jeton).
      security:
