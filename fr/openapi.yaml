tags:
  - name: server-info
    x-displayName: Informations sur le serveur
    description: Ce qu’un client doit savoir avant de se connecter à un compte ou d’ouvrir le WebSocket.
  - name: health
    x-displayName: Santé
    description: |-
      Vivacité et disponibilité du serveur, pour la supervision. Ces points de terminaison répondent sur le port de l’API avant l’authentification et toute limite de point de terminaison, mais, comme toute requête, ils prennent un jeton de la couche par adresse ; un hôte de supervision peut être inscrit dans `ABUSE_EXEMPT`. Les deux chemins fonctionnent pour chacun d’eux : à la racine du serveur et sous `/api/v1`.

      Le port des métriques a ses propres points de terminaison de santé, décrits dans l’introduction.
  - name: auth
    x-displayName: Inscription et connexion
    description: |-
      Création d’un compte, connexion avec un mot de passe (et un second facteur), e-mails de confirmation et de réinitialisation du mot de passe.

      `POST /auth/login`, `POST /auth/login/mfa`, `POST /auth/sso/google/finish`, `POST /auth/sso/google/link` et `POST /auth/sso/complete` répondent par une session `{ token, expiresAt, user }` (ou, pour les premiers, par une seconde étape).
  - name: google-sign-in
    x-displayName: Connexion Google
    description: |-
      Proposée quand `GET /info` indique `sso.google: true` ; sinon, chacun des points de terminaison ci-dessous répond 404 `sso_disabled`. Le jeu se connecte par le navigateur du système selon le flux des applications installées de la RFC 8252 (un client de type « Application de bureau ») : Google renvoie le navigateur vers un écouteur du jeu sur `127.0.0.1`, jamais vers ce serveur, et le jeu ne voit jamais d’identifiants Google.

      1. Le client écoute sur `127.0.0.1:0` (le système choisit le port) et crée une paire PKCE : un `codeVerifier` de 43 à 128 caractères `[A-Za-z0-9._~-]` et `codeChallenge = BASE64URL(SHA-256(codeVerifier))`, qui compte 43 caractères, sans remplissage.
      2. `POST /auth/sso/google/start`, avec le défi PKCE et le port, renvoie l’URL Google et le `state` de la tentative. Le client vérifie l’URL (voir plus bas) et l’ouvre dans le navigateur.
      3. Google envoie le navigateur vers `http://127.0.0.1:<port>/oauth2/google/<tag>?code=...&state=...`. Le client n’accepte que le `state` de la réponse de démarrage, et n’envoie rien après une redirection `error=`.
      4. `POST /auth/sso/google/finish` avec l’identifiant de la tentative, le `codeVerifier`, le `state` et le `code` (et `iss` quand Google l’a envoyé).
      5. La réponse est une session, une étape de double authentification (continuez avec `POST /auth/login/mfa`), `needsUsername` pour un nouveau joueur (continuez avec `POST /auth/sso/complete`), ou `needsPassword` quand un compte doté d’un mot de passe utilise l’adresse (continuez avec `POST /auth/sso/google/link`).

      **L’étiquette d’origine.** L’URI de redirection porte une étiquette du serveur que le joueur a ajouté, afin que le jeu refuse une URL qu’un autre serveur a obtenue pour ses propres joueurs. L’origine est l’hôte en minuscules (un littéral IPv6 entre crochets), `:` et le port décimal de l’API, toujours écrit, 443 compris : le serveur prend `SERVER_PUBLIC_HOST` et son port public d’API, le jeu l’adresse à laquelle il est connecté. L’étiquette est formée des 22 premiers caractères du base64url (sans remplissage) de SHA-256(UTF-8 `"scacelith-sso-origin-v1\n"` + origine). L’URI de redirection est `"http://127.0.0.1:" + port + "/oauth2/google/" + tag` : toujours le littéral IPv4, et le port de l’écouteur du jeu (1024 à 65535). Le serveur ne prend jamais d’URI, d’hôte ni de chemin venant du client.

      | Origine | Étiquette |
      |---|---|
      | `play.scacelith.example:443` | `IhcScoV7eDOzTEcSnqPUPt` |
      | `localhost:8443` | `TFGx7zQ_8QlGZW5zpqznCr` |
      | `[::1]:8443` | `XToJm0DG5PjciEVmZa9Cho` |
      | `127.0.0.1:50443` | `3r653wM5ZjYsHcAJljmCwY` |

      La connexion Google ne fonctionne donc que pour les joueurs qui ont ajouté le serveur exactement sous `SERVER_PUBLIC_HOST` et son port public d’API.

      **Ce que le jeu vérifie avant d’ouvrir le navigateur.** L’`authUrl` commence exactement par `https://accounts.google.com/o/oauth2/v2/auth?`, ne contient que de l’ASCII imprimable et fait moins de 4096 caractères, et sa chaîne de requête contient exactement un `response_type=code`, exactement un `redirect_uri` égal à l’URI que le jeu calcule à partir de son port et de son étiquette d’origine, exactement un `state` égal au `state` de la réponse, `code_challenge_method=S256` et un `code_challenge` de 43 caractères. Sinon, le jeu arrête son écouteur et n’ouvre rien. Il n’envoie `finish` et `link` qu’au serveur qui a répondu à `start`.

      **Le compte auquel mène la connexion Google :** le compte déjà associé à ce compte Google ; sinon, un compte actif ayant l’adresse confirmée par Google (s’il a un mot de passe, `finish` répond `needsPassword` et l’association n’est enregistrée qu’une fois son mot de passe validé, puis son second facteur s’il est activé ; s’il n’en a pas, 409 `sso_account_exists`) ; sinon, un nouveau compte (`needsUsername`). Un compte Google n’est jamais associé à un compte existant sur la seule foi de son adresse. L’adresse du compte reçoit un e-mail quand la connexion Google crée un compte et quand elle est ajoutée à un compte existant.
  - name: sessions
    x-displayName: Sessions
