                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                next: 4100000000001
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_cursor` (`before` n’est pas un identifiant de partie), `invalid_limit` (ces deux derniers sans `field`).'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token` : un jeton a été envoyé et il n’est pas valide.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found` : joueur inexistant, ou compte supprimé.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited` : la limite `public_read` ou le budget du compte.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (la base de données est restée verrouillée ; `retryAfter: 1` dans le corps, pas d’en-tête `Retry-After`), `server_busy` (la recherche de session a trouvé la base de données verrouillée), `timeout`.'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: Obtenir les meilleurs joueurs d’une catégorie
      description: |-
        Les 100 meilleures fiches de classement d’une catégorie officielle ayant au moins `minGames` (`PROVISIONAL_GAMES`) parties comptées, hors comptes supprimés et tricheurs avérés. Le serveur recalcule chaque tableau au plus toutes les 10 secondes ; `updatedAt` indique quand. Un seul calcul par catégorie a lieu à la fois : pendant ce temps, les autres requêtes reçoivent la liste précédente, ou attendent le calcul quand il n’y en a pas encore.

        **Limites :** seulement la couche par adresse.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: Un identifiant de catégorie officielle (`3+2`, ou `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: Le nombre de joueurs, de 1 à 100. Un nombre plus grand, de 3 chiffres au plus, compte pour 100 ; une valeur vide compte comme absente.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: Le tableau.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (absente, ou pas une catégorie officielle), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited` : la couche par adresse.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (la base de données est restée verrouillée ; `retryAfter: 1` dans le corps, pas d’en-tête `Retry-After`), `timeout`.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Signaler l’adversaire d’une partie récente
      description: |-
        Signale l’adversaire de l’une des parties du joueur terminée dans les 7 derniers jours. Un signalement ne modifie jamais à lui seul un classement, une sanction ou un niveau d’intégrité. Il relève la priorité d’examen que voient les modérateurs et, sauf pour `abuse`, il demande l’analyse de la partie par le moteur.

        Un signalement du même adversaire pour la même partie reçoit la même réponse et ne change rien ; la réponse ne révèle jamais rien sur le compte signalé. `GET /games/{id}` indique à l’avance aux joueurs de la partie si un signalement serait accepté (`reportable`).

        Ce point de terminaison vérifie lui-même son corps, dans l’ordre `gameId`, `reported`, `category`, `comment` : un échec donne 400 `invalid_request` sans `field`. Les champs qu’il ne connaît pas sont ignorés.

        **Limites :** `reports` (par joueur), puis `REPORTS_PER_DAY` (5) signalements par joueur sur 24 heures (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Le signalement est reçu (ou avait déjà été déposé).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (sans `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed` : ce joueur n’est pas l’adversaire de l’auteur du signalement dans une partie terminée dans les 7 derniers jours.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, avec un en-tête `Retry-After`) : `REPORTS_PER_DAY` signalements au cours des dernières 24 heures. `rate_limited` : la limite `reports` ou le budget du compte.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la recherche de session a trouvé la base de données verrouillée), `timeout`. Aussi `server_busy` avec `retryAfter` de 2 à 5 : la base de données a trop d’écritures en attente, et la requête n’a pas été exécutée.'
