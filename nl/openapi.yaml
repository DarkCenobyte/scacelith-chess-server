        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (de database bleef vergrendeld; `retryAfter: 1` in de body, geen `Retry-After`-header), `server_busy` (bij het opzoeken van de sessie was de database vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Een partij downloaden als PGN-bestand
      description: |-
        Dezelfde partij als PGN-bestand: één partij met regeleinden `\n`, en zettekst in regels van minder dan 80 kolommen. Het antwoord is hetzelfde met of zonder token.

        Tags, in deze volgorde: `Event` (`<SERVER_NAME> rated <category>` of `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (de startdatum in UTC), `Round`, `White`, `Black`, `Result` (`*` voor een afgebroken partij), `UTCDate` en `UTCTime` (de start), `WhiteElo` en `BlackElo` (de ratings bij de start, of `-`), `WhiteRatingDiff` en `BlackRatingDiff` (de wijzigingen, zoals `+10` en `-10`, in elke partij met rating, `+0` wanneer de ratingregels de rating laten waar hij was; een vrijblijvende partij, een partij met aangepast speeltempo of een afgebroken partij heeft geen van beide), `TimeControl` (in seconden), `Termination` (een standaardwaarde van PGN: `normal`; `time forfeit`, het vallen van de vlag, ook wanneer dat in remise eindigt; `abandoned`; `rules infraction`, een tweede onreglementaire zet of verlies wegens een fair-play-overtreding; `unterminated`, een afgebroken partij), `PlyCount`, `ScacelithGameId` (de decimale id).

        Elke zet krijgt `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: de klok van de speler die de zet deed, na de zet, en de tijd die ervoor is aangerekend, in tienden van een seconde (afgekapt). Een waarde wordt weggelaten wanneer het record haar niet heeft. Na de laatste zet volgt de reden van beëindiging in woorden, daarna de uitslag.

        **Limiet:** `public_read` (per speler met een token, per client zonder).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Het PGN-bestand.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'De PGN-tekst, in UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: geen positief geheel getal van hoogstens 16 cijfers (onder 2^53); `invalid_request`: geen geldige URL-codering.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: er is een token meegestuurd en het is niet geldig.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: deze partij bestaat niet.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de limiet `public_read` of het accountbudget.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: onder meer wanneer de opgeslagen zetten niet tot het opgeslagen einde kunnen worden nagespeeld (de server logt het).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (de database bleef vergrendeld; `retryAfter: 1` in de body, geen `Retry-After`-header), `server_busy` (bij het opzoeken van de sessie was de database vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Een partij van deze server downloaden als geanimeerde GIF
      description: |-
        De partij als geanimeerde GIF. De namen en ratings zijn die van het partijrecord (de ratings bij de start, een verwijderd account als `deleted#<id>`), en dat geldt ook voor de uitslag en het einde (`Resignation`, `Loss on time`...).

        De controles gebeuren in deze volgorde: `gif_disabled`, de beeldopties (`size`, `orientation`, `delay`, `coords`), de partij-id, de partij, de lengte ervan.

        **Verplichte sessie:** de quota tellen per account. **Limieten:** `gif` bij elk verzoek; `gif_user_min`, `gif_user_hour`, `gif_ip_min` en `gif_ip_hour` alleen wanneer de GIF moet worden gemaakt (zie de beschrijving van de sectie). **Tijdslimiet:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 seconden (standaard 45 seconden).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: De beeldgrootte, `small` (velden van 32 px), `medium` (48 px) of `large` (72 px).
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: De kleur die onderaan het bord staat.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Milliseconden per zet (1 tot 6 decimale cijfers).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Of de letters van de lijnen en de cijfers van de rijen rond het bord worden getekend (`1`) of niet (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` met `field` (`size`, `orientation`, `delay` of `coords`): een waarde buiten de toegestane. `invalid_game_id`. `invalid_request`: geen geldige URL-codering.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: deze partij bestaat niet. `gif_disabled`: de server heeft GIF''s uitgeschakeld (`GIF_ENABLED=false`; het `gif`-token wordt teruggegeven).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de limiet `gif`, een renderlimiet, of het accountbudget.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: de GIF kon niet worden gemaakt (de server logt waarom). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` met `retryAfter` (3 tot 10 seconden) en `Retry-After`: de renderwachtrij is vol, of de GIF wachtte `GIF_QUEUE_TIMEOUT_MS` (10 seconden) op een vrije thread; elk limiettoken dat het verzoek nam, wordt teruggegeven. `busy`: de database bleef vergrendeld (`retryAfter: 1` alleen in de body). `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Een geanimeerde GIF maken van een willekeurige partij die als PGN is verstuurd
      description: |-
        Hetzelfde beeld als `GET /games/{id}/gif` voor een willekeurige partij die als PGN-tekst wordt verstuurd: een partij die het spel heeft opgeslagen, een export van een andere site, een met de hand ingetypte partij. Alleen de eerste partij van de tekst wordt gebruikt.

        - De PGN-lezer accepteert wat de eigen lezer van het spel accepteert: elke PGN die deze server schrijft en de gebruikelijke exports van andere sites (commentaar, varianten, NAG's en klokannotaties worden overgeslagen; zetnummers en SAN worden soepel gelezen; een tag `FEN` geeft de beginstelling, tenzij `SetUp` gelijk is aan `"0"`).
        - De namen en ratings komen uit de tags `White`, `Black`, `WhiteElo` en `BlackElo`. Letters met accenten verliezen hun accenten, andere tekens buiten afdrukbare ASCII worden `?`, en lange namen worden ingekort (48 tekens). De uitslag komt uit de tag `Result`, anders van het einde van de zettekst. De tag `Termination` wordt getoond, tenzij die `normal` is: de eindstelling spreekt dan voor zich (mat, pat).
        - Dit endpoint controleert zijn body zelf: een onbekend veld, of een `pgn` die ontbreekt of geen string is, levert 400 `invalid_request` met `field` op; een verkeerde optie levert 400 `invalid_option` op (`delayMs` moet een JSON-getal zijn, `coords` een boolean; `null` wordt geweigerd).

        **Verplichte sessie:** de quota tellen per account. **Limieten:** zoals voor `GET /games/{id}/gif`. **Bodylimiet:** 135.168 bytes, ongeacht `HTTP_BODY_LIMIT` (de PGN als JSON-string, inclusief escapetekens). **Tijdslimiet:** standaard 45 seconden.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Een korte ingetypte partij, zonder coördinaten
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: Een PGN-bestand met alle opties
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` met `field` (een onbekend veld, of `pgn` ontbreekt of is geen string; zonder `field` wanneer de body geen object is); `invalid_json`; `invalid_option` met `field` (`size`, `orientation`, `delayMs` of `coords`); `invalid_pgn` met `line` en `column` (vanaf 1, kolommen in tekens) en de `message` van de lezer: een onreglementaire of dubbelzinnige zet, een kapotte tag, een onbekende schaakvariant, meer dan 65.536 bytes.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: de server heeft GIF''s uitgeschakeld (`GIF_ENABLED=false`; het `gif`-token wordt teruggegeven).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: een body van meer dan 135.168 bytes.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de limiet `gif`, een renderlimiet, of het accountbudget.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: de GIF kon niet worden gemaakt (de server logt waarom). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` met `retryAfter` (3 tot 10 seconden) en `Retry-After`: de renderwachtrij is vol, of de GIF wachtte te lang op een vrije thread; elk limiettoken dat het verzoek nam, wordt teruggegeven. `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /players/{username}:
    get:
      operationId: getPlayer
      tags:
        - players
      summary: Het openbare profiel van een speler opvragen
      description: |-
        Het openbare profiel van een speler: ratings in de officiële categorieën (in de volgorde van de server) en aantallen partijen. `games.total` telt elke opgeslagen partij, vrijblijvende en afgebroken partijen inbegrepen; `games.rated`, `wins`, `draws` en `losses` worden opgeteld over de ratingrecords, dus alleen partijen met rating. Het antwoord is hetzelfde met of zonder token.

        **Limiet:** `public_read` (per speler met een token, per client zonder).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Het profiel.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
              example:
                username: alice
                createdAt: 1790882839743
                ratings:
                  - category: '3+2'
                    rating: 1510
                    provisional: true
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                games:
                  total: 3
                  rated: 2
                  wins: 1
                  draws: 1
                  losses: 0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`: niet 2 tot 24 tekens uit `[A-Za-z0-9_.-]`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: er is een token meegestuurd en het is niet geldig.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: deze speler bestaat niet, of het account is verwijderd.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de limiet `public_read` of het accountbudget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (de database bleef vergrendeld; `retryAfter: 1` in de body, geen `Retry-After`-header), `server_busy` (bij het opzoeken van de sessie was de database vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /players/{username}/games:
    get:
      operationId: listPlayerGames
      tags:
        - players
      summary: De recente partijen van een speler weergeven
      description: |-
        De recente partijen van de speler, nieuwste eerst, per pagina zoals de geschiedenis, maar zonder filters of totaal. `color` is de kleur van deze speler. `next` is de id van de laatste partij telkens wanneer de pagina vol is, dus de volgende pagina kan leeg zijn. De speler wordt eerst opgezocht: een onbekende speler levert 404 op, wat de query ook zegt.

        **Limiet:** `public_read` (per speler met een token, per client zonder).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Eén pagina met partijen van de speler.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerGamesPage'
              example:
                username: alice
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                next: 4100000000001
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_cursor` (`before` is geen partij-id), `invalid_limit` (deze twee zonder `field`).'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: er is een token meegestuurd en het is niet geldig.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: deze speler bestaat niet, of het account is verwijderd.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de limiet `public_read` of het accountbudget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (de database bleef vergrendeld; `retryAfter: 1` in de body, geen `Retry-After`-header), `server_busy` (bij het opzoeken van de sessie was de database vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: De beste spelers van een categorie opvragen
      description: |-
        De 100 hoogste ratingrecords van een officiële categorie met minstens `minGames` (`PROVISIONAL_GAMES`) meegetelde partijen, zonder verwijderde accounts en bevestigde valsspelers. De server berekent elke ranglijst hoogstens elke 10 seconden opnieuw; `updatedAt` zegt wanneer. Per categorie loopt er één berekening tegelijk: intussen krijgen de andere verzoeken de vorige lijst, of wachten ze op de berekening wanneer er nog geen lijst is.

        **Limieten:** alleen de laag per adres.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: De id van een officiële categorie (`3+2`, of `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: Hoeveel spelers, 1 tot 100. Een groter getal van hoogstens 3 cijfers telt als 100; een lege waarde telt als afwezig.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: De ranglijst.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (ontbreekt, of geen officiële categorie), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de laag per adres.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (de database bleef vergrendeld; `retryAfter: 1` in de body, geen `Retry-After`-header), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: De tegenstander van een recente partij melden
      description: |-
        Meldt de tegenstander van een van de eigen partijen van de speler die in de laatste 7 dagen is geëindigd. Een melding verandert nooit uit zichzelf een rating, een sanctie of een integriteitsniveau. Ze verhoogt de beoordelingsprioriteit die moderators zien, en vraagt, behalve bij `abuse`, de engine-analyse van de partij aan.

        Een melding van dezelfde tegenstander voor dezelfde partij krijgt hetzelfde antwoord en verandert niets; het antwoord vertelt nooit iets over het gemelde account. `GET /games/{id}` vertelt de spelers van de partij vooraf of een melding zou worden aangenomen (`reportable`).

        Dit endpoint controleert zijn body zelf, in de volgorde `gameId`, `reported`, `category`, `comment`: een fout levert 400 `invalid_request` zonder `field` op. Velden die het niet kent, worden genegeerd.

        **Limieten:** `reports` (per speler), daarna `REPORTS_PER_DAY` (5) meldingen per speler in 24 uur (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: De melding is ontvangen (of was al ingediend).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (zonder `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: niet de tegenstander van de melder in een partij die in de laatste 7 dagen is geëindigd.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, met een `Retry-After`-header): `REPORTS_PER_DAY` meldingen in de laatste 24 uur. `rate_limited`: de limiet `reports` of het accountbudget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (bij het opzoeken van de sessie was de database vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
