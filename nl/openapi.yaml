      summary: Alle sessies uitloggen
      description: |-
        Trekt alle sessies van het account in, ook deze. De WebSockets die ermee zijn geopend, worden gesloten. Geen body (of `{}`).

        **Limiet:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Alle sessies zijn uitgelogd.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: een andere body dan `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de limiet `sessions` of het accountbudget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (de database bleef vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: De bevestigingslink opnieuw versturen
      description: |-
        Verstuurt de link voor de e-mailbevestiging opnieuw. Het antwoord is 202 `accepted`, ongeacht het adres, zodat het nooit verraadt of een account of een registratie het adres gebruikt.

        Een verzoek heeft hoogstens één keer per 5 minuten per adres effect. Een registratie die met dat adres wacht, krijgt opnieuw haar 24 uur, of een ander account het adres nu gebruikt of niet, zodat de gebruikersnaam in beide gevallen even lang gereserveerd blijft. Een link wordt alleen verstuurd voor die registratie wanneer het adres geen account heeft (een nieuwe link, 24 uur geldig, vervangt de vorige), of voor een actief, onbevestigd account met dat adres.

        **Limieten:** `auth`, daarna `auth_mail` (10 per uur per client).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Geaccepteerd (ongeacht het adres).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de limiet `auth` of `auth_mail` (ongeacht het adres).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` met `retryAfter: 1`: de database bleef vergrendeld terwijl het account werd opgezocht of de link van een onbevestigd account werd opgeslagen (het verlengen van een wachtende registratie gebeurt naar beste vermogen en laat het verzoek nooit mislukken); de 5 minuten van het adres gaan toch in, dus een nieuw verzoek binnen die tijd doet niets. `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Een resetlink voor het wachtwoord versturen
      description: |-
        Verstuurt een resetlink voor het wachtwoord, één uur geldig, die de pagina `/reset-password` opent. Het antwoord is 202 `accepted`, ongeacht het adres. Een link gaat alleen naar een actief account, hoogstens één keer per 5 minuten per adres. Een account dat alleen Google gebruikt, stelt zo zijn eerste wachtwoord in.

        Wachtwoordherstel heeft de strengste limieten van de API, allemaal geteld voor de hele server: 3 verzoeken per uur (`AUTH_FORGOT_PER_HOUR`) en 10 per 24 uur (`AUTH_FORGOT_PER_DAY`) per client (een IPv4-adres of een IPv6-/64-netwerk), 3 keer die aantallen per IPv6-/48-netwerk, bovenop de limiet `auth` (20 per 10 minuten) en de ene mail per adres per 5 minuten. Noch de 202 noch de 429 verraadt of een account het adres gebruikt. Het instellen van het nieuwe wachtwoord heeft een eigen limiet (`auth_reset`).

        **Limieten:** `auth`, `auth_forgot`, daarna `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Geaccepteerd (ongeacht het adres).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de limiet `auth`, `auth_forgot` of `auth_forgot_day` (ongeacht het adres).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` met `retryAfter: 1`: de database bleef vergrendeld terwijl het account werd opgezocht of de link werd opgeslagen; de 5 minuten van het adres gaan toch in, dus een nieuw verzoek binnen die tijd verstuurt geen link. `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Een nieuw wachtwoord instellen met het token van een resetlink
      description: |-
        Stelt een nieuw wachtwoord in met het token van een resetlink (de pagina `/reset-password` doet hetzelfde). Het nieuwe wachtwoord volgt de regels van de registratie.

        De reset heeft deze gevolgen, in één transactie (allemaal of geen enkele): hij trekt alle sessies in en annuleert een openstaande e-mailwijziging; de andere resetlinks van het account werken niet meer; het adres geldt als bevestigd (de link heeft dat bewezen); de eigenaar krijgt een mail. Tweestapsverificatie blijft ongemoeid. Na een fout van de wachtrij voor wachtwoordhashes, een 503 of een 500 is er niets gewijzigd: het oude wachtwoord en de sessies blijven, en de link blijft geldig.

        **Limieten:** `auth`, daarna `auth_reset` (10 per uur per client, 30 per IPv6-/48-netwerk, gedeeld met de pagina: elke poging hasht een wachtwoord).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Het wachtwoord is gewijzigd en alle sessies zijn uitgelogd.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: de link is ongeldig, gebruikt of verlopen, of is gemaild naar een adres dat het account niet meer heeft. `weak_password` (met `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de limiet `auth` of `auth_reset`, of de wachtrij voor wachtwoordhashes.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: de wachtrij voor wachtwoordhashes, of de database bleef vergrendeld (`retryAfter: 1`, er is niets gewijzigd). `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Inloggen met Google starten
      description: |-
        Start een poging om in te loggen met Google voor de PKCE-challenge en de poort van de listener van het spel op `127.0.0.1`. Het antwoord geeft de Google-URL die in de systeembrowser moet worden geopend en de `state` van de poging; de poging is 10 minuten geldig.

        `authUrl` bevat `client_id`, `redirect_uri` (opgebouwd uit `redirectPort` en de origin-tag van de server), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 van de eigen verifier van de server voor Google) met `code_challenge_method=S256`, en `prompt=select_account`. Het spel controleert die URL voordat het hem opent (zie de beschrijving van de sectie).

        **Limiet:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: De poging.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: inloggen met Google wordt op deze server niet aangeboden.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de limiet `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (de database bleef vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Inloggen met Google starten op een website
      description: |-
        Start een poging van een website om in te loggen met Google voor de PKCE-challenge van haar pagina. Het antwoord is hetzelfde als voor het spel: de Google-URL om naartoe te navigeren, en de `state` van de poging; de poging is 10 minuten geldig. Beschikbaar wanneer `GET /info` `sso.googleWeb: true` meldt.

        `authUrl` bevat de `client_id` van de website en `redirect_uri=GOOGLE_WEB_REDIRECT_URI`, met dezelfde overige parameters als voor het spel. De pagina controleert die URL voordat ze ernaartoe navigeert (zie **Op een website** in de beschrijving van de sectie).

        **Limiet:** `sso_start`, gedeeld met de start van het spel.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: De poging.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: een ontbrekende of misvormde `codeChallenge`, of een ander veld (ook `redirectPort`).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: inloggen met Google wordt op deze server niet aangeboden, of niet aan websites.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de limiet `sso_start` (gedeeld met de start van het spel).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (de database bleef vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Het antwoord van Google aan de server doorgeven
      description: |-
        Geeft de `code` en `state` die Google naar de listener van het spel of naar de pagina van de website heeft gestuurd door aan de server, met de id van de poging en de PKCE-verifier. Een poging-id is nutteloos zonder de verifier, en de code is nutteloos zonder de eigen PKCE-verifier en het clientgeheim van de server.

        De server controleert de poging (onbekend, gebruikt of verlopen: 410), daarna de verifier (een onjuiste verifier laat de poging bruikbaar), gebruikt de poging dan één keer, controleert `state` en `iss`, wisselt de code in bij Google en verifieert het ID-token. Het antwoord (200) is een van:

        - `{ token, expiresAt, user }`: ingelogd op het gekoppelde account;
        - `{ mfaRequired, mfaToken, expiresIn }`: ga verder met `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: een nieuw account; ga binnen 10 minuten verder met `POST /auth/sso/complete`. `suggestedUsername` komt van de Google-naam of het adres, en is `""` als niets past;
        - `{ needsPassword, linkTicket, username, expiresIn }`: het account met dat adres heeft een wachtwoord; ga verder met `POST /auth/sso/google/link`. Er is nog niets gekoppeld.

        **Limiet:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Een sessie, een tweede stap, of de volgende stap van een eerste keer inloggen met Google.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Ingelogd op het gekoppelde account
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Tweestapsverificatie staat aan
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Een nieuwe speler
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Een account met een wachtwoord gebruikt het adres
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: de verifier komt niet overeen met de challenge van de poging (de poging blijft bruikbaar). `sso_email_unverified`: Google heeft het adres niet bevestigd. `registration_closed`. `account_disabled`. Alleen voor een gekoppeld account: `banned` (met `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: inloggen met Google wordt op deze server niet aangeboden.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: een actief account zonder wachtwoord gebruikt het adres (het account wordt niet genoemd).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: een onbekende, gebruikte of verlopen poging.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de limiet `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (de database bleef vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Google aan een bestaand account koppelen met het wachtwoord ervan
      description: |-
        Nadat `finish` met `needsPassword` heeft geantwoord: koppelt Google aan het bestaande account met het wachtwoord van dat account, ingetypt in het spel. Het antwoord (200) is een sessie (de koppeling is opgeslagen en de speler is ingelogd), of, wanneer tweestapsverificatie aanstaat, `{ mfaRequired, mfaToken, expiresIn }`: ga verder met `POST /auth/login/mfa`, en de koppeling wordt pas opgeslagen wanneer daar een code wordt geaccepteerd.

        Een onjuist wachtwoord laat het ticket bruikbaar, voor in totaal 5 pogingen. Een poging wordt afgeboekt vlak voordat het wachtwoord wordt gecontroleerd: een 429 `too_many_attempts` of een 428 `pow_required` boekt er geen af, terwijl een weigering van de wachtrij voor wachtwoordhashes (503 `server_busy`, 429 `rate_limited`) er al een heeft afgeboekt en als mislukking van het account telt. De wachttijd na mislukte pogingen gebruikt dezelfde teller als `POST /auth/login`.

        **Limiet:** `auth` (met de telling per IPv6-/48-netwerk). **Proof of work:** zoals bij `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Een sessie, of de tweede stap van het inloggen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: een verkeerd wachtwoord; het ticket blijft bestaan, voor in totaal 5 pogingen.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (met `until`), alleen na een juist wachtwoord.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: inloggen met Google wordt op deze server niet aangeboden.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: het Google-account is intussen aan een ander account gekoppeld.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: een onbekend, gebruikt of verlopen ticket, het 5e verkeerde wachtwoord, een account waarvan de status of het adres sinds `finish` is gewijzigd, of een account waarvan de status, het adres, het wachtwoord of de tweestapsverificatie wijzigde terwijl de koppeling werd opgeslagen. Begin opnieuw met inloggen.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (de wachttijd na mislukte pogingen van het account), of `rate_limited` (de limiet `auth`, de wachtrij voor wachtwoordhashes).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: de wachtrij voor wachtwoordhashes, of de database bleef vergrendeld (`retryAfter: 1`, er is niets gekoppeld). `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Het account aanmaken bij de eerste keer inloggen met Google
      description: |-
        Nadat `finish` met `needsUsername` heeft geantwoord: maakt het account aan met de gekozen gebruikersnaam (de regels van de registratie gelden) en logt het in. Het account heeft geen wachtwoord: `hasPassword` is `false`, en "Wachtwoord vergeten?" (`POST /auth/password/forgot`) geeft het er een.

        **Limiet:** `auth` (met de telling per IPv6-/48-netwerk).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Het account is aangemaakt en ingelogd.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: inloggen met Google wordt op deze server niet aangeboden.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (een account heeft de gebruikersnaam, of een wachtende registratie van een ander adres houdt hem bezet), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: een onbekend, gebruikt of verlopen ticket.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de limiet `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (de database bleef vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Ingelogde apparaten weergeven
      description: |-
        De actieve sessies van het account (ingelogde apparaten), de laatst gebruikte eerst. `current` markeert de sessie die het verzoek doet. `lastSeenAt` wordt hoogstens elke 5 minuten bijgewerkt (later zolang de server ver achterloopt); `expiresAt` is het absolute einde, en de inactiviteitslimiet kan de sessie eerder beëindigen.

        **Limiet:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: De actieve sessies.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de limiet `sessions` of het accountbudget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (de database bleef vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /auth/sessions/{id}:
