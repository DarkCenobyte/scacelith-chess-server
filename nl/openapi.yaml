        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: De limiet `auth` of `auth_reset` (een HTML-pagina), opnieuw het formulier met `Retry-After` wanneer deze client te veel wachtende wachtwoordhashes heeft (de link blijft geldig), of de laag per adres (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'Opnieuw het formulier met `Retry-After` wanneer de server overbelast is (de wachtrij voor wachtwoordhashes, of de database bleef vergrendeld); de link blijft geldig. Wanneer de server ver achterloopt (zie de inleiding), in plaats daarvan een pagina "Server error" (serverfout) met `Retry-After` (2 tot 5): er is niets uitgevoerd en de link blijft geldig. Ook de time-out van de handler.'
