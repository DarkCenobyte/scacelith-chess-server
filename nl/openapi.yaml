        - pages
      summary: Een nieuw wachtwoord instellen via het resetformulier
      description: |-
        Het formulier van de resetpagina; het doet wat `POST /auth/password/reset` doet, in één transactie: elk apparaat wordt uitgelogd, een openstaande e-mailwijziging wordt geannuleerd, de andere resetlinks werken niet meer, het adres geldt als bevestigd en de eigenaar krijgt een mail.

        Eerst wordt de link gecontroleerd, dan of beide wachtwoorden gelijk zijn, dan de wachtwoordregels. Wanneer de server overbelast is, komt het formulier terug met `Retry-After` en blijft de link geldig.

        **Limieten:** `auth`, daarna `auth_reset` (gedeeld met `POST /auth/password/reset`).
