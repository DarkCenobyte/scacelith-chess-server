paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: De naam, versies, poorten en registratieregels van de server opvragen
      description: |-
        Wat een client nodig heeft voordat hij inlogt of verbinding maakt: de naam en id van de server, de versies van het WebSocket-protocol en waar de WebSocket staat, de registratieregels, de officiële speeltempo's en de limieten die een client kan controleren voordat hij een formulier verstuurt.

        **Limieten:** alleen de laag per adres.
      security: []
      responses:
        '200':
          description: De beschrijving van de server.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de laag per adres.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Een account aanmaken
      description: |-
        Maakt een account aan: zodra het e-mailadres is bevestigd met de link die ernaartoe is gestuurd, of meteen zonder e-mailbevestiging.

        **Met e-mailbevestiging** (`REQUIRE_EMAIL_VERIFICATION`, de standaard): 202 `verification_sent`. Er bestaat nog geen account: de registratie wacht 24 uur en reserveert intussen de gebruikersnaam. Een link die die 24 uur geldig is, gaat naar het adres, hoogstens één per adres per 5 minuten (`POST /auth/verify-email/resend` stuurt een nieuwe); het account wordt aangemaakt, met bevestigd adres, wanneer de link wordt gebruikt (de knop van de pagina `/verify-email`), en daarna kan de speler inloggen. Tot dan levert inloggen met die gebruikersnaam `invalid_credentials` op, zoals bij een onbekend account, en bestaat het openbare profiel niet. Een nieuwe registratie met hetzelfde adres vervangt de wachtende. Het antwoord is hetzelfde wanneer een ander account het adres al gebruikt: er wordt dan geen link verstuurd, de eigenaar krijgt in plaats daarvan een bericht (hoogstens één per uur), en de gebruikersnaam wordt op dezelfde manier gereserveerd, zodat niets verraadt of het adres een account heeft. Een registratie waarvan de link niet is gebruikt, vervalt na 24 uur, en de gebruikersnaam is dan weer vrij.

        **Zonder e-mailbevestiging** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, het account wordt meteen aangemaakt en kan inloggen.

        **Regels.** `username`: `USERNAME_MIN` tot `USERNAME_MAX` tekens (3 tot 20), letters, cijfers, `_` en `-`, beginnend met een letter of een cijfer (`GET /info` geeft ze als `limits`); gereserveerde namen (`admin`, `moderator`, `deleted`...) en sommige voorvoegsels worden geweigerd; uniek ongeacht hoofd- of kleine letters. `email`: ontdaan van witruimte aan begin en eind en in kleine letters opgeslagen, gewone ASCII met een domein met een punt. `password`: minstens `PASSWORD_MIN_LENGTH` (10) tekens en hoogstens 256 bytes UTF-8; het mag de gebruikersnaam en het lokale deel van het e-mailadres niet bevatten en mag geen veelgebruikt wachtwoord zijn.

        **Fouten**, gecontroleerd in deze volgorde: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; de fouten van de wachtrij voor wachtwoordhashes; 409 `email_taken` (alleen zonder e-mailbevestiging).

        **Limieten:** `auth`, daarna `auth_register` (10 registraties per uur per client). **Proof of work:** altijd, wanneer `POW_REGISTER_BITS` groter is dan 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Eerste poging, zonder proof of work
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Opnieuw verstuurd met de proof of work
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Het account is aangemaakt en kan inloggen (geen e-mailbevestiging op deze server).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: De registratie wacht op haar bevestigingslink (of het adres heeft al een account; het antwoord verraadt het niet).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (met `field`), `invalid_json`, `invalid_username`, `invalid_email`, of `weak_password` met `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` of `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: de registratie is gesloten op deze server (`GET /info` meldt `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: een account heeft de gebruikersnaam, of een wachtende registratie van een ander adres heeft hem gereserveerd. `email_taken`: een ander account gebruikt het adres (alleen zonder e-mailbevestiging).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de limiet `auth` of `auth_register`, of de wachtrij voor wachtwoordhashes.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (de wachtrij voor wachtwoordhashes, of de database bleef vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Inloggen met een wachtwoord
      description: |-
        Logt in met een gebruikersnaam of e-mailadres en een wachtwoord. Er zijn twee mogelijke antwoorden, beide met status 200: een sessie, of, wanneer tweestapsverificatie aanstaat, een tweede stap die binnen 5 minuten moet worden voltooid met `POST /auth/login/mfa`.

        Een onbekend account, een onjuist wachtwoord en een account zonder wachtwoord krijgen hetzelfde antwoord, na dezelfde tijd: 401 `invalid_credentials`. De accountcontroles (`banned`, `email_unverified`) komen pas na een juist wachtwoord. Vanaf `AUTH_FAILURES_PER_ACCOUNT` (5) mislukkingen op één inlognaam moet elke poging wachten (429 `too_many_attempts`).

        **Limiet:** `auth`. **Proof of work:** alleen tijdens een golf van mislukte inlogpogingen (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Een sessie, of de tweede stap van het inloggen met tweestapsverificatie.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Ingelogd
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Tweestapsverificatie staat aan
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: onbekend account, onjuist wachtwoord, of een account zonder wachtwoord.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Alleen na een juist wachtwoord: `banned`, met `until` (epoch-ms, `null` bij een permanente schorsing), of `email_unverified` (een ouder account waarvan het adres nog niet is bevestigd).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (de wachttijd na mislukte pogingen van deze inlognaam), of `rate_limited` (de limiet `auth`, de wachtrij voor wachtwoordhashes).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (de wachtrij voor wachtwoordhashes, of de database bleef vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Het inloggen voltooien met een tweede factor
      description: |-
        De tweede stap van het inloggen met tweestapsverificatie, nadat `POST /auth/login` of het inloggen met Google (`POST /auth/sso/google/finish` of `POST /auth/sso/google/link`) met `mfaRequired` heeft geantwoord. Stuur `code` (een 6-cijferige authenticatorcode, of een herstelcode) of `recoveryCode`. Een herstelcode die hier wordt gebruikt, is weg.

        Eén stap accepteert hoogstens 5 onjuiste codes; de stap eindigt ook wanneer het wachtwoord wordt gereset of gewijzigd. Na de wachtwoordstap van een Google-koppeling wordt de koppeling pas opgeslagen wanneer de code hier wordt geaccepteerd.

        **Limieten:** `auth`, en hoogstens `AUTH_MFA_PER_ACCOUNT` (10) codes per 15 minuten voor het account, vanaf elk adres; daarboven wordt de code niet gecontroleerd, zodat een herstelcode niet wordt verbruikt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Een authenticatorcode
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Een herstelcode
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Ingelogd.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: noch `code` noch `recoveryCode` is verstuurd, of de body overtreedt het schema; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: de stap is verlopen, is al gebruikt of is beëindigd na 5 onjuiste codes, of het wachtwoord is sinds de eerste stap gereset of gewijzigd (log opnieuw in). `invalid_code`: een onjuiste of al gebruikte code.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (met `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: het Google-account is intussen aan een ander account gekoppeld (alleen na de wachtwoordstap van een Google-koppeling).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: het account is intussen gewijzigd (alleen na de wachtwoordstap van een Google-koppeling); begin opnieuw met inloggen.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: de wachttijd na mislukte pogingen van het account, of de `AUTH_MFA_PER_ACCOUNT` codes van de laatste 15 minuten zijn op. `rate_limited`: de limiet `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` met `retryAfter: 1`: de database bleef vergrendeld (na een stap van een Google-koppeling is er niets gekoppeld: begin opnieuw met inloggen). `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Deze sessie uitloggen
      description: |-
        Trekt de sessie van het gebruikte token in. De WebSocket die ermee is geopend, wordt gesloten. Geen body (of `{}`).

        **Limiet:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Uitgelogd.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: een andere body dan `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de limiet `sessions` of het accountbudget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (de database bleef vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
