          description: '`server_busy` (de database bleef vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Het account, de ratings en de actieve sancties opvragen
      description: |-
        Het account zoals de speler het ziet: de accountweergave (ook de `user` van elk inlogantwoord), één ratingrecord per categorie waarin de speler partijen met rating heeft gespeeld, de actieve sancties en de schorsing. Het integriteitsniveau van het anti-cheatsysteem wordt nooit getoond.

        **Limiet:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Het account.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`, of `invalid_token` (ook wanneer het account is verwijderd).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de limiet `account` of het accountbudget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (de database bleef vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Directe uitdagingen accepteren of weigeren
      description: |-
        Stelt in of andere spelers deze speler bij naam mogen uitdagen. Met `none` worden directe uitdagingen geweigerd: de uitdager krijgt te horen dat de speler niet beschikbaar is. Geen herauthenticatie.

        **Limiet:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: De voorkeuren die nu gelden.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de limiet `account` of het accountbudget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (de database bleef vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Het wachtwoord wijzigen
      description: |-
        Wijzigt het wachtwoord. Het huidige wachtwoord is nodig, maar geen tweede factor, ook niet als tweestapsverificatie aanstaat. Het nieuwe wachtwoord volgt de regels van de registratie (gecontroleerd na het huidige wachtwoord).

        De wijziging heeft deze gevolgen, in één transactie (allemaal of geen enkele): ze trekt elke andere sessie in (deze blijft ingelogd), annuleert een openstaande e-mailwijziging, laat de wachtwoordresetlinks van het account niet meer werken en stuurt de eigenaar een mail.

        **Herauthenticatie:** alleen het wachtwoord. **Limieten:** `reauth`, daarna `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Het wachtwoord is gewijzigd.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (een account dat alleen via Google inlogt), `weak_password` (met `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: een verkeerd huidig wachtwoord, of een wachtwoordreset of -wijziging die plaatsvond terwijl het verzoek werd gecontroleerd.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (mislukte herauthenticaties van het account), of `rate_limited` (de limiet `reauth` of `reauth_user`, het accountbudget, de wachtrij voor wachtwoordhashes).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: de wachtrij voor wachtwoordhashes, of de database bleef vergrendeld (`retryAfter: 1`, er is niets gewijzigd). `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Het inschakelen van tweestapsverificatie starten
      description: |-
        Slaat een nieuw openstaand authenticatorgeheim op, dat een eventueel eerder openstaand geheim vervangt, en geeft het terug voor de authenticator-app (als tekst en als `otpauth://`-URI om als QR-code te tonen). Tweestapsverificatie staat nog niet aan: `POST /account/mfa/totp/enable` schakelt die in met een code van dit geheim.

        **Herauthenticatie:** alleen het wachtwoord. **Limieten:** `reauth`, daarna `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Het openstaande geheim.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (een account dat alleen via Google inlogt), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (gecontroleerd vóór het wachtwoord).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (mislukte herauthenticaties van het account), of `rate_limited` (de limiet `reauth` of `reauth_user`, het accountbudget, de wachtrij voor wachtwoordhashes).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (de wachtrij voor wachtwoordhashes, of de database bleef vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Het inschakelen van tweestapsverificatie voltooien en herstelcodes ontvangen
      description: |-
        Schakelt tweestapsverificatie in met een code van het openstaande geheim (precies 6 cijfers). Hier wordt geen wachtwoord gevraagd; dat is bij het instellen opgegeven. Het antwoord bevat 10 herstelcodes, die alleen deze ene keer worden getoond.

        **Limieten:** `reauth`, daarna `reauth_user`; een verkeerde code telt mee bij de mislukte herauthenticaties van het account.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Tweestapsverificatie staat aan.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` bestaat niet uit precies 6 cijfers, of de body voldoet niet aan het schema; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: een verkeerde code (controleer de tijd van het apparaat).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: geen openstaand geheim (roep eerst `POST /account/mfa/totp/setup` aan).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (mislukte herauthenticaties van het account), of `rate_limited` (de limiet `reauth` of `reauth_user`, het accountbudget).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (de database bleef vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: Tweestapsverificatie uitschakelen
      description: |-
        Schakelt tweestapsverificatie uit. Het geheim en de herstelcodes worden verwijderd, en de eigenaar krijgt een mail.

        **Herauthenticatie:** het wachtwoord en een authenticatorcode of een herstelcode (een van `code` en `recoveryCode` is vereist). **Limieten:** `reauth`, daarna `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Tweestapsverificatie staat uit.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (een account dat alleen via Google inlogt), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required` (noch `code` noch `recoveryCode`, gecontroleerd vóór het wachtwoord), `invalid_password`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (mislukte herauthenticaties, of te veel geprobeerde codes op dit account), of `rate_limited` (de limiet `reauth` of `reauth_user`, het accountbudget, de wachtrij voor wachtwoordhashes).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (de wachtrij voor wachtwoordhashes, of de database bleef vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /account/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags:
        - two-step-verification
      summary: De herstelcodes vervangen
      description: |-
        Vervangt de herstelcodes door 10 nieuwe; de oude werken niet meer.

        **Herauthenticatie:** het wachtwoord en een authenticatorcode in `code` (een herstelcode wordt geweigerd met 403 `invalid_code`). **Limieten:** `reauth`, daarna `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodesRequest'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: De nieuwe herstelcodes, die alleen deze ene keer worden getoond.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - recoveryCodes
                properties:
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (een account dat alleen via Google inlogt), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code` (ook voor een herstelcode).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (mislukte herauthenticaties, of te veel geprobeerde codes op dit account), of `rate_limited` (de limiet `reauth` of `reauth_user`, het accountbudget, de wachtrij voor wachtwoordhashes).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (de wachtrij voor wachtwoordhashes, of de database bleef vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: Het e-mailadres wijzigen
      description: |-
        Wijzigt het e-mailadres van het account. `newEmail` wordt ontdaan van witruimte aan begin en eind en in kleine letters omgezet, en daarna gecontroleerd zoals een adres bij de registratie.

        **Met e-mailbevestiging** (de standaard): 202 `verification_sent`. Een link die 24 uur geldig is, gaat naar het nieuwe adres; hij opent `/confirm-email-change`, en het adres verandert pas wanneer de speler op de knop van die pagina drukt. Tot dan toont `GET /account/me` het nieuwe adres als `pendingEmail`. Een nieuw verzoek vervangt het openstaande; een wijziging of reset van het wachtwoord annuleert het. Er gaat hoogstens één link per 5 minuten naar een bepaald nieuw adres, wie er ook om vraagt (een verzoek voor de wijziging die al openstaat, behoudt de eerder verstuurde link, die geldig blijft); het antwoord is hetzelfde. Het huidige adres krijgt een bericht dat een wijziging naar een gemaskeerd adres (`a***@example.org`) is aangevraagd. Het antwoord en `pendingEmail` zijn hetzelfde wanneer een ander account het nieuwe adres al gebruikt: er wordt dan geen link verstuurd, zodat die wijziging nooit wordt voltooid, en in plaats daarvan krijgt de eigenaar van dat adres een bericht (hoogstens één per uur).

        Wanneer de link wordt bevestigd, verandert het adres en geldt het als bevestigd, blijven de apparaten ingelogd, werken de eerder verstuurde links (bevestiging, wachtwoordreset, andere wijzigingen) niet meer, en wordt het vorige adres op de hoogte gebracht, met het nieuwe adres gemaskeerd.

        **Zonder e-mailbevestiging** (`REQUIRE_EMAIL_VERIFICATION=false`): het adres verandert meteen (200 `email_changed`), en het vorige adres wordt op de hoogte gebracht. Als een ander account het adres gebruikt, is het antwoord 409 `email_taken`, en krijgt de eigenaar van dat adres het bericht.

        **Herauthenticatie:** het wachtwoord en, bij tweestapsverificatie, een authenticatorcode of een herstelcode. `invalid_email` en `same_email` worden vóór het wachtwoord gecontroleerd en tellen dus niet als mislukte poging. **Limieten:** `reauth`, daarna `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Het adres is meteen gewijzigd (geen e-mailbevestiging op deze server).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: Het nieuwe adres, zoals opgeslagen.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: Er is een bevestigingslink naar het nieuwe adres verstuurd (of het adres hoort bij een ander account; het antwoord vertelt dat niet).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email` (het huidige adres van het account), `password_not_set` (een account dat alleen via Google inlogt), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` (ook wanneer een wijziging of reset van het wachtwoord het verzoek inhaalde: er wordt geen link verstuurd), `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: alleen zonder e-mailbevestiging.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (mislukte herauthenticaties, of te veel geprobeerde codes op dit account), of `rate_limited` (de limiet `reauth` of `reauth_user`, het accountbudget, de wachtrij voor wachtwoordhashes).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: de wachtrij voor wachtwoordhashes, of de database bleef vergrendeld (`retryAfter: 1`: er is niets gewijzigd, en hetzelfde verzoek kan opnieuw worden verstuurd). `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: De gegevens van het account downloaden
      description: |-
        Alles wat de server over het account bewaart, als één JSON-bestand om op te slaan (`format` `scacelith-account-export`, `version` 1). De export legt een beveiligingsgebeurtenis vast (`account_exported`). De array `notes` van het document vertelt de speler in eenvoudig Engels wat er is weggelaten.

        **Nooit in de export:** de wachtwoordhash, het geheim van de tweestapsverificatie en de herstelcodes; enig sessie- of linktoken, of een hash daarvan; de gegevens van het anti-cheatsysteem (integriteitsniveau en -score, afwijkingen, de analyse van de partijen, het gewicht van een melding); de meldingen die andere spelers over de speler hebben gedaan; de identiteit van moderators; privégegevens van andere spelers (tegenstanders verschijnen met hun openbare naam en rating, niets verraadt of een andere speler een sanctie kreeg, en er staat geen IP-adres in dat van iemand anders kan zijn).

        **Herauthenticatie:** het wachtwoord en, bij tweestapsverificatie, een authenticatorcode of een herstelcode. **Limieten:** `account_export` (5 per uur per speler, voor de hele server; elke poging telt, mislukte inbegrepen; als eerste gecontroleerd), daarna `reauth` en `reauth_user`. **Tijdslimiet:** 60 seconden.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Het exportdocument, als bijlage.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
