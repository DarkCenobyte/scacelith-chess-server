  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: Het account verwijderen
      description: |-
        Verwijdert het account; dit kan niet ongedaan worden gemaakt.

        - Elke sessie wordt meteen ingetrokken: het token levert vanaf dan 401 `invalid_token` op.
        - De gebruikersnaam wordt `deleted#<id>`, in het account en in elk partijrecord.
        - Gewist worden: het e-mailadres, de wachtwoordhash, het geheim van de tweestapsverificatie en de herstelcodes, de sessies en linktokens, de Google-koppeling, het integriteitsrecord van het anti-cheatsysteem, en de IP-adressen die bij beveiligingsgebeurtenissen zijn opgeslagen.
        - Ratings en partijen blijven bewaard. Partijen blijven leesbaar onder de anonieme naam, en `GET /players/{username}` antwoordt met 404 voor de vorige naam.

        **Herauthenticatie:** het wachtwoord en, bij tweestapsverificatie, een authenticatorcode of een herstelcode. **Limieten:** `reauth`, daarna `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Het account is verwijderd.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (een account dat alleen via Google inlogt), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (mislukte herauthenticaties, of te veel geprobeerde codes op dit account), of `rate_limited` (de limiet `reauth` of `reauth_user`, het accountbudget, de wachtrij voor wachtwoordhashes).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (de wachtrij voor wachtwoordhashes, of de database bleef vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: De partijen van de speler weergeven, gefilterd en per pagina
      description: |-
        De partijen van de ingelogde speler, nieuwste eerst, gefilterd en per pagina, met het aantal partijen dat aan het filter voldoet. Elke queryparameter is optioneel, en een lege waarde telt als afwezig.

        Pagineren: geef de `next` van de vorige pagina mee als `before`; `next` is `null` op de laatste pagina. `total` telt de partijen die aan het filter voldoen, over alle pagina's.

        **Limiet:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: De id van een officiële categorie (`3+2`, of `3%2B2`), of `custom` voor elke partij met een ander speeltempo.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Alleen partijen met rating (`true`) of vrijblijvende partijen (`false`).
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Alleen de gewonnen, verloren of in remise geëindigde partijen, vanuit de speler gezien. Afgebroken partijen verschijnen alleen zonder dit filter.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Eén pagina van de geschiedenis.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` is geen partij-id), `invalid_limit`, of `invalid_filter` (`category`, `rated` of `result`), elk met `field` dat de parameter noemt.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de limiet `account_games` of het accountbudget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (de database bleef vergrendeld; `retryAfter: 1` in de body, geen `Retry-After`-header), `server_busy` (bij het opzoeken van de sessie was de database vergrendeld), `timeout`. Ook `server_busy` met `retryAfter` 2 tot 5 wanneer de server ver achterloopt (zie de inleiding): het verzoek is niet uitgevoerd.'
  /games/{id}:
    get:
      operationId: getGame
      tags:
        - games
      summary: Een partijrecord met zetten en klokstanden opvragen
      description: |-
        Eén partijrecord, met zetten en klokstanden. Zonder token, of met het token van een speler die de partij niet speelde, is het antwoord het openbare. Wanneer de speler van het token de partij speelde, voegt het antwoord `you` en `reportable` toe.

        **Limiet:** `public_read` (per speler met een token, per client zonder).
      security:
