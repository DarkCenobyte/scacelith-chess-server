      summary: Het nieuwe e-mailadres bevestigen
      description: |-
        Het formulier van de pagina voor de e-mailwijziging. Het adres verandert en geldt als bevestigd; de apparaten blijven ingelogd; de eerder verstuurde links (bevestiging, wachtwoordreset, andere wijzigingen) werken niet meer; het vorige adres wordt op de hoogte gebracht, met het nieuwe adres gemaskeerd.

        **Limiet:** `auth`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: lZ50AvPxUwbGqQCwWPIO28ONray7SzW0Cl_sLImwF3Q
          application/json:
            schema:
              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: lZ50AvPxUwbGqQCwWPIO28ONray7SzW0Cl_sLImwF3Q
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Het adres is gewijzigd.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: De link is ongeldig, gebruikt of verlopen, of het formulier is ongeldig (een HTML-pagina).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '409':
          $ref: '#/components/responses/HtmlConflict'
          description: Een ander account heeft het adres intussen ingenomen (een HTML-pagina).
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: De limiet `auth` (een HTML-pagina), of de laag per adres (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'De database bleef vergrendeld (`Retry-After: 1`), of de server loopt ver achter (`Retry-After` 2 tot 5, zie de inleiding): er is niets gewijzigd en de link werkt nog. Ook de time-out van de handler.'
  /healthz:
    servers:
      - url: https://caissa.scacelith.com
        description: De officiële server, in de root.
      - url: https://caissa.scacelith.com/api/v1
        description: De officiële server, onder `/api/v1`.
      - url: https://{host}:{port}
        description: Elke Scacelith-server, in de root.
        variables:
          host:
            default: caissa.scacelith.com
            description: De openbare hostnaam van de server (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: De openbare API-poort (`PUBLIC_API_PORT`, anders `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Elke Scacelith-server, onder `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: De openbare hostnaam van de server (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: De openbare API-poort (`PUBLIC_API_PORT`, anders `API_PORT`).
    get:
      operationId: getLiveness
      tags:
        - health
      summary: Controleren of het proces draait
      description: |-
        Antwoordt met 200 `ok` zolang het proces draait. `HEAD` werkt ook. Elke andere methode levert 405 `method_not_allowed` op met `Allow: GET, HEAD` (`OPTIONS` inbegrepen).

        **Limieten:** alleen de laag per adres.
      security: []
      responses:
        '200':
          description: Het proces draait.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
              example:
                status: ok
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de laag per adres.'
  /readyz:
    servers:
      - url: https://caissa.scacelith.com
        description: De officiële server, in de root.
      - url: https://caissa.scacelith.com/api/v1
        description: De officiële server, onder `/api/v1`.
      - url: https://{host}:{port}
        description: Elke Scacelith-server, in de root.
        variables:
          host:
            default: caissa.scacelith.com
            description: De openbare hostnaam van de server (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: De openbare API-poort (`PUBLIC_API_PORT`, anders `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Elke Scacelith-server, onder `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: De openbare hostnaam van de server (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: De openbare API-poort (`PUBLIC_API_PORT`, anders `API_PORT`).
    get:
      operationId: getReadiness
      tags:
        - health
      summary: Controleren of de server spelers accepteert
      description: |-
        Antwoordt met 200 `ready` wanneer de server spelers accepteert, en 503 `not_ready` terwijl hij start of stopt. `HEAD` werkt ook. Elke andere methode levert 405 `method_not_allowed` op met `Allow: GET, HEAD` (`OPTIONS` inbegrepen).

        **Limieten:** alleen de laag per adres.
      security: []
      responses:
        '200':
          description: De server accepteert spelers.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: de laag per adres.'
        '503':
          description: De server is aan het starten of stoppen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Een sessietoken (`sct_` gevolgd door 43 base64url-tekens) uit een inlogantwoord, in de `Authorization`-header: `Authorization: Bearer <token>`. Het prefix is precies `Bearer` (hoofdlettergevoelig) en één spatie; een waarde zonder dat prefix, of een token dat niet uit 1 tot 512 afdrukbare ASCII-tekens bestaat, levert 401 `invalid_token` op, net als elk ander ongeldig token. Een lege header telt als geen header.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: De partij-id, een positief decimaal geheel getal van hoogstens 16 cijfers zonder voorloopnullen, onder 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: De sessie-id, zoals `GET /auth/sessions` die geeft, geschreven zonder voorloopnullen (`03` is niet sessie 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: De gebruikersnaam van de speler, ongeacht hoofd- of kleine letters. De server accepteert elke naam van 2 tot 24 tekens uit `[A-Za-z0-9_.-]` (de ruimste regel die hij ooit toestond).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Een partij-id; alleen oudere partijen worden weergegeven. Geef de `next` van de vorige pagina mee. Een lege waarde telt als afwezig.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: De paginagrootte, 1 tot 50. Een groter getal van hoogstens 3 cijfers telt als 50; een lege waarde telt als afwezig.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: Het token van de e-maillink (43 base64url-tekens). Een ontbrekend of verkeerd token toont de pagina "link invalid or expired" (link ongeldig of verlopen).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Elk antwoord van de server verbiedt caching.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Seconden om te wachten voor een nieuwe poging; dezelfde waarde als `retryAfter` in de body.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: De bearer-challenge, met `error="invalid_token"` voor een ongeldig token.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: De server sluit de verbinding na dit antwoord.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (met `field` wanneer een veld van de body de fout veroorzaakt) of `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Een veld voldoet niet aan het schema
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: De body is geen JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Een zwak wachtwoord
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: Een PGN die niet kan worden gelezen
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (geen `Authorization`-header) of `invalid_token` (het token is misvormd, verlopen, ingetrokken, of hoort bij een verwijderd account).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Geen sessie
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Een ongeldig token
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Het verzoek wordt geweigerd.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Een verkeerd wachtwoord bij herauthenticatie
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Een geschorst account
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found`, of een functie die deze server heeft uitgeschakeld.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: de body is niet binnen 10 seconden aangekomen. De server sluit de verbinding.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Het verzoek is in strijd met de toestand van de server.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: de Google-inlogpoging of het ticket is onbekend, gebruikt of verlopen; begin opnieuw met inloggen.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: de body overschrijdt `HTTP_BODY_LIMIT` (standaard 16.384 bytes). De server sluit de verbinding.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: het verzoekdoel is langer dan 4096 tekens.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: de body is geen `application/json`, of de charset ervan is geen UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: de partij heeft meer dan `GIF_MAX_PLIES` (600) halve zetten.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: los de `pow`-challenge op en verstuur hetzelfde verzoek opnieuw met `pow: { challenge, nonce }`. `reason` zegt waarom: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` of `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (een rate limit, het accountbudget, of de wachtrij voor wachtwoordhashes) of `too_many_attempts` (een beperking van het account), met `retryAfter` en een `Retry-After`-header.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Een rate limit
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Te veel mislukte pogingen op dit account
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: een onverwachte fout. De server logt die.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: een verkeerde `state` of `iss`, of Google weigerde de code of stuurde een ID-token dat de verificatie niet doorstaat (inclusief een code of ID-token van de andere client, die van het spel of die van de website). De fout bevat nooit de tekst van Google.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` of `timeout`: probeer het opnieuw na `retryAfter` wanneer die is opgegeven.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: De server is overbelast
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: De database bleef vergrendeld (een leesbewerking)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: De server deed er te lang over
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: De geanimeerde GIF, als bijlage.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` voor een partij van deze server, `attachment; filename="scacelith-game.gif"` voor een PGN die met `POST /gif` is verstuurd.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: De grootte van het bestand in bytes.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: Een HTML-pagina.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: Een HTML-pagina die de weigering uitlegt.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Het formulier is niet binnen 10 seconden aangekomen (een HTML-pagina). De server sluit de verbinding.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: Een HTML-pagina die het conflict uitlegt.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Het formulier overschrijdt `HTTP_BODY_LIMIT` (een HTML-pagina). De server sluit de verbinding.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: De body is geen formulier (`application/x-www-form-urlencoded`) en geen JSON, of de charset ervan is geen UTF-8 (een HTML-pagina).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Een rate limit (een HTML-pagina), met `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Een onverwachte fout, als HTML-pagina met de titel "Server error" (serverfout). De server logt die.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: De server is overbelast (de database bleef vergrendeld, of de server loopt ver achter; met `Retry-After`) of deed er te lang over, als HTML-pagina met de titel "Server error" (serverfout).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: De enige vorm van elk foutantwoord van de JSON-API.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: De foutcode in `snake_case`. Een client kiest op basis daarvan wat hij toont.
          examples:
            - rate_limited
        message:
          type: string
          description: Een Engelse zin, bedoeld voor logs en als terugvaloptie.
        retryAfter:
          type: integer
          minimum: 1
          description: Seconden om te wachten voor een nieuwe poging, alleen aanwezig bij weigeringen die na verloop van tijd aflopen. Het antwoord bevat dan ook een `Retry-After`-header met dezelfde waarde, behalve bij de 503 `busy` van de leesbewerkingen voor geschiedenis, partijen, spelers en ranglijst.
        field:
          type: string
          description: Het veld of de queryparameter die de fout veroorzaakt (`invalid_request`, `invalid_option`, en `invalid_cursor`, `invalid_limit` en `invalid_filter` van `GET /account/games`). Een genest veld wordt met punten geschreven (`pow.nonce`).
        reason:
          type: string
          description: 'Waarom: de regel die een `weak_password` overtreedt, of waarom een proof of work werd gevraagd of geweigerd (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Alleen `banned`: het einde van de schorsing (epoch-ms), `null` voor een permanente schorsing.'
        line:
          type: integer
          minimum: 1
          description: 'Alleen `invalid_pgn`: de regel van de fout, vanaf 1.'
        column:
          type: integer
          minimum: 1
          description: 'Alleen `invalid_pgn`: de kolom van de fout, vanaf 1, in tekens.'
    PowChallenge:
      type: object
      description: Een proof-of-work-challenge (de `pow` van een 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: De ondertekende challenge, om ongewijzigd terug te sturen.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Het aantal voorloopnulbits dat `SHA-256(challenge + ":" + nonce)` moet hebben.
        expiresAt:
          type: integer
          format: int64
          description: Wanneer de challenge verloopt (epoch-ms), 2 minuten na de uitgifte.
    PowAnswer:
      type: object
      description: Het antwoord op een proof-of-work-challenge.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: De `challenge` van het 428-antwoord, zoals die is gegeven.
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Een decimale string van hoogstens 20 cijfers waarvoor `SHA-256(challenge + ":" + nonce)` met `bits` nulbits begint.
    ServerInfo:
      type: object
      description: Wat een client nodig heeft voordat hij inlogt of verbinding maakt.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: De naam van de server (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: Een UUID die de database bij de eerste start krijgt. Hij blijft hetzelfde bij herstarts. Hij is `null` wanneer de database hem niet kan geven.
        motd:
          type: string
          description: Het bericht van de dag (`SERVER_MOTD`), mogelijk leeg.
        protocol:
          type: object
          description: Het WebSocket-protocol (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: De oudste protocolversie die de server spreekt.
            max:
              type: integer
              minimum: 1
              description: De nieuwste protocolversie die de server spreekt.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'De vingerafdruk van het protocolschema (de eerste 4 bytes van de SHA-256 van de canonieke vorm ervan, als geheel getal zonder teken: `0xc649140f`, 3326678031, voor protocol-minorversie 2); ter informatie, wordt nooit vergeleken.'
            subprotocol:
              type: string
              description: Het WebSocket-subprotocoltoken (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: De WebSocket-poort die spelers gebruiken (`PUBLIC_WS_PORT`, anders `WS_PORT`, anders `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: Het pad van de WebSocket.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Of er nieuwe accounts kunnen worden aangemaakt.
        emailVerification:
          type: boolean
          description: Of nieuwe accounts hun adres bevestigen (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Of inloggen met Google aan het spel wordt aangeboden.
            googleWeb:
              type: boolean
              description: Of inloggen met Google ook aan een website wordt aangeboden (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: Tweestapsverificatie is altijd beschikbaar.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: De proof-of-work-bits die de registratie vereist (0 voor geen).
        categories:
          type: array
          description: De officiële speeltempo's, met rating (`RATED_CATEGORIES`), in de volgorde van de server. Elk ander speeltempo is `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: De regels die een client kan controleren voordat hij een formulier verstuurt.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: De kortste gebruikersnaam (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: De langste gebruikersnaam (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: De reguliere expressie waaraan een nieuwe gebruikersnaam moet voldoen.
            passwordMinLength:
              type: integer
              description: Het kortste wachtwoord, in tekens (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Het langste wachtwoord, in bytes UTF-8.
            customTimeControls:
              type: boolean
              description: Of uitdagingen en privépartijen een aangepast speeltempo mogen gebruiken.
            reportsPerDay:
              type: integer
              description: Hoeveel meldingen een speler per 24 uur mag indienen (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Het grootste WebSocket-bericht dat een client mag versturen, in bytes.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Een officieel speeltempo.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: De categorie-id, minuten en incrementseconden (`3+2`).
        baseSec:
          type: number
          minimum: 0
          description: De basistijd, in seconden.
        incSec:
          type: number
          minimum: 0
          description: Het increment per zet, in seconden.
    AccountView:
      type: object
      description: Het account zoals de speler het ziet (`user` van de inlogantwoorden en van `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: De account-id.
        username:
          type: string
          description: De gebruikersnaam.
        email:
          type: string
          format: email
          description: Het e-mailadres.
        emailVerified:
          type: boolean
          description: Of het adres is bevestigd.
        mfaEnabled:
          type: boolean
          description: Of tweestapsverificatie aanstaat.
        googleLinked:
          type: boolean
          description: Of er een Google-account is gekoppeld.
        hasPassword:
          type: boolean
          description: '`false` voor een account dat via Google is aangemaakt en nog geen wachtwoord heeft ingesteld.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Of directe uitdagingen bij naam worden geaccepteerd (zie `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Wanneer het account is aangemaakt (epoch-ms).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: De laatste keer inloggen (epoch-ms), of `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Het nieuwe adres van een e-mailwijziging die nog op de link wacht, of `null`.
    SessionAnswer:
      type: object
      description: Een nieuwe sessie.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Het sessietoken, voor de `Authorization`-header en de WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: Het absolute einde van de sessie (epoch-ms); de inactiviteitslimiet kan de sessie eerder beëindigen.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: De tweede stap van het inloggen met tweestapsverificatie; ga verder met `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Het token van de stap, voor `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Resterende seconden om de stap te voltooien.
    LoginAnswer:
      description: Een sessie, of de tweede stap van het inloggen met tweestapsverificatie.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Een eerste keer inloggen met Google; ga verder met `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Het ticket voor `POST /auth/sso/complete`, 10 minuten geldig.
        suggestedUsername:
          type: string
          description: Een gebruikersnaam gemaakt van de Google-naam of het adres, of `""` wanneer niets past.
    SsoNeedsPassword:
      type: object
      description: Een account met een wachtwoord gebruikt het adres; ga verder met `POST /auth/sso/google/link`. Er is nog niets gekoppeld.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Het ticket voor `POST /auth/sso/google/link`.
        username:
          type: string
          description: De gebruikersnaam van dat account (alleen iemand die het adres aan Google heeft bewezen, ziet hem).
        expiresIn:
          type: integer
          const: 600
          description: Seconden dat het ticket geldig blijft.
    SsoFinishAnswer:
      description: Het antwoord van `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Een Google-inlogpoging.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: De poging, voor `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: De Google-URL om in de systeembrowser te openen, na controle.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: De `state` die Google moet terugsturen.
        expiresIn:
          type: integer
          const: 600
          description: Seconden dat de poging geldig blijft.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: De gebruikersnaam; daarna gelden de regels van de server (zie de beschrijving).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Het e-mailadres. Ontdaan van witruimte aan begin en eind en in kleine letters opgeslagen.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Het wachtwoord; daarna gelden de wachtwoordregels.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: De gebruikersnaam, of het e-mailadres (elke tekst met `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Optioneel. Getoond in de lijst met ingelogde apparaten (zoals `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: Het `mfaToken` van het inlogantwoord (of van het antwoord bij inloggen met Google).
        code:
          type: string
          maxLength: 32
          description: Optioneel. Een 6-cijferige authenticatorcode, of een herstelcode.
        recoveryCode:
          type: string
          maxLength: 32
          description: Optioneel. Een herstelcode. Een van `code` en `recoveryCode` is nodig.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Het e-mailadres.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: De parameter `token` van de resetlink.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Het nieuwe wachtwoord; de wachtwoordregels van de registratie gelden.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: De S256-PKCE-challenge van de `codeVerifier` van de client (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: De poort van de listener van de client op `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: De S256-PKCE-challenge van de `codeVerifier` van de pagina (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: De `attemptId` van `POST /auth/sso/google/start`.
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: De PKCE-verifier; de SHA-256 ervan moet overeenkomen met de challenge die aan `start` is gegeven.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: De `state` zoals Google die heeft teruggestuurd.
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: De `code` zoals Google die heeft teruggestuurd (afdrukbare ASCII zonder spaties).
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Optioneel. De `iss` zoals Google die heeft teruggestuurd, als dat zo is.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: Het `linkTicket` van `finish`, 10 minuten geldig.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Het wachtwoord van het account.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: Het `ssoTicket` van `finish`, 10 minuten geldig.
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: De gebruikersnaam; de regels van de registratie gelden.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: De actieve sessies, de laatst gebruikte eerst.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Een actieve sessie (een ingelogd apparaat).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: De sessie-id, voor `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: Het moment van inloggen (epoch-ms).
        lastSeenAt:
          type: integer
          format: int64
          description: Het laatste gebruik (epoch-ms), hoogstens elke 5 minuten bijgewerkt (later zolang de server ver achterloopt).
        expiresAt:
          type: integer
          format: int64
          description: Het absolute einde (epoch-ms); de inactiviteitslimiet kan de sessie eerder beëindigen.
        clientLabel:
          type:
            - string
            - 'null'
          description: Het `clientLabel` van het inloggen, of `null` wanneer er geen is meegestuurd.
        current:
          type: boolean
          description: Of dit de sessie is die het verzoek doet.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Eén record per categorie waarin de speler partijen met rating heeft gespeeld.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: De actieve sancties.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }` zolang het account geschorst is, anders `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Het ratingrecord van één categorie.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: De categorie-id.
        rating:
          type: integer
          description: De rating.
        games:
          type: integer
          minimum: 0
          description: De partijen die in de categorie zijn gespeeld (meegeteld of niet).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: De hoogste bereikte rating.
        provisional:
          type: boolean
          description: '`true` zolang de rating nog in de fase zonder rating is of minder dan `PROVISIONAL_GAMES` meegetelde partijen heeft (het spel toont hem als `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Het soort sanctie.
        reason:
          type:
            - string
            - 'null'
          description: De opgegeven reden, als die er is.
        startsAt:
          type: integer
          format: int64
          description: Het begin (epoch-ms).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Het einde (epoch-ms), `null` wanneer de sanctie permanent is.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Het einde van de schorsing (epoch-ms), `null` wanneer die permanent is.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` om directe uitdagingen bij naam te accepteren, `none` om ze te weigeren.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Het huidige wachtwoord.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Het nieuwe wachtwoord; de wachtwoordregels van de registratie gelden.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Het wachtwoord van het account.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Een code van het openstaande geheim, precies 6 cijfers.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Het wachtwoord van het account.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Optioneel; nodig bij tweestapsverificatie (of `recoveryCode`). Een authenticatorcode, of een herstelcode.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Optioneel. Een herstelcode (`xxxx-xxxx-xx`; hoofd- en kleine letters, spaties en streepjes maken niet uit).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Het wachtwoord van het account.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Een authenticatorcode (een herstelcode wordt geweigerd).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Het nieuwe adres; ontdaan van witruimte aan begin en eind en in kleine letters omgezet, daarna gecontroleerd zoals een adres bij de registratie.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Het wachtwoord van het account.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Optioneel; nodig bij tweestapsverificatie (of `recoveryCode`). Een authenticatorcode, of een herstelcode.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Optioneel. Een herstelcode.
    TotpSetup:
      type: object
      description: Het openstaande geheim voor de authenticator-app.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Het geheim in base32, om in de app in te typen.
        uri:
          type: string
          format: uri
          description: De URI `otpauth://totp/...`, om als QR-code te tonen.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Seconden per stap.
    RecoveryCodeList:
      type: array
      description: De 10 herstelcodes, die alleen deze ene keer worden getoond. Elke code werkt één keer.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Eén kant van een partij.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: De naam in het partijrecord (`deleted#<id>` voor een verwijderd account).
        rating:
          type:
            - integer
            - 'null'
          description: De rating bij de start, `null` wanneer onbekend.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: De rating na de partij. Een partij met rating heeft die altijd; `null` alleen voor een partij die niet meetelt voor de ratings (vrijblijvend, aangepast speeltempo, afgebroken).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: De ratingwijziging, `0` wanneer de ratingregels de rating laten waar hij was (de FIDE-regel bij een nulscore, een tegenstander zonder rating, de eerste partijen van een speler zonder rating); `null` zoals bij `ratingAfter`.
    GameSummary:
      type: object
      description: De samenvatting van een opgeslagen partij.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: De partij-id.
        category:
          type: string
          description: De id van de officiële categorie (`3+2`), of `custom`.
        rated:
          type: boolean
          description: Of de partij meetelt voor de ratings.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Het speeltempo in seconden (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (zie de partijcodes).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: De code van de reden van beëindiging (zie de partijcodes).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: De uitslag, `*` voor een afgebroken partij.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Het aantal halve zetten.
        startedAt:
          type: integer
          format: int64
          description: Het begin (epoch-ms).
        endedAt:
          type: integer
          format: int64
          description: Het einde (epoch-ms).
    Termination:
      type: string
      description: De naam van de reden van beëindiging (zie de partijcodes); `Unknown` voor een code die het protocol niet kent.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Een partijsamenvatting vanuit één speler gezien.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: De kleur van de speler.
    HistoryGameSummary:
      description: Een partij uit de geschiedenis van de ingelogde speler.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: De basistijd in milliseconden.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Het increment in milliseconden.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: De uitkomst vanuit de speler gezien.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: De partijen van de pagina, nieuwste eerst.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: De id om als `before` mee te geven voor de volgende pagina, of `null` op de laatste pagina.
        total:
          type: integer
          minimum: 0
          description: Het aantal partijen dat aan het filter voldoet, over alle pagina's.
    MoveRecord:
      type: object
      description: Eén halve zet van een partij.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: De zet in UCI-notatie, met `n`, `b`, `r` of `q` erachter voor een promotie.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: De tijd die voor de zet is aangerekend (ms), `null` wanneer het record die niet heeft.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: De klok van de speler die de zet deed, na de zet (ms), `null` wanneer het record die niet heeft.
    PgnTagsView:
      type: object
      description: De belangrijkste PGN-tags, om te tonen. `Termination` is hier de naam van de reden van beëindiging; het PGN-bestand gebruikt de standaardwaarden van PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` of `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: De startdatum in UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: De rating bij de start, of `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: De rating bij de start, of `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Een partijrecord met zetten en klokstanden. Het heeft de velden van een partijsamenvatting, zonder `color` en `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: De basistijd in milliseconden.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Het increment in milliseconden.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: De naam van `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: De id van de partij waarvan deze partij de revanche is, of `null`.
            moves:
              type: array
              description: Eén item per halve zet.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Alleen wanneer de speler van het token deze partij speelde; de kleur van die speler.
            reportable:
              type: boolean
              description: Alleen wanneer de speler van het token deze partij speelde; `true` wanneer `POST /reports` nu een melding van de tegenstander voor deze partij zou aannemen (de partij is binnen 7 dagen geëindigd, het dagquotum is niet opgebruikt, en de tegenstander is voor deze partij nog niet gemeld).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: De gebruikersnaam, zoals de speler hem schreef.
        createdAt:
          type: integer
          format: int64
          description: Wanneer het account is aangemaakt (epoch-ms).
        ratings:
          type: array
          description: Alleen de officiële categorieën, in de volgorde van de server.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Elke opgeslagen partij, vrijblijvende en afgebroken partijen inbegrepen.
            rated:
              type: integer
              minimum: 0
              description: Partijen met rating, opgeteld over de ratingrecords.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: De gebruikersnaam, zoals de speler hem schreef.
        games:
          type: array
          description: De partijen van de pagina, nieuwste eerst.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: De id van de laatste partij telkens wanneer de pagina vol is (de volgende pagina kan dan leeg zijn), anders `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: De categorie-id.
        minGames:
          type: integer
          minimum: 0
          description: Het aantal meegetelde partijen dat een record nodig heeft om in de lijst te staan (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Wanneer de ranglijst is berekend (epoch-ms).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: De PGN-tekst, hoogstens 65.536 bytes UTF-8. Alleen de eerste partij wordt gebruikt.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Optioneel. De beeldgrootte.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Optioneel. De kleur die onderaan het bord staat.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Optioneel. Milliseconden per zet, een JSON-getal met een gehele waarde.
        coords:
          type: boolean
          default: true
          description: Optioneel. Of de letters van de lijnen en de cijfers van de rijen rond het bord worden getekend.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: De partij, als geheel getal of als string van 1 tot 16 cijfers.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: De gebruikersnaam van de tegenstander, zoals in het partijrecord of zoals hij nu is, ongeacht hoofd- of kleine letters. Hij mag niet leeg zijn.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Waar de melding over gaat.
        comment:
          type:
            - string
            - 'null'
          description: Optioneel. Hoogstens 500 tekens nadat stuurtekens (behalve tab en regelinvoer) zijn verwijderd en de tekst is ontdaan van witruimte aan begin en eind.
    AccountExport:
      type: object
      description: Alles wat de server over het account bewaart (tijden in epoch-ms).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Wanneer de export is gemaakt.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Wat het bestand bevat en weglaat, in eenvoudig Engels voor de speler.
          items:
            type: string
        account:
          description: De accountweergave van `GET /account/me`, met `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Het adres van het gekoppelde Google-account, of `null`.
        ratings:
          type: array
          description: De volledige ratingrecords.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Ratingpunten die zijn teruggegeven nadat een tegenstander op valsspelen werd betrapt, opgeteld per UTC-dag en categorie, nieuwste eerst. Noch de partijen, noch de valsspelers worden genoemd.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Elke opgeslagen sessie, nieuwste eerst, zonder enig token. De retentie-opschoning verwijdert een verlopen sessie, en een uitgelogde sessie een dag na het uitloggen.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: De beveiligingsgebeurtenissen, nieuwste eerst, bewaard gedurende `RETENTION_SECURITY_DAYS` dagen.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Elke sanctie, opgeheven sancties inbegrepen. De naam van de moderator wordt nooit vermeld.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: De gedragsgebeurtenissen die zijn vastgelegd voor verlaten en afgebroken partijen van de speler en voor partijen zonder eerste zet, 30 dagen bewaard.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: De meldingen die de speler heeft gedaan.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Het aantal partijen.
            list:
              type: array
              description: Elke partij, nieuwste eerst, als samenvattingen van `GET /account/games`. De zetten staan bij `GET /games/{id}` en de PGN bij `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Een volledig ratingrecord.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Of de speler de fase zonder rating heeft verlaten.
            countedGames:
              type: integer
              minimum: 0
              description: De partijen die in de rating zijn meegeteld.
            updatedAt:
              type: integer
              format: int64
              description: Wanneer het record voor het laatst is gewijzigd.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: 00:00 UTC van de dag (epoch-ms).
        category:
          type: string
        points:
          type: integer
          description: De punten die die dag in die categorie zijn teruggegeven.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Wanneer de sessie is uitgelogd, of `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Het adres van waaruit is ingelogd, gewist na `RETENTION_IP_DAYS` dagen.
    SecurityEvent:
      type: object
      description: |-
        Een beveiligingsgebeurtenis. `ip` wordt alleen gegeven voor wat in ingelogde toestand is gedaan, met het wachtwoord van het account (en de tweede factor) of met een link die naar het adres ervan is gemaild: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` en `account_exported`; elke andere soort heeft `ip: null`, en `ip` wordt gewist na `RETENTION_IP_DAYS` dagen.

        `detail` bewaart alleen deze velden: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` en `method` (`password`, of `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` en `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Een gebeurtenis `moderator_action` bewaart alleen `{ action }`, voor de acties `ban`, `unban`, `reset_mfa`, `verify_email` en `revoke_sessions` (de andere moderatoracties worden weggelaten). Elke andere soort heeft `detail: null`. De gebeurtenissen `rating_refund` worden weggelaten: hun punten staan in `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: De soort gebeurtenis (`login`, `password_changed`...).
        at:
          type: integer
          format: int64
          description: Wanneer het gebeurde.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
