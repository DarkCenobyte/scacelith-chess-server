        Вимикає двофакторну автентифікацію. Секрет і коди відновлення видаляються, а власник отримує лист.

        **Повторна автентифікація:** пароль і код автентифікатора або код відновлення (потрібне одне з полів `code` чи `recoveryCode`). **Ліміти:** `reauth`, потім `reauth_user`.
      security:
