      summary: Показати сторінку підтвердження зміни адреси електронної пошти
      description: |-
        Сторінка посилання для зміни адреси електронної пошти: вона показує нову адресу й ім’я облікового запису та кнопку "Use this e-mail address" (використовувати цю адресу електронної пошти), яка надсилає форму на `POST /confirm-email-change`.

        **Ліміт:** `page`.
      security: []
      parameters:
        - $ref: '#/components/parameters/LinkTokenQuery'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Сторінка з новою адресою та кнопкою її підтвердження.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Посилання недійсне або прострочене (також коли адреса облікового запису змінилася після запиту).
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Ліміт `page` (HTML-сторінка) або рівень обмежень за адресою (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
    post:
      operationId: submitConfirmEmailChangePage
      tags:
        - pages
      summary: Підтвердити нову адресу електронної пошти
      description: |-
        Форма сторінки зміни адреси електронної пошти. Адреса змінюється й вважається підтвердженою; сеанси на пристроях залишаються активними; надіслані раніше посилання (підтвердження, скидання пароля, інші зміни) перестають діяти; на попередню адресу надходить повідомлення із замаскованою новою адресою.

        **Ліміт:** `auth`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: lZ50AvPxUwbGqQCwWPIO28ONray7SzW0Cl_sLImwF3Q
          application/json:
            schema:
              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: lZ50AvPxUwbGqQCwWPIO28ONray7SzW0Cl_sLImwF3Q
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Адресу змінено.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Посилання недійсне, уже використане чи прострочене, або форма некоректна (HTML-сторінка).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '409':
          $ref: '#/components/responses/HtmlConflict'
          description: Тим часом адресу зайняв інший обліковий запис (HTML-сторінка).
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Ліміт `auth` (HTML-сторінка) або рівень обмежень за адресою (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'База даних залишалася заблокованою (`Retry-After: 1`): нічого не змінено, і посилання досі діє. Також тайм-аут обробника.'
  /healthz:
    servers:
      - url: https://caissa.scacelith.com
        description: Офіційний сервер, у корені.
      - url: https://caissa.scacelith.com/api/v1
        description: Офіційний сервер, під `/api/v1`.
      - url: https://{host}:{port}
        description: Будь-який сервер Scacelith, у корені.
        variables:
          host:
            default: caissa.scacelith.com
            description: Публічне ім’я хоста сервера (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Публічний порт API (`PUBLIC_API_PORT`, а якщо його не задано — `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Будь-який сервер Scacelith, під `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: Публічне ім’я хоста сервера (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Публічний порт API (`PUBLIC_API_PORT`, а якщо його не задано — `API_PORT`).
    get:
      operationId: getLiveness
      tags:
        - health
      summary: Перевірити, що процес працює
      description: |-
        Відповідає 200 `ok`, поки процес працює. `HEAD` також підтримується. На будь-який інший метод (зокрема `OPTIONS`) відповідь — 405 `method_not_allowed` з `Allow: GET, HEAD`.

        **Ліміти:** лише рівень обмежень за адресою.
      security: []
      responses:
        '200':
          description: Процес працює.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
              example:
                status: ok
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: рівень обмежень за адресою.'
  /readyz:
    servers:
      - url: https://caissa.scacelith.com
        description: Офіційний сервер, у корені.
      - url: https://caissa.scacelith.com/api/v1
        description: Офіційний сервер, під `/api/v1`.
      - url: https://{host}:{port}
        description: Будь-який сервер Scacelith, у корені.
        variables:
          host:
            default: caissa.scacelith.com
            description: Публічне ім’я хоста сервера (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Публічний порт API (`PUBLIC_API_PORT`, а якщо його не задано — `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Будь-який сервер Scacelith, під `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: Публічне ім’я хоста сервера (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Публічний порт API (`PUBLIC_API_PORT`, а якщо його не задано — `API_PORT`).
    get:
      operationId: getReadiness
      tags:
        - health
      summary: Перевірити, що сервер приймає гравців
      description: |-
        Відповідає 200 `ready`, коли сервер приймає гравців, і 503 `not_ready`, поки він запускається або зупиняється. `HEAD` також підтримується. На будь-який інший метод (зокрема `OPTIONS`) відповідь — 405 `method_not_allowed` з `Allow: GET, HEAD`.

        **Ліміти:** лише рівень обмежень за адресою.
      security: []
      responses:
        '200':
          description: Сервер приймає гравців.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: рівень обмежень за адресою.'
        '503':
          description: Сервер запускається або зупиняється.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Токен сеансу (`sct_` і 43 символи base64url) з відповіді на вхід — у заголовку `Authorization`: `Authorization: Bearer <token>`. Префікс — це саме `Bearer` (з урахуванням регістру) й один пробіл; на значення без нього або на токен, що не складається з 1–512 друкованих символів ASCII, сервер відповідає 401 `invalid_token`, як і на будь-який інший недійсний токен. Порожній заголовок вважається відсутнім.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: 'Ідентифікатор партії: додатне десяткове ціле число з не більше ніж 16 цифр, без початкових нулів, менше за 2^53.'
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: Ідентифікатор сеансу в тому вигляді, у якому його повертає `GET /auth/sessions`, без початкових нулів (`03` — це не сеанс 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Ім’я користувача гравця, без урахування регістру. Сервер приймає будь-яке ім’я з 2–24 символів із `[A-Za-z0-9_.-]` (найширше правило, яке він будь-коли дозволяв).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Ідентифікатор партії; перелічуються лише старіші партії. Передайте `next` попередньої сторінки. Порожнє значення вважається відсутнім.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Розмір сторінки, від 1 до 50. Більше число (до 3 цифр) вважається за 50; порожнє значення вважається відсутнім.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: Токен посилання з листа (43 символи base64url). Якщо його немає або він неправильний, показується сторінка "link invalid or expired" (посилання недійсне або прострочене).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Кожна відповідь сервера забороняє кешування.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Кількість секунд, які треба зачекати перед повторною спробою; те саме значення, що й `retryAfter` у тілі.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Виклик автентифікації Bearer, з `error="invalid_token"` для недійсного токена.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Сервер закриває з’єднання після цієї відповіді.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (з `field`, коли проблема в полі тіла) або `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Поле порушує схему
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Тіло не є JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Надто простий пароль
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: PGN, який не вдається прочитати
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (немає заголовка `Authorization`) або `invalid_token` (токен має неправильний формат, прострочений, відкликаний або належить видаленому обліковому запису).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Немає сеансу
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Недійсний токен
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Запит відхилено.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Неправильний пароль під час повторної автентифікації
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Заблокований обліковий запис
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found` або функція, яку цей сервер вимкнув.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: тіло не надійшло протягом 10 секунд. Сервер закриває з’єднання.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Запит суперечить стану сервера.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: спроба входу через Google або квиток невідомі, використані чи прострочені; почніть знову з гри.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: тіло перевищує `HTTP_BODY_LIMIT` (типово 16 384 байти). Сервер закриває з’єднання.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: ціль запиту перевищує 4096 символів.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: тіло не є `application/json` або його кодування не UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: партія має понад `GIF_MAX_PLIES` (600) півходів.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: розв’яжіть завдання `pow` і надішліть той самий запит ще раз із `pow: { challenge, nonce }`. `reason` пояснює причину: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` або `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (обмеження частоти запитів, бюджет облікового запису або черга гешування паролів) чи `too_many_attempts` (обмеження облікового запису), з `retryAfter` і заголовком `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Обмеження частоти запитів
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Забагато невдач для цього облікового запису
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: неочікуваний збій. Сервер записує його в журнал.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: неправильний `state` або `iss`, або Google відхилив код чи надіслав ID-токен, який не пройшов перевірку. Текст від Google ніколи не передається.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` або `timeout`: повторіть спробу через `retryAfter`, якщо його вказано.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Сервер зайнятий
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: База даних залишалася заблокованою (читання)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Сервер відповідав надто довго
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Анімований GIF як вкладення.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` для партії з цього сервера, `attachment; filename="scacelith-game.gif"` для PGN, надісланого через `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Розмір файлу в байтах.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: HTML-сторінка.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: HTML-сторінка з поясненням відмови.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Форма не надійшла протягом 10 секунд (HTML-сторінка). Сервер закриває з’єднання.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: HTML-сторінка з поясненням конфлікту.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Форма перевищує `HTTP_BODY_LIMIT` (HTML-сторінка). Сервер закриває з’єднання.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Тіло не є ні формою (`application/x-www-form-urlencoded`), ні JSON, або його кодування не UTF-8 (HTML-сторінка).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Обмеження частоти запитів (HTML-сторінка), з `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Неочікуваний збій (HTML-сторінка із заголовком "Server error" (помилка сервера)). Сервер записує його в журнал.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Сервер зайнятий (база даних залишалася заблокованою; з `Retry-After`) або відповідав надто довго (HTML-сторінка із заголовком "Server error" (помилка сервера)).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: Єдина форма всіх відповідей з помилками в JSON API.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Код помилки у форматі `snake_case`. За ним клієнт вибирає, що показати.
          examples:
            - rate_limited
        message:
          type: string
          description: Речення англійською мовою, призначене для журналів і як запасний варіант.
        retryAfter:
          type: integer
          minimum: 1
          description: Кількість секунд, які треба зачекати перед повторною спробою; є лише у відмовах, які минають із часом. Тоді відповідь також містить заголовок `Retry-After` з тим самим значенням, крім 503 `busy` під час читання історії, партій, гравців і таблиці лідерів.
        field:
          type: string
          description: Поле або параметр запиту, у якому проблема (`invalid_request`, `invalid_option`, а також `invalid_cursor`, `invalid_limit` і `invalid_filter` у `GET /account/games`). Вкладене поле записується через крапку (`pow.nonce`).
        reason:
          type: string
          description: 'Причина: правило, яке порушує `weak_password`, або чому доказ роботи вимагається чи відхилений (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Лише для `banned`: кінець блокування (мс Unix-часу), `null` для безстрокового блокування.'
        line:
          type: integer
          minimum: 1
          description: 'Лише для `invalid_pgn`: рядок помилки, починаючи з 1.'
        column:
          type: integer
          minimum: 1
          description: 'Лише для `invalid_pgn`: стовпець помилки, починаючи з 1, у символах.'
    PowChallenge:
      type: object
      description: Завдання доказу роботи (`pow` у відповіді 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Підписане завдання, яке треба повернути без змін.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Кількість початкових нульових бітів, які має мати `SHA-256(challenge + ":" + nonce)`.
        expiresAt:
          type: integer
          format: int64
          description: 'Коли спливає термін дії завдання (мс Unix-часу): через 2 хвилини після видачі.'
    PowAnswer:
      type: object
      description: Відповідь на завдання доказу роботи.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: '`challenge` з відповіді 428 — таким, яким його надано.'
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Десятковий рядок не довше 20 цифр, такий, що `SHA-256(challenge + ":" + nonce)` починається з `bits` нульових бітів.
    ServerInfo:
      type: object
      description: Те, що потрібно клієнтові, перш ніж увійти або підключитися.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Назва сервера (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: UUID, який база даних отримує під час першого запуску. Він не змінюється після перезапусків. Дорівнює `null`, якщо база даних не може його надати.
        motd:
          type: string
          description: Повідомлення дня (`SERVER_MOTD`); може бути порожнім.
        protocol:
          type: object
          description: Протокол WebSocket (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Найстаріша версія протоколу, яку підтримує сервер.
            max:
              type: integer
              minimum: 1
              description: Найновіша версія протоколу, яку підтримує сервер.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: Відбиток схеми протоколу (перші 4 байти SHA-256 від її канонічної форми як беззнакове ціле число); суто довідкове значення.
            subprotocol:
              type: string
              description: Токен підпротоколу WebSocket (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: Порт WebSocket, яким користуються гравці (`PUBLIC_WS_PORT`, інакше `WS_PORT`, інакше `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: Шлях WebSocket.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Чи можна створювати нові облікові записи.
        emailVerification:
          type: boolean
          description: Чи мають нові облікові записи підтверджувати адресу (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
          properties:
            google:
              type: boolean
              description: Чи пропонується вхід через Google.
        mfa:
          type: boolean
          const: true
          description: Двофакторна автентифікація доступна завжди.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Кількість бітів доказу роботи, яку вимагає реєстрація (0 — доказ не потрібен).
        categories:
          type: array
          description: Офіційні (рейтингові) контролі часу (`RATED_CATEGORIES`) у порядку сервера. Будь-який інший контроль часу — це `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Правила, які клієнт може перевірити перед надсиланням форми.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: Мінімальна довжина імені користувача (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: Максимальна довжина імені користувача (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Регулярний вираз, якому має відповідати нове ім’я користувача.
            passwordMinLength:
              type: integer
              description: Мінімальна довжина пароля в символах (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Максимальна довжина пароля в байтах UTF-8.
            customTimeControls:
              type: boolean
              description: Чи можна у викликах і приватних партіях використовувати нестандартні контролі часу.
            reportsPerDay:
              type: integer
              description: Скільки скарг гравець може подати за 24 години (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Максимальний розмір повідомлення WebSocket, яке може надіслати клієнт, у байтах.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 97842216
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Офіційний контроль часу.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 'Ідентифікатор категорії: хвилини й секунди додавання (`3+2`).'
        baseSec:
          type: number
          minimum: 0
          description: Основний час у секундах.
        incSec:
          type: number
          minimum: 0
          description: Додавання за хід у секундах.
    AccountView:
      type: object
      description: Обліковий запис таким, яким його бачить сам гравець (`user` у відповідях на вхід і в `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: Ідентифікатор облікового запису.
        username:
          type: string
          description: Ім’я користувача.
        email:
          type: string
          format: email
          description: Адреса електронної пошти.
        emailVerified:
          type: boolean
          description: Чи підтверджено адресу.
        mfaEnabled:
          type: boolean
          description: Чи ввімкнено двофакторну автентифікацію.
        googleLinked:
          type: boolean
          description: Чи прив’язано обліковий запис Google.
        hasPassword:
          type: boolean
          description: '`false` для облікового запису, створеного через Google, у якому ще не встановлено пароль.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Чи приймаються прямі виклики за іменем (див. `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Коли створено обліковий запис (мс Unix-часу).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Останній вхід (мс Unix-часу) або `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Нова адреса під час зміни адреси, що очікує підтвердження за посиланням, або `null`.
    SessionAnswer:
      type: object
      description: Новий сеанс.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Токен сеансу для заголовка `Authorization` і WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: Абсолютний кінець сеансу (мс Unix-часу); межа бездіяльності може завершити його раніше.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Другий крок входу з двофакторною автентифікацією; продовжте через `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Токен кроку для `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Скільки секунд залишилося, щоб завершити крок.
    LoginAnswer:
      description: Сеанс або другий крок входу з двофакторною автентифікацією.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Перший вхід через Google; продовжте через `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Квиток для `POST /auth/sso/complete`, дійсний 10 хвилин.
        suggestedUsername:
          type: string
          description: Ім’я користувача, утворене з імені в Google або з адреси, або `""`, якщо нічого не підходить.
    SsoNeedsPassword:
      type: object
      description: Адресу використовує обліковий запис із паролем; продовжте через `POST /auth/sso/google/link`. Поки що нічого не прив’язано.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Квиток для `POST /auth/sso/google/link`.
        username:
          type: string
          description: Ім’я користувача цього облікового запису (його бачить лише той, хто довів Google, що володіє адресою).
        expiresIn:
          type: integer
          const: 600
          description: Скільки секунд квиток залишається дійсним.
    SsoFinishAnswer:
      description: Відповідь `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Спроба входу через Google.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Ідентифікатор спроби для `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: URL-адреса Google, яку після перевірки треба відкрити в системному браузері.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state`, який Google має повернути.'
        expiresIn:
          type: integer
          const: 600
          description: Скільки секунд спроба залишається дійсною.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Ім’я користувача; діють правила сервера (див. опис).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Адреса електронної пошти. Пробіли на краях обрізаються, зберігається в нижньому регістрі.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Пароль; діють правила для паролів.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Ім’я користувача або адреса електронної пошти (будь-який текст з `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Необов’язкове. Показується в списку пристроїв, на яких виконано вхід (наприклад, `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: '`mfaToken` з відповіді на вхід (або з відповіді на вхід через Google).'
        code:
          type: string
          maxLength: 32
          description: Необов’язкове. 6-значний код автентифікатора або код відновлення.
        recoveryCode:
          type: string
          maxLength: 32
          description: Необов’язкове. Код відновлення. Потрібне одне з полів `code` і `recoveryCode`.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Адреса електронної пошти.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Параметр `token` посилання для скидання пароля.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Новий пароль; діють правила для паролів, що й під час реєстрації.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Виклик PKCE S256 від `codeVerifier` клієнта (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Порт слухача клієнта на `127.0.0.1`.
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`attemptId` з `POST /auth/sso/google/start`.'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: Верифікатор PKCE; його SHA-256 має відповідати виклику, переданому в `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state` у тому вигляді, у якому його повернув Google.'
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: '`code` у тому вигляді, у якому його повернув Google (друковані символи ASCII без пробілів).'
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Необов’язкове. `iss` у тому вигляді, у якому його повернув Google, якщо повернув.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`linkTicket` з `finish`, дійсний 10 хвилин.'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Пароль облікового запису.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`ssoTicket` з `finish`, дійсний 10 хвилин.'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Ім’я користувача; діють правила реєстрації.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Активні сеанси, починаючи з використаного найнедавніше.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Активний сеанс (пристрій, на якому виконано вхід).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: Ідентифікатор сеансу для `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: Час входу (мс Unix-часу).
        lastSeenAt:
          type: integer
          format: int64
          description: Останнє використання (мс Unix-часу); оновлюється не частіше ніж раз на 5 хвилин.
        expiresAt:
          type: integer
          format: int64
          description: Абсолютний кінець (мс Unix-часу); межа бездіяльності може завершити сеанс раніше.
        clientLabel:
          type:
            - string
            - 'null'
          description: '`clientLabel`, переданий під час входу, або `null`, якщо його не надіслано.'
        current:
          type: boolean
          description: Чи це сеанс, з якого надіслано запит.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: По одному запису на кожну категорію, у якій гравець грав рейтингові партії.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Чинні санкції.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }`, поки діє блокування, інакше `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Запис рейтингу однієї категорії.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: Ідентифікатор категорії.
        rating:
          type: integer
          description: Рейтинг.
        games:
          type: integer
          minimum: 0
          description: Партії, зіграні в цій категорії (зараховані чи ні).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Найвищий досягнутий рейтинг.
        provisional:
          type: boolean
          description: '`true`, поки рейтинг ще не встановлено (фаза без рейтингу) або він має менше ніж `PROVISIONAL_GAMES` зарахованих партій (гра показує його як `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Вид санкції.
        reason:
          type:
            - string
            - 'null'
          description: Указана причина, якщо є.
        startsAt:
          type: integer
          format: int64
          description: Початок (мс Unix-часу).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Кінець (мс Unix-часу); `null`, якщо санкція безстрокова.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Кінець блокування (мс Unix-часу); `null`, якщо воно безстрокове.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` — приймати прямі виклики за іменем, `none` — відхиляти їх.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Поточний пароль.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Новий пароль; діють правила для паролів, що й під час реєстрації.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Пароль облікового запису.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Код секрету, що очікує активації, рівно 6 цифр.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Пароль облікового запису.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Необов’язкове; потрібне з двофакторною автентифікацією (або `recoveryCode`). Код автентифікатора або код відновлення.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Необов’язкове. Код відновлення (`xxxx-xxxx-xx`; регістр, пробіли й дефіси не мають значення).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Пароль облікового запису.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Код автентифікатора (код відновлення не приймається).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Нова адреса; пробіли на краях обрізаються, літери переводяться в нижній регістр, після чого адреса перевіряється так само, як під час реєстрації.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Пароль облікового запису.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Необов’язкове; потрібне з двофакторною автентифікацією (або `recoveryCode`). Код автентифікатора або код відновлення.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Необов’язкове. Код відновлення.
    TotpSetup:
      type: object
      description: Секрет для застосунку-автентифікатора, що очікує активації.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Секрет у base32 для введення в застосунок.
        uri:
          type: string
          format: uri
          description: URI `otpauth://totp/...`, який можна показати як QR-код.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Тривалість кроку в секундах.
    RecoveryCodeList:
      type: array
      description: 10 кодів відновлення, які показуються лише цей один раз. Кожен діє один раз.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Одна сторона партії.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Ім’я в записі партії (`deleted#<id>` для видаленого облікового запису).
        rating:
          type:
            - integer
            - 'null'
          description: Рейтинг на початку партії; `null`, якщо невідомий.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Рейтинг після партії. У рейтинговій партії він є завжди; `null` лише для партії, яка не враховується в рейтингах (товариська, з нестандартним контролем часу, скасована).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Зміна рейтингу; `0`, коли правила рейтингу залишають рейтинг без змін (нульовий результат за правилами FIDE, суперник без рейтингу, перші партії гравця без рейтингу); `null` — як і для `ratingAfter`.
    GameSummary:
      type: object
      description: Зведення збереженої партії.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Ідентифікатор партії.
        category:
          type: string
          description: Ідентифікатор офіційної категорії (`3+2`) або `custom`.
        rated:
          type: boolean
          description: Чи враховується партія в рейтингах.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Контроль часу в секундах (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (див. коди партій).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Код причини завершення (див. коди партій).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Результат; `*` для скасованої партії.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Кількість півходів.
        startedAt:
          type: integer
          format: int64
          description: Початок (мс Unix-часу).
        endedAt:
          type: integer
          format: int64
          description: Кінець (мс Unix-часу).
    Termination:
      type: string
      description: Назва причини завершення (див. коди партій); `Unknown` для коду, якого протокол не знає.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Зведення партії з погляду одного гравця.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Колір гравця.
    HistoryGameSummary:
      description: Партія з історії гравця, який увійшов.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Основний час у мілісекундах.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Додавання в мілісекундах.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: Підсумок з погляду гравця.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Партії сторінки, від найновіших.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Ідентифікатор, який треба передати як `before` для наступної сторінки, або `null` на останній сторінці.
        total:
          type: integer
          minimum: 0
          description: Кількість партій, що відповідають фільтру, на всіх сторінках.
    MoveRecord:
      type: object
      description: Один півхід партії.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: Хід у нотації UCI; для перетворення пішака додається `n`, `b`, `r` або `q`.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Час, зарахований на хід (мс); `null`, якщо в записі його немає.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Показ годинника гравця, який ходив, після ходу (мс); `null`, якщо в записі його немає.
    PgnTagsView:
      type: object
      description: Основні теги PGN для показу. `Termination` тут — назва причини завершення; у файлі PGN використовуються стандартні значення PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` або `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: Дата початку за UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Рейтинг на початку партії або `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Рейтинг на початку партії або `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Запис партії з ходами й показами годинника. Має поля зведення партії, крім `color` і `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Основний час у мілісекундах.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Додавання в мілісекундах.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: Назва `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: Ідентифікатор партії, реваншем якої є ця, або `null`.
            moves:
              type: array
              description: По одному запису на півхід.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: 'Лише якщо власник токена грав у цій партії: його колір.'
            reportable:
              type: boolean
              description: 'Лише якщо власник токена грав у цій партії: `true`, коли `POST /reports` прийняв би зараз скаргу на суперника за цю партію (партія завершилася протягом 7 днів, денну квоту не вичерпано, і на суперника ще не скаржилися за цю партію).'
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Ім’я користувача в тому написанні, яке вибрав гравець.
        createdAt:
          type: integer
          format: int64
          description: Коли створено обліковий запис (мс Unix-часу).
        ratings:
          type: array
          description: Лише офіційні категорії, у порядку сервера.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Усі збережені партії, зокрема товариські та скасовані.
            rated:
              type: integer
              minimum: 0
              description: Рейтингові партії, підсумовані за записами рейтингу.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Ім’я користувача в тому написанні, яке вибрав гравець.
        games:
          type: array
          description: Партії сторінки, від найновіших.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Ідентифікатор останньої партії, якщо сторінка заповнена (тоді наступна сторінка може виявитися порожньою), інакше `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: Ідентифікатор категорії.
        minGames:
          type: integer
          minimum: 0
          description: Скільки зарахованих партій потрібно запису, щоб потрапити до таблиці (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Коли таблицю було обчислено (мс Unix-часу).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: Текст PGN, щонайбільше 65 536 байтів UTF-8. Використовується лише перша партія.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Необов’язкове. Розмір зображення.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Необов’язкове. Сторона, яка внизу дошки.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Необов’язкове. Мілісекунди на хід — число JSON із цілим значенням.
        coords:
          type: boolean
          default: true
          description: Необов’язкове. Чи малювати навколо дошки літери вертикалей і номери горизонталей.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Партія — ціле число або рядок з 1–16 цифр.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Ім’я користувача суперника — як у записі партії або як зараз, без урахування регістру. Не може бути порожнім.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Чого стосується скарга.
        comment:
          type:
            - string
            - 'null'
          description: Необов’язкове. Щонайбільше 500 символів після вилучення керівних символів (крім табуляції та переведення рядка) й обрізання пробілів на краях.
    AccountExport:
      type: object
      description: Усе, що сервер зберігає про обліковий запис (час — у мс Unix-часу).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Коли створено експорт.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Що файл містить і чого не містить — простою англійською мовою для гравця.
          items:
            type: string
        account:
          description: Дані облікового запису з `GET /account/me`, а також `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Адреса прив’язаного облікового запису Google або `null`.
        ratings:
          type: array
          description: Повні записи рейтингу.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Пункти рейтингу, повернуті після того, як суперника викрили в нечесній грі, підсумовані за днями (UTC) і категоріями, від найновіших. Ні партій, ні порушників не названо.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Усі збережені сеанси, від найновіших, без жодних токенів. Очищення за терміном зберігання видаляє прострочений сеанс, а завершений — через день після виходу.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Події безпеки, від найновіших; зберігаються `RETENTION_SECURITY_DAYS` днів.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Усі санкції, зокрема зняті. Ім’я модератора ніколи не включається.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Події поведінки, зареєстровані для покинутих і скасованих партій гравця та партій, на які він не з’явився; зберігаються 30 днів.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Скарги, подані гравцем.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Кількість партій.
            list:
              type: array
              description: Усі партії, від найновіших, у вигляді зведень `GET /account/games`. Ходи доступні через `GET /games/{id}`, а PGN — через `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Повний запис рейтингу.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Чи вийшов гравець із фази без рейтингу.
            countedGames:
              type: integer
              minimum: 0
              description: Партії, зараховані до рейтингу.
            updatedAt:
              type: integer
              format: int64
              description: Коли запис востаннє змінювався.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: 00:00 UTC цього дня (мс Unix-часу).
        category:
          type: string
        points:
          type: integer
          description: Пункти, повернуті того дня в цій категорії.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Коли сеанс завершено, або `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Адреса, з якої виконано вхід; стирається через `RETENTION_IP_DAYS` днів.
    SecurityEvent:
      type: object
      description: |-
        Подія безпеки. `ip` вказується лише для дій, виконаних у сеансі, з паролем облікового запису (і другим фактором) або за посиланням, надісланим на його адресу: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` і `account_exported`; для всіх інших видів `ip: null`, а `ip` стирається через `RETENTION_IP_DAYS` днів.

        `detail` зберігає лише такі поля: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` і `method` (`password` або `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` і `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Подія `moderator_action` зберігає лише `{ action }` для дій `ban`, `unban`, `reset_mfa`, `verify_email` і `revoke_sessions` (інші дії модераторів не включаються). Для всіх інших видів `detail: null`. Події `rating_refund` не включаються: їхні пункти є в `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Вид події (`login`, `password_changed`...).
        at:
          type: integer
          format: int64
          description: Коли вона сталася.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: Поточне публічне ім’я гравця, на якого подано скаргу.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Чи скарга ще відкрита (чи застосовано санкції до гравця, на якого поскаржилися, не повідомляється).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Токен посилання з листа (приховане поле форми на сторінці).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Токен посилання для скидання пароля (приховане поле форми).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Новий пароль; діють правила для паролів, що й під час реєстрації.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Новий пароль ще раз; він має збігатися.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: HTML-сторінка в UTF-8 (`text/html; charset=utf-8`), без JavaScript і зовнішніх ресурсів.
