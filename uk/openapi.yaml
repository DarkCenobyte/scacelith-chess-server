paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Отримати назву сервера, версії, порти й правила реєстрації
      description: |-
        Те, що потрібно клієнтові, перш ніж увійти або підключитися: назва й ідентифікатор сервера, версії протоколу WebSocket і розташування WebSocket, правила реєстрації, офіційні контролі часу й обмеження, які клієнт може перевірити перед надсиланням форми.

        **Ліміти:** лише рівень обмежень за адресою.
      security: []
      responses:
        '200':
          description: Опис сервера.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: рівень обмежень за адресою.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Створити обліковий запис
      description: |-
        Створює обліковий запис: після того як його адресу електронної пошти підтверджено за надісланим на неї посиланням, або одразу, якщо підтвердження адреси не вимагається.

        **З підтвердженням адреси** (`REQUIRE_EMAIL_VERIFICATION`, типово): 202 `verification_sent`. Облікового запису ще не існує: заявка на реєстрацію очікує 24 години й тим часом резервує ім’я користувача. На адресу надходить посилання, дійсне ці 24 години, — щонайбільше одне на адресу кожні 5 хвилин (`POST /auth/verify-email/resend` надсилає нове); обліковий запис із підтвердженою адресою створюється, коли посилання використано (кнопка на сторінці `/verify-email`), і після цього гравець може увійти. Доти на спробу входу з цим іменем користувача сервер відповідає `invalid_credentials`, як для невідомого облікового запису, а публічного профілю не існує. Нова заявка з тією самою адресою замінює ту, що очікує. Відповідь та сама, якщо адресу вже використовує інший обліковий запис: тоді посилання не надсилається, натомість власник адреси отримує сповіщення (щонайбільше одне на годину), а ім’я користувача резервується так само, щоб ніщо не видавало, чи є в адреси обліковий запис. Заявка, посилання якої не використано, відкидається через 24 години, і її ім’я користувача знову стає вільним.

        **Без підтвердження адреси** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, обліковий запис створюється одразу, і в нього можна увійти.

        **Правила.** `username`: від `USERNAME_MIN` до `USERNAME_MAX` символів (від 3 до 20) — літери, цифри, `_` і `-`, починається з літери або цифри (`GET /info` повідомляє ці значення в `limits`); зарезервовані імена (`admin`, `moderator`, `deleted`...) і деякі префікси відхиляються; унікальне без урахування регістру. `email`: пробіли на краях обрізаються, зберігається в нижньому регістрі, лише ASCII і домен із крапкою. `password`: щонайменше `PASSWORD_MIN_LENGTH` (10) символів і щонайбільше 256 байтів UTF-8; не повинен містити ім’я користувача або локальну частину адреси електронної пошти й не повинен бути поширеним паролем.

        **Помилки** перевіряються в такому порядку: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; помилки черги гешування паролів; 409 `email_taken` (лише без підтвердження адреси).

        **Ліміти:** `auth`, потім `auth_register` (10 реєстрацій за годину на клієнта). **Доказ роботи:** завжди, коли `POW_REGISTER_BITS` більше за 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Перша спроба, без доказу роботи
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Повторне надсилання з доказом роботи
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Обліковий запис створено, і в нього можна увійти (на цьому сервері підтвердження адреси не вимагається).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Заявка на реєстрацію очікує використання посилання для підтвердження (або в адреси вже є обліковий запис; відповідь цього не розкриває).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (з `field`), `invalid_json`, `invalid_username`, `invalid_email` або `weak_password` з `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` або `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: реєстрацію на цьому сервері закрито (`GET /info` повідомляє `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: це ім’я користувача вже має обліковий запис або його резервує заявка на реєстрацію з іншою адресою, що очікує підтвердження. `email_taken`: адресу використовує інший обліковий запис (лише без підтвердження адреси).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `auth` або `auth_register` чи черга гешування паролів.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (черга гешування паролів або база даних залишалася заблокованою), `timeout`.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Увійти з паролем
      description: |-
        Виконує вхід за іменем користувача або адресою електронної пошти та паролем. Можливі дві відповіді, обидві зі статусом 200: сеанс або, якщо ввімкнено двофакторну автентифікацію, другий крок, який треба завершити протягом 5 хвилин через `POST /auth/login/mfa`.

        Невідомий обліковий запис, неправильний пароль і обліковий запис без пароля отримують однакову відповідь через однаковий час: 401 `invalid_credentials`. Перевірки облікового запису (`banned`, `email_unverified`) виконуються лише після правильного пароля. Починаючи з `AUTH_FAILURES_PER_ACCOUNT` (5) невдач з одним іменем для входу, кожна спроба мусить чекати (429 `too_many_attempts`).

        **Ліміт:** `auth`. **Доказ роботи:** лише під час хвилі невдалих входів (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Сеанс або другий крок входу з двофакторною автентифікацією.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Вхід виконано
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Двофакторну автентифікацію ввімкнено
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: невідомий обліковий запис, неправильний пароль або обліковий запис без пароля.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Лише після правильного пароля: `banned` з `until` (мс Unix-часу, `null` для безстрокового блокування) або `email_unverified` (старіший обліковий запис, адресу якого ще не підтверджено).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (затримка після невдач для цього імені для входу) або `rate_limited` (ліміт `auth`, черга гешування паролів).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (черга гешування паролів або база даних залишалася заблокованою), `timeout`.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Завершити вхід за допомогою другого фактора
      description: |-
        Другий крок входу з двофакторною автентифікацією — після того, як `POST /auth/login` або вхід через Google (`POST /auth/sso/google/finish` чи `POST /auth/sso/google/link`) відповів `mfaRequired`. Надішліть `code` (6-значний код автентифікатора або код відновлення) або `recoveryCode`. Використаний тут код відновлення зникає.

        Один крок приймає щонайбільше 5 неправильних кодів; крок також завершується, якщо пароль скинуто або змінено. Після кроку з паролем під час прив’язки Google прив’язку зберігають, лише коли код пройде перевірку тут.

        **Ліміти:** `auth` і щонайбільше `AUTH_MFA_PER_ACCOUNT` (10) кодів за 15 хвилин для облікового запису, з будь-якої адреси; понад це код не перевіряється, тож код відновлення не витрачається.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Код автентифікатора
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Код відновлення
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Вхід виконано.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: не надіслано ні `code`, ні `recoveryCode`, або тіло порушує схему; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: крок прострочено, уже використано або завершено після 5 неправильних кодів, або пароль скинуто чи змінено після першого кроку (увійдіть знову). `invalid_code`: неправильний або вже використаний код.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (з `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: лише після кроку з паролем під час прив’язки Google — тим часом обліковий запис Google прив’язали до іншого облікового запису.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: лише після кроку з паролем під час прив’язки Google — тим часом обліковий запис змінився; почніть знову з гри.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: затримка після невдач облікового запису, або його `AUTH_MFA_PER_ACCOUNT` кодів за останні 15 хвилин вичерпано. `rate_limited`: ліміт `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` з `retryAfter: 1`: база даних залишалася заблокованою (після кроку прив’язки Google нічого не прив’язано: почніть знову з гри). `timeout`.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Завершити цей сеанс
      description: |-
        Відкликає сеанс використаного токена. WebSocket, відкритий із ним, закривається. Без тіла (або `{}`).

        **Ліміт:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Сеанс завершено.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: тіло, відмінне від `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `sessions` або бюджет облікового запису.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (база даних залишалася заблокованою), `timeout`.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
        - sessions
      summary: Завершити всі сеанси
      description: |-
        Відкликає всі сеанси облікового запису, зокрема й цей. З’єднання WebSocket, відкриті з ними, закриваються. Без тіла (або `{}`).

        **Ліміт:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Усі сеанси завершено.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: тіло, відмінне від `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `sessions` або бюджет облікового запису.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (база даних залишалася заблокованою), `timeout`.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Надіслати посилання для підтвердження ще раз
      description: |-
        Повторно надсилає посилання для підтвердження адреси електронної пошти. Відповідь — 202 `accepted` незалежно від адреси, щоб ніколи не розкривати, чи використовує її обліковий запис або заявка на реєстрацію.

        Запит діє щонайбільше раз на 5 хвилин для однієї адреси. Заявка на реєстрацію з цією адресою, що очікує підтвердження, знову отримує свої 24 години — незалежно від того, чи використовує адресу інший обліковий запис, щоб її ім’я користувача в обох випадках залишалося зарезервованим однаково довго. Посилання надсилається лише для цієї заявки, якщо в адреси немає облікового запису (нове посилання, дійсне 24 години, замінює попереднє), або для активного непідтвердженого облікового запису з цією адресою.

        **Ліміти:** `auth`, потім `auth_mail` (10 за годину на клієнта).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Прийнято (незалежно від адреси).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `auth` або `auth_mail` (незалежно від адреси).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` з `retryAfter: 1`: база даних залишалася заблокованою під час пошуку облікового запису (продовження заявки, що очікує, виконується за можливості й ніколи не призводить до помилки запиту). `timeout`.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Надіслати посилання для скидання пароля
      description: |-
        Надсилає посилання для скидання пароля, дійсне одну годину, яке відкриває сторінку `/reset-password`. Відповідь — 202 `accepted` незалежно від адреси. Посилання надсилається лише для активного облікового запису, щонайбільше раз на 5 хвилин для однієї адреси. Обліковий запис лише з входом через Google саме так встановлює свій перший пароль.

        Відновлення пароля має найсуворіші ліміти в API, і всі вони рахуються для всього сервера: 3 запити за годину (`AUTH_FORGOT_PER_HOUR`) і 10 за 24 години (`AUTH_FORGOT_PER_DAY`) на клієнта (адреса IPv4 або мережа IPv6 /64), утричі більше на мережу IPv6 /48 — на додачу до ліміту `auth` (20 за 10 хвилин) і обмеження в один лист на адресу кожні 5 хвилин. Ні 202, ні 429 не розкривають, чи використовує адресу обліковий запис. Встановлення нового пароля має власний ліміт (`auth_reset`).

        **Ліміти:** `auth`, `auth_forgot`, потім `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Прийнято (незалежно від адреси).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `auth`, `auth_forgot` або `auth_forgot_day` (незалежно від адреси).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` з `retryAfter: 1`: база даних залишалася заблокованою. `timeout`.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Встановити новий пароль за токеном посилання для скидання
      description: |-
        Встановлює новий пароль за токеном посилання для скидання (сторінка `/reset-password` робить те саме). Новий пароль має відповідати правилам реєстрації.

        Скидання відкликає всі сеанси й скасовує незавершену зміну адреси електронної пошти; інші посилання для скидання пароля цього облікового запису перестають діяти; адреса вважається підтвердженою (посилання це довело); власник отримує лист. Двофакторна автентифікація не змінюється. Після помилки черги гешування паролів або 503 посилання залишається дійсним.

        **Ліміти:** `auth`, потім `auth_reset` (10 за годину на клієнта, 30 на мережу IPv6 /48, спільний зі сторінкою: кожна спроба гешує пароль).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Пароль змінено, усі сеанси завершено.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: посилання недійсне, уже використане чи прострочене або надіслане на адресу, якої обліковий запис більше не має. `weak_password` (з `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `auth` або `auth_reset` чи черга гешування паролів.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: черга гешування паролів або база даних залишалася заблокованою (`retryAfter: 1`, нічого не змінено). `timeout`.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Почати вхід через Google
      description: |-
        Починає спробу входу через Google для виклику PKCE і порту слухача гри на `127.0.0.1`. Відповідь містить URL-адресу Google, яку треба відкрити в системному браузері, і `state` спроби; спроба дійсна 10 хвилин.

        `authUrl` містить `client_id`, `redirect_uri` (побудований з `redirectPort` і тегу походження сервера), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 власного верифікатора сервера для Google) з `code_challenge_method=S256` і `prompt=select_account`. Гра перевіряє його, перш ніж відкрити (див. опис групи «Вхід через Google»).

        **Ліміт:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Спроба.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: вхід через Google на цьому сервері не пропонується.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (база даних залишалася заблокованою), `timeout`.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Передати серверу відповідь Google
      description: |-
        Передає серверу `code` і `state`, які Google надіслав слухачеві гри, разом з ідентифікатором спроби та верифікатором PKCE. Ідентифікатор спроби марний без верифікатора, а код марний без власного верифікатора PKCE сервера та його секрету клієнта.

        Сервер перевіряє спробу (невідома, використана або прострочена: 410), потім верифікатор (неправильний верифікатор залишає спробу придатною до використання), потім одноразово використовує спробу, перевіряє `state` і `iss`, обмінює код у Google і перевіряє ID-токен. Відповідь (200) — одна з таких:

        - `{ token, expiresAt, user }`: вхід до прив’язаного облікового запису виконано;
        - `{ mfaRequired, mfaToken, expiresIn }`: продовжте через `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: новий обліковий запис; продовжте через `POST /auth/sso/complete` протягом 10 хвилин. `suggestedUsername` утворено з імені в Google або з адреси; він дорівнює `""`, якщо нічого не підходить;
        - `{ needsPassword, linkTicket, username, expiresIn }`: обліковий запис із цією адресою має пароль; продовжте через `POST /auth/sso/google/link`. Поки що нічого не прив’язано.

        **Ліміт:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Сеанс, другий крок або наступний крок першого входу через Google.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Вхід до прив’язаного облікового запису виконано
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Двофакторну автентифікацію ввімкнено
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Новий гравець
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Адресу використовує обліковий запис із паролем
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: верифікатор не відповідає виклику PKCE спроби (спроба залишається придатною). `sso_email_unverified`: Google не підтвердив адресу. `registration_closed`. `account_disabled`. Лише для прив’язаного облікового запису: `banned` (з `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: вхід через Google на цьому сервері не пропонується.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: адресу використовує активний обліковий запис без пароля (його не названо).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: невідома, використана або прострочена спроба.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (база даних залишалася заблокованою), `timeout`.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Прив’язати Google до наявного облікового запису за його паролем
      description: |-
        Після того як `finish` відповів `needsPassword`: прив’язує Google до наявного облікового запису за паролем цього облікового запису, введеним у грі. Відповідь (200) — сеанс (прив’язку збережено, і гравець увійшов) або, якщо ввімкнено двофакторну автентифікацію, `{ mfaRequired, mfaToken, expiresIn }`: продовжте через `POST /auth/login/mfa`, і прив’язку буде збережено лише тоді, коли там код пройде перевірку.

        Неправильний пароль залишає квиток придатним — загалом на 5 спроб. Спроба зараховується безпосередньо перед перевіркою пароля: 429 `too_many_attempts` або 428 `pow_required` спроби не забирають, тоді як відмова черги гешування паролів (503 `server_busy`, 429 `rate_limited`) уже забрала одну спробу й рахується як невдача облікового запису. Затримка після невдач використовує той самий лічильник, що й `POST /auth/login`.

        **Ліміт:** `auth` (з окремим підрахунком для мережі IPv6 /48). **Доказ роботи:** як для `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Сеанс або другий крок входу.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: неправильний пароль; квиток залишається дійсним — загалом на 5 спроб.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (з `until`), лише після правильного пароля.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: вхід через Google на цьому сервері не пропонується.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: тим часом обліковий запис Google прив’язали до іншого облікового запису.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: невідомий, використаний або прострочений квиток, 5-й неправильний пароль, обліковий запис, статус або адреса якого змінилися після `finish`, або такий, у якого статус, адреса, пароль чи двофакторна автентифікація змінилися під час збереження прив’язки. Почніть знову з гри.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (затримка після невдач облікового запису) або `rate_limited` (ліміт `auth`, черга гешування паролів).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: черга гешування паролів або база даних залишалася заблокованою (`retryAfter: 1`, нічого не прив’язано). `timeout`.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Створити обліковий запис під час першого входу через Google
      description: |-
        Після того як `finish` відповів `needsUsername`: створює обліковий запис із вибраним іменем користувача (діють правила реєстрації) і виконує вхід до нього. Обліковий запис не має пароля: `hasPassword` дорівнює `false`, а «Забули пароль?» (`POST /auth/password/forgot`) дає змогу його встановити.

        **Ліміт:** `auth` (з окремим підрахунком для мережі IPv6 /48).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Обліковий запис створено, вхід виконано.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request` або `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: вхід через Google на цьому сервері не пропонується.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (це ім’я користувача вже має обліковий запис або його резервує заявка на реєстрацію з іншою адресою, що очікує підтвердження), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: невідомий, використаний або прострочений квиток.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (база даних залишалася заблокованою), `timeout`.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Перелічити пристрої, на яких виконано вхід
      description: |-
        Активні сеанси облікового запису (пристрої, на яких виконано вхід), починаючи з використаного найнедавніше. `current` позначає сеанс, з якого надіслано запит. `lastSeenAt` оновлюється не частіше ніж раз на 5 хвилин; `expiresAt` — абсолютний кінець, а межа бездіяльності може завершити сеанс раніше.

        **Ліміт:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Активні сеанси.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `sessions` або бюджет облікового запису.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (база даних залишалася заблокованою), `timeout`.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Завершити сеанс на одному пристрої
      description: |-
        Завершує один сеанс облікового запису; можна завершити й поточний. WebSocket, відкритий із ним, закривається. Без тіла (або `{}`).

        **Ліміт:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Сеанс завершено.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: тіло, відмінне від `{}`, або `id`, що не є коректним URL-кодуванням; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: у цього облікового запису немає активного сеансу з таким ідентифікатором.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `sessions` або бюджет облікового запису.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (база даних залишалася заблокованою), `timeout`.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Отримати обліковий запис, його рейтинги й чинні санкції
      description: |-
        Обліковий запис таким, яким його бачить сам гравець: дані облікового запису (вони ж — `user` у кожній відповіді на вхід), по одному запису рейтингу на кожну категорію, у якій гравець грав рейтингові партії, чинні санкції та блокування. Рівень доброчесності, який визначає система чесної гри, ніколи не показується.

        **Ліміт:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Обліковий запис.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized` або `invalid_token` (також коли обліковий запис видалено).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `account` або бюджет облікового запису.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (база даних залишалася заблокованою), `timeout`.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Приймати або відхиляти прямі виклики
      description: |-
        Визначає, чи можуть інші гравці викликати цього гравця за іменем. З `none` прямі виклики відхиляються: тому, хто викликає, повідомляють, що гравець недоступний. Без повторної автентифікації.

        **Ліміт:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: Налаштування, що тепер діють.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `account` або бюджет облікового запису.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (база даних залишалася заблокованою), `timeout`.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Змінити пароль
      description: |-
        Змінює пароль. Потрібен поточний пароль, але не другий фактор, навіть якщо ввімкнено двофакторну автентифікацію. Новий пароль має відповідати правилам реєстрації (їх перевіряють після поточного пароля).

        Зміна відкликає всі інші сеанси (цей залишається активним), скасовує незавершену зміну адреси електронної пошти, робить недійсними посилання для скидання пароля цього облікового запису й надсилає власникові лист.

        **Повторна автентифікація:** лише пароль. **Ліміти:** `reauth`, потім `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Пароль змінено.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (обліковий запис лише з входом через Google), `weak_password` (з `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: неправильний поточний пароль або скидання чи зміна пароля, що відбулися під час перевірки запиту.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (невдалі повторні автентифікації облікового запису) або `rate_limited` (ліміт `reauth` чи `reauth_user`, бюджет облікового запису, черга гешування паролів).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (черга гешування паролів або база даних залишалася заблокованою), `timeout`.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Почати ввімкнення двофакторної автентифікації
      description: |-
        Зберігає новий секрет автентифікатора, що очікує активації (він замінює будь-який попередній такий секрет), і повертає його для застосунку-автентифікатора (як текст і як URI `otpauth://`, який можна показати як QR-код). Двофакторну автентифікацію ще не ввімкнено: її вмикає `POST /account/mfa/totp/enable` з кодом цього секрету.

        **Повторна автентифікація:** лише пароль. **Ліміти:** `reauth`, потім `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Секрет, що очікує активації.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (обліковий запис лише з входом через Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (перевіряється перед паролем).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (невдалі повторні автентифікації облікового запису) або `rate_limited` (ліміт `reauth` чи `reauth_user`, бюджет облікового запису, черга гешування паролів).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (черга гешування паролів або база даних залишалася заблокованою), `timeout`.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Завершити ввімкнення двофакторної автентифікації й отримати коди відновлення
      description: |-
        Вмикає двофакторну автентифікацію за кодом секрету, що очікує активації (рівно 6 цифр). Пароль тут не запитується: його вже введено на етапі налаштування. Відповідь містить 10 кодів відновлення, які показуються лише цей один раз.

        **Ліміти:** `reauth`, потім `reauth_user`; неправильний код зараховується до невдалих повторних автентифікацій облікового запису.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Двофакторну автентифікацію ввімкнено.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
