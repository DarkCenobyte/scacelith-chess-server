openapi: 3.1.1
info:
  title: HTTPS API сервера Scacelith
  version: "0.9.0"
  summary: HTTPS API кожного сервера Scacelith — як офіційного, так і серверів спільноти.
  description: |-
    Кожен сервер Scacelith — і офіційний `caissa.scacelith.com`, і будь-який сервер спільноти — надає цей HTTPS API. Гра використовує його для всього, що відбувається поза самою партією: реєстрації та входу (зокрема з двофакторною автентифікацією та через Google), сторінки облікового запису, історії партій, завантаження PGN і анімованих GIF партій, активних сеансів (пристроїв, на яких виконано вхід), завантаження даних, видалення облікового запису та скарг.

    Гра в реальному часі (підбір суперників, виклики, ходи, годинники) відбувається через WebSocket того самого сервера (`wss://<host>/ws`), який відкривають із токеном сеансу цього API; її описано в `PROTOCOL.md`, а не тут.

    Наведені нижче типові значення — це значення сервера з незміненою конфігурацією; сервер спільноти може їх змінити (усі параметри описано в `CONFIG.md`).

    ## Базова URL-адреса, порт і транспорт

    - Офіційний сервер: `https://caissa.scacelith.com/api/v1`, TCP-порт 443.
    - Сервер спільноти: `https://<SERVER_PUBLIC_HOST>[:<port>]/api/v1`. Типово `API_PORT` дорівнює 443; за NAT або проксі порт, яким користуються гравці, — це `PUBLIC_API_PORT`.
    - WebSocket гри типово працює на тому самому порту (`WS_PORT` переносить його на інший; `GET /info` повідомляє клієнтові, де він).
    - HTTP/1.1 поверх TLS. З `TLS_MODE=proxy` TLS завершує зворотний проксі перед сервером. `TLS_MODE=off` (звичайний HTTP) — лише для локальної розробки.
    - HTML-сторінки, які відкриваються за посиланнями з листів (`/verify-email`, `/reset-password`, `/confirm-email-change`), розміщені в корені сервера, поза `/api/v1`. Ендпоінти перевірки стану відповідають і в корені, і під `/api/v1`. Вхід через Google не має сторінки на сервері: Google повертає браузер безпосередньо до гри, на `127.0.0.1`.
    - Кінцева скісна риска ігнорується (`/api/v1/info/` — це те саме, що `/api/v1/info`), а параметри шляху декодуються з URL-кодування (на параметр, що не є коректним URL-кодуванням, сервер відповідає 400 `invalid_request`).

    ## Запити

    - **Тіла JSON.** Запити `POST`, `PUT` і `DELETE` містять об’єкт JSON із `Content-Type: application/json`. `charset`, відмінний від UTF-8, відхиляється, як і будь-який інший тип вмісту (415 `unsupported_media_type`). Порожнє тіло вважається за `{}` — саме це приймають ендпоінти без параметрів (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`).
    - **Розмір і час.** Тіло обмежене `HTTP_BODY_LIMIT` байтами (типово 16 384; `POST /gif` має власний ліміт — 135 168 байтів): інакше 413 `payload_too_large`. Воно має надійти протягом 10 секунд: інакше 408 `request_timeout`. Після будь-якої з цих помилок сервер закриває з’єднання.
    - **Суворі схеми.** Поле, якого ендпоінт не знає, відхиляється; поле, не позначене як необов’язкове, є обов’язковим; типи й довжини перевіряються. На будь-яке з цих порушень сервер відповідає 400 `invalid_request`, а `field` називає поле (вкладене — через крапку, наприклад `pow.nonce`). Рядки не можуть містити керівних символів. Довжини рахуються в кодових одиницях UTF-16, тож символ поза базовою багатомовною площиною (емодзі) рахується двічі. На тіло, яке не є JSON, сервер відповідає 400 `invalid_json`. `POST /gif` і `POST /reports` перевіряють свої тіла самі (див. опис кожного з цих ендпоінтів).
    - **Рядки запиту.** Враховується перше входження параметра, невідомі параметри ігноруються, а `+` декодується як пробіл: ендпоінти, що приймають категорію контролю часу, приймають і `3%2B2`, і `3+2`.
    - **Методи.** `HEAD` — це `GET` без тіла. На `OPTIONS` до наявного шляху сервер відповідає 204 із заголовком `Allow`. На будь-який інший метод, якого шлях не має, — 405 `method_not_allowed` з `Allow`.
    - **Ціль запиту.** Вона не може перевищувати 4096 символів (414 `uri_too_long`). Запит, який узагалі не вдається розібрати або заголовна частина якого завелика чи надходить надто повільно, отримує порожню відповідь 400, 431 або 408, і з’єднання закривається.
    - **Без CORS.** API обслуговує гру, а не вебсторінки. Жоден заголовок `Access-Control-*` ніколи не надсилається, тож вебсторінка не може прочитати відповідь; оскільки приймаються лише тіла JSON, міжсайтовий запис потребував би попереднього запиту CORS, а такий запит не проходить.

    ## Відповіді та помилки

    - Відповіді — це JSON в UTF-8, окрім завантаження PGN (`application/x-chess-pgn`), анімованих GIF (`image/gif`) та HTML-сторінок. Час подано в мілісекундах від 1970-01-01 UTC. Ідентифікатори — цілі числа. Ідентифікатори партій мають до 16 цифр, але залишаються меншими за 2^53, тож число JSON (число з рухомою комою подвійної точності) зберігає їх точно.
    - Кожна відповідь API містить `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`, `X-Frame-Options: DENY`, `Cross-Origin-Resource-Policy: same-origin` і `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'` (HTML-сторінки мають власну політику). З `TLS_MODE=native` вона також містить `Strict-Transport-Security: max-age=31536000`.
    - Відповідь має бути прочитана протягом 60 секунд від моменту, коли сервер її підготував; це важливо лише для великих відповідей (GIF, експорт даних, довгий PGN). Час, який сервер витрачає на підготовку відповіді, не враховується ні тут, ні в 30 секундах без жодного вхідного чи вихідного байта, після яких з’єднання закривається.

    Помилки мають єдину форму (схема `Error`):

    ```json
    { "error": "snake_case_code", "message": "An English sentence.", "retryAfter": 30 }
    ```

    `message` призначене для журналів і як запасний варіант; що показати, клієнт вибирає за `error`. `retryAfter` (у секундах) є лише у відмовах, які минають із часом, і тоді відповідь також містить заголовок `Retry-After` з тим самим значенням; єдиний виняток — 503 `busy` під час читання історії, партій, гравців і таблиці лідерів, де є лише поле. Деякі помилки додають поля: `field` (некоректні вхідні дані), `reason` (`weak_password`, `pow_required`), `pow` (`pow_required`), `until` (`banned`), `line` і `column` (`invalid_pgn`).

    Помилки, які може повернути будь-який ендпоінт:

    | Статус | `error` | Коли |
    |---|---|---|
    | 400 | `invalid_request` | Тіло порушує схему ендпоінта (`field` вказує, де саме), ціль запиту або `Content-Length` мають неправильний формат, параметр шляху не є коректним URL-кодуванням або тіло обірвалося. |
    | 400 | `invalid_json` | Тіло не є JSON. |
    | 401 | `unauthorized` | Немає заголовка `Authorization` на ендпоінті, якому потрібен сеанс. |
    | 401 | `invalid_token` | Токен має неправильний формат, прострочений, відкликаний або належить видаленому обліковому запису; також на ендпоінтах, де сеанс необов’язковий. |
    | 404 | `not_found` | Такого ендпоінта немає. Деякі ендпоінти також використовують цю помилку: немає такої партії, гравця або сеансу. |
    | 405 | `method_not_allowed` | Шлях існує для інших методів (див. `Allow`). |
    | 408 | `request_timeout` | Тіло не надійшло протягом 10 секунд. |
    | 413 | `payload_too_large` | Тіло перевищує `HTTP_BODY_LIMIT` (135 168 байтів для `POST /gif`). |
    | 414 | `uri_too_long` | Ціль запиту перевищує 4096 символів. |
    | 415 | `unsupported_media_type` | Тіло не є `application/json` або його кодування не UTF-8. |
    | 429 | `rate_limited` | Обмеження частоти запитів (див. нижче): `retryAfter` і заголовок `Retry-After`. |
    | 500 | `internal_error` | Неочікуваний збій. Сервер записує його в журнал. |
    | 503 | `timeout` | Сервер не відповів протягом 30 секунд (60 секунд для експорту, 45 секунд для GIF за типових налаштувань). |
    | 503 | `server_busy` | Під час пошуку сеансу або зміни облікового запису база даних виявилася заблокованою (`retryAfter` 1), або черга гешування паролів заповнена (див. нижче). |

    Ендпоінти читання (історія партій, партії, гравці, таблиця лідерів) та експорт відповідають 503 `busy` з `retryAfter: 1`, коли база даних залишалася заблокованою.

    Ендпоінти, які перевіряють або гешують пароль, можуть також повернути одну з цих помилок, обидві з випадковим `retryAfter` від 5 до 15 секунд:

    - 503 `server_busy`: черга гешування паролів сервера (`PASSWORD_HASH_QUEUE_MAX`) заповнена, або час очікування вичерпано.
    - 429 `rate_limited`: черга заповнена щонайменше наполовину, а цей клієнт (адреса IPv4 або мережа IPv6 /48) уже має `PASSWORD_HASH_WAITERS_PER_SOURCE` гешувань в очікуванні. Ця відповідь 429 повертає токени лімітів, які забрав запит.

    Нічого не змінено, і невдалу спробу не зараховано (крім `POST /auth/sso/google/link`, де спробу квитка й невдачу облікового запису враховано ще до гешування), а посилання для скидання пароля залишається дійсним.

    HTML-сторінки повідомляють про свої помилки HTML-сторінками з тими самими кодами статусу.

    ## Автентифікація

    Ендпоінти, яким потрібен сеанс, приймають токен Bearer у заголовку `Authorization` (схема `bearerAuth`):

    ```
    Authorization: Bearer sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
    ```

    - **Отримання токена.** Токен (`sct_` і 43 символи base64url) видають `POST /auth/login` (а потім `POST /auth/login/mfa`, якщо ввімкнено двофакторну автентифікацію), `POST /auth/sso/google/finish` і `POST /auth/sso/google/link` (вхід через Google), а також `POST /auth/sso/complete`. Кожен із них відповідає `{ token, expiresAt, user }`. Сервер зберігає лише геш SHA-256 токена.
    - **Обов’язковий сеанс.** Якщо заголовка немає, сервер відповідає 401 `unauthorized` з `WWW-Authenticate: Bearer realm="scacelith"`. На недійсний токен — 401 `invalid_token` з `WWW-Authenticate: Bearer realm="scacelith", error="invalid_token"`. Клієнт має забути токен, який отримав `invalid_token`, і увійти знову.
    - **Необов’язковий сеанс.** Для `GET /games/{id}`, `GET /games/{id}/pgn`, `GET /players/{username}` і `GET /players/{username}/games` сеанс необов’язковий. Без заголовка вони повертають публічне подання; якщо заголовок надіслано, його токен має бути дійсним.
    - **Тривалість.** Сеанс завершується, щойно мине `SESSION_MAX_DAYS` (90) днів після входу (це `expiresAt`) або `SESSION_IDLE_DAYS` (30) днів без використання — залежно від того, що настане раніше. Кожне використання відсуває межу бездіяльності; сервер записує нове значення не частіше ніж раз на 5 хвилин. Обліковий запис має щонайбільше `MAX_SESSIONS_PER_USER` (10) сеансів: новий вхід відкликає найстаріші понад цю кількість.
    - **Відкликання.** Вихід (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`) відкликає сеанси; так само діють зміна пароля (інші сеанси), скидання пароля й видалення облікового запису (усі сеанси), а також адміністратор. Відкликання через API діє одразу, а WebSocket, відкритий із відкликаним сеансом, закривається. Сервер кешує результати пошуку сеансів на 30 секунд, тож відкликання адміністративною командою, яка працює окремим процесом, набирає чинності протягом 30 секунд.
    - **Сфера дії.** Токен належить одному серверу й відкриває також його WebSocket. Ніколи не надсилайте його на інший сервер.

    ## Обмеження частоти запитів та інші обмеження

    Ліміти застосовуються в одній із двох сфер. **Клієнт:** адреса IPv4 або мережа IPv6 /64 (у режимі проксі адреса береться з `X-Forwarded-For`, надісланого з адреси зі списку `TRUSTED_PROXIES`); деякі ліміти також рахують кожну мережу IPv6 /48 загалом, на додачу до кожної з її мереж /64. **Гравець:** обліковий запис, у який виконано вхід, незалежно від адреси; ліміт, що рахується на гравця, на ендпоінті з необов’язковим сеансом для запиту без токена рахується на клієнта.

    Кожен ліміт — це відро токенів, яке вміщує `limit` запитів і безперервно поповнюється зі швидкістю `limit / window`; `retryAfter` — час до появи наступного токена. Ліміти з позначкою *спільний* також рахуються в ковзному вікні тієї самої тривалості, щоб жодне вікно не вміщувало помітно більше ніж `limit` запитів. Кожен ліміт рахується для всього сервера. Коли один із лімітів ендпоінта відхиляє запит, токени, які інші його ліміти забрали для цього запиту, повертаються. Відмова — це 429 `rate_limited` з `retryAfter` і `Retry-After`.

    - **Рівень обмежень за адресою.** Кожен запит (будь-який шлях і метод, зокрема ендпоінти перевірки стану й запити на перехід до WebSocket) спершу забирає один токен із бюджету свого клієнта: `HTTP_RATE_PER_IP` (600) за хвилину із запасом на пів хвилини та `HTTP_RATE_PER_PREFIX` (4 × `HTTP_RATE_PER_IP`) для мережі IPv6 /48. Клієнт також може мати щонайбільше `IP_MAX_INFLIGHT` (32 × `WORKERS`) запитів в обробці (понад це — `retryAfter` 1). Клієнта, який не зупиняється після відмов, блокують: `ABUSE_BLOCK_REFUSALS_PER_MIN` (600) відмов за одну хвилину блокують його на 1 хвилину, а кожне наступне блокування протягом 6 годин — на 4, 16 і 60 хвилин. Відмова лімітів `auth`, `auth_*` і `reauth` рахується як 5; відмови лімітів, що рахуються на гравця, не враховуються ніколи. Адреси з `ABUSE_EXEMPT` оминають цей рівень, але не бюджет облікового запису й не ліміти ендпоінтів.
    - **Бюджет облікового запису.** Кожен запит із дійсним токеном сеансу також рахується для свого облікового запису: `USER_RATE_PER_MIN` (120) за хвилину для всіх ендпоінтів разом, незалежно від адреси, із запасом на пів хвилини.
    - **Ліміти ендпоінтів:**

    | Ліміт | Типово | Рахується на | Ендпоінти |
    |---|---|---|---|
    | `auth` | `AUTH_RATE_PER_IP` (20) / 10 хв, спільний | клієнта, а також `AUTH_RATE_PER_PREFIX` (5 × `AUTH_RATE_PER_IP`) на мережу IPv6 /48 | `POST /auth/register`, `/auth/login`, `/auth/login/mfa`, `/auth/verify-email/resend`, `/auth/password/forgot`, `/auth/password/reset`, `/auth/sso/google/link`, `/auth/sso/complete`; `POST /verify-email`, `/reset-password`, `/confirm-email-change` |
    | `auth_register` | `AUTH_REGISTER_PER_HOUR` (10) / год, спільний | клієнта; утричі більше на мережу IPv6 /48 | `POST /auth/register` |
    | `auth_mail` | `AUTH_MAIL_PER_HOUR` (10) / год, спільний | клієнта; утричі більше на мережу IPv6 /48 | `POST /auth/verify-email/resend` |
    | `auth_forgot` | `AUTH_FORGOT_PER_HOUR` (3) / год, спільний | клієнта; утричі більше на мережу IPv6 /48 | `POST /auth/password/forgot` |
    | `auth_forgot_day` | `AUTH_FORGOT_PER_DAY` (10) / 24 год, спільний | клієнта; утричі більше на мережу IPv6 /48 | `POST /auth/password/forgot` |
    | `auth_reset` | `AUTH_RESET_PER_HOUR` (10) / год, спільний | клієнта; утричі більше на мережу IPv6 /48 | `POST /auth/password/reset`, `POST /reset-password` |
    | `reauth` | ті самі числа, що й `auth`, але окреме відро, спільний | клієнта й мережу IPv6 /48 | зміни облікового запису, що вимагають пароля (див. «Повторна автентифікація»), і `POST /account/export` |
    | `reauth_user` | `AUTH_REAUTH_PER_USER` (10) / 10 хв, спільний | гравця | ті самі ендпоінти, що й `reauth` |
    | `account` | 60 / хв | гравця | `GET /account/me`, `PUT /account/preferences` |
    | `account_games` | 60 / хв | гравця | `GET /account/games` |
    | `account_export` | 5 / год, спільний | гравця | `POST /account/export` (перевіряється перед `reauth`; рахується кожна спроба) |
    | `sessions` | 60 / хв | гравця | `POST /auth/logout`, `/auth/logout-all`, `GET /auth/sessions`, `DELETE /auth/sessions/{id}` |
    | `public_read` | 60 / хв | гравця (клієнта, якщо запит без токена) | `GET /players/{username}`, `/players/{username}/games`, `/games/{id}`, `/games/{id}/pgn` (одне відро на всі чотири) |
    | `gif` | 30 / хв | гравця | `GET /games/{id}/gif`, `POST /gif` (одне відро на обидва) |
    | `gif_user_min`, `gif_user_hour` | `GIF_USER_RENDERS_PER_MIN` (4) / хв і `GIF_USER_RENDERS_PER_HOUR` (30) / год, спільні | гравця | ті самі два, лише коли GIF треба створити (а не взяти з кешу) |
    | `gif_ip_min`, `gif_ip_hour` | `GIF_IP_RENDERS_PER_MIN` (12) / хв і `GIF_IP_RENDERS_PER_HOUR` (120) / год, спільні | клієнта (усі його облікові записи разом); утричі більше на мережу IPv6 /48 | ті самі, як вище |
    | `reports` | 30 / год | гравця | `POST /reports` |
    | `sso_start` | 30 / 10 хв, спільний | клієнта, а також 90 на мережу IPv6 /48 | `POST /auth/sso/google/start` |
    | `sso_finish` | 30 / хв | клієнта | `POST /auth/sso/google/finish` |
    | `page` | 60 / хв | клієнта | `GET /verify-email`, `/reset-password`, `/confirm-email-change` |

    `GET /info` і `GET /leaderboard` не мають власних лімітів: лише рівень обмежень за адресою. Ендпоінт із кількома лімітами перевіряє їх у порядку, наведеному в його описі.

    Сервер обробляє запит у такому порядку: рівень обмежень за адресою, потім ендпоінти перевірки стану; зіставлення з ендпоінтом; автентифікація; бюджет облікового запису, якщо запит має сеанс; ліміти ендпоінта; тіло; сам ендпоінт (ендпоінти GIF забирають свої ліміти рендерингу, лише коли їм треба створити GIF). Тож запит, відхилений через токен, не витрачає жодного токена ендпоінта, а запит із некоректним тілом — витрачає.

    Інші обмеження, які застосовують самі ендпоінти:

    - **Невдалі входи з одним іменем для входу** (ім’я користувача або адреса електронної пошти): починаючи з `AUTH_FAILURES_PER_ACCOUNT` (5) невдач, кожна спроба мусить чекати вдвічі довше за попередню (2 с, 4 с і так далі, до 15 хвилин): 429 `too_many_attempts` з `retryAfter`. Лічильник скидається після години без невдач.
    - **Невдалі другі фактори під час входу:** те саме правило, починаючи з 5-го неправильного коду облікового запису. Один крок входу приймає щонайбільше 5 неправильних кодів.
    - **Коди другого фактора одного облікового запису:** щонайбільше `AUTH_MFA_PER_ACCOUNT` (10) кодів (кодів автентифікатора чи кодів відновлення, правильних чи ні) за 15 хвилин, з будь-якої адреси, під час входу та повторної автентифікації; понад це — 429 `too_many_attempts` ще до перевірки коду, тож код відновлення не витрачається.
    - **Невдалі повторні автентифікації облікового запису** (неправильний пароль або код): те саме правило (429 `too_many_attempts`), спільне для всіх ендпоінтів із повторною автентифікацією.
    - **Листи:** один лист підтвердження або скидання пароля на адресу кожні 5 хвилин (відповідь залишається тією самою); одне сповіщення «хтось намагався використати вашу адресу» на адресу за годину.
    - **Скарги:** `REPORTS_PER_DAY` (5) на гравця за 24 години: 429 `report_limit`.

    ## Доказ роботи

    `POST /auth/register` завжди вимагає доказу роботи, коли `POW_REGISTER_BITS` більше за 0 (типово 18; `GET /info` повідомляє це значення як `pow.register`). `POST /auth/login` і `POST /auth/sso/google/link` (для обох — один вид завдання) вимагають його лише протягом 5 хвилин після того, як сервер помітить хвилю невдалих входів (`POW_LOGIN_TRIGGER_PER_MIN`, потім `POW_LOGIN_BITS`); клієнт дізнається про це з відповіді.

    1. На запит без доказу (або з відхиленим доказом) сервер відповідає 428 `pow_required` з `reason` і завданням `pow` `{ challenge, bits, expiresAt }`.
    2. Знайдіть одноразове число: десятковий рядок не довше 20 цифр, такий, що `SHA-256(challenge + ":" + nonce)` починається з `bits` нульових бітів (починаючи зі старшого біта першого байта). Для 18 бітів потрібно в середньому близько 260 000 гешів.
    3. Надішліть той самий запит ще раз із `"pow": { "challenge": "...", "nonce": "123456" }` у тілі.

    Завдання дійсне 2 хвилини й лише один раз, для одного ендпоінта й однієї мережі клієнта (адреса IPv4 або мережа IPv6 /64). Воно підписане, тож сервер нічого про нього не зберігає, доки воно не повернеться. `reason` пояснює, чому доказ відхилено: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` або `replayed`.

    ## Повторна автентифікація

    Зміни облікового запису знову вимагають пароля, а якщо ввімкнено двофакторну автентифікацію, — ще й другого фактора:

    - лише пароль: `POST /account/password` і `POST /account/mfa/totp/setup`;
    - пароль і код автентифікатора (код відновлення не приймається): `POST /account/mfa/recovery-codes`;
    - пароль і код автентифікатора або код відновлення: `POST /account/mfa/totp/disable`, `POST /account/email`, `POST /account/export` і `POST /account/delete`.

    У тілах `code` містить 6-значний код автентифікатора, а `recoveryCode` — код відновлення (`xxxx-xxxx-xx`; регістр, пробіли й дефіси не мають значення). Там, де коди відновлення приймаються, код відновлення можна надіслати й у `code`. Кожен код діє один раз: використаний код автентифікатора відхиляється до наступного 30-секундного кроку, а код відновлення після використання зникає.

    | Статус | `error` | Коли |
    |---|---|---|
    | 403 | `invalid_password` | Неправильний пароль. |
    | 403 | `mfa_code_required` | Двофакторну автентифікацію ввімкнено, але не надіслано ні `code`, ні `recoveryCode`. |
    | 403 | `invalid_code` | Неправильний або вже використаний код. |
    | 400 | `password_not_set` | Обліковий запис лише з входом через Google ще не має пароля (його встановлює «Забули пароль?»). |
    | 429 | `too_many_attempts` | Забагато невдач або забагато спробуваних кодів для цього облікового запису. |
    | 503 / 429 | `server_busy` / `rate_limited` | Черга гешування паролів зайнята. |

    Неправильні паролі й коди враховуються в лічильнику невдач облікового запису та записуються як події безпеки.

    ## Порт метрик

    Окрім порту API, сервер відповідає звичайним HTTP на порту метрик (`METRICS_PORT`, 9464, прив’язаний до `METRICS_BIND`, типово 127.0.0.1; не відкривайте його назовні). Він не є частиною цього API: `GET /healthz` відповідає `ok`; `GET /readyz` відповідає `ready` після завершення запуску (кожен шард відтворив свій журнал, і слухачі прив’язано до портів) і доки не почнеться зупинка, інакше — 503 `not ready`; `GET /metrics` віддає метрики Prometheus і, якщо задано `METRICS_TOKEN`, вимагає `Authorization: Bearer <token>` саме з цим токеном.
