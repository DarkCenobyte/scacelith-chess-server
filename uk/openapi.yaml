      Сторінки для браузера, які відкриваються за посиланнями з листів. Їхні посилання ведуть на `https://<SERVER_PUBLIC_HOST>` (з `:<PUBLIC_API_PORT>`, якщо порт не 443), поза `/api/v1`.

      - Сторінки не виконують JavaScript і не завантажують жодних зовнішніх ресурсів. Вони надсилаються з `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'`.
      - `GET` лише показує кнопку або форму, щоб поштовий сканер, відкривши посилання, не використав його. Зміна відбувається під час `POST`: форма надсилається як `application/x-www-form-urlencoded` (тіло JSON також приймається), а токен посилання — у прихованому полі. Поле, передане двічі, відхиляється.
      - Помилки (обмеження частоти, некоректні поля) також є HTML-сторінками із заголовком "Request refused" (запит відхилено) або, починаючи з 500, "Server error" (помилка сервера). Лише збої, виявлені ще до зіставлення зі сторінкою (задовга або неправильно сформована ціль запиту, рівень обмежень за адресою), повертаються в JSON.
