  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: Видалити обліковий запис
      description: |-
        Видаляє обліковий запис; цю дію не можна скасувати.

        - Усі сеанси відкликаються одразу: відтоді токен отримує 401 `invalid_token`.
        - Ім’я користувача стає `deleted#<id>` — в обліковому записі та в кожному записі партії.
        - Стираються: адреса електронної пошти, геш пароля, секрет двофакторної автентифікації й коди відновлення, сеанси й токени посилань, прив’язка Google, запис доброчесності в системі чесної гри та IP-адреси, збережені з подіями безпеки.
        - Рейтинги й партії зберігаються. Партії залишаються доступними для читання під анонімним іменем, а `GET /players/{username}` відповідає 404 для колишнього імені.

        **Повторна автентифікація:** пароль, а з двофакторною автентифікацією — ще й код автентифікатора або код відновлення. **Ліміти:** `reauth`, потім `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Обліковий запис видалено.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (обліковий запис лише з входом через Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required` або `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (невдалі повторні автентифікації або забагато спробуваних кодів для цього облікового запису) або `rate_limited` (ліміт `reauth` чи `reauth_user`, бюджет облікового запису, черга гешування паролів).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (черга гешування паролів або база даних залишалася заблокованою), `timeout`.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Перелічити партії гравця з фільтрами та розбиттям на сторінки
      description: |-
        Партії гравця, який увійшов, від найновіших, з фільтрами та розбиттям на сторінки, а також кількість партій, що відповідають фільтру. Усі параметри запиту необов’язкові, а порожнє значення вважається відсутнім.

        Розбиття на сторінки: передайте `next` попередньої сторінки як `before`; на останній сторінці `next` дорівнює `null`. `total` рахує партії, що відповідають фільтру, на всіх сторінках.

        **Ліміт:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: Ідентифікатор офіційної категорії (`3+2` або `3%2B2`) або `custom` для всіх партій з іншим контролем часу.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Лише рейтингові (`true`) або товариські (`false`) партії.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Лише виграні, програні або нічийні партії — з погляду гравця. Скасовані партії видно лише без цього фільтра.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Одна сторінка історії.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` не є ідентифікатором партії), `invalid_limit` або `invalid_filter` (`category`, `rated` чи `result`), кожна з `field`, що називає параметр.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `account_games` або бюджет облікового запису.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (база даних залишалася заблокованою; `retryAfter: 1` у тілі, без заголовка `Retry-After`), `server_busy` (під час пошуку сеансу база даних виявилася заблокованою), `timeout`.'
  /games/{id}:
    get:
      operationId: getGame
      tags:
        - games
      summary: Отримати запис партії з ходами й показами годинника
      description: |-
        Один запис партії з ходами й показами годинника. Без токена або з токеном гравця, який не грав у цій партії, повертається публічна відповідь. Якщо власник токена грав у цій партії, відповідь додатково містить `you` і `reportable`.

        **Ліміт:** `public_read` (на гравця з токеном, на клієнта без нього).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Запис партії.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameRecord'
              example:
                id: 4100000000001
                category: '3+2'
                rated: true
                timeControl: '180+2'
                white:
                  name: alice
                  rating: 1500
                  ratingAfter: 1510
                  ratingDiff: 10
                black:
                  name: bob
                  rating: 1520
                  ratingAfter: 1510
                  ratingDiff: -10
                status: 1
                reason: 2
                result: 1-0
                termination: Resignation
                plies: 2
                startedAt: 1790620205000
                endedAt: 1790620611000
                baseMs: 180000
                incMs: 2000
                statusName: WhiteWins
                rematchOf: null
                moves:
                  - uci: e2e4
                    spentMs: 0
                    clockMs: 180000
                  - uci: e7e5
                    spentMs: 1700
                    clockMs: 180300
                pgn:
                  Event: Scacelith rated 3+2
                  Site: caissa.scacelith.com
                  Date: '2026.09.28'
                  Round: '-'
                  White: alice
                  Black: bob
                  Result: 1-0
                  WhiteElo: 1500
                  BlackElo: 1520
                  TimeControl: '180+2'
                  Termination: Resignation
                  PlyCount: 2
                you: white
                reportable: true
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: не додатне ціле число з не більше ніж 16 цифр (менше за 2^53); `invalid_request`: некоректне URL-кодування.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: токен надіслано, але він недійсний.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: такої партії немає.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `public_read` або бюджет облікового запису.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (база даних залишалася заблокованою; `retryAfter: 1` у тілі, без заголовка `Retry-After`), `server_busy` (під час пошуку сеансу база даних виявилася заблокованою), `timeout`.'
  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Завантажити партію як файл PGN
      description: |-
        Та сама партія як файл PGN: одна партія із закінченнями рядків `\n`, а текст ходів — у рядках, коротших за 80 символів. Відповідь та сама з токеном і без нього.

        Теги в такому порядку: `Event` (`<SERVER_NAME> rated <category>` або `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (дата початку за UTC), `Round`, `White`, `Black`, `Result` (`*` для скасованої партії), `UTCDate` і `UTCTime` (початок), `WhiteElo` і `BlackElo` (рейтинги на початку партії або `-`), `WhiteRatingDiff` і `BlackRatingDiff` (зміни, наприклад `+10` і `-10`, у кожній рейтинговій партії; `+0`, коли правила рейтингу залишають рейтинг без змін; у товариській партії, партії з нестандартним контролем часу або скасованій партії цих тегів немає), `TimeControl` (у секундах), `Termination` (стандартне значення PGN: `normal`; `time forfeit` — падіння прапорця, навіть якщо партія закінчилася нічиєю; `abandoned`; `rules infraction` — другий неможливий хід або технічна поразка за порушення чесної гри; `unterminated` — скасована партія), `PlyCount`, `ScacelithGameId` (десятковий ідентифікатор).

        Кожен хід має `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: показ годинника гравця, який ходив, після ходу та час, зарахований на цей хід, з точністю до десятих секунди (з відкиданням решти). Значення пропускається, якщо в записі його немає. Після останнього ходу словами вказано причину завершення, а потім результат.

        **Ліміт:** `public_read` (на гравця з токеном, на клієнта без нього).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Файл PGN.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: 'Значення: `attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'Текст PGN в UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: не додатне ціле число з не більше ніж 16 цифр (менше за 2^53); `invalid_request`: некоректне URL-кодування.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: токен надіслано, але він недійсний.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: такої партії немає.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `public_read` або бюджет облікового запису.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: серед іншого, коли збережені ходи не вдається відтворити до збереженого завершення партії (сервер записує це в журнал).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (база даних залишалася заблокованою; `retryAfter: 1` у тілі, без заголовка `Retry-After`), `server_busy` (під час пошуку сеансу база даних виявилася заблокованою), `timeout`.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Завантажити партію з цього сервера як анімований GIF
      description: |-
        Партія як анімований GIF. Імена й рейтинги беруться із запису партії (рейтинги на початку партії, видалений обліковий запис — як `deleted#<id>`), так само як результат і спосіб завершення (`Resignation`, `Loss on time`...).

        Перевірки виконуються в такому порядку: `gif_disabled`, параметри зображення (`size`, `orientation`, `delay`, `coords`), ідентифікатор партії, партія, її довжина.

        **Потрібен сеанс:** квоти рахуються на обліковий запис. **Ліміти:** `gif` для кожного запиту; `gif_user_min`, `gif_user_hour`, `gif_ip_min` і `gif_ip_hour` — лише коли GIF треба створити (див. опис групи «Анімовані GIF»). **Обмеження часу:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 секунд (типово 45 секунд).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 'Розмір зображення: `small` (поля по 32 пкс), `medium` (48 пкс) або `large` (72 пкс).'
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Сторона, яка внизу дошки.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Мілісекунди на хід (від 1 до 6 десяткових цифр).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Чи малювати навколо дошки літери вертикалей і номери горизонталей (`1`), чи ні (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` з `field` (`size`, `orientation`, `delay` або `coords`): значення поза дозволеними. `invalid_game_id`. `invalid_request`: некоректне URL-кодування.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: такої партії немає. `gif_disabled`: сервер вимкнув GIF (`GIF_ENABLED=false`; токен `gif` повертається).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `gif`, ліміт рендерингу або бюджет облікового запису.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: не вдалося створити GIF (сервер записує причину в журнал). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` з `retryAfter` (від 3 до 10 секунд) і `Retry-After`: черга рендерингу заповнена, або GIF чекав на вільний потік `GIF_QUEUE_TIMEOUT_MS` (10 секунд); усі токени лімітів, які забрав запит, повертаються. `busy`: база даних залишалася заблокованою (`retryAfter: 1` лише в тілі). `timeout`.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Створити анімований GIF будь-якої партії, надісланої як PGN
      description: |-
        Те саме зображення, що й `GET /games/{id}/gif`, для будь-якої партії, надісланої як текст PGN: партії, збереженої грою, експорту з іншого сайту, партії, набраної вручну. Використовується лише перша партія з тексту.

        - Читач PGN приймає те саме, що й власний читач гри: будь-який PGN, який записує цей сервер, і звичайні експорти інших сайтів (коментарі, варіанти, NAG і примітки з показами годинника пропускаються; номери ходів і SAN читаються поблажливо; тег `FEN` задає початкову позицію, якщо `SetUp` не дорівнює `"0"`).
        - Імена й рейтинги беруться з тегів `White`, `Black`, `WhiteElo` і `BlackElo`. Літери з діакритичними знаками втрачають ці знаки, інші символи поза друкованими ASCII стають `?`, а довгі імена обрізаються (до 48 символів). Результат береться з тегу `Result`, а якщо його немає — з кінця тексту ходів. Тег `Termination` показується, якщо він не `normal`: тоді все пояснює фінальна позиція (мат, пат).
        - Цей ендпоінт перевіряє тіло сам: на невідоме поле або на відсутній чи нерядковий `pgn` він відповідає 400 `invalid_request` з `field`; на неправильний параметр — 400 `invalid_option` (`delayMs` має бути числом JSON, `coords` — логічним значенням; `null` відхиляється).

        **Потрібен сеанс:** квоти рахуються на обліковий запис. **Ліміти:** як для `GET /games/{id}/gif`. **Обмеження тіла:** 135 168 байтів незалежно від `HTTP_BODY_LIMIT` (PGN як рядок JSON, разом з екрануванням). **Обмеження часу:** типово 45 секунд.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Коротка партія, набрана вручну, без координат
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: Файл PGN з усіма параметрами
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` з `field` (невідоме поле або `pgn` відсутній чи не є рядком; без `field`, якщо тіло не є об’єктом); `invalid_json`; `invalid_option` з `field` (`size`, `orientation`, `delayMs` або `coords`); `invalid_pgn` з `line` і `column` (від 1, стовпці в символах) та `message` від читача PGN: неможливий або неоднозначний хід, пошкоджений тег, невідомий різновид шахів, понад 65 536 байтів.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: сервер вимкнув GIF (`GIF_ENABLED=false`; токен `gif` повертається).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: тіло понад 135 168 байтів.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `gif`, ліміт рендерингу або бюджет облікового запису.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: не вдалося створити GIF (сервер записує причину в журнал). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` з `retryAfter` (від 3 до 10 секунд) і `Retry-After`: черга рендерингу заповнена, або GIF надто довго чекав на вільний потік; усі токени лімітів, які забрав запит, повертаються. `timeout`.'
  /players/{username}:
    get:
      operationId: getPlayer
      tags:
        - players
      summary: Отримати публічний профіль гравця
      description: |-
        Публічний профіль гравця: рейтинги в офіційних категоріях (у порядку сервера) і кількість партій. `games.total` рахує всі збережені партії, зокрема товариські та скасовані; `games.rated`, `wins`, `draws` і `losses` підсумовуються за записами рейтингу, тобто враховують лише рейтингові партії. Відповідь та сама з токеном і без нього.

        **Ліміт:** `public_read` (на гравця з токеном, на клієнта без нього).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Профіль.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
              example:
                username: alice
                createdAt: 1790882839743
                ratings:
                  - category: '3+2'
                    rating: 1510
                    provisional: true
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                games:
                  total: 3
                  rated: 2
                  wins: 1
                  draws: 1
                  losses: 0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`: не від 2 до 24 символів із `[A-Za-z0-9_.-]`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: токен надіслано, але він недійсний.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: такого гравця немає, або обліковий запис видалено.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `public_read` або бюджет облікового запису.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (база даних залишалася заблокованою; `retryAfter: 1` у тілі, без заголовка `Retry-After`), `server_busy` (під час пошуку сеансу база даних виявилася заблокованою), `timeout`.'
  /players/{username}/games:
    get:
      operationId: listPlayerGames
      tags:
        - players
      summary: Перелічити останні партії гравця
      description: |-
        Останні партії гравця, від найновіших, з розбиттям на сторінки, як в історії, але без фільтрів і загальної кількості. `color` — колір цього гравця. `next` — ідентифікатор останньої партії, щоразу коли сторінка заповнена, тож наступна сторінка може виявитися порожньою. Спочатку сервер шукає гравця: на невідомого гравця відповідь — 404, незалежно від параметрів запиту.

        **Ліміт:** `public_read` (на гравця з токеном, на клієнта без нього).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Одна сторінка партій гравця.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerGamesPage'
              example:
                username: alice
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                next: 4100000000001
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_cursor` (`before` не є ідентифікатором партії), `invalid_limit` (дві останні — без `field`).'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: токен надіслано, але він недійсний.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: такого гравця немає, або обліковий запис видалено.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: ліміт `public_read` або бюджет облікового запису.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (база даних залишалася заблокованою; `retryAfter: 1` у тілі, без заголовка `Retry-After`), `server_busy` (під час пошуку сеансу база даних виявилася заблокованою), `timeout`.'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: Отримати найкращих гравців категорії
      description: |-
        100 найвищих записів рейтингу офіційної категорії, що мають щонайменше `minGames` (`PROVISIONAL_GAMES`) зарахованих партій; видалені облікові записи та викриті порушники чесної гри не враховуються. Сервер перераховує кожну таблицю не частіше ніж раз на 10 секунд; `updatedAt` вказує, коли це сталося.

        **Ліміти:** лише рівень обмежень за адресою.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: Ідентифікатор офіційної категорії (`3+2` або `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: Кількість гравців, від 1 до 100. Більше число (до 3 цифр) вважається за 100; порожнє значення вважається відсутнім.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: Таблиця.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (відсутня або не офіційна категорія), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: рівень обмежень за адресою.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (база даних залишалася заблокованою; `retryAfter: 1` у тілі, без заголовка `Retry-After`), `timeout`.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Поскаржитися на суперника в недавній партії
      description: |-
        Надсилає скаргу на суперника в одній із власних партій гравця, що завершилася протягом останніх 7 днів. Скарга сама по собі ніколи не змінює рейтинг, санкцію чи рівень доброчесності. Вона підвищує пріоритет перевірки, який бачать модератори, і, крім категорії `abuse`, запитує аналіз партії рушієм.

        Повторна скарга на того самого суперника за ту саму партію отримує ту саму відповідь і нічого не змінює; відповідь ніколи нічого не розкриває про обліковий запис, на який поскаржилися. `GET /games/{id}` заздалегідь повідомляє гравцям партії, чи буде скаргу прийнято (`reportable`).

        Цей ендпоінт перевіряє тіло сам, у порядку `gameId`, `reported`, `category`, `comment`: у разі помилки він відповідає 400 `invalid_request` без `field`. Невідомі йому поля ігноруються.

        **Ліміти:** `reports` (на гравця), потім `REPORTS_PER_DAY` (5) скарг на гравця за 24 години (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Скаргу отримано (або її вже було подано).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (без `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: це не суперник автора скарги в партії, що завершилася протягом останніх 7 днів.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, із заголовком `Retry-After`): `REPORTS_PER_DAY` скарг за останні 24 години. `rate_limited`: ліміт `reports` або бюджет облікового запису.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (під час пошуку сеансу база даних виявилася заблокованою), `timeout`.'
  /verify-email:
    servers:
      - url: https://caissa.scacelith.com
        description: Офіційний сервер (сторінки розміщені в корені, поза `/api/v1`).
      - url: https://{host}:{port}
        description: Будь-який сервер Scacelith (сторінки розміщені в корені, поза `/api/v1`).
        variables:
          host:
            default: caissa.scacelith.com
            description: Публічне ім’я хоста сервера (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Публічний порт API (`PUBLIC_API_PORT`, а якщо його не задано — `API_PORT`).
    get:
      operationId: showVerifyEmailPage
      tags:
        - pages
      summary: Показати сторінку підтвердження адреси електронної пошти
      description: |-
        Сторінка посилання для підтвердження адреси електронної пошти (під час реєстрації або з повторно надісланого листа). Вона лише показує кнопку "Confirm my e-mail address" (підтвердити мою адресу електронної пошти), щоб поштовий сканер, відкривши посилання, не використав його; кнопка надсилає форму на `POST /verify-email`.

        **Ліміт:** `page`.
      security: []
      parameters:
        - $ref: '#/components/parameters/LinkTokenQuery'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Сторінка з кнопкою підтвердження.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Посилання недійсне або прострочене (HTML-сторінка).
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Ліміт `page` (HTML-сторінка) або рівень обмежень за адресою (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
    post:
      operationId: submitVerifyEmailPage
      tags:
        - pages
      summary: Підтвердити адресу електронної пошти
      description: |-
        Форма сторінки підтвердження. Вона підтверджує адресу; для нової заявки на реєстрацію вона тоді ж створює обліковий запис, і гравець може увійти.

        **Ліміт:** `auth`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
          application/json:
            schema:
              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Адресу підтверджено (а для нової заявки на реєстрацію — створено обліковий запис).
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Посилання недійсне, уже використане чи прострочене, або форма некоректна (HTML-сторінка).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '409':
          $ref: '#/components/responses/HtmlConflict'
          description: Посилання нової заявки на реєстрацію, ім’я користувача або адресу якої тим часом зайняв інший обліковий запис; обліковий запис не створюється (HTML-сторінка).
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Ліміт `auth` (HTML-сторінка) або рівень обмежень за адресою (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'База даних залишалася заблокованою (`Retry-After: 1`): нічого не змінено, і посилання досі діє. Також тайм-аут обробника.'
  /reset-password:
    servers:
      - url: https://caissa.scacelith.com
        description: Офіційний сервер (сторінки розміщені в корені, поза `/api/v1`).
      - url: https://{host}:{port}
        description: Будь-який сервер Scacelith (сторінки розміщені в корені, поза `/api/v1`).
        variables:
          host:
            default: caissa.scacelith.com
            description: Публічне ім’я хоста сервера (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Публічний порт API (`PUBLIC_API_PORT`, а якщо його не задано — `API_PORT`).
    get:
      operationId: showResetPasswordPage
      tags:
        - pages
      summary: Показати форму скидання пароля
      description: |-
        Сторінка посилання для скидання пароля: форма нового пароля (пароль двічі). Форма надсилається на `POST /reset-password`.

        **Ліміт:** `page`.
      security: []
      parameters:
        - $ref: '#/components/parameters/LinkTokenQuery'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Форма нового пароля.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Посилання недійсне (також коли його надіслано на адресу, якої обліковий запис більше не має).
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Ліміт `page` (HTML-сторінка) або рівень обмежень за адресою (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
    post:
      operationId: submitResetPasswordPage
      tags:
        - pages
      summary: Встановити новий пароль через форму скидання
      description: |-
        Форма сторінки скидання; вона робить те саме, що й `POST /auth/password/reset`: сеанси на всіх пристроях завершуються, незавершена зміна адреси електронної пошти скасовується, інші посилання для скидання перестають діяти, адреса вважається підтвердженою, а власник отримує лист.

        Спершу перевіряється посилання, потім — чи збігаються обидва паролі, потім — правила для пароля. Коли сервер зайнятий, форма повертається з `Retry-After`, а посилання залишається дійсним.

        **Ліміти:** `auth`, потім `auth_reset` (спільний з `POST /auth/password/reset`).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Пароль змінено, сеанси на всіх пристроях завершено.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Знову форма з помилкою (паролі не збігаються, пароль надто простий), посилання недійсне або форма некоректна (HTML-сторінка).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Ліміт `auth` або `auth_reset` (HTML-сторінка); знову форма з `Retry-After`, коли цей клієнт має забагато гешувань паролів в очікуванні (посилання залишається дійсним); або рівень обмежень за адресою (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: Знову форма з `Retry-After`, коли сервер зайнятий (черга гешування паролів або база даних залишалася заблокованою); посилання залишається дійсним. Також тайм-аут обробника.
  /confirm-email-change:
