  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: Змінити адресу електронної пошти
      description: |-
        Змінює адресу електронної пошти облікового запису. У `newEmail` обрізаються пробіли на краях і літери переводяться в нижній регістр, після чого адреса перевіряється так само, як під час реєстрації.

        **З підтвердженням адреси** (типово): 202 `verification_sent`. На нову адресу надходить посилання, дійсне 24 години; воно відкриває `/confirm-email-change`, і адреса змінюється лише тоді, коли гравець натисне кнопку на цій сторінці. Доти `GET /account/me` показує нову адресу як `pendingEmail`. Новий запит замінює незавершений; зміна або скидання пароля скасовує його. На одну нову адресу надходить щонайбільше одне посилання кожні 5 хвилин, хоч би хто про це просив (запит на ту саму зміну, що вже очікує, зберігає раніше надіслане посилання, яке залишається дійсним); відповідь та сама. Поточна адреса отримує сповіщення про те, що запитано зміну на замасковану адресу (`a***@example.org`). Відповідь і `pendingEmail` такі самі, якщо нову адресу вже використовує інший обліковий запис: тоді посилання не надсилається, тож ця зміна ніколи не завершиться, а власник тієї адреси натомість отримує сповіщення (щонайбільше одне на годину).

        Коли посилання підтверджено, адреса змінюється й вважається підтвердженою, сеанси на пристроях залишаються активними, надіслані раніше посилання (підтвердження, скидання пароля, інші зміни) перестають діяти, а на попередню адресу надходить повідомлення із замаскованою новою адресою.

        **Без підтвердження адреси** (`REQUIRE_EMAIL_VERIFICATION=false`): адреса змінюється одразу (200 `email_changed`), а попередня адреса отримує повідомлення. Якщо адресу використовує інший обліковий запис, відповідь — 409 `email_taken`, а власник тієї адреси отримує сповіщення.

        **Повторна автентифікація:** пароль, а з двофакторною автентифікацією — ще й код автентифікатора або код відновлення. `invalid_email` і `same_email` перевіряються перед паролем, тож невдачами не вважаються. **Ліміти:** `reauth`, потім `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Адресу змінено одразу (на цьому сервері підтвердження адреси не вимагається).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: Нова адреса в тому вигляді, у якому її збережено.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: На нову адресу надіслано посилання для підтвердження (або адреса належить іншому обліковому запису; відповідь цього не розкриває).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email` (поточна адреса облікового запису), `password_not_set` (обліковий запис лише з входом через Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` (також коли зміна або скидання пароля випередили запит: посилання не надсилається), `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: лише без підтвердження адреси.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (невдалі повторні автентифікації або забагато спробуваних кодів для цього облікового запису) або `rate_limited` (ліміт `reauth` чи `reauth_user`, бюджет облікового запису, черга гешування паролів).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: черга гешування паролів або база даних залишалася заблокованою (`retryAfter: 1`: нічого не змінено, і той самий запит можна надіслати ще раз). `timeout`.'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: Завантажити дані облікового запису
      description: |-
        Усе, що сервер зберігає про обліковий запис, як один файл JSON для збереження (`format` `scacelith-account-export`, `version` 1). Експорт реєструє подію безпеки (`account_exported`). Масив `notes` документа простою англійською мовою пояснює гравцеві, що не ввійшло до експорту.

        **Ніколи не потрапляє до експорту:** геш пароля, секрет двофакторної автентифікації та коди відновлення; будь-який токен сеансу чи посилання або його геш; дані системи чесної гри (рівень доброчесності й оцінка, аномалії, аналіз партій, вага скарги); скарги інших гравців на цього гравця; особи модераторів; приватні дані інших гравців (суперники представлені публічним іменем і рейтингом, ніщо не вказує, чи застосовано санкції до іншого гравця, і не включено жодної IP-адреси, яка може належати іншій людині).

        **Повторна автентифікація:** пароль, а з двофакторною автентифікацією — ще й код автентифікатора або код відновлення. **Ліміти:** `account_export` (5 за годину на гравця, для всього сервера; рахується кожна спроба, зокрема невдалі; перевіряється першим), потім `reauth` і `reauth_user`. **Обмеження часу:** 60 секунд.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
