    x-displayName: Історія партій
    description: Власні партії гравця, який увійшов, з фільтрами та розбиттям на сторінки.
  - name: games
    x-displayName: Партії та PGN
    description: |-
      Записи партій із ходами й показами годинника, а також їхні файли PGN.

      **Коди партій.** `status`: 1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (зберігаються лише завершені партії). `result`: `1-0`, `0-1`, `1/2-1/2` або `*` (скасована). `reason` — з назвою (`termination`) і словами, якими закінчується текст ходів у файлі PGN; коди 7 і 21 — нічиї (гравець, у якого скінчився час або який покинув партію, грав проти суперника, що не міг поставити мат), а кодами 4 і 13 сервер ніколи не завершує партію (вони належать до спільного списку причин):

      | Код | `termination` | Слова в PGN |
      |---|---|---|
      | 1 | `Checkmate` | Checkmate (мат) |
      | 2 | `Resignation` | Resignation (здача) |
      | 3 | `Timeout` | Loss on time (поразка за часом) |
      | 4 | `IllegalMoves` | Second illegal move (forfeit) (другий неможливий хід, технічна поразка) |
      | 5 | `Stalemate` | Stalemate (пат) |
      | 6 | `InsufficientMaterial` | Dead position (insufficient material) (мертва позиція, недостатньо матеріалу) |
      | 7 | `TimeoutVsInsufficient` | Flag fall, but the opponent cannot checkmate (падіння прапорця, але суперник не може поставити мат) |
      | 8 | `FivefoldRepetition` | Fivefold repetition (п’ятиразове повторення) |
      | 9 | `SeventyFiveMoves` | 75-move rule (правило 75 ходів) |
      | 10 | `ThreefoldClaim` | Threefold repetition (claimed) (триразове повторення на вимогу) |
      | 11 | `FiftyMoveClaim` | 50-move rule (claimed) (правило 50 ходів на вимогу) |
      | 12 | `Agreement` | Draw by agreement (нічия за згодою) |
      | 13 | `IllegalMovesVsInsufficient` | Second illegal move, but the opponent cannot checkmate (другий неможливий хід, але суперник не може поставити мат) |
      | 20 | `Abandonment` | Abandoned (disconnected for too long) (партію покинуто: надто довго без з’єднання) |
      | 21 | `AbandonmentVsInsufficient` | Abandoned, but the opponent cannot checkmate (партію покинуто, але суперник не може поставити мат) |
      | 22 | `Aborted` | Game aborted (партію скасовано) |
      | 23 | `NoShow` | Aborted: first move not played in time (скасовано: перший хід не зроблено вчасно) |
      | 24 | `Forfeit` | Forfeit (fair play violation) (технічна поразка за порушення чесної гри) |
      | 25 | `ServerAborted` | Aborted by the server (скасовано сервером) |
      | 26 | `BothDisconnected` | Aborted: both players disconnected (скасовано: обидва гравці відключилися) |
  - name: gifs
    x-displayName: Анімовані GIF
    description: |-
      Партія у вигляді анімованого GIF, щоб зберегти її або поділитися нею: дошка згори, по одному кадру на позицію від початкової до фінальної, імена й рейтинги гравців над дошкою, останній хід під нею, а на останньому кадрі — результат і те, як завершилася партія.

      **Вартість, кеш і квоти.** GIF створюється в окремому потоці рендерингу, ніколи не в потоках, які обслуговують партії, і з найнижчим пріоритетом процесора: `GIF_THREADS` потоків (типово `WORKERS`), які запускаються з першим GIF і зупиняються після хвилини без жодного. До `GIF_QUEUE_MAX` (4 × `WORKERS`) GIF чекають на потік, кожен щонайбільше `GIF_QUEUE_TIMEOUT_MS` (10 с); рендеринг може тривати `GIF_RENDER_TIMEOUT_MS` (30 с). Сервер зберігає створені GIF у кеші розміром `GIF_CACHE_MB` МБ (32 × `WORKERS`), першими витісняються ті, що найдовше не використовувалися; GIF із кешу або такий, що вже створюється для іншого запиту, не потребує рендерингу. Ключ кешу враховує все, що змінює зображення, зокрема імена.

      Кожен запит рахується в `gif` (30 за хвилину на гравця для обох ендпоінтів разом). GIF, який треба створити, рахується також у лімітах рендерингу: на гравця — `GIF_USER_RENDERS_PER_MIN` (4) за хвилину і `GIF_USER_RENDERS_PER_HOUR` (30) за годину; на клієнта, усі його облікові записи разом, — `GIF_IP_RENDERS_PER_MIN` (12) за хвилину і `GIF_IP_RENDERS_PER_HOUR` (120) за годину, та втричі більше на мережу IPv6 /48. Клієнтові слід зберігати завантажений файл, а не запитувати його знову, і чекати `retryAfter` після 429 або 503.

      Розміри: `small` (поля по 32 пкс: 284 × 350 пікселів), `medium` (48 пкс: 424 × 515), `large` (72 пкс: 628 × 762); без координат — 268 × 342, 400 × 503 і 600 × 748. Початкова позиція показується щонайменше 1 с (або протягом затримки, якщо вона довша), фінальна — 3 с, і GIF повторюється по колу; після першого кадру зберігається лише та частина зображення, яка змінюється. Партія на 40 ходів займає близько 135, 205 і 325 КіБ (малий, середній, великий розмір), партія на 150 ходів — 0,5; 0,8 і 1,2 МіБ.
