      Працездатність і готовність сервера — для моніторингу. Ці ендпоінти відповідають на порту API ще до автентифікації та будь-яких лімітів ендпоінтів, але, як і будь-який запит, забирають токен рівня обмежень за адресою; хост моніторингу можна внести до `ABUSE_EXEMPT`. Для кожного ендпоінта працюють обидва шляхи: у корені сервера та під `/api/v1`.

      Порт метрик має власні ендпоінти перевірки стану, описані у вступі.
  - name: auth
    x-displayName: Реєстрація та вхід
    description: |-
      Створення облікового запису, вхід із паролем (і другим фактором), листи для підтвердження адреси та скидання пароля.

      `POST /auth/login`, `POST /auth/login/mfa`, `POST /auth/sso/google/finish`, `POST /auth/sso/google/link` і `POST /auth/sso/complete` повертають сеанс `{ token, expiresAt, user }` (або, у випадку перших із них, другий крок).
  - name: google-sign-in
    x-displayName: Вхід через Google
    description: |-
      Доступний, коли `GET /info` повідомляє `sso.google: true`; інакше кожен ендпоінт нижче відповідає 404 `sso_disabled`. Гра виконує вхід через системний браузер за схемою для встановлених застосунків з RFC 8252 (клієнт Google типу «застосунок для комп’ютера»): Google повертає браузер до слухача гри на `127.0.0.1`, а не на цей сервер, і гра ніколи не бачить облікових даних Google.

      1. Клієнт слухає на `127.0.0.1:0` (порт вибирає система) і створює пару PKCE: `codeVerifier` із 43–128 символів `[A-Za-z0-9._~-]` і `codeChallenge = BASE64URL(SHA-256(codeVerifier))`, що має 43 символи без доповнення.
      2. `POST /auth/sso/google/start` із викликом PKCE і портом повертає URL-адресу Google і `state` спроби. Клієнт перевіряє URL-адресу (див. нижче) і відкриває її в браузері.
      3. Google спрямовує браузер на `http://127.0.0.1:<port>/oauth2/google/<tag>?code=...&state=...`. Клієнт приймає лише `state` з відповіді, що почала спробу, і нічого не надсилає після перенаправлення з `error=`.
      4. `POST /auth/sso/google/finish` з ідентифікатором спроби, `codeVerifier`, `state` і `code` (та `iss`, якщо Google його надіслав).
      5. Відповідь — це сеанс, крок двофакторної автентифікації (далі — `POST /auth/login/mfa`), `needsUsername` для нового гравця (далі — `POST /auth/sso/complete`) або `needsPassword`, коли адресу використовує обліковий запис із паролем (далі — `POST /auth/sso/google/link`).

      **Тег походження.** URI перенаправлення містить тег сервера, який додав гравець, щоб гра відхиляла URL-адресу, яку інший сервер отримав для своїх гравців. Походження — це хост у нижньому регістрі (літерал IPv6 у квадратних дужках), `:` і десятковий порт API, який записується завжди, зокрема й 443: сервер бере `SERVER_PUBLIC_HOST` і свій публічний порт API, а гра — адресу, до якої вона підключена. Тег — це перші 22 символи base64url (без доповнення) від SHA-256(UTF-8 `"scacelith-sso-origin-v1\n"` + походження). URI перенаправлення — це `"http://127.0.0.1:" + port + "/oauth2/google/" + tag`: завжди літерал IPv4 і порт слухача гри (від 1024 до 65535). Сервер ніколи не бере URI, хост чи шлях від клієнта.

      | Походження | Тег |
      |---|---|
      | `play.scacelith.example:443` | `IhcScoV7eDOzTEcSnqPUPt` |
      | `localhost:8443` | `TFGx7zQ_8QlGZW5zpqznCr` |
      | `[::1]:8443` | `XToJm0DG5PjciEVmZa9Cho` |
      | `127.0.0.1:50443` | `3r653wM5ZjYsHcAJljmCwY` |

      Тож вхід через Google працює лише для гравців, які додали сервер саме під іменем `SERVER_PUBLIC_HOST` і з його публічним портом API.

      **Що гра перевіряє, перш ніж відкрити браузер.** `authUrl` починається саме з `https://accounts.google.com/o/oauth2/v2/auth?`, складається з друкованих символів ASCII і коротший за 4096 символів, а його рядок запиту містить рівно один `response_type=code`, рівно один `redirect_uri`, що дорівнює URI, який гра обчислює зі свого порту й тегу походження, рівно один `state`, що дорівнює `state` з відповіді, а також `code_challenge_method=S256` і 43-символьний `code_challenge`. Інакше гра зупиняє свого слухача й нічого не відкриває. Запити `finish` і `link` вона надсилає лише на той сервер, який відповів на `start`.

      **До якого облікового запису веде вхід через Google:** до облікового запису, уже прив’язаного до цього облікового запису Google; інакше — до активного облікового запису з адресою, яку підтвердив Google (якщо він має пароль, `finish` відповідає `needsPassword`, і прив’язку зберігають лише після перевірки пароля, а потім і другого фактора, якщо його ввімкнено; без пароля — 409 `sso_account_exists`); інакше — до нового облікового запису (`needsUsername`). Обліковий запис Google ніколи не прив’язується до наявного облікового запису лише за адресою. На адресу облікового запису надходить лист, коли вхід через Google створює обліковий запис і коли його додають до наявного.
