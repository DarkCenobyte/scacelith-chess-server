        updatedAt:
          type: integer
          format: int64
          description: Millal edetabel arvutati (Unixi aeg, ms).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
