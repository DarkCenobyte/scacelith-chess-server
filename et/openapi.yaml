          example: '3+2'
        - name: limit
          in: query
          required: false
          description: Mitu mängijat, 1 kuni 100. Suurem, kuni 3-kohaline arv loetakse võrdseks 100-ga; tühi väärtus loetakse puuduvaks.
          schema:
            type: integer
            minimum: 1
            maximum: 999
