paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Too serveri nimi, versioonid, pordid ja registreerumise reeglid
      description: |-
        Mida klient vajab enne sisselogimist või ühendumist: serveri nimi ja ID, WebSocketi protokolli versioonid ja WebSocketi asukoht, registreerumise reeglid, ametlikud ajakontrollid ning piirangud, mida klient saab enne vormi saatmist kontrollida.

        **Piirangud:** ainult aadressipõhine kiht.
      security: []
      responses:
        '200':
          description: Serveri kirjeldus.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: aadressipõhine kiht.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Loo konto
      description: |-
        Loob konto: pärast seda, kui selle e-posti aadress on sinna saadetud lingiga kinnitatud, või e-posti kinnituseta kohe.

        **E-posti kinnitusega** (`REQUIRE_EMAIL_VERIFICATION`, vaikimisi): 202 `verification_sent`. Kontot veel ei ole: registreerumine ootab 24 tundi ja hoiab seni oma kasutajanime kinni. Aadressile saadetakse nende 24 tunni jooksul kehtiv link, kõige rohkem üks aadressi kohta iga 5 minuti järel (`POST /auth/verify-email/resend` saadab uue); konto luuakse ja selle aadress kinnitatakse lingi kasutamisel (lehe `/verify-email` nupp) ning mängija saab seejärel sisse logida. Seni vastatakse selle kasutajanimega sisselogimisele `invalid_credentials` nagu tundmatu konto puhul ja avalikku profiili ei ole. Uus registreerumine sama aadressiga asendab ootel registreerumise. Vastus on sama ka siis, kui aadressi kasutab juba mõni teine konto: siis linki ei saadeta, selle omanik saab hoopis teavituse (kõige rohkem ühe tunnis) ja kasutajanimi hoitakse samamoodi kinni, nii et miski ei reeda, kas aadressil on konto. Registreerumine, mille linki ei kasutatud, kustutatakse 24 tunni pärast ja selle kasutajanimi vabaneb.

        **E-posti kinnituseta** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, konto luuakse kohe ja sellega saab sisse logida.

        **Reeglid.** `username`: `USERNAME_MIN` kuni `USERNAME_MAX` märki (3 kuni 20), tähed, numbrid, `_` ja `-`, algab tähe või numbriga (`GET /info` annab need väljal `limits`); reserveeritud nimed (`admin`, `moderator`, `deleted`...) ja mõned eesliited lükatakse tagasi; unikaalne tõstutundetult. `email`: otstest eemaldatakse tühikud ja see salvestatakse väiketähtedega, lihtne ASCII punkti sisaldava domeeniga. `password`: vähemalt `PASSWORD_MIN_LENGTH` (10) märki ja kõige rohkem 256 baiti UTF-8-s; see ei tohi sisaldada kasutajanime ega e-posti aadressi kohalikku osa ega olla levinud parool.

        **Vead**, kontrollitakse selles järjekorras: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; paroolide räsimise järjekorra vead; 409 `email_taken` (ainult e-posti kinnituseta).

        **Piirangud:** `auth`, seejärel `auth_register` (10 registreerumist tunnis kliendi kohta). **Töötõend:** alati, kui `POW_REGISTER_BITS` on suurem kui 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Esimene katse, ilma töötõendita
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Uuesti saadetud koos töötõendiga
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Konto on loodud ja sellega saab sisse logida (selles serveris e-posti kinnitust pole).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Registreerumine ootab oma kinnituslingi kasutamist (või aadressil on juba konto; vastus seda ei ütle).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (koos väljaga `field`), `invalid_json`, `invalid_username`, `invalid_email` või `weak_password` koos väljaga `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` või `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: registreerumine on selles serveris suletud (`GET /info` ütleb `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: kasutajanimi on mõnel kontol või selle hoiab kinni mõne teise aadressi ootel registreerumine. `email_taken`: aadressi kasutab teine konto (ainult e-posti kinnituseta).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: piirang `auth` või `auth_register` või paroolide räsimise järjekord.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (paroolide räsimise järjekord või andmebaas jäi lukustatuks), `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Logi sisse parooliga
      description: |-
        Logib sisse kasutajanime või e-posti aadressi ja parooliga. Võimalikke vastuseid on kaks, mõlemad olekuga 200: seanss või, kui kaheastmeline autentimine on sees, teine samm, mis tuleb 5 minuti jooksul lõpetada otspunktiga `POST /auth/login/mfa`.

        Tundmatu konto, vale parool ja paroolita konto saavad sama vastuse sama aja järel: 401 `invalid_credentials`. Konto kontrollid (`banned`, `email_unverified`) tehakse alles pärast õiget parooli. Alates `AUTH_FAILURES_PER_ACCOUNT` (5) ebaõnnestumisest ühe sisselogimisnimega peab iga katse ootama (429 `too_many_attempts`).

        **Piirang:** `auth`. **Töötõend:** ainult ebaõnnestunud sisselogimiste laine ajal (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Seanss või kaheastmelise autentimisega sisselogimise teine samm.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Sisse logitud
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Kaheastmeline autentimine on sees
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: tundmatu konto, vale parool või paroolita konto.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Ainult pärast õiget parooli: `banned` koos väljaga `until` (Unixi aeg, ms; alalise peatamise korral `null`) või `email_unverified` (vanem konto, mille aadress pole veel kinnitatud).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (selle sisselogimisnime ebaõnnestumiste viivitus) või `rate_limited` (piirang `auth`, paroolide räsimise järjekord).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (paroolide räsimise järjekord või andmebaas jäi lukustatuks), `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Lõpeta sisselogimine teise teguriga
      description: |-
        Kaheastmelise autentimisega sisselogimise teine samm pärast seda, kui `POST /auth/login` või Google'iga sisselogimine (`POST /auth/sso/google/finish` või `POST /auth/sso/google/link`) vastas `mfaRequired`. Saatke `code` (6-kohaline autentimisrakenduse kood või taastekood) või `recoveryCode`. Siin kasutatud taastekood on ära kulutatud.

        Üks samm aktsepteerib kõige rohkem 5 valet koodi; samm lõpeb ka siis, kui parool lähtestatakse või seda muudetakse. Pärast Google'i sidumise paroolisammu salvestatakse seos alles siis, kui kood siin kontrolli läbib.

        **Piirangud:** `auth` ja konto kohta kõige rohkem `AUTH_MFA_PER_ACCOUNT` (10) koodi 15 minuti jooksul, mis tahes aadressilt; sellest üle koodi ei kontrollita, nii et taastekood ei kulu.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Autentimisrakenduse kood
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Taastekood
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Sisse logitud.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: ei saadetud ei välja `code` ega `recoveryCode` või keha rikub skeemi; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: samm aegus, on kasutatud või lõppes pärast 5 valet koodi või parool on pärast esimest sammu lähtestatud või seda on muudetud (logige uuesti sisse). `invalid_code`: vale või juba kasutatud kood.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (koos väljaga `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: ainult pärast Google''i sidumise paroolisammu – Google''i konto seoti vahepeal teise kontoga.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: ainult pärast Google''i sidumise paroolisammu – konto muutus vahepeal; alustage sisselogimist uuesti.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: konto ebaõnnestumiste viivitus või selle viimase 15 minuti `AUTH_MFA_PER_ACCOUNT` koodi on ära kasutatud. `rate_limited`: piirang `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` koos `retryAfter: 1`: andmebaas jäi lukustatuks (Google''i sidumise sammu järel ei seotud midagi: alustage sisselogimist uuesti). `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
