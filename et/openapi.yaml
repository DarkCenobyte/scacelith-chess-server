            rated:
              type: integer
              minimum: 0
              description: Reitinguga partiid, summeeritud üle reitingukirjete.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
