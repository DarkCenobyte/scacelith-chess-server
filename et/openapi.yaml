          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: PGN-tekst, kuni 65 536 baiti UTF-8 kodeeringus. Kasutatakse ainult esimest partiid.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Valikuline. Pildi suurus.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Valikuline. Pool, mis on laua alumises servas.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Valikuline. Millisekundeid käigu kohta, täisarvulise väärtusega JSON-arv.
        coords:
          type: boolean
          default: true
          description: Valikuline. Kas vertikaalide tähed ja horisontaalide numbrid joonistatakse laua ümber.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Partii, täisarvuna või 1 kuni 16 numbrist koosneva stringina.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Vastase kasutajanimi, nagu see on partiikirjes või nagu see on praegu, tõstust arvestamata. See ei tohi olla tühi.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Mida teade puudutab.
        comment:
          type:
            - string
            - 'null'
          description: Valikuline. Kuni 500 märki pärast seda, kui juhtmärgid (v.a tabeldusmärk ja reavahetus) on eemaldatud ning tekstilt on eemaldatud algus- ja lõputühikud.
    AccountExport:
      type: object
      description: Kõik, mida server konto kohta hoiab (ajad Unixi ajana, ms).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Millal eksport tehti.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Mida fail sisaldab ja mis on sellest välja jäetud, lihtsas inglise keeles mängija jaoks.
          items:
            type: string
        account:
          description: Otspunkti `GET /account/me` konto vaade koos väljaga `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Seotud Google'i konto aadress või `null`.
        ratings:
          type: array
          description: Täielikud reitingukirjed.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Reitingupunktid, mis tagastati pärast seda, kui vastane tabati sohitegemiselt, kokku liidetud UTC päeva ja kategooria kaupa, uusimad esimesena. Ei partiisid ega sohitegijaid nimetata.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Kõik salvestatud seansid, uusimad esimesena, ilma ühegi tokenita. Säilitusaja puhastus kustutab aegunud seansi ning välja logitud seansi üks päev pärast väljalogimist.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Turvasündmused, uusimad esimesena; säilitusaeg `RETENTION_SECURITY_DAYS`.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Kõik sanktsioonid, kaasa arvatud tühistatud. Moderaatori nime ei lisata kunagi.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Käitumissündmused, mis on salvestatud mängija nende partiide kohta, mis lõppesid partiist lahkumise, katkestamise või tegemata esimese käiguga; säilitatakse 30 päeva.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Mängija esitatud teated.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Partiide arv.
            list:
              type: array
              description: Kõik partiid, uusimad esimesena, otspunkti `GET /account/games` kokkuvõtetena. Käigud on saadaval otspunktis `GET /games/{id}` ja PGN otspunktis `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Täielik reitingukirje.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
