        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (andmebaas jäi lukustatuks; kehas `retryAfter: 1`, päist `Retry-After` pole), `server_busy` (seansi otsimisel oli andmebaas lukus), `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Laadi partii alla PGN-failina
      description: |-
        Sama partii PGN-failina: üks partii, reavahetused `\n` ja käikude tekst alla 80 veeru pikkustel ridadel. Vastus on sama nii tokeniga kui ka ilma.

        Märgendid selles järjekorras: `Event` (`<SERVER_NAME> rated <category>` või `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (alguskuupäev UTC järgi), `Round`, `White`, `Black`, `Result` (katkestatud partii puhul `*`), `UTCDate` ja `UTCTime` (algus), `WhiteElo` ja `BlackElo` (reitingud alguses või `-`), `WhiteRatingDiff` ja `BlackRatingDiff` (muutused, näiteks `+10` ja `-10`, igas reitinguga partiis; `+0`, kui reitingureeglid jätavad reitingu samaks; reitinguta, kohandatud või katkestatud partiis pole kumbagi), `TimeControl` (sekundites), `Termination` (PGN-standardi väärtus: `normal`; `time forfeit` – lipu langemine, ka siis, kui partii lõpeb viigiga; `abandoned`; `rules infraction` – teine reeglivastane käik või ausa mängu rikkumise eest määratud loobumiskaotus; `unterminated` – katkestatud partii), `PlyCount`, `ScacelithGameId` (ID kümnendarvuna).

        Iga käigu juures on `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: käigu teinud mängija kell pärast käiku ja selle käigu eest arvestatud aeg, sekundi kümnendikes (kärbitud). Väärtus jäetakse välja, kui kirjes seda pole. Pärast viimast käiku tuleb sõnadega lõpu põhjus, seejärel tulemus.

        **Piirang:** `public_read` (tokeniga mängija kohta, ilma tokenita kliendi kohta).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: PGN-fail.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'PGN-tekst UTF-8 kodeeringus (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: pole positiivne täisarv, millel on kuni 16 numbrit (alla 2^53); `invalid_request`: pole kehtiv URL-kodeering.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: saadeti token, mis ei kehti.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: sellist partiid pole.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: piirang `public_read` või konto kvoot.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: muu hulgas siis, kui salvestatud käike ei õnnestu läbi mängida kuni salvestatud lõpuni (server logib selle).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (andmebaas jäi lukustatuks; kehas `retryAfter: 1`, päist `Retry-After` pole), `server_busy` (seansi otsimisel oli andmebaas lukus), `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Laadi selle serveri partii alla animeeritud GIF-ina
      description: |-
        Partii animeeritud GIF-ina. Nimed ja reitingud on võetud partiikirjest (reitingud alguses, kustutatud konto kujul `deleted#<id>`), samuti tulemus ja lõpp (`Resignation`, `Loss on time`…).

        Kontrollid toimuvad selles järjekorras: `gif_disabled`, pildi valikud (`size`, `orientation`, `delay`, `coords`), partii ID, partii, selle pikkus.

        **Seanss on nõutav:** kvoote arvestatakse konto kaupa. **Piirangud:** `gif` igal päringul; `gif_user_min`, `gif_user_hour`, `gif_ip_min` ja `gif_ip_hour` ainult siis, kui GIF tuleb valmistada (vt jaotise kirjeldust). **Ajapiirang:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 sekundit (vaikimisi 45 sekundit).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 'Pildi suurus: `small` (32 px väljad), `medium` (48 px) või `large` (72 px).'
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Pool, mis on laua alumises servas.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Millisekundeid käigu kohta (1 kuni 6 kümnendnumbrit).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Kas vertikaalide tähed ja horisontaalide numbrid joonistatakse laua ümber (`1`) või mitte (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` koos väljaga `field` (`size`, `orientation`, `delay` või `coords`): väärtus pole lubatud väärtuste hulgas. `invalid_game_id`. `invalid_request`: pole kehtiv URL-kodeering.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: sellist partiid pole. `gif_disabled`: server on GIF-id välja lülitanud (`GIF_ENABLED=false`; piirangu `gif` žetoon antakse tagasi).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: piirang `gif`, renderduspiirang või konto kvoot.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF-i ei õnnestunud valmistada (server logib põhjuse). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` koos väljaga `retryAfter` (3 kuni 10 sekundit) ja päisega `Retry-After`: renderdusjärjekord on täis või GIF ootas vaba lõime `GIF_QUEUE_TIMEOUT_MS` (10 sekundit); kõik piirangute žetoonid, mille päring võttis, antakse tagasi. `busy`: andmebaas jäi lukustatuks (`retryAfter: 1` ainult kehas). `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Tee animeeritud GIF mis tahes PGN-ina saadetud partiist
      description: |-
        Sama pilt nagu `GET /games/{id}/gif` mis tahes partii kohta, mis on saadetud PGN-tekstina: mängus salvestatud partii, mõne teise saidi eksport, käsitsi sisestatud partii. Kasutatakse ainult teksti esimest partiid.

        - PGN-i lugeja võtab vastu sama, mida mängu enda lugeja: iga PGN-i, mille see server kirjutab, ja teiste saitide tavalised ekspordid (kommentaarid, variandid, NAG-id ja kellaannotatsioonid jäetakse vahele; käigunumbreid ja SAN-i loetakse leebelt; märgend `FEN` annab algseisu, välja arvatud siis, kui `SetUp` on `"0"`).
        - Nimed ja reitingud tulevad märgenditest `White`, `Black`, `WhiteElo` ja `BlackElo`. Diakriitikuga tähtedelt eemaldatakse diakriitikud, muud märgid väljaspool prinditavat ASCII-d muutuvad märgiks `?` ja pikad nimed lõigatakse lühemaks (48 märki). Tulemus tuleb märgendist `Result`, muidu käikude teksti lõpust. Märgendit `Termination` näidatakse, välja arvatud siis, kui see on `normal`: siis räägib lõppseis ise, mis juhtus (matt, patt).
        - See otspunkt kontrollib oma keha ise: tundmatu väli või puuduv või mittestringiline `pgn` annab vastuseks 400 `invalid_request` koos väljaga `field`; vale valik annab vastuseks 400 `invalid_option` (`delayMs` peab olema JSON-arv, `coords` tõeväärtus; `null` lükatakse tagasi).

        **Seanss on nõutav:** kvoote arvestatakse konto kaupa. **Piirangud:** nagu `GET /games/{id}/gif` puhul. **Keha suuruse piirang:** 135 168 baiti, olenemata väärtusest `HTTP_BODY_LIMIT` (PGN JSON-stringina koos paojadadega). **Ajapiirang:** vaikimisi 45 sekundit.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Lühike käsitsi sisestatud partii, ilma koordinaatideta
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: PGN-fail kõigi valikutega
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` koos väljaga `field` (tundmatu väli või `pgn` puudub või pole string; ilma väljata `field`, kui keha pole objekt); `invalid_json`; `invalid_option` koos väljaga `field` (`size`, `orientation`, `delayMs` või `coords`); `invalid_pgn` koos väljadega `line` ja `column` (alates 1-st, veerud märkides) ning lugeja sõnumiga `message`: reeglivastane või mitmetähenduslik käik, vigane märgend, tundmatu malevariant, üle 65 536 baidi.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: server on GIF-id välja lülitanud (`GIF_ENABLED=false`; piirangu `gif` žetoon antakse tagasi).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: keha on suurem kui 135 168 baiti.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: piirang `gif`, renderduspiirang või konto kvoot.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF-i ei õnnestunud valmistada (server logib põhjuse). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` koos väljaga `retryAfter` (3 kuni 10 sekundit) ja päisega `Retry-After`: renderdusjärjekord on täis või GIF ootas vaba lõime liiga kaua; kõik piirangute žetoonid, mille päring võttis, antakse tagasi. `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /players/{username}:
