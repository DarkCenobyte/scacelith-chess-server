      tags:
        - auth
      summary: Saada kinnituslink uuesti
      description: |-
        Saadab e-posti kinnituslingi uuesti. Vastus on olenemata aadressist 202 `accepted`, nii et see ei reeda kunagi, kas aadressi kasutab mõni konto või registreerumine.

        Päring toimib aadressi kohta kõige rohkem kord 5 minuti jooksul. Selle aadressiga ootel registreerumine saab oma 24 tundi uuesti, olenemata sellest, kas aadressi kasutab mõni teine konto, nii et selle kasutajanimi jääb mõlemal juhul sama kauaks kinni. Link saadetakse ainult sellele registreerumisele, kui aadressil pole kontot (uus, 24 tundi kehtiv link asendab eelmise), või selle aadressiga aktiivsele kinnitamata kontole.

        **Piirangud:** `auth`, seejärel `auth_mail` (10 tunnis kliendi kohta).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Vastu võetud (olenemata aadressist).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: piirang `auth` või `auth_mail` (olenemata aadressist).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` koos `retryAfter: 1`: andmebaas jäi lukustatuks konto otsimise või kinnitamata konto lingi salvestamise ajal (ootel registreerumise uuendamine tehakse võimaluse korral ega põhjusta kunagi päringu ebaõnnestumist); aadressi 5 minutit algavad sellegipoolest, nii et nende jooksul tehtud uus päring ei tee midagi. `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Saada parooli lähtestamise link
      description: |-
        Saadab ühe tunni kehtiva parooli lähtestamise lingi, mis avab lehe `/reset-password`. Vastus on olenemata aadressist 202 `accepted`. Link saadetakse ainult aktiivsele kontole, kõige rohkem kord 5 minuti jooksul aadressi kohta. Ainult Google'iga sisse logiv konto määrab nii oma esimese parooli.

        Parooli taastamisel on API kõige rangemad piirangud, mida kõiki arvestatakse kogu serveri peale: 3 päringut tunnis (`AUTH_FORGOT_PER_HOUR`) ja 10 päringut 24 tunni jooksul (`AUTH_FORGOT_PER_DAY`) kliendi kohta (IPv4-aadress või IPv6 /64), IPv6 /48 kohta 3 korda rohkem, lisaks piirangule `auth` (20 päringut 10 minuti jooksul) ja ühele e-kirjale aadressi kohta iga 5 minuti järel. Ei 202 ega 429 reeda, kas aadressi kasutab mõni konto. Uue parooli määramisel on oma piirang (`auth_reset`).

        **Piirangud:** `auth`, `auth_forgot`, seejärel `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Vastu võetud (olenemata aadressist).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: piirang `auth`, `auth_forgot` või `auth_forgot_day` (olenemata aadressist).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` koos `retryAfter: 1`: andmebaas jäi lukustatuks konto otsimise või lingi salvestamise ajal; aadressi 5 minutit algavad sellegipoolest, nii et nende jooksul tehtud uus päring linki ei saada. `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Määra lähtestamislingi tokeniga uus parool
      description: |-
        Määrab lähtestamislingi tokeniga uue parooli (leht `/reset-password` teeb sama). Uus parool peab vastama registreerumise reeglitele.

        Lähtestamisel on ühes transaktsioonis (kõik või mitte ükski) järgmised mõjud: see tühistab kõik seansid ja tühistab ootel e-posti aadressi muutmise; konto teised lähtestamislingid lakkavad töötamast; aadress loetakse kinnitatuks (link tõestas selle); omanik saab e-kirja. Kaheastmelist autentimist see ei puuduta. Pärast paroolide räsimise järjekorra viga, 503 või 500 pole midagi muutunud: vana parool ja seansid jäävad alles ning link jääb kehtima.

        **Piirangud:** `auth`, seejärel `auth_reset` (10 tunnis kliendi kohta, 30 IPv6 /48 kohta, ühine lehega: iga katse räsib parooli).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Parool on muudetud ja kõik seansid on välja logitud.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: link on kehtetu, kasutatud või aegunud või saadeti aadressile, mida kontol enam pole. `weak_password` (koos väljaga `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: piirang `auth` või `auth_reset` või paroolide räsimise järjekord.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: paroolide räsimise järjekord või andmebaas jäi lukustatuks (`retryAfter: 1`, midagi ei muutunud). `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Alusta Google'iga sisselogimist
      description: |-
        Alustab Google'iga sisselogimise katset PKCE väljakutse ja mängu kuulaja pordiga aadressil `127.0.0.1`. Vastus annab süsteemi brauseris avatava Google'i URL-i ja katse väärtuse `state`; katse kehtib 10 minutit.

        `authUrl` sisaldab parameetreid `client_id`, `redirect_uri` (koostatud väärtusest `redirectPort` ja serveri päritolutunnusest), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (serveri enda, Google'i jaoks mõeldud verifitseerija S256) koos `code_challenge_method=S256` ning `prompt=select_account`. Mäng kontrollib seda enne avamist (vt jaotise kirjeldust).

        **Piirang:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Katse.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: see server ei paku Google''iga sisselogimist.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: piirang `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (andmebaas jäi lukustatuks), `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Alusta Google'iga sisselogimist veebisaidil
      description: |-
        Alustab veebisaidi Google'iga sisselogimise katset selle lehe PKCE väljakutsega. Vastus on sama mis mängule: Google'i URL, millele liikuda, ja katse väärtus `state`; katse kehtib 10 minutit. Saadaval, kui `GET /info` ütleb `sso.googleWeb: true`.

        `authUrl` sisaldab veebisaidi parameetreid `client_id` ja `redirect_uri=GOOGLE_WEB_REDIRECT_URI` ning ülejäänud parameetreid samamoodi nagu mängu puhul. Leht kontrollib seda enne sellele liikumist (vt jaotise kirjeldusest lõiku **Veebisaidil**).

        **Piirang:** `sso_start`, ühine mängu alustamisega.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: Katse.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: puuduv või vigane `codeChallenge` või mis tahes muu väli (sh `redirectPort`).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: see server ei paku Google''iga sisselogimist või ei paku seda veebisaitidele.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: piirang `sso_start` (ühine mängu alustamisega).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (andmebaas jäi lukustatuks), `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Anna Google'i vastus serverile üle
      description: |-
        Annab serverile üle väärtused `code` ja `state`, mille Google saatis mängu kuulajale või veebisaidi lehele, koos katse ID ja PKCE verifitseerijaga. Katse ID on ilma verifitseerijata kasutu ja kood on kasutu ilma serveri enda PKCE verifitseerija ja kliendi salajase võtmeta.

        Server kontrollib katset (tundmatu, kasutatud või aegunud: 410), seejärel verifitseerijat (vale verifitseerija korral jääb katse kasutatavaks), seejärel kasutab katse ühe korra ära, kontrollib väärtusi `state` ja `iss`, vahetab koodi Google'iga ja kontrollib ID-tokenit. Vastus (200) on üks järgmistest:

        - `{ token, expiresAt, user }`: sisse logitud seotud kontole;
        - `{ mfaRequired, mfaToken, expiresIn }`: jätkake otspunktiga `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: uus konto; jätkake 10 minuti jooksul otspunktiga `POST /auth/sso/complete`. `suggestedUsername` tuleb Google'i nimest või aadressist ja on `""`, kui miski ei sobi;
        - `{ needsPassword, linkTicket, username, expiresIn }`: selle aadressiga kontol on parool; jätkake otspunktiga `POST /auth/sso/google/link`. Midagi pole veel seotud.

        **Piirang:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Seanss, teine samm või esimese Google'iga sisselogimise järgmine samm.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Sisse logitud seotud kontole
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Kaheastmeline autentimine on sees
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Uus mängija
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Aadressi kasutab parooliga konto
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: verifitseerija ei vasta katse väljakutsele (katse jääb kasutatavaks). `sso_email_unverified`: Google pole aadressi kinnitanud. `registration_closed`. `account_disabled`. Ainult seotud konto puhul: `banned` (koos väljaga `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: see server ei paku Google''iga sisselogimist.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: aadressi kasutab aktiivne paroolita konto (seda ei nimetata).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: tundmatu, kasutatud või aegunud katse.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: piirang `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (andmebaas jäi lukustatuks), `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Seo Google olemasoleva kontoga selle parooli abil
      description: |-
        Kui `finish` vastas `needsPassword`: seob Google'i olemasoleva kontoga selle konto parooli abil, mis sisestatakse mängus. Vastus (200) on seanss (seos salvestatakse ja mängija logitakse sisse) või, kui kaheastmeline autentimine on sees, `{ mfaRequired, mfaToken, expiresIn }`: jätkake otspunktiga `POST /auth/login/mfa` ja seos salvestatakse alles siis, kui kood seal kontrolli läbib.

        Vale parooli korral jääb pilet kasutatavaks, kokku 5 katseks. Katse arvestatakse vahetult enne parooli kontrollimist: 429 `too_many_attempts` või 428 `pow_required` ei võta ühtegi katset, paroolide räsimise järjekorra keeldumine (503 `server_busy`, 429 `rate_limited`) aga on ühe katse juba võtnud ja läheb arvesse konto ebaõnnestumisena. Ebaõnnestumiste viivitus kasutab sama loendurit mis `POST /auth/login`.

        **Piirang:** `auth` (koos selle IPv6 /48 loendusega). **Töötõend:** nagu otspunktil `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Seanss või sisselogimise teine samm.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: vale parool; pilet jääb kehtima, kokku 5 katseks.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (koos väljaga `until`), ainult pärast õiget parooli.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: see server ei paku Google''iga sisselogimist.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: Google''i konto seoti vahepeal teise kontoga.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: tundmatu, kasutatud või aegunud pilet, 5. vale parool, konto, mille olek või aadress on pärast sammu `finish` muutunud, või konto, mille olek, aadress, parool või kaheastmeline autentimine muutus seose salvestamise ajal. Alustage sisselogimist uuesti.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (konto ebaõnnestumiste viivitus) või `rate_limited` (piirang `auth`, paroolide räsimise järjekord).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: paroolide räsimise järjekord või andmebaas jäi lukustatuks (`retryAfter: 1`, midagi ei seotud). `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Loo konto esimesel Google'iga sisselogimisel
      description: |-
        Kui `finish` vastas `needsUsername`: loob valitud kasutajanimega konto (kehtivad registreerumise reeglid) ja logib selle sisse. Kontol pole parooli: `hasPassword` on `false` ja „Unustasite parooli?“ (`POST /auth/password/forgot`) annab sellele parooli.

        **Piirang:** `auth` (koos selle IPv6 /48 loendusega).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Konto on loodud ja sisse logitud.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: see server ei paku Google''iga sisselogimist.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (kasutajanimi on mõnel kontol või selle hoiab kinni mõne teise aadressi ootel registreerumine), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: tundmatu, kasutatud või aegunud pilet.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: piirang `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (andmebaas jäi lukustatuks), `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Loetle sisselogitud seadmed
      description: |-
        Konto aktiivsed seansid (sisselogitud seadmed), viimati kasutatud esimesena. `current` märgib seanssi, mis päringu teeb. `lastSeenAt` uuendatakse mitte sagedamini kui iga 5 minuti järel (hiljem, kui server on tööga kaugele maha jäänud); `expiresAt` on absoluutne lõpp ja jõudeoleku piirang võib seansi varem lõpetada.

        **Piirang:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aktiivsed seansid.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: piirang `sessions` või konto kvoot.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (andmebaas jäi lukustatuks), `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Logi üks seade välja
      description: |-
        Logib välja konto ühe seansi; välja võib logida ka praeguse seansi. Sellega avatud WebSocket suletakse. Keha puudub (või `{}`).

        **Piirang:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Seanss on välja logitud.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: muu keha kui `{}` või `id`, mis pole kehtiv URL-kodeering; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: sellel kontol pole selle ID-ga aktiivset seanssi.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: piirang `sessions` või konto kvoot.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (andmebaas jäi lukustatuks), `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Too konto, selle reitingud ja aktiivsed sanktsioonid
      description: |-
        Konto nii, nagu selle mängija seda näeb: konto vaade (ka iga sisselogimisvastuse `user`), üks reitingukirje iga kategooria kohta, milles mängija on reitinguga partiisid mänginud, aktiivsed sanktsioonid ja peatamine. Sohitõrje usaldusväärsuse taset ei näidata kunagi.

        **Piirang:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Konto.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized` või `invalid_token` (ka siis, kui konto on kustutatud).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: piirang `account` või konto kvoot.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (andmebaas jäi lukustatuks), `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Võta otseseid väljakutseid vastu või lükka need tagasi
      description: |-
        Määrab, kas teised mängijad võivad seda mängijat nime järgi välja kutsuda. Väärtusega `none` lükatakse otsesed väljakutsed tagasi: väljakutsujale öeldakse, et mängija pole saadaval. Uuesti autentimist ei nõuta.

        **Piirang:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: Praegu kehtivad eelistused.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: piirang `account` või konto kvoot.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (andmebaas jäi lukustatuks), `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Muuda parooli
      description: |-
        Muudab parooli. Vaja on praegust parooli, kuid mitte teist tegurit, isegi kui kaheastmeline autentimine on sisse lülitatud. Uus parool peab vastama registreerumise reeglitele (kontrollitakse pärast praegust parooli).

        Muudatusel on ühes transaktsioonis (kõik või mitte ükski) järgmised tagajärjed: see tühistab kõik teised seansid (see seanss jääb sisse logituks), tühistab ootel e-posti aadressi muutmise, muudab konto parooli lähtestamislingid kehtetuks ja saadab omanikule e-kirja.

        **Uuesti autentimine:** ainult parool. **Piirangud:** `reauth`, seejärel `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Parool on muudetud.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (ainult Google''iga sisse logiv konto), `weak_password` (koos väljaga `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: vale praegune parool või parooli lähtestamine või muutmine, mis toimus päringu kontrollimise ajal.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (konto ebaõnnestunud uuesti autentimised) või `rate_limited` (piirang `reauth` või `reauth_user`, konto kvoot, paroolide räsimise järjekord).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: paroolide räsimise järjekord või andmebaas jäi lukustatuks (`retryAfter: 1`, midagi ei muutunud). `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Alusta kaheastmelise autentimise sisselülitamist
      description: |-
        Salvestab autentimisrakenduse jaoks uue ootel salajase võtme, mis asendab iga varasema ootel võtme, ja tagastab selle autentimisrakenduse jaoks (tekstina ja `otpauth://` URI-na, mida näidata QR-koodina). Kaheastmeline autentimine pole veel sisse lülitatud: `POST /account/mfa/totp/enable` lülitab selle sisse selle võtme koodiga.

        **Uuesti autentimine:** ainult parool. **Piirangud:** `reauth`, seejärel `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Ootel salajane võti.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (ainult Google''iga sisse logiv konto), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (kontrollitakse enne parooli).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (konto ebaõnnestunud uuesti autentimised) või `rate_limited` (piirang `reauth` või `reauth_user`, konto kvoot, paroolide räsimise järjekord).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (paroolide räsimise järjekord või andmebaas jäi lukustatuks), `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Lõpeta kaheastmelise autentimise sisselülitamine ja saa taastekoodid
      description: |-
        Lülitab kaheastmelise autentimise sisse ootel salajase võtme koodiga (täpselt 6 numbrit). Siin parooli ei küsita; see anti seadistamisel. Vastuses on 10 taastekoodi, mida näidatakse ainult see üks kord.

        **Piirangud:** `reauth`, seejärel `reauth_user`; vale kood läheb arvesse konto uuesti autentimise ebaõnnestumiste hulka.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Kaheastmeline autentimine on sisse lülitatud.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` ei ole täpselt 6 numbrit või keha rikub skeemi; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: vale kood (kontrollige seadme kellaaega).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: ootel salajast võtit pole (kutsuge kõigepealt välja `POST /account/mfa/totp/setup`).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (konto ebaõnnestunud uuesti autentimised) või `rate_limited` (piirang `reauth` või `reauth_user`, konto kvoot).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (andmebaas jäi lukustatuks), `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: Lülita kaheastmeline autentimine välja
      description: |-
        Lülitab kaheastmelise autentimise välja. Salajane võti ja taastekoodid kustutatakse ning omanik saab e-kirja.

        **Uuesti autentimine:** parool ja autentimisrakenduse kood või taastekood (nõutav on üks väljadest `code` või `recoveryCode`). **Piirangud:** `reauth`, seejärel `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Kaheastmeline autentimine on välja lülitatud.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (ainult Google''iga sisse logiv konto), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required` (pole välja `code` ega `recoveryCode`; kontrollitakse enne parooli), `invalid_password`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (ebaõnnestunud uuesti autentimised või sellel kontol on proovitud liiga palju koode) või `rate_limited` (piirang `reauth` või `reauth_user`, konto kvoot, paroolide räsimise järjekord).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (paroolide räsimise järjekord või andmebaas jäi lukustatuks), `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /account/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags:
        - two-step-verification
      summary: Asenda taastekoodid
      description: |-
        Asendab taastekoodid 10 uue koodiga; vanad lakkavad töötamast.

