components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Seansitoken (`sct_`, millele järgneb 43 base64url-märki) sisselogimisvastusest, päises `Authorization`: `Authorization: Bearer <token>`. Eesliide on täpselt `Bearer` (tõstutundlik) ja üks tühik; väärtus, millel seda pole, või token, mis ei koosne 1 kuni 512 prinditavast ASCII-märgist, saab vastuseks 401 `invalid_token` nagu iga teine kehtetu token. Tühi päis loetakse päise puudumiseks.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: 'Partii ID: positiivne kümnendsüsteemis täisarv, kuni 16 numbrit, ilma eesnullideta, alla 2^53.'
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: Seansi ID, nagu `GET /auth/sessions` selle annab, kirjutatuna ilma eesnullideta (`03` pole seanss 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Mängija kasutajanimi, tõstust arvestamata. Server võtab vastu iga nime, mis koosneb 2 kuni 24 märgist hulgast `[A-Za-z0-9_.-]` (kõige laiem reegel, mida server on kunagi lubanud).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Partii ID; loetletakse ainult vanemad partiid. Andke eelmise lehekülje `next`. Tühi väärtus loetakse puuduvaks.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Lehekülje suurus, 1 kuni 50. Suurem, kuni 3-kohaline arv loetakse võrdseks 50-ga; tühi väärtus loetakse puuduvaks.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: E-posti lingi token (43 base64url-märki). Puuduva või vale tokeni korral näidatakse lehte „link invalid or expired“ (link on kehtetu või aegunud).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Serveri iga vastus keelab vahemällu salvestamise.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Sekundid, mida oodata enne uut katset; sama väärtus mis `retryAfter` kehas.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Bearer-väljakutse, kehtetu tokeni korral koos parameetriga `error="invalid_token"`.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Server sulgeb ühenduse pärast seda vastust.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (koos väljaga `field`, kui viga on keha mõnes väljas) või `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Väli rikub skeemi
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Keha pole JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Nõrk parool
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: PGN, mida ei saa lugeda
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (päist `Authorization` pole) või `invalid_token` (token on vigane, aegunud, tühistatud või kuulub kustutatud kontole).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Seanss puudub
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Kehtetu token
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Päring lükatakse tagasi.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Vale parool uuesti autentimisel
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Peatatud konto
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found` või funktsioon, mille see server on välja lülitanud.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: keha ei saabunud 10 sekundi jooksul. Server sulgeb ühenduse.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Päring on vastuolus serveri olekuga.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: Google''iga sisselogimise katse või pilet on tundmatu, kasutatud või aegunud; alustage sisselogimist uuesti.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: keha ületab väärtuse `HTTP_BODY_LIMIT` (vaikimisi 16 384 baiti). Server sulgeb ühenduse.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: päringu sihtmärk on pikem kui 4096 märki.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: keha pole `application/json` või selle märgistik pole UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: partiis on rohkem kui `GIF_MAX_PLIES` (600) poolkäiku.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: lahendage väljakutse `pow` ja saatke sama päring uuesti koos väljaga `pow: { challenge, nonce }`. `reason` ütleb põhjuse: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` või `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (päringute piirang, konto kvoot või paroolide räsimise järjekord) või `too_many_attempts` (konto pidurdus), koos väljaga `retryAfter` ja päisega `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Päringute piirang
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Sellel kontol on liiga palju ebaõnnestumisi
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: ootamatu tõrge. Server logib selle.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: vale `state` või `iss` või Google lükkas koodi tagasi või saatis ID-tokeni, mis ei läbi kontrolli (sealhulgas teise kliendi – mängu või veebisaidi – kood või ID-token). See ei sisalda kunagi Google''i teksti.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` või `timeout`: proovige uuesti pärast `retryAfter` sekundit, kui see on antud.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Server on hõivatud
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Andmebaas jäi lukustatuks (lugemine)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Serveril kulus liiga kaua aega
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Animeeritud GIF manusena.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` selle serveri partii puhul, `attachment; filename="scacelith-game.gif"` otspunktiga `POST /gif` saadetud PGN-i puhul.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Faili suurus baitides.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: HTML-leht.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: HTML-leht, mis selgitab tagasilükkamist.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Vorm ei saabunud 10 sekundi jooksul (HTML-leht). Server sulgeb ühenduse.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: HTML-leht, mis selgitab konflikti.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Vorm ületab väärtuse `HTTP_BODY_LIMIT` (HTML-leht). Server sulgeb ühenduse.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Keha pole ei vorm (`application/x-www-form-urlencoded`) ega JSON või selle märgistik pole UTF-8 (HTML-leht).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Päringute piirang (HTML-leht), koos päisega `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Ootamatu tõrge (HTML-leht pealkirjaga „Server error“). Server logib selle.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Server on hõivatud (andmebaas jäi lukustatuks või server on tööga kaugele maha jäänud; koos päisega `Retry-After`) või sellel kulus liiga kaua aega (HTML-leht pealkirjaga „Server error“).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: JSON API iga veavastuse ainus kuju.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Veakood kujul `snake_case`. Klient valib selle põhjal, mida näidata.
          examples:
            - rate_limited
        message:
          type: string
          description: Ingliskeelne lause, mõeldud logide jaoks ja varulahenduseks.
        retryAfter:
          type: integer
          minimum: 1
          description: Sekundid, mida oodata enne uut katset; on olemas ainult tagasilükkamistel, mis aja möödudes lõpevad. Siis on vastuses ka sama väärtusega päis `Retry-After`, välja arvatud ajaloo, partii, mängija ja edetabeli lugemise 503 `busy` korral.
        field:
          type: string
          description: Väli või päringuparameeter, milles on viga (`invalid_request`, `invalid_option` ning otspunkti `GET /account/games` `invalid_cursor`, `invalid_limit` ja `invalid_filter`). Pesastatud väli kirjutatakse punktidega (`pow.nonce`).
        reason:
          type: string
          description: 'Põhjus: reegel, mida `weak_password` rikub, või miks töötõendit nõuti või see tagasi lükati (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Ainult `banned`: peatamise lõpp (Unixi aeg, ms), alalise peatamise korral `null`.'
        line:
          type: integer
          minimum: 1
          description: 'Ainult `invalid_pgn`: vea rida, alates 1-st.'
        column:
          type: integer
          minimum: 1
          description: 'Ainult `invalid_pgn`: vea veerg, alates 1-st, märkides.'
    PowChallenge:
      type: object
      description: Töötõendi väljakutse (vastuse 428 `pow_required` väli `pow`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Allkirjastatud väljakutse, mis tuleb saata tagasi muutmata kujul.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Nullbittide arv, millega `SHA-256(challenge + ":" + nonce)` peab algama.
        expiresAt:
          type: integer
          format: int64
          description: 'Millal väljakutse aegub (Unixi aeg, ms): 2 minutit pärast selle väljaandmist.'
    PowAnswer:
      type: object
      description: Vastus töötõendi väljakutsele.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: Vastuse 428 `challenge` samal kujul, nagu see anti.
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Kuni 20 numbrist koosnev kümnendstring, mille korral `SHA-256(challenge + ":" + nonce)` algab `bits` nullbitiga.
    ServerInfo:
      type: object
      description: Mida klient vajab enne sisselogimist või ühendumist.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Serveri nimi (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: UUID, mille andmebaas saab esimesel käivitamisel. See jääb taaskäivitustel samaks. See on `null`, kui andmebaas ei saa seda anda.
        motd:
          type: string
          description: Päevasõnum (`SERVER_MOTD`), võib olla tühi.
        protocol:
          type: object
          description: WebSocketi protokoll (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Vanim protokolliversioon, mida server toetab.
            max:
              type: integer
              minimum: 1
              description: Uusim protokolliversioon, mida server toetab.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'Protokolli skeemi sõrmejälg (selle kanoonilise kuju SHA-256 esimesed 4 baiti märgita täisarvuna: `0xc649140f`, 3326678031, protokolli alamversiooni 2 puhul); informatiivne, seda ei võrrelda kunagi.'
            subprotocol:
              type: string
              description: WebSocketi alamprotokolli tunnus (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: WebSocketi port, mida mängijad kasutavad (`PUBLIC_WS_PORT`, muidu `WS_PORT`, muidu `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: WebSocketi tee.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Kas uusi kontosid saab luua.
        emailVerification:
          type: boolean
          description: Kas uued kontod kinnitavad oma aadressi (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Kas mängule pakutakse Google'iga sisselogimist.
            googleWeb:
              type: boolean
              description: Kas Google'iga sisselogimist pakutakse ka veebisaidile (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: Kaheastmeline autentimine on alati saadaval.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Töötõendi bitid, mida registreerumine nõuab (0, kui ei nõua).
        categories:
          type: array
          description: Ametlikud (reitinguga) ajakontrollid (`RATED_CATEGORIES`) serveri järjekorras. Iga muu ajakontroll on `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Reeglid, mida klient saab kontrollida enne vormi saatmist.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: Kasutajanime vähim pikkus (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: Kasutajanime suurim pikkus (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Regulaaravaldis, millele uus kasutajanimi peab vastama.
            passwordMinLength:
              type: integer
              description: Parooli vähim pikkus märkides (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Parooli suurim pikkus UTF-8 baitides.
            customTimeControls:
              type: boolean
              description: Kas väljakutsetes ja privaatpartiides võib kasutada kohandatud ajakontrolle.
            reportsPerDay:
              type: integer
              description: Mitu teadet võib mängija 24 tunni jooksul esitada (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Suurim WebSocketi sõnum, mida klient võib saata, baitides.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Ametlik ajakontroll.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 'Kategooria ID: minutid ja lisaaja sekundid (`3+2`).'
        baseSec:
          type: number
          minimum: 0
          description: Põhiaeg sekundites.
        incSec:
          type: number
          minimum: 0
          description: Lisaaeg käigu kohta sekundites.
    AccountView:
      type: object
      description: Konto nii, nagu selle mängija seda näeb (sisselogimisvastuste ja otspunkti `GET /account/me` väli `user`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: Konto ID.
        username:
          type: string
          description: Kasutajanimi.
        email:
          type: string
          format: email
          description: E-posti aadress.
        emailVerified:
          type: boolean
          description: Kas aadress on kinnitatud.
        mfaEnabled:
          type: boolean
          description: Kas kaheastmeline autentimine on sisse lülitatud.
        googleLinked:
          type: boolean
          description: Kas Google'i konto on seotud.
        hasPassword:
          type: boolean
          description: '`false` Google''i kaudu loodud konto puhul, millele pole veel parooli määratud.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Kas otsesed väljakutsed nime järgi võetakse vastu (vt `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Millal konto loodi (Unixi aeg, ms).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Viimane sisselogimine (Unixi aeg, ms) või `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Lingi kaudu kinnitamist ootava e-posti aadressi muutmise uus aadress või `null`.
    SessionAnswer:
      type: object
      description: Uus seanss.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Seansitoken päise `Authorization` ja WebSocketi jaoks.
        expiresAt:
          type: integer
          format: int64
          description: Seansi absoluutne lõpp (Unixi aeg, ms); jõudeoleku piirang võib selle varem lõpetada.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Kaheastmelise autentimisega sisselogimise teine samm; jätkake otspunktiga `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Selle sammu token otspunkti `POST /auth/login/mfa` jaoks.
        expiresIn:
          type: integer
          const: 300
          description: Sammu lõpetamiseks jäänud sekundid.
    LoginAnswer:
      description: Seanss või kaheastmelise autentimisega sisselogimise teine samm.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Esimene Google'iga sisselogimine; jätkake otspunktiga `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Pilet otspunkti `POST /auth/sso/complete` jaoks, kehtib 10 minutit.
        suggestedUsername:
          type: string
          description: Google'i nimest või aadressist tehtud kasutajanimi või `""`, kui miski ei sobi.
    SsoNeedsPassword:
      type: object
      description: Aadressi kasutab parooliga konto; jätkake otspunktiga `POST /auth/sso/google/link`. Midagi pole veel seotud.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Pilet otspunkti `POST /auth/sso/google/link` jaoks.
        username:
          type: string
          description: Selle konto kasutajanimi (seda näeb ainult see, kes on Google'ile aadressi omamist tõendanud).
        expiresIn:
          type: integer
          const: 600
          description: Mitu sekundit pilet kehtib.
    SsoFinishAnswer:
      description: Otspunkti `POST /auth/sso/google/finish` vastus.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Google'iga sisselogimise katse.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Katse otspunkti `POST /auth/sso/google/finish` jaoks.
        authUrl:
          type: string
          format: uri
          description: Google'i URL, mis tuleb pärast kontrollimist avada süsteemi brauseris.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state`, mille Google peab tagasi saatma.'
        expiresIn:
          type: integer
          const: 600
          description: Mitu sekundit katse kehtib.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Kasutajanimi; seejärel kehtivad serveri reeglid (vt kirjeldust).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: E-posti aadress. Algus- ja lõputühikud eemaldatakse ning see salvestatakse väiketähtedega.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Parool; seejärel kehtivad paroolireeglid.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Kasutajanimi või e-posti aadress (iga tekst, milles on `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Valikuline. Näidatakse sisselogitud seadmete loendis (näiteks `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: Sisselogimisvastuse (või Google'iga sisselogimise vastuse) `mfaToken`.
        code:
          type: string
          maxLength: 32
          description: Valikuline. 6-kohaline autentimisrakenduse kood või taastekood.
        recoveryCode:
          type: string
          maxLength: 32
          description: Valikuline. Taastekood. Vaja on üht väljadest `code` ja `recoveryCode`.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: E-posti aadress.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Lähtestamislingi parameeter `token`.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Uus parool; kehtivad registreerumise paroolireeglid.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Kliendi `codeVerifier` S256 PKCE väljakutse (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Kliendi kuulaja port aadressil `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Lehe `codeVerifier` S256 PKCE väljakutse (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`attemptId` otspunkti `POST /auth/sso/google/start` vastusest.'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: PKCE verifitseerija; selle SHA-256 peab vastama sammule `start` antud väljakutsele.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state` sellisena, nagu Google selle tagasi saatis.'
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: '`code` sellisena, nagu Google selle tagasi saatis (prinditav ASCII ilma tühikuteta).'
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Valikuline. `iss` sellisena, nagu Google selle tagasi saatis, kui ta selle saatis.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`linkTicket` sammu `finish` vastusest, kehtib 10 minutit.'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Konto parool.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`ssoTicket` sammu `finish` vastusest, kehtib 10 minutit.'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Kasutajanimi; kehtivad registreerumise reeglid.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Aktiivsed seansid, viimati kasutatud esimesena.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Aktiivne seanss (sisselogitud seade).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: Seansi ID otspunkti `DELETE /auth/sessions/{id}` jaoks.
        createdAt:
          type: integer
          format: int64
          description: Sisselogimine (Unixi aeg, ms).
        lastSeenAt:
          type: integer
          format: int64
          description: Viimane kasutus (Unixi aeg, ms), uuendatakse mitte sagedamini kui iga 5 minuti järel (hiljem, kui server on tööga kaugele maha jäänud).
        expiresAt:
          type: integer
          format: int64
          description: Absoluutne lõpp (Unixi aeg, ms); jõudeoleku piirang võib seansi varem lõpetada.
        clientLabel:
          type:
            - string
            - 'null'
          description: Sisselogimisel saadetud `clientLabel` või `null`, kui seda ei saadetud.
        current:
          type: boolean
          description: Kas see on seanss, mis päringu teeb.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Üks kirje iga kategooria kohta, milles mängija on reitinguga partiisid mänginud.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Aktiivsed sanktsioonid.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: 'Peatamise ajal `{ until }`, muidu `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Ühe kategooria reitingukirje.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: Kategooria ID.
        rating:
          type: integer
          description: Reiting.
        games:
          type: integer
          minimum: 0
          description: Kategoorias mängitud partiid (arvesse läinud või mitte).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Kõrgeim saavutatud reiting.
        provisional:
          type: boolean
          description: '`true`, kuni reiting on reitinguta faasis või sellel on vähem kui `PROVISIONAL_GAMES` arvesse läinud partiid (mäng näitab seda kujul `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Sanktsiooni liik.
        reason:
          type:
            - string
            - 'null'
          description: Antud põhjus, kui see on olemas.
        startsAt:
          type: integer
          format: int64
          description: Algus (Unixi aeg, ms).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Lõpp (Unixi aeg, ms), alalise sanktsiooni korral `null`.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Peatamise lõpp (Unixi aeg, ms), alalise peatamise korral `null`.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` otseste väljakutsete vastuvõtmiseks nime järgi, `none` nende tagasilükkamiseks.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Praegune parool.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Uus parool; kehtivad registreerumise paroolireeglid.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Konto parool.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Ootel salajase võtme kood, täpselt 6 numbrit.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Konto parool.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Valikuline; vajalik kaheastmelise autentimise korral (või `recoveryCode`). Autentimisrakenduse kood või taastekood.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Valikuline. Taastekood (`xxxx-xxxx-xx`; tõstul, tühikutel ja sidekriipsudel pole tähtsust).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Konto parool.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Autentimisrakenduse kood (taastekood lükatakse tagasi).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Uus aadress; algus- ja lõputühikud eemaldatakse ja see teisendatakse väiketähtedeks, seejärel kontrollitakse seda nagu registreerumisel antud aadressi.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Konto parool.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Valikuline; vajalik kaheastmelise autentimise korral (või `recoveryCode`). Autentimisrakenduse kood või taastekood.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Valikuline. Taastekood.
    TotpSetup:
      type: object
      description: Ootel salajane võti autentimisrakenduse jaoks.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Salajane võti base32 kujul, rakendusse sisestamiseks.
        uri:
          type: string
          format: uri
          description: URI `otpauth://totp/...`, mida näidata QR-koodina.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Sekundeid sammu kohta.
    RecoveryCodeList:
      type: array
      description: 10 taastekoodi, mida näidatakse ainult see üks kord. Iga kood töötab ühe korra.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Partii üks pool.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Nimi partiikirjes (kustutatud konto puhul `deleted#<id>`).
        rating:
          type:
            - integer
            - 'null'
          description: Reiting alguses, `null`, kui see pole teada.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Reiting pärast partiid. Reitinguga partiil on see alati olemas; `null` ainult partii puhul, mis reitingutes arvesse ei lähe (reitinguta, kohandatud, katkestatud).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Reitingu muutus; `0`, kui reitingureeglid jätavad reitingu samaks (FIDE nullitulemus, reitinguta vastane, reitinguta mängija esimesed partiid); `null` samadel juhtudel kui `ratingAfter`.
    GameSummary:
      type: object
      description: Salvestatud partii kokkuvõte.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Partii ID.
        category:
          type: string
          description: Ametliku kategooria ID (`3+2`) või `custom`.
        rated:
          type: boolean
          description: Kas partii läheb reitingutes arvesse.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Ajakontroll sekundites (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (vt partiide koode).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Lõpu põhjuse kood (vt partiide koode).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Tulemus, katkestatud partii puhul `*`.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Poolkäikude arv.
        startedAt:
          type: integer
          format: int64
          description: Algus (Unixi aeg, ms).
        endedAt:
          type: integer
          format: int64
          description: Lõpp (Unixi aeg, ms).
    Termination:
      type: string
      description: Lõpu põhjuse nimi (vt partiide koode); `Unknown` koodi puhul, mida protokoll ei tunne.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Partii kokkuvõte ühe mängija vaatenurgast.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Mängija pool.
    HistoryGameSummary:
      description: Partii sisselogitud mängija ajaloost.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Põhiaeg millisekundites.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Lisaaeg millisekundites.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: Tulemus mängija vaatenurgast.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Lehekülje partiid, uusimad esimesena.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: ID, mis tuleb järgmise lehekülje jaoks anda parameetrina `before`, või viimasel leheküljel `null`.
        total:
          type: integer
          minimum: 0
          description: Filtrile vastavate partiide arv kõigil lehekülgedel kokku.
    MoveRecord:
      type: object
      description: Partii üks poolkäik.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: Käik UCI-noteeringus; muundumise korral lisatakse `n`, `b`, `r` või `q`.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Käigu eest arvestatud aeg (ms), `null`, kui kirjes seda pole.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Käigu teinud mängija kell pärast käiku (ms), `null`, kui kirjes seda pole.
    PgnTagsView:
      type: object
      description: Peamised PGN-märgendid kuvamiseks. `Termination` on siin lõpu põhjuse nimi; PGN-fail kasutab PGN-standardi väärtusi.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` või `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: Alguskuupäev UTC järgi.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Reiting alguses või `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Reiting alguses või `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Partiikirje koos käikude ja kelladega. Sellel on partii kokkuvõtte väljad, ilma väljadeta `color` ja `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Põhiaeg millisekundites.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Lisaaeg millisekundites.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: Väärtuse `status` nimi.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: Selle partii ID, mille revanš see partii on, või `null`.
            moves:
              type: array
              description: Üks kirje poolkäigu kohta.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Ainult siis, kui tokeni mängija mängis seda partiid; tema pool.
            reportable:
              type: boolean
              description: Ainult siis, kui tokeni mängija mängis seda partiid; `true`, kui `POST /reports` võtaks praegu vastu teate selle partii vastase kohta (partii lõppes 7 päeva jooksul, päevakvoot pole ära kasutatud ja vastasest pole selle partii kohta juba teatatud).
    PlayerProfile:
      type: object
      required:
