  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Loetle mängija partiid filtreeritult ja lehekülgedena
      description: |-
        Sisselogitud mängija partiid, uusimad esimesena, filtreeritult ja lehekülgedena, koos filtrile vastavate partiide arvuga. Kõik päringuparameetrid on valikulised ja tühi väärtus loetakse puuduvaks.

        Lehekülgede kaupa liikumine: andke eelmise lehekülje `next` parameetrina `before`; viimasel leheküljel on `next` väärtus `null`. `total` loendab filtrile vastavad partiid kõigil lehekülgedel kokku.

        **Piirang:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: Ametliku kategooria ID (`3+2` või `3%2B2`) või `custom` kõigi muu ajakontrolliga partiide jaoks.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Ainult reitinguga (`true`) või reitinguta (`false`) partiid.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Ainult võidetud, kaotatud või viigiga lõppenud partiid mängija vaatenurgast. Katkestatud partiid on näha ainult ilma selle filtrita.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Üks lehekülg ajaloost.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` pole partii ID), `invalid_limit` või `invalid_filter` (`category`, `rated` või `result`), igaüks koos väljaga `field`, mis nimetab parameetri.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: piirang `account_games` või konto kvoot.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (andmebaas jäi lukustatuks; kehas `retryAfter: 1`, päist `Retry-After` pole), `server_busy` (seansi otsimisel oli andmebaas lukus), `timeout`. Samuti `server_busy` väärtusega `retryAfter` 2 kuni 5, kui server on tööga kaugele maha jäänud (vt sissejuhatust): päringut ei täidetud.'
  /games/{id}:
