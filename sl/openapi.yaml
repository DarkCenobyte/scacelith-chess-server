  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Seznam igralčevih partij s filtri in straničenjem
      description: |-
        Partije prijavljenega igralca, od najnovejše naprej, filtrirane in razdeljene na strani, s številom partij, ki ustrezajo filtru. Vsi parametri poizvedbe so neobvezni, prazna vrednost pa velja za izpuščeno.

        Straničenje: `next` prejšnje strani pošljite kot `before`; na zadnji strani je `next` enak `null`. `total` šteje partije, ki ustrezajo filtru, na vseh straneh.

        **Omejitev:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: ID uradne kategorije (`3+2` ali `3%2B2`) ali `custom` za vse partije z drugim tempom igre.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Samo partije za rating (`true`) ali prijateljske partije (`false`).
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Samo dobljene, izgubljene ali z remijem končane partije, z vidika igralca. Preklicane partije se prikažejo samo brez tega filtra.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Ena stran zgodovine.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` ni ID partije), `invalid_limit` ali `invalid_filter` (`category`, `rated` ali `result`), vse z `field`, ki poimenuje parameter.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: omejitev `account_games` ali kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (zbirka podatkov je ostala zaklenjena; `retryAfter: 1` v telesu, brez glave `Retry-After`), `server_busy` (iskanje seje je naletelo na zaklenjeno zbirko podatkov), `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /games/{id}:
