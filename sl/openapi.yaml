  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: Pridobivanje najboljših igralcev kategorije
      description: |-
        100 najboljših zapisov ratinga uradne kategorije z vsaj `minGames` (`PROVISIONAL_GAMES`) upoštevanimi partijami, brez izbrisanih računov in potrjenih goljufov. Strežnik vsako lestvico znova izračuna največ na vsakih 10 sekund; `updatedAt` pove, kdaj. Za posamezno kategorijo hkrati teče samo en izračun: medtem druge zahteve dobijo prejšnji seznam ali pa počakajo na izračun, če seznama še ni.

        **Omejitve:** samo sloj po naslovu.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: ID uradne kategorije (`3+2` ali `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: Število igralcev, od 1 do 100. Večje število z največ 3 števkami šteje kot 100; prazna vrednost velja za izpuščeno.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: Lestvica.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (manjka ali ni uradna kategorija), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: sloj po naslovu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (zbirka podatkov je ostala zaklenjena; `retryAfter: 1` v telesu, brez glave `Retry-After`), `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Prijava nasprotnika iz nedavne partije
      description: |-
        Prijavi nasprotnika iz ene od igralčevih lastnih partij, ki se je končala v zadnjih 7 dneh. Prijava kršitve sama po sebi nikoli ne spremeni ratinga, sankcije ali ravni integritete. Zviša prioriteto pregleda, ki jo vidijo moderatorji, in razen pri `abuse` zahteva analizo partije s šahovskim programom.

        Prijava istega nasprotnika za isto partijo dobi enak odgovor in ničesar ne spremeni; odgovor nikoli ne razkrije ničesar o računu, zoper katerega je bila vložena prijava. `GET /games/{id}` igralcema partije vnaprej pove, ali bi bila prijava sprejeta (`reportable`).

        Ta končna točka sama preveri svoje telo, v vrstnem redu `gameId`, `reported`, `category`, `comment`: ob neuspehu odgovori s 400 `invalid_request` brez `field`. Polja, ki jih ne pozna, prezre.

        **Omejitve:** `reports` (po igralcu), nato `REPORTS_PER_DAY` (5) prijav kršitev na igralca v 24 urah (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Prijava kršitve je prejeta (ali pa je bila že vložena).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (brez `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: ni nasprotnik prijavitelja v partiji, ki se je končala v zadnjih 7 dneh.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
