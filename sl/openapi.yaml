                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Žeton seje (`sct_`, ki mu sledi 43 znakov base64url) iz odgovora na prijavo, v glavi `Authorization`: `Authorization: Bearer <token>`. Predpona je natanko `Bearer` (razlikujejo se velike in male črke) in en presledek; na vrednost brez nje ali na žeton, ki nima od 1 do 512 natisljivih znakov ASCII, je odgovor 401 `invalid_token` kot pri vsakem drugem neveljavnem žetonu. Prazna glava velja, kot da glave ni.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: ID partije, pozitivno desetiško celo število z največ 16 števkami brez vodilnih ničel, manjše od 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: ID seje, kot ga vrne `GET /auth/sessions`, zapisan brez vodilnih ničel (`03` ni seja 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Uporabniško ime igralca, ne glede na velike in male črke. Strežnik sprejme vsako ime, dolgo od 2 do 24 znakov iz `[A-Za-z0-9_.-]` (najširše pravilo, ki ga je kdaj dovoljeval).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: ID partije; navedene so samo starejše partije. Pošljite `next` prejšnje strani. Prazna vrednost velja za izpuščeno.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Velikost strani, od 1 do 50. Večje število z največ 3 števkami šteje kot 50; prazna vrednost velja za izpuščeno.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: Žeton povezave iz e-poštnega sporočila (43 znakov base64url). Če manjka ali je napačen, se prikaže stran »link invalid or expired« (povezava je neveljavna ali potekla).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Vsak odgovor strežnika prepoveduje predpomnjenje.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Število sekund, ki jih je treba počakati pred ponovnim poskusom; enaka vrednost kot `retryAfter` v telesu.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Izziv sheme Bearer, z `error="invalid_token"` pri neveljavnem žetonu.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Strežnik po tem odgovoru zapre povezavo.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (z `field`, kadar je napaka v polju telesa) ali `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Polje krši shemo
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Telo ni JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Šibko geslo
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: PGN, ki ga ni mogoče prebrati
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (brez glave `Authorization`) ali `invalid_token` (žeton je napačno oblikovan, potekel, preklican ali pripada izbrisanemu računu).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Brez seje
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Neveljaven žeton
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Zahteva je zavrnjena.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Napačno geslo pri ponovnem preverjanju pristnosti
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Blokiran račun
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found` ali funkcija, ki jo je ta strežnik izklopil.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: telo ni prispelo v 10 sekundah. Strežnik zapre povezavo.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Zahteva je v sporu s stanjem strežnika.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: neznan, že uporabljen ali potekel poskus prijave z Googlom ali vstopnica; znova začnite prijavo.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: telo presega `HTTP_BODY_LIMIT` (privzeto 16.384 bajtov). Strežnik zapre povezavo.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: cilj zahteve presega 4096 znakov.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: telo ni `application/json` ali pa njegov nabor znakov ni UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: partija ima več kot `GIF_MAX_PLIES` (600) polpotez.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: rešite izziv `pow` in isto zahtevo pošljite znova s `pow: { challenge, nonce }`. `reason` pove, zakaj: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` ali `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (omejitev števila zahtev, kvota računa ali čakalna vrsta za zgoščevanje gesel) ali `too_many_attempts` (omejitev na ravni računa), z `retryAfter` in glavo `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Omejitev števila zahtev
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Preveč neuspelih poskusov na tem računu
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: nepričakovana napaka. Strežnik jo zabeleži v dnevnik.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: napačen `state` ali `iss` ali pa je Google zavrnil kodo ali poslal žeton ID, ki ne prestane preverjanja (vključno s kodo ali žetonom ID drugega odjemalca, igre ali spletnega mesta). Nikoli ne vsebuje Googlovega besedila.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` ali `timeout`: poskusite znova po `retryAfter`, kadar je naveden.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Strežnik je zaseden
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Zbirka podatkov je ostala zaklenjena (branje)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Strežnik je potreboval preveč časa
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Animirani GIF kot priloga.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` za partijo s tega strežnika, `attachment; filename="scacelith-game.gif"` za PGN, poslan s `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Velikost datoteke v bajtih.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: Stran HTML.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: Stran HTML, ki pojasni zavrnitev.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Obrazec ni prispel v 10 sekundah (stran HTML). Strežnik zapre povezavo.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: Stran HTML, ki pojasni spor.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Obrazec presega `HTTP_BODY_LIMIT` (stran HTML). Strežnik zapre povezavo.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Telo ni niti obrazec (`application/x-www-form-urlencoded`) niti JSON ali pa njegov nabor znakov ni UTF-8 (stran HTML).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Omejitev števila zahtev (stran HTML), z `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Nepričakovana napaka (stran HTML z naslovom »Server error«, tj. napaka strežnika). Strežnik jo zabeleži v dnevnik.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Strežnik je zaseden (zbirka podatkov je ostala zaklenjena ali pa strežnik močno zaostaja; z `Retry-After`) ali pa je potreboval preveč časa (stran HTML z naslovom »Server error«, tj. napaka strežnika).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: Enotna oblika vseh odgovorov z napako v API-ju JSON.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Koda napake v obliki `snake_case`. Odjemalec na njeni podlagi izbere, kaj prikaže.
          examples:
            - rate_limited
        message:
          type: string
          description: Angleški stavek, namenjen dnevnikom in kot nadomestilo.
        retryAfter:
          type: integer
          minimum: 1
          description: Število sekund, ki jih je treba počakati pred ponovnim poskusom; prisotno samo pri zavrnitvah, ki s časom minejo. Odgovor ima takrat tudi glavo `Retry-After` z isto vrednostjo, razen pri 503 `busy` branj zgodovine, partije, igralca in lestvice.
        field:
          type: string
          description: Polje ali parameter poizvedbe, ki povzroča napako (`invalid_request`, `invalid_option` ter `invalid_cursor`, `invalid_limit` in `invalid_filter` pri `GET /account/games`). Gnezdeno polje je zapisano s piko (`pow.nonce`).
        reason:
          type: string
          description: 'Zakaj: pravilo, ki ga krši `weak_password`, ali zakaj je bil dokaz o delu zahtevan ali zavrnjen (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Samo `banned`: konec blokade (ms od epohe Unix), `null` za trajno blokado.'
        line:
          type: integer
          minimum: 1
          description: 'Samo `invalid_pgn`: vrstica napake, od 1.'
        column:
          type: integer
          minimum: 1
          description: 'Samo `invalid_pgn`: stolpec napake, od 1, v znakih.'
    PowChallenge:
      type: object
      description: Izziv dokaza o delu (`pow` odgovora 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Podpisani izziv, ki ga pošljete nazaj nespremenjenega.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Število vodilnih ničelnih bitov, ki jih mora imeti `SHA-256(challenge + ":" + nonce)`.
        expiresAt:
          type: integer
          format: int64
          description: Čas poteka izziva (ms od epohe Unix), 2 minuti po izdaji.
    PowAnswer:
      type: object
      description: Odgovor na izziv dokaza o delu.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: '`challenge` iz odgovora 428, nespremenjen.'
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Desetiški niz z največ 20 števkami, tak, da se `SHA-256(challenge + ":" + nonce)` začne z `bits` ničelnimi biti.
    ServerInfo:
      type: object
      description: Kar odjemalec potrebuje, preden se prijavi ali poveže.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Ime strežnika (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: UUID, ki ga zbirka podatkov dobi ob prvem zagonu. Ob ponovnih zagonih ostane enak. Je `null`, kadar ga zbirka podatkov ne more podati.
        motd:
          type: string
          description: Sporočilo dneva (`SERVER_MOTD`), lahko prazno.
        protocol:
          type: object
          description: Protokol WebSocket (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Najstarejša različica protokola, ki jo strežnik podpira.
            max:
              type: integer
              minimum: 1
              description: Najnovejša različica protokola, ki jo strežnik podpira.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'Prstni odtis sheme protokola (prvi 4 bajti SHA-256 njene kanonične oblike kot nepredznačeno celo število: `0xc649140f`, 3326678031, za podrazličico protokola 2); samo informativno, nikoli se ne primerja.'
            subprotocol:
              type: string
              description: Identifikator podprotokola WebSocket (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: Vrata WebSocket, ki jih uporabljajo igralci (`PUBLIC_WS_PORT`, sicer `WS_PORT`, sicer `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: Pot WebSocketa.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Ali je mogoče ustvarjati nove račune.
        emailVerification:
          type: boolean
          description: Ali novi računi potrjujejo svoj naslov (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Ali je prijava z Googlom na voljo igri.
            googleWeb:
              type: boolean
              description: Ali je prijava z Googlom na voljo tudi spletnemu mestu (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: Dvofaktorsko preverjanje pristnosti je vedno na voljo.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Biti dokaza o delu, ki jih zahteva registracija (0, če dokaz ni potreben).
        categories:
          type: array
          description: Uradni tempi igre, tj. tisti za rating (`RATED_CATEGORIES`), v vrstnem redu strežnika. Vsak drug tempo igre je `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Pravila, ki jih odjemalec lahko preveri, preden pošlje obrazec.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: Najmanjša dolžina uporabniškega imena (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: Največja dolžina uporabniškega imena (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Regularni izraz, ki mu mora ustrezati novo uporabniško ime.
            passwordMinLength:
              type: integer
              description: Najmanjša dolžina gesla v znakih (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Največja dolžina gesla v bajtih UTF-8.
            customTimeControls:
              type: boolean
              description: Ali smejo izzivi in zasebne partije uporabljati tempe igre po meri.
            reportsPerDay:
              type: integer
              description: Koliko prijav kršitev lahko igralec vloži v 24 urah (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Največje sporočilo WebSocket, ki ga odjemalec sme poslati, v bajtih.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Uradni tempo igre.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 'ID kategorije: minute in sekunde dodatka (`3+2`).'
        baseSec:
          type: number
          minimum: 0
          description: Osnovni čas v sekundah.
        incSec:
          type: number
          minimum: 0
          description: Dodatek na potezo v sekundah.
    AccountView:
      type: object
      description: Račun, kot ga vidi njegov igralec (`user` v odgovorih na prijavo in v `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: ID računa.
        username:
          type: string
          description: Uporabniško ime.
        email:
          type: string
          format: email
          description: E-poštni naslov.
        emailVerified:
          type: boolean
          description: Ali je naslov potrjen.
        mfaEnabled:
          type: boolean
          description: Ali je dvofaktorsko preverjanje pristnosti vklopljeno.
        googleLinked:
          type: boolean
          description: Ali je povezan Googlov račun.
        hasPassword:
          type: boolean
          description: '`false` za račun, ustvarjen prek Googla, ki še nima nastavljenega gesla.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Ali račun sprejema neposredne izzive po imenu (glejte `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Čas ustvarjenja računa (ms od epohe Unix).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Zadnja prijava (ms od epohe Unix) ali `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Novi naslov spremembe e-poštnega naslova, ki čaka na potrditev prek povezave, ali `null`.
    SessionAnswer:
      type: object
      description: Nova seja.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Žeton seje za glavo `Authorization` in WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: Absolutni konec seje (ms od epohe Unix); omejitev nedejavnosti jo lahko konča prej.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Drugi korak prijave z dvofaktorskim preverjanjem pristnosti; nadaljujte s `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Žeton koraka za `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Preostale sekunde za dokončanje koraka.
    LoginAnswer:
      description: Seja ali drugi korak prijave z dvofaktorskim preverjanjem pristnosti.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Prva prijava z Googlom; nadaljujte s `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Vstopnica za `POST /auth/sso/complete`, veljavna 10 minut.
        suggestedUsername:
          type: string
          description: Uporabniško ime, sestavljeno iz imena pri Googlu ali iz naslova, ali `""`, kadar nič ne ustreza.
    SsoNeedsPassword:
      type: object
      description: Naslov uporablja račun z geslom; nadaljujte s `POST /auth/sso/google/link`. Nič še ni povezano.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Vstopnica za `POST /auth/sso/google/link`.
        username:
          type: string
          description: Uporabniško ime tega računa (vidi ga samo tisti, ki je Googlu dokazal lastništvo naslova).
        expiresIn:
          type: integer
          const: 600
          description: Koliko sekund vstopnica ostane veljavna.
    SsoFinishAnswer:
      description: Odgovor `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Poskus prijave z Googlom.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Poskus za `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: URL Googla, ki ga po preverjanju odprete v sistemskem brskalniku.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state`, ki ga mora Google poslati nazaj.'
        expiresIn:
          type: integer
          const: 600
          description: Koliko sekund poskus ostane veljaven.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Uporabniško ime; nato še pravila strežnika (glejte opis).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: E-poštni naslov. Presledki na začetku in koncu se odstranijo, shrani pa se z malimi črkami.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Geslo; nato še pravila za gesla.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Uporabniško ime ali e-poštni naslov (vsako besedilo z `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Neobvezno. Prikaže se na seznamu prijavljenih naprav (na primer `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: '`mfaToken` iz odgovora na prijavo (ali iz odgovora na prijavo z Googlom).'
        code:
          type: string
          maxLength: 32
          description: Neobvezno. 6-mestna koda iz aplikacije ali obnovitvena koda.
        recoveryCode:
          type: string
          maxLength: 32
          description: Neobvezno. Obnovitvena koda. Potreben je eden od `code` in `recoveryCode`.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: E-poštni naslov.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Parameter `token` povezave za ponastavitev.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Novo geslo; veljajo pravila za gesla pri registraciji.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Izziv PKCE S256 odjemalčevega `codeVerifier` (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Vrata odjemalčevega poslušalca na `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Izziv PKCE S256 za `codeVerifier` strani (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`attemptId` iz `POST /auth/sso/google/start`.'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: Preverjevalnik PKCE; njegov SHA-256 se mora ujemati z izzivom, podanim `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state`, kot ga je Google poslal nazaj.'
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: '`code`, kot ga je Google poslal nazaj (natisljivi znaki ASCII brez presledkov).'
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Neobvezno. `iss`, kot ga je Google poslal nazaj, če ga je.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`linkTicket` iz `finish`, ki velja 10 minut.'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Geslo računa.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`ssoTicket` iz `finish`, ki velja 10 minut.'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Uporabniško ime; veljajo pravila registracije.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Aktivne seje, od nazadnje uporabljene naprej.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Aktivna seja (prijavljena naprava).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: ID seje za `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: Čas prijave (ms od epohe Unix).
        lastSeenAt:
          type: integer
          format: int64
          description: Zadnja uporaba (ms od epohe Unix), posodobljena največ na vsakih 5 minut (pozneje, dokler strežnik močno zaostaja).
        expiresAt:
          type: integer
          format: int64
          description: Absolutni konec (ms od epohe Unix); omejitev nedejavnosti lahko sejo konča prej.
        clientLabel:
          type:
            - string
            - 'null'
          description: '`clientLabel` prijave ali `null`, kadar ga prijava ni poslala.'
        current:
          type: boolean
          description: Ali je to seja, ki pošilja zahtevo.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: En zapis za vsako kategorijo, v kateri je igralec igral partije za rating.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Aktivne sankcije.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }` med blokado, sicer `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Zapis ratinga ene kategorije.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: ID kategorije.
        rating:
          type: integer
          description: Rating.
        games:
          type: integer
          minimum: 0
          description: Partije, odigrane v kategoriji (upoštevane ali ne).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Najvišji doseženi rating.
        provisional:
          type: boolean
          description: '`true`, dokler rating še ni določen ali ima manj kot `PROVISIONAL_GAMES` upoštevanih partij (igra ga prikaže kot `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Vrsta sankcije.
        reason:
          type:
            - string
            - 'null'
          description: Navedeni razlog, če obstaja.
        startsAt:
          type: integer
          format: int64
          description: Začetek (ms od epohe Unix).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Konec (ms od epohe Unix), `null`, kadar je sankcija trajna.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Konec blokade (ms od epohe Unix), `null`, kadar je trajna.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` za sprejemanje neposrednih izzivov po imenu, `none` za njihovo zavračanje.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Trenutno geslo.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Novo geslo; veljajo pravila za gesla pri registraciji.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Geslo računa.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Koda čakajočega skrivnega ključa, natanko 6 števk.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Geslo računa.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Neobvezno; potrebno pri dvofaktorskem preverjanju pristnosti (ali `recoveryCode`). Koda iz aplikacije ali obnovitvena koda.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Neobvezno. Obnovitvena koda (`xxxx-xxxx-xx`; velike in male črke, presledki in vezaji niso pomembni).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Geslo računa.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Koda iz aplikacije (obnovitvena koda je zavrnjena).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Novi naslov; presledki na začetku in koncu se odstranijo, pretvori se v male črke, nato pa se preveri kot naslov pri registraciji.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Geslo računa.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Neobvezno; potrebno pri dvofaktorskem preverjanju pristnosti (ali `recoveryCode`). Koda iz aplikacije ali obnovitvena koda.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Neobvezno. Obnovitvena koda.
    TotpSetup:
      type: object
      description: Čakajoči skrivni ključ za aplikacijo za preverjanje pristnosti.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Skrivni ključ v base32 za vnos v aplikacijo.
        uri:
          type: string
          format: uri
          description: URI `otpauth://totp/...` za prikaz kot koda QR.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Sekunde na korak.
    RecoveryCodeList:
      type: array
      description: 10 obnovitvenih kod, prikazanih samo tokrat. Vsaka deluje enkrat.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Ena stran partije.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Ime v zapisu partije (`deleted#<id>` za izbrisan račun).
        rating:
          type:
            - integer
            - 'null'
          description: Rating na začetku, `null`, kadar ni znan.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Rating po partiji. Partija za rating ga ima vedno; `null` samo pri partiji, ki ne šteje za rating (prijateljska, s tempom igre po meri, preklicana).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Sprememba ratinga, `0`, kadar pravila ratinga pustijo rating nespremenjen (ničelni rezultat po pravilih FIDE, nasprotnik brez določenega ratinga, prve partije igralca brez določenega ratinga); `null` kot pri `ratingAfter`.
    GameSummary:
      type: object
      description: Povzetek shranjene partije.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: ID partije.
        category:
          type: string
          description: ID uradne kategorije (`3+2`) ali `custom`.
        rated:
          type: boolean
          description: Ali partija šteje za rating.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Tempo igre v sekundah (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (glejte kode partij).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Koda razloga za konec (glejte kode partij).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Rezultat, `*` za preklicano partijo.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Število polpotez.
        startedAt:
          type: integer
          format: int64
          description: Začetek (ms od epohe Unix).
        endedAt:
          type: integer
          format: int64
          description: Konec (ms od epohe Unix).
    Termination:
      type: string
      description: Ime razloga za konec (glejte kode partij); `Unknown` za kodo, ki je protokol ne pozna.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Povzetek partije z vidika enega igralca.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Barva igralca.
    HistoryGameSummary:
      description: Partija iz zgodovine prijavljenega igralca.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Osnovni čas v milisekundah.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Dodatek v milisekundah.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: Izid z vidika igralca.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Partije na strani, od najnovejše naprej.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: ID, ki ga pošljete kot `before` za naslednjo stran, ali `null` na zadnji strani.
        total:
          type: integer
          minimum: 0
          description: Število partij, ki ustrezajo filtru, na vseh straneh.
    MoveRecord:
      type: object
      description: Ena polpoteza partije.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: Poteza v notaciji UCI, pri promociji z dodanim `n`, `b`, `r` ali `q`.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Čas, obračunan za potezo (ms), `null`, kadar ga zapis nima.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Ura igralca, ki je potezo odigral, po potezi (ms), `null`, kadar je zapis nima.
    PgnTagsView:
      type: object
      description: Glavne oznake PGN za prikaz. `Termination` je tu ime razloga za konec; datoteka PGN uporablja standardne vrednosti PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` ali `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: Datum začetka po UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Rating na začetku ali `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Rating na začetku ali `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Zapis partije s potezami in urami. Ima polja povzetka partije, brez `color` in `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Osnovni čas v milisekundah.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Dodatek v milisekundah.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: Ime vrednosti `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: ID partije, katere revanša je ta partija, ali `null`.
            moves:
              type: array
              description: En vnos za vsako polpotezo.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Samo, kadar je igralec, ki mu pripada žeton seje, igral to partijo; njegova barva.
            reportable:
              type: boolean
              description: Samo, kadar je igralec, ki mu pripada žeton seje, igral to partijo; `true`, kadar bi `POST /reports` zdaj sprejel prijavo nasprotnika za to partijo (partija se je končala v zadnjih 7 dneh, dnevna kvota ni porabljena in zoper nasprotnika za to partijo še ni bila vložena prijava).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Uporabniško ime, kot ga je zapisal igralec.
        createdAt:
          type: integer
          format: int64
          description: Čas ustvarjenja računa (ms od epohe Unix).
        ratings:
          type: array
          description: Samo uradne kategorije v vrstnem redu strežnika.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Vse shranjene partije, vključno s prijateljskimi in preklicanimi.
            rated:
              type: integer
              minimum: 0
              description: Partije za rating, seštete prek zapisov ratinga.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Uporabniško ime, kot ga je zapisal igralec.
        games:
          type: array
          description: Partije na strani, od najnovejše naprej.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: ID zadnje partije, kadar je stran polna (naslednja stran je takrat lahko prazna), sicer `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: ID kategorije.
        minGames:
          type: integer
          minimum: 0
          description: Število upoštevanih partij, ki jih zapis potrebuje za uvrstitev na lestvico (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Čas izračuna lestvice (ms od epohe Unix).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: Besedilo PGN, največ 65.536 bajtov UTF-8. Uporabi se samo prva partija.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Neobvezno. Velikost slike.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Neobvezno. Barva, ki je na šahovnici spodaj.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Neobvezno. Milisekunde na potezo, število JSON s celoštevilsko vrednostjo.
        coords:
          type: boolean
          default: true
          description: Neobvezno. Ali so črke linij in številke vrst narisane okoli šahovnice.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Partija, podana kot celo število ali kot niz z 1 do 16 števkami.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Uporabniško ime nasprotnika, kot je v zapisu partije ali kot je zdaj, ne glede na velike in male črke. Ne sme biti prazno.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Na kaj se prijava kršitve nanaša.
        comment:
          type:
            - string
            - 'null'
          description: Neobvezno. Največ 500 znakov po odstranitvi kontrolnih znakov (razen tabulatorja in pomika v novo vrstico) ter presledkov na začetku in koncu besedila.
    AccountExport:
      type: object
      description: Vse, kar strežnik hrani o računu (časi v ms od epohe Unix).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Čas izdelave izvoza.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Kaj datoteka vsebuje in kaj izpušča, v preprosti angleščini za igralca.
          items:
            type: string
        account:
          description: Pogled računa iz `GET /account/me`, z `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Naslov povezanega Googlovega računa ali `null`.
        ratings:
          type: array
          description: Celotni zapisi ratinga.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Točke ratinga, vrnjene, potem ko je bilo ugotovljeno, da je nasprotnik goljufal, seštete po dnevih (UTC) in kategorijah, od najnovejših naprej. Niti partije niti goljufi niso navedeni.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Vse shranjene seje, od najnovejše naprej, brez kakršnega koli žetona. Čiščenje po pravilih hrambe izbriše potečeno sejo, odjavljeno pa dan po odjavi.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Varnostni dogodki, od najnovejšega naprej, hranjeni `RETENTION_SECURITY_DAYS` dni.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Vse sankcije, vključno z odpravljenimi. Ime moderatorja ni nikoli vključeno.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Dogodki vedenja, zabeleženi za igralčeve zapuščene in preklicane partije ter partije brez pravočasne prve poteze, hranjeni 30 dni.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Prijave kršitev, ki jih je vložil igralec.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Število partij.
            list:
              type: array
              description: Vse partije, od najnovejše naprej, kot povzetki iz `GET /account/games`. Poteze so na voljo prek `GET /games/{id}`, PGN pa prek `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Celoten zapis ratinga.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Ali je igralec že zapustil fazo brez določenega ratinga.
            countedGames:
              type: integer
              minimum: 0
              description: Partije, ki so bile upoštevane v ratingu.
            updatedAt:
              type: integer
              format: int64
              description: Čas zadnje spremembe zapisa.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: 00.00 UTC tega dne (ms od epohe Unix).
        category:
          type: string
        points:
          type: integer
          description: Točke, vrnjene tistega dne v tisti kategoriji.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Čas odjave seje ali `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Naslov IP prijave, izbrisan po `RETENTION_IP_DAYS` dneh.
    SecurityEvent:
      type: object
      description: |-
        Varnostni dogodek. `ip` je naveden samo za dejanja, opravljena v prijavljenem stanju, z geslom računa (in drugim faktorjem) ali s povezavo, poslano na njegov naslov: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` in `account_exported`; vse druge vrste imajo `ip: null`, `ip` pa se izbriše po `RETENTION_IP_DAYS` dneh.

        `detail` ohrani samo ta polja: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` in `method` (`password` ali `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` in `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Dogodek `moderator_action` ohrani samo `{ action }`, za dejanja `ban`, `unban`, `reset_mfa`, `verify_email` in `revoke_sessions` (druga dejanja moderatorjev so izpuščena). Vse druge vrste imajo `detail: null`. Dogodki `rating_refund` so izpuščeni: njihove točke so v `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Vrsta dogodka (`login`, `password_changed` ...).
        at:
          type: integer
          format: int64
          description: Čas dogodka.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: Trenutno javno ime igralca, zoper katerega je bila vložena prijava.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Ali je prijava kršitve še odprta (ali je bil igralec, zoper katerega je bila vložena, sankcioniran, ni navedeno).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Žeton povezave iz e-poštnega sporočila (skrito polje obrazca strani).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Žeton povezave za ponastavitev (skrito polje obrazca).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Novo geslo; veljajo pravila za gesla pri registraciji.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Ponovno novo geslo; biti mora enako.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: Stran HTML v UTF-8 (`text/html; charset=utf-8`), brez JavaScripta ali zunanjih virov.
