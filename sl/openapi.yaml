      description: |-
        En zapis partije s potezami in urami. Brez žetona seje ali z žetonom igralca, ki partije ni igral, je odgovor javni. Če je igralec, ki mu žeton pripada, igral partijo, odgovor doda še `you` in `reportable`.

        **Omejitev:** `public_read` (po igralcu z žetonom seje, po odjemalcu brez njega).
