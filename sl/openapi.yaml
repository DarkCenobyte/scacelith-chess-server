  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Prenos partije kot datoteke PGN
      description: |-
        Ista partija kot datoteka PGN: ena partija s konci vrstic `\n` in besedilom potez v vrsticah, krajših od 80 stolpcev. Odgovor je enak z žetonom seje ali brez njega.

        Oznake v tem vrstnem redu: `Event` (`<SERVER_NAME> rated <category>` ali `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (datum začetka po UTC), `Round`, `White`, `Black`, `Result` (`*` za preklicano partijo), `UTCDate` in `UTCTime` (začetek), `WhiteElo` in `BlackElo` (ratinga na začetku ali `-`), `WhiteRatingDiff` in `BlackRatingDiff` (spremembi, na primer `+10` in `-10`, v vsaki partiji za rating, `+0`, kadar pravila ratinga pustijo rating nespremenjen; prijateljska partija, partija s tempom igre po meri ali preklicana partija nima nobene od njiju), `TimeControl` (v sekundah), `Termination` (standardna vrednost PGN: `normal`; `time forfeit`, padec zastavice, tudi kadar se partija konča z remijem; `abandoned`; `rules infraction`, druga nepravilna poteza ali poraz zaradi kršitve pravil poštene igre; `unterminated`, preklicana partija), `PlyCount`, `ScacelithGameId` (desetiški ID).

        Vsaka poteza ima `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: uro igralca, ki je potezo odigral, po potezi in čas, obračunan za potezo, v desetinkah sekunde (odrezano). Vrednost je izpuščena, kadar je zapis nima. Po zadnji potezi sledi razlog za konec partije z besedami, nato rezultat.

        **Omejitev:** `public_read` (po igralcu z žetonom seje, po odjemalcu brez njega).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Datoteka PGN.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'Besedilo PGN v UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: ni pozitivno celo število z največ 16 števkami (manjše od 2^53); `invalid_request`: parameter poti ni veljavno kodiran za URL.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: poslan je bil žeton seje, ki ni veljaven.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: take partije ni.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: omejitev `public_read` ali kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: med drugim, kadar shranjenih potez ni mogoče ponovno odigrati do shranjenega konca (strežnik to zabeleži v dnevnik).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (zbirka podatkov je ostala zaklenjena; `retryAfter: 1` v telesu, brez glave `Retry-After`), `server_busy` (iskanje seje je naletelo na zaklenjeno zbirko podatkov), `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Prenos partije s tega strežnika kot animiranega GIF-a
      description: |-
        Partija kot animirani GIF. Imena in ratingi so tisti iz zapisa partije (ratingi na začetku, izbrisan račun kot `deleted#<id>`), prav tako rezultat in način konca (`Resignation`, `Loss on time` ...).

        Preverjanja potekajo v tem vrstnem redu: `gif_disabled`, možnosti slike (`size`, `orientation`, `delay`, `coords`), ID partije, partija, njena dolžina.

        **Potrebna je seja:** kvote se štejejo po računih. **Omejitve:** `gif` pri vsaki zahtevi; `gif_user_min`, `gif_user_hour`, `gif_ip_min` in `gif_ip_hour` samo, kadar je treba GIF izdelati (glejte opis razdelka). **Časovna omejitev:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 sekund (privzeto 45 sekund).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 'Velikost slike: `small` (polja po 32 px), `medium` (48 px) ali `large` (72 px).'
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Barva, ki je na šahovnici spodaj.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Milisekunde na potezo (od 1 do 6 desetiških števk).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Ali so črke linij in številke vrst narisane okoli šahovnice (`1`) ali ne (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` z `field` (`size`, `orientation`, `delay` ali `coords`): vrednost zunaj dovoljenih. `invalid_game_id`. `invalid_request`: parameter poti ni veljavno kodiran za URL.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: take partije ni. `gif_disabled`: strežnik je izklopil GIF-e (`GIF_ENABLED=false`; žeton omejitve `gif` se vrne).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: omejitev `gif`, omejitev upodabljanja ali kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF-a ni bilo mogoče izdelati (strežnik razlog zabeleži v dnevnik). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` z `retryAfter` (od 3 do 10 sekund) in `Retry-After`: čakalna vrsta za upodabljanje je polna ali pa je GIF na prosto nit čakal `GIF_QUEUE_TIMEOUT_MS` (10 sekund); vsi žetoni omejitev, ki jih je zahteva porabila, se vrnejo. `busy`: zbirka podatkov je ostala zaklenjena (`retryAfter: 1` samo v telesu). `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Izdelava animiranega GIF-a poljubne partije, poslane kot PGN
      description: |-
        Enaka slika kot pri `GET /games/{id}/gif` za poljubno partijo, poslano kot besedilo PGN: partijo, ki jo je shranila igra, izvoz z drugega spletnega mesta, ročno vneseno partijo. Uporabi se samo prva partija v besedilu.

        - Bralnik PGN sprejme, kar sprejme bralnik same igre: vsak PGN, ki ga zapiše ta strežnik, in običajne izvoze drugih spletnih mest (komentarji, variante, NAG-i in zapisi ure se preskočijo; številke potez in SAN se berejo prizanesljivo; oznaka `FEN` določa začetno pozicijo, razen če je `SetUp` enak `"0"`).
        - Imena in ratingi se vzamejo iz oznak `White`, `Black`, `WhiteElo` in `BlackElo`. Črke z diakritičnimi znamenji jih izgubijo, drugi znaki zunaj natisljivega ASCII postanejo `?`, dolga imena pa se skrajšajo (48 znakov). Rezultat se vzame iz oznake `Result`, sicer s konca besedila potez. Oznaka `Termination` se prikaže, razen če je `normal`: takrat končna pozicija sama pove, kako se je partija končala (mat, pat).
        - Ta končna točka sama preveri svoje telo: na neznano polje ali na `pgn`, ki manjka ali ni niz, odgovori s 400 `invalid_request` z `field`; na napačno možnost odgovori s 400 `invalid_option` (`delayMs` mora biti število JSON, `coords` logična vrednost; `null` je zavrnjen).

        **Potrebna je seja:** kvote se štejejo po računih. **Omejitve:** kot pri `GET /games/{id}/gif`. **Omejitev velikosti telesa:** 135.168 bajtov ne glede na `HTTP_BODY_LIMIT` (PGN kot niz JSON, vključno z ubežnimi zaporedji). **Časovna omejitev:** privzeto 45 sekund.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Kratka ročno vnesena partija brez koordinat
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: Datoteka PGN z vsemi možnostmi
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` z `field` (neznano polje ali `pgn` manjka oziroma ni niz; brez `field`, kadar telo ni objekt); `invalid_json`; `invalid_option` z `field` (`size`, `orientation`, `delayMs` ali `coords`); `invalid_pgn` z `line` in `column` (od 1, stolpci v znakih) ter sporočilom bralnika v `message`: nepravilna ali dvoumna poteza, pokvarjena oznaka, neznana različica šaha, več kot 65.536 bajtov.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: strežnik je izklopil GIF-e (`GIF_ENABLED=false`; žeton omejitve `gif` se vrne).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: telo, večje od 135.168 bajtov.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: omejitev `gif`, omejitev upodabljanja ali kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF-a ni bilo mogoče izdelati (strežnik razlog zabeleži v dnevnik). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` z `retryAfter` (od 3 do 10 sekund) in `Retry-After`: čakalna vrsta za upodabljanje je polna ali pa je GIF predolgo čakal na prosto nit; vsi žetoni omejitev, ki jih je zahteva porabila, se vrnejo. `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /players/{username}:
