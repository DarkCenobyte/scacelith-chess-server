      summary: Izbris računa
      description: |-
        Izbriše račun; tega ni mogoče razveljaviti.

        - Vse seje se takoj prekličejo: žeton seje od takrat naprej dobi 401 `invalid_token`.
        - Uporabniško ime postane `deleted#<id>`, v računu in v vsakem zapisu partije.
        - Izbrišejo se: e-poštni naslov, zgoščena vrednost gesla, skrivni ključ dvofaktorskega preverjanja pristnosti in obnovitvene kode, seje in žetoni povezav, povezava z Googlovim računom, zapis integritete sistema proti goljufanju ter naslovi IP, shranjeni z varnostnimi dogodki.
        - Ratingi in partije se ohranijo. Partije ostanejo berljive pod anonimnim imenom, `GET /players/{username}` pa za nekdanje ime odgovori z 404.

        **Ponovno preverjanje pristnosti:** geslo in pri dvofaktorskem preverjanju pristnosti še koda iz aplikacije ali obnovitvena koda. **Omejitve:** `reauth`, nato `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Račun je izbrisan.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
