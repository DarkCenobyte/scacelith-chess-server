paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Pridobitev imena strežnika, različic, vrat in pravil registracije
      description: |-
        Kar odjemalec potrebuje, preden se prijavi ali poveže: ime in ID strežnika, različice protokola WebSocket in kje je WebSocket, pravila registracije, uradne tempe igre in omejitve, ki jih lahko odjemalec preveri, preden pošlje obrazec.

        **Omejitve:** samo sloj po naslovu.
      security: []
      responses:
        '200':
          description: Opis strežnika.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: sloj po naslovu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Ustvarjanje računa
      description: |-
        Ustvari račun: ko je njegov e-poštni naslov potrjen s povezavo, poslano nanj, ali takoj, če potrditev e-pošte ni vklopljena.

        **S potrditvijo e-pošte** (`REQUIRE_EMAIL_VERIFICATION`, privzeto): 202 `verification_sent`. Račun še ne obstaja: registracija čaka 24 ur in medtem zadrži svoje uporabniško ime. Na naslov se pošlje povezava, veljavna teh 24 ur, največ ena na naslov vsakih 5 minut (`POST /auth/verify-email/resend` pošlje novo); račun se ustvari, z že potrjenim naslovom, ko je povezava uporabljena (gumb na strani `/verify-email`), nato se igralec lahko prijavi. Do takrat je odgovor na prijavo s tem uporabniškim imenom `invalid_credentials`, tako kot za neznan račun, javni profil pa ne obstaja. Nova registracija z istim naslovom nadomesti čakajočo. Odgovor je enak, kadar naslov že uporablja drug račun: povezava se takrat ne pošlje, temveč lastnik tega računa dobi obvestilo (največ eno na uro), uporabniško ime pa je zadržano na enak način, tako da nič ne razkrije, ali ima naslov račun. Registracija, katere povezava ni bila uporabljena, se po 24 urah zavrže, njeno uporabniško ime pa je spet prosto.

        **Brez potrditve e-pošte** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, račun je ustvarjen takoj in z njim se je mogoče prijaviti.

        **Pravila.** `username`: od `USERNAME_MIN` do `USERNAME_MAX` znakov (od 3 do 20), črke, števke, `_` in `-`, na začetku črka ali števka (`GET /info` jih vrne kot `limits`); rezervirana imena (`admin`, `moderator`, `deleted` ...) in nekatere predpone so zavrnjeni; enolično ne glede na velike in male črke. `email`: brez začetnih in končnih presledkov in shranjen z malimi črkami, navaden ASCII z domeno, ki vsebuje piko. `password`: najmanj `PASSWORD_MIN_LENGTH` (10) znakov in največ 256 bajtov UTF-8; ne sme vsebovati uporabniškega imena ali lokalnega dela e-poštnega naslova in ne sme biti pogosto geslo.

        **Napake**, preverjene v tem vrstnem redu: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; napake čakalne vrste za zgoščevanje gesel; 409 `email_taken` (samo brez potrditve e-pošte).

        **Omejitve:** `auth`, nato `auth_register` (10 registracij na uro na odjemalca). **Dokaz o delu:** vedno, kadar je `POW_REGISTER_BITS` večji od 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Prvi poskus, brez dokaza o delu
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Ponovno poslano z dokazom o delu
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Račun je ustvarjen in z njim se je mogoče prijaviti (na tem strežniku ni potrditve e-pošte).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Registracija čaka na svojo potrditveno povezavo (ali pa ima naslov že račun; odgovor tega ne razkrije).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (s `field`), `invalid_json`, `invalid_username`, `invalid_email` ali `weak_password` z `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` ali `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: registracija je na tem strežniku zaprta (`GET /info` vrne `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: uporabniško ime že ima neki račun ali pa ga zadržuje čakajoča registracija z drugim naslovom. `email_taken`: naslov uporablja drug račun (samo brez potrditve e-pošte).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: omejitev `auth` ali `auth_register` ali čakalna vrsta za zgoščevanje gesel.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (čakalna vrsta za zgoščevanje gesel ali pa je zbirka podatkov ostala zaklenjena), `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Prijava z geslom
      description: |-
        Prijava z uporabniškim imenom ali e-poštnim naslovom in geslom. Možna sta dva odgovora, oba s statusom 200: seja ali, kadar je dvofaktorsko preverjanje pristnosti vklopljeno, drugi korak, ki ga je treba v 5 minutah dokončati s `POST /auth/login/mfa`.

        Neznan račun, napačno geslo in račun brez gesla dobijo enak odgovor po enakem času: 401 `invalid_credentials`. Preverjanja računa (`banned`, `email_unverified`) sledijo šele po pravilnem geslu. Od `AUTH_FAILURES_PER_ACCOUNT` (5) neuspehov z istim prijavnim imenom naprej mora vsak poskus počakati (429 `too_many_attempts`).

        **Omejitev:** `auth`. **Dokaz o delu:** samo med valom neuspelih prijav (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Seja ali drugi korak prijave z dvofaktorskim preverjanjem pristnosti.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Prijava je uspela
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Dvofaktorsko preverjanje pristnosti je vklopljeno
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: neznan račun, napačno geslo ali račun brez gesla.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Samo po pravilnem geslu: `banned` z `until` (ms od epohe Unix, `null` za trajno blokado) ali `email_unverified` (starejši račun, katerega naslov še ni potrjen).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (zamik po neuspelih poskusih za to prijavno ime) ali `rate_limited` (omejitev `auth`, čakalna vrsta za zgoščevanje gesel).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (čakalna vrsta za zgoščevanje gesel ali pa je zbirka podatkov ostala zaklenjena), `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Dokončanje prijave z drugim faktorjem
      description: |-
        Drugi korak prijave z dvofaktorskim preverjanjem pristnosti, potem ko je bil odgovor na `POST /auth/login` ali na prijavo z Googlom (`POST /auth/sso/google/finish` ali `POST /auth/sso/google/link`) `mfaRequired`. Pošljite `code` (6-mestno kodo iz aplikacije ali obnovitveno kodo) ali `recoveryCode`. Obnovitvena koda, uporabljena tukaj, je porabljena.

        En korak sprejme največ 5 napačnih kod; korak se konča tudi, ko je geslo ponastavljeno ali spremenjeno. Po koraku z geslom pri povezovanju z Googlom se povezava shrani šele, ko koda tukaj uspešno prestane preverjanje.

        **Omejitve:** `auth` in največ `AUTH_MFA_PER_ACCOUNT` (10) kod na 15 minut za račun, s katerega koli naslova; nad tem se koda ne preveri, zato se obnovitvena koda ne porabi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Koda iz aplikacije
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Obnovitvena koda
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Prijava je uspela.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: poslana ni bila niti `code` niti `recoveryCode` ali pa telo krši shemo; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: korak je potekel, je bil uporabljen ali se je končal po 5 napačnih kodah ali pa je bilo geslo po prvem koraku ponastavljeno ali spremenjeno (znova se prijavite). `invalid_code`: napačna ali že uporabljena koda.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (z `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: samo po koraku z geslom pri povezovanju z Googlom, kadar je bil Googlov račun medtem povezan z drugim računom.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: samo po koraku z geslom pri povezovanju z Googlom, kadar se je račun medtem spremenil; prijavo začnite znova.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: zamik po neuspelih poskusih računa ali pa je njegovih `AUTH_MFA_PER_ACCOUNT` kod v zadnjih 15 minutah porabljenih. `rate_limited`: omejitev `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` z `retryAfter: 1`: zbirka podatkov je ostala zaklenjena (po koraku povezovanja z Googlom ni bilo nič povezano: prijavo začnite znova). `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Odjava te seje
      description: |-
        Prekliče sejo uporabljenega žetona. WebSocket, odprt z njim, se zapre. Brez telesa (ali `{}`).

        **Omejitev:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Odjava je uspela.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: telo, ki ni `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: omejitev `sessions` ali kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (zbirka podatkov je ostala zaklenjena), `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
        - sessions
      summary: Odjava vseh sej
      description: |-
        Prekliče vse seje računa, vključno s to. WebSocketi, odprti z njimi, se zaprejo. Brez telesa (ali `{}`).

        **Omejitev:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Vse seje so odjavljene.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: telo, ki ni `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: omejitev `sessions` ali kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (zbirka podatkov je ostala zaklenjena), `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Ponovno pošiljanje potrditvene povezave
      description: |-
        Znova pošlje povezavo za potrditev e-poštnega naslova. Odgovor je 202 `accepted` ne glede na naslov, tako da nikoli ne razkrije, ali ga uporablja račun ali registracija.

        Zahteva učinkuje največ enkrat vsakih 5 minut na naslov. Registracija, ki čaka s tem naslovom, znova dobi svojih 24 ur, ne glede na to, ali naslov uporablja drug račun, tako da njeno uporabniško ime v obeh primerih ostane zadržano enako dolgo. Povezava se pošlje samo za to registracijo, kadar naslov nima računa (nova povezava, veljavna 24 ur, nadomesti prejšnjo), ali za aktiven, nepotrjen račun s tem naslovom.

        **Omejitve:** `auth`, nato `auth_mail` (10 na uro na odjemalca).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Sprejeto (ne glede na naslov).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: omejitev `auth` ali `auth_mail` (ne glede na naslov).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` z `retryAfter: 1`: zbirka podatkov je ostala zaklenjena med iskanjem računa ali shranjevanjem povezave nepotrjenega računa (podaljšanje čakajoče registracije se izvede po najboljših močeh in zaradi njega zahteva nikoli ne spodleti); 5 minut za naslov se kljub temu začne šteti, zato nova zahteva v tem času ne naredi ničesar. `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Pošiljanje povezave za ponastavitev gesla
      description: |-
        Pošlje povezavo za ponastavitev gesla, veljavno eno uro, ki odpre stran `/reset-password`. Odgovor je 202 `accepted` ne glede na naslov. Povezava se pošlje samo aktivnemu računu, največ enkrat vsakih 5 minut na naslov. Račun samo s prijavo z Googlom na ta način nastavi svoje prvo geslo.

        Obnovitev gesla ima najstrožje omejitve v API-ju, vse štete za celoten strežnik: 3 zahteve na uro (`AUTH_FORGOT_PER_HOUR`) in 10 na 24 ur (`AUTH_FORGOT_PER_DAY`) na odjemalca (naslov IPv4 ali IPv6 /64), trikrat toliko na IPv6 /48, poleg omejitve `auth` (20 na 10 minut) in enega sporočila na naslov vsakih 5 minut. Niti 202 niti 429 ne razkrije, ali naslov uporablja kateri koli račun. Nastavitev novega gesla ima lastno omejitev (`auth_reset`).

        **Omejitve:** `auth`, `auth_forgot`, nato `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Sprejeto (ne glede na naslov).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: omejitev `auth`, `auth_forgot` ali `auth_forgot_day` (ne glede na naslov).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` z `retryAfter: 1`: zbirka podatkov je ostala zaklenjena med iskanjem računa ali shranjevanjem povezave; 5 minut za naslov se kljub temu začne šteti, zato nova zahteva v tem času ne pošlje povezave. `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Nastavitev novega gesla z žetonom povezave za ponastavitev
      description: |-
        Nastavi novo geslo z žetonom povezave za ponastavitev gesla (stran `/reset-password` naredi enako). Za novo geslo veljajo pravila registracije.

        Ponastavitev ima te učinke, v eni transakciji (vse ali nobenega): prekliče vse seje in razveljavi čakajočo spremembo e-poštnega naslova; druge povezave za ponastavitev gesla tega računa prenehajo delovati; naslov šteje kot potrjen (povezava je to dokazala); lastnik dobi e-poštno sporočilo. Dvofaktorsko preverjanje pristnosti ostane nespremenjeno. Po napaki čakalne vrste za zgoščevanje gesel, 503 ali 500 ni bilo nič spremenjeno: staro geslo in seje ostanejo, povezava pa ostane veljavna.

        **Omejitve:** `auth`, nato `auth_reset` (10 na uro na odjemalca, 30 na IPv6 /48, deljena s stranjo: vsak poskus zgosti geslo).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Geslo je spremenjeno in vse seje so odjavljene.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: povezava je neveljavna, uporabljena ali potekla ali pa je bila poslana na naslov, ki ga račun nima več. `weak_password` (z `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: omejitev `auth` ali `auth_reset` ali čakalna vrsta za zgoščevanje gesel.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: čakalna vrsta za zgoščevanje gesel ali pa je zbirka podatkov ostala zaklenjena (`retryAfter: 1`, nič ni bilo spremenjeno). `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Začetek prijave z Googlom
      description: |-
        Začne poskus prijave z Googlom za izziv PKCE in vrata poslušalca igre na `127.0.0.1`. Odgovor vrne Googlov URL, ki ga je treba odpreti v sistemskem brskalniku, in `state` poskusa; poskus velja 10 minut.

        `authUrl` vsebuje `client_id`, `redirect_uri` (sestavljen iz `redirectPort` in oznake izvora strežnika), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 strežnikovega lastnega preverjevalnika za Google) s `code_challenge_method=S256` in `prompt=select_account`. Igra ga preveri, preden ga odpre (glejte opis razdelka).

        **Omejitev:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Poskus.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: prijava z Googlom na tem strežniku ni na voljo.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: omejitev `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (zbirka podatkov je ostala zaklenjena), `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Začetek prijave z Googlom na spletnem mestu
      description: |-
        Začne poskus prijave z Googlom za spletno mesto, za izziv PKCE njegove strani. Odgovor je enak kot za igro: Googlov URL, ki ga je treba odpreti, in `state` poskusa; poskus velja 10 minut. Na voljo, kadar `GET /info` vrne `sso.googleWeb: true`.

        `authUrl` vsebuje `client_id` spletnega mesta in `redirect_uri=GOOGLE_WEB_REDIRECT_URI`, z enakimi drugimi parametri kot za igro. Stran ga preveri, preden ga odpre (glejte **Na spletnem mestu** v opisu razdelka).

        **Omejitev:** `sso_start`, deljena z začetkom prijave v igri.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: Poskus.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: manjkajoč ali napačno oblikovan `codeChallenge` ali katero koli drugo polje (vključno z `redirectPort`).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: prijava z Googlom na tem strežniku ni na voljo ali pa ni na voljo spletnim mestom.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: omejitev `sso_start` (deljena z začetkom prijave v igri).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (zbirka podatkov je ostala zaklenjena), `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Predaja Googlovega odgovora strežniku
      description: |-
        Strežniku preda `code` in `state`, ki ju je Google poslal poslušalcu igre ali strani spletnega mesta, skupaj z ID-jem poskusa in preverjevalnikom PKCE. ID poskusa je brez preverjevalnika neuporaben, koda pa je neuporabna brez strežnikovega lastnega preverjevalnika PKCE in skrivnosti odjemalca.

        Strežnik preveri poskus (neznan, uporabljen ali potekel: 410), nato preverjevalnik (napačen pusti poskus uporaben), nato poskus enkrat uporabi, preveri `state` in `iss`, zamenja kodo pri Googlu in preveri žeton ID. Odgovor (200) je eden od naslednjih:

        - `{ token, expiresAt, user }`: prijava v povezani račun je uspela;
        - `{ mfaRequired, mfaToken, expiresIn }`: nadaljujte s `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: nov račun; v 10 minutah nadaljujte s `POST /auth/sso/complete`. `suggestedUsername` izhaja iz Googlovega imena ali naslova in je `""`, kadar nič ne ustreza;
        - `{ needsPassword, linkTicket, username, expiresIn }`: račun s tem naslovom ima geslo; nadaljujte s `POST /auth/sso/google/link`. Nič še ni povezano.

        **Omejitev:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Seja, drugi korak ali naslednji korak prve prijave z Googlom.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Prijava v povezani račun je uspela
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Dvofaktorsko preverjanje pristnosti je vklopljeno
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Nov igralec
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Naslov uporablja račun z geslom
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: preverjevalnik se ne ujema z izzivom poskusa (poskus ostane uporaben). `sso_email_unverified`: Google ni potrdil naslova. `registration_closed`. `account_disabled`. Samo za povezan račun: `banned` (z `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: prijava z Googlom na tem strežniku ni na voljo.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: naslov uporablja aktiven račun brez gesla (ta ni imenovan).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: neznan, uporabljen ali potekel poskus.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: omejitev `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (zbirka podatkov je ostala zaklenjena), `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Povezovanje Googla z obstoječim računom z geslom tega računa
      description: |-
        Potem ko je `finish` odgovoril z `needsPassword`: poveže Google z obstoječim računom z geslom tega računa, vnesenim v igri. Odgovor (200) je seja (povezava je shranjena in igralec prijavljen) ali, kadar je dvofaktorsko preverjanje pristnosti vklopljeno, `{ mfaRequired, mfaToken, expiresIn }`: nadaljujte s `POST /auth/login/mfa`, povezava pa se shrani šele, ko tam koda uspešno prestane preverjanje.

        Napačno geslo pusti vstopnico uporabno, skupno za 5 poskusov. Poskus se porabi tik pred preverjanjem gesla: 429 `too_many_attempts` ali 428 `pow_required` ne porabi nobenega, zavrnitev čakalne vrste za zgoščevanje gesel (503 `server_busy`, 429 `rate_limited`) pa je enega že porabila in šteje kot neuspeh računa. Zamik po neuspelih poskusih uporablja isti števec kot `POST /auth/login`.

        **Omejitev:** `auth` (s štetjem po IPv6 /48). **Dokaz o delu:** kot pri `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Seja ali drugi korak prijave.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: napačno geslo; vstopnica ostane veljavna za skupno 5 poskusov.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (z `until`), samo po pravilnem geslu.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: ta strežnik ne ponuja prijave z Googlom.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: Googlov račun je bil medtem povezan z drugim računom.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: neznana, že uporabljena ali potekla vstopnica, peto napačno geslo, račun, katerega stanje ali naslov se je spremenil po `finish`, ali račun, katerega stanje, naslov, geslo ali dvofaktorsko preverjanje pristnosti se je spremenilo med shranjevanjem povezave. Znova začnite prijavo.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (zamik po neuspelih poskusih računa) ali `rate_limited` (omejitev `auth`, čakalna vrsta za zgoščevanje gesel).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: čakalna vrsta za zgoščevanje gesel ali pa je zbirka podatkov ostala zaklenjena (`retryAfter: 1`, nič ni bilo povezano). `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Ustvarjanje računa ob prvi prijavi z Googlom
      description: |-
        Ko `finish` odgovori z `needsUsername`: ustvari račun z izbranim uporabniškim imenom (veljajo pravila registracije) in ga prijavi. Račun nima gesla: `hasPassword` je `false`, geslo pa mu nastavi »Pozabljeno geslo?« (`POST /auth/password/forgot`).

        **Omejitev:** `auth` (s štetjem po IPv6 /48).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Račun je ustvarjen in prijavljen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: ta strežnik ne ponuja prijave z Googlom.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (uporabniško ime že ima neki račun ali pa ga zaseda registracija na čakanju z drugim naslovom), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: neznana, že uporabljena ali potekla vstopnica.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: omejitev `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (zbirka podatkov je ostala zaklenjena), `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Seznam prijavljenih naprav
      description: |-
        Aktivne seje računa (prijavljene naprave), od nazadnje uporabljene naprej. `current` označuje sejo, ki pošilja zahtevo. `lastSeenAt` se posodobi največ na vsakih 5 minut (pozneje, dokler strežnik močno zaostaja); `expiresAt` je absolutni konec, omejitev nedejavnosti pa lahko sejo konča prej.

        **Omejitev:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aktivne seje.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: omejitev `sessions` ali kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (zbirka podatkov je ostala zaklenjena), `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Odjava ene naprave
      description: |-
        Odjavi eno sejo računa; odjaviti je mogoče tudi trenutno sejo. WebSocket, odprt z njo, se zapre. Brez telesa (ali `{}`).

        **Omejitev:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Seja je odjavljena.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: telo, ki ni `{}`, ali `id`, ki ni veljavno kodiran za URL; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: ta račun nima aktivne seje s tem ID-jem.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: omejitev `sessions` ali kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (zbirka podatkov je ostala zaklenjena), `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Pridobivanje računa, njegovih ratingov in aktivnih sankcij
      description: |-
        Račun, kot ga vidi njegov igralec: pogled računa (tudi `user` v vsakem odgovoru na prijavo), en zapis ratinga za vsako kategorijo, v kateri je igralec igral partije za rating, aktivne sankcije in blokada. Raven integritete sistema proti goljufanju ni nikoli prikazana.

        **Omejitev:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Račun.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized` ali `invalid_token` (tudi kadar je bil račun izbrisan).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: omejitev `account` ali kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (zbirka podatkov je ostala zaklenjena), `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Sprejemanje ali zavračanje neposrednih izzivov
      description: |-
        Nastavi, ali lahko drugi igralci tega igralca izzovejo po imenu. Z `none` so neposredni izzivi zavrnjeni: izzivalec izve, da igralec ni na voljo. Brez ponovnega preverjanja pristnosti.

        **Omejitev:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: Nastavitve, ki zdaj veljajo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: omejitev `account` ali kvota računa.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (zbirka podatkov je ostala zaklenjena), `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Sprememba gesla
      description: |-
        Spremeni geslo. Potrebno je trenutno geslo, drugi faktor pa ne, tudi kadar je dvofaktorsko preverjanje pristnosti vklopljeno. Za novo geslo veljajo pravila registracije (preverijo se po trenutnem geslu).

        Sprememba ima v eni transakciji (vse ali nobenega) te učinke: prekliče vse druge seje (ta ostane prijavljena), prekliče čakajočo spremembo e-poštnega naslova, povezave za ponastavitev gesla tega računa prenehajo delovati, lastniku pa se pošlje e-poštno sporočilo.

        **Ponovno preverjanje pristnosti:** samo geslo. **Omejitve:** `reauth`, nato `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Geslo je spremenjeno.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (račun samo s prijavo z Googlom), `weak_password` (z `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: napačno trenutno geslo ali ponastavitev oziroma sprememba gesla, ki je bila izvedena med preverjanjem zahteve.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neuspela ponovna preverjanja pristnosti računa) ali `rate_limited` (omejitev `reauth` ali `reauth_user`, kvota računa, čakalna vrsta za zgoščevanje gesel).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: čakalna vrsta za zgoščevanje gesel ali pa je zbirka podatkov ostala zaklenjena (`retryAfter: 1`, nič ni bilo spremenjeno). `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Začetek vklopa dvofaktorskega preverjanja pristnosti
      description: |-
        Shrani nov čakajoči skrivni ključ, ki nadomesti morebitni prejšnji čakajoči ključ, in ga vrne za aplikacijo za preverjanje pristnosti (kot besedilo in kot URI `otpauth://`, ki ga prikažete kot kodo QR). Dvofaktorsko preverjanje pristnosti še ni vklopljeno: vklopi ga `POST /account/mfa/totp/enable` s kodo tega skrivnega ključa.

        **Ponovno preverjanje pristnosti:** samo geslo. **Omejitve:** `reauth`, nato `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Čakajoči skrivni ključ.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (račun samo s prijavo z Googlom), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (preveri se pred geslom).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neuspela ponovna preverjanja pristnosti računa) ali `rate_limited` (omejitev `reauth` ali `reauth_user`, kvota računa, čakalna vrsta za zgoščevanje gesel).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (čakalna vrsta za zgoščevanje gesel ali pa je zbirka podatkov ostala zaklenjena), `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Dokončanje vklopa dvofaktorskega preverjanja pristnosti in pridobitev obnovitvenih kod
      description: |-
        Vklopi dvofaktorsko preverjanje pristnosti s kodo čakajočega skrivnega ključa (natanko 6 števk). Gesla tu ne zahteva; vneseno je bilo pri nastavitvi. Odgovor vsebuje 10 obnovitvenih kod, ki so prikazane samo tokrat.

        **Omejitve:** `reauth`, nato `reauth_user`; napačna koda se šteje med neuspela ponovna preverjanja pristnosti računa.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Dvofaktorsko preverjanje pristnosti je vklopljeno.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` nima natanko 6 števk ali pa telo krši shemo; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: napačna koda (preverite čas naprave).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: ni čakajočega skrivnega ključa (najprej pokličite `POST /account/mfa/totp/setup`).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neuspela ponovna preverjanja pristnosti računa) ali `rate_limited` (omejitev `reauth` ali `reauth_user`, kvota računa).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (zbirka podatkov je ostala zaklenjena), `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: Izklop dvofaktorskega preverjanja pristnosti
      description: |-
        Izklopi dvofaktorsko preverjanje pristnosti. Skrivni ključ in obnovitvene kode se izbrišejo, lastnik pa prejme e-poštno sporočilo.

        **Ponovno preverjanje pristnosti:** geslo in koda iz aplikacije ali obnovitvena koda (obvezen je eden od `code` ali `recoveryCode`). **Omejitve:** `reauth`, nato `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Dvofaktorsko preverjanje pristnosti je izklopljeno.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (račun samo s prijavo z Googlom), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required` (niti `code` niti `recoveryCode`, preveri se pred geslom), `invalid_password`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neuspela ponovna preverjanja pristnosti ali preveč preizkušenih kod na tem računu) ali `rate_limited` (omejitev `reauth` ali `reauth_user`, kvota računa, čakalna vrsta za zgoščevanje gesel).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (čakalna vrsta za zgoščevanje gesel ali pa je zbirka podatkov ostala zaklenjena), `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /account/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags:
        - two-step-verification
      summary: Zamenjava obnovitvenih kod
      description: |-
        Zamenja obnovitvene kode z 10 novimi; stare prenehajo delovati.

        **Ponovno preverjanje pristnosti:** geslo in koda iz aplikacije v `code` (obnovitvena koda je zavrnjena s 403 `invalid_code`). **Omejitve:** `reauth`, nato `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodesRequest'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Nove obnovitvene kode, prikazane samo tokrat.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - recoveryCodes
                properties:
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (račun samo s prijavo z Googlom), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code` (tudi za obnovitveno kodo).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neuspela ponovna preverjanja pristnosti ali preveč preizkušenih kod na tem računu) ali `rate_limited` (omejitev `reauth` ali `reauth_user`, kvota računa, čakalna vrsta za zgoščevanje gesel).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (čakalna vrsta za zgoščevanje gesel ali pa je zbirka podatkov ostala zaklenjena), `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: Sprememba e-poštnega naslova
      description: |-
        Spremeni e-poštni naslov računa. Iz `newEmail` se odstranijo presledki na začetku in koncu, pretvori se v male črke, nato pa se preveri kot naslov pri registraciji.

        **S potrditvijo e-pošte** (privzeto): 202 `verification_sent`. Na novi naslov se pošlje povezava, veljavna 24 ur; odpre `/confirm-email-change`, naslov pa se spremeni šele, ko igralec pritisne gumb na tej strani. Do takrat `GET /account/me` prikazuje novi naslov kot `pendingEmail`. Nova zahteva nadomesti čakajočo; sprememba ali ponastavitev gesla jo prekliče. Na posamezni novi naslov se pošlje največ ena povezava na vsakih 5 minut, ne glede na to, kdo jo zahteva (zahteva za spremembo, ki že čaka, ohrani prej poslano povezavo, ki ostane veljavna); odgovor je enak. Trenutni naslov prejme obvestilo, da je bila zahtevana sprememba na zakrit naslov (`a***@example.org`). Odgovor in `pendingEmail` sta enaka tudi, kadar novi naslov že uporablja drug račun: takrat se povezava ne pošlje, zato se ta sprememba nikoli ne dokonča, lastnik tega naslova pa namesto tega prejme obvestilo (največ eno na uro).

        Ko je povezava potrjena, se naslov spremeni in velja za potrjenega, naprave ostanejo prijavljene, prej poslane povezave (potrditev, ponastavitev gesla, druge spremembe) prenehajo delovati, prejšnji naslov pa prejme obvestilo, v katerem je novi naslov zakrit.

        **Brez potrditve e-pošte** (`REQUIRE_EMAIL_VERIFICATION=false`): naslov se spremeni takoj (200 `email_changed`), prejšnji naslov pa prejme obvestilo. Če naslov uporablja drug račun, je odgovor 409 `email_taken`, lastnik tega naslova pa prejme obvestilo.

        **Ponovno preverjanje pristnosti:** geslo in pri dvofaktorskem preverjanju pristnosti še koda iz aplikacije ali obnovitvena koda. `invalid_email` in `same_email` se preverita pred geslom, zato se ne štejeta kot neuspeh. **Omejitve:** `reauth`, nato `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Naslov je bil spremenjen takoj (na tem strežniku ni potrditve e-pošte).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: Novi naslov, kot je shranjen.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: Na novi naslov je bila poslana povezava za potrditev (ali pa naslov pripada drugemu računu; odgovor tega ne razkrije).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email` (trenutni naslov računa), `password_not_set` (račun samo s prijavo z Googlom), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` (tudi kadar je sprememba ali ponastavitev gesla prehitela zahtevo: povezava se ne pošlje), `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: samo brez potrditve e-pošte.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neuspela ponovna preverjanja pristnosti ali preveč preizkušenih kod na tem računu) ali `rate_limited` (omejitev `reauth` ali `reauth_user`, kvota računa, čakalna vrsta za zgoščevanje gesel).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: čakalna vrsta za zgoščevanje gesel ali pa je zbirka podatkov ostala zaklenjena (`retryAfter: 1`: nič ni bilo spremenjeno, isto zahtevo pa je mogoče poslati znova). `timeout`. Tudi `server_busy` z `retryAfter` od 2 do 5, kadar strežnik močno zaostaja (glejte uvod): zahteva ni bila izvedena.'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: Prenos podatkov računa
      description: |-
        Vse, kar strežnik hrani o računu, kot ena datoteka JSON za shranjevanje (`format` `scacelith-account-export`, `version` 1). Izvoz zabeleži varnostni dogodek (`account_exported`). Tabela `notes` v dokumentu igralcu v preprosti angleščini pove, kaj je izpuščeno.

        **Nikoli v izvozu:** zgoščena vrednost gesla, skrivni ključ dvofaktorskega preverjanja pristnosti in obnovitvene kode; kateri koli žeton seje ali povezave ali njegova zgoščena vrednost; podatki sistema proti goljufanju (raven in ocena integritete, anomalije, analiza partij, teža prijave kršitve); prijave kršitev, ki so jih o igralcu vložili drugi igralci; identitete moderatorjev; zasebni podatki drugih igralcev (nasprotniki so navedeni z javnim imenom in ratingom, nič ne razkriva, ali je bil kateri drug igralec sankcioniran, in ni vključen noben naslov IP, ki bi lahko pripadal drugi osebi).

        **Ponovno preverjanje pristnosti:** geslo in pri dvofaktorskem preverjanju pristnosti še koda iz aplikacije ali obnovitvena koda. **Omejitve:** `account_export` (5 na uro na igralca za ves strežnik; šteje vsak poskus, tudi neuspeli; preveri se najprej), nato `reauth` in `reauth_user`. **Časovna omejitev:** 60 sekund.
