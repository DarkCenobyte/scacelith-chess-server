[package]
name = "scacelith-protocol"
description = "Scacelith realtime protocol v1: codec, constants and the protogen code generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The generator binary (protogen) reads protocol/scacelith-v1.json.
gen = ["dep:serde_json", "dep:sha2"]

[dependencies]
bytes.workspace = true
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
# The tests run the freshness check of the generated files (the codegen module).
serde_json.workspace = true
sha2.workspace = true

[[bin]]
name = "protogen"
required-features = ["gen"]

[lints]
workspace = true
