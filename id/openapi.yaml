          description: '`server_busy` (antrean hash kata sandi, atau database tetap terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Tampilkan daftar permainan pemain, dengan filter dan per halaman
      description: |-
        Permainan pemain yang sedang masuk, dari yang terbaru, dengan filter dan per halaman, beserta jumlah permainan yang cocok dengan filter. Setiap parameter kueri bersifat opsional, dan nilai kosong dianggap tidak ada.

        Penomoran halaman: kirim `next` dari halaman sebelumnya sebagai `before`; `next` bernilai `null` di halaman terakhir. `total` menghitung permainan yang cocok dengan filter, di semua halaman.

        **Batas:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: Id kategori resmi (`3+2`, atau `3%2B2`), atau `custom` untuk setiap permainan dengan kontrol waktu lain.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Hanya permainan dinilai (`true`) atau santai (`false`).
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Hanya permainan yang berakhir menang, kalah, atau remis, dari sisi pemain. Permainan yang dibatalkan hanya muncul tanpa filter ini.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Satu halaman riwayat.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` bukan id permainan), `invalid_limit`, atau `invalid_filter` (`category`, `rated`, atau `result`), masing-masing dengan `field` yang menyebutkan parameternya.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `account_games` atau jatah akun.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (database tetap terkunci; `retryAfter: 1` di body, tanpa header `Retry-After`), `server_busy` (pencarian sesi mendapati database terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /games/{id}:
    get:
      operationId: getGame
      tags:
        - games
      summary: Ambil catatan permainan beserta langkah dan jamnya
      description: |-
        Satu catatan permainan, beserta langkah dan jamnya. Tanpa token, atau dengan token pemain yang tidak memainkan permainan itu, responsnya adalah respons publik. Jika pemain pemilik token memainkan permainan itu, respons menambahkan `you` dan `reportable`.

        **Batas:** `public_read` (per pemain jika ada token, per klien jika tidak).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Catatan permainan.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameRecord'
              example:
                id: 4100000000001
                category: '3+2'
                rated: true
                timeControl: '180+2'
                white:
                  name: alice
                  rating: 1500
                  ratingAfter: 1510
                  ratingDiff: 10
                black:
                  name: bob
                  rating: 1520
                  ratingAfter: 1510
                  ratingDiff: -10
                status: 1
                reason: 2
                result: 1-0
                termination: Resignation
                plies: 2
                startedAt: 1790620205000
                endedAt: 1790620611000
                baseMs: 180000
                incMs: 2000
                statusName: WhiteWins
                rematchOf: null
                moves:
                  - uci: e2e4
                    spentMs: 0
                    clockMs: 180000
                  - uci: e7e5
                    spentMs: 1700
                    clockMs: 180300
                pgn:
                  Event: Scacelith rated 3+2
                  Site: caissa.scacelith.com
                  Date: '2026.09.28'
                  Round: '-'
                  White: alice
                  Black: bob
                  Result: 1-0
                  WhiteElo: 1500
                  BlackElo: 1520
                  TimeControl: '180+2'
                  Termination: Resignation
                  PlyCount: 2
                you: white
                reportable: true
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: bukan bilangan bulat positif dengan paling banyak 16 digit (di bawah 2^53); `invalid_request`: bukan encoding URL yang valid.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: token dikirim tetapi tidak valid.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: permainan tersebut tidak ada.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `public_read` atau jatah akun.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (database tetap terkunci; `retryAfter: 1` di body, tanpa header `Retry-After`), `server_busy` (pencarian sesi mendapati database terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Unduh permainan sebagai file PGN
      description: |-
        Permainan yang sama sebagai file PGN: satu permainan dengan akhir baris `\n`, dan teks langkah dalam baris di bawah 80 kolom. Responsnya sama dengan atau tanpa token.

        Tag, dalam urutan ini: `Event` (`<SERVER_NAME> rated <category>` atau `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (tanggal mulai dalam UTC), `Round`, `White`, `Black`, `Result` (`*` untuk permainan yang dibatalkan), `UTCDate` dan `UTCTime` (waktu mulai), `WhiteElo` dan `BlackElo` (rating saat mulai, atau `-`), `WhiteRatingDiff` dan `BlackRatingDiff` (perubahannya, seperti `+10` dan `-10`, di setiap permainan dinilai, `+0` jika aturan rating membiarkan rating tetap seperti semula; permainan santai, kustom, atau yang dibatalkan tidak memiliki keduanya), `TimeControl` (dalam detik), `Termination` (nilai standar PGN: `normal`; `time forfeit`, jatuhnya bendera, juga jika berakhir remis; `abandoned`; `rules infraction`, langkah ilegal kedua atau kekalahan karena pelanggaran fair play; `unterminated`, permainan yang dibatalkan), `PlyCount`, `ScacelithGameId` (id desimal).

        Setiap langkah membawa `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: jam pemain yang melangkah setelah langkah itu dan waktu yang dibebankan untuknya, dalam persepuluhan detik (dipotong). Suatu nilai dihilangkan jika catatan tidak memilikinya. Setelah langkah terakhir, alasan berakhirnya permainan ditulis dengan kata-kata, lalu hasilnya.

        **Batas:** `public_read` (per pemain jika ada token, per klien jika tidak).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: File PGN.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'Teks PGN, dalam UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: bukan bilangan bulat positif dengan paling banyak 16 digit (di bawah 2^53); `invalid_request`: bukan encoding URL yang valid.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: token dikirim tetapi tidak valid.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: permainan tersebut tidak ada.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `public_read` atau jatah akun.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: antara lain, langkah-langkah yang tersimpan tidak dapat diputar ulang hingga akhir permainan yang tersimpan (server mencatatnya di log).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (database tetap terkunci; `retryAfter: 1` di body, tanpa header `Retry-After`), `server_busy` (pencarian sesi mendapati database terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Unduh permainan dari server ini sebagai GIF animasi
      description: |-
        Permainan sebagai GIF animasi. Nama dan rating diambil dari catatan permainan (rating saat mulai, akun yang dihapus sebagai `deleted#<id>`), demikian pula hasil dan akhir permainannya (`Resignation`, `Loss on time`...).

        Pemeriksaan dilakukan dalam urutan ini: `gif_disabled`, opsi gambar (`size`, `orientation`, `delay`, `coords`), id permainan, permainannya, panjangnya.

        **Sesi wajib:** kuota dihitung per akun. **Batas:** `gif` pada setiap permintaan; `gif_user_min`, `gif_user_hour`, `gif_ip_min`, dan `gif_ip_hour` hanya jika GIF harus dibuat (lihat deskripsi bagian). **Batas waktu:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 detik (45 detik secara default).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: Ukuran gambar, `small` (petak 32 px), `medium` (48 px), atau `large` (72 px).
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Pihak yang berada di bagian bawah papan.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Milidetik per langkah (1 hingga 6 digit desimal).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Apakah huruf lajur dan angka baris digambar di sekeliling papan (`1`) atau tidak (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` dengan `field` (`size`, `orientation`, `delay`, atau `coords`): nilai di luar nilai yang diizinkan. `invalid_game_id`. `invalid_request`: bukan encoding URL yang valid.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: permainan tersebut tidak ada. `gif_disabled`: server menonaktifkan GIF (`GIF_ENABLED=false`; token `gif` dikembalikan).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `gif`, batas render, atau jatah akun.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF tidak dapat dibuat (server mencatat penyebabnya di log). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` dengan `retryAfter` (3 hingga 10 detik) dan `Retry-After`: antrean render penuh, atau GIF menunggu `GIF_QUEUE_TIMEOUT_MS` (10 detik) untuk thread yang kosong; setiap token batas yang diambil permintaan itu dikembalikan. `busy`: database tetap terkunci (`retryAfter: 1` hanya di body). `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Buat GIF animasi dari permainan apa pun yang dikirim sebagai PGN
      description: |-
        Gambar yang sama seperti `GET /games/{id}/gif` untuk permainan apa pun yang dikirim sebagai teks PGN: permainan yang disimpan oleh game, ekspor dari situs lain, permainan yang diketik manual. Hanya permainan pertama dalam teks yang digunakan.

        - Pembaca PGN menerima apa yang diterima pembaca milik game itu sendiri: setiap PGN yang ditulis server ini dan ekspor umum dari situs lain (komentar, variasi, NAG, dan anotasi jam dilewati; nomor langkah dan SAN dibaca secara longgar; tag `FEN` memberikan posisi awal kecuali `SetUp` bernilai `"0"`).
        - Nama dan rating diambil dari tag `White`, `Black`, `WhiteElo`, dan `BlackElo`. Huruf beraksen kehilangan aksennya, karakter lain di luar ASCII yang dapat dicetak menjadi `?`, dan nama yang panjang dipotong (48 karakter). Hasil diambil dari tag `Result`, atau jika tidak ada, dari akhir teks langkah. Tag `Termination` ditampilkan kecuali nilainya `normal`: dalam hal itu posisi akhir sudah menunjukkan cara permainan berakhir (skakmat, pat).
        - Endpoint ini memeriksa body-nya sendiri: field yang tidak dikenal, atau `pgn` yang tidak ada atau bukan string, menghasilkan respons 400 `invalid_request` dengan `field`; opsi yang salah menghasilkan respons 400 `invalid_option` (`delayMs` harus berupa angka JSON, `coords` berupa boolean; `null` ditolak).

        **Sesi wajib:** kuota dihitung per akun. **Batas:** sama seperti untuk `GET /games/{id}/gif`. **Batas ukuran body:** 135.168 byte, berapa pun `HTTP_BODY_LIMIT` (PGN sebagai string JSON, termasuk escape-nya). **Batas waktu:** 45 detik secara default.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Permainan pendek yang diketik, tanpa koordinat
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: File PGN dengan semua opsi
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` dengan `field` (field yang tidak dikenal, atau `pgn` tidak ada atau bukan string; tanpa `field` jika body bukan objek); `invalid_json`; `invalid_option` dengan `field` (`size`, `orientation`, `delayMs`, atau `coords`); `invalid_pgn` dengan `line` dan `column` (mulai dari 1, kolom dalam karakter) serta `message` dari pembaca PGN: langkah ilegal atau ambigu, tag yang rusak, varian catur yang tidak dikenal, lebih dari 65.536 byte.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: server menonaktifkan GIF (`GIF_ENABLED=false`; token `gif` dikembalikan).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: body lebih dari 135.168 byte.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `gif`, batas render, atau jatah akun.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF tidak dapat dibuat (server mencatat penyebabnya di log). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` dengan `retryAfter` (3 hingga 10 detik) dan `Retry-After`: antrean render penuh, atau GIF terlalu lama menunggu thread yang kosong; setiap token batas yang diambil permintaan itu dikembalikan. `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /players/{username}:
    get:
      operationId: getPlayer
      tags:
        - players
      summary: Ambil profil publik pemain
      description: |-
        Profil publik pemain: rating dalam kategori resmi (dalam urutan server) dan jumlah permainan. `games.total` menghitung setiap permainan yang tersimpan, termasuk permainan santai dan yang dibatalkan; `games.rated`, `wins`, `draws`, dan `losses` dijumlahkan dari catatan rating, jadi hanya permainan dinilai. Responsnya sama dengan atau tanpa token.

        **Batas:** `public_read` (per pemain jika ada token, per klien jika tidak).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Profil.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
              example:
                username: alice
                createdAt: 1790882839743
                ratings:
                  - category: '3+2'
                    rating: 1510
                    provisional: true
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                games:
                  total: 3
                  rated: 2
                  wins: 1
                  draws: 1
                  losses: 0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`: bukan 2 hingga 24 karakter dari `[A-Za-z0-9_.-]`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: token dikirim tetapi tidak valid.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: pemain tersebut tidak ada, atau akunnya telah dihapus.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `public_read` atau jatah akun.'
        '500':
