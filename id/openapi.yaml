      summary: Ganti kode pemulihan
      description: |-
        Mengganti kode pemulihan dengan 10 kode baru; kode lama tidak berlaku lagi.

        **Autentikasi ulang:** kata sandi dan kode autentikator di `code` (kode pemulihan ditolak dengan 403 `invalid_code`). **Batas:** `reauth`, lalu `reauth_user`.
      security:
