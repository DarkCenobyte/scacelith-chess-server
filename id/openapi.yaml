              confirmPassword: a much better passphrase
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Kata sandi telah diubah, dan semua perangkat telah dikeluarkan.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Formulir lagi beserta kesalahannya (kata sandi berbeda, kata sandi lemah), tautan tidak valid, atau formulir tidak valid (halaman HTML).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Batas `auth` atau `auth_reset` (halaman HTML), formulir lagi dengan `Retry-After` jika klien ini memiliki terlalu banyak hash kata sandi yang menunggu (tautan tetap berlaku), atau lapisan per alamat (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'Formulir lagi dengan `Retry-After` saat server sibuk (antrean hash kata sandi, atau database tetap terkunci); tautan tetap berlaku. Saat server sangat tertinggal (lihat pendahuluan), sebagai gantinya halaman "Server error" (kesalahan server) dengan `Retry-After` (2 hingga 5): tidak ada yang dijalankan dan tautan tetap berlaku. Juga saat batas waktu handler habis.'
  /confirm-email-change:
    servers:
      - url: https://caissa.scacelith.com
        description: Server resmi (halaman berada di root, di luar `/api/v1`).
      - url: https://{host}:{port}
        description: Server Scacelith mana pun (halaman berada di root, di luar `/api/v1`).
        variables:
          host:
            default: caissa.scacelith.com
            description: Nama host publik server (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Port API publik (`PUBLIC_API_PORT`, atau jika tidak ada, `API_PORT`).
    get:
      operationId: showConfirmEmailChangePage
      tags:
        - pages
      summary: Tampilkan halaman konfirmasi perubahan email
      description: |-
        Halaman dari tautan perubahan email: menampilkan alamat baru dan nama akun, dengan tombol "Use this e-mail address" (gunakan alamat email ini) yang mengirim formulir ke `POST /confirm-email-change`.

        **Batas:** `page`.
      security: []
      parameters:
        - $ref: '#/components/parameters/LinkTokenQuery'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Halaman dengan alamat baru dan tombol konfirmasinya.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Tautan tidak valid atau kedaluwarsa (juga jika alamat akun telah berubah sejak permintaan dibuat).
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Batas `page` (halaman HTML), atau lapisan per alamat (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
    post:
      operationId: submitConfirmEmailChangePage
      tags:
        - pages
      summary: Konfirmasi alamat email baru
      description: |-
        Formulir halaman perubahan email. Alamat berubah dan dianggap terkonfirmasi; perangkat tetap masuk; tautan yang dikirim sebelumnya (konfirmasi, pengaturan ulang kata sandi, perubahan lain) tidak berlaku lagi; alamat lama diberi tahu, dengan alamat baru disamarkan.

        **Batas:** `auth`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: lZ50AvPxUwbGqQCwWPIO28ONray7SzW0Cl_sLImwF3Q
          application/json:
            schema:
              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: lZ50AvPxUwbGqQCwWPIO28ONray7SzW0Cl_sLImwF3Q
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Alamat telah diubah.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Tautan tidak valid, sudah dipakai, atau kedaluwarsa, atau formulir tidak valid (halaman HTML).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '409':
          $ref: '#/components/responses/HtmlConflict'
          description: Sementara itu akun lain telah mengambil alamat tersebut (halaman HTML).
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Batas `auth` (halaman HTML), atau lapisan per alamat (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'Database tetap terkunci (`Retry-After: 1`), atau server sangat tertinggal (`Retry-After` 2 hingga 5, lihat pendahuluan): tidak ada yang berubah dan tautan masih berlaku. Juga saat batas waktu handler habis.'
  /healthz:
    servers:
      - url: https://caissa.scacelith.com
        description: Server resmi, di root.
      - url: https://caissa.scacelith.com/api/v1
        description: Server resmi, di bawah `/api/v1`.
      - url: https://{host}:{port}
        description: Server Scacelith mana pun, di root.
        variables:
          host:
            default: caissa.scacelith.com
            description: Nama host publik server (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Port API publik (`PUBLIC_API_PORT`, atau jika tidak ada, `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Server Scacelith mana pun, di bawah `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: Nama host publik server (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Port API publik (`PUBLIC_API_PORT`, atau jika tidak ada, `API_PORT`).
    get:
      operationId: getLiveness
      tags:
        - health
      summary: Periksa bahwa proses berjalan
      description: |-
        Merespons 200 `ok` selama proses berjalan. `HEAD` juga berfungsi. Metode lain apa pun merespons 405 `method_not_allowed` dengan `Allow: GET, HEAD` (termasuk `OPTIONS`).

        **Batas:** hanya lapisan per alamat.
      security: []
      responses:
        '200':
          description: Proses berjalan.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
              example:
                status: ok
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: lapisan per alamat.'
  /readyz:
    servers:
      - url: https://caissa.scacelith.com
        description: Server resmi, di root.
      - url: https://caissa.scacelith.com/api/v1
        description: Server resmi, di bawah `/api/v1`.
      - url: https://{host}:{port}
        description: Server Scacelith mana pun, di root.
        variables:
          host:
            default: caissa.scacelith.com
            description: Nama host publik server (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Port API publik (`PUBLIC_API_PORT`, atau jika tidak ada, `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Server Scacelith mana pun, di bawah `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: Nama host publik server (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Port API publik (`PUBLIC_API_PORT`, atau jika tidak ada, `API_PORT`).
    get:
      operationId: getReadiness
      tags:
        - health
      summary: Periksa bahwa server menerima pemain
      description: |-
        Merespons 200 `ready` saat server menerima pemain, dan 503 `not_ready` saat server sedang dimulai atau dihentikan. `HEAD` juga berfungsi. Metode lain apa pun merespons 405 `method_not_allowed` dengan `Allow: GET, HEAD` (termasuk `OPTIONS`).

        **Batas:** hanya lapisan per alamat.
      security: []
      responses:
        '200':
          description: Server menerima pemain.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: lapisan per alamat.'
        '503':
          description: Server sedang dimulai atau dihentikan.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Token sesi (`sct_` diikuti 43 karakter base64url) dari respons masuk, di header `Authorization`: `Authorization: Bearer <token>`. Prefiksnya tepat `Bearer` (peka huruf besar/kecil) dan satu spasi; nilai yang tidak memilikinya, atau token yang bukan 1 hingga 512 karakter ASCII yang dapat dicetak, menghasilkan respons 401 `invalid_token` seperti token tidak valid lainnya. Header kosong dianggap sama dengan tidak ada header.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: Id permainan, bilangan bulat desimal positif dengan paling banyak 16 digit tanpa nol di depan, di bawah 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: Id sesi, sebagaimana diberikan oleh `GET /auth/sessions`, ditulis tanpa nol di depan (`03` bukan sesi 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Nama pengguna pemain, tanpa memperhatikan huruf besar/kecil. Server menerima nama apa pun yang terdiri dari 2 hingga 24 karakter `[A-Za-z0-9_.-]` (aturan terlonggar yang pernah diizinkannya).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Id permainan; hanya permainan yang lebih lama yang ditampilkan. Kirim `next` dari halaman sebelumnya. Nilai kosong dianggap tidak ada.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Ukuran halaman, 1 hingga 50. Angka yang lebih besar hingga 3 digit dianggap 50; nilai kosong dianggap tidak ada.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: Token tautan email (43 karakter base64url). Token yang tidak ada atau salah menampilkan halaman "link invalid or expired" (tautan tidak valid atau kedaluwarsa).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Setiap respons server melarang caching.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Jumlah detik yang harus ditunggu sebelum mencoba lagi; nilainya sama dengan `retryAfter` di body.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Challenge bearer, dengan `error="invalid_token"` untuk token yang tidak valid.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Server menutup koneksi setelah respons ini.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (dengan `field` jika ada field body yang bermasalah) atau `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Sebuah field melanggar skema
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Body bukan JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Kata sandi lemah
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: PGN yang tidak dapat dibaca
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (tidak ada header `Authorization`) atau `invalid_token` (token salah format, kedaluwarsa, dicabut, atau milik akun yang telah dihapus).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Tanpa sesi
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Token tidak valid
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Permintaan ditolak.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Kata sandi salah saat autentikasi ulang
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Akun yang ditangguhkan
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found`, atau fitur yang dinonaktifkan server ini.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: body tidak tiba dalam 10 detik. Server menutup koneksi.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Permintaan bertentangan dengan keadaan server.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: percobaan masuk dengan Google atau tiketnya tidak dikenal, sudah dipakai, atau kedaluwarsa; mulai lagi proses masuk.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: body melebihi `HTTP_BODY_LIMIT` (16.384 byte secara default). Server menutup koneksi.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: target permintaan melebihi 4096 karakter.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: body bukan `application/json`, atau charset-nya bukan UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: permainan memiliki lebih dari `GIF_MAX_PLIES` (600) setengah langkah.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: selesaikan challenge `pow` dan kirim lagi permintaan yang sama dengan `pow: { challenge, nonce }`. `reason` menyebutkan alasannya: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work`, atau `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (batas laju, jatah akun, atau antrean hash kata sandi) atau `too_many_attempts` (pembatasan pada akun), dengan `retryAfter` dan header `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Batas laju
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Terlalu banyak kegagalan pada akun ini
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: kegagalan tak terduga. Server mencatatnya di log.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: `state` atau `iss` yang salah, atau Google menolak kode tersebut atau mengirim token ID yang tidak lolos verifikasi (termasuk kode atau token ID dari klien yang lain, milik game atau milik situs web). Respons ini tidak pernah memuat teks dari Google.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy`, atau `timeout`: coba lagi setelah `retryAfter` jika nilai itu diberikan.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Server sedang sibuk
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Database tetap terkunci (saat pembacaan)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Server terlalu lama merespons
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: GIF animasi, sebagai lampiran.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` untuk permainan dari server ini, `attachment; filename="scacelith-game.gif"` untuk PGN yang dikirim dengan `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Ukuran file dalam byte.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: Halaman HTML.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: Halaman HTML yang menjelaskan penolakan.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Formulir tidak tiba dalam 10 detik (halaman HTML). Server menutup koneksi.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: Halaman HTML yang menjelaskan konflik.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Formulir melebihi `HTTP_BODY_LIMIT` (halaman HTML). Server menutup koneksi.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Body bukan formulir (`application/x-www-form-urlencoded`) maupun JSON, atau charset-nya bukan UTF-8 (halaman HTML).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Batas laju (halaman HTML), dengan `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Kegagalan tak terduga (halaman HTML berjudul "Server error", yaitu kesalahan server). Server mencatatnya di log.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Server sibuk (database tetap terkunci, atau server sangat tertinggal; dengan `Retry-After`) atau terlalu lama merespons (halaman HTML berjudul "Server error", yaitu kesalahan server).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: Satu-satunya bentuk dari setiap respons kesalahan API JSON.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Kode kesalahan dalam `snake_case`. Klien memilih apa yang ditampilkan berdasarkan kode ini.
          examples:
            - rate_limited
        message:
          type: string
          description: Kalimat dalam bahasa Inggris, untuk log dan sebagai cadangan.
        retryAfter:
          type: integer
          minimum: 1
          description: Jumlah detik yang harus ditunggu sebelum mencoba lagi, hanya ada pada penolakan yang berakhir setelah beberapa waktu. Dalam hal itu respons juga membawa header `Retry-After` dengan nilai yang sama, kecuali 503 `busy` pada pembacaan riwayat, permainan, pemain, dan papan peringkat.
        field:
          type: string
          description: Field atau parameter kueri yang bermasalah (`invalid_request`, `invalid_option`, serta `invalid_cursor`, `invalid_limit`, dan `invalid_filter` dari `GET /account/games`). Field bertingkat ditulis dengan titik (`pow.nonce`).
        reason:
          type: string
          description: 'Alasannya: aturan yang dilanggar `weak_password`, atau alasan proof of work diminta atau ditolak (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Hanya `banned`: akhir penangguhan (epoch ms), `null` untuk penangguhan permanen.'
        line:
          type: integer
          minimum: 1
          description: 'Hanya `invalid_pgn`: baris tempat kesalahan, mulai dari 1.'
        column:
          type: integer
          minimum: 1
          description: 'Hanya `invalid_pgn`: kolom tempat kesalahan, mulai dari 1, dalam karakter.'
    PowChallenge:
      type: object
      description: Challenge proof of work (`pow` dari 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Challenge yang ditandatangani, untuk dikirim kembali apa adanya.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Jumlah bit nol di depan yang harus dimiliki `SHA-256(challenge + ":" + nonce)`.
        expiresAt:
          type: integer
          format: int64
          description: Waktu challenge kedaluwarsa (epoch ms), 2 menit setelah diterbitkan.
    PowAnswer:
      type: object
      description: Jawaban atas challenge proof of work.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: '`challenge` dari respons 428, sebagaimana diberikan.'
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: String desimal dengan paling banyak 20 digit sedemikian rupa sehingga `SHA-256(challenge + ":" + nonce)` diawali `bits` bit nol.
    ServerInfo:
      type: object
      description: Hal yang dibutuhkan klien sebelum masuk atau terhubung.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Nama server (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: UUID yang diperoleh database saat pertama kali dijalankan. Nilainya tetap sama setelah server dimulai ulang. Nilainya `null` jika database tidak dapat memberikannya.
        motd:
          type: string
          description: Pesan hari ini (`SERVER_MOTD`), bisa kosong.
        protocol:
          type: object
          description: Protokol WebSocket (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Versi protokol tertua yang didukung server.
            max:
              type: integer
              minimum: 1
              description: Versi protokol terbaru yang didukung server.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'Sidik jari skema protokol (4 byte pertama SHA-256 dari bentuk kanoniknya, sebagai bilangan bulat tak bertanda: `0xc649140f`, 3326678031, untuk protokol minor 2); hanya informasi, tidak pernah dibandingkan.'
            subprotocol:
              type: string
              description: Token subprotokol WebSocket (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: Port WebSocket yang digunakan pemain (`PUBLIC_WS_PORT`, jika tidak ada `WS_PORT`, jika tidak ada juga `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: Path WebSocket.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Apakah akun baru dapat dibuat.
        emailVerification:
          type: boolean
          description: Apakah akun baru harus mengonfirmasi alamatnya (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Apakah opsi masuk dengan Google tersedia untuk game.
            googleWeb:
              type: boolean
              description: Apakah opsi masuk dengan Google juga tersedia untuk situs web (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: Autentikasi dua faktor selalu tersedia.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Jumlah bit proof of work yang dibutuhkan pendaftaran (0 jika tidak ada).
        categories:
          type: array
          description: Kontrol waktu resmi, yaitu yang dinilai (`RATED_CATEGORIES`), dalam urutan server. Kontrol waktu lainnya adalah `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Aturan yang dapat diperiksa klien sebelum mengirim formulir.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: Panjang minimum nama pengguna (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: Panjang maksimum nama pengguna (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Ekspresi reguler yang harus dicocoki nama pengguna baru.
            passwordMinLength:
              type: integer
              description: Panjang minimum kata sandi, dalam karakter (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Panjang maksimum kata sandi, dalam byte UTF-8.
            customTimeControls:
              type: boolean
              description: Apakah tantangan dan permainan pribadi boleh menggunakan kontrol waktu kustom.
            reportsPerDay:
              type: integer
              description: Jumlah laporan yang boleh diajukan seorang pemain per 24 jam (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Ukuran maksimum pesan WebSocket yang boleh dikirim klien, dalam byte.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Kontrol waktu resmi.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Id kategori, menit dan detik tambahan waktu (`3+2`).
        baseSec:
          type: number
          minimum: 0
          description: Waktu dasar, dalam detik.
        incSec:
          type: number
          minimum: 0
          description: Tambahan waktu per langkah, dalam detik.
    AccountView:
      type: object
      description: Akun sebagaimana dilihat pemainnya (`user` dari respons masuk dan dari `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: Id akun.
        username:
          type: string
          description: Nama pengguna.
        email:
          type: string
          format: email
          description: Alamat email.
        emailVerified:
          type: boolean
          description: Apakah alamat sudah dikonfirmasi.
        mfaEnabled:
          type: boolean
          description: Apakah autentikasi dua faktor aktif.
        googleLinked:
          type: boolean
          description: Apakah akun Google sudah tertaut.
        hasPassword:
          type: boolean
          description: '`false` untuk akun yang dibuat melalui Google dan belum menetapkan kata sandi.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Apakah tantangan langsung melalui nama diterima (lihat `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Waktu akun dibuat (epoch ms).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Waktu masuk terakhir (epoch ms), atau `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Alamat baru dari perubahan email yang masih menunggu tautannya dikonfirmasi, atau `null`.
    SessionAnswer:
      type: object
      description: Sesi baru.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Token sesi, untuk header `Authorization` dan WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: Akhir mutlak sesi (epoch ms); batas waktu tidak aktif dapat mengakhirinya lebih awal.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Tahap kedua proses masuk dengan autentikasi dua faktor; lanjutkan dengan `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Token tahap ini, untuk `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Sisa detik untuk menyelesaikan tahap ini.
    LoginAnswer:
      description: Sesi, atau tahap kedua proses masuk dengan autentikasi dua faktor.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Proses masuk pertama dengan Google; lanjutkan dengan `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Tiket untuk `POST /auth/sso/complete`, berlaku selama 10 menit.
        suggestedUsername:
          type: string
          description: Nama pengguna yang dibuat dari nama Google atau alamat email, atau `""` jika tidak ada yang cocok.
    SsoNeedsPassword:
      type: object
      description: Akun yang memiliki kata sandi menggunakan alamat ini; lanjutkan dengan `POST /auth/sso/google/link`. Belum ada yang ditautkan.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Tiket untuk `POST /auth/sso/google/link`.
        username:
          type: string
          description: Nama pengguna akun tersebut (hanya orang yang telah membuktikan kepemilikan alamat itu kepada Google yang melihatnya).
        expiresIn:
          type: integer
          const: 600
          description: Jumlah detik tiket tetap berlaku.
    SsoFinishAnswer:
      description: Respons dari `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Percobaan masuk dengan Google.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Percobaan tersebut, untuk `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: URL Google yang dibuka di browser sistem, setelah diperiksa.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state` yang harus dikirim kembali oleh Google.'
        expiresIn:
          type: integer
          const: 600
          description: Jumlah detik percobaan ini tetap berlaku.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Nama pengguna; selain itu berlaku aturan server (lihat deskripsi).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Alamat email. Spasi di awal dan akhir dihapus, dan alamat disimpan dalam huruf kecil.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Kata sandi; selain itu berlaku aturan kata sandi.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Nama pengguna, atau alamat email (teks apa pun yang berisi `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Opsional. Ditampilkan dalam daftar perangkat yang masuk (seperti `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: '`mfaToken` dari respons masuk (atau dari respons masuk dengan Google).'
        code:
          type: string
          maxLength: 32
          description: Opsional. Kode autentikator 6 digit, atau kode pemulihan.
        recoveryCode:
          type: string
          maxLength: 32
          description: Opsional. Kode pemulihan. Salah satu dari `code` dan `recoveryCode` diperlukan.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Alamat email.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Parameter `token` dari tautan pengaturan ulang.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Kata sandi baru; aturan kata sandi pendaftaran berlaku.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Challenge PKCE S256 dari `codeVerifier` milik klien (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Port listener klien di `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Challenge PKCE S256 dari `codeVerifier` milik halaman (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`attemptId` dari `POST /auth/sso/google/start`.'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: Verifier PKCE; SHA-256-nya harus cocok dengan challenge yang diberikan ke `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state` sebagaimana dikirim kembali oleh Google.'
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: '`code` sebagaimana dikirim kembali oleh Google (ASCII yang dapat dicetak tanpa spasi).'
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Opsional. `iss` sebagaimana dikirim kembali oleh Google, jika Google mengirimnya.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`linkTicket` dari `finish`, berlaku selama 10 menit.'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Kata sandi akun.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`ssoTicket` dari `finish`, berlaku selama 10 menit.'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Nama pengguna; aturan pendaftaran berlaku.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Sesi-sesi aktif, diurutkan dari yang paling baru dipakai.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Sesi aktif (perangkat yang masuk).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: Id sesi, untuk `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: Waktu masuk (epoch ms).
        lastSeenAt:
          type: integer
          format: int64
          description: Waktu penggunaan terakhir (epoch ms), diperbarui paling sering sekali setiap 5 menit (lebih lambat saat server sangat tertinggal).
        expiresAt:
          type: integer
          format: int64
          description: Akhir mutlak (epoch ms); batas waktu tidak aktif dapat mengakhiri sesi lebih awal.
        clientLabel:
          type:
            - string
            - 'null'
          description: '`clientLabel` dari proses masuk, atau `null` jika tidak ada yang dikirim.'
        current:
          type: boolean
          description: Apakah ini sesi yang membuat permintaan.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Satu catatan per kategori tempat pemain pernah memainkan permainan dinilai.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Sanksi yang aktif.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }` selama ditangguhkan, jika tidak `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Catatan rating untuk satu kategori.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: Id kategori.
        rating:
          type: integer
          description: Rating.
        games:
          type: integer
          minimum: 0
          description: Permainan yang dimainkan dalam kategori ini (terhitung atau tidak).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Rating tertinggi yang pernah dicapai.
        provisional:
          type: boolean
          description: '`true` selama catatan ini masih dalam fase tanpa rating atau memiliki kurang dari `PROVISIONAL_GAMES` permainan terhitung (game menampilkannya sebagai `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Jenis sanksi.
        reason:
          type:
            - string
            - 'null'
          description: Alasan yang diberikan, jika ada.
        startsAt:
          type: integer
          format: int64
          description: Waktu mulai (epoch ms).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Waktu berakhir (epoch ms), `null` jika sanksi bersifat permanen.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Akhir penangguhan (epoch ms), `null` jika permanen.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` untuk menerima tantangan langsung melalui nama, `none` untuk menolaknya.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Kata sandi saat ini.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Kata sandi baru; aturan kata sandi pendaftaran berlaku.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Kata sandi akun.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Kode dari kunci rahasia yang tertunda, tepat 6 digit.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Kata sandi akun.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Opsional; diperlukan dengan autentikasi dua faktor (atau `recoveryCode`). Kode autentikator, atau kode pemulihan.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Opsional. Kode pemulihan (`xxxx-xxxx-xx`; huruf besar/kecil, spasi, dan tanda hubung tidak berpengaruh).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Kata sandi akun.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Kode autentikator (kode pemulihan ditolak).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Alamat baru; spasi di awal dan akhir dihapus dan hurufnya diubah menjadi huruf kecil, lalu alamat itu diperiksa seperti alamat pendaftaran.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Kata sandi akun.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Opsional; diperlukan dengan autentikasi dua faktor (atau `recoveryCode`). Kode autentikator, atau kode pemulihan.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Opsional. Kode pemulihan.
    TotpSetup:
      type: object
      description: Kunci rahasia yang tertunda untuk aplikasi autentikator.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Kunci rahasia dalam base32, untuk diketikkan ke aplikasi.
        uri:
          type: string
          format: uri
          description: URI `otpauth://totp/...`, untuk ditampilkan sebagai kode QR.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Jumlah detik per interval.
    RecoveryCodeList:
      type: array
      description: 10 kode pemulihan, yang ditampilkan hanya kali ini. Setiap kode hanya berlaku sekali.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Satu pihak dalam permainan.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Nama dalam catatan permainan (`deleted#<id>` untuk akun yang dihapus).
        rating:
          type:
            - integer
            - 'null'
          description: Rating saat mulai, `null` jika tidak diketahui.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Rating setelah permainan. Permainan dinilai selalu memilikinya; `null` hanya untuk permainan yang tidak dihitung untuk rating (santai, kustom, dibatalkan).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Perubahan rating, `0` jika aturan rating membiarkan rating tetap seperti semula (skor nol menurut FIDE, lawan tanpa rating, permainan pertama dari pemain tanpa rating); `null` seperti `ratingAfter`.
    GameSummary:
      type: object
      description: Ringkasan permainan yang tersimpan.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Id permainan.
        category:
          type: string
          description: Id kategori resmi (`3+2`), atau `custom`.
        rated:
          type: boolean
          description: Apakah permainan dihitung untuk rating.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Kontrol waktu dalam detik (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (lihat kode permainan).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Kode alasan berakhirnya permainan (lihat kode permainan).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Hasil, `*` untuk permainan yang dibatalkan.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Jumlah setengah langkah.
        startedAt:
          type: integer
          format: int64
          description: Waktu mulai (epoch ms).
        endedAt:
          type: integer
          format: int64
          description: Waktu berakhir (epoch ms).
    Termination:
      type: string
      description: Nama alasan berakhirnya permainan (lihat kode permainan); `Unknown` untuk kode yang tidak dikenal protokol.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Ringkasan permainan dari sisi satu pemain.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Pihak pemain.
    HistoryGameSummary:
      description: Permainan dalam riwayat pemain yang sedang masuk.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Waktu dasar dalam milidetik.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Tambahan waktu dalam milidetik.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: Hasil dari sisi pemain.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Permainan di halaman ini, dari yang terbaru.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Id yang dikirim sebagai `before` untuk halaman berikutnya, atau `null` di halaman terakhir.
        total:
          type: integer
          minimum: 0
          description: Jumlah permainan yang cocok dengan filter, di semua halaman.
    MoveRecord:
      type: object
      description: Satu setengah langkah dalam permainan.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: Langkah dalam notasi UCI, dengan tambahan `n`, `b`, `r`, atau `q` untuk promosi.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Waktu yang dibebankan untuk langkah itu (ms), `null` jika catatan tidak memilikinya.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Jam pemain yang melangkah setelah langkah itu (ms), `null` jika catatan tidak memilikinya.
    PgnTagsView:
      type: object
      description: Tag PGN utama, untuk ditampilkan. `Termination` di sini adalah nama alasan berakhirnya permainan; file PGN menggunakan nilai standar PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` atau `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: Tanggal mulai dalam UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Rating saat mulai, atau `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Rating saat mulai, atau `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Catatan permainan beserta langkah dan jamnya. Memiliki field ringkasan permainan, tanpa `color` dan `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Waktu dasar dalam milidetik.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Tambahan waktu dalam milidetik.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: Nama dari `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: Id permainan yang menjadi asal tanding ulang ini, atau `null`.
            moves:
              type: array
              description: Satu entri per setengah langkah.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Hanya jika pemain pemilik token memainkan permainan ini; pihaknya.
            reportable:
              type: boolean
              description: Hanya jika pemain pemilik token memainkan permainan ini; `true` jika `POST /reports` akan menerima laporan atas lawan untuk permainan ini sekarang (permainan berakhir dalam 7 hari, kuota harian belum habis, dan lawan belum dilaporkan untuk permainan ini).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Nama pengguna, sebagaimana ditulis pemain.
        createdAt:
          type: integer
          format: int64
          description: Waktu akun dibuat (epoch ms).
        ratings:
          type: array
          description: Hanya kategori resmi, dalam urutan server.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Setiap permainan yang tersimpan, termasuk permainan santai dan yang dibatalkan.
            rated:
              type: integer
              minimum: 0
              description: Permainan dinilai, dijumlahkan dari catatan rating.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Nama pengguna, sebagaimana ditulis pemain.
        games:
          type: array
          description: Permainan di halaman ini, dari yang terbaru.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Id permainan terakhir setiap kali halaman penuh (halaman berikutnya mungkin kosong), jika tidak `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: Id kategori.
        minGames:
          type: integer
          minimum: 0
          description: Jumlah permainan terhitung yang dibutuhkan suatu catatan agar tercantum (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Waktu papan peringkat dihitung (epoch ms).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: Teks PGN, paling banyak 65.536 byte UTF-8. Hanya permainan pertama yang digunakan.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Opsional. Ukuran gambar.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Opsional. Pihak yang berada di bagian bawah papan.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Opsional. Milidetik per langkah, angka JSON dengan nilai bulat.
        coords:
          type: boolean
          default: true
          description: Opsional. Apakah huruf lajur dan angka baris digambar di sekeliling papan.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Permainan, sebagai bilangan bulat atau string berisi 1 hingga 16 digit.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Nama pengguna lawan, seperti dalam catatan permainan atau seperti saat ini, tanpa memperhatikan huruf besar/kecil. Tidak boleh kosong.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Hal yang dilaporkan.
        comment:
          type:
            - string
            - 'null'
          description: Opsional. Paling banyak 500 karakter setelah karakter kontrol (selain tab dan line feed) dihapus dan spasi di awal dan akhir teks dipangkas.
    AccountExport:
      type: object
      description: Semua yang disimpan server tentang akun (waktu dalam epoch ms).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Waktu ekspor dibuat.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Apa yang dimuat dan tidak dimuat file ini, dalam bahasa Inggris sederhana untuk pemain.
          items:
            type: string
        account:
          description: Tampilan akun dari `GET /account/me`, dengan `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Alamat akun Google yang tertaut, atau `null`.
        ratings:
          type: array
          description: Catatan rating lengkap.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Poin rating yang dikembalikan setelah seorang lawan terbukti curang, dijumlahkan per hari UTC dan kategori, dari yang terbaru. Baik permainannya maupun pemain curangnya tidak disebutkan.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Setiap sesi yang tersimpan, dari yang terbaru, tanpa token apa pun. Pembersihan retensi menghapus sesi yang kedaluwarsa, serta sesi yang telah dikeluarkan, sehari setelah sesi itu dikeluarkan.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Peristiwa keamanan, dari yang terbaru, disimpan selama `RETENTION_SECURITY_DAYS` hari.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Setiap sanksi, termasuk yang sudah dicabut. Nama moderator tidak pernah disertakan.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Peristiwa perilaku yang dicatat untuk permainan pemain yang ditinggalkan, dibatalkan, atau yang langkah pertamanya tidak dijalankan tepat waktu, disimpan selama 30 hari.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Laporan yang dibuat pemain.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Jumlah permainan.
            list:
              type: array
              description: Setiap permainan, dari yang terbaru, sebagai ringkasan `GET /account/games`. Langkah-langkahnya tersedia di `GET /games/{id}` dan PGN-nya di `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Catatan rating lengkap.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Apakah pemain sudah keluar dari fase tanpa rating.
            countedGames:
              type: integer
              minimum: 0
              description: Permainan yang masuk ke perhitungan rating.
            updatedAt:
              type: integer
              format: int64
              description: Waktu catatan terakhir berubah.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: Pukul 00.00 UTC hari tersebut (epoch ms).
        category:
          type: string
        points:
          type: integer
          description: Poin yang dikembalikan pada hari itu dalam kategori itu.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Waktu sesi dikeluarkan, atau `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Alamat IP saat masuk, dihapus setelah `RETENTION_IP_DAYS` hari.
    SecurityEvent:
      type: object
      description: |-
        Peristiwa keamanan. `ip` hanya diberikan untuk tindakan yang dilakukan saat sedang masuk, dengan kata sandi akun (dan faktor kedua), atau dengan tautan yang dikirim ke alamat akun: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused`, dan `account_exported`; semua jenis lain memiliki `ip: null`, dan `ip` dihapus setelah `RETENTION_IP_DAYS` hari.

        `detail` hanya menyimpan field berikut: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` dan `method` (`password`, atau `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` dan `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Peristiwa `moderator_action` hanya menyimpan `{ action }`, untuk tindakan `ban`, `unban`, `reset_mfa`, `verify_email`, dan `revoke_sessions` (tindakan moderator lainnya tidak disertakan). Semua jenis lain memiliki `detail: null`. Peristiwa `rating_refund` tidak disertakan: poinnya ada di `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Jenis peristiwa (`login`, `password_changed`...).
        at:
          type: integer
          format: int64
          description: Waktu terjadinya.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
