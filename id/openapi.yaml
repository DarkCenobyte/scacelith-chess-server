              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - recoveryCodes
                properties:
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (akun yang hanya memakai Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code` (juga untuk kode pemulihan).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (autentikasi ulang yang gagal, atau terlalu banyak kode dicoba pada akun ini), atau `rate_limited` (batas `reauth` atau `reauth_user`, jatah akun, antrean hash kata sandi).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (antrean hash kata sandi, atau database tetap terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: Ubah alamat email
      description: |-
        Mengubah alamat email akun. Spasi di awal dan akhir `newEmail` dihapus dan hurufnya diubah menjadi huruf kecil, lalu alamat itu diperiksa seperti alamat pendaftaran.

        **Dengan konfirmasi email** (default): 202 `verification_sent`. Tautan yang berlaku selama 24 jam dikirim ke alamat baru; tautan itu membuka `/confirm-email-change`, dan alamat akun hanya berubah saat pemain menekan tombol di halaman itu. Sampai saat itu, `GET /account/me` menampilkan alamat baru sebagai `pendingEmail`. Permintaan baru menggantikan permintaan yang tertunda; perubahan atau pengaturan ulang kata sandi membatalkannya. Paling banyak satu tautan dikirim ke alamat baru yang sama setiap 5 menit, siapa pun yang meminta (permintaan untuk perubahan yang sudah tertunda mempertahankan tautan yang dikirim sebelumnya, yang tetap berlaku); responsnya sama. Alamat saat ini menerima pemberitahuan bahwa perubahan ke alamat yang disamarkan (`a***@example.org`) telah diminta. Respons dan `pendingEmail` tetap sama jika akun lain sudah memakai alamat baru tersebut: dalam hal itu tidak ada tautan yang dikirim, sehingga perubahan itu tidak pernah selesai, dan sebagai gantinya pemilik alamat itu menerima pemberitahuan (paling banyak satu per jam).

        Saat tautan dikonfirmasi, alamat berubah dan dianggap terkonfirmasi, perangkat tetap masuk, tautan yang dikirim sebelumnya (konfirmasi, pengaturan ulang kata sandi, perubahan lain) tidak berlaku lagi, dan alamat lama diberi tahu, dengan alamat baru disamarkan.

        **Tanpa konfirmasi email** (`REQUIRE_EMAIL_VERIFICATION=false`): alamat langsung berubah (200 `email_changed`), dan alamat lama diberi tahu. Jika akun lain memakai alamat itu, responsnya 409 `email_taken`, dan pemilik alamat itu menerima pemberitahuan tersebut.

        **Autentikasi ulang:** kata sandi dan, dengan autentikasi dua faktor, kode autentikator atau kode pemulihan. `invalid_email` dan `same_email` diperiksa sebelum kata sandi, sehingga keduanya tidak dihitung sebagai kegagalan. **Batas:** `reauth`, lalu `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Alamat langsung berubah (server ini tidak memakai konfirmasi email).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: Alamat baru, sebagaimana disimpan.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: Tautan konfirmasi telah dikirim ke alamat baru (atau alamat itu milik akun lain; respons tidak memberitahukannya).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email` (alamat akun saat ini), `password_not_set` (akun yang hanya memakai Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
