  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: Hapus akun
      description: |-
        Menghapus akun; tindakan ini tidak dapat dibatalkan.

        - Semua sesi langsung dicabut: sejak saat itu token sesi mendapat 401 `invalid_token`.
        - Nama pengguna menjadi `deleted#<id>`, di akun dan di setiap catatan permainan.
        - Yang dihapus: alamat email, hash kata sandi, kunci rahasia autentikasi dua faktor dan kode pemulihan, sesi dan token tautan, penautan Google, catatan integritas dari sistem antikecurangan, serta alamat IP yang disimpan bersama peristiwa keamanan.
        - Rating dan permainan tetap disimpan. Permainan tetap dapat dibaca dengan nama anonim itu, dan `GET /players/{username}` merespons 404 untuk nama lama.

        **Autentikasi ulang:** kata sandi dan, dengan autentikasi dua faktor, kode autentikator atau kode pemulihan. **Batas:** `reauth`, lalu `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
