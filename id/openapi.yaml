        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `public_read` atau jatah akun.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (database tetap terkunci; `retryAfter: 1` di body, tanpa header `Retry-After`), `server_busy` (pencarian sesi mendapati database terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: Ambil pemain teratas suatu kategori
      description: |-
        100 catatan rating teratas dari suatu kategori resmi yang memiliki setidaknya `minGames` (`PROVISIONAL_GAMES`) permainan terhitung; akun yang dihapus dan pemain yang terbukti curang tidak disertakan. Server menghitung ulang setiap papan peringkat paling sering sekali setiap 10 detik; `updatedAt` menunjukkan kapan. Hanya satu perhitungan per kategori yang berjalan pada satu waktu: sementara itu, permintaan lain mendapat daftar sebelumnya, atau menunggu perhitungan itu jika belum ada daftar.

        **Batas:** hanya lapisan per alamat.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: Id kategori resmi (`3+2`, atau `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: Jumlah pemain, 1 hingga 100. Angka yang lebih besar hingga 3 digit dianggap 100; nilai kosong dianggap tidak ada.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: Papan peringkat.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (tidak ada, atau bukan kategori resmi), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: lapisan per alamat.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (database tetap terkunci; `retryAfter: 1` di body, tanpa header `Retry-After`), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Laporkan lawan dalam permainan baru-baru ini
      description: |-
        Melaporkan lawan dalam salah satu permainan pemain sendiri yang berakhir dalam 7 hari terakhir. Laporan tidak pernah dengan sendirinya mengubah rating, sanksi, atau tingkat integritas. Laporan menaikkan prioritas peninjauan yang dilihat moderator, dan, kecuali untuk `abuse`, meminta analisis mesin atas permainan itu.

        Laporan atas lawan yang sama untuk permainan yang sama mendapat respons yang sama dan tidak mengubah apa pun; respons tidak pernah memberi tahu apa pun tentang akun yang dilaporkan. `GET /games/{id}` memberi tahu para pemain permainan itu sebelumnya apakah laporan akan diterima (`reportable`).

        Endpoint ini memeriksa body-nya sendiri, dalam urutan `gameId`, `reported`, `category`, `comment`: kegagalan menghasilkan respons 400 `invalid_request` tanpa `field`. Field yang tidak dikenalnya diabaikan.

        **Batas:** `reports` (per pemain), lalu `REPORTS_PER_DAY` (5) laporan per pemain dalam 24 jam (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Laporan diterima (atau sudah pernah diajukan).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (tanpa `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: bukan lawan pelapor dalam permainan yang berakhir dalam 7 hari terakhir.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, dengan header `Retry-After`): `REPORTS_PER_DAY` laporan dalam 24 jam terakhir. `rate_limited`: batas `reports` atau jatah akun.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (pencarian sesi mendapati database terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
