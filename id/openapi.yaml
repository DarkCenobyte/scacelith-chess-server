paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Ambil nama, versi, port, dan aturan pendaftaran server
      description: |-
        Hal yang dibutuhkan klien sebelum masuk atau terhubung: nama dan ID server, versi protokol WebSocket dan letak WebSocket, aturan pendaftaran, kontrol waktu resmi, dan batas yang dapat diperiksa klien sebelum mengirim formulir.

        **Batas:** hanya lapisan per alamat.
      security: []
      responses:
        '200':
          description: Deskripsi server.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: lapisan per alamat.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Buat akun
      description: |-
        Membuat akun: setelah alamat emailnya dikonfirmasi dengan tautan yang dikirim ke alamat tersebut, atau langsung jika tanpa konfirmasi email.

        **Dengan konfirmasi email** (`REQUIRE_EMAIL_VERIFICATION`, default): 202 `verification_sent`. Belum ada akun yang dibuat: pendaftaran menunggu selama 24 jam dan menahan nama penggunanya selama itu. Tautan yang berlaku selama 24 jam tersebut dikirim ke alamat itu, paling banyak satu per alamat setiap 5 menit (`POST /auth/verify-email/resend` mengirim tautan baru); akun dibuat, dengan alamat yang sudah terkonfirmasi, saat tautan digunakan (tombol pada halaman `/verify-email`), dan pemain kemudian dapat masuk. Sampai saat itu, proses masuk dengan nama pengguna tersebut menghasilkan `invalid_credentials`, seperti untuk akun yang tidak dikenal, dan profil publiknya tidak ada. Pendaftaran baru dengan alamat yang sama menggantikan pendaftaran yang menunggu. Responsnya sama jika akun lain sudah menggunakan alamat tersebut: dalam hal ini tidak ada tautan yang dikirim, pemiliknya menerima pemberitahuan sebagai gantinya (paling banyak satu per jam), dan nama pengguna ditahan dengan cara yang sama, sehingga tidak ada yang mengungkapkan apakah alamat tersebut memiliki akun. Pendaftaran yang tautannya tidak digunakan dihapus setelah 24 jam, dan nama penggunanya bebas lagi.

        **Tanpa konfirmasi email** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, akun langsung dibuat dan dapat masuk.

        **Aturan.** `username`: `USERNAME_MIN` hingga `USERNAME_MAX` karakter (3 hingga 20), berupa huruf, angka, `_`, dan `-`, diawali huruf atau angka (`GET /info` memberikannya sebagai `limits`); nama yang dicadangkan (`admin`, `moderator`, `deleted`...) dan beberapa awalan ditolak; unik tanpa membedakan huruf besar/kecil. `email`: dipangkas spasi di awal dan akhirnya lalu disimpan dalam huruf kecil, berupa ASCII biasa dengan domain bertitik. `password`: paling sedikit `PASSWORD_MIN_LENGTH` (10) karakter dan paling banyak 256 byte UTF-8; tidak boleh mengandung nama pengguna atau bagian lokal alamat email, dan tidak boleh berupa kata sandi yang umum.

        **Kesalahan**, diperiksa dalam urutan berikut: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; kesalahan antrean hash kata sandi; 409 `email_taken` (hanya tanpa konfirmasi email).

        **Batas:** `auth`, lalu `auth_register` (10 pendaftaran per jam per klien). **Proof of work:** selalu, jika `POW_REGISTER_BITS` lebih dari 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Percobaan pertama, tanpa proof of work
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Dikirim ulang dengan proof of work
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Akun telah dibuat dan dapat masuk (tanpa konfirmasi email di server ini).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Pendaftaran menunggu tautan konfirmasinya (atau alamat tersebut sudah memiliki akun; respons tidak mengungkapkannya).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (dengan `field`), `invalid_json`, `invalid_username`, `invalid_email`, atau `weak_password` dengan `reason`: `too_short`, `too_long`, `contains_username`, `contains_email`, atau `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: pendaftaran ditutup di server ini (`GET /info` menyatakan `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: sudah ada akun dengan nama pengguna tersebut, atau pendaftaran yang menunggu dari alamat lain menahannya. `email_taken`: akun lain menggunakan alamat tersebut (hanya tanpa konfirmasi email).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `auth` atau `auth_register`, atau antrean hash kata sandi.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (antrean hash kata sandi, atau database tetap terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Masuk dengan kata sandi
      description: |-
        Masuk dengan nama pengguna atau alamat email dan kata sandi. Ada dua kemungkinan respons, keduanya dengan status 200: sesi, atau, jika autentikasi dua faktor aktif, tahap kedua yang harus diselesaikan dalam 5 menit dengan `POST /auth/login/mfa`.

        Akun yang tidak dikenal, kata sandi yang salah, dan akun tanpa kata sandi mendapat respons yang sama, setelah waktu yang sama: 401 `invalid_credentials`. Pemeriksaan akun (`banned`, `email_unverified`) baru dilakukan setelah kata sandi benar. Mulai dari `AUTH_FAILURES_PER_ACCOUNT` (5) kegagalan pada satu nama login, setiap percobaan harus menunggu (429 `too_many_attempts`).

        **Batas:** `auth`. **Proof of work:** hanya selama gelombang percobaan masuk yang gagal (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Sesi, atau tahap kedua dari proses masuk dengan autentikasi dua faktor.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Berhasil masuk
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Autentikasi dua faktor aktif
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: akun tidak dikenal, kata sandi salah, atau akun tanpa kata sandi.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Hanya setelah kata sandi benar: `banned`, dengan `until` (epoch ms, `null` untuk penangguhan permanen), atau `email_unverified` (akun lama yang alamatnya belum dikonfirmasi).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (jeda setelah kegagalan untuk nama login ini), atau `rate_limited` (batas `auth`, antrean hash kata sandi).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (antrean hash kata sandi, atau database tetap terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Selesaikan proses masuk dengan faktor kedua
      description: |-
        Tahap kedua dari proses masuk dengan autentikasi dua faktor, setelah `POST /auth/login` atau masuk dengan Google (`POST /auth/sso/google/finish` atau `POST /auth/sso/google/link`) merespons `mfaRequired`. Kirim `code` (kode autentikator 6 digit, atau kode pemulihan) atau `recoveryCode`. Kode pemulihan yang digunakan di sini akan hangus.

        Satu tahap menerima paling banyak 5 kode yang salah; tahap ini juga berakhir jika kata sandi diatur ulang atau diubah. Setelah tahap kata sandi dari penautan Google, tautan baru disimpan jika kode lolos di sini.

        **Batas:** `auth`, dan paling banyak `AUTH_MFA_PER_ACCOUNT` (10) kode per 15 menit untuk akun tersebut, dari alamat mana pun; jika melebihinya, kode tidak diperiksa, sehingga kode pemulihan tidak terpakai.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Kode autentikator
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Kode pemulihan
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Berhasil masuk.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: baik `code` maupun `recoveryCode` tidak dikirim, atau body melanggar skema; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: tahap tersebut kedaluwarsa, sudah digunakan, atau berakhir setelah 5 kode salah, atau kata sandi diatur ulang atau diubah sejak tahap pertama (masuk lagi). `invalid_code`: kode salah atau sudah pernah dipakai.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (dengan `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: hanya setelah tahap kata sandi dari penautan Google, akun Google tersebut telah ditautkan ke akun lain sementara itu.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: hanya setelah tahap kata sandi dari penautan Google, akun tersebut berubah sementara itu; mulai proses masuk lagi.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: jeda setelah kegagalan untuk akun tersebut, atau jatah `AUTH_MFA_PER_ACCOUNT` kode untuk akun itu dalam 15 menit terakhir sudah habis. `rate_limited`: batas `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` dengan `retryAfter: 1`: database tetap terkunci (setelah tahap penautan Google, tidak ada yang ditautkan: mulai proses masuk lagi). `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Keluar dari sesi ini
      description: |-
        Mencabut sesi dari token yang digunakan. WebSocket yang dibuka dengan sesi tersebut ditutup. Tanpa body (atau `{}`).

        **Batas:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Berhasil keluar.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: body selain `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `sessions` atau jatah akun.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (database tetap terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
        - sessions
      summary: Keluar dari semua sesi
      description: |-
        Mencabut semua sesi akun, termasuk sesi ini. WebSocket yang dibuka dengan sesi-sesi tersebut ditutup. Tanpa body (atau `{}`).

        **Batas:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Semua sesi telah dikeluarkan.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: body selain `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `sessions` atau jatah akun.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (database tetap terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Kirim ulang tautan konfirmasi
      description: |-
        Mengirim ulang tautan konfirmasi email. Responsnya 202 `accepted` apa pun alamatnya, sehingga tidak pernah mengungkapkan apakah alamat tersebut digunakan oleh akun atau pendaftaran.

        Permintaan hanya berdampak paling banyak sekali setiap 5 menit per alamat. Pendaftaran yang menunggu dengan alamat tersebut mendapatkan kembali 24 jamnya, baik ada maupun tidak ada akun lain yang menggunakan alamat itu, sehingga nama penggunanya tetap ditahan selama waktu yang sama dalam kedua kasus. Tautan hanya dikirim untuk pendaftaran tersebut jika alamat itu tidak memiliki akun (tautan baru, berlaku 24 jam, menggantikan tautan sebelumnya), atau untuk akun aktif yang belum dikonfirmasi dengan alamat tersebut.

        **Batas:** `auth`, lalu `auth_mail` (10 per jam per klien).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Diterima (apa pun alamatnya).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `auth` atau `auth_mail` (apa pun alamatnya).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` dengan `retryAfter: 1`: database tetap terkunci saat akun dicari atau saat tautan untuk akun yang belum dikonfirmasi disimpan (pembaruan pendaftaran yang menunggu bersifat best effort dan tidak pernah membuat permintaan gagal); 5 menit untuk alamat tersebut tetap dimulai, sehingga permintaan baru dalam rentang itu tidak berdampak apa pun. `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Kirim tautan pengaturan ulang kata sandi
      description: |-
        Mengirim tautan pengaturan ulang kata sandi yang berlaku selama satu jam dan membuka halaman `/reset-password`. Responsnya 202 `accepted` apa pun alamatnya. Tautan hanya dikirim ke akun aktif, paling banyak sekali setiap 5 menit per alamat. Akun yang hanya menggunakan Google menetapkan kata sandi pertamanya dengan cara ini.

        Pemulihan kata sandi memiliki batas paling ketat di API ini, semuanya dihitung untuk seluruh server: 3 permintaan per jam (`AUTH_FORGOT_PER_HOUR`) dan 10 per 24 jam (`AUTH_FORGOT_PER_DAY`) per klien (alamat IPv4 atau /64 IPv6), 3 kali lipat angka tersebut per /48 IPv6, selain batas `auth` (20 per 10 menit) dan batas satu email per alamat setiap 5 menit. Baik 202 maupun 429 tidak mengungkapkan apakah suatu akun menggunakan alamat tersebut. Penetapan kata sandi baru memiliki batasnya sendiri (`auth_reset`).

        **Batas:** `auth`, `auth_forgot`, lalu `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Diterima (apa pun alamatnya).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `auth`, `auth_forgot`, atau `auth_forgot_day` (apa pun alamatnya).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` dengan `retryAfter: 1`: database tetap terkunci saat akun dicari atau saat tautan disimpan; 5 menit untuk alamat tersebut tetap dimulai, sehingga permintaan baru dalam rentang itu tidak mengirim tautan. `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Tetapkan kata sandi baru dengan token tautan pengaturan ulang
      description: |-
        Menetapkan kata sandi baru dengan token dari tautan pengaturan ulang (halaman `/reset-password` melakukan hal yang sama). Kata sandi baru mengikuti aturan pendaftaran.

        Pengaturan ulang memiliki efek berikut, dalam satu transaksi (semuanya, atau tidak sama sekali): semua sesi dicabut dan perubahan email yang tertunda dibatalkan; tautan pengaturan ulang lain untuk akun tersebut tidak berfungsi lagi; alamat dianggap terkonfirmasi (tautan telah membuktikannya); pemilik akun menerima email. Autentikasi dua faktor tidak diubah. Setelah kesalahan antrean hash kata sandi, 503, atau 500, tidak ada yang berubah: kata sandi lama dan sesi-sesi tetap ada, dan tautan tetap valid.

        **Batas:** `auth`, lalu `auth_reset` (10 per jam per klien, 30 per /48 IPv6, digunakan bersama dengan halaman tersebut: setiap percobaan meng-hash kata sandi).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Kata sandi telah diubah dan semua sesi telah dikeluarkan.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: tautan tidak valid, sudah digunakan, atau kedaluwarsa, atau dikirim ke alamat yang tidak lagi dimiliki akun tersebut. `weak_password` (dengan `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `auth` atau `auth_reset`, atau antrean hash kata sandi.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: antrean hash kata sandi, atau database tetap terkunci (`retryAfter: 1`, tidak ada yang berubah). `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Mulai masuk dengan Google
      description: |-
        Memulai percobaan masuk dengan Google untuk challenge PKCE dan port listener game di `127.0.0.1`. Respons memberikan URL Google yang harus dibuka di browser sistem dan `state` percobaan tersebut; percobaan berlaku selama 10 menit.

        `authUrl` berisi `client_id`, `redirect_uri` (dibentuk dari `redirectPort` dan tag origin server), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 dari verifier milik server sendiri untuk Google) dengan `code_challenge_method=S256`, dan `prompt=select_account`. Game memeriksanya sebelum membukanya (lihat deskripsi bagian).

        **Batas:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Percobaan masuk.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: opsi masuk dengan Google tidak tersedia di server ini.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (database tetap terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Mulai masuk dengan Google di situs web
      description: |-
        Memulai percobaan masuk dengan Google dari situs web untuk challenge PKCE halamannya. Responsnya sama seperti untuk game: URL Google yang harus dibuka, dan `state` percobaan tersebut; percobaan berlaku selama 10 menit. Tersedia jika `GET /info` menyatakan `sso.googleWeb: true`.

        `authUrl` berisi `client_id` situs web dan `redirect_uri=GOOGLE_WEB_REDIRECT_URI`, dengan parameter lain yang sama seperti untuk game. Halaman memeriksanya sebelum membukanya (lihat **Di situs web** dalam deskripsi bagian).

        **Batas:** `sso_start`, digunakan bersama dengan start dari game.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: Percobaan masuk.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `codeChallenge` tidak ada atau tidak berformat benar, atau ada field lain (termasuk `redirectPort`).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: opsi masuk dengan Google tidak tersedia di server ini, atau tidak tersedia untuk situs web.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `sso_start` (digunakan bersama dengan start dari game).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (database tetap terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Serahkan respons Google ke server
      description: |-
        Menyerahkan kepada server `code` dan `state` yang dikirim Google ke listener game atau ke halaman situs web, beserta ID percobaan dan verifier PKCE. ID percobaan tidak berguna tanpa verifier, dan kode tidak berguna tanpa verifier PKCE milik server sendiri dan rahasia kliennya.

        Server memeriksa percobaan (tidak dikenal, sudah digunakan, atau kedaluwarsa: 410), lalu verifier (verifier yang salah membuat percobaan tetap dapat digunakan), lalu memakai percobaan tersebut sekali, memeriksa `state` dan `iss`, menukar kode dengan Google, dan memverifikasi token ID. Responsnya (200) adalah salah satu dari:

        - `{ token, expiresAt, user }`: berhasil masuk ke akun yang tertaut;
        - `{ mfaRequired, mfaToken, expiresIn }`: lanjutkan dengan `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: akun baru; lanjutkan dengan `POST /auth/sso/complete` dalam 10 menit. `suggestedUsername` berasal dari nama Google atau alamat email, dan bernilai `""` jika tidak ada yang cocok;
        - `{ needsPassword, linkTicket, username, expiresIn }`: akun dengan alamat tersebut memiliki kata sandi; lanjutkan dengan `POST /auth/sso/google/link`. Belum ada yang ditautkan.

        **Batas:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Sesi, tahap kedua, atau tahap berikutnya dari proses masuk pertama dengan Google.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Berhasil masuk ke akun yang tertaut
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Autentikasi dua faktor aktif
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Pemain baru
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Akun dengan kata sandi menggunakan alamat tersebut
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: verifier tidak cocok dengan challenge percobaan tersebut (percobaan tetap dapat digunakan). `sso_email_unverified`: Google belum mengonfirmasi alamat tersebut. `registration_closed`. `account_disabled`. Hanya untuk akun yang tertaut: `banned` (dengan `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: opsi masuk dengan Google tidak tersedia di server ini.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: akun aktif tanpa kata sandi menggunakan alamat tersebut (akun itu tidak disebutkan).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: percobaan tidak dikenal, sudah digunakan, atau kedaluwarsa.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (database tetap terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Tautkan Google ke akun yang sudah ada dengan kata sandinya
      description: |-
        Setelah `finish` merespons `needsPassword`: menautkan Google ke akun yang sudah ada dengan kata sandi akun tersebut, yang diketik di game. Responsnya (200) berupa sesi (tautan disimpan dan pemain berhasil masuk), atau, jika autentikasi dua faktor aktif, `{ mfaRequired, mfaToken, expiresIn }`: lanjutkan dengan `POST /auth/login/mfa`, dan tautan baru disimpan jika kode lolos di sana.

        Kata sandi yang salah membuat tiket tetap dapat digunakan, hingga total 5 percobaan. Satu percobaan diambil tepat sebelum kata sandi diperiksa: 429 `too_many_attempts` atau 428 `pow_required` tidak mengambil percobaan, sedangkan penolakan oleh antrean hash kata sandi (503 `server_busy`, 429 `rate_limited`) sudah mengambil satu dan dihitung sebagai kegagalan akun. Jeda setelah kegagalan menggunakan penghitung yang sama dengan `POST /auth/login`.

        **Batas:** `auth` (beserta hitungan per /48 IPv6-nya). **Proof of work:** seperti untuk `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Sesi, atau tahap kedua proses masuk.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: kata sandi salah; tiket tetap berlaku, untuk total 5 percobaan.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (dengan `until`), hanya setelah kata sandi yang benar.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: opsi masuk dengan Google tidak tersedia di server ini.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: sementara itu akun Google tersebut telah ditautkan ke akun lain.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: tiket yang tidak dikenal, sudah dipakai, atau kedaluwarsa; kata sandi salah yang ke-5; akun yang status atau alamatnya berubah sejak `finish`; atau akun yang status, alamat, kata sandi, atau autentikasi dua faktornya berubah saat penautan sedang disimpan. Mulai lagi proses masuk.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (jeda akun setelah kegagalan), atau `rate_limited` (batas `auth`, antrean hash kata sandi).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: antrean hash kata sandi, atau database tetap terkunci (`retryAfter: 1`, tidak ada yang ditautkan). `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Buat akun untuk proses masuk pertama dengan Google
      description: |-
        Setelah `finish` merespons `needsUsername`: membuat akun dengan nama pengguna yang dipilih (aturan pendaftaran berlaku), lalu masuk dengan akun tersebut. Akun ini tidak memiliki kata sandi: `hasPassword` bernilai `false`, dan "Lupa kata sandi?" (`POST /auth/password/forgot`) memberinya kata sandi.

        **Batas:** `auth` (beserta hitungan per IPv6 /48-nya).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Akun telah dibuat dan berhasil masuk.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: opsi masuk dengan Google tidak tersedia di server ini.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (sebuah akun memakai nama pengguna itu, atau pendaftaran yang menunggu dari alamat lain menahannya), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: tiket yang tidak dikenal, sudah dipakai, atau kedaluwarsa.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (database tetap terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Tampilkan daftar perangkat yang masuk
      description: |-
        Sesi aktif akun (perangkat yang masuk), diurutkan dari yang paling baru dipakai. `current` menandai sesi yang membuat permintaan. `lastSeenAt` diperbarui paling sering sekali setiap 5 menit (lebih lambat saat server sangat tertinggal); `expiresAt` adalah akhir mutlaknya, dan batas waktu tidak aktif dapat mengakhiri sesi lebih awal.

        **Batas:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesi-sesi yang aktif.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `sessions` atau jatah akun.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (database tetap terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Keluarkan satu perangkat
      description: |-
        Mengeluarkan satu sesi akun; sesi saat ini juga boleh dikeluarkan. WebSocket yang dibuka dengan sesi itu ditutup. Tanpa body (atau `{}`).

        **Batas:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
