        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (autentikasi ulang yang gagal, atau terlalu banyak kode dicoba pada akun ini), atau `rate_limited` (batas `reauth` atau `reauth_user`, jatah akun, antrean hash kata sandi).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
