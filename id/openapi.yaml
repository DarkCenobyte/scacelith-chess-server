        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (database tetap terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Ambil akun, rating, dan sanksi aktifnya
      description: |-
        Akun sebagaimana dilihat pemainnya: tampilan akun (juga `user` di setiap respons masuk), satu catatan rating per kategori tempat pemain pernah memainkan permainan dinilai, sanksi yang aktif, dan penangguhan. Tingkat integritas dari sistem antikecurangan tidak pernah ditampilkan.

        **Batas:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Akun.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`, atau `invalid_token` (juga jika akun telah dihapus).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `account` atau jatah akun.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (database tetap terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Terima atau tolak tantangan langsung
      description: |-
        Menetapkan apakah pemain lain boleh menantang pemain ini melalui namanya. Dengan `none`, tantangan langsung ditolak: penantang diberi tahu bahwa pemain itu tidak tersedia. Tanpa autentikasi ulang.

        **Batas:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: Preferensi yang kini berlaku.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
