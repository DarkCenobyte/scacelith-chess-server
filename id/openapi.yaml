                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: batas `account` atau jatah akun.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (database tetap terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Ubah kata sandi
      description: |-
        Mengubah kata sandi. Kata sandi saat ini diperlukan, tetapi faktor kedua tidak, bahkan saat autentikasi dua faktor aktif. Kata sandi baru mengikuti aturan pendaftaran (diperiksa setelah kata sandi saat ini).

        Perubahan ini memiliki efek berikut, dalam satu transaksi (semuanya, atau tidak sama sekali): mencabut semua sesi lain (sesi ini tetap masuk), membatalkan perubahan email yang tertunda, membuat tautan pengaturan ulang kata sandi akun tidak berlaku lagi, dan mengirim email kepada pemiliknya.

        **Autentikasi ulang:** hanya kata sandi. **Batas:** `reauth`, lalu `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Kata sandi telah diubah.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (akun yang hanya memakai Google), `weak_password` (dengan `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: kata sandi saat ini salah, atau pengaturan ulang atau perubahan kata sandi terjadi saat permintaan sedang diperiksa.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (autentikasi ulang akun yang gagal), atau `rate_limited` (batas `reauth` atau `reauth_user`, jatah akun, antrean hash kata sandi).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: antrean hash kata sandi, atau database tetap terkunci (`retryAfter: 1`, tidak ada yang berubah). `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Mulai mengaktifkan autentikasi dua faktor
      description: |-
        Menyimpan kunci rahasia autentikator baru yang tertunda, yang menggantikan kunci rahasia tertunda sebelumnya, lalu mengembalikannya untuk aplikasi autentikator (sebagai teks dan sebagai URI `otpauth://` untuk ditampilkan sebagai kode QR). Autentikasi dua faktor belum aktif: `POST /account/mfa/totp/enable` mengaktifkannya dengan kode dari kunci rahasia ini.

        **Autentikasi ulang:** hanya kata sandi. **Batas:** `reauth`, lalu `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Kunci rahasia yang tertunda.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (akun yang hanya memakai Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (diperiksa sebelum kata sandi).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (autentikasi ulang akun yang gagal), atau `rate_limited` (batas `reauth` atau `reauth_user`, jatah akun, antrean hash kata sandi).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (antrean hash kata sandi, atau database tetap terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Selesaikan pengaktifan autentikasi dua faktor dan dapatkan kode pemulihan
      description: |-
        Mengaktifkan autentikasi dua faktor dengan kode dari kunci rahasia yang tertunda (tepat 6 digit). Kata sandi tidak diminta di sini; kata sandi sudah diberikan saat penyiapan. Respons berisi 10 kode pemulihan, yang ditampilkan hanya kali ini.

        **Batas:** `reauth`, lalu `reauth_user`; kode yang salah dihitung sebagai kegagalan autentikasi ulang akun.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Autentikasi dua faktor aktif.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` tidak tepat 6 digit, atau body melanggar skema; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: kode salah (periksa waktu pada perangkat).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: tidak ada kunci rahasia yang tertunda (panggil `POST /account/mfa/totp/setup` terlebih dahulu).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (autentikasi ulang akun yang gagal), atau `rate_limited` (batas `reauth` atau `reauth_user`, jatah akun).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (database tetap terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: Nonaktifkan autentikasi dua faktor
      description: |-
        Menonaktifkan autentikasi dua faktor. Kunci rahasia dan kode pemulihan dihapus, dan pemiliknya menerima email.

        **Autentikasi ulang:** kata sandi dan kode autentikator atau kode pemulihan (salah satu dari `code` atau `recoveryCode` wajib ada). **Batas:** `reauth`, lalu `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Autentikasi dua faktor nonaktif.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (akun yang hanya memakai Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required` (tidak ada `code` maupun `recoveryCode`, diperiksa sebelum kata sandi), `invalid_password`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (autentikasi ulang yang gagal, atau terlalu banyak kode dicoba pada akun ini), atau `rate_limited` (batas `reauth` atau `reauth_user`, jatah akun, antrean hash kata sandi).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (antrean hash kata sandi, atau database tetap terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /account/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags:
