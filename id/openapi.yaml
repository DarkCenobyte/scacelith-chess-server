          description: '`busy` (database tetap terkunci; `retryAfter: 1` di body, tanpa header `Retry-After`), `server_busy` (pencarian sesi mendapati database terkunci), `timeout`. Juga `server_busy` dengan `retryAfter` 2 hingga 5 saat server sangat tertinggal (lihat pendahuluan): permintaan tidak dijalankan.'
  /players/{username}/games:
