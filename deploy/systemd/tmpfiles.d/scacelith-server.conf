# Scacelith dedicated server: the directories of scacelith-server.service (tmpfiles.d(5)).
# Install as /etc/tmpfiles.d/scacelith-server.conf after the account exists
# (sysusers.d/scacelith-server.conf), then create them with:
#   systemd-tmpfiles --create scacelith-server.conf
#
# /etc/scacelith holds the environment file and the secret files, /etc/scacelith/tls the
# certificate and key: root writes them, the scacelith group reads them. /var/lib/scacelith is the
# unit's StateDirectory (DATA_DIR); systemd creates it at the first start, this line lets the
# administration commands (migrate, check-config) run before that.
#Type Path               Mode User      Group     Age Argument
d     /etc/scacelith     0750 root      scacelith -   -
d     /etc/scacelith/tls 0750 root      scacelith -   -
d     /var/lib/scacelith 0750 scacelith scacelith -   -
