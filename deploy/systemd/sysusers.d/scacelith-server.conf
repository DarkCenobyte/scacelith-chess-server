# Scacelith dedicated server: the system account of scacelith-server.service (sysusers.d(5)).
# Install as /etc/sysusers.d/scacelith-server.conf, then create the account with:
#   systemd-sysusers scacelith-server.conf
# "u" also creates the group of the same name, which reads the TLS key and the configuration.
#Type Name      ID GECOS                        Home directory     Shell
u     scacelith -  "Scacelith dedicated server" /var/lib/scacelith /usr/sbin/nologin
