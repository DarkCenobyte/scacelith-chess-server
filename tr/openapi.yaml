paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Sunucunun adını, sürümlerini, portlarını ve kayıt kurallarını al
      description: |-
        Bir istemcinin giriş yapmadan ya da bağlanmadan önce ihtiyaç duyduğu bilgiler: sunucunun adı ve kimliği, WebSocket protokol sürümleri ve WebSocket'in nerede olduğu, kayıt kuralları, resmî süre kontrolleri ve bir istemcinin bir formu göndermeden önce denetleyebileceği sınırlar.

        **Sınırlar:** yalnızca adres başına katman.
      security: []
      responses:
        '200':
          description: Sunucunun tanımı.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: adres başına katman.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Hesap oluştur
      description: |-
        Bir hesap oluşturur: e-posta adresi, adrese gönderilen bağlantıyla onaylandığında ya da e-posta onayı yoksa hemen.

        **E-posta onayıyla** (`REQUIRE_EMAIL_VERIFICATION`, varsayılan): 202 `verification_sent`. Henüz bir hesap yoktur: kayıt 24 saat bekler ve bu sürede kullanıcı adını ayırır. Bu 24 saat boyunca geçerli bir bağlantı adrese gönderilir, adres başına 5 dakikada en fazla bir tane (`POST /auth/verify-email/resend` yenisini gönderir); bağlantı kullanıldığında (`/verify-email` sayfasındaki düğme) hesap, adresi onaylanmış olarak oluşturulur ve oyuncu artık giriş yapabilir. O zamana kadar bu kullanıcı adıyla yapılan bir giriş, bilinmeyen bir hesapta olduğu gibi `invalid_credentials` yanıtını alır ve herkese açık profil yoktur. Aynı adresle yapılan yeni bir kayıt, bekleyen kaydın yerini alır. Adresi zaten başka bir hesap kullanıyorsa da yanıt aynıdır: bu durumda bağlantı gönderilmez, bunun yerine adresin sahibine bir uyarı gider (saatte en fazla bir) ve kullanıcı adı aynı şekilde ayrılır; böylece hiçbir şey adresin bir hesabı olup olmadığını belli etmez. Bağlantısı kullanılmayan bir kayıt 24 saat sonra silinir ve kullanıcı adı yeniden serbest kalır.

        **E-posta onayı olmadan** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`; hesap hemen oluşturulur ve giriş yapabilir.

        **Kurallar.** `username`: `USERNAME_MIN` ile `USERNAME_MAX` arası karakter (3 ile 20), harfler, rakamlar, `_` ve `-`; bir harf ya da rakamla başlar (`GET /info` bunları `limits` olarak verir); ayrılmış adlar (`admin`, `moderator`, `deleted`...) ve bazı önekler reddedilir; büyük/küçük harf ayrımı gözetilmeden benzersizdir. `email`: baştaki ve sondaki boşluklar kırpılır ve küçük harfle saklanır; noktalı bir alan adı içeren düz ASCII. `password`: en az `PASSWORD_MIN_LENGTH` (10) karakter ve en fazla 256 bayt UTF-8; kullanıcı adını ya da e-postanın yerel kısmını içermemeli ve yaygın bir parola olmamalıdır.

        **Hatalar**, bu sırayla denetlenir: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; parola hash kuyruğu hataları; 409 `email_taken` (yalnızca e-posta onayı olmadan).

        **Sınırlar:** `auth`, ardından `auth_register` (istemci başına saatte 10 kayıt). **İş kanıtı:** `POW_REGISTER_BITS` 0'dan büyükse her zaman.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: İlk deneme, iş kanıtı olmadan
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: İş kanıtıyla yeniden gönderilen istek
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Hesap oluşturuldu ve giriş yapabilir (bu sunucuda e-posta onayı yok).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Kayıt, onay bağlantısının kullanılmasını bekliyor (ya da adresin zaten bir hesabı var; yanıt bunu belli etmez).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (`field` ile), `invalid_json`, `invalid_username`, `invalid_email` ya da `reason` ile `weak_password`: `too_short`, `too_long`, `contains_username`, `contains_email` veya `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: bu sunucuda kayıt kapalı (`GET /info` yanıtında `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: kullanıcı adı bir hesaba ait ya da başka bir adresle yapılmış bekleyen bir kayıt onu ayırmış. `email_taken`: adresi başka bir hesap kullanıyor (yalnızca e-posta onayı olmadan).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth` ya da `auth_register` sınırı veya parola hash kuyruğu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (parola hash kuyruğu ya da veritabanı kilitli kaldı), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Parolayla giriş yap
      description: |-
        Bir kullanıcı adı ya da e-posta adresi ve bir parolayla giriş yapar. İki olası yanıt vardır, ikisi de 200 durum koduyla: bir oturum ya da, iki faktörlü kimlik doğrulama açıksa, 5 dakika içinde `POST /auth/login/mfa` ile tamamlanacak ikinci bir adım.

        Bilinmeyen hesap, yanlış parola ve parolası olmayan hesap aynı süre sonunda aynı yanıtı alır: 401 `invalid_credentials`. Hesap denetimleri (`banned`, `email_unverified`) ancak doğru bir paroladan sonra yapılır. Bir giriş adı için `AUTH_FAILURES_PER_ACCOUNT` (5) başarısız denemeden itibaren her deneme beklemek zorundadır (429 `too_many_attempts`).

        **Sınır:** `auth`. **İş kanıtı:** yalnızca bir başarısız giriş dalgası sırasında (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Bir oturum ya da iki faktörlü kimlik doğrulamalı bir girişin ikinci adımı.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Giriş yapıldı
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: İki faktörlü kimlik doğrulama açık
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: bilinmeyen hesap, yanlış parola ya da parolası olmayan bir hesap.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Yalnızca doğru bir paroladan sonra: `until` ile `banned` (epoch ms; kalıcı askıya alma için `null`) ya da `email_unverified` (adresi henüz onaylanmamış eski bir hesap).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (bu giriş adının başarısız deneme beklemesi) ya da `rate_limited` (`auth` sınırı, parola hash kuyruğu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (parola hash kuyruğu ya da veritabanı kilitli kaldı), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Girişi ikinci faktörle tamamla
      description: |-
        `POST /auth/login` ya da bir Google ile giriş (`POST /auth/sso/google/finish` veya `POST /auth/sso/google/link`) `mfaRequired` döndürdükten sonra, iki faktörlü kimlik doğrulamalı bir girişin ikinci adımı. `code` (6 haneli bir kimlik doğrulama uygulaması kodu ya da bir kurtarma kodu) veya `recoveryCode` gönderin. Burada kullanılan bir kurtarma kodu tükenir.

        Bir adım en fazla 5 yanlış kod kabul eder; parola sıfırlandığında ya da değiştirildiğinde de adım sona erer. Bir Google bağlamasının parola adımından sonra bağlama yalnızca kod burada doğrulandığında kaydedilir.

        **Sınırlar:** `auth` ve hangi adresten olursa olsun hesap için 15 dakikada en fazla `AUTH_MFA_PER_ACCOUNT` (10) kod; bunun ötesinde kod denetlenmez, böylece kurtarma kodu harcanmaz.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Bir kimlik doğrulama uygulaması kodu
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Bir kurtarma kodu
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Giriş yapıldı.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: ne `code` ne de `recoveryCode` gönderildi ya da gövde şemaya uymuyor; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: adımın süresi doldu, adım kullanıldı ya da 5 yanlış koddan sonra sona erdi veya ilk adımdan bu yana parola sıfırlandı ya da değiştirildi (yeniden giriş yapın). `invalid_code`: yanlış ya da daha önce kullanılmış bir kod.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (`until` ile), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: yalnızca bir Google bağlamasının parola adımından sonra; Google hesabı bu arada başka bir hesaba bağlandı.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: yalnızca bir Google bağlamasının parola adımından sonra; hesap bu arada değişti; girişi baştan başlatın.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: hesabın başarısız deneme beklemesi ya da hesabın son 15 dakikadaki `AUTH_MFA_PER_ACCOUNT` kod hakkı tükendi. `rate_limited`: `auth` sınırı.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`retryAfter: 1` ile `server_busy`: veritabanı kilitli kaldı (bir Google bağlama adımından sonra hiçbir şey bağlanmadı: girişi baştan başlatın). `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Bu oturumu kapat
      description: |-
        Kullanılan token'ın oturumunu geçersiz kılar. Bu oturumla açılan WebSocket kapatılır. Gövde yok (ya da `{}`).

        **Sınır:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Çıkış yapıldı.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `{}` dışında bir gövde; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `sessions` sınırı ya da hesap kotası.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (veritabanı kilitli kaldı), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
        - sessions
      summary: Tüm oturumları kapat
      description: |-
        Bu oturum dahil, hesabın tüm oturumlarını geçersiz kılar. Bu oturumlarla açılan WebSocket'ler kapatılır. Gövde yok (ya da `{}`).

        **Sınır:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tüm oturumlar kapatıldı.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `{}` dışında bir gövde; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `sessions` sınırı ya da hesap kotası.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (veritabanı kilitli kaldı), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Onay bağlantısını yeniden gönder
      description: |-
        E-posta onay bağlantısını yeniden gönderir. Adres ne olursa olsun yanıt 202 `accepted` olur; böylece adresi bir hesabın ya da bir kaydın kullanıp kullanmadığını hiçbir zaman belli etmez.

        Bir istek, adres başına 5 dakikada en fazla bir kez etki eder. O adresle bekleyen bir kaydın 24 saati, adresi başka bir hesap kullansa da kullanmasa da yeniden başlar; böylece kullanıcı adı her iki durumda da aynı süre ayrılmış kalır. Bağlantı yalnızca, adresin hesabı yoksa o kayıt için (24 saat geçerli yeni bir bağlantı öncekinin yerini alır) ya da o adrese sahip etkin, onaylanmamış bir hesap için gönderilir.

        **Sınırlar:** `auth`, ardından `auth_mail` (istemci başına saatte 10).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Kabul edildi (adres ne olursa olsun).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth` ya da `auth_mail` sınırı (adres ne olursa olsun).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`retryAfter: 1` ile `server_busy`: hesap aranırken ya da onaylanmamış bir hesabın bağlantısı kaydedilirken veritabanı kilitli kaldı (bekleyen bir kaydın yenilenmesi en iyi çaba esasına göre yapılır ve isteği hiçbir zaman başarısız kılmaz); adresin 5 dakikası yine de başlar, bu yüzden bu süre içindeki yeni bir istek hiçbir şey yapmaz. `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Parola sıfırlama bağlantısı gönder
      description: |-
        Bir saat geçerli olan ve `/reset-password` sayfasını açan bir parola sıfırlama bağlantısı gönderir. Adres ne olursa olsun yanıt 202 `accepted` olur. Bağlantı yalnızca etkin bir hesaba gider, adres başına 5 dakikada en fazla bir kez. Yalnızca Google ile giriş yapan bir hesap ilk parolasını bu yolla belirler.

        Parola kurtarma, API'nin en katı sınırlarına sahiptir ve hepsi tüm sunucu için sayılır: istemci (bir IPv4 adresi ya da bir IPv6 /64 bloğu) başına saatte 3 istek (`AUTH_FORGOT_PER_HOUR`) ve 24 saatte 10 istek (`AUTH_FORGOT_PER_DAY`), IPv6 /48 başına bu sayıların 3 katı; bunlara `auth` sınırı (10 dakikada 20) ve adres başına 5 dakikada bir e-posta kuralı da eklenir. Ne 202 ne de 429 yanıtı, adresi bir hesabın kullanıp kullanmadığını belli eder. Yeni parolanın belirlenmesinin kendi sınırı vardır (`auth_reset`).

        **Sınırlar:** `auth`, `auth_forgot`, ardından `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Kabul edildi (adres ne olursa olsun).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth`, `auth_forgot` ya da `auth_forgot_day` sınırı (adres ne olursa olsun).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`retryAfter: 1` ile `server_busy`: hesap aranırken ya da bağlantı kaydedilirken veritabanı kilitli kaldı; adresin 5 dakikası yine de başlar, bu yüzden bu süre içindeki yeni bir istek bağlantı göndermez. `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Sıfırlama bağlantısının token'ıyla yeni parola belirle
      description: |-
        Bir sıfırlama bağlantısının token'ıyla yeni bir parola belirler (`/reset-password` sayfası da aynısını yapar). Yeni parola kayıt kurallarına uyar.

        Sıfırlamanın şu etkileri vardır ve hepsi tek bir işlemde gerçekleşir (ya hepsi ya hiçbiri): tüm oturumları geçersiz kılar ve bekleyen bir e-posta değişikliğini iptal eder; hesabın diğer sıfırlama bağlantıları çalışmaz hâle gelir; adres onaylanmış sayılır (bağlantı bunu kanıtladı); hesabın sahibine bir e-posta gider. İki faktörlü kimlik doğrulamaya dokunulmaz. Bir parola hash kuyruğu hatasından, bir 503 ya da bir 500 yanıtından sonra hiçbir şey değişmemiştir: eski parola ve oturumlar kalır, bağlantı da geçerliliğini korur.

        **Sınırlar:** `auth`, ardından `auth_reset` (istemci başına saatte 10, IPv6 /48 başına 30; sayfayla ortak: her deneme bir parolanın hash'ini hesaplar).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Parola değiştirildi ve tüm oturumlar kapatıldı.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: bağlantı geçersiz, kullanılmış ya da süresi dolmuş veya hesabın artık sahip olmadığı bir adrese gönderilmiş. `weak_password` (`reason` ile). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth` ya da `auth_reset` sınırı veya parola hash kuyruğu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: parola hash kuyruğu ya da veritabanı kilitli kaldı (`retryAfter: 1`, hiçbir şey değişmedi). `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Google ile girişi başlat
      description: |-
        PKCE sınaması ve oyunun `127.0.0.1` üzerindeki dinleyicisinin portu için bir Google ile giriş denemesi başlatır. Yanıt, sistem tarayıcısında açılacak Google URL'sini ve denemenin `state` değerini verir; deneme 10 dakika geçerlidir.

        `authUrl` şunları içerir: `client_id`, `redirect_uri` (`redirectPort` ve sunucunun köken etiketinden oluşturulur), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge_method=S256` ile birlikte `code_challenge` (sunucunun Google için kullandığı kendi doğrulayıcısının S256 değeri) ve `prompt=select_account`. Oyun bu URL'yi açmadan önce denetler (bkz. bölüm açıklaması).

        **Sınır:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Deneme.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: bu sunucu Google ile giriş sunmuyor.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `sso_start` sınırı.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (veritabanı kilitli kaldı), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Bir web sitesinde Google ile girişi başlat
      description: |-
        Bir web sitesi için, sayfasının PKCE sınamasıyla bir Google ile giriş denemesi başlatır. Yanıt oyundakiyle aynıdır: gidilecek Google URL'si ve denemenin `state` değeri; deneme 10 dakika geçerlidir. `GET /info` yanıtında `sso.googleWeb: true` olduğunda sunulur.

        `authUrl`, web sitesinin `client_id` değerini ve `redirect_uri=GOOGLE_WEB_REDIRECT_URI` parametresini, diğer parametreler oyundakiyle aynı olmak üzere içerir. Sayfa bu URL'ye gitmeden önce onu denetler (bkz. bölüm açıklamasındaki **Bir web sitesinde**).

        **Sınır:** `sso_start`; oyunun başlatma isteğiyle ortak.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: Deneme.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: eksik ya da hatalı biçimli bir `codeChallenge` veya başka herhangi bir alan (`redirectPort` dahil).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: bu sunucu Google ile giriş sunmuyor ya da web sitelerine sunmuyor.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `sso_start` sınırı (oyunun başlatma isteğiyle ortak).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (veritabanı kilitli kaldı), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Google'ın yanıtını sunucuya ilet
      description: |-
        Google'ın oyunun dinleyicisine ya da web sitesinin sayfasına gönderdiği `code` ve `state` değerlerini, deneme kimliği ve PKCE doğrulayıcısıyla birlikte sunucuya iletir. Bir deneme kimliği doğrulayıcı olmadan işe yaramaz; kod da sunucunun kendi PKCE doğrulayıcısı ve istemci gizli anahtarı (client secret) olmadan işe yaramaz.

        Sunucu önce denemeyi (bilinmeyen, kullanılmış ya da süresi dolmuş: 410), ardından doğrulayıcıyı (yanlış bir doğrulayıcı denemeyi kullanılabilir bırakır) denetler; sonra denemeyi bir kez kullanır, `state` ve `iss` değerlerini denetler, kodu Google ile takas eder ve ID token'ını doğrular. Yanıt (200) şunlardan biridir:

        - `{ token, expiresAt, user }`: bağlı hesaba giriş yapıldı;
        - `{ mfaRequired, mfaToken, expiresIn }`: `POST /auth/login/mfa` ile devam edin;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: yeni bir hesap; 10 dakika içinde `POST /auth/sso/complete` ile devam edin. `suggestedUsername` Google adından ya da adresten türetilir ve uygun bir ad bulunamazsa `""` olur;
        - `{ needsPassword, linkTicket, username, expiresIn }`: o adrese sahip hesabın bir parolası var; `POST /auth/sso/google/link` ile devam edin. Henüz hiçbir şey bağlanmadı.

        **Sınır:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Bir oturum, ikinci bir adım ya da ilk kez yapılan bir Google ile girişin sonraki adımı.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Bağlı hesaba giriş yapıldı
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: İki faktörlü kimlik doğrulama açık
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Yeni bir oyuncu
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Adresi parolalı bir hesap kullanıyor
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: doğrulayıcı denemenin sınamasıyla eşleşmiyor (deneme kullanılabilir kalır). `sso_email_unverified`: Google adresi doğrulamamış. `registration_closed`. `account_disabled`. Yalnızca bağlı bir hesap için: `banned` (`until` ile), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: bu sunucu Google ile giriş sunmuyor.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
