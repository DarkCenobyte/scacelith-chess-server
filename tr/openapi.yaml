          description: '`invalid_password`, `mfa_code_required`, `invalid_code` (kurtarma kodu için de).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (başarısız yeniden kimlik doğrulamalar ya da bu hesapta denenen çok fazla kod) veya `rate_limited` (`reauth` ya da `reauth_user` sınırı, hesap kotası, parola hash kuyruğu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (parola hash kuyruğu ya da veritabanı kilitli kaldı), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: E-posta adresini değiştir
      description: |-
        Hesabın e-posta adresini değiştirir. `newEmail` baştaki ve sondaki boşluklardan arındırılır ve küçük harfe çevrilir, ardından bir kayıt adresi gibi denetlenir.

        **E-posta onayıyla** (varsayılan): 202 `verification_sent`. Yeni adrese 24 saat geçerli bir bağlantı gönderilir; bağlantı `/confirm-email-change` sayfasını açar ve adres yalnızca oyuncu o sayfadaki düğmeye bastığında değişir. O zamana kadar `GET /account/me` yeni adresi `pendingEmail` olarak gösterir. Yeni bir istek bekleyen isteğin yerini alır; bir parola değişikliği veya sıfırlaması onu iptal eder. Kim isterse istesin, belirli bir yeni adrese 5 dakikada en fazla bir bağlantı gönderilir (zaten bekleyen değişiklik için yapılan bir istek, daha önce gönderilmiş ve geçerliliğini koruyan bağlantıyı korur); yanıt aynıdır. Mevcut adrese, maskelenmiş bir adrese (`a***@example.org`) değişiklik istendiğini bildiren bir uyarı gider. Yeni adresi başka bir hesap zaten kullanıyorsa yanıt ve `pendingEmail` aynıdır: bu durumda bağlantı gönderilmez, dolayısıyla bu değişiklik hiçbir zaman tamamlanmaz ve bunun yerine o adresin sahibi bir uyarı alır (saatte en fazla bir tane).

        Bağlantı onaylandığında adres değişir ve onaylanmış sayılır, cihazlarda giriş açık kalır, daha önce gönderilen bağlantılar (onay, parola sıfırlama, diğer değişiklikler) çalışmaz hâle gelir ve eski adrese, yeni adres maskelenmiş olarak bilgi verilir.

        **E-posta onayı olmadan** (`REQUIRE_EMAIL_VERIFICATION=false`): adres hemen değişir (200 `email_changed`) ve eski adrese bilgi verilir. Adresi başka bir hesap kullanıyorsa yanıt 409 `email_taken` olur ve o adresin sahibi uyarıyı alır.

        **Yeniden kimlik doğrulama:** parola ve, iki faktörlü kimlik doğrulama açıksa, bir kimlik doğrulama uygulaması kodu ya da bir kurtarma kodu. `invalid_email` ve `same_email` paroladan önce denetlenir, bu yüzden başarısız deneme olarak sayılmaz. **Sınırlar:** `reauth`, ardından `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Adres hemen değişti (bu sunucuda e-posta onayı yok).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: Kaydedildiği hâliyle yeni adres.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: Yeni adrese bir onay bağlantısı gönderildi (ya da adres başka bir hesaba ait; yanıt bunu belli etmez).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email` (hesabın mevcut adresi), `password_not_set` (yalnızca Google ile giriş yapılan bir hesap), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` (bir parola değişikliği veya sıfırlaması isteğin önüne geçtiğinde de: bağlantı gönderilmez), `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: yalnızca e-posta onayı olmadan.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (başarısız yeniden kimlik doğrulamalar ya da bu hesapta denenen çok fazla kod) veya `rate_limited` (`reauth` ya da `reauth_user` sınırı, hesap kotası, parola hash kuyruğu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: parola hash kuyruğu ya da veritabanı kilitli kaldı (`retryAfter: 1`: hiçbir şey değişmedi ve aynı istek yeniden gönderilebilir). `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: Hesabın verilerini indir
      description: |-
        Sunucunun hesap hakkında sakladığı her şey, kaydedilecek tek bir JSON dosyası olarak (`format` `scacelith-account-export`, `version` 1). Dışa aktarma bir güvenlik olayı kaydeder (`account_exported`). Belgedeki `notes` dizisi, nelerin dışarıda bırakıldığını oyuncuya sade bir İngilizceyle anlatır.

        **Dışa aktarmada asla bulunmayanlar:** parola hash'i, iki faktörlü kimlik doğrulamanın gizli anahtarı ve kurtarma kodları; herhangi bir oturum veya bağlantı token'ı ya da bunların hash'i; hile karşıtı sistemin verileri (dürüstlük düzeyi ve skoru, anormallikler, oyunların analizi, bir bildirimin ağırlığı); diğer oyuncuların bu oyuncu hakkında yaptığı bildirimler; moderatörlerin kimlikleri; diğer oyuncuların özel verileri (rakipler herkese açık adları ve puanlarıyla görünür, başka bir oyuncunun yaptırım alıp almadığını hiçbir şey belli etmez ve başka bir kişiye ait olabilecek hiçbir IP adresi dahil edilmez).

        **Yeniden kimlik doğrulama:** parola ve, iki faktörlü kimlik doğrulama açıksa, bir kimlik doğrulama uygulaması kodu ya da bir kurtarma kodu. **Sınırlar:** `account_export` (oyuncu başına saatte 5, tüm sunucu için; başarısızlar dahil her deneme sayılır; ilk olarak denetlenir), ardından `reauth` ve `reauth_user`. **Süre sınırı:** 60 sn.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Dışa aktarma belgesi, ek olarak.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-account-<username>.json"`. Kullanıcı adındaki harf, rakam, `_`, `.` ve `-` dışındaki karakterler `_` olur.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-account-[A-Za-z0-9_.-]+\.json"$'
