      İzleme için sunucunun canlılık ve hazır olma durumu. Bu uç noktalar API portunda, kimlik doğrulamadan ve tüm uç nokta sınırlarından önce yanıt verir, ama her istek gibi adres başına katmandan bir jeton alır; bir izleme sunucusu `ABUSE_EXEMPT` içinde listelenebilir. Her uç nokta iki yolda da çalışır: sunucunun kökünde ve `/api/v1` altında.

