        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (veritabanı kilitli kaldı), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Google'ı parolasıyla mevcut bir hesaba bağla
      description: |-
        `finish` uç noktası `needsPassword` döndürdükten sonra: oyunda yazılan hesap parolasıyla Google'ı mevcut hesaba bağlar. Yanıt (200) bir oturumdur (bağlama kaydedilir ve oyuncu giriş yapmış olur) ya da iki faktörlü kimlik doğrulama açıksa `{ mfaRequired, mfaToken, expiresIn }`: `POST /auth/login/mfa` ile devam edin; bağlama yalnızca orada bir kod doğrulandığında kaydedilir.

        Yanlış bir parola bileti kullanılabilir bırakır, toplam 5 denemeye kadar. Deneme hakkı, parola denetlenmeden hemen önce düşülür: 429 `too_many_attempts` ya da 428 `pow_required` hiç hak düşürmez; parola hash kuyruğunun bir reti (503 `server_busy`, 429 `rate_limited`) ise bir hak düşürmüştür ve hesabın başarısız denemesi olarak sayılır. Başarısız deneme beklemesi, `POST /auth/login` ile aynı sayaçtır.

        **Sınır:** `auth` (IPv6 /48 sayımıyla birlikte). **İş kanıtı:** `POST /auth/login` ile aynı.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Bir oturum ya da girişin ikinci adımı.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: yanlış parola; bilet toplam 5 deneme boyunca geçerli kalır.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (`until` ile), yalnızca doğru parola girildikten sonra.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: bu sunucuda Google ile giriş sunulmuyor.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: Google hesabı bu arada başka bir hesaba bağlandı.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: bilinmeyen, kullanılmış ya da süresi dolmuş bir bilet, 5. yanlış parola, `finish` adımından bu yana durumu veya adresi değişmiş bir hesap ya da bağlama kaydedilirken durumu, adresi, parolası veya iki faktörlü kimlik doğrulaması değişmiş bir hesap. Girişi yeniden başlatın.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (hesabın başarısız deneme beklemesi) veya `rate_limited` (`auth` sınırı, parola hash kuyruğu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: parola hash kuyruğu ya da veritabanı kilitli kaldı (`retryAfter: 1`, hiçbir şey bağlanmadı). `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: İlk kez Google ile girişte hesabı oluştur
      description: |-
        `finish`, `needsUsername` yanıtını verdikten sonra: hesabı seçilen kullanıcı adıyla oluşturur (kayıt kuralları geçerlidir) ve bu hesapla giriş yapar. Hesabın parolası yoktur: `hasPassword` `false` olur ve "Parolanızı mı unuttunuz?" (`POST /auth/password/forgot`) hesaba bir parola verir.

        **Sınır:** `auth` (IPv6 /48 bloğu sayımıyla birlikte).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Hesap oluşturuldu ve giriş yapıldı.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: bu sunucuda Google ile giriş sunulmuyor.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (kullanıcı adı bir hesapta kullanılıyor ya da başka bir adresin bekleyen kaydı onu ayırmış), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: bilinmeyen, kullanılmış ya da süresi dolmuş bir bilet.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth` sınırı.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (veritabanı kilitli kaldı), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Giriş yapılmış cihazları listele
      description: |-
        Hesabın etkin oturumları (giriş yapılmış cihazlar), en son kullanılan önce. `current`, isteği yapan oturumu işaretler. `lastSeenAt` en fazla 5 dakikada bir güncellenir (sunucu çok geride kaldığı sürece daha geç); `expiresAt` mutlak bitiş zamanıdır ve boşta kalma sınırı oturumu daha erken sonlandırabilir.

        **Sınır:** `sessions`.
