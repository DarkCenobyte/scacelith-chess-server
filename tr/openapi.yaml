          description: '`busy` (veritabanı kilitli kaldı; gövdede `retryAfter: 1`, `Retry-After` başlığı yok), `server_busy` (oturum sorgulaması veritabanını kilitli buldu), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: Bir kategorinin en iyi oyuncularını getir
      description: |-
        Resmî bir kategoride en az `minGames` (`PROVISIONAL_GAMES`) sayılan oyunu olan en iyi 100 puan kaydı; silinmiş hesaplar ve hileciliği kesinleşmiş oyuncular hariç. Sunucu her tabloyu en fazla 10 saniyede bir yeniden hesaplar; `updatedAt` ne zaman hesaplandığını söyler. Bir kategori için aynı anda tek bir hesaplama çalışır: bu sırada diğer istekler önceki listeyi alır ya da henüz liste yoksa hesaplamayı bekler.

        **Sınırlar:** yalnızca adres başına katman.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: Resmî bir kategori kimliği (`3+2` veya `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: 'Kaç oyuncu: 1 ila 100. En fazla 3 haneli daha büyük bir sayı 100 sayılır; boş bir değer, parametre hiç verilmemiş gibi sayılır.'
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: Tablo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (eksik ya da resmî bir kategori değil), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: adres başına katman.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (veritabanı kilitli kaldı; gövdede `retryAfter: 1`, `Retry-After` başlığı yok), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Yakın tarihli bir oyundaki rakibi bildir
      description: |-
        Oyuncunun son 7 gün içinde biten kendi oyunlarından birindeki rakibi bildirir. Bir bildirim tek başına hiçbir zaman bir puanı, bir yaptırımı ya da bir dürüstlük düzeyini değiştirmez. Moderatörlerin gördüğü inceleme önceliğini yükseltir ve `abuse` dışında oyunun satranç motoru analizini ister.

        Aynı oyun için aynı rakibin yeniden bildirilmesi aynı yanıtı alır ve hiçbir şeyi değiştirmez; yanıt, bildirilen hesap hakkında hiçbir zaman bir şey söylemez. `GET /games/{id}`, oyunun oyuncularına bir bildirimin kabul edilip edilmeyeceğini önceden söyler (`reportable`).

        Bu uç nokta gövdesini kendisi, `gameId`, `reported`, `category`, `comment` sırasıyla denetler: bir hata, `field` olmadan 400 `invalid_request` ile yanıtlanır. Bilmediği alanlar yok sayılır.

        **Sınırlar:** `reports` (oyuncu başına), ardından oyuncu başına 24 saatte `REPORTS_PER_DAY` (5) bildirim (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Bildirim alındı (ya da zaten yapılmıştı).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (`field` olmadan), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: son 7 gün içinde biten bir oyunda bildirimi yapanın rakibi değil.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, `Retry-After` başlığıyla): son 24 saatte `REPORTS_PER_DAY` bildirim. `rate_limited`: `reports` sınırı veya hesap kotası.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (oturum sorgulaması veritabanını kilitli buldu), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
