      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: İki faktörlü kimlik doğrulamayı açmaya başla
      description: |-
        Bekleyen yeni bir kimlik doğrulama gizli anahtarı kaydeder (daha önce bekleyen bir anahtar varsa onun yerini alır) ve bunu kimlik doğrulama uygulaması için döndürür (metin olarak ve QR kodu olarak gösterilecek bir `otpauth://` URI'si olarak). İki faktörlü kimlik doğrulama henüz açık değildir: `POST /account/mfa/totp/enable` bu gizli anahtarın bir koduyla onu açar.

        **Yeniden kimlik doğrulama:** yalnızca parola. **Sınırlar:** `reauth`, ardından `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Bekleyen gizli anahtar.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (yalnızca Google ile giriş yapılan bir hesap), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (paroladan önce denetlenir).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (hesabın başarısız yeniden kimlik doğrulamaları) veya `rate_limited` (`reauth` ya da `reauth_user` sınırı, hesap kotası, parola hash kuyruğu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (parola hash kuyruğu ya da veritabanı kilitli kaldı), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: İki faktörlü kimlik doğrulamayı açmayı tamamla ve kurtarma kodlarını al
      description: |-
        Bekleyen gizli anahtarın bir koduyla (tam 6 hane) iki faktörlü kimlik doğrulamayı açar. Burada parola istenmez; kurulumda verilmişti. Yanıt, yalnızca bu kez gösterilen 10 kurtarma kodunu içerir.

        **Sınırlar:** `reauth`, ardından `reauth_user`; yanlış bir kod, hesabın başarısız yeniden kimlik doğrulamalarına sayılır.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: İki faktörlü kimlik doğrulama açık.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` tam 6 hane değil ya da gövde şemaya uymuyor; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: yanlış kod (cihazın saatini kontrol edin).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: bekleyen gizli anahtar yok (önce `POST /account/mfa/totp/setup` çağrısını yapın).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (hesabın başarısız yeniden kimlik doğrulamaları) veya `rate_limited` (`reauth` ya da `reauth_user` sınırı, hesap kotası).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (veritabanı kilitli kaldı), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: İki faktörlü kimlik doğrulamayı kapat
      description: |-
        İki faktörlü kimlik doğrulamayı kapatır. Gizli anahtar ve kurtarma kodları silinir ve hesap sahibine bir e-posta gönderilir.

        **Yeniden kimlik doğrulama:** parola ve bir kimlik doğrulama uygulaması kodu ya da bir kurtarma kodu (`code` veya `recoveryCode` alanlarından biri zorunludur). **Sınırlar:** `reauth`, ardından `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: İki faktörlü kimlik doğrulama kapalı.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (yalnızca Google ile giriş yapılan bir hesap), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required` (ne `code` ne de `recoveryCode` var; paroladan önce denetlenir), `invalid_password`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (başarısız yeniden kimlik doğrulamalar ya da bu hesapta denenen çok fazla kod) veya `rate_limited` (`reauth` ya da `reauth_user` sınırı, hesap kotası, parola hash kuyruğu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (parola hash kuyruğu ya da veritabanı kilitli kaldı), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /account/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags:
        - two-step-verification
      summary: Kurtarma kodlarını değiştir
      description: |-
        Kurtarma kodlarını 10 yeni kodla değiştirir; eski kodlar artık çalışmaz.

        **Yeniden kimlik doğrulama:** parola ve `code` içinde bir kimlik doğrulama uygulaması kodu (kurtarma kodu 403 `invalid_code` ile reddedilir). **Sınırlar:** `reauth`, ardından `reauth_user`.
      security:
        - bearerAuth: []
