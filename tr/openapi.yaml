        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (yalnızca Google ile giriş yapılan bir hesap), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`.'
