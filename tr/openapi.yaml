      description: |-
        Diğer oyuncuların bu oyuncuya adıyla meydan okuyup okuyamayacağını belirler. `none` ile doğrudan meydan okumalar reddedilir: meydan okuyan oyuncuya, oyuncunun müsait olmadığı bildirilir. Yeniden kimlik doğrulama gerekmez.

        **Sınır:** `account`.
      security:
