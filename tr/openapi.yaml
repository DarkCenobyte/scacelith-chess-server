          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (başarısız yeniden kimlik doğrulamalar ya da bu hesapta denenen çok fazla kod) veya `rate_limited` (`account_export`, `reauth` ya da `reauth_user` sınırı, hesap kotası, parola hash kuyruğu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (veritabanı kilitli kaldı, `Retry-After: 1` başlığıyla), `server_busy` (parola hash kuyruğu), `timeout` (60 sn). Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: Hesabı sil
      description: |-
        Hesabı siler; bu işlem geri alınamaz.

        - Tüm oturumlar hemen geçersiz kılınır: token bundan sonra 401 `invalid_token` alır.
        - Kullanıcı adı, hesapta ve her oyun kaydında `deleted#<id>` olur.
        - Şunlar silinir: e-posta adresi, parola hash'i, iki faktörlü kimlik doğrulamanın gizli anahtarı ve kurtarma kodları, oturumlar ve bağlantı token'ları, Google bağlaması, hile karşıtı sistemin dürüstlük kaydı ve güvenlik olaylarıyla birlikte saklanan IP adresleri.
        - Puanlar ve oyunlar korunur. Oyunlar anonim ad altında okunabilir kalır ve `GET /players/{username}` eski ad için 404 yanıtını verir.

        **Yeniden kimlik doğrulama:** parola ve, iki faktörlü kimlik doğrulama açıksa, bir kimlik doğrulama uygulaması kodu ya da bir kurtarma kodu. **Sınırlar:** `reauth`, ardından `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Hesap silindi.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (yalnızca Google ile giriş yapılan bir hesap), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (başarısız yeniden kimlik doğrulamalar ya da bu hesapta denenen çok fazla kod) veya `rate_limited` (`reauth` ya da `reauth_user` sınırı, hesap kotası, parola hash kuyruğu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (parola hash kuyruğu ya da veritabanı kilitli kaldı), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Oyuncunun oyunlarını filtreleyerek ve sayfalayarak listele
      description: |-
        Giriş yapmış oyuncunun oyunları: en yeni önce, filtrelenmiş ve sayfalanmış olarak, filtreye uyan oyun sayısıyla birlikte. Tüm sorgu parametreleri isteğe bağlıdır ve boş bir değer, parametre hiç verilmemiş gibi sayılır.

        Sayfalama: önceki sayfanın `next` değerini `before` olarak gönderin; son sayfada `next` `null` olur. `total`, tüm sayfalar genelinde filtreye uyan oyunları sayar.

        **Sınır:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: Resmî bir kategori kimliği (`3+2` veya `3%2B2`) ya da başka bir süre kontrolüyle oynanan tüm oyunlar için `custom`.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Yalnızca puanlı (`true`) veya puansız (`false`) oyunlar.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Oyuncunun açısından yalnızca kazanılan, kaybedilen veya berabere biten oyunlar. İptal edilen oyunlar yalnızca bu filtre olmadan görünür.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Geçmişin bir sayfası.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` bir oyun kimliği değil), `invalid_limit` veya `invalid_filter` (`category`, `rated` ya da `result`); her biri, parametreyi belirten `field` ile.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `account_games` sınırı veya hesap kotası.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (veritabanı kilitli kaldı; gövdede `retryAfter: 1`, `Retry-After` başlığı yok), `server_busy` (oturum sorgulaması veritabanını kilitli buldu), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /games/{id}:
    get:
      operationId: getGame
      tags:
        - games
      summary: Bir oyun kaydını hamleleri ve saatleriyle getir
      description: |-
        Hamleleri ve saatleriyle bir oyun kaydı. Token olmadan ya da oyunu oynamamış bir oyuncunun token'ıyla yanıt, herkese açık yanıttır. Token'ın sahibi olan oyuncu oyunu oynamışsa yanıta `you` ve `reportable` eklenir.

        **Sınır:** `public_read` (token varsa oyuncu başına, yoksa istemci başına).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Oyun kaydı.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameRecord'
              example:
                id: 4100000000001
                category: '3+2'
                rated: true
                timeControl: '180+2'
                white:
                  name: alice
                  rating: 1500
                  ratingAfter: 1510
                  ratingDiff: 10
                black:
                  name: bob
                  rating: 1520
                  ratingAfter: 1510
                  ratingDiff: -10
                status: 1
                reason: 2
                result: 1-0
                termination: Resignation
                plies: 2
                startedAt: 1790620205000
                endedAt: 1790620611000
                baseMs: 180000
                incMs: 2000
                statusName: WhiteWins
                rematchOf: null
                moves:
                  - uci: e2e4
                    spentMs: 0
                    clockMs: 180000
                  - uci: e7e5
                    spentMs: 1700
                    clockMs: 180300
                pgn:
                  Event: Scacelith rated 3+2
                  Site: caissa.scacelith.com
                  Date: '2026.09.28'
                  Round: '-'
                  White: alice
                  Black: bob
                  Result: 1-0
                  WhiteElo: 1500
                  BlackElo: 1520
                  TimeControl: '180+2'
                  Termination: Resignation
                  PlyCount: 2
                you: white
                reportable: true
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: en fazla 16 haneli pozitif bir tam sayı değil (2^53''ün altında); `invalid_request`: geçerli URL kodlaması değil.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: bir token gönderildi ve geçerli değil.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: böyle bir oyun yok.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `public_read` sınırı veya hesap kotası.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (veritabanı kilitli kaldı; gövdede `retryAfter: 1`, `Retry-After` başlığı yok), `server_busy` (oturum sorgulaması veritabanını kilitli buldu), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Bir oyunu PGN dosyası olarak indir
      description: |-
        Aynı oyun, PGN dosyası olarak: `\n` satır sonlarıyla tek bir oyun ve 80 sütunun altındaki satırlarda hamle metni. Yanıt, token olsa da olmasa da aynıdır.

        Etiketler, bu sırayla: `Event` (`<SERVER_NAME> rated <category>` veya `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (UTC başlangıç tarihi), `Round`, `White`, `Black`, `Result` (iptal edilen bir oyun için `*`), `UTCDate` ve `UTCTime` (başlangıç), `WhiteElo` ve `BlackElo` (başlangıçtaki puanlar ya da `-`), `WhiteRatingDiff` ve `BlackRatingDiff` (her puanlı oyunda `+10` ve `-10` gibi değişimler; puan kuralları puanı olduğu yerde bıraktığında `+0`; puansız, özel süre kontrollü ya da iptal edilen bir oyunda ikisi de bulunmaz), `TimeControl` (saniye cinsinden), `Termination` (PGN standardındaki bir değer: `normal`; `time forfeit`, süre dolması, berabere bittiğinde de; `abandoned`; `rules infraction`, ikinci bir kural dışı hamle ya da adil oyun ihlali nedeniyle hükmen yenilgi; `unterminated`, iptal edilen bir oyun), `PlyCount`, `ScacelithGameId` (onluk tabanda kimlik).

        Her hamle `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}` taşır: hamleyi yapan oyuncunun hamleden sonraki saati ve hamle için düşülen süre, saniyenin onda biri cinsinden (küsurat atılarak). Kayıtta bulunmayan bir değer yazılmaz. Son hamleden sonra bitiş nedeni sözcüklerle, ardından sonuç gelir.

        **Sınır:** `public_read` (token varsa oyuncu başına, yoksa istemci başına).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: PGN dosyası.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'UTF-8 kodlamasında PGN metni (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: en fazla 16 haneli pozitif bir tam sayı değil (2^53''ün altında); `invalid_request`: geçerli URL kodlaması değil.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: bir token gönderildi ve geçerli değil.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: böyle bir oyun yok.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `public_read` sınırı veya hesap kotası.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: diğer durumların yanı sıra, kayıtlı hamleler kayıtlı bitişe kadar yeniden oynatılamıyor (sunucu bunu günlüğe kaydeder).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (veritabanı kilitli kaldı; gövdede `retryAfter: 1`, `Retry-After` başlığı yok), `server_busy` (oturum sorgulaması veritabanını kilitli buldu), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Bu sunucudaki bir oyunu animasyonlu GIF olarak indir
      description: |-
        Oyun, animasyonlu GIF olarak. Adlar ve puanlar oyun kaydındakilerdir (başlangıçtaki puanlar, silinmiş bir hesap `deleted#<id>` olarak); sonuç ve bitiş şekli de oyun kaydından gelir (`Resignation`, `Loss on time`...).

        Denetimler şu sırayla yapılır: `gif_disabled`, resim seçenekleri (`size`, `orientation`, `delay`, `coords`), oyun kimliği, oyun, oyunun uzunluğu.

        **Oturum gerekli:** kotalar hesap başına sayılır. **Sınırlar:** her istekte `gif`; `gif_user_min`, `gif_user_hour`, `gif_ip_min` ve `gif_ip_hour` yalnızca GIF'in oluşturulması gerektiğinde (bkz. bölüm açıklaması). **Süre sınırı:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 sn (varsayılan olarak 45 sn).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 'Resim boyutu: `small` (32 px kareler), `medium` (48 px) veya `large` (72 px).'
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Tahtanın altında yer alan taraf.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Hamle başına milisaniye (onluk tabanda 1 ila 6 hane).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Dikey harflerinin ve yatay numaralarının tahtanın çevresine çizilip (`1`) çizilmeyeceği (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option`, `field` ile birlikte (`size`, `orientation`, `delay` veya `coords`): izin verilenlerin dışında bir değer. `invalid_game_id`. `invalid_request`: geçerli URL kodlaması değil.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: böyle bir oyun yok. `gif_disabled`: sunucu GIF''leri kapattı (`GIF_ENABLED=false`; `gif` jetonu iade edilir).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `gif` sınırı, bir oluşturma sınırı veya hesap kotası.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF oluşturulamadı (sunucu nedenini günlüğe kaydeder). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`, `retryAfter` (3 ila 10 sn) ve `Retry-After` ile: oluşturma kuyruğu dolu ya da GIF boş bir iş parçacığı için `GIF_QUEUE_TIMEOUT_MS` (10 sn) bekledi; isteğin aldığı tüm sınır jetonları iade edilir. `busy`: veritabanı kilitli kaldı (`retryAfter: 1` yalnızca gövdede). `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: PGN olarak gönderilen herhangi bir oyunun animasyonlu GIF'ini oluştur
      description: |-
        PGN metni olarak gönderilen herhangi bir oyun için `GET /games/{id}/gif` ile aynı resim: Scacelith oyununun kaydettiği bir oyun, başka bir sitenin dışa aktarması, elle yazılmış bir oyun. Metnin yalnızca ilk oyunu kullanılır.

        - PGN okuyucusu, oyunun kendi okuyucusunun kabul ettiği her şeyi kabul eder: bu sunucunun yazdığı her PGN ve diğer sitelerin olağan dışa aktarmaları (yorumlar, varyantlar, NAG'ler ve saat açıklamaları atlanır; hamle numaraları ve SAN esnek biçimde okunur; `SetUp` `"0"` olmadıkça bir `FEN` etiketi başlangıç pozisyonunu verir).
        - Adlar ve puanlar `White`, `Black`, `WhiteElo` ve `BlackElo` etiketlerinden gelir. Aksanlı harfler aksanlarını kaybeder, yazdırılabilir ASCII dışındaki diğer karakterler `?` olur ve uzun adlar kısaltılır (48 karakter). Sonuç `Result` etiketinden, o yoksa hamle metninin sonundan gelir. `Termination` etiketi `normal` değilse gösterilir: aksi hâlde ne olduğunu son pozisyon kendisi anlatır (mat, pat).
        - Bu uç nokta gövdesini kendisi denetler: bilinmeyen bir alan ya da eksik veya dize olmayan bir `pgn`, `field` alanını içeren 400 `invalid_request` ile yanıtlanır; yanlış bir seçenek 400 `invalid_option` ile yanıtlanır (`delayMs` bir JSON sayısı, `coords` bir boolean olmalıdır; `null` reddedilir).

        **Oturum gerekli:** kotalar hesap başına sayılır. **Sınırlar:** `GET /games/{id}/gif` ile aynı. **Gövde sınırı:** `HTTP_BODY_LIMIT` ne olursa olsun 135.168 bayt (JSON dizesi olarak PGN, kaçış karakterleri dahil). **Süre sınırı:** varsayılan olarak 45 sn.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Elle yazılmış kısa bir oyun, koordinatlar olmadan
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: Tüm seçenekleri içeren bir PGN dosyası
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`, `field` ile (bilinmeyen bir alan ya da eksik veya dize olmayan `pgn`; gövde bir nesne değilse `field` olmadan); `invalid_json`; `invalid_option`, `field` ile (`size`, `orientation`, `delayMs` veya `coords`); `invalid_pgn`, `line` ve `column` (1''den başlayarak, sütunlar karakter cinsinden) ve okuyucunun `message` alanıyla: kural dışı ya da belirsiz bir hamle, bozuk bir etiket, bilinmeyen bir satranç türü, 65.536 bayttan fazlası.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: sunucu GIF''leri kapattı (`GIF_ENABLED=false`; `gif` jetonu iade edilir).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: 135.168 baytı aşan bir gövde.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `gif` sınırı, bir oluşturma sınırı veya hesap kotası.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF oluşturulamadı (sunucu nedenini günlüğe kaydeder). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`, `retryAfter` (3 ila 10 sn) ve `Retry-After` ile: oluşturma kuyruğu dolu ya da GIF boş bir iş parçacığı için çok uzun bekledi; isteğin aldığı tüm sınır jetonları iade edilir. `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /players/{username}:
    get:
      operationId: getPlayer
      tags:
        - players
      summary: Bir oyuncunun herkese açık profilini getir
      description: |-
        Bir oyuncunun herkese açık profili: resmî kategorilerdeki puanlar (sunucunun sırasıyla) ve oyun sayıları. `games.total` puansız ve iptal edilenler dahil kayıtlı tüm oyunları sayar; `games.rated`, `wins`, `draws` ve `losses` puan kayıtları üzerinden toplanır, yani yalnızca puanlı oyunları kapsar. Yanıt, token olsa da olmasa da aynıdır.

        **Sınır:** `public_read` (token varsa oyuncu başına, yoksa istemci başına).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Profil.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
              example:
                username: alice
                createdAt: 1790882839743
                ratings:
                  - category: '3+2'
                    rating: 1510
                    provisional: true
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                games:
                  total: 3
                  rated: 2
                  wins: 1
                  draws: 1
                  losses: 0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`: `[A-Za-z0-9_.-]` kümesinden 2 ila 24 karakter değil.'
        '401':
          $ref: '#/components/responses/Unauthorized'
