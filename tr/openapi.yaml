        description: Resmî sunucu, kökte.
      - url: https://caissa.scacelith.com/api/v1
        description: Resmî sunucu, `/api/v1` altında.
      - url: https://{host}:{port}
        description: Herhangi bir Scacelith sunucusu, kökte.
        variables:
          host:
            default: caissa.scacelith.com
            description: Sunucunun herkese açık ana bilgisayar adı (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Herkese açık API portu (`PUBLIC_API_PORT`, yoksa `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Herhangi bir Scacelith sunucusu, `/api/v1` altında.
        variables:
          host:
            default: caissa.scacelith.com
            description: Sunucunun herkese açık ana bilgisayar adı (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Herkese açık API portu (`PUBLIC_API_PORT`, yoksa `API_PORT`).
    get:
      operationId: getLiveness
      tags:
        - health
      summary: Sürecin çalıştığını denetle
      description: |-
        Süreç çalıştığı sürece 200 `ok` yanıtını verir. `HEAD` de çalışır. Diğer tüm metotlar (`OPTIONS` dahil) `Allow: GET, HEAD` başlığıyla 405 `method_not_allowed` ile yanıtlanır.

        **Sınırlar:** yalnızca adres başına katman.
      security: []
      responses:
        '200':
          description: Süreç çalışıyor.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
              example:
                status: ok
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: adres başına katman.'
  /readyz:
    servers:
      - url: https://caissa.scacelith.com
        description: Resmî sunucu, kökte.
      - url: https://caissa.scacelith.com/api/v1
        description: Resmî sunucu, `/api/v1` altında.
      - url: https://{host}:{port}
        description: Herhangi bir Scacelith sunucusu, kökte.
        variables:
          host:
            default: caissa.scacelith.com
            description: Sunucunun herkese açık ana bilgisayar adı (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Herkese açık API portu (`PUBLIC_API_PORT`, yoksa `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Herhangi bir Scacelith sunucusu, `/api/v1` altında.
        variables:
          host:
            default: caissa.scacelith.com
            description: Sunucunun herkese açık ana bilgisayar adı (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Herkese açık API portu (`PUBLIC_API_PORT`, yoksa `API_PORT`).
    get:
      operationId: getReadiness
      tags:
        - health
      summary: Sunucunun oyuncu kabul ettiğini denetle
      description: |-
        Sunucu oyuncu kabul ettiğinde 200 `ready`, başlarken ya da dururken 503 `not_ready` yanıtını verir. `HEAD` de çalışır. Diğer tüm metotlar (`OPTIONS` dahil) `Allow: GET, HEAD` başlığıyla 405 `method_not_allowed` ile yanıtlanır.

        **Sınırlar:** yalnızca adres başına katman.
      security: []
      responses:
        '200':
          description: Sunucu oyuncu kabul ediyor.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: adres başına katman.'
        '503':
          description: Sunucu başlıyor ya da duruyor.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Bir giriş yanıtından alınan oturum token'ı (`sct_` ve ardından 43 base64url karakteri), `Authorization` başlığında: `Authorization: Bearer <token>`. Önek tam olarak `Bearer` (büyük/küçük harfe duyarlı) ve bir boşluktur; bu öneki taşımayan bir değer ya da 1 ila 512 yazdırılabilir ASCII karakterinden oluşmayan bir token, diğer tüm geçersiz token'lar gibi 401 `invalid_token` ile yanıtlanır. Boş bir başlık, başlık yokmuş gibi sayılır.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: "Oyun kimliği: baştaki sıfırlar olmadan, en fazla 16 haneli, 2^53'ün altında, onluk tabanda pozitif bir tam sayı."
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: Oturum kimliği, `GET /auth/sessions` tarafından verildiği gibi, baştaki sıfırlar olmadan yazılır (`03`, 3 numaralı oturum değildir).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Oyuncunun kullanıcı adı, büyük/küçük harf ayrımı gözetilmeden. Sunucu, `[A-Za-z0-9_.-]` kümesinden 2 ila 24 karakterlik her adı kabul eder (şimdiye kadar izin verdiği en geniş kural).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Bir oyun kimliği; yalnızca daha eski oyunlar listelenir. Önceki sayfanın `next` değerini gönderin. Boş bir değer, parametre hiç verilmemiş gibi sayılır.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: 'Sayfa boyutu: 1 ila 50. En fazla 3 haneli daha büyük bir sayı 50 sayılır; boş bir değer, parametre hiç verilmemiş gibi sayılır.'
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: E-posta bağlantısının token'ı (43 base64url karakteri). Eksik ya da yanlış bir token, "link invalid or expired" (bağlantı geçersiz ya da süresi dolmuş) sayfasını gösterir.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Sunucunun her yanıtı önbelleğe almayı yasaklar.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Yeniden denemeden önce beklenecek saniye; gövdedeki `retryAfter` ile aynı değer.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Bearer sınaması; geçersiz bir token için `error="invalid_token"` ile.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Sunucu bu yanıttan sonra bağlantıyı kapatır.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (hata gövdedeki bir alandaysa `field` ile) veya `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Bir alan şemaya uymuyor
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Gövde JSON değil
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Zayıf bir parola
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: Okunamayan bir PGN
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (`Authorization` başlığı yok) veya `invalid_token` (token hatalı biçimli, süresi dolmuş, geçersiz kılınmış ya da silinmiş bir hesaba ait).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Oturum yok
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Geçersiz bir token
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: İstek reddedildi.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Yeniden kimlik doğrulamada yanlış parola
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Askıya alınmış bir hesap
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found` ya da bu sunucunun kapattığı bir özellik.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: gövde 10 sn içinde ulaşmadı. Sunucu bağlantıyı kapatır.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: İstek, sunucunun durumuyla çakışıyor.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: Google ile giriş denemesi ya da bileti bilinmiyor, kullanılmış ya da süresi dolmuş; girişi yeniden başlatın.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: gövde `HTTP_BODY_LIMIT` değerini aşıyor (varsayılan olarak 16.384 bayt). Sunucu bağlantıyı kapatır.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: istek hedefi 4096 karakteri aşıyor.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: gövde `application/json` değil ya da karakter kümesi UTF-8 değil.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: oyunda `GIF_MAX_PLIES` (600) yarım hamleden fazlası var.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: `pow` sınamasını çözün ve aynı isteği `pow: { challenge, nonce }` ile yeniden gönderin. `reason` nedenini söyler: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` veya `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (bir hız sınırı, hesap kotası ya da parola hash kuyruğu) veya `too_many_attempts` (hesaba uygulanan bir yavaşlatma); `retryAfter` ve bir `Retry-After` başlığıyla.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Bir hız sınırı
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Bu hesapta çok fazla başarısız deneme
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: beklenmeyen bir hata. Sunucu bunu günlüğe kaydeder.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: yanlış bir `state` ya da `iss` veya Google kodu reddetti ya da doğrulanamayan bir ID token''ı gönderdi (diğer istemcinin, yani oyunun ya da web sitesinin bir kodu veya ID token''ı dahil). Google''ın metnini hiçbir zaman içermez.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` veya `timeout`: `retryAfter` verilmişse o süre geçtikten sonra yeniden deneyin.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Sunucu meşgul
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Veritabanı kilitli kaldı (bir okuma)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Sunucunun yanıtı çok uzun sürdü
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Animasyonlu GIF, ek olarak.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: 'Bu sunucudaki bir oyun için `attachment; filename="scacelith-<id>.gif"`, `POST /gif` ile gönderilen bir PGN için `attachment; filename="scacelith-game.gif"`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Dosyanın bayt cinsinden boyutu.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: Bir HTML sayfası.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: Reddin nedenini açıklayan bir HTML sayfası.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Form 10 sn içinde ulaşmadı (bir HTML sayfası). Sunucu bağlantıyı kapatır.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: Çakışmayı açıklayan bir HTML sayfası.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Form `HTTP_BODY_LIMIT` değerini aşıyor (bir HTML sayfası). Sunucu bağlantıyı kapatır.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Gövde ne bir form (`application/x-www-form-urlencoded`) ne de JSON; ya da karakter kümesi UTF-8 değil (bir HTML sayfası).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Bir hız sınırı (bir HTML sayfası), `Retry-After` ile.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Beklenmeyen bir hata ("Server error" (sunucu hatası) başlıklı bir HTML sayfası). Sunucu bunu günlüğe kaydeder.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Sunucu meşgul (veritabanı kilitli kaldı ya da sunucu çok geride kaldı; `Retry-After` ile) ya da yanıtı çok uzun sürdü ("Server error" (sunucu hatası) başlıklı bir HTML sayfası).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: JSON API'nin tüm hata yanıtlarının tek biçimi.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: '`snake_case` biçimindeki hata kodu. İstemci ne göstereceğini buna göre seçer.'
          examples:
            - rate_limited
        message:
          type: string
          description: Günlükler için ve yedek olarak tasarlanmış İngilizce bir cümle.
        retryAfter:
          type: integer
          minimum: 1
          description: Yeniden denemeden önce beklenecek saniye; yalnızca zamanla sona eren retlerde bulunur. Bu durumda yanıt, aynı değere sahip bir `Retry-After` başlığı da taşır; geçmiş, oyun, oyuncu ve sıralama tablosu okumalarının 503 `busy` yanıtı bunun dışındadır.
        field:
          type: string
          description: Hatalı alan ya da sorgu parametresi (`invalid_request`, `invalid_option` ve `GET /account/games` uç noktasının `invalid_cursor`, `invalid_limit` ve `invalid_filter` hataları). İç içe bir alan noktalı yazılır (`pow.nonce`).
        reason:
          type: string
          description: 'Neden: bir `weak_password` hatasının ihlal ettiği kural ya da bir iş kanıtının neden istendiği veya reddedildiği (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Yalnızca `banned`: askıya almanın bitişi (epoch ms), kalıcı askıya almada `null`.'
        line:
          type: integer
          minimum: 1
          description: 'Yalnızca `invalid_pgn`: hatanın satırı, 1''den başlayarak.'
        column:
          type: integer
          minimum: 1
          description: 'Yalnızca `invalid_pgn`: hatanın sütunu, 1''den başlayarak, karakter cinsinden.'
    PowChallenge:
      type: object
      description: Bir iş kanıtı sınaması (428 `pow_required` yanıtındaki `pow`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: İmzalı sınama; olduğu gibi geri gönderilmelidir.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: '`SHA-256(challenge + ":" + nonce)` değerinin başında bulunması gereken sıfır bit sayısı.'
        expiresAt:
          type: integer
          format: int64
          description: 'Sınamanın süresinin dolduğu an (epoch ms): verilmesinden 2 dakika sonra.'
    PowAnswer:
      type: object
      description: Bir iş kanıtı sınamasının yanıtı.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: 428 yanıtındaki `challenge`, verildiği gibi.
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: '`SHA-256(challenge + ":" + nonce)` değeri `bits` adet sıfır bitle başlayacak şekilde, en fazla 20 haneli, onluk tabanda bir sayı dizesi.'
    ServerInfo:
      type: object
      description: Bir istemcinin giriş yapmadan ya da bağlanmadan önce ihtiyaç duyduğu bilgiler.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Sunucunun adı (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: Veritabanının ilk başlatılışında aldığı bir UUID. Yeniden başlatmalarda aynı kalır. Veritabanı onu veremediğinde `null` olur.
        motd:
          type: string
          description: Günün mesajı (`SERVER_MOTD`); boş olabilir.
        protocol:
          type: object
          description: WebSocket protokolü (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Sunucunun desteklediği en eski protokol sürümü.
            max:
              type: integer
              minimum: 1
              description: Sunucunun desteklediği en yeni protokol sürümü.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'Protokol şemasının parmak izi (kanonik biçiminin SHA-256 değerinin ilk 4 baytı, işaretsiz bir tam sayı olarak: protokol alt sürümü 2 için `0xc649140f`, 3326678031); bilgi amaçlıdır, hiçbir zaman karşılaştırılmaz.'
            subprotocol:
              type: string
              description: WebSocket alt protokol tanımlayıcısı (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: Oyuncuların kullandığı WebSocket portu (`PUBLIC_WS_PORT`, yoksa `WS_PORT`, o da yoksa `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: WebSocket'in yolu.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Yeni hesap oluşturulup oluşturulamayacağı.
        emailVerification:
          type: boolean
          description: Yeni hesapların adreslerini onaylayıp onaylamayacağı (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Oyuna Google ile giriş sunulup sunulmadığı.
            googleWeb:
              type: boolean
              description: Google ile girişin bir web sitesine de sunulup sunulmadığı (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: İki faktörlü kimlik doğrulama her zaman kullanılabilir.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Kaydın gerektirdiği iş kanıtı bit sayısı (gerekmiyorsa 0).
        categories:
          type: array
          description: Resmî (puanlı) süre kontrolleri (`RATED_CATEGORIES`), sunucunun sırasıyla. Diğer tüm süre kontrolleri `custom` olur.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Bir istemcinin form göndermeden önce denetleyebileceği kurallar.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: En kısa kullanıcı adı uzunluğu (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: En uzun kullanıcı adı uzunluğu (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Yeni bir kullanıcı adının uyması gereken düzenli ifade.
            passwordMinLength:
              type: integer
              description: En kısa parola uzunluğu, karakter cinsinden (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: En uzun parola uzunluğu, UTF-8 bayt cinsinden.
            customTimeControls:
              type: boolean
              description: Meydan okumaların ve özel oyunların özel süre kontrolleri kullanıp kullanamayacağı.
            reportsPerDay:
              type: integer
              description: Bir oyuncunun 24 saatte en fazla kaç bildirim yapabileceği (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Bir istemcinin gönderebileceği en büyük WebSocket mesajının bayt cinsinden boyutu.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Resmî bir süre kontrolü.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 'Kategori kimliği: dakika ve saniye cinsinden hamle başına ek süre (`3+2`).'
        baseSec:
          type: number
          minimum: 0
          description: Temel süre, saniye cinsinden.
        incSec:
          type: number
          minimum: 0
          description: Hamle başına ek süre, saniye cinsinden.
    AccountView:
      type: object
      description: Hesap, oyuncusunun gördüğü hâliyle (giriş yanıtlarındaki ve `GET /account/me` yanıtındaki `user`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: Hesap kimliği.
        username:
          type: string
          description: Kullanıcı adı.
        email:
          type: string
          format: email
          description: E-posta adresi.
        emailVerified:
          type: boolean
          description: Adresin onaylanıp onaylanmadığı.
        mfaEnabled:
          type: boolean
          description: İki faktörlü kimlik doğrulamanın açık olup olmadığı.
        googleLinked:
          type: boolean
          description: Bir Google hesabının bağlı olup olmadığı.
        hasPassword:
          type: boolean
          description: 'Google üzerinden oluşturulmuş ve henüz parola belirlememiş bir hesap için `false`.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Ada göre doğrudan meydan okumaların kabul edilip edilmediği (bkz. `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Hesabın oluşturulduğu an (epoch ms).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Son giriş (epoch ms) ya da `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Bağlantısının kullanılmasını bekleyen bir e-posta değişikliğinin yeni adresi ya da `null`.
    SessionAnswer:
      type: object
      description: Yeni bir oturum.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Oturum token'ı; `Authorization` başlığı ve WebSocket için.
        expiresAt:
          type: integer
          format: int64
          description: Oturumun mutlak bitişi (epoch ms); boşta kalma sınırı oturumu daha erken sonlandırabilir.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: İki faktörlü kimlik doğrulamalı bir girişin ikinci adımı; `POST /auth/login/mfa` ile devam edin.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Adımın token'ı; `POST /auth/login/mfa` için.
        expiresIn:
          type: integer
          const: 300
          description: Adımı tamamlamak için kalan saniye.
    LoginAnswer:
      description: Bir oturum ya da iki faktörlü kimlik doğrulamalı bir girişin ikinci adımı.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: İlk kez Google ile giriş; `POST /auth/sso/complete` ile devam edin.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: '`POST /auth/sso/complete` için bilet; 10 dakika geçerlidir.'
        suggestedUsername:
          type: string
          description: Google adından ya da adresten türetilmiş bir kullanıcı adı veya hiçbiri uymazsa `""`.
    SsoNeedsPassword:
      type: object
      description: Adresi parolası olan bir hesap kullanıyor; `POST /auth/sso/google/link` ile devam edin. Henüz hiçbir şey bağlanmadı.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: '`POST /auth/sso/google/link` için bilet.'
        username:
          type: string
          description: O hesabın kullanıcı adı (yalnızca adresin kendisine ait olduğunu Google'a kanıtlamış biri görür).
        expiresIn:
          type: integer
          const: 600
          description: Biletin geçerli kaldığı saniye.
    SsoFinishAnswer:
      description: '`POST /auth/sso/google/finish` yanıtı.'
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Bir Google ile giriş denemesi.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Deneme; `POST /auth/sso/google/finish` için.
        authUrl:
          type: string
          format: uri
          description: Denetlendikten sonra sistem tarayıcısında açılacak Google URL'si.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Google'ın geri göndermesi gereken `state`.
        expiresIn:
          type: integer
          const: 600
          description: Denemenin geçerli kaldığı saniye.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Kullanıcı adı; ardından sunucunun kuralları uygulanır (bkz. açıklama).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: E-posta adresi. Baştaki ve sondaki boşluklar kırpılır ve küçük harfle kaydedilir.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Parola; ardından parola kuralları uygulanır.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Kullanıcı adı ya da e-posta adresi (`@` içeren her metin).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: İsteğe bağlı. Giriş yapılmış cihazlar listesinde gösterilir (örneğin `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: Giriş yanıtındaki (ya da bir Google ile giriş yanıtındaki) `mfaToken`.
        code:
          type: string
          maxLength: 32
          description: İsteğe bağlı. 6 haneli bir kimlik doğrulama uygulaması kodu ya da bir kurtarma kodu.
        recoveryCode:
          type: string
          maxLength: 32
          description: İsteğe bağlı. Bir kurtarma kodu. `code` ve `recoveryCode` alanlarından biri gereklidir.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: E-posta adresi.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Sıfırlama bağlantısının `token` parametresi.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Yeni parola; kayıttaki parola kuralları geçerlidir.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: İstemcinin `codeVerifier` değerinin S256 PKCE sınaması (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: İstemcinin `127.0.0.1` üzerindeki dinleyicisinin portu.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Sayfanın `codeVerifier` değerinin S256 PKCE sınaması (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`POST /auth/sso/google/start` yanıtındaki `attemptId`.'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: PKCE doğrulayıcısı; SHA-256 değeri `start` adımına verilen sınamayla eşleşmelidir.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Google'ın geri gönderdiği hâliyle `state`.
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: Google'ın geri gönderdiği hâliyle `code` (boşluksuz yazdırılabilir ASCII).
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: İsteğe bağlı. Google gönderdiyse, geri gönderdiği hâliyle `iss`.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`finish` yanıtındaki `linkTicket`; 10 dakika geçerlidir.'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Hesabın parolası.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`finish` yanıtındaki `ssoTicket`; 10 dakika geçerlidir.'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Kullanıcı adı; kayıt kuralları geçerlidir.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Etkin oturumlar, en son kullanılan önce.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Etkin bir oturum (giriş yapılmış bir cihaz).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: Oturum kimliği; `DELETE /auth/sessions/{id}` için.
        createdAt:
          type: integer
          format: int64
          description: Giriş anı (epoch ms).
        lastSeenAt:
          type: integer
          format: int64
          description: Son kullanım (epoch ms); en fazla 5 dakikada bir güncellenir (sunucu çok geride kaldığı sürece daha geç).
        expiresAt:
          type: integer
          format: int64
          description: Mutlak bitiş (epoch ms); boşta kalma sınırı oturumu daha erken sonlandırabilir.
        clientLabel:
          type:
            - string
            - 'null'
          description: Girişteki `clientLabel` ya da hiç gönderilmediyse `null`.
        current:
          type: boolean
          description: Bunun, isteği yapan oturum olup olmadığı.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Oyuncunun puanlı oyun oynadığı her kategori için bir kayıt.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Etkin yaptırımlar.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: 'Askıya alınmışken `{ until }`, aksi hâlde `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Bir kategorinin puan kaydı.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: Kategori kimliği.
        rating:
          type: integer
          description: Puan.
        games:
          type: integer
          minimum: 0
          description: Kategoride oynanan oyunlar (sayılsın ya da sayılmasın).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Ulaşılan en yüksek puan.
        provisional:
          type: boolean
          description: 'Puan henüz belirlenmemişken ya da sayılan oyun sayısı `PROVISIONAL_GAMES` değerinden azken `true` (oyun bunu `1510?` olarak gösterir).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Yaptırımın türü.
        reason:
          type:
            - string
            - 'null'
          description: Varsa belirtilen neden.
        startsAt:
          type: integer
          format: int64
          description: Başlangıç (epoch ms).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Bitiş (epoch ms); yaptırım kalıcıysa `null`.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Askıya almanın bitişi (epoch ms); kalıcıysa `null`.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: 'Ada göre doğrudan meydan okumaları kabul etmek için `all`, reddetmek için `none`.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Mevcut parola.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Yeni parola; kayıttaki parola kuralları geçerlidir.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Hesabın parolası.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Bekleyen gizli anahtarın bir kodu, tam 6 hane.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Hesabın parolası.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: İsteğe bağlı; iki faktörlü kimlik doğrulama açıksa gereklidir (ya da `recoveryCode`). Bir kimlik doğrulama uygulaması kodu ya da bir kurtarma kodu.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: İsteğe bağlı. Bir kurtarma kodu (`xxxx-xxxx-xx`; büyük/küçük harf, boşluklar ve tireler önemli değildir).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Hesabın parolası.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Bir kimlik doğrulama uygulaması kodu (kurtarma kodu reddedilir).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Yeni adres; baştaki ve sondaki boşluklar kırpılır ve küçük harfe çevrilir, ardından bir kayıt adresi gibi denetlenir.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Hesabın parolası.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: İsteğe bağlı; iki faktörlü kimlik doğrulama açıksa gereklidir (ya da `recoveryCode`). Bir kimlik doğrulama uygulaması kodu ya da bir kurtarma kodu.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: İsteğe bağlı. Bir kurtarma kodu.
    TotpSetup:
      type: object
      description: Kimlik doğrulama uygulaması için bekleyen gizli anahtar.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Uygulamaya yazılacak, base32 biçiminde gizli anahtar.
        uri:
          type: string
          format: uri
          description: QR kodu olarak gösterilecek `otpauth://totp/...` URI'si.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Adım başına saniye.
    RecoveryCodeList:
      type: array
      description: Yalnızca bu kez gösterilen 10 kurtarma kodu. Her biri bir kez çalışır.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Bir oyunun bir tarafı.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Oyun kaydındaki ad (silinmiş bir hesap için `deleted#<id>`).
        rating:
          type:
            - integer
            - 'null'
          description: Başlangıçtaki puan; bilinmiyorsa `null`.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Oyundan sonraki puan. Puanlı bir oyunda her zaman bulunur; yalnızca puanlara sayılmayan bir oyun (puansız, özel süre kontrollü, iptal edilen) için `null`.
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Puan değişimi; puan kuralları puanı olduğu yerde bıraktığında `0` (FIDE'nin sıfır skor kuralı, puanı henüz belirlenmemiş bir rakip, puanı henüz belirlenmemiş bir oyuncunun ilk oyunları); `ratingAfter` ile aynı durumlarda `null`.
    GameSummary:
      type: object
      description: Kaydedilmiş bir oyunun özeti.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Oyun kimliği.
        category:
          type: string
          description: Resmî kategori kimliği (`3+2`) ya da `custom`.
        rated:
          type: boolean
          description: Oyunun puanlara sayılıp sayılmadığı.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Saniye cinsinden süre kontrolü (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (bkz. oyun kodları).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Bitiş nedeni kodu (bkz. oyun kodları).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Sonuç; iptal edilen bir oyun için `*`.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Yarım hamle sayısı.
        startedAt:
          type: integer
          format: int64
          description: Başlangıç (epoch ms).
        endedAt:
          type: integer
          format: int64
          description: Bitiş (epoch ms).
    Termination:
      type: string
      description: Bitiş nedeninin adı (bkz. oyun kodları); protokolün bilmediği bir kod için `Unknown`.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Bir oyuncunun açısından oyun özeti.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Oyuncunun tarafı.
    HistoryGameSummary:
      description: Giriş yapmış oyuncunun geçmişindeki bir oyun.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Milisaniye cinsinden temel süre.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Milisaniye cinsinden hamle başına ek süre.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: Oyuncunun açısından sonuç.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Sayfanın oyunları, en yeni önce.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Sonraki sayfa için `before` olarak gönderilecek kimlik ya da son sayfada `null`.
        total:
          type: integer
          minimum: 0
          description: Tüm sayfalar genelinde filtreye uyan oyun sayısı.
    MoveRecord:
      type: object
      description: Bir oyunun bir yarım hamlesi.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: UCI notasyonunda hamle; terfi için sonuna `n`, `b`, `r` veya `q` eklenir.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Hamle için düşülen süre (ms); kayıtta yoksa `null`.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Hamleyi yapan oyuncunun hamleden sonraki saati (ms); kayıtta yoksa `null`.
    PgnTagsView:
      type: object
      description: Görüntüleme için başlıca PGN etiketleri. Burada `Termination` bitiş nedeninin adıdır; PGN dosyası PGN standardının değerlerini kullanır.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` veya `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: UTC başlangıç tarihi.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Başlangıçtaki puan ya da `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Başlangıçtaki puan ya da `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Hamleleri ve saatleriyle bir oyun kaydı. Bir oyun özetinin alanlarını içerir; `color` ve `outcome` hariç.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Milisaniye cinsinden temel süre.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Milisaniye cinsinden hamle başına ek süre.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: '`status` değerinin adı.'
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: Bu oyunun rövanşı olduğu oyunun kimliği ya da `null`.
            moves:
              type: array
              description: Her yarım hamle için bir öğe.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: "Yalnızca token'ın sahibi olan oyuncu bu oyunu oynamışsa: onun tarafı."
            reportable:
              type: boolean
              description: "Yalnızca token'ın sahibi olan oyuncu bu oyunu oynamışsa: `POST /reports` bu oyun için rakibe ilişkin bir bildirimi şu anda kabul edecekse `true` (oyun son 7 gün içinde bitmiş, günlük kota tükenmemiş ve rakip bu oyun için henüz bildirilmemiş)."
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Oyuncunun yazdığı hâliyle kullanıcı adı.
        createdAt:
          type: integer
          format: int64
          description: Hesabın oluşturulduğu an (epoch ms).
        ratings:
          type: array
          description: Yalnızca resmî kategoriler, sunucunun sırasıyla.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Puansız ve iptal edilenler dahil, kaydedilmiş tüm oyunlar.
            rated:
              type: integer
              minimum: 0
              description: Puan kayıtları üzerinden toplanan puanlı oyunlar.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Oyuncunun yazdığı hâliyle kullanıcı adı.
        games:
          type: array
          description: Sayfanın oyunları, en yeni önce.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Sayfa her dolduğunda son oyunun kimliği (bu durumda sonraki sayfa boş olabilir), aksi hâlde `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: Kategori kimliği.
        minGames:
          type: integer
          minimum: 0
          description: Bir kaydın listelenmesi için gereken sayılan oyun sayısı (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Tablonun hesaplandığı an (epoch ms).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: PGN metni; en fazla 65.536 bayt UTF-8. Yalnızca ilk oyun kullanılır.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: İsteğe bağlı. Resim boyutu.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: İsteğe bağlı. Tahtanın altında yer alan taraf.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: İsteğe bağlı. Hamle başına milisaniye; tam sayı değerli bir JSON sayısı.
        coords:
          type: boolean
          default: true
          description: İsteğe bağlı. Dikey harflerinin ve yatay numaralarının tahtanın çevresine çizilip çizilmeyeceği.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Oyun; bir tam sayı ya da 1 ila 16 haneli bir dize olarak.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Rakibin kullanıcı adı; oyun kaydındaki ya da şu anki hâliyle, büyük/küçük harf ayrımı gözetilmeden. Boş olamaz.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Bildirimin konusu.
        comment:
          type:
            - string
            - 'null'
          description: İsteğe bağlı. Denetim karakterleri (sekme ve satır besleme dışında) kaldırılıp metnin başındaki ve sonundaki boşluklar kırpıldıktan sonra en fazla 500 karakter.
    AccountExport:
      type: object
      description: Sunucunun hesap hakkında sakladığı her şey (zamanlar epoch ms cinsinden).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Dışa aktarmanın yapıldığı an.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Dosyanın neleri içerdiği ve neleri dışarıda bıraktığı; oyuncu için sade bir İngilizceyle.
          items:
            type: string
        account:
          description: '`GET /account/me` uç noktasının hesap görünümü, `googleEmail` ile birlikte.'
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Bağlı Google hesabının adresi ya da `null`.
        ratings:
          type: array
          description: Tam puan kayıtları.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Bir rakibin hile yaptığı belirlendikten sonra iade edilen puanlar; UTC günü ve kategori başına toplanmış, en yeni önce. Ne oyunlar ne de hileciler belirtilir.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Kaydedilmiş tüm oturumlar, en yeni önce, hiçbir token olmadan. Saklama temizliği, süresi dolmuş bir oturumu siler; kapatılmış bir oturumu ise çıkıştan bir gün sonra siler.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Güvenlik olayları, en yeni önce; `RETENTION_SECURITY_DAYS` gün saklanır.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Kaldırılanlar dahil tüm yaptırımlar. Moderatörün adı hiçbir zaman dahil edilmez.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Oyuncunun ayrıldığı, iptal edilen ve zamanında ilk hamlesini yapmadığı oyunlar için kaydedilen davranış olayları; 30 gün saklanır.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Oyuncunun yaptığı bildirimler.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Oyun sayısı.
            list:
              type: array
              description: Tüm oyunlar, en yeni önce, `GET /account/games` özetleri olarak. Hamleler `GET /games/{id}`, PGN ise `GET /games/{id}/pgn` adresindedir.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Tam bir puan kaydı.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Oyuncunun, puanının henüz belirlenmediği aşamayı geride bırakıp bırakmadığı.
            countedGames:
              type: integer
              minimum: 0
              description: Puana katılan oyunlar.
            updatedAt:
              type: integer
              format: int64
              description: Kaydın son değiştiği an.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: Günün 00:00 UTC anı (epoch ms).
        category:
          type: string
        points:
          type: integer
          description: O gün o kategoride iade edilen puanlar.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Oturumun kapatıldığı an ya da `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Girişin yapıldığı adres; `RETENTION_IP_DAYS` gün sonra silinir.
    SecurityEvent:
      type: object
      description: |-
        Bir güvenlik olayı. `ip` yalnızca giriş yapılmışken, hesabın parolasıyla (ve ikinci faktörle) ya da adresine e-postayla gönderilen bir bağlantıyla yapılan işlemler için verilir: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` ve `account_exported`; diğer tüm türlerde `ip: null` olur ve `ip`, `RETENTION_IP_DAYS` gün sonra silinir.

        `detail` yalnızca şu alanları tutar: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` ve `method` (`password` ya da `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` ve `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Bir `moderator_action` olayı yalnızca `{ action }` tutar; bu da yalnızca `ban`, `unban`, `reset_mfa`, `verify_email` ve `revoke_sessions` eylemleri içindir (diğer moderatör eylemleri dışarıda bırakılır). Diğer tüm türlerde `detail: null` olur. `rating_refund` olayları dışarıda bırakılır: puanları `ratingRefunds` içindedir.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Olayın türü (`login`, `password_changed`...).
        at:
          type: integer
          format: int64
          description: Olayın gerçekleştiği an.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
