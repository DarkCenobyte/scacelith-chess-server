          description: '`server_busy` (veritabanı kilitli kaldı), `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Parolayı değiştir
      description: |-
        Parolayı değiştirir. Mevcut parola gerekir, ancak iki faktörlü kimlik doğrulama açık olsa bile ikinci faktör gerekmez. Yeni parola kayıt kurallarına uymalıdır (mevcut paroladan sonra denetlenir).

        Değişikliğin etkileri şunlardır ve tek bir işlemde gerçekleşir (hepsi ya da hiçbiri): diğer tüm oturumları geçersiz kılar (bu oturumda giriş açık kalır), bekleyen bir e-posta değişikliğini iptal eder, hesabın parola sıfırlama bağlantılarını çalışmaz hâle getirir ve hesap sahibine bir e-posta gönderir.

        **Yeniden kimlik doğrulama:** yalnızca parola. **Sınırlar:** `reauth`, ardından `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Parola değiştirildi.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (yalnızca Google ile giriş yapılan bir hesap), `weak_password` (`reason` ile), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: yanlış mevcut parola ya da istek denetlenirken gerçekleşen bir parola sıfırlaması ya da değişikliği.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (hesabın başarısız yeniden kimlik doğrulamaları) veya `rate_limited` (`reauth` ya da `reauth_user` sınırı, hesap kotası, parola hash kuyruğu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: parola hash kuyruğu ya da veritabanı kilitli kaldı (`retryAfter: 1`, hiçbir şey değişmedi). `timeout`. Ayrıca, sunucu çok geride kaldığında (bkz. giriş bölümü) `retryAfter` 2 ile 5 arasında olmak üzere `server_busy`: istek işlenmedi.'
  /account/mfa/totp/setup:
