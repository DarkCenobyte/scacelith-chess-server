  /reset-password:
    servers:
      - url: https://caissa.scacelith.com
        description: Den officiella servern (sidorna ligger i roten, utanför `/api/v1`).
      - url: https://{host}:{port}
        description: Valfri Scacelith-server (sidorna ligger i roten, utanför `/api/v1`).
        variables:
          host:
            default: caissa.scacelith.com
            description: Serverns offentliga värdnamn (`SERVER_PUBLIC_HOST`).
