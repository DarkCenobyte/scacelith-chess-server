  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: Byt e-postadress
      description: |-
        Byter kontots e-postadress. `newEmail` trimmas och görs om till gemener, och kontrolleras sedan som en adress vid registrering.

        **Med e-postbekräftelse** (standard): 202 `verification_sent`. En länk som gäller i 24 timmar skickas till den nya adressen; den öppnar `/confirm-email-change`, och adressen ändras först när spelaren trycker på knappen på den sidan. Fram till dess visar `GET /account/me` den nya adressen som `pendingEmail`. Ett nytt anrop ersätter det väntande bytet; ett byte eller en återställning av lösenordet avbryter det. Högst en länk skickas till en given ny adress var 5:e minut, oavsett vem som frågar (ett anrop för samma byte som redan väntar behåller den tidigare skickade länken, som förblir giltig); svaret är detsamma. Den nuvarande adressen får ett meddelande om att ett byte till en maskerad adress (`a***@example.org`) har begärts. Svaret och `pendingEmail` är desamma när ett annat konto redan använder den nya adressen: då skickas ingen länk, så det bytet blir aldrig av, och ägaren till den adressen får i stället ett meddelande (högst ett per timme).

        När länken bekräftas ändras adressen och räknas som bekräftad, enheterna förblir inloggade, de länkar som skickats tidigare (bekräftelse, återställning av lösenordet, andra byten) slutar fungera, och den tidigare adressen underrättas, med den nya maskerad.

        **Utan e-postbekräftelse** (`REQUIRE_EMAIL_VERIFICATION=false`): adressen ändras direkt (200 `email_changed`), och den tidigare adressen underrättas. Om ett annat konto använder adressen blir svaret 409 `email_taken`, och ägaren till den adressen får meddelandet.

        **Förnyad autentisering:** lösenordet och, med tvåfaktorsautentisering, en kod från autentiseringsappen eller en återställningskod. `invalid_email` och `same_email` kontrolleras före lösenordet, så de räknas inte som misslyckanden. **Gränser:** `reauth`, sedan `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Adressen ändrades direkt (ingen e-postbekräftelse på den här servern).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: Den nya adressen, så som den sparades.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: En bekräftelselänk skickades till den nya adressen (eller så tillhör adressen ett annat konto; svaret avslöjar inte vilket).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email` (kontots nuvarande adress), `password_not_set` (ett konto med enbart Google-inloggning), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` (även när ett byte eller en återställning av lösenordet hann före anropet: ingen länk skickas), `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: endast utan e-postbekräftelse.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (misslyckade förnyade autentiseringar, eller för många prövade koder på det här kontot), eller `rate_limited` (gränsen `reauth` eller `reauth_user`, kontobudgeten, kön för lösenordshashning).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: kön för lösenordshashning, eller databasen förblev låst (`retryAfter: 1`: inget ändrades, och samma anrop kan skickas igen). `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: Ladda ned kontots data
      description: |-
        Allt som servern lagrar om kontot, som en enda JSON-fil att spara (`format` `scacelith-account-export`, `version` 1). Exporten registrerar en säkerhetshändelse (`account_exported`). Dokumentets array `notes` talar om för spelaren på enkel engelska vad som utelämnas.

        **Aldrig med i exporten:** lösenordshashen, hemligheten för tvåfaktorsautentisering och återställningskoderna; sessions- och länktoken av alla slag, och hashar av dem; fuskskyddets data (integritetsnivå och poäng, avvikelser, analysen av partierna, en anmälans vikt); de anmälningar som andra spelare har gjort om spelaren; moderatorernas identitet; andra spelares privata data (motståndare visas med sitt offentliga namn och sin rating, ingenting avslöjar om en annan spelare har fått sanktioner, och ingen IP-adress som kan tillhöra en annan person tas med).

        **Förnyad autentisering:** lösenordet och, med tvåfaktorsautentisering, en kod från autentiseringsappen eller en återställningskod. **Gränser:** `account_export` (5 per timme och spelare, för hela servern; varje försök räknas, även misslyckade; kontrolleras först), sedan `reauth` och `reauth_user`. **Tidsgräns:** 60 sekunder.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Exportdokumentet, som bilaga.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
