      summary: Hämta en partipost med dess drag och klockor
      description: |-
        En partipost, med dess drag och klockor. Utan token, eller med token för en spelare som inte spelade partiet, är svaret det offentliga. När tokenens spelare spelade partiet lägger svaret till `you` och `reportable`.

        **Gräns:** `public_read` (per spelare med token, per klient utan).
      security:
