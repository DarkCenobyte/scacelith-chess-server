          description: '`server_busy` (databasen förblev låst), `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Hämta kontot, dess ratingtal och aktiva sanktioner
      description: |-
        Kontot som dess spelare ser det: kontovyn (även `user` i varje svar på en inloggning), en ratingpost per kategori där spelaren har spelat partier med rating, de aktiva sanktionerna och avstängningen. Fuskskyddets integritetsnivå visas aldrig.

