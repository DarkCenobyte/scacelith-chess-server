      summary: Logga ut alla sessioner
      description: |-
        Återkallar alla kontots sessioner, även den här. De WebSocket-anslutningar som öppnades med dem stängs. Ingen body (eller `{}`).

        **Gräns:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Alla sessioner är utloggade.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: en annan body än `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: gränsen `sessions` eller kontobudgeten.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databasen förblev låst), `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Skicka bekräftelselänken igen
      description: |-
        Skickar länken för e-postbekräftelse igen. Svaret är 202 `accepted` oavsett adress, så att det aldrig avslöjar om ett konto eller en registrering använder den.

        Ett anrop har effekt högst en gång var 5:e minut per adress. En väntande registrering med den adressen får sina 24 timmar på nytt, oavsett om ett annat konto använder adressen eller inte, så att dess användarnamn förblir reserverat lika länge i båda fallen. En länk skickas bara för den registreringen när adressen inte har något konto (en ny länk, giltig i 24 timmar, ersätter den föregående), eller för ett aktivt, obekräftat konto med den adressen.

        **Gränser:** `auth`, sedan `auth_mail` (10 per timme per klient).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Accepterat (oavsett adress).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: gränsen `auth` eller `auth_mail` (oavsett adress).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` med `retryAfter: 1`: databasen förblev låst medan kontot slogs upp eller länken för ett obekräftat konto sparades (förnyelsen av en väntande registrering görs i mån av möjlighet och får aldrig anropet att misslyckas); adressens 5 minuter börjar ändå löpa, så ett nytt anrop inom dem gör ingenting. `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Skicka en länk för att återställa lösenordet
      description: |-
        Skickar en återställningslänk för lösenordet, giltig i en timme, som öppnar sidan `/reset-password`. Svaret är 202 `accepted` oavsett adress. En länk skickas bara till ett aktivt konto, högst en gång var 5:e minut per adress. Ett konto med enbart Google-inloggning sätter sitt första lösenord på det här sättet.

        Återställning av glömda lösenord har API:ets strängaste gränser, alla räknade för hela servern: 3 anrop per timme (`AUTH_FORGOT_PER_HOUR`) och 10 per 24 timmar (`AUTH_FORGOT_PER_DAY`) per klient (en IPv4-adress eller ett IPv6-/64-nät), 3 gånger så många per IPv6-/48-nät, utöver gränsen `auth` (20 per 10 minuter) och utöver det enda e-postmeddelandet per adress var 5:e minut. Varken 202 eller 429 avslöjar om ett konto använder adressen. Att sätta det nya lösenordet har en egen gräns (`auth_reset`).

        **Gränser:** `auth`, `auth_forgot`, sedan `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Accepterat (oavsett adress).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: gränsen `auth`, `auth_forgot` eller `auth_forgot_day` (oavsett adress).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` med `retryAfter: 1`: databasen förblev låst medan kontot slogs upp eller länken sparades; adressens 5 minuter börjar ändå löpa, så ett nytt anrop inom dem skickar ingen länk. `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Sätt ett nytt lösenord med token från en återställningslänk
      description: |-
        Sätter ett nytt lösenord med token från en återställningslänk (sidan `/reset-password` gör samma sak). Det nya lösenordet följer reglerna för registrering.

        Återställningen har följande effekter, i en enda transaktion (alla eller ingen): den återkallar alla sessioner och avbryter ett väntande byte av e-postadress; kontots övriga återställningslänkar slutar fungera; adressen räknas som bekräftad (länken bevisade den); ägaren får ett e-postmeddelande. Tvåfaktorsautentiseringen påverkas inte. Efter ett fel från kön för lösenordshashning, en 503 eller en 500 har ingenting ändrats: det gamla lösenordet och sessionerna finns kvar, och länken förblir giltig.

        **Gränser:** `auth`, sedan `auth_reset` (10 per timme per klient, 30 per IPv6-/48-nät, delad med sidan: varje försök hashar ett lösenord).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Lösenordet är bytt och alla sessioner är utloggade.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: länken är ogiltig, använd eller har gått ut, eller skickades till en adress som kontot inte längre har. `weak_password` (med `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: gränsen `auth` eller `auth_reset`, eller kön för lösenordshashning.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: kön för lösenordshashning, eller databasen förblev låst (`retryAfter: 1`, ingenting ändrades). `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Starta en Google-inloggning
      description: |-
        Startar ett försök till Google-inloggning för PKCE-challengen och porten för spelets lyssnare på `127.0.0.1`. Svaret ger Google-URL:en som ska öppnas i systemets webbläsare och försökets `state`; försöket är giltigt i 10 minuter.

        `authUrl` innehåller `client_id`, `redirect_uri` (byggd av `redirectPort` och serverns ursprungstagg), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 av serverns egen verifier för Google) med `code_challenge_method=S256`, och `prompt=select_account`. Spelet kontrollerar den innan det öppnar den (se avsnittets beskrivning).

        **Gräns:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Försöket.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: Google-inloggning erbjuds inte på den här servern.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: gränsen `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databasen förblev låst), `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Starta en Google-inloggning på en webbplats
      description: |-
        Startar ett försök till Google-inloggning från en webbplats, för PKCE-challengen från dess sida. Svaret är detsamma som för spelet: Google-URL:en att navigera till och försökets `state`; försöket är giltigt i 10 minuter. Erbjuds när `GET /info` anger `sso.googleWeb: true`.

        `authUrl` innehåller webbplatsens `client_id` och `redirect_uri=GOOGLE_WEB_REDIRECT_URI`, med samma övriga parametrar som för spelet. Sidan kontrollerar den innan den navigerar dit (se **På en webbplats** i avsnittets beskrivning).

        **Gräns:** `sso_start`, delad med spelets start.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: Försöket.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: en saknad eller felformaterad `codeChallenge`, eller något annat fält (även `redirectPort`).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: Google-inloggning erbjuds inte på den här servern, eller inte till webbplatser.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: gränsen `sso_start` (delad med spelets start).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databasen förblev låst), `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Lämna Googles svar till servern
      description: |-
        Lämnar den `code` och `state` som Google skickade till spelets lyssnare eller till webbplatsens sida vidare till servern, tillsammans med försökets id och PKCE-verifiern. Ett försöks-id är oanvändbart utan verifiern, och koden är oanvändbar utan serverns egen PKCE-verifier och klienthemlighet.

        Servern kontrollerar försöket (okänt, använt eller utgånget: 410), sedan verifiern (en felaktig verifier lämnar försöket användbart), förbrukar sedan försöket, kontrollerar `state` och `iss`, löser in koden hos Google och verifierar ID-tokenen. Svaret (200) är något av följande:

        - `{ token, expiresAt, user }`: inloggad på det kopplade kontot;
        - `{ mfaRequired, mfaToken, expiresIn }`: fortsätt med `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: ett nytt konto; fortsätt med `POST /auth/sso/complete` inom 10 minuter. `suggestedUsername` kommer från namnet i Google eller från adressen, och är `""` när inget passar;
        - `{ needsPassword, linkTicket, username, expiresIn }`: kontot med den adressen har ett lösenord; fortsätt med `POST /auth/sso/google/link`. Ingenting är kopplat än.

        **Gräns:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: En session, ett andra steg eller nästa steg i en första Google-inloggning.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Inloggad på det kopplade kontot
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Tvåfaktorsautentisering är på
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: En ny spelare
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Ett konto med lösenord använder adressen
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: verifiern stämmer inte med försökets challenge (försöket förblir användbart). `sso_email_unverified`: Google har inte bekräftat adressen. `registration_closed`. `account_disabled`. Bara för ett kopplat konto: `banned` (med `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: Google-inloggning erbjuds inte på den här servern.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: ett aktivt konto utan lösenord använder adressen (kontot namnges inte).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: ett okänt, använt eller utgånget försök.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: gränsen `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databasen förblev låst), `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Koppla Google till ett befintligt konto med dess lösenord
      description: |-
        Efter att `finish` har svarat `needsPassword`: kopplar Google till det befintliga kontot med det kontots lösenord, inskrivet i spelet. Svaret (200) är en session (kopplingen sparas och spelaren loggas in), eller, när tvåfaktorsautentisering är på, `{ mfaRequired, mfaToken, expiresIn }`: fortsätt med `POST /auth/login/mfa`, och kopplingen sparas bara när en kod godkänns där.

        Ett fel lösenord lämnar biljetten användbar, för totalt 5 försök. Ett försök dras precis innan lösenordet kontrolleras: en 429 `too_many_attempts` eller en 428 `pow_required` drar inget, medan ett avslag från kön för lösenordshashning (503 `server_busy`, 429 `rate_limited`) redan har dragit ett och räknas som ett misslyckande för kontot. Väntetiden efter misslyckade försök använder samma räknare som `POST /auth/login`.

        **Gräns:** `auth` (med sin räkning per IPv6-/48-nät). **Proof of work:** som för `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: En session, eller inloggningens andra steg.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: fel lösenord; biljetten finns kvar, för totalt 5 försök.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (med `until`), endast efter ett korrekt lösenord.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: Google-inloggning erbjuds inte på den här servern.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: Google-kontot har under tiden kopplats till ett annat konto.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: en okänd, använd eller utgången biljett, det femte felaktiga lösenordet, ett konto vars status eller adress har ändrats sedan `finish`, eller ett konto vars status, adress, lösenord eller tvåfaktorsautentisering ändrades medan kopplingen sparades. Börja om inloggningen.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (kontots väntetid efter misslyckade försök), eller `rate_limited` (gränsen `auth`, kön för lösenordshashning).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: kön för lösenordshashning, eller databasen förblev låst (`retryAfter: 1`, inget kopplades). `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Skapa kontot vid en första inloggning med Google
      description: |-
        Efter att `finish` har svarat `needsUsername`: skapar kontot med det valda användarnamnet (registreringens regler gäller) och loggar in på det. Kontot har inget lösenord: `hasPassword` är `false`, och ”Glömt lösenordet?” (`POST /auth/password/forgot`) ger det ett.

        **Gräns:** `auth` (med dess räkning per IPv6-/48-nät).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Kontot är skapat och inloggat.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: Google-inloggning erbjuds inte på den här servern.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (ett konto har användarnamnet, eller en väntande registrering med en annan adress har reserverat det), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: en okänd, använd eller utgången biljett.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: gränsen `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databasen förblev låst), `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Lista de inloggade enheterna
      description: |-
        Kontots aktiva sessioner (inloggade enheter), den senast använda först. `current` markerar sessionen som gör anropet. `lastSeenAt` uppdateras högst var 5:e minut (senare medan servern ligger långt efter); `expiresAt` är det absoluta slutet, och gränsen för inaktivitet kan avsluta sessionen tidigare.

        **Gräns:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: De aktiva sessionerna.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: gränsen `sessions` eller kontobudgeten.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databasen förblev låst), `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
