      description: |-
        Sidan för en återställningslänk: formuläret för nytt lösenord (lösenordet två gånger). Formuläret skickas till `POST /reset-password`.

        **Gräns:** `page`.
      security: []
      parameters:
        - $ref: '#/components/parameters/LinkTokenQuery'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Formuläret för nytt lösenord.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Länken är ogiltig (även när den skickades till en adress som kontot inte längre har).
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Gränsen `page` (en HTML-sida), eller lagret per adress (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
    post:
      operationId: submitResetPasswordPage
      tags:
        - pages
      summary: Ange ett nytt lösenord via återställningsformuläret
      description: |-
        Formuläret på återställningssidan; det gör det som `POST /auth/password/reset` gör, i en enda transaktion: alla enheter loggas ut, ett väntande byte av e-postadress avbryts, de andra återställningslänkarna slutar fungera, adressen räknas som bekräftad och ägaren får ett e-postmeddelande.

        Länken kontrolleras först, sedan att båda lösenorden är likadana, sedan lösenordsreglerna. När servern är upptagen kommer formuläret tillbaka med `Retry-After` och länken förblir giltig.

        **Gränser:** `auth`, sedan `auth_reset` (delad med `POST /auth/password/reset`).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Lösenordet är bytt, och alla enheter är utloggade.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Formuläret igen med felet (lösenorden skiljer sig åt, ett svagt lösenord), länken är ogiltig, eller formuläret är ogiltigt (en HTML-sida).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Gränsen `auth` eller `auth_reset` (en HTML-sida), formuläret igen med `Retry-After` när den här klienten har för många lösenordshashningar i kö (länken förblir giltig), eller lagret per adress (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'Formuläret igen med `Retry-After` när servern är upptagen (kön för lösenordshashning, eller databasen förblev låst); länken förblir giltig. När servern ligger långt efter (se inledningen) i stället en sida ”Server error” (serverfel) med `Retry-After` (2 till 5): inget kördes och länken förblir giltig. Även när hanterarens tidsgräns överskrids.'
