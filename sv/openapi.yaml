            schema:
              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: lZ50AvPxUwbGqQCwWPIO28ONray7SzW0Cl_sLImwF3Q
          application/json:
            schema:
              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: lZ50AvPxUwbGqQCwWPIO28ONray7SzW0Cl_sLImwF3Q
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Adressen är ändrad.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Länken är ogiltig, använd eller har gått ut, eller formuläret är ogiltigt (en HTML-sida).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '409':
          $ref: '#/components/responses/HtmlConflict'
          description: Ett annat konto har tagit adressen under tiden (en HTML-sida).
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Gränsen `auth` (en HTML-sida), eller lagret per adress (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'Databasen förblev låst (`Retry-After: 1`), eller servern ligger långt efter (`Retry-After` 2 till 5, se inledningen): inget ändrades och länken fungerar fortfarande. Även när hanterarens tidsgräns överskrids.'
  /healthz:
    servers:
      - url: https://caissa.scacelith.com
        description: Den officiella servern, i roten.
      - url: https://caissa.scacelith.com/api/v1
        description: Den officiella servern, under `/api/v1`.
      - url: https://{host}:{port}
        description: Valfri Scacelith-server, i roten.
        variables:
          host:
            default: caissa.scacelith.com
            description: Serverns offentliga värdnamn (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Den offentliga API-porten (`PUBLIC_API_PORT`, annars `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Valfri Scacelith-server, under `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: Serverns offentliga värdnamn (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Den offentliga API-porten (`PUBLIC_API_PORT`, annars `API_PORT`).
    get:
      operationId: getLiveness
      tags:
        - health
      summary: Kontrollera att processen körs
      description: |-
        Svarar 200 `ok` så länge processen körs. `HEAD` fungerar också. Alla andra metoder ger 405 `method_not_allowed` med `Allow: GET, HEAD` (även `OPTIONS`).

        **Gränser:** endast lagret per adress.
      security: []
      responses:
        '200':
          description: Processen körs.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
              example:
                status: ok
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: lagret per adress.'
  /readyz:
    servers:
      - url: https://caissa.scacelith.com
        description: Den officiella servern, i roten.
      - url: https://caissa.scacelith.com/api/v1
        description: Den officiella servern, under `/api/v1`.
      - url: https://{host}:{port}
        description: Valfri Scacelith-server, i roten.
        variables:
          host:
            default: caissa.scacelith.com
            description: Serverns offentliga värdnamn (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Den offentliga API-porten (`PUBLIC_API_PORT`, annars `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Valfri Scacelith-server, under `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: Serverns offentliga värdnamn (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Den offentliga API-porten (`PUBLIC_API_PORT`, annars `API_PORT`).
    get:
      operationId: getReadiness
      tags:
        - health
      summary: Kontrollera att servern tar emot spelare
      description: |-
        Svarar 200 `ready` när servern tar emot spelare, och 503 `not_ready` medan den startar eller stängs av. `HEAD` fungerar också. Alla andra metoder ger 405 `method_not_allowed` med `Allow: GET, HEAD` (även `OPTIONS`).

        **Gränser:** endast lagret per adress.
      security: []
      responses:
        '200':
          description: Servern tar emot spelare.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: lagret per adress.'
        '503':
          description: Servern startar eller stängs av.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        En sessionstoken (`sct_` följt av 43 base64url-tecken) från ett svar på en inloggning, i headern `Authorization`: `Authorization: Bearer <token>`. Prefixet är exakt `Bearer` (skiftlägeskänsligt) och ett mellanslag; ett värde som saknar det, eller en token som inte består av 1 till 512 utskrivbara ASCII-tecken, ger 401 `invalid_token` som alla andra ogiltiga token. En tom header räknas som ingen header.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: Partiets id, ett positivt decimalt heltal med högst 16 siffror utan inledande nollor, under 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: Sessionens id, så som `GET /auth/sessions` anger det, skrivet utan inledande nollor (`03` är inte session 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Spelarens användarnamn, utan hänsyn till skiftläge. Servern godtar alla namn som består av 2 till 24 tecken ur `[A-Za-z0-9_.-]` (den vidaste regel den någonsin har tillåtit).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Ett parti-id; endast äldre partier listas. Skicka föregående sidas `next`. Ett tomt värde räknas som utelämnat.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Sidstorleken, 1 till 50. Ett större tal med upp till 3 siffror räknas som 50; ett tomt värde räknas som utelämnat.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: E-postlänkens token (43 base64url-tecken). Om den saknas eller är fel visas sidan ”link invalid or expired” (länken är ogiltig eller har gått ut).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Alla svar från servern förbjuder cachning.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Sekunder att vänta innan nästa försök; samma värde som `retryAfter` i bodyn.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Bearer-challengen, med `error="invalid_token"` för en ogiltig token.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Servern stänger anslutningen efter det här svaret.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (med `field` när ett fält i bodyn är felaktigt) eller `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Ett fält bryter mot schemat
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Bodyn är inte JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Ett svagt lösenord
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: En PGN som inte kan läsas
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (ingen `Authorization`-header) eller `invalid_token` (tokenen är felformaterad, har gått ut, har återkallats eller tillhör ett raderat konto).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Ingen session
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: En ogiltig token
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Anropet avvisas.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Fel lösenord vid förnyad autentisering
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Ett avstängt konto
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found`, eller en funktion som den här servern har stängt av.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: bodyn kom inte fram inom 10 sekunder. Servern stänger anslutningen.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Anropet står i konflikt med serverns tillstånd.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: försöket till Google-inloggning eller biljetten är okänd, redan använd eller har gått ut; börja om inloggningen.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: bodyn överskrider `HTTP_BODY_LIMIT` (16 384 byte som standard). Servern stänger anslutningen.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: anropsmålet (request target) överskrider 4096 tecken.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: bodyn är inte `application/json`, eller dess teckenkodning är inte UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: partiet har fler än `GIF_MAX_PLIES` (600) halvdrag.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: lös challengen i `pow` och skicka samma anrop igen med `pow: { challenge, nonce }`. `reason` anger varför: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` eller `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (en anropsgräns, kontobudgeten, eller kön för lösenordshashning) eller `too_many_attempts` (en strypning av kontot), med `retryAfter` och en `Retry-After`-header.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: En anropsgräns
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: För många misslyckanden på det här kontot
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: ett oväntat fel. Servern loggar det.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: fel `state` eller `iss`, eller så avvisade Google koden eller skickade en ID-token som inte går att verifiera (även en kod eller ID-token från den andra klienten, spelets eller webbplatsens). Felet innehåller aldrig Googles text.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` eller `timeout`: försök igen efter `retryAfter` när det anges.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Servern är upptagen
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Databasen förblev låst (en läsning)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Servern tog för lång tid
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Den animerade GIF:en, som bilaga.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` för ett parti från den här servern, `attachment; filename="scacelith-game.gif"` för en PGN som skickats med `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Filens storlek i byte.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: En HTML-sida.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: En HTML-sida som förklarar avvisningen.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Formuläret kom inte fram inom 10 sekunder (en HTML-sida). Servern stänger anslutningen.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: En HTML-sida som förklarar konflikten.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Formuläret överskrider `HTTP_BODY_LIMIT` (en HTML-sida). Servern stänger anslutningen.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Bodyn är varken ett formulär (`application/x-www-form-urlencoded`) eller JSON, eller så är dess teckenkodning inte UTF-8 (en HTML-sida).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: En anropsgräns (en HTML-sida), med `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Ett oväntat fel (en HTML-sida med rubriken ”Server error”, serverfel). Servern loggar det.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Servern är upptagen (databasen förblev låst, eller servern ligger långt efter; med `Retry-After`) eller tog för lång tid (en HTML-sida med rubriken ”Server error”, serverfel).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: Den enda formen för alla felsvar i JSON-API:t.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Felkoden i `snake_case`. En klient väljer utifrån den vad som ska visas.
          examples:
            - rate_limited
        message:
          type: string
          description: En mening på engelska, avsedd för loggar och som reserv.
        retryAfter:
          type: integer
          minimum: 1
          description: Sekunder att vänta innan nästa försök, finns bara vid avvisningar som upphör efter en viss tid. Svaret har då också en `Retry-After`-header med samma värde, utom vid 503 `busy` från läsningar av historiken, partier, spelare och topplistan.
        field:
          type: string
          description: Det felaktiga fältet eller den felaktiga query-parametern (`invalid_request`, `invalid_option`, samt `invalid_cursor`, `invalid_limit` och `invalid_filter` från `GET /account/games`). Ett nästlat fält skrivs med punkt (`pow.nonce`).
        reason:
          type: string
          description: 'Varför: den regel som ett `weak_password` bryter mot, eller varför ett proof of work begärdes eller avvisades (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Endast `banned`: avstängningens slut (Unix-tid i ms), `null` för en permanent avstängning.'
        line:
          type: integer
          minimum: 1
          description: 'Endast `invalid_pgn`: felets rad, från 1.'
        column:
          type: integer
          minimum: 1
          description: 'Endast `invalid_pgn`: felets kolumn, från 1, i tecken.'
    PowChallenge:
      type: object
      description: En proof-of-work-challenge (`pow` i ett 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Den signerade challengen, att skicka tillbaka oförändrad.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Antalet inledande nollbitar som `SHA-256(challenge + ":" + nonce)` måste ha.
        expiresAt:
          type: integer
          format: int64
          description: När challengen går ut (Unix-tid i ms), 2 minuter efter att den utfärdades.
    PowAnswer:
      type: object
      description: Svaret på en proof-of-work-challenge.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: '`challenge` från svaret 428, så som den angavs.'
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: En decimal sträng med högst 20 siffror sådan att `SHA-256(challenge + ":" + nonce)` börjar med `bits` nollbitar.
    ServerInfo:
      type: object
      description: Det som en klient behöver innan den loggar in eller ansluter.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Serverns namn (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: Ett UUID som databasen får vid sin första start. Det förblir detsamma över omstarter. Det är `null` när databasen inte kan ge det.
        motd:
          type: string
          description: Dagens meddelande (`SERVER_MOTD`), eventuellt tomt.
        protocol:
          type: object
          description: WebSocket-protokollet (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Den äldsta protokollversion som servern talar.
            max:
              type: integer
              minimum: 1
              description: Den nyaste protokollversion som servern talar.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'Protokollschemats fingeravtryck (de första 4 byten av SHA-256 för dess kanoniska form, som ett heltal utan tecken: `0xc649140f`, 3326678031, för protokollets minor-version 2); informativt, jämförs aldrig.'
            subprotocol:
              type: string
              description: Token för WebSocket-subprotokollet (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: Den WebSocket-port som spelarna använder (`PUBLIC_WS_PORT`, annars `WS_PORT`, annars `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: WebSocketens sökväg.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Om nya konton kan skapas.
        emailVerification:
          type: boolean
          description: Om nya konton bekräftar sin adress (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Om Google-inloggning erbjuds spelet.
            googleWeb:
              type: boolean
              description: Om Google-inloggning även erbjuds en webbplats (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: Tvåfaktorsautentisering är alltid tillgänglig.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: De proof-of-work-bitar som registreringen kräver (0 för inga).
        categories:
          type: array
          description: De officiella betänketiderna för partier med rating (`RATED_CATEGORIES`), i serverns ordning. Alla andra betänketider är `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: De regler som en klient kan kontrollera innan den skickar ett formulär.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: Det kortaste användarnamnet (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: Det längsta användarnamnet (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Det reguljära uttryck som ett nytt användarnamn måste matcha.
            passwordMinLength:
              type: integer
              description: Det kortaste lösenordet, i tecken (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Det längsta lösenordet, i byte UTF-8.
            customTimeControls:
              type: boolean
              description: Om utmaningar och privata partier får använda anpassade betänketider.
            reportsPerDay:
              type: integer
              description: Hur många anmälningar en spelare får göra per 24 timmar (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Det största WebSocket-meddelande som en klient får skicka, i byte.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: En officiell betänketid.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Kategorins id, minuter och tillägg i sekunder (`3+2`).
        baseSec:
          type: number
          minimum: 0
          description: Grundtiden, i sekunder.
        incSec:
          type: number
          minimum: 0
          description: Tillägget per drag, i sekunder.
    AccountView:
      type: object
      description: Kontot som dess spelare ser det (`user` i svaren på inloggning och i `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: Kontots id.
        username:
          type: string
          description: Användarnamnet.
        email:
          type: string
          format: email
          description: E-postadressen.
        emailVerified:
          type: boolean
          description: Om adressen är bekräftad.
        mfaEnabled:
          type: boolean
          description: Om tvåfaktorsautentisering är på.
        googleLinked:
          type: boolean
          description: Om ett Google-konto är kopplat.
        hasPassword:
          type: boolean
          description: '`false` för ett konto som skapats via Google och som ännu inte har valt något lösenord.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Om direkta utmaningar via namn tas emot (se `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: När kontot skapades (Unix-tid i ms).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Den senaste inloggningen (Unix-tid i ms), eller `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Den nya adressen för ett byte av e-postadress som väntar på sin länk, eller `null`.
    SessionAnswer:
      type: object
      description: En ny session.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Sessionstokenen, för headern `Authorization` och för WebSocketen.
        expiresAt:
          type: integer
          format: int64
          description: Sessionens absoluta slut (Unix-tid i ms); gränsen för inaktivitet kan avsluta den tidigare.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Andra steget i en inloggning med tvåfaktorsautentisering; fortsätt med `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Stegets token, för `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Sekunder som återstår för att slutföra steget.
    LoginAnswer:
      description: En session, eller andra steget i en inloggning med tvåfaktorsautentisering.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: En första inloggning med Google; fortsätt med `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Biljetten för `POST /auth/sso/complete`, giltig i 10 minuter.
        suggestedUsername:
          type: string
          description: Ett användarnamn som bildats av Google-namnet eller adressen, eller `""` när inget passar.
    SsoNeedsPassword:
      type: object
      description: Ett konto med lösenord använder adressen; fortsätt med `POST /auth/sso/google/link`. Inget är kopplat än.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Biljetten för `POST /auth/sso/google/link`.
        username:
          type: string
          description: Användarnamnet för det kontot (endast den som har bevisat adressen för Google ser det).
        expiresIn:
          type: integer
          const: 600
          description: Antal sekunder som biljetten förblir giltig.
    SsoFinishAnswer:
      description: Svaret från `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Ett försök till Google-inloggning.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Försöket, för `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: Google-URL:en som ska öppnas i systemets webbläsare, efter kontroll.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Den `state` som Google måste skicka tillbaka.
        expiresIn:
          type: integer
          const: 600
          description: Antal sekunder som försöket förblir giltigt.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Användarnamnet; därefter gäller serverns regler (se beskrivningen).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: E-postadressen. Trimmas och sparas med gemener.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Lösenordet; därefter gäller lösenordsreglerna.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Användarnamnet, eller e-postadressen (all text med `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Valfritt. Visas i listan över inloggade enheter (till exempel `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: '`mfaToken` från svaret på inloggningen (eller från svaret på en Google-inloggning).'
        code:
          type: string
          maxLength: 32
          description: Valfritt. En 6-siffrig kod från autentiseringsappen, eller en återställningskod.
        recoveryCode:
          type: string
          maxLength: 32
          description: Valfritt. En återställningskod. En av `code` och `recoveryCode` krävs.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: E-postadressen.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Parametern `token` i återställningslänken.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Det nya lösenordet; registreringens lösenordsregler gäller.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: S256-PKCE-challengen för klientens `codeVerifier` (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Porten för klientens lyssnare på `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: S256-PKCE-challengen för sidans `codeVerifier` (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`attemptId` från `POST /auth/sso/google/start`.'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: PKCE-verifiern; dess SHA-256 måste stämma med den challenge som gavs till `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state` så som Google skickade tillbaka den.'
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: '`code` så som Google skickade tillbaka den (utskrivbar ASCII utan mellanslag).'
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Valfritt. `iss` så som Google skickade tillbaka den, när Google gjorde det.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`linkTicket` från `finish`, giltig i 10 minuter.'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Kontots lösenord.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`ssoTicket` från `finish`, giltig i 10 minuter.'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Användarnamnet; registreringens regler gäller.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: De aktiva sessionerna, den senast använda först.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: En aktiv session (en inloggad enhet).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: Sessionens id, för `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: Inloggningen (Unix-tid i ms).
        lastSeenAt:
          type: integer
          format: int64
          description: Senaste användningen (Unix-tid i ms), uppdateras högst var 5:e minut (senare medan servern ligger långt efter).
        expiresAt:
          type: integer
          format: int64
          description: Det absoluta slutet (Unix-tid i ms); gränsen för inaktivitet kan avsluta sessionen tidigare.
        clientLabel:
          type:
            - string
            - 'null'
          description: Inloggningens `clientLabel`, eller `null` när ingen skickades.
        current:
          type: boolean
          description: Om detta är sessionen som gör anropet.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: En post per kategori där spelaren har spelat partier med rating.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: De aktiva sanktionerna.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }` under en avstängning, annars `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Ratingposten för en kategori.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: Kategorins id.
        rating:
          type: integer
          description: Ratingen.
        games:
          type: integer
          minimum: 0
          description: De partier som spelats i kategorin (räknade eller inte).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Den högsta rating som uppnåtts.
        provisional:
          type: boolean
          description: '`true` medan ratingen ännu inte är fastställd eller har färre än `PROVISIONAL_GAMES` räknade partier (spelet visar den som `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Typen av sanktion.
        reason:
          type:
            - string
            - 'null'
          description: Det angivna skälet, om något.
        startsAt:
          type: integer
          format: int64
          description: Starten (Unix-tid i ms).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Slutet (Unix-tid i ms), `null` när sanktionen är permanent.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Avstängningens slut (Unix-tid i ms), `null` när den är permanent.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` för att ta emot direkta utmaningar via namn, `none` för att avvisa dem.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Det nuvarande lösenordet.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Det nya lösenordet; registreringens lösenordsregler gäller.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Kontots lösenord.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: En kod från den väntande hemligheten, exakt 6 siffror.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Kontots lösenord.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Valfritt; krävs med tvåfaktorsautentisering (eller `recoveryCode`). En kod från autentiseringsappen, eller en återställningskod.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Valfritt. En återställningskod (`xxxx-xxxx-xx`; skiftläge, mellanslag och bindestreck spelar ingen roll).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Kontots lösenord.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: En kod från autentiseringsappen (en återställningskod avvisas).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Den nya adressen; trimmas och görs om till gemener, och kontrolleras sedan som en adress vid registrering.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Kontots lösenord.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Valfritt; krävs med tvåfaktorsautentisering (eller `recoveryCode`). En kod från autentiseringsappen, eller en återställningskod.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Valfritt. En återställningskod.
    TotpSetup:
      type: object
      description: Den väntande hemligheten för autentiseringsappen.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Hemligheten i base32, att skriva in i appen.
        uri:
          type: string
          format: uri
          description: URI:n `otpauth://totp/...`, att visa som QR-kod.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Sekunder per steg.
    RecoveryCodeList:
      type: array
      description: De 10 återställningskoderna, som visas bara denna gång. Var och en fungerar en gång.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: En sida i ett parti.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Namnet i partiposten (`deleted#<id>` för ett raderat konto).
        rating:
          type:
            - integer
            - 'null'
          description: Ratingen vid start, `null` när den är okänd.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Ratingen efter partiet. Ett parti med rating har den alltid; `null` endast för ett parti som inte räknas för ratingen (utan rating, anpassat, avbrutet).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Ratingförändringen, `0` när ratingreglerna lämnar ratingen oförändrad (FIDE:s nollpoängsregel, en motståndare utan fastställd rating, de första partierna för en spelare utan fastställd rating); `null` som för `ratingAfter`.
    GameSummary:
      type: object
      description: Sammanfattningen av ett sparat parti.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Partiets id.
        category:
          type: string
          description: Det officiella kategori-id:t (`3+2`), eller `custom`.
        rated:
          type: boolean
          description: Om partiet räknas för ratingen.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Betänketiden i sekunder (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (se partikoderna).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Koden för avslutningsorsaken (se partikoderna).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Resultatet, `*` för ett avbrutet parti.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Antalet halvdrag.
        startedAt:
          type: integer
          format: int64
          description: Starten (Unix-tid i ms).
        endedAt:
          type: integer
          format: int64
          description: Slutet (Unix-tid i ms).
    Termination:
      type: string
      description: Avslutningsorsakens namn (se partikoderna); `Unknown` för en kod som protokollet inte känner till.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: En partisammanfattning sedd från en spelares sida.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Spelarens sida.
    HistoryGameSummary:
      description: Ett parti i den inloggade spelarens historik.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Grundtiden i millisekunder.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Tillägget i millisekunder.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: Utfallet sett från spelarens sida.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Sidans partier, nyaste först.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Det id som ska skickas som `before` för nästa sida, eller `null` på sista sidan.
        total:
          type: integer
          minimum: 0
          description: Antalet partier som matchar filtret, över alla sidor.
    MoveRecord:
      type: object
      description: Ett halvdrag i ett parti.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: Draget i UCI-notation, med `n`, `b`, `r` eller `q` tillagt vid förvandling.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Den tid som räknades för draget (ms), `null` när posten inte har den.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Den dragande spelarens klocka efter draget (ms), `null` när posten inte har den.
    PgnTagsView:
      type: object
      description: De viktigaste PGN-taggarna, för visning. `Termination` är här avslutningsorsakens namn; PGN-filen använder standardvärdena i PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` eller `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: Startdatumet i UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Ratingen vid start, eller `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Ratingen vid start, eller `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: En partipost med dess drag och klockor. Den har en partisammanfattnings fält, utan `color` och `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Grundtiden i millisekunder.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Tillägget i millisekunder.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: Namnet på `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: Id för det parti som detta är en revansch av, eller `null`.
            moves:
              type: array
              description: En post per halvdrag.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Endast när tokenens spelare spelade det här partiet; spelarens sida.
            reportable:
              type: boolean
              description: Endast när tokenens spelare spelade det här partiet; `true` när `POST /reports` skulle ta emot en anmälan av motståndaren för det här partiet nu (partiet avslutades inom 7 dagar, dygnskvoten är inte förbrukad, och motståndaren är inte redan anmäld för det här partiet).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Användarnamnet, så som spelaren skrev det.
        createdAt:
          type: integer
          format: int64
          description: När kontot skapades (Unix-tid i ms).
        ratings:
          type: array
          description: Endast de officiella kategorierna, i serverns ordning.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Alla sparade partier, även partier utan rating och avbrutna partier.
            rated:
              type: integer
              minimum: 0
              description: Partier med rating, summerade över ratingposterna.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Användarnamnet, så som spelaren skrev det.
        games:
          type: array
          description: Sidans partier, nyaste först.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Det sista partiets id när sidan är full (nästa sida kan då vara tom), annars `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: Kategorins id.
        minGames:
          type: integer
          minimum: 0
          description: Antalet räknade partier som en post behöver för att listas (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: När listan beräknades (Unix-tid i ms).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: PGN-texten, högst 65 536 byte UTF-8. Endast det första partiet används.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Valfritt. Bildstorleken.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Valfritt. Den sida som visas nederst på brädet.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Valfritt. Millisekunder per drag, ett JSON-tal med heltalsvärde.
        coords:
          type: boolean
          default: true
          description: Valfritt. Om linjernas bokstäver och radernas siffror ritas runt brädet.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Partiet, som ett heltal eller en sträng med 1 till 16 siffror.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Motståndarens användarnamn, som i partiposten eller som det är nu, utan hänsyn till skiftläge. Det får inte vara tomt.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Vad anmälan gäller.
        comment:
          type:
            - string
            - 'null'
          description: Valfritt. Högst 500 tecken efter att kontrolltecken (utom tabb och radmatning) har tagits bort och texten har trimmats.
    AccountExport:
      type: object
      description: Allt som servern lagrar om kontot (tider som Unix-tid i ms).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: När exporten gjordes.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Vad filen innehåller och utelämnar, på enkel engelska för spelaren.
          items:
            type: string
        account:
          description: Kontovyn från `GET /account/me`, med `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Adressen till det kopplade Google-kontot, eller `null`.
        ratings:
          type: array
          description: De fullständiga ratingposterna.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Ratingpoäng som getts tillbaka efter att en motståndare har befunnits fuska, summerade per UTC-dygn och kategori, nyaste först. Varken partierna eller fuskarna namnges.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Alla sparade sessioner, nyaste först, utan någon token. Gallringen raderar en utgången session, och en utloggad session ett dygn efter utloggningen.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Säkerhetshändelserna, nyaste först, som sparas under `RETENTION_SECURITY_DAYS`.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Alla sanktioner, även hävda. Moderatorns namn tas aldrig med.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: De uppförandehändelser som registrerats för partier som spelaren lämnade, som avbröts eller där spelaren uteblev, sparas i 30 dagar.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: De anmälningar som spelaren har gjort.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Antalet partier.
            list:
              type: array
              description: Alla partier, nyaste först, som sammanfattningar från `GET /account/games`. Dragen finns i `GET /games/{id}` och PGN i `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: En fullständig ratingpost.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Om spelaren har lämnat fasen utan fastställd rating.
            countedGames:
              type: integer
              minimum: 0
              description: De partier som har räknats in i ratingen.
            updatedAt:
              type: integer
              format: int64
              description: När posten senast ändrades.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: Dygnets 00:00 UTC (Unix-tid i ms).
        category:
          type: string
        points:
          type: integer
          description: De poäng som gavs tillbaka det dygnet i den kategorin.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: När sessionen loggades ut, eller `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Inloggningens IP-adress, raderas efter `RETENTION_IP_DAYS`.
    SecurityEvent:
      type: object
      description: |-
        En säkerhetshändelse. `ip` anges bara för det som gjorts i inloggat läge, med kontots lösenord (och andra faktor) eller med en länk som skickats till dess adress: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` och `account_exported`; alla andra typer har `ip: null`, och `ip` raderas efter `RETENTION_IP_DAYS`.

        `detail` behåller bara dessa fält: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` och `method` (`password` eller `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` och `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. En händelse `moderator_action` behåller bara `{ action }`, för åtgärderna `ban`, `unban`, `reset_mfa`, `verify_email` och `revoke_sessions` (moderatorernas övriga åtgärder utelämnas). Alla andra typer har `detail: null`. Händelserna `rating_refund` utelämnas: deras poäng finns i `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Typen av händelse (`login`, `password_changed`...).
        at:
          type: integer
          format: int64
          description: När den inträffade.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: Den anmälda spelarens nuvarande offentliga namn.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Om anmälan fortfarande är öppen (om den anmälda spelaren har fått sanktioner sägs inte).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: E-postlänkens token (det dolda fältet i sidans formulär).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Återställningslänkens token (formulärets dolda fält).
        newPassword:
          type: string
