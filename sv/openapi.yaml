openapi: 3.1.1
info:
  title: HTTPS-API för Scacelith-servern
  version: "1.1.0"
  summary: HTTPS-API:et för varje Scacelith-server, både den officiella och communityservrar.
  description: |-
    Varje Scacelith-server, den officiella `caissa.scacelith.com` och varje communityserver, svarar på detta HTTPS-API. Spelet använder det till allt utanför själva partiet: registrering och inloggning (inklusive tvåfaktorsautentisering och Google), kontosidan, partihistoriken, PGN-nedladdningar och animerade GIF:ar av partier, inloggade enheter, nedladdningen av kontots data, raderingen av kontot och anmälningar.

    Spel i realtid (matchning, utmaningar, drag, klockor) går via samma servers WebSocket (`wss://<host>/ws`), som öppnas med en sessionstoken från detta API; det beskrivs i `PROTOCOL.md`, inte här.

    Standardvärdena nedan är de som gäller för en server med orörd konfiguration; en communityserver kan ändra dem (`CONFIG.md` namnger varje inställning).

    ## Bas-URL, port och transport

    - Officiell server: `https://caissa.scacelith.com/api/v1`, TCP-port 443.
    - En communityserver: `https://<SERVER_PUBLIC_HOST>[:<port>]/api/v1`. `API_PORT` är 443 som standard; bakom en NAT eller en proxy är den port som spelarna använder `PUBLIC_API_PORT`.
    - Spelets WebSocket ligger som standard på samma port (`WS_PORT` flyttar den; `GET /info` talar om för klienten var den finns).
    - HTTP/1.1 över TLS. Med `TLS_MODE=proxy` terminerar en omvänd proxy TLS framför servern. `TLS_MODE=off` (vanlig HTTP) är endast avsett för lokal utveckling.
    - HTML-sidorna som öppnas från länkarna i e-postmeddelanden (`/verify-email`, `/reset-password`, `/confirm-email-change`) ligger i serverns rot, utanför `/api/v1`. Endpoints för hälsokontroll svarar både i roten och under `/api/v1`. Google-inloggning har ingen sida på servern: Google skickar tillbaka webbläsaren till själva spelet, på `127.0.0.1`, eller till en sida på den webbplats som startade inloggningen (`GOOGLE_WEB_REDIRECT_URI`).
    - Ett avslutande snedstreck ignoreras (`/api/v1/info/` är `/api/v1/info`), och sökvägsparametrar URL-avkodas (en parameter som inte är giltig URL-kodning ger svaret 400 `invalid_request`).

    ## Anrop

    - **JSON-body.** `POST`-, `PUT`- och `DELETE`-anrop innehåller ett JSON-objekt med `Content-Type: application/json`. En annan `charset` än UTF-8 avvisas, liksom alla andra innehållstyper (415 `unsupported_media_type`). En tom body räknas som `{}`, vilket är vad endpoints utan parametrar tar emot (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`).
    - **Storlek och tid.** En body är begränsad till `HTTP_BODY_LIMIT` byte (16 384 som standard; `POST /gif` har en egen gräns på 135 168 byte): 413 `payload_too_large`. Den måste komma fram inom 10 sekunder: 408 `request_timeout`. Efter vilket som helst av de två felen stänger servern anslutningen.
    - **Strikta scheman.** Ett fält som endpointen inte känner till avvisas, ett fält som inte är markerat som valfritt är obligatoriskt, och typer och längder kontrolleras. Vart och ett av dessa fel ger svaret 400 `invalid_request`, där `field` anger fältet (med punkter för ett nästlat fält, till exempel `pow.nonce`). Strängar får inte innehålla styrtecken. Längder räknas i UTF-16-kodenheter, så ett tecken utanför Basic Multilingual Plane (en emoji) räknas dubbelt. En body som inte är JSON ger svaret 400 `invalid_json`. `POST /gif` och `POST /reports` kontrollerar själva sin body (se respektive endpoint).
    - **Frågesträngar.** Den första förekomsten av en parameter gäller, okända parametrar ignoreras, och ett `+` avkodas till ett mellanslag: de endpoints som tar emot en betänketidskategori accepterar både `3%2B2` och `3+2`.
    - **Metoder.** `HEAD` är `GET` utan body. `OPTIONS` på en befintlig sökväg ger svaret 204 med en `Allow`-header (och headers för ett CORS-preflight-anrop, se nedan). Alla andra metoder som sökvägen inte har ger svaret 405 `method_not_allowed` med `Allow`.
    - **Anropsmålet.** Det får inte överstiga 4096 tecken (414 `uri_too_long`). Ett anrop som inte alls går att tolka, eller vars huvud är för stort eller kommer fram för långsamt, får ett tomt svar 400, 431 eller 408, och anslutningen stängs.
    - **CORS: en tillåtelselista, avstängd som standard.** API:et betjänar spelet, som inte skickar någon `Origin`. När `CORS_ORIGINS` är tom (standard) skickas aldrig någon `Access-Control-*`-header, så ingen webbsida kan läsa ett svar. `CORS_ORIGINS` listar de webbursprung vars sidor får anropa API:et från en webbläsare, vart och ett exakt så som webbläsare skickar det i `Origin`: `https://host` eller `https://host:port`, med gemener, utan sökväg, avslutande snedstreck eller standardport; `http://` endast för `localhost`, `127.0.0.1` och `[::1]` (lokal utveckling); inga jokertecken. Den officiella servern sätter `CORS_ORIGINS=https://scacelith.com,https://www.scacelith.com` för sin webbplats. Då gäller:
      - Varje svar för en sökväg under `/api/v1` utom endpoints för hälsokontroll, både lyckade svar och fel (inklusive 429 från lagret per adress), har `Vary: Origin`. När anropets `Origin` byte för byte är ett av de listade ursprungen har svaret dessutom `Access-Control-Allow-Origin: <that origin>` och, utom i svaret på ett preflight-anrop, `Access-Control-Expose-Headers: Retry-After, Content-Disposition`, så att sidan kan läsa felkoderna, `Retry-After` och filnamnen i PGN- och GIF-nedladdningarna.
      - Ett preflight-anrop (`OPTIONS` med `Access-Control-Request-Method`) från ett listat ursprung till en befintlig sökväg ger svaret 204, utan body, med `Allow`, `Access-Control-Allow-Origin`, `Access-Control-Allow-Methods` (metoderna i `Allow`), `Access-Control-Allow-Headers: Authorization, Content-Type`, `Access-Control-Max-Age: 600` och `Vary: Origin`. Det kräver ingen token och räknas varken mot någon kontobudget eller mot någon gräns per endpoint; som alla anrop tar det en token från lagret per adress. En webbläsare återanvänder resultatet av ett preflight-anrop i 10 minuter, men bara för exakt samma URL, inklusive frågesträngen. Ett anrop utan `Authorization` och utan JSON-body, till exempel `GET /info` eller `GET /leaderboard`, behöver inget preflight-anrop.
      - Alla andra svar på ett preflight-anrop innebär ett misslyckat preflight, även med CORS-headers: en 404 för en sökväg som inte finns, eller 429 från lagret per adress. Webbläsaren skickar då inte anropet, och sidan ser ett nätverksfel, utan svaret och dess `Retry-After`.
      - `Access-Control-Allow-Credentials` skickas aldrig, inte heller `Access-Control-Allow-Origin: *`: en sida skickar sin sessionstoken i `Authorization: Bearer`, precis som spelet, och API:et sätter ingen cookie. HTML-sidorna, endpoints för hälsokontroll och de tomma svaren på oläsbara anrop har ingen CORS-header. WebSocket använder inte CORS: `WS_ALLOWED_ORIGINS` listar de sidor som får öppna den.
      - En sida från ett ursprung som inte är listat kan inte läsa något, och dess skrivande anrop mellan webbplatser skickas aldrig: JSON-body och `Authorization` kräver ett preflight-anrop, vars svar saknar `Access-Control-Allow-Origin` för det ursprunget. `Cross-Origin-Resource-Policy: same-origin` finns kvar på alla svar: den gäller bara `no-cors`-anrop (en annan webbplats som bäddar in ett svar), aldrig `cors`-anropen från en listad sida.

    ## Svar och fel

    - Svaren är JSON i UTF-8, utom PGN-nedladdningen (`application/x-chess-pgn`), de animerade GIF:arna (`image/gif`) och HTML-sidorna. Tider anges i millisekunder sedan 1970-01-01 UTC. Id:n är heltal. Parti-id:n har upp till 16 siffror men håller sig under 2^53, så ett JSON-tal (en double) rymmer dem exakt.
    - Varje svar från API:et har `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`, `X-Frame-Options: DENY`, `Cross-Origin-Resource-Policy: same-origin` och `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'` (HTML-sidorna har en egen policy). Med `TLS_MODE=native` har det även `Strict-Transport-Security: max-age=31536000`. De svar som lyssnaren skriver själv, före API:et (`GET` och `HEAD` för endpoints för hälsokontroll, 429 från lagret per adress och en 500 `internal_error` när API:et fallerar helt), har samma headers utom `Cross-Origin-Resource-Policy`, och deras `Content-Type` är `application/json` utan teckenkodning.
    - Ett svar måste läsas inom 60 sekunder från det att servern har det klart, vilket bara spelar roll för de stora svaren (en GIF, dataexporten, en lång PGN). Den tid servern behöver för att förbereda ett svar räknas varken in i detta eller i de 30 sekunder utan någon byte in eller ut efter vilka en anslutning stängs.

    Fel har en enda form (schemat `Error`):

    ```json
    { "error": "snake_case_code", "message": "An English sentence.", "retryAfter": 30 }
    ```

    `message` är avsett för loggar och som reserv; en klient väljer vad som ska visas utifrån `error`. `retryAfter` (sekunder) finns bara vid avslag som upphör med tiden, och svaret har då också en `Retry-After`-header med samma värde; det enda undantaget är 503 `busy` vid läsning av historik, partier, spelare och topplistan, som bara har fältet. Vissa fel lägger till fält: `field` (ogiltig indata), `reason` (`weak_password`, `pow_required`), `pow` (`pow_required`), `until` (`banned`), `line` och `column` (`invalid_pgn`).

    Fel som alla endpoints kan ge:

    | Status | `error` | När |
    |---|---|---|
    | 400 | `invalid_request` | Bodyn bryter mot endpointens schema (`field` anger var), anropsmålet eller `Content-Length` är felformaterat, en sökvägsparameter är inte giltig URL-kodning, eller bodyn kapades. |
    | 400 | `invalid_json` | Bodyn är inte JSON. |
    | 401 | `unauthorized` | Ingen `Authorization`-header på en endpoint som kräver en session. |
    | 401 | `invalid_token` | Tokenen är felformaterad, har gått ut, har återkallats eller tillhör ett raderat konto; även på endpoints där sessionen är valfri. |
    | 404 | `not_found` | Ingen sådan endpoint. Vissa endpoints använder den också: inget sådant parti, ingen sådan spelare eller session. |
    | 405 | `method_not_allowed` | Sökvägen finns för andra metoder (se `Allow`). |
    | 408 | `request_timeout` | Bodyn kom inte fram inom 10 sekunder. |
    | 413 | `payload_too_large` | Bodyn överskrider `HTTP_BODY_LIMIT` (135 168 byte för `POST /gif`). |
    | 414 | `uri_too_long` | Anropsmålet överskrider 4096 tecken. |
    | 415 | `unsupported_media_type` | Bodyn är inte `application/json`, eller dess teckenkodning är inte UTF-8. |
    | 429 | `rate_limited` | En anropsgräns (se nedan): `retryAfter` plus en `Retry-After`-header. |
    | 500 | `internal_error` | Ett oväntat fel. Servern loggar det. |
    | 503 | `timeout` | Servern svarade inte inom 30 sekunder (60 sekunder för exporten, 45 sekunder för GIF:arna med standardinställningarna). |
    | 503 | `server_busy` | Ett sessionsuppslag eller en kontoändring fann databasen låst (`retryAfter` 1), eller så är kön för lösenordshashning full (se nedan). Även, med en `retryAfter` på 2 till 5, när servern ligger långt efter: för en `POST`, `PUT`, `PATCH` eller `DELETE` har databasen för många skrivningar i kö; för alla anrop gäller att för många tidigare anrop fortfarande körs efter sin tidsgräns, eller att sessionstokenen inte kunde kontrolleras inom 5 sekunder. Anropet kördes inte, och dess anropsgränser tog ingenting. |

    Endpoints för läsning (partihistorik, partier, spelare, topplista) och exporten svarar 503 `busy` med `retryAfter: 1` när databasen förblev låst.

    Endpoints som kontrollerar eller hashar ett lösenord kan också svara med något av dessa, båda med en slumpmässig `retryAfter` på 5 till 15 sekunder:

    - 503 `server_busy`: serverns kö för lösenordshashning (`PASSWORD_HASH_QUEUE_MAX`) är full, eller väntetiden tog slut.
    - 429 `rate_limited`: kön är minst halvfull och den här klienten (en IPv4-adress eller ett IPv6-/48-nät) har redan `PASSWORD_HASH_WAITERS_PER_SOURCE` hashningar som väntar. Denna 429 lämnar tillbaka de token från anropsgränserna som anropet tog.

    Ingenting ändrades och inget misslyckat försök räknades (utom på `POST /auth/sso/google/link`, där försöket på biljetten och misslyckandet för kontot räknades före hashningen), och en återställningslänk förblir giltig.

    HTML-sidorna svarar med sina fel som HTML-sidor med samma statuskoder.

    ## Autentisering

    De endpoints som kräver en session tar emot en bearer-token i headern `Authorization` (schemat `bearerAuth`):

    ```
    Authorization: Bearer sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
    ```

    - **Hämta en token.** En token (`sct_` följt av 43 base64url-tecken) kommer från `POST /auth/login`, och sedan `POST /auth/login/mfa` när tvåfaktorsautentisering är på, från `POST /auth/sso/google/finish` och `POST /auth/sso/google/link` (Google-inloggning) och från `POST /auth/sso/complete`. Var och en av dem svarar `{ token, expiresAt, user }`. Servern lagrar bara en SHA-256 av tokenen.
    - **Session krävs.** En saknad header ger svaret 401 `unauthorized` med `WWW-Authenticate: Bearer realm="scacelith"`. En ogiltig token ger svaret 401 `invalid_token` med `WWW-Authenticate: Bearer realm="scacelith", error="invalid_token"`. En klient bör glömma en token som får `invalid_token` och logga in igen.
    - **Valfri session.** På `GET /games/{id}`, `GET /games/{id}/pgn`, `GET /players/{username}` och `GET /players/{username}/games` är sessionen valfri. Utan headern svarar de med den offentliga vyn; om en header skickas måste dess token vara giltig.
    - **Upptagen lagring.** När databasen förblir låst medan en token kontrolleras svarar en endpoint som kräver eller accepterar en session 503 `server_busy` med `retryAfter: 1` (och `Retry-After`); när kontrollen tar mer än 5 sekunder svarar den 503 `server_busy` med en `retryAfter` på 2 till 5. I båda fallen har tokenen inte bedömts: behåll den och skicka anropet igen.
    - **Livslängd.** En session upphör vid det som inträffar först av `SESSION_MAX_DAYS` (90) efter inloggningen (detta är `expiresAt`) och `SESSION_IDLE_DAYS` (30) utan användning. Varje användning skjuter upp inaktivitetsgränsen; servern skriver det nya värdet högst var 5:e minut, i bakgrunden. Medan databasen har många skrivningar i kö skjuter servern upp den skrivningen till ett senare anrop, utom under den sista timmen före inaktivitetsgränsen, så att en session som används inte går ut. Ett konto behåller högst `MAX_SESSIONS_PER_USER` (10) sessioner: en ny inloggning återkallar de äldsta utöver det antalet.
    - **Återkallelse.** Utloggning (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`) återkallar sessioner; det gör även ett lösenordsbyte (de andra sessionerna), en återställning av lösenordet och radering av kontot (alla sessioner), samt en administratör. En återkallelse via API:et träder i kraft direkt, och den WebSocket som öppnades med en återkallad session stängs. Ett lösenordsbyte eller en återställning av lösenordet och radering av kontot återkallar i samma transaktion som själva ändringen: när någon av dem misslyckas har ingen session återkallats och inget annat heller ändrats. Servern cachar sessionsuppslag i 30 sekunder, så en återkallelse via administratörskommandot, som är en separat process, träder i kraft inom 30 sekunder.
    - **Omfattning.** En token hör till en enda server och öppnar även dess WebSocket. Skicka den aldrig till en annan server.

    ## Anropsgränser och annan strypning

    Gränserna gäller ett av två omfång. **Klient:** en IPv4-adress eller ett IPv6-/64-nät (i proxyläge kommer adressen från `X-Forwarded-For` som skickats av en `TRUSTED_PROXIES`-adress); vissa gränser räknar också varje IPv6-/48-nät som helhet, utöver vart och ett av dess /64-nät. **Spelare:** det inloggade kontot, oavsett adress; en gräns som räknas per spelare på en endpoint där sessionen är valfri räknas per klient för ett anrop utan token.

    Varje gräns är en token bucket som rymmer `limit` anrop och fylls på kontinuerligt med `limit / window`; `retryAfter` är tiden till nästa token. Gränser markerade *delad* räknas dessutom över ett glidande fönster av samma längd, så att inget fönster rymmer mycket mer än `limit` anrop. Varje gräns räknas för hela servern. När en av en endpoints gränser avvisar ett anrop lämnas de token som dess övriga gränser tog för anropet tillbaka. Ett avslag ger svaret 429 `rate_limited` med `retryAfter` och `Retry-After`.

    - **Lagret per adress.** Varje anrop (alla sökvägar och metoder, inklusive endpoints för hälsokontroll och WebSocket-uppgraderingar) tar först en token ur klientens budget: `HTTP_RATE_PER_IP` (600) per minut med en burst på en halv minut, och `HTTP_RATE_PER_PREFIX` (4 x `HTTP_RATE_PER_IP`) för ett IPv6-/48-nät. En klient får också ha högst `IP_MAX_INFLIGHT` (32 x `WORKERS`) pågående anrop (`retryAfter` 1 därutöver). En klient som fortsätter trots avslagen blockeras: `ABUSE_BLOCK_REFUSALS_PER_MIN` (600) avslag inom en minut blockerar den i 1 minut, sedan 4, 16 och 60 minuter vid varje ny blockering inom 6 timmar. Ett avslag från gränserna `auth`, `auth_*` och `reauth` räknas som 5; gränser som räknas per spelare räknas aldrig. Adresser i `ABUSE_EXEMPT` hoppar över detta lager, men inte kontobudgeten eller gränserna per endpoint.
    - **Kontobudget.** Varje anrop som har en giltig sessionstoken räknas också mot sitt konto: `USER_RATE_PER_MIN` (120) per minut för alla endpoints tillsammans, oavsett adress, med en burst på en halv minut.
    - **Gränser per endpoint:**

    | Gräns | Standard | Räknas per | Endpoints |
    |---|---|---|---|
    | `auth` | `AUTH_RATE_PER_IP` (20) / 10 min, delad | klient, och `AUTH_RATE_PER_PREFIX` (5 x `AUTH_RATE_PER_IP`) per IPv6-/48-nät | `POST /auth/register`, `/auth/login`, `/auth/login/mfa`, `/auth/verify-email/resend`, `/auth/password/forgot`, `/auth/password/reset`, `/auth/sso/google/link`, `/auth/sso/complete`; `POST /verify-email`, `/reset-password`, `/confirm-email-change` |
    | `auth_register` | `AUTH_REGISTER_PER_HOUR` (10) / timme, delad | klient, 3 gånger så många per IPv6-/48-nät | `POST /auth/register` |
    | `auth_mail` | `AUTH_MAIL_PER_HOUR` (10) / timme, delad | klient, 3 gånger så många per IPv6-/48-nät | `POST /auth/verify-email/resend` |
    | `auth_forgot` | `AUTH_FORGOT_PER_HOUR` (3) / timme, delad | klient, 3 gånger så många per IPv6-/48-nät | `POST /auth/password/forgot` |
    | `auth_forgot_day` | `AUTH_FORGOT_PER_DAY` (10) / 24 timmar, delad | klient, 3 gånger så många per IPv6-/48-nät | `POST /auth/password/forgot` |
    | `auth_reset` | `AUTH_RESET_PER_HOUR` (10) / timme, delad | klient, 3 gånger så många per IPv6-/48-nät | `POST /auth/password/reset`, `POST /reset-password` |
    | `reauth` | samma tal som `auth`, en egen bucket, delad | klient och IPv6-/48-nät | `POST /account/password`, `/account/mfa/totp/setup`, `/account/mfa/totp/enable`, `/account/mfa/totp/disable`, `/account/mfa/recovery-codes`, `/account/email`, `/account/export`, `/account/delete` |
    | `reauth_user` | `AUTH_REAUTH_PER_USER` (10) / 10 min, delad | spelare | samma endpoints som `reauth` |
    | `account` | 60 / min | spelare | `GET /account/me`, `PUT /account/preferences` |
    | `account_games` | 60 / min | spelare | `GET /account/games` |
    | `account_export` | 5 / timme, delad | spelare | `POST /account/export` (kontrolleras före `reauth`; varje försök räknas) |
    | `sessions` | 60 / min | spelare | `POST /auth/logout`, `/auth/logout-all`, `GET /auth/sessions`, `DELETE /auth/sessions/{id}` |
    | `public_read` | 60 / min | spelare (klient utan token) | `GET /players/{username}`, `/players/{username}/games`, `/games/{id}`, `/games/{id}/pgn` (en bucket för alla fyra) |
    | `gif` | 30 / min | spelare | `GET /games/{id}/gif`, `POST /gif` (en bucket för båda) |
    | `gif_user_min`, `gif_user_hour` | `GIF_USER_RENDERS_PER_MIN` (4) / min och `GIF_USER_RENDERS_PER_HOUR` (30) / timme, delad | spelare | samma två, bara när GIF:en måste skapas (inte från cachen) |
    | `gif_ip_min`, `gif_ip_hour` | `GIF_IP_RENDERS_PER_MIN` (12) / min och `GIF_IP_RENDERS_PER_HOUR` (120) / timme, delad | klient (alla dess konton tillsammans), 3 gånger så många per IPv6-/48-nät | samma, som ovan |
    | `reports` | 30 / timme | spelare | `POST /reports` |
    | `sso_start` | 30 / 10 min, delad | klient, och 90 per IPv6-/48-nät | `POST /auth/sso/google/start`, `POST /auth/sso/google/web/start` (tillsammans) |
    | `sso_finish` | 30 / min | klient | `POST /auth/sso/google/finish` |
    | `page` | 60 / min | klient | `GET /verify-email`, `/reset-password`, `/confirm-email-change` |

    `GET /info` och `GET /leaderboard` har ingen egen gräns: bara lagret per adress. En endpoint med flera gränser kontrollerar dem i den ordning som anges i dess beskrivning.

    Servern hanterar ett anrop i denna ordning: lagret per adress, sedan endpoints för hälsokontroll; matchning av endpoint; kontrollerna av att servern inte ligger långt efter (503 `server_busy`): för många tidigare anrop som fortfarande körs efter sin tidsgräns och, för en `POST`, `PUT`, `PATCH` eller `DELETE`, databasens kö av skrivningar; autentisering, inom 5 sekunder (503 `server_busy` därutöver); kontobudgeten, när anropet har en session; endpointens gränser; bodyn; själva endpointen (GIF-endpoints tar sina renderingsgränser bara när de har en GIF att skapa). Ett anrop som avvisas på grund av sin token förbrukar alltså inga av endpointens token, medan ett anrop med ogiltig body förbrukar dem.

    Annan strypning, som endpoints själva svarar med:

    - **Misslyckade inloggningar på ett inloggningsnamn** (användarnamn eller e-postadress): från och med `AUTH_FAILURES_PER_ACCOUNT` (5) misslyckanden måste varje försök vänta dubbelt så länge som det föregående (2 s, 4 s och så vidare, upp till 15 minuter): 429 `too_many_attempts` med `retryAfter`. Räknaren glömmer dem efter en timme utan misslyckanden.
    - **Misslyckade andra faktorer vid inloggning:** samma regel från och med kontots 5:e felaktiga kod. Ett inloggningssteg accepterar högst 5 felaktiga koder.
    - **Koder för andra faktorn på ett konto:** högst `AUTH_MFA_PER_ACCOUNT` (10) koder (från autentiseringsappen eller återställningskoder, rätt eller fel) per 15 minuter, från vilken adress som helst, vid inloggning och vid förnyad autentisering; därutöver 429 `too_many_attempts` innan koden kontrolleras, så att en återställningskod inte förbrukas.
    - **Misslyckade förnyade autentiseringar för ett konto** (fel lösenord eller kod): samma regel (429 `too_many_attempts`), gemensam för alla endpoints som kräver förnyad autentisering.
    - **E-post:** ett bekräftelse- eller återställningsmeddelande per adress var 5:e minut (svaret förblir detsamma); ett meddelande om att ”någon försökte använda din adress” per adress och timme.
    - **Anmälningar:** `REPORTS_PER_DAY` (5) per spelare under 24 timmar: 429 `report_limit`.

    ## Proof of work

    `POST /auth/register` kräver alltid ett proof of work när `POW_REGISTER_BITS` är större än 0 (18 som standard; `GET /info` anger det som `pow.register`). `POST /auth/login` och `POST /auth/sso/google/link` (samma sorts challenge för båda) kräver ett bara under 5 minuter efter att servern har sett en våg av misslyckade inloggningar (`POW_LOGIN_TRIGGER_PER_MIN`, sedan `POW_LOGIN_BITS`); en klient får veta det av svaret.

    1. Anropet utan bevis (eller med ett avvisat bevis) ger svaret 428 `pow_required` med `reason` och en `pow`-challenge `{ challenge, bits, expiresAt }`.
    2. Hitta en nonce: en decimal sträng på högst 20 siffror sådan att `SHA-256(challenge + ":" + nonce)` börjar med `bits` nollbitar (den mest signifikanta biten i den första byten först). 18 bitar kräver i genomsnitt cirka 260 000 hashningar.
    3. Skicka samma anrop igen med `"pow": { "challenge": "...", "nonce": "123456" }` i bodyn.

    En challenge är giltig i 2 minuter och bara en gång, för en endpoint och ett klientnätverk (en IPv4-adress eller ett IPv6-/64-nät). Den är signerad, så servern sparar ingenting om den förrän den kommer tillbaka. `reason` anger varför ett bevis avvisades: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` eller `replayed`.

    ## Förnyad autentisering

    Kontoändringar kräver lösenordet igen och, när tvåfaktorsautentisering är på, en andra faktor:

    - bara lösenordet: `POST /account/password` och `POST /account/mfa/totp/setup`;
    - lösenordet och en kod från autentiseringsappen (en återställningskod avvisas): `POST /account/mfa/recovery-codes`;
    - lösenordet och en kod från autentiseringsappen eller en återställningskod: `POST /account/mfa/totp/disable`, `POST /account/email`, `POST /account/export` och `POST /account/delete`.

    I bodyn innehåller `code` en 6-siffrig kod från autentiseringsappen och `recoveryCode` en återställningskod (`xxxx-xxxx-xx`; versaler eller gemener, mellanslag och bindestreck spelar ingen roll). En återställningskod kan också skickas i `code` där återställningskoder accepteras. Varje kod fungerar en gång: en använd kod från autentiseringsappen avvisas fram till nästa tidssteg på 30 sekunder, och en återställningskod är förbrukad när den har använts.

    | Status | `error` | När |
    |---|---|---|
    | 403 | `invalid_password` | Fel lösenord, eller så återställdes eller byttes lösenordet medan anropet kördes (ingenting ändrades). |
    | 403 | `mfa_code_required` | Tvåfaktorsautentisering är på och varken `code` eller `recoveryCode` skickades. |
    | 403 | `invalid_code` | Fel kod eller redan använd kod. |
    | 400 | `password_not_set` | Ett konto med enbart Google-inloggning har inget lösenord än (”Glömt lösenordet?” sätter ett). |
    | 429 | `too_many_attempts` | För många misslyckanden, eller för många prövade koder, på det här kontot. |
    | 503 / 429 | `server_busy` / `rate_limited` | Kön för lösenordshashning är upptagen. |

    Misslyckade lösenord och koder räknas i kontots räknare för misslyckanden och registreras som säkerhetshändelser.

    ## Port för mätvärden

    Utöver API-porten svarar servern med vanlig HTTP på porten för mätvärden (`METRICS_PORT`, 9464, bunden till `METRICS_BIND`, 127.0.0.1 som standard; håll den privat). Den ingår inte i detta API: `GET /healthz` svarar `ok`; `GET /readyz` svarar `ready` när uppstarten är klar (varje shard har spelat upp sin journal igen och lyssnarna är bundna) och fram till att nedstängningen börjar, annars 503 `not ready`; `GET /metrics` levererar Prometheus-mätvärdena och kräver, när `METRICS_TOKEN` är satt, `Authorization: Bearer <token>` med exakt den token.
