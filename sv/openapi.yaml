    x-displayName: Radering av konto
    description: Permanent radering av kontot.
  - name: game-history
    x-displayName: Partihistorik
    description: Den inloggade spelarens egna partier, filtrerade och sidindelade.
  - name: games
    x-displayName: Partier och PGN
    description: |-
      Partiposter med sina drag och klockor, och deras PGN-filer.

      **Partikoder.** `status`: 1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (bara avslutade partier sparas). `result`: `1-0`, `0-1`, `1/2-1/2` eller `*` (avbrutet). `reason`, med sitt namn (`termination`) och de ord som avslutar PGN-filens dragtext (på engelska i filen, här följda av en svensk översättning); koderna 7, 14 och 21 betyder remi (den spelare vars tid tog slut, som gav upp eller som lämnade partiet mötte en motståndare som inte kunde sätta matt: FIDE 6.9 och 5.1.2; `DESIGN.md` 6.3 anger regeln), och servern avslutar aldrig ett parti med koderna 4 och 13 (de hör till den gemensamma listan över orsaker):

      | Kod | `termination` | Ord i PGN-filen |
      |---|---|---|
      | 1 | `Checkmate` | Checkmate (Schackmatt) |
      | 2 | `Resignation` | Resignation (Uppgivet parti) |
      | 3 | `Timeout` | Loss on time (Förlust på tid) |
      | 4 | `IllegalMoves` | Second illegal move (forfeit) (Andra otillåtna draget, förlust) |
      | 5 | `Stalemate` | Stalemate (Patt) |
      | 6 | `InsufficientMaterial` | Dead position (insufficient material) (Död ställning, otillräckligt material) |
      | 7 | `TimeoutVsInsufficient` | Flag fall, but the opponent cannot checkmate (Flaggan föll, men motståndaren kan inte sätta matt) |
      | 8 | `FivefoldRepetition` | Fivefold repetition (Femfaldig upprepning) |
      | 9 | `SeventyFiveMoves` | 75-move rule (75-dragsregeln) |
      | 10 | `ThreefoldClaim` | Threefold repetition (claimed) (Trefaldig upprepning, på begäran) |
      | 11 | `FiftyMoveClaim` | 50-move rule (claimed) (50-dragsregeln, på begäran) |
      | 12 | `Agreement` | Draw by agreement (Remi efter överenskommelse) |
      | 13 | `IllegalMovesVsInsufficient` | Second illegal move, but the opponent cannot checkmate (Andra otillåtna draget, men motståndaren kan inte sätta matt) |
      | 14 | `ResignationVsInsufficient` | Resignation, but the opponent cannot checkmate (Uppgivet parti, men motståndaren kan inte sätta matt) |
      | 20 | `Abandonment` | Abandoned (disconnected for too long) (Lämnade partiet, frånkopplad för länge) |
      | 21 | `AbandonmentVsInsufficient` | Abandoned, but the opponent cannot checkmate (Lämnade partiet, men motståndaren kan inte sätta matt) |
      | 22 | `Aborted` | Game aborted (Partiet avbrutet) |
      | 23 | `NoShow` | Aborted: first move not played in time (Avbrutet: första draget spelades inte i tid) |
      | 24 | `Forfeit` | Forfeit (fair play violation) (Tilldömd förlust, brott mot rent spel) |
      | 25 | `ServerAborted` | Aborted by the server (Avbrutet av servern) |
      | 26 | `BothDisconnected` | Aborted: both players disconnected (Avbrutet: båda spelarna tappade anslutningen) |

      Kod 14 är ny i protokollets minor-version 1: en klient som skrevs före den bör visa en okänd kod som ett vanligt partislut med dess `result`.
  - name: gifs
    x-displayName: Animerade GIF:ar
    description: |-
      Ett parti som animerad GIF, att spara eller dela: brädet sett ovanifrån, en bildruta per ställning från början till slutställningen, spelarnas namn och ratingtal ovanför brädet, det senaste draget under det, och i den sista bildrutan resultatet och hur partiet slutade.

      **Kostnad, cache och kvoter.** En GIF skapas i en egen renderingstråd, aldrig i de trådar som kör partierna, och med lägsta CPU-prioritet: `GIF_THREADS` trådar (`WORKERS` som standard), som startas med den första GIF:en och stoppas efter en minut utan någon. Upp till `GIF_QUEUE_MAX` (4 x `WORKERS`) GIF:ar väntar på en tråd, högst `GIF_QUEUE_TIMEOUT_MS` (10 s) var; en rendering får pågå i `GIF_RENDER_TIMEOUT_MS` (30 s). Servern sparar de GIF:ar den har skapat i en cache på `GIF_CACHE_MB` MB (32 x `WORKERS`), där den som använts minst nyligen försvinner först; en GIF från cachen, eller en som håller på att skapas för ett annat anrop, kostar ingen rendering. Cachens nyckel omfattar allt som ändrar bilden, även namnen.

      Varje anrop räknas i `gif` (30 per minut per spelare för båda endpoints). En GIF som måste skapas räknas också i renderingsgränserna: per spelare `GIF_USER_RENDERS_PER_MIN` (4) per minut och `GIF_USER_RENDERS_PER_HOUR` (30) per timme; per klient, alla dess konton tillsammans, `GIF_IP_RENDERS_PER_MIN` (12) per minut och `GIF_IP_RENDERS_PER_HOUR` (120) per timme, och 3 gånger så många per IPv6-/48-nät. En klient bör behålla filen den har laddat ned i stället för att begära den igen, och vänta `retryAfter` efter en 429 eller en 503.

      Storlekar: `small` (rutor på 32 px: 284 x 350 pixlar), `medium` (48 px: 424 x 515), `large` (72 px: 628 x 762); utan koordinater 268 x 342, 400 x 503 och 600 x 748. Utgångsställningen visas i minst 1 s (eller fördröjningen, om den är längre), slutställningen i 3 s, och GIF:en spelas i en slinga; efter den första bildrutan lagras bara den del av bilden som ändras. Ett parti på 40 drag tar cirka 135, 205 och 325 KiB (small, medium, large), ett parti på 150 drag 0,5, 0,8 och 1,2 MiB.
  - name: players
    x-displayName: Spelare
    description: Offentliga profiler och senaste partier. Bara offentliga data, aldrig en e-postadress, en session, en sanktion eller en integritetsnivå. Ett raderat konto har ingen profil.
  - name: leaderboard
    x-displayName: Topplista
    description: De bästa spelarna i varje officiell kategori.
  - name: reports
    x-displayName: Anmälningar
    description: Anmälan av motståndaren i ett nyligen spelat parti till moderatorerna.
  - name: pages
    x-displayName: HTML-sidor
    description: |-
      Sidor för en webbläsare, som öppnas från länkarna i e-postmeddelanden. Deras länkar pekar på `https://<SERVER_PUBLIC_HOST>` (med `:<PUBLIC_API_PORT>` när den inte är 443), utanför `/api/v1`.

      - Sidorna kör inget JavaScript och läser inte in några externa resurser. De levereras med `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'`.
      - En `GET` visar bara en knapp eller ett formulär, så att en e-postskanner som öppnar länken inte förbrukar den. Ändringen sker vid `POST`: ett formulär som skickas som `application/x-www-form-urlencoded` (en JSON-body accepteras också), med länkens token i ett dolt fält. Ett fält som anges två gånger avvisas.
      - Fel (anropsgränser, ogiltiga fält) är också HTML-sidor, med rubriken ”Request refused” (anropet avvisades) eller, från 500 och uppåt, ”Server error” (serverfel). Bara de fel som upptäcks innan sidan har matchats (ett anropsmål som är för långt eller felformaterat, lagret per adress) får svar i JSON.
