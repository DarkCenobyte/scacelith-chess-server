          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (databasen förblev låst; `retryAfter: 1` i bodyn, ingen `Retry-After`-header), `server_busy` (sessionsuppslaget fann databasen låst), `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Ladda ned ett parti som PGN-fil
      description: |-
        Samma parti som PGN-fil: ett parti med radslut `\n`, och dragtext på rader kortare än 80 kolumner. Svaret är detsamma med eller utan token.

        Taggar, i denna ordning: `Event` (`<SERVER_NAME> rated <category>` eller `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (startdatumet i UTC), `Round`, `White`, `Black`, `Result` (`*` för ett avbrutet parti), `UTCDate` och `UTCTime` (starten), `WhiteElo` och `BlackElo` (ratingtalen vid start, eller `-`), `WhiteRatingDiff` och `BlackRatingDiff` (förändringarna, till exempel `+10` och `-10`, i varje parti med rating, `+0` när ratingreglerna lämnar ratingen oförändrad; ett parti utan rating, ett anpassat parti eller ett avbrutet parti har ingen av dem), `TimeControl` (i sekunder), `Termination` (ett standardvärde i PGN: `normal`; `time forfeit`, flaggan föll, även när partiet slutar remi; `abandoned`; `rules infraction`, ett andra otillåtet drag eller en tilldömd förlust för brott mot rent spel; `unterminated`, ett avbrutet parti), `PlyCount`, `ScacelithGameId` (det decimala id:t).

        Varje drag har `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: den dragande spelarens klocka efter draget och den tid som räknades för draget, i tiondels sekunder (avkortat). Ett värde utelämnas när posten saknar det. Efter sista draget följer avslutningsorsaken i ord, sedan resultatet.

        **Gräns:** `public_read` (per spelare med token, per klient utan).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: PGN-filen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'PGN-texten, i UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: inte ett positivt heltal med högst 16 siffror (under 2^53); `invalid_request`: inte giltig URL-kodning.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: en token skickades och den är inte giltig.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: partiet finns inte.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: gränsen `public_read` eller kontobudgeten.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: bland annat när de sparade dragen inte kan spelas upp till det sparade slutet (servern loggar det).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (databasen förblev låst; `retryAfter: 1` i bodyn, ingen `Retry-After`-header), `server_busy` (sessionsuppslaget fann databasen låst), `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Ladda ned ett parti från den här servern som animerad GIF
      description: |-
        Partiet som animerad GIF. Namnen och ratingtalen är partipostens (ratingtalen vid start, ett raderat konto som `deleted#<id>`), och detsamma gäller resultatet och avslutningen (`Resignation`, `Loss on time`...).

        Kontrollerna görs i denna ordning: `gif_disabled`, bildalternativen (`size`, `orientation`, `delay`, `coords`), parti-id:t, partiet, dess längd.

        **Session krävs:** kvoterna räknas per konto. **Gränser:** `gif` vid varje anrop; `gif_user_min`, `gif_user_hour`, `gif_ip_min` och `gif_ip_hour` endast när GIF:en måste skapas (se avsnittets beskrivelse). **Tidsgräns:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 sekunder (45 sekunder som standard).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: Bildstorleken, `small` (rutor på 32 px), `medium` (48 px) eller `large` (72 px).
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Den sida som visas nederst på brädet.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Millisekunder per drag (1 till 6 siffror, i decimal form).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Om linjernas bokstäver och radernas siffror ritas runt brädet (`1`) eller inte (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` med `field` (`size`, `orientation`, `delay` eller `coords`): ett värde utanför de tillåtna. `invalid_game_id`. `invalid_request`: inte giltig URL-kodning.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: partiet finns inte. `gif_disabled`: servern har stängt av GIF:ar (`GIF_ENABLED=false`; tokenen för `gif` lämnas tillbaka).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: gränsen `gif`, en renderingsgräns, eller kontobudgeten.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF:en kunde inte skapas (servern loggar varför). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` med `retryAfter` (3 till 10 sekunder) och `Retry-After`: renderingskön är full, eller GIF:en väntade `GIF_QUEUE_TIMEOUT_MS` (10 sekunder) på en ledig tråd; varje gränstoken som anropet tog lämnas tillbaka. `busy`: databasen förblev låst (`retryAfter: 1` endast i bodyn). `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Skapa en animerad GIF av valfritt parti som skickas som PGN
      description: |-
        Samma bild som `GET /games/{id}/gif` för valfritt parti som skickas som PGN-text: ett parti som spelet har sparat, en export från en annan webbplats, ett parti som skrivits in för hand. Endast textens första parti används.

        - PGN-läsaren godtar det som spelets egen läsare godtar: varje PGN som den här servern skriver och de vanliga exporterna från andra webbplatser (kommentarer, varianter, NAG:ar och klockannoteringar hoppas över; dragnummer och SAN läses tolerant; en `FEN`-tagg ger startställningen om inte `SetUp` är `"0"`).
        - Namnen och ratingtalen hämtas från taggarna `White`, `Black`, `WhiteElo` och `BlackElo`. Bokstäver med accent förlorar sina accenter, andra tecken utanför utskrivbar ASCII blir `?`, och långa namn kortas av (48 tecken). Resultatet hämtas från taggen `Result`, annars från slutet av dragtexten. Taggen `Termination` visas om den inte är `normal`: slutställningen berättar då vad som hände (schackmatt, patt).
        - Den här endpointen kontrollerar själv sin body: ett okänt fält eller ett `pgn` som saknas eller inte är en sträng ger 400 `invalid_request` med `field`; ett felaktigt alternativ ger 400 `invalid_option` (`delayMs` måste vara ett JSON-tal, `coords` ett booleskt värde; `null` avvisas).

        **Session krävs:** kvoterna räknas per konto. **Gränser:** som för `GET /games/{id}/gif`. **Gräns för bodyn:** 135 168 byte, oavsett `HTTP_BODY_LIMIT` (PGN-texten som JSON-sträng, inklusive dess escape-sekvenser). **Tidsgräns:** 45 sekunder som standard.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Ett kort parti inskrivet för hand, utan koordinater
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: En PGN-fil med alla alternativ
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` med `field` (ett okänt fält, eller `pgn` saknas eller är inte en sträng; utan `field` när bodyn inte är ett objekt); `invalid_json`; `invalid_option` med `field` (`size`, `orientation`, `delayMs` eller `coords`); `invalid_pgn` med `line` och `column` (från 1, kolumner räknade i tecken) och läsarens `message`: ett otillåtet eller tvetydigt drag, en trasig tagg, en okänd variant, mer än 65 536 byte.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: servern har stängt av GIF:ar (`GIF_ENABLED=false`; tokenen för `gif` lämnas tillbaka).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: en body större än 135 168 byte.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: gränsen `gif`, en renderingsgräns, eller kontobudgeten.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF:en kunde inte skapas (servern loggar varför). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` med `retryAfter` (3 till 10 sekunder) och `Retry-After`: renderingskön är full, eller GIF:en väntade för länge på en ledig tråd; varje gränstoken som anropet tog lämnas tillbaka. `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /players/{username}:
    get:
      operationId: getPlayer
      tags:
        - players
      summary: Hämta en spelares offentliga profil
      description: |-
        En spelares offentliga profil: ratingtal i de officiella kategorierna (i serverns ordning) och antal partier. `games.total` räknar alla sparade partier, även partier utan rating och avbrutna partier; `games.rated`, `wins`, `draws` och `losses` summeras över ratingposterna, alltså endast partier med rating. Svaret är detsamma med eller utan token.

        **Gräns:** `public_read` (per spelare med token, per klient utan).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Profilen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
              example:
                username: alice
                createdAt: 1790882839743
                ratings:
                  - category: '3+2'
                    rating: 1510
                    provisional: true
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                games:
                  total: 3
                  rated: 2
                  wins: 1
                  draws: 1
                  losses: 0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`: inte 2 till 24 tecken ur `[A-Za-z0-9_.-]`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: en token skickades och den är inte giltig.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: spelaren finns inte, eller ett raderat konto.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: gränsen `public_read` eller kontobudgeten.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (databasen förblev låst; `retryAfter: 1` i bodyn, ingen `Retry-After`-header), `server_busy` (sessionsuppslaget fann databasen låst), `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /players/{username}/games:
