tags:
  - name: server-info
    x-displayName: Serverinformation
    description: Det en klient behöver veta innan den loggar in eller ansluter.
  - name: health
    x-displayName: Hälsokontroll
    description: |-
      Om servern lever och är redo (liveness och readiness), för övervakning. De svarar på API-porten före autentiseringen och alla gränser per endpoint, men som alla anrop tar de en token från lagret per adress; en övervakningsvärd kan listas i `ABUSE_EXEMPT`. Båda sökvägarna fungerar för varje endpoint: i serverns rot och under `/api/v1`.

      Porten för mätvärden har egna endpoints för hälsokontroll, som beskrivs i inledningen.
  - name: auth
    x-displayName: Registrering och inloggning
    description: |-
      Skapa ett konto, logga in med lösenord (och en andra faktor), e-postmeddelanden för bekräftelse och för återställning av lösenordet.

      `POST /auth/login`, `POST /auth/login/mfa`, `POST /auth/sso/google/finish`, `POST /auth/sso/google/link` och `POST /auth/sso/complete` svarar med en session `{ token, expiresAt, user }` (eller, för de första av dem, ett andra steg).
  - name: google-sign-in
    x-displayName: Google-inloggning
    description: |-
      Erbjuds när `GET /info` anger `sso.google: true`; annars svarar alla endpoints nedan 404 `sso_disabled`. En webbplats loggar in på samma sätt med en egen klient när `sso.googleWeb` är true (nedan, **På en webbplats**). Spelet loggar in via systemets webbläsare med flödet för installerade appar i RFC 8252 (en klient av typen ”Desktop app”): Google skickar tillbaka webbläsaren till en lyssnare i spelet på `127.0.0.1`, aldrig till den här servern, och spelet ser aldrig några inloggningsuppgifter för Google.

      1. Klienten lyssnar på `127.0.0.1:0` (systemet väljer porten) och skapar ett PKCE-par: en `codeVerifier` på 43 till 128 tecken `[A-Za-z0-9._~-]` och `codeChallenge = BASE64URL(SHA-256(codeVerifier))`, som har 43 tecken och ingen utfyllnad.
      2. `POST /auth/sso/google/start` med challengen och porten returnerar Google-URL:en och försökets `state`. Klienten kontrollerar URL:en (se nedan) och öppnar den i webbläsaren.
      3. Google skickar webbläsaren till `http://127.0.0.1:<port>/oauth2/google/<tag>?code=...&state=...`. Klienten accepterar bara den `state` som fanns i startsvaret, och skickar ingenting efter en omdirigering med `error=`.
      4. `POST /auth/sso/google/finish` med försökets id, `codeVerifier`, `state` och `code` (och `iss` när Google skickade det).
      5. Svaret är en session, ett steg för tvåfaktorsautentisering (fortsätt med `POST /auth/login/mfa`), `needsUsername` för en ny spelare (fortsätt med `POST /auth/sso/complete`) eller `needsPassword` när ett konto med lösenord använder adressen (fortsätt med `POST /auth/sso/google/link`).

      **Ursprungstaggen.** Omdirigerings-URI:n innehåller en tagg för den server som spelaren lade till, så att spelet avvisar en URL som en annan server har fått för sina egna spelare. Ursprunget är värden med gemener (en IPv6-literal inom hakparenteser), `:` och API-porten i decimal form, alltid utskriven, även 443: servern använder `SERVER_PUBLIC_HOST` och sin offentliga API-port, spelet den adress som det är anslutet till. Taggen är de första 22 tecknen av base64url (utan utfyllnad) av SHA-256(UTF-8 `"scacelith-sso-origin-v1\n"` + ursprung). Omdirigerings-URI:n är `"http://127.0.0.1:" + port + "/oauth2/google/" + tag`: alltid IPv4-literalen och porten för spelets lyssnare (1024 till 65535). Servern tar aldrig emot en URI, en värd eller en sökväg från klienten.

      | Ursprung | Tagg |
      |---|---|
      | `play.scacelith.example:443` | `IhcScoV7eDOzTEcSnqPUPt` |
      | `localhost:8443` | `TFGx7zQ_8QlGZW5zpqznCr` |
      | `[::1]:8443` | `XToJm0DG5PjciEVmZa9Cho` |
      | `127.0.0.1:50443` | `3r653wM5ZjYsHcAJljmCwY` |

      Google-inloggning fungerar alltså bara för spelare som har lagt till servern med exakt `SERVER_PUBLIC_HOST` och dess offentliga API-port.

      **Vad spelet kontrollerar innan det öppnar webbläsaren.** `authUrl` börjar med exakt `https://accounts.google.com/o/oauth2/v2/auth?` och är utskrivbar ASCII på under 4096 tecken, och dess frågesträng innehåller exakt en `response_type=code`, exakt en `redirect_uri` som är lika med den URI som spelet beräknar utifrån sin port och sin ursprungstagg, exakt en `state` som är lika med svarets `state`, `code_challenge_method=S256` och en `code_challenge` på 43 tecken. Annars stoppar spelet sin lyssnare och öppnar ingenting. Det skickar `finish` och `link` bara till den server som svarade på `start`.

      **På en webbplats.** En webbplats (den officiella: <https://scacelith.com/>) loggar in med en klient av typen ”Web application” i samma Google-projekt (`GOOGLE_WEB_CLIENT_ID`). Google skickar tillbaka webbläsaren till en sida på webbplatsen som operatören har konfigurerat (`GOOGLE_WEB_REDIRECT_URI`, listad under klientens ”Authorized redirect URIs”), och den sidan skickar koden till `finish`; servern tar inte heller här emot någon omdirigerings-URI från klienten.

      1. Sidan skapar ett PKCE-par som ovan, behåller verifiern i fliken (`sessionStorage`) och skickar `POST /auth/sso/google/web/start` med challengen.
      2. Den kontrollerar `authUrl` som spelet gör, förutom att dess `redirect_uri` måste vara en sida i sidans eget ursprung, och navigerar sedan dit. Inget Google-skript läses in.
      3. Google skickar webbläsaren till `GOOGLE_WEB_REDIRECT_URI?code=...&state=...`. Sidan accepterar bara den `state` som fanns i startsvaret och skickar ingenting efter en omdirigering med `error=`.
      4. `finish`, `link` och `complete` följer som för spelet. Försöket kommer ihåg att en webbplats startade det: koden löses in med webbplatsens klient och sida, och ID-tokenen måste ange den klienten (en kod eller ID-token från spelets klient misslyckas med 502 `sso_failed`, och omvänt).

      Ett Google-konto når samma Scacelith-konto från spelet och från webbplatsen: kopplingen innehåller Googles subject (`sub`), som identifierar Google-kontot oavsett klient. Webbplatsens ursprung måste finnas i `CORS_ORIGINS` (annars varnar `check-config`).

      **Vilket konto Google-inloggningen når:** det konto som redan är kopplat till det Google-kontot; annars ett aktivt konto med den adress som Google har bekräftat (med lösenord svarar `finish` med `needsPassword` och kopplingen sparas först när kontots lösenord, och sedan dess andra faktor om den är på, har godkänts; utan lösenord 409 `sso_account_exists`); annars ett nytt konto (`needsUsername`). Ett Google-konto kopplas aldrig till ett befintligt konto enbart på grund av adressen. Kontots adress får ett e-postmeddelande när Google-inloggning skapar ett konto och när den läggs till på ett befintligt konto.
