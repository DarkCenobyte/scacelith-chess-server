        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (kontots misslyckade förnyade autentiseringar), eller `rate_limited` (gränsen `reauth` eller `reauth_user`, kontobudgeten, kön för lösenordshashning).'
        '500':
