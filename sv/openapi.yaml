  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: Radera kontot
      description: |-
        Raderar kontot; det kan inte ångras.

        - Alla sessioner återkallas direkt: tokenen får 401 `invalid_token` från och med då.
        - Användarnamnet blir `deleted#<id>`, i kontot och i varje partipost.
        - Följande raderas: e-postadressen, lösenordshashen, tvåfaktorshemligheten och återställningskoderna, sessionerna och länktoken, kopplingen till Google, fuskskyddets integritetspost och de IP-adresser som sparats med säkerhetshändelser.
        - Ratingtal och partier behålls. Partierna förblir läsbara under det anonyma namnet, och `GET /players/{username}` svarar 404 för det tidigare namnet.

        **Förnyad autentisering:** lösenordet och, med tvåfaktorsautentisering, en kod från autentiseringsappen eller en återställningskod. **Gränser:** `reauth`, sedan `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Kontot är raderat.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (ett konto med enbart Google-inloggning), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (misslyckade förnyade autentiseringar, eller för många prövade koder på det här kontot), eller `rate_limited` (gränsen `reauth` eller `reauth_user`, kontobudgeten, kön för lösenordshashning).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (kön för lösenordshashning, eller databasen förblev låst), `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Lista spelarens partier, filtrerade och sidindelade
      description: |-
        Den inloggade spelarens partier, nyaste först, filtrerade och sidindelade, med antalet partier som matchar filtret. Alla query-parametrar är valfria, och ett tomt värde räknas som utelämnat.

        Sidindelning: skicka föregående sidas `next` som `before`; `next` är `null` på sista sidan. `total` räknar de partier som matchar filtret, över alla sidor.

        **Gräns:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: Ett officiellt kategori-id (`3+2`, eller `3%2B2`), eller `custom` för alla partier med en annan betänketid.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Endast partier med rating (`true`) eller utan rating (`false`).
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Endast de partier som vanns, förlorades eller slutade remi, sett från spelarens sida. Avbrutna partier visas bara utan detta filter.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: En sida av historiken.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` är inget parti-id), `invalid_limit`, eller `invalid_filter` (`category`, `rated` eller `result`), var och en med `field` som anger parametern.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: gränsen `account_games` eller kontobudgeten.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (databasen förblev låst; `retryAfter: 1` i bodyn, ingen `Retry-After`-header), `server_busy` (sessionsuppslaget fann databasen låst), `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /games/{id}:
    get:
      operationId: getGame
      tags:
