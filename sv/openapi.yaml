  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Byt lösenord
      description: |-
        Byter lösenordet. Det nuvarande lösenordet krävs, men ingen andra faktor, inte ens med tvåfaktorsautentisering påslagen. Det nya lösenordet följer registreringens regler (kontrolleras efter det nuvarande lösenordet).

        Bytet har följande effekter, i en enda transaktion (alla eller ingen): det återkallar alla andra sessioner (den här förblir inloggad), avbryter ett väntande byte av e-postadress, gör att kontots länkar för återställning av lösenordet slutar fungera, och skickar ett e-postmeddelande till ägaren.

        **Förnyad autentisering:** endast lösenordet. **Gränser:** `reauth`, sedan `reauth_user`.
