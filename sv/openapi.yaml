      description: |-
        Slår på tvåfaktorsautentisering med en kod från den väntande hemligheten (exakt 6 siffror). Inget lösenord efterfrågas här; det angavs i det första steget (setup). Svaret innehåller 10 återställningskoder, som visas bara denna gång.

        **Gränser:** `reauth`, sedan `reauth_user`; en felaktig kod räknas bland kontots misslyckade förnyade autentiseringar.
