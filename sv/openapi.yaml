paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Hämta serverns namn, versioner, portar och registreringsregler
      description: |-
        Det en klient behöver innan den loggar in eller ansluter: serverns namn och id, WebSocket-protokollets versioner och var WebSocket finns, registreringsreglerna, de officiella betänketiderna och de gränser som en klient kan kontrollera innan den skickar ett formulär.

        **Gränser:** bara lagret per adress.
      security: []
      responses:
        '200':
          description: Serverns beskrivning.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: lagret per adress.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Skapa ett konto
      description: |-
        Skapar ett konto: när dess e-postadress har bekräftats med länken som skickats dit, eller direkt utan e-postbekräftelse.

        **Med e-postbekräftelse** (`REQUIRE_EMAIL_VERIFICATION`, standard): 202 `verification_sent`. Inget konto finns ännu: registreringen väntar i 24 timmar och reserverar under tiden sitt användarnamn. En länk som är giltig i dessa 24 timmar skickas till adressen, högst en per adress var 5:e minut (`POST /auth/verify-email/resend` skickar en ny); kontot skapas, med adressen bekräftad, när länken används (knappen på sidan `/verify-email`), och spelaren kan sedan logga in. Fram till dess ger en inloggning med det användarnamnet svaret `invalid_credentials`, som för ett okänt konto, och den offentliga profilen finns inte. En ny registrering med samma adress ersätter den väntande. Svaret är detsamma när ett annat konto redan använder adressen: då skickas ingen länk, utan kontots ägare får i stället ett meddelande (högst ett per timme), och användarnamnet reserveras på samma sätt, så att ingenting avslöjar om adressen har ett konto. En registrering vars länk inte användes tas bort efter 24 timmar, och dess användarnamn blir ledigt igen.

        **Utan e-postbekräftelse** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, kontot skapas direkt och kan logga in.

        **Regler.** `username`: `USERNAME_MIN` till `USERNAME_MAX` tecken (3 till 20), bokstäver, siffror, `_` och `-`, med en bokstav eller siffra först (`GET /info` anger dem som `limits`); reserverade namn (`admin`, `moderator`, `deleted`...) och vissa prefix avvisas; unikt oavsett versaler och gemener. `email`: trimmas och lagras med gemener, ren ASCII med en domän som innehåller punkt. `password`: minst `PASSWORD_MIN_LENGTH` (10) tecken och högst 256 byte UTF-8; det får inte innehålla användarnamnet eller e-postadressens lokala del och får inte vara ett vanligt lösenord.

        **Fel**, kontrollerade i denna ordning: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; felen från kön för lösenordshashning; 409 `email_taken` (bara utan e-postbekräftelse).

        **Gränser:** `auth`, sedan `auth_register` (10 registreringar per timme per klient). **Proof of work:** alltid, när `POW_REGISTER_BITS` är större än 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Första försöket, utan proof of work
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Skickat igen med proof of work
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Kontot är skapat och kan logga in (ingen e-postbekräftelse på den här servern).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Registreringen väntar på sin bekräftelselänk (eller så har adressen redan ett konto; svaret avslöjar inte vilket).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (med `field`), `invalid_json`, `invalid_username`, `invalid_email` eller `weak_password` med `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` eller `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: registreringen är stängd på den här servern (`GET /info` anger `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: ett konto har användarnamnet, eller så reserveras det av en väntande registrering med en annan adress. `email_taken`: ett annat konto använder adressen (bara utan e-postbekräftelse).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: gränsen `auth` eller `auth_register`, eller kön för lösenordshashning.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (kön för lösenordshashning, eller databasen förblev låst), `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Logga in med lösenord
      description: |-
        Loggar in med ett användarnamn eller en e-postadress och ett lösenord. Det finns två möjliga svar, båda med status 200: en session, eller, när tvåfaktorsautentisering är på, ett andra steg som ska slutföras inom 5 minuter med `POST /auth/login/mfa`.

        Okänt konto, fel lösenord och konto utan lösenord får samma svar, efter samma tid: 401 `invalid_credentials`. Kontrollerna av kontot (`banned`, `email_unverified`) kommer först efter ett korrekt lösenord. Från och med `AUTH_FAILURES_PER_ACCOUNT` (5) misslyckanden på ett inloggningsnamn måste varje försök vänta (429 `too_many_attempts`).

        **Gräns:** `auth`. **Proof of work:** bara under en våg av misslyckade inloggningar (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: En session, eller det andra steget i en inloggning med tvåfaktorsautentisering.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Inloggad
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Tvåfaktorsautentisering är på
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: okänt konto, fel lösenord eller ett konto utan lösenord.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Bara efter ett korrekt lösenord: `banned`, med `until` (Unix-tid i ms, `null` för en permanent avstängning), eller `email_unverified` (ett äldre konto vars adress inte är bekräftad än).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (väntetiden efter misslyckade försök för det här inloggningsnamnet), eller `rate_limited` (gränsen `auth`, kön för lösenordshashning).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (kön för lösenordshashning, eller databasen förblev låst), `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Slutför en inloggning med en andra faktor
      description: |-
        Det andra steget i en inloggning med tvåfaktorsautentisering, efter att `POST /auth/login` eller en Google-inloggning (`POST /auth/sso/google/finish` eller `POST /auth/sso/google/link`) har svarat `mfaRequired`. Skicka `code` (en 6-siffrig kod från autentiseringsappen, eller en återställningskod) eller `recoveryCode`. En återställningskod som används här är förbrukad.

        Ett steg accepterar högst 5 felaktiga koder; steget upphör också när lösenordet återställs eller byts. Efter lösenordssteget i en Google-koppling sparas kopplingen bara när koden godkänns här.

        **Gränser:** `auth`, och högst `AUTH_MFA_PER_ACCOUNT` (10) koder per 15 minuter för kontot, från vilken adress som helst; därutöver kontrolleras inte koden, så att en återställningskod inte förbrukas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: En kod från autentiseringsappen
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: En återställningskod
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Inloggad.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: varken `code` eller `recoveryCode` skickades, eller så bryter bodyn mot schemat; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: steget har gått ut, har använts eller upphörde efter 5 felaktiga koder, eller så har lösenordet återställts eller bytts sedan det första steget (logga in igen). `invalid_code`: en felaktig eller redan använd kod.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (med `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: (bara efter lösenordssteget i en Google-koppling) Google-kontot har under tiden kopplats till ett annat konto.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: (bara efter lösenordssteget i en Google-koppling) kontot har ändrats under tiden; starta inloggningen igen.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: kontots väntetid efter misslyckade försök, eller så är kontots `AUTH_MFA_PER_ACCOUNT` koder för de senaste 15 minuterna förbrukade. `rate_limited`: gränsen `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` med `retryAfter: 1`: databasen förblev låst (efter ett steg i en Google-koppling har ingenting kopplats: starta inloggningen igen). `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Logga ut den här sessionen
      description: |-
        Återkallar sessionen för den token som används. Den WebSocket som öppnades med den stängs. Ingen body (eller `{}`).

        **Gräns:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Utloggad.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: en annan body än `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: gränsen `sessions` eller kontobudgeten.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databasen förblev låst), `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
