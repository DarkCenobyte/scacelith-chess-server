                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                next: 4100000000001
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_cursor` (`before` är inget parti-id), `invalid_limit` (de två sistnämnda utan `field`).'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: en token skickades och den är inte giltig.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: spelaren finns inte, eller ett raderat konto.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: gränsen `public_read` eller kontobudgeten.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (databasen förblev låst; `retryAfter: 1` i bodyn, ingen `Retry-After`-header), `server_busy` (sessionsuppslaget fann databasen låst), `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: Hämta de bästa spelarna i en kategori
      description: |-
        De 100 bästa ratingposterna i en officiell kategori med minst `minGames` (`PROVISIONAL_GAMES`) räknade partier, utan raderade konton och bekräftade fuskare. Servern beräknar varje lista på nytt högst var 10:e sekund; `updatedAt` anger när. En beräkning per kategori körs åt gången: under tiden får de andra anropen den föregående listan, eller väntar på beräkningen när det ännu inte finns någon.

        **Gränser:** endast lagret per adress.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: Ett officiellt kategori-id (`3+2`, eller `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: Hur många spelare, 1 till 100. Ett större tal med upp till 3 siffror räknas som 100; ett tomt värde räknas som utelämnat.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: Listan.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (saknas, eller är ingen officiell kategori), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: lagret per adress.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (databasen förblev låst; `retryAfter: 1` i bodyn, ingen `Retry-After`-header), `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Anmäl motståndaren i ett nyligen spelat parti
      description: |-
        Anmäler motståndaren i ett av spelarens egna partier som avslutades under de senaste 7 dagarna. En anmälan ändrar aldrig i sig en rating, en sanktion eller en integritetsnivå. Den höjer den granskningsprioritet som moderatorerna ser, och, utom för `abuse`, begär den en motoranalys av partiet.

        En anmälan av samma motståndare för samma parti får samma svar och ändrar ingenting; svaret avslöjar aldrig något om det anmälda kontot. `GET /games/{id}` talar i förväg om för partiets spelare om en anmälan skulle tas emot (`reportable`).

        Den här endpointen kontrollerar själv sin body, i ordningen `gameId`, `reported`, `category`, `comment`: ett fel ger 400 `invalid_request` utan `field`. Fält som den inte känner till ignoreras.

        **Gränser:** `reports` (per spelare), sedan `REPORTS_PER_DAY` (5) anmälningar per spelare under 24 timmar (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Anmälan är mottagen (eller var redan inlämnad).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (utan `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: inte anmälarens motståndare i ett parti som avslutades under de senaste 7 dagarna.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, med en `Retry-After`-header): `REPORTS_PER_DAY` anmälningar under de senaste 24 timmarna. `rate_limited`: gränsen `reports` eller kontobudgeten.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (sessionsuppslaget fann databasen låst), `timeout`. Även `server_busy` med `retryAfter` 2 till 5 när servern ligger långt efter (se inledningen): anropet kördes inte.'
