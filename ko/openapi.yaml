          description: '`server_busy`(데이터베이스가 계속 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: 확인 링크 다시 보내기
      description: |-
        이메일 확인 링크를 다시 보냅니다. 주소와 관계없이 응답은 202 `accepted`이므로, 그 주소를 계정이나 가입 신청이 사용하는지는 절대 드러나지 않습니다.

        요청은 주소당 5분에 최대 한 번만 동작합니다. 그 주소로 대기 중인 가입 신청은 다른 계정이 그 주소를 사용하든 아니든 24시간을 새로 얻으므로, 어느 경우든 사용자 이름이 같은 기간 동안 선점됩니다. 링크는 주소에 계정이 없을 때의 그 가입 신청(24시간 유효한 새 링크가 이전 링크를 대체), 또는 그 주소를 가진 확인되지 않은 활성 계정에 대해서만 발송됩니다.

        **제한:** `auth`, 그다음 `auth_mail`(클라이언트당 시간당 10회).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: 접수되었습니다(주소와 관계없음).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth` 또는 `auth_mail` 제한(주소와 관계없음).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`retryAfter: 1`인 `server_busy`: 계정을 조회하거나 확인되지 않은 계정의 링크를 저장하는 동안 데이터베이스가 계속 잠겨 있었습니다(대기 중인 가입 신청의 갱신은 가능한 범위에서만 수행되며 요청을 실패시키지 않음). 그래도 그 주소의 5분은 시작되므로, 그 안에 보낸 새 요청은 아무 일도 하지 않습니다. `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: 비밀번호 재설정 링크 보내기
      description: |-
        한 시간 동안 유효하며 `/reset-password` 페이지를 여는 비밀번호 재설정 링크를 보냅니다. 주소와 관계없이 응답은 202 `accepted`입니다. 링크는 활성 계정에만, 주소당 5분에 최대 한 번 발송됩니다. Google 전용 계정은 이 방법으로 첫 비밀번호를 설정합니다.

        비밀번호 찾기에는 API에서 가장 엄격한 제한이 적용되며, 모두 서버 전체 기준으로 집계됩니다. 클라이언트(IPv4 주소 또는 IPv6 /64)당 시간당 3회(`AUTH_FORGOT_PER_HOUR`)와 24시간당 10회(`AUTH_FORGOT_PER_DAY`), IPv6 /48당 그 3배이며, 여기에 `auth` 제한(10분당 20회)과 주소당 5분에 메일 한 통 제한이 더해집니다. 202로도 429로도 그 주소를 사용하는 계정이 있는지 알 수 없습니다. 새 비밀번호 설정에는 별도의 제한(`auth_reset`)이 있습니다.

        **제한:** `auth`, `auth_forgot`, 그다음 `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: 접수되었습니다(주소와 관계없음).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth`, `auth_forgot` 또는 `auth_forgot_day` 제한(주소와 관계없음).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`retryAfter: 1`인 `server_busy`: 계정을 조회하거나 링크를 저장하는 동안 데이터베이스가 계속 잠겨 있었습니다. 그래도 그 주소의 5분은 시작되므로, 그 안에 보낸 새 요청은 링크를 보내지 않습니다. `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: 재설정 링크의 토큰으로 새 비밀번호 설정
      description: |-
        재설정 링크의 토큰으로 새 비밀번호를 설정합니다(`/reset-password` 페이지도 같은 일을 합니다). 새 비밀번호에는 가입 규칙이 적용됩니다.

        재설정은 하나의 트랜잭션 안에서(전부 적용되거나 하나도 적용되지 않음) 다음 효과를 냅니다. 모든 세션을 폐기하고 대기 중인 이메일 변경을 취소합니다. 계정의 다른 재설정 링크는 더 이상 동작하지 않습니다. 주소는 확인된 것으로 간주됩니다(링크가 증명함). 계정 주인에게 메일이 발송됩니다. 2단계 인증은 건드리지 않습니다. 비밀번호 해시 대기열 오류, 503, 500 뒤에는 아무것도 변경되지 않은 것입니다. 기존 비밀번호와 세션이 유지되고 링크도 계속 유효합니다.

        **제한:** `auth`, 그다음 `auth_reset`(클라이언트당 시간당 10회, IPv6 /48당 30회, 페이지와 공유: 시도할 때마다 비밀번호를 해시함).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: 비밀번호가 변경되었고 모든 세션이 로그아웃되었습니다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: 링크가 유효하지 않거나, 이미 사용되었거나, 만료되었거나, 계정이 더 이상 사용하지 않는 주소로 발송된 링크입니다. `weak_password`(`reason` 포함). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth` 또는 `auth_reset` 제한, 또는 비밀번호 해시 대기열.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: 비밀번호 해시 대기열, 또는 데이터베이스가 계속 잠겨 있었음(`retryAfter: 1`, 아무것도 변경되지 않음). `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Google 로그인 시작
      description: |-
        PKCE 챌린지와 `127.0.0.1`에서 대기하는 게임 리스너의 포트로 Google 로그인 시도를 시작합니다. 응답은 시스템 브라우저에서 열 Google URL과 이 시도의 `state`를 알려 주며, 시도는 10분 동안 유효합니다.

        `authUrl`에는 `client_id`, `redirect_uri`(`redirectPort`와 서버의 오리진 태그로 만듦), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge_method=S256`과 함께 `code_challenge`(서버가 Google용으로 가진 자체 검증자의 S256), `prompt=select_account`가 들어 있습니다. 게임은 이 URL을 열기 전에 검사합니다(태그 설명 참조).

        **제한:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: 시도.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: 이 서버는 Google 로그인을 제공하지 않습니다.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `sso_start` 제한.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`(데이터베이스가 계속 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: 웹사이트에서 Google 로그인 시작
      description: |-
        웹사이트 페이지의 PKCE 챌린지로 웹사이트의 Google 로그인 시도를 시작합니다. 응답은 게임의 경우와 같습니다. 이동할 Google URL과 이 시도의 `state`이며, 시도는 10분 동안 유효합니다. `GET /info`가 `sso.googleWeb: true`를 알려 줄 때 제공됩니다.

        `authUrl`에는 웹사이트의 `client_id`와 `redirect_uri=GOOGLE_WEB_REDIRECT_URI`가 들어 있으며, 그 밖의 매개변수는 게임과 같습니다. 페이지는 이 URL로 이동하기 전에 검사합니다(태그 설명의 **웹사이트에서** 참조).

        **제한:** `sso_start`(게임의 시작과 공유).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: 시도.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `codeChallenge`가 없거나 형식이 잘못되었거나, 그 밖의 필드(`redirectPort` 포함)가 있습니다.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: 이 서버는 Google 로그인을 제공하지 않거나, 웹사이트에는 제공하지 않습니다.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `sso_start` 제한(게임의 시작과 공유).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`(데이터베이스가 계속 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Google의 응답을 서버에 전달
      description: |-
        Google이 게임의 리스너나 웹사이트의 페이지로 보낸 `code`와 `state`를 시도 ID 및 PKCE 검증자와 함께 서버에 전달합니다. 시도 ID는 검증자가 없으면 쓸모가 없고, 코드는 서버 자체의 PKCE 검증자와 클라이언트 시크릿이 없으면 쓸모가 없습니다.

        서버는 시도를 확인하고(알 수 없거나, 이미 사용되었거나, 만료되었으면 410), 이어서 검증자를 확인하며(틀린 검증자는 시도를 계속 사용할 수 있는 상태로 둠), 그다음 시도를 한 번 사용하고, `state`와 `iss`를 확인하고, Google과 코드를 교환하고, ID 토큰을 검증합니다. 응답(200)은 다음 중 하나입니다:

        - `{ token, expiresAt, user }`: 연결된 계정에 로그인됨.
        - `{ mfaRequired, mfaToken, expiresIn }`: `POST /auth/login/mfa`로 계속.
        - `{ needsUsername, ssoTicket, suggestedUsername }`: 새 계정. 10분 안에 `POST /auth/sso/complete`로 계속. `suggestedUsername`은 Google 이름이나 주소에서 만들며, 알맞은 것이 없으면 `""`입니다.
        - `{ needsPassword, linkTicket, username, expiresIn }`: 그 주소를 가진 계정에 비밀번호가 있음. `POST /auth/sso/google/link`로 계속. 아직 아무것도 연결되지 않았습니다.

        **제한:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: 세션, 두 번째 단계, 또는 첫 Google 로그인의 다음 단계.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: 연결된 계정에 로그인됨
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: 2단계 인증이 켜져 있음
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: 새 플레이어
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: 비밀번호가 있는 계정이 그 주소를 사용 중
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: 검증자가 시도의 챌린지와 일치하지 않습니다(시도는 계속 사용할 수 있음). `sso_email_unverified`: Google이 그 주소를 확인하지 않았습니다. `registration_closed`. `account_disabled`. 연결된 계정에만 해당: `banned`(`until` 포함), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: 이 서버는 Google 로그인을 제공하지 않습니다.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: 비밀번호가 없는 활성 계정이 그 주소를 사용하고 있습니다(어떤 계정인지는 알려 주지 않음).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: 알 수 없거나 이미 사용되었거나 만료된 시도.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `sso_finish` 제한.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`(데이터베이스가 계속 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: 비밀번호로 기존 계정에 Google 연결
      description: |-
        `finish`가 `needsPassword`로 응답한 뒤에 사용합니다: 게임에서 입력한 기존 계정의 비밀번호로 그 계정에 Google을 연결합니다. 응답(200)은 세션(연결이 저장되고 플레이어가 로그인됨)이거나, 2단계 인증이 켜져 있으면 `{ mfaRequired, mfaToken, expiresIn }`입니다. 이 경우 `POST /auth/login/mfa`로 계속하며, 거기서 코드가 통과해야만 연결이 저장됩니다.

        비밀번호가 틀려도 티켓은 계속 사용할 수 있으며, 모두 합쳐 5번까지 시도할 수 있습니다. 시도 횟수는 비밀번호를 확인하기 직전에 차감됩니다. 429 `too_many_attempts`나 428 `pow_required`는 시도 횟수를 차감하지 않지만, 비밀번호 해시 대기열에 의한 거부(503 `server_busy`, 429 `rate_limited`)는 이미 한 번을 차감했으며 계정의 실패로 계산됩니다. 실패 대기 시간은 `POST /auth/login`과 같은 카운터를 사용합니다.

        **제한:** `auth`(IPv6 /48 단위 집계 포함). **작업 증명:** `POST /auth/login`과 같습니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: 세션, 또는 로그인의 두 번째 단계.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: 틀린 비밀번호. 티켓은 유지되며, 모두 합쳐 5번까지 시도할 수 있습니다.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned`(`until` 포함). 비밀번호가 맞은 경우에만 해당합니다.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: 이 서버는 Google 로그인을 제공하지 않습니다.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: 그사이에 Google 계정이 다른 계정에 연결되었습니다.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: 알 수 없거나 이미 사용되었거나 만료된 티켓, 5번째로 틀린 비밀번호, `finish` 이후 상태나 주소가 바뀐 계정, 또는 연결을 저장하는 동안 상태, 주소, 비밀번호, 2단계 인증 중 하나가 바뀐 계정. 로그인을 처음부터 다시 시작하세요.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`(계정의 실패 대기 시간) 또는 `rate_limited`(`auth` 제한, 비밀번호 해시 대기열).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: 비밀번호 해시 대기열, 또는 데이터베이스가 계속 잠겨 있었음(`retryAfter: 1`, 아무것도 연결되지 않음). `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: 첫 Google 로그인으로 계정 만들기
      description: |-
        `finish`가 `needsUsername`으로 응답한 뒤에 사용합니다: 선택한 사용자 이름으로 계정을 만들고(가입 규칙이 적용됨) 로그인시킵니다. 이 계정에는 비밀번호가 없습니다: `hasPassword`는 `false` 값이며, “비밀번호를 잊으셨나요?”(`POST /auth/password/forgot`)로 비밀번호를 설정할 수 있습니다.

        **제한:** `auth`(IPv6 /48 단위 집계 포함).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: 계정이 생성되고 로그인되었습니다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: 이 서버는 Google 로그인을 제공하지 않습니다.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`(어떤 계정이 이 사용자 이름을 쓰고 있거나, 다른 주소의 대기 중인 가입 신청이 이 이름을 선점하고 있음), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: 알 수 없거나 이미 사용되었거나 만료된 티켓.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth` 제한.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`(데이터베이스가 계속 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: 로그인된 기기 목록 조회
      description: |-
        계정의 활성 세션(로그인된 기기)을 가장 최근에 사용한 것부터 반환합니다. `current`는 요청을 보낸 세션을 표시합니다. `lastSeenAt`은 최대 5분에 한 번 갱신되며(서버 처리가 크게 밀려 있는 동안에는 더 늦게), `expiresAt`은 절대 만료 시각이고, 유휴 기한에 따라 세션이 그보다 일찍 끝날 수 있습니다.

        **제한:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 활성 세션.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
