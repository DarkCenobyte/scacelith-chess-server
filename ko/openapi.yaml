        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: '`page` 제한(HTML 페이지) 또는 주소별 계층(JSON `rate_limited`).'
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
    post:
      operationId: submitResetPasswordPage
      tags:
        - pages
      summary: 재설정 양식으로 새 비밀번호 설정
      description: |-
        재설정 페이지의 양식. `POST /auth/password/reset`과 같은 일을 하나의 트랜잭션에서 수행합니다: 모든 기기가 로그아웃되고, 대기 중인 이메일 변경이 취소되며, 다른 재설정 링크는 더 이상 쓸 수 없게 되고, 주소는 확인된 것으로 간주되며, 소유자에게 메일이 갑니다.

        먼저 링크를 검사하고, 그다음 두 비밀번호가 같은지, 그다음 비밀번호 규칙을 검사합니다. 서버가 바쁘면 `Retry-After`와 함께 양식이 다시 표시되며, 링크는 계속 유효합니다.

        **제한:** `auth`, 그다음 `auth_reset`(`POST /auth/password/reset`과 공유).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: 비밀번호가 변경되었고, 모든 기기가 로그아웃되었습니다.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: 오류와 함께 다시 표시된 양식(비밀번호가 서로 다름, 약한 비밀번호), 유효하지 않은 링크 또는 유효하지 않은 양식(HTML 페이지).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: '`auth` 또는 `auth_reset` 제한(HTML 페이지), 이 클라이언트의 대기 중인 비밀번호 해시가 너무 많을 때 `Retry-After`와 함께 다시 표시되는 양식(링크는 계속 유효함), 또는 주소별 계층(JSON `rate_limited`).'
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: '서버가 바쁠 때(비밀번호 해시 대기열, 또는 데이터베이스가 계속 잠겨 있음) `Retry-After`와 함께 다시 표시되는 양식. 링크는 계속 유효합니다. 서버 처리가 크게 밀려 있을 때는(소개 참조) 대신 `Retry-After`(2~5)가 포함된 “Server error”(서버 오류) 페이지: 아무것도 실행되지 않았으며 링크는 계속 유효합니다. 핸들러 타임아웃 시에도 이 상태로 응답합니다.'
