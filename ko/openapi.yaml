          description: '데이터베이스가 계속 잠겨 있었거나(`Retry-After: 1`) 서버 처리가 크게 밀려 있음(`Retry-After` 2~5, 소개 참조): 아무것도 바뀌지 않았으며 링크는 여전히 유효합니다. 핸들러 타임아웃 시에도 이 상태로 응답합니다.'
