        '503':
          description: 서버가 시작 중이거나 종료 중입니다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        로그인 응답으로 받은 세션 토큰(`sct_` 뒤에 base64url 문자 43개)을 `Authorization` 헤더에 넣습니다: `Authorization: Bearer <token>`. 접두사는 정확히 `Bearer`(대소문자 구분)와 공백 하나입니다. 접두사가 없는 값, 또는 출력 가능한 ASCII 문자 1~512자가 아닌 토큰에는 다른 유효하지 않은 토큰과 마찬가지로 401 `invalid_token`으로 응답합니다. 빈 헤더는 헤더가 없는 것으로 간주합니다.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: '게임 id: 앞에 0이 없는 16자리 이하의 양의 십진 정수이며, 2^53 미만입니다.'
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: '`GET /auth/sessions`가 제공하는 세션 id. 앞에 0을 붙이지 않고 씁니다(`03`은 세션 3이 아님).'
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: 플레이어의 사용자 이름(대소문자 구분 없음). 서버는 `[A-Za-z0-9_.-]`로 된 2~24자의 이름이면 무엇이든 받아들입니다(지금까지 허용한 규칙 중 가장 넓은 규칙).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: 게임 id. 이보다 오래된 게임만 나열됩니다. 이전 페이지의 `next`를 전달하세요. 빈 값은 없는 것으로 간주합니다.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: 페이지 크기(1~50). 3자리 이하의 더 큰 수는 50으로 간주하며, 빈 값은 없는 것으로 간주합니다.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: 이메일 링크의 토큰(base64url 문자 43개). 없거나 잘못되면 “link invalid or expired”(링크가 유효하지 않거나 만료됨) 페이지가 표시됩니다.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: 서버의 모든 응답은 캐싱을 금지합니다.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: 다시 시도하기 전에 기다릴 시간(초). 본문의 `retryAfter`와 같은 값입니다.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Bearer 인증 챌린지. 유효하지 않은 토큰이면 `error="invalid_token"`이 포함됩니다.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: 서버는 이 응답 후 연결을 닫습니다.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request`(본문의 필드에 문제가 있으면 `field` 포함) 또는 `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: 필드가 스키마를 위반함
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: 본문이 JSON이 아님
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: 약한 비밀번호
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: 읽을 수 없는 PGN
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized`(`Authorization` 헤더 없음) 또는 `invalid_token`(토큰 형식이 잘못되었거나, 만료되었거나, 폐기되었거나, 삭제된 계정의 토큰임).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: 세션 없음
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: 유효하지 않은 토큰
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: 요청이 거부되었습니다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: 재인증 시 틀린 비밀번호
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: 정지된 계정
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found`, 또는 이 서버가 끈 기능.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: 본문이 10초 안에 도착하지 않았습니다. 서버는 연결을 닫습니다.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: 요청이 서버의 상태와 충돌합니다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: Google 로그인 시도나 티켓을 알 수 없거나, 이미 사용되었거나, 만료되었습니다. 로그인을 처음부터 다시 시작하세요.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: 본문이 `HTTP_BODY_LIMIT`(기본값 16,384바이트)을 초과했습니다. 서버는 연결을 닫습니다.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: 요청 대상이 4096자를 넘었습니다.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: 본문이 `application/json`이 아니거나, charset이 UTF-8이 아닙니다.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: 게임의 반수가 `GIF_MAX_PLIES`(600)개를 넘습니다.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: `pow` 챌린지를 풀고 `pow: { challenge, nonce }`를 넣어 같은 요청을 다시 보내세요. 이유는 `reason`에 나옵니다: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` 또는 `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited`(속도 제한, 계정 할당량 또는 비밀번호 해시 대기열) 또는 `too_many_attempts`(계정 단위 시도 제한). `retryAfter`와 `Retry-After` 헤더가 포함됩니다.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: 속도 제한
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: 이 계정의 실패가 너무 많음
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: 예기치 않은 오류. 서버가 로그에 기록합니다.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: `state`나 `iss`가 잘못되었거나, Google이 코드를 거부했거나 검증되지 않는 ID 토큰을 보냈습니다(다른 클라이언트, 즉 게임 클라이언트나 웹사이트 클라이언트의 코드나 ID 토큰인 경우 포함). Google의 문구는 절대 포함되지 않습니다.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` 또는 `timeout`: `retryAfter`가 주어지면 그 시간이 지난 뒤 다시 시도하세요.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: 서버가 바쁨
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: 데이터베이스가 계속 잠겨 있음(읽기)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: 서버가 너무 오래 걸림
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: 첨부 파일 형태의 애니메이션 GIF.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '이 서버의 게임이면 `attachment; filename="scacelith-<id>.gif"`, `POST /gif`로 보낸 PGN이면 `attachment; filename="scacelith-game.gif"`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: 파일 크기(바이트).
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: HTML 페이지.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: 거부 이유를 설명하는 HTML 페이지.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: 양식이 10초 안에 도착하지 않았습니다(HTML 페이지). 서버는 연결을 닫습니다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: 충돌을 설명하는 HTML 페이지.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: 양식이 `HTTP_BODY_LIMIT`을 초과했습니다(HTML 페이지). 서버는 연결을 닫습니다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: 본문이 양식(`application/x-www-form-urlencoded`)도 JSON도 아니거나, charset이 UTF-8이 아닙니다(HTML 페이지).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: 속도 제한(HTML 페이지). `Retry-After`가 포함됩니다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: 예기치 않은 오류(제목이 “Server error”(서버 오류)인 HTML 페이지). 서버가 로그에 기록합니다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: 서버가 바쁘거나(데이터베이스가 계속 잠겨 있었거나 서버 처리가 크게 밀려 있음. `Retry-After` 포함) 너무 오래 걸렸습니다(제목이 “Server error”(서버 오류)인 HTML 페이지).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: JSON API의 모든 오류 응답이 따르는 단일 형식.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: '`snake_case` 오류 코드. 클라이언트는 이 코드를 보고 무엇을 표시할지 정합니다.'
          examples:
            - rate_limited
        message:
          type: string
          description: 로그용이자 대체 표시용인 영어 문장.
        retryAfter:
          type: integer
          minimum: 1
          description: 다시 시도하기 전에 기다릴 시간(초). 시간이 지나면 풀리는 거부에만 있습니다. 이때 응답에는 같은 값의 `Retry-After` 헤더도 포함됩니다. 단, 게임 기록, 게임, 플레이어, 리더보드 조회의 503 `busy`는 예외입니다.
        field:
          type: string
          description: 문제가 된 필드 또는 쿼리 매개변수(`invalid_request`, `invalid_option`, 그리고 `GET /account/games`의 `invalid_cursor`, `invalid_limit`, `invalid_filter`). 중첩된 필드는 점으로 연결합니다(`pow.nonce`).
        reason:
          type: string
          description: '이유: `weak_password`가 위반한 규칙, 또는 작업 증명을 요구하거나 거부한 이유(`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: '`banned`에만 해당: 정지가 끝나는 시각(에포크 밀리초). 영구 정지면 `null`.'
        line:
          type: integer
          minimum: 1
          description: '`invalid_pgn`에만 해당: 오류가 난 줄(1부터 시작).'
        column:
          type: integer
          minimum: 1
          description: '`invalid_pgn`에만 해당: 오류가 난 열(1부터 시작, 문자 단위).'
    PowChallenge:
      type: object
      description: 작업 증명 챌린지(428 `pow_required`의 `pow`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: 서명된 챌린지. 그대로 다시 보내야 합니다.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: '`SHA-256(challenge + ":" + nonce)`가 가져야 하는 선행 0 비트의 수.'
        expiresAt:
          type: integer
          format: int64
          description: 챌린지가 만료되는 시각(에포크 밀리초). 발급 2분 후입니다.
    PowAnswer:
      type: object
      description: 작업 증명 챌린지에 대한 답.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: 428 응답의 `challenge`를 받은 그대로.
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: '`SHA-256(challenge + ":" + nonce)`가 0 비트 `bits`개로 시작하게 만드는, 20자리 이하의 십진수 문자열.'
    ServerInfo:
      type: object
      description: 클라이언트가 로그인하거나 접속하기 전에 필요한 정보.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: 서버 이름(`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: 데이터베이스가 처음 시작할 때 받는 UUID. 재시작해도 바뀌지 않습니다. 데이터베이스가 제공할 수 없으면 `null`입니다.
        motd:
          type: string
          description: 오늘의 메시지(`SERVER_MOTD`). 비어 있을 수 있습니다.
        protocol:
          type: object
          description: WebSocket 프로토콜(`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: 서버가 지원하는 가장 오래된 프로토콜 버전.
            max:
              type: integer
              minimum: 1
              description: 서버가 지원하는 가장 새로운 프로토콜 버전.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: '프로토콜 스키마의 지문(정규 형식의 SHA-256 중 처음 4바이트를 부호 없는 정수로 나타낸 값. 프로토콜 마이너 버전 2에서는 `0xc649140f`, 즉 3326678031). 참고용이며 비교에 쓰이지 않습니다.'
            subprotocol:
              type: string
              description: WebSocket 하위 프로토콜 토큰(`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: 플레이어가 사용하는 WebSocket 포트(`PUBLIC_WS_PORT`, 없으면 `WS_PORT`, 그것도 없으면 `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: WebSocket 경로.
        registration:
          type: string
          enum:
            - open
            - closed
          description: 새 계정을 만들 수 있는지 여부.
        emailVerification:
          type: boolean
          description: 새 계정이 주소를 확인해야 하는지 여부(`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: 게임 앱에 Google 로그인을 제공하는지 여부.
            googleWeb:
              type: boolean
              description: 웹사이트에도 Google 로그인을 제공하는지 여부(`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: 2단계 인증은 항상 사용할 수 있습니다.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: 가입에 필요한 작업 증명 비트 수(필요 없으면 0).
        categories:
          type: array
          description: 공식(레이팅) 시간 제한(`RATED_CATEGORIES`), 서버의 순서대로. 그 밖의 시간 제한은 모두 `custom`입니다.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: 클라이언트가 양식을 보내기 전에 확인할 수 있는 규칙.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: 사용자 이름의 최소 길이(`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: 사용자 이름의 최대 길이(`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: 새 사용자 이름이 일치해야 하는 정규식.
            passwordMinLength:
              type: integer
              description: 비밀번호의 최소 길이, 문자 수 기준(`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: 비밀번호의 최대 길이, UTF-8 바이트 기준.
            customTimeControls:
              type: boolean
              description: 도전과 비공개 게임에서 사용자 지정 시간 제한을 쓸 수 있는지 여부.
            reportsPerDay:
              type: integer
              description: 플레이어가 24시간당 할 수 있는 신고 수(`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: 클라이언트가 보낼 수 있는 가장 큰 WebSocket 메시지 크기(바이트).
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: 공식 시간 제한.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 카테고리 id. 분과 초 단위 추가 시간으로 이루어집니다(`3+2`).
        baseSec:
          type: number
          minimum: 0
          description: 기본 시간(초).
        incSec:
          type: number
          minimum: 0
          description: 수마다 더해지는 추가 시간(초).
    AccountView:
      type: object
      description: 플레이어 본인에게 보이는 계정(로그인 응답과 `GET /account/me`의 `user`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: 계정 id.
        username:
          type: string
          description: 사용자 이름.
        email:
          type: string
          format: email
          description: 이메일 주소.
        emailVerified:
          type: boolean
          description: 주소가 확인되었는지 여부.
        mfaEnabled:
          type: boolean
          description: 2단계 인증이 켜져 있는지 여부.
        googleLinked:
          type: boolean
          description: Google 계정이 연결되어 있는지 여부.
        hasPassword:
          type: boolean
          description: 'Google을 통해 만들어졌고 아직 비밀번호를 설정하지 않은 계정이면 `false`.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: 이름으로 보내는 직접 도전을 받는지 여부(`PUT /account/preferences` 참조).
        createdAt:
          type: integer
          format: int64
          description: 계정이 생성된 시각(에포크 밀리초).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: 마지막 로그인 시각(에포크 밀리초) 또는 `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: 링크 확인을 기다리는 이메일 변경의 새 주소, 또는 `null`.
    SessionAnswer:
      type: object
      description: 새 세션.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: '`Authorization` 헤더와 WebSocket에 쓰는 세션 토큰.'
        expiresAt:
          type: integer
          format: int64
          description: 세션의 절대 만료 시각(에포크 밀리초). 유휴 기한에 따라 그보다 일찍 끝날 수 있습니다.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: 2단계 인증을 사용하는 로그인의 두 번째 단계. `POST /auth/login/mfa`로 이어서 진행하세요.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: 이 단계의 토큰. `POST /auth/login/mfa`에 사용합니다.
        expiresIn:
          type: integer
          const: 300
          description: 이 단계를 완료하기까지 남은 시간(초).
    LoginAnswer:
      description: 세션, 또는 2단계 인증을 사용하는 로그인의 두 번째 단계.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: 첫 Google 로그인. `POST /auth/sso/complete`로 이어서 진행하세요.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: '`POST /auth/sso/complete`에 쓰는 티켓. 10분 동안 유효합니다.'
        suggestedUsername:
          type: string
          description: Google 이름이나 주소로 만든 사용자 이름. 알맞은 이름이 없으면 `""`.
    SsoNeedsPassword:
      type: object
      description: 비밀번호가 있는 계정이 이 주소를 사용하고 있습니다. `POST /auth/sso/google/link`로 이어서 진행하세요. 아직 아무것도 연결되지 않았습니다.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: '`POST /auth/sso/google/link`에 쓰는 티켓.'
        username:
          type: string
          description: 그 계정의 사용자 이름(Google에 이 주소의 소유를 증명한 사람만 볼 수 있음).
        expiresIn:
          type: integer
          const: 600
          description: 티켓이 유효한 시간(초).
    SsoFinishAnswer:
      description: '`POST /auth/sso/google/finish`의 응답.'
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Google 로그인 시도.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: 시도. `POST /auth/sso/google/finish`에 사용합니다.
        authUrl:
          type: string
          format: uri
          description: 확인을 거친 뒤 시스템 브라우저에서 열 Google URL.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Google이 돌려보내야 하는 `state`.
        expiresIn:
          type: integer
          const: 600
          description: 시도가 유효한 시간(초).
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: 사용자 이름. 그다음 서버의 규칙이 적용됩니다(설명 참조).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: 이메일 주소. 앞뒤 공백을 제거하고 소문자로 저장합니다.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: 비밀번호. 그다음 비밀번호 규칙이 적용됩니다.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: 사용자 이름 또는 이메일 주소(`@`가 들어간 모든 텍스트).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: '선택 사항. 로그인된 기기 목록에 표시됩니다(예: `Scacelith 1.4 (Windows)`).'
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: 로그인 응답(또는 Google 로그인 응답)의 `mfaToken`.
        code:
          type: string
          maxLength: 32
          description: 선택 사항. 6자리 인증 앱 코드 또는 복구 코드.
        recoveryCode:
          type: string
          maxLength: 32
          description: 선택 사항. 복구 코드. `code`와 `recoveryCode` 중 하나가 필요합니다.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: 이메일 주소.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: 재설정 링크의 `token` 매개변수.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: 새 비밀번호. 가입 시의 비밀번호 규칙이 적용됩니다.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: 클라이언트 `codeVerifier`의 S256 PKCE 챌린지(`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: '`127.0.0.1`에서 대기하는 클라이언트 리스너의 포트.'
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: 페이지 `codeVerifier`의 S256 PKCE 챌린지(`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`POST /auth/sso/google/start`의 `attemptId`.'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: PKCE 검증자(verifier). 그 SHA-256이 `start`에 준 챌린지와 일치해야 합니다.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Google이 돌려보낸 그대로의 `state`.
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: Google이 돌려보낸 그대로의 `code`(공백 없는 출력 가능한 ASCII).
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: 선택 사항. Google이 돌려보낸 그대로의 `iss`(돌려보낸 경우).
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`finish`의 `linkTicket`. 10분 동안 유효합니다.'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: 계정의 비밀번호.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`finish`의 `ssoTicket`. 10분 동안 유효합니다.'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: 사용자 이름. 가입 규칙이 적용됩니다.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: 활성 세션. 가장 최근에 사용한 것부터.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: 활성 세션(로그인된 기기).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: '`DELETE /auth/sessions/{id}`에 쓰는 세션 id.'
        createdAt:
          type: integer
          format: int64
          description: 로그인 시각(에포크 밀리초).
        lastSeenAt:
          type: integer
          format: int64
          description: 마지막 사용 시각(에포크 밀리초). 최대 5분에 한 번 갱신됩니다(서버 처리가 크게 밀려 있는 동안에는 더 늦게).
        expiresAt:
          type: integer
          format: int64
          description: 절대 만료 시각(에포크 밀리초). 유휴 기한에 따라 세션이 그보다 일찍 끝날 수 있습니다.
        clientLabel:
          type:
            - string
            - 'null'
          description: 로그인 시 보낸 `clientLabel`. 보내지 않았으면 `null`.
        current:
          type: boolean
          description: 요청을 보낸 세션인지 여부.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: 플레이어가 레이팅 게임을 둔 카테고리마다 기록 하나.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: 적용 중인 제재.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '정지된 동안에는 `{ until }`, 그렇지 않으면 `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: 한 카테고리의 레이팅 기록.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: 카테고리 id.
        rating:
          type: integer
          description: 레이팅.
        games:
          type: integer
          minimum: 0
          description: 이 카테고리에서 둔 게임 수(집계 여부와 관계없이).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: 도달한 최고 레이팅.
        provisional:
          type: boolean
          description: '레이팅이 아직 미산정 상태이거나 집계된 게임이 `PROVISIONAL_GAMES`판 미만인 동안 `true`(게임 앱에서는 `1510?`처럼 표시됨).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: 제재 종류.
        reason:
          type:
            - string
            - 'null'
          description: 제시된 사유(있는 경우).
        startsAt:
          type: integer
          format: int64
          description: 시작 시각(에포크 밀리초).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: 종료 시각(에포크 밀리초). 영구 제재면 `null`.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 정지가 끝나는 시각(에포크 밀리초). 영구 정지면 `null`.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '이름으로 보내는 직접 도전을 받으려면 `all`, 거절하려면 `none`.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: 현재 비밀번호.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: 새 비밀번호. 가입 시의 비밀번호 규칙이 적용됩니다.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: 계정의 비밀번호.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: 대기 중인 비밀 키의 코드. 정확히 6자리.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: 계정의 비밀번호.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: 선택 사항. 2단계 인증이 켜져 있으면 필요합니다(또는 `recoveryCode`). 인증 앱 코드 또는 복구 코드.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: 선택 사항. 복구 코드(`xxxx-xxxx-xx`. 대소문자, 공백, 대시는 상관없음).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: 계정의 비밀번호.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: 인증 앱 코드(복구 코드는 거부됨).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: 새 주소. 앞뒤 공백을 제거하고 소문자로 바꾼 뒤, 가입 시 주소와 같은 방식으로 검사합니다.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: 계정의 비밀번호.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: 선택 사항. 2단계 인증이 켜져 있으면 필요합니다(또는 `recoveryCode`). 인증 앱 코드 또는 복구 코드.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: 선택 사항. 복구 코드.
    TotpSetup:
      type: object
      description: 인증 앱용 대기 중인 비밀 키.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: 앱에 입력할 base32 형식의 비밀 키.
        uri:
          type: string
          format: uri
          description: QR 코드로 표시할 `otpauth://totp/...` URI.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: 한 단계의 길이(초).
    RecoveryCodeList:
      type: array
      description: 복구 코드 10개. 이번 한 번만 표시됩니다. 각 코드는 한 번만 쓸 수 있습니다.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: 게임의 한쪽 진영.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: 게임 기록상의 이름(삭제된 계정은 `deleted#<id>`).
        rating:
          type:
            - integer
            - 'null'
          description: 시작 시점의 레이팅. 알 수 없으면 `null`.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: 게임 후의 레이팅. 레이팅 게임에는 항상 있으며, 레이팅에 반영되지 않는 게임(캐주얼, 사용자 지정 시간 제한, 중단)에서만 `null`입니다.
        ratingDiff:
          type:
            - integer
            - 'null'
          description: 레이팅 변동. 레이팅 규칙에 따라 레이팅이 그대로 유지되면 `0`(FIDE의 0점 규정, 레이팅 미산정 상대, 레이팅 미산정 플레이어의 첫 게임들). `null`인 경우는 `ratingAfter`와 같습니다.
    GameSummary:
      type: object
      description: 저장된 게임의 요약.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: 게임 id.
        category:
          type: string
          description: 공식 카테고리 id(`3+2`) 또는 `custom`.
        rated:
          type: boolean
          description: 게임이 레이팅에 반영되는지 여부.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 초 단위 시간 제한(`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted`(게임 코드 참조).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: 종료 사유 코드(게임 코드 참조).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: 결과. 중단된 게임은 `*`.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: 총 반수.
        startedAt:
          type: integer
          format: int64
          description: 시작 시각(에포크 밀리초).
        endedAt:
          type: integer
          format: int64
          description: 종료 시각(에포크 밀리초).
    Termination:
      type: string
      description: 종료 사유의 이름(게임 코드 참조). 프로토콜이 모르는 코드는 `Unknown`.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: 한 플레이어 입장에서 본 게임 요약.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: 플레이어의 진영.
    HistoryGameSummary:
      description: 로그인한 플레이어의 게임 기록에 있는 게임 하나.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: 기본 시간(밀리초).
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: 추가 시간(밀리초).
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: 플레이어 입장에서 본 결과.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: 이 페이지의 게임(최신순).
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: 다음 페이지를 위해 `before`로 전달할 id. 마지막 페이지에서는 `null`.
        total:
          type: integer
          minimum: 0
          description: 모든 페이지에 걸쳐 필터에 맞는 게임 수.
    MoveRecord:
      type: object
      description: 게임의 한 반수.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: UCI 표기법으로 나타낸 수. 프로모션이면 `n`, `b`, `r` 또는 `q`가 붙습니다.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: 이 수에 소비된 것으로 계산된 시간(ms). 기록에 없으면 `null`.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: 수를 둔 쪽의 그 수 이후 시계(ms). 기록에 없으면 `null`.
    PgnTagsView:
      type: object
      description: 표시용 주요 PGN 태그. 여기서 `Termination`은 종료 사유의 이름이며, PGN 파일은 PGN 표준 값을 사용합니다.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` 또는 `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: UTC 기준 시작 날짜.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: 시작 시점의 레이팅 또는 `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: 시작 시점의 레이팅 또는 `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: 수와 시계를 포함한 게임 기록. 게임 요약의 필드를 가지며, `color`와 `outcome`은 없습니다.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: 기본 시간(밀리초).
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: 추가 시간(밀리초).
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: '`status`의 이름.'
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: 이 게임이 재대결이면 원래 게임의 id, 아니면 `null`.
            moves:
              type: array
              description: 반수마다 항목 하나.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: 토큰의 플레이어가 이 게임을 둔 경우에만 있음. 그 플레이어의 진영.
            reportable:
              type: boolean
              description: 토큰의 플레이어가 이 게임을 둔 경우에만 있음. 지금 `POST /reports`가 이 게임의 상대에 대한 신고를 받아들일 수 있으면 `true`(게임이 7일 이내에 끝났고, 하루 한도를 다 쓰지 않았으며, 이 게임으로 상대를 이미 신고하지 않은 경우).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: 플레이어가 쓴 그대로의 사용자 이름.
        createdAt:
          type: integer
          format: int64
          description: 계정이 생성된 시각(에포크 밀리초).
        ratings:
          type: array
          description: 공식 카테고리만, 서버의 순서대로.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: 캐주얼 게임과 중단된 게임을 포함한, 저장된 모든 게임.
            rated:
              type: integer
              minimum: 0
              description: 레이팅 기록들을 합산한 레이팅 게임 수.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: 플레이어가 쓴 그대로의 사용자 이름.
        games:
          type: array
          description: 이 페이지의 게임(최신순).
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: 페이지가 가득 차면 항상 마지막 게임의 id(이때 다음 페이지가 비어 있을 수 있음), 그렇지 않으면 `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: 카테고리 id.
        minGames:
          type: integer
          minimum: 0
          description: 기록이 목록에 오르는 데 필요한 집계된 게임 수(`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: 리더보드가 계산된 시각(에포크 밀리초).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: PGN 텍스트(UTF-8로 최대 65,536바이트). 첫 번째 게임만 사용됩니다.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: 선택 사항. 이미지 크기.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: 선택 사항. 체스판 아래쪽에 오는 진영.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: 선택 사항. 수당 밀리초. 정숫값을 가진 JSON 숫자.
        coords:
          type: boolean
          default: true
          description: 선택 사항. 체스판 둘레에 파일 문자와 랭크 숫자를 그릴지 여부.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: 게임. 1~16자리의 정수 또는 문자열.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: 상대의 사용자 이름. 게임 기록에 있는 이름이나 현재 이름 모두 가능하며, 대소문자는 구분하지 않습니다. 비워 둘 수 없습니다.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: 신고 사유.
        comment:
          type:
            - string
            - 'null'
          description: 선택 사항. 제어 문자(탭과 줄 바꿈 제외)를 제거하고 앞뒤 공백을 잘라 낸 뒤 최대 500자.
    AccountExport:
      type: object
      description: 서버가 계정에 관해 보관하는 모든 정보(시각은 에포크 밀리초).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: 내보내기를 만든 시각.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: 파일에 무엇이 들어 있고 무엇이 빠져 있는지를 플레이어를 위해 쉬운 영어로 설명한 내용.
          items:
            type: string
        account:
          description: '`GET /account/me`의 계정 뷰에 `googleEmail`을 더한 것.'
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: 연결된 Google 계정의 주소 또는 `null`.
        ratings:
          type: array
          description: 전체 레이팅 기록.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: 상대의 부정행위가 밝혀진 뒤 돌려받은 레이팅 점수. UTC 기준 날짜와 카테고리별로 합산하며, 최신순입니다. 해당 게임도 부정행위자도 밝히지 않습니다.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: 저장된 모든 세션(최신순, 토큰은 일절 포함하지 않음). 보존 기간 정리 작업은 만료된 세션을 삭제하며, 로그아웃된 세션은 로그아웃 하루 뒤에 삭제합니다.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: 보안 이벤트(최신순). `RETENTION_SECURITY_DAYS`일 동안 보관됩니다.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: 해제된 제재를 포함한 모든 제재. 모더레이터의 이름은 절대 포함되지 않습니다.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: 플레이어가 떠난 게임, 중단된 게임, 제한 시간 안에 첫 수를 두지 않은 게임에 대해 기록된 행동 이벤트. 30일 동안 보관됩니다.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: 플레이어가 한 신고.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: 게임 수.
            list:
              type: array
              description: 모든 게임(최신순)을 `GET /account/games`의 요약 형식으로. 수는 `GET /games/{id}`에서, PGN은 `GET /games/{id}/pgn`에서 볼 수 있습니다.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: 전체 레이팅 기록.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: 플레이어가 레이팅 미산정 단계를 벗어났는지 여부.
            countedGames:
              type: integer
              minimum: 0
              description: 레이팅에 반영된 게임 수.
            updatedAt:
              type: integer
              format: int64
              description: 기록이 마지막으로 바뀐 시각.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: 그날의 00:00 UTC(에포크 밀리초).
        category:
          type: string
        points:
          type: integer
          description: 그날 그 카테고리에서 돌려받은 점수.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: 세션이 로그아웃된 시각 또는 `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: 로그인 시 사용된 주소. `RETENTION_IP_DAYS`일 후 지워집니다.
    SecurityEvent:
      type: object
      description: |-
        보안 이벤트. `ip`는 로그인 상태에서, 계정의 비밀번호(와 2차 인증)로, 또는 계정 주소로 발송된 링크로 수행한 작업에만 제공됩니다: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused`, `account_exported`. 그 밖의 모든 종류는 `ip: null`이며, `ip`는 `RETENTION_IP_DAYS`일 후 지워집니다.

        `detail`에는 다음 필드만 남습니다: `login`: `method`. `sso_login`, `sso_account_created`: `provider`. `sso_linked`: `provider`와 `method`(`password` 또는 `password+totp`). `login_failed`: `failures`. `login_lockout`: `retryAfterMs`. `mfa_failed`: `attempts`. `recovery_code_used`: `remaining`. `reauth_failed`: `factor`. `session_revoked`와 `sessions_revoked_all`: `reason`. `email_change_refused`: `reason`. `sanction_auto`: `kind`, `gameId`, `until`. `moderator_action` 이벤트는 `ban`, `unban`, `reset_mfa`, `verify_email`, `revoke_sessions` 작업에 대해서만 `{ action }`만 남깁니다(그 밖의 모더레이터 작업은 제외됨). 그 밖의 모든 종류는 `detail: null`입니다. `rating_refund` 이벤트는 제외됩니다: 그 점수는 `ratingRefunds`에 있습니다.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: 이벤트 종류(`login`, `password_changed` 등).
        at:
          type: integer
          format: int64
          description: 발생 시각.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: 신고된 플레이어의 현재 공개 이름.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: 신고가 아직 열려 있는지 여부(신고된 플레이어가 제재를 받았는지는 알려 주지 않음).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: 이메일 링크의 토큰(페이지 양식의 숨은 필드).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: 재설정 링크의 토큰(양식의 숨은 필드).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: 새 비밀번호. 가입 시의 비밀번호 규칙이 적용됩니다.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: 새 비밀번호를 한 번 더. 같아야 합니다.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: JavaScript나 외부 리소스가 없는 UTF-8 HTML 페이지(`text/html; charset=utf-8`).
