      description: |-
        서버가 플레이어를 받을 수 있으면 200 `ready`로, 시작하거나 종료하는 중에는 503 `not_ready`로 응답합니다. `HEAD`도 사용할 수 있습니다. 그 밖의 모든 메서드(`OPTIONS` 포함)에는 `Allow: GET, HEAD`와 함께 405 `method_not_allowed`로 응답합니다.

        **제한:** 주소별 계층만.
