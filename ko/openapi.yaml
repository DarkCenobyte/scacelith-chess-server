  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: 게임을 PGN 파일로 다운로드
      description: |-
        같은 게임을 PGN 파일로 반환합니다: 줄 끝이 `\n`인 게임 하나이며, 수 기록은 한 줄이 80열 미만입니다. 응답은 토큰이 있든 없든 같습니다.

        태그(이 순서대로): `Event`(`<SERVER_NAME> rated <category>` 또는 `<SERVER_NAME> casual <category>`), `Site`(`SERVER_PUBLIC_HOST`), `Date`(UTC 기준 시작 날짜), `Round`, `White`, `Black`, `Result`(중단된 게임은 `*`), `UTCDate`와 `UTCTime`(시작 시각), `WhiteElo`와 `BlackElo`(시작 시점의 레이팅, 또는 `-`), `WhiteRatingDiff`와 `BlackRatingDiff`(`+10`, `-10` 같은 변동값. 모든 레이팅 게임에 있으며, 레이팅 규칙에 따라 레이팅이 그대로 유지되면 `+0`. 캐주얼 게임, 사용자 지정 시간 제한 게임, 중단된 게임에는 둘 다 없음), `TimeControl`(초 단위), `Termination`(PGN 표준 값: `normal`. `time forfeit`는 시간 초과(플래그 폴)이며 무승부로 끝난 경우도 포함. `abandoned`. `rules infraction`은 두 번째 불법 수 또는 페어플레이 위반에 따른 몰수패. `unterminated`는 중단된 게임), `PlyCount`, `ScacelithGameId`(십진수 id).

        각 수에는 `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`가 붙습니다: 수를 둔 쪽의 그 수 이후 시계와 그 수에 소비된 것으로 계산된 시간이며, 0.1초 단위(버림)입니다. 기록에 값이 없으면 생략됩니다. 마지막 수 뒤에는 종료 사유가 문장으로 나오고, 그다음 결과가 나옵니다.

        **제한:** `public_read`(토큰이 있으면 플레이어별, 없으면 클라이언트별).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: PGN 파일.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'UTF-8로 된 PGN 텍스트(`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: 16자리 이하의 양의 정수(2^53 미만)가 아님. `invalid_request`: 올바른 URL 인코딩이 아님.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: 토큰을 보냈지만 유효하지 않음.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: 해당 게임이 없음.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `public_read` 제한 또는 계정 할당량.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: 저장된 수를 재생해도 저장된 종료 상태에 이르지 못하는 경우 등(서버가 로그에 기록함).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`(데이터베이스가 계속 잠겨 있었음. 본문에 `retryAfter: 1`이 있고 `Retry-After` 헤더는 없음), `server_busy`(세션 조회 중 데이터베이스가 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: 이 서버의 게임을 애니메이션 GIF로 다운로드
      description: |-
        게임을 애니메이션 GIF로 반환합니다. 이름과 레이팅은 게임 기록의 것이며(시작 시점의 레이팅, 삭제된 계정은 `deleted#<id>`), 결과와 종료 사유(`Resignation`, `Loss on time` 등)도 마찬가지입니다.

        검사 순서: `gif_disabled`, 이미지 옵션(`size`, `orientation`, `delay`, `coords`), 게임 id, 게임, 게임 길이.

        **세션 필요:** 한도는 계정별로 집계됩니다. **제한:** 모든 요청에 `gif`, GIF를 만들어야 할 때만 `gif_user_min`, `gif_user_hour`, `gif_ip_min`, `gif_ip_hour`(태그 설명 참조). **제한 시간:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5초(기본값 45초).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: '이미지 크기: `small`(칸 32 px), `medium`(48 px) 또는 `large`(72 px).'
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: 체스판 아래쪽에 오는 진영.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: 수당 밀리초(십진수 1~6자리).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: 체스판 둘레에 파일 문자와 랭크 숫자를 그리는지(`1`) 그리지 않는지(`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`field`(`size`, `orientation`, `delay` 또는 `coords`)가 포함된 `invalid_option`: 허용되지 않는 값. `invalid_game_id`. `invalid_request`: 올바른 URL 인코딩이 아님.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: 해당 게임이 없음. `gif_disabled`: 서버가 GIF를 껐음(`GIF_ENABLED=false`. `gif` 토큰은 반환됨).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `gif` 제한, 렌더링 제한 또는 계정 할당량.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF를 만들 수 없었음(서버가 원인을 로그에 기록함). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`retryAfter`(3~10초)와 `Retry-After`가 포함된 `server_busy`: 렌더링 대기열이 가득 찼거나, GIF가 빈 스레드를 `GIF_QUEUE_TIMEOUT_MS`(10초) 동안 기다렸음. 요청이 가져간 모든 제한 토큰은 반환됩니다. `busy`: 데이터베이스가 계속 잠겨 있었음(`retryAfter: 1`은 본문에만 있음). `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: PGN으로 보낸 임의의 게임을 애니메이션 GIF로 만들기
      description: |-
        PGN 텍스트로 보낸 임의의 게임에 대해 `GET /games/{id}/gif`와 같은 이미지를 만듭니다: 게임 앱이 저장한 게임, 다른 사이트에서 내보낸 게임, 직접 입력한 게임 등. 텍스트의 첫 번째 게임만 사용됩니다.

        - PGN 리더는 게임 앱 자체의 리더가 받아들이는 것을 받아들입니다: 이 서버가 쓰는 모든 PGN과 다른 사이트의 일반적인 내보내기 파일(주석, 변화수, NAG, 시계 주석은 건너뜀. 수 번호와 SAN은 관대하게 읽음. `SetUp`이 `"0"`이 아니면 `FEN` 태그가 시작 포지션을 지정함).
        - 이름과 레이팅은 `White`, `Black`, `WhiteElo`, `BlackElo` 태그에서 가져옵니다. 악센트가 있는 문자는 악센트가 제거되고, 그 밖에 출력 가능한 ASCII가 아닌 문자는 `?`로 바뀌며, 긴 이름은 잘립니다(48자). 결과는 `Result` 태그에서, 없으면 수 기록의 끝에서 가져옵니다. `Termination` 태그는 값이 `normal`일 때만 표시되지 않으며, 이때는 최종 포지션이 결말을 보여 줍니다(체크메이트, 스테일메이트).
        - 이 엔드포인트는 본문을 직접 검사합니다: 알 수 없는 필드가 있거나 `pgn`이 없거나 문자열이 아니면 `field`와 함께 400 `invalid_request`로 응답하고, 잘못된 옵션에는 400 `invalid_option`으로 응답합니다(`delayMs`는 JSON 숫자, `coords`는 불리언이어야 하며, `null`은 거부됨).

        **세션 필요:** 한도는 계정별로 집계됩니다. **제한:** `GET /games/{id}/gif`와 같음. **본문 크기 제한:** `HTTP_BODY_LIMIT` 값과 관계없이 135,168바이트(JSON 문자열로 된 PGN, 이스케이프 포함). **제한 시간:** 기본값 45초.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: 좌표 없이 직접 입력한 짧은 게임
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: 모든 옵션을 지정한 PGN 파일
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`field`가 포함된 `invalid_request`(알 수 없는 필드, 또는 `pgn`이 없거나 문자열이 아님. 본문이 객체가 아니면 `field` 없음). `invalid_json`. `field`가 포함된 `invalid_option`(`size`, `orientation`, `delayMs` 또는 `coords`). `line`과 `column`(1부터 시작, 열은 문자 단위), 리더의 `message`가 포함된 `invalid_pgn`: 불법 수나 모호한 수, 깨진 태그, 알 수 없는 변형, 65,536바이트 초과.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: 서버가 GIF를 껐음(`GIF_ENABLED=false`. `gif` 토큰은 반환됨).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: 135,168바이트를 넘는 본문.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `gif` 제한, 렌더링 제한 또는 계정 할당량.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF를 만들 수 없었음(서버가 원인을 로그에 기록함). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`retryAfter`(3~10초)와 `Retry-After`가 포함된 `server_busy`: 렌더링 대기열이 가득 찼거나, GIF가 빈 스레드를 너무 오래 기다렸음. 요청이 가져간 모든 제한 토큰은 반환됩니다. `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /players/{username}:
    get:
      operationId: getPlayer
      tags:
        - players
      summary: 플레이어의 공개 프로필 조회
      description: |-
        플레이어의 공개 프로필: 공식 카테고리의 레이팅(서버의 순서대로)과 게임 수. `games.total`은 캐주얼 게임과 중단된 게임을 포함해 저장된 모든 게임을 셉니다. `games.rated`, `wins`, `draws`, `losses`는 레이팅 기록들을 합산한 값이므로 레이팅 게임만 해당합니다. 응답은 토큰이 있든 없든 같습니다.

        **제한:** `public_read`(토큰이 있으면 플레이어별, 없으면 클라이언트별).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: 프로필.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
              example:
                username: alice
                createdAt: 1790882839743
                ratings:
                  - category: '3+2'
                    rating: 1510
                    provisional: true
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                games:
                  total: 3
                  rated: 2
                  wins: 1
                  draws: 1
                  losses: 0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`: `[A-Za-z0-9_.-]`로 된 2~24자가 아님.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: 토큰을 보냈지만 유효하지 않음.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: 해당 플레이어가 없거나 삭제된 계정임.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `public_read` 제한 또는 계정 할당량.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`(데이터베이스가 계속 잠겨 있었음. 본문에 `retryAfter: 1`이 있고 `Retry-After` 헤더는 없음), `server_busy`(세션 조회 중 데이터베이스가 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /players/{username}/games:
    get:
      operationId: listPlayerGames
      tags:
        - players
