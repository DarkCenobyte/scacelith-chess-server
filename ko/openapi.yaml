paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: 서버의 이름, 버전, 포트, 회원가입 규칙 조회
      description: |-
        클라이언트가 로그인하거나 접속하기 전에 필요한 정보입니다. 서버의 이름과 ID, WebSocket 프로토콜 버전과 WebSocket의 위치, 회원가입 규칙, 공식 시간 제한, 클라이언트가 양식을 보내기 전에 확인할 수 있는 제한 값.

        **제한:** 주소별 계층만 적용됩니다.
      security: []
      responses:
        '200':
          description: 서버 설명.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: 주소별 계층.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: 계정 만들기
      description: |-
        계정을 만듭니다. 이메일 주소로 보낸 링크로 주소가 확인되면 만들어지며, 이메일 확인이 없으면 즉시 만들어집니다.

        **이메일 확인이 있는 경우**(`REQUIRE_EMAIL_VERIFICATION`, 기본값): 202 `verification_sent`. 아직 계정은 존재하지 않습니다. 가입 신청은 24시간 동안 대기하며, 그동안 사용자 이름을 선점해 둡니다. 그 24시간 동안 유효한 링크가 주소로 발송되며, 주소당 5분에 최대 한 번입니다(`POST /auth/verify-email/resend`로 새 링크를 보냄). 링크를 사용하면(`/verify-email` 페이지의 버튼) 주소가 확인된 상태로 계정이 만들어지고, 그때부터 플레이어가 로그인할 수 있습니다. 그전까지 그 사용자 이름으로 로그인하면 알 수 없는 계정과 마찬가지로 `invalid_credentials`로 응답하며, 공개 프로필도 존재하지 않습니다. 같은 주소로 새로 가입 신청을 하면 대기 중인 신청을 대체합니다. 다른 계정이 이미 그 주소를 사용하고 있을 때도 응답은 같습니다. 이때는 링크를 보내지 않고 대신 그 주소의 주인에게 알림을 보내며(최대 한 시간에 한 번), 사용자 이름도 같은 방식으로 선점해 두므로, 그 주소에 계정이 있는지 알 수 있는 단서가 전혀 없습니다. 링크가 사용되지 않은 가입 신청은 24시간 뒤 삭제되며, 그 사용자 이름은 다시 사용할 수 있게 됩니다.

        **이메일 확인이 없는 경우**(`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`. 계정이 즉시 만들어지고 로그인할 수 있습니다.

        **규칙.** `username`: `USERNAME_MIN`~`USERNAME_MAX`자(3~20자)의 문자, 숫자, `_`, `-`로 이루어지며 문자나 숫자로 시작해야 합니다(`GET /info`가 `limits`로 알려 줌). 예약된 이름(`admin`, `moderator`, `deleted` 등)과 일부 접두사는 거부되며, 대소문자를 구분하지 않고 고유해야 합니다. `email`: 앞뒤 공백을 제거하고 소문자로 저장하며, 점이 들어간 도메인을 가진 일반 ASCII여야 합니다. `password`: 최소 `PASSWORD_MIN_LENGTH`(10)자, 최대 UTF-8 256바이트이며, 사용자 이름이나 이메일의 로컬 부분을 포함해서는 안 되고, 흔한 비밀번호여서도 안 됩니다.

        **오류**(다음 순서로 확인): 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; 비밀번호 해시 대기열 오류; 409 `email_taken`(이메일 확인이 없는 경우에만).

        **제한:** `auth`, 그다음 `auth_register`(클라이언트당 시간당 가입 10회). **작업 증명:** `POW_REGISTER_BITS`가 0보다 크면 항상 필요합니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: 첫 시도, 작업 증명 없음
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: 작업 증명을 담아 다시 보냄
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: 계정이 만들어졌으며 로그인할 수 있습니다(이 서버에는 이메일 확인이 없음).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: 가입 신청이 확인 링크를 기다리고 있습니다(또는 그 주소에 이미 계정이 있음. 응답으로는 구별할 수 없음).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`(`field` 포함), `invalid_json`, `invalid_username`, `invalid_email`, 또는 `weak_password`(`reason`: `too_short`, `too_long`, `contains_username`, `contains_email`, `too_common`).'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: 이 서버는 가입을 받지 않습니다(`GET /info`가 `registration: closed`를 알려 줌).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: 어떤 계정이 그 사용자 이름을 쓰고 있거나, 다른 주소의 대기 중인 가입 신청이 그 이름을 선점하고 있습니다. `email_taken`: 다른 계정이 그 주소를 사용하고 있습니다(이메일 확인이 없는 경우에만).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth` 또는 `auth_register` 제한, 또는 비밀번호 해시 대기열.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`(비밀번호 해시 대기열, 또는 데이터베이스가 계속 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: 비밀번호로 로그인
      description: |-
        사용자 이름 또는 이메일 주소와 비밀번호로 로그인합니다. 가능한 응답은 두 가지이며, 둘 다 상태 코드 200입니다. 세션, 또는 2단계 인증이 켜져 있으면 `POST /auth/login/mfa`로 5분 안에 완료해야 하는 두 번째 단계입니다.

        알 수 없는 계정, 틀린 비밀번호, 비밀번호가 없는 계정은 같은 시간이 지난 뒤 같은 응답을 받습니다. 401 `invalid_credentials`입니다. 계정 검사(`banned`, `email_unverified`)는 비밀번호가 맞은 뒤에만 이루어집니다. 한 로그인 이름에서 `AUTH_FAILURES_PER_ACCOUNT`(5)번 실패한 뒤부터는 시도할 때마다 기다려야 합니다(429 `too_many_attempts`).

        **제한:** `auth`. **작업 증명:** 로그인 실패가 몰려드는 동안에만 필요합니다(428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: 세션, 또는 2단계 인증을 사용하는 로그인의 두 번째 단계.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: 로그인됨
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: 2단계 인증이 켜져 있음
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: 알 수 없는 계정, 틀린 비밀번호, 또는 비밀번호가 없는 계정.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '비밀번호가 맞은 경우에만: `until`(에포크 밀리초, 영구 정지는 `null`)이 있는 `banned`, 또는 `email_unverified`(주소가 아직 확인되지 않은 예전 계정).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`(이 로그인 이름의 실패 대기 시간) 또는 `rate_limited`(`auth` 제한, 비밀번호 해시 대기열).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`(비밀번호 해시 대기열, 또는 데이터베이스가 계속 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: 2차 인증으로 로그인 완료
      description: |-
        `POST /auth/login` 또는 Google 로그인(`POST /auth/sso/google/finish` 또는 `POST /auth/sso/google/link`)이 `mfaRequired`로 응답한 뒤의, 2단계 인증을 사용하는 로그인의 두 번째 단계입니다. `code`(6자리 인증 앱 코드 또는 복구 코드)나 `recoveryCode`를 보내세요. 여기서 사용한 복구 코드는 사라집니다.

        한 단계에서는 잘못된 코드를 최대 5개까지 받으며, 비밀번호가 재설정되거나 변경되어도 단계가 끝납니다. Google 연결의 비밀번호 단계 뒤에는, 여기서 코드가 통과해야만 연결이 저장됩니다.

        **제한:** `auth`, 그리고 주소와 관계없이 계정당 15분에 최대 `AUTH_MFA_PER_ACCOUNT`(10)개의 코드. 이를 넘으면 코드를 확인하지 않으므로 복구 코드가 소모되지 않습니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: 인증 앱 코드
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: 복구 코드
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: 로그인되었습니다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code`도 `recoveryCode`도 보내지 않았거나 본문이 스키마를 위반했습니다. `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: 단계가 만료되었거나, 이미 사용되었거나, 잘못된 코드 5개로 끝났거나, 첫 단계 이후 비밀번호가 재설정 또는 변경되었습니다(다시 로그인하세요). `invalid_code`: 틀렸거나 이미 사용된 코드.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned`(`until` 포함), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: Google 연결의 비밀번호 단계 뒤에만 해당하며, 그사이에 그 Google 계정이 다른 계정에 연결되었습니다.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: Google 연결의 비밀번호 단계 뒤에만 해당하며, 그사이에 계정이 변경되었습니다. 로그인을 처음부터 다시 시작하세요.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: 계정의 실패 대기 시간이거나, 최근 15분 동안의 `AUTH_MFA_PER_ACCOUNT`개 코드를 모두 썼습니다. `rate_limited`: `auth` 제한.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`retryAfter: 1`인 `server_busy`: 데이터베이스가 계속 잠겨 있었습니다(Google 연결 단계 뒤였다면 아무것도 연결되지 않았으니 로그인을 처음부터 다시 시작하세요). `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: 이 세션 로그아웃
      description: |-
        사용한 토큰의 세션을 폐기합니다. 그 세션으로 연 WebSocket은 닫힙니다. 본문은 없습니다(또는 `{}`).

        **제한:** `sessions`.
      security:
