      description: |-
        플레이어의 최근 게임을 최신순으로 반환합니다. 게임 기록 목록처럼 페이지 단위로 나뉘지만 필터와 총계는 없습니다. `color`는 이 플레이어의 진영입니다. 페이지가 가득 차면 `next`는 항상 마지막 게임의 id이므로, 다음 페이지가 비어 있을 수 있습니다. 플레이어를 먼저 조회하므로, 알 수 없는 플레이어는 쿼리 내용과 관계없이 404입니다.

        **제한:** `public_read`(토큰이 있으면 플레이어별, 없으면 클라이언트별).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: 플레이어 게임 목록의 한 페이지.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerGamesPage'
              example:
                username: alice
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                next: 4100000000001
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_cursor`(`before`가 게임 id가 아님), `invalid_limit`(이 두 가지는 `field` 없음).'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: 토큰을 보냈지만 유효하지 않음.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: 해당 플레이어가 없거나 삭제된 계정임.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `public_read` 제한 또는 계정 할당량.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`(데이터베이스가 계속 잠겨 있었음. 본문에 `retryAfter: 1`이 있고 `Retry-After` 헤더는 없음), `server_busy`(세션 조회 중 데이터베이스가 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: 카테고리의 상위 플레이어 조회
      description: |-
        공식 카테고리에서 집계된 게임이 `minGames`(`PROVISIONAL_GAMES`)판 이상인 레이팅 기록 중 상위 100개. 삭제된 계정과 부정행위가 확인된 플레이어는 제외됩니다. 서버는 각 리더보드를 최대 10초에 한 번 다시 계산하며, 그 시각은 `updatedAt`에 나옵니다. 한 카테고리의 계산은 한 번에 하나만 실행됩니다: 그동안 다른 요청은 이전 목록을 받거나, 아직 목록이 없으면 계산이 끝나기를 기다립니다.

        **제한:** 주소별 계층만.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: 공식 카테고리 id(`3+2` 또는 `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: 플레이어 수(1~100). 3자리 이하의 더 큰 수는 100으로 간주하며, 빈 값은 없는 것으로 간주합니다.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: 리더보드.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category`(없거나 공식 카테고리가 아님), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: 주소별 계층.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`(데이터베이스가 계속 잠겨 있었음. 본문에 `retryAfter: 1`이 있고 `Retry-After` 헤더는 없음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: 최근 게임의 상대 신고
      description: |-
        플레이어 본인의 게임 중 최근 7일 이내에 끝난 게임의 상대를 신고합니다. 신고만으로 레이팅, 제재, 무결성 수준이 바뀌는 일은 없습니다. 신고는 모더레이터에게 보이는 검토 우선순위를 높이고, `abuse`를 제외하면 그 게임의 엔진 분석을 요청합니다.

        같은 게임에서 같은 상대를 다시 신고하면 같은 응답을 받으며 아무것도 바뀌지 않습니다. 응답은 신고된 계정에 대해 아무것도 알려 주지 않습니다. `GET /games/{id}`는 신고가 접수될지 여부를 게임의 플레이어들에게 미리 알려 줍니다(`reportable`).

        이 엔드포인트는 본문을 `gameId`, `reported`, `category`, `comment` 순서로 직접 검사합니다: 실패하면 `field` 없이 400 `invalid_request`로 응답합니다. 알 수 없는 필드는 무시됩니다.

        **제한:** `reports`(플레이어별), 그다음 플레이어당 24시간에 신고 `REPORTS_PER_DAY`(5)건(429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: 신고가 접수되었습니다(또는 이미 접수되어 있었음).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`(`field` 없음), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: 최근 7일 이내에 끝난 게임에서 신고자의 상대가 아님.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit`(`retryAfter: 3600`, `Retry-After` 헤더 포함): 최근 24시간 동안 이미 `REPORTS_PER_DAY`건을 신고함. `rate_limited`: `reports` 제한 또는 계정 할당량.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`(세션 조회 중 데이터베이스가 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
