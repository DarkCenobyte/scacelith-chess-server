        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`(재인증 실패, 또는 이 계정에서 시도한 코드가 너무 많음) 또는 `rate_limited`(`account_export`, `reauth` 또는 `reauth_user` 제한, 계정 할당량, 비밀번호 해시 대기열).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`(데이터베이스가 계속 잠겨 있었음, `Retry-After: 1` 헤더 포함), `server_busy`(비밀번호 해시 대기열), `timeout`(60초). 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: 계정 삭제
      description: |-
        계정을 삭제합니다. 되돌릴 수 없습니다.

        - 모든 세션이 즉시 폐기됩니다: 그 이후로 토큰에는 401 `invalid_token`이 반환됩니다.
        - 사용자 이름은 계정과 모든 게임 기록에서 `deleted#<id>`로 바뀝니다.
        - 다음 정보가 지워집니다: 이메일 주소, 비밀번호 해시, 2단계 인증 비밀 키와 복구 코드, 세션과 링크 토큰, Google 계정 연결, 안티치트의 무결성 기록, 보안 이벤트와 함께 저장된 IP 주소.
        - 레이팅과 게임은 유지됩니다. 게임은 익명 이름으로 계속 열람할 수 있으며, `GET /players/{username}`은 이전 이름에 대해 404로 응답합니다.

        **재인증:** 비밀번호, 그리고 2단계 인증이 켜져 있으면 인증 앱 코드 또는 복구 코드. **제한:** `reauth`, 그다음 `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: 계정이 삭제되었습니다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set`(Google 전용 계정), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`(재인증 실패, 또는 이 계정에서 시도한 코드가 너무 많음) 또는 `rate_limited`(`reauth` 또는 `reauth_user` 제한, 계정 할당량, 비밀번호 해시 대기열).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`(비밀번호 해시 대기열, 또는 데이터베이스가 계속 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: 플레이어의 게임 목록 조회(필터링, 페이지 단위)
      description: |-
        로그인한 플레이어의 게임을 최신순으로, 필터링하고 페이지 단위로 나누어 반환하며, 필터에 맞는 게임 수도 함께 반환합니다. 모든 쿼리 매개변수는 선택 사항이며, 빈 값은 없는 것으로 간주합니다.

        페이지 넘기기: 이전 페이지의 `next`를 `before`로 전달하세요. 마지막 페이지에서는 `next`가 `null`입니다. `total`은 모든 페이지에 걸쳐 필터에 맞는 게임 수입니다.

        **제한:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: 공식 카테고리 id(`3+2` 또는 `3%2B2`), 또는 그 밖의 시간 제한으로 둔 모든 게임을 뜻하는 `custom`.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: 레이팅 게임(`true`)만 또는 캐주얼 게임(`false`)만.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: 플레이어 입장에서 이긴 게임, 진 게임 또는 비긴 게임만. 중단된 게임은 이 필터가 없을 때만 나타납니다.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: 게임 기록의 한 페이지.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor`(`before`가 게임 id가 아님), `invalid_limit` 또는 `invalid_filter`(`category`, `rated` 또는 `result`). 각각 해당 매개변수를 가리키는 `field`가 포함됩니다.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `account_games` 제한 또는 계정 할당량.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy`(데이터베이스가 계속 잠겨 있었음. 본문에 `retryAfter: 1`이 있고 `Retry-After` 헤더는 없음), `server_busy`(세션 조회 중 데이터베이스가 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /games/{id}:
    get:
