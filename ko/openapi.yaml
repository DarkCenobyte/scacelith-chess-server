        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `sessions` 제한 또는 계정 할당량.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`(데이터베이스가 계속 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: 계정, 레이팅, 적용 중인 제재 조회
      description: |-
        플레이어 본인에게 보이는 계정: 계정 뷰(모든 로그인 응답의 `user`이기도 함), 플레이어가 레이팅 게임을 둔 카테고리마다 하나씩의 레이팅 기록, 적용 중인 제재, 정지 정보. 안티치트의 무결성 수준은 절대 표시되지 않습니다.

        **제한:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 계정.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized` 또는 `invalid_token`(계정이 삭제된 경우 포함).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `account` 제한 또는 계정 할당량.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`(데이터베이스가 계속 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: 직접 도전 받기 또는 거절
      description: |-
        다른 플레이어가 이 플레이어에게 이름으로 도전할 수 있는지 설정합니다. `none`이면 직접 도전이 거절되며, 도전한 플레이어에게는 이 플레이어가 응할 수 없다고 알립니다. 재인증은 필요 없습니다.

        **제한:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: 현재 적용 중인 설정.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `account` 제한 또는 계정 할당량.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`(데이터베이스가 계속 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: 비밀번호 변경
      description: |-
        비밀번호를 변경합니다. 현재 비밀번호가 필요하지만, 2단계 인증이 켜져 있어도 2차 인증은 필요하지 않습니다. 새 비밀번호는 가입 규칙을 따릅니다(현재 비밀번호 다음에 검사됨).

        변경은 하나의 트랜잭션에서(전부 적용되거나 하나도 적용되지 않음) 다음 효과를 냅니다: 다른 모든 세션을 폐기하고(이 세션은 로그인 상태 유지), 대기 중인 이메일 변경을 취소하며, 계정의 비밀번호 재설정 링크를 더 이상 쓸 수 없게 하고, 소유자에게 메일을 보냅니다.

        **재인증:** 비밀번호만. **제한:** `reauth`, 그다음 `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: 비밀번호가 변경되었습니다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set`(Google 전용 계정), `weak_password`(`reason` 포함), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: 현재 비밀번호가 틀렸거나, 요청을 검사하는 동안 비밀번호 재설정 또는 변경이 이루어졌음.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`(계정의 재인증 실패) 또는 `rate_limited`(`reauth` 또는 `reauth_user` 제한, 계정 할당량, 비밀번호 해시 대기열).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: 비밀번호 해시 대기열, 또는 데이터베이스가 계속 잠겨 있었음(`retryAfter: 1`, 아무것도 변경되지 않음). `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: 2단계 인증 켜기 시작
      description: |-
        대기 중인 새 인증 앱 비밀 키를 저장하고(이전에 대기 중이던 비밀 키는 대체됨), 인증 앱에서 쓸 수 있도록 반환합니다(텍스트, 그리고 QR 코드로 표시할 `otpauth://` URI로). 2단계 인증은 아직 켜지지 않습니다: `POST /account/mfa/totp/enable`에 이 비밀 키의 코드를 보내면 켜집니다.

        **재인증:** 비밀번호만. **제한:** `reauth`, 그다음 `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: 대기 중인 비밀 키.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set`(Google 전용 계정), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`(비밀번호보다 먼저 검사됨).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`(계정의 재인증 실패) 또는 `rate_limited`(`reauth` 또는 `reauth_user` 제한, 계정 할당량, 비밀번호 해시 대기열).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`(비밀번호 해시 대기열, 또는 데이터베이스가 계속 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: 2단계 인증 켜기 완료 및 복구 코드 받기
      description: |-
        대기 중인 비밀 키의 코드(정확히 6자리)로 2단계 인증을 켭니다. 여기서는 비밀번호를 묻지 않습니다. 설정을 시작할 때 이미 입력했기 때문입니다. 응답에는 복구 코드 10개가 들어 있으며, 이번 한 번만 표시됩니다.

        **제한:** `reauth`, 그다음 `reauth_user`. 틀린 코드는 계정의 재인증 실패로 집계됩니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: 2단계 인증이 켜졌습니다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code`가 정확히 6자리가 아니거나 본문이 스키마를 위반함. `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: 틀린 코드(기기의 시간을 확인하세요).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`. `mfa_setup_required`: 대기 중인 비밀 키가 없음(먼저 `POST /account/mfa/totp/setup`을 호출하세요).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`(계정의 재인증 실패) 또는 `rate_limited`(`reauth` 또는 `reauth_user` 제한, 계정 할당량).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`(데이터베이스가 계속 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: 2단계 인증 끄기
      description: |-
        2단계 인증을 끕니다. 비밀 키와 복구 코드가 삭제되고, 소유자에게 메일이 갑니다.

        **재인증:** 비밀번호, 그리고 인증 앱 코드 또는 복구 코드(`code`와 `recoveryCode` 중 하나가 필요함). **제한:** `reauth`, 그다음 `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: 2단계 인증이 꺼졌습니다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set`(Google 전용 계정), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required`(`code`도 `recoveryCode`도 없음, 비밀번호보다 먼저 검사됨), `invalid_password`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`(재인증 실패, 또는 이 계정에서 시도한 코드가 너무 많음) 또는 `rate_limited`(`reauth` 또는 `reauth_user` 제한, 계정 할당량, 비밀번호 해시 대기열).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`(비밀번호 해시 대기열, 또는 데이터베이스가 계속 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /account/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags:
        - two-step-verification
      summary: 복구 코드 교체
      description: |-
        복구 코드를 새 코드 10개로 교체합니다. 이전 코드는 더 이상 쓸 수 없습니다.

        **재인증:** 비밀번호, 그리고 `code`에 넣은 인증 앱 코드(복구 코드는 403 `invalid_code`로 거부됨). **제한:** `reauth`, 그다음 `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodesRequest'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: 새 복구 코드. 이번 한 번만 표시됩니다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - recoveryCodes
                properties:
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set`(Google 전용 계정), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`(복구 코드를 보낸 경우 포함).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`(재인증 실패, 또는 이 계정에서 시도한 코드가 너무 많음) 또는 `rate_limited`(`reauth` 또는 `reauth_user` 제한, 계정 할당량, 비밀번호 해시 대기열).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`(비밀번호 해시 대기열, 또는 데이터베이스가 계속 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: 이메일 주소 변경
      description: |-
        계정의 이메일 주소를 변경합니다. `newEmail`은 앞뒤 공백을 제거하고 소문자로 바꾼 뒤, 가입 시 주소와 같은 방식으로 검사합니다.

        **이메일 확인이 있는 경우**(기본값): 202 `verification_sent`. 24시간 동안 유효한 링크가 새 주소로 발송됩니다. 이 링크는 `/confirm-email-change`를 열며, 플레이어가 그 페이지의 버튼을 눌러야만 주소가 바뀝니다. 그때까지 `GET /account/me`는 새 주소를 `pendingEmail`로 보여 줍니다. 새 요청은 대기 중인 요청을 대체하고, 비밀번호 변경이나 재설정은 대기 중인 요청을 취소합니다. 누가 요청하든 같은 새 주소로는 5분에 최대 한 개의 링크만 발송됩니다(이미 대기 중인 변경을 다시 요청하면 앞서 보낸 링크가 그대로 유지되며 계속 유효함). 응답은 동일합니다. 현재 주소로는 마스킹된 주소(`a***@example.org`)로의 변경이 요청되었다는 알림이 갑니다. 다른 계정이 이미 새 주소를 사용하고 있어도 응답과 `pendingEmail`은 동일합니다. 이 경우 링크가 발송되지 않으므로 그 변경은 절대 완료되지 않으며, 대신 그 주소의 소유자에게 알림이 갑니다(1시간에 최대 한 번).

        링크가 확인되면 주소가 바뀌고 확인된 것으로 간주되며, 기기들은 로그인 상태를 유지하고, 앞서 보낸 링크(확인, 비밀번호 재설정, 다른 변경)는 더 이상 쓸 수 없게 되며, 이전 주소로 새 주소를 마스킹한 알림이 갑니다.

        **이메일 확인이 없는 경우**(`REQUIRE_EMAIL_VERIFICATION=false`): 주소가 즉시 바뀌고(200 `email_changed`), 이전 주소로 알림이 갑니다. 다른 계정이 그 주소를 사용하고 있으면 응답은 409 `email_taken`이고, 그 주소의 소유자에게 알림이 갑니다.

        **재인증:** 비밀번호, 그리고 2단계 인증이 켜져 있으면 인증 앱 코드 또는 복구 코드. `invalid_email`과 `same_email`은 비밀번호보다 먼저 검사되므로 실패로 집계되지 않습니다. **제한:** `reauth`, 그다음 `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: 주소가 즉시 변경되었습니다(이 서버는 이메일 확인을 하지 않음).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: 저장된 형태의 새 주소.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: 새 주소로 확인 링크가 발송되었습니다(또는 그 주소가 다른 계정의 것이지만, 응답으로는 알 수 없음).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email`(계정의 현재 주소), `password_not_set`(Google 전용 계정), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`(비밀번호 변경이나 재설정이 요청보다 먼저 처리된 경우 포함. 이때 링크는 발송되지 않음), `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: 이메일 확인이 없는 경우에만.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`(재인증 실패, 또는 이 계정에서 시도한 코드가 너무 많음) 또는 `rate_limited`(`reauth` 또는 `reauth_user` 제한, 계정 할당량, 비밀번호 해시 대기열).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: 비밀번호 해시 대기열, 또는 데이터베이스가 계속 잠겨 있었음(`retryAfter: 1`: 아무것도 변경되지 않았으며 같은 요청을 다시 보낼 수 있음). `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: 계정 데이터 다운로드
      description: |-
        서버가 계정에 관해 보관하는 모든 정보를 저장용 JSON 파일 하나로 반환합니다(`format`은 `scacelith-account-export`, `version`은 1). 내보내기를 하면 보안 이벤트(`account_exported`)가 기록됩니다. 문서의 `notes` 배열은 무엇이 빠져 있는지를 플레이어에게 쉬운 영어로 알려 줍니다.

        **내보내기에 절대 포함되지 않는 것:** 비밀번호 해시, 2단계 인증 비밀 키와 복구 코드. 모든 세션 토큰이나 링크 토큰, 또는 그 해시. 안티치트 데이터(무결성 수준과 점수, 이상 징후, 게임 분석, 신고의 가중치). 다른 플레이어가 이 플레이어에 대해 한 신고. 모더레이터의 신원. 다른 플레이어의 비공개 데이터(상대는 공개 이름과 레이팅으로만 나타나고, 다른 플레이어가 제재를 받았는지는 어디에도 드러나지 않으며, 다른 사람의 것일 수 있는 IP 주소는 포함되지 않음).

        **재인증:** 비밀번호, 그리고 2단계 인증이 켜져 있으면 인증 앱 코드 또는 복구 코드. **제한:** `account_export`(서버 전체 기준 플레이어당 1시간에 5회. 실패한 시도를 포함해 모든 시도가 집계되며, 가장 먼저 검사됨), 그다음 `reauth`와 `reauth_user`. **제한 시간:** 60초.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: 첨부 파일 형태의 내보내기 문서.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-account-<username>.json"`. 사용자 이름에서 문자, 숫자, `_`, `.`, `-` 이외의 문자는 `_`로 바뀝니다.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-account-[A-Za-z0-9_.-]+\.json"$'
              example: attachment; filename="scacelith-account-alice.json"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
              example:
                format: scacelith-account-export
                version: 1
                exportedAt: 1790882839708
                server:
                  name: Scacelith
                  host: caissa.scacelith.com
                notes:
                  - This file holds the data Scacelith keeps about your account. Times are milliseconds since 1970-01-01 UTC.
                account:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  pendingEmail: null
                  mfaEnabled: false
                  googleLinked: false
                  googleEmail: null
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882839743
                  lastLoginAt: 1790882839708
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                    rated: true
                    countedGames: 2
                    updatedAt: 1790882839809
                ratingRefunds:
                  - day: 1790812800000
                    category: '3+2'
                    points: 9
                sessions:
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    revokedAt: null
                    clientLabel: Scacelith 1.4 (Windows)
                    ip: 203.0.113.7
