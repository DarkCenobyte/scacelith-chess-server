          description: '`server_busy`(데이터베이스가 계속 잠겨 있었음), `timeout`. 또한 서버 처리가 크게 밀려 있으면 `retryAfter`가 2~5인 `server_busy`(소개 참조): 이때 요청은 실행되지 않았습니다.'
  /auth/logout-all:
    post:
