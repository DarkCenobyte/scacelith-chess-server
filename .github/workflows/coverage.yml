# Test coverage of the crates (crates/, not the test tools of tools/): the tests of the CI's test
# job (the real-engine anti-cheat tests included, with Ubuntu's Stockfish) instrumented by
# cargo-llvm-cov. The run's summary shows the line, function and region coverage; on master, the
# line coverage also goes to the badges branch, as coverage.svg (the README's coverage badge, drawn
# like a shields.io badge) and coverage.json (the same as a shields.io endpoint badge). Not one of
# the checks master requires.
name: Coverage

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short

jobs:
  coverage:
    name: Test coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends stockfish

      - name: Install the toolchain (rust-toolchain.toml) and its LLVM tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Tests, instrumented
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --locked --exclude-from-report scacelith-live-check \
            --exclude-from-report scacelith-rest-diff --json --summary-only --output-path coverage/summary.json

      - name: Measure
        run: python3 -I tools/coverage_badge.py coverage/summary.json coverage/coverage.json "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # The badge on the badges branch: one commit holding coverage.svg and coverage.json, replaced at
  # each push to master (the only job of these workflows that writes to the repository).
  badge:
    name: Coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage

      - name: Publish the badge on the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges badges
          cp coverage/coverage.svg coverage/coverage.json badges/
          git -C badges add coverage.svg coverage.json
          git -C badges -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Test coverage of $GITHUB_SHA"
          git -C badges push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/badges
