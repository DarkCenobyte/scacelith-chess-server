  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Baixar uma partida como arquivo PGN
      description: |-
        A mesma partida como arquivo PGN: uma única partida com finais de linha `\n` e o texto dos lances em linhas de menos de 80 colunas. A resposta é a mesma com ou sem token.

        Tags, nesta ordem: `Event` (`<SERVER_NAME> rated <category>` ou `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (a data de início, em UTC), `Round`, `White`, `Black`, `Result` (`*` para uma partida cancelada), `UTCDate` e `UTCTime` (o início), `WhiteElo` e `BlackElo` (os ratings no início, ou `-`), `WhiteRatingDiff` e `BlackRatingDiff` (as variações, como `+10` e `-10`, em toda partida ranqueada, `+0` quando as regras de rating deixam o rating onde estava; uma partida casual, personalizada ou cancelada não tem nenhuma das duas), `TimeControl` (em segundos), `Termination` (um valor do padrão PGN: `normal`; `time forfeit`, uma queda de bandeira, também quando termina em empate; `abandoned`; `rules infraction`, um segundo lance ilegal ou uma derrota por violação de fair play; `unterminated`, uma partida cancelada), `PlyCount`, `ScacelithGameId` (o id decimal).

        Cada lance traz `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: o relógio de quem jogou, depois do lance, e o tempo descontado por esse lance, em décimos de segundo (truncados). Um valor é omitido quando o registro não o tem. Depois do último lance vem o motivo do término por extenso, e depois o resultado.

        **Limite:** `public_read` (por jogador com token, por cliente sem token).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: O arquivo PGN.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'O texto PGN, em UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: não é um inteiro positivo de no máximo 16 dígitos (abaixo de 2^53); `invalid_request`: não é uma codificação de URL válida.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: um token foi enviado e não é válido.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: a partida não existe.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `public_read` ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: entre outros casos, os lances gravados não podem ser reproduzidos até o final gravado (o servidor registra isso no log).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (o banco de dados continuou bloqueado; `retryAfter: 1` no corpo, sem cabeçalho `Retry-After`), `server_busy` (a consulta da sessão encontrou o banco de dados bloqueado), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Baixar uma partida deste servidor como GIF animado
      description: |-
        A partida como GIF animado. Os nomes e os ratings são os do registro da partida (os ratings no início, uma conta excluída como `deleted#<id>`), assim como o resultado e o final (`Resignation`, `Loss on time`…).

        As verificações seguem esta ordem: `gif_disabled`, as opções da imagem (`size`, `orientation`, `delay`, `coords`), o id da partida, a partida, seu tamanho.

        **Sessão obrigatória:** as cotas contam por conta. **Limites:** `gif` em toda requisição; `gif_user_min`, `gif_user_hour`, `gif_ip_min` e `gif_ip_hour` somente quando o GIF precisa ser gerado (veja a descrição da seção). **Tempo limite:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 segundos (45 segundos por padrão).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: O tamanho da imagem, `small` (casas de 32 px), `medium` (48 px) ou `large` (72 px).
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: O lado que fica na parte de baixo do tabuleiro.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Milissegundos por lance (de 1 a 6 dígitos decimais).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Se as letras das colunas e os números das fileiras são desenhados em volta do tabuleiro (`1`) ou não (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` com `field` (`size`, `orientation`, `delay` ou `coords`): um valor fora dos permitidos. `invalid_game_id`. `invalid_request`: não é uma codificação de URL válida.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: a partida não existe. `gif_disabled`: o servidor desativou os GIFs (`GIF_ENABLED=false`; o token de `gif` é devolvido).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `gif`, um limite de renderização, ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: não foi possível gerar o GIF (o servidor registra o motivo no log). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` com `retryAfter` (de 3 a 10 segundos) e `Retry-After`: a fila de renderização está cheia, ou o GIF esperou `GIF_QUEUE_TIMEOUT_MS` (10 segundos) por uma thread livre; todo token de limite que a requisição consumiu é devolvido. `busy`: o banco de dados continuou bloqueado (`retryAfter: 1` só no corpo). `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Gerar um GIF animado de qualquer partida enviada como PGN
      description: |-
        A mesma imagem que `GET /games/{id}/gif` para qualquer partida enviada como texto PGN: uma partida salva pelo jogo, uma exportação de outro site, uma partida digitada à mão. Só a primeira partida do texto é usada.

        - O leitor de PGN aceita o que o leitor do próprio jogo aceita: todo PGN que este servidor escreve e as exportações usuais de outros sites (comentários, variantes, NAGs e anotações de relógio são ignorados; números de lance e SAN são lidos com tolerância; uma tag `FEN` dá a posição inicial, a menos que `SetUp` seja `"0"`).
        - Os nomes e os ratings vêm das tags `White`, `Black`, `WhiteElo` e `BlackElo`. As letras acentuadas perdem os acentos, os outros caracteres fora do ASCII imprimível viram `?`, e os nomes longos são cortados (48 caracteres). O resultado vem da tag `Result`, ou então do fim do texto dos lances. A tag `Termination` é mostrada, a menos que seja `normal`: nesse caso, a posição final conta a história (xeque-mate, afogamento).
        - Este endpoint verifica o próprio corpo: um campo desconhecido ou um `pgn` ausente ou que não é string responde 400 `invalid_request` com `field`; uma opção errada responde 400 `invalid_option` (`delayMs` deve ser um número JSON, `coords` um booleano; `null` é recusado).

        **Sessão obrigatória:** as cotas contam por conta. **Limites:** os mesmos de `GET /games/{id}/gif`. **Limite do corpo:** 135.168 bytes, qualquer que seja `HTTP_BODY_LIMIT` (o PGN como string JSON, com seus escapes). **Tempo limite:** 45 segundos por padrão.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Uma partida curta digitada, sem coordenadas
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: Um arquivo PGN com todas as opções
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` com `field` (um campo desconhecido, ou `pgn` ausente ou que não é string; sem `field` quando o corpo não é um objeto); `invalid_json`; `invalid_option` com `field` (`size`, `orientation`, `delayMs` ou `coords`); `invalid_pgn` com `line` e `column` (a partir de 1, colunas em caracteres) e a `message` do leitor: um lance ilegal ou ambíguo, uma tag malformada, uma variante desconhecida, mais de 65.536 bytes.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: o servidor desativou os GIFs (`GIF_ENABLED=false`; o token de `gif` é devolvido).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: um corpo acima de 135.168 bytes.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `gif`, um limite de renderização, ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: não foi possível gerar o GIF (o servidor registra o motivo no log). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` com `retryAfter` (de 3 a 10 segundos) e `Retry-After`: a fila de renderização está cheia, ou o GIF esperou tempo demais por uma thread livre; todo token de limite que a requisição consumiu é devolvido. `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /players/{username}:
    get:
      operationId: getPlayer
      tags:
        - players
      summary: Obter o perfil público de um jogador
      description: |-
        O perfil público de um jogador: ratings nas categorias oficiais (na ordem do servidor) e contagens de partidas. `games.total` conta todas as partidas gravadas, inclusive as casuais e as canceladas; `games.rated`, `wins`, `draws` e `losses` são somados sobre os registros de rating, portanto só partidas ranqueadas. A resposta é a mesma com ou sem token.

        **Limite:** `public_read` (por jogador com token, por cliente sem token).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: O perfil.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
              example:
                username: alice
                createdAt: 1790882839743
                ratings:
                  - category: '3+2'
                    rating: 1510
                    provisional: true
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                games:
                  total: 3
                  rated: 2
                  wins: 1
                  draws: 1
                  losses: 0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`: não tem de 2 a 24 caracteres de `[A-Za-z0-9_.-]`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: um token foi enviado e não é válido.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: o jogador não existe, ou a conta foi excluída.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `public_read` ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (o banco de dados continuou bloqueado; `retryAfter: 1` no corpo, sem cabeçalho `Retry-After`), `server_busy` (a consulta da sessão encontrou o banco de dados bloqueado), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /players/{username}/games:
    get:
      operationId: listPlayerGames
      tags:
        - players
      summary: Listar as partidas recentes de um jogador
      description: |-
        As partidas recentes do jogador, das mais recentes para as mais antigas, paginadas como o histórico, mas sem filtros nem total. `color` é o lado deste jogador. `next` é o id da última partida sempre que a página está cheia, então a página seguinte pode estar vazia. O jogador é buscado primeiro: um jogador desconhecido dá 404, seja qual for a consulta.

        **Limite:** `public_read` (por jogador com token, por cliente sem token).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Uma página das partidas do jogador.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerGamesPage'
              example:
                username: alice
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                next: 4100000000001
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_cursor` (`before` não é um id de partida), `invalid_limit` (estes dois sem `field`).'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: um token foi enviado e não é válido.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: o jogador não existe, ou a conta foi excluída.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `public_read` ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (o banco de dados continuou bloqueado; `retryAfter: 1` no corpo, sem cabeçalho `Retry-After`), `server_busy` (a consulta da sessão encontrou o banco de dados bloqueado), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: Obter os melhores jogadores de uma categoria
      description: |-
        Os 100 melhores registros ranqueados de uma categoria oficial com pelo menos `minGames` (`PROVISIONAL_GAMES`) partidas contadas, deixando de fora as contas excluídas e os trapaceiros confirmados. O servidor recalcula cada classificação no máximo a cada 10 segundos; `updatedAt` diz quando. Um único cálculo por categoria é executado por vez: enquanto isso, as outras requisições recebem a lista anterior, ou esperam o cálculo quando ainda não há nenhuma.

        **Limites:** somente a camada por endereço.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: O id de uma categoria oficial (`3+2`, ou `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: Quantos jogadores, de 1 a 100. Um número maior, de até 3 dígitos, conta como 100; um valor vazio conta como ausente.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: A classificação.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (ausente, ou não é uma categoria oficial), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: a camada por endereço.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (o banco de dados continuou bloqueado; `retryAfter: 1` no corpo, sem cabeçalho `Retry-After`), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Denunciar o adversário de uma partida recente
      description: |-
        Denuncia o adversário de uma das partidas do próprio jogador que terminou nos últimos 7 dias. Uma denúncia nunca altera, por si só, um rating, uma sanção ou um nível de integridade. Ela aumenta a prioridade de revisão que os moderadores veem e, exceto para `abuse`, pede a análise da partida pelo motor.

        Uma denúncia do mesmo adversário pela mesma partida recebe a mesma resposta e não muda nada; a resposta nunca diz nada sobre a conta denunciada. `GET /games/{id}` informa antes aos jogadores da partida se uma denúncia seria aceita (`reportable`).

        Este endpoint verifica o próprio corpo, na ordem `gameId`, `reported`, `category`, `comment`: uma falha responde 400 `invalid_request` sem `field`. Os campos que ele não conhece são ignorados.

        **Limites:** `reports` (por jogador), depois `REPORTS_PER_DAY` (5) denúncias por jogador em 24 horas (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: A denúncia foi recebida (ou já tinha sido feita).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (sem `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: não é o adversário do denunciante em uma partida que terminou nos últimos 7 dias.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, com um cabeçalho `Retry-After`): `REPORTS_PER_DAY` denúncias nas últimas 24 horas. `rate_limited`: o limite `reports` ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a consulta da sessão encontrou o banco de dados bloqueado), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /verify-email:
