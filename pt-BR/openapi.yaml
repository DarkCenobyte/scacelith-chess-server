paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Obter o nome, as versões, as portas e as regras de cadastro do servidor
      description: |-
        O que um cliente precisa antes de fazer login ou de se conectar: o nome e o ID do servidor, as versões do protocolo WebSocket e onde fica o WebSocket, as regras de cadastro, os controles de tempo oficiais e os limites que um cliente pode verificar antes de enviar um formulário.

        **Limites:** só a camada por endereço.
      security: []
      responses:
        '200':
          description: A descrição do servidor.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: a camada por endereço.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Criar uma conta
      description: |-
        Cria uma conta: assim que o seu endereço de e-mail for confirmado com o link enviado para ele, ou imediatamente, sem confirmação de e-mail.

        **Com confirmação de e-mail** (`REQUIRE_EMAIL_VERIFICATION`, o padrão): 202 `verification_sent`. Ainda não existe nenhuma conta: o cadastro fica pendente por 24 horas e reserva o seu nome de usuário nesse meio-tempo. Um link válido por essas 24 horas é enviado para o endereço, no máximo um por endereço a cada 5 minutos (`POST /auth/verify-email/resend` envia um novo); a conta é criada, com o endereço confirmado, quando o link é usado (o botão da página `/verify-email`), e o jogador pode então fazer login. Até lá, um login com esse nome de usuário retorna `invalid_credentials`, como para uma conta desconhecida, e o perfil público não existe. Um novo cadastro com o mesmo endereço substitui o pendente. A resposta é a mesma quando outra conta já usa o endereço: nesse caso nenhum link é enviado, o dono dessa conta recebe um aviso no lugar (no máximo um por hora), e o nome de usuário fica reservado da mesma forma, para que nada revele se o endereço tem uma conta. Um cadastro cujo link não foi usado é descartado após 24 horas, e o seu nome de usuário fica livre de novo.

        **Sem confirmação de e-mail** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`; a conta é criada imediatamente e pode fazer login.

        **Regras.** `username`: de `USERNAME_MIN` a `USERNAME_MAX` caracteres (3 a 20), letras, dígitos, `_` e `-`, começando com uma letra ou um dígito (`GET /info` os informa como `limits`); nomes reservados (`admin`, `moderator`, `deleted`…) e alguns prefixos são recusados; único sem distinção entre maiúsculas e minúsculas. `email`: sem espaços no início e no fim e armazenado em minúsculas, ASCII simples com um domínio com ponto. `password`: pelo menos `PASSWORD_MIN_LENGTH` (10) caracteres e no máximo 256 bytes de UTF-8; não pode conter o nome de usuário nem a parte local do e-mail, e não pode ser uma senha comum.

        **Erros**, verificados nesta ordem: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; os erros da fila de hash de senhas; 409 `email_taken` (só sem confirmação de e-mail).

        **Limites:** `auth`, depois `auth_register` (10 cadastros por hora por cliente). **Prova de trabalho:** sempre, quando `POW_REGISTER_BITS` é maior que 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Primeira tentativa, sem prova de trabalho
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Enviada novamente com a prova de trabalho
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: A conta foi criada e pode fazer login (sem confirmação de e-mail neste servidor).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: O cadastro aguarda o seu link de confirmação (ou o endereço já tem uma conta; a resposta não revela).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (com `field`), `invalid_json`, `invalid_username`, `invalid_email` ou `weak_password` com `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` ou `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: o cadastro está fechado neste servidor (`GET /info` informa `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: uma conta tem esse nome de usuário, ou um cadastro pendente de outro endereço o reserva. `email_taken`: outra conta usa o endereço (só sem confirmação de e-mail).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `auth` ou `auth_register`, ou a fila de hash de senhas.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a fila de hash de senhas, ou o banco de dados continuou bloqueado), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Fazer login com senha
      description: |-
        Faz login com um nome de usuário ou endereço de e-mail e uma senha. Há duas respostas possíveis, ambas com status 200: uma sessão ou, quando a autenticação de dois fatores está ativada, uma segunda etapa a concluir em até 5 minutos com `POST /auth/login/mfa`.

        Conta desconhecida, senha errada e conta sem senha recebem a mesma resposta, após o mesmo tempo: 401 `invalid_credentials`. As verificações da conta (`banned`, `email_unverified`) só vêm depois de uma senha correta. A partir de `AUTH_FAILURES_PER_ACCOUNT` (5) falhas em um nome de login, cada tentativa deve esperar (429 `too_many_attempts`).

        **Limite:** `auth`. **Prova de trabalho:** só durante uma onda de logins com falha (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Uma sessão, ou a segunda etapa de um login com autenticação de dois fatores.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Login efetuado
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: A autenticação de dois fatores está ativada
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: conta desconhecida, senha errada ou uma conta sem senha.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Só após uma senha correta: `banned`, com `until` (epoch em ms, `null` para um banimento permanente), ou `email_unverified` (uma conta mais antiga cujo endereço ainda não foi confirmado).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (o atraso por falhas deste nome de login), ou `rate_limited` (o limite `auth`, a fila de hash de senhas).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a fila de hash de senhas, ou o banco de dados continuou bloqueado), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Concluir um login com um segundo fator
      description: |-
        A segunda etapa de um login com autenticação de dois fatores, depois que `POST /auth/login` ou um login com o Google (`POST /auth/sso/google/finish` ou `POST /auth/sso/google/link`) retornou `mfaRequired`. Envie `code` (um código de 6 dígitos do autenticador, ou um código de recuperação) ou `recoveryCode`. Um código de recuperação usado aqui deixa de existir.

        Uma etapa aceita no máximo 5 códigos errados; a etapa também termina quando a senha é redefinida ou alterada. Depois da etapa de senha de um vínculo com o Google, o vínculo só é armazenado quando o código é aprovado aqui.

        **Limites:** `auth`, e no máximo `AUTH_MFA_PER_ACCOUNT` (10) códigos a cada 15 minutos para a conta, de qualquer endereço; além disso, o código não é verificado, então um código de recuperação não é gasto.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Um código do autenticador
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Um código de recuperação
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Login efetuado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: nem `code` nem `recoveryCode` foi enviado, ou o corpo viola o esquema; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: a etapa expirou, foi usada ou terminou após 5 códigos errados, ou a senha foi redefinida ou alterada desde a primeira etapa (faça login novamente). `invalid_code`: um código errado ou já usado.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (com `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: só após a etapa de senha de um vínculo com o Google, a conta Google foi vinculada a outra conta nesse meio-tempo.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: só após a etapa de senha de um vínculo com o Google, a conta mudou nesse meio-tempo; inicie o login novamente.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: o atraso por falhas da conta, ou os seus `AUTH_MFA_PER_ACCOUNT` códigos dos últimos 15 minutos se esgotaram. `rate_limited`: o limite `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` com `retryAfter: 1`: o banco de dados continuou bloqueado (depois de uma etapa de vínculo com o Google, nada foi vinculado: inicie o login novamente). `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Sair desta sessão
      description: |-
        Revoga a sessão do token usado. O WebSocket aberto com ela é fechado. Sem corpo (ou `{}`).

        **Limite:** `sessions`.
      security:
