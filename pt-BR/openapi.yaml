          description: 'O banco de dados continuou bloqueado (`Retry-After: 1`), ou o servidor está muito atrasado (`Retry-After` de 2 a 5, veja a introdução): nada mudou e o link continua funcionando. Também o tempo limite do handler.'
  /reset-password:
    servers:
      - url: https://caissa.scacelith.com
        description: O servidor oficial (as páginas ficam na raiz, fora de `/api/v1`).
      - url: https://{host}:{port}
