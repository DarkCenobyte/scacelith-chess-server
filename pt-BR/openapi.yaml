          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: O limite `auth` (uma página HTML), ou a camada por endereço (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'O banco de dados continuou bloqueado (`Retry-After: 1`), ou o servidor está muito atrasado (`Retry-After` de 2 a 5, veja a introdução): nada mudou e o link continua funcionando. Também o tempo limite do handler.'
  /healthz:
    servers:
      - url: https://caissa.scacelith.com
        description: O servidor oficial, na raiz.
      - url: https://caissa.scacelith.com/api/v1
        description: O servidor oficial, em `/api/v1`.
      - url: https://{host}:{port}
        description: Qualquer servidor Scacelith, na raiz.
        variables:
          host:
            default: caissa.scacelith.com
            description: O nome de host público do servidor (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: A porta pública da API (`PUBLIC_API_PORT`, senão `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Qualquer servidor Scacelith, em `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: O nome de host público do servidor (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: A porta pública da API (`PUBLIC_API_PORT`, senão `API_PORT`).
    get:
      operationId: getLiveness
      tags:
        - health
      summary: Verificar se o processo está em execução
      description: |-
        Responde 200 `ok` enquanto o processo está em execução. `HEAD` também funciona. Qualquer outro método responde 405 `method_not_allowed` com `Allow: GET, HEAD` (inclusive `OPTIONS`).

        **Limites:** somente a camada por endereço.
      security: []
      responses:
        '200':
          description: O processo está em execução.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
              example:
                status: ok
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: a camada por endereço.'
  /readyz:
    servers:
      - url: https://caissa.scacelith.com
        description: O servidor oficial, na raiz.
      - url: https://caissa.scacelith.com/api/v1
        description: O servidor oficial, em `/api/v1`.
      - url: https://{host}:{port}
        description: Qualquer servidor Scacelith, na raiz.
        variables:
          host:
            default: caissa.scacelith.com
            description: O nome de host público do servidor (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: A porta pública da API (`PUBLIC_API_PORT`, senão `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Qualquer servidor Scacelith, em `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: O nome de host público do servidor (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: A porta pública da API (`PUBLIC_API_PORT`, senão `API_PORT`).
    get:
      operationId: getReadiness
      tags:
        - health
      summary: Verificar se o servidor aceita jogadores
      description: |-
        Responde 200 `ready` quando o servidor aceita jogadores, e 503 `not_ready` enquanto ele inicia ou para. `HEAD` também funciona. Qualquer outro método responde 405 `method_not_allowed` com `Allow: GET, HEAD` (inclusive `OPTIONS`).

        **Limites:** somente a camada por endereço.
      security: []
      responses:
        '200':
          description: O servidor aceita jogadores.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: a camada por endereço.'
        '503':
          description: O servidor está iniciando ou parando.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Um token de sessão (`sct_` seguido de 43 caracteres base64url) vindo de uma resposta de login, no cabeçalho `Authorization`: `Authorization: Bearer <token>`. O prefixo é exatamente `Bearer` (diferencia maiúsculas de minúsculas) e um espaço; um valor que não o tem, ou um token que não tem de 1 a 512 caracteres ASCII imprimíveis, responde 401 `invalid_token` como qualquer outro token inválido. Um cabeçalho vazio conta como ausência de cabeçalho.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: O id da partida, um inteiro decimal positivo de no máximo 16 dígitos sem zeros à esquerda, abaixo de 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: O id da sessão, como `GET /auth/sessions` o fornece, escrito sem zeros à esquerda (`03` não é a sessão 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: O nome de usuário do jogador, sem diferenciar maiúsculas de minúsculas. O servidor aceita qualquer nome de 2 a 24 caracteres de `[A-Za-z0-9_.-]` (a regra mais ampla que ele já permitiu).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Um id de partida; só as partidas mais antigas são listadas. Passe o `next` da página anterior. Um valor vazio conta como ausente.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: O tamanho da página, de 1 a 50. Um número maior, de até 3 dígitos, conta como 50; um valor vazio conta como ausente.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: O token do link do e-mail (43 caracteres base64url). Um token ausente ou errado mostra a página “link invalid or expired” (link inválido ou expirado).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Toda resposta do servidor proíbe o cache.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Segundos a esperar antes de tentar de novo; o mesmo valor que `retryAfter` no corpo.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: O desafio bearer, com `error="invalid_token"` para um token inválido.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: O servidor fecha a conexão depois desta resposta.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (com `field` quando um campo do corpo está com problema) ou `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Um campo viola o schema
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: O corpo não é JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Uma senha fraca
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: Um PGN que não pode ser lido
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (sem cabeçalho `Authorization`) ou `invalid_token` (o token é malformado, expirou, foi revogado ou pertence a uma conta excluída).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Sem sessão
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Um token inválido
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: A requisição é recusada.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Uma senha incorreta na reautenticação
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Uma conta banida
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found`, ou um recurso que este servidor desativou.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: o corpo não chegou em 10 segundos. O servidor fecha a conexão.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: A requisição entra em conflito com o estado do servidor.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: a tentativa ou o ticket de login com o Google é desconhecido, já foi usado ou expirou; inicie o login novamente.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: o corpo excede `HTTP_BODY_LIMIT` (16.384 bytes por padrão). O servidor fecha a conexão.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: o alvo da requisição excede 4096 caracteres.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: o corpo não é `application/json`, ou seu charset não é UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: a partida tem mais de `GIF_MAX_PLIES` (600) meios-lances.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: resolva o desafio `pow` e envie a mesma requisição de novo com `pow: { challenge, nonce }`. `reason` diz o motivo: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` ou `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (um limite de requisições, o orçamento da conta, ou a fila de hash de senhas) ou `too_many_attempts` (uma restrição da conta), com `retryAfter` e um cabeçalho `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Um limite de requisições
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Falhas demais nesta conta
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: uma falha inesperada. O servidor a registra no log.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: um `state` ou `iss` errado, ou o Google recusou o código ou enviou um token de ID que não passa na verificação (inclusive um código ou token de ID do outro cliente, o do jogo ou o do site). Nunca traz o texto do Google.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` ou `timeout`: tente de novo depois de `retryAfter`, quando ele é informado.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: O servidor está ocupado
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: O banco de dados continuou bloqueado (uma leitura)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: O servidor demorou demais
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: O GIF animado, como anexo.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` para uma partida deste servidor, `attachment; filename="scacelith-game.gif"` para um PGN enviado com `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: O tamanho do arquivo em bytes.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: Uma página HTML.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: Uma página HTML que explica a recusa.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: O formulário não chegou em 10 segundos (uma página HTML). O servidor fecha a conexão.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: Uma página HTML que explica o conflito.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: O formulário excede `HTTP_BODY_LIMIT` (uma página HTML). O servidor fecha a conexão.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: O corpo não é nem um formulário (`application/x-www-form-urlencoded`) nem JSON, ou seu charset não é UTF-8 (uma página HTML).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Um limite de requisições (uma página HTML), com `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Uma falha inesperada (uma página HTML intitulada “Server error”). O servidor a registra no log.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: O servidor está ocupado (o banco de dados continuou bloqueado, ou o servidor está muito atrasado; com `Retry-After`) ou demorou demais (uma página HTML intitulada “Server error”).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: O formato único de toda resposta de erro da API JSON.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: O código de erro em `snake_case`. O cliente escolhe o que mostrar a partir dele.
          examples:
            - rate_limited
        message:
          type: string
          description: Uma frase em inglês, destinada aos logs e a servir de alternativa.
        retryAfter:
          type: integer
          minimum: 1
          description: Segundos a esperar antes de tentar de novo, presente só nas recusas que passam com o tempo. A resposta então também traz um cabeçalho `Retry-After` com o mesmo valor, exceto no 503 `busy` das leituras do histórico, de partida, de jogador e da classificação.
        field:
          type: string
          description: O campo ou parâmetro de consulta com problema (`invalid_request`, `invalid_option`, e `invalid_cursor`, `invalid_limit` e `invalid_filter` de `GET /account/games`). Um campo aninhado é escrito com pontos (`pow.nonce`).
        reason:
          type: string
          description: 'O motivo: a regra que um `weak_password` viola, ou por que uma prova de trabalho foi pedida ou recusada (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Só em `banned`: o fim do banimento (ms desde a época Unix), `null` para um banimento permanente.'
        line:
          type: integer
          minimum: 1
          description: 'Só em `invalid_pgn`: a linha do erro, a partir de 1.'
        column:
          type: integer
          minimum: 1
          description: 'Só em `invalid_pgn`: a coluna do erro, a partir de 1, em caracteres.'
    PowChallenge:
      type: object
      description: Um desafio de prova de trabalho (o `pow` de um 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: O desafio assinado, a ser devolvido como está.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: O número de bits zero iniciais que `SHA-256(challenge + ":" + nonce)` deve ter.
        expiresAt:
          type: integer
          format: int64
          description: Quando o desafio expira (ms desde a época Unix), 2 minutos depois de emitido.
    PowAnswer:
      type: object
      description: A resposta a um desafio de prova de trabalho.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: O `challenge` da resposta 428, tal como foi fornecido.
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Uma string decimal de no máximo 20 dígitos tal que `SHA-256(challenge + ":" + nonce)` comece com `bits` bits zero.
    ServerInfo:
      type: object
      description: O que um cliente precisa antes de fazer login ou se conectar.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: O nome do servidor (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: Um UUID que o banco de dados recebe na primeira inicialização. Ele continua o mesmo entre reinicializações. É `null` quando o banco de dados não consegue fornecê-lo.
        motd:
          type: string
          description: A mensagem do dia (`SERVER_MOTD`), possivelmente vazia.
        protocol:
          type: object
          description: O protocolo WebSocket (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: A versão mais antiga do protocolo que o servidor fala.
            max:
              type: integer
              minimum: 1
              description: A versão mais recente do protocolo que o servidor fala.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'A impressão digital do schema do protocolo (os 4 primeiros bytes do SHA-256 da sua forma canônica, como inteiro sem sinal: `0xc649140f`, 3326678031, para a versão secundária 2 do protocolo); informativa, nunca comparada.'
            subprotocol:
              type: string
              description: O token de subprotocolo do WebSocket (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: A porta do WebSocket que os jogadores usam (`PUBLIC_WS_PORT`, senão `WS_PORT`, senão `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: O caminho do WebSocket.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Se novas contas podem ser criadas.
        emailVerification:
          type: boolean
          description: Se as novas contas confirmam seu endereço (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Se o login com o Google é oferecido ao jogo.
            googleWeb:
              type: boolean
              description: Se o login com o Google também é oferecido a um site (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: A autenticação de dois fatores está sempre disponível.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Os bits de prova de trabalho que o cadastro exige (0 para nenhum).
        categories:
          type: array
          description: Os controles de tempo oficiais, ranqueados (`RATED_CATEGORIES`), na ordem do servidor. Qualquer outro controle de tempo é `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: As regras que um cliente pode verificar antes de enviar um formulário.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: O nome de usuário mais curto (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: O nome de usuário mais longo (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: A expressão regular à qual um novo nome de usuário deve corresponder.
            passwordMinLength:
              type: integer
              description: A senha mais curta, em caracteres (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: A senha mais longa, em bytes de UTF-8.
            customTimeControls:
              type: boolean
              description: Se desafios e partidas privadas podem usar controles de tempo personalizados.
            reportsPerDay:
              type: integer
              description: Quantas denúncias um jogador pode fazer a cada 24 horas (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: A maior mensagem WebSocket que um cliente pode enviar, em bytes.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Um controle de tempo oficial.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: O id da categoria, minutos e segundos de incremento (`3+2`).
        baseSec:
          type: number
          minimum: 0
          description: O tempo base, em segundos.
        incSec:
          type: number
          minimum: 0
          description: O incremento por lance, em segundos.
    AccountView:
      type: object
      description: A conta como o próprio jogador a vê (`user` das respostas de login e de `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: O id da conta.
        username:
          type: string
          description: O nome de usuário.
        email:
          type: string
          format: email
          description: O endereço de e-mail.
        emailVerified:
          type: boolean
          description: Se o endereço está confirmado.
        mfaEnabled:
          type: boolean
          description: Se a autenticação de dois fatores está ativada.
        googleLinked:
          type: boolean
          description: Se uma conta Google está vinculada.
        hasPassword:
          type: boolean
          description: '`false` para uma conta criada pelo Google que ainda não definiu uma senha.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Se os desafios diretos pelo nome são aceitos (veja `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Quando a conta foi criada (ms desde a época Unix).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: O último login (ms desde a época Unix), ou `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: O novo endereço de uma alteração de e-mail que aguarda o seu link, ou `null`.
    SessionAnswer:
      type: object
      description: Uma nova sessão.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: O token de sessão, para o cabeçalho `Authorization` e o WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: O fim absoluto da sessão (ms desde a época Unix); o limite de inatividade pode encerrá-la antes.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: A segunda etapa de um login com autenticação de dois fatores; continue com `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: O token da etapa, para `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Segundos restantes para concluir a etapa.
    LoginAnswer:
      description: Uma sessão, ou a segunda etapa de um login com autenticação de dois fatores.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Um primeiro login com o Google; continue com `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: O ticket para `POST /auth/sso/complete`, válido por 10 minutos.
        suggestedUsername:
          type: string
          description: Um nome de usuário formado a partir do nome no Google ou do endereço, ou `""` quando nada serve.
    SsoNeedsPassword:
      type: object
      description: Uma conta com senha usa o endereço; continue com `POST /auth/sso/google/link`. Nada foi vinculado ainda.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: O ticket para `POST /auth/sso/google/link`.
        username:
          type: string
          description: O nome de usuário dessa conta (só quem comprovou o endereço ao Google o vê).
        expiresIn:
          type: integer
          const: 600
          description: Segundos durante os quais o ticket continua válido.
    SsoFinishAnswer:
      description: A resposta de `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Uma tentativa de login com o Google.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: A tentativa, para `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: A URL do Google a abrir no navegador do sistema, depois de verificada.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: O `state` que o Google deve devolver.
        expiresIn:
          type: integer
          const: 600
          description: Segundos durante os quais a tentativa continua válida.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: O nome de usuário; em seguida, as regras do servidor (veja a descrição).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: O endereço de e-mail. Os espaços do início e do fim são removidos, e ele é gravado em minúsculas.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: A senha; em seguida, as regras de senha.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: O nome de usuário, ou o endereço de e-mail (qualquer texto com `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Opcional. Mostrado na lista de dispositivos conectados (como `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: O `mfaToken` da resposta de login (ou da resposta de um login com o Google).
        code:
          type: string
          maxLength: 32
          description: Opcional. Um código de autenticador de 6 dígitos, ou um código de recuperação.
        recoveryCode:
          type: string
          maxLength: 32
          description: Opcional. Um código de recuperação. É necessário um entre `code` e `recoveryCode`.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: O endereço de e-mail.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: O parâmetro `token` do link de redefinição.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: A nova senha; valem as regras de senha do cadastro.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: O desafio PKCE S256 do `codeVerifier` do cliente (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: A porta em que o cliente escuta em `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: O desafio PKCE S256 do `codeVerifier` da página (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: O `attemptId` de `POST /auth/sso/google/start`.
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: O verificador PKCE; seu SHA-256 deve corresponder ao desafio enviado a `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: O `state` tal como o Google o devolveu.
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: O `code` tal como o Google o devolveu (ASCII imprimível sem espaços).
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Opcional. O `iss` tal como o Google o devolveu, quando devolveu.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: O `linkTicket` de `finish`, válido por 10 minutos.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: A senha da conta.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: O `ssoTicket` de `finish`, válido por 10 minutos.
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: O nome de usuário; valem as regras do cadastro.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: As sessões ativas, começando pela usada mais recentemente.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Uma sessão ativa (um dispositivo conectado).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: O id da sessão, para `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: O login (ms desde a época Unix).
        lastSeenAt:
          type: integer
          format: int64
          description: O último uso (ms desde a época Unix), atualizado no máximo a cada 5 minutos (mais tarde enquanto o servidor está muito atrasado).
        expiresAt:
          type: integer
          format: int64
          description: O fim absoluto (ms desde a época Unix); o limite de inatividade pode encerrar a sessão antes.
        clientLabel:
          type:
            - string
            - 'null'
          description: O `clientLabel` do login, ou `null` quando nenhum foi enviado.
        current:
          type: boolean
          description: Se esta é a sessão que faz a requisição.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Um registro por categoria em que o jogador jogou partidas ranqueadas.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: As sanções ativas.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }` enquanto a conta está banida, senão `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: O registro de rating de uma categoria.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: O id da categoria.
        rating:
          type: integer
          description: O rating.
        games:
          type: integer
          minimum: 0
          description: As partidas jogadas na categoria (contadas ou não).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: O rating mais alto alcançado.
        provisional:
          type: boolean
          description: '`true` enquanto o rating ainda não está estabelecido ou tem menos de `PROVISIONAL_GAMES` partidas contadas (o jogo o mostra como `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: O tipo de sanção.
        reason:
          type:
            - string
            - 'null'
          description: O motivo informado, se houver.
        startsAt:
          type: integer
          format: int64
          description: O início (ms desde a época Unix).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: O fim (ms desde a época Unix), `null` quando a sanção é permanente.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: O fim do banimento (ms desde a época Unix), `null` quando é permanente.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` para aceitar desafios diretos pelo nome, `none` para recusá-los.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: A senha atual.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: A nova senha; valem as regras de senha do cadastro.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: A senha da conta.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Um código do segredo pendente, com exatamente 6 dígitos.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: A senha da conta.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Opcional; necessário com a autenticação de dois fatores (ou `recoveryCode`). Um código do autenticador, ou um código de recuperação.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Opcional. Um código de recuperação (`xxxx-xxxx-xx`; maiúsculas e minúsculas, espaços e hifens não importam).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: A senha da conta.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Um código do autenticador (um código de recuperação é recusado).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: O novo endereço; sem os espaços do início e do fim e convertido para minúsculas, depois verificado como um endereço de cadastro.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: A senha da conta.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Opcional; necessário com a autenticação de dois fatores (ou `recoveryCode`). Um código do autenticador, ou um código de recuperação.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Opcional. Um código de recuperação.
    TotpSetup:
      type: object
      description: O segredo pendente para o aplicativo autenticador.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: O segredo em base32, para digitar no aplicativo.
        uri:
          type: string
          format: uri
          description: O URI `otpauth://totp/...`, para mostrar como QR code.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Segundos por intervalo.
    RecoveryCodeList:
      type: array
      description: Os 10 códigos de recuperação, mostrados só desta vez. Cada um funciona uma única vez.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Um lado de uma partida.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: O nome no registro da partida (`deleted#<id>` para uma conta excluída).
        rating:
          type:
            - integer
            - 'null'
          description: O rating no início, `null` quando desconhecido.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: O rating depois da partida. Uma partida ranqueada sempre o tem; `null` só para uma partida que não conta para os ratings (casual, personalizada, cancelada).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: A variação de rating, `0` quando as regras de rating deixam o rating onde estava (a regra da FIDE do resultado zero, um adversário sem rating estabelecido, as primeiras partidas de um jogador sem rating estabelecido); `null` como em `ratingAfter`.
    GameSummary:
      type: object
      description: O resumo de uma partida gravada.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: O id da partida.
        category:
          type: string
          description: O id da categoria oficial (`3+2`), ou `custom`.
        rated:
          type: boolean
          description: Se a partida conta para os ratings.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: O controle de tempo em segundos (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (veja os códigos de partida).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: O código do motivo do término (veja os códigos de partida).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: O resultado, `*` para uma partida cancelada.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: O número de meios-lances.
        startedAt:
          type: integer
          format: int64
          description: O início (ms desde a época Unix).
        endedAt:
          type: integer
          format: int64
          description: O fim (ms desde a época Unix).
    Termination:
      type: string
      description: O nome do motivo do término (veja os códigos de partida); `Unknown` para um código que o protocolo não conhece.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Um resumo de partida do ponto de vista de um jogador.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: O lado do jogador.
    HistoryGameSummary:
      description: Uma partida do histórico do jogador conectado.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: O tempo base em milissegundos.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: O incremento em milissegundos.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: O desfecho do ponto de vista do jogador.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: As partidas da página, das mais recentes para as mais antigas.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: O id a passar como `before` para a página seguinte, ou `null` na última página.
        total:
          type: integer
          minimum: 0
          description: O número de partidas que correspondem ao filtro, em todas as páginas.
    MoveRecord:
      type: object
      description: Um meio-lance de uma partida.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: O lance em notação UCI, com `n`, `b`, `r` ou `q` acrescentado em caso de promoção.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: O tempo descontado pelo lance (ms), `null` quando o registro não o tem.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: O relógio de quem jogou, depois do lance (ms), `null` quando o registro não o tem.
    PgnTagsView:
      type: object
      description: As principais tags PGN, para exibição. Aqui, `Termination` é o nome do motivo do término; o arquivo PGN usa os valores do padrão PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` ou `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: A data de início, em UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: O rating no início, ou `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: O rating no início, ou `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: O registro de uma partida com seus lances e relógios. Tem os campos de um resumo de partida, sem `color` e `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: O tempo base em milissegundos.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: O incremento em milissegundos.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: O nome de `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: O id da partida da qual esta é uma revanche, ou `null`.
            moves:
              type: array
              description: Uma entrada por meio-lance.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Só quando o jogador do token jogou esta partida; o lado desse jogador.
            reportable:
              type: boolean
              description: Só quando o jogador do token jogou esta partida; `true` quando `POST /reports` aceitaria agora uma denúncia do adversário por esta partida (a partida terminou há no máximo 7 dias, a cota diária não se esgotou, e o adversário ainda não foi denunciado por esta partida).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: O nome de usuário, como o jogador o escreveu.
        createdAt:
          type: integer
          format: int64
          description: Quando a conta foi criada (ms desde a época Unix).
        ratings:
          type: array
          description: Somente as categorias oficiais, na ordem do servidor.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Todas as partidas gravadas, inclusive as casuais e as canceladas.
            rated:
              type: integer
              minimum: 0
              description: As partidas ranqueadas, somadas sobre os registros de rating.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: O nome de usuário, como o jogador o escreveu.
        games:
          type: array
          description: As partidas da página, das mais recentes para as mais antigas.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: O id da última partida sempre que a página está cheia (a página seguinte pode então estar vazia), senão `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: O id da categoria.
        minGames:
          type: integer
          minimum: 0
          description: As partidas contadas de que um registro precisa para ser listado (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Quando a classificação foi calculada (ms desde a época Unix).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: O texto PGN, no máximo 65.536 bytes de UTF-8. Só a primeira partida é usada.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Opcional. O tamanho da imagem.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Opcional. O lado que fica na parte de baixo do tabuleiro.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Opcional. Milissegundos por lance, um número JSON com valor inteiro.
        coords:
          type: boolean
          default: true
          description: Opcional. Se as letras das colunas e os números das fileiras são desenhados em volta do tabuleiro.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: A partida, como um inteiro ou uma string de 1 a 16 dígitos.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: O nome de usuário do adversário, como no registro da partida ou como é agora, sem diferenciar maiúsculas de minúsculas. Não pode estar em branco.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: O assunto da denúncia.
        comment:
          type:
            - string
            - 'null'
          description: Opcional. No máximo 500 caracteres depois que os caracteres de controle (exceto tabulação e quebra de linha) são removidos e os espaços do início e do fim do texto são cortados.
    AccountExport:
      type: object
      description: Tudo o que o servidor guarda sobre a conta (horários em ms desde a época Unix).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Quando a exportação foi feita.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: O que o arquivo contém e o que deixa de fora, em inglês simples para o jogador.
          items:
            type: string
        account:
          description: A visão da conta de `GET /account/me`, com `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: O endereço da conta Google vinculada, ou `null`.
        ratings:
          type: array
          description: Os registros de rating completos.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Pontos de rating devolvidos depois que um adversário foi pego trapaceando, somados por dia UTC e categoria, dos mais recentes para os mais antigos. Nem as partidas nem os trapaceiros são identificados.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Todas as sessões gravadas, das mais recentes para as mais antigas, sem nenhum token. A limpeza de retenção exclui uma sessão expirada, e uma sessão encerrada um dia depois do encerramento.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Os eventos de segurança, dos mais recentes para os mais antigos, guardados durante `RETENTION_SECURITY_DAYS`.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Todas as sanções, inclusive as já retiradas. O nome do moderador nunca é incluído.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Os eventos de conduta registrados para as partidas abandonadas, canceladas e de não comparecimento do jogador, guardados por 30 dias.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: As denúncias que o jogador fez.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: O número de partidas.
            list:
              type: array
              description: Todas as partidas, das mais recentes para as mais antigas, como resumos de `GET /account/games`. Os lances estão em `GET /games/{id}` e o PGN em `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Um registro de rating completo.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Se o jogador já saiu da fase sem rating estabelecido.
            countedGames:
              type: integer
              minimum: 0
              description: As partidas que entraram no rating.
            updatedAt:
              type: integer
              format: int64
              description: Quando o registro mudou pela última vez.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: 00:00 UTC do dia (ms desde a época Unix).
        category:
          type: string
        points:
          type: integer
          description: Os pontos devolvidos nesse dia nessa categoria.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Quando a sessão foi encerrada, ou `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: O endereço do login, apagado depois de `RETENTION_IP_DAYS`.
    SecurityEvent:
      type: object
      description: |-
        Um evento de segurança. `ip` só é informado para o que foi feito com a sessão iniciada, com a senha da conta (e o segundo fator) ou com um link enviado para o endereço dela: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` e `account_exported`; todos os outros tipos têm `ip: null`, e `ip` é apagado depois de `RETENTION_IP_DAYS`.

        `detail` só guarda estes campos: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` e `method` (`password`, ou `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` e `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Um evento `moderator_action` só guarda `{ action }`, para as ações `ban`, `unban`, `reset_mfa`, `verify_email` e `revoke_sessions` (as outras ações de moderador ficam de fora). Todos os outros tipos têm `detail: null`. Os eventos `rating_refund` ficam de fora: seus pontos estão em `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: O tipo de evento (`login`, `password_changed`…).
        at:
          type: integer
          format: int64
          description: Quando aconteceu.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: O nome público atual do jogador denunciado.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Se a denúncia ainda está aberta (não se informa se o jogador denunciado foi sancionado).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: O token do link do e-mail (o campo oculto do formulário da página).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: O token do link de redefinição (o campo oculto do formulário).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: A nova senha; valem as regras de senha do cadastro.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: A nova senha de novo; ela deve ser igual.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: Uma página HTML em UTF-8 (`text/html; charset=utf-8`), sem JavaScript nem recursos externos.
