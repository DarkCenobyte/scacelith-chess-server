          content:
            application/json:
              schema:
                type: object
                required:
                  - recoveryCodes
                properties:
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (uma conta que só entra com o Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code` (também para um código de recuperação).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (reautenticações que falharam, ou códigos demais tentados nesta conta), ou `rate_limited` (o limite `reauth` ou `reauth_user`, o orçamento da conta, a fila de hash de senhas).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a fila de hash de senhas, ou o banco de dados continuou bloqueado), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: Alterar o endereço de e-mail
      description: |-
        Altera o endereço de e-mail da conta. `newEmail` tem os espaços do início e do fim removidos e é convertido para minúsculas; depois é verificado como um endereço de cadastro.

        **Com confirmação por e-mail** (o padrão): 202 `verification_sent`. Um link válido por 24 horas vai para o novo endereço; ele abre `/confirm-email-change`, e o endereço só muda quando o jogador clica no botão dessa página. Até lá, `GET /account/me` mostra o novo endereço como `pendingEmail`. Uma nova requisição substitui a pendente; uma alteração ou redefinição de senha a cancela. No máximo um link vai para um mesmo novo endereço a cada 5 minutos, não importa quem peça (uma requisição para a alteração já pendente mantém o link enviado antes, que continua válido); a resposta é a mesma. O endereço atual recebe um aviso de que foi solicitada uma alteração para um endereço mascarado (`a***@example.org`). A resposta e `pendingEmail` são os mesmos quando outra conta já usa o novo endereço: nesse caso nenhum link é enviado, de modo que essa alteração nunca se conclui, e o titular desse endereço recebe um aviso (no máximo um por hora) em vez disso.

        Quando o link é confirmado, o endereço muda e passa a contar como confirmado, os dispositivos continuam conectados, os links enviados antes (confirmação, redefinição de senha, outras alterações) param de funcionar, e o endereço anterior é avisado, com o novo mascarado.

        **Sem confirmação por e-mail** (`REQUIRE_EMAIL_VERIFICATION=false`): o endereço muda imediatamente (200 `email_changed`), e o endereço anterior é avisado. Se outra conta usa o endereço, a resposta é 409 `email_taken`, e o titular desse endereço recebe o aviso.

        **Reautenticação:** a senha e, com a autenticação de dois fatores, um código do autenticador ou um código de recuperação. `invalid_email` e `same_email` são verificados antes da senha, então não contam como falha. **Limites:** `reauth`, depois `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: O endereço mudou imediatamente (sem confirmação por e-mail neste servidor).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: O novo endereço, como foi gravado.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: Um link de confirmação foi enviado para o novo endereço (ou o endereço pertence a outra conta; a resposta não diz).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email` (o endereço atual da conta), `password_not_set` (uma conta que só entra com o Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` (também quando uma alteração ou redefinição de senha passou à frente da requisição: nenhum link é enviado), `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: somente sem confirmação por e-mail.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (reautenticações que falharam, ou códigos demais tentados nesta conta), ou `rate_limited` (o limite `reauth` ou `reauth_user`, o orçamento da conta, a fila de hash de senhas).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: a fila de hash de senhas, ou o banco de dados continuou bloqueado (`retryAfter: 1`: nada mudou, e a mesma requisição pode ser enviada de novo). `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: Baixar os dados da conta
      description: |-
        Tudo o que o servidor guarda sobre a conta, em um único arquivo JSON para salvar (`format` `scacelith-account-export`, `version` 1). A exportação registra um evento de segurança (`account_exported`). O array `notes` do documento diz ao jogador, em inglês simples, o que fica de fora.

        **Nunca na exportação:** o hash da senha, o segredo da autenticação de dois fatores e os códigos de recuperação; qualquer token de sessão ou de link, ou um hash de um deles; os dados do sistema antitrapaça (nível e pontuação de integridade, anomalias, a análise das partidas, o peso de uma denúncia); as denúncias que outros jogadores fizeram sobre o jogador; as identidades dos moderadores; os dados privados de outros jogadores (os adversários aparecem pelo nome público e pelo rating, nada indica se outro jogador foi sancionado, e nenhum endereço IP que possa ser de outra pessoa é incluído).

        **Reautenticação:** a senha e, com a autenticação de dois fatores, um código do autenticador ou um código de recuperação. **Limites:** `account_export` (5 por hora por jogador, para o servidor inteiro; toda tentativa conta, inclusive as que falham; verificado primeiro), depois `reauth` e `reauth_user`. **Tempo limite:** 60 segundos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: O documento de exportação, como anexo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-account-<username>.json"`. Os caracteres do nome de usuário que não são letras, dígitos, `_`, `.` e `-` viram `_`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-account-[A-Za-z0-9_.-]+\.json"$'
              example: attachment; filename="scacelith-account-alice.json"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
              example:
                format: scacelith-account-export
                version: 1
                exportedAt: 1790882839708
                server:
                  name: Scacelith
                  host: caissa.scacelith.com
                notes:
                  - This file holds the data Scacelith keeps about your account. Times are milliseconds since 1970-01-01 UTC.
                account:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  pendingEmail: null
                  mfaEnabled: false
