          description: O formulário de nova senha.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: O link é inválido (também quando foi enviado para um endereço que a conta não tem mais).
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: O limite `page` (uma página HTML), ou a camada por endereço (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
    post:
      operationId: submitResetPasswordPage
      tags:
        - pages
      summary: Definir uma nova senha pelo formulário de redefinição
      description: |-
        O formulário da página de redefinição; ele faz o que `POST /auth/password/reset` faz, em uma única transação: todos os dispositivos são desconectados, uma alteração de e-mail pendente é cancelada, os outros links de redefinição param de funcionar, o endereço passa a contar como confirmado e o titular recebe um e-mail.

        Primeiro o link é verificado, depois se as duas senhas são iguais, depois as regras de senha. Quando o servidor está ocupado, o formulário volta com `Retry-After` e o link continua válido.

        **Limites:** `auth`, depois `auth_reset` (compartilhado com `POST /auth/password/reset`).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: A senha foi alterada, e todos os dispositivos foram desconectados.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: O formulário de novo com o erro (as senhas são diferentes, uma senha fraca), o link é inválido, ou o formulário é inválido (uma página HTML).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: O limite `auth` ou `auth_reset` (uma página HTML), o formulário de novo com `Retry-After` quando este cliente tem hashes de senha demais aguardando (o link continua válido), ou a camada por endereço (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'O formulário de novo com `Retry-After` quando o servidor está ocupado (a fila de hash de senhas, ou o banco de dados continuou bloqueado); o link continua válido. Quando o servidor está muito atrasado (veja a introdução), em vez disso, uma página “Server error” (erro do servidor) com `Retry-After` (de 2 a 5): nada foi executado e o link continua válido. Também o tempo limite do handler.'
