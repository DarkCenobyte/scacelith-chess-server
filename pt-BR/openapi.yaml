  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Listar as partidas do jogador, filtradas e paginadas
      description: |-
        As partidas do jogador conectado, das mais recentes para as mais antigas, filtradas e paginadas, com o número de partidas que correspondem ao filtro. Todo parâmetro de consulta é opcional, e um valor vazio conta como ausente.

        Paginação: passe o `next` da página anterior como `before`; `next` é `null` na última página. `total` conta as partidas que correspondem ao filtro, em todas as páginas.

        **Limite:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: O id de uma categoria oficial (`3+2`, ou `3%2B2`), ou `custom` para todas as partidas com outro controle de tempo.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Somente partidas ranqueadas (`true`) ou casuais (`false`).
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Somente as partidas ganhas, perdidas ou empatadas, do ponto de vista do jogador. As partidas canceladas só aparecem sem este filtro.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
