  - name: two-step-verification
    x-displayName: Autenticação de dois fatores
    description: Aplicativos autenticadores (TOTP, RFC 6238), com SHA-1, 6 dígitos, intervalos de 30 segundos e um intervalo de tolerância para cada lado, além de códigos de recuperação de uso único.
  - name: email-change
