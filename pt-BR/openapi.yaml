      summary: Sair de todas as sessões
      description: |-
        Revoga todas as sessões da conta, inclusive esta. Os WebSockets abertos com elas são fechados. Sem corpo (ou `{}`).

        **Limite:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Todas as sessões foram encerradas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: um corpo diferente de `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `sessions` ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (o banco de dados continuou bloqueado), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Enviar o link de confirmação novamente
      description: |-
        Envia novamente o link de confirmação de e-mail. A resposta é 202 `accepted` seja qual for o endereço, para nunca revelar se uma conta ou um cadastro o usa.

        Uma requisição tem efeito no máximo uma vez a cada 5 minutos por endereço. Um cadastro pendente com esse endereço ganha novamente as suas 24 horas, quer outra conta use o endereço ou não, para que o seu nome de usuário fique reservado pelo mesmo tempo nos dois casos. Um link só é enviado para esse cadastro quando o endereço não tem conta (um novo link, válido por 24 horas, substitui o anterior), ou para uma conta ativa e não confirmada com esse endereço.

        **Limites:** `auth`, depois `auth_mail` (10 por hora por cliente).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Requisição aceita (seja qual for o endereço).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `auth` ou `auth_mail` (seja qual for o endereço).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` com `retryAfter: 1`: o banco de dados continuou bloqueado enquanto a conta era consultada ou o link de uma conta não confirmada era armazenado (a renovação de um cadastro pendente é feita em regime de melhor esforço e nunca faz a requisição falhar); os 5 minutos do endereço começam a contar mesmo assim, então uma nova requisição dentro deles não faz nada. `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Enviar um link de redefinição de senha
      description: |-
        Envia um link de redefinição de senha, válido por uma hora, que abre a página `/reset-password`. A resposta é 202 `accepted` seja qual for o endereço. Um link só vai para uma conta ativa, no máximo uma vez a cada 5 minutos por endereço. Uma conta só com Google define a sua primeira senha desta forma.

        A recuperação de senha tem os limites mais rígidos da API, todos contados para o servidor inteiro: 3 requisições por hora (`AUTH_FORGOT_PER_HOUR`) e 10 a cada 24 horas (`AUTH_FORGOT_PER_DAY`) por cliente (um endereço IPv4 ou um prefixo IPv6 /64), o triplo desses números por prefixo IPv6 /48, além do limite `auth` (20 a cada 10 minutos) e do único e-mail por endereço a cada 5 minutos. Nem o 202 nem o 429 revelam se uma conta usa o endereço. Definir a nova senha tem um limite próprio (`auth_reset`).

        **Limites:** `auth`, `auth_forgot`, depois `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Requisição aceita (seja qual for o endereço).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `auth`, `auth_forgot` ou `auth_forgot_day` (seja qual for o endereço).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` com `retryAfter: 1`: o banco de dados continuou bloqueado enquanto a conta era consultada ou o link era armazenado; os 5 minutos do endereço começam a contar mesmo assim, então uma nova requisição dentro deles não envia nenhum link. `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Definir uma nova senha com o token de um link de redefinição
      description: |-
        Define uma nova senha com o token de um link de redefinição (a página `/reset-password` faz o mesmo). A nova senha segue as regras do cadastro.

        A redefinição tem estes efeitos, em uma única transação (todos ou nenhum): ela revoga todas as sessões e cancela uma alteração de e-mail pendente; os outros links de redefinição da conta deixam de funcionar; o endereço passa a contar como confirmado (o link o comprovou); o dono recebe um e-mail. A autenticação de dois fatores não é alterada. Após um erro da fila de hash de senhas, um 503 ou um 500, nada mudou: a senha antiga e as sessões continuam, e o link continua válido.

        **Limites:** `auth`, depois `auth_reset` (10 por hora por cliente, 30 por prefixo IPv6 /48, compartilhado com a página: cada tentativa calcula o hash de uma senha).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: A senha foi alterada e todas as sessões foram encerradas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: o link é inválido, já foi usado ou expirou, ou foi enviado para um endereço que a conta não tem mais. `weak_password` (com `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `auth` ou `auth_reset`, ou a fila de hash de senhas.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: a fila de hash de senhas, ou o banco de dados continuou bloqueado (`retryAfter: 1`, nada mudou). `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Iniciar um login com o Google
      description: |-
        Inicia uma tentativa de login com o Google para o desafio PKCE e a porta do listener do jogo em `127.0.0.1`. A resposta dá a URL do Google a abrir no navegador do sistema e o `state` da tentativa; a tentativa é válida por 10 minutos.

        `authUrl` contém `client_id`, `redirect_uri` (construído a partir de `redirectPort` e da tag de origem do servidor), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 do verificador próprio do servidor para o Google) com `code_challenge_method=S256`, e `prompt=select_account`. O jogo a verifica antes de abri-la (veja a descrição da tag).

        **Limite:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: A tentativa.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: o login com o Google não é oferecido neste servidor.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (o banco de dados continuou bloqueado), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Iniciar um login com o Google em um site
      description: |-
        Inicia uma tentativa de login com o Google de um site para o desafio PKCE da sua página. A resposta é a mesma que para o jogo: a URL do Google para onde navegar e o `state` da tentativa; a tentativa é válida por 10 minutos. Oferecido quando `GET /info` informa `sso.googleWeb: true`.

        `authUrl` contém o `client_id` do site e `redirect_uri=GOOGLE_WEB_REDIRECT_URI`, com os mesmos outros parâmetros que para o jogo. A página a verifica antes de navegar até ela (veja **Em um site** na descrição da tag).

        **Limite:** `sso_start`, compartilhado com o início do jogo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: A tentativa.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: um `codeChallenge` ausente ou malformado, ou qualquer outro campo (inclusive `redirectPort`).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: o login com o Google não é oferecido neste servidor, ou não para sites.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `sso_start` (compartilhado com o início do jogo).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (o banco de dados continuou bloqueado), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Entregar a resposta do Google ao servidor
      description: |-
        Entrega ao servidor o `code` e o `state` que o Google enviou ao listener do jogo ou à página do site, com o ID da tentativa e o verificador PKCE. Um ID de tentativa é inútil sem o verificador, e o código é inútil sem o verificador PKCE próprio do servidor e a chave secreta do cliente.

        O servidor verifica a tentativa (desconhecida, usada ou expirada: 410), depois o verificador (um verificador errado deixa a tentativa utilizável), depois usa a tentativa uma vez, verifica `state` e `iss`, troca o código com o Google e verifica o token de ID. A resposta (200) é uma destas:

        - `{ token, expiresAt, user }`: login efetuado na conta vinculada;
        - `{ mfaRequired, mfaToken, expiresIn }`: continue com `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: uma conta nova; continue com `POST /auth/sso/complete` em até 10 minutos. `suggestedUsername` vem do nome no Google ou do endereço, e é `""` quando nada serve;
        - `{ needsPassword, linkTicket, username, expiresIn }`: a conta com esse endereço tem senha; continue com `POST /auth/sso/google/link`. Nada foi vinculado ainda.

        **Limite:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Uma sessão, uma segunda etapa ou a próxima etapa de um primeiro login com o Google.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Login efetuado na conta vinculada
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: A autenticação de dois fatores está ativada
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Um jogador novo
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Uma conta com senha usa o endereço
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: o verificador não corresponde ao desafio da tentativa (a tentativa continua utilizável). `sso_email_unverified`: o Google não confirmou o endereço. `registration_closed`. `account_disabled`. Só para uma conta vinculada: `banned` (com `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: o login com o Google não é oferecido neste servidor.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: uma conta ativa sem senha usa o endereço (ela não é identificada).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: uma tentativa desconhecida, usada ou expirada.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (o banco de dados continuou bloqueado), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Vincular o Google a uma conta existente com a senha dela
      description: |-
        Depois que `finish` retornou `needsPassword`: vincula o Google à conta existente com a senha dessa conta, digitada no jogo. A resposta (200) é uma sessão (o vínculo é armazenado e o login do jogador é efetuado) ou, quando a autenticação de dois fatores está ativada, `{ mfaRequired, mfaToken, expiresIn }`: continue com `POST /auth/login/mfa`, e o vínculo só é armazenado quando um código for aprovado lá.

        Uma senha errada deixa o ticket utilizável, por 5 tentativas no total. Uma tentativa é consumida logo antes de a senha ser verificada: um 429 `too_many_attempts` ou um 428 `pow_required` não consome nenhuma, enquanto uma recusa da fila de hash de senhas (503 `server_busy`, 429 `rate_limited`) já consumiu uma e conta como uma falha da conta. O atraso por falhas é o mesmo contador de `POST /auth/login`.

        **Limite:** `auth` (com a sua contagem por prefixo IPv6 /48). **Prova de trabalho:** como para `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Uma sessão, ou a segunda etapa do login.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: uma senha incorreta; o ticket continua valendo, para 5 tentativas no total.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (com `until`), somente após uma senha correta.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: o login com o Google não é oferecido neste servidor.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: a conta Google foi vinculada a outra conta nesse meio-tempo.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: um ticket desconhecido, já usado ou expirado, a 5ª senha incorreta, uma conta cujo status ou endereço mudou desde `finish`, ou uma conta cujo status, endereço, senha ou autenticação de dois fatores mudou enquanto o vínculo era gravado. Inicie o login novamente.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (o tempo de espera por falhas da conta), ou `rate_limited` (o limite `auth`, a fila de hash de senhas).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: a fila de hash de senhas, ou o banco de dados continuou bloqueado (`retryAfter: 1`, nada foi vinculado). `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Criar a conta de um primeiro login com o Google
      description: |-
        Depois que `finish` respondeu `needsUsername`: cria a conta com o nome de usuário escolhido (valem as regras do cadastro) e faz o login nela. A conta não tem senha: `hasPassword` é `false`, e “Esqueceu a senha?” (`POST /auth/password/forgot`) dá uma senha a ela.

        **Limite:** `auth` (com sua contagem por IPv6 /48).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: A conta foi criada e o login foi feito.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: o login com o Google não é oferecido neste servidor.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (uma conta tem esse nome de usuário, ou um cadastro pendente de outro endereço o reserva), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: um ticket desconhecido, já usado ou expirado.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (o banco de dados continuou bloqueado), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Listar os dispositivos conectados
      description: |-
        As sessões ativas da conta (dispositivos conectados), começando pela usada mais recentemente. `current` marca a sessão que faz a requisição. `lastSeenAt` é atualizado no máximo a cada 5 minutos (mais tarde enquanto o servidor está muito atrasado); `expiresAt` é o fim absoluto, e o limite de inatividade pode encerrar a sessão antes.

        **Limite:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: As sessões ativas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `sessions` ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (o banco de dados continuou bloqueado), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Desconectar um dispositivo
      description: |-
        Encerra uma sessão da conta; a sessão atual também pode ser encerrada. O WebSocket aberto com ela é fechado. Sem corpo (ou `{}`).

        **Limite:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: A sessão foi encerrada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: um corpo diferente de `{}`, ou um `id` que não é uma codificação de URL válida; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: nenhuma sessão ativa com este id nesta conta.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `sessions` ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (o banco de dados continuou bloqueado), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Obter a conta, seus ratings e as sanções ativas
      description: |-
        A conta como o próprio jogador a vê: a visão da conta (também o `user` de toda resposta de login), um registro de rating por categoria em que o jogador jogou partidas ranqueadas, as sanções ativas e o banimento. O nível de integridade do sistema antitrapaça nunca é mostrado.

        **Limite:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A conta.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`, ou `invalid_token` (também quando a conta foi excluída).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `account` ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (o banco de dados continuou bloqueado), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Aceitar ou recusar desafios diretos
      description: |-
        Define se outros jogadores podem desafiar este jogador pelo nome. Com `none`, os desafios diretos são recusados: quem desafia é informado de que o jogador não está disponível. Sem reautenticação.

        **Limite:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: As preferências agora em vigor.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `account` ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (o banco de dados continuou bloqueado), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Alterar a senha
      description: |-
        Altera a senha. A senha atual é necessária, mas nenhum segundo fator, mesmo com a autenticação de dois fatores ativada. A nova senha segue as regras do cadastro (verificadas depois da senha atual).

        A alteração tem estes efeitos, em uma única transação (todos eles, ou nenhum): revoga todas as outras sessões (esta continua conectada), cancela uma alteração de e-mail pendente, faz os links de redefinição de senha da conta pararem de funcionar e envia um e-mail ao titular.

        **Reautenticação:** somente a senha. **Limites:** `reauth`, depois `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: A senha foi alterada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (uma conta que só entra com o Google), `weak_password` (com `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: uma senha atual incorreta, ou uma redefinição ou alteração de senha que ocorreu enquanto a requisição era verificada.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (reautenticações da conta que falharam), ou `rate_limited` (o limite `reauth` ou `reauth_user`, o orçamento da conta, a fila de hash de senhas).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: a fila de hash de senhas, ou o banco de dados continuou bloqueado (`retryAfter: 1`, nada mudou). `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Começar a ativar a autenticação de dois fatores
      description: |-
        Grava um novo segredo de autenticador pendente, que substitui qualquer segredo pendente anterior, e o retorna para o aplicativo autenticador (como texto e como um URI `otpauth://` para mostrar como QR code). A autenticação de dois fatores ainda não está ativada: `POST /account/mfa/totp/enable` a ativa com um código deste segredo.

        **Reautenticação:** somente a senha. **Limites:** `reauth`, depois `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: O segredo pendente.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (uma conta que só entra com o Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (verificado antes da senha).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (reautenticações da conta que falharam), ou `rate_limited` (o limite `reauth` ou `reauth_user`, o orçamento da conta, a fila de hash de senhas).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a fila de hash de senhas, ou o banco de dados continuou bloqueado), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Concluir a ativação da autenticação de dois fatores e obter os códigos de recuperação
      description: |-
        Ativa a autenticação de dois fatores com um código do segredo pendente (exatamente 6 dígitos). Nenhuma senha é pedida aqui; ela foi informada na configuração. A resposta contém 10 códigos de recuperação, mostrados só desta vez.

        **Limites:** `reauth`, depois `reauth_user`; um código incorreto conta nas falhas de reautenticação da conta.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: A autenticação de dois fatores está ativada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` não tem exatamente 6 dígitos, ou o corpo viola o schema; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: um código incorreto (verifique a hora do dispositivo).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: nenhum segredo pendente (chame `POST /account/mfa/totp/setup` primeiro).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (reautenticações da conta que falharam), ou `rate_limited` (o limite `reauth` ou `reauth_user`, o orçamento da conta).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (o banco de dados continuou bloqueado), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (veja a introdução): a requisição não foi executada.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: Desativar a autenticação de dois fatores
      description: |-
        Desativa a autenticação de dois fatores. O segredo e os códigos de recuperação são excluídos, e o titular recebe um e-mail.

        **Reautenticação:** a senha e um código do autenticador ou um código de recuperação (um de `code` ou `recoveryCode` é obrigatório). **Limites:** `reauth`, depois `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
