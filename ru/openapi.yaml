  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: Сменить адрес эл. почты
      description: |-
        Меняет адрес эл. почты аккаунта. У `newEmail` обрезаются пробелы по краям, он приводится к нижнему регистру и затем проверяется так же, как адрес при регистрации.

        **С подтверждением по почте** (по умолчанию): 202 `verification_sent`. На новый адрес отправляется ссылка, действительная 24 часа; она открывает `/confirm-email-change`, и адрес меняется, только когда игрок нажмёт кнопку на этой странице. До тех пор `GET /account/me` показывает новый адрес в `pendingEmail`. Новый запрос заменяет ожидающий; смена или сброс пароля отменяют его. На конкретный новый адрес уходит не больше одной ссылки раз в 5 минут, кто бы её ни запрашивал (запрос на уже ожидающую смену сохраняет отправленную ранее ссылку, и она остаётся действительной); ответ при этом тот же. На текущий адрес приходит уведомление о том, что запрошена смена на замаскированный адрес (`a***@example.org`). Ответ и `pendingEmail` такие же, если новый адрес уже использует другой аккаунт: ссылка тогда не отправляется, так что смена никогда не завершится, а владелец того адреса вместо этого получает уведомление (не чаще одного в час).

        Когда ссылка подтверждена, адрес меняется и считается подтверждённым, сеансы на устройствах сохраняются, отправленные ранее ссылки (подтверждение, сброс пароля, другие смены адреса) перестают работать, а на прежний адрес приходит уведомление, в котором новый адрес замаскирован.

        **Без подтверждения по почте** (`REQUIRE_EMAIL_VERIFICATION=false`): адрес меняется сразу (200 `email_changed`), и на прежний адрес приходит уведомление. Если адрес использует другой аккаунт, ответ — 409 `email_taken`, а владелец того адреса получает уведомление.

        **Повторная аутентификация:** пароль, а при двухфакторной аутентификации — ещё код из приложения-аутентификатора или код восстановления. `invalid_email` и `same_email` проверяются до пароля, поэтому неудачами не считаются. **Лимиты:** `reauth`, затем `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Адрес сменён сразу (на этом сервере нет подтверждения по почте).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: Новый адрес в том виде, в каком он сохранён.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: На новый адрес отправлена ссылка для подтверждения (или адрес принадлежит другому аккаунту — ответ этого не сообщает).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email` (текущий адрес аккаунта), `password_not_set` (аккаунт, который входит только через Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` (в том числе если смена или сброс пароля опередили запрос: ссылка не отправляется), `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: только без подтверждения по почте.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (неудачные повторные аутентификации или слишком много опробованных кодов для этого аккаунта) или `rate_limited` (лимит `reauth` или `reauth_user`, бюджет аккаунта, очередь хеширования паролей).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: очередь хеширования паролей, или база данных так и осталась заблокированной (`retryAfter: 1`: ничего не изменено, и тот же запрос можно отправить снова). `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: Скачать данные аккаунта
      description: |-
        Всё, что сервер хранит об аккаунте, в виде одного файла JSON для сохранения (`format` `scacelith-account-export`, `version` 1). Экспорт записывает событие безопасности (`account_exported`). Массив `notes` в документе простым английским языком объясняет игроку, что в файл не вошло.

        **В экспорт никогда не попадают:** хеш пароля, секрет двухфакторной аутентификации и коды восстановления; любые токены сеансов и ссылок или их хеши; данные античита (уровень доверия и балл, аномалии, анализ партий, вес жалобы); жалобы других игроков на этого игрока; личности модераторов; личные данные других игроков (соперники указаны под публичным именем и с рейтингом, ничто не выдаёт, получал ли другой игрок санкции, и не включается ни один IP-адрес, который может принадлежать другому человеку).

        **Повторная аутентификация:** пароль, а при двухфакторной аутентификации — ещё код из приложения-аутентификатора или код восстановления. **Лимиты:** `account_export` (5 в час на игрока, для всего сервера; засчитывается каждая попытка, включая неудачные; проверяется первым), затем `reauth` и `reauth_user`. **Ограничение по времени:** 60 секунд.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Документ экспорта в виде вложения.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-account-<username>.json"`. Символы имени пользователя, кроме букв, цифр, `_`, `.` и `-`, заменяются на `_`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-account-[A-Za-z0-9_.-]+\.json"$'
              example: attachment; filename="scacelith-account-alice.json"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
              example:
                format: scacelith-account-export
                version: 1
                exportedAt: 1790882839708
                server:
                  name: Scacelith
                  host: caissa.scacelith.com
                notes:
                  - This file holds the data Scacelith keeps about your account. Times are milliseconds since 1970-01-01 UTC.
                account:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  pendingEmail: null
                  mfaEnabled: false
                  googleLinked: false
                  googleEmail: null
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882839743
                  lastLoginAt: 1790882839708
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                    rated: true
                    countedGames: 2
                    updatedAt: 1790882839809
                ratingRefunds:
                  - day: 1790812800000
                    category: '3+2'
                    points: 9
                sessions:
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    revokedAt: null
                    clientLabel: Scacelith 1.4 (Windows)
                    ip: 203.0.113.7
                securityEvents:
                  - kind: login
                    at: 1790882839708
                    ip: 203.0.113.7
                    detail:
                      method: password
                sanctions: []
                conduct:
                  - kind: abort
                    at: 1790800000000
                reportsFiled:
                  - gameId: 4100000000001
                    reported: bob
                    category: other
                    comment: rude
                    createdAt: 1790882840000
                    status: open
                games:
                  total: 1
                  list:
                    - id: 4100000000001
                      category: '3+2'
                      rated: true
                      timeControl: '180+2'
                      white:
                        name: alice
                        rating: 1500
                        ratingAfter: 1510
                        ratingDiff: 10
                      black:
                        name: bob
                        rating: 1520
                        ratingAfter: 1510
                        ratingDiff: -10
                      color: white
                      status: 1
                      reason: 2
                      result: 1-0
                      termination: Resignation
                      plies: 41
                      startedAt: 1790620205000
                      endedAt: 1790620611000
                      baseMs: 180000
                      incMs: 2000
                      outcome: win
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (аккаунт, который входит только через Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required` или `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (неудачные повторные аутентификации или слишком много опробованных кодов для этого аккаунта) или `rate_limited` (лимит `account_export`, `reauth` или `reauth_user`, бюджет аккаунта, очередь хеширования паролей).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (база данных так и осталась заблокированной; с заголовком `Retry-After: 1`), `server_busy` (очередь хеширования паролей), `timeout` (60 секунд). Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: Удалить аккаунт
      description: |-
        Удаляет аккаунт; это действие нельзя отменить.

        - Все сеансы сразу отзываются: с этого момента токен получает 401 `invalid_token`.
        - Имя пользователя заменяется на `deleted#<id>` — в аккаунте и во всех записях партий.
        - Стираются: адрес эл. почты, хеш пароля, секрет двухфакторной аутентификации и коды восстановления, сеансы и токены ссылок, привязка к Google, запись античита об уровне доверия и IP-адреса, сохранённые вместе с событиями безопасности.
        - Рейтинги и партии сохраняются. Партии остаются доступными под анонимным именем, а `GET /players/{username}` для прежнего имени отвечает 404.

        **Повторная аутентификация:** пароль, а при двухфакторной аутентификации — ещё код из приложения-аутентификатора или код восстановления. **Лимиты:** `reauth`, затем `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Аккаунт удалён.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (аккаунт, который входит только через Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required` или `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (неудачные повторные аутентификации или слишком много опробованных кодов для этого аккаунта) или `rate_limited` (лимит `reauth` или `reauth_user`, бюджет аккаунта, очередь хеширования паролей).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (очередь хеширования паролей, или база данных так и осталась заблокированной), `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Список партий игрока с фильтрами и постраничным выводом
      description: |-
        Партии игрока, выполнившего вход, начиная с самых новых, с фильтрами и постраничным выводом, а также число партий, подходящих под фильтр. Все параметры запроса необязательны, а пустое значение равносильно отсутствию параметра.

        Постраничный вывод: передайте `next` предыдущей страницы в `before`; на последней странице `next` равно `null`. `total` — число партий, подходящих под фильтр, на всех страницах.

        **Лимит:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: Идентификатор официальной категории (`3+2` или `3%2B2`) или `custom` — для всех партий с другим контролем времени.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Только рейтинговые (`true`) или товарищеские (`false`) партии.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Только выигранные, проигранные или сыгранные вничью партии — с точки зрения игрока. Отменённые партии видны только без этого фильтра.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Одна страница истории.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` не является идентификатором партии), `invalid_limit` или `invalid_filter` (`category`, `rated` или `result`) — каждая с `field`, где указан параметр.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимит `account_games` или бюджет аккаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (база данных так и осталась заблокированной; `retryAfter: 1` в теле, без заголовка `Retry-After`), `server_busy` (при поиске сеанса база данных оказалась заблокированной), `timeout`.'
  /games/{id}:
    get:
      operationId: getGame
      tags:
        - games
      summary: Получить запись партии с ходами и показаниями часов
      description: |-
        Одна запись партии с ходами и показаниями часов. Без токена или с токеном игрока, который не участвовал в партии, возвращается общедоступный ответ. Если владелец токена играл в этой партии, в ответ добавляются `you` и `reportable`.

        **Лимит:** `public_read` (по игроку с токеном, по клиенту без него).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Запись партии.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameRecord'
              example:
                id: 4100000000001
                category: '3+2'
                rated: true
                timeControl: '180+2'
                white:
                  name: alice
                  rating: 1500
                  ratingAfter: 1510
                  ratingDiff: 10
                black:
                  name: bob
                  rating: 1520
                  ratingAfter: 1510
                  ratingDiff: -10
                status: 1
                reason: 2
                result: 1-0
                termination: Resignation
                plies: 2
                startedAt: 1790620205000
                endedAt: 1790620611000
                baseMs: 180000
                incMs: 2000
                statusName: WhiteWins
                rematchOf: null
                moves:
                  - uci: e2e4
                    spentMs: 0
                    clockMs: 180000
                  - uci: e7e5
                    spentMs: 1700
                    clockMs: 180300
                pgn:
                  Event: Scacelith rated 3+2
                  Site: caissa.scacelith.com
                  Date: '2026.09.28'
                  Round: '-'
                  White: alice
                  Black: bob
                  Result: 1-0
                  WhiteElo: 1500
                  BlackElo: 1520
                  TimeControl: '180+2'
                  Termination: Resignation
                  PlyCount: 2
                you: white
                reportable: true
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: не положительное целое число из не более чем 16 цифр (меньше 2^53); `invalid_request`: недопустимая URL-кодировка.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: токен отправлен, но недействителен.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: такой партии нет.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимит `public_read` или бюджет аккаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (база данных так и осталась заблокированной; `retryAfter: 1` в теле, без заголовка `Retry-After`), `server_busy` (при поиске сеанса база данных оказалась заблокированной), `timeout`.'
  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Скачать партию в виде файла PGN
      description: |-
        Та же партия в виде файла PGN: одна партия с окончаниями строк `\n` и текстом ходов в строках короче 80 символов. Ответ одинаков с токеном и без него.

        Теги в таком порядке: `Event` (`<SERVER_NAME> rated <category>` или `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (дата начала по UTC), `Round`, `White`, `Black`, `Result` (`*` для отменённой партии), `UTCDate` и `UTCTime` (начало), `WhiteElo` и `BlackElo` (рейтинги на начало партии или `-`), `WhiteRatingDiff` и `BlackRatingDiff` (изменения, например `+10` и `-10`, — в каждой рейтинговой партии, `+0`, если по правилам рейтинга он остался прежним; у товарищеской партии, партии с нестандартным контролем времени или отменённой партии их нет), `TimeControl` (в секундах), `Termination` (стандартное значение PGN: `normal`; `time forfeit` — падение флажка, в том числе когда партия заканчивается ничьей; `abandoned`; `rules infraction` — второй невозможный ход или техническое поражение за нарушение честной игры; `unterminated` — отменённая партия), `PlyCount`, `ScacelithGameId` (десятичный идентификатор).

        У каждого хода есть `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: показание часов сходившего игрока после хода и время, затраченное на ход, в десятых долях секунды (с отбрасыванием остатка). Значение опускается, если в записи его нет. После последнего хода словами указывается причина окончания партии, затем результат.

        **Лимит:** `public_read` (по игроку с токеном, по клиенту без него).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Файл PGN.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: 'Значение заголовка: `attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'Текст PGN в UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: не положительное целое число из не более чем 16 цифр (меньше 2^53); `invalid_request`: недопустимая URL-кодировка.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: токен отправлен, но недействителен.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: такой партии нет.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимит `public_read` или бюджет аккаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: в частности, если сохранённые ходы не удаётся воспроизвести до сохранённого окончания партии (сервер записывает это в журнал).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (база данных так и осталась заблокированной; `retryAfter: 1` в теле, без заголовка `Retry-After`), `server_busy` (при поиске сеанса база данных оказалась заблокированной), `timeout`.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Скачать партию этого сервера в виде анимированного GIF
      description: |-
        Партия в виде анимированного GIF. Имена и рейтинги берутся из записи партии (рейтинги на начало партии, удалённый аккаунт — как `deleted#<id>`), как и результат и способ окончания партии (`Resignation`, `Loss on time`...).

        Проверки выполняются в таком порядке: `gif_disabled`, параметры изображения (`size`, `orientation`, `delay`, `coords`), идентификатор партии, сама партия, её длина.

        **Требуется сеанс:** квоты считаются по аккаунту. **Лимиты:** `gif` — на каждый запрос; `gif_user_min`, `gif_user_hour`, `gif_ip_min` и `gif_ip_hour` — только когда GIF нужно создать (см. описание тега). **Ограничение по времени:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 секунд (по умолчанию 45 секунд).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 'Размер изображения: `small` (поля по 32 пикс.), `medium` (48 пикс.) или `large` (72 пикс.).'
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Сторона, которая находится внизу доски.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Миллисекунды на ход (от 1 до 6 десятичных цифр).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Рисовать ли вокруг доски буквы вертикалей и цифры горизонталей (`1`) или нет (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` с `field` (`size`, `orientation`, `delay` или `coords`): недопустимое значение. `invalid_game_id`. `invalid_request`: недопустимая URL-кодировка.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: такой партии нет. `gif_disabled`: на сервере отключены GIF (`GIF_ENABLED=false`; токен `gif` возвращается).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимит `gif`, один из лимитов рендеринга или бюджет аккаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: не удалось создать GIF (причину сервер записывает в журнал). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` с `retryAfter` (от 3 до 10 секунд) и `Retry-After`: очередь рендеринга заполнена, или GIF прождал свободного потока `GIF_QUEUE_TIMEOUT_MS` (10 секунд); все токены лимитов, взятые запросом, возвращаются. `busy`: база данных так и осталась заблокированной (`retryAfter: 1` только в теле). `timeout`.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Создать анимированный GIF любой партии, присланной в формате PGN
      description: |-
        То же изображение, что и у `GET /games/{id}/gif`, для любой партии, присланной текстом PGN: партии, сохранённой игрой, экспорта с другого сайта, партии, набранной вручную. Используется только первая партия из текста.

        - Парсер PGN принимает то же, что и собственный парсер игры: любой PGN, который пишет этот сервер, и обычные экспорты других сайтов (комментарии, варианты, NAG и пометки часов пропускаются; номера ходов и SAN читаются нестрого; тег `FEN` задаёт начальную позицию, если только `SetUp` не равен `"0"`).
        - Имена и рейтинги берутся из тегов `White`, `Black`, `WhiteElo` и `BlackElo`. Буквы с диакритикой теряют диакритические знаки, прочие символы вне печатного ASCII заменяются на `?`, а длинные имена обрезаются (до 48 символов). Результат берётся из тега `Result`, а при его отсутствии — из конца текста ходов. Тег `Termination` показывается, если он не равен `normal`: в этом случае обо всём говорит сама финальная позиция (мат, пат).
        - Этот эндпоинт проверяет тело сам: на неизвестное поле, а также если `pgn` отсутствует или не является строкой, ответ — 400 `invalid_request` с `field`; на неверный параметр — 400 `invalid_option` (`delayMs` должен быть числом JSON, `coords` — логическим значением; `null` отклоняется).

        **Требуется сеанс:** квоты считаются по аккаунту. **Лимиты:** как у `GET /games/{id}/gif`. **Ограничение размера тела:** 135 168 байт независимо от `HTTP_BODY_LIMIT` (PGN в виде строки JSON, с учётом экранирования). **Ограничение по времени:** по умолчанию 45 секунд.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Короткая партия, набранная вручную, без координат
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: Файл PGN со всеми параметрами
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` с `field` (неизвестное поле или `pgn` отсутствует либо не является строкой; без `field`, если тело не является объектом); `invalid_json`; `invalid_option` с `field` (`size`, `orientation`, `delayMs` или `coords`); `invalid_pgn` с `line` и `column` (начиная с 1, столбцы в символах) и `message` парсера: невозможный или неоднозначный ход, испорченный тег, неизвестная разновидность шахмат, более 65 536 байт.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: на сервере отключены GIF (`GIF_ENABLED=false`; токен `gif` возвращается).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: тело больше 135 168 байт.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимит `gif`, один из лимитов рендеринга или бюджет аккаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: не удалось создать GIF (причину сервер записывает в журнал). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` с `retryAfter` (от 3 до 10 секунд) и `Retry-After`: очередь рендеринга заполнена, или GIF слишком долго ждал свободного потока; все токены лимитов, взятые запросом, возвращаются. `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /players/{username}:
    get:
      operationId: getPlayer
      tags:
