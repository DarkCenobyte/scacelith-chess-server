    description: Окончательное удаление аккаунта.
  - name: game-history
    x-displayName: История партий
    description: Собственные партии игрока, выполнившего вход, с фильтрами и постраничным выводом.
  - name: games
    x-displayName: Партии и PGN
    description: |-
      Записи партий с ходами и показаниями часов, а также их файлы PGN.

      **Коды партий.** `status`: 1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (хранятся только завершённые партии). `result`: `1-0`, `0-1`, `1/2-1/2` или `*` (партия отменена). `reason` — с названием (`termination`) и словами, которыми заканчивается текст ходов в файле PGN; коды 7, 14 и 21 означают ничью (у игрока, у которого истекло время, который сдался или который покинул партию, соперник не мог поставить мат: FIDE 6.9 и 5.1.2; правило приведено в `DESIGN.md` 6.3), а кодами 4 и 13 сервер партии никогда не завершает (они входят в общий список причин):

      | Код | `termination` | Слова в PGN (с переводом) |
      |---|---|---|
      | 1 | `Checkmate` | Checkmate (мат) |
      | 2 | `Resignation` | Resignation (сдача) |
      | 3 | `Timeout` | Loss on time (поражение по времени) |
      | 4 | `IllegalMoves` | Second illegal move (forfeit) (второй невозможный ход, поражение) |
      | 5 | `Stalemate` | Stalemate (пат) |
      | 6 | `InsufficientMaterial` | Dead position (insufficient material) (мёртвая позиция, недостаточно материала) |
      | 7 | `TimeoutVsInsufficient` | Flag fall, but the opponent cannot checkmate (время истекло, но соперник не может поставить мат) |
      | 8 | `FivefoldRepetition` | Fivefold repetition (пятикратное повторение) |
      | 9 | `SeventyFiveMoves` | 75-move rule (правило 75 ходов) |
      | 10 | `ThreefoldClaim` | Threefold repetition (claimed) (троекратное повторение по требованию) |
      | 11 | `FiftyMoveClaim` | 50-move rule (claimed) (правило 50 ходов по требованию) |
      | 12 | `Agreement` | Draw by agreement (ничья по соглашению) |
      | 13 | `IllegalMovesVsInsufficient` | Second illegal move, but the opponent cannot checkmate (второй невозможный ход, но соперник не может поставить мат) |
      | 14 | `ResignationVsInsufficient` | Resignation, but the opponent cannot checkmate (сдача, но соперник не может поставить мат) |
      | 20 | `Abandonment` | Abandoned (disconnected for too long) (партия покинута: слишком долгое отключение) |
      | 21 | `AbandonmentVsInsufficient` | Abandoned, but the opponent cannot checkmate (партия покинута, но соперник не может поставить мат) |
      | 22 | `Aborted` | Game aborted (партия отменена) |
      | 23 | `NoShow` | Aborted: first move not played in time (отменена: первый ход не сделан вовремя) |
      | 24 | `Forfeit` | Forfeit (fair play violation) (техническое поражение за нарушение честной игры) |
      | 25 | `ServerAborted` | Aborted by the server (отменена сервером) |
      | 26 | `BothDisconnected` | Aborted: both players disconnected (отменена: оба игрока отключились) |

      Код 14 появился в минорной версии 1 протокола: клиент, написанный раньше, должен показывать неизвестный код как обычное окончание партии с её `result`.
  - name: gifs
    x-displayName: Анимированные GIF
    description: |-
      Партия в виде анимированного GIF — чтобы сохранить или поделиться: доска сверху, по одному кадру на каждую позицию от начальной до финальной, имена и рейтинги игроков над доской, последний ход под ней, а на последнем кадре — результат и то, чем закончилась партия.

      **Затраты, кеш и квоты.** GIF создаётся в отдельном потоке рендеринга, никогда не в потоках, где идут партии, и с самым низким приоритетом CPU: `GIF_THREADS` потоков (по умолчанию `WORKERS`), которые запускаются с первым GIF и останавливаются после минуты без GIF. До `GIF_QUEUE_MAX` (4 x `WORKERS`) GIF ждут свободного потока, каждый не дольше `GIF_QUEUE_TIMEOUT_MS` (10 с); рендеринг может длиться до `GIF_RENDER_TIMEOUT_MS` (30 с). Созданные GIF сервер хранит в кеше размером `GIF_CACHE_MB` МБ (32 x `WORKERS`), первыми вытесняя те, что дольше всего не использовались; GIF из кеша или GIF, который уже создаётся для другого запроса, рендеринга не требует. Ключ кеша учитывает всё, что меняет изображение, включая имена.

      Каждый запрос учитывается в `gif` (30 в минуту на игрока для обоих эндпоинтов). GIF, который нужно создать, учитывается также в лимитах рендеринга: на игрока — `GIF_USER_RENDERS_PER_MIN` (4) в минуту и `GIF_USER_RENDERS_PER_HOUR` (30) в час; на клиента (все его аккаунты вместе) — `GIF_IP_RENDERS_PER_MIN` (12) в минуту и `GIF_IP_RENDERS_PER_HOUR` (120) в час, и втрое больше на IPv6 /48. Клиенту следует хранить скачанный файл, а не запрашивать его снова, и выжидать `retryAfter` после 429 или 503.

      Размеры: `small` (поля по 32 пикс.: 284 x 350 пикселей), `medium` (48 пикс.: 424 x 515), `large` (72 пикс.: 628 x 762); без координат — 268 x 342, 400 x 503 и 600 x 748. Начальная позиция показывается не меньше 1 с (или дольше, если задержка между ходами больше), финальная — 3 с, и GIF зацикливается; после первого кадра сохраняется только изменившаяся часть изображения. Партия из 40 ходов занимает около 135, 205 и 325 КиБ (малый, средний и большой размер), партия из 150 ходов — 0,5; 0,8 и 1,2 МиБ.
  - name: players
    x-displayName: Игроки
    description: Публичные профили и недавние партии. Только общедоступные данные — никогда адрес эл. почты, сеанс, санкция или уровень доверия античита. У удалённого аккаунта профиля нет.
  - name: leaderboard
    x-displayName: Таблица лидеров
    description: Лучшие игроки в каждой официальной категории.
  - name: reports
    x-displayName: Жалобы
    description: Жалоба модераторам на соперника по недавней партии.
  - name: pages
    x-displayName: HTML-страницы
    description: |-
      Страницы для браузера, которые открываются по ссылкам из писем. Их ссылки ведут на `https://<SERVER_PUBLIC_HOST>` (с `:<PUBLIC_API_PORT>`, если это не 443), вне `/api/v1`.

      - Страницы не выполняют JavaScript и не загружают внешних ресурсов. Они отдаются с `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'`.
      - `GET` только показывает кнопку или форму, чтобы почтовый сканер, открывший ссылку, не израсходовал её. Изменение происходит по `POST`: форма отправляется как `application/x-www-form-urlencoded` (тело в JSON тоже принимается), а токен ссылки передаётся в скрытом поле. Поле, указанное дважды, отклоняется.
      - Ошибки (лимиты частоты запросов, недопустимые поля) — тоже HTML-страницы, с заголовком "Request refused" (запрос отклонён) или, начиная с 500, "Server error" (ошибка сервера). Только сбои, обнаруженные до сопоставления со страницей (слишком длинная или искажённая цель запроса, поадресный уровень), возвращаются в JSON.
