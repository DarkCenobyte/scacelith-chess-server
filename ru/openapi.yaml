paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Получить имя сервера, версии, порты и правила регистрации
      description: |-
        Всё, что нужно клиенту до входа или подключения: имя и идентификатор сервера, версии протокола WebSocket и расположение WebSocket, правила регистрации, официальные контроли времени и ограничения, которые клиент может проверить до отправки формы.

        **Лимиты:** только поадресный уровень.
      security: []
      responses:
        '200':
          description: Описание сервера.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: поадресный уровень.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Создать аккаунт
      description: |-
        Создаёт аккаунт: после подтверждения адреса эл. почты по отправленной на него ссылке или сразу, если подтверждение по почте не требуется.

        **С подтверждением по почте** (`REQUIRE_EMAIL_VERIFICATION`, по умолчанию): 202 `verification_sent`. Аккаунта пока нет: заявка на регистрацию ждёт 24 часа и всё это время удерживает за собой имя пользователя. На адрес отправляется ссылка, действительная эти 24 часа, — не чаще одной на адрес раз в 5 минут (`POST /auth/verify-email/resend` отправляет новую); аккаунт создаётся, а его адрес считается подтверждённым, когда ссылкой воспользуются (кнопка на странице `/verify-email`), и после этого игрок может войти. До тех пор вход с этим именем пользователя получает ответ `invalid_credentials`, как для неизвестного аккаунта, и публичного профиля не существует. Новая заявка с тем же адресом заменяет ожидающую. Ответ такой же, если адрес уже использует другой аккаунт: ссылка тогда не отправляется, вместо неё владелец получает уведомление (не чаще одного в час), а имя пользователя удерживается точно так же, чтобы ничто не выдавало, есть ли у адреса аккаунт. Заявка, ссылкой которой не воспользовались, удаляется через 24 часа, и её имя пользователя снова становится свободным.

        **Без подтверждения по почте** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, аккаунт создаётся сразу, и в него можно войти.

        **Правила.** `username`: от `USERNAME_MIN` до `USERNAME_MAX` символов (от 3 до 20) — буквы, цифры, `_` и `-`, первой должна идти буква или цифра (`GET /info` сообщает эти значения в `limits`); зарезервированные имена (`admin`, `moderator`, `deleted`...) и некоторые префиксы отклоняются; имя уникально без учёта регистра. `email`: пробелы по краям обрезаются, хранится в нижнем регистре, только ASCII, домен с точкой. `password`: не менее `PASSWORD_MIN_LENGTH` (10) символов и не более 256 байт в UTF-8; не должен содержать имя пользователя или локальную часть адреса эл. почты и не должен быть распространённым паролем.

        **Ошибки** проверяются в таком порядке: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; ошибки очереди хеширования паролей; 409 `email_taken` (только без подтверждения по почте).

        **Лимиты:** `auth`, затем `auth_register` (10 регистраций в час на клиента). **Доказательство работы:** всегда, если `POW_REGISTER_BITS` больше 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Первая попытка, без доказательства работы
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Повторная отправка с доказательством работы
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Аккаунт создан, в него можно войти (на этом сервере нет подтверждения по почте).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Заявка на регистрацию ждёт перехода по ссылке подтверждения (или у адреса уже есть аккаунт — ответ этого не сообщает).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (с `field`), `invalid_json`, `invalid_username`, `invalid_email` или `weak_password` с `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` или `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: регистрация на этом сервере закрыта (`GET /info` сообщает `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: это имя пользователя уже есть у аккаунта, или его удерживает ожидающая заявка с другим адресом. `email_taken`: адрес использует другой аккаунт (только без подтверждения по почте).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимит `auth` или `auth_register` либо очередь хеширования паролей.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (очередь хеширования паролей, или база данных так и осталась заблокированной), `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Войти с паролем
      description: |-
        Выполняет вход по имени пользователя или адресу эл. почты и паролю. Возможны два ответа, оба со статусом 200: сеанс или, если включена двухфакторная аутентификация, второй шаг, который нужно завершить в течение 5 минут через `POST /auth/login/mfa`.

        Неизвестный аккаунт, неверный пароль и аккаунт без пароля получают одинаковый ответ через одинаковое время: 401 `invalid_credentials`. Проверки аккаунта (`banned`, `email_unverified`) выполняются только после верного пароля. Начиная с `AUTH_FAILURES_PER_ACCOUNT` (5) неудач для одного логина каждой попытке приходится выжидать (429 `too_many_attempts`).

        **Лимит:** `auth`. **Доказательство работы:** только во время волны неудачных входов (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Сеанс или второй шаг входа с двухфакторной аутентификацией.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Вход выполнен
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Включена двухфакторная аутентификация
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: неизвестный аккаунт, неверный пароль или аккаунт без пароля.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Только после верного пароля: `banned` с `until` (мс от начала эпохи, `null` при бессрочной блокировке) или `email_unverified` (старый аккаунт, адрес которого ещё не подтверждён).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (задержка после неудач для этого логина) или `rate_limited` (лимит `auth`, очередь хеширования паролей).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (очередь хеширования паролей, или база данных так и осталась заблокированной), `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Завершить вход вторым фактором
      description: |-
        Второй шаг входа с двухфакторной аутентификацией — после того как `POST /auth/login` или вход через Google (`POST /auth/sso/google/finish` или `POST /auth/sso/google/link`) ответил `mfaRequired`. Отправьте `code` (6-значный код из приложения-аутентификатора или код восстановления) или `recoveryCode`. Использованный здесь код восстановления пропадает.

        Один шаг принимает не более 5 неверных кодов; шаг также завершается при сбросе или смене пароля. Если перед этим был шаг с паролем при привязке Google, привязка сохраняется, только когда код здесь пройдёт проверку.

        **Лимиты:** `auth` и не более `AUTH_MFA_PER_ACCOUNT` (10) кодов за 15 минут на аккаунт, с любого адреса; сверх этого код не проверяется, так что код восстановления не расходуется.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Код из приложения-аутентификатора
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Код восстановления
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Вход выполнен.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: не отправлены ни `code`, ни `recoveryCode`, или тело нарушает схему; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: шаг истёк, уже использован или завершён после 5 неверных кодов, либо после первого шага пароль был сброшен или изменён (войдите снова). `invalid_code`: неверный или уже использованный код.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (с `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: только после шага с паролем при привязке Google — за это время аккаунт Google был привязан к другому аккаунту.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: только после шага с паролем при привязке Google — за это время аккаунт изменился; начните заново из игры.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: задержка после неудач для аккаунта, или его `AUTH_MFA_PER_ACCOUNT` кодов за последние 15 минут исчерпаны. `rate_limited`: лимит `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` с `retryAfter: 1`: база данных так и осталась заблокированной (если это шаг привязки Google, ничего не привязано: начните заново из игры). `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Завершить текущий сеанс
      description: |-
        Отзывает сеанс использованного токена. WebSocket, открытый с этим сеансом, закрывается. Без тела (или `{}`).

        **Лимит:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Выход выполнен.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: тело, отличное от `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимит `sessions` или бюджет аккаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (база данных так и осталась заблокированной), `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
        - sessions
      summary: Завершить все сеансы
      description: |-
        Отзывает все сеансы аккаунта, включая текущий. Открытые с ними WebSocket закрываются. Без тела (или `{}`).

        **Лимит:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Все сеансы завершены.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: тело, отличное от `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимит `sessions` или бюджет аккаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (база данных так и осталась заблокированной), `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Отправить ссылку подтверждения ещё раз
      description: |-
        Повторно отправляет ссылку для подтверждения адреса эл. почты. Ответ — 202 `accepted` при любом адресе, чтобы никогда не выдавать, использует ли его аккаунт или заявка на регистрацию.

        Запрос срабатывает не чаще раза в 5 минут для одного адреса. Ожидающая заявка с этим адресом снова получает свои 24 часа, независимо от того, использует ли адрес другой аккаунт, чтобы в обоих случаях её имя пользователя удерживалось одинаково долго. Ссылка отправляется только для этой заявки, если у адреса нет аккаунта (новая ссылка, действительная 24 часа, заменяет предыдущую), или для активного неподтверждённого аккаунта с этим адресом.

        **Лимиты:** `auth`, затем `auth_mail` (10 в час на клиента).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Принято (при любом адресе).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимит `auth` или `auth_mail` (при любом адресе).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` с `retryAfter: 1`: база данных так и осталась заблокированной при поиске аккаунта (продление ожидающей заявки выполняется по мере возможности и никогда не приводит к ошибке запроса). `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Отправить ссылку для сброса пароля
      description: |-
        Отправляет ссылку для сброса пароля, действительную один час, которая открывает страницу `/reset-password`. Ответ — 202 `accepted` при любом адресе. Ссылка отправляется только активному аккаунту, не чаще раза в 5 минут на адрес. Аккаунт, который входит только через Google, так задаёт свой первый пароль.

        У восстановления пароля самые строгие лимиты в API, и все они считаются для всего сервера: 3 запроса в час (`AUTH_FORGOT_PER_HOUR`) и 10 за 24 часа (`AUTH_FORGOT_PER_DAY`) на клиента (адрес IPv4 или сеть IPv6 /64), втрое больше на IPv6 /48 — сверх лимита `auth` (20 за 10 минут) и правила «одно письмо на адрес раз в 5 минут». Ни 202, ни 429 не выдают, использует ли адрес какой-либо аккаунт. У установки нового пароля свой лимит (`auth_reset`).

        **Лимиты:** `auth`, `auth_forgot`, затем `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Принято (при любом адресе).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимит `auth`, `auth_forgot` или `auth_forgot_day` (при любом адресе).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` с `retryAfter: 1`: база данных так и осталась заблокированной. `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Задать новый пароль по токену из ссылки для сброса
      description: |-
        Задаёт новый пароль по токену из ссылки для сброса (страница `/reset-password` делает то же самое). Новый пароль подчиняется правилам регистрации.

        Сброс имеет следующие последствия, в одной транзакции (все или ни одного): он отзывает все сеансы и отменяет ожидающую смену адреса эл. почты; остальные ссылки для сброса пароля этого аккаунта перестают работать; адрес считается подтверждённым (ссылка это доказала); владелец получает письмо. Двухфакторная аутентификация не затрагивается. После ошибки очереди хеширования паролей, ответа 503 или 500 ничего не изменено: старый пароль и сеансы сохраняются, а ссылка остаётся действительной.

        **Лимиты:** `auth`, затем `auth_reset` (10 в час на клиента, 30 на IPv6 /48, общий со страницей: каждая попытка хеширует пароль).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Пароль изменён, все сеансы завершены.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: ссылка недействительна, уже использована или истекла либо была отправлена на адрес, которого у аккаунта больше нет. `weak_password` (с `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимит `auth` или `auth_reset` либо очередь хеширования паролей.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: очередь хеширования паролей, или база данных так и осталась заблокированной (`retryAfter: 1`, ничего не изменено). `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Начать вход через Google
      description: |-
        Начинает попытку входа через Google для заданного challenge PKCE и порта слушающего сокета игры на `127.0.0.1`. Ответ содержит URL Google, который нужно открыть в системном браузере, и `state` попытки; попытка действительна 10 минут.

        `authUrl` содержит `client_id`, `redirect_uri` (собранный из `redirectPort` и тега источника сервера), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 от собственного code verifier сервера для Google) с `code_challenge_method=S256` и `prompt=select_account`. Игра проверяет его, прежде чем открыть (см. описание тега).

        **Лимит:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Попытка.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: вход через Google на этом сервере недоступен.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимит `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (база данных так и осталась заблокированной), `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Передать ответ Google серверу
      description: |-
        Передаёт серверу `code` и `state`, которые Google прислал на слушающий сокет игры, вместе с идентификатором попытки и code verifier PKCE. Идентификатор попытки бесполезен без code verifier, а код бесполезен без собственного code verifier PKCE сервера и секрета клиента.

        Сервер проверяет попытку (неизвестная, использованная или истёкшая — 410), затем code verifier (при неверном попытка остаётся пригодной), затем однократно использует попытку, проверяет `state` и `iss`, обменивает код у Google и проверяет ID-токен. Ответ (200) — один из следующих:

        - `{ token, expiresAt, user }`: вход в привязанный аккаунт выполнен;
        - `{ mfaRequired, mfaToken, expiresIn }`: продолжение — `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: новый аккаунт; продолжение — `POST /auth/sso/complete` в течение 10 минут. `suggestedUsername` берётся из имени в Google или из адреса и равно `""`, если ничего не подходит;
        - `{ needsPassword, linkTicket, username, expiresIn }`: у аккаунта с этим адресом есть пароль; продолжение — `POST /auth/sso/google/link`. Пока ничего не привязано.

        **Лимит:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Сеанс, второй шаг или следующий шаг первого входа через Google.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Вход в привязанный аккаунт выполнен
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Включена двухфакторная аутентификация
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Новый игрок
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Адрес использует аккаунт с паролем
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: code verifier не соответствует challenge попытки (попытка остаётся пригодной). `sso_email_unverified`: Google не подтвердил адрес. `registration_closed`. `account_disabled`. Только для привязанного аккаунта: `banned` (с `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: вход через Google на этом сервере недоступен.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: адрес использует активный аккаунт без пароля (его имя не сообщается).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: неизвестная, использованная или истёкшая попытка.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимит `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (база данных так и осталась заблокированной), `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Привязать Google к существующему аккаунту с помощью его пароля
      description: |-
        После того как `finish` ответил `needsPassword`: привязывает Google к существующему аккаунту с помощью пароля этого аккаунта, введённого в игре. Ответ (200) — сеанс (привязка сохранена, и игрок вошёл) или, если включена двухфакторная аутентификация, `{ mfaRequired, mfaToken, expiresIn }`: продолжение — `POST /auth/login/mfa`, и привязка сохраняется, только когда там пройдёт код.

        При неверном пароле билет остаётся пригодным — всего на 5 попыток. Попытка расходуется непосредственно перед проверкой пароля: 429 `too_many_attempts` или 428 `pow_required` не расходуют ни одной, а отказ очереди хеширования паролей (503 `server_busy`, 429 `rate_limited`) уже израсходовал одну и засчитывается как неудача аккаунта. Задержка после неудач использует тот же счётчик, что и `POST /auth/login`.

        **Лимит:** `auth` (с учётом по IPv6 /48). **Доказательство работы:** как для `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Сеанс или второй шаг входа.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: неверный пароль; билет остаётся пригодным — всего на 5 попыток.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (с `until`), только после верного пароля.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: вход через Google на этом сервере недоступен.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: за это время аккаунт Google был привязан к другому аккаунту.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: неизвестный, использованный или истёкший билет, 5-й неверный пароль, аккаунт, у которого после `finish` изменились статус или адрес, или аккаунт, у которого статус, адрес, пароль или двухфакторная аутентификация изменились во время сохранения привязки. Начните заново из игры.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (задержка после неудач для аккаунта) или `rate_limited` (лимит `auth`, очередь хеширования паролей).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: очередь хеширования паролей, или база данных так и осталась заблокированной (`retryAfter: 1`, ничего не привязано). `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Создать аккаунт при первом входе через Google
      description: |-
        После того как `finish` ответил `needsUsername`: создаёт аккаунт с выбранным именем пользователя (действуют правила регистрации) и выполняет в него вход. У аккаунта нет пароля: `hasPassword` равно `false`, а задать пароль можно через «Забыли пароль?» (`POST /auth/password/forgot`).

        **Лимит:** `auth` (с учётом по IPv6 /48).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Аккаунт создан, вход выполнен.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request` или `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: вход через Google на этом сервере недоступен.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (это имя пользователя уже есть у аккаунта, или его удерживает ожидающая заявка с другим адресом), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: неизвестный, использованный или истёкший билет.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимит `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (база данных так и осталась заблокированной), `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Список активных сеансов
      description: |-
        Активные сеансы аккаунта (устройства, на которых выполнен вход), начиная с последнего использованного. `current` отмечает сеанс, от которого пришёл запрос. `lastSeenAt` обновляется не чаще раза в 5 минут; `expiresAt` — абсолютный срок окончания, а лимит бездействия может завершить сеанс раньше.

        **Лимит:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Активные сеансы.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимит `sessions` или бюджет аккаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (база данных так и осталась заблокированной), `timeout`.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Завершить сеанс на одном устройстве
      description: |-
        Завершает один сеанс аккаунта; можно завершить и текущий. WebSocket, открытый с этим сеансом, закрывается. Без тела (или `{}`).

        **Лимит:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Сеанс завершён.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: тело, отличное от `{}`, или `id` с недопустимой URL-кодировкой; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: у этого аккаунта нет активного сеанса с таким идентификатором.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимит `sessions` или бюджет аккаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (база данных так и осталась заблокированной), `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Получить аккаунт, его рейтинги и действующие санкции
      description: |-
        Аккаунт таким, каким его видит сам игрок: данные аккаунта (они же — `user` в каждом ответе на вход), по одной записи рейтинга на каждую категорию, в которой игрок играл рейтинговые партии, действующие санкции и блокировка. Уровень доверия античита никогда не показывается.

        **Лимит:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Аккаунт.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized` или `invalid_token` (в том числе если аккаунт удалён).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимит `account` или бюджет аккаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (база данных так и осталась заблокированной), `timeout`.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Принимать или отклонять прямые вызовы
      description: |-
        Определяет, могут ли другие игроки вызывать этого игрока по имени. При `none` прямые вызовы отклоняются: вызывающему сообщается, что игрок недоступен. Повторная аутентификация не требуется.

        **Лимит:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: Настройки, действующие теперь.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимит `account` или бюджет аккаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (база данных так и осталась заблокированной), `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Сменить пароль
      description: |-
        Меняет пароль. Нужен текущий пароль, но не второй фактор — даже при включённой двухфакторной аутентификации. Новый пароль подчиняется правилам регистрации (они проверяются после текущего пароля).

        Смена имеет следующие последствия, в одной транзакции (все или ни одного): она отзывает все остальные сеансы (текущий остаётся активным), отменяет ожидающую смену адреса эл. почты, делает недействительными ссылки для сброса пароля этого аккаунта и отправляет владельцу письмо.

        **Повторная аутентификация:** только пароль. **Лимиты:** `reauth`, затем `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Пароль изменён.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (аккаунт, который входит только через Google), `weak_password` (с `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: неверный текущий пароль или сброс либо смена пароля, произошедшие, пока запрос проверялся.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (неудачные повторные аутентификации аккаунта) или `rate_limited` (лимит `reauth` или `reauth_user`, бюджет аккаунта, очередь хеширования паролей).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: очередь хеширования паролей, или база данных так и осталась заблокированной (`retryAfter: 1`, ничего не изменено). `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Начать включение двухфакторной аутентификации
      description: |-
        Сохраняет новый ожидающий секрет аутентификатора, который заменяет любой прежний ожидающий, и возвращает его для приложения-аутентификатора (в виде текста и в виде URI `otpauth://`, который показывают как QR-код). Двухфакторная аутентификация пока не включена: её включает `POST /account/mfa/totp/enable` с кодом, сгенерированным по этому секрету.

        **Повторная аутентификация:** только пароль. **Лимиты:** `reauth`, затем `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Ожидающий секрет.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (аккаунт, который входит только через Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (проверяется до пароля).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (неудачные повторные аутентификации аккаунта) или `rate_limited` (лимит `reauth` или `reauth_user`, бюджет аккаунта, очередь хеширования паролей).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (очередь хеширования паролей, или база данных так и осталась заблокированной), `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Завершить включение двухфакторной аутентификации и получить коды восстановления
      description: |-
        Включает двухфакторную аутентификацию по коду, сгенерированному по ожидающему секрету (ровно 6 цифр). Пароль здесь не запрашивается — он был введён на этапе настройки. Ответ содержит 10 кодов восстановления, которые показываются только этот единственный раз.

        **Лимиты:** `reauth`, затем `reauth_user`; неверный код засчитывается в неудачные повторные аутентификации аккаунта.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Двухфакторная аутентификация включена.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` не состоит ровно из 6 цифр, или тело нарушает схему; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: неверный код (проверьте время на устройстве).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: нет ожидающего секрета (сначала вызовите `POST /account/mfa/totp/setup`).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (неудачные повторные аутентификации аккаунта) или `rate_limited` (лимит `reauth` или `reauth_user`, бюджет аккаунта).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (база данных так и осталась заблокированной), `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: Отключить двухфакторную аутентификацию
      description: |-
        Отключает двухфакторную аутентификацию. Секрет и коды восстановления удаляются, владелец получает письмо.

        **Повторная аутентификация:** пароль и код из приложения-аутентификатора или код восстановления (обязателен `code` или `recoveryCode`). **Лимиты:** `reauth`, затем `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Двухфакторная аутентификация отключена.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (аккаунт, который входит только через Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required` (нет ни `code`, ни `recoveryCode`; проверяется до пароля), `invalid_password`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
