  /reset-password:
    servers:
      - url: https://caissa.scacelith.com
        description: Официальный сервер (страницы находятся в корне, вне `/api/v1`).
      - url: https://{host}:{port}
        description: Любой сервер Scacelith (страницы находятся в корне, вне `/api/v1`).
        variables:
          host:
            default: caissa.scacelith.com
            description: Публичное имя хоста сервера (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Публичный порт API (`PUBLIC_API_PORT`, а если он не задан — `API_PORT`).
    get:
      operationId: showResetPasswordPage
      tags:
        - pages
      summary: Показать форму сброса пароля
      description: |-
        Страница ссылки для сброса пароля: форма нового пароля (пароль вводится дважды). Форма отправляется на `POST /reset-password`.

        **Лимит:** `page`.
      security: []
      parameters:
        - $ref: '#/components/parameters/LinkTokenQuery'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Форма нового пароля.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Ссылка недействительна (в том числе если она была отправлена на адрес, которого у аккаунта больше нет).
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Лимит `page` (HTML-страница) или поадресный уровень (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
    post:
      operationId: submitResetPasswordPage
      tags:
        - pages
      summary: Задать новый пароль из формы сброса
      description: |-
        Форма страницы сброса; делает то же, что и `POST /auth/password/reset`, в одной транзакции: сеансы на всех устройствах завершаются, ожидающая смена адреса эл. почты отменяется, остальные ссылки для сброса перестают работать, адрес считается подтверждённым, а владелец получает письмо.

        Сначала проверяется ссылка, затем совпадение двух паролей, затем правила для пароля. Если сервер занят, форма возвращается с `Retry-After`, а ссылка остаётся действительной.

        **Лимиты:** `auth`, затем `auth_reset` (общий с `POST /auth/password/reset`).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Пароль изменён, сеансы на всех устройствах завершены.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Снова форма с ошибкой (пароли не совпадают, слабый пароль), ссылка недействительна или форма некорректна (HTML-страница).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Лимит `auth` или `auth_reset` (HTML-страница), снова форма с `Retry-After`, если у этого клиента слишком много паролей ждут хеширования (ссылка остаётся действительной), или поадресный уровень (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'Снова форма с `Retry-After`, если сервер занят (очередь хеширования паролей или база данных так и осталась заблокированной); ссылка остаётся действительной. Если в базе данных слишком много операций записи в очереди, вместо этого страница "Server error" (ошибка сервера) с `Retry-After` (от 2 до 5): ничего не выполнено, и ссылка остаётся действительной. Также истечение времени обработчика.'
