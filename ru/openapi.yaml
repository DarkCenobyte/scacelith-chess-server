        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (неудачные повторные аутентификации или слишком много опробованных кодов для этого аккаунта) или `rate_limited` (лимит `reauth` или `reauth_user`, бюджет аккаунта, очередь хеширования паролей).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (очередь хеширования паролей, или база данных так и осталась заблокированной), `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /account/mfa/recovery-codes:
