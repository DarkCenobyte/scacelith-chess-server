    description: Что клиенту нужно знать до входа или подключения.
  - name: health
    x-displayName: Проверка состояния
    description: |-
      Работоспособность и готовность сервера — для мониторинга. Эти эндпоинты отвечают на порту API до аутентификации и до любых лимитов эндпоинтов, но, как и любой запрос, берут токен поадресного уровня; хост мониторинга можно указать в `ABUSE_EXEMPT`. Для каждого эндпоинта работают оба пути: в корне сервера и под `/api/v1`.

      У порта метрик есть собственные эндпоинты проверки состояния, они описаны во введении.
  - name: auth
    x-displayName: Регистрация и вход
    description: |-
      Создание аккаунта, вход с паролем (и вторым фактором), письма с подтверждением адреса и для сброса пароля.

      `POST /auth/login`, `POST /auth/login/mfa`, `POST /auth/sso/google/finish`, `POST /auth/sso/google/link` и `POST /auth/sso/complete` возвращают сеанс `{ token, expiresAt, user }` (или — первые из них — второй шаг).
  - name: google-sign-in
    x-displayName: Вход через Google
    description: |-
      Доступен, если `GET /info` сообщает `sso.google: true`; иначе каждый эндпоинт ниже отвечает 404 `sso_disabled`. Игра выполняет вход через системный браузер по схеме для установленных приложений из RFC 8252 (клиент типа «Desktop app»): Google возвращает браузер на слушающий сокет игры на `127.0.0.1`, а не на этот сервер, и игра никогда не видит учётных данных Google.

      1. Клиент начинает слушать `127.0.0.1:0` (порт выбирает система) и создаёт пару PKCE: `codeVerifier` длиной от 43 до 128 символов `[A-Za-z0-9._~-]` и `codeChallenge = BASE64URL(SHA-256(codeVerifier))` — 43 символа без дополнения.
      2. `POST /auth/sso/google/start` с challenge PKCE и портом возвращает URL Google и `state` попытки. Клиент проверяет URL (см. ниже) и открывает его в браузере.
      3. Google направляет браузер на `http://127.0.0.1:<port>/oauth2/google/<tag>?code=...&state=...`. Клиент принимает только `state` из ответа, полученного при запуске попытки, и ничего не отправляет после перенаправления с `error=`.
      4. `POST /auth/sso/google/finish` с идентификатором попытки, `codeVerifier`, `state` и `code` (и `iss`, если Google его прислал).
      5. Ответ — сеанс, шаг двухфакторной аутентификации (продолжение — `POST /auth/login/mfa`), `needsUsername` для нового игрока (продолжение — `POST /auth/sso/complete`) или `needsPassword`, если этот адрес использует аккаунт с паролем (продолжение — `POST /auth/sso/google/link`).

      **Тег источника.** URI перенаправления содержит тег сервера, который добавил игрок, чтобы игра отклоняла URL, полученный другим сервером для своих игроков. Источник (origin) — это имя хоста в нижнем регистре (литерал IPv6 — в квадратных скобках), `:` и десятичный порт API, который пишется всегда, в том числе 443: сервер берёт `SERVER_PUBLIC_HOST` и свой публичный порт API, а игра — адрес, к которому она подключена. Тег — первые 22 символа base64url (без дополнения) от SHA-256(UTF-8 `"scacelith-sso-origin-v1\n"` + источник). URI перенаправления — `"http://127.0.0.1:" + port + "/oauth2/google/" + tag`: всегда литерал IPv4 и порт слушающего сокета игры (от 1024 до 65535). Сервер никогда не берёт у клиента URI, хост или путь.

      | Источник | Тег |
      |---|---|
      | `play.scacelith.example:443` | `IhcScoV7eDOzTEcSnqPUPt` |
      | `localhost:8443` | `TFGx7zQ_8QlGZW5zpqznCr` |
      | `[::1]:8443` | `XToJm0DG5PjciEVmZa9Cho` |
      | `127.0.0.1:50443` | `3r653wM5ZjYsHcAJljmCwY` |

      Поэтому вход через Google работает только у игроков, которые добавили сервер именно под именем `SERVER_PUBLIC_HOST` и с его публичным портом API.

      **Что игра проверяет, прежде чем открыть браузер.** `authUrl` начинается ровно с `https://accounts.google.com/o/oauth2/v2/auth?`, состоит из печатных символов ASCII и короче 4096 символов, а в его строке запроса ровно один `response_type=code`, ровно один `redirect_uri`, равный URI, который игра вычисляет по своему порту и своему тегу источника, ровно один `state`, равный `state` из ответа, `code_challenge_method=S256` и `code_challenge` из 43 символов. Иначе игра останавливает слушающий сокет и ничего не открывает. Запросы `finish` и `link` она отправляет только тому серверу, который ответил на `start`.

      **В какой аккаунт ведёт вход через Google:** в аккаунт, уже привязанный к этому аккаунту Google; иначе — в активный аккаунт с адресом, который подтвердил Google (если у аккаунта есть пароль, `finish` отвечает `needsPassword`, и привязка сохраняется, только когда пройдены его пароль, а затем, если он включён, второй фактор; если пароля нет — 409 `sso_account_exists`); иначе — в новый аккаунт (`needsUsername`). Аккаунт Google никогда не привязывается к существующему аккаунту только по совпадению адреса. На адрес аккаунта приходит письмо, когда вход через Google создаёт аккаунт и когда он добавляется к существующему.
