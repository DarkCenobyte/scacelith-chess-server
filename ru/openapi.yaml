openapi: 3.1.1
info:
  title: HTTPS API сервера Scacelith
  version: "0.9.1"
  summary: HTTPS API любого сервера Scacelith — как официального, так и серверов сообщества.
  description: |-
    Этот HTTPS API предоставляет каждый сервер Scacelith — и официальный `caissa.scacelith.com`, и любой сервер сообщества. Игра использует его для всего, что происходит вне самой партии: регистрации и входа (включая двухфакторную аутентификацию и вход через Google), страницы аккаунта, истории партий, скачивания PGN и анимированных GIF партий, активных сеансов, скачивания данных, удаления аккаунта и жалоб.

    Игра в реальном времени (поиск соперника, вызовы, ходы, часы) идёт через WebSocket того же сервера (`wss://<host>/ws`), который открывается с токеном сеанса этого API; она описана в `PROTOCOL.md`, а не здесь.

    Значения по умолчанию, приведённые ниже, — это значения сервера с нетронутой конфигурацией; сервер сообщества может их изменить (все параметры перечислены в `CONFIG.md`).

    ## Базовый URL, порт и транспорт

    - Официальный сервер: `https://caissa.scacelith.com/api/v1`, TCP-порт 443.
    - Сервер сообщества: `https://<SERVER_PUBLIC_HOST>[:<port>]/api/v1`. По умолчанию `API_PORT` равен 443; за NAT или прокси порт, которым пользуются игроки, — `PUBLIC_API_PORT`.
    - WebSocket игры по умолчанию работает на том же порту (`WS_PORT` переносит его на другой; где он находится, клиент узнаёт из `GET /info`).
    - HTTP/1.1 поверх TLS. При `TLS_MODE=proxy` TLS терминирует обратный прокси перед сервером. `TLS_MODE=off` (обычный HTTP) предназначен только для локальной разработки.
    - HTML-страницы, которые открываются по ссылкам из писем (`/verify-email`, `/reset-password`, `/confirm-email-change`), находятся в корне сервера, вне `/api/v1`. Эндпоинты проверки состояния отвечают и в корне, и под `/api/v1`. У входа через Google нет страницы на сервере: Google возвращает браузер прямо в игру, на `127.0.0.1`.
    - Завершающая косая черта игнорируется (`/api/v1/info/` — то же, что `/api/v1/info`), а параметры пути декодируются из URL-кодировки (на параметр с недопустимой URL-кодировкой сервер отвечает 400 `invalid_request`).

    ## Запросы

    - **Тела в JSON.** Запросы `POST`, `PUT` и `DELETE` передают объект JSON с `Content-Type: application/json`. `charset`, отличный от UTF-8, отклоняется, как и любой другой тип содержимого (415 `unsupported_media_type`). Пустое тело считается равным `{}` — именно его принимают эндпоинты без параметров (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`).
    - **Размер и время.** Размер тела ограничен `HTTP_BODY_LIMIT` байтами (по умолчанию 16 384; у `POST /gif` собственный лимит — 135 168 байт): 413 `payload_too_large`. Тело должно прийти в течение 10 секунд: 408 `request_timeout`. После любой из этих ошибок сервер закрывает соединение.
    - **Строгие схемы.** Поле, неизвестное эндпоинту, отклоняется, поле, не помеченное как необязательное, обязательно, а типы и длины проверяются. При любом из этих нарушений ответ — 400 `invalid_request` с `field`, где указано поле (для вложенного — через точку, например `pow.nonce`). Строки не могут содержать управляющие символы. Длина считается в кодовых единицах UTF-16, поэтому символ вне базовой многоязычной плоскости (например, эмодзи) считается дважды. На тело, которое не является JSON, ответ — 400 `invalid_json`. `POST /gif` и `POST /reports` проверяют свои тела сами (см. описание каждого эндпоинта).
    - **Строки запроса.** Учитывается первое вхождение параметра, неизвестные параметры игнорируются, а `+` декодируется в пробел: эндпоинты, принимающие категорию контроля времени, понимают и `3%2B2`, и `3+2`.
    - **Методы.** `HEAD` — это `GET` без тела. `OPTIONS` для существующего пути отвечает 204 с заголовком `Allow` (и заголовками предварительного запроса CORS, см. ниже). Любой другой метод, которого у пути нет, получает ответ 405 `method_not_allowed` с `Allow`.
    - **Цель запроса.** Она не может быть длиннее 4096 символов (414 `uri_too_long`). Запрос, который вообще не удаётся разобрать или у которого заголовочная часть слишком велика либо приходит слишком медленно, получает пустой ответ 400, 431 или 408, и соединение закрывается.
    - **CORS: список разрешённых источников, по умолчанию выключен.** API обслуживает игру, которая не отправляет `Origin`. Если `CORS_ORIGINS` пуст (значение по умолчанию), заголовки `Access-Control-*` никогда не отправляются, поэтому ни одна веб-страница не может прочитать ответ. `CORS_ORIGINS` перечисляет веб-источники (origins), страницам которых разрешено вызывать API из браузера, каждый ровно в том виде, в каком браузеры отправляют его в `Origin`: `https://host` или `https://host:port`, строчными буквами, без пути, без завершающей косой черты и без порта по умолчанию; `http://` только для `localhost`, `127.0.0.1` и `[::1]` (локальная разработка); без подстановочных знаков. Официальный сервер задаёт `CORS_ORIGINS=https://scacelith.com,https://www.scacelith.com` для своего сайта. Тогда:
      - Каждый ответ для пути под `/api/v1`, кроме эндпоинтов проверки состояния, как успешный, так и с ошибкой (включая 429 поадресного уровня), содержит `Vary: Origin`. Если `Origin` запроса байт в байт совпадает с одним из источников списка, ответ также содержит `Access-Control-Allow-Origin: <that origin>` и, кроме ответа на предварительный запрос, `Access-Control-Expose-Headers: Retry-After, Content-Disposition`, чтобы страница могла прочитать коды ошибок, `Retry-After` и имена файлов при скачивании PGN и GIF.
      - Предварительный запрос (`OPTIONS` с `Access-Control-Request-Method`) от источника из списка к существующему пути получает ответ 204 без тела, с `Allow`, `Access-Control-Allow-Origin`, `Access-Control-Allow-Methods` (методы из `Allow`), `Access-Control-Allow-Headers: Authorization, Content-Type`, `Access-Control-Max-Age: 600` и `Vary: Origin`. Ему не нужен токен, и он не учитывается ни в бюджете аккаунта, ни в каком-либо лимите эндпоинта; как и любой запрос, он расходует токен поадресного уровня. Браузер повторно использует предварительный запрос в течение 10 минут, но только для того же самого URL, включая строку запроса. Запросу без `Authorization` и без тела JSON, например `GET /info` или `GET /leaderboard`, предварительный запрос не нужен.
      - Любой другой ответ на предварительный запрос означает его неудачу, даже с заголовками CORS: 404 для несуществующего пути или 429 поадресного уровня. Тогда браузер не отправляет сам запрос, а страница видит сетевую ошибку, без ответа и его `Retry-After`.
      - `Access-Control-Allow-Credentials` никогда не отправляется, как и `Access-Control-Allow-Origin: *`: страница отправляет свой токен сеанса в `Authorization: Bearer`, как и игра, а API не устанавливает cookie. HTML-страницы, эндпоинты проверки состояния и пустые ответы на запросы, которые не удалось разобрать, не содержат заголовков CORS. WebSocket не использует CORS: `WS_ALLOWED_ORIGINS` перечисляет страницы, которым разрешено его открывать.
      - Страница источника, которого нет в списке, ничего не читает, а её межсайтовые записи никогда не отправляются: тела JSON и `Authorization` требуют предварительного запроса, ответ на который не содержит `Access-Control-Allow-Origin` для этого источника. `Cross-Origin-Resource-Policy: same-origin` остаётся в каждом ответе: он действует только на запросы `no-cors` (другой сайт встраивает ответ) и никогда на запросы `cors` страницы из списка.

    ## Ответы и ошибки

    - Ответы — JSON в UTF-8, кроме скачивания PGN (`application/x-chess-pgn`), анимированных GIF (`image/gif`) и HTML-страниц. Время указывается в миллисекундах с 1970-01-01 UTC. Идентификаторы — целые числа. Идентификаторы партий содержат до 16 цифр, но остаются меньше 2^53, поэтому число JSON (double) хранит их точно.
    - Каждый ответ API содержит `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`, `X-Frame-Options: DENY`, `Cross-Origin-Resource-Policy: same-origin` и `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'` (у HTML-страниц своя политика). При `TLS_MODE=native` он также содержит `Strict-Transport-Security: max-age=31536000`.
    - Ответ должен быть прочитан в течение 60 секунд с момента, когда сервер его подготовил; это важно только для больших ответов (GIF, экспорт данных, длинный PGN). Время, которое сервер тратит на подготовку ответа, не учитывается ни здесь, ни в тех 30 секундах без единого входящего или исходящего байта, после которых соединение закрывается.

    У всех ошибок один формат (схема `Error`):

    ```json
    { "error": "snake_case_code", "message": "An English sentence.", "retryAfter": 30 }
    ```

    `message` предназначено для журналов и служит запасным вариантом; что показать пользователю, клиент выбирает по `error`. `retryAfter` (в секундах) присутствует только в отказах, которые снимаются со временем, и тогда ответ содержит также заголовок `Retry-After` с тем же значением; единственное исключение — 503 `busy` при чтении истории, партий, игроков и таблицы лидеров: там есть только поле. Некоторые ошибки добавляют поля: `field` (недопустимые входные данные), `reason` (`weak_password`, `pow_required`), `pow` (`pow_required`), `until` (`banned`), `line` и `column` (`invalid_pgn`).

    Ошибки, которые может вернуть любой эндпоинт:

    | Статус | `error` | Когда |
    |---|---|---|
    | 400 | `invalid_request` | Тело нарушает схему эндпоинта (где именно — указывает `field`), цель запроса или `Content-Length` имеют неверный формат, параметр пути не является допустимой URL-кодировкой, или тело оборвано. |
    | 400 | `invalid_json` | Тело не является JSON. |
    | 401 | `unauthorized` | Нет заголовка `Authorization` на эндпоинте, которому нужен сеанс. |
    | 401 | `invalid_token` | Токен имеет неверный формат, истёк, отозван или принадлежит удалённому аккаунту; в том числе на эндпоинтах, где сеанс необязателен. |
    | 404 | `not_found` | Такого эндпоинта нет. Некоторые эндпоинты тоже её используют: нет такой партии, игрока или сеанса. |
    | 405 | `method_not_allowed` | Путь существует для других методов (см. `Allow`). |
    | 408 | `request_timeout` | Тело не пришло в течение 10 секунд. |
    | 413 | `payload_too_large` | Тело превышает `HTTP_BODY_LIMIT` (135 168 байт для `POST /gif`). |
    | 414 | `uri_too_long` | Цель запроса длиннее 4096 символов. |
    | 415 | `unsupported_media_type` | Тело не в формате `application/json`, или его кодировка не UTF-8. |
    | 429 | `rate_limited` | Сработал лимит частоты запросов (см. ниже): `retryAfter` и заголовок `Retry-After`. |
    | 500 | `internal_error` | Непредвиденный сбой. Сервер записывает его в журнал. |
    | 503 | `timeout` | Сервер не ответил в течение 30 секунд (60 секунд для экспорта, 45 секунд для GIF при настройках по умолчанию). |
    | 503 | `server_busy` | Поиск сеанса или изменение аккаунта натолкнулись на заблокированную базу данных (`retryAfter` 1), или очередь хеширования паролей заполнена (см. ниже). Также для `POST`, `PUT`, `PATCH` или `DELETE`: в базе данных слишком много операций записи в очереди; запрос не выполнен, и его лимиты ничего не израсходовали (`retryAfter` от 2 до 5). |

    Эндпоинты чтения (история партий, партии, игроки, таблица лидеров) и экспорт отвечают 503 `busy` с `retryAfter: 1`, если база данных так и осталась заблокированной.

    Эндпоинты, которые проверяют или хешируют пароль, могут также вернуть одну из следующих ошибок, обе со случайным `retryAfter` от 5 до 15 секунд:

    - 503 `server_busy`: очередь хеширования паролей на сервере (`PASSWORD_HASH_QUEUE_MAX`) заполнена, или истекло время ожидания.
    - 429 `rate_limited`: очередь заполнена наполовину, а у этого клиента (адрес IPv4 или сеть IPv6 /48) уже ждут `PASSWORD_HASH_WAITERS_PER_SOURCE` хешей. Этот 429 возвращает токены лимитов, которые взял запрос.

    При этом ничего не изменено и неудачная попытка не засчитана (кроме `POST /auth/sso/google/link`, где попытка по билету и неудача аккаунта учитываются ещё до хеширования), а ссылка для сброса пароля остаётся действительной.

    HTML-страницы сообщают о своих ошибках в виде HTML-страниц с теми же кодами статуса.

    ## Аутентификация

    Эндпоинты, которым нужен сеанс, принимают токен Bearer в заголовке `Authorization` (схема `bearerAuth`):

    ```
    Authorization: Bearer sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
    ```

    - **Получение токена.** Токен (`sct_` и 43 символа base64url) выдают `POST /auth/login` (а затем `POST /auth/login/mfa`, если включена двухфакторная аутентификация), `POST /auth/sso/google/finish` и `POST /auth/sso/google/link` (вход через Google), а также `POST /auth/sso/complete`. Каждый из них отвечает `{ token, expiresAt, user }`. Сервер хранит только SHA-256 токена.
    - **Обязательный сеанс.** При отсутствии заголовка ответ — 401 `unauthorized` с `WWW-Authenticate: Bearer realm="scacelith"`. При недействительном токене ответ — 401 `invalid_token` с `WWW-Authenticate: Bearer realm="scacelith", error="invalid_token"`. Получив `invalid_token`, клиент должен забыть токен и войти снова.
    - **Необязательный сеанс.** Для `GET /games/{id}`, `GET /games/{id}/pgn`, `GET /players/{username}` и `GET /players/{username}/games` сеанс необязателен. Без заголовка они возвращают общедоступное представление; если заголовок отправлен, его токен должен быть действительным.
    - **Срок действия.** Сеанс завершается при наступлении первого из двух сроков: через `SESSION_MAX_DAYS` (90) дней после входа (это `expiresAt`) или после `SESSION_IDLE_DAYS` (30) дней без использования. Каждое использование отодвигает срок бездействия; сервер записывает новое значение не чаще чем раз в 5 минут. У аккаунта может быть не более `MAX_SESSIONS_PER_USER` (10) сеансов: новый вход отзывает самые старые сверх этого числа.
    - **Отзыв.** Выход (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`) отзывает сеансы; то же делают смена пароля (остальные сеансы), сброс пароля и удаление аккаунта (все сеансы), а также администратор. Отзыв через API действует сразу, и WebSocket, открытый с отозванным сеансом, закрывается. Смена или сброс пароля и удаление аккаунта отзывают сеансы в той же транзакции, что и само изменение: если одно из этих действий не удаётся, ни один сеанс не отозван и ничего другого тоже не изменено. Сервер кеширует результаты поиска сеансов на 30 секунд, поэтому отзыв административной командой, которая работает в отдельном процессе, вступает в силу в течение 30 секунд.
    - **Область действия.** Токен принадлежит одному серверу и открывает также его WebSocket. Никогда не отправляйте его другому серверу.

    ## Лимиты частоты запросов и другие ограничения

    Лимиты действуют в одной из двух областей. **Клиент:** адрес IPv4 или сеть IPv6 /64 (в режиме прокси адрес берётся из `X-Forwarded-For`, присланного адресом из `TRUSTED_PROXIES`); некоторые лимиты, помимо каждой сети /64, считают ещё и каждую сеть IPv6 /48 целиком. **Игрок:** аккаунт, в который выполнен вход, с какого бы адреса ни шли запросы; лимит, считаемый по игроку на эндпоинте с необязательным сеансом, для запроса без токена считается по клиенту.

    Каждый лимит — это корзина токенов (token bucket) вместимостью `limit` запросов, которая непрерывно пополняется со скоростью `limit / window`; `retryAfter` — время до появления следующего токена. Лимиты с пометкой *общий* дополнительно считаются в скользящем окне той же длины, чтобы ни одно окно не вмещало заметно больше `limit` запросов. Каждый лимит считается для всего сервера. Когда один из лимитов эндпоинта отклоняет запрос, токены, взятые для этого запроса остальными его лимитами, возвращаются. Отказ — это ответ 429 `rate_limited` с `retryAfter` и `Retry-After`.

    - **Поадресный уровень.** Каждый запрос (любой путь и метод, включая эндпоинты проверки состояния и переход на WebSocket) сначала берёт один токен из бюджета своего клиента: `HTTP_RATE_PER_IP` (600) в минуту с запасом на всплеск в полминуты и `HTTP_RATE_PER_PREFIX` (4 x `HTTP_RATE_PER_IP`) на сеть IPv6 /48. Кроме того, у клиента может выполняться не более `IP_MAX_INFLIGHT` (32 x `WORKERS`) запросов одновременно (сверх этого — `retryAfter` 1). Клиент, который продолжает слать запросы после отказов, блокируется: `ABUSE_BLOCK_REFUSALS_PER_MIN` (600) отказов за одну минуту блокируют его на 1 минуту, а каждая новая блокировка в течение 6 часов — на 4, 16 и 60 минут. Отказ по лимитам `auth`, `auth_*` и `reauth` засчитывается за 5; отказы по лимитам, которые считаются по игроку, не засчитываются никогда. Адреса из `ABUSE_EXEMPT` минуют этот уровень, но не бюджет аккаунта и не лимиты эндпоинтов.
    - **Бюджет аккаунта.** Каждый запрос с действительным токеном сеанса засчитывается также его аккаунту: `USER_RATE_PER_MIN` (120) в минуту на все эндпоинты вместе, с любого адреса, с запасом на всплеск в полминуты.
    - **Лимиты эндпоинтов:**

    | Лимит | По умолчанию | Считается по | Эндпоинты |
    |---|---|---|---|
    | `auth` | `AUTH_RATE_PER_IP` (20) / 10 мин, общий | клиенту, а также `AUTH_RATE_PER_PREFIX` (5 x `AUTH_RATE_PER_IP`) на IPv6 /48 | `POST /auth/register`, `/auth/login`, `/auth/login/mfa`, `/auth/verify-email/resend`, `/auth/password/forgot`, `/auth/password/reset`, `/auth/sso/google/link`, `/auth/sso/complete`; `POST /verify-email`, `/reset-password`, `/confirm-email-change` |
    | `auth_register` | `AUTH_REGISTER_PER_HOUR` (10) / час, общий | клиенту, втрое больше на IPv6 /48 | `POST /auth/register` |
    | `auth_mail` | `AUTH_MAIL_PER_HOUR` (10) / час, общий | клиенту, втрое больше на IPv6 /48 | `POST /auth/verify-email/resend` |
    | `auth_forgot` | `AUTH_FORGOT_PER_HOUR` (3) / час, общий | клиенту, втрое больше на IPv6 /48 | `POST /auth/password/forgot` |
    | `auth_forgot_day` | `AUTH_FORGOT_PER_DAY` (10) / 24 часа, общий | клиенту, втрое больше на IPv6 /48 | `POST /auth/password/forgot` |
    | `auth_reset` | `AUTH_RESET_PER_HOUR` (10) / час, общий | клиенту, втрое больше на IPv6 /48 | `POST /auth/password/reset`, `POST /reset-password` |
    | `reauth` | значения `auth`, собственная корзина, общий | клиенту и IPv6 /48 | изменения аккаунта, требующие пароль (см. «Повторная аутентификация»), и `POST /account/export` |
    | `reauth_user` | `AUTH_REAUTH_PER_USER` (10) / 10 мин, общий | игроку | те же эндпоинты, что и у `reauth` |
    | `account` | 60 / мин | игроку | `GET /account/me`, `PUT /account/preferences` |
    | `account_games` | 60 / мин | игроку | `GET /account/games` |
    | `account_export` | 5 / час, общий | игроку | `POST /account/export` (проверяется до `reauth`; засчитывается каждая попытка) |
    | `sessions` | 60 / мин | игроку | `POST /auth/logout`, `/auth/logout-all`, `GET /auth/sessions`, `DELETE /auth/sessions/{id}` |
    | `public_read` | 60 / мин | игроку (клиенту, если токена нет) | `GET /players/{username}`, `/players/{username}/games`, `/games/{id}`, `/games/{id}/pgn` (одна корзина на все четыре) |
    | `gif` | 30 / мин | игроку | `GET /games/{id}/gif`, `POST /gif` (одна корзина на оба) |
    | `gif_user_min`, `gif_user_hour` | `GIF_USER_RENDERS_PER_MIN` (4) / мин и `GIF_USER_RENDERS_PER_HOUR` (30) / час, общие | игроку | те же два, только когда GIF нужно создать (а не взять из кеша) |
    | `gif_ip_min`, `gif_ip_hour` | `GIF_IP_RENDERS_PER_MIN` (12) / мин и `GIF_IP_RENDERS_PER_HOUR` (120) / час, общие | клиенту (все его аккаунты вместе), втрое больше на IPv6 /48 | те же, с тем же условием |
    | `reports` | 30 / час | игроку | `POST /reports` |
    | `sso_start` | 30 / 10 мин, общий | клиенту, а также 90 на IPv6 /48 | `POST /auth/sso/google/start` |
    | `sso_finish` | 30 / мин | клиенту | `POST /auth/sso/google/finish` |
    | `page` | 60 / мин | клиенту | `GET /verify-email`, `/reset-password`, `/confirm-email-change` |

    У `GET /info` и `GET /leaderboard` нет собственных лимитов: действует только поадресный уровень. Эндпоинт с несколькими лимитами проверяет их в порядке, указанном в его описании.

    Сервер обрабатывает запрос в таком порядке: поадресный уровень, затем эндпоинты проверки состояния; сопоставление с эндпоинтом; для `POST`, `PUT`, `PATCH` или `DELETE` — проверка очереди операций записи базы данных (503 `server_busy`); аутентификация; бюджет аккаунта, если запрос несёт сеанс; лимиты эндпоинта; тело; сам эндпоинт (эндпоинты GIF расходуют свои лимиты на рендеринг, только когда им действительно нужно создать GIF). Поэтому запрос, отклонённый из-за токена, не тратит ни одного токена эндпоинта, а запрос с недопустимым телом их тратит.

    Другие ограничения, о которых сообщают сами эндпоинты:

    - **Неудачные входы под одним логином** (имя пользователя или адрес эл. почты): начиная с `AUTH_FAILURES_PER_ACCOUNT` (5) неудач каждая попытка должна ждать вдвое дольше предыдущей (2 с, 4 с и так далее, до 15 минут): 429 `too_many_attempts` с `retryAfter`. Счётчик сбрасывается после часа без неудач.
    - **Неудачные вторые факторы при входе:** то же правило, начиная с 5-го неверного кода аккаунта. Один шаг входа принимает не более 5 неверных кодов.
    - **Коды второго фактора одного аккаунта:** не более `AUTH_MFA_PER_ACCOUNT` (10) кодов (из приложения-аутентификатора или кодов восстановления, верных или неверных) за 15 минут, с любого адреса, при входе и при повторной аутентификации; сверх этого — 429 `too_many_attempts` ещё до проверки кода, так что код восстановления не расходуется.
    - **Неудачные повторные аутентификации аккаунта** (неверный пароль или код): то же правило (429 `too_many_attempts`), общее для всех эндпоинтов с повторной аутентификацией.
    - **Письма:** не более одного письма с подтверждением или сбросом пароля на адрес раз в 5 минут (ответ при этом не меняется); не более одного уведомления «кто-то пытался использовать ваш адрес» на адрес в час.
    - **Жалобы:** `REPORTS_PER_DAY` (5) от одного игрока за 24 часа: 429 `report_limit`.

    ## Доказательство работы

    `POST /auth/register` всегда требует доказательства работы (proof of work), если `POW_REGISTER_BITS` больше 0 (по умолчанию 18; `GET /info` сообщает это значение как `pow.register`). `POST /auth/login` и `POST /auth/sso/google/link` (у них один вид задачи) требуют его только в течение 5 минут после того, как сервер заметит волну неудачных входов (`POW_LOGIN_TRIGGER_PER_MIN`, затем `POW_LOGIN_BITS`); клиент узнаёт об этом из ответа.

    1. На запрос без доказательства (или с отклонённым доказательством) приходит ответ 428 `pow_required` с `reason` и задачей `pow` `{ challenge, bits, expiresAt }`.
    2. Найдите nonce — десятичную строку не длиннее 20 цифр, такую, что `SHA-256(challenge + ":" + nonce)` начинается с `bits` нулевых битов (начиная со старшего бита первого байта). Для 18 битов требуется в среднем около 260 000 хешей.
    3. Отправьте тот же запрос ещё раз с `"pow": { "challenge": "...", "nonce": "123456" }` в теле.

    Задача действительна 2 минуты и только один раз, для одного эндпоинта и одной сети клиента (адрес IPv4 или IPv6 /64). Она подписана, поэтому сервер ничего о ней не хранит, пока она не вернётся. `reason` сообщает, почему доказательство отклонено: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` или `replayed`.

    ## Повторная аутентификация

    Изменения аккаунта требуют снова ввести пароль, а при включённой двухфакторной аутентификации — ещё и второй фактор:

    - только пароль: `POST /account/password` и `POST /account/mfa/totp/setup`;
    - пароль и код из приложения-аутентификатора (код восстановления не принимается): `POST /account/mfa/recovery-codes`;
    - пароль и код из приложения-аутентификатора или код восстановления: `POST /account/mfa/totp/disable`, `POST /account/email`, `POST /account/export` и `POST /account/delete`.

    В телах запросов `code` содержит 6-значный код из приложения-аутентификатора, а `recoveryCode` — код восстановления (`xxxx-xxxx-xx`; регистр, пробелы и дефисы не важны). Там, где коды восстановления принимаются, код восстановления можно передать и в `code`. Каждый код срабатывает один раз: использованный код из приложения-аутентификатора отклоняется до следующего 30-секундного шага, а код восстановления после использования пропадает.

    | Статус | `error` | Когда |
    |---|---|---|
    | 403 | `invalid_password` | Неверный пароль, или пароль был сброшен или изменён, пока выполнялся запрос (ничего не изменено). |
    | 403 | `mfa_code_required` | Двухфакторная аутентификация включена, а ни `code`, ни `recoveryCode` не отправлены. |
    | 403 | `invalid_code` | Неверный или уже использованный код. |
    | 400 | `password_not_set` | У аккаунта, который входит только через Google, ещё нет пароля (его задают через «Забыли пароль?»). |
    | 429 | `too_many_attempts` | Слишком много неудач или слишком много опробованных кодов для этого аккаунта. |
    | 503 / 429 | `server_busy` / `rate_limited` | Очередь хеширования паролей занята. |

    Неверные пароли и коды учитываются в счётчике неудач аккаунта и записываются как события безопасности.

    ## Порт метрик

    Помимо порта API, сервер отвечает по обычному HTTP на порту метрик (`METRICS_PORT`, 9464, привязан к `METRICS_BIND`, по умолчанию 127.0.0.1; не открывайте его наружу). Он не входит в этот API: `GET /healthz` отвечает `ok`; `GET /readyz` отвечает `ready` после завершения запуска (каждый шард воспроизвёл свой журнал, и слушающие сокеты привязаны) и до начала остановки, а в остальное время — 503 `not ready`; `GET /metrics` отдаёт метрики Prometheus и, если задан `METRICS_TOKEN`, требует `Authorization: Bearer <token>` именно с этим токеном.
