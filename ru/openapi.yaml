                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                next: 4100000000001
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_cursor` (`before` не является идентификатором партии), `invalid_limit` (последние две — без `field`).'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: токен отправлен, но недействителен.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: такого игрока нет или аккаунт удалён.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимит `public_read` или бюджет аккаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (база данных так и осталась заблокированной; `retryAfter: 1` в теле, без заголовка `Retry-After`), `server_busy` (при поиске сеанса база данных оказалась заблокированной), `timeout`.'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: Получить лучших игроков категории
      description: |-
        100 лучших записей рейтинга официальной категории, в которых учтено не менее `minGames` (`PROVISIONAL_GAMES`) партий, без удалённых аккаунтов и игроков, уличённых в нечестной игре. Сервер пересчитывает каждую таблицу не чаще раза в 10 секунд; когда это произошло, сообщает `updatedAt`. Для каждой категории одновременно выполняется только один расчёт: тем временем остальные запросы получают предыдущий список или ждут расчёта, если списка ещё нет.

        **Лимиты:** только поадресный уровень.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: Идентификатор официальной категории (`3+2` или `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: Сколько игроков вернуть, от 1 до 100. Большее число длиной до 3 цифр считается равным 100; пустое значение равносильно отсутствию параметра.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: Таблица лидеров.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (отсутствует или не является официальной категорией), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: поадресный уровень.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (база данных так и осталась заблокированной; `retryAfter: 1` в теле, без заголовка `Retry-After`), `timeout`.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Пожаловаться на соперника по недавней партии
      description: |-
        Жалоба на соперника по одной из собственных партий игрока, закончившейся за последние 7 дней. Сама по себе жалоба никогда не меняет ни рейтинг, ни санкции, ни уровень доверия. Она повышает приоритет проверки, который видят модераторы, и, кроме категории `abuse`, запрашивает анализ партии движком.

        Повторная жалоба на того же соперника по той же партии получает тот же ответ и ничего не меняет; ответ никогда ничего не сообщает об аккаунте, на который подана жалоба. `GET /games/{id}` заранее сообщает участникам партии, будет ли принята жалоба (`reportable`).

        Этот эндпоинт проверяет тело сам, в порядке `gameId`, `reported`, `category`, `comment`: при ошибке ответ — 400 `invalid_request` без `field`. Неизвестные поля игнорируются.

        **Лимиты:** `reports` (по игроку), затем `REPORTS_PER_DAY` (5) жалоб от игрока за 24 часа (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Жалоба принята (или уже была подана).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (без `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: это не соперник автора жалобы по партии, закончившейся за последние 7 дней.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, с заголовком `Retry-After`): за последние 24 часа уже подано `REPORTS_PER_DAY` жалоб. `rate_limited`: лимит `reports` или бюджет аккаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (при поиске сеанса база данных оказалась заблокированной), `timeout`. Также `server_busy` с `retryAfter` от 2 до 5: в базе данных слишком много операций записи в очереди, и запрос не выполнен.'
  /verify-email:
