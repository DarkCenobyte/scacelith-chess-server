      description: |-
        Отвечает 200 `ok`, пока процесс работает. `HEAD` тоже поддерживается. Любой другой метод (включая `OPTIONS`) получает ответ 405 `method_not_allowed` с `Allow: GET, HEAD`.

        **Лимиты:** только поадресный уровень.
      security: []
      responses:
        '200':
          description: Процесс работает.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
              example:
                status: ok
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: поадресный уровень.'
  /readyz:
    servers:
      - url: https://caissa.scacelith.com
        description: Официальный сервер, в корне.
      - url: https://caissa.scacelith.com/api/v1
        description: Официальный сервер, под `/api/v1`.
      - url: https://{host}:{port}
        description: Любой сервер Scacelith, в корне.
        variables:
          host:
            default: caissa.scacelith.com
            description: Публичное имя хоста сервера (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Публичный порт API (`PUBLIC_API_PORT`, а если он не задан — `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Любой сервер Scacelith, под `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: Публичное имя хоста сервера (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Публичный порт API (`PUBLIC_API_PORT`, а если он не задан — `API_PORT`).
    get:
      operationId: getReadiness
      tags:
        - health
      summary: Проверить, что сервер принимает игроков
      description: |-
        Отвечает 200 `ready`, когда сервер принимает игроков, и 503 `not_ready`, пока он запускается или останавливается. `HEAD` тоже поддерживается. Любой другой метод (включая `OPTIONS`) получает ответ 405 `method_not_allowed` с `Allow: GET, HEAD`.

        **Лимиты:** только поадресный уровень.
      security: []
      responses:
        '200':
          description: Сервер принимает игроков.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: поадресный уровень.'
        '503':
          description: Сервер запускается или останавливается.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Токен сеанса (`sct_` и 43 символа base64url) из ответа на вход, в заголовке `Authorization`: `Authorization: Bearer <token>`. Префикс — ровно `Bearer` (с учётом регистра) и один пробел; на значение без него или на токен, который не состоит из 1–512 печатных символов ASCII, ответ — 401 `invalid_token`, как для любого другого недействительного токена. Пустой заголовок равносилен его отсутствию.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: Идентификатор партии — положительное десятичное целое число не длиннее 16 цифр без ведущих нулей, меньше 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: Идентификатор сеанса в том виде, в каком его возвращает `GET /auth/sessions`, без ведущих нулей (`03` — это не сеанс 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Имя пользователя игрока, без учёта регистра. Сервер принимает любое имя из 2–24 символов `[A-Za-z0-9_.-]` (самое широкое правило, которое он когда-либо допускал).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Идентификатор партии; выводятся только более старые партии. Передайте `next` предыдущей страницы. Пустое значение равносильно отсутствию параметра.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Размер страницы, от 1 до 50. Большее число длиной до 3 цифр считается равным 50; пустое значение равносильно отсутствию параметра.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: Токен ссылки из письма (43 символа base64url). Если его нет или он неверен, показывается страница "link invalid or expired" (ссылка недействительна или истекла).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Каждый ответ сервера запрещает кеширование.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Сколько секунд подождать перед повторной попыткой; то же значение, что и `retryAfter` в теле.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Вызов аутентификации по схеме Bearer, с `error="invalid_token"` при недействительном токене.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: После этого ответа сервер закрывает соединение.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (с `field`, если ошибка в поле тела) или `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Поле нарушает схему
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Тело не является JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Слабый пароль
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: Нечитаемый PGN
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (нет заголовка `Authorization`) или `invalid_token` (токен имеет неверный формат, истёк, отозван или принадлежит удалённому аккаунту).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Нет сеанса
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Недействительный токен
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Запрос отклонён.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Неверный пароль при повторной аутентификации
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Заблокированный аккаунт
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found` или функция, отключённая на этом сервере.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: тело не пришло в течение 10 секунд. Сервер закрывает соединение.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Запрос противоречит состоянию сервера.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: попытка или билет входа через Google неизвестны, уже использованы или истекли; начните заново из игры.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: тело превышает `HTTP_BODY_LIMIT` (по умолчанию 16 384 байта). Сервер закрывает соединение.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: цель запроса длиннее 4096 символов.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: тело не в формате `application/json`, или его кодировка не UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: в партии больше `GIF_MAX_PLIES` (600) полуходов.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: решите задачу `pow` и отправьте тот же запрос снова с `pow: { challenge, nonce }`. `reason` сообщает причину: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` или `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (лимит частоты запросов, бюджет аккаунта или очередь хеширования паролей) или `too_many_attempts` (ограничение по аккаунту), с `retryAfter` и заголовком `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Лимит частоты запросов
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Слишком много неудач для этого аккаунта
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: непредвиденный сбой. Сервер записывает его в журнал.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: неверный `state` или `iss`, либо Google отклонил код или прислал ID-токен, который не проходит проверку. Текст от Google в ответ никогда не включается.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` или `timeout`: повторите попытку через `retryAfter`, если он указан.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Сервер занят
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: База данных так и осталась заблокированной (чтение)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Сервер отвечал слишком долго
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Анимированный GIF в виде вложения.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` для партии этого сервера, `attachment; filename="scacelith-game.gif"` для PGN, присланного через `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Размер файла в байтах.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: HTML-страница.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: HTML-страница с объяснением отказа.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Форма не пришла в течение 10 секунд (HTML-страница). Сервер закрывает соединение.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: HTML-страница с объяснением конфликта.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Форма превышает `HTTP_BODY_LIMIT` (HTML-страница). Сервер закрывает соединение.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Тело не является ни формой (`application/x-www-form-urlencoded`), ни JSON, или его кодировка не UTF-8 (HTML-страница).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Лимит частоты запросов (HTML-страница), с `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Непредвиденный сбой (HTML-страница с заголовком "Server error" (ошибка сервера)). Сервер записывает его в журнал.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Сервер занят (база данных так и осталась заблокированной, с `Retry-After`) или отвечал слишком долго (HTML-страница с заголовком "Server error" (ошибка сервера)).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: Единый формат всех ответов JSON API с ошибкой.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Код ошибки в `snake_case`. По нему клиент выбирает, что показать.
          examples:
            - rate_limited
        message:
          type: string
          description: Предложение на английском языке — для журналов и как запасной вариант.
        retryAfter:
          type: integer
          minimum: 1
          description: Сколько секунд подождать перед повторной попыткой; есть только в отказах, которые снимаются со временем. Тогда ответ содержит также заголовок `Retry-After` с тем же значением — кроме 503 `busy` при чтении истории, партий, игроков и таблицы лидеров.
        field:
          type: string
          description: Поле или параметр запроса, в котором ошибка (`invalid_request`, `invalid_option`, а также `invalid_cursor`, `invalid_limit` и `invalid_filter` у `GET /account/games`). Вложенное поле указывается через точку (`pow.nonce`).
        reason:
          type: string
          description: 'Причина: правило, которое нарушает `weak_password`, или почему доказательство работы потребовалось либо было отклонено (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Только для `banned`: окончание блокировки (мс от начала эпохи), `null` при бессрочной блокировке.'
        line:
          type: integer
          minimum: 1
          description: 'Только для `invalid_pgn`: строка с ошибкой, начиная с 1.'
        column:
          type: integer
          minimum: 1
          description: 'Только для `invalid_pgn`: столбец с ошибкой, начиная с 1, в символах.'
    PowChallenge:
      type: object
      description: Задача доказательства работы (`pow` в ответе 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Подписанная задача, которую нужно вернуть как есть.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Число ведущих нулевых битов, которое должно быть у `SHA-256(challenge + ":" + nonce)`.
        expiresAt:
          type: integer
          format: int64
          description: Когда истекает задача (мс от начала эпохи), — через 2 минуты после выдачи.
    PowAnswer:
      type: object
      description: Решение задачи доказательства работы.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: '`challenge` из ответа 428 в том виде, в каком он был получен.'
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Десятичная строка не длиннее 20 цифр, такая, что `SHA-256(challenge + ":" + nonce)` начинается с `bits` нулевых битов.
    ServerInfo:
      type: object
      description: Всё, что нужно клиенту до входа или подключения.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Имя сервера (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: UUID, который база данных получает при первом запуске. Он не меняется при перезапусках. Равен `null`, если база данных не может его выдать.
        motd:
          type: string
          description: Сообщение дня (`SERVER_MOTD`), может быть пустым.
        protocol:
          type: object
          description: Протокол WebSocket (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Самая старая версия протокола, которую поддерживает сервер.
            max:
              type: integer
              minimum: 1
              description: Самая новая версия протокола, которую поддерживает сервер.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: Отпечаток схемы протокола (первые 4 байта SHA-256 её канонической формы как беззнаковое целое); справочное значение.
            subprotocol:
              type: string
              description: Токен подпротокола WebSocket (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: Порт WebSocket, которым пользуются игроки (`PUBLIC_WS_PORT`, иначе `WS_PORT`, иначе `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: Путь WebSocket.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Можно ли создавать новые аккаунты.
        emailVerification:
          type: boolean
          description: Подтверждают ли новые аккаунты свой адрес (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
          properties:
            google:
              type: boolean
              description: Доступен ли вход через Google.
        mfa:
          type: boolean
          const: true
          description: Двухфакторная аутентификация доступна всегда.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Сколько битов доказательства работы требует регистрация (0 — не требует).
        categories:
          type: array
          description: Официальные (рейтинговые) контроли времени (`RATED_CATEGORIES`) в порядке, заданном сервером. Любой другой контроль времени — `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Правила, которые клиент может проверить до отправки формы.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: Минимальная длина имени пользователя (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: Максимальная длина имени пользователя (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Регулярное выражение, которому должно соответствовать новое имя пользователя.
            passwordMinLength:
              type: integer
              description: Минимальная длина пароля в символах (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Максимальная длина пароля в байтах UTF-8.
            customTimeControls:
              type: boolean
              description: Можно ли использовать нестандартные контроли времени в вызовах и частных партиях.
            reportsPerDay:
              type: integer
              description: Сколько жалоб игрок может подать за 24 часа (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Максимальный размер сообщения WebSocket, которое может отправить клиент, в байтах.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 1852590473
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Официальный контроль времени.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 'Идентификатор категории: минуты и секунды добавления (`3+2`).'
        baseSec:
          type: number
          minimum: 0
          description: Основное время в секундах.
        incSec:
          type: number
          minimum: 0
          description: Добавление за ход в секундах.
    AccountView:
      type: object
      description: Аккаунт таким, каким его видит сам игрок (`user` в ответах на вход и в `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: Идентификатор аккаунта.
        username:
          type: string
          description: Имя пользователя.
        email:
          type: string
          format: email
          description: Адрес эл. почты.
        emailVerified:
          type: boolean
          description: Подтверждён ли адрес.
        mfaEnabled:
          type: boolean
          description: Включена ли двухфакторная аутентификация.
        googleLinked:
          type: boolean
          description: Привязан ли аккаунт Google.
        hasPassword:
          type: boolean
          description: '`false` для аккаунта, созданного через Google, у которого ещё не задан пароль.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Принимаются ли прямые вызовы по имени (см. `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Когда создан аккаунт (мс от начала эпохи).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Последний вход (мс от начала эпохи) или `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Новый адрес при смене адреса эл. почты, ожидающей перехода по ссылке, или `null`.
    SessionAnswer:
      type: object
      description: Новый сеанс.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Токен сеанса — для заголовка `Authorization` и для WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: Абсолютный срок окончания сеанса (мс от начала эпохи); лимит бездействия может завершить его раньше.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Второй шаг входа с двухфакторной аутентификацией; продолжение — `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Токен шага для `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Сколько секунд осталось на завершение шага.
    LoginAnswer:
      description: Сеанс или второй шаг входа с двухфакторной аутентификацией.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Первый вход через Google; продолжение — `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Билет для `POST /auth/sso/complete`, действителен 10 минут.
        suggestedUsername:
          type: string
          description: Имя пользователя, составленное из имени в Google или из адреса, либо `""`, если ничего не подходит.
    SsoNeedsPassword:
      type: object
      description: Адрес использует аккаунт с паролем; продолжение — `POST /auth/sso/google/link`. Пока ничего не привязано.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Билет для `POST /auth/sso/google/link`.
        username:
          type: string
          description: Имя пользователя этого аккаунта (его видит только тот, кто подтвердил владение адресом в Google).
        expiresIn:
          type: integer
          const: 600
          description: Сколько секунд билет остаётся действительным.
    SsoFinishAnswer:
      description: Ответ `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Попытка входа через Google.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Попытка — для `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: URL Google, который нужно открыть в системном браузере после проверки.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state`, который Google должен вернуть.'
        expiresIn:
          type: integer
          const: 600
          description: Сколько секунд попытка остаётся действительной.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Имя пользователя; действуют правила сервера (см. описание).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Адрес эл. почты. Пробелы по краям обрезаются, адрес хранится в нижнем регистре.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Пароль; действуют правила для паролей.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Имя пользователя или адрес эл. почты (любой текст с `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Необязательно. Показывается в списке активных сеансов (например, `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: '`mfaToken` из ответа на вход (или из ответа при входе через Google).'
        code:
          type: string
          maxLength: 32
          description: Необязательно. 6-значный код из приложения-аутентификатора или код восстановления.
        recoveryCode:
          type: string
          maxLength: 32
          description: Необязательно. Код восстановления. Нужен один из `code` и `recoveryCode`.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Адрес эл. почты.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Параметр `token` из ссылки для сброса.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Новый пароль; действуют правила для паролей, принятые при регистрации.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Challenge PKCE (S256) от `codeVerifier` клиента (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Порт слушающего сокета клиента на `127.0.0.1`.
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`attemptId` из ответа `POST /auth/sso/google/start`.'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: Code verifier PKCE; его SHA-256 должен совпадать с challenge, переданным в `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state` в том виде, в каком его вернул Google.'
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: '`code` в том виде, в каком его вернул Google (печатные символы ASCII без пробелов).'
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Необязательно. `iss` в том виде, в каком его вернул Google, если он его вернул.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`linkTicket` из ответа `finish`, действителен 10 минут.'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Пароль аккаунта.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`ssoTicket` из ответа `finish`, действителен 10 минут.'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Имя пользователя; действуют правила регистрации.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Активные сеансы, начиная с последнего использованного.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Активный сеанс (устройство, на котором выполнен вход).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: Идентификатор сеанса для `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: Время входа (мс от начала эпохи).
        lastSeenAt:
          type: integer
          format: int64
          description: Последнее использование (мс от начала эпохи); обновляется не чаще раза в 5 минут.
        expiresAt:
          type: integer
          format: int64
          description: Абсолютный срок окончания (мс от начала эпохи); лимит бездействия может завершить сеанс раньше.
        clientLabel:
          type:
            - string
            - 'null'
          description: '`clientLabel`, переданный при входе, или `null`, если его не было.'
        current:
          type: boolean
          description: Является ли этот сеанс тем, от которого пришёл запрос.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: По одной записи на каждую категорию, в которой игрок играл рейтинговые партии.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Действующие санкции.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }`, пока действует блокировка, иначе `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Запись рейтинга по одной категории.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: Идентификатор категории.
        rating:
          type: integer
          description: Рейтинг.
        games:
          type: integer
          minimum: 0
          description: Партии, сыгранные в категории (учтённые в рейтинге или нет).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Наивысший достигнутый рейтинг.
        provisional:
          type: boolean
          description: '`true`, пока рейтинг ещё не установлен или в нём учтено меньше `PROVISIONAL_GAMES` партий (игра показывает такой рейтинг как `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Вид санкции.
        reason:
          type:
            - string
            - 'null'
          description: Указанная причина, если она есть.
        startsAt:
          type: integer
          format: int64
          description: Начало (мс от начала эпохи).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Окончание (мс от начала эпохи), `null` для бессрочной санкции.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Окончание блокировки (мс от начала эпохи), `null` для бессрочной.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` — принимать прямые вызовы по имени, `none` — отклонять их.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Текущий пароль.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Новый пароль; действуют правила для паролей, принятые при регистрации.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Пароль аккаунта.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Код, сгенерированный по ожидающему секрету, ровно 6 цифр.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Пароль аккаунта.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Необязательно; нужен при двухфакторной аутентификации (или `recoveryCode`). Код из приложения-аутентификатора или код восстановления.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Необязательно. Код восстановления (`xxxx-xxxx-xx`; регистр, пробелы и дефисы не важны).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Пароль аккаунта.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Код из приложения-аутентификатора (код восстановления не принимается).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Новый адрес; пробелы по краям обрезаются, адрес приводится к нижнему регистру и затем проверяется так же, как при регистрации.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Пароль аккаунта.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Необязательно; нужен при двухфакторной аутентификации (или `recoveryCode`). Код из приложения-аутентификатора или код восстановления.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Необязательно. Код восстановления.
    TotpSetup:
      type: object
      description: Ожидающий секрет для приложения-аутентификатора.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Секрет в base32 для ввода в приложение.
        uri:
          type: string
          format: uri
          description: URI `otpauth://totp/...`, который показывают как QR-код.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Длительность шага в секундах.
    RecoveryCodeList:
      type: array
      description: 10 кодов восстановления, которые показываются только этот единственный раз. Каждый срабатывает один раз.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Одна из сторон партии.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Имя в записи партии (`deleted#<id>` для удалённого аккаунта).
        rating:
          type:
            - integer
            - 'null'
          description: Рейтинг на начало партии, `null`, если он неизвестен.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Рейтинг после партии. У рейтинговой партии он есть всегда; `null` только для партии, которая не учитывается в рейтингах (товарищеская, с нестандартным контролем времени, отменённая).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Изменение рейтинга; `0`, если по правилам рейтинга он остался прежним (правило FIDE о нулевом результате, соперник без установленного рейтинга, первые партии игрока без установленного рейтинга); `null` — в тех же случаях, что и у `ratingAfter`.
    GameSummary:
      type: object
      description: Краткие сведения о сохранённой партии.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Идентификатор партии.
        category:
          type: string
          description: Идентификатор официальной категории (`3+2`) или `custom`.
        rated:
          type: boolean
          description: Учитывается ли партия в рейтингах.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Контроль времени в секундах (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (см. коды партий).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Код причины окончания партии (см. коды партий).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Результат; `*` для отменённой партии.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Число полуходов.
        startedAt:
          type: integer
          format: int64
          description: Начало (мс от начала эпохи).
        endedAt:
          type: integer
          format: int64
          description: Окончание (мс от начала эпохи).
    Termination:
      type: string
      description: Название причины окончания партии (см. коды партий); `Unknown` для кода, неизвестного протоколу.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Краткие сведения о партии с точки зрения одного игрока.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Цвет игрока.
    HistoryGameSummary:
      description: Партия из истории игрока, выполнившего вход.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Основное время в миллисекундах.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Добавление в миллисекундах.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: Исход партии для этого игрока.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Партии страницы, начиная с самых новых.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Идентификатор, который нужно передать в `before` для следующей страницы, или `null` на последней странице.
        total:
          type: integer
          minimum: 0
          description: Число партий, подходящих под фильтр, на всех страницах.
    MoveRecord:
      type: object
      description: Один полуход партии.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: Ход в нотации UCI; при превращении пешки добавляется `n`, `b`, `r` или `q`.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Время, затраченное на ход (мс), `null`, если в записи его нет.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Показание часов сходившего игрока после хода (мс), `null`, если в записи его нет.
    PgnTagsView:
      type: object
      description: Основные теги PGN для отображения. `Termination` здесь — название причины окончания партии; в файле PGN используются стандартные значения PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` или `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: Дата начала по UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Рейтинг на начало партии или `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Рейтинг на начало партии или `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Запись партии с ходами и показаниями часов. Содержит поля кратких сведений о партии, кроме `color` и `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Основное время в миллисекундах.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Добавление в миллисекундах.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: Название `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: Идентификатор партии, реваншем которой является эта, или `null`.
            moves:
              type: array
              description: По одной записи на каждый полуход.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: 'Только если владелец токена играл в этой партии: его цвет.'
            reportable:
              type: boolean
              description: 'Только если владелец токена играл в этой партии: `true`, если `POST /reports` сейчас принял бы жалобу на соперника по этой партии (партия закончилась не более 7 дней назад, суточная квота не исчерпана, и на соперника ещё не подана жалоба по этой партии).'
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Имя пользователя в том написании, которое выбрал игрок.
        createdAt:
          type: integer
          format: int64
          description: Когда создан аккаунт (мс от начала эпохи).
        ratings:
          type: array
          description: Только официальные категории, в порядке, заданном сервером.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Все сохранённые партии, включая товарищеские и отменённые.
            rated:
              type: integer
              minimum: 0
              description: Рейтинговые партии, просуммированные по записям рейтинга.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Имя пользователя в том написании, которое выбрал игрок.
        games:
          type: array
          description: Партии страницы, начиная с самых новых.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Идентификатор последней партии, если страница заполнена целиком (тогда следующая страница может оказаться пустой), иначе `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: Идентификатор категории.
        minGames:
          type: integer
          minimum: 0
          description: Сколько учтённых партий нужно записи, чтобы попасть в таблицу (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Когда была рассчитана таблица (мс от начала эпохи).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: Текст PGN, не более 65 536 байт в UTF-8. Используется только первая партия.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Необязательно. Размер изображения.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Необязательно. Сторона, которая находится внизу доски.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Необязательно. Миллисекунды на ход — число JSON с целым значением.
        coords:
          type: boolean
          default: true
          description: Необязательно. Рисовать ли вокруг доски буквы вертикалей и цифры горизонталей.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Партия — целое число или строка из 1–16 цифр.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Имя пользователя соперника — как в записи партии или текущее, без учёта регистра. Не может быть пустым.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Предмет жалобы.
        comment:
          type:
            - string
            - 'null'
          description: Необязательно. Не более 500 символов после удаления управляющих символов (кроме табуляции и перевода строки) и обрезки пробелов по краям.
    AccountExport:
      type: object
      description: Всё, что сервер хранит об аккаунте (время — в мс от начала эпохи).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Когда был сделан экспорт.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Что входит в файл и что в него не входит — простым английским языком для игрока.
          items:
            type: string
        account:
          description: Данные аккаунта из `GET /account/me` с добавлением `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Адрес привязанного аккаунта Google или `null`.
        ratings:
          type: array
          description: Полные записи рейтинга.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Пункты рейтинга, возвращённые после того, как соперник был уличён в нечестной игре, суммированные по дням (UTC) и категориям, начиная с самых новых. Ни партии, ни нарушители не называются.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Все сохранённые сеансы, начиная с самых новых, без каких-либо токенов. Очистка по сроку хранения удаляет истёкший сеанс, а завершённый — через сутки после выхода.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: События безопасности, начиная с самых новых; хранятся `RETENTION_SECURITY_DAYS` дней.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Все санкции, включая снятые. Имя модератора никогда не указывается.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: События поведения, записанные для покинутых и отменённых партий игрока, а также партий, где он не сделал первый ход вовремя; хранятся 30 дней.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Жалобы, поданные игроком.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Число партий.
            list:
              type: array
              description: Все партии, начиная с самых новых, в виде кратких сведений, как в `GET /account/games`. Ходы доступны через `GET /games/{id}`, а PGN — через `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Полная запись рейтинга.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Вышел ли игрок из фазы, когда рейтинг ещё не установлен.
            countedGames:
              type: integer
              minimum: 0
              description: Партии, учтённые в рейтинге.
            updatedAt:
              type: integer
              format: int64
              description: Когда запись менялась в последний раз.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: 00:00 UTC этого дня (мс от начала эпохи).
        category:
          type: string
        points:
          type: integer
          description: Пункты, возвращённые в этот день в этой категории.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Когда сеанс был завершён, или `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Адрес, с которого выполнен вход; стирается через `RETENTION_IP_DAYS` дней.
    SecurityEvent:
      type: object
      description: |-
        Событие безопасности. `ip` указывается только для действий, совершённых в аккаунте после входа, с его паролем (и вторым фактором) или по ссылке, отправленной на его адрес: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` и `account_exported`; у всех остальных видов `ip: null`, а `ip` стирается через `RETENTION_IP_DAYS` дней.

        `detail` сохраняет только эти поля: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` и `method` (`password` или `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` и `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Событие `moderator_action` сохраняет только `{ action }` — для действий `ban`, `unban`, `reset_mfa`, `verify_email` и `revoke_sessions` (остальные действия модераторов не включаются). У всех остальных видов `detail: null`. События `rating_refund` не включаются: их пункты находятся в `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Вид события (`login`, `password_changed`...).
        at:
          type: integer
          format: int64
          description: Когда оно произошло.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: Текущее публичное имя игрока, на которого подана жалоба.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Открыта ли ещё жалоба (получил ли санкции игрок, на которого она подана, не сообщается).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Токен ссылки из письма (скрытое поле формы на странице).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Токен ссылки для сброса (скрытое поле формы).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Новый пароль; действуют правила для паролей, принятые при регистрации.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Новый пароль ещё раз; он должен совпадать.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: HTML-страница в UTF-8 (`text/html; charset=utf-8`), без JavaScript и внешних ресурсов.
