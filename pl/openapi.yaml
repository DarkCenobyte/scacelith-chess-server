                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (brak kategorii albo nie jest to oficjalna kategoria), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: warstwa limitów na adres.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (baza danych pozostała zablokowana; `retryAfter: 1` w treści, bez nagłówka `Retry-After`), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Zgłoszenie przeciwnika z niedawnej partii
      description: |-
        Zgłasza przeciwnika z jednej z własnych partii gracza, która zakończyła się w ciągu ostatnich 7 dni. Zgłoszenie samo w sobie nigdy nie zmienia rankingu, sankcji ani poziomu wiarygodności. Podnosi priorytet przeglądu widoczny dla moderatorów i, z wyjątkiem `abuse`, zleca analizę partii przez silnik.

        Ponowne zgłoszenie tego samego przeciwnika za tę samą partię dostaje tę samą odpowiedź i niczego nie zmienia; odpowiedź nigdy nie zdradza niczego o zgłoszonym koncie. `GET /games/{id}` z góry informuje graczy partii, czy zgłoszenie zostałoby przyjęte (`reportable`).

        Ten endpoint sam sprawdza swoją treść, w kolejności `gameId`, `reported`, `category`, `comment`: błąd daje odpowiedź 400 `invalid_request` bez `field`. Nieznane mu pola są ignorowane.

        **Limity:** `reports` (na gracza), potem `REPORTS_PER_DAY` (5) zgłoszeń na gracza w ciągu 24 godzin (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Zgłoszenie zostało przyjęte (albo złożono je już wcześniej).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (bez `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: nie jest to przeciwnik zgłaszającego w partii, która zakończyła się w ciągu ostatnich 7 dni.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, z nagłówkiem `Retry-After`): `REPORTS_PER_DAY` zgłoszeń w ciągu ostatnich 24 godzin. `rate_limited`: limit `reports` lub budżet konta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (wyszukiwanie sesji natrafiło na zablokowaną bazę danych), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
