          description: '`server_busy` (kolejka haszowania haseł albo baza danych pozostała zablokowana), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: Zmiana adresu e-mail
      description: |-
        Zmienia adres e-mail konta. Z `newEmail` usuwane są białe znaki na początku i na końcu, litery są zamieniane na małe, a potem adres jest sprawdzany tak jak adres podawany przy rejestracji.

        **Z potwierdzeniem e-mailem** (domyślnie): 202 `verification_sent`. Na nowy adres wysyłany jest link ważny przez 24 godziny; otwiera on `/confirm-email-change`, a adres zmienia się dopiero wtedy, gdy gracz naciśnie przycisk na tej stronie. Do tego czasu `GET /account/me` pokazuje nowy adres jako `pendingEmail`. Nowe żądanie zastępuje oczekujące; zmiana lub resetowanie hasła je anuluje. Na dany nowy adres wysyłany jest najwyżej jeden link co 5 minut, niezależnie od tego, kto o niego prosi (żądanie zmiany, która już oczekuje, zachowuje wcześniej wysłany link, który pozostaje ważny); odpowiedź jest taka sama. Obecny adres dostaje powiadomienie, że zażądano zmiany na zamaskowany adres (`a***@example.org`). Odpowiedź i `pendingEmail` są takie same, gdy nowego adresu używa już inne konto: link nie jest wtedy wysyłany, więc ta zmiana nigdy się nie dokona, a zamiast tego właściciel tego adresu dostaje powiadomienie (najwyżej jedno na godzinę).

        Po potwierdzeniu linku adres się zmienia i jest uznawany za potwierdzony, urządzenia pozostają zalogowane, wcześniej wysłane linki (potwierdzenie, resetowanie hasła, inne zmiany) przestają działać, a poprzedni adres dostaje o tym powiadomienie, w którym nowy adres jest zamaskowany.

        **Bez potwierdzenia e-mailem** (`REQUIRE_EMAIL_VERIFICATION=false`): adres zmienia się od razu (200 `email_changed`), a poprzedni adres dostaje o tym powiadomienie. Jeśli adresu używa inne konto, odpowiedzią jest 409 `email_taken`, a właściciel tego adresu dostaje powiadomienie.

        **Ponowne uwierzytelnienie:** hasło oraz, przy weryfikacji dwuetapowej, kod z aplikacji uwierzytelniającej lub kod odzyskiwania. `invalid_email` i `same_email` są sprawdzane przed hasłem, więc nie liczą się jako nieudana próba. **Limity:** `reauth`, potem `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Adres zmienił się od razu (na tym serwerze nie ma potwierdzenia e-mailem).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: Nowy adres w postaci, w jakiej został zapisany.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: Na nowy adres wysłano link potwierdzający (albo adres należy do innego konta; odpowiedź tego nie zdradza).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email` (obecny adres konta), `password_not_set` (konto logujące się tylko przez Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` (także gdy zmiana lub resetowanie hasła wyprzedziły żądanie: link nie jest wysyłany), `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: tylko bez potwierdzenia e-mailem.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (nieudane ponowne uwierzytelnienia albo zbyt wiele kodów wypróbowanych na tym koncie) albo `rate_limited` (limit `reauth` lub `reauth_user`, budżet konta, kolejka haszowania haseł).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: kolejka haszowania haseł albo baza danych pozostała zablokowana (`retryAfter: 1`: nic się nie zmieniło i to samo żądanie można wysłać ponownie). `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: Pobranie danych konta
      description: |-
        Wszystko, co serwer przechowuje o koncie, jako jeden plik JSON do zapisania (`format` `scacelith-account-export`, `version` 1). Eksport zapisuje zdarzenie dotyczące bezpieczeństwa (`account_exported`). Tablica `notes` dokumentu wyjaśnia graczowi prostym językiem angielskim, co zostało pominięte.

        **Nigdy w eksporcie:** skrót hasła, sekret weryfikacji dwuetapowej i kody odzyskiwania; jakikolwiek token sesji lub linku ani jego skrót; dane systemu wykrywania oszustw (poziom i wynik wiarygodności, anomalie, analiza partii, waga zgłoszenia); zgłoszenia innych graczy dotyczące tego gracza; tożsamość moderatorów; prywatne dane innych graczy (przeciwnicy występują pod publiczną nazwą i z rankingiem, nic nie zdradza, czy inny gracz został objęty sankcją, i nie jest dołączany żaden adres IP, który może należeć do innej osoby).

        **Ponowne uwierzytelnienie:** hasło oraz, przy weryfikacji dwuetapowej, kod z aplikacji uwierzytelniającej lub kod odzyskiwania. **Limity:** `account_export` (5 na godzinę na gracza, dla całego serwera; liczy się każda próba, także nieudana; sprawdzany jako pierwszy), potem `reauth` i `reauth_user`. **Limit czasu:** 60 sekund.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
