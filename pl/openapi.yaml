components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Token sesji (`sct_` i 43 znaki base64url) z odpowiedzi logowania, w nagłówku `Authorization`: `Authorization: Bearer <token>`. Prefiks to dokładnie `Bearer` (z rozróżnianiem wielkości liter) i jedna spacja; wartość bez niego albo token, który nie składa się z od 1 do 512 drukowalnych znaków ASCII, daje odpowiedź 401 `invalid_token`, jak każdy inny nieprawidłowy token. Pusty nagłówek liczy się jak brak nagłówka.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: 'Identyfikator partii: dodatnia liczba całkowita w zapisie dziesiętnym, o najwyżej 16 cyfrach, bez zer wiodących, poniżej 2^53.'
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: Identyfikator sesji w postaci podawanej przez `GET /auth/sessions`, zapisany bez zer wiodących (`03` to nie sesja 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Nazwa użytkownika gracza, bez rozróżniania wielkości liter. Serwer przyjmuje każdą nazwę złożoną z od 2 do 24 znaków z `[A-Za-z0-9_.-]` (najszersza reguła, jaką kiedykolwiek dopuszczał).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Identyfikator partii; wyświetlane są tylko starsze partie. Przekaż `next` z poprzedniej strony. Pusta wartość liczy się jak brak parametru.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Rozmiar strony, od 1 do 50. Większa liczba o najwyżej 3 cyfrach liczy się jako 50; pusta wartość liczy się jak brak parametru.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: Token linku z wiadomości e-mail (43 znaki base64url). Gdy go brakuje lub jest błędny, wyświetlana jest strona „link invalid or expired” (link nieprawidłowy lub wygasł).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Każda odpowiedź serwera zabrania zapisywania w pamięci podręcznej.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Liczba sekund oczekiwania przed ponowną próbą; ta sama wartość co `retryAfter` w treści.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Wyzwanie bearer, z `error="invalid_token"` dla nieprawidłowego tokenu.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Serwer zamyka połączenie po tej odpowiedzi.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (z `field`, gdy błąd dotyczy pola treści) albo `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Pole łamie schemat
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Treść nie jest JSON-em
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Słabe hasło
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: PGN, którego nie da się odczytać
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (brak nagłówka `Authorization`) albo `invalid_token` (token ma nieprawidłowy format, wygasł, został unieważniony lub należy do usuniętego konta).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Brak sesji
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Nieprawidłowy token
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Żądanie zostało odrzucone.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Błędne hasło przy ponownym uwierzytelnieniu
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Zawieszone konto
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found` albo funkcja wyłączona na tym serwerze.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: treść nie dotarła w ciągu 10 sekund. Serwer zamyka połączenie.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Żądanie jest sprzeczne ze stanem serwera.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: próba logowania przez Google lub bilet są nieznane, użyte lub wygasłe; rozpocznij logowanie od nowa.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: treść przekracza `HTTP_BODY_LIMIT` (domyślnie 16 384 bajty). Serwer zamyka połączenie.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: cel żądania przekracza 4096 znaków.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: treść nie jest typu `application/json` albo jej kodowanie znaków nie jest UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: partia ma więcej niż `GIF_MAX_PLIES` (600) półruchów.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: rozwiąż wyzwanie `pow` i wyślij to samo żądanie ponownie z `pow: { challenge, nonce }`. `reason` podaje przyczynę: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` lub `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (limit żądań, budżet konta lub kolejka haszowania haseł) albo `too_many_attempts` (ograniczenie dotyczące konta), z `retryAfter` i nagłówkiem `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Limit żądań
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Zbyt wiele nieudanych prób na tym koncie
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: nieoczekiwany błąd. Serwer zapisuje go w logu.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: błędny `state` lub `iss` albo Google odrzuciło kod lub przesłało token ID, którego nie da się zweryfikować (także kod lub token ID drugiego klienta – gry lub witryny). Odpowiedź nigdy nie zawiera tekstu od Google.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` lub `timeout`: spróbuj ponownie po `retryAfter`, jeśli ta wartość jest podana.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Serwer jest zajęty
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Baza danych pozostała zablokowana (odczyt)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Serwer potrzebował zbyt dużo czasu
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Animowany GIF jako załącznik.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` dla partii z tego serwera, `attachment; filename="scacelith-game.gif"` dla PGN przesłanego przez `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Rozmiar pliku w bajtach.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: Strona HTML.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: Strona HTML z wyjaśnieniem odmowy.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Formularz nie dotarł w ciągu 10 sekund (strona HTML). Serwer zamyka połączenie.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: Strona HTML z wyjaśnieniem konfliktu.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Formularz przekracza `HTTP_BODY_LIMIT` (strona HTML). Serwer zamyka połączenie.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Treść nie jest ani formularzem (`application/x-www-form-urlencoded`), ani JSON-em albo jej kodowanie znaków nie jest UTF-8 (strona HTML).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Limit żądań (strona HTML), z `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Nieoczekiwany błąd, w postaci strony HTML zatytułowanej „Server error” (Błąd serwera). Serwer zapisuje go w logu.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Serwer jest zajęty (baza danych pozostała zablokowana albo serwer mocno nie nadąża; z `Retry-After`) lub potrzebował zbyt dużo czasu; strona HTML zatytułowana „Server error” (Błąd serwera).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: Jedyny kształt każdej odpowiedzi z błędem w API JSON.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Kod błędu w formacie `snake_case`. Na jego podstawie klient wybiera, co pokazać.
          examples:
            - rate_limited
        message:
          type: string
          description: Zdanie po angielsku, przeznaczone do logów i jako rozwiązanie awaryjne.
        retryAfter:
          type: integer
          minimum: 1
          description: Liczba sekund oczekiwania przed ponowną próbą, obecna tylko przy odmowach, które mijają z czasem. Odpowiedź zawiera wtedy także nagłówek `Retry-After` z tą samą wartością, z wyjątkiem 503 `busy` przy odczytach historii, partii, graczy i tabeli liderów.
        field:
          type: string
          description: Pole lub parametr zapytania, którego dotyczy błąd (`invalid_request`, `invalid_option` oraz `invalid_cursor`, `invalid_limit` i `invalid_filter` z `GET /account/games`). Pole zagnieżdżone jest zapisywane z kropką (`pow.nonce`).
        reason:
          type: string
          description: 'Przyczyna: reguła, którą łamie hasło w przypadku `weak_password`, albo powód zażądania lub odrzucenia dowodu pracy (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Tylko `banned`: koniec zawieszenia (ms od epoki Uniksa), `null` przy zawieszeniu na stałe.'
        line:
          type: integer
          minimum: 1
          description: 'Tylko `invalid_pgn`: wiersz z błędem, liczony od 1.'
        column:
          type: integer
          minimum: 1
          description: 'Tylko `invalid_pgn`: kolumna z błędem, liczona od 1, w znakach.'
    PowChallenge:
      type: object
      description: Wyzwanie dowodu pracy (`pow` w odpowiedzi 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Podpisane wyzwanie, do odesłania bez zmian.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Liczba wiodących bitów zerowych, które musi mieć `SHA-256(challenge + ":" + nonce)`.
        expiresAt:
          type: integer
          format: int64
          description: 'Kiedy wyzwanie wygasa (ms od epoki Uniksa): 2 minuty po jego wydaniu.'
    PowAnswer:
      type: object
      description: Odpowiedź na wyzwanie dowodu pracy.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: '`challenge` z odpowiedzi 428, w niezmienionej postaci.'
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Ciąg dziesiętny o najwyżej 20 cyfrach, taki że `SHA-256(challenge + ":" + nonce)` zaczyna się od `bits` bitów zerowych.
    ServerInfo:
      type: object
      description: To, czego klient potrzebuje, zanim się zaloguje lub połączy.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Nazwa serwera (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: UUID nadawany bazie danych przy jej pierwszym uruchomieniu. Nie zmienia się po ponownych uruchomieniach. Ma wartość `null`, gdy baza danych nie może go podać.
        motd:
          type: string
          description: Wiadomość dnia (`SERVER_MOTD`), może być pusta.
        protocol:
          type: object
          description: Protokół WebSocket (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Najstarsza wersja protokołu obsługiwana przez serwer.
            max:
              type: integer
              minimum: 1
              description: Najnowsza wersja protokołu obsługiwana przez serwer.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'Odcisk schematu protokołu (pierwsze 4 bajty skrótu SHA-256 jego postaci kanonicznej jako liczba całkowita bez znaku: `0xc649140f`, 3326678031, dla wersji pomocniczej (minor) 2 protokołu); wyłącznie informacyjny, nigdy nie jest porównywany.'
            subprotocol:
              type: string
              description: Token podprotokołu WebSocket (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: Port WebSocket, którego używają gracze (`PUBLIC_WS_PORT`, w przeciwnym razie `WS_PORT`, a w przeciwnym razie `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: Ścieżka WebSocketu.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Czy można zakładać nowe konta.
        emailVerification:
          type: boolean
          description: Czy nowe konta potwierdzają swój adres (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Czy logowanie przez Google jest dostępne dla gry.
            googleWeb:
              type: boolean
              description: Czy logowanie przez Google jest dostępne także dla witryny (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: Weryfikacja dwuetapowa jest zawsze dostępna.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Liczba bitów dowodu pracy wymagana przy rejestracji (0, gdy dowód nie jest wymagany).
        categories:
          type: array
          description: Oficjalne (rankingowe) tempa gry (`RATED_CATEGORIES`), w kolejności serwera. Każde inne tempo gry to `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Zasady, które klient może sprawdzić przed wysłaniem formularza.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: Minimalna długość nazwy użytkownika (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: Maksymalna długość nazwy użytkownika (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Wyrażenie regularne, do którego musi pasować nowa nazwa użytkownika.
            passwordMinLength:
              type: integer
              description: Minimalna długość hasła w znakach (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Maksymalna długość hasła w bajtach UTF-8.
            customTimeControls:
              type: boolean
              description: Czy w wyzwaniach i partiach prywatnych można używać własnego tempa gry.
            reportsPerDay:
              type: integer
              description: Ile zgłoszeń gracz może złożyć w ciągu 24 godzin (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Maksymalny rozmiar wiadomości WebSocket, jaką może wysłać klient, w bajtach.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Oficjalne tempo gry.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 'Identyfikator kategorii: minuty i sekundy dodatku (`3+2`).'
        baseSec:
          type: number
          minimum: 0
          description: Czas podstawowy w sekundach.
        incSec:
          type: number
          minimum: 0
          description: Dodatek za ruch w sekundach.
    AccountView:
      type: object
      description: Konto tak, jak widzi je jego gracz (`user` w odpowiedziach logowania i w `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: Identyfikator konta.
        username:
          type: string
          description: Nazwa użytkownika.
        email:
          type: string
          format: email
          description: Adres e-mail.
        emailVerified:
          type: boolean
          description: Czy adres jest potwierdzony.
        mfaEnabled:
          type: boolean
          description: Czy weryfikacja dwuetapowa jest włączona.
        googleLinked:
          type: boolean
          description: Czy powiązano konto Google.
        hasPassword:
          type: boolean
          description: '`false` dla konta założonego przez Google, które nie ma jeszcze ustawionego hasła.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Czy bezpośrednie wyzwania po nazwie są przyjmowane (zob. `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Kiedy konto zostało założone (ms od epoki Uniksa).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Ostatnie logowanie (ms od epoki Uniksa) lub `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Nowy adres w zmianie adresu e-mail, która czeka na swój link, lub `null`.
    SessionAnswer:
      type: object
      description: Nowa sesja.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Token sesji do nagłówka `Authorization` i do WebSocketu.
        expiresAt:
          type: integer
          format: int64
          description: Bezwzględny koniec sesji (ms od epoki Uniksa); limit bezczynności może zakończyć ją wcześniej.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Drugi krok logowania z weryfikacją dwuetapową; dalej `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Token tego kroku, do `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Liczba sekund pozostałych na wykonanie tego kroku.
    LoginAnswer:
      description: Sesja albo drugi krok logowania z weryfikacją dwuetapową.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Pierwsze logowanie przez Google; dalej `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Bilet do `POST /auth/sso/complete`, ważny przez 10 minut.
        suggestedUsername:
          type: string
          description: Nazwa użytkownika utworzona z nazwy w Google lub z adresu albo `""`, gdy nic nie pasuje.
    SsoNeedsPassword:
      type: object
      description: Adresu używa konto z hasłem; dalej `POST /auth/sso/google/link`. Nic nie jest jeszcze powiązane.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Bilet do `POST /auth/sso/google/link`.
        username:
          type: string
          description: Nazwa użytkownika tego konta (widzi ją tylko ktoś, kto udowodnił przed Google, że ten adres należy do niego).
        expiresIn:
          type: integer
          const: 600
          description: Liczba sekund ważności biletu.
    SsoFinishAnswer:
      description: Odpowiedź `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Próba logowania przez Google.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Próba, do `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: URL Google do otwarcia w przeglądarce systemowej po sprawdzeniu.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state`, który Google musi odesłać.'
        expiresIn:
          type: integer
          const: 600
          description: Liczba sekund ważności próby.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Nazwa użytkownika; następnie obowiązują zasady serwera (zob. opis).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Adres e-mail. Usuwane są białe znaki na początku i na końcu, a adres jest zapisywany małymi literami.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Hasło; następnie obowiązują zasady dotyczące haseł.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Nazwa użytkownika lub adres e-mail (dowolny tekst zawierający `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Opcjonalne. Wyświetlane na liście zalogowanych urządzeń (np. `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: '`mfaToken` z odpowiedzi logowania (lub z odpowiedzi logowania przez Google).'
        code:
          type: string
          maxLength: 32
          description: Opcjonalne. 6-cyfrowy kod z aplikacji uwierzytelniającej lub kod odzyskiwania.
        recoveryCode:
          type: string
          maxLength: 32
          description: Opcjonalne. Kod odzyskiwania. Wymagane jest jedno z pól `code` i `recoveryCode`.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Adres e-mail.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Parametr `token` linku do resetowania hasła.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Nowe hasło; obowiązują zasady dotyczące haseł przy rejestracji.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Wyzwanie PKCE S256 dla `codeVerifier` klienta (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Port gniazda nasłuchującego klienta na `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Wyzwanie PKCE S256 dla `codeVerifier` strony (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`attemptId` z `POST /auth/sso/google/start`.'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: Weryfikator PKCE; jego SHA-256 musi odpowiadać wyzwaniu przekazanemu do `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state` w postaci odesłanej przez Google.'
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: '`code` w postaci odesłanej przez Google (drukowalne znaki ASCII bez spacji).'
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Opcjonalne. `iss` w postaci odesłanej przez Google, jeśli Google go odesłało.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`linkTicket` z `finish`, ważny przez 10 minut.'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Hasło konta.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`ssoTicket` z `finish`, ważny przez 10 minut.'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Nazwa użytkownika; obowiązują zasady rejestracji.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Aktywne sesje, od ostatnio używanej.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Aktywna sesja (zalogowane urządzenie).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: Identyfikator sesji, do `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: Moment logowania (ms od epoki Uniksa).
        lastSeenAt:
          type: integer
          format: int64
          description: Ostatnie użycie (ms od epoki Uniksa), aktualizowane najwyżej co 5 minut (później, gdy serwer mocno nie nadąża).
        expiresAt:
          type: integer
          format: int64
          description: Bezwzględny koniec (ms od epoki Uniksa); limit bezczynności może zakończyć sesję wcześniej.
        clientLabel:
          type:
            - string
            - 'null'
          description: '`clientLabel` z logowania lub `null`, gdy go nie przesłano.'
        current:
          type: boolean
          description: Czy jest to sesja, z której wysłano żądanie.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Jeden wpis na każdą kategorię, w której gracz rozegrał partie rankingowe.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Aktywne sankcje.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }` w czasie zawieszenia, w przeciwnym razie `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Wpis rankingowy jednej kategorii.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: Identyfikator kategorii.
        rating:
          type: integer
          description: Ranking.
        games:
          type: integer
          minimum: 0
          description: Partie rozegrane w kategorii (wliczone do rankingu lub nie).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Najwyższy osiągnięty ranking.
        provisional:
          type: boolean
          description: '`true`, dopóki ranking nie jest jeszcze ustalony lub ma mniej niż `PROVISIONAL_GAMES` partii wliczonych do rankingu (gra pokazuje go jako `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Rodzaj sankcji.
        reason:
          type:
            - string
            - 'null'
          description: Podany powód, jeśli jest.
        startsAt:
          type: integer
          format: int64
          description: Początek (ms od epoki Uniksa).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Koniec (ms od epoki Uniksa), `null`, gdy sankcja jest nałożona na stałe.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Koniec zawieszenia (ms od epoki Uniksa), `null` przy zawieszeniu na stałe.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all`, aby przyjmować bezpośrednie wyzwania po nazwie, `none`, aby je odrzucać.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Obecne hasło.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Nowe hasło; obowiązują zasady dotyczące haseł przy rejestracji.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Hasło konta.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Kod z oczekującego sekretu, dokładnie 6 cyfr.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Hasło konta.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Opcjonalne; wymagane przy weryfikacji dwuetapowej (albo `recoveryCode`). Kod z aplikacji uwierzytelniającej lub kod odzyskiwania.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Opcjonalne. Kod odzyskiwania (`xxxx-xxxx-xx`; wielkość liter, spacje i myślniki nie mają znaczenia).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Hasło konta.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Kod z aplikacji uwierzytelniającej (kod odzyskiwania jest odrzucany).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Nowy adres; po usunięciu białych znaków na początku i na końcu oraz zamianie liter na małe jest sprawdzany tak jak adres podawany przy rejestracji.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Hasło konta.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Opcjonalne; wymagane przy weryfikacji dwuetapowej (albo `recoveryCode`). Kod z aplikacji uwierzytelniającej lub kod odzyskiwania.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Opcjonalne. Kod odzyskiwania.
    TotpSetup:
      type: object
      description: Oczekujący sekret dla aplikacji uwierzytelniającej.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Sekret w base32 do wpisania w aplikacji.
        uri:
          type: string
          format: uri
          description: URI `otpauth://totp/...` do wyświetlenia jako kod QR.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Długość kroku w sekundach.
    RecoveryCodeList:
      type: array
      description: 10 kodów odzyskiwania, pokazywanych tylko ten jeden raz. Każdy działa jednokrotnie.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Jedna ze stron partii.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Nazwa w zapisie partii (`deleted#<id>` dla usuniętego konta).
        rating:
          type:
            - integer
            - 'null'
          description: Ranking na początku partii, `null`, gdy nieznany.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Ranking po partii. Partia rankingowa zawsze go ma; `null` tylko dla partii, która nie liczy się do rankingów (towarzyskiej, z własnym tempem gry, przerwanej).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Zmiana rankingu, `0`, gdy zasady rankingu pozostawiają ranking bez zmian (reguła FIDE dotycząca zerowego wyniku, przeciwnik bez ustalonego rankingu, pierwsze partie gracza bez ustalonego rankingu); `null` w tych samych przypadkach co `ratingAfter`.
    GameSummary:
      type: object
      description: Podsumowanie zapisanej partii.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Identyfikator partii.
        category:
          type: string
          description: Identyfikator oficjalnej kategorii (`3+2`) lub `custom`.
        rated:
          type: boolean
          description: Czy partia liczy się do rankingów.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Tempo gry w sekundach (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (zob. kody partii).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Kod powodu zakończenia (zob. kody partii).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Wynik, `*` dla partii przerwanej.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Liczba półruchów.
        startedAt:
          type: integer
          format: int64
          description: Rozpoczęcie (ms od epoki Uniksa).
        endedAt:
          type: integer
          format: int64
          description: Zakończenie (ms od epoki Uniksa).
    Termination:
      type: string
      description: Nazwa powodu zakończenia (zob. kody partii); `Unknown` dla kodu, którego protokół nie zna.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Podsumowanie partii z perspektywy jednego gracza.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Strona gracza.
    HistoryGameSummary:
      description: Partia z historii zalogowanego gracza.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Czas podstawowy w milisekundach.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Dodatek w milisekundach.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: Rezultat z perspektywy gracza.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Partie na tej stronie, od najnowszej.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Identyfikator do przekazania jako `before` dla następnej strony albo `null` na ostatniej stronie.
        total:
          type: integer
          minimum: 0
          description: Liczba partii pasujących do filtra na wszystkich stronach.
    MoveRecord:
      type: object
      description: Jeden półruch partii.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: Ruch w notacji UCI, z dodanym `n`, `b`, `r` lub `q` przy promocji.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Czas naliczony za ruch (ms), `null`, gdy zapis partii go nie zawiera.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Stan zegara gracza wykonującego ruch po tym ruchu (ms), `null`, gdy zapis partii go nie zawiera.
    PgnTagsView:
      type: object
      description: Główne znaczniki PGN, do wyświetlania. `Termination` jest tu nazwą powodu zakończenia; plik PGN używa standardowych wartości PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` lub `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: Data rozpoczęcia w UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Ranking na początku partii lub `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Ranking na początku partii lub `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Zapis partii z ruchami i zegarami. Ma pola podsumowania partii, bez `color` i `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Czas podstawowy w milisekundach.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Dodatek w milisekundach.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: Nazwa wartości `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: Identyfikator partii, której rewanżem jest ta partia, lub `null`.
            moves:
              type: array
              description: Jeden element na każdy półruch.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Tylko gdy w tej partii grał gracz, do którego należy token; jego strona.
            reportable:
              type: boolean
              description: Tylko gdy w tej partii grał gracz, do którego należy token; `true`, gdy `POST /reports` przyjąłby teraz zgłoszenie przeciwnika za tę partię (partia zakończyła się w ciągu 7 dni, dzienny limit nie został wyczerpany, a przeciwnik nie został jeszcze zgłoszony za tę partię).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Nazwa użytkownika w pisowni nadanej przez gracza.
        createdAt:
          type: integer
          format: int64
          description: Kiedy konto zostało założone (ms od epoki Uniksa).
        ratings:
          type: array
          description: Tylko oficjalne kategorie, w kolejności serwera.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Wszystkie zapisane partie, łącznie z towarzyskimi i przerwanymi.
            rated:
              type: integer
              minimum: 0
              description: Partie rankingowe, zsumowane z wpisów rankingowych.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Nazwa użytkownika w pisowni nadanej przez gracza.
        games:
          type: array
          description: Partie na tej stronie, od najnowszej.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Identyfikator ostatniej partii zawsze, gdy strona jest pełna (następna strona może wtedy być pusta), w przeciwnym razie `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: Identyfikator kategorii.
        minGames:
          type: integer
          minimum: 0
          description: Liczba partii wliczonych do rankingu, jakiej wpis potrzebuje, aby znaleźć się na liście (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Kiedy tabela została obliczona (ms od epoki Uniksa).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: Tekst PGN, najwyżej 65 536 bajtów w UTF-8. Używana jest tylko pierwsza partia.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Opcjonalne. Rozmiar obrazu.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Opcjonalne. Strona, która jest na dole szachownicy.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Opcjonalne. Milisekundy na ruch, liczba JSON o wartości całkowitej.
        coords:
          type: boolean
          default: true
          description: Opcjonalne. Czy litery kolumn i numery rzędów są rysowane wokół szachownicy.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Partia, jako liczba całkowita lub ciąg od 1 do 16 cyfr.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Nazwa użytkownika przeciwnika, taka jak w zapisie partii lub obecna, bez rozróżniania wielkości liter. Nie może być pusta.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Czego dotyczy zgłoszenie.
        comment:
          type:
            - string
            - 'null'
          description: Opcjonalne. Najwyżej 500 znaków po usunięciu znaków sterujących (innych niż tabulator i znak nowego wiersza) oraz białych znaków na początku i na końcu tekstu.
    AccountExport:
      type: object
      description: Wszystko, co serwer przechowuje o koncie (czasy w ms od epoki Uniksa).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Kiedy wykonano eksport.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Co plik zawiera, a co pomija – prostym językiem angielskim, dla gracza.
          items:
            type: string
        account:
          description: Widok konta z `GET /account/me`, wraz z `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Adres powiązanego konta Google lub `null`.
        ratings:
          type: array
          description: Pełne wpisy rankingowe.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Punkty rankingowe zwrócone po wykryciu oszukiwania u przeciwnika, zsumowane według dnia (UTC) i kategorii, od najnowszych. Nie są podawane ani partie, ani oszuści.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Wszystkie zapisane sesje, od najnowszej, bez żadnych tokenów. Czyszczenie po okresie przechowywania usuwa sesję wygasłą, a wylogowaną – dzień po wylogowaniu.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Zdarzenia dotyczące bezpieczeństwa, od najnowszego, przechowywane przez `RETENTION_SECURITY_DAYS` dni.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Wszystkie sankcje, łącznie ze zniesionymi. Nazwa moderatora nigdy nie jest dołączana.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Zdarzenia dotyczące zachowania zapisane dla partii gracza opuszczonych, przerwanych i tych, w których nie wykonano pierwszego ruchu w wyznaczonym czasie, przechowywane przez 30 dni.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Zgłoszenia złożone przez gracza.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Liczba partii.
            list:
              type: array
              description: Wszystkie partie, od najnowszej, jako podsumowania w formacie `GET /account/games`. Ruchy są dostępne w `GET /games/{id}`, a PGN w `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Pełny wpis rankingowy.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Czy gracz wyszedł już z fazy bez ustalonego rankingu.
            countedGames:
              type: integer
              minimum: 0
              description: Partie wliczone do rankingu.
            updatedAt:
              type: integer
              format: int64
              description: Kiedy wpis ostatnio się zmienił.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: Godzina 00:00 UTC danego dnia (ms od epoki Uniksa).
        category:
          type: string
        points:
          type: integer
          description: Punkty zwrócone tego dnia w tej kategorii.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Kiedy sesja została wylogowana, lub `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Adres, z którego nastąpiło logowanie, wymazywany po `RETENTION_IP_DAYS` dniach.
    SecurityEvent:
      type: object
      description: |-
        Zdarzenie dotyczące bezpieczeństwa. `ip` jest podawane tylko dla czynności wykonanych po zalogowaniu, z użyciem hasła konta (i drugiego składnika) lub linku wysłanego na jego adres: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` i `account_exported`; każdy inny rodzaj ma `ip: null`, a `ip` jest wymazywane po `RETENTION_IP_DAYS` dniach.

        `detail` zachowuje tylko te pola: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` i `method` (`password` lub `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` i `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Zdarzenie `moderator_action` zachowuje tylko `{ action }`, dla akcji `ban`, `unban`, `reset_mfa`, `verify_email` i `revoke_sessions` (pozostałe akcje moderatorów są pomijane). Każdy inny rodzaj ma `detail: null`. Zdarzenia `rating_refund` są pomijane: ich punkty znajdują się w `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Rodzaj zdarzenia (`login`, `password_changed`…).
        at:
          type: integer
          format: int64
          description: Kiedy nastąpiło.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: Obecna publiczna nazwa zgłoszonego gracza.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Czy zgłoszenie jest nadal otwarte (nie jest podawane, czy zgłoszony gracz został objęty sankcją).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Token linku z wiadomości e-mail (ukryte pole formularza strony).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Token linku do resetowania hasła (ukryte pole formularza).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Nowe hasło; obowiązują zasady dotyczące haseł przy rejestracji.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Ponownie nowe hasło; musi być takie samo.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: Strona HTML w UTF-8 (`text/html; charset=utf-8`), bez JavaScriptu i zasobów zewnętrznych.
