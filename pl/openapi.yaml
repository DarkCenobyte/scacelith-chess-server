        100 najlepszych wpisów rankingowych oficjalnej kategorii z co najmniej `minGames` (`PROVISIONAL_GAMES`) partiami wliczonymi do rankingu, z pominięciem usuniętych kont i potwierdzonych oszustów. Serwer przelicza każdą tabelę najwyżej co 10 sekund; `updatedAt` mówi, kiedy to nastąpiło. Dla danej kategorii naraz trwa tylko jedno obliczenie: w tym czasie pozostałe żądania dostają poprzednią listę albo czekają na obliczenie, jeśli listy jeszcze nie ma.

