  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Pobranie partii jako pliku PGN
      description: |-
        Ta sama partia jako plik PGN: jedna partia z końcami wierszy `\n` i zapisem ruchów w wierszach krótszych niż 80 kolumn. Odpowiedź jest taka sama z tokenem i bez niego.

        Znaczniki, w tej kolejności: `Event` (`<SERVER_NAME> rated <category>` lub `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (data rozpoczęcia w UTC), `Round`, `White`, `Black`, `Result` (`*` dla partii przerwanej), `UTCDate` i `UTCTime` (rozpoczęcie), `WhiteElo` i `BlackElo` (rankingi na początku partii lub `-`), `WhiteRatingDiff` i `BlackRatingDiff` (zmiany, np. `+10` i `-10`, w każdej partii rankingowej, `+0`, gdy zasady rankingu pozostawiają ranking bez zmian; partia towarzyska, partia z własnym tempem gry i partia przerwana nie mają żadnego z nich), `TimeControl` (w sekundach), `Termination` (standardowa wartość PGN: `normal`; `time forfeit` – opadnięcie chorągiewki, także gdy partia kończy się remisem; `abandoned`; `rules infraction` – drugi nieprawidłowy ruch lub walkower za naruszenie zasad uczciwej gry; `unterminated` – partia przerwana), `PlyCount`, `ScacelithGameId` (identyfikator dziesiętny).

        Każdy ruch ma `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: stan zegara gracza wykonującego ruch po tym ruchu i czas naliczony za ten ruch, w dziesiątych częściach sekundy (z obcięciem). Wartość jest pomijana, gdy zapis partii jej nie zawiera. Po ostatnim ruchu następuje słownie podany powód zakończenia, a potem wynik.

        **Limit:** `public_read` (na gracza z tokenem, na klienta bez tokenu).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Plik PGN.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'Tekst PGN w UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: nie jest to dodatnia liczba całkowita o najwyżej 16 cyfrach (poniżej 2^53); `invalid_request`: nieprawidłowe kodowanie URL.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: wysłano token, który jest nieprawidłowy.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: nie ma takiej partii.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `public_read` lub budżet konta.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: między innymi gdy zapisanych ruchów nie da się odtworzyć aż do zapisanego zakończenia (serwer zapisuje to w logu).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (baza danych pozostała zablokowana; `retryAfter: 1` w treści, bez nagłówka `Retry-After`), `server_busy` (wyszukiwanie sesji natrafiło na zablokowaną bazę danych), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Pobranie partii z tego serwera jako animowanego GIF-a
      description: |-
        Partia jako animowany GIF. Nazwy i rankingi pochodzą z zapisu partii (rankingi na początku partii, usunięte konto jako `deleted#<id>`), podobnie jak wynik i sposób zakończenia (`Resignation`, `Loss on time`…).

        Sprawdzenia odbywają się w tej kolejności: `gif_disabled`, opcje obrazu (`size`, `orientation`, `delay`, `coords`), identyfikator partii, partia, jej długość.

        **Wymagana sesja:** limity są liczone na konto. **Limity:** `gif` przy każdym żądaniu; `gif_user_min`, `gif_user_hour`, `gif_ip_min` i `gif_ip_hour` tylko wtedy, gdy GIF trzeba wygenerować (zob. opis sekcji). **Limit czasu:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 sekund (domyślnie 45 sekund).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 'Rozmiar obrazu: `small` (pola 32 px), `medium` (48 px) lub `large` (72 px).'
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Strona, która jest na dole szachownicy.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Milisekundy na ruch (od 1 do 6 cyfr dziesiętnych).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Czy litery kolumn i numery rzędów są rysowane wokół szachownicy (`1`), czy nie (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` z `field` (`size`, `orientation`, `delay` lub `coords`): wartość spoza dozwolonych. `invalid_game_id`. `invalid_request`: nieprawidłowe kodowanie URL.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: nie ma takiej partii. `gif_disabled`: serwer wyłączył GIF-y (`GIF_ENABLED=false`; żeton `gif` jest zwracany).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `gif`, limit renderowania lub budżet konta.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: nie udało się wygenerować GIF-a (serwer zapisuje przyczynę w logu). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` z `retryAfter` (od 3 do 10 sekund) i `Retry-After`: kolejka renderowania jest pełna albo GIF czekał `GIF_QUEUE_TIMEOUT_MS` (10 sekund) na wolny wątek; wszystkie żetony limitów pobrane przez żądanie są zwracane. `busy`: baza danych pozostała zablokowana (`retryAfter: 1` tylko w treści). `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Utworzenie animowanego GIF-a z dowolnej partii przesłanej jako PGN
      description: |-
        Ten sam obraz co `GET /games/{id}/gif` dla dowolnej partii przesłanej jako tekst PGN: partii zapisanej przez grę, eksportu z innego serwisu, partii wpisanej ręcznie. Używana jest tylko pierwsza partia z tekstu.

        - Parser PGN przyjmuje to samo, co własny parser gry: każdy PGN zapisany przez ten serwer i typowe eksporty z innych serwisów (komentarze, warianty, NAG-i i adnotacje zegara są pomijane; numery ruchów i SAN są odczytywane tolerancyjnie; znacznik `FEN` określa pozycję początkową, chyba że `SetUp` ma wartość `"0"`).
        - Nazwy i rankingi pochodzą ze znaczników `White`, `Black`, `WhiteElo` i `BlackElo`. Litery ze znakami diakrytycznymi tracą te znaki, pozostałe znaki spoza drukowalnego ASCII są zamieniane na `?`, a długie nazwy są przycinane (48 znaków). Wynik pochodzi ze znacznika `Result`, a w razie jego braku z końca zapisu ruchów. Znacznik `Termination` jest pokazywany, chyba że ma wartość `normal`: wtedy wszystko mówi pozycja końcowa (mat, pat).
        - Ten endpoint sam sprawdza swoją treść: nieznane pole albo brakujące lub niebędące ciągiem znaków `pgn` daje odpowiedź 400 `invalid_request` z `field`; błędna opcja daje odpowiedź 400 `invalid_option` (`delayMs` musi być liczbą JSON, `coords` wartością logiczną; `null` jest odrzucane).

        **Wymagana sesja:** limity są liczone na konto. **Limity:** jak dla `GET /games/{id}/gif`. **Limit rozmiaru treści:** 135 168 bajtów, niezależnie od `HTTP_BODY_LIMIT` (PGN jako ciąg JSON, łącznie z sekwencjami ucieczki). **Limit czasu:** domyślnie 45 sekund.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Krótka partia wpisana ręcznie, bez współrzędnych
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: Plik PGN ze wszystkimi opcjami
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` z `field` (nieznane pole albo brakujące lub niebędące ciągiem znaków `pgn`; bez `field`, gdy treść nie jest obiektem); `invalid_json`; `invalid_option` z `field` (`size`, `orientation`, `delayMs` lub `coords`); `invalid_pgn` z `line` i `column` (liczonymi od 1, kolumny w znakach) oraz `message` parsera: nieprawidłowy lub niejednoznaczny ruch, uszkodzony znacznik, nieznany wariant, ponad 65 536 bajtów.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: serwer wyłączył GIF-y (`GIF_ENABLED=false`; żeton `gif` jest zwracany).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: treść większa niż 135 168 bajtów.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `gif`, limit renderowania lub budżet konta.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: nie udało się wygenerować GIF-a (serwer zapisuje przyczynę w logu). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` z `retryAfter` (od 3 do 10 sekund) i `Retry-After`: kolejka renderowania jest pełna albo GIF zbyt długo czekał na wolny wątek; wszystkie żetony limitów pobrane przez żądanie są zwracane. `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
