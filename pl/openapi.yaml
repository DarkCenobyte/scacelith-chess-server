        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (nieudane ponowne uwierzytelnienia albo zbyt wiele kodów wypróbowanych na tym koncie) albo `rate_limited` (limit `reauth` lub `reauth_user`, budżet konta, kolejka haszowania haseł).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (kolejka haszowania haseł albo baza danych pozostała zablokowana), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /account/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags:
