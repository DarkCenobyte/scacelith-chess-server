          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (nieudane ponowne uwierzytelnienia albo zbyt wiele kodów wypróbowanych na tym koncie) albo `rate_limited` (limit `account_export`, `reauth` lub `reauth_user`, budżet konta, kolejka haszowania haseł).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (baza danych pozostała zablokowana, z nagłówkiem `Retry-After: 1`), `server_busy` (kolejka haszowania haseł), `timeout` (60 sekund). Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: Usunięcie konta
      description: |-
        Usuwa konto; tej operacji nie można cofnąć.

        - Wszystkie sesje zostają od razu unieważnione: od tej chwili token dostaje 401 `invalid_token`.
        - Nazwa użytkownika zmienia się na `deleted#<id>`, na koncie i w każdym zapisie partii.
        - Wymazywane są: adres e-mail, skrót hasła, sekret weryfikacji dwuetapowej i kody odzyskiwania, sesje i tokeny linków, powiązanie z Google, wpis wiarygodności w systemie wykrywania oszustw oraz adresy IP zapisane ze zdarzeniami dotyczącymi bezpieczeństwa.
        - Rankingi i partie są zachowywane. Partie pozostają dostępne do odczytu pod anonimową nazwą, a `GET /players/{username}` odpowiada 404 dla poprzedniej nazwy.

        **Ponowne uwierzytelnienie:** hasło oraz, przy weryfikacji dwuetapowej, kod z aplikacji uwierzytelniającej lub kod odzyskiwania. **Limity:** `reauth`, potem `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Konto zostało usunięte.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (konto logujące się tylko przez Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (nieudane ponowne uwierzytelnienia albo zbyt wiele kodów wypróbowanych na tym koncie) albo `rate_limited` (limit `reauth` lub `reauth_user`, budżet konta, kolejka haszowania haseł).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (kolejka haszowania haseł albo baza danych pozostała zablokowana), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Lista partii gracza z filtrami i podziałem na strony
      description: |-
        Partie zalogowanego gracza, od najnowszej, z filtrami i podziałem na strony, wraz z liczbą partii pasujących do filtra. Każdy parametr zapytania jest opcjonalny, a pusta wartość liczy się jak jego brak.

        Podział na strony: przekaż `next` z poprzedniej strony jako `before`; na ostatniej stronie `next` ma wartość `null`. `total` liczy partie pasujące do filtra na wszystkich stronach.

        **Limit:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: Identyfikator oficjalnej kategorii (`3+2` lub `3%2B2`) albo `custom` dla wszystkich partii z innym tempem gry.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Tylko partie rankingowe (`true`) lub towarzyskie (`false`).
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Tylko partie wygrane, przegrane lub zremisowane, z perspektywy gracza. Partie przerwane pojawiają się tylko bez tego filtra.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Jedna strona historii.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` nie jest identyfikatorem partii), `invalid_limit` albo `invalid_filter` (`category`, `rated` lub `result`), każdy z `field` wskazującym parametr.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `account_games` lub budżet konta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (baza danych pozostała zablokowana; `retryAfter: 1` w treści, bez nagłówka `Retry-After`), `server_busy` (wyszukiwanie sesji natrafiło na zablokowaną bazę danych), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /games/{id}:
    get:
      operationId: getGame
      tags:
        - games
      summary: Pobranie zapisu partii z ruchami i zegarami
      description: |-
        Jeden zapis partii, z ruchami i zegarami. Bez tokenu albo z tokenem gracza, który nie grał w tej partii, odpowiedź jest publiczna. Gdy w partii grał gracz, do którego należy token, odpowiedź zawiera dodatkowo `you` i `reportable`.

        **Limit:** `public_read` (na gracza z tokenem, na klienta bez tokenu).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Zapis partii.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
