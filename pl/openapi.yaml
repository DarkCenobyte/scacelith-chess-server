      summary: Wymiana kodów odzyskiwania
      description: |-
        Zastępuje kody odzyskiwania 10 nowymi; stare przestają działać.

        **Ponowne uwierzytelnienie:** hasło oraz kod z aplikacji uwierzytelniającej w `code` (kod odzyskiwania jest odrzucany z 403 `invalid_code`). **Limity:** `reauth`, potem `reauth_user`.
      security:
