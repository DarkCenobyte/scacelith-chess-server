paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Pobranie nazwy, wersji, portów i zasad rejestracji serwera
      description: |-
        Czego klient potrzebuje, zanim się zaloguje lub połączy: nazwa i identyfikator serwera, wersje protokołu WebSocket i miejsce, w którym znajduje się WebSocket, zasady rejestracji, oficjalne tempa gry oraz limity, które klient może sprawdzić przed wysłaniem formularza.

        **Limity:** tylko warstwa limitów na adres.
      security: []
      responses:
        '200':
          description: Opis serwera.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: warstwa limitów na adres.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Założenie konta
      description: |-
        Zakłada konto: po potwierdzeniu jego adresu e-mail linkiem wysłanym na ten adres albo od razu, bez potwierdzenia e-mailem.

        **Z potwierdzeniem e-mailem** (`REQUIRE_EMAIL_VERIFICATION`, domyślnie): 202 `verification_sent`. Konto jeszcze nie istnieje: rejestracja oczekuje przez 24 godziny i w tym czasie rezerwuje swoją nazwę użytkownika. Na adres wysyłany jest link ważny przez te 24 godziny, najwyżej jeden na adres co 5 minut (`POST /auth/verify-email/resend` wysyła nowy); konto zostaje utworzone, z potwierdzonym adresem, gdy link zostanie użyty (przycisk strony `/verify-email`), i gracz może się wtedy zalogować. Do tego czasu logowanie tą nazwą użytkownika dostaje odpowiedź `invalid_credentials`, jak dla nieznanego konta, a profil publiczny nie istnieje. Nowa rejestracja z tym samym adresem zastępuje oczekującą. Odpowiedź jest taka sama, gdy adresu używa już inne konto: link nie jest wtedy wysyłany, jego właściciel dostaje zamiast tego powiadomienie (najwyżej jedno na godzinę), a nazwa użytkownika jest rezerwowana w ten sam sposób, aby nic nie zdradzało, czy adres ma konto. Rejestracja, której link nie został użyty, jest usuwana po 24 godzinach, a jej nazwa użytkownika znów staje się wolna.

        **Bez potwierdzenia e-mailem** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, konto zostaje utworzone od razu i może się logować.

        **Zasady.** `username`: od `USERNAME_MIN` do `USERNAME_MAX` znaków (od 3 do 20), litery, cyfry, `_` i `-`, na początku litera lub cyfra (`GET /info` podaje te wartości w `limits`); nazwy zastrzeżone (`admin`, `moderator`, `deleted`...) i niektóre prefiksy są odrzucane; unikalna bez względu na wielkość liter. `email`: bez białych znaków na początku i końcu, zapisywany małymi literami, zwykłe ASCII z domeną zawierającą kropkę. `password`: co najmniej `PASSWORD_MIN_LENGTH` (10) znaków i najwyżej 256 bajtów UTF-8; nie może zawierać nazwy użytkownika ani części lokalnej adresu e-mail i nie może być popularnym hasłem.

        **Błędy**, sprawdzane w tej kolejności: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; błędy kolejki haszowania haseł; 409 `email_taken` (tylko bez potwierdzenia e-mailem).

        **Limity:** `auth`, potem `auth_register` (10 rejestracji na godzinę na klienta). **Dowód pracy:** zawsze, gdy `POW_REGISTER_BITS` jest większe od 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Pierwsza próba, bez dowodu pracy
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Ponowne wysłanie z dowodem pracy
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Konto zostało utworzone i może się logować (na tym serwerze nie ma potwierdzenia e-mailem).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Rejestracja czeka na swój link potwierdzający (albo adres ma już konto; odpowiedź tego nie zdradza).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (z `field`), `invalid_json`, `invalid_username`, `invalid_email` lub `weak_password` z `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` lub `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: rejestracja na tym serwerze jest zamknięta (`GET /info` podaje `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: konto ma tę nazwę użytkownika albo rezerwuje ją oczekująca rejestracja z innym adresem. `email_taken`: inne konto używa tego adresu (tylko bez potwierdzenia e-mailem).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `auth` lub `auth_register` albo kolejka haszowania haseł.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (kolejka haszowania haseł albo baza danych pozostała zablokowana), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Logowanie hasłem
      description: |-
        Loguje gracza przy użyciu nazwy użytkownika lub adresu e-mail oraz hasła. Możliwe są dwie odpowiedzi, obie ze statusem 200: sesja albo, gdy weryfikacja dwuetapowa jest włączona, drugi krok do wykonania w ciągu 5 minut przez `POST /auth/login/mfa`.

        Nieznane konto, błędne hasło i konto bez hasła dostają tę samą odpowiedź, po tym samym czasie: 401 `invalid_credentials`. Sprawdzenia konta (`banned`, `email_unverified`) następują dopiero po poprawnym haśle. Od `AUTH_FAILURES_PER_ACCOUNT` (5) niepowodzeń na jednym loginie każda próba musi czekać (429 `too_many_attempts`).

        **Limit:** `auth`. **Dowód pracy:** tylko w czasie fali nieudanych logowań (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Sesja albo drugi krok logowania z weryfikacją dwuetapową.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Zalogowano
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Weryfikacja dwuetapowa jest włączona
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: nieznane konto, błędne hasło lub konto bez hasła.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Tylko po poprawnym haśle: `banned` z `until` (ms od epoki Uniksa, `null` przy zawieszeniu na stałe) albo `email_unverified` (starsze konto, którego adres nie jest jeszcze potwierdzony).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (opóźnienie po niepowodzeniach dla tego loginu) albo `rate_limited` (limit `auth`, kolejka haszowania haseł).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (kolejka haszowania haseł albo baza danych pozostała zablokowana), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Dokończenie logowania drugim składnikiem
      description: |-
        Drugi krok logowania z weryfikacją dwuetapową, po tym jak `POST /auth/login` lub logowanie przez Google (`POST /auth/sso/google/finish` lub `POST /auth/sso/google/link`) odpowiedziało `mfaRequired`. Wyślij `code` (6-cyfrowy kod z aplikacji uwierzytelniającej lub kod odzyskiwania) albo `recoveryCode`. Kod odzyskiwania użyty tutaj przepada.

        Jeden krok przyjmuje najwyżej 5 błędnych kodów; krok kończy się też, gdy hasło zostanie zresetowane lub zmienione. Po kroku hasła powiązania z Google powiązanie jest zapisywane dopiero wtedy, gdy kod przejdzie tutaj.

        **Limity:** `auth` oraz najwyżej `AUTH_MFA_PER_ACCOUNT` (10) kodów na 15 minut dla konta, z dowolnego adresu; powyżej tego kod nie jest sprawdzany, więc kod odzyskiwania nie zostaje zużyty.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Kod z aplikacji uwierzytelniającej
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Kod odzyskiwania
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Zalogowano.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: nie wysłano ani `code`, ani `recoveryCode` albo treść łamie schemat; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: krok wygasł, został użyty lub zakończył się po 5 błędnych kodach albo hasło zostało zresetowane lub zmienione od pierwszego kroku (zaloguj się ponownie). `invalid_code`: błędny lub już użyty kod.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (z `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: tylko po kroku hasła powiązania z Google – konto Google zostało w międzyczasie powiązane z innym kontem.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: tylko po kroku hasła powiązania z Google – konto zmieniło się w międzyczasie; rozpocznij logowanie od nowa.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: opóźnienie po niepowodzeniach na koncie albo konto wykorzystało już swoje `AUTH_MFA_PER_ACCOUNT` kodów z ostatnich 15 minut. `rate_limited`: limit `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` z `retryAfter: 1`: baza danych pozostała zablokowana (po kroku powiązania z Google nic nie zostało powiązane: rozpocznij logowanie od nowa). `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Wylogowanie tej sesji
      description: |-
        Unieważnia sesję użytego tokenu. WebSocket otwarty z tym tokenem zostaje zamknięty. Bez treści (lub `{}`).

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wylogowano.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: treść inna niż `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sessions` lub budżet konta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza danych pozostała zablokowana), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
        - sessions
      summary: Wylogowanie wszystkich sesji
      description: |-
        Unieważnia wszystkie sesje konta, łącznie z tą. WebSockety otwarte z nimi zostają zamknięte. Bez treści (lub `{}`).

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wszystkie sesje zostały wylogowane.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: treść inna niż `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sessions` lub budżet konta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza danych pozostała zablokowana), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Ponowne wysłanie linku potwierdzającego
      description: |-
        Ponownie wysyła link potwierdzający adres e-mail. Odpowiedź to 202 `accepted` niezależnie od adresu, aby nigdy nie zdradzała, czy używa go konto lub rejestracja.

        Żądanie działa najwyżej raz na 5 minut na adres. Oczekująca rejestracja z tym adresem znowu dostaje swoje 24 godziny, niezależnie od tego, czy adresu używa inne konto, aby jej nazwa użytkownika pozostawała zarezerwowana równie długo w obu przypadkach. Link jest wysyłany tylko dla tej rejestracji, gdy adres nie ma konta (nowy link, ważny 24 godziny, zastępuje poprzedni), albo dla aktywnego, niepotwierdzonego konta z tym adresem.

        **Limity:** `auth`, potem `auth_mail` (10 na godzinę na klienta).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Zaakceptowano (niezależnie od adresu).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `auth` lub `auth_mail` (niezależnie od adresu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` z `retryAfter: 1`: baza danych pozostała zablokowana podczas wyszukiwania konta lub zapisywania linku niepotwierdzonego konta (odnowienie oczekującej rejestracji jest wykonywane w miarę możliwości i nigdy nie powoduje niepowodzenia żądania); 5-minutowy okres adresu i tak się rozpoczyna, więc nowe żądanie w tym czasie nic nie robi. `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Wysłanie linku do resetowania hasła
      description: |-
        Wysyła link do resetowania hasła, ważny przez godzinę, który otwiera stronę `/reset-password`. Odpowiedź to 202 `accepted` niezależnie od adresu. Link trafia tylko do aktywnego konta, najwyżej raz na 5 minut na adres. Konto logujące się tylko przez Google ustawia w ten sposób swoje pierwsze hasło.

        Odzyskiwanie hasła ma najsurowsze limity w API, wszystkie liczone dla całego serwera: 3 żądania na godzinę (`AUTH_FORGOT_PER_HOUR`) i 10 na 24 godziny (`AUTH_FORGOT_PER_DAY`) na klienta (adres IPv4 lub sieć IPv6 /64), 3 razy tyle na sieć IPv6 /48, a do tego limit `auth` (20 na 10 minut) i jeden e-mail na adres co 5 minut. Ani 202, ani 429 nie zdradza, czy adresu używa jakieś konto. Ustawienie nowego hasła ma własny limit (`auth_reset`).

        **Limity:** `auth`, `auth_forgot`, potem `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Zaakceptowano (niezależnie od adresu).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `auth`, `auth_forgot` lub `auth_forgot_day` (niezależnie od adresu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` z `retryAfter: 1`: baza danych pozostała zablokowana podczas wyszukiwania konta lub zapisywania linku; 5-minutowy okres adresu i tak się rozpoczyna, więc nowe żądanie w tym czasie nie wysyła linku. `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Ustawienie nowego hasła tokenem z linku do resetowania hasła
      description: |-
        Ustawia nowe hasło przy użyciu tokenu z linku do resetowania hasła (strona `/reset-password` robi to samo). Nowe hasło podlega zasadom rejestracji.

        Zresetowanie hasła ma te skutki, w jednej transakcji (wszystkie albo żaden): unieważnia wszystkie sesje i anuluje oczekującą zmianę adresu e-mail; pozostałe linki do resetowania hasła tego konta przestają działać; adres uznaje się za potwierdzony (link tego dowiódł); właściciel dostaje e-mail. Weryfikacja dwuetapowa pozostaje bez zmian. Po błędzie kolejki haszowania haseł, 503 lub 500 nic się nie zmieniło: stare hasło i sesje pozostają, a link pozostaje ważny.

        **Limity:** `auth`, potem `auth_reset` (10 na godzinę na klienta, 30 na sieć IPv6 /48, wspólny ze stroną: każda próba haszuje hasło).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Hasło zostało zmienione, a wszystkie sesje wylogowane.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: link jest nieprawidłowy, został użyty lub wygasł albo został wysłany na adres, którego konto już nie ma. `weak_password` (z `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `auth` lub `auth_reset` albo kolejka haszowania haseł.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: kolejka haszowania haseł albo baza danych pozostała zablokowana (`retryAfter: 1`, nic się nie zmieniło). `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Rozpoczęcie logowania przez Google
      description: |-
        Rozpoczyna próbę logowania przez Google dla wyzwania PKCE i portu gniazda nasłuchującego gry na `127.0.0.1`. Odpowiedź podaje URL Google do otwarcia w przeglądarce systemowej oraz `state` próby; próba jest ważna przez 10 minut.

        `authUrl` zawiera `client_id`, `redirect_uri` (zbudowany z `redirectPort` i znacznika źródła serwera), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 własnego weryfikatora serwera dla Google) z `code_challenge_method=S256` oraz `prompt=select_account`. Gra sprawdza go przed otwarciem (zob. opis sekcji).

        **Limit:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Próba.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: logowanie przez Google nie jest dostępne na tym serwerze.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza danych pozostała zablokowana), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Rozpoczęcie logowania przez Google w witrynie
      description: |-
        Rozpoczyna próbę logowania przez Google z witryny dla wyzwania PKCE jej strony. Odpowiedź jest taka sama jak dla gry: URL Google, pod który należy przejść, i `state` próby; próba jest ważna przez 10 minut. Dostępne, gdy `GET /info` podaje `sso.googleWeb: true`.

        `authUrl` zawiera `client_id` witryny i `redirect_uri=GOOGLE_WEB_REDIRECT_URI`, z tymi samymi pozostałymi parametrami co dla gry. Strona sprawdza go, zanim pod niego przejdzie (zob. **W witrynie** w opisie sekcji).

        **Limit:** `sso_start`, wspólny z rozpoczęciem logowania z gry.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: Próba.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: brakujący lub nieprawidłowy `codeChallenge` albo dowolne inne pole (także `redirectPort`).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: logowanie przez Google nie jest dostępne na tym serwerze albo nie jest dostępne dla witryn.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sso_start` (wspólny z rozpoczęciem logowania z gry).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza danych pozostała zablokowana), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Przekazanie odpowiedzi Google serwerowi
      description: |-
        Przekazuje serwerowi `code` i `state`, które Google wysłało do gniazda nasłuchującego gry lub do strony witryny, razem z identyfikatorem próby i weryfikatorem PKCE. Identyfikator próby jest bezużyteczny bez weryfikatora, a kod jest bezużyteczny bez własnego weryfikatora PKCE serwera i klucza tajnego klienta (client secret).

        Serwer sprawdza próbę (nieznana, użyta lub wygasła: 410), potem weryfikator (błędny pozostawia próbę do użycia), następnie zużywa próbę, sprawdza `state` i `iss`, wymienia kod z Google i weryfikuje token ID. Odpowiedź (200) to jedna z:

        - `{ token, expiresAt, user }`: zalogowano na powiązane konto;
        - `{ mfaRequired, mfaToken, expiresIn }`: dalej `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: nowe konto; dalej `POST /auth/sso/complete` w ciągu 10 minut. `suggestedUsername` pochodzi z nazwy w Google lub z adresu i jest `""`, gdy nic nie pasuje;
        - `{ needsPassword, linkTicket, username, expiresIn }`: konto z tym adresem ma hasło; dalej `POST /auth/sso/google/link`. Nic nie jest jeszcze powiązane.

        **Limit:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Sesja, drugi krok albo następny krok pierwszego logowania przez Google.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Zalogowano na powiązane konto
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Weryfikacja dwuetapowa jest włączona
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Nowy gracz
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Adresu używa konto z hasłem
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: weryfikator nie pasuje do wyzwania próby (próba pozostaje do użycia). `sso_email_unverified`: Google nie potwierdziło adresu. `registration_closed`. `account_disabled`. Tylko dla powiązanego konta: `banned` (z `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: logowanie przez Google nie jest dostępne na tym serwerze.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: adresu używa aktywne konto bez hasła (jego nazwa nie jest podawana).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: nieznana, użyta lub wygasła próba.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza danych pozostała zablokowana), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Powiązanie Google z istniejącym kontem przy użyciu jego hasła
      description: |-
        Po tym, jak `finish` odpowiedział `needsPassword`: wiąże Google z istniejącym kontem przy użyciu hasła tego konta, wpisanego w grze. Odpowiedź (200) to sesja (powiązanie zostaje zapisane, a gracz zalogowany) albo, gdy weryfikacja dwuetapowa jest włączona, `{ mfaRequired, mfaToken, expiresIn }`: dalej `POST /auth/login/mfa`, a powiązanie jest zapisywane dopiero wtedy, gdy kod przejdzie tam.

        Błędne hasło pozostawia bilet do użycia, łącznie na 5 prób. Próba jest naliczana tuż przed sprawdzeniem hasła: 429 `too_many_attempts` lub 428 `pow_required` nie zużywa żadnej, natomiast odmowa kolejki haszowania haseł (503 `server_busy`, 429 `rate_limited`) zużyła już jedną i liczy się jako niepowodzenie konta. Opóźnienie po niepowodzeniach to ten sam licznik co w `POST /auth/login`.

        **Limit:** `auth` (z liczeniem na sieć IPv6 /48). **Dowód pracy:** jak w `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Sesja albo drugi krok logowania.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: błędne hasło; bilet pozostaje do użycia, łącznie na 5 prób.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (z `until`), tylko po poprawnym haśle.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: logowanie przez Google nie jest dostępne na tym serwerze.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: w międzyczasie konto Google zostało powiązane z innym kontem.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: nieznany, użyty lub wygasły bilet, 5. błędne hasło, konto, którego status lub adres zmienił się od czasu `finish`, albo konto, którego status, adres, hasło lub weryfikacja dwuetapowa zmieniły się w trakcie zapisywania powiązania. Rozpocznij logowanie od nowa.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (opóźnienie po niepowodzeniach na koncie) albo `rate_limited` (limit `auth`, kolejka haszowania haseł).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: kolejka haszowania haseł albo baza danych pozostała zablokowana (`retryAfter: 1`, nic nie zostało powiązane). `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Założenie konta przy pierwszym logowaniu przez Google
      description: |-
        Po tym, jak `finish` odpowiedział `needsUsername`: zakłada konto z wybraną nazwą użytkownika (obowiązują zasady rejestracji) i je loguje. Konto nie ma hasła: `hasPassword` ma wartość `false`, a opcja „Nie pamiętasz hasła?” (`POST /auth/password/forgot`) pozwala je ustawić.

        **Limit:** `auth` (z liczeniem na sieć IPv6 /48).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Konto zostało założone i zalogowane.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: logowanie przez Google nie jest dostępne na tym serwerze.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (konto ma tę nazwę użytkownika albo rezerwuje ją oczekująca rejestracja z innym adresem), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: nieznany, użyty lub wygasły bilet.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza danych pozostała zablokowana), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Lista zalogowanych urządzeń
      description: |-
        Aktywne sesje konta (zalogowane urządzenia), od ostatnio używanej. `current` oznacza sesję, z której wysłano żądanie. `lastSeenAt` jest aktualizowane najwyżej co 5 minut (później, gdy serwer mocno nie nadąża); `expiresAt` to bezwzględny koniec, a limit bezczynności może zakończyć sesję wcześniej.

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aktywne sesje.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sessions` lub budżet konta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza danych pozostała zablokowana), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Wylogowanie jednego urządzenia
      description: |-
        Wylogowuje jedną sesję konta; można wylogować także bieżącą. WebSocket otwarty z tą sesją zostaje zamknięty. Bez treści (lub `{}`).

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Sesja została wylogowana.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: treść inna niż `{}` albo `id` z nieprawidłowym kodowaniem URL; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: na tym koncie nie ma aktywnej sesji o tym identyfikatorze.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sessions` lub budżet konta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza danych pozostała zablokowana), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Pobranie konta, jego rankingów i aktywnych sankcji
      description: |-
        Konto tak, jak widzi je jego gracz: widok konta (także `user` w każdej odpowiedzi logowania), jeden wpis rankingowy na każdą kategorię, w której gracz rozegrał partie rankingowe, aktywne sankcje i zawieszenie. Poziom wiarygodności nadany przez system wykrywania oszustw nigdy nie jest pokazywany.

        **Limit:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Konto.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized` albo `invalid_token` (także gdy konto zostało usunięte).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `account` lub budżet konta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza danych pozostała zablokowana), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Przyjmowanie lub odrzucanie bezpośrednich wyzwań
      description: |-
        Określa, czy inni gracze mogą wyzwać tego gracza, podając jego nazwę. Przy `none` bezpośrednie wyzwania są odrzucane: wyzywający dowiaduje się, że gracz jest niedostępny. Bez ponownego uwierzytelnienia.

        **Limit:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: Preferencje obowiązujące od teraz.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `account` lub budżet konta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza danych pozostała zablokowana), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Zmiana hasła
      description: |-
        Zmienia hasło. Wymagane jest obecne hasło, ale nie drugi składnik, nawet przy włączonej weryfikacji dwuetapowej. Nowe hasło podlega zasadom rejestracji (sprawdzanym po obecnym haśle).

        Zmiana ma następujące skutki, w jednej transakcji (wszystkie albo żaden): unieważnia wszystkie pozostałe sesje (ta pozostaje zalogowana), anuluje oczekującą zmianę adresu e-mail, sprawia, że linki do resetowania hasła tego konta przestają działać, i wysyła właścicielowi wiadomość e-mail.

        **Ponowne uwierzytelnienie:** tylko hasło. **Limity:** `reauth`, potem `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Hasło zostało zmienione.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (konto logujące się tylko przez Google), `weak_password` (z `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: błędne obecne hasło albo resetowanie lub zmiana hasła, które nastąpiły w trakcie sprawdzania żądania.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (nieudane ponowne uwierzytelnienia konta) albo `rate_limited` (limit `reauth` lub `reauth_user`, budżet konta, kolejka haszowania haseł).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: kolejka haszowania haseł albo baza danych pozostała zablokowana (`retryAfter: 1`, nic się nie zmieniło). `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Rozpoczęcie włączania weryfikacji dwuetapowej
      description: |-
        Zapisuje nowy oczekujący sekret uwierzytelniający, który zastępuje każdy wcześniejszy oczekujący sekret, i zwraca go dla aplikacji uwierzytelniającej (jako tekst i jako URI `otpauth://` do wyświetlenia w postaci kodu QR). Weryfikacja dwuetapowa nie jest jeszcze włączona: włącza ją `POST /account/mfa/totp/enable` kodem z tego sekretu.

        **Ponowne uwierzytelnienie:** tylko hasło. **Limity:** `reauth`, potem `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Oczekujący sekret.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (konto logujące się tylko przez Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (sprawdzane przed hasłem).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (nieudane ponowne uwierzytelnienia konta) albo `rate_limited` (limit `reauth` lub `reauth_user`, budżet konta, kolejka haszowania haseł).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (kolejka haszowania haseł albo baza danych pozostała zablokowana), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Dokończenie włączania weryfikacji dwuetapowej i pobranie kodów odzyskiwania
      description: |-
        Włącza weryfikację dwuetapową kodem z oczekującego sekretu (dokładnie 6 cyfr). Hasło nie jest tu wymagane; podano je przy konfiguracji. Odpowiedź zawiera 10 kodów odzyskiwania, pokazywanych tylko ten jeden raz.

        **Limity:** `reauth`, potem `reauth_user`; błędny kod liczy się do nieudanych ponownych uwierzytelnień konta.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Weryfikacja dwuetapowa jest włączona.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` nie ma dokładnie 6 cyfr albo treść łamie schemat; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: błędny kod (sprawdź czas na urządzeniu).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: brak oczekującego sekretu (najpierw wywołaj `POST /account/mfa/totp/setup`).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (nieudane ponowne uwierzytelnienia konta) albo `rate_limited` (limit `reauth` lub `reauth_user`, budżet konta).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza danych pozostała zablokowana), `timeout`. Także `server_busy` z `retryAfter` od 2 do 5, gdy serwer mocno nie nadąża (zob. wprowadzenie): żądanie nie zostało wykonane.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: Wyłączenie weryfikacji dwuetapowej
      description: |-
        Wyłącza weryfikację dwuetapową. Sekret i kody odzyskiwania zostają usunięte, a właściciel dostaje wiadomość e-mail.

        **Ponowne uwierzytelnienie:** hasło oraz kod z aplikacji uwierzytelniającej lub kod odzyskiwania (wymagane jest jedno z pól `code` lub `recoveryCode`). **Limity:** `reauth`, potem `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Weryfikacja dwuetapowa jest wyłączona.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (konto logujące się tylko przez Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required` (nie podano ani `code`, ani `recoveryCode`; sprawdzane przed hasłem), `invalid_password`, `invalid_code`.'
        '408':
