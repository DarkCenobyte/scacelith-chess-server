              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: De nye gendannelseskoder, som kun vises denne ene gang.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - recoveryCodes
                properties:
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (en konto, der kun bruger Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code` (også for en gendannelseskode).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (mislykkede fornyede godkendelser, eller for mange koder forsøgt på denne konto) eller `rate_limited` (grænsen `reauth` eller `reauth_user`, kontobudgettet, hashkøen for adgangskoder).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (hashkøen for adgangskoder, eller databasen forblev låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: Skift e-mailadressen
      description: |-
        Skifter kontoens e-mailadresse. `newEmail` trimmes og konverteres til små bogstaver og kontrolleres derefter som en adresse ved registrering.

        **Med e-mailbekræftelse** (standard): 202 `verification_sent`. Et link, der er gyldigt i 24 timer, sendes til den nye adresse; det åbner `/confirm-email-change`, og adressen skifter først, når spilleren trykker på sidens knap. Indtil da viser `GET /account/me` den nye adresse som `pendingEmail`. En ny anmodning erstatter den afventende; et skift eller en nulstilling af adgangskoden annullerer den. Der sendes højst ét link til en given ny adresse hvert 5. minut, uanset hvem der spørger (en anmodning om den ændring, der allerede afventer, beholder det tidligere sendte link, som forbliver gyldigt); svaret er det samme. Den nuværende adresse får besked om, at der er anmodet om en ændring til en maskeret adresse (`a***@example.org`). Svaret og `pendingEmail` er de samme, når en anden konto allerede bruger den nye adresse: så sendes der intet link, og den ændring bliver derfor aldrig gennemført, og ejeren af den adresse får i stedet en besked (højst én i timen).

        Når linket bekræftes, skifter adressen og regnes som bekræftet, enhederne forbliver logget ind, de tidligere sendte links (bekræftelse, nulstilling af adgangskoden, andre ændringer) holder op med at virke, og den tidligere adresse får besked, med den nye maskeret.

        **Uden e-mailbekræftelse** (`REQUIRE_EMAIL_VERIFICATION=false`): adressen skifter med det samme (200 `email_changed`), og den tidligere adresse får besked. Hvis en anden konto bruger adressen, er svaret 409 `email_taken`, og ejeren af den adresse får beskeden.

        **Fornyet godkendelse:** adgangskoden og, med totrinsgodkendelse, en kode fra godkendelsesappen eller en gendannelseskode. `invalid_email` og `same_email` kontrolleres før adgangskoden, så de tæller ikke som mislykkede forsøg. **Grænser:** `reauth`, derefter `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Adressen er skiftet med det samme (ingen e-mailbekræftelse på denne server).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: Den nye adresse, som den er gemt.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: Et bekræftelseslink er sendt til den nye adresse (eller adressen tilhører en anden konto; svaret afslører det ikke).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email` (kontoens nuværende adresse), `password_not_set` (en konto, der kun bruger Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` (også når et skift eller en nulstilling af adgangskoden kom anmodningen i forkøbet: intet link sendes), `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: kun uden e-mailbekræftelse.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (mislykkede fornyede godkendelser, eller for mange koder forsøgt på denne konto) eller `rate_limited` (grænsen `reauth` eller `reauth_user`, kontobudgettet, hashkøen for adgangskoder).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: hashkøen for adgangskoder, eller databasen forblev låst (`retryAfter: 1`: intet blev ændret, og den samme anmodning kan sendes igen). `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: Download kontoens data
      description: |-
        Alt, hvad serveren gemmer om kontoen, som én JSON-fil, der kan gemmes (`format` `scacelith-account-export`, `version` 1). Eksporten registrerer en sikkerhedshændelse (`account_exported`). Dokumentets array `notes` fortæller spilleren på letforståeligt engelsk, hvad der er udeladt.

        **Aldrig med i eksporten:** adgangskodens hash, hemmeligheden til totrinsgodkendelse og gendannelseskoderne; ethvert sessions- eller linktoken eller en hash af et sådant; anti-snydesystemets data (integritetsniveau og score, anomalier, analysen af partierne, vægten af en anmeldelse); de anmeldelser, andre spillere har indgivet om spilleren; moderatorernes identitet; andre spilleres private data (modstandere optræder med deres offentlige navn og rating, intet afslører, om en anden spiller er blevet sanktioneret, og ingen IP-adresse, der kan tilhøre en anden person, er med).

        **Fornyet godkendelse:** adgangskoden og, med totrinsgodkendelse, en kode fra godkendelsesappen eller en gendannelseskode. **Grænser:** `account_export` (5 i timen pr. spiller, for hele serveren; hvert forsøg tæller, også mislykkede; kontrolleres først), derefter `reauth` og `reauth_user`. **Tidsgrænse:** 60 sekunder.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Eksportdokumentet som vedhæftet fil.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-account-<username>.json"`. Andre tegn i brugernavnet end bogstaver, cifre, `_`, `.` og `-` bliver til `_`.'
