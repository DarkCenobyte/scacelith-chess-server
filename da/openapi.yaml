              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: lZ50AvPxUwbGqQCwWPIO28ONray7SzW0Cl_sLImwF3Q
          application/json:
            schema:
              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: lZ50AvPxUwbGqQCwWPIO28ONray7SzW0Cl_sLImwF3Q
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Adressen er skiftet.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Linket er ugyldigt, brugt eller udløbet, eller formularen er ugyldig (en HTML-side).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '409':
          $ref: '#/components/responses/HtmlConflict'
          description: En anden konto har taget adressen i mellemtiden (en HTML-side).
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Grænsen `auth` (en HTML-side) eller laget pr. adresse (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'Databasen forblev låst (`Retry-After: 1`), eller serveren er langt bagud (`Retry-After` 2 til 5, se introduktionen): intet blev ændret, og linket virker stadig. Også ved timeout i handleren.'
  /healthz:
    servers:
      - url: https://caissa.scacelith.com
        description: Den officielle server, i roden.
      - url: https://caissa.scacelith.com/api/v1
        description: Den officielle server, under `/api/v1`.
      - url: https://{host}:{port}
        description: En vilkårlig Scacelith-server, i roden.
        variables:
          host:
            default: caissa.scacelith.com
            description: Serverens offentlige værtsnavn (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Den offentlige API-port (`PUBLIC_API_PORT`, ellers `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: En vilkårlig Scacelith-server, under `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: Serverens offentlige værtsnavn (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Den offentlige API-port (`PUBLIC_API_PORT`, ellers `API_PORT`).
    get:
      operationId: getLiveness
      tags:
        - health
      summary: Kontrollér, at processen kører
      description: |-
        Svarer 200 `ok`, så længe processen kører. `HEAD` virker også. Enhver anden metode giver 405 `method_not_allowed` med `Allow: GET, HEAD` (også `OPTIONS`).

        **Grænser:** kun laget pr. adresse.
      security: []
      responses:
        '200':
          description: Processen kører.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
              example:
                status: ok
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: laget pr. adresse.'
  /readyz:
    servers:
      - url: https://caissa.scacelith.com
        description: Den officielle server, i roden.
      - url: https://caissa.scacelith.com/api/v1
        description: Den officielle server, under `/api/v1`.
      - url: https://{host}:{port}
        description: En vilkårlig Scacelith-server, i roden.
        variables:
          host:
            default: caissa.scacelith.com
            description: Serverens offentlige værtsnavn (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Den offentlige API-port (`PUBLIC_API_PORT`, ellers `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: En vilkårlig Scacelith-server, under `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: Serverens offentlige værtsnavn (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Den offentlige API-port (`PUBLIC_API_PORT`, ellers `API_PORT`).
    get:
      operationId: getReadiness
      tags:
        - health
      summary: Kontrollér, at serveren tager imod spillere
      description: |-
        Svarer 200 `ready`, når serveren tager imod spillere, og 503 `not_ready`, mens den starter eller stopper. `HEAD` virker også. Enhver anden metode giver 405 `method_not_allowed` med `Allow: GET, HEAD` (også `OPTIONS`).

        **Grænser:** kun laget pr. adresse.
      security: []
      responses:
        '200':
          description: Serveren tager imod spillere.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: laget pr. adresse.'
        '503':
          description: Serveren er ved at starte eller stoppe.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Et sessionstoken (`sct_` efterfulgt af 43 base64url-tegn) fra et loginsvar, i headeren `Authorization`: `Authorization: Bearer <token>`. Præfikset er præcis `Bearer` (der skelnes mellem store og små bogstaver) og ét mellemrum; en værdi uden det, eller et token, der ikke består af 1 til 512 printbare ASCII-tegn, giver 401 `invalid_token` som ethvert andet ugyldigt token. En tom header regnes som ingen header.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: Parti-id'et, et positivt decimalt heltal på højst 16 cifre uden foranstillede nuller, under 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: Sessionens id, som `GET /auth/sessions` angiver det, skrevet uden foranstillede nuller (`03` er ikke session 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Spillerens brugernavn, uden hensyn til store og små bogstaver. Serveren accepterer ethvert navn på 2 til 24 tegn blandt `[A-Za-z0-9_.-]` (den bredeste regel, den nogensinde har tilladt).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Et parti-id; kun ældre partier vises. Send den forrige sides `next`. En tom værdi regnes som fraværende.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Sidestørrelsen, 1 til 50. Et større tal på op til 3 cifre regnes som 50; en tom værdi regnes som fraværende.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: E-mail-linkets token (43 base64url-tegn). Et manglende eller forkert token viser siden »link invalid or expired« (linket er ugyldigt eller udløbet).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Alle serverens svar forbyder caching.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Antal sekunder, der skal ventes før et nyt forsøg; samme værdi som `retryAfter` i bodyen.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Bearer-challengen, med `error="invalid_token"` for et ugyldigt token.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Serveren lukker forbindelsen efter dette svar.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (med `field`, når et felt i bodyen er skyld i fejlen) eller `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Et felt bryder skemaet
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Bodyen er ikke JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: En svag adgangskode
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: En PGN, der ikke kan læses
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (ingen `Authorization`-header) eller `invalid_token` (tokenet er fejlformateret, udløbet, tilbagekaldt eller tilhører en slettet konto).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Ingen session
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Et ugyldigt token
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Anmodningen afvises.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: En forkert adgangskode ved fornyet godkendelse
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: En suspenderet konto
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found` eller en funktion, som denne server har slået fra.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: bodyen nåede ikke frem inden for 10 sekunder. Serveren lukker forbindelsen.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Anmodningen er i konflikt med serverens tilstand.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: forsøget på Google-login eller billetten er ukendt, brugt eller udløbet; start login forfra.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: bodyen overstiger `HTTP_BODY_LIMIT` (16.384 byte som standard). Serveren lukker forbindelsen.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: anmodningsmålet overstiger 4096 tegn.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: bodyen er ikke `application/json`, eller dens charset er ikke UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: partiet har mere end `GIF_MAX_PLIES` (600) halvtræk.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: løs `pow`-challengen, og send den samme anmodning igen med `pow: { challenge, nonce }`. `reason` angiver, hvorfor: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` eller `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (en hastighedsgrænse, kontobudgettet eller hashkøen for adgangskoder) eller `too_many_attempts` (en drosling af kontoen), med `retryAfter` og en `Retry-After`-header.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: En hastighedsgrænse
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: For mange mislykkede forsøg på denne konto
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: en uventet fejl. Serveren logger den.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: en forkert `state` eller `iss`, eller Google afviste koden eller sendte et ID-token, der ikke kan verificeres (også en kode eller et ID-token fra den anden klient, spillets eller websitets). Den indeholder aldrig Googles tekst.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` eller `timeout`: prøv igen efter `retryAfter`, når den er angivet.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Serveren er optaget
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Databasen forblev låst (en læsning)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Serveren var for længe om det
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Den animerede GIF som vedhæftet fil.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` for et parti fra denne server, `attachment; filename="scacelith-game.gif"` for en PGN sendt med `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Filens størrelse i byte.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: En HTML-side.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: En HTML-side, der forklarer afvisningen.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Formularen nåede ikke frem inden for 10 sekunder (en HTML-side). Serveren lukker forbindelsen.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: En HTML-side, der forklarer konflikten.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Formularen overstiger `HTTP_BODY_LIMIT` (en HTML-side). Serveren lukker forbindelsen.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Bodyen er hverken en formular (`application/x-www-form-urlencoded`) eller JSON, eller dens charset er ikke UTF-8 (en HTML-side).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: En hastighedsgrænse (en HTML-side), med `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: En uventet fejl (en HTML-side med titlen »Server error«). Serveren logger den.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Serveren er optaget (databasen forblev låst, eller serveren er langt bagud; med `Retry-After`) eller var for længe om det (en HTML-side med titlen »Server error«).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: Den ene form, som alle fejlsvar fra JSON-API'en har.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Fejlkoden i `snake_case`. En klient vælger ud fra den, hvad der skal vises.
          examples:
            - rate_limited
        message:
          type: string
          description: En engelsk sætning, beregnet til logs og som reserve.
        retryAfter:
          type: integer
          minimum: 1
          description: Antal sekunder, der skal ventes før et nyt forsøg; kun til stede ved afvisninger, der ophører med tiden. Svaret har så også en `Retry-After`-header med samme værdi, undtagen ved 503 `busy` ved læsning af historik, partier, spillere og rangliste.
        field:
          type: string
          description: Det felt eller den query-parameter, der er skyld i fejlen (`invalid_request`, `invalid_option` samt `invalid_cursor`, `invalid_limit` og `invalid_filter` fra `GET /account/games`). Et indlejret felt skrives med punktummer (`pow.nonce`).
        reason:
          type: string
          description: 'Hvorfor: den regel, som et `weak_password` bryder, eller hvorfor et proof of work blev krævet eller afvist (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Kun `banned`: udelukkelsens afslutning (ms siden Unix-epoken), `null` ved en permanent udelukkelse.'
        line:
          type: integer
          minimum: 1
          description: 'Kun `invalid_pgn`: fejlens linje, fra 1.'
        column:
          type: integer
          minimum: 1
          description: 'Kun `invalid_pgn`: fejlens kolonne, fra 1, i tegn.'
    PowChallenge:
      type: object
      description: En proof of work-challenge (`pow` i et 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Den signerede challenge, som skal sendes uændret tilbage.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Det antal foranstillede nulbit, som `SHA-256(challenge + ":" + nonce)` skal have.
        expiresAt:
          type: integer
          format: int64
          description: Hvornår challengen udløber (ms siden Unix-epoken), 2 minutter efter at den blev udstedt.
    PowAnswer:
      type: object
      description: Svaret på en proof of work-challenge.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: '`challenge` fra 428-svaret, som den blev givet.'
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: En decimal streng på højst 20 cifre, så `SHA-256(challenge + ":" + nonce)` starter med `bits` nulbit.
    ServerInfo:
      type: object
      description: Hvad en klient har brug for, før den logger ind eller opretter forbindelse.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Serverens navn (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: Et UUID, som databasen får ved sin første start. Det forbliver det samme på tværs af genstarter. Det er `null`, når databasen ikke kan levere det.
        motd:
          type: string
          description: Dagens besked (`SERVER_MOTD`), muligvis tom.
        protocol:
          type: object
          description: WebSocket-protokollen (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Den ældste protokolversion, som serveren taler.
            max:
              type: integer
              minimum: 1
              description: Den nyeste protokolversion, som serveren taler.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'Protokolskemaets fingeraftryk (de første 4 byte af SHA-256 af dets kanoniske form, som et heltal uden fortegn: `0xc649140f`, 3326678031, for protokollens minor-version 2); kun til information, sammenlignes aldrig.'
            subprotocol:
              type: string
              description: WebSocket-underprotokollens token (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: Den WebSocket-port, som spillerne bruger (`PUBLIC_WS_PORT`, ellers `WS_PORT`, ellers `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: Stien til WebSocket'en.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Om der kan oprettes nye konti.
        emailVerification:
          type: boolean
          description: Om nye konti skal bekræfte deres adresse (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Om Google-login tilbydes til spillet.
            googleWeb:
              type: boolean
              description: Om Google-login også tilbydes til et website (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: Totrinsgodkendelse er altid tilgængelig.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: De proof of work-bit, som registrering kræver (0 for ingen).
        categories:
          type: array
          description: De officielle (ratede) betænkningstider (`RATED_CATEGORIES`) i serverens rækkefølge. Enhver anden betænkningstid er `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: De regler, som en klient kan kontrollere, før den sender en formular.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: Det korteste brugernavn (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: Det længste brugernavn (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Det regulære udtryk, som et nyt brugernavn skal matche.
            passwordMinLength:
              type: integer
              description: Den korteste adgangskode, i tegn (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Den længste adgangskode, i byte UTF-8.
            customTimeControls:
              type: boolean
              description: Om udfordringer og private partier må bruge tilpassede betænkningstider.
            reportsPerDay:
              type: integer
              description: Hvor mange anmeldelser en spiller må indgive pr. 24 timer (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Den største WebSocket-besked, som en klient må sende, i byte.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: En officiel betænkningstid.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Kategoriens id, minutter og sekunders tillæg (`3+2`).
        baseSec:
          type: number
          minimum: 0
          description: Grundtiden, i sekunder.
        incSec:
          type: number
          minimum: 0
          description: Tillægget pr. træk, i sekunder.
    AccountView:
      type: object
      description: Kontoen, som dens spiller ser den (`user` i loginsvarene og i `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: Kontoens id.
        username:
          type: string
          description: Brugernavnet.
        email:
          type: string
          format: email
          description: E-mailadressen.
        emailVerified:
          type: boolean
          description: Om adressen er bekræftet.
        mfaEnabled:
          type: boolean
          description: Om totrinsgodkendelse er slået til.
        googleLinked:
          type: boolean
          description: Om en Google-konto er tilknyttet.
        hasPassword:
          type: boolean
          description: '`false` for en konto oprettet via Google, som endnu ikke har angivet en adgangskode.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Om direkte udfordringer via navn modtages (se `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Hvornår kontoen blev oprettet (ms siden Unix-epoken).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Det seneste login (ms siden Unix-epoken) eller `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Den nye adresse for en ændring af e-mailadressen, der venter på sit link, eller `null`.
    SessionAnswer:
      type: object
      description: En ny session.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Sessionstokenet, til headeren `Authorization` og WebSocket'en.
        expiresAt:
          type: integer
          format: int64
          description: Sessionens absolutte udløbstidspunkt (ms siden Unix-epoken); inaktivitetsgrænsen kan afslutte den tidligere.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Andet trin i et login med totrinsgodkendelse; fortsæt med `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Trinnets token, til `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Antal sekunder, der er tilbage til at fuldføre trinnet.
    LoginAnswer:
      description: En session eller andet trin i et login med totrinsgodkendelse.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Et første Google-login; fortsæt med `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Billetten til `POST /auth/sso/complete`, gyldig i 10 minutter.
        suggestedUsername:
          type: string
          description: Et brugernavn dannet ud fra Google-navnet eller adressen, eller `""`, når intet passer.
    SsoNeedsPassword:
      type: object
      description: En konto med adgangskode bruger adressen; fortsæt med `POST /auth/sso/google/link`. Intet er tilknyttet endnu.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Billetten til `POST /auth/sso/google/link`.
        username:
          type: string
          description: Brugernavnet på den konto (kun en, der har bevist adressen over for Google, ser det).
        expiresIn:
          type: integer
          const: 600
          description: Antal sekunder, billetten forbliver gyldig.
    SsoFinishAnswer:
      description: Svaret fra `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Et forsøg på Google-login.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Forsøget, til `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: Den Google-URL, der skal åbnes i systemets browser, når den er kontrolleret.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Den `state`, som Google skal sende tilbage.
        expiresIn:
          type: integer
          const: 600
          description: Antal sekunder, forsøget forbliver gyldigt.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Brugernavnet; dernæst serverens regler (se beskrivelsen).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: E-mailadressen. Trimmes og gemmes med små bogstaver.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Adgangskoden; dernæst reglerne for adgangskoder.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Brugernavnet eller e-mailadressen (enhver tekst med `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Valgfri. Vises i listen over indloggede enheder (fx `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: '`mfaToken` fra loginsvaret (eller fra svaret på et Google-login).'
        code:
          type: string
          maxLength: 32
          description: Valgfri. En 6-cifret kode fra godkendelsesappen eller en gendannelseskode.
        recoveryCode:
          type: string
          maxLength: 32
          description: Valgfri. En gendannelseskode. Enten `code` eller `recoveryCode` er nødvendig.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: E-mailadressen.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Parameteren `token` i nulstillingslinket.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Den nye adgangskode; reglerne for adgangskoder ved registrering gælder.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: S256-PKCE-challengen for klientens `codeVerifier` (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Porten for klientens listener på `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: S256-PKCE-challengen for sidens `codeVerifier` (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`attemptId` fra `POST /auth/sso/google/start`.'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: PKCE-verifieren; dens SHA-256 skal matche den challenge, der blev givet til `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state`, som Google sendte den tilbage.'
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: '`code`, som Google sendte den tilbage (printbar ASCII uden mellemrum).'
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Valgfri. `iss`, som Google sendte den tilbage, når Google har gjort det.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`linkTicket` fra `finish`, gyldig i 10 minutter.'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Kontoens adgangskode.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`ssoTicket` fra `finish`, gyldig i 10 minutter.'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Brugernavnet; reglerne for registrering gælder.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: De aktive sessioner, den senest brugte først.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: En aktiv session (en indlogget enhed).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: Sessionens id, til `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: Tidspunktet for login (ms siden Unix-epoken).
        lastSeenAt:
          type: integer
          format: int64
          description: Seneste brug (ms siden Unix-epoken), opdateres højst hvert 5. minut (senere, mens serveren er langt bagud).
        expiresAt:
          type: integer
          format: int64
          description: Det absolutte udløbstidspunkt (ms siden Unix-epoken); inaktivitetsgrænsen kan afslutte sessionen tidligere.
        clientLabel:
          type:
            - string
            - 'null'
          description: '`clientLabel` fra loginanmodningen, eller `null`, når den ikke sendte nogen.'
        current:
          type: boolean
          description: Om dette er den session, der foretager anmodningen.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Én post pr. kategori, som spilleren har spillet ratede partier i.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: De aktive sanktioner.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }`, mens kontoen er suspenderet, ellers `null`.'
          oneOf:
