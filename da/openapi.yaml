paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Hent serverens navn, versioner, porte og regler for registrering
      description: |-
        Det, en klient har brug for, før den logger ind eller opretter forbindelse: serverens navn og id, WebSocket-protokollens versioner og hvor WebSocket'en ligger, reglerne for registrering, de officielle betænkningstider og de grænser, en klient kan kontrollere, før den sender en formular.

        **Grænser:** kun laget pr. adresse.
      security: []
      responses:
        '200':
          description: Serverens beskrivelse.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: laget pr. adresse.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Opret en konto
      description: |-
        Opretter en konto: når dens e-mailadresse er bekræftet med det link, der sendes til den, eller med det samme uden e-mailbekræftelse.

        **Med e-mailbekræftelse** (`REQUIRE_EMAIL_VERIFICATION`, standard): 202 `verification_sent`. Der findes endnu ingen konto: registreringen venter i 24 timer og reserverer sit brugernavn imens. Et link, der er gyldigt i de 24 timer, sendes til adressen, højst ét pr. adresse hvert 5. minut (`POST /auth/verify-email/resend` sender et nyt); kontoen oprettes, med adressen bekræftet, når linket bruges (knappen på siden `/verify-email`), og spilleren kan derefter logge ind. Indtil da giver et login med det brugernavn svaret `invalid_credentials`, som for en ukendt konto, og den offentlige profil findes ikke. En ny registrering med samme adresse erstatter den ventende. Svaret er det samme, når en anden konto allerede bruger adressen: så sendes der intet link, kontoens ejer får i stedet en meddelelse (højst én pr. time), og brugernavnet reserveres på samme måde, så intet afslører, om adressen har en konto. En registrering, hvis link ikke blev brugt, kasseres efter 24 timer, og dens brugernavn er ledigt igen.

        **Uden e-mailbekræftelse** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, kontoen oprettes med det samme og kan logge ind.

        **Regler.** `username`: `USERNAME_MIN` til `USERNAME_MAX` tegn (3 til 20), bogstaver, cifre, `_` og `-`, og det skal starte med et bogstav eller et ciffer (`GET /info` angiver dem som `limits`); reserverede navne (`admin`, `moderator`, `deleted`...) og visse præfikser afvises; unikt uden hensyn til store og små bogstaver. `email`: trimmes og gemmes med små bogstaver, ren ASCII med et domæne med punktum. `password`: mindst `PASSWORD_MIN_LENGTH` (10) tegn og højst 256 byte UTF-8; den må ikke indeholde brugernavnet eller e-mailens lokale del og må ikke være en almindeligt brugt adgangskode.

        **Fejl**, kontrolleret i denne rækkefølge: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; fejlene fra hashkøen for adgangskoder; 409 `email_taken` (kun uden e-mailbekræftelse).

        **Grænser:** `auth`, derefter `auth_register` (10 registreringer pr. time pr. klient). **Proof of work:** altid, når `POW_REGISTER_BITS` er over 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Første forsøg, uden proof of work
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Sendt igen med proof of work
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Kontoen er oprettet og kan logge ind (ingen e-mailbekræftelse på denne server).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Registreringen venter på sit bekræftelseslink (eller adressen har allerede en konto; svaret afslører det ikke).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (med `field`), `invalid_json`, `invalid_username`, `invalid_email` eller `weak_password` med `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` eller `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: registrering er lukket på denne server (`GET /info` angiver `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: en konto har brugernavnet, eller en ventende registrering med en anden adresse reserverer det. `email_taken`: en anden konto bruger adressen (kun uden e-mailbekræftelse).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: grænsen `auth` eller `auth_register` eller hashkøen for adgangskoder.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (hashkøen for adgangskoder, eller databasen forblev låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Log ind med adgangskode
      description: |-
        Logger ind med et brugernavn eller en e-mailadresse og en adgangskode. Der er to mulige svar, begge med status 200: en session eller, når totrinsgodkendelse er slået til, et andet trin, der skal fuldføres inden for 5 minutter med `POST /auth/login/mfa`.

        Ukendt konto, forkert adgangskode og konto uden adgangskode får samme svar efter samme tid: 401 `invalid_credentials`. Kontokontrollerne (`banned`, `email_unverified`) kommer først efter en korrekt adgangskode. Fra og med `AUTH_FAILURES_PER_ACCOUNT` (5) mislykkede forsøg på ét loginnavn skal hvert forsøg vente (429 `too_many_attempts`).

        **Grænse:** `auth`. **Proof of work:** kun under en bølge af mislykkede loginforsøg (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: En session eller andet trin i et login med totrinsgodkendelse.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Logget ind
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Totrinsgodkendelse er slået til
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: ukendt konto, forkert adgangskode eller en konto uden adgangskode.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Kun efter en korrekt adgangskode: `banned` med `until` (ms siden Unix-epoken, `null` ved en permanent udelukkelse) eller `email_unverified` (en ældre konto, hvis adresse endnu ikke er bekræftet).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (ventetiden efter mislykkede forsøg for dette loginnavn) eller `rate_limited` (grænsen `auth`, hashkøen for adgangskoder).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (hashkøen for adgangskoder, eller databasen forblev låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Fuldfør et login med anden faktor
      description: |-
        Andet trin i et login med totrinsgodkendelse, efter at `POST /auth/login` eller et Google-login (`POST /auth/sso/google/finish` eller `POST /auth/sso/google/link`) har svaret `mfaRequired`. Send `code` (en 6-cifret kode fra godkendelsesappen eller en gendannelseskode) eller `recoveryCode`. En gendannelseskode, der bruges her, er væk.

        Ét trin accepterer højst 5 forkerte koder; trinnet slutter også, når adgangskoden nulstilles eller skiftes. Efter adgangskodetrinnet i en Google-tilknytning gemmes tilknytningen først, når koden godkendes her.

        **Grænser:** `auth` og højst `AUTH_MFA_PER_ACCOUNT` (10) koder pr. 15 minutter for kontoen, fra enhver adresse; derudover kontrolleres koden ikke, så en gendannelseskode ikke bliver brugt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: En kode fra godkendelsesappen
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: En gendannelseskode
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Logget ind.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: hverken `code` eller `recoveryCode` blev sendt, eller bodyen bryder skemaet; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: trinnet er udløbet, er brugt eller sluttede efter 5 forkerte koder, eller adgangskoden er nulstillet eller skiftet siden første trin (log ind igen). `invalid_code`: en forkert eller allerede brugt kode.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (med `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: kun efter adgangskodetrinnet i en Google-tilknytning, hvis Google-kontoen i mellemtiden er blevet knyttet til en anden konto.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: kun efter adgangskodetrinnet i en Google-tilknytning, hvis kontoen er ændret i mellemtiden; start login forfra.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: kontoens ventetid efter mislykkede forsøg, eller dens `AUTH_MFA_PER_ACCOUNT` koder for de seneste 15 minutter er brugt op. `rate_limited`: grænsen `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` med `retryAfter: 1`: databasen forblev låst (efter et trin i en Google-tilknytning er intet blevet knyttet: start login forfra). `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Log denne session ud
      description: |-
        Tilbagekalder sessionen for det anvendte token. Den WebSocket, der er åbnet med den, lukkes. Ingen body (eller `{}`).

        **Grænse:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logget ud.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: en anden body end `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: grænsen `sessions` eller kontobudgettet.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databasen forblev låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
        - sessions
      summary: Log alle sessioner ud
      description: |-
        Tilbagekalder alle kontoens sessioner, også denne. De WebSockets, der er åbnet med dem, lukkes. Ingen body (eller `{}`).

        **Grænse:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Alle sessioner er logget ud.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: en anden body end `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: grænsen `sessions` eller kontobudgettet.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databasen forblev låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Send bekræftelseslinket igen
      description: |-
        Sender linket til e-mailbekræftelse igen. Svaret er 202 `accepted` uanset adressen, så det aldrig afslører, om en konto eller en registrering bruger den.

        En anmodning har højst virkning én gang hvert 5. minut pr. adresse. En ventende registrering med den adresse får sine 24 timer igen, uanset om en anden konto bruger adressen, så dens brugernavn forbliver reserveret lige længe i begge tilfælde. Et link sendes kun for den registrering, når adressen ikke har nogen konto (et nyt link, gyldigt i 24 timer, erstatter det forrige), eller for en aktiv, ubekræftet konto med den adresse.

        **Grænser:** `auth`, derefter `auth_mail` (10 pr. time pr. klient).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Accepteret (uanset adressen).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: grænsen `auth` eller `auth_mail` (uanset adressen).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` med `retryAfter: 1`: databasen forblev låst, mens kontoen blev slået op, eller mens linket til en ubekræftet konto blev gemt (fornyelsen af en ventende registrering sker efter bedste evne og får aldrig anmodningen til at mislykkes); adressens 5 minutter starter alligevel, så en ny anmodning inden for dem gør intet. `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Send et link til nulstilling af adgangskoden
      description: |-
        Sender et link til nulstilling af adgangskoden, gyldigt i én time, som åbner siden `/reset-password`. Svaret er 202 `accepted` uanset adressen. Et link sendes kun til en aktiv konto, højst én gang hvert 5. minut pr. adresse. En konto, der kun bruger Google, angiver sin første adgangskode på denne måde.

        Gendannelse af adgangskoden har API'ens strengeste grænser, alle talt for hele serveren: 3 anmodninger pr. time (`AUTH_FORGOT_PER_HOUR`) og 10 pr. 24 timer (`AUTH_FORGOT_PER_DAY`) pr. klient (en IPv4-adresse eller et IPv6-/64-net), 3 gange så mange pr. IPv6-/48-net, oven i grænsen `auth` (20 pr. 10 minutter) og den ene mail pr. adresse hvert 5. minut. Hverken 202 eller 429 afslører, om en konto bruger adressen. Angivelsen af den nye adgangskode har sin egen grænse (`auth_reset`).

        **Grænser:** `auth`, `auth_forgot`, derefter `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Accepteret (uanset adressen).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: grænsen `auth`, `auth_forgot` eller `auth_forgot_day` (uanset adressen).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` med `retryAfter: 1`: databasen forblev låst, mens kontoen blev slået op, eller mens linket blev gemt; adressens 5 minutter starter alligevel, så en ny anmodning inden for dem sender intet link. `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Angiv en ny adgangskode med tokenet fra et nulstillingslink
      description: |-
        Angiver en ny adgangskode med tokenet fra et nulstillingslink (siden `/reset-password` gør det samme). Den nye adgangskode følger reglerne for registrering.

        Nulstillingen har disse virkninger i én transaktion (alle eller ingen): den tilbagekalder alle sessioner og annullerer en afventende ændring af e-mailadressen; kontoens andre nulstillingslinks holder op med at virke; adressen tæller som bekræftet (linket beviste det); ejeren får en mail. Totrinsgodkendelse berøres ikke. Efter en fejl fra hashkøen for adgangskoder, en 503 eller en 500 er intet ændret: den gamle adgangskode og sessionerne bevares, og linket forbliver gyldigt.

        **Grænser:** `auth`, derefter `auth_reset` (10 pr. time pr. klient, 30 pr. IPv6-/48-net, delt med siden: hvert forsøg hasher en adgangskode).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Adgangskoden er skiftet, og alle sessioner er logget ud.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: linket er ugyldigt, brugt eller udløbet eller blev mailet til en adresse, som kontoen ikke længere har. `weak_password` (med `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: grænsen `auth` eller `auth_reset` eller hashkøen for adgangskoder.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: hashkøen for adgangskoder, eller databasen forblev låst (`retryAfter: 1`, intet ændret). `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Start et Google-login
      description: |-
        Starter et forsøg på Google-login for PKCE-challengen og porten på spillets listener på `127.0.0.1`. Svaret giver den Google-URL, der skal åbnes i systemets browser, og forsøgets `state`; forsøget er gyldigt i 10 minutter.

        `authUrl` indeholder `client_id`, `redirect_uri` (bygget ud fra `redirectPort` og serverens oprindelsestag), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 af serverens egen verifier over for Google) med `code_challenge_method=S256` og `prompt=select_account`. Spillet kontrollerer den, før det åbner den (se afsnittets beskrivelse).

        **Grænse:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Forsøget.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: Google-login tilbydes ikke på denne server.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: grænsen `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databasen forblev låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Start et Google-login på et website
      description: |-
        Starter et websites forsøg på Google-login for PKCE-challengen fra dets side. Svaret er det samme som for spillet: den Google-URL, der skal navigeres til, og forsøgets `state`; forsøget er gyldigt i 10 minutter. Tilbydes, når `GET /info` angiver `sso.googleWeb: true`.

        `authUrl` indeholder websitets `client_id` og `redirect_uri=GOOGLE_WEB_REDIRECT_URI` med de samme øvrige parametre som for spillet. Siden kontrollerer den, før den navigerer til den (se **På et website** i afsnittets beskrivelse).

        **Grænse:** `sso_start`, delt med spillets start.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: Forsøget.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: en manglende eller fejlformateret `codeChallenge` eller et hvilket som helst andet felt (inklusive `redirectPort`).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: Google-login tilbydes ikke på denne server eller ikke til websites.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: grænsen `sso_start` (delt med spillets start).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databasen forblev låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Giv Googles svar videre til serveren
      description: |-
        Giver serveren den `code` og `state`, som Google sendte til spillets listener eller til websitets side, sammen med forsøgets id og PKCE-verifieren. Et forsøgs-id er ubrugeligt uden verifieren, og koden er ubrugelig uden serverens egen PKCE-verifier og klienthemmelighed.

        Serveren kontrollerer forsøget (ukendt, brugt eller udløbet: 410), derefter verifieren (en forkert verifier lader forsøget forblive brugbart), bruger derefter forsøget én gang, kontrollerer `state` og `iss`, udveksler koden med Google og verificerer ID-tokenet. Svaret (200) er et af følgende:

        - `{ token, expiresAt, user }`: logget ind på den tilknyttede konto;
        - `{ mfaRequired, mfaToken, expiresIn }`: fortsæt med `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: en ny konto; fortsæt med `POST /auth/sso/complete` inden for 10 minutter. `suggestedUsername` kommer fra Google-navnet eller adressen og er `""`, når intet passer;
        - `{ needsPassword, linkTicket, username, expiresIn }`: kontoen med den adresse har en adgangskode; fortsæt med `POST /auth/sso/google/link`. Intet er knyttet endnu.

        **Grænse:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: En session, et andet trin eller næste trin i et første Google-login.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Logget ind på den tilknyttede konto
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Totrinsgodkendelse er slået til
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: En ny spiller
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: En konto med adgangskode bruger adressen
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: verifieren passer ikke til forsøgets challenge (forsøget forbliver brugbart). `sso_email_unverified`: Google har ikke bekræftet adressen. `registration_closed`. `account_disabled`. Kun for en tilknyttet konto: `banned` (med `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: Google-login tilbydes ikke på denne server.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: en aktiv konto uden adgangskode bruger adressen (den navngives ikke).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: et ukendt, brugt eller udløbet forsøg.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: grænsen `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databasen forblev låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Knyt Google til en eksisterende konto med dens adgangskode
      description: |-
        Efter at `finish` har svaret `needsPassword`: knytter Google til den eksisterende konto med den kontos adgangskode, indtastet i spillet. Svaret (200) er en session (tilknytningen er gemt, og spilleren er logget ind) eller, når totrinsgodkendelse er slået til, `{ mfaRequired, mfaToken, expiresIn }`: fortsæt med `POST /auth/login/mfa`, og tilknytningen gemmes først, når en kode godkendes der.

        En forkert adgangskode lader billetten forblive brugbar, i alt 5 forsøg. Et forsøg bruges lige før adgangskoden kontrolleres: en 429 `too_many_attempts` eller en 428 `pow_required` bruger intet forsøg, mens en afvisning fra hashkøen for adgangskoder (503 `server_busy`, 429 `rate_limited`) har brugt et og tæller som et mislykket forsøg for kontoen. Ventetiden efter mislykkede forsøg bruger samme tæller som `POST /auth/login`.

        **Grænse:** `auth` (med optællingen pr. IPv6-/48-net). **Proof of work:** som for `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: En session eller andet trin i login.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: en forkert adgangskode; billetten bevares, til i alt 5 forsøg.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (med `until`), kun efter en korrekt adgangskode.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: Google-login tilbydes ikke på denne server.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: Google-kontoen er i mellemtiden blevet knyttet til en anden konto.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: en ukendt, brugt eller udløbet billet, den 5. forkerte adgangskode, en konto, hvis status eller adresse er ændret siden `finish`, eller en konto, hvis status, adresse, adgangskode eller totrinsgodkendelse blev ændret, mens tilknytningen blev gemt. Start login forfra.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (kontoens ventetid efter mislykkede forsøg) eller `rate_limited` (grænsen `auth`, hashkøen for adgangskoder).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: hashkøen for adgangskoder, eller databasen forblev låst (`retryAfter: 1`, intet blev tilknyttet). `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Opret kontoen ved et første Google-login
      description: |-
        Efter at `finish` har svaret `needsUsername`: opretter kontoen med det valgte brugernavn (reglerne for registrering gælder) og logger den ind. Kontoen har ingen adgangskode: `hasPassword` er `false`, og »Glemt adgangskode?« (`POST /auth/password/forgot`) giver den en.

        **Grænse:** `auth` (med dens optælling pr. IPv6-/48-net).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Kontoen er oprettet og logget ind.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: Google-login tilbydes ikke på denne server.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (en konto har brugernavnet, eller en ventende registrering med en anden adresse reserverer det), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: en ukendt, brugt eller udløbet billet.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: grænsen `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databasen forblev låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Vis de indloggede enheder
      description: |-
        Kontoens aktive sessioner (indloggede enheder), den senest brugte først. `current` markerer den session, der foretager anmodningen. `lastSeenAt` opdateres højst hvert 5. minut (senere, mens serveren er langt bagud); `expiresAt` er det absolutte udløbstidspunkt, og inaktivitetsgrænsen kan afslutte sessionen tidligere.

        **Grænse:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: De aktive sessioner.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: grænsen `sessions` eller kontobudgettet.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databasen forblev låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Log én enhed ud
      description: |-
        Logger én af kontoens sessioner ud; også den aktuelle kan logges ud. Den WebSocket, der blev åbnet med den, lukkes. Ingen body (eller `{}`).

        **Grænse:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Sessionen er logget ud.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
