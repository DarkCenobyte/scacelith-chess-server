          description: '`busy` (databasen forblev låst; `retryAfter: 1` i bodyen, ingen `Retry-After`-header), `server_busy` (sessionsopslaget fandt databasen låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /games/{id}:
