openapi: 3.1.1
info:
  title: Scacelith-serverens HTTPS-API
  version: "1.1.0"
  summary: HTTPS-API'en for alle Scacelith-servere, både den officielle server og fællesskabsservere.
  description: |-
    Alle Scacelith-servere, den officielle `caissa.scacelith.com` og enhver fællesskabsserver, udstiller denne HTTPS-API. Spillet bruger den til alt uden for selve partiet: registrering og login (inklusive totrinsgodkendelse og Google), kontosiden, partihistorikken, PGN-downloads og animerede GIF'er af partier, indloggede enheder, download af data, sletning af kontoen og anmeldelser.

    Spil i realtid (søgning efter modstander, udfordringer, træk, ure) foregår via samme servers WebSocket (`wss://<host>/ws`), som åbnes med et sessionstoken fra denne API; det er beskrevet i `PROTOCOL.md`, ikke her.

    Standardværdierne nedenfor er dem, en server med uændret konfiguration har; en fællesskabsserver kan ændre dem (`CONFIG.md` nævner hver indstilling).

    ## Basis-URL, port og transport

    - Officiel server: `https://caissa.scacelith.com/api/v1`, TCP-port 443.
    - En fællesskabsserver: `https://<SERVER_PUBLIC_HOST>[:<port>]/api/v1`. `API_PORT` er 443 som standard; bag en NAT eller en proxy er den port, spillerne bruger, `PUBLIC_API_PORT`.
    - Spillets WebSocket ligger som standard på samme port (`WS_PORT` flytter den; `GET /info` fortæller klienten, hvor den er).
    - HTTP/1.1 over TLS. Med `TLS_MODE=proxy` terminerer en reverse proxy foran serveren TLS. `TLS_MODE=off` (ukrypteret HTTP) er kun til lokal udvikling.
    - De HTML-sider, der åbnes fra links i e-mails (`/verify-email`, `/reset-password`, `/confirm-email-change`), ligger i serverens rod, uden for `/api/v1`. Endpointene til tilstandstjek svarer både i roden og under `/api/v1`. Google-login har ingen side på serveren: Google sender browseren tilbage til selve spillet, på `127.0.0.1`, eller til en side på det website, der startede det (`GOOGLE_WEB_REDIRECT_URI`).
    - En afsluttende skråstreg ignoreres (`/api/v1/info/` er `/api/v1/info`), og stiparametre URL-dekodes (en parameter, der ikke er gyldig URL-kodning, giver svaret 400 `invalid_request`).

    ## Anmodninger

    - **JSON-bodies.** `POST`-, `PUT`- og `DELETE`-anmodninger indeholder et JSON-objekt med `Content-Type: application/json`. Et andet `charset` end UTF-8 afvises, og det samme gør enhver anden indholdstype (415 `unsupported_media_type`). En tom body tæller som `{}`, og det er netop det, endpoints uden parametre tager imod (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`).
    - **Størrelse og tid.** En body er begrænset til `HTTP_BODY_LIMIT` byte (16.384 som standard; `POST /gif` har sin egen grænse på 135.168 byte): 413 `payload_too_large`. Den skal ankomme inden for 10 sekunder: 408 `request_timeout`. Efter hver af disse fejl lukker serveren forbindelsen.
    - **Strikse skemaer.** Et felt, som endpointet ikke kender, afvises, et felt, der ikke er markeret som valgfrit, er påkrævet, og typer og længder kontrolleres. Enhver af disse fejl giver svaret 400 `invalid_request`, hvor `field` angiver feltet (med punktummer for et indlejret felt, fx `pow.nonce`). Strenge må ikke indeholde kontroltegn. Længder tælles i UTF-16-kodeenheder, så et tegn uden for Basic Multilingual Plane (en emoji) tæller dobbelt. En body, der ikke er JSON, giver svaret 400 `invalid_json`. `POST /gif` og `POST /reports` kontrollerer selv deres bodies (se de enkelte endpoints).
    - **Query-strenge.** Den første forekomst af en parameter gælder, ukendte parametre ignoreres, og et `+` dekodes til et mellemrum: de endpoints, der tager en betænkningstidskategori, accepterer både `3%2B2` og `3+2`.
    - **Metoder.** `HEAD` er `GET` uden body. `OPTIONS` på en eksisterende sti giver svaret 204 med en `Allow`-header (og headerne fra en CORS-preflight, se nedenfor). Enhver anden metode, som stien ikke har, giver svaret 405 `method_not_allowed` med `Allow`.
    - **Anmodningsmål.** Det må ikke overstige 4096 tegn (414 `uri_too_long`). En anmodning, der slet ikke kan parses, eller hvis hoved er for stort eller ankommer for langsomt, får et tomt svar med 400, 431 eller 408, og forbindelsen lukkes.
    - **CORS: en tilladelsesliste, slået fra som standard.** API'en betjener spillet, som ikke sender nogen `Origin`. Når `CORS_ORIGINS` er tom (standard), sendes der aldrig nogen `Access-Control-*`-header, så ingen webside kan læse et svar. `CORS_ORIGINS` angiver de weboprindelser, hvis sider må kalde API'en fra en browser, hver nøjagtigt som browsere sender den i `Origin`: `https://host` eller `https://host:port`, med små bogstaver, uden sti, afsluttende skråstreg eller standardport; `http://` kun for `localhost`, `127.0.0.1` og `[::1]` (lokal udvikling); intet jokertegn. Den officielle server sætter `CORS_ORIGINS=https://scacelith.com,https://www.scacelith.com` for sit website. Så gælder:
      - Ethvert svar for en sti under `/api/v1`, bortset fra endpointene til tilstandstjek, ved succes såvel som ved fejl (inklusive 429 fra laget pr. adresse), indeholder `Vary: Origin`. Når anmodningens `Origin` byte for byte er en af de angivne oprindelser, indeholder det også `Access-Control-Allow-Origin: <that origin>` og, undtagen i svaret på en preflight-anmodning, `Access-Control-Expose-Headers: Retry-After, Content-Disposition`, så siden kan læse fejlkoderne, `Retry-After` og filnavnene på PGN- og GIF-downloads.
      - En preflight-anmodning (`OPTIONS` med `Access-Control-Request-Method`) fra en angivet oprindelse på en eksisterende sti får svaret 204, uden body, med `Allow`, `Access-Control-Allow-Origin`, `Access-Control-Allow-Methods` (metoderne fra `Allow`), `Access-Control-Allow-Headers: Authorization, Content-Type`, `Access-Control-Max-Age: 600` og `Vary: Origin`. Den kræver intet token og tæller hverken mod noget kontobudget eller nogen endpointgrænse; som enhver anden anmodning tager den et token fra laget pr. adresse. En browser genbruger en preflight-anmodning i 10 minutter, men kun for præcis den URL, inklusive query-strengen. En anmodning uden `Authorization` og uden JSON-body, fx `GET /info` eller `GET /leaderboard`, kræver ingen preflight-anmodning.
      - Ethvert andet svar på en preflight-anmodning er en mislykket preflight, også med CORS-headerne: en 404 for en sti, der ikke findes, eller 429 fra laget pr. adresse. Browseren sender så ikke anmodningen, og siden ser en netværksfejl uden svaret og dets `Retry-After`.
      - `Access-Control-Allow-Credentials` sendes aldrig, og det gør `Access-Control-Allow-Origin: *` heller ikke: en side sender sit sessionstoken i `Authorization: Bearer`, ligesom spillet gør, og API'en sætter ingen cookie. HTML-siderne, endpointene til tilstandstjek og de tomme svar på ulæselige anmodninger har ingen CORS-header. WebSocket bruger ikke CORS: `WS_ALLOWED_ORIGINS` angiver de sider, der må åbne den.
      - En side fra en oprindelse, der ikke er angivet, kan intet læse, og dens skrivende anmodninger på tværs af sites sendes aldrig: JSON-bodies og `Authorization` kræver en preflight-anmodning, hvis svar ikke har nogen `Access-Control-Allow-Origin` for den oprindelse. `Cross-Origin-Resource-Policy: same-origin` forbliver på alle svar: den gælder kun for `no-cors`-anmodninger (et andet site, der indlejrer et svar), aldrig for `cors`-anmodninger fra en angivet side.

    ## Svar og fejl

    - Svar er JSON i UTF-8, undtagen PGN-download (`application/x-chess-pgn`), de animerede GIF'er (`image/gif`) og HTML-siderne. Tidspunkter er millisekunder siden 1970-01-01 UTC. Id'er er heltal. Parti-id'er har op til 16 cifre, men holder sig under 2^53, så et JSON-tal (en double) kan rumme dem nøjagtigt.
    - Alle API'ens svar indeholder `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`, `X-Frame-Options: DENY`, `Cross-Origin-Resource-Policy: same-origin` og `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'` (HTML-siderne har deres egen politik). Med `TLS_MODE=native` indeholder de også `Strict-Transport-Security: max-age=31536000`. De svar, som listeneren selv skriver, før API'en (`GET` og `HEAD` på endpointene til tilstandstjek, 429 fra laget pr. adresse og en 500 `internal_error`, når API'en fejler fuldstændigt), har de samme headers undtagen `Cross-Origin-Resource-Policy`, og deres `Content-Type` er `application/json` uden charset.
    - Et svar skal læses inden for 60 sekunder fra det øjeblik, serveren har det klar, hvilket kun har betydning for de store (en GIF, dataeksporten, en lang PGN). Den tid, serveren bruger på at forberede et svar, tæller hverken med i dette eller i de 30 sekunder uden en byte ind eller ud, hvorefter en forbindelse lukkes.

    Fejl har én form (skemaet `Error`):

    ```json
    { "error": "snake_case_code", "message": "An English sentence.", "retryAfter": 30 }
    ```

    `message` er beregnet til logs og som reserve; en klient vælger ud fra `error`, hvad der skal vises. `retryAfter` (sekunder) findes kun ved afvisninger, der ophører med tiden, og svaret indeholder så også en `Retry-After`-header med samme værdi; den eneste undtagelse er 503 `busy` ved læsning af historik, partier, spillere og rangliste, som kun har feltet. Nogle fejl tilføjer felter: `field` (ugyldigt input), `reason` (`weak_password`, `pow_required`), `pow` (`pow_required`), `until` (`banned`), `line` og `column` (`invalid_pgn`).

    Fejl, som ethvert endpoint kan give:

    | Status | `error` | Hvornår |
    |---|---|---|
    | 400 | `invalid_request` | Bodyen bryder endpointets skema (`field` angiver hvor), anmodningsmålet eller `Content-Length` er fejlformateret, en stiparameter er ikke gyldig URL-kodning, eller bodyen blev afkortet. |
    | 400 | `invalid_json` | Bodyen er ikke JSON. |
    | 401 | `unauthorized` | Ingen `Authorization`-header på et endpoint, der kræver en session. |
    | 401 | `invalid_token` | Tokenet er fejlformateret, udløbet, tilbagekaldt eller tilhører en slettet konto; også på endpoints, hvor sessionen er valgfri. |
    | 404 | `not_found` | Endpointet findes ikke. Nogle endpoints bruger den også: partiet, spilleren eller sessionen findes ikke. |
    | 405 | `method_not_allowed` | Stien findes for andre metoder (se `Allow`). |
    | 408 | `request_timeout` | Bodyen ankom ikke inden for 10 sekunder. |
    | 413 | `payload_too_large` | Bodyen overstiger `HTTP_BODY_LIMIT` (135.168 byte for `POST /gif`). |
    | 414 | `uri_too_long` | Anmodningsmålet overstiger 4096 tegn. |
    | 415 | `unsupported_media_type` | Bodyen er ikke `application/json`, eller dens charset er ikke UTF-8. |
    | 429 | `rate_limited` | En hastighedsgrænse (se nedenfor): `retryAfter` plus en `Retry-After`-header. |
    | 500 | `internal_error` | En uventet fejl. Serveren logger den. |
    | 503 | `timeout` | Serveren svarede ikke inden for 30 sekunder (60 sekunder for eksporten, 45 sekunder for GIF'erne med standardindstillingerne). |
    | 503 | `server_busy` | Et sessionsopslag eller en kontoændring fandt databasen låst (`retryAfter` 1), eller hashkøen for adgangskoder er fuld (se nedenfor). Også, med en `retryAfter` på 2 til 5, når serveren er langt bagud: for en `POST`, `PUT`, `PATCH` eller `DELETE` har databasen for mange ventende skrivninger; for enhver anmodning kører for mange tidligere anmodninger stadig ud over deres timeout, eller sessionstokenet kunne ikke kontrolleres inden for 5 sekunder. Anmodningen blev ikke udført, og dens hastighedsgrænser tog intet. |

    Læse-endpointene (partihistorik, partier, spillere, rangliste) og eksporten svarer 503 `busy` med `retryAfter: 1`, når databasen forblev låst.

    Endpoints, der kontrollerer eller hasher en adgangskode, kan også svare med en af disse, begge med en tilfældig `retryAfter` på 5 til 15 sekunder:

    - 503 `server_busy`: serverens hashkø for adgangskoder (`PASSWORD_HASH_QUEUE_MAX`) er fuld, eller ventetiden udløb.
    - 429 `rate_limited`: køen er mindst halvt fuld, og denne klient (en IPv4-adresse eller et IPv6-/48-net) har allerede `PASSWORD_HASH_WAITERS_PER_SOURCE` hashes i kø. Denne 429 giver de tokens til hastighedsgrænserne tilbage, som anmodningen tog.

    Intet blev ændret, og intet mislykket forsøg blev talt med (undtagen på `POST /auth/sso/google/link`, hvor forsøget på billetten og kontoens mislykkede forsøg blev registreret før hashingen), og et nulstillingslink forbliver gyldigt.

    HTML-siderne returnerer deres fejl som HTML-sider med de samme statuskoder.

    ## Godkendelse

    De endpoints, der kræver en session, tager et bearer-token i `Authorization`-headeren (skemaet `bearerAuth`):

    ```
    Authorization: Bearer sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
    ```

    - **Sådan fås et token.** Et token (`sct_` efterfulgt af 43 base64url-tegn) kommer fra `POST /auth/login`, derefter `POST /auth/login/mfa`, når totrinsgodkendelse er slået til, fra `POST /auth/sso/google/finish` og `POST /auth/sso/google/link` (Google-login) og fra `POST /auth/sso/complete`. Hver af dem svarer `{ token, expiresAt, user }`. Serveren gemmer kun en SHA-256 af tokenet.
    - **Påkrævet session.** En manglende header giver svaret 401 `unauthorized` med `WWW-Authenticate: Bearer realm="scacelith"`. Et ugyldigt token giver svaret 401 `invalid_token` med `WWW-Authenticate: Bearer realm="scacelith", error="invalid_token"`. En klient bør glemme et token, der får `invalid_token`, og logge ind igen.
    - **Valgfri session.** På `GET /games/{id}`, `GET /games/{id}/pgn`, `GET /players/{username}` og `GET /players/{username}/games` er sessionen valgfri. Uden headeren svarer de med den offentlige visning; hvis der sendes en header, skal dens token være gyldigt.
    - **Optaget lager.** Når databasen forbliver låst, mens et token kontrolleres, svarer et endpoint, der kræver eller accepterer en session, 503 `server_busy` med `retryAfter: 1` (og `Retry-After`); når kontrollen tager mere end 5 sekunder, svarer det 503 `server_busy` med en `retryAfter` på 2 til 5. I begge tilfælde blev tokenet ikke bedømt: behold det, og send anmodningen igen.
    - **Levetid.** En session slutter ved det første af `SESSION_MAX_DAYS` (90) dage efter login (det er `expiresAt`) og `SESSION_IDLE_DAYS` (30) dage uden brug. Hver brug udskyder inaktivitetsgrænsen; serveren skriver den nye værdi højst hvert 5. minut, i baggrunden. Mens dens database har mange ventende skrivninger, udskyder den denne skrivning til en senere anmodning, undtagen inden for den sidste time før inaktivitetsgrænsen, så en session i brug ikke udløber. En konto beholder højst `MAX_SESSIONS_PER_USER` (10) sessioner: et nyt login tilbagekalder de ældste ud over dette antal.
    - **Tilbagekaldelse.** At logge ud (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`) tilbagekalder sessioner; det samme gør et skift af adgangskode (de andre sessioner), en nulstilling af adgangskoden og sletning af kontoen (alle sessioner) samt en administrator. En tilbagekaldelse via API'en træder i kraft med det samme, og den WebSocket, der blev åbnet med en tilbagekaldt session, lukkes. Et skift eller en nulstilling af adgangskoden og sletning af kontoen tilbagekalder i samme transaktion som selve ændringen: når en af dem mislykkes, er ingen session blevet tilbagekaldt, og intet andet er heller ændret. Serveren cacher sessionsopslag i 30 sekunder, så en tilbagekaldelse via admin-kommandoen, en separat proces, træder i kraft inden for 30 sekunder.
    - **Omfang.** Et token hører til én server og åbner også dens WebSocket. Send det aldrig til en anden server.

    ## Hastighedsgrænser og anden drosling

    Grænser gælder for et af to omfang. **Klient:** en IPv4-adresse eller et IPv6-/64-net (i proxytilstand kommer adressen fra `X-Forwarded-For`, sendt af en `TRUSTED_PROXIES`-adresse); nogle grænser tæller også hvert IPv6-/48-net som helhed, oven i hvert af dets /64-net. **Spiller:** den indloggede konto, uanset dens adresse; en grænse, der tælles pr. spiller på et endpoint, hvor sessionen er valgfri, tælles pr. klient for en anmodning uden token.

    Hver grænse er en token bucket, der rummer `limit` anmodninger og fyldes løbende op med `limit / window`; `retryAfter` er tiden indtil næste token. Grænser markeret som *delt* tælles desuden over et glidende vindue af samme længde, så intet vindue indeholder meget mere end `limit` anmodninger. Hver grænse tælles for hele serveren. Når en af et endpoints grænser afviser en anmodning, gives de tokens tilbage, som dets andre grænser tog for den anmodning. En afvisning giver svaret 429 `rate_limited` med `retryAfter` og `Retry-After`.

    - **Laget pr. adresse.** Hver anmodning (enhver sti og metode, inklusive endpointene til tilstandstjek og WebSocket-upgrades) tager først ét token fra sin klients budget: `HTTP_RATE_PER_IP` (600) pr. minut med et burst på et halvt minut og `HTTP_RATE_PER_PREFIX` (4 x `HTTP_RATE_PER_IP`) for et IPv6-/48-net. En klient må desuden højst have `IP_MAX_INFLIGHT` (32 x `WORKERS`) anmodninger i gang (`retryAfter` 1 derudover). En klient, der fortsætter efter sine afvisninger, blokeres: `ABUSE_BLOCK_REFUSALS_PER_MIN` (600) afvisninger på ét minut blokerer den i 1 minut, derefter i 4, 16 og 60 minutter ved hver ny blokering inden for 6 timer. En afvisning fra grænserne `auth`, `auth_*` og `reauth` tæller 5; grænser, der tælles pr. spiller, tæller aldrig. Adresser i `ABUSE_EXEMPT` springer dette lag over, men ikke kontobudgettet eller endpointgrænserne.
    - **Kontobudget.** Hver anmodning med et gyldigt sessionstoken tæller også mod sin konto: `USER_RATE_PER_MIN` (120) pr. minut for alle endpoints tilsammen, uanset adressen, med et burst på et halvt minut.
    - **Endpointgrænser:**

    | Grænse | Standard | Tælles pr. | Endpoints |
    |---|---|---|---|
    | `auth` | `AUTH_RATE_PER_IP` (20) / 10 min, delt | klient og `AUTH_RATE_PER_PREFIX` (5 x `AUTH_RATE_PER_IP`) pr. IPv6-/48-net | `POST /auth/register`, `/auth/login`, `/auth/login/mfa`, `/auth/verify-email/resend`, `/auth/password/forgot`, `/auth/password/reset`, `/auth/sso/google/link`, `/auth/sso/complete`; `POST /verify-email`, `/reset-password`, `/confirm-email-change` |
    | `auth_register` | `AUTH_REGISTER_PER_HOUR` (10) / time, delt | klient, 3 gange så mange pr. IPv6-/48-net | `POST /auth/register` |
    | `auth_mail` | `AUTH_MAIL_PER_HOUR` (10) / time, delt | klient, 3 gange så mange pr. IPv6-/48-net | `POST /auth/verify-email/resend` |
    | `auth_forgot` | `AUTH_FORGOT_PER_HOUR` (3) / time, delt | klient, 3 gange så mange pr. IPv6-/48-net | `POST /auth/password/forgot` |
    | `auth_forgot_day` | `AUTH_FORGOT_PER_DAY` (10) / 24 timer, delt | klient, 3 gange så mange pr. IPv6-/48-net | `POST /auth/password/forgot` |
    | `auth_reset` | `AUTH_RESET_PER_HOUR` (10) / time, delt | klient, 3 gange så mange pr. IPv6-/48-net | `POST /auth/password/reset`, `POST /reset-password` |
    | `reauth` | samme tal som `auth`, sin egen bucket, delt | klient og IPv6-/48-net | `POST /account/password`, `/account/mfa/totp/setup`, `/account/mfa/totp/enable`, `/account/mfa/totp/disable`, `/account/mfa/recovery-codes`, `/account/email`, `/account/export`, `/account/delete` |
    | `reauth_user` | `AUTH_REAUTH_PER_USER` (10) / 10 min, delt | spiller | de samme endpoints som `reauth` |
    | `account` | 60 / min | spiller | `GET /account/me`, `PUT /account/preferences` |
    | `account_games` | 60 / min | spiller | `GET /account/games` |
    | `account_export` | 5 / time, delt | spiller | `POST /account/export` (kontrolleres før `reauth`; hvert forsøg tæller) |
    | `sessions` | 60 / min | spiller | `POST /auth/logout`, `/auth/logout-all`, `GET /auth/sessions`, `DELETE /auth/sessions/{id}` |
    | `public_read` | 60 / min | spiller (klient uden token) | `GET /players/{username}`, `/players/{username}/games`, `/games/{id}`, `/games/{id}/pgn` (én bucket for alle fire) |
    | `gif` | 30 / min | spiller | `GET /games/{id}/gif`, `POST /gif` (én bucket for begge) |
    | `gif_user_min`, `gif_user_hour` | `GIF_USER_RENDERS_PER_MIN` (4) / min og `GIF_USER_RENDERS_PER_HOUR` (30) / time, delt | spiller | de samme to, kun når GIF'en skal laves (ikke fra cachen) |
    | `gif_ip_min`, `gif_ip_hour` | `GIF_IP_RENDERS_PER_MIN` (12) / min og `GIF_IP_RENDERS_PER_HOUR` (120) / time, delt | klient (alle dens konti tilsammen), 3 gange så mange pr. IPv6-/48-net | de samme, som ovenfor |
    | `reports` | 30 / time | spiller | `POST /reports` |
    | `sso_start` | 30 / 10 min, delt | klient og 90 pr. IPv6-/48-net | `POST /auth/sso/google/start`, `POST /auth/sso/google/web/start` (tilsammen) |
    | `sso_finish` | 30 / min | klient | `POST /auth/sso/google/finish` |
    | `page` | 60 / min | klient | `GET /verify-email`, `/reset-password`, `/confirm-email-change` |

    `GET /info` og `GET /leaderboard` har ingen egen grænse: kun laget pr. adresse. Et endpoint med flere grænser kontrollerer dem i den rækkefølge, der er angivet i dets beskrivelse.

    Serveren behandler en anmodning i denne rækkefølge: laget pr. adresse, derefter endpointene til tilstandstjek; match af endpoint; kontrollerne af, at serveren ikke er langt bagud (503 `server_busy`): for mange tidligere anmodninger, der stadig kører ud over deres timeout, og, for en `POST`, `PUT`, `PATCH` eller `DELETE`, databasens kø af skrivninger; godkendelse, inden for 5 sekunder (503 `server_busy` derudover); kontobudgettet, når anmodningen har en session; endpointets grænser; bodyen; selve endpointet (GIF-endpointene tager kun deres renderingsgrænser, når de har en GIF at lave). En anmodning, der afvises på grund af sit token, bruger altså ingen af endpointets tokens, mens en anmodning med en ugyldig body bruger dem.

    Anden drosling, som endpointene selv besvarer:

    - **Mislykkede loginforsøg på ét loginnavn** (brugernavn eller e-mail): fra og med `AUTH_FAILURES_PER_ACCOUNT` (5) mislykkede forsøg skal hvert forsøg vente dobbelt så længe som det foregående (2 s, 4 s osv., op til 15 minutter): 429 `too_many_attempts` med `retryAfter`. Tælleren nulstilles efter en time uden mislykkede forsøg.
    - **Forkerte koder til anden faktor ved login:** samme regel fra og med kontoens 5. forkerte kode. Ét logintrin accepterer højst 5 forkerte koder.
    - **Koder til anden faktor for én konto:** højst `AUTH_MFA_PER_ACCOUNT` (10) koder (koder fra godkendelsesappen eller gendannelseskoder, rigtige eller forkerte) pr. 15 minutter, fra enhver adresse, ved login og ved fornyet godkendelse; derudover 429 `too_many_attempts`, før koden kontrolleres, så en gendannelseskode ikke bruges op.
    - **Mislykkede fornyede godkendelser for en konto** (forkert adgangskode eller kode): samme regel (429 `too_many_attempts`), fælles for alle endpoints, der kræver fornyet godkendelse.
    - **E-mails:** én bekræftelses- eller nulstillingsmail pr. adresse hvert 5. minut (svaret forbliver det samme); én meddelelse af typen »nogen har forsøgt at bruge din adresse« pr. adresse pr. time.
    - **Anmeldelser:** `REPORTS_PER_DAY` (5) pr. spiller i løbet af 24 timer: 429 `report_limit`.

    ## Proof of work

    `POST /auth/register` kræver altid et proof of work, når `POW_REGISTER_BITS` er over 0 (18 som standard; `GET /info` angiver det som `pow.register`). `POST /auth/login` og `POST /auth/sso/google/link` (én slags challenge for begge) kræver kun et i 5 minutter, efter at serveren har set en bølge af mislykkede loginforsøg (`POW_LOGIN_TRIGGER_PER_MIN`, derefter `POW_LOGIN_BITS`); en klient finder ud af det via svaret.

    1. Anmodningen uden bevis (eller med et afvist bevis) giver svaret 428 `pow_required` med `reason` og en `pow`-challenge `{ challenge, bits, expiresAt }`.
    2. Find en nonce: en decimal streng på højst 20 cifre, så `SHA-256(challenge + ":" + nonce)` starter med `bits` nulbit (den mest betydende bit i den første byte først). 18 bit kræver i gennemsnit omkring 260.000 hashes.
    3. Send den samme anmodning igen med `"pow": { "challenge": "...", "nonce": "123456" }` i bodyen.

    En challenge er gyldig i 2 minutter og kun én gang, for ét endpoint og ét klientnetværk (en IPv4-adresse eller et IPv6-/64-net). Den er signeret, så serveren gemmer intet om den, før den kommer tilbage. `reason` angiver, hvorfor et bevis blev afvist: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` eller `replayed`.

    ## Fornyet godkendelse

    Kontoændringer beder om adgangskoden igen og, når totrinsgodkendelse er slået til, om en anden faktor:

    - kun adgangskoden: `POST /account/password` og `POST /account/mfa/totp/setup`;
    - adgangskoden og en kode fra godkendelsesappen, idet en gendannelseskode afvises: `POST /account/mfa/recovery-codes`;
    - adgangskoden og en kode fra godkendelsesappen eller en gendannelseskode: `POST /account/mfa/totp/disable`, `POST /account/email`, `POST /account/export` og `POST /account/delete`.

    I bodies indeholder `code` en 6-cifret kode fra godkendelsesappen og `recoveryCode` en gendannelseskode (`xxxx-xxxx-xx`; store og små bogstaver, mellemrum og bindestreger er ligegyldige). En gendannelseskode må også sendes i `code`, hvor gendannelseskoder accepteres. Hver kode virker én gang: en brugt kode fra godkendelsesappen afvises indtil næste 30-sekunders trin, og en gendannelseskode er væk, når den er brugt.

    | Status | `error` | Hvornår |
    |---|---|---|
    | 403 | `invalid_password` | Forkert adgangskode, eller adgangskoden blev nulstillet eller skiftet, mens anmodningen kørte (intet blev ændret). |
    | 403 | `mfa_code_required` | Totrinsgodkendelse er slået til, og hverken `code` eller `recoveryCode` blev sendt. |
    | 403 | `invalid_code` | Forkert eller allerede brugt kode. |
    | 400 | `password_not_set` | En konto, der kun bruger Google, har endnu ingen adgangskode (»Glemt adgangskode?« opretter en). |
    | 429 | `too_many_attempts` | For mange mislykkede forsøg eller for mange afprøvede koder på denne konto. |
    | 503 / 429 | `server_busy` / `rate_limited` | Hashkøen for adgangskoder er optaget. |

    Forkerte adgangskoder og koder tæller med i kontoens tæller over mislykkede forsøg og registreres som sikkerhedshændelser.

    ## Metrikport

    Ud over API-porten svarer serveren med ukrypteret HTTP på metrikporten (`METRICS_PORT`, 9464, bundet til `METRICS_BIND`, 127.0.0.1 som standard; hold den privat). Den er ikke en del af denne API: `GET /healthz` svarer `ok`; `GET /readyz` svarer `ready`, når opstarten er fuldført (hver shard har afspillet sin journal igen, og listenerne er bundet), og indtil nedlukningen begynder, ellers 503 `not ready`; `GET /metrics` leverer Prometheus-metrikkerne og kræver, når `METRICS_TOKEN` er sat, `Authorization: Bearer <token>` med netop det token.
