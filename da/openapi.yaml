          description: Afslutningen (ms siden Unix-epoken), `null`, når sanktionen er permanent.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Udelukkelsens afslutning (ms siden Unix-epoken), `null`, når den er permanent.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` for at modtage direkte udfordringer via navn, `none` for at afvise dem.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Den nuværende adgangskode.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Den nye adgangskode; reglerne for adgangskoder ved registrering gælder.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Kontoens adgangskode.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: En kode fra den afventende hemmelighed, præcis 6 cifre.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Kontoens adgangskode.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Valgfri; nødvendig med totrinsgodkendelse (eller `recoveryCode`). En kode fra godkendelsesappen eller en gendannelseskode.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Valgfri. En gendannelseskode (`xxxx-xxxx-xx`; store og små bogstaver, mellemrum og bindestreger er ligegyldige).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Kontoens adgangskode.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: En kode fra godkendelsesappen (en gendannelseskode afvises).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Den nye adresse; trimmes og konverteres til små bogstaver og kontrolleres derefter som en adresse ved registrering.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Kontoens adgangskode.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Valgfri; nødvendig med totrinsgodkendelse (eller `recoveryCode`). En kode fra godkendelsesappen eller en gendannelseskode.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Valgfri. En gendannelseskode.
    TotpSetup:
      type: object
      description: Den afventende hemmelighed til godkendelsesappen.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Hemmeligheden i base32, til at indtaste i appen.
        uri:
          type: string
          format: uri
          description: "`otpauth://totp/...`-URI'en, til at vise som QR-kode."
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Sekunder pr. trin.
    RecoveryCodeList:
      type: array
      description: De 10 gendannelseskoder, som kun vises denne ene gang. Hver af dem virker én gang.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Den ene side i et parti.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Navnet i partiposten (`deleted#<id>` for en slettet konto).
        rating:
          type:
            - integer
            - 'null'
          description: Ratingen ved start, `null`, når den er ukendt.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Ratingen efter partiet. Et ratet parti har den altid; `null` kun for et parti, der ikke tæller med i ratingerne (uratet, tilpasset, afbrudt).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Ratingændringen, `0`, når ratingreglerne lader ratingen være uændret (FIDE-reglen om nul point, en modstander uden rating, de første partier for en spiller uden rating); `null` som `ratingAfter`.
    GameSummary:
      type: object
      description: Sammendraget af et gemt parti.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Partiets id.
        category:
          type: string
          description: Det officielle kategori-id (`3+2`) eller `custom`.
        rated:
          type: boolean
          description: Om partiet tæller med i ratingerne.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Betænkningstiden i sekunder (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (se partikoderne).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Koden for slutårsagen (se partikoderne).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Resultatet, `*` for et afbrudt parti.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Antallet af halvtræk.
        startedAt:
          type: integer
          format: int64
          description: Starten (ms siden Unix-epoken).
        endedAt:
          type: integer
          format: int64
          description: Afslutningen (ms siden Unix-epoken).
    Termination:
      type: string
      description: Navnet på slutårsagen (se partikoderne); `Unknown` for en kode, som protokollen ikke kender.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Et partisammendrag set fra én spillers side.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Spillerens side.
    HistoryGameSummary:
      description: Et parti i den indloggede spillers historik.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Grundtiden i millisekunder.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Tillægget i millisekunder.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: Udfaldet set fra spillerens side.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Sidens partier, nyeste først.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Det id, der skal sendes som `before` for at få den næste side, eller `null` på den sidste side.
        total:
          type: integer
          minimum: 0
          description: Antallet af partier, der matcher filteret, på tværs af alle sider.
    MoveRecord:
      type: object
      description: Ét halvtræk i et parti.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: Trækket i UCI-notation, med `n`, `b`, `r` eller `q` tilføjet ved en forvandling.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Den tid, der blev fratrukket for trækket (ms), `null`, når posten ikke har den.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Den trækkende spillers ur efter trækket (ms), `null`, når posten ikke har det.
    PgnTagsView:
      type: object
      description: De vigtigste PGN-tags, til visning. `Termination` er her navnet på slutårsagen; PGN-filen bruger PGN-standardens værdier.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` eller `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: Startdatoen i UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Ratingen ved start eller `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Ratingen ved start eller `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: En partipost med dens træk og ure. Den har felterne fra et partisammendrag, uden `color` og `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Grundtiden i millisekunder.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Tillægget i millisekunder.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: Navnet på `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: Id'et for det parti, som dette er en revanche for, eller `null`.
            moves:
              type: array
              description: Ét element pr. halvtræk.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Kun når tokenets spiller spillede dette parti; vedkommendes side.
            reportable:
              type: boolean
              description: Kun når tokenets spiller spillede dette parti; `true`, når `POST /reports` lige nu ville modtage en anmeldelse af modstanderen for dette parti (partiet sluttede inden for 7 dage, den daglige kvote er ikke brugt op, og modstanderen er ikke allerede anmeldt for dette parti).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Brugernavnet, som spilleren skrev det.
        createdAt:
          type: integer
          format: int64
          description: Hvornår kontoen blev oprettet (ms siden Unix-epoken).
        ratings:
          type: array
          description: Kun de officielle kategorier, i serverens rækkefølge.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Alle gemte partier, også uratede og afbrudte.
            rated:
              type: integer
              minimum: 0
              description: Ratede partier, summeret over ratingposterne.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Brugernavnet, som spilleren skrev det.
        games:
          type: array
          description: Sidens partier, nyeste først.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Det sidste partis id, hver gang siden er fuld (den næste side kan så være tom), ellers `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: Kategoriens id.
        minGames:
          type: integer
          minimum: 0
          description: Det antal talte partier, en post skal have for at komme på listen (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Hvornår ranglisten blev beregnet (ms siden Unix-epoken).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: PGN-teksten, højst 65.536 byte UTF-8. Kun det første parti bruges.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Valgfri. Billedstørrelsen.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Valgfri. Den side, der er nederst på brættet.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Valgfri. Millisekunder pr. træk, et JSON-tal med en heltalsværdi.
        coords:
          type: boolean
          default: true
          description: Valgfri. Om linjebogstaverne og rækkenumrene tegnes rundt om brættet.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Partiet, som et heltal eller en streng på 1 til 16 cifre.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Modstanderens brugernavn, som i partiposten eller som det er nu, uden hensyn til store og små bogstaver. Det må ikke være tomt.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Hvad anmeldelsen drejer sig om.
        comment:
          type:
            - string
            - 'null'
          description: Valgfri. Højst 500 tegn, efter at kontroltegn (bortset fra tabulator og linjeskift) er fjernet og teksten er trimmet.
    AccountExport:
      type: object
      description: Alt, hvad serveren gemmer om kontoen (tidspunkter i ms siden Unix-epoken).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Hvornår eksporten blev lavet.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Hvad filen indeholder og udelader, på letforståeligt engelsk til spilleren.
          items:
            type: string
        account:
          description: Kontovisningen fra `GET /account/me`, med `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Adressen på den tilknyttede Google-konto eller `null`.
        ratings:
          type: array
          description: De komplette ratingposter.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Ratingpoint, der er givet tilbage, efter at en modstander blev afsløret i snyd, lagt sammen pr. UTC-døgn og kategori, nyeste først. Hverken partierne eller snyderne nævnes.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Alle gemte sessioner, nyeste først, uden noget token. Oprydningen af opbevarede data sletter en udløbet session, og en session, der er logget ud, en dag efter udlogningen.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Sikkerhedshændelserne, nyeste først, opbevaret i `RETENTION_SECURITY_DAYS` dage.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Alle sanktioner, også ophævede. Moderatorens navn er aldrig med.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: De adfærdshændelser, der er registreret for spillerens forladte og afbrudte partier og dem, hvor spilleren udeblev, opbevaret i 30 dage.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: De anmeldelser, spilleren har indgivet.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Antallet af partier.
            list:
              type: array
              description: Alle partier, nyeste først, som sammendrag fra `GET /account/games`. Trækkene findes på `GET /games/{id}` og PGN'en på `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: En komplet ratingpost.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Om spilleren har forladt fasen uden etableret rating.
            countedGames:
              type: integer
              minimum: 0
              description: De partier, der er indgået i ratingen.
            updatedAt:
              type: integer
              format: int64
              description: Hvornår posten sidst blev ændret.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: Døgnets 00:00 UTC (ms siden Unix-epoken).
        category:
          type: string
        points:
          type: integer
          description: De point, der blev givet tilbage den dag i den kategori.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Hvornår sessionen blev logget ud, eller `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Adressen ved login, slettet efter `RETENTION_IP_DAYS` dage.
    SecurityEvent:
      type: object
      description: |-
        En sikkerhedshændelse. `ip` angives kun for det, der blev gjort som indlogget, med kontoens adgangskode (og anden faktor) eller med et link sendt til dens adresse: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` og `account_exported`; alle andre typer har `ip: null`, og `ip` slettes efter `RETENTION_IP_DAYS` dage.

        `detail` beholder kun disse felter: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` og `method` (`password` eller `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` og `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. En `moderator_action`-hændelse beholder kun `{ action }`, for handlingerne `ban`, `unban`, `reset_mfa`, `verify_email` og `revoke_sessions` (moderatorernes andre handlinger er udeladt). Alle andre typer har `detail: null`. Hændelserne `rating_refund` er udeladt: deres point står i `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Hændelsens type (`login`, `password_changed`...).
        at:
          type: integer
          format: int64
          description: Hvornår den skete.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: Den anmeldte spillers nuværende offentlige navn.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Om anmeldelsen stadig er åben (om den anmeldte spiller blev sanktioneret, oplyses ikke).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: E-mail-linkets token (det skjulte felt i sidens formular).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Nulstillingslinkets token (formularens skjulte felt).
        newPassword:
          type: string
