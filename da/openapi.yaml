  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Download et parti som PGN-fil
      description: |-
        Det samme parti som PGN-fil: ét parti med linjeskift `\n` og træktekst i linjer under 80 kolonner. Svaret er det samme med eller uden token.

        Tags i denne rækkefølge: `Event` (`<SERVER_NAME> rated <category>` eller `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (startdatoen i UTC), `Round`, `White`, `Black`, `Result` (`*` for et afbrudt parti), `UTCDate` og `UTCTime` (starttidspunktet), `WhiteElo` og `BlackElo` (ratingerne ved start eller `-`), `WhiteRatingDiff` og `BlackRatingDiff` (ændringerne, fx `+10` og `-10`, i alle ratede partier, `+0`, når ratingreglerne lader ratingen være uændret; et uratet, tilpasset eller afbrudt parti har ingen af dem), `TimeControl` (i sekunder), `Termination` (en standardværdi i PGN: `normal`; `time forfeit`, et flagfald, også når det ender remis; `abandoned`; `rules infraction`, et andet ulovligt træk eller et tab på grund af fair play; `unterminated`, et afbrudt parti), `PlyCount`, `ScacelithGameId` (det decimale id).

        Hvert træk har `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: den trækkende spillers ur efter trækket og den tid, der blev fratrukket for trækket, i tiendedele sekunder (afkortet). En værdi udelades, når posten mangler den. Efter det sidste træk følger slutårsagen i ord og derefter resultatet.

        **Grænse:** `public_read` (pr. spiller med token, pr. klient uden).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: PGN-filen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'PGN-teksten i UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: ikke et positivt heltal på højst 16 cifre (under 2^53); `invalid_request`: ikke gyldig URL-kodning.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: der blev sendt et token, og det er ikke gyldigt.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: partiet findes ikke.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: grænsen `public_read` eller kontobudgettet.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: blandt andet når de gemte træk ikke kan afspilles frem til den gemte afslutning (serveren logger det).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (databasen forblev låst; `retryAfter: 1` i bodyen, ingen `Retry-After`-header), `server_busy` (sessionsopslaget fandt databasen låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Download et parti fra denne server som animeret GIF
      description: |-
        Partiet som animeret GIF. Navnene og ratingerne er partipostens (ratingerne ved start, en slettet konto som `deleted#<id>`), og det samme gælder resultatet og afslutningen (`Resignation`, `Loss on time`...).

        Kontrollerne sker i denne rækkefølge: `gif_disabled`, billedindstillingerne (`size`, `orientation`, `delay`, `coords`), parti-id'et, partiet, dets længde.

        **Påkrævet session:** kvoterne tælles pr. konto. **Grænser:** `gif` ved hver anmodning; `gif_user_min`, `gif_user_hour`, `gif_ip_min` og `gif_ip_hour` kun når GIF'en skal laves (se afsnittets beskrivelse). **Tidsgrænse:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 sekunder (45 sekunder som standard).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: Billedstørrelsen, `small` (felter på 32 px), `medium` (48 px) eller `large` (72 px).
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Den side, der er nederst på brættet.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Millisekunder pr. træk (et tal på 1 til 6 cifre).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Om linjebogstaverne og rækkenumrene tegnes rundt om brættet (`1`) eller ej (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` med `field` (`size`, `orientation`, `delay` eller `coords`): en værdi uden for de tilladte. `invalid_game_id`. `invalid_request`: ikke gyldig URL-kodning.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: partiet findes ikke. `gif_disabled`: serveren har slået GIF''er fra (`GIF_ENABLED=false`; `gif`-tokenet gives tilbage).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: grænsen `gif`, en renderingsgrænse eller kontobudgettet.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF''en kunne ikke laves (serveren logger hvorfor). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` med `retryAfter` (3 til 10 sekunder) og `Retry-After`: renderingskøen er fuld, eller GIF''en ventede `GIF_QUEUE_TIMEOUT_MS` (10 sekunder) på en ledig tråd; alle de tokens fra grænserne, som anmodningen tog, gives tilbage. `busy`: databasen forblev låst (`retryAfter: 1` kun i bodyen). `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Lav en animeret GIF af et vilkårligt parti sendt som PGN
      description: |-
        Det samme billede som `GET /games/{id}/gif` for et vilkårligt parti sendt som PGN-tekst: et parti gemt af spillet, en eksport fra et andet website, et parti skrevet ind i hånden. Kun tekstens første parti bruges.

        - PGN-læseren accepterer det samme som spillets egen læser: al PGN, som denne server skriver, og de almindelige eksporter fra andre websites (kommentarer, varianter, NAG'er og urannotationer springes over; træknumre og SAN læses tolerant; et `FEN`-tag giver startstillingen, medmindre `SetUp` er `"0"`).
        - Navnene og ratingerne kommer fra tagsene `White`, `Black`, `WhiteElo` og `BlackElo`. Bogstaver med accent mister deres accent, andre tegn uden for printbar ASCII bliver til `?`, og lange navne afkortes (48 tegn). Resultatet kommer fra tagget `Result`, ellers fra slutningen af trækteksten. Tagget `Termination` vises, medmindre det er `normal`: så fortæller slutstillingen historien (skakmat, pat).
        - Dette endpoint kontrollerer selv sin body: et ukendt felt eller et `pgn`, der mangler eller ikke er en streng, giver 400 `invalid_request` med `field`; en forkert indstilling giver 400 `invalid_option` (`delayMs` skal være et JSON-tal, `coords` en boolesk værdi; `null` afvises).

        **Påkrævet session:** kvoterne tælles pr. konto. **Grænser:** som for `GET /games/{id}/gif`. **Grænse for bodyens størrelse:** 135.168 byte, uanset `HTTP_BODY_LIMIT` (PGN'en som JSON-streng, inklusive dens escape-sekvenser). **Tidsgrænse:** 45 sekunder som standard.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Et kort parti skrevet ind, uden koordinater
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: En PGN-fil med alle indstillinger
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` med `field` (et ukendt felt, eller `pgn` mangler eller er ikke en streng; uden `field`, når bodyen ikke er et objekt); `invalid_json`; `invalid_option` med `field` (`size`, `orientation`, `delayMs` eller `coords`); `invalid_pgn` med `line` og `column` (fra 1, kolonner i tegn) og læserens `message`: et ulovligt eller tvetydigt træk, et defekt tag, en ukendt variant, mere end 65.536 byte.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: serveren har slået GIF''er fra (`GIF_ENABLED=false`; `gif`-tokenet gives tilbage).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: en body på over 135.168 byte.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: grænsen `gif`, en renderingsgrænse eller kontobudgettet.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF''en kunne ikke laves (serveren logger hvorfor). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` med `retryAfter` (3 til 10 sekunder) og `Retry-After`: renderingskøen er fuld, eller GIF''en ventede for længe på en ledig tråd; alle de tokens fra grænserne, som anmodningen tog, gives tilbage. `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /players/{username}:
    get:
      operationId: getPlayer
      tags:
        - players
      summary: Hent en spillers offentlige profil
      description: |-
        En spillers offentlige profil: ratinger i de officielle kategorier (i serverens rækkefølge) og antal partier. `games.total` tæller alle gemte partier, også uratede og afbrudte; `games.rated`, `wins`, `draws` og `losses` summeres over ratingposterne, altså kun ratede partier. Svaret er det samme med eller uden token.

        **Grænse:** `public_read` (pr. spiller med token, pr. klient uden).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Profilen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
              example:
                username: alice
                createdAt: 1790882839743
                ratings:
                  - category: '3+2'
                    rating: 1510
                    provisional: true
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                games:
                  total: 3
                  rated: 2
                  wins: 1
                  draws: 1
                  losses: 0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`: ikke 2 til 24 tegn blandt `[A-Za-z0-9_.-]`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: der blev sendt et token, og det er ikke gyldigt.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: spilleren findes ikke, eller kontoen er slettet.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: grænsen `public_read` eller kontobudgettet.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (databasen forblev låst; `retryAfter: 1` i bodyen, ingen `Retry-After`-header), `server_busy` (sessionsopslaget fandt databasen låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /players/{username}/games:
    get:
      operationId: listPlayerGames
      tags:
        - players
      summary: Vis en spillers seneste partier
      description: |-
        Spillerens seneste partier, nyeste først, opdelt i sider som historikken, men uden filtre eller total. `color` er denne spillers side. `next` er det sidste partis id, hver gang siden er fuld, så den næste side kan være tom. Spilleren slås op først: en ukendt spiller giver 404, uanset hvad forespørgslen siger.

        **Grænse:** `public_read` (pr. spiller med token, pr. klient uden).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Én side af spillerens partier.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerGamesPage'
              example:
                username: alice
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                next: 4100000000001
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_cursor` (`before` er ikke et parti-id), `invalid_limit` (disse to uden `field`).'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: der blev sendt et token, og det er ikke gyldigt.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: spilleren findes ikke, eller kontoen er slettet.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: grænsen `public_read` eller kontobudgettet.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (databasen forblev låst; `retryAfter: 1` i bodyen, ingen `Retry-After`-header), `server_busy` (sessionsopslaget fandt databasen låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: Hent de bedste spillere i en kategori
      description: |-
        De 100 bedste ratingposter i en officiel kategori med mindst `minGames` (`PROVISIONAL_GAMES`) talte partier, uden slettede konti og bekræftede snydere. Serveren beregner hver rangliste på ny højst hvert 10. sekund; `updatedAt` angiver, hvornår. Der kører én beregning ad gangen pr. kategori: imens får de andre anmodninger den forrige liste, eller de venter på beregningen, hvis der endnu ikke er nogen.

        **Grænser:** kun laget pr. adresse.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: Et officielt kategori-id (`3+2` eller `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: Antal spillere, 1 til 100. Et større tal på op til 3 cifre regnes som 100; en tom værdi regnes som fraværende.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: Ranglisten.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (mangler eller er ikke en officiel kategori), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: laget pr. adresse.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (databasen forblev låst; `retryAfter: 1` i bodyen, ingen `Retry-After`-header), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Anmeld modstanderen i et nyligt parti
      description: |-
        Anmelder modstanderen i et af spillerens egne partier, der er afsluttet inden for de seneste 7 dage. En anmeldelse ændrer aldrig i sig selv en rating, en sanktion eller et integritetsniveau. Den hæver den prioritet for gennemgang, som moderatorerne ser, og undtagen ved `abuse` beder den om motoranalyse af partiet.

        En anmeldelse af den samme modstander for det samme parti får det samme svar og ændrer intet; svaret fortæller aldrig noget om den anmeldte konto. `GET /games/{id}` fortæller partiets spillere på forhånd, om en anmeldelse ville blive modtaget (`reportable`).

        Dette endpoint kontrollerer selv sin body i rækkefølgen `gameId`, `reported`, `category`, `comment`: en fejl giver 400 `invalid_request` uden `field`. Felter, det ikke kender, ignoreres.

        **Grænser:** `reports` (pr. spiller), derefter `REPORTS_PER_DAY` (5) anmeldelser pr. spiller på 24 timer (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Anmeldelsen er modtaget (eller var allerede indgivet).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (uden `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: ikke anmelderens modstander i et parti, der er afsluttet inden for de seneste 7 dage.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, med en `Retry-After`-header): `REPORTS_PER_DAY` anmeldelser inden for de seneste 24 timer. `rate_limited`: grænsen `reports` eller kontobudgettet.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (sessionsopslaget fandt databasen låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
