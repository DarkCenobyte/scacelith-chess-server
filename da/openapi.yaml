        reason:
          type:
            - string
            - 'null'
          description: Den angivne begrundelse, hvis der er en.
        startsAt:
          type: integer
          format: int64
          description: Starten (ms siden Unix-epoken).
        endsAt:
          type:
            - integer
            - 'null'
