        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: en anden body end `{}`, eller et `id`, der ikke er gyldig URL-kodning; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: ingen aktiv session med dette id på denne konto.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: grænsen `sessions` eller kontobudgettet.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databasen forblev låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Hent kontoen, dens ratinger og aktive sanktioner
      description: |-
        Kontoen, som dens spiller ser den: kontovisningen (også `user` i hvert loginsvar), én ratingpost pr. kategori, som spilleren har spillet ratede partier i, de aktive sanktioner og udelukkelsen. Anti-snydesystemets integritetsniveau vises aldrig.

        **Grænse:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Kontoen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized` eller `invalid_token` (også når kontoen er slettet).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: grænsen `account` eller kontobudgettet.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databasen forblev låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Modtag eller afvis direkte udfordringer
      description: |-
        Angiver, om andre spillere må udfordre denne spiller via navn. Med `none` afvises direkte udfordringer: udfordreren får at vide, at spilleren ikke er tilgængelig. Ingen fornyet godkendelse.

        **Grænse:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: De præferencer, der nu gælder.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: grænsen `account` eller kontobudgettet.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databasen forblev låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Skift adgangskoden
      description: |-
        Skifter adgangskoden. Den nuværende adgangskode kræves, men ingen anden faktor, heller ikke når totrinsgodkendelse er slået til. Den nye adgangskode følger reglerne for registrering (kontrolleres efter den nuværende adgangskode).

        Ændringen har disse virkninger i én transaktion (dem alle eller ingen): den tilbagekalder alle andre sessioner (denne forbliver logget ind), annullerer en afventende ændring af e-mailadressen, får kontoens links til nulstilling af adgangskoden til at holde op med at virke og sender ejeren en e-mail.

        **Fornyet godkendelse:** kun adgangskoden. **Grænser:** `reauth`, derefter `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Adgangskoden er skiftet.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (en konto, der kun bruger Google), `weak_password` (med `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: en forkert nuværende adgangskode, eller en nulstilling eller ændring af adgangskoden, der kom ind, mens anmodningen blev kontrolleret.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (kontoens mislykkede fornyede godkendelser) eller `rate_limited` (grænsen `reauth` eller `reauth_user`, kontobudgettet, hashkøen for adgangskoder).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: hashkøen for adgangskoder, eller databasen forblev låst (`retryAfter: 1`, intet ændret). `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Begynd at slå totrinsgodkendelse til
      description: |-
        Gemmer en ny afventende hemmelighed til godkendelsesappen, som erstatter en eventuel tidligere afventende, og returnerer den til godkendelsesappen (som tekst og som en `otpauth://`-URI, der kan vises som QR-kode). Totrinsgodkendelse er endnu ikke slået til: `POST /account/mfa/totp/enable` slår den til med en kode fra denne hemmelighed.

        **Fornyet godkendelse:** kun adgangskoden. **Grænser:** `reauth`, derefter `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Den afventende hemmelighed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (en konto, der kun bruger Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (kontrolleres før adgangskoden).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (kontoens mislykkede fornyede godkendelser) eller `rate_limited` (grænsen `reauth` eller `reauth_user`, kontobudgettet, hashkøen for adgangskoder).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (hashkøen for adgangskoder, eller databasen forblev låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Fuldfør aktiveringen af totrinsgodkendelse og få gendannelseskoder
      description: |-
        Slår totrinsgodkendelse til med en kode fra den afventende hemmelighed (præcis 6 cifre). Her spørges der ikke om adgangskoden; den blev angivet ved opsætningen. Svaret indeholder 10 gendannelseskoder, som kun vises denne ene gang.

        **Grænser:** `reauth`, derefter `reauth_user`; en forkert kode tæller med i kontoens mislykkede fornyede godkendelser.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Totrinsgodkendelse er slået til.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` er ikke præcis 6 cifre, eller bodyen bryder skemaet; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: en forkert kode (kontrollér klokkeslættet på enheden).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: ingen afventende hemmelighed (kald først `POST /account/mfa/totp/setup`).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (kontoens mislykkede fornyede godkendelser) eller `rate_limited` (grænsen `reauth` eller `reauth_user`, kontobudgettet).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databasen forblev låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: Slå totrinsgodkendelse fra
      description: |-
        Slår totrinsgodkendelse fra. Hemmeligheden og gendannelseskoderne slettes, og ejeren får en e-mail.

        **Fornyet godkendelse:** adgangskoden og en kode fra godkendelsesappen eller en gendannelseskode (enten `code` eller `recoveryCode` er påkrævet). **Grænser:** `reauth`, derefter `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Totrinsgodkendelse er slået fra.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (en konto, der kun bruger Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required` (hverken `code` eller `recoveryCode`, kontrolleres før adgangskoden), `invalid_password`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (mislykkede fornyede godkendelser, eller for mange koder forsøgt på denne konto) eller `rate_limited` (grænsen `reauth` eller `reauth_user`, kontobudgettet, hashkøen for adgangskoder).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (hashkøen for adgangskoder, eller databasen forblev låst), `timeout`. Også `server_busy` med `retryAfter` 2 til 5, når serveren er langt bagud (se introduktionen): anmodningen blev ikke udført.'
  /account/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags:
        - two-step-verification
      summary: Erstat gendannelseskoderne
      description: |-
        Erstatter gendannelseskoderne med 10 nye; de gamle holder op med at virke.

        **Fornyet godkendelse:** adgangskoden og en kode fra godkendelsesappen i `code` (en gendannelseskode afvises med 403 `invalid_code`). **Grænser:** `reauth`, derefter `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodesRequest'
