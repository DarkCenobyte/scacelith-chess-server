  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Vis spillerens partier, filtreret og opdelt i sider
      description: |-
        Den indloggede spillers partier, nyeste først, filtreret og opdelt i sider, med antallet af partier, der matcher filteret. Alle query-parametre er valgfrie, og en tom værdi regnes som fraværende.

        Sideinddeling: send den forrige sides `next` som `before`; `next` er `null` på den sidste side. `total` tæller de partier, der matcher filteret, på tværs af alle sider.

        **Grænse:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: Et officielt kategori-id (`3+2` eller `3%2B2`) eller `custom` for alle partier med en anden betænkningstid.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Kun ratede (`true`) eller uratede (`false`) partier.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Kun de vundne, tabte eller remiserede partier, set fra spillerens side. Afbrudte partier vises kun uden dette filter.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Én side af historikken.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` er ikke et parti-id), `invalid_limit` eller `invalid_filter` (`category`, `rated` eller `result`), hver med `field`, der angiver parameteren.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
