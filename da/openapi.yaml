  - name: two-step-verification
    x-displayName: Totrinsgodkendelse
    description: Godkendelsesapps (TOTP, RFC 6238) med SHA-1, 6 cifre, trin på 30 sekunder og ét trins tolerance i begge retninger samt gendannelseskoder til engangsbrug.
  - name: email-change
    x-displayName: Ændring af e-mailadresse
    description: Ændring af kontoens adresse, bekræftet med et link, der sendes til den nye adresse.
  - name: data-export
    x-displayName: Dataeksport
    description: Alt, hvad serveren gemmer om kontoen, som én JSON-fil.
  - name: account-deletion
    x-displayName: Sletning af konto
    description: Permanent sletning af kontoen.
  - name: game-history
    x-displayName: Partihistorik
    description: Den indloggede spillers egne partier, filtreret og opdelt i sider.
  - name: games
    x-displayName: Partier og PGN
    description: |-
      Partiposter med deres træk og ure samt deres PGN-filer.

      **Partikoder.** `status`: 1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (kun afsluttede partier gemmes). `result`: `1-0`, `0-1`, `1/2-1/2` eller `*` (afbrudt). `reason` med sit navn (`termination`) og de ord, der afslutter træklisten i PGN-filen (på engelsk i filen, her med oversættelse); koderne 7, 14 og 21 er remis (den spiller, hvis tid løb ud, som opgav, eller som forlod partiet, stod over for en modstander, der ikke kunne sætte mat: FIDE 6.9 og 5.1.2; `DESIGN.md` 6.3 angiver reglen), og serveren afslutter aldrig et parti med koderne 4 og 13 (de hører til den fælles liste over årsager):

      | Kode | `termination` | Ord i PGN-filen |
      |---|---|---|
      | 1 | `Checkmate` | Checkmate (skakmat) |
      | 2 | `Resignation` | Resignation (opgivelse) |
      | 3 | `Timeout` | Loss on time (tab på tid) |
      | 4 | `IllegalMoves` | Second illegal move (forfeit) (andet ulovlige træk, partiet tabt) |
      | 5 | `Stalemate` | Stalemate (pat) |
      | 6 | `InsufficientMaterial` | Dead position (insufficient material) (død stilling, utilstrækkeligt materiale) |
      | 7 | `TimeoutVsInsufficient` | Flag fall, but the opponent cannot checkmate (flaget faldt, men modstanderen kan ikke sætte mat) |
      | 8 | `FivefoldRepetition` | Fivefold repetition (femfoldig gentagelse) |
      | 9 | `SeventyFiveMoves` | 75-move rule (75-træksreglen) |
      | 10 | `ThreefoldClaim` | Threefold repetition (claimed) (trefoldig gentagelse, krævet) |
      | 11 | `FiftyMoveClaim` | 50-move rule (claimed) (50-træksreglen, krævet) |
      | 12 | `Agreement` | Draw by agreement (remis efter aftale) |
      | 13 | `IllegalMovesVsInsufficient` | Second illegal move, but the opponent cannot checkmate (andet ulovlige træk, men modstanderen kan ikke sætte mat) |
      | 14 | `ResignationVsInsufficient` | Resignation, but the opponent cannot checkmate (opgivelse, men modstanderen kan ikke sætte mat) |
      | 20 | `Abandonment` | Abandoned (disconnected for too long) (partiet forladt, forbindelsen afbrudt for længe) |
      | 21 | `AbandonmentVsInsufficient` | Abandoned, but the opponent cannot checkmate (partiet forladt, men modstanderen kan ikke sætte mat) |
      | 22 | `Aborted` | Game aborted (partiet afbrudt) |
      | 23 | `NoShow` | Aborted: first move not played in time (afbrudt: første træk ikke spillet i tide) |
      | 24 | `Forfeit` | Forfeit (fair play violation) (erklæret tabt, brud på fair play) |
      | 25 | `ServerAborted` | Aborted by the server (afbrudt af serveren) |
      | 26 | `BothDisconnected` | Aborted: both players disconnected (afbrudt: begge spillere mistede forbindelsen) |

      Kode 14 er ny i protokollens minor-version 1: en klient, der er skrevet før den, bør vise en ukendt kode som en almindelig afslutning af partiet med dens `result`.
  - name: gifs
    x-displayName: Animerede GIF'er
    description: |-
      Et parti som animeret GIF, til at gemme eller dele: brættet set ovenfra, ét billede pr. stilling fra udgangsstillingen til slutstillingen, spillernes navne og ratinger over brættet, det seneste træk under det og på det sidste billede resultatet og måden, partiet sluttede på.

      **Omkostning, cache og kvoter.** En GIF laves på sin egen renderingstråd, aldrig på de tråde, der afvikler partierne, og med den laveste CPU-prioritet: `GIF_THREADS` tråde (`WORKERS` som standard), der startes med den første GIF og stoppes efter et minut uden nogen. Op til `GIF_QUEUE_MAX` (4 x `WORKERS`) GIF'er venter på en tråd, højst `GIF_QUEUE_TIMEOUT_MS` (10 s) hver; en rendering må vare `GIF_RENDER_TIMEOUT_MS` (30 s). Serveren gemmer de GIF'er, den har lavet, i en cache på `GIF_CACHE_MB` MB (32 x `WORKERS`), hvor de mindst nyligt brugte fjernes først; en GIF fra cachen, eller en, der er ved at blive lavet til en anden anmodning, koster ingen rendering. Cachens nøgle omfatter alt, der ændrer billedet, også navnene.

      Hver anmodning tæller i `gif` (30 pr. minut pr. spiller for begge endpoints). En GIF, der skal laves, tæller også i renderingsgrænserne: pr. spiller `GIF_USER_RENDERS_PER_MIN` (4) pr. minut og `GIF_USER_RENDERS_PER_HOUR` (30) pr. time; pr. klient, alle dens konti tilsammen, `GIF_IP_RENDERS_PER_MIN` (12) pr. minut og `GIF_IP_RENDERS_PER_HOUR` (120) pr. time og 3 gange så mange pr. IPv6-/48-net. En klient bør beholde den fil, den har downloadet, i stedet for at bede om den igen, og vente `retryAfter` efter en 429 eller en 503.

      Størrelser: `small` (felter på 32 px: 284 x 350 pixel), `medium` (48 px: 424 x 515), `large` (72 px: 628 x 762); uden koordinater 268 x 342, 400 x 503 og 600 x 748. Udgangsstillingen vises i mindst 1 s (forsinkelsen, når den er længere), slutstillingen i 3 s, og GIF'en kører i loop; efter det første billede gemmes kun den del af billedet, der ændrer sig. Et parti på 40 træk fylder omkring 135, 205 og 325 KiB (lille, mellem, stor), et parti på 150 træk 0,5, 0,8 og 1,2 MiB.
  - name: players
    x-displayName: Spillere
    description: Offentlige profiler og seneste partier. Kun offentlige data, aldrig en e-mailadresse, en session, en sanktion eller et integritetsniveau. En slettet konto har ingen profil.
  - name: leaderboard
    x-displayName: Rangliste
    description: De bedste spillere i hver officiel kategori.
  - name: reports
    x-displayName: Anmeldelser
    description: Anmeldelse af modstanderen fra et nyligt parti til moderatorerne.
  - name: pages
    x-displayName: HTML-sider
    description: |-
      Sider til en browser, åbnet fra links i e-mails. Deres links peger på `https://<SERVER_PUBLIC_HOST>` (med `:<PUBLIC_API_PORT>`, når den ikke er 443), uden for `/api/v1`.

      - Siderne kører intet JavaScript og indlæser ingen eksterne ressourcer. De leveres med `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'`.
      - En `GET` viser kun en knap eller en formular, så en mailscanner, der åbner linket, ikke bruger det op. Ændringen sker ved `POST`: en formular sendt som `application/x-www-form-urlencoded` (en JSON-body accepteres også), med linkets token i et skjult felt. Et felt, der er angivet to gange, afvises.
      - Fejl (hastighedsgrænser, ugyldige felter) er også HTML-sider, med titlen »Request refused« (anmodning afvist) eller, fra 500 og op, »Server error« (serverfejl). Kun de fejl, der opdages, før siden er fundet (et anmodningsmål, der er for langt eller fejlformateret, laget pr. adresse), besvares i JSON.
