tags:
  - name: server-info
    x-displayName: Serverinfo
    description: Det, en klient skal vide, før den logger ind eller opretter forbindelse.
  - name: health
    x-displayName: Tilstandstjek
    description: |-
      Om serveren kører og er klar (liveness og readiness), til overvågning. De svarer på API-porten før godkendelse og alle endpointgrænser, men som enhver anden anmodning tager de et token fra laget pr. adresse; en overvågningsvært kan angives i `ABUSE_EXEMPT`. Begge stier virker for hvert endpoint: i serverens rod og under `/api/v1`.

      Metrikporten har sine egne endpoints til tilstandstjek, beskrevet i introduktionen.
  - name: auth
    x-displayName: Registrering og login
    description: |-
      Oprettelse af en konto, login med adgangskode (og anden faktor), e-mails til bekræftelse og til nulstilling af adgangskoden.

      `POST /auth/login`, `POST /auth/login/mfa`, `POST /auth/sso/google/finish`, `POST /auth/sso/google/link` og `POST /auth/sso/complete` svarer med en session `{ token, expiresAt, user }` (eller, for de første, et andet trin).
  - name: google-sign-in
    x-displayName: Google-login
    description: |-
      Tilbydes, når `GET /info` angiver `sso.google: true`; ellers svarer alle endpoints nedenfor 404 `sso_disabled`. Et website logger ind på samme måde med sin egen klient, når `sso.googleWeb` er true (se nedenfor, **På et website**). Spillet logger ind via systemets browser med flowet for installerede apps fra RFC 8252 (en klient af typen »Computerapp«): Google sender browseren tilbage til en listener i spillet på `127.0.0.1`, aldrig til denne server, og spillet ser aldrig Google-loginoplysninger.

      1. Klienten lytter på `127.0.0.1:0` (systemet vælger porten) og laver et PKCE-par: en `codeVerifier` på 43 til 128 tegn `[A-Za-z0-9._~-]` og `codeChallenge = BASE64URL(SHA-256(codeVerifier))`, som har 43 tegn og ingen padding.
      2. `POST /auth/sso/google/start` med challengen og porten returnerer Google-URL'en og forsøgets `state`. Klienten kontrollerer URL'en (se nedenfor) og åbner den i browseren.
      3. Google sender browseren til `http://127.0.0.1:<port>/oauth2/google/<tag>?code=...&state=...`. Klienten accepterer kun `state` fra startsvaret og sender intet efter en `error=`-omdirigering.
      4. `POST /auth/sso/google/finish` med forsøgets id, `codeVerifier`, `state` og `code` (og `iss`, når Google har sendt den).
      5. Svaret er en session, et trin i totrinsgodkendelsen (fortsæt med `POST /auth/login/mfa`), `needsUsername` for en ny spiller (fortsæt med `POST /auth/sso/complete`) eller `needsPassword`, når en konto med adgangskode bruger adressen (fortsæt med `POST /auth/sso/google/link`).

      **Oprindelsestagget.** Omdirigerings-URI'en indeholder et tag for den server, spilleren har tilføjet, så spillet afviser en URL, som en anden server har fået til sine egne spillere. Oprindelsen er værten med små bogstaver (en IPv6-literal i kantede parenteser), `:` og API-porten i decimaltal, altid skrevet, også 443: serveren tager `SERVER_PUBLIC_HOST` og sin offentlige API-port, spillet den adresse, det er forbundet til. Tagget er de første 22 tegn af base64url (uden padding) af SHA-256(UTF-8 `"scacelith-sso-origin-v1\n"` + oprindelse). Omdirigerings-URI'en er `"http://127.0.0.1:" + port + "/oauth2/google/" + tag`: altid IPv4-literalen og porten på spillets listener (1024 til 65535). Serveren tager aldrig en URI, vært eller sti fra klienten.

      | Oprindelse | Tag |
      |---|---|
      | `play.scacelith.example:443` | `IhcScoV7eDOzTEcSnqPUPt` |
      | `localhost:8443` | `TFGx7zQ_8QlGZW5zpqznCr` |
      | `[::1]:8443` | `XToJm0DG5PjciEVmZa9Cho` |
      | `127.0.0.1:50443` | `3r653wM5ZjYsHcAJljmCwY` |

      Google-login virker altså kun for spillere, der har tilføjet serveren under præcis `SERVER_PUBLIC_HOST` og dens offentlige API-port.

      **Hvad spillet kontrollerer, før det åbner browseren.** `authUrl` starter med præcis `https://accounts.google.com/o/oauth2/v2/auth?` og er printbar ASCII under 4096 tegn, og dens query har præcis én `response_type=code`, præcis én `redirect_uri`, der er lig med den URI, spillet beregner ud fra sin port og sit oprindelsestag, præcis én `state`, der er lig med svarets `state`, `code_challenge_method=S256` og en `code_challenge` på 43 tegn. Ellers stopper spillet sin listener og åbner intet. Det sender kun `finish` og `link` til den server, der svarede på `start`.

      **På et website.** Et website (det officielle: <https://scacelith.com/>) logger ind med en klient af typen »Webapplikation« i det samme Google-projekt (`GOOGLE_WEB_CLIENT_ID`). Google sender browseren tilbage til én side på websitet, som administratoren har konfigureret (`GOOGLE_WEB_REDIRECT_URI`, angivet under klientens »Autoriserede omdirigerings-URI'er«), og den side sender koden til `finish`; heller ikke her tager serveren en omdirigerings-URI fra klienten.

      1. Siden laver et PKCE-par som ovenfor, gemmer verifieren i fanen (`sessionStorage`) og sender `POST /auth/sso/google/web/start` med challengen.
      2. Den kontrollerer `authUrl` som spillet, bortset fra at dens `redirect_uri` skal være en side fra dens egen oprindelse, og navigerer derefter til den. Der indlæses intet script fra Google.
      3. Google sender browseren til `GOOGLE_WEB_REDIRECT_URI?code=...&state=...`. Siden accepterer kun `state` fra startsvaret og sender intet efter en `error=`-omdirigering.
      4. `finish`, `link` og `complete` følger som for spillet. Forsøget husker, at et website startede det: koden udveksles med websitets klient og side, og ID-tokenet skal angive den klient (en kode eller et ID-token fra spillets klient fejler med 502 `sso_failed`, og omvendt).

      En Google-konto fører til den samme Scacelith-konto fra spillet og fra websitet: tilknytningen indeholder Googles subject (`sub`), som identificerer Google-kontoen uanset klienten. Websitets oprindelse skal være i `CORS_ORIGINS` (ellers advarer `check-config`).

      **Hvilken konto Google-login fører til:** den konto, der allerede er knyttet til den Google-konto; ellers en aktiv konto med den adresse, Google har bekræftet (har den en adgangskode, svarer `finish` `needsPassword`, og tilknytningen gemmes først, når kontoens adgangskode og derefter dens anden faktor, hvis den er slået til, er godkendt; uden adgangskode 409 `sso_account_exists`); ellers en ny konto (`needsUsername`). En Google-konto knyttes aldrig til en eksisterende konto alene ud fra dens adresse. Kontoens adresse får en mail, når Google-login opretter en konto, og når det føjes til en eksisterende konto.
