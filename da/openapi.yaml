            - type: 'null'
    RatingSummary:
      type: object
      description: Ratingposten for én kategori.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: Kategoriens id.
        rating:
          type: integer
          description: Ratingen.
        games:
          type: integer
          minimum: 0
          description: De spillede partier i kategorien (talt med eller ej).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Den højeste opnåede rating.
        provisional:
          type: boolean
          description: '`true`, så længe ratingen endnu ikke er etableret eller har færre end `PROVISIONAL_GAMES` talte partier (spillet viser den som `1510?`).'
    ActiveSanction:
