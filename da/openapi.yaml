        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'Formularen igen med `Retry-After`, når serveren er optaget (hashkøen for adgangskoder, eller databasen forblev låst); linket forbliver gyldigt. Når serveren er langt bagud (se introduktionen), i stedet en side »Server error« (Serverfejl) med `Retry-After` (2 til 5): intet blev udført, og linket forbliver gyldigt. Også ved timeout i handleren.'
