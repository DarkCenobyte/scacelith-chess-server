paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Get the server's name, versions, ports and sign-up rules
      description: |-
        What a client needs before it signs in or connects: the server's name and id, the WebSocket protocol versions and where the WebSocket is, the sign-up rules, the official time controls and the limits a client can check before it sends a form.

        **Limits:** only the per-address layer.
      security: []
      responses:
        '200':
          description: The server's description.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the per-address layer.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Create an account
      description: |-
        Creates an account: once its e-mail address is confirmed with the link sent to it, or at once without e-mail confirmation.

        **With e-mail confirmation** (`REQUIRE_EMAIL_VERIFICATION`, the default): 202 `verification_sent`. No account exists yet: the signup waits for 24 hours and holds its username meanwhile. A link valid for those 24 hours goes to the address, at most one per address every 5 minutes (`POST /auth/verify-email/resend` sends a new one); the account is created, its address confirmed, when the link is used (the button of the `/verify-email` page), and the player can then sign in. Until then a sign-in with that username answers `invalid_credentials`, as for an unknown account, and the public profile does not exist. A new signup with the same address replaces the waiting one. The answer is the same when another account already uses the address: no link is sent then, its owner gets a notice instead (at most one per hour), and the username is held in the same way, so that nothing tells whether the address has an account. A signup whose link was not used is dropped after 24 hours, and its username is free again.

        **Without e-mail confirmation** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, the account is created at once and can sign in.

        **Rules.** `username`: `USERNAME_MIN` to `USERNAME_MAX` characters (3 to 20), letters, digits, `_` and `-`, starting with a letter or a digit (`GET /info` gives them as `limits`); reserved names (`admin`, `moderator`, `deleted`...) and some prefixes are refused; unique without regard to case. `email`: trimmed and stored in lower case, plain ASCII with a dotted domain. `password`: at least `PASSWORD_MIN_LENGTH` (10) characters and at most 256 bytes of UTF-8; it must not contain the user name or the e-mail's local part, and must not be a common password.

        **Errors**, checked in this order: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; the password hash queue errors; 409 `email_taken` (only without e-mail confirmation).

        **Limits:** `auth`, then `auth_register` (10 registrations per hour per client). **Proof of work:** always, when `POW_REGISTER_BITS` is above 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: First attempt, without a proof of work
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Sent again with the proof of work
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: The account is created and can sign in (no e-mail confirmation on this server).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: The signup waits for its confirmation link (or the address already has an account; the answer does not tell).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (with `field`), `invalid_json`, `invalid_username`, `invalid_email`, or `weak_password` with `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` or `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: registration is closed on this server (`GET /info` says `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: an account has the username, or a waiting signup of another address holds it. `email_taken`: another account uses the address (only without e-mail confirmation).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the `auth` or `auth_register` limit, or the password hash queue.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (the password hash queue, or the database stayed locked), `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Sign in with a password
      description: |-
        Signs in with a user name or e-mail address and a password. There are two possible answers, both with status 200: a session, or, when two-step verification is on, a second step to complete within 5 minutes with `POST /auth/login/mfa`.

        Unknown account, wrong password and account without a password get the same answer, after the same time: 401 `invalid_credentials`. The account checks (`banned`, `email_unverified`) come only after a correct password. From `AUTH_FAILURES_PER_ACCOUNT` (5) failures on one login name, each attempt must wait (429 `too_many_attempts`).

        **Limit:** `auth`. **Proof of work:** only during a wave of failed sign-ins (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: A session, or the second step of a sign-in with two-step verification.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Signed in
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Two-step verification is on
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: unknown account, wrong password, or an account without a password.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'After a correct password only: `banned`, with `until` (epoch ms, `null` for a permanent ban), or `email_unverified` (an older account whose address is not confirmed yet).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (the failure delay of this login name), or `rate_limited` (the `auth` limit, the password hash queue).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (the password hash queue, or the database stayed locked), `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Complete a sign-in with a second factor
      description: |-
        The second step of a sign-in with two-step verification, after `POST /auth/login` or a Google sign-in (`POST /auth/sso/google/finish` or `POST /auth/sso/google/link`) answered `mfaRequired`. Send `code` (a 6-digit authenticator code, or a recovery code) or `recoveryCode`. A recovery code used here is gone.

        One step accepts at most 5 wrong codes; the step also ends when the password is reset or changed. After the password step of a Google link, the link is stored only when the code passes here.

        **Limits:** `auth`, and at most `AUTH_MFA_PER_ACCOUNT` (10) codes per 15 minutes for the account, from any address; beyond it the code is not checked, so a recovery code is not spent.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: An authenticator code
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: A recovery code
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Signed in.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: neither `code` nor `recoveryCode` was sent, or the body breaks the schema; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: the step expired, was used, or ended after 5 wrong codes, or the password was reset or changed since the first step (sign in again). `invalid_code`: a wrong or already used code.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (with `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: after the password step of a Google link only, the Google account was linked to another account meanwhile.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: after the password step of a Google link only, the account changed meanwhile; start again from the game.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: the account''s failure delay, or its `AUTH_MFA_PER_ACCOUNT` codes of the last 15 minutes are used up. `rate_limited`: the `auth` limit.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` with `retryAfter: 1`: the database stayed locked (after a Google link step, nothing was linked: start again from the game). `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Sign out this session
      description: |-
        Revokes the session of the token used. The WebSocket opened with it is closed. No body (or `{}`).

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Signed out.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: a body other than `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the `sessions` limit or the account budget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (the database stayed locked), `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
        - sessions
      summary: Sign out every session
      description: |-
        Revokes every session of the account, this one included. The WebSockets opened with them are closed. No body (or `{}`).

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every session is signed out.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: a body other than `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the `sessions` limit or the account budget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (the database stayed locked), `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Send the confirmation link again
      description: |-
        Sends the e-mail confirmation link again. The answer is 202 `accepted` whatever the address, so that it never tells whether an account or a signup uses it.

        A request acts at most once every 5 minutes per address. A signup waiting with that address gets its 24 hours again, whether or not another account uses the address, so that its username stays held as long in both cases. A link is sent only for that signup when the address has no account (a new link, valid 24 hours, replaces the previous one), or for an active, unconfirmed account with that address.

        **Limits:** `auth`, then `auth_mail` (10 per hour per client).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Accepted (whatever the address).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the `auth` or `auth_mail` limit (whatever the address).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` with `retryAfter: 1`: the database stayed locked while the account was looked up (the renewal of a waiting signup is best effort and never fails the request). `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Send a password reset link
      description: |-
        Sends a password reset link, valid for one hour, which opens the page `/reset-password`. The answer is 202 `accepted` whatever the address. A link goes only to an active account, at most once every 5 minutes per address. A Google-only account sets its first password this way.

        Password recovery has the strictest limits of the API, all counted for the whole server: 3 requests per hour (`AUTH_FORGOT_PER_HOUR`) and 10 per 24 hours (`AUTH_FORGOT_PER_DAY`) per client (an IPv4 address or an IPv6 /64), 3 times those numbers per IPv6 /48, on top of the `auth` limit (20 per 10 minutes) and of the one mail per address every 5 minutes. Neither the 202 nor the 429 tells whether an account uses the address. Setting the new password has its own limit (`auth_reset`).

        **Limits:** `auth`, `auth_forgot`, then `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Accepted (whatever the address).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the `auth`, `auth_forgot` or `auth_forgot_day` limit (whatever the address).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` with `retryAfter: 1`: the database stayed locked. `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Set a new password with a reset link's token
      description: |-
        Sets a new password with the token of a reset link (the page `/reset-password` does the same). The new password follows the rules of registration.

        The reset has these effects, in one transaction (all of them, or none): it revokes every session and cancels a pending e-mail change; the other reset links of the account stop working; the address counts as confirmed (the link proved it); the owner gets a mail. Two-step verification is not touched. After a password hash queue error, a 503 or a 500, nothing changed: the old password and the sessions stay, and the link stays valid.

        **Limits:** `auth`, then `auth_reset` (10 per hour per client, 30 per IPv6 /48, shared with the page: each attempt hashes a password).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: The password is changed and every session is signed out.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: the link is invalid, used or expired, or was mailed to an address the account no longer has. `weak_password` (with `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the `auth` or `auth_reset` limit, or the password hash queue.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: the password hash queue, or the database stayed locked (`retryAfter: 1`, nothing changed). `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Start a Google sign-in
      description: |-
        Starts a Google sign-in attempt for the PKCE challenge and the port of the game's listener on `127.0.0.1`. The answer gives the Google URL to open in the system browser and the attempt's `state`; the attempt is valid for 10 minutes.

        `authUrl` holds `client_id`, `redirect_uri` (built from `redirectPort` and the server's origin tag), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 of the server's own verifier for Google) with `code_challenge_method=S256`, and `prompt=select_account`. The game checks it before it opens it (see the tag description).

        **Limit:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: The attempt.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: Google sign-in is not offered on this server.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the `sso_start` limit.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (the database stayed locked), `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Hand Google's answer to the server
      description: |-
        Hands the `code` and `state` that Google sent to the game's listener to the server, with the attempt id and the PKCE verifier. An attempt id is useless without the verifier, and the code is useless without the server's own PKCE verifier and client secret.

        The server checks the attempt (unknown, used or expired: 410), then the verifier (a wrong one leaves the attempt usable), then uses the attempt once, checks `state` and `iss`, exchanges the code with Google and verifies the ID token. The answer (200) is one of:

        - `{ token, expiresAt, user }`: signed in to the linked account;
        - `{ mfaRequired, mfaToken, expiresIn }`: continue with `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: a new account; continue with `POST /auth/sso/complete` within 10 minutes. `suggestedUsername` comes from the Google name or the address, and is `""` when nothing fits;
        - `{ needsPassword, linkTicket, username, expiresIn }`: the account with that address has a password; continue with `POST /auth/sso/google/link`. Nothing is linked yet.

        **Limit:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: A session, a second step, or the next step of a first Google sign-in.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Signed in to the linked account
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Two-step verification is on
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: A new player
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: An account with a password uses the address
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: the verifier does not match the attempt''s challenge (the attempt stays usable). `sso_email_unverified`: Google has not confirmed the address. `registration_closed`. `account_disabled`. For a linked account only: `banned` (with `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: Google sign-in is not offered on this server.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: an active account without a password uses the address (it is not named).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: an unknown, used or expired attempt.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the `sso_finish` limit.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (the database stayed locked), `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Link Google to an existing account with its password
      description: |-
        After `finish` answered `needsPassword`: links Google to the existing account with that account's password, typed in the game. The answer (200) is a session (the link is stored and the player signed in), or, when two-step verification is on, `{ mfaRequired, mfaToken, expiresIn }`: continue with `POST /auth/login/mfa`, and the link is stored only when a code passes there.

        A wrong password leaves the ticket usable, for 5 tries in all. A try is taken just before the password is checked: a 429 `too_many_attempts` or a 428 `pow_required` takes none, while a refusal of the password hash queue (503 `server_busy`, 429 `rate_limited`) has taken one and counts as a failure of the account. The failure delay is the same counter as `POST /auth/login`.

        **Limit:** `auth` (with its IPv6 /48 count). **Proof of work:** as for `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: A session, or the second step of the sign-in.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: a wrong password; the ticket stays, for 5 tries in all.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (with `until`), only after a correct password.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: Google sign-in is not offered on this server.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: the Google account was linked to another account meanwhile.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: an unknown, used or expired ticket, the 5th wrong password, an account whose status or address changed since `finish`, or one whose status, address, password or two-step verification changed while the link was being stored. Start again from the game.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (the account''s failure delay), or `rate_limited` (the `auth` limit, the password hash queue).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: the password hash queue, or the database stayed locked (`retryAfter: 1`, nothing was linked). `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Create the account of a first Google sign-in
      description: |-
        After `finish` answered `needsUsername`: creates the account with the chosen username (the rules of registration apply) and signs it in. The account has no password: `hasPassword` is `false`, and "Forgot password" (`POST /auth/password/forgot`) gives it one.

        **Limit:** `auth` (with its IPv6 /48 count).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: The account is created and signed in.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: Google sign-in is not offered on this server.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (an account has the username, or a waiting signup of another address holds it), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: an unknown, used or expired ticket.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the `auth` limit.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (the database stayed locked), `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: List the signed-in devices
      description: |-
        The account's active sessions (signed-in devices), the most recently used first. `current` marks the session making the request. `lastSeenAt` is updated at most every 5 minutes; `expiresAt` is the absolute end, and the idle limit may end the session sooner.

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The active sessions.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the `sessions` limit or the account budget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (the database stayed locked), `timeout`.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Sign out one device
      description: |-
        Signs out one session of the account; the current one may be signed out too. The WebSocket opened with it is closed. No body (or `{}`).

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: The session is signed out.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: a body other than `{}`, or an `id` that is not valid URL encoding; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: no active session with this id on this account.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the `sessions` limit or the account budget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (the database stayed locked), `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Get the account, its ratings and active sanctions
      description: |-
        The account as its player sees it: the account view (also the `user` of every sign-in answer), one rating record per category the player has played rated games in, the active sanctions and the ban. The anti-cheat's integrity level is never shown.

        **Limit:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The account.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`, or `invalid_token` (also when the account was deleted).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the `account` limit or the account budget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (the database stayed locked), `timeout`.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Accept or refuse direct challenges
      description: |-
        Sets whether other players may challenge this player by name. With `none`, direct challenges are refused: the challenger is told that the player is unavailable. No re-authentication.

        **Limit:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: The preferences now in force.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the `account` limit or the account budget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (the database stayed locked), `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Change the password
      description: |-
        Changes the password. The current password is needed, but no second factor, even with two-step verification on. The new password follows the rules of registration (checked after the current password).

        The change has these effects, in one transaction (all of them, or none): it revokes every other session (this one stays signed in), cancels a pending e-mail change, makes the account's password reset links stop working, and sends the owner a mail.

        **Re-authentication:** the password only. **Limits:** `reauth`, then `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: The password is changed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (a Google-only account), `weak_password` (with `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: a wrong current password, or a password reset or change that landed while the request was checked.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (failed re-authentications of the account), or `rate_limited` (the `reauth` or `reauth_user` limit, the account budget, the password hash queue).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: the password hash queue, or the database stayed locked (`retryAfter: 1`, nothing changed). `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Start enabling two-step verification
      description: |-
        Stores a new pending authenticator secret, which replaces any earlier pending one, and returns it for the authenticator app (as text and as an `otpauth://` URI to show as a QR code). Two-step verification is not on yet: `POST /account/mfa/totp/enable` turns it on with a code of this secret.

        **Re-authentication:** the password only. **Limits:** `reauth`, then `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: The pending secret.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (a Google-only account), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (checked before the password).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (failed re-authentications of the account), or `rate_limited` (the `reauth` or `reauth_user` limit, the account budget, the password hash queue).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (the password hash queue, or the database stayed locked), `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Finish enabling two-step verification and get recovery codes
      description: |-
        Turns two-step verification on with a code of the pending secret (exactly 6 digits). No password is asked here; it was given at setup. The answer holds 10 recovery codes, shown this once.

        **Limits:** `reauth`, then `reauth_user`; a wrong code counts in the account's re-authentication failures.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Two-step verification is on.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` is not exactly 6 digits, or the body breaks the schema; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: a wrong code (check the time of the device).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: no pending secret (call `POST /account/mfa/totp/setup` first).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (failed re-authentications of the account), or `rate_limited` (the `reauth` or `reauth_user` limit, the account budget).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (the database stayed locked), `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
