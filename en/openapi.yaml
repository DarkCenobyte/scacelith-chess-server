        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (a Google-only account), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (failed re-authentications, or too many codes tried on this account), or `rate_limited` (the `account_export`, `reauth` or `reauth_user` limit, the account budget, the password hash queue).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (the database stayed locked, with a `Retry-After: 1` header), `server_busy` (the password hash queue), `timeout` (60 seconds). Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: Delete the account
      description: |-
        Deletes the account; this cannot be undone.

        - Every session is revoked at once: the token gets 401 `invalid_token` from then on.
        - The user name becomes `deleted#<id>`, in the account and in every game record.
        - These are erased: the e-mail address, the password hash, the two-step secret and recovery codes, the sessions and link tokens, the Google link, the anti-cheat's integrity record, and the IP addresses stored with security events.
        - Ratings and games are kept. Games stay readable under the anonymous name, and `GET /players/{username}` answers 404 for the former name.

        **Re-authentication:** the password and, with two-step verification, an authenticator code or a recovery code. **Limits:** `reauth`, then `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: The account is deleted.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (a Google-only account), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (failed re-authentications, or too many codes tried on this account), or `rate_limited` (the `reauth` or `reauth_user` limit, the account budget, the password hash queue).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (the password hash queue, or the database stayed locked), `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: List the player's games, filtered and paged
      description: |-
        The signed-in player's games, newest first, filtered and paged, with the number of games matching the filter. Every query parameter is optional, and an empty value counts as absent.

        Paging: pass the previous page's `next` as `before`; `next` is `null` on the last page. `total` counts the games matching the filter, across all pages.

        **Limit:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: An official category id (`3+2`, or `3%2B2`), or `custom` for every game with another time control.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Only rated (`true`) or casual (`false`) games.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Only the games won, lost or drawn, from the player's side. Aborted games appear only without this filter.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: One page of the history.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` is not a game id), `invalid_limit`, or `invalid_filter` (`category`, `rated` or `result`), each with `field` naming the parameter.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the `account_games` limit or the account budget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (the database stayed locked; `retryAfter: 1` in the body, no `Retry-After` header), `server_busy` (the session lookup found the database locked), `timeout`.'
  /games/{id}:
    get:
      operationId: getGame
      tags:
        - games
      summary: Get a game record with its moves and clocks
      description: |-
        One game record, with its moves and clocks. Without a token, or with the token of a player who did not play the game, the answer is the public one. When the token's player played the game, the answer adds `you` and `reportable`.

        **Limit:** `public_read` (per player with a token, per client without).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: The game record.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameRecord'
              example:
                id: 4100000000001
                category: '3+2'
                rated: true
                timeControl: '180+2'
                white:
                  name: alice
                  rating: 1500
                  ratingAfter: 1510
                  ratingDiff: 10
                black:
                  name: bob
                  rating: 1520
                  ratingAfter: 1510
                  ratingDiff: -10
                status: 1
                reason: 2
                result: 1-0
                termination: Resignation
                plies: 2
                startedAt: 1790620205000
                endedAt: 1790620611000
                baseMs: 180000
                incMs: 2000
                statusName: WhiteWins
                rematchOf: null
                moves:
                  - uci: e2e4
                    spentMs: 0
                    clockMs: 180000
                  - uci: e7e5
                    spentMs: 1700
                    clockMs: 180300
                pgn:
                  Event: Scacelith rated 3+2
                  Site: caissa.scacelith.com
                  Date: '2026.09.28'
                  Round: '-'
                  White: alice
                  Black: bob
                  Result: 1-0
                  WhiteElo: 1500
                  BlackElo: 1520
                  TimeControl: '180+2'
                  Termination: Resignation
                  PlyCount: 2
                you: white
                reportable: true
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: not a positive integer of at most 16 digits (below 2^53); `invalid_request`: not valid URL encoding.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: a token was sent and it is not valid.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: no such game.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the `public_read` limit or the account budget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (the database stayed locked; `retryAfter: 1` in the body, no `Retry-After` header), `server_busy` (the session lookup found the database locked), `timeout`.'
  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Download a game as a PGN file
      description: |-
        The same game as a PGN file: one game with `\n` line endings, and move text in lines under 80 columns. The answer is the same with or without a token.

        Tags, in this order: `Event` (`<SERVER_NAME> rated <category>` or `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (the UTC start date), `Round`, `White`, `Black`, `Result` (`*` for an aborted game), `UTCDate` and `UTCTime` (the start), `WhiteElo` and `BlackElo` (the ratings at the start, or `-`), `WhiteRatingDiff` and `BlackRatingDiff` (the changes, such as `+10` and `-10`, in every rated game, `+0` when the rating rules leave the rating where it was; a casual, custom or aborted game has neither), `TimeControl` (in seconds), `Termination` (a PGN standard value: `normal`; `time forfeit`, a flag fall, also when it ends in a draw; `abandoned`; `rules infraction`, a second illegal move or a fair-play forfeit; `unterminated`, an aborted game), `PlyCount`, `ScacelithGameId` (the decimal id).

        Each move carries `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: the mover's clock after the move and the time charged for it, in tenths of a second (truncated). A value is left out when the record lacks it. After the last move, the end reason follows in words, then the result.

        **Limit:** `public_read` (per player with a token, per client without).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: The PGN file.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'The PGN text, in UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: not a positive integer of at most 16 digits (below 2^53); `invalid_request`: not valid URL encoding.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: a token was sent and it is not valid.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: no such game.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the `public_read` limit or the account budget.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: among others, the stored moves cannot be replayed to the stored ending (the server logs it).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (the database stayed locked; `retryAfter: 1` in the body, no `Retry-After` header), `server_busy` (the session lookup found the database locked), `timeout`.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Download a game of this server as an animated GIF
      description: |-
        The game as an animated GIF. The names and ratings are those of the game record (the ratings at the start, a deleted account as `deleted#<id>`), and so are the result and the ending (`Resignation`, `Loss on time`...).

        The checks come in this order: `gif_disabled`, the picture options (`size`, `orientation`, `delay`, `coords`), the game id, the game, its length.

        **Session required:** the quotas count per account. **Limits:** `gif` on every request; `gif_user_min`, `gif_user_hour`, `gif_ip_min` and `gif_ip_hour` only when the GIF has to be made (see the tag description). **Time limit:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 seconds (45 seconds by default).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: The picture size, `small` (32 px squares), `medium` (48 px) or `large` (72 px).
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: The side at the bottom of the board.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Milliseconds per move (1 to 6 decimal digits).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Whether the file letters and rank numbers are drawn around the board (`1`) or not (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` with `field` (`size`, `orientation`, `delay` or `coords`): a value outside the allowed ones. `invalid_game_id`. `invalid_request`: not valid URL encoding.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: no such game. `gif_disabled`: the server turned GIFs off (`GIF_ENABLED=false`; the `gif` token is given back).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the `gif` limit, a render limit, or the account budget.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: the GIF could not be made (the server logs why). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` with `retryAfter` (3 to 10 seconds) and `Retry-After`: the rendering queue is full, or the GIF waited `GIF_QUEUE_TIMEOUT_MS` (10 seconds) for a free thread; every limit token the request took is given back. `busy`: the database stayed locked (`retryAfter: 1` in the body only). `timeout`.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Make an animated GIF of any game sent as PGN
      description: |-
        The same picture as `GET /games/{id}/gif` for any game sent as PGN text: a game saved by the game, an export of another site, a game typed by hand. Only the first game of the text is used.

        - The PGN reader takes what the game's own reader takes: every PGN that this server writes and the usual exports of other sites (comments, variations, NAGs and clock annotations are skipped; move numbers and SAN read leniently; a `FEN` tag gives the start position unless `SetUp` is `"0"`).
        - The names and ratings come from the `White`, `Black`, `WhiteElo` and `BlackElo` tags. Accented letters lose their accents, other characters outside printable ASCII become `?`, and long names are cut (48 characters). The result comes from the `Result` tag, else from the end of the move text. The `Termination` tag is shown unless it is `normal`: the final position then tells the story (checkmate, stalemate).
        - This endpoint checks its body itself: an unknown field or a missing or non-string `pgn` answers 400 `invalid_request` with `field`; a wrong option answers 400 `invalid_option` (`delayMs` must be a JSON number, `coords` a boolean; `null` is refused).

        **Session required:** the quotas count per account. **Limits:** as for `GET /games/{id}/gif`. **Body limit:** 135,168 bytes, whatever `HTTP_BODY_LIMIT` (the PGN as a JSON string, its escapes included). **Time limit:** 45 seconds by default.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: A short game typed in, without coordinates
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: A PGN file with every option
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` with `field` (an unknown field, or `pgn` missing or not a string; without `field` when the body is not an object); `invalid_json`; `invalid_option` with `field` (`size`, `orientation`, `delayMs` or `coords`); `invalid_pgn` with `line` and `column` (from 1, columns in characters) and the reader''s `message`: an illegal or ambiguous move, a broken tag, an unknown variant, more than 65,536 bytes.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: the server turned GIFs off (`GIF_ENABLED=false`; the `gif` token is given back).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: a body above 135,168 bytes.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the `gif` limit, a render limit, or the account budget.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: the GIF could not be made (the server logs why). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` with `retryAfter` (3 to 10 seconds) and `Retry-After`: the rendering queue is full, or the GIF waited too long for a free thread; every limit token the request took is given back. `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /players/{username}:
    get:
      operationId: getPlayer
      tags:
        - players
      summary: Get a player's public profile
      description: |-
        A player's public profile: ratings in the official categories (in the server's order) and game counts. `games.total` counts every stored game, casual and aborted ones included; `games.rated`, `wins`, `draws` and `losses` are summed over the rating records, so rated games only. The answer is the same with or without a token.

        **Limit:** `public_read` (per player with a token, per client without).
      security:
