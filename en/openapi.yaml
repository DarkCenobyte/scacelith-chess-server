                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        A session token (`sct_` followed by 43 base64url characters) from a sign-in answer, in the `Authorization` header: `Authorization: Bearer <token>`. The prefix is exactly `Bearer` (case-sensitive) and one space; a value that does not have it, or a token that is not 1 to 512 printable ASCII characters, answers 401 `invalid_token` like any other invalid token. An empty header counts as no header.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: The game id, a positive decimal integer of at most 16 digits without leading zeros, below 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: The session id, as `GET /auth/sessions` gives it, written without leading zeros (`03` is not session 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: The player's user name, without regard to case. The server takes any name that is 2 to 24 characters of `[A-Za-z0-9_.-]` (the widest rule it ever allowed).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: A game id; only older games are listed. Pass the previous page's `next`. An empty value counts as absent.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: The page size, 1 to 50. A larger number of up to 3 digits counts as 50; an empty value counts as absent.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: The token of the e-mail link (43 base64url characters). A missing or wrong one shows the "link invalid or expired" page.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Every answer of the server forbids caching.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Seconds to wait before trying again; the same value as `retryAfter` in the body.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: The bearer challenge, with `error="invalid_token"` for an invalid token.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: The server closes the connection after this answer.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (with `field` when a field of the body is at fault) or `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: A field breaks the schema
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: The body is not JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: A weak password
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: A PGN that cannot be read
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (no `Authorization` header) or `invalid_token` (the token is malformed, expired, revoked, or belongs to a deleted account).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: No session
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: An invalid token
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: The request is refused.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: A wrong password at re-authentication
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: A banned account
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found`, or a feature that this server turned off.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: the body did not arrive within 10 seconds. The server closes the connection.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: The request conflicts with the state of the server.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: the Google sign-in attempt or ticket is unknown, used or expired; start again from the game.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: the body exceeds `HTTP_BODY_LIMIT` (16,384 bytes by default). The server closes the connection.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: the request target exceeds 4096 characters.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: the body is not `application/json`, or its charset is not UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: the game has more than `GIF_MAX_PLIES` (600) half-moves.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: solve the `pow` challenge and send the same request again with `pow: { challenge, nonce }`. `reason` says why: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` or `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (a rate limit, the account budget, or the password hash queue) or `too_many_attempts` (a throttle of the account), with `retryAfter` and a `Retry-After` header.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: A rate limit
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Too many failures on this account
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: an unexpected failure. The server logs it.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: a wrong `state` or `iss`, or Google refused the code or sent an ID token that does not verify. It never carries Google''s text.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` or `timeout`: try again after `retryAfter` when it is given.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: The server is busy
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: The database stayed locked (a read)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: The server took too long
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: The animated GIF, as an attachment.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` for a game of this server, `attachment; filename="scacelith-game.gif"` for a PGN sent with `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: The size of the file in bytes.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: An HTML page.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: An HTML page that explains the refusal.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: The form did not arrive within 10 seconds (an HTML page). The server closes the connection.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: An HTML page that explains the conflict.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: The form exceeds `HTTP_BODY_LIMIT` (an HTML page). The server closes the connection.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: The body is neither a form (`application/x-www-form-urlencoded`) nor JSON, or its charset is not UTF-8 (an HTML page).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: A rate limit (an HTML page), with `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: An unexpected failure (an HTML page titled "Server error"). The server logs it.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: The server is busy (the database stayed locked, with `Retry-After`) or took too long (an HTML page titled "Server error").
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: The one shape of every error answer of the JSON API.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: The `snake_case` error code. A client chooses what to show from it.
          examples:
            - rate_limited
        message:
          type: string
          description: An English sentence, meant for logs and as a fallback.
        retryAfter:
          type: integer
          minimum: 1
          description: Seconds to wait before trying again, present only on refusals that end with time. The answer then also carries a `Retry-After` header with the same value, except the 503 `busy` of the history, game, player and leaderboard reads.
        field:
          type: string
          description: The field or query parameter at fault (`invalid_request`, `invalid_option`, and `invalid_cursor`, `invalid_limit` and `invalid_filter` of `GET /account/games`). A nested field is dotted (`pow.nonce`).
        reason:
          type: string
          description: 'Why: the rule a `weak_password` breaks, or why a proof of work was asked for or refused (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: '`banned` only: the end of the ban (epoch ms), `null` for a permanent ban.'
        line:
          type: integer
          minimum: 1
          description: '`invalid_pgn` only: the line of the error, from 1.'
        column:
          type: integer
          minimum: 1
          description: '`invalid_pgn` only: the column of the error, from 1, in characters.'
    PowChallenge:
      type: object
      description: A proof-of-work challenge (the `pow` of a 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: The signed challenge, to send back as it is.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: The number of leading zero bits that `SHA-256(challenge + ":" + nonce)` must have.
        expiresAt:
          type: integer
          format: int64
          description: When the challenge expires (epoch ms), 2 minutes after it was issued.
    PowAnswer:
      type: object
      description: The answer to a proof-of-work challenge.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: The `challenge` of the 428 answer, as it was given.
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: A decimal string of at most 20 digits such that `SHA-256(challenge + ":" + nonce)` starts with `bits` zero bits.
    ServerInfo:
      type: object
      description: What a client needs before it signs in or connects.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: The server's name (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: A UUID that the database gets on its first start. It stays the same across restarts. It is `null` when the database cannot give it.
        motd:
          type: string
          description: The message of the day (`SERVER_MOTD`), possibly empty.
        protocol:
          type: object
          description: The WebSocket protocol (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: The oldest protocol version the server speaks.
            max:
              type: integer
              minimum: 1
              description: The newest protocol version the server speaks.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: The fingerprint of the protocol schema (first 4 bytes of the SHA-256 of its canonical form, as an unsigned integer); informational.
            subprotocol:
              type: string
              description: The WebSocket subprotocol token (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: The WebSocket port that players use (`PUBLIC_WS_PORT`, else `WS_PORT`, else `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: The path of the WebSocket.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Whether new accounts can be created.
        emailVerification:
          type: boolean
          description: Whether new accounts confirm their address (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
          properties:
            google:
              type: boolean
              description: Whether Google sign-in is offered.
        mfa:
          type: boolean
          const: true
          description: Two-step verification is always available.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: The proof-of-work bits that registration needs (0 for none).
        categories:
          type: array
          description: The official (rated) time controls (`RATED_CATEGORIES`), in the server's order. Any other time control is `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: The rules a client can check before it sends a form.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: The shortest user name (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: The longest user name (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: The regular expression a new user name must match.
            passwordMinLength:
              type: integer
              description: The shortest password, in characters (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: The longest password, in bytes of UTF-8.
            customTimeControls:
              type: boolean
              description: Whether challenges and private games may use custom time controls.
            reportsPerDay:
              type: integer
              description: How many reports a player may file per 24 hours (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: The largest WebSocket message a client may send, in bytes.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 1852590473
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: An official time control.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: The category id, minutes and increment seconds (`3+2`).
        baseSec:
          type: number
          minimum: 0
          description: The base time, in seconds.
        incSec:
          type: number
          minimum: 0
          description: The increment per move, in seconds.
    AccountView:
      type: object
      description: The account as its player sees it (`user` of the sign-in answers and of `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: The account id.
        username:
          type: string
          description: The user name.
        email:
          type: string
          format: email
          description: The e-mail address.
        emailVerified:
          type: boolean
          description: Whether the address is confirmed.
        mfaEnabled:
          type: boolean
          description: Whether two-step verification is on.
        googleLinked:
          type: boolean
          description: Whether a Google account is linked.
        hasPassword:
          type: boolean
          description: '`false` for an account created through Google that has not set a password yet.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Whether direct challenges by name are accepted (see `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: When the account was created (epoch ms).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: The last sign-in (epoch ms), or `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: The new address of an e-mail change waiting for its link, or `null`.
    SessionAnswer:
      type: object
      description: A new session.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: The session token, for the `Authorization` header and the WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: The absolute end of the session (epoch ms); the idle limit may end it sooner.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: The second step of a sign-in with two-step verification; continue with `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: The token of the step, for `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Seconds left to complete the step.
    LoginAnswer:
      description: A session, or the second step of a sign-in with two-step verification.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: A first Google sign-in; continue with `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: The ticket for `POST /auth/sso/complete`, valid for 10 minutes.
        suggestedUsername:
          type: string
          description: A user name made from the Google name or the address, or `""` when nothing fits.
    SsoNeedsPassword:
      type: object
      description: An account with a password uses the address; continue with `POST /auth/sso/google/link`. Nothing is linked yet.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: The ticket for `POST /auth/sso/google/link`.
        username:
          type: string
          description: The user name of that account (only someone who proved the address to Google sees it).
        expiresIn:
          type: integer
          const: 600
          description: Seconds the ticket stays valid.
    SsoFinishAnswer:
      description: The answer of `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: A Google sign-in attempt.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: The attempt, for `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: The Google URL to open in the system browser, once checked.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: The `state` that Google must send back.
        expiresIn:
          type: integer
          const: 600
          description: Seconds the attempt stays valid.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: The user name; then the server's rules (see the description).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: The e-mail address. Trimmed and stored in lower case.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: The password; then the password rules.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: The user name, or the e-mail address (any text with `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Optional. Shown in the list of signed-in devices (such as `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: The `mfaToken` of the sign-in answer (or of a Google sign-in's).
        code:
          type: string
          maxLength: 32
          description: Optional. A 6-digit authenticator code, or a recovery code.
        recoveryCode:
          type: string
          maxLength: 32
          description: Optional. A recovery code. One of `code` and `recoveryCode` is needed.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: The e-mail address.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: The `token` parameter of the reset link.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: The new password; the password rules of registration apply.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: The S256 PKCE challenge of the client's `codeVerifier` (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: The port of the client's listener on `127.0.0.1`.
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: The `attemptId` of `POST /auth/sso/google/start`.
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: The PKCE verifier; its SHA-256 must match the challenge given to `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: The `state` as Google sent it back.
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: The `code` as Google sent it back (printable ASCII without spaces).
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Optional. The `iss` as Google sent it back, when it did.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: The `linkTicket` of `finish`, valid for 10 minutes.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: The account's password.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: The `ssoTicket` of `finish`, valid for 10 minutes.
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: The user name; the rules of registration apply.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: The active sessions, the most recently used first.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: An active session (a signed-in device).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: The session id, for `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: The sign-in (epoch ms).
        lastSeenAt:
          type: integer
          format: int64
          description: The last use (epoch ms), updated at most every 5 minutes.
        expiresAt:
          type: integer
          format: int64
          description: The absolute end (epoch ms); the idle limit may end the session sooner.
        clientLabel:
          type:
            - string
            - 'null'
          description: The `clientLabel` of the sign-in, or `null` when it sent none.
        current:
          type: boolean
          description: Whether this is the session making the request.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: One record per category the player has played rated games in.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: The active sanctions.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }` while banned, else `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: The rating record of one category.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: The category id.
        rating:
          type: integer
          description: The rating.
        games:
          type: integer
          minimum: 0
          description: The games played in the category (counted or not).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: The highest rating reached.
        provisional:
          type: boolean
          description: '`true` while the rating is unrated or has fewer than `PROVISIONAL_GAMES` counted games (the game shows it as `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: The kind of sanction.
        reason:
          type:
            - string
            - 'null'
          description: The reason given, if any.
        startsAt:
          type: integer
          format: int64
          description: The start (epoch ms).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: The end (epoch ms), `null` when the sanction is permanent.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: The end of the ban (epoch ms), `null` when permanent.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` to accept direct challenges by name, `none` to refuse them.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: The current password.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: The new password; the password rules of registration apply.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: The account's password.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: A code of the pending secret, exactly 6 digits.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: The account's password.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Optional; needed with two-step verification (or `recoveryCode`). An authenticator code, or a recovery code.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Optional. A recovery code (`xxxx-xxxx-xx`; case, spaces and dashes do not matter).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: The account's password.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: An authenticator code (a recovery code is refused).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: The new address; trimmed and lower-cased, then checked like a registration address.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: The account's password.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Optional; needed with two-step verification (or `recoveryCode`). An authenticator code, or a recovery code.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Optional. A recovery code.
    TotpSetup:
      type: object
      description: The pending secret for the authenticator app.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: The secret in base32, to type into the app.
        uri:
          type: string
          format: uri
          description: The `otpauth://totp/...` URI, to show as a QR code.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Seconds per step.
    RecoveryCodeList:
      type: array
      description: The 10 recovery codes, shown this once. Each one works once.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: One side of a game.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: The name in the game record (`deleted#<id>` for a deleted account).
        rating:
          type:
            - integer
            - 'null'
          description: The rating at the start, `null` when unknown.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: The rating after the game. A rated game always has it; `null` only for a game that does not count for the ratings (casual, custom, aborted).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: The change of rating, `0` when the rating rules leave the rating where it was (FIDE's zero score, an unrated opponent, the first games of an unrated player); `null` like `ratingAfter`.
    GameSummary:
      type: object
      description: The summary of a stored game.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: The game id.
        category:
          type: string
          description: The official category id (`3+2`), or `custom`.
        rated:
          type: boolean
          description: Whether the game counts for the ratings.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: The time control in seconds (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (see the game codes).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: The end reason code (see the game codes).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: The result, `*` for an aborted game.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: The number of half-moves.
        startedAt:
          type: integer
          format: int64
          description: The start (epoch ms).
        endedAt:
          type: integer
          format: int64
          description: The end (epoch ms).
    Termination:
      type: string
      description: The name of the end reason (see the game codes); `Unknown` for a code the protocol does not know.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: A game summary from the side of one player.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: The side of the player.
    HistoryGameSummary:
      description: A game of the signed-in player's history.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: The base time in milliseconds.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: The increment in milliseconds.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: The outcome from the player's side.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: The games of the page, newest first.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: The id to pass as `before` for the next page, or `null` on the last page.
        total:
          type: integer
          minimum: 0
          description: The number of games matching the filter, across all pages.
    MoveRecord:
      type: object
      description: One ply of a game.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: The move in UCI notation, with `n`, `b`, `r` or `q` added for a promotion.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: The time charged for the move (ms), `null` when the record does not have it.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: The mover's clock after the move (ms), `null` when the record does not have it.
    PgnTagsView:
      type: object
      description: The main PGN tags, for display. `Termination` here is the end-reason name; the PGN file uses the PGN standard values.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` or `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: The UTC start date.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: The rating at the start, or `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: The rating at the start, or `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: A game record with its moves and clocks. It has the fields of a game summary, without `color` and `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: The base time in milliseconds.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: The increment in milliseconds.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: The name of `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: The id of the game that this one is a rematch of, or `null`.
            moves:
              type: array
              description: One entry per ply.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Only when the token's player played this game; their side.
            reportable:
              type: boolean
              description: Only when the token's player played this game; `true` when `POST /reports` would take a report of the opponent for this game now (the game ended within 7 days, the daily quota is not used up, and the opponent is not already reported for this game).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: The user name, as the player wrote it.
        createdAt:
          type: integer
          format: int64
          description: When the account was created (epoch ms).
        ratings:
          type: array
          description: The official categories only, in the server's order.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Every stored game, casual and aborted ones included.
            rated:
              type: integer
              minimum: 0
              description: Rated games, summed over the rating records.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: The user name, as the player wrote it.
        games:
          type: array
          description: The games of the page, newest first.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: The last game's id whenever the page is full (the next page may then be empty), else `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: The category id.
        minGames:
          type: integer
          minimum: 0
          description: The counted games a record needs to be listed (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: When the board was computed (epoch ms).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: The PGN text, at most 65,536 bytes of UTF-8. Only the first game is used.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Optional. The picture size.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Optional. The side at the bottom of the board.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Optional. Milliseconds per move, a JSON number with an integral value.
        coords:
          type: boolean
          default: true
          description: Optional. Whether the file letters and rank numbers are drawn around the board.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: The game, as an integer or a string of 1 to 16 digits.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: The opponent's user name, as in the game record or as it is now, without regard to case. It may not be blank.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: What the report is about.
        comment:
          type:
            - string
            - 'null'
          description: Optional. At most 500 characters once control characters (other than tab and line feed) are removed and the text is trimmed.
    AccountExport:
      type: object
      description: Everything the server keeps about the account (times in epoch ms).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: When the export was made.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: What the file holds and leaves out, in plain English for the player.
          items:
            type: string
        account:
          description: The account view of `GET /account/me`, with `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: The address of the linked Google account, or `null`.
        ratings:
          type: array
          description: The full rating records.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Rating points given back after an opponent was found cheating, added up per UTC day and category, newest first. Neither the games nor the cheaters are named.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Every stored session, newest first, without any token. The retention purge deletes an expired session, and a signed-out one a day after the sign-out.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: The security events, newest first, kept `RETENTION_SECURITY_DAYS`.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Every sanction, lifted ones included. The moderator's name is never included.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: The conduct events recorded for the player's abandoned, aborted and no-show games, kept 30 days.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: The reports the player made.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: The number of games.
            list:
              type: array
              description: Every game, newest first, as summaries of `GET /account/games`. Moves are at `GET /games/{id}` and the PGN at `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: A full rating record.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Whether the player has left the unrated phase.
            countedGames:
              type: integer
              minimum: 0
              description: The games that entered the rating.
            updatedAt:
              type: integer
              format: int64
              description: When the record last changed.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: 00:00 UTC of the day (epoch ms).
        category:
          type: string
        points:
          type: integer
          description: The points given back that day in that category.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: When the session was signed out, or `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: The address of the sign-in, erased after `RETENTION_IP_DAYS`.
    SecurityEvent:
      type: object
      description: |-
        A security event. `ip` is given only for what was done while signed in, with the account's password (and second factor) or with a link mailed to its address: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` and `account_exported`; every other kind has `ip: null`, and `ip` is erased after `RETENTION_IP_DAYS`.

        `detail` keeps only these fields: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` and `method` (`password`, or `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` and `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. A `moderator_action` event keeps only `{ action }`, for the actions `ban`, `unban`, `reset_mfa`, `verify_email` and `revoke_sessions` (the other moderator actions are left out). Every other kind has `detail: null`. The `rating_refund` events are left out: their points are in `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: The kind of event (`login`, `password_changed`...).
        at:
          type: integer
          format: int64
          description: When it happened.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: The reported player's current public name.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Whether the report is still open (whether the reported player was sanctioned is not said).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: The token of the e-mail link (the hidden field of the page's form).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: The token of the reset link (the hidden field of the form).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: The new password; the password rules of registration apply.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: The new password again; it must be the same.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: An HTML page in UTF-8 (`text/html; charset=utf-8`), without JavaScript or external resources.
