    description: The account view, its preferences and its password.
  - name: two-step-verification
    x-displayName: Two-step verification
    description: Authenticator apps (TOTP, RFC 6238), with SHA-1, 6 digits, 30-second steps and one step of tolerance either way, plus single-use recovery codes.
  - name: email-change
    x-displayName: E-mail address change
    description: Changing the address of the account, confirmed with a link sent to the new address.
  - name: data-export
    x-displayName: Data export
    description: Everything the server keeps about the account, as one JSON file.
  - name: account-deletion
