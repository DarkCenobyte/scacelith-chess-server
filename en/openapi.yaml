        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required` (neither `code` nor `recoveryCode`, checked before the password), `invalid_password`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (failed re-authentications, or too many codes tried on this account), or `rate_limited` (the `reauth` or `reauth_user` limit, the account budget, the password hash queue).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (the password hash queue, or the database stayed locked), `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
  /account/mfa/recovery-codes:
