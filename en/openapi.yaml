        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (the database stayed locked; `retryAfter: 1` in the body, no `Retry-After` header), `server_busy` (the session lookup found the database locked), `timeout`.'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: Get the top players of a category
      description: |-
        The top 100 rated records of an official category with at least `minGames` (`PROVISIONAL_GAMES`) counted games, deleted accounts and confirmed cheaters left out. The server computes each board again at most every 10 seconds; `updatedAt` says when. One computation of a category runs at a time: meanwhile the other requests get the previous list, or wait for the computation when there is none yet.

        **Limits:** only the per-address layer.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: An official category id (`3+2`, or `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: How many players, 1 to 100. A larger number of up to 3 digits counts as 100; an empty value counts as absent.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: The board.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (missing, or not an official category), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: the per-address layer.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (the database stayed locked; `retryAfter: 1` in the body, no `Retry-After` header), `timeout`.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Report the opponent of a recent game
      description: |-
        Reports the opponent of one of the player's own games that ended within the last 7 days. A report never changes a rating, a sanction or an integrity level by itself. It raises the review priority that moderators see, and, except for `abuse`, it asks for the engine analysis of the game.

        A report of the same opponent for the same game gets the same answer and changes nothing; the answer never tells anything about the reported account. `GET /games/{id}` tells the game's players beforehand whether a report would be taken (`reportable`).

        This endpoint checks its body itself, in the order `gameId`, `reported`, `category`, `comment`: a failure answers 400 `invalid_request` without `field`. Fields it does not know are ignored.

        **Limits:** `reports` (per player), then `REPORTS_PER_DAY` (5) reports per player in 24 hours (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: The report is received (or was already filed).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (without `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: not the opponent of the reporter in a game that ended within the last 7 days.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, with a `Retry-After` header): `REPORTS_PER_DAY` reports in the last 24 hours. `rate_limited`: the `reports` limit or the account budget.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (the session lookup found the database locked), `timeout`. Also `server_busy` with `retryAfter` 2 to 5: the database has too many writes waiting, and the request was not run.'
