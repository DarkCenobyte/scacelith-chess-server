                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                next: 4100000000001
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_cursor` (`before` non è un id di partita), `invalid_limit` (questi due senza `field`).'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: è stato inviato un token e non è valido.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: il giocatore non esiste, o l’account è stato eliminato.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il limite `public_read` o il budget dell’account.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (il database è rimasto bloccato; `retryAfter: 1` nel corpo, nessun header `Retry-After`), `server_busy` (la verifica della sessione ha trovato il database bloccato), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: Ottieni i migliori giocatori di una categoria
      description: |-
        I 100 migliori record di punteggio classificati di una categoria ufficiale con almeno `minGames` (`PROVISIONAL_GAMES`) partite conteggiate, esclusi gli account eliminati e i bari accertati. Il server ricalcola ogni classifica al massimo ogni 10 secondi; `updatedAt` indica quando. Per una categoria è in corso un solo calcolo alla volta: nel frattempo le altre richieste ricevono la lista precedente, o attendono il calcolo quando non ce n’è ancora una.

        **Limiti:** solo il livello per indirizzo.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: L’id di una categoria ufficiale (`3+2`, o `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: Quanti giocatori, da 1 a 100. Un numero più grande di al massimo 3 cifre vale 100; un valore vuoto equivale a un parametro assente.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: La classifica.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (mancante, o non è una categoria ufficiale), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il livello per indirizzo.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (il database è rimasto bloccato; `retryAfter: 1` nel corpo, nessun header `Retry-After`), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Segnala l’avversario di una partita recente
      description: |-
        Segnala l’avversario di una delle partite del giocatore stesso terminata negli ultimi 7 giorni. Una segnalazione da sola non cambia mai un punteggio, una sanzione o un livello di integrità. Alza la priorità di revisione che vedono i moderatori e, tranne che per `abuse`, richiede l’analisi della partita con il motore.

        Una segnalazione dello stesso avversario per la stessa partita riceve la stessa risposta e non cambia nulla; la risposta non rivela mai nulla sull’account segnalato. `GET /games/{id}` indica in anticipo ai giocatori della partita se una segnalazione verrebbe accettata (`reportable`).

        Questo endpoint verifica da sé il proprio corpo, nell’ordine `gameId`, `reported`, `category`, `comment`: un errore risponde 400 `invalid_request` senza `field`. I campi che non conosce vengono ignorati.

        **Limiti:** `reports` (per giocatore), poi `REPORTS_PER_DAY` (5) segnalazioni per giocatore in 24 ore (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: La segnalazione è stata ricevuta (o era già stata presentata).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (senza `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: non è l’avversario di chi segnala in una partita terminata negli ultimi 7 giorni.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, con un header `Retry-After`): `REPORTS_PER_DAY` segnalazioni nelle ultime 24 ore. `rate_limited`: il limite `reports` o il budget dell’account.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la verifica della sessione ha trovato il database bloccato), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
