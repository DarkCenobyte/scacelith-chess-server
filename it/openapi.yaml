  - name: games
    x-displayName: Partite e PGN
    description: |-
      Le registrazioni delle partite, con le loro mosse e i loro orologi, e i relativi file PGN.

      **Codici delle partite.** `status`: 1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (vengono memorizzate solo le partite terminate). `result`: `1-0`, `0-1`, `1/2-1/2` o `*` (annullata). `reason`, con il suo nome (`termination`) e le parole che chiudono il testo delle mosse del file PGN (in inglese nel file, seguite qui dalla traduzione); i codici 7, 14 e 21 sono patte (il giocatore che ha esaurito il tempo, ha abbandonato o ha lasciato la partita aveva di fronte un avversario che non poteva dare matto: FIDE 6.9 e 5.1.2; `DESIGN.md` 6.3 riporta la regola), e il server non termina mai una partita con i codici 4 e 13 (appartengono all’elenco comune dei motivi):

      | Codice | `termination` | Parole nel PGN |
      |---|---|---|
      | 1 | `Checkmate` | Checkmate — scacco matto |
      | 2 | `Resignation` | Resignation — abbandono |
      | 3 | `Timeout` | Loss on time — sconfitta per tempo |
      | 4 | `IllegalMoves` | Second illegal move (forfeit) — seconda mossa illegale (partita persa) |
      | 5 | `Stalemate` | Stalemate — stallo |
      | 6 | `InsufficientMaterial` | Dead position (insufficient material) — posizione morta (materiale insufficiente) |
      | 7 | `TimeoutVsInsufficient` | Flag fall, but the opponent cannot checkmate — bandierina caduta, ma l’avversario non può dare matto |
      | 8 | `FivefoldRepetition` | Fivefold repetition — quintuplice ripetizione |
      | 9 | `SeventyFiveMoves` | 75-move rule — regola delle 75 mosse |
      | 10 | `ThreefoldClaim` | Threefold repetition (claimed) — triplice ripetizione (reclamata) |
      | 11 | `FiftyMoveClaim` | 50-move rule (claimed) — regola delle 50 mosse (reclamata) |
      | 12 | `Agreement` | Draw by agreement — patta per accordo |
      | 13 | `IllegalMovesVsInsufficient` | Second illegal move, but the opponent cannot checkmate — seconda mossa illegale, ma l’avversario non può dare matto |
      | 14 | `ResignationVsInsufficient` | Resignation, but the opponent cannot checkmate — abbandono, ma l’avversario non può dare matto |
      | 20 | `Abandonment` | Abandoned (disconnected for too long) — partita lasciata (disconnessione troppo lunga) |
      | 21 | `AbandonmentVsInsufficient` | Abandoned, but the opponent cannot checkmate — partita lasciata, ma l’avversario non può dare matto |
      | 22 | `Aborted` | Game aborted — partita annullata |
      | 23 | `NoShow` | Aborted: first move not played in time — annullata: prima mossa non giocata in tempo |
      | 24 | `Forfeit` | Forfeit (fair play violation) — sconfitta a tavolino (violazione del fair play) |
      | 25 | `ServerAborted` | Aborted by the server — annullata dal server |
      | 26 | `BothDisconnected` | Aborted: both players disconnected — annullata: entrambi i giocatori disconnessi |

      Il codice 14 è nuovo nella versione minore 1 del protocollo: un client scritto prima di essa dovrebbe mostrare un codice sconosciuto come una semplice fine della partita, con il suo `result`.
  - name: gifs
    x-displayName: GIF animate
    description: |-
      Una partita come GIF animata, da conservare o da condividere: la scacchiera vista dall’alto, un fotogramma per posizione dall’inizio alla posizione finale, i nomi e i punteggi dei giocatori sopra la scacchiera, l’ultima mossa sotto di essa e, nell’ultimo fotogramma, il risultato e il modo in cui la partita è terminata.

      **Costo, cache e quote.** Una GIF viene creata su un thread di rendering dedicato, mai sui thread che eseguono le partite, e con la priorità di CPU più bassa: `GIF_THREADS` thread (`WORKERS` per impostazione predefinita), avviati con la prima GIF e arrestati dopo un minuto senza GIF. Fino a `GIF_QUEUE_MAX` (4 × `WORKERS`) GIF attendono un thread, al massimo `GIF_QUEUE_TIMEOUT_MS` (10 s) ciascuna; un rendering può durare `GIF_RENDER_TIMEOUT_MS` (30 s). Il server conserva le GIF che ha creato in una cache di `GIF_CACHE_MB` MB (32 × `WORKERS`), da cui escono per prime quelle usate meno di recente; una GIF presa dalla cache, o una in corso di creazione per un’altra richiesta, non costa alcun rendering. La chiave della cache comprende tutto ciò che cambia l’immagine, nomi compresi.

      Ogni richiesta conta in `gif` (30 al minuto per giocatore per entrambi gli endpoint). Una GIF che deve essere creata conta anche nei limiti di rendering: per giocatore, `GIF_USER_RENDERS_PER_MIN` (4) al minuto e `GIF_USER_RENDERS_PER_HOUR` (30) all’ora; per client, tutti i suoi account insieme, `GIF_IP_RENDERS_PER_MIN` (12) al minuto e `GIF_IP_RENDERS_PER_HOUR` (120) all’ora, e 3 volte tanto per /48 IPv6. Un client dovrebbe conservare il file che ha scaricato anziché richiederlo di nuovo, e attendere `retryAfter` dopo un 429 o un 503.

      Dimensioni: `small` (case da 32 px: 284 × 350 pixel), `medium` (48 px: 424 × 515), `large` (72 px: 628 × 762); senza coordinate 268 × 342, 400 × 503 e 600 × 748. La posizione iniziale resta visibile per almeno 1 s (o per il ritardo, se è più lungo), la posizione finale per 3 s, e la GIF si ripete in loop; dopo il primo fotogramma viene memorizzata solo la parte dell’immagine che cambia. Una partita di 40 mosse occupa circa 135, 205 e 325 KiB (small, medium, large), una partita di 150 mosse 0,5 MiB, 0,8 MiB e 1,2 MiB.
