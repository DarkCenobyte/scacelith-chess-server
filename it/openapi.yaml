      summary: Conferma il nuovo indirizzo e-mail
      description: |-
        Il modulo della pagina di cambio dell’e-mail. L’indirizzo cambia e risulta confermato; i dispositivi restano connessi; i link inviati in precedenza (conferma, reimpostazione della password, altri cambi) smettono di funzionare; il vecchio indirizzo viene informato, con il nuovo mascherato.

        **Limite:** `auth`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: lZ50AvPxUwbGqQCwWPIO28ONray7SzW0Cl_sLImwF3Q
          application/json:
            schema:
              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: lZ50AvPxUwbGqQCwWPIO28ONray7SzW0Cl_sLImwF3Q
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: L’indirizzo è stato cambiato.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Il link non è valido, è già stato usato o è scaduto, oppure il modulo non è valido (una pagina HTML).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '409':
          $ref: '#/components/responses/HtmlConflict'
          description: Nel frattempo un altro account ha preso l’indirizzo (una pagina HTML).
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Il limite `auth` (una pagina HTML), o il livello per indirizzo (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'Il database è rimasto bloccato (`Retry-After: 1`), o il server è molto in ritardo (`Retry-After` da 2 a 5, vedi l’introduzione): non è cambiato nulla e il link funziona ancora. Anche il timeout del gestore delle richieste.'
  /healthz:
    servers:
      - url: https://caissa.scacelith.com
        description: Il server ufficiale, nella radice.
      - url: https://caissa.scacelith.com/api/v1
        description: Il server ufficiale, sotto `/api/v1`.
      - url: https://{host}:{port}
        description: Qualsiasi server Scacelith, nella radice.
        variables:
          host:
            default: caissa.scacelith.com
            description: Il nome host pubblico del server (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: La porta pubblica dell’API (`PUBLIC_API_PORT`, altrimenti `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Qualsiasi server Scacelith, sotto `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: Il nome host pubblico del server (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: La porta pubblica dell’API (`PUBLIC_API_PORT`, altrimenti `API_PORT`).
    get:
      operationId: getLiveness
      tags:
        - health
      summary: Verifica che il processo sia in esecuzione
      description: |-
        Risponde 200 `ok` finché il processo è in esecuzione. Funziona anche `HEAD`. Qualsiasi altro metodo risponde 405 `method_not_allowed` con `Allow: GET, HEAD` (compreso `OPTIONS`).

        **Limiti:** solo il livello per indirizzo.
      security: []
      responses:
        '200':
          description: Il processo è in esecuzione.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
              example:
                status: ok
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il livello per indirizzo.'
  /readyz:
    servers:
      - url: https://caissa.scacelith.com
        description: Il server ufficiale, nella radice.
      - url: https://caissa.scacelith.com/api/v1
        description: Il server ufficiale, sotto `/api/v1`.
      - url: https://{host}:{port}
        description: Qualsiasi server Scacelith, nella radice.
        variables:
          host:
            default: caissa.scacelith.com
            description: Il nome host pubblico del server (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: La porta pubblica dell’API (`PUBLIC_API_PORT`, altrimenti `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Qualsiasi server Scacelith, sotto `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: Il nome host pubblico del server (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: La porta pubblica dell’API (`PUBLIC_API_PORT`, altrimenti `API_PORT`).
    get:
      operationId: getReadiness
      tags:
        - health
      summary: Verifica che il server accetti giocatori
      description: |-
        Risponde 200 `ready` quando il server accetta giocatori, e 503 `not_ready` mentre si avvia o si arresta. Funziona anche `HEAD`. Qualsiasi altro metodo risponde 405 `method_not_allowed` con `Allow: GET, HEAD` (compreso `OPTIONS`).

        **Limiti:** solo il livello per indirizzo.
      security: []
      responses:
        '200':
          description: Il server accetta giocatori.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il livello per indirizzo.'
        '503':
          description: Il server si sta avviando o arrestando.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Un token di sessione (`sct_` seguito da 43 caratteri base64url) ottenuto da una risposta di accesso, nell’header `Authorization`: `Authorization: Bearer <token>`. Il prefisso è esattamente `Bearer` (con distinzione tra maiuscole e minuscole) seguito da uno spazio; un valore che non lo ha, o un token che non è composto da 1 a 512 caratteri ASCII stampabili, risponde 401 `invalid_token` come qualsiasi altro token non valido. Un header vuoto equivale a nessun header.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: L’id della partita, un intero decimale positivo di al massimo 16 cifre senza zeri iniziali, inferiore a 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: L’id della sessione, come lo fornisce `GET /auth/sessions`, scritto senza zeri iniziali (`03` non è la sessione 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Il nome utente del giocatore, senza distinzione tra maiuscole e minuscole. Il server accetta qualsiasi nome composto da 2 a 24 caratteri di `[A-Za-z0-9_.-]` (la regola più ampia che abbia mai consentito).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Un id di partita; vengono elencate solo le partite più vecchie. Passa il `next` della pagina precedente. Un valore vuoto equivale a un parametro assente.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: La dimensione della pagina, da 1 a 50. Un numero più grande di al massimo 3 cifre vale 50; un valore vuoto equivale a un parametro assente.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: Il token del link dell’e-mail (43 caratteri base64url). Un token mancante o errato mostra la pagina «link invalid or expired» (link non valido o scaduto).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Ogni risposta del server vieta la memorizzazione nella cache.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: I secondi da attendere prima di riprovare; lo stesso valore di `retryAfter` nel corpo.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Il challenge bearer, con `error="invalid_token"` per un token non valido.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Il server chiude la connessione dopo questa risposta.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (con `field` quando l’errore riguarda un campo del corpo) o `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Un campo viola lo schema
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Il corpo non è JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Una password debole
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: Un PGN illeggibile
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (nessun header `Authorization`) o `invalid_token` (il token è malformato, scaduto, revocato, o appartiene a un account eliminato).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Nessuna sessione
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Un token non valido
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: La richiesta è rifiutata.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Una password errata alla riautenticazione
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Un account sospeso
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found`, o una funzionalità che questo server ha disattivato.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: il corpo non è arrivato entro 10 secondi. Il server chiude la connessione.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: La richiesta è in conflitto con lo stato del server.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: il tentativo di accesso con Google o il ticket è sconosciuto, già usato o scaduto; ricomincia l’accesso.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: il corpo supera `HTTP_BODY_LIMIT` (16.384 byte per impostazione predefinita). Il server chiude la connessione.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: la destinazione della richiesta supera 4096 caratteri.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: il corpo non è `application/json`, o il suo charset non è UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: la partita ha più di `GIF_MAX_PLIES` (600) semimosse.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: risolvi il challenge `pow` e invia di nuovo la stessa richiesta con `pow: { challenge, nonce }`. `reason` indica il motivo: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` o `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (un limite di frequenza, il budget dell’account, o la coda di hashing delle password) o `too_many_attempts` (una limitazione dell’account), con `retryAfter` e un header `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Un limite di frequenza
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Troppi tentativi falliti su questo account
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: un errore imprevisto. Il server lo registra nei log.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: uno `state` o un `iss` errato, oppure Google ha rifiutato il codice o ha inviato un ID token che non supera la verifica (compreso un codice o un ID token dell’altro client, quello del gioco o quello del sito web). Non riporta mai il testo di Google.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` o `timeout`: riprova dopo `retryAfter`, quando è indicato.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Il server è occupato
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Il database è rimasto bloccato (una lettura)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Il server ha impiegato troppo tempo
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: La GIF animata, come allegato.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` per una partita di questo server, `attachment; filename="scacelith-game.gif"` per un PGN inviato con `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: La dimensione del file in byte.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: Una pagina HTML.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: Una pagina HTML che spiega il rifiuto.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Il modulo non è arrivato entro 10 secondi (una pagina HTML). Il server chiude la connessione.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: Una pagina HTML che spiega il conflitto.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Il modulo supera `HTTP_BODY_LIMIT` (una pagina HTML). Il server chiude la connessione.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Il corpo non è né un modulo (`application/x-www-form-urlencoded`) né JSON, o il suo charset non è UTF-8 (una pagina HTML).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Un limite di frequenza (una pagina HTML), con `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Un errore imprevisto (una pagina HTML intitolata «Server error», errore del server). Il server lo registra nei log.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Il server è occupato (il database è rimasto bloccato, o il server è molto in ritardo; con `Retry-After`) o ha impiegato troppo tempo (una pagina HTML intitolata «Server error», errore del server).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: L’unica forma di ogni risposta di errore dell’API JSON.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Il codice di errore in `snake_case`. È in base a questo che un client sceglie cosa mostrare.
          examples:
            - rate_limited
        message:
          type: string
          description: Una frase in inglese, destinata ai log e come ripiego.
        retryAfter:
          type: integer
          minimum: 1
          description: I secondi da attendere prima di riprovare; il campo è presente solo nei rifiuti che cessano con il passare del tempo. La risposta porta allora anche un header `Retry-After` con lo stesso valore, tranne il 503 `busy` delle letture dello storico, delle partite, dei giocatori e della classifica.
        field:
          type: string
          description: Il campo o il parametro di query che ha causato l’errore (`invalid_request`, `invalid_option`, e `invalid_cursor`, `invalid_limit` e `invalid_filter` di `GET /account/games`). Un campo annidato si scrive con il punto (`pow.nonce`).
        reason:
          type: string
          description: 'Il motivo: la regola che un `weak_password` viola, o perché una proof of work è stata richiesta o rifiutata (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Solo `banned`: la fine della sospensione (ms dall’epoca Unix), `null` per una sospensione permanente.'
        line:
          type: integer
          minimum: 1
          description: 'Solo `invalid_pgn`: la riga dell’errore, a partire da 1.'
        column:
          type: integer
          minimum: 1
          description: 'Solo `invalid_pgn`: la colonna dell’errore, a partire da 1, in caratteri.'
    PowChallenge:
      type: object
      description: Un challenge di proof of work (il `pow` di un 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Il challenge firmato, da rinviare così com’è.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Il numero di bit zero iniziali che `SHA-256(challenge + ":" + nonce)` deve avere.
        expiresAt:
          type: integer
          format: int64
          description: Quando scade il challenge (ms dall’epoca Unix), 2 minuti dopo la sua emissione.
    PowAnswer:
      type: object
      description: La risposta a un challenge di proof of work.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: Il `challenge` della risposta 428, così come è stato fornito.
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Una stringa decimale di al massimo 20 cifre tale che `SHA-256(challenge + ":" + nonce)` inizi con `bits` bit zero.
    ServerInfo:
      type: object
      description: Ciò che serve a un client prima di accedere o di connettersi.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Il nome del server (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: Un UUID che il database riceve al primo avvio. Resta lo stesso tra un riavvio e l’altro. È `null` quando il database non può fornirlo.
        motd:
          type: string
          description: Il messaggio del giorno (`SERVER_MOTD`), eventualmente vuoto.
        protocol:
          type: object
          description: Il protocollo WebSocket (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: La versione del protocollo più vecchia che il server supporta.
            max:
              type: integer
              minimum: 1
              description: La versione del protocollo più recente che il server supporta.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'L’impronta dello schema del protocollo (i primi 4 byte dello SHA-256 della sua forma canonica, come intero senza segno: `0xc649140f`, 3326678031, per la versione minore 2 del protocollo); solo informativa, mai confrontata.'
            subprotocol:
              type: string
              description: Il token del sottoprotocollo WebSocket (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: La porta WebSocket usata dai giocatori (`PUBLIC_WS_PORT`, altrimenti `WS_PORT`, altrimenti `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: Il percorso del WebSocket.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Se è possibile creare nuovi account.
        emailVerification:
          type: boolean
          description: Se i nuovi account confermano il proprio indirizzo (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Se l’accesso con Google è offerto al gioco.
            googleWeb:
              type: boolean
              description: Se l’accesso con Google è offerto anche a un sito web (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: L’autenticazione a due fattori è sempre disponibile.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: I bit di proof of work richiesti dalla registrazione (0 se nessuno).
        categories:
          type: array
          description: Le cadenze ufficiali, quelle classificate (`RATED_CATEGORIES`), nell’ordine del server. Qualsiasi altra cadenza è `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Le regole che un client può verificare prima di inviare un modulo.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: La lunghezza minima del nome utente (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: La lunghezza massima del nome utente (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: L’espressione regolare a cui deve corrispondere un nuovo nome utente.
            passwordMinLength:
              type: integer
              description: La lunghezza minima della password, in caratteri (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: La lunghezza massima della password, in byte UTF-8.
            customTimeControls:
              type: boolean
              description: Se le sfide e le partite private possono usare cadenze personalizzate.
            reportsPerDay:
              type: integer
              description: Quante segnalazioni un giocatore può presentare ogni 24 ore (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: La dimensione massima di un messaggio WebSocket che un client può inviare, in byte.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Una cadenza ufficiale.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: L’id della categoria, minuti e secondi di incremento (`3+2`).
        baseSec:
          type: number
          minimum: 0
          description: Il tempo base, in secondi.
        incSec:
          type: number
          minimum: 0
          description: L’incremento per mossa, in secondi.
    AccountView:
      type: object
      description: L’account come lo vede il suo giocatore (il campo `user` delle risposte di accesso e di `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: L’id dell’account.
        username:
          type: string
          description: Il nome utente.
        email:
          type: string
          format: email
          description: L’indirizzo e-mail.
        emailVerified:
          type: boolean
          description: Se l’indirizzo è confermato.
        mfaEnabled:
          type: boolean
          description: Se l’autenticazione a due fattori è attiva.
        googleLinked:
          type: boolean
          description: Se è collegato un account Google.
        hasPassword:
          type: boolean
          description: '`false` per un account creato tramite Google che non ha ancora impostato una password.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Se le sfide dirette per nome vengono accettate (vedi `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Quando è stato creato l’account (ms dall’epoca Unix).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: L’ultimo accesso (ms dall’epoca Unix), o `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Il nuovo indirizzo di un cambio di e-mail in attesa del suo link, o `null`.
    SessionAnswer:
      type: object
      description: Una nuova sessione.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Il token di sessione, per l’header `Authorization` e il WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: La scadenza assoluta della sessione (ms dall’epoca Unix); il limite di inattività può terminarla prima.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Il secondo passaggio di un accesso con autenticazione a due fattori; continua con `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Il token del passaggio, per `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: I secondi rimasti per completare il passaggio.
    LoginAnswer:
      description: Una sessione, o il secondo passaggio di un accesso con autenticazione a due fattori.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Un primo accesso con Google; continua con `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Il ticket per `POST /auth/sso/complete`, valido per 10 minuti.
        suggestedUsername:
          type: string
          description: Un nome utente ricavato dal nome Google o dall’indirizzo, o `""` quando nessuno è adatto.
    SsoNeedsPassword:
      type: object
      description: Un account con password usa l’indirizzo; continua con `POST /auth/sso/google/link`. Non è ancora stato collegato nulla.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Il ticket per `POST /auth/sso/google/link`.
        username:
          type: string
          description: Il nome utente di quell’account (lo vede solo chi ha dimostrato a Google di possedere l’indirizzo).
        expiresIn:
          type: integer
          const: 600
          description: I secondi per cui il ticket resta valido.
    SsoFinishAnswer:
      description: La risposta di `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Un tentativo di accesso con Google.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Il tentativo, per `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: L’URL di Google da aprire nel browser di sistema, dopo averlo verificato.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Lo `state` che Google deve rinviare.
        expiresIn:
          type: integer
          const: 600
          description: I secondi per cui il tentativo resta valido.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Il nome utente; poi si applicano le regole del server (vedi la descrizione).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: L’indirizzo e-mail. Privato degli spazi iniziali e finali e salvato in minuscolo.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: La password; poi si applicano le regole delle password.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Il nome utente, o l’indirizzo e-mail (qualsiasi testo con `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Facoltativo. Mostrato nell’elenco dei dispositivi connessi (ad esempio `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: Il `mfaToken` della risposta di accesso (o di quella di un accesso con Google).
        code:
          type: string
          maxLength: 32
          description: Facoltativo. Un codice a 6 cifre dell’app di autenticazione, o un codice di recupero.
        recoveryCode:
          type: string
          maxLength: 32
          description: Facoltativo. Un codice di recupero. È necessario uno tra `code` e `recoveryCode`.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: L’indirizzo e-mail.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Il parametro `token` del link di reimpostazione.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: La nuova password; si applicano le regole della registrazione per le password.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Il challenge PKCE S256 del `codeVerifier` del client (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: La porta del listener del client su `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Il challenge PKCE S256 del `codeVerifier` della pagina (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: L’`attemptId` di `POST /auth/sso/google/start`.
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: Il verifier PKCE; il suo SHA-256 deve corrispondere al challenge fornito a `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Lo `state` così come Google lo ha rinviato.
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: Il `code` così come Google lo ha rinviato (ASCII stampabile senza spazi).
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Facoltativo. L’`iss` così come Google lo ha rinviato, quando lo ha fatto.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: Il `linkTicket` di `finish`, valido per 10 minuti.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: La password dell’account.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: Lo `ssoTicket` di `finish`, valido per 10 minuti.
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Il nome utente; si applicano le regole della registrazione.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Le sessioni attive, a partire da quella usata più di recente.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Una sessione attiva (un dispositivo connesso).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: L’id della sessione, per `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: L’accesso (ms dall’epoca Unix).
        lastSeenAt:
          type: integer
          format: int64
          description: L’ultimo utilizzo (ms dall’epoca Unix), aggiornato al massimo ogni 5 minuti (più tardi mentre il server è molto in ritardo).
        expiresAt:
          type: integer
          format: int64
          description: La scadenza assoluta (ms dall’epoca Unix); il limite di inattività può terminare la sessione prima.
        clientLabel:
          type:
            - string
            - 'null'
          description: Il `clientLabel` dell’accesso, o `null` quando non ne è stato inviato nessuno.
        current:
          type: boolean
          description: Se questa è la sessione che fa la richiesta.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Un record per ogni categoria in cui il giocatore ha giocato partite classificate.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Le sanzioni attive.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }` durante una sospensione, altrimenti `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Il record di punteggio di una categoria.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: L’id della categoria.
        rating:
          type: integer
          description: Il punteggio.
        games:
          type: integer
          minimum: 0
          description: Le partite giocate nella categoria (conteggiate o no).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Il punteggio più alto raggiunto.
        provisional:
          type: boolean
          description: '`true` finché il punteggio è ancora non classificato o ha meno di `PROVISIONAL_GAMES` partite conteggiate (il gioco lo mostra come `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Il tipo di sanzione.
        reason:
          type:
            - string
            - 'null'
          description: Il motivo indicato, se presente.
        startsAt:
          type: integer
          format: int64
          description: L’inizio (ms dall’epoca Unix).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: La fine (ms dall’epoca Unix), `null` quando la sanzione è permanente.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: La fine della sospensione (ms dall’epoca Unix), `null` se è permanente.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` per accettare le sfide dirette per nome, `none` per rifiutarle.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: La password attuale.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: La nuova password; si applicano le regole della registrazione per le password.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: La password dell’account.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Un codice del segreto in attesa, esattamente 6 cifre.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: La password dell’account.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Facoltativo; necessario con l’autenticazione a due fattori (o `recoveryCode`). Un codice dell’app di autenticazione, o un codice di recupero.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Facoltativo. Un codice di recupero (`xxxx-xxxx-xx`; maiuscole e minuscole, spazi e trattini non contano).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: La password dell’account.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Un codice dell’app di autenticazione (un codice di recupero viene rifiutato).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Il nuovo indirizzo; privato degli spazi iniziali e finali e convertito in minuscolo, poi verificato come un indirizzo di registrazione.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: La password dell’account.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Facoltativo; necessario con l’autenticazione a due fattori (o `recoveryCode`). Un codice dell’app di autenticazione, o un codice di recupero.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Facoltativo. Un codice di recupero.
    TotpSetup:
      type: object
      description: Il segreto in attesa per l’app di autenticazione.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Il segreto in base32, da inserire nell’app.
        uri:
          type: string
          format: uri
          description: L’URI `otpauth://totp/...`, da mostrare come codice QR.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Secondi per intervallo.
    RecoveryCodeList:
      type: array
      description: I 10 codici di recupero, mostrati solo questa volta. Ognuno funziona una sola volta.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Una delle due parti di una partita.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Il nome nella registrazione della partita (`deleted#<id>` per un account eliminato).
        rating:
          type:
            - integer
            - 'null'
          description: Il punteggio all’inizio, `null` se sconosciuto.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Il punteggio dopo la partita. Una partita classificata lo ha sempre; `null` solo per una partita che non conta per i punteggi (amichevole, a cadenza personalizzata, annullata).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: La variazione del punteggio, `0` quando le regole del punteggio lasciano il punteggio invariato (un risultato di zero punti secondo la regola FIDE, un avversario non classificato, le prime partite di un giocatore non classificato); `null` come `ratingAfter`.
    GameSummary:
      type: object
      description: Il riepilogo di una partita salvata.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: L’id della partita.
        category:
          type: string
          description: L’id della categoria ufficiale (`3+2`), o `custom`.
        rated:
          type: boolean
          description: Se la partita conta per i punteggi.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: La cadenza in secondi (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (vedi i codici delle partite).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Il codice del motivo della fine (vedi i codici delle partite).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Il risultato, `*` per una partita annullata.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Il numero di semimosse.
        startedAt:
          type: integer
          format: int64
          description: L’inizio (ms dall’epoca Unix).
        endedAt:
          type: integer
          format: int64
          description: La fine (ms dall’epoca Unix).
    Termination:
      type: string
      description: Il nome del motivo della fine (vedi i codici delle partite); `Unknown` per un codice che il protocollo non conosce.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Il riepilogo di una partita dal punto di vista di un giocatore.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Il colore del giocatore.
    HistoryGameSummary:
      description: Una partita dello storico del giocatore che ha effettuato l’accesso.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Il tempo base in millisecondi.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: L’incremento in millisecondi.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: L’esito dal punto di vista del giocatore.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Le partite della pagina, dalla più recente.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: L’id da passare come `before` per la pagina successiva, o `null` nell’ultima pagina.
        total:
          type: integer
          minimum: 0
          description: Il numero di partite che corrispondono al filtro, su tutte le pagine.
    MoveRecord:
      type: object
      description: Una semimossa di una partita.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: La mossa in notazione UCI, con `n`, `b`, `r` o `q` aggiunto per una promozione.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Il tempo addebitato per la mossa (ms), `null` quando la registrazione non lo contiene.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: L’orologio di chi ha mosso, dopo la mossa (ms), `null` quando la registrazione non lo contiene.
    PgnTagsView:
      type: object
      description: I principali tag PGN, da mostrare. Qui `Termination` è il nome del motivo della fine; il file PGN usa i valori standard del PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` o `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: La data UTC di inizio.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Il punteggio all’inizio, o `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Il punteggio all’inizio, o `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: La registrazione di una partita con le sue mosse e i suoi orologi. Ha i campi di un riepilogo di partita, senza `color` e `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Il tempo base in millisecondi.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: L’incremento in millisecondi.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: Il nome di `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: L’id della partita di cui questa è la rivincita, o `null`.
            moves:
              type: array
              description: Una voce per semimossa.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Solo quando il giocatore del token ha giocato questa partita; il suo colore.
            reportable:
              type: boolean
              description: Solo quando il giocatore del token ha giocato questa partita; `true` quando `POST /reports` accetterebbe ora una segnalazione dell’avversario per questa partita (la partita è terminata da non più di 7 giorni, la quota giornaliera non è esaurita, e l’avversario non è già stato segnalato per questa partita).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Il nome utente, come lo ha scritto il giocatore.
        createdAt:
          type: integer
          format: int64
          description: Quando è stato creato l’account (ms dall’epoca Unix).
        ratings:
          type: array
          description: Solo le categorie ufficiali, nell’ordine del server.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Tutte le partite salvate, comprese quelle amichevoli e annullate.
            rated:
              type: integer
              minimum: 0
              description: Le partite classificate, sommate sui record di punteggio.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Il nome utente, come lo ha scritto il giocatore.
        games:
          type: array
          description: Le partite della pagina, dalla più recente.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: L’id dell’ultima partita ogni volta che la pagina è piena (la pagina successiva può allora essere vuota), altrimenti `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: L’id della categoria.
        minGames:
          type: integer
          minimum: 0
          description: Le partite conteggiate di cui un record ha bisogno per comparire nell’elenco (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Quando è stata calcolata la classifica (ms dall’epoca Unix).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: Il testo PGN, al massimo 65.536 byte UTF-8. Viene usata solo la prima partita.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Facoltativo. La dimensione dell’immagine.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Facoltativo. Il colore in basso sulla scacchiera.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Facoltativo. Millisecondi per mossa, un numero JSON con valore intero.
        coords:
          type: boolean
          default: true
          description: Facoltativo. Se le lettere delle colonne e i numeri delle traverse vengono disegnati intorno alla scacchiera.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: La partita, come intero o come stringa da 1 a 16 cifre.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Il nome utente dell’avversario, come nella registrazione della partita o com’è ora, senza distinzione tra maiuscole e minuscole. Non può essere vuoto.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: L’oggetto della segnalazione.
        comment:
          type:
            - string
            - 'null'
          description: Facoltativo. Al massimo 500 caratteri, dopo che sono stati rimossi i caratteri di controllo (tranne tabulazione e avanzamento riga) e gli spazi iniziali e finali del testo.
    AccountExport:
      type: object
      description: Tutto ciò che il server conserva sull’account (orari in ms dall’epoca Unix).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Quando è stata fatta l’esportazione.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Cosa contiene il file e cosa esclude, in inglese semplice per il giocatore.
          items:
            type: string
        account:
          description: La vista dell’account di `GET /account/me`, con `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: L’indirizzo dell’account Google collegato, o `null`.
        ratings:
          type: array
          description: I record di punteggio completi.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: I punti restituiti al punteggio dopo che un avversario è stato sorpreso a imbrogliare, sommati per giorno UTC e categoria, dal più recente. Non vengono indicati né le partite né i bari.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Tutte le sessioni salvate, dalla più recente, senza alcun token. La pulizia legata alla conservazione dei dati elimina una sessione scaduta, e una sessione disconnessa un giorno dopo la disconnessione.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Gli eventi di sicurezza, dal più recente, conservati per `RETENTION_SECURITY_DAYS` giorni.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Tutte le sanzioni, comprese quelle revocate. Il nome del moderatore non è mai incluso.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Gli eventi di condotta registrati per le partite del giocatore abbandonate, annullate e con mancata presentazione, conservati per 30 giorni.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Le segnalazioni fatte dal giocatore.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Il numero di partite.
            list:
              type: array
              description: Tutte le partite, dalla più recente, come riepiloghi di `GET /account/games`. Le mosse si trovano in `GET /games/{id}` e il PGN in `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Un record di punteggio completo.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Se il giocatore è uscito dalla fase non classificata.
            countedGames:
              type: integer
              minimum: 0
              description: Le partite entrate nel calcolo del punteggio.
            updatedAt:
              type: integer
              format: int64
              description: Quando il record è cambiato l’ultima volta.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: Le 00:00 UTC del giorno (ms dall’epoca Unix).
        category:
          type: string
        points:
          type: integer
          description: I punti restituiti quel giorno in quella categoria.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Quando la sessione è stata disconnessa, o `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: L’indirizzo dell’accesso, cancellato dopo `RETENTION_IP_DAYS` giorni.
    SecurityEvent:
      type: object
      description: |-
        Un evento di sicurezza. `ip` è indicato solo per ciò che è stato fatto con l’accesso effettuato, con la password dell’account (e il secondo fattore) o con un link inviato al suo indirizzo: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` e `account_exported`; ogni altro tipo ha `ip: null`, e `ip` viene cancellato dopo `RETENTION_IP_DAYS` giorni.

        `detail` conserva solo questi campi: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` e `method` (`password`, o `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` e `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Un evento `moderator_action` conserva solo `{ action }`, per le azioni `ban`, `unban`, `reset_mfa`, `verify_email` e `revoke_sessions` (le altre azioni dei moderatori sono escluse). Ogni altro tipo ha `detail: null`. Gli eventi `rating_refund` sono esclusi: i loro punti si trovano in `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Il tipo di evento (`login`, `password_changed`…).
        at:
          type: integer
          format: int64
          description: Quando è avvenuto.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
