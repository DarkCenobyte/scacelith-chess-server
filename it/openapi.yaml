                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il limite `account` o il budget dell’account.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (il database è rimasto bloccato), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Cambia la password
      description: |-
        Cambia la password. Serve la password attuale, ma nessun secondo fattore, anche con l’autenticazione a due fattori attiva. La nuova password segue le regole della registrazione (verificate dopo la password attuale).

        Il cambio ha questi effetti, in un’unica transazione (tutti o nessuno): revoca tutte le altre sessioni (questa resta connessa), annulla un cambio di e-mail in attesa, rende inutilizzabili i link di reimpostazione della password dell’account e invia un’e-mail al proprietario.

        **Riautenticazione:** solo la password. **Limiti:** `reauth`, poi `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: La password è stata cambiata.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (un account solo Google), `weak_password` (con `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: una password attuale errata, o una reimpostazione o un cambio della password avvenuti mentre la richiesta veniva verificata.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (riautenticazioni fallite dell’account), o `rate_limited` (il limite `reauth` o `reauth_user`, il budget dell’account, la coda di hashing delle password).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: la coda di hashing delle password, o il database è rimasto bloccato (`retryAfter: 1`, non è cambiato nulla). `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Inizia ad attivare l’autenticazione a due fattori
      description: |-
        Salva un nuovo segreto di autenticazione in attesa, che sostituisce un eventuale segreto in attesa precedente, e lo restituisce per l’app di autenticazione (come testo e come URI `otpauth://` da mostrare come codice QR). L’autenticazione a due fattori non è ancora attiva: `POST /account/mfa/totp/enable` la attiva con un codice di questo segreto.

        **Riautenticazione:** solo la password. **Limiti:** `reauth`, poi `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Il segreto in attesa.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (un account solo Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (verificato prima della password).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (riautenticazioni fallite dell’account), o `rate_limited` (il limite `reauth` o `reauth_user`, il budget dell’account, la coda di hashing delle password).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la coda di hashing delle password, o il database è rimasto bloccato), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Completa l’attivazione dell’autenticazione a due fattori e ottieni i codici di recupero
      description: |-
        Attiva l’autenticazione a due fattori con un codice del segreto in attesa (esattamente 6 cifre). Qui la password non viene chiesta: è stata fornita durante la configurazione. La risposta contiene 10 codici di recupero, mostrati solo questa volta.

        **Limiti:** `reauth`, poi `reauth_user`; un codice errato conta tra le riautenticazioni fallite dell’account.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: L’autenticazione a due fattori è attiva.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` non è di esattamente 6 cifre, o il corpo viola lo schema; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: un codice errato (controlla l’ora del dispositivo).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: nessun segreto in attesa (chiama prima `POST /account/mfa/totp/setup`).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (riautenticazioni fallite dell’account), o `rate_limited` (il limite `reauth` o `reauth_user`, il budget dell’account).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (il database è rimasto bloccato), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
