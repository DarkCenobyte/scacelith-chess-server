          description: '`too_many_attempts` (riautenticazioni fallite, o troppi codici provati su questo account), o `rate_limited` (il limite `reauth` o `reauth_user`, il budget dell’account, la coda di hashing delle password).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
