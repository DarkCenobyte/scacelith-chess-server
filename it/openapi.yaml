        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (il database è rimasto bloccato), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Ottieni l’account, i suoi punteggi e le sanzioni attive
      description: |-
        L’account come lo vede il suo giocatore: la vista dell’account (anche il campo `user` di ogni risposta di accesso), un record di punteggio per ogni categoria in cui il giocatore ha giocato partite classificate, le sanzioni attive e la sospensione. Il livello di integrità del sistema anti-cheat non viene mai mostrato.

        **Limite:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: L’account.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`, o `invalid_token` (anche quando l’account è stato eliminato).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il limite `account` o il budget dell’account.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (il database è rimasto bloccato), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Accetta o rifiuta le sfide dirette
      description: |-
        Stabilisce se gli altri giocatori possono sfidare questo giocatore per nome. Con `none`, le sfide dirette vengono rifiutate: lo sfidante viene informato che il giocatore non è disponibile. Nessuna riautenticazione.

        **Limite:** `account`.
      security:
