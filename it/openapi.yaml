    post:
      operationId: submitResetPasswordPage
      tags:
        - pages
      summary: Imposta una nuova password dal modulo di reimpostazione
      description: |-
        Il modulo della pagina di reimpostazione; fa ciò che fa `POST /auth/password/reset`, in un’unica transazione: tutti i dispositivi vengono disconnessi, un cambio di e-mail in attesa viene annullato, gli altri link di reimpostazione smettono di funzionare, l’indirizzo risulta confermato e il proprietario riceve un’e-mail.

        Viene verificato prima il link, poi che le due password siano uguali, poi le regole delle password. Quando il server è occupato, il modulo torna con `Retry-After` e il link resta valido.

        **Limiti:** `auth`, poi `auth_reset` (condiviso con `POST /auth/password/reset`).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: La password è stata cambiata, e tutti i dispositivi sono stati disconnessi.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Di nuovo il modulo con l’errore (le password sono diverse, una password debole), il link non è valido, oppure il modulo non è valido (una pagina HTML).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Il limite `auth` o `auth_reset` (una pagina HTML), di nuovo il modulo con `Retry-After` quando questo client ha troppi hash di password in attesa (il link resta valido), o il livello per indirizzo (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'Di nuovo il modulo con `Retry-After` quando il server è occupato (la coda di hashing delle password, o il database è rimasto bloccato); il link resta valido. Quando il server è molto in ritardo (vedi l’introduzione), invece, una pagina «Server error» (errore del server) con `Retry-After` (da 2 a 5): non è stato eseguito nulla e il link resta valido. Anche il timeout del gestore delle richieste.'
