paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Ottieni il nome, le versioni, le porte e le regole di registrazione del server
      description: |-
        Ciò di cui un client ha bisogno prima di accedere o di connettersi: il nome e l’id del server, le versioni del protocollo WebSocket e dove si trova il WebSocket, le regole di registrazione, le cadenze ufficiali e i limiti che un client può verificare prima di inviare un modulo.

        **Limiti:** solo il livello per indirizzo.
      security: []
      responses:
        '200':
          description: La descrizione del server.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il livello per indirizzo.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Crea un account
      description: |-
        Crea un account: una volta confermato il suo indirizzo e-mail con il link inviato a quell’indirizzo, oppure subito senza conferma via e-mail.

        **Con conferma via e-mail** (`REQUIRE_EMAIL_VERIFICATION`, il valore predefinito): 202 `verification_sent`. Non esiste ancora alcun account: la registrazione resta in attesa per 24 ore e nel frattempo riserva il suo nome utente. Un link valido per quelle 24 ore viene inviato all’indirizzo, al massimo uno per indirizzo ogni 5 minuti (`POST /auth/verify-email/resend` ne invia uno nuovo); l’account viene creato, con l’indirizzo confermato, quando il link viene usato (il pulsante della pagina `/verify-email`), e il giocatore può allora accedere. Fino ad allora un accesso con quel nome utente riceve `invalid_credentials`, come per un account sconosciuto, e il profilo pubblico non esiste. Una nuova registrazione con lo stesso indirizzo sostituisce quella in attesa. La risposta è la stessa quando un altro account usa già l’indirizzo: in tal caso non viene inviato alcun link, il suo proprietario riceve invece un avviso (al massimo uno all’ora), e il nome utente viene riservato allo stesso modo, così che nulla riveli se l’indirizzo ha un account. Una registrazione il cui link non è stato usato viene scartata dopo 24 ore, e il suo nome utente torna libero.

        **Senza conferma via e-mail** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, l’account viene creato subito e può essere usato per accedere.

        **Regole.** `username`: da `USERNAME_MIN` a `USERNAME_MAX` caratteri (da 3 a 20), lettere, cifre, `_` e `-`, con una lettera o una cifra all’inizio (`GET /info` li indica in `limits`); i nomi riservati (`admin`, `moderator`, `deleted`…) e alcuni prefissi vengono rifiutati; unico senza distinzione tra maiuscole e minuscole. `email`: ripulito dagli spazi iniziali e finali e memorizzato in minuscolo, in ASCII semplice, con un dominio che contiene un punto. `password`: almeno `PASSWORD_MIN_LENGTH` (10) caratteri e al massimo 256 byte in UTF-8; non deve contenere il nome utente né la parte locale dell’e-mail, e non deve essere una password comune.

        **Errori**, verificati in questo ordine: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; gli errori della coda di hashing delle password; 409 `email_taken` (solo senza conferma via e-mail).

        **Limiti:** `auth`, poi `auth_register` (10 registrazioni all’ora per client). **Proof of work:** sempre, quando `POW_REGISTER_BITS` è maggiore di 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Primo tentativo, senza proof of work
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Inviata di nuovo con la proof of work
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: L’account è stato creato e può essere usato per accedere (nessuna conferma via e-mail su questo server).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: La registrazione attende il suo link di conferma (oppure l’indirizzo ha già un account; la risposta non lo rivela).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (con `field`), `invalid_json`, `invalid_username`, `invalid_email`, o `weak_password` con `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` o `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: le registrazioni sono chiuse su questo server (`GET /info` indica `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: un account ha già il nome utente, oppure lo riserva una registrazione in attesa di un altro indirizzo. `email_taken`: un altro account usa l’indirizzo (solo senza conferma via e-mail).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il limite `auth` o `auth_register`, o la coda di hashing delle password.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la coda di hashing delle password, o il database è rimasto bloccato), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Accedi con una password
      description: |-
        Effettua l’accesso con un nome utente o un indirizzo e-mail e una password. Le risposte possibili sono due, entrambe con stato 200: una sessione oppure, quando l’autenticazione a due fattori è attiva, un secondo passaggio da completare entro 5 minuti con `POST /auth/login/mfa`.

        Un account sconosciuto, una password errata e un account senza password ricevono la stessa risposta, dopo lo stesso tempo: 401 `invalid_credentials`. Le verifiche dell’account (`banned`, `email_unverified`) avvengono solo dopo una password corretta. A partire da `AUTH_FAILURES_PER_ACCOUNT` (5) tentativi falliti su un nome di accesso, ogni tentativo deve attendere (429 `too_many_attempts`).

        **Limite:** `auth`. **Proof of work:** solo durante un’ondata di accessi falliti (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Una sessione, o il secondo passaggio di un accesso con autenticazione a due fattori.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Accesso effettuato
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Autenticazione a due fattori attiva
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: account sconosciuto, password errata, o account senza password.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Solo dopo una password corretta: `banned`, con `until` (ms dall’epoca Unix, `null` per una sospensione permanente), o `email_unverified` (un account meno recente il cui indirizzo non è ancora confermato).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (l’attesa dopo i tentativi falliti di questo nome di accesso), o `rate_limited` (il limite `auth`, la coda di hashing delle password).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la coda di hashing delle password, o il database è rimasto bloccato), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Completa un accesso con un secondo fattore
      description: |-
        Il secondo passaggio di un accesso con autenticazione a due fattori, dopo che `POST /auth/login` o un accesso con Google (`POST /auth/sso/google/finish` o `POST /auth/sso/google/link`) ha risposto `mfaRequired`. Invia `code` (un codice a 6 cifre dell’app di autenticazione, o un codice di recupero) o `recoveryCode`. Un codice di recupero usato qui non esiste più.

        Un passaggio accetta al massimo 5 codici errati; il passaggio termina anche quando la password viene reimpostata o cambiata. Dopo il passaggio della password di un collegamento con Google, il collegamento viene memorizzato solo quando il codice viene accettato qui.

        **Limiti:** `auth`, e al massimo `AUTH_MFA_PER_ACCOUNT` (10) codici ogni 15 minuti per l’account, da qualsiasi indirizzo; oltre questo numero il codice non viene verificato, così un codice di recupero non viene consumato.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Un codice dell’app di autenticazione
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Un codice di recupero
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Accesso effettuato.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: non è stato inviato né `code` né `recoveryCode`, oppure il corpo viola lo schema; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: il passaggio è scaduto, è già stato usato o è terminato dopo 5 codici errati, oppure la password è stata reimpostata o cambiata dopo il primo passaggio (accedi di nuovo). `invalid_code`: un codice errato o già usato.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (con `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: solo dopo il passaggio della password di un collegamento con Google, nel frattempo l’account Google è stato collegato a un altro account.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: solo dopo il passaggio della password di un collegamento con Google, nel frattempo l’account è cambiato; ricomincia l’accesso.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: l’attesa dopo i tentativi falliti dell’account, oppure i suoi `AUTH_MFA_PER_ACCOUNT` codici degli ultimi 15 minuti sono esauriti. `rate_limited`: il limite `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` con `retryAfter: 1`: il database è rimasto bloccato (dopo un passaggio di collegamento con Google, non è stato collegato nulla: ricomincia l’accesso). `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Disconnetti questa sessione
      description: |-
        Revoca la sessione del token usato. Il WebSocket aperto con essa viene chiuso. Nessun corpo (o `{}`).

        **Limite:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Disconnessione effettuata.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: un corpo diverso da `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il limite `sessions` o il budget dell’account.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (il database è rimasto bloccato), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
