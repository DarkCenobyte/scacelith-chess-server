      description: |-
        Disattiva l’autenticazione a due fattori. Il segreto e i codici di recupero vengono eliminati, e il proprietario riceve un’e-mail.

        **Riautenticazione:** la password e un codice dell’app di autenticazione o un codice di recupero (è obbligatorio uno tra `code` e `recoveryCode`). **Limiti:** `reauth`, poi `reauth_user`.
