  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Scarica una partita come file PGN
      description: |-
        La stessa partita come file PGN: una sola partita con fine riga `\n`, e il testo delle mosse in righe di meno di 80 colonne. La risposta è la stessa con o senza token.

        Tag, in questo ordine: `Event` (`<SERVER_NAME> rated <category>` o `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (la data UTC di inizio), `Round`, `White`, `Black`, `Result` (`*` per una partita annullata), `UTCDate` e `UTCTime` (l’inizio), `WhiteElo` e `BlackElo` (i punteggi all’inizio, o `-`), `WhiteRatingDiff` e `BlackRatingDiff` (le variazioni, come `+10` e `-10`, in ogni partita classificata, `+0` quando le regole del punteggio lasciano il punteggio invariato; una partita amichevole, a cadenza personalizzata o annullata non ha né l’uno né l’altro), `TimeControl` (in secondi), `Termination` (un valore standard del PGN: `normal`; `time forfeit`, una caduta della bandierina, anche quando finisce in patta; `abandoned`; `rules infraction`, una seconda mossa illegale o una sconfitta a forfait per violazione del fair play; `unterminated`, una partita annullata), `PlyCount`, `ScacelithGameId` (l’id decimale).

        Ogni mossa porta `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: l’orologio di chi ha mosso, dopo la mossa, e il tempo addebitato per la mossa, in decimi di secondo (troncati). Un valore viene omesso quando la registrazione non lo contiene. Dopo l’ultima mossa segue il motivo della fine a parole, poi il risultato.

        **Limite:** `public_read` (per giocatore con un token, per client senza).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Il file PGN.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'Il testo PGN, in UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: non è un intero positivo di al massimo 16 cifre (inferiore a 2^53); `invalid_request`: non è una codifica URL valida.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: è stato inviato un token e non è valido.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: la partita non esiste.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il limite `public_read` o il budget dell’account.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: tra gli altri casi, le mosse salvate non si possono rigiocare fino alla conclusione salvata (il server lo registra nei log).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (il database è rimasto bloccato; `retryAfter: 1` nel corpo, nessun header `Retry-After`), `server_busy` (la verifica della sessione ha trovato il database bloccato), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Scarica una partita di questo server come GIF animata
      description: |-
        La partita come GIF animata. I nomi e i punteggi sono quelli della registrazione della partita (i punteggi all’inizio, un account eliminato come `deleted#<id>`), così come il risultato e la conclusione (`Resignation`, `Loss on time`…).

        I controlli avvengono in questo ordine: `gif_disabled`, le opzioni dell’immagine (`size`, `orientation`, `delay`, `coords`), l’id della partita, la partita, la sua lunghezza.

        **Sessione obbligatoria:** le quote si contano per account. **Limiti:** `gif` a ogni richiesta; `gif_user_min`, `gif_user_hour`, `gif_ip_min` e `gif_ip_hour` solo quando la GIF deve essere creata (vedi la descrizione della sezione). **Tempo massimo:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 secondi (45 secondi per impostazione predefinita).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: La dimensione dell’immagine, `small` (case da 32 px), `medium` (48 px) o `large` (72 px).
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Il colore in basso sulla scacchiera.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Millisecondi per mossa (da 1 a 6 cifre decimali).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Se le lettere delle colonne e i numeri delle traverse vengono disegnati intorno alla scacchiera (`1`) o no (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` con `field` (`size`, `orientation`, `delay` o `coords`): un valore non consentito. `invalid_game_id`. `invalid_request`: non è una codifica URL valida.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: la partita non esiste. `gif_disabled`: il server ha disattivato le GIF (`GIF_ENABLED=false`; il gettone `gif` viene restituito).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il limite `gif`, un limite di rendering o il budget dell’account.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: non è stato possibile creare la GIF (il server ne registra il motivo nei log). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` con `retryAfter` (da 3 a 10 secondi) e `Retry-After`: la coda di rendering è piena, o la GIF ha atteso `GIF_QUEUE_TIMEOUT_MS` (10 secondi) un thread libero; tutti i gettoni dei limiti presi dalla richiesta vengono restituiti. `busy`: il database è rimasto bloccato (`retryAfter: 1` solo nel corpo). `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Crea una GIF animata di qualsiasi partita inviata come PGN
      description: |-
        La stessa immagine di `GET /games/{id}/gif` per qualsiasi partita inviata come testo PGN: una partita salvata dal gioco, un’esportazione di un altro sito, una partita scritta a mano. Viene usata solo la prima partita del testo.

        - Il lettore PGN accetta ciò che accetta il lettore del gioco stesso: ogni PGN scritto da questo server e le esportazioni abituali di altri siti (commenti, varianti, NAG e annotazioni dell’orologio vengono ignorati; i numeri delle mosse e la notazione SAN vengono letti con tolleranza; un tag `FEN` dà la posizione iniziale, a meno che `SetUp` sia `"0"`).
        - I nomi e i punteggi provengono dai tag `White`, `Black`, `WhiteElo` e `BlackElo`. Le lettere accentate perdono gli accenti, gli altri caratteri al di fuori dell’ASCII stampabile diventano `?`, e i nomi lunghi vengono troncati (48 caratteri). Il risultato proviene dal tag `Result`, altrimenti dalla fine del testo delle mosse. Il tag `Termination` viene mostrato a meno che sia `normal`: in quel caso è la posizione finale a raccontare com’è finita (scacco matto, stallo).
        - Questo endpoint verifica da sé il proprio corpo: un campo sconosciuto, o un `pgn` mancante o che non è una stringa, risponde 400 `invalid_request` con `field`; un’opzione errata risponde 400 `invalid_option` (`delayMs` deve essere un numero JSON, `coords` un booleano; `null` viene rifiutato).

        **Sessione obbligatoria:** le quote si contano per account. **Limiti:** come per `GET /games/{id}/gif`. **Dimensione massima del corpo:** 135.168 byte, qualunque sia `HTTP_BODY_LIMIT` (il PGN come stringa JSON, compresi i caratteri di escape). **Tempo massimo:** 45 secondi per impostazione predefinita.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Una breve partita digitata, senza coordinate
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: Un file PGN con tutte le opzioni
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` con `field` (un campo sconosciuto, o `pgn` mancante o non stringa; senza `field` quando il corpo non è un oggetto); `invalid_json`; `invalid_option` con `field` (`size`, `orientation`, `delayMs` o `coords`); `invalid_pgn` con `line` e `column` (a partire da 1, colonne in caratteri) e il `message` del lettore: una mossa illegale o ambigua, un tag malformato, una variante di gioco sconosciuta, più di 65.536 byte.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: il server ha disattivato le GIF (`GIF_ENABLED=false`; il gettone `gif` viene restituito).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: un corpo di oltre 135.168 byte.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il limite `gif`, un limite di rendering o il budget dell’account.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: non è stato possibile creare la GIF (il server ne registra il motivo nei log). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` con `retryAfter` (da 3 a 10 secondi) e `Retry-After`: la coda di rendering è piena, o la GIF ha atteso troppo a lungo un thread libero; tutti i gettoni dei limiti presi dalla richiesta vengono restituiti. `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /players/{username}:
    get:
      operationId: getPlayer
      tags:
        - players
      summary: Ottieni il profilo pubblico di un giocatore
      description: |-
        Il profilo pubblico di un giocatore: i punteggi nelle categorie ufficiali (nell’ordine del server) e i conteggi delle partite. `games.total` conta tutte le partite salvate, comprese quelle amichevoli e annullate; `games.rated`, `wins`, `draws` e `losses` sono sommati sui record di punteggio, quindi contano solo le partite classificate. La risposta è la stessa con o senza token.

        **Limite:** `public_read` (per giocatore con un token, per client senza).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Il profilo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
              example:
                username: alice
                createdAt: 1790882839743
                ratings:
                  - category: '3+2'
                    rating: 1510
                    provisional: true
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                games:
                  total: 3
                  rated: 2
                  wins: 1
                  draws: 1
                  losses: 0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`: non è composto da 2 a 24 caratteri di `[A-Za-z0-9_.-]`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: è stato inviato un token e non è valido.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: il giocatore non esiste, o l’account è stato eliminato.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il limite `public_read` o il budget dell’account.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (il database è rimasto bloccato; `retryAfter: 1` nel corpo, nessun header `Retry-After`), `server_busy` (la verifica della sessione ha trovato il database bloccato), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /players/{username}/games:
