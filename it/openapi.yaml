        Le partite recenti del giocatore, dalla più recente, paginate come lo storico ma senza filtri né totale. `color` è il colore di questo giocatore. `next` è l’id dell’ultima partita ogni volta che la pagina è piena, quindi la pagina successiva può essere vuota. Il giocatore viene cercato per primo: un giocatore sconosciuto dà 404 qualunque cosa dica la query.

        **Limite:** `public_read` (per giocatore con un token, per client senza).
      security:
