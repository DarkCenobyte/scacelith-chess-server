  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: Elimina l’account
      description: |-
        Elimina l’account; l’operazione è irreversibile.

        - Tutte le sessioni vengono revocate subito: da quel momento il token riceve 401 `invalid_token`.
        - Il nome utente diventa `deleted#<id>`, nell’account e in ogni registrazione di partita.
        - Vengono cancellati: l’indirizzo e-mail, l’hash della password, il segreto dell’autenticazione a due fattori e i codici di recupero, le sessioni e i token dei link, il collegamento con Google, il record di integrità del sistema anti-cheat e gli indirizzi IP salvati con gli eventi di sicurezza.
        - I punteggi e le partite vengono conservati. Le partite restano leggibili con il nome anonimo, e `GET /players/{username}` risponde 404 per il vecchio nome.

        **Riautenticazione:** la password e, con l’autenticazione a due fattori, un codice dell’app di autenticazione o un codice di recupero. **Limiti:** `reauth`, poi `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: L’account è stato eliminato.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (un account solo Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (riautenticazioni fallite, o troppi codici provati su questo account), o `rate_limited` (il limite `reauth` o `reauth_user`, il budget dell’account, la coda di hashing delle password).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la coda di hashing delle password, o il database è rimasto bloccato), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /account/games:
