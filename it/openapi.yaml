      summary: Disconnetti tutte le sessioni
      description: |-
        Revoca tutte le sessioni dell’account, compresa questa. I WebSocket aperti con esse vengono chiusi. Nessun corpo (o `{}`).

        **Limite:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tutte le sessioni sono state disconnesse.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: un corpo diverso da `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il limite `sessions` o il budget dell’account.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (il database è rimasto bloccato), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Invia di nuovo il link di conferma
      description: |-
        Invia di nuovo il link di conferma dell’e-mail. La risposta è 202 `accepted` qualunque sia l’indirizzo, così da non rivelare mai se un account o una registrazione lo usa.

        Una richiesta ha effetto al massimo una volta ogni 5 minuti per indirizzo. Una registrazione in attesa con quell’indirizzo ottiene di nuovo le sue 24 ore, che un altro account usi o meno l’indirizzo, così che il suo nome utente resti riservato altrettanto a lungo in entrambi i casi. Un link viene inviato solo per quella registrazione quando l’indirizzo non ha alcun account (un nuovo link, valido 24 ore, sostituisce il precedente), oppure per un account attivo e non confermato con quell’indirizzo.

        **Limiti:** `auth`, poi `auth_mail` (10 all’ora per client).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Accettata (qualunque sia l’indirizzo).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il limite `auth` o `auth_mail` (qualunque sia l’indirizzo).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` con `retryAfter: 1`: il database è rimasto bloccato durante la ricerca dell’account o la memorizzazione del link di un account non confermato (il rinnovo di una registrazione in attesa è un tentativo senza garanzia e non fa mai fallire la richiesta); i 5 minuti dell’indirizzo partono comunque, quindi una nuova richiesta entro quel periodo non ha alcun effetto. `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Invia un link di reimpostazione della password
      description: |-
        Invia un link di reimpostazione della password, valido per un’ora, che apre la pagina `/reset-password`. La risposta è 202 `accepted` qualunque sia l’indirizzo. Un link viene inviato solo a un account attivo, al massimo una volta ogni 5 minuti per indirizzo. Un account solo Google imposta in questo modo la sua prima password.

        Il recupero della password ha i limiti più severi dell’API, tutti contati sull’intero server: 3 richieste all’ora (`AUTH_FORGOT_PER_HOUR`) e 10 ogni 24 ore (`AUTH_FORGOT_PER_DAY`) per client (un indirizzo IPv4 o un /64 IPv6), 3 volte tanto per /48 IPv6, oltre al limite `auth` (20 ogni 10 minuti) e all’unica e-mail per indirizzo ogni 5 minuti. Né il 202 né il 429 rivelano se un account usa l’indirizzo. L’impostazione della nuova password ha un proprio limite (`auth_reset`).

        **Limiti:** `auth`, `auth_forgot`, poi `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Accettata (qualunque sia l’indirizzo).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il limite `auth`, `auth_forgot` o `auth_forgot_day` (qualunque sia l’indirizzo).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` con `retryAfter: 1`: il database è rimasto bloccato durante la ricerca dell’account o la memorizzazione del link; i 5 minuti dell’indirizzo partono comunque, quindi una nuova richiesta entro quel periodo non invia alcun link. `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Imposta una nuova password con il token di un link di reimpostazione
      description: |-
        Imposta una nuova password con il token di un link di reimpostazione (la pagina `/reset-password` fa lo stesso). La nuova password segue le regole della registrazione.

        La reimpostazione ha questi effetti, in un’unica transazione (tutti o nessuno): revoca tutte le sessioni e annulla un cambio di e-mail in attesa; gli altri link di reimpostazione dell’account smettono di funzionare; l’indirizzo risulta confermato (il link lo ha dimostrato); il proprietario riceve un’e-mail. L’autenticazione a due fattori non viene toccata. Dopo un errore della coda di hashing delle password, un 503 o un 500, non è cambiato nulla: la vecchia password e le sessioni restano, e il link resta valido.

        **Limiti:** `auth`, poi `auth_reset` (10 all’ora per client, 30 per /48 IPv6, condiviso con la pagina: ogni tentativo calcola l’hash di una password).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: La password è stata cambiata e tutte le sessioni sono state disconnesse.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: il link non è valido, è già stato usato o è scaduto, oppure è stato inviato a un indirizzo che l’account non ha più. `weak_password` (con `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il limite `auth` o `auth_reset`, o la coda di hashing delle password.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: la coda di hashing delle password, o il database è rimasto bloccato (`retryAfter: 1`, non è cambiato nulla). `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Avvia un accesso con Google
      description: |-
        Avvia un tentativo di accesso con Google per il challenge PKCE e la porta del listener del gioco su `127.0.0.1`. La risposta fornisce l’URL di Google da aprire nel browser di sistema e lo `state` del tentativo; il tentativo è valido per 10 minuti.

        `authUrl` contiene `client_id`, `redirect_uri` (costruito da `redirectPort` e dal tag di origine del server), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 del verifier del server stesso per Google) con `code_challenge_method=S256`, e `prompt=select_account`. Il gioco lo verifica prima di aprirlo (vedi la descrizione della sezione).

        **Limite:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Il tentativo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: l’accesso con Google non è disponibile su questo server.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il limite `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (il database è rimasto bloccato), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Avvia un accesso con Google su un sito web
      description: |-
        Avvia un tentativo di accesso con Google di un sito web per il challenge PKCE della sua pagina. La risposta è la stessa del gioco: l’URL di Google verso cui navigare e lo `state` del tentativo; il tentativo è valido per 10 minuti. Disponibile quando `GET /info` indica `sso.googleWeb: true`.

        `authUrl` contiene il `client_id` del sito web e `redirect_uri=GOOGLE_WEB_REDIRECT_URI`, con gli stessi altri parametri del gioco. La pagina lo verifica prima di navigarvi (vedi **Su un sito web** nella descrizione della sezione).

        **Limite:** `sso_start`, condiviso con l’avvio del gioco.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: Il tentativo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: un `codeChallenge` mancante o malformato, o qualsiasi altro campo (compreso `redirectPort`).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: l’accesso con Google non è disponibile su questo server, o non per i siti web.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il limite `sso_start` (condiviso con l’avvio del gioco).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (il database è rimasto bloccato), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Consegna al server la risposta di Google
      description: |-
        Consegna al server il `code` e lo `state` che Google ha inviato al listener del gioco o alla pagina del sito web, con l’id del tentativo e il verifier PKCE. Un id di tentativo è inutile senza il verifier, e il codice è inutile senza il verifier PKCE e il client secret del server stesso.

        Il server verifica il tentativo (sconosciuto, già usato o scaduto: 410), poi il verifier (uno errato lascia il tentativo utilizzabile), poi consuma il tentativo, verifica `state` e `iss`, scambia il codice con Google e verifica l’ID token. La risposta (200) è una delle seguenti:

        - `{ token, expiresAt, user }`: accesso effettuato all’account collegato;
        - `{ mfaRequired, mfaToken, expiresIn }`: prosegui con `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: un nuovo account; prosegui con `POST /auth/sso/complete` entro 10 minuti. `suggestedUsername` deriva dal nome Google o dall’indirizzo, ed è `""` quando niente è adatto;
        - `{ needsPassword, linkTicket, username, expiresIn }`: l’account con quell’indirizzo ha una password; prosegui con `POST /auth/sso/google/link`. Non è ancora collegato nulla.

        **Limite:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Una sessione, un secondo passaggio, o il passaggio successivo di un primo accesso con Google.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Accesso effettuato all’account collegato
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Autenticazione a due fattori attiva
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Un nuovo giocatore
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Un account con una password usa l’indirizzo
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: il verifier non corrisponde al challenge del tentativo (il tentativo resta utilizzabile). `sso_email_unverified`: Google non ha confermato l’indirizzo. `registration_closed`. `account_disabled`. Solo per un account collegato: `banned` (con `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: l’accesso con Google non è disponibile su questo server.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: un account attivo senza password usa l’indirizzo (l’account non viene indicato).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: un tentativo sconosciuto, già usato o scaduto.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il limite `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (il database è rimasto bloccato), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Collega Google a un account esistente con la sua password
      description: |-
        Dopo che `finish` ha risposto `needsPassword`: collega Google all’account esistente con la password di quell’account, digitata nel gioco. La risposta (200) è una sessione (il collegamento viene memorizzato e il giocatore risulta connesso), oppure, quando l’autenticazione a due fattori è attiva, `{ mfaRequired, mfaToken, expiresIn }`: prosegui con `POST /auth/login/mfa`, e il collegamento viene memorizzato solo quando lì un codice viene accettato.

        Una password errata lascia il ticket utilizzabile, per 5 tentativi in tutto. Un tentativo viene consumato subito prima della verifica della password: un 429 `too_many_attempts` o un 428 `pow_required` non ne consuma alcuno, mentre un rifiuto della coda di hashing delle password (503 `server_busy`, 429 `rate_limited`) ne ha consumato uno e conta come tentativo fallito dell’account. L’attesa dopo i tentativi falliti usa lo stesso contatore di `POST /auth/login`.

        **Limite:** `auth` (con il suo conteggio per /48 IPv6). **Proof of work:** come per `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Una sessione, o il secondo passaggio dell’accesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: una password errata; il ticket resta valido, per 5 tentativi in tutto.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (con `until`), solo dopo una password corretta.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: l’accesso con Google non è disponibile su questo server.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: nel frattempo l’account Google è stato collegato a un altro account.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: un ticket sconosciuto, già usato o scaduto, la 5ª password errata, un account il cui stato o indirizzo è cambiato dopo `finish`, o uno il cui stato, indirizzo, password o autenticazione a due fattori è cambiato mentre il collegamento veniva salvato. Ricomincia l’accesso.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (l’attesa dopo i tentativi falliti dell’account), o `rate_limited` (il limite `auth`, la coda di hashing delle password).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: la coda di hashing delle password, o il database è rimasto bloccato (`retryAfter: 1`, non è stato collegato nulla). `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Crea l’account di un primo accesso con Google
      description: |-
        Dopo che `finish` ha risposto `needsUsername`: crea l’account con il nome utente scelto (si applicano le regole della registrazione) ed effettua l’accesso. L’account non ha una password: `hasPassword` è `false`, e «Password dimenticata?» (`POST /auth/password/forgot`) gliene assegna una.

        **Limite:** `auth` (con il suo conteggio per /48 IPv6).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: L’account è stato creato e l’accesso è stato effettuato.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: l’accesso con Google non è disponibile su questo server.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (un account ha già questo nome utente, o lo riserva una registrazione in attesa di un altro indirizzo), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: un ticket sconosciuto, già usato o scaduto.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il limite `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (il database è rimasto bloccato), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Elenca i dispositivi connessi
      description: |-
        Le sessioni attive dell’account (dispositivi connessi), a partire da quella usata più di recente. `current` indica la sessione che fa la richiesta. `lastSeenAt` viene aggiornato al massimo ogni 5 minuti (più tardi mentre il server è molto in ritardo); `expiresAt` è la scadenza assoluta, e il limite di inattività può terminare la sessione prima.

        **Limite:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Le sessioni attive.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: il limite `sessions` o il budget dell’account.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (il database è rimasto bloccato), `timeout`. Anche `server_busy` con `retryAfter` da 2 a 5 quando il server è molto in ritardo (vedi l’introduzione): la richiesta non è stata eseguita.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
