  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Λήψη μιας παρτίδας ως αρχείο PGN
      description: |-
        Η ίδια παρτίδα ως αρχείο PGN: μία παρτίδα με αλλαγές γραμμής `\n`, και το κείμενο των κινήσεων σε γραμμές κάτω των 80 στηλών. Η απάντηση είναι η ίδια με ή χωρίς token.

        Ετικέτες, με αυτή τη σειρά: `Event` (`<SERVER_NAME> rated <category>` ή `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (η ημερομηνία έναρξης σε UTC), `Round`, `White`, `Black`, `Result` (`*` για ακυρωμένη παρτίδα), `UTCDate` και `UTCTime` (η έναρξη), `WhiteElo` και `BlackElo` (οι βαθμολογίες κατά την έναρξη, ή `-`), `WhiteRatingDiff` και `BlackRatingDiff` (οι μεταβολές, όπως `+10` και `-10`, σε κάθε παρτίδα με βαθμολογία, `+0` όταν οι κανόνες βαθμολογίας αφήνουν τη βαθμολογία όπου ήταν· μια φιλική, προσαρμοσμένη ή ακυρωμένη παρτίδα δεν έχει καμία από τις δύο), `TimeControl` (σε δευτερόλεπτα), `Termination` (μια τυπική τιμή PGN: `normal`· `time forfeit`, πτώση σημαίας, ακόμη και όταν η παρτίδα καταλήγει σε ισοπαλία· `abandoned`· `rules infraction`, δεύτερη μη νόμιμη κίνηση ή ήττα λόγω παραβίασης του ευ αγωνίζεσθαι· `unterminated`, ακυρωμένη παρτίδα), `PlyCount`, `ScacelithGameId` (το δεκαδικό αναγνωριστικό).

        Κάθε κίνηση φέρει `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: το ρολόι του παίκτη που έκανε την κίνηση, μετά από αυτήν, και τον χρόνο που χρεώθηκε γι’ αυτήν, σε δέκατα του δευτερολέπτου (με αποκοπή). Μια τιμή παραλείπεται όταν λείπει από την καταγραφή. Μετά την τελευταία κίνηση ακολουθεί ο λόγος λήξης ολογράφως, και μετά το αποτέλεσμα.

        **Όριο:** `public_read` (ανά παίκτη με token, ανά πελάτη χωρίς).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Το αρχείο PGN.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'Το κείμενο PGN, σε UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: δεν είναι θετικός ακέραιος με το πολύ 16 ψηφία (κάτω από 2^53)· `invalid_request`: μη έγκυρη κωδικοποίηση URL.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: στάλθηκε token και δεν είναι έγκυρο.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: η παρτίδα δεν υπάρχει.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: το όριο `public_read` ή ο προϋπολογισμός του λογαριασμού.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: μεταξύ άλλων, οι αποθηκευμένες κινήσεις δεν μπορούν να αναπαραχθούν μέχρι την αποθηκευμένη κατάληξη (ο διακομιστής το καταγράφει).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (η βάση δεδομένων παρέμεινε κλειδωμένη· `retryAfter: 1` στο σώμα, χωρίς κεφαλίδα `Retry-After`), `server_busy` (η αναζήτηση της συνεδρίας βρήκε τη βάση δεδομένων κλειδωμένη), `timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Λήψη μιας παρτίδας αυτού του διακομιστή ως κινούμενο GIF
      description: |-
        Η παρτίδα ως κινούμενο GIF. Τα ονόματα και οι βαθμολογίες είναι εκείνα της καταγραφής της παρτίδας (οι βαθμολογίες κατά την έναρξη, ένας διαγραμμένος λογαριασμός ως `deleted#<id>`), όπως και το αποτέλεσμα και η κατάληξη (`Resignation`, `Loss on time`…).

        Οι έλεγχοι γίνονται με αυτή τη σειρά: `gif_disabled`, οι επιλογές της εικόνας (`size`, `orientation`, `delay`, `coords`), το αναγνωριστικό της παρτίδας, η παρτίδα, το μήκος της.

        **Απαιτείται συνεδρία:** οι ποσοστώσεις μετρούν ανά λογαριασμό. **Όρια:** `gif` σε κάθε αίτημα· `gif_user_min`, `gif_user_hour`, `gif_ip_min` και `gif_ip_hour` μόνο όταν το GIF πρέπει να δημιουργηθεί (βλ. την περιγραφή της ενότητας). **Χρονικό όριο:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 δευτερόλεπτα (45 δευτερόλεπτα από προεπιλογή).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: Το μέγεθος της εικόνας, `small` (τετράγωνα 32 px), `medium` (48 px) ή `large` (72 px).
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Η πλευρά στο κάτω μέρος της σκακιέρας.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Χιλιοστά του δευτερολέπτου ανά κίνηση (1 έως 6 ψηφία στο δεκαδικό σύστημα).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Αν τα γράμματα των στηλών και οι αριθμοί των γραμμών σχεδιάζονται γύρω από τη σκακιέρα (`1`) ή όχι (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` με `field` (`size`, `orientation`, `delay` ή `coords`): τιμή εκτός των επιτρεπόμενων. `invalid_game_id`. `invalid_request`: μη έγκυρη κωδικοποίηση URL.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: η παρτίδα δεν υπάρχει. `gif_disabled`: ο διακομιστής έχει απενεργοποιήσει τα GIF (`GIF_ENABLED=false`· η μάρκα `gif` επιστρέφεται).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: το όριο `gif`, ένα όριο σχεδίασης ή ο προϋπολογισμός του λογαριασμού.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: το GIF δεν μπόρεσε να δημιουργηθεί (ο διακομιστής καταγράφει τον λόγο). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` με `retryAfter` (3 έως 10 δευτερόλεπτα) και `Retry-After`: η ουρά σχεδίασης είναι γεμάτη ή το GIF περίμενε `GIF_QUEUE_TIMEOUT_MS` (10 δευτερόλεπτα) για ελεύθερο νήμα· κάθε μάρκα ορίου που πήρε το αίτημα επιστρέφεται. `busy`: η βάση δεδομένων παρέμεινε κλειδωμένη (`retryAfter: 1` μόνο στο σώμα). `timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Δημιουργία κινούμενου GIF οποιασδήποτε παρτίδας σταλεί ως PGN
      description: |-
        Η ίδια εικόνα με το `GET /games/{id}/gif` για οποιαδήποτε παρτίδα σταλεί ως κείμενο PGN: μια παρτίδα που αποθήκευσε το παιχνίδι, μια εξαγωγή από άλλον ιστότοπο, μια παρτίδα πληκτρολογημένη με το χέρι. Χρησιμοποιείται μόνο η πρώτη παρτίδα του κειμένου.

        - Ο αναγνώστης PGN δέχεται ό,τι δέχεται και ο αναγνώστης του ίδιου του παιχνιδιού: κάθε PGN που γράφει αυτός ο διακομιστής και τις συνήθεις εξαγωγές άλλων ιστότοπων (τα σχόλια, οι παραλλαγές, τα NAG και οι σημειώσεις ρολογιού παραλείπονται· οι αριθμοί κινήσεων και το SAN διαβάζονται με ανεκτικότητα· μια ετικέτα `FEN` δίνει την αρχική θέση εκτός αν το `SetUp` είναι `"0"`).
        - Τα ονόματα και οι βαθμολογίες προέρχονται από τις ετικέτες `White`, `Black`, `WhiteElo` και `BlackElo`. Τα γράμματα με διακριτικά χάνουν τα διακριτικά τους, οι άλλοι χαρακτήρες εκτός του εκτυπώσιμου ASCII γίνονται `?`, και τα μεγάλα ονόματα περικόπτονται (48 χαρακτήρες). Το αποτέλεσμα προέρχεται από την ετικέτα `Result`, αλλιώς από το τέλος του κειμένου των κινήσεων. Η ετικέτα `Termination` εμφανίζεται εκτός αν είναι `normal`: τότε η τελική θέση λέει την ιστορία (ματ, πατ).
        - Αυτό το endpoint ελέγχει μόνο του το σώμα του: ένα άγνωστο πεδίο ή ένα `pgn` που λείπει ή δεν είναι συμβολοσειρά απαντά 400 `invalid_request` με `field`· μια λάθος επιλογή απαντά 400 `invalid_option` (το `delayMs` πρέπει να είναι αριθμός JSON, το `coords` boolean· το `null` απορρίπτεται).

        **Απαιτείται συνεδρία:** οι ποσοστώσεις μετρούν ανά λογαριασμό. **Όρια:** όπως για το `GET /games/{id}/gif`. **Μέγιστο μέγεθος σώματος:** 135.168 byte, ανεξάρτητα από το `HTTP_BODY_LIMIT` (το PGN ως συμβολοσειρά JSON, μαζί με τις ακολουθίες διαφυγής του). **Χρονικό όριο:** 45 δευτερόλεπτα από προεπιλογή.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Μια σύντομη παρτίδα πληκτρολογημένη, χωρίς συντεταγμένες
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: Ένα αρχείο PGN με όλες τις επιλογές
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` με `field` (άγνωστο πεδίο ή `pgn` που λείπει ή δεν είναι συμβολοσειρά· χωρίς `field` όταν το σώμα δεν είναι αντικείμενο)· `invalid_json`· `invalid_option` με `field` (`size`, `orientation`, `delayMs` ή `coords`)· `invalid_pgn` με `line` και `column` (από 1, οι στήλες σε χαρακτήρες) και το `message` του αναγνώστη: μη νόμιμη ή διφορούμενη κίνηση, χαλασμένη ετικέτα, άγνωστη παραλλαγή σκακιού, περισσότερα από 65.536 byte.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: ο διακομιστής έχει απενεργοποιήσει τα GIF (`GIF_ENABLED=false`· η μάρκα `gif` επιστρέφεται).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: σώμα μεγαλύτερο από 135.168 byte.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: το όριο `gif`, ένα όριο σχεδίασης ή ο προϋπολογισμός του λογαριασμού.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: το GIF δεν μπόρεσε να δημιουργηθεί (ο διακομιστής καταγράφει τον λόγο). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` με `retryAfter` (3 έως 10 δευτερόλεπτα) και `Retry-After`: η ουρά σχεδίασης είναι γεμάτη ή το GIF περίμενε υπερβολικά πολύ για ελεύθερο νήμα· κάθε μάρκα ορίου που πήρε το αίτημα επιστρέφεται. `timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
  /players/{username}:
