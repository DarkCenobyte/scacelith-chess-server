  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Αναφορά του αντιπάλου μιας πρόσφατης παρτίδας
      description: |-
        Αναφέρει τον αντίπαλο μιας από τις παρτίδες του ίδιου του παίκτη που τελείωσε μέσα στις τελευταίες 7 ημέρες. Μια αναφορά δεν αλλάζει ποτέ από μόνη της μια βαθμολογία, μια κύρωση ή ένα επίπεδο ακεραιότητας. Αυξάνει την προτεραιότητα εξέτασης που βλέπουν οι συντονιστές και, εκτός από την κατηγορία `abuse`, ζητά την ανάλυση της παρτίδας από τη μηχανή.

        Μια αναφορά του ίδιου αντιπάλου για την ίδια παρτίδα λαμβάνει την ίδια απάντηση και δεν αλλάζει τίποτα· η απάντηση δεν αποκαλύπτει ποτέ τίποτα για τον λογαριασμό που αναφέρθηκε. Το `GET /games/{id}` λέει από πριν στους παίκτες της παρτίδας αν μια αναφορά θα γινόταν δεκτή (`reportable`).

        Αυτό το endpoint ελέγχει μόνο του το σώμα του, με τη σειρά `gameId`, `reported`, `category`, `comment`: μια αποτυχία απαντά 400 `invalid_request` χωρίς `field`. Τα πεδία που δεν γνωρίζει αγνοούνται.

        **Όρια:** `reports` (ανά παίκτη), μετά `REPORTS_PER_DAY` (5) αναφορές ανά παίκτη σε 24 ώρες (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Η αναφορά παραλήφθηκε (ή είχε ήδη υποβληθεί).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (χωρίς `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: δεν πρόκειται για τον αντίπαλο του παίκτη που κάνει την αναφορά σε παρτίδα που τελείωσε μέσα στις τελευταίες 7 ημέρες.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, με κεφαλίδα `Retry-After`): `REPORTS_PER_DAY` αναφορές τις τελευταίες 24 ώρες. `rate_limited`: το όριο `reports` ή ο προϋπολογισμός του λογαριασμού.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (η αναζήτηση της συνεδρίας βρήκε τη βάση δεδομένων κλειδωμένη), `timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
