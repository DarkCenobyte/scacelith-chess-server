  - name: community
    x-displayName: Παίκτες και αναφορές
    tags:
      - players
      - leaderboard
      - reports
  - name: browser-pages
    x-displayName: Σελίδες για πρόγραμμα περιήγησης
    tags:
      - pages
paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Το όνομα, οι εκδόσεις, οι θύρες και οι κανόνες εγγραφής του διακομιστή
      description: |-
        Ό,τι χρειάζεται ένας πελάτης πριν συνδεθεί σε λογαριασμό ή στον διακομιστή: το όνομα και το αναγνωριστικό του διακομιστή, οι εκδόσεις του πρωτοκόλλου WebSocket και πού βρίσκεται το WebSocket, οι κανόνες εγγραφής, οι επίσημοι χρόνοι σκέψης και τα όρια που μπορεί να ελέγξει ένας πελάτης πριν στείλει μια φόρμα.

        **Όρια:** μόνο το επίπεδο ανά διεύθυνση.
      security: []
      responses:
        '200':
          description: Η περιγραφή του διακομιστή.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: το επίπεδο ανά διεύθυνση.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Δημιουργία λογαριασμού
      description: |-
        Δημιουργεί έναν λογαριασμό: μόλις επιβεβαιωθεί η διεύθυνση email του με τον σύνδεσμο που στέλνεται σε αυτήν, ή αμέσως, χωρίς επιβεβαίωση email.

        **Με επιβεβαίωση email** (`REQUIRE_EMAIL_VERIFICATION`, η προεπιλογή): 202 `verification_sent`. Δεν υπάρχει ακόμη λογαριασμός: η εγγραφή περιμένει για 24 ώρες και στο μεταξύ κρατά δεσμευμένο το όνομα χρήστη της. Ένας σύνδεσμος που ισχύει για αυτές τις 24 ώρες στέλνεται στη διεύθυνση, το πολύ ένας ανά διεύθυνση κάθε 5 λεπτά (το `POST /auth/verify-email/resend` στέλνει νέο)· ο λογαριασμός δημιουργείται, με επιβεβαιωμένη τη διεύθυνσή του, όταν χρησιμοποιηθεί ο σύνδεσμος (το κουμπί της σελίδας `/verify-email`), και τότε ο παίκτης μπορεί να συνδεθεί. Μέχρι τότε, μια απόπειρα σύνδεσης με αυτό το όνομα χρήστη παίρνει `invalid_credentials`, όπως για άγνωστο λογαριασμό, και το δημόσιο προφίλ δεν υπάρχει. Μια νέα εγγραφή με την ίδια διεύθυνση αντικαθιστά την εκκρεμή. Η απάντηση είναι η ίδια όταν τη διεύθυνση χρησιμοποιεί ήδη άλλος λογαριασμός: τότε δεν στέλνεται σύνδεσμος, ο κάτοχός του λαμβάνει αντί γι’ αυτό μια ειδοποίηση (το πολύ μία ανά ώρα), και το όνομα χρήστη δεσμεύεται με τον ίδιο τρόπο, ώστε τίποτα να μη φανερώνει αν η διεύθυνση έχει λογαριασμό. Μια εγγραφή της οποίας ο σύνδεσμος δεν χρησιμοποιήθηκε διαγράφεται μετά από 24 ώρες, και το όνομα χρήστη της γίνεται ξανά ελεύθερο.

        **Χωρίς επιβεβαίωση email** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, ο λογαριασμός δημιουργείται αμέσως και μπορεί να συνδεθεί.

        **Κανόνες.** `username`: `USERNAME_MIN` έως `USERNAME_MAX` χαρακτήρες (3 έως 20), γράμματα, ψηφία, `_` και `-`, με πρώτο χαρακτήρα γράμμα ή ψηφίο (το `GET /info` τα δίνει ως `limits`)· τα δεσμευμένα ονόματα (`admin`, `moderator`, `deleted`...) και ορισμένα προθέματα απορρίπτονται· μοναδικό χωρίς διάκριση πεζών-κεφαλαίων. `email`: χωρίς κενά στην αρχή και στο τέλος, αποθηκεύεται με πεζά, σκέτο ASCII με τομέα που περιέχει τελεία. `password`: τουλάχιστον `PASSWORD_MIN_LENGTH` (10) χαρακτήρες και το πολύ 256 byte σε UTF-8· δεν πρέπει να περιέχει το όνομα χρήστη ή το τοπικό μέρος του email, και δεν πρέπει να είναι συνηθισμένος κωδικός πρόσβασης.

        **Σφάλματα**, με αυτή τη σειρά ελέγχου: 403 `registration_closed`· 400 `invalid_username`· 400 `invalid_email`· 400 `weak_password`· 409 `username_taken`· 428 `pow_required`· τα σφάλματα της ουράς κατακερματισμού κωδικών πρόσβασης· 409 `email_taken` (μόνο χωρίς επιβεβαίωση email).

        **Όρια:** `auth`, μετά `auth_register` (10 εγγραφές ανά ώρα ανά πελάτη). **Απόδειξη εργασίας:** πάντα, όταν το `POW_REGISTER_BITS` είναι πάνω από 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Πρώτη απόπειρα, χωρίς απόδειξη εργασίας
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Νέα αποστολή με την απόδειξη εργασίας
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Ο λογαριασμός δημιουργήθηκε και μπορεί να συνδεθεί (χωρίς επιβεβαίωση email σε αυτόν τον διακομιστή).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Η εγγραφή περιμένει τον σύνδεσμο επιβεβαίωσής της (ή η διεύθυνση έχει ήδη λογαριασμό· η απάντηση δεν το φανερώνει).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (με `field`), `invalid_json`, `invalid_username`, `invalid_email` ή `weak_password` με `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` ή `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: η εγγραφή είναι κλειστή σε αυτόν τον διακομιστή (το `GET /info` λέει `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: ένας λογαριασμός έχει το όνομα χρήστη, ή το κρατά δεσμευμένο μια εκκρεμής εγγραφή άλλης διεύθυνσης. `email_taken`: άλλος λογαριασμός χρησιμοποιεί τη διεύθυνση (μόνο χωρίς επιβεβαίωση email).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: το όριο `auth` ή `auth_register`, ή η ουρά κατακερματισμού κωδικών πρόσβασης.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (η ουρά κατακερματισμού κωδικών πρόσβασης ή η βάση δεδομένων παρέμεινε κλειδωμένη), `timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Σύνδεση με κωδικό πρόσβασης
      description: |-
        Σύνδεση με όνομα χρήστη ή διεύθυνση email και κωδικό πρόσβασης. Υπάρχουν δύο πιθανές απαντήσεις, και οι δύο με κατάσταση 200: μια συνεδρία ή, όταν ο έλεγχος ταυτότητας δύο παραγόντων είναι ενεργός, ένα δεύτερο βήμα που πρέπει να ολοκληρωθεί μέσα σε 5 λεπτά με `POST /auth/login/mfa`.

        Ένας άγνωστος λογαριασμός, ένας λάθος κωδικός πρόσβασης και ένας λογαριασμός χωρίς κωδικό πρόσβασης παίρνουν την ίδια απάντηση, μετά από τον ίδιο χρόνο: 401 `invalid_credentials`. Οι έλεγχοι του λογαριασμού (`banned`, `email_unverified`) γίνονται μόνο μετά από σωστό κωδικό πρόσβασης. Από τις `AUTH_FAILURES_PER_ACCOUNT` (5) αποτυχίες σε ένα όνομα σύνδεσης και μετά, κάθε απόπειρα πρέπει να περιμένει (429 `too_many_attempts`).

        **Όριο:** `auth`. **Απόδειξη εργασίας:** μόνο κατά τη διάρκεια ενός κύματος αποτυχημένων συνδέσεων (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Μια συνεδρία ή το δεύτερο βήμα μιας σύνδεσης με έλεγχο ταυτότητας δύο παραγόντων.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Επιτυχής σύνδεση
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Ο έλεγχος ταυτότητας δύο παραγόντων είναι ενεργός
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: άγνωστος λογαριασμός, λάθος κωδικός πρόσβασης ή λογαριασμός χωρίς κωδικό πρόσβασης.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Μόνο μετά από σωστό κωδικό πρόσβασης: `banned`, με `until` (ms από την εποχή Unix, `null` για μόνιμη αναστολή), ή `email_unverified` (ένας παλαιότερος λογαριασμός του οποίου η διεύθυνση δεν έχει επιβεβαιωθεί ακόμη).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (η καθυστέρηση μετά από αποτυχημένες προσπάθειες για αυτό το όνομα σύνδεσης), ή `rate_limited` (το όριο `auth`, η ουρά κατακερματισμού κωδικών πρόσβασης).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (η ουρά κατακερματισμού κωδικών πρόσβασης ή η βάση δεδομένων παρέμεινε κλειδωμένη), `timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Ολοκλήρωση σύνδεσης με δεύτερο παράγοντα
      description: |-
        Το δεύτερο βήμα μιας σύνδεσης με έλεγχο ταυτότητας δύο παραγόντων, αφού το `POST /auth/login` ή μια σύνδεση με Google (`POST /auth/sso/google/finish` ή `POST /auth/sso/google/link`) απάντησε `mfaRequired`. Στείλτε `code` (έναν 6ψήφιο κωδικό της εφαρμογής ελέγχου ταυτότητας ή έναν κωδικό ανάκτησης) ή `recoveryCode`. Ένας κωδικός ανάκτησης που χρησιμοποιείται εδώ χάνεται.

        Ένα βήμα δέχεται το πολύ 5 λάθος κωδικούς· το βήμα λήγει επίσης όταν ο κωδικός πρόσβασης επαναφέρεται ή αλλάζει. Μετά το βήμα κωδικού πρόσβασης μιας διασύνδεσης Google, η διασύνδεση αποθηκεύεται μόνο όταν ο κωδικός περάσει εδώ.

        **Όρια:** `auth`, και το πολύ `AUTH_MFA_PER_ACCOUNT` (10) κωδικοί ανά 15 λεπτά για τον λογαριασμό, από οποιαδήποτε διεύθυνση· πέρα από αυτό ο κωδικός δεν ελέγχεται, οπότε ένας κωδικός ανάκτησης δεν αναλώνεται.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Ένας κωδικός της εφαρμογής ελέγχου ταυτότητας
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Ένας κωδικός ανάκτησης
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Η σύνδεση έγινε.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: δεν στάλθηκε ούτε `code` ούτε `recoveryCode`, ή το σώμα παραβιάζει το σχήμα· `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: το βήμα έληξε, χρησιμοποιήθηκε ή τερματίστηκε μετά από 5 λάθος κωδικούς, ή ο κωδικός πρόσβασης επαναφέρθηκε ή άλλαξε μετά το πρώτο βήμα (συνδεθείτε ξανά). `invalid_code`: λάθος ή ήδη χρησιμοποιημένος κωδικός.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (με `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: ο λογαριασμός Google διασυνδέθηκε στο μεταξύ με άλλον λογαριασμό (μόνο μετά το βήμα κωδικού πρόσβασης μιας διασύνδεσης Google).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: ο λογαριασμός άλλαξε στο μεταξύ (μόνο μετά το βήμα κωδικού πρόσβασης μιας διασύνδεσης Google)· ξεκινήστε ξανά τη σύνδεση.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: η καθυστέρηση μετά από αποτυχημένες προσπάθειες του λογαριασμού, ή εξαντλήθηκαν οι `AUTH_MFA_PER_ACCOUNT` κωδικοί του των τελευταίων 15 λεπτών. `rate_limited`: το όριο `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` με `retryAfter: 1`: η βάση δεδομένων παρέμεινε κλειδωμένη (μετά από βήμα διασύνδεσης Google, δεν διασυνδέθηκε τίποτα: ξεκινήστε ξανά τη σύνδεση). `timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Αποσύνδεση αυτής της συνεδρίας
      description: |-
        Ανακαλεί τη συνεδρία του token που χρησιμοποιήθηκε. Το WebSocket που άνοιξε με αυτήν κλείνει. Χωρίς σώμα (ή `{}`).

        **Όριο:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Η αποσύνδεση έγινε.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: σώμα διαφορετικό από `{}`· `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: το όριο `sessions` ή ο προϋπολογισμός του λογαριασμού.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (η βάση δεδομένων παρέμεινε κλειδωμένη), `timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
        - sessions
      summary: Αποσύνδεση όλων των συνεδριών
      description: |-
        Ανακαλεί κάθε συνεδρία του λογαριασμού, μαζί και αυτήν. Τα WebSocket που άνοιξαν με αυτές κλείνουν. Χωρίς σώμα (ή `{}`).

        **Όριο:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Όλες οι συνεδρίες αποσυνδέθηκαν.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: σώμα διαφορετικό από `{}`· `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: το όριο `sessions` ή ο προϋπολογισμός του λογαριασμού.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (η βάση δεδομένων παρέμεινε κλειδωμένη), `timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Νέα αποστολή του συνδέσμου επιβεβαίωσης
      description: |-
        Στέλνει ξανά τον σύνδεσμο επιβεβαίωσης email. Η απάντηση είναι 202 `accepted` όποια κι αν είναι η διεύθυνση, ώστε να μη φανερώνει ποτέ αν τη χρησιμοποιεί κάποιος λογαριασμός ή κάποια εγγραφή.

        Ένα αίτημα ενεργεί το πολύ μία φορά κάθε 5 λεπτά ανά διεύθυνση. Μια εκκρεμής εγγραφή με αυτή τη διεύθυνση παίρνει ξανά τις 24 ώρες της, είτε χρησιμοποιεί άλλος λογαριασμός τη διεύθυνση είτε όχι, ώστε το όνομα χρήστη της να μένει δεσμευμένο για το ίδιο διάστημα και στις δύο περιπτώσεις. Σύνδεσμος στέλνεται μόνο για αυτή την εγγραφή όταν η διεύθυνση δεν έχει λογαριασμό (ένας νέος σύνδεσμος, που ισχύει 24 ώρες, αντικαθιστά τον προηγούμενο), ή για έναν ενεργό, μη επιβεβαιωμένο λογαριασμό με αυτή τη διεύθυνση.

        **Όρια:** `auth`, μετά `auth_mail` (10 ανά ώρα ανά πελάτη).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Έγινε δεκτό (όποια κι αν είναι η διεύθυνση).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: το όριο `auth` ή `auth_mail` (όποια κι αν είναι η διεύθυνση).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` με `retryAfter: 1`: η βάση δεδομένων παρέμεινε κλειδωμένη ενώ αναζητούνταν ο λογαριασμός ή αποθηκευόταν ο σύνδεσμος ενός μη επιβεβαιωμένου λογαριασμού (η ανανέωση μιας εκκρεμούς εγγραφής γίνεται στο μέτρο του δυνατού και δεν κάνει ποτέ το αίτημα να αποτύχει)· τα 5 λεπτά της διεύθυνσης ξεκινούν παρ’ όλα αυτά, οπότε ένα νέο αίτημα μέσα σε αυτά δεν κάνει τίποτα. `timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Αποστολή συνδέσμου επαναφοράς κωδικού πρόσβασης
      description: |-
        Στέλνει έναν σύνδεσμο επαναφοράς κωδικού πρόσβασης, που ισχύει για μία ώρα και ανοίγει τη σελίδα `/reset-password`. Η απάντηση είναι 202 `accepted` όποια κι αν είναι η διεύθυνση. Σύνδεσμος στέλνεται μόνο σε ενεργό λογαριασμό, το πολύ μία φορά κάθε 5 λεπτά ανά διεύθυνση. Ένας λογαριασμός μόνο με Google ορίζει έτσι τον πρώτο κωδικό πρόσβασής του.

        Η ανάκτηση κωδικού πρόσβασης έχει τα αυστηρότερα όρια του API, όλα μετρημένα για ολόκληρο τον διακομιστή: 3 αιτήματα ανά ώρα (`AUTH_FORGOT_PER_HOUR`) και 10 ανά 24 ώρες (`AUTH_FORGOT_PER_DAY`) ανά πελάτη (μια διεύθυνση IPv4 ή ένα /64 IPv6), τριπλάσιοι αριθμοί ανά /48 IPv6, επιπλέον του ορίου `auth` (20 ανά 10 λεπτά) και του ενός email ανά διεύθυνση κάθε 5 λεπτά. Ούτε το 202 ούτε το 429 φανερώνει αν κάποιος λογαριασμός χρησιμοποιεί τη διεύθυνση. Ο ορισμός του νέου κωδικού πρόσβασης έχει δικό του όριο (`auth_reset`).

        **Όρια:** `auth`, `auth_forgot`, μετά `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Έγινε δεκτό (όποια κι αν είναι η διεύθυνση).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: το όριο `auth`, `auth_forgot` ή `auth_forgot_day` (όποια κι αν είναι η διεύθυνση).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` με `retryAfter: 1`: η βάση δεδομένων παρέμεινε κλειδωμένη ενώ αναζητούνταν ο λογαριασμός ή αποθηκευόταν ο σύνδεσμος· τα 5 λεπτά της διεύθυνσης ξεκινούν παρ’ όλα αυτά, οπότε ένα νέο αίτημα μέσα σε αυτά δεν στέλνει σύνδεσμο. `timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Ορισμός νέου κωδικού πρόσβασης με το token ενός συνδέσμου επαναφοράς
      description: |-
        Ορίζει νέο κωδικό πρόσβασης με το token ενός συνδέσμου επαναφοράς (η σελίδα `/reset-password` κάνει το ίδιο). Ο νέος κωδικός πρόσβασης ακολουθεί τους κανόνες της εγγραφής.

        Η επαναφορά έχει τα εξής αποτελέσματα, σε μία συναλλαγή (όλα ή κανένα): ανακαλεί κάθε συνεδρία και ακυρώνει μια εκκρεμή αλλαγή email· οι άλλοι σύνδεσμοι επαναφοράς του λογαριασμού παύουν να λειτουργούν· η διεύθυνση θεωρείται επιβεβαιωμένη (ο σύνδεσμος το απέδειξε)· ο κάτοχος λαμβάνει ένα email. Ο έλεγχος ταυτότητας δύο παραγόντων δεν αλλάζει. Μετά από σφάλμα της ουράς κατακερματισμού κωδικών πρόσβασης, 503 ή 500, δεν άλλαξε τίποτα: ο παλιός κωδικός πρόσβασης και οι συνεδρίες παραμένουν, και ο σύνδεσμος παραμένει έγκυρος.

        **Όρια:** `auth`, μετά `auth_reset` (10 ανά ώρα ανά πελάτη, 30 ανά /48 IPv6, κοινό με τη σελίδα: κάθε απόπειρα κατακερματίζει έναν κωδικό πρόσβασης).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Ο κωδικός πρόσβασης άλλαξε και όλες οι συνεδρίες αποσυνδέθηκαν.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: ο σύνδεσμος δεν είναι έγκυρος, έχει χρησιμοποιηθεί ή έχει λήξει, ή στάλθηκε σε διεύθυνση που ο λογαριασμός δεν έχει πια. `weak_password` (με `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: το όριο `auth` ή `auth_reset`, ή η ουρά κατακερματισμού κωδικών πρόσβασης.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: η ουρά κατακερματισμού κωδικών πρόσβασης ή η βάση δεδομένων παρέμεινε κλειδωμένη (`retryAfter: 1`, δεν άλλαξε τίποτα). `timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Έναρξη σύνδεσης με Google
      description: |-
        Ξεκινά μια απόπειρα σύνδεσης με Google για την πρόκληση PKCE και τη θύρα του listener του παιχνιδιού στο `127.0.0.1`. Η απάντηση δίνει το URL της Google που πρέπει να ανοίξει στο πρόγραμμα περιήγησης του συστήματος και το `state` της απόπειρας· η απόπειρα ισχύει για 10 λεπτά.

        Το `authUrl` περιέχει `client_id`, `redirect_uri` (που σχηματίζεται από το `redirectPort` και την ετικέτα προέλευσης του διακομιστή), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (το S256 του επαληθευτή που έχει ο ίδιος ο διακομιστής για τη Google) με `code_challenge_method=S256`, και `prompt=select_account`. Το παιχνίδι το ελέγχει πριν το ανοίξει (βλ. την περιγραφή της ενότητας).

        **Όριο:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Η απόπειρα.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: η σύνδεση με Google δεν προσφέρεται σε αυτόν τον διακομιστή.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: το όριο `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (η βάση δεδομένων παρέμεινε κλειδωμένη), `timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Έναρξη σύνδεσης με Google σε ιστότοπο
      description: |-
        Ξεκινά μια απόπειρα σύνδεσης με Google ενός ιστότοπου για την πρόκληση PKCE της σελίδας του. Η απάντηση είναι η ίδια με του παιχνιδιού: το URL της Google όπου πρέπει να πλοηγηθεί η σελίδα, και το `state` της απόπειρας· η απόπειρα ισχύει για 10 λεπτά. Προσφέρεται όταν το `GET /info` λέει `sso.googleWeb: true`.

        Το `authUrl` περιέχει το `client_id` του ιστότοπου και `redirect_uri=GOOGLE_WEB_REDIRECT_URI`, με τις ίδιες υπόλοιπες παραμέτρους όπως για το παιχνίδι. Η σελίδα το ελέγχει πριν πλοηγηθεί σε αυτό (βλ. **Σε ιστότοπο** στην περιγραφή της ενότητας).

        **Όριο:** `sso_start`, κοινό με την έναρξη του παιχνιδιού.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: Η απόπειρα.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: λείπει ή είναι κακοσχηματισμένο το `codeChallenge`, ή υπάρχει οποιοδήποτε άλλο πεδίο (μαζί και το `redirectPort`).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: η σύνδεση με Google δεν προσφέρεται σε αυτόν τον διακομιστή ή δεν προσφέρεται σε ιστότοπους.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: το όριο `sso_start` (κοινό με την έναρξη του παιχνιδιού).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (η βάση δεδομένων παρέμεινε κλειδωμένη), `timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Παράδοση της απάντησης της Google στον διακομιστή
      description: |-
        Παραδίδει στον διακομιστή το `code` και το `state` που έστειλε η Google στον listener του παιχνιδιού ή στη σελίδα του ιστότοπου, μαζί με το αναγνωριστικό της απόπειρας και τον επαληθευτή PKCE. Ένα αναγνωριστικό απόπειρας είναι άχρηστο χωρίς τον επαληθευτή, και ο κωδικός είναι άχρηστος χωρίς τον επαληθευτή PKCE και το client secret του ίδιου του διακομιστή.

        Ο διακομιστής ελέγχει την απόπειρα (άγνωστη, χρησιμοποιημένη ή ληγμένη: 410), μετά τον επαληθευτή (ένας λάθος επαληθευτής αφήνει την απόπειρα χρησιμοποιήσιμη), μετά χρησιμοποιεί την απόπειρα μία φορά, ελέγχει τα `state` και `iss`, ανταλλάσσει τον κωδικό με τη Google και επαληθεύει το ID token. Η απάντηση (200) είναι ένα από τα εξής:

        - `{ token, expiresAt, user }`: σύνδεση στον διασυνδεδεμένο λογαριασμό·
        - `{ mfaRequired, mfaToken, expiresIn }`: συνεχίστε με `POST /auth/login/mfa`·
        - `{ needsUsername, ssoTicket, suggestedUsername }`: νέος λογαριασμός· συνεχίστε με `POST /auth/sso/complete` μέσα σε 10 λεπτά. Το `suggestedUsername` προέρχεται από το όνομα στη Google ή από τη διεύθυνση, και είναι `""` όταν δεν ταιριάζει τίποτα·
        - `{ needsPassword, linkTicket, username, expiresIn }`: ο λογαριασμός με αυτή τη διεύθυνση έχει κωδικό πρόσβασης· συνεχίστε με `POST /auth/sso/google/link`. Δεν έχει διασυνδεθεί ακόμη τίποτα.

        **Όριο:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Μια συνεδρία, ένα δεύτερο βήμα ή το επόμενο βήμα μιας πρώτης σύνδεσης με Google.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Επιτυχής σύνδεση στον διασυνδεδεμένο λογαριασμό
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Ο έλεγχος ταυτότητας δύο παραγόντων είναι ενεργός
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Ένας νέος παίκτης
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
