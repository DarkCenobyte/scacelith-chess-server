            description: Η δημόσια θύρα του API (`PUBLIC_API_PORT`, αλλιώς `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Οποιοσδήποτε διακομιστής Scacelith, κάτω από το `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: Το δημόσιο όνομα κεντρικού υπολογιστή του διακομιστή (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Η δημόσια θύρα του API (`PUBLIC_API_PORT`, αλλιώς `API_PORT`).
    get:
      operationId: getReadiness
      tags:
        - health
      summary: Έλεγχος ότι ο διακομιστής δέχεται παίκτες
      description: |-
        Απαντά 200 `ready` όταν ο διακομιστής δέχεται παίκτες, και 503 `not_ready` όσο ξεκινά ή σταματά. Λειτουργεί και το `HEAD`. Οποιαδήποτε άλλη μέθοδος απαντά 405 `method_not_allowed` με `Allow: GET, HEAD` (μαζί και το `OPTIONS`).

        **Όρια:** μόνο το επίπεδο ανά διεύθυνση.
      security: []
      responses:
        '200':
          description: Ο διακομιστής δέχεται παίκτες.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: το επίπεδο ανά διεύθυνση.'
        '503':
          description: Ο διακομιστής ξεκινά ή σταματά.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Ένα token συνεδρίας (`sct_` ακολουθούμενο από 43 χαρακτήρες base64url) από μια απάντηση σύνδεσης, στην κεφαλίδα `Authorization`: `Authorization: Bearer <token>`. Το πρόθεμα είναι ακριβώς `Bearer` (με διάκριση πεζών-κεφαλαίων) και ένα κενό· μια τιμή που δεν το έχει ή ένα token που δεν αποτελείται από 1 έως 512 εκτυπώσιμους χαρακτήρες ASCII απαντά 401 `invalid_token` όπως κάθε άλλο μη έγκυρο token. Μια κενή κεφαλίδα θεωρείται ως απουσία κεφαλίδας.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: Το αναγνωριστικό της παρτίδας, θετικός ακέραιος σε δεκαδική γραφή με το πολύ 16 ψηφία χωρίς αρχικά μηδενικά, κάτω από 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: Το αναγνωριστικό της συνεδρίας, όπως το δίνει το `GET /auth/sessions`, γραμμένο χωρίς αρχικά μηδενικά (το `03` δεν είναι η συνεδρία 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Το όνομα χρήστη του παίκτη, χωρίς διάκριση πεζών-κεφαλαίων. Ο διακομιστής δέχεται οποιοδήποτε όνομα αποτελείται από 2 έως 24 χαρακτήρες του `[A-Za-z0-9_.-]` (ο ευρύτερος κανόνας που επέτρεψε ποτέ).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Ένα αναγνωριστικό παρτίδας· παρατίθενται μόνο παλαιότερες παρτίδες. Δώστε το `next` της προηγούμενης σελίδας. Μια κενή τιμή θεωρείται απούσα.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Το μέγεθος της σελίδας, από 1 έως 50. Ένας μεγαλύτερος αριθμός με έως 3 ψηφία θεωρείται 50· μια κενή τιμή θεωρείται απούσα.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: Το token του συνδέσμου email (43 χαρακτήρες base64url). Αν λείπει ή είναι λάθος, εμφανίζεται η σελίδα «link invalid or expired» (μη έγκυρος ή ληγμένος σύνδεσμος).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Κάθε απάντηση του διακομιστή απαγορεύει την προσωρινή αποθήκευση.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Δευτερόλεπτα αναμονής πριν από νέα προσπάθεια· η ίδια τιμή με το `retryAfter` στο σώμα.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Η πρόκληση ελέγχου ταυτότητας Bearer, με `error="invalid_token"` για μη έγκυρο token.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Ο διακομιστής κλείνει τη σύνδεση μετά από αυτή την απάντηση.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (με `field` όταν φταίει ένα πεδίο του σώματος) ή `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Ένα πεδίο παραβιάζει το σχήμα
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Το σώμα δεν είναι JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Αδύναμος κωδικός πρόσβασης
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: Ένα PGN που δεν μπορεί να διαβαστεί
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (χωρίς κεφαλίδα `Authorization`) ή `invalid_token` (το token είναι κακοσχηματισμένο, έχει λήξει, έχει ανακληθεί ή ανήκει σε διαγραμμένο λογαριασμό).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Χωρίς συνεδρία
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Μη έγκυρο token
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Το αίτημα απορρίπτεται.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Λάθος κωδικός πρόσβασης κατά τον επανέλεγχο ταυτότητας
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Λογαριασμός σε αναστολή
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found` ή μια λειτουργία που αυτός ο διακομιστής έχει απενεργοποιήσει.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: το σώμα δεν έφτασε μέσα σε 10 δευτερόλεπτα. Ο διακομιστής κλείνει τη σύνδεση.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Το αίτημα έρχεται σε σύγκρουση με την κατάσταση του διακομιστή.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: η απόπειρα σύνδεσης με Google ή το ticket δεν είναι γνωστά, έχουν ήδη χρησιμοποιηθεί ή έχουν λήξει· ξεκινήστε ξανά τη σύνδεση.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: το σώμα υπερβαίνει το `HTTP_BODY_LIMIT` (16.384 byte από προεπιλογή). Ο διακομιστής κλείνει τη σύνδεση.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: ο στόχος του αιτήματος υπερβαίνει τους 4096 χαρακτήρες.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: το σώμα δεν είναι `application/json` ή το σύνολο χαρακτήρων του δεν είναι UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: η παρτίδα έχει περισσότερες από `GIF_MAX_PLIES` (600) ημικινήσεις.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: λύστε την πρόκληση `pow` και στείλτε ξανά το ίδιο αίτημα με `pow: { challenge, nonce }`. Το `reason` λέει γιατί: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` ή `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (ένα όριο ρυθμού αιτημάτων, ο προϋπολογισμός του λογαριασμού ή η ουρά κατακερματισμού κωδικών πρόσβασης) ή `too_many_attempts` (επιβράδυνση του λογαριασμού), με `retryAfter` και κεφαλίδα `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Όριο ρυθμού αιτημάτων
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Υπερβολικά πολλές αποτυχίες σε αυτόν τον λογαριασμό
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: απρόσμενη αποτυχία. Ο διακομιστής την καταγράφει.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: λάθος `state` ή `iss`, ή η Google απέρριψε τον κωδικό ή έστειλε ένα ID token που δεν επαληθεύεται (συμπεριλαμβανομένου ενός κωδικού ή ID token του άλλου πελάτη, του παιχνιδιού ή του ιστότοπου). Δεν μεταφέρει ποτέ το κείμενο της Google.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` ή `timeout`: δοκιμάστε ξανά μετά από `retryAfter` όταν δίνεται.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Ο διακομιστής είναι απασχολημένος
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Η βάση δεδομένων παρέμεινε κλειδωμένη (ανάγνωση)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Ο διακομιστής άργησε υπερβολικά
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Το κινούμενο GIF, ως συνημμένο.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` για μια παρτίδα αυτού του διακομιστή, `attachment; filename="scacelith-game.gif"` για ένα PGN που στάλθηκε με `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Το μέγεθος του αρχείου σε byte.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: Μια σελίδα HTML.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: Μια σελίδα HTML που εξηγεί την απόρριψη.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Η φόρμα δεν έφτασε μέσα σε 10 δευτερόλεπτα (σελίδα HTML). Ο διακομιστής κλείνει τη σύνδεση.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: Μια σελίδα HTML που εξηγεί τη σύγκρουση.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Η φόρμα υπερβαίνει το `HTTP_BODY_LIMIT` (σελίδα HTML). Ο διακομιστής κλείνει τη σύνδεση.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Το σώμα δεν είναι ούτε φόρμα (`application/x-www-form-urlencoded`) ούτε JSON, ή το σύνολο χαρακτήρων του δεν είναι UTF-8 (σελίδα HTML).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Όριο ρυθμού αιτημάτων (σελίδα HTML), με `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Απρόσμενη αποτυχία (σελίδα HTML με τίτλο «Server error», σφάλμα διακομιστή). Ο διακομιστής την καταγράφει.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Ο διακομιστής είναι απασχολημένος (η βάση δεδομένων παρέμεινε κλειδωμένη ή ο διακομιστής έχει μείνει πολύ πίσω· με `Retry-After`) ή άργησε υπερβολικά (σελίδα HTML με τίτλο «Server error», σφάλμα διακομιστή).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: Η μοναδική μορφή κάθε απάντησης σφάλματος του JSON API.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Ο κωδικός σφάλματος σε `snake_case`. Από αυτόν ένας πελάτης επιλέγει τι θα εμφανίσει.
          examples:
            - rate_limited
        message:
          type: string
          description: Μια πρόταση στα αγγλικά, για τα αρχεία καταγραφής και ως εναλλακτική λύση.
        retryAfter:
          type: integer
          minimum: 1
          description: Δευτερόλεπτα αναμονής πριν από νέα προσπάθεια, μόνο στις απορρίψεις που λήγουν με τον χρόνο. Η απάντηση φέρει τότε και κεφαλίδα `Retry-After` με την ίδια τιμή, εκτός από το 503 `busy` των αναγνώσεων ιστορικού, παρτίδας, παίκτη και πίνακα κατάταξης.
        field:
          type: string
          description: Το πεδίο ή η παράμετρος ερωτήματος που φταίει (`invalid_request`, `invalid_option`, και τα `invalid_cursor`, `invalid_limit` και `invalid_filter` του `GET /account/games`). Ένα ένθετο πεδίο γράφεται με τελείες (`pow.nonce`).
        reason:
          type: string
          description: 'Γιατί: ο κανόνας που παραβιάζει ένα `weak_password` ή γιατί ζητήθηκε ή απορρίφθηκε μια απόδειξη εργασίας (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Μόνο για `banned`: το τέλος της αναστολής (ms από την εποχή Unix), `null` για μόνιμη αναστολή.'
        line:
          type: integer
          minimum: 1
          description: 'Μόνο για `invalid_pgn`: η γραμμή του σφάλματος, από 1.'
        column:
          type: integer
          minimum: 1
          description: 'Μόνο για `invalid_pgn`: η στήλη του σφάλματος, από 1, σε χαρακτήρες.'
    PowChallenge:
      type: object
      description: Μια πρόκληση απόδειξης εργασίας (το `pow` ενός 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Η υπογεγραμμένη πρόκληση, για να σταλεί πίσω όπως είναι.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Ο αριθμός των αρχικών μηδενικών bit που πρέπει να έχει το `SHA-256(challenge + ":" + nonce)`.
        expiresAt:
          type: integer
          format: int64
          description: Πότε λήγει η πρόκληση (ms από την εποχή Unix), 2 λεπτά μετά την έκδοσή της.
    PowAnswer:
      type: object
      description: Η απάντηση σε μια πρόκληση απόδειξης εργασίας.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: Το `challenge` της απάντησης 428, όπως δόθηκε.
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Μια συμβολοσειρά με το πολύ 20 ψηφία (στο δεκαδικό σύστημα), τέτοια ώστε το `SHA-256(challenge + ":" + nonce)` να αρχίζει με `bits` μηδενικά bit.
    ServerInfo:
      type: object
      description: Ό,τι χρειάζεται ένας πελάτης πριν συνδεθεί σε λογαριασμό ή στον διακομιστή.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Το όνομα του διακομιστή (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: Ένα UUID που λαμβάνει η βάση δεδομένων στην πρώτη της εκκίνηση. Παραμένει ίδιο μετά από επανεκκινήσεις. Είναι `null` όταν η βάση δεδομένων δεν μπορεί να το δώσει.
        motd:
          type: string
          description: Το μήνυμα της ημέρας (`SERVER_MOTD`), ενδεχομένως κενό.
        protocol:
          type: object
          description: Το πρωτόκολλο WebSocket (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Η παλαιότερη έκδοση του πρωτοκόλλου που υποστηρίζει ο διακομιστής.
            max:
              type: integer
              minimum: 1
              description: Η νεότερη έκδοση του πρωτοκόλλου που υποστηρίζει ο διακομιστής.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'Το αποτύπωμα του σχήματος του πρωτοκόλλου (τα 4 πρώτα byte του SHA-256 της κανονικής του μορφής, ως ακέραιος χωρίς πρόσημο: `0xc649140f`, 3326678031, για την ελάσσονα έκδοση 2 του πρωτοκόλλου)· ενημερωτικό, δεν συγκρίνεται ποτέ.'
            subprotocol:
              type: string
              description: Το token του υποπρωτοκόλλου WebSocket (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: Η θύρα WebSocket που χρησιμοποιούν οι παίκτες (`PUBLIC_WS_PORT`, αλλιώς `WS_PORT`, αλλιώς `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: Η διαδρομή του WebSocket.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Αν μπορούν να δημιουργηθούν νέοι λογαριασμοί.
        emailVerification:
          type: boolean
          description: Αν οι νέοι λογαριασμοί επιβεβαιώνουν τη διεύθυνσή τους (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Αν η σύνδεση με Google προσφέρεται στο παιχνίδι.
            googleWeb:
              type: boolean
              description: Αν η σύνδεση με Google προσφέρεται και σε ιστότοπο (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: Ο έλεγχος ταυτότητας δύο παραγόντων είναι πάντα διαθέσιμος.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Τα bit απόδειξης εργασίας που χρειάζεται η εγγραφή (0 για καθόλου).
        categories:
          type: array
          description: Οι επίσημοι χρόνοι σκέψης, που βαθμολογούνται (`RATED_CATEGORIES`), με τη σειρά του διακομιστή. Κάθε άλλος χρόνος σκέψης είναι `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Οι κανόνες που μπορεί να ελέγξει ένας πελάτης πριν στείλει μια φόρμα.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: Το συντομότερο όνομα χρήστη (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: Το μεγαλύτερο όνομα χρήστη (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Η κανονική έκφραση με την οποία πρέπει να ταιριάζει ένα νέο όνομα χρήστη.
            passwordMinLength:
              type: integer
              description: Ο συντομότερος κωδικός πρόσβασης, σε χαρακτήρες (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Ο μεγαλύτερος κωδικός πρόσβασης, σε byte UTF-8.
            customTimeControls:
              type: boolean
              description: Αν οι προκλήσεις και οι ιδιωτικές παρτίδες μπορούν να χρησιμοποιούν προσαρμοσμένους χρόνους σκέψης.
            reportsPerDay:
              type: integer
              description: Πόσες αναφορές μπορεί να υποβάλει ένας παίκτης ανά 24 ώρες (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Το μεγαλύτερο μήνυμα WebSocket που μπορεί να στείλει ένας πελάτης, σε byte.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Ένας επίσημος χρόνος σκέψης.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Το αναγνωριστικό της κατηγορίας, λεπτά και δευτερόλεπτα προσαύξησης (`3+2`).
        baseSec:
          type: number
          minimum: 0
          description: Ο βασικός χρόνος, σε δευτερόλεπτα.
        incSec:
          type: number
          minimum: 0
          description: Η προσαύξηση ανά κίνηση, σε δευτερόλεπτα.
    AccountView:
      type: object
      description: Ο λογαριασμός όπως τον βλέπει ο παίκτης του (`user` των απαντήσεων σύνδεσης και του `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: Το αναγνωριστικό του λογαριασμού.
        username:
          type: string
          description: Το όνομα χρήστη.
        email:
          type: string
          format: email
          description: Η διεύθυνση email.
        emailVerified:
          type: boolean
          description: Αν η διεύθυνση έχει επιβεβαιωθεί.
        mfaEnabled:
          type: boolean
          description: Αν ο έλεγχος ταυτότητας δύο παραγόντων είναι ενεργός.
        googleLinked:
          type: boolean
          description: Αν υπάρχει διασυνδεδεμένος λογαριασμός Google.
        hasPassword:
          type: boolean
          description: '`false` για λογαριασμό που δημιουργήθηκε μέσω Google και δεν έχει ορίσει ακόμη κωδικό πρόσβασης.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Αν γίνονται δεκτές άμεσες προκλήσεις μέσω ονόματος (βλ. `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Πότε δημιουργήθηκε ο λογαριασμός (ms από την εποχή Unix).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Η τελευταία σύνδεση (ms από την εποχή Unix) ή `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Η νέα διεύθυνση μιας αλλαγής email που περιμένει τον σύνδεσμό της ή `null`.
    SessionAnswer:
      type: object
      description: Μια νέα συνεδρία.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Το token συνεδρίας, για την κεφαλίδα `Authorization` και το WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: Το απόλυτο τέλος της συνεδρίας (ms από την εποχή Unix)· το όριο αδράνειας μπορεί να την τερματίσει νωρίτερα.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Το δεύτερο βήμα μιας σύνδεσης με έλεγχο ταυτότητας δύο παραγόντων· συνεχίστε με `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Το token του βήματος, για το `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Δευτερόλεπτα που απομένουν για να ολοκληρωθεί το βήμα.
    LoginAnswer:
      description: Μια συνεδρία ή το δεύτερο βήμα μιας σύνδεσης με έλεγχο ταυτότητας δύο παραγόντων.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Μια πρώτη σύνδεση με Google· συνεχίστε με `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Το ticket για το `POST /auth/sso/complete`, έγκυρο για 10 λεπτά.
        suggestedUsername:
          type: string
          description: Ένα όνομα χρήστη φτιαγμένο από το όνομα Google ή τη διεύθυνση, ή `""` όταν δεν ταιριάζει τίποτα.
    SsoNeedsPassword:
      type: object
      description: Ένας λογαριασμός με κωδικό πρόσβασης χρησιμοποιεί τη διεύθυνση· συνεχίστε με `POST /auth/sso/google/link`. Δεν έχει διασυνδεθεί ακόμη τίποτα.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Το ticket για το `POST /auth/sso/google/link`.
        username:
          type: string
          description: Το όνομα χρήστη εκείνου του λογαριασμού (το βλέπει μόνο όποιος απέδειξε στη Google ότι κατέχει τη διεύθυνση).
        expiresIn:
          type: integer
          const: 600
          description: Δευτερόλεπτα για τα οποία το ticket παραμένει έγκυρο.
    SsoFinishAnswer:
      description: Η απάντηση του `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Μια απόπειρα σύνδεσης με Google.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Η απόπειρα, για το `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: Το URL της Google για άνοιγμα στο πρόγραμμα περιήγησης του συστήματος, αφού ελεγχθεί.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Το `state` που πρέπει να στείλει πίσω η Google.
        expiresIn:
          type: integer
          const: 600
          description: Δευτερόλεπτα για τα οποία η απόπειρα παραμένει έγκυρη.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Το όνομα χρήστη· στη συνέχεια ισχύουν οι κανόνες του διακομιστή (βλ. την περιγραφή).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Η διεύθυνση email. Αφαιρούνται τα κενά στην αρχή και στο τέλος και αποθηκεύεται με πεζά γράμματα.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Ο κωδικός πρόσβασης· στη συνέχεια ισχύουν οι κανόνες κωδικού πρόσβασης.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Το όνομα χρήστη ή η διεύθυνση email (οποιοδήποτε κείμενο με `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Προαιρετικό. Εμφανίζεται στη λίστα των συνδεδεμένων συσκευών (όπως `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: Το `mfaToken` της απάντησης σύνδεσης (ή της απάντησης μιας σύνδεσης με Google).
        code:
          type: string
          maxLength: 32
          description: Προαιρετικό. Ένας 6ψήφιος κωδικός της εφαρμογής ελέγχου ταυτότητας ή ένας κωδικός ανάκτησης.
        recoveryCode:
          type: string
          maxLength: 32
          description: Προαιρετικό. Ένας κωδικός ανάκτησης. Χρειάζεται ένα από τα `code` και `recoveryCode`.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Η διεύθυνση email.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Η παράμετρος `token` του συνδέσμου επαναφοράς.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Ο νέος κωδικός πρόσβασης· ισχύουν οι κανόνες κωδικού πρόσβασης της εγγραφής.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Η πρόκληση PKCE S256 του `codeVerifier` του πελάτη (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Η θύρα του listener του πελάτη στο `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Η πρόκληση PKCE S256 του `codeVerifier` της σελίδας (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: Το `attemptId` του `POST /auth/sso/google/start`.
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: Ο επαληθευτής PKCE· το SHA-256 του πρέπει να ταιριάζει με την πρόκληση που δόθηκε στο `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Το `state` όπως το έστειλε πίσω η Google.
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: Το `code` όπως το έστειλε πίσω η Google (εκτυπώσιμοι χαρακτήρες ASCII χωρίς κενά).
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Προαιρετικό. Το `iss` όπως το έστειλε πίσω η Google, όταν το έστειλε.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: Το `linkTicket` του `finish`, έγκυρο για 10 λεπτά.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Ο κωδικός πρόσβασης του λογαριασμού.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: Το `ssoTicket` του `finish`, έγκυρο για 10 λεπτά.
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Το όνομα χρήστη· ισχύουν οι κανόνες της εγγραφής.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Οι ενεργές συνεδρίες, πρώτα εκείνες που χρησιμοποιήθηκαν πιο πρόσφατα.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Μια ενεργή συνεδρία (μια συνδεδεμένη συσκευή).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: Το αναγνωριστικό της συνεδρίας, για το `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: Η στιγμή της σύνδεσης (ms από την εποχή Unix).
        lastSeenAt:
          type: integer
          format: int64
          description: Η τελευταία χρήση (ms από την εποχή Unix), που ενημερώνεται το πολύ μία φορά ανά 5 λεπτά (αργότερα όσο ο διακομιστής έχει μείνει πολύ πίσω).
        expiresAt:
          type: integer
          format: int64
          description: Το απόλυτο τέλος (ms από την εποχή Unix)· το όριο αδράνειας μπορεί να τερματίσει τη συνεδρία νωρίτερα.
        clientLabel:
          type:
            - string
            - 'null'
          description: Το `clientLabel` της σύνδεσης ή `null` όταν δεν στάλθηκε κανένα.
        current:
          type: boolean
          description: Αν αυτή είναι η συνεδρία που κάνει το αίτημα.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Μία καταχώριση για κάθε κατηγορία στην οποία ο παίκτης έχει παίξει παρτίδες με βαθμολογία.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Οι ενεργές κυρώσεις.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }` όσο ο λογαριασμός είναι σε αναστολή, αλλιώς `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Η καταχώριση βαθμολογίας μιας κατηγορίας.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: Το αναγνωριστικό της κατηγορίας.
        rating:
          type: integer
          description: Η βαθμολογία.
        games:
          type: integer
          minimum: 0
          description: Οι παρτίδες που παίχτηκαν στην κατηγορία (καταμετρημένες ή όχι).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Η υψηλότερη βαθμολογία που επιτεύχθηκε.
        provisional:
          type: boolean
          description: '`true` όσο ο παίκτης είναι ακόμη αβαθμολόγητος ή η βαθμολογία στηρίζεται σε λιγότερες από `PROVISIONAL_GAMES` καταμετρημένες παρτίδες (το παιχνίδι τη δείχνει ως `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Το είδος της κύρωσης.
        reason:
          type:
            - string
            - 'null'
          description: Ο λόγος που δόθηκε, αν υπάρχει.
        startsAt:
          type: integer
          format: int64
          description: Η έναρξη (ms από την εποχή Unix).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Η λήξη (ms από την εποχή Unix), `null` όταν η κύρωση είναι μόνιμη.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Το τέλος της αναστολής (ms από την εποχή Unix), `null` όταν είναι μόνιμη.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` για αποδοχή άμεσων προκλήσεων μέσω ονόματος, `none` για απόρριψή τους.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Ο τρέχων κωδικός πρόσβασης.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Ο νέος κωδικός πρόσβασης· ισχύουν οι κανόνες κωδικού πρόσβασης της εγγραφής.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Ο κωδικός πρόσβασης του λογαριασμού.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Ένας κωδικός του εκκρεμούς μυστικού, ακριβώς 6 ψηφία.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Ο κωδικός πρόσβασης του λογαριασμού.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Προαιρετικό· απαιτείται με έλεγχο ταυτότητας δύο παραγόντων (ή `recoveryCode`). Ένας κωδικός της εφαρμογής ελέγχου ταυτότητας ή ένας κωδικός ανάκτησης.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Προαιρετικό. Ένας κωδικός ανάκτησης (`xxxx-xxxx-xx`· τα πεζά-κεφαλαία, τα κενά και οι παύλες δεν έχουν σημασία).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Ο κωδικός πρόσβασης του λογαριασμού.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Ένας κωδικός της εφαρμογής ελέγχου ταυτότητας (ένας κωδικός ανάκτησης απορρίπτεται).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Η νέα διεύθυνση· αφαιρούνται τα κενά στην αρχή και στο τέλος και τα γράμματα γίνονται πεζά, και μετά ελέγχεται όπως μια διεύθυνση εγγραφής.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Ο κωδικός πρόσβασης του λογαριασμού.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Προαιρετικό· απαιτείται με έλεγχο ταυτότητας δύο παραγόντων (ή `recoveryCode`). Ένας κωδικός της εφαρμογής ελέγχου ταυτότητας ή ένας κωδικός ανάκτησης.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Προαιρετικό. Ένας κωδικός ανάκτησης.
    TotpSetup:
      type: object
      description: Το εκκρεμές μυστικό για την εφαρμογή ελέγχου ταυτότητας.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Το μυστικό σε base32, για πληκτρολόγηση στην εφαρμογή.
        uri:
          type: string
          format: uri
          description: Το URI `otpauth://totp/...`, για εμφάνιση ως κωδικός QR.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Δευτερόλεπτα ανά χρονικό βήμα.
    RecoveryCodeList:
      type: array
      description: Οι 10 κωδικοί ανάκτησης, που εμφανίζονται μόνο αυτή τη φορά. Ο καθένας λειτουργεί μία φορά.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Η μία πλευρά μιας παρτίδας.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Το όνομα στην καταγραφή της παρτίδας (`deleted#<id>` για διαγραμμένο λογαριασμό).
        rating:
          type:
            - integer
            - 'null'
          description: Η βαθμολογία κατά την έναρξη, `null` όταν είναι άγνωστη.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Η βαθμολογία μετά την παρτίδα. Μια παρτίδα με βαθμολογία την έχει πάντα· `null` μόνο για παρτίδα που δεν μετράει για τις βαθμολογίες (φιλική, προσαρμοσμένη, ακυρωμένη).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Η μεταβολή της βαθμολογίας, `0` όταν οι κανόνες βαθμολογίας αφήνουν τη βαθμολογία όπου ήταν (μηδενικό σκορ κατά τη FIDE, αβαθμολόγητος αντίπαλος, οι πρώτες παρτίδες ενός αβαθμολόγητου παίκτη)· `null` στις ίδιες περιπτώσεις με το `ratingAfter`.
    GameSummary:
      type: object
      description: Η σύνοψη μιας αποθηκευμένης παρτίδας.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Το αναγνωριστικό της παρτίδας.
        category:
          type: string
          description: Το αναγνωριστικό της επίσημης κατηγορίας (`3+2`) ή `custom`.
        rated:
          type: boolean
          description: Αν η παρτίδα μετράει για τις βαθμολογίες.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Ο χρόνος σκέψης σε δευτερόλεπτα (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (βλ. τους κωδικούς παρτίδων).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Ο κωδικός του λόγου λήξης (βλ. τους κωδικούς παρτίδων).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Το αποτέλεσμα, `*` για ακυρωμένη παρτίδα.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Ο αριθμός των ημικινήσεων.
        startedAt:
          type: integer
          format: int64
          description: Η έναρξη (ms από την εποχή Unix).
        endedAt:
          type: integer
          format: int64
          description: Η λήξη (ms από την εποχή Unix).
    Termination:
      type: string
      description: Το όνομα του λόγου λήξης (βλ. τους κωδικούς παρτίδων)· `Unknown` για κωδικό που το πρωτόκολλο δεν γνωρίζει.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Σύνοψη παρτίδας από την πλευρά ενός παίκτη.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Η πλευρά του παίκτη.
    HistoryGameSummary:
      description: Μια παρτίδα του ιστορικού του συνδεδεμένου παίκτη.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Ο βασικός χρόνος σε χιλιοστά του δευτερολέπτου.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Η προσαύξηση σε χιλιοστά του δευτερολέπτου.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: Η έκβαση από την πλευρά του παίκτη.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Οι παρτίδες της σελίδας, πρώτα οι νεότερες.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Το αναγνωριστικό που δίνεται ως `before` για την επόμενη σελίδα ή `null` στην τελευταία σελίδα.
        total:
          type: integer
          minimum: 0
          description: Ο αριθμός των παρτίδων που ταιριάζουν στο φίλτρο, σε όλες τις σελίδες.
    MoveRecord:
      type: object
      description: Μία ημικίνηση μιας παρτίδας.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: Η κίνηση σε σημειογραφία UCI, με προσθήκη `n`, `b`, `r` ή `q` για προαγωγή.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Ο χρόνος που χρεώθηκε για την κίνηση (ms), `null` όταν δεν υπάρχει στην καταγραφή.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Το ρολόι του παίκτη που έκανε την κίνηση, μετά από αυτήν (ms), `null` όταν δεν υπάρχει στην καταγραφή.
    PgnTagsView:
      type: object
      description: Οι κύριες ετικέτες PGN, για εμφάνιση. Το `Termination` εδώ είναι το όνομα του λόγου λήξης· το αρχείο PGN χρησιμοποιεί τις τυπικές τιμές PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` ή `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: Η ημερομηνία έναρξης σε UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Η βαθμολογία κατά την έναρξη ή `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Η βαθμολογία κατά την έναρξη ή `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Η καταγραφή μιας παρτίδας με τις κινήσεις και τα ρολόγια της. Έχει τα πεδία μιας σύνοψης παρτίδας, χωρίς `color` και `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Ο βασικός χρόνος σε χιλιοστά του δευτερολέπτου.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Η προσαύξηση σε χιλιοστά του δευτερολέπτου.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: Το όνομα του `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: Το αναγνωριστικό της παρτίδας της οποίας αυτή είναι ρεβάνς ή `null`.
            moves:
              type: array
              description: Ένα στοιχείο ανά ημικίνηση.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Μόνο όταν ο παίκτης του token έπαιξε αυτή την παρτίδα· η πλευρά του.
            reportable:
              type: boolean
              description: Μόνο όταν ο παίκτης του token έπαιξε αυτή την παρτίδα· `true` όταν το `POST /reports` θα δεχόταν τώρα μια αναφορά του αντιπάλου για αυτή την παρτίδα (η παρτίδα τελείωσε μέσα σε 7 ημέρες, η ημερήσια ποσόστωση δεν έχει εξαντληθεί και ο αντίπαλος δεν έχει ήδη αναφερθεί για αυτή την παρτίδα).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Το όνομα χρήστη, όπως το έγραψε ο παίκτης.
        createdAt:
          type: integer
          format: int64
          description: Πότε δημιουργήθηκε ο λογαριασμός (ms από την εποχή Unix).
        ratings:
          type: array
          description: Μόνο οι επίσημες κατηγορίες, με τη σειρά του διακομιστή.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Κάθε αποθηκευμένη παρτίδα, μαζί με τις φιλικές και τις ακυρωμένες.
            rated:
              type: integer
              minimum: 0
              description: Οι παρτίδες με βαθμολογία, αθροισμένες από τις καταχωρίσεις βαθμολογίας.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Το όνομα χρήστη, όπως το έγραψε ο παίκτης.
        games:
          type: array
          description: Οι παρτίδες της σελίδας, πρώτα οι νεότερες.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Το αναγνωριστικό της τελευταίας παρτίδας όποτε η σελίδα είναι γεμάτη (η επόμενη σελίδα μπορεί τότε να είναι κενή), αλλιώς `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: Το αναγνωριστικό της κατηγορίας.
        minGames:
          type: integer
          minimum: 0
          description: Οι καταμετρημένες παρτίδες που χρειάζεται μια καταχώριση για να εμφανιστεί στη λίστα (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Πότε υπολογίστηκε ο πίνακας κατάταξης (ms από την εποχή Unix).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: Το κείμενο PGN, το πολύ 65.536 byte UTF-8. Χρησιμοποιείται μόνο η πρώτη παρτίδα.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Προαιρετικό. Το μέγεθος της εικόνας.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Προαιρετικό. Η πλευρά στο κάτω μέρος της σκακιέρας.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Προαιρετικό. Χιλιοστά του δευτερολέπτου ανά κίνηση, ένας αριθμός JSON με ακέραια τιμή.
        coords:
          type: boolean
          default: true
          description: Προαιρετικό. Αν τα γράμματα των στηλών και οι αριθμοί των γραμμών σχεδιάζονται γύρω από τη σκακιέρα.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Η παρτίδα, ως ακέραιος ή ως συμβολοσειρά 1 έως 16 ψηφίων.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Το όνομα χρήστη του αντιπάλου, όπως στην καταγραφή της παρτίδας ή όπως είναι τώρα, χωρίς διάκριση πεζών-κεφαλαίων. Δεν μπορεί να είναι κενό.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Το θέμα της αναφοράς.
        comment:
          type:
            - string
            - 'null'
          description: Προαιρετικό. Το πολύ 500 χαρακτήρες, αφού αφαιρεθούν οι χαρακτήρες ελέγχου (εκτός από το tab και την αλλαγή γραμμής) και τα κενά στην αρχή και στο τέλος του κειμένου.
    AccountExport:
      type: object
      description: Όλα όσα κρατά ο διακομιστής για τον λογαριασμό (οι χρόνοι σε ms από την εποχή Unix).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Πότε έγινε η εξαγωγή.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Τι περιέχει και τι παραλείπει το αρχείο, σε απλά αγγλικά για τον παίκτη.
          items:
            type: string
        account:
          description: Η προβολή λογαριασμού του `GET /account/me`, με `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Η διεύθυνση του διασυνδεδεμένου λογαριασμού Google ή `null`.
        ratings:
          type: array
          description: Οι πλήρεις καταχωρίσεις βαθμολογίας.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Μονάδες βαθμολογίας που επιστράφηκαν αφού διαπιστώθηκε ότι ένας αντίπαλος έκανε απάτη, αθροισμένες ανά ημέρα UTC και κατηγορία, πρώτα οι νεότερες. Δεν κατονομάζονται ούτε οι παρτίδες ούτε οι απατεώνες.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Κάθε αποθηκευμένη συνεδρία, πρώτα οι νεότερες, χωρίς κανένα token. Η εκκαθάριση διατήρησης δεδομένων διαγράφει μια συνεδρία που έχει λήξει, και μια αποσυνδεδεμένη μία ημέρα μετά την αποσύνδεση.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Τα συμβάντα ασφαλείας, πρώτα τα νεότερα, που διατηρούνται `RETENTION_SECURITY_DAYS` ημέρες.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Κάθε κύρωση, μαζί και όσες έχουν αρθεί. Το όνομα του συντονιστή δεν περιλαμβάνεται ποτέ.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Τα συμβάντα συμπεριφοράς που καταγράφηκαν για τις παρτίδες του παίκτη που εγκαταλείφθηκαν, ακυρώθηκαν ή στις οποίες δεν εμφανίστηκε, που διατηρούνται 30 ημέρες.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Οι αναφορές που έκανε ο παίκτης.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Ο αριθμός των παρτίδων.
            list:
              type: array
              description: Κάθε παρτίδα, πρώτα οι νεότερες, ως συνόψεις του `GET /account/games`. Οι κινήσεις βρίσκονται στο `GET /games/{id}` και το PGN στο `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Μια πλήρης καταχώριση βαθμολογίας.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Αν ο παίκτης δεν είναι πλέον αβαθμολόγητος.
            countedGames:
              type: integer
              minimum: 0
              description: Οι παρτίδες που υπολογίστηκαν στη βαθμολογία.
            updatedAt:
              type: integer
              format: int64
              description: Πότε άλλαξε τελευταία φορά η καταχώριση.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: Η ώρα 00:00 UTC της ημέρας (ms από την εποχή Unix).
        category:
          type: string
        points:
          type: integer
          description: Οι μονάδες που επιστράφηκαν εκείνη την ημέρα σε εκείνη την κατηγορία.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Πότε αποσυνδέθηκε η συνεδρία ή `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Η διεύθυνση της σύνδεσης, που διαγράφεται μετά από `RETENTION_IP_DAYS`.
    SecurityEvent:
      type: object
      description: |-
        Ένα συμβάν ασφαλείας. Το `ip` δίνεται μόνο για ό,τι έγινε με συνδεδεμένη συνεδρία, με τον κωδικό πρόσβασης του λογαριασμού (και τον δεύτερο παράγοντα) ή με σύνδεσμο που στάλθηκε στη διεύθυνσή του: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` και `account_exported`· κάθε άλλο είδος έχει `ip: null`, και το `ip` διαγράφεται μετά από `RETENTION_IP_DAYS`.

        Το `detail` κρατά μόνο αυτά τα πεδία: `login`: `method`· `sso_login`, `sso_account_created`: `provider`· `sso_linked`: `provider` και `method` (`password` ή `password+totp`)· `login_failed`: `failures`· `login_lockout`: `retryAfterMs`· `mfa_failed`: `attempts`· `recovery_code_used`: `remaining`· `reauth_failed`: `factor`· `session_revoked` και `sessions_revoked_all`: `reason`· `email_change_refused`: `reason`· `sanction_auto`: `kind`, `gameId`, `until`. Ένα συμβάν `moderator_action` κρατά μόνο το `{ action }`, για τις ενέργειες `ban`, `unban`, `reset_mfa`, `verify_email` και `revoke_sessions` (οι άλλες ενέργειες των συντονιστών παραλείπονται). Κάθε άλλο είδος έχει `detail: null`. Τα συμβάντα `rating_refund` παραλείπονται: οι μονάδες τους βρίσκονται στο `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Το είδος του συμβάντος (`login`, `password_changed`…).
        at:
          type: integer
          format: int64
          description: Πότε συνέβη.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: Το τρέχον δημόσιο όνομα του παίκτη που αναφέρθηκε.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Αν η αναφορά είναι ακόμη ανοιχτή (δεν αποκαλύπτεται αν επιβλήθηκε κύρωση στον παίκτη που αναφέρθηκε).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Το token του συνδέσμου email (το κρυφό πεδίο της φόρμας της σελίδας).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Το token του συνδέσμου επαναφοράς (το κρυφό πεδίο της φόρμας).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Ο νέος κωδικός πρόσβασης· ισχύουν οι κανόνες κωδικού πρόσβασης της εγγραφής.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Ξανά ο νέος κωδικός πρόσβασης· πρέπει να είναι ίδιος.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: Μια σελίδα HTML σε UTF-8 (`text/html; charset=utf-8`), χωρίς JavaScript ή εξωτερικούς πόρους.
