  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Αλλαγή κωδικού πρόσβασης
      description: |-
        Αλλάζει τον κωδικό πρόσβασης. Χρειάζεται ο τρέχων κωδικός πρόσβασης, αλλά όχι δεύτερος παράγοντας, ακόμη και όταν ο έλεγχος ταυτότητας δύο παραγόντων είναι ενεργός. Ο νέος κωδικός πρόσβασης ακολουθεί τους κανόνες της εγγραφής (ελέγχεται μετά τον τρέχοντα κωδικό πρόσβασης).

        Η αλλαγή έχει τα εξής αποτελέσματα, σε μία συναλλαγή (όλα ή κανένα): ανακαλεί κάθε άλλη συνεδρία (αυτή εδώ παραμένει συνδεδεμένη), ακυρώνει μια εκκρεμή αλλαγή email, κάνει τους συνδέσμους επαναφοράς κωδικού πρόσβασης του λογαριασμού να παύσουν να λειτουργούν και στέλνει ένα email στον κάτοχο.

        **Επανέλεγχος ταυτότητας:** μόνο ο κωδικός πρόσβασης. **Όρια:** `reauth`, μετά `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Ο κωδικός πρόσβασης άλλαξε.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (λογαριασμός μόνο με Google), `weak_password` (με `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: λάθος τρέχων κωδικός πρόσβασης ή επαναφορά ή αλλαγή του κωδικού πρόσβασης που ολοκληρώθηκε ενώ ελεγχόταν το αίτημα.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (αποτυχημένοι επανέλεγχοι ταυτότητας του λογαριασμού) ή `rate_limited` (το όριο `reauth` ή `reauth_user`, ο προϋπολογισμός του λογαριασμού, η ουρά κατακερματισμού κωδικών πρόσβασης).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: η ουρά κατακερματισμού κωδικών πρόσβασης ή η βάση δεδομένων παρέμεινε κλειδωμένη (`retryAfter: 1`, δεν άλλαξε τίποτα). `timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Έναρξη ενεργοποίησης του ελέγχου ταυτότητας δύο παραγόντων
      description: |-
        Αποθηκεύει ένα νέο εκκρεμές μυστικό ελέγχου ταυτότητας, που αντικαθιστά οποιοδήποτε προηγούμενο εκκρεμές, και το επιστρέφει για την εφαρμογή ελέγχου ταυτότητας (ως κείμενο και ως URI `otpauth://` για εμφάνιση ως κωδικός QR). Ο έλεγχος ταυτότητας δύο παραγόντων δεν είναι ακόμη ενεργός: το `POST /account/mfa/totp/enable` τον ενεργοποιεί με έναν κωδικό αυτού του μυστικού.

        **Επανέλεγχος ταυτότητας:** μόνο ο κωδικός πρόσβασης. **Όρια:** `reauth`, μετά `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Το εκκρεμές μυστικό.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (λογαριασμός μόνο με Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (ελέγχεται πριν από τον κωδικό πρόσβασης).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (αποτυχημένοι επανέλεγχοι ταυτότητας του λογαριασμού) ή `rate_limited` (το όριο `reauth` ή `reauth_user`, ο προϋπολογισμός του λογαριασμού, η ουρά κατακερματισμού κωδικών πρόσβασης).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (η ουρά κατακερματισμού κωδικών πρόσβασης ή η βάση δεδομένων παρέμεινε κλειδωμένη), `timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Ολοκλήρωση ενεργοποίησης του ελέγχου ταυτότητας δύο παραγόντων και λήψη κωδικών ανάκτησης
      description: |-
        Ενεργοποιεί τον έλεγχο ταυτότητας δύο παραγόντων με έναν κωδικό του εκκρεμούς μυστικού (ακριβώς 6 ψηφία). Εδώ δεν ζητείται κωδικός πρόσβασης· δόθηκε κατά τη ρύθμιση. Η απάντηση περιέχει 10 κωδικούς ανάκτησης, που εμφανίζονται μόνο αυτή τη φορά.

        **Όρια:** `reauth`, μετά `reauth_user`· ένας λάθος κωδικός μετράει στις αποτυχίες επανελέγχου ταυτότητας του λογαριασμού.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Ο έλεγχος ταυτότητας δύο παραγόντων είναι ενεργός.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: το `code` δεν έχει ακριβώς 6 ψηφία ή το σώμα παραβιάζει το σχήμα· `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: λάθος κωδικός (ελέγξτε την ώρα της συσκευής).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`· `mfa_setup_required`: δεν υπάρχει εκκρεμές μυστικό (καλέστε πρώτα το `POST /account/mfa/totp/setup`).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (αποτυχημένοι επανέλεγχοι ταυτότητας του λογαριασμού) ή `rate_limited` (το όριο `reauth` ή `reauth_user`, ο προϋπολογισμός του λογαριασμού).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (η βάση δεδομένων παρέμεινε κλειδωμένη), `timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: Απενεργοποίηση του ελέγχου ταυτότητας δύο παραγόντων
      description: |-
        Απενεργοποιεί τον έλεγχο ταυτότητας δύο παραγόντων. Το μυστικό και οι κωδικοί ανάκτησης διαγράφονται, και ο κάτοχος λαμβάνει ένα email.

        **Επανέλεγχος ταυτότητας:** ο κωδικός πρόσβασης και ένας κωδικός της εφαρμογής ελέγχου ταυτότητας ή ένας κωδικός ανάκτησης (απαιτείται ένα από τα `code` ή `recoveryCode`). **Όρια:** `reauth`, μετά `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Ο έλεγχος ταυτότητας δύο παραγόντων είναι ανενεργός.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (λογαριασμός μόνο με Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required` (ούτε `code` ούτε `recoveryCode`, ελέγχεται πριν από τον κωδικό πρόσβασης), `invalid_password`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (αποτυχημένοι επανέλεγχοι ταυτότητας ή υπερβολικά πολλοί κωδικοί που δοκιμάστηκαν σε αυτόν τον λογαριασμό) ή `rate_limited` (το όριο `reauth` ή `reauth_user`, ο προϋπολογισμός του λογαριασμού, η ουρά κατακερματισμού κωδικών πρόσβασης).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (η ουρά κατακερματισμού κωδικών πρόσβασης ή η βάση δεδομένων παρέμεινε κλειδωμένη), `timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
  /account/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags:
        - two-step-verification
      summary: Αντικατάσταση των κωδικών ανάκτησης
      description: |-
        Αντικαθιστά τους κωδικούς ανάκτησης με 10 νέους· οι παλιοί παύουν να λειτουργούν.

        **Επανέλεγχος ταυτότητας:** ο κωδικός πρόσβασης και ένας κωδικός της εφαρμογής ελέγχου ταυτότητας στο `code` (ένας κωδικός ανάκτησης απορρίπτεται με 403 `invalid_code`). **Όρια:** `reauth`, μετά `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
