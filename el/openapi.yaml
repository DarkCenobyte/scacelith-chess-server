  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Διασύνδεση της Google με υπάρχοντα λογαριασμό μέσω του κωδικού πρόσβασής του
      description: |-
        Αφού το `finish` απάντησε `needsPassword`: διασυνδέει τη Google με τον υπάρχοντα λογαριασμό χάρη στον κωδικό πρόσβασης αυτού του λογαριασμού, που πληκτρολογείται στο παιχνίδι. Η απάντηση (200) είναι μια συνεδρία (η διασύνδεση αποθηκεύεται και ο παίκτης συνδέεται) ή, όταν ο έλεγχος ταυτότητας δύο παραγόντων είναι ενεργός, `{ mfaRequired, mfaToken, expiresIn }`: συνεχίστε με `POST /auth/login/mfa`, και η διασύνδεση αποθηκεύεται μόνο όταν περάσει εκεί ένας κωδικός.

        Ένας λάθος κωδικός πρόσβασης αφήνει το ticket χρησιμοποιήσιμο, για 5 δοκιμές συνολικά. Μια δοκιμή αφαιρείται ακριβώς πριν ελεγχθεί ο κωδικός πρόσβασης: ένα 429 `too_many_attempts` ή ένα 428 `pow_required` δεν αφαιρεί καμία, ενώ μια απόρριψη από την ουρά κατακερματισμού κωδικών πρόσβασης (503 `server_busy`, 429 `rate_limited`) έχει ήδη αφαιρέσει μία και μετρά ως αποτυχία του λογαριασμού. Η καθυστέρηση μετά από αποτυχημένες προσπάθειες χρησιμοποιεί τον ίδιο μετρητή με το `POST /auth/login`.

        **Όριο:** `auth` (με τη μέτρησή του ανά /48 IPv6). **Απόδειξη εργασίας:** όπως για το `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Μια συνεδρία ή το δεύτερο βήμα της σύνδεσης.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: λάθος κωδικός πρόσβασης· το ticket διατηρείται, για 5 προσπάθειες συνολικά.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (με `until`), μόνο μετά από σωστό κωδικό πρόσβασης.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: η σύνδεση με Google δεν προσφέρεται σε αυτόν τον διακομιστή.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: ο λογαριασμός Google διασυνδέθηκε στο μεταξύ με άλλον λογαριασμό.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: άγνωστο, χρησιμοποιημένο ή ληγμένο ticket, ο 5ος λάθος κωδικός πρόσβασης, λογαριασμός του οποίου η κατάσταση ή η διεύθυνση άλλαξε μετά το `finish` ή λογαριασμός του οποίου η κατάσταση, η διεύθυνση, ο κωδικός πρόσβασης ή ο έλεγχος ταυτότητας δύο παραγόντων άλλαξε ενώ αποθηκευόταν η διασύνδεση. Ξεκινήστε ξανά τη σύνδεση.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (η καθυστέρηση του λογαριασμού μετά από αποτυχημένες προσπάθειες) ή `rate_limited` (το όριο `auth`, η ουρά κατακερματισμού κωδικών πρόσβασης).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: η ουρά κατακερματισμού κωδικών πρόσβασης ή η βάση δεδομένων παρέμεινε κλειδωμένη (`retryAfter: 1`, δεν διασυνδέθηκε τίποτα). `timeout`. Επίσης `server_busy` με `retryAfter` από 2 έως 5 όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή): το αίτημα δεν εκτελέστηκε.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Δημιουργία του λογαριασμού μιας πρώτης σύνδεσης με Google
      description: |-
        Αφού το `finish` απαντήσει `needsUsername`: δημιουργεί τον λογαριασμό με το επιλεγμένο όνομα χρήστη (ισχύουν οι κανόνες της εγγραφής) και τον συνδέει. Ο λογαριασμός δεν έχει κωδικό πρόσβασης: το `hasPassword` είναι `false`, και η επιλογή «Ξεχάσατε τον κωδικό;» (`POST /auth/password/forgot`) του δίνει έναν.

        **Όριο:** `auth` (με τη μέτρησή του ανά /48 IPv6).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Ο λογαριασμός δημιουργήθηκε και συνδέθηκε.
          headers:
