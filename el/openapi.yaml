          description: Ξανά η φόρμα με το σφάλμα (οι κωδικοί πρόσβασης διαφέρουν, αδύναμος κωδικός πρόσβασης), ο σύνδεσμος δεν είναι έγκυρος ή η φόρμα δεν είναι έγκυρη (σελίδα HTML).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Το όριο `auth` ή `auth_reset` (σελίδα HTML), ξανά η φόρμα με `Retry-After` όταν αυτός ο πελάτης έχει υπερβολικά πολλούς κωδικούς πρόσβασης σε αναμονή κατακερματισμού (ο σύνδεσμος παραμένει έγκυρος) ή το επίπεδο ανά διεύθυνση (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'Ξανά η φόρμα με `Retry-After` όταν ο διακομιστής είναι απασχολημένος (η ουρά κατακερματισμού κωδικών πρόσβασης ή η βάση δεδομένων παρέμεινε κλειδωμένη)· ο σύνδεσμος παραμένει έγκυρος. Όταν ο διακομιστής έχει μείνει πολύ πίσω (βλ. την εισαγωγή), αντί γι’ αυτό μια σελίδα «Server error» (σφάλμα διακομιστή) με `Retry-After` (από 2 έως 5): δεν εκτελέστηκε τίποτα και ο σύνδεσμος παραμένει έγκυρος. Επίσης σε υπέρβαση του χρονικού ορίου του χειριστή αιτημάτων.'
