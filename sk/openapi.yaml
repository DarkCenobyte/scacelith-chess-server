        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (databáza zostala zamknutá; `retryAfter: 1` v tele, bez hlavičky `Retry-After`), `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Nahlásiť súpera z nedávnej partie
      description: |-
        Nahlási súpera z jednej z hráčových vlastných partií, ktorá sa skončila za posledných 7 dní. Nahlásenie samo osebe nikdy nezmení rating, sankciu ani úroveň integrity. Zvýši prioritu posúdenia, ktorú vidia moderátori, a okrem `abuse` vyžiada analýzu partie šachovým programom.

        Nahlásenie toho istého súpera za tú istú partiu dostane rovnakú odpoveď a nič nezmení; odpoveď nikdy nič neprezradí o nahlásenom účte. `GET /games/{id}` hráčom partie vopred oznámi, či by sa nahlásenie prijalo (`reportable`).

        Tento endpoint kontroluje telo sám, v poradí `gameId`, `reported`, `category`, `comment`: pri chybe odpovie 400 `invalid_request` bez `field`. Polia, ktoré nepozná, ignoruje.

        **Limity:** `reports` (na hráča), potom `REPORTS_PER_DAY` (5) nahlásení na hráča za 24 hodín (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Nahlásenie je prijaté (alebo už bolo podané).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (bez `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: nejde o súpera nahlasujúceho hráča v partii, ktorá sa skončila za posledných 7 dní.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, s hlavičkou `Retry-After`): `REPORTS_PER_DAY` nahlásení za posledných 24 hodín. `rate_limited`: limit `reports` alebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (vyhľadanie relácie narazilo na zamknutú databázu), `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
