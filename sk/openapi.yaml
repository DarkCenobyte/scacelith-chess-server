  - name: auth
    x-displayName: Registrácia a prihlásenie
    description: |-
      Vytvorenie účtu, prihlásenie heslom (a druhým faktorom), potvrdzovacie e-maily a e-maily na resetovanie hesla.

      `POST /auth/login`, `POST /auth/login/mfa`, `POST /auth/sso/google/finish`, `POST /auth/sso/google/link` a `POST /auth/sso/complete` odpovedajú reláciou `{ token, expiresAt, user }` (alebo, pri prvých z nich, druhým krokom).
  - name: google-sign-in
    x-displayName: Prihlásenie cez Google
    description: |-
      K dispozícii, keď `GET /info` uvádza `sso.google: true`; inak každý endpoint nižšie odpovie 404 `sso_disabled`. Web sa prihlasuje rovnakým spôsobom s vlastným klientom, keď má `sso.googleWeb` hodnotu true (nižšie, **Na webe**). Hra sa prihlasuje cez systémový prehliadač tokom pre nainštalované aplikácie podľa RFC 8252 (klient typu „Desktop app“): Google pošle prehliadač späť na poslucháča hry na `127.0.0.1`, nikdy nie na tento server, a hra nikdy neuvidí prihlasovacie údaje Google.

      1. Klient načúva na `127.0.0.1:0` (port vyberie systém) a vytvorí pár PKCE: `codeVerifier` so 43 až 128 znakmi `[A-Za-z0-9._~-]` a `codeChallenge = BASE64URL(SHA-256(codeVerifier))`, ktorý má 43 znakov a žiadne zarovnanie (padding).
      2. `POST /auth/sso/google/start` s výzvou a portom vráti URL Google a `state` pokusu. Klient URL skontroluje (pozri nižšie) a otvorí ju v prehliadači.
      3. Google pošle prehliadač na `http://127.0.0.1:<port>/oauth2/google/<tag>?code=...&state=...`. Klient prijme iba `state` z odpovede na spustenie pokusu a po presmerovaní s `error=` nič neposiela.
      4. `POST /auth/sso/google/finish` s ID pokusu, `codeVerifier`, `state` a `code` (a s `iss`, ak ho Google poslal).
      5. Odpoveďou je relácia, krok dvojfaktorového overenia (pokračujte cez `POST /auth/login/mfa`), `needsUsername` pre nového hráča (pokračujte cez `POST /auth/sso/complete`) alebo `needsPassword`, keď adresu používa účet s heslom (pokračujte cez `POST /auth/sso/google/link`).

      **Značka pôvodu.** URI presmerovania nesie značku servera, ktorý hráč pridal, aby hra odmietla URL, ktorú iný server získal pre svojich hráčov. Pôvod je hostiteľ malými písmenami (literál IPv6 v hranatých zátvorkách), `:` a desiatkový port API, vždy uvedený, vrátane 443: server berie `SERVER_PUBLIC_HOST` a svoj verejný port API, hra adresu, ku ktorej je pripojená. Značka je prvých 22 znakov base64url (bez zarovnania) zo SHA-256(UTF-8 `"scacelith-sso-origin-v1\n"` + pôvod). URI presmerovania je `"http://127.0.0.1:" + port + "/oauth2/google/" + tag`: vždy literál IPv4 a port poslucháča hry (1024 až 65535). Server nikdy neprijíma od klienta URI, hostiteľa ani cestu.

      | Pôvod | Značka |
      |---|---|
      | `play.scacelith.example:443` | `IhcScoV7eDOzTEcSnqPUPt` |
      | `localhost:8443` | `TFGx7zQ_8QlGZW5zpqznCr` |
      | `[::1]:8443` | `XToJm0DG5PjciEVmZa9Cho` |
      | `127.0.0.1:50443` | `3r653wM5ZjYsHcAJljmCwY` |

      Prihlásenie cez Google preto funguje iba pre hráčov, ktorí pridali server presne pod `SERVER_PUBLIC_HOST` a s jeho verejným portom API.

      **Čo hra skontroluje pred otvorením prehliadača.** `authUrl` začína presne `https://accounts.google.com/o/oauth2/v2/auth?`, obsahuje iba tlačiteľné znaky ASCII a má menej ako 4096 znakov a jej dopyt obsahuje presne jeden `response_type=code`, presne jeden `redirect_uri` rovný URI, ktoré hra vypočíta zo svojho portu a svojej značky pôvodu, presne jeden `state` rovný `state` z odpovede, `code_challenge_method=S256` a 43-znakový `code_challenge`. Inak hra zastaví svojho poslucháča a nič neotvorí. `finish` a `link` posiela iba serveru, ktorý odpovedal na `start`.

      **Na webe.** Web (oficiálny: <https://scacelith.com/>) sa prihlasuje klientom typu „Web application“ toho istého projektu Google (`GOOGLE_WEB_CLIENT_ID`). Google pošle prehliadač späť na jednu stránku webu, ktorú nakonfiguroval prevádzkovateľ (`GOOGLE_WEB_REDIRECT_URI`, uvedená v zozname „Authorized redirect URIs“ klienta), a táto stránka pošle kód na `finish`; ani tu server neprijíma od klienta žiadne URI presmerovania.

      1. Stránka vytvorí pár PKCE ako vyššie, uchová overovací reťazec (verifier) v karte (`sessionStorage`) a pošle `POST /auth/sso/google/web/start` s výzvou.
      2. Skontroluje `authUrl` rovnako ako hra, okrem toho, že `redirect_uri` musí byť stránka z jej vlastného pôvodu, a potom na túto URL prejde. Nenačítava sa žiadny skript Google.
      3. Google pošle prehliadač na `GOOGLE_WEB_REDIRECT_URI?code=...&state=...`. Stránka prijme iba `state` z odpovede na spustenie pokusu a po presmerovaní s `error=` nič neposiela.
      4. `finish`, `link` a `complete` nasledujú ako pri hre. Pokus si pamätá, že ho začal web: kód sa vymení s klientom a stránkou webu a ID token musí uvádzať tohto klienta (kód alebo ID token klienta hry zlyhá s 502 `sso_failed`, a naopak).

      Účet Google vedie k tomu istému účtu Scacelith z hry aj z webu: prepojenie uchováva subjekt Google (`sub`), ktorý identifikuje účet Google bez ohľadu na klienta. Pôvod webu musí byť v `CORS_ORIGINS` (inak `check-config` zobrazí varovanie).

      **Ku ktorému účtu vedie prihlásenie cez Google:** k účtu, ktorý je s týmto účtom Google už prepojený; inak k aktívnemu účtu s adresou, ktorú Google potvrdil (ak má heslo, `finish` odpovie `needsPassword` a prepojenie sa uloží až vtedy, keď prejde overenie jeho hesla a potom jeho druhého faktora, ak je zapnutý; ak heslo nemá, 409 `sso_account_exists`); inak k novému účtu (`needsUsername`). Účet Google sa nikdy neprepojí s existujúcim účtom iba na základe adresy. Na adresu účtu príde e-mail, keď prihlásenie cez Google vytvorí účet a keď sa pridá k existujúcemu účtu.
