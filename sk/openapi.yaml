          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Základný čas v milisekundách.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Prírastok v milisekundách.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: Výsledok z pohľadu hráča.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Partie na strane, od najnovšej.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: ID, ktoré treba poslať ako `before` pre ďalšiu stranu, alebo `null` na poslednej strane.
        total:
          type: integer
          minimum: 0
          description: Počet partií zodpovedajúcich filtru na všetkých stranách.
    MoveRecord:
      type: object
      description: Jeden polťah partie.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: Ťah v notácii UCI, pri premene s pridaným `n`, `b`, `r` alebo `q`.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Čas započítaný za ťah (ms), `null`, ak ho záznam nemá.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Stav hodín hráča, ktorý ťahal, po ťahu (ms), `null`, ak ho záznam nemá.
    PgnTagsView:
      type: object
      description: Hlavné značky PGN na zobrazenie. `Termination` je tu názov dôvodu ukončenia; súbor PGN používa štandardné hodnoty PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` alebo `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: Dátum začiatku v UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Rating na začiatku alebo `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Rating na začiatku alebo `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Záznam partie s ťahmi a hodinami. Má polia súhrnu partie, bez `color` a `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Základný čas v milisekundách.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Prírastok v milisekundách.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: Názov hodnoty `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: ID partie, ktorej odvetou je táto partia, alebo `null`.
            moves:
              type: array
              description: Jedna položka na polťah.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Iba keď túto partiu hral hráč, ktorému token patrí; jeho farba.
            reportable:
              type: boolean
              description: Iba keď túto partiu hral hráč, ktorému token patrí; `true`, keď by `POST /reports` teraz prijal nahlásenie súpera za túto partiu (partia sa skončila za posledných 7 dní, denná kvóta nie je vyčerpaná a súper ešte nie je za túto partiu nahlásený).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Používateľské meno tak, ako ho hráč napísal.
        createdAt:
          type: integer
          format: int64
          description: Kedy bol účet vytvorený (ms od epochy Unixu).
        ratings:
          type: array
          description: Iba oficiálne kategórie, v poradí servera.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Všetky uložené partie vrátane nehodnotených a zrušených.
            rated:
              type: integer
              minimum: 0
              description: Hodnotené partie, sčítané cez záznamy ratingu.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Používateľské meno tak, ako ho hráč napísal.
        games:
          type: array
          description: Partie na strane, od najnovšej.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: ID poslednej partie vždy, keď je strana plná (ďalšia strana potom môže byť prázdna), inak `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: ID kategórie.
        minGames:
          type: integer
          minimum: 0
          description: Počet započítaných partií, ktorý záznam potrebuje, aby sa zobrazil v rebríčku (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Kedy bol rebríček vypočítaný (ms od epochy Unixu).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: Text PGN, najviac 65 536 bajtov UTF-8. Použije sa iba prvá partia.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Nepovinné. Veľkosť obrázka.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Nepovinné. Strana, ktorá je dole na šachovnici.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Nepovinné. Milisekundy na ťah, číslo JSON s celočíselnou hodnotou.
        coords:
          type: boolean
          default: true
          description: Nepovinné. Či sa okolo šachovnice kreslia písmená stĺpcov a čísla radov.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Partia ako celé číslo alebo reťazec s 1 až 16 číslicami.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Používateľské meno súpera, ako je v zázname partie alebo ako znie teraz, bez ohľadu na veľkosť písmen. Nesmie byť prázdne.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Čoho sa nahlásenie týka.
        comment:
          type:
            - string
            - 'null'
          description: Nepovinné. Najviac 500 znakov po odstránení riadiacich znakov (okrem tabulátora a nového riadka) a medzier na začiatku a na konci textu.
    AccountExport:
      type: object
      description: Všetko, čo server o účte uchováva (časy v ms od epochy Unixu).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Kedy bol export vytvorený.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Čo súbor obsahuje a čo vynecháva, v jednoduchej angličtine pre hráča.
          items:
            type: string
        account:
          description: Zobrazenie účtu z `GET /account/me` s `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Adresa prepojeného účtu Google alebo `null`.
        ratings:
          type: array
          description: Úplné záznamy ratingu.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Body ratingu vrátené po tom, ako sa zistilo, že súper podvádzal, sčítané za deň (UTC) a kategóriu, od najnovších. Neuvádzajú sa partie ani podvádzajúci hráči.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Všetky uložené relácie od najnovšej, bez akéhokoľvek tokenu. Čistenie po uplynutí doby uchovávania odstráni reláciu s vypršanou platnosťou a odhlásenú reláciu deň po odhlásení.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Bezpečnostné udalosti od najnovšej, uchovávané `RETENTION_SECURITY_DAYS` dní.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Všetky sankcie vrátane zrušených. Meno moderátora sa nikdy neuvádza.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Udalosti správania zaznamenané pri hráčových opustených, zrušených a nezačatých partiách (bez prvého ťahu včas), uchovávané 30 dní.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Nahlásenia, ktoré hráč podal.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Počet partií.
            list:
              type: array
              description: Všetky partie od najnovšej ako súhrny z `GET /account/games`. Ťahy sú na `GET /games/{id}` a PGN na `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Úplný záznam ratingu.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Či hráč už opustil fázu bez ratingu.
            countedGames:
              type: integer
              minimum: 0
              description: Partie, ktoré sa započítali do ratingu.
            updatedAt:
              type: integer
              format: int64
              description: Kedy sa záznam naposledy zmenil.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: 00:00 UTC daného dňa (ms od epochy Unixu).
        category:
          type: string
        points:
          type: integer
          description: Body vrátené v daný deň v danej kategórii.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Kedy bola relácia odhlásená, alebo `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Adresa prihlásenia, vymazaná po `RETENTION_IP_DAYS` dňoch.
    SecurityEvent:
      type: object
      description: |-
        Bezpečnostná udalosť. `ip` sa uvádza iba pri tom, čo sa vykonalo v prihlásenom stave, heslom účtu (a druhým faktorom) alebo odkazom poslaným na jeho adresu: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` a `account_exported`; každý iný druh má `ip: null` a `ip` sa vymaže po `RETENTION_IP_DAYS` dňoch.

        `detail` uchováva iba tieto polia: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` a `method` (`password` alebo `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` a `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Udalosť `moderator_action` uchováva iba `{ action }`, pre akcie `ban`, `unban`, `reset_mfa`, `verify_email` a `revoke_sessions` (ostatné akcie moderátorov sa vynechávajú). Každý iný druh má `detail: null`. Udalosti `rating_refund` sa vynechávajú: ich body sú v `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Druh udalosti (`login`, `password_changed`...).
        at:
          type: integer
          format: int64
          description: Kedy sa stala.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: Aktuálne verejné meno nahláseného hráča.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Či je nahlásenie stále otvorené (či bol nahlásený hráč sankcionovaný, sa neuvádza).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Token odkazu z e-mailu (skryté pole formulára stránky).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Token odkazu na resetovanie hesla (skryté pole formulára).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Nové heslo; platia pravidlá pre heslá ako pri registrácii.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Znova nové heslo; musí byť rovnaké.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: Stránka HTML v UTF-8 (`text/html; charset=utf-8`), bez JavaScriptu a externých zdrojov.
