paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Získať názov servera, verzie, porty a pravidlá registrácie
      description: |-
        Čo klient potrebuje predtým, ako sa prihlási alebo pripojí: názov a ID servera, verzie protokolu WebSocket a umiestnenie WebSocketu, pravidlá registrácie, oficiálne tempá hry a limity, ktoré môže klient skontrolovať pred odoslaním formulára.

        **Limity:** iba vrstva podľa adresy.
      security: []
      responses:
        '200':
          description: Popis servera.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: vrstva podľa adresy.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Vytvoriť účet
      description: |-
        Vytvorí účet: po potvrdení jeho e-mailovej adresy odkazom, ktorý sa na ňu pošle, alebo okamžite, ak sa e-mail nepotvrdzuje.

        **S potvrdením e-mailu** (`REQUIRE_EMAIL_VERIFICATION`, predvolené): 202 `verification_sent`. Účet ešte neexistuje: registrácia čaká 24 hodín a medzitým si rezervuje svoje používateľské meno. Na adresu príde odkaz platný počas týchto 24 hodín, najviac jeden na adresu každých 5 minút (`POST /auth/verify-email/resend` pošle nový); účet sa vytvorí s potvrdenou adresou, keď sa odkaz použije (tlačidlo na stránke `/verify-email`), a hráč sa potom môže prihlásiť. Dovtedy server na prihlásenie s týmto používateľským menom odpovedá `invalid_credentials`, ako pri neznámom účte, a verejný profil neexistuje. Nová registrácia s rovnakou adresou nahradí čakajúcu. Odpoveď je rovnaká, keď adresu už používa iný účet: odkaz sa vtedy nepošle, jeho vlastník namiesto toho dostane upozornenie (najviac jedno za hodinu) a používateľské meno sa rezervuje rovnako, aby nič neprezradilo, či adresa má účet. Registrácia, ktorej odkaz nebol použitý, sa po 24 hodinách zahodí a jej používateľské meno je opäť voľné.

        **Bez potvrdenia e-mailu** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, účet sa vytvorí okamžite a môže sa prihlásiť.

        **Pravidlá.** `username`: `USERNAME_MIN` až `USERNAME_MAX` znakov (3 až 20), písmená, číslice, `_` a `-`, na začiatku písmeno alebo číslica (`GET /info` ich uvádza v `limits`); rezervované mená (`admin`, `moderator`, `deleted`...) a niektoré predpony sa odmietajú; jedinečné bez ohľadu na veľkosť písmen. `email`: bez medzier na začiatku a na konci, uložený malými písmenami, čisté ASCII s doménou s bodkou. `password`: aspoň `PASSWORD_MIN_LENGTH` (10) znakov a najviac 256 bajtov v UTF-8; nesmie obsahovať používateľské meno ani lokálnu časť e-mailu a nesmie byť bežne používaným heslom.

        **Chyby** v poradí kontroly: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; chyby frontu na hashovanie hesiel; 409 `email_taken` (iba bez potvrdenia e-mailu).

        **Limity:** `auth`, potom `auth_register` (10 registrácií za hodinu na klienta). **Dôkaz práce:** vždy, keď je `POW_REGISTER_BITS` väčšie ako 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Prvý pokus, bez dôkazu práce
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Opätovne odoslané s dôkazom práce
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Účet je vytvorený a môže sa prihlásiť (tento server nepotvrdzuje e-maily).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Registrácia čaká na svoj potvrdzovací odkaz (alebo adresa už má účet; odpoveď to neprezrádza).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (s `field`), `invalid_json`, `invalid_username`, `invalid_email` alebo `weak_password` s `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` alebo `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: registrácia je na tomto serveri uzavretá (`GET /info` uvádza `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: používateľské meno má niektorý účet alebo si ho rezervuje čakajúca registrácia s inou adresou. `email_taken`: adresu používa iný účet (iba bez potvrdenia e-mailu).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `auth` alebo `auth_register`, alebo front na hashovanie hesiel.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (front na hashovanie hesiel alebo databáza zostala zamknutá), `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Prihlásiť sa heslom
      description: |-
        Prihlási hráča pomocou používateľského mena alebo e-mailovej adresy a hesla. Možné sú dve odpovede, obe so stavom 200: relácia alebo, keď je zapnuté dvojfaktorové overenie, druhý krok, ktorý treba dokončiť do 5 minút cez `POST /auth/login/mfa`.

        Neznámy účet, nesprávne heslo a účet bez hesla dostanú rovnakú odpoveď po rovnako dlhom čase: 401 `invalid_credentials`. Kontroly účtu (`banned`, `email_unverified`) prichádzajú až po správnom hesle. Od `AUTH_FAILURES_PER_ACCOUNT` (5) zlyhaní na jedno prihlasovacie meno musí každý pokus čakať (429 `too_many_attempts`).

        **Limit:** `auth`. **Dôkaz práce:** iba počas vlny neúspešných prihlásení (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Relácia alebo druhý krok prihlásenia s dvojfaktorovým overením.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Prihlásenie prebehlo
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Dvojfaktorové overenie je zapnuté
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: neznámy účet, nesprávne heslo alebo účet bez hesla.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Iba po správnom hesle: `banned` s `until` (ms od epochy Unixu, `null` pri trvalom pozastavení) alebo `email_unverified` (starší účet, ktorého adresa ešte nie je potvrdená).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (oneskorenie po neúspešných pokusoch pre toto prihlasovacie meno) alebo `rate_limited` (limit `auth`, front na hashovanie hesiel).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (front na hashovanie hesiel alebo databáza zostala zamknutá), `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Dokončiť prihlásenie druhým faktorom
      description: |-
        Druhý krok prihlásenia s dvojfaktorovým overením, keď `POST /auth/login` alebo prihlásenie cez Google (`POST /auth/sso/google/finish` alebo `POST /auth/sso/google/link`) odpovedali `mfaRequired`. Pošlite `code` (6-ciferný kód z overovacej aplikácie alebo kód na obnovenie) alebo `recoveryCode`. Kód na obnovenie použitý tu zaniká.

        Jeden krok prijme najviac 5 nesprávnych kódov; krok sa skončí aj vtedy, keď sa heslo resetuje alebo zmení. Po kroku s heslom pri prepájaní s Google sa prepojenie uloží až vtedy, keď tu kód prejde.

        **Limity:** `auth` a najviac `AUTH_MFA_PER_ACCOUNT` (10) kódov za 15 minút pre účet, z akejkoľvek adresy; nad tento počet sa kód neoveruje, takže sa kód na obnovenie nespotrebuje.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Kód z overovacej aplikácie
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Kód na obnovenie
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Prihlásenie prebehlo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: nebol poslaný ani `code`, ani `recoveryCode`, alebo telo porušuje schému; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: platnosť kroku vypršala, krok bol použitý alebo sa skončil po 5 nesprávnych kódoch, alebo bolo heslo od prvého kroku resetované či zmenené (prihláste sa znova). `invalid_code`: nesprávny alebo už použitý kód.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (s `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: iba po kroku s heslom pri prepájaní s Google, keď bol účet Google medzitým prepojený s iným účtom.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: iba po kroku s heslom pri prepájaní s Google, keď sa účet medzitým zmenil; začnite prihlásenie znova.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: oneskorenie po neúspešných pokusoch na účte alebo vyčerpanie jeho kódov `AUTH_MFA_PER_ACCOUNT` za posledných 15 minút. `rate_limited`: limit `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` s `retryAfter: 1`: databáza zostala zamknutá (po kroku prepájania s Google sa nič neprepojilo: začnite prihlásenie znova). `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Odhlásiť túto reláciu
      description: |-
        Odvolá reláciu použitého tokenu. WebSocket otvorený s touto reláciou sa zatvorí. Bez tela (alebo `{}`).

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Odhlásenie prebehlo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: iné telo ako `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sessions` alebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáza zostala zamknutá), `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
        - sessions
      summary: Odhlásiť všetky relácie
      description: |-
        Odvolá všetky relácie účtu vrátane tejto. WebSockety otvorené s nimi sa zatvoria. Bez tela (alebo `{}`).

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Všetky relácie sú odhlásené.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: iné telo ako `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sessions` alebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáza zostala zamknutá), `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Znova poslať potvrdzovací odkaz
      description: |-
        Znova pošle odkaz na potvrdenie e-mailu. Odpoveď je 202 `accepted` bez ohľadu na adresu, aby nikdy neprezradila, či adresu používa účet alebo registrácia.

        Požiadavka sa prejaví najviac raz za 5 minút na adresu. Čakajúca registrácia s touto adresou dostane znova svojich 24 hodín bez ohľadu na to, či adresu používa iný účet, aby jej používateľské meno zostalo v oboch prípadoch rezervované rovnako dlho. Odkaz sa pošle iba pre túto registráciu, keď adresa nemá účet (nový odkaz s platnosťou 24 hodín nahradí predchádzajúci), alebo pre aktívny nepotvrdený účet s touto adresou.

        **Limity:** `auth`, potom `auth_mail` (10 za hodinu na klienta).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Prijaté (bez ohľadu na adresu).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `auth` alebo `auth_mail` (bez ohľadu na adresu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` s `retryAfter: 1`: databáza zostala zamknutá pri vyhľadávaní účtu alebo pri ukladaní odkazu nepotvrdeného účtu (predĺženie čakajúcej registrácie je bez záruky a nikdy nespôsobí zlyhanie požiadavky); 5 minút pre adresu sa napriek tomu začne počítať, takže nová požiadavka počas nich nič neurobí. `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Poslať odkaz na resetovanie hesla
      description: |-
        Pošle odkaz na resetovanie hesla s platnosťou jednu hodinu, ktorý otvorí stránku `/reset-password`. Odpoveď je 202 `accepted` bez ohľadu na adresu. Odkaz sa pošle iba aktívnemu účtu, najviac raz za 5 minút na adresu. Účet len s prihlásením cez Google si týmto spôsobom nastaví svoje prvé heslo.

        Obnova zabudnutého hesla má najprísnejšie limity v celom API, všetky počítané pre celý server: 3 požiadavky za hodinu (`AUTH_FORGOT_PER_HOUR`) a 10 za 24 hodín (`AUTH_FORGOT_PER_DAY`) na klienta (adresu IPv4 alebo IPv6 /64), trojnásobok týchto počtov na IPv6 /48, navyše k limitu `auth` (20 za 10 minút) a k jednému e-mailu na adresu každých 5 minút. Ani 202, ani 429 neprezradí, či adresu používa nejaký účet. Nastavenie nového hesla má vlastný limit (`auth_reset`).

        **Limity:** `auth`, `auth_forgot`, potom `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Prijaté (bez ohľadu na adresu).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `auth`, `auth_forgot` alebo `auth_forgot_day` (bez ohľadu na adresu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` s `retryAfter: 1`: databáza zostala zamknutá pri vyhľadávaní účtu alebo pri ukladaní odkazu; 5 minút pre adresu sa napriek tomu začne počítať, takže nová požiadavka počas nich nepošle žiadny odkaz. `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Nastaviť nové heslo pomocou tokenu z odkazu na resetovanie hesla
      description: |-
        Nastaví nové heslo pomocou tokenu z odkazu na resetovanie hesla (stránka `/reset-password` robí to isté). Nové heslo sa riadi pravidlami registrácie.

        Resetovanie má tieto účinky v jednej transakcii (všetky, alebo žiadny): odvolá všetky relácie a zruší čakajúcu zmenu e-mailu; ostatné odkazy účtu na resetovanie hesla prestanú fungovať; adresa sa považuje za potvrdenú (odkaz to dokázal); vlastník dostane e-mail. Dvojfaktorové overenie zostáva nedotknuté. Po chybe frontu na hashovanie hesiel, po 503 alebo 500 sa nič nezmenilo: staré heslo aj relácie zostávajú a odkaz zostáva platný.

        **Limity:** `auth`, potom `auth_reset` (10 za hodinu na klienta, 30 na IPv6 /48, spoločný so stránkou: každý pokus hashuje heslo).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Heslo je zmenené a všetky relácie sú odhlásené.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: odkaz je neplatný, použitý alebo mu vypršala platnosť, alebo bol poslaný na adresu, ktorú účet už nemá. `weak_password` (s `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `auth` alebo `auth_reset`, alebo front na hashovanie hesiel.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: front na hashovanie hesiel alebo databáza zostala zamknutá (`retryAfter: 1`, nič sa nezmenilo). `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Začať prihlásenie cez Google
      description: |-
        Začne pokus o prihlásenie cez Google pre výzvu PKCE a port poslucháča hry na `127.0.0.1`. Odpoveď uvádza URL Google, ktorú treba otvoriť v systémovom prehliadači, a `state` pokusu; pokus platí 10 minút.

        `authUrl` obsahuje `client_id`, `redirect_uri` (zostavené z `redirectPort` a značky pôvodu servera), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 vlastného overovacieho reťazca servera pre Google) s `code_challenge_method=S256` a `prompt=select_account`. Hra ju pred otvorením skontroluje (pozri popis sekcie).

        **Limit:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Pokus.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: prihlásenie cez Google nie je na tomto serveri k dispozícii.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáza zostala zamknutá), `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Začať prihlásenie cez Google na webe
      description: |-
        Začne pokus webu o prihlásenie cez Google pre výzvu PKCE jeho stránky. Odpoveď je rovnaká ako pre hru: URL Google, na ktorú treba prejsť, a `state` pokusu; pokus platí 10 minút. K dispozícii, keď `GET /info` uvádza `sso.googleWeb: true`.

        `authUrl` obsahuje `client_id` webu a `redirect_uri=GOOGLE_WEB_REDIRECT_URI` s rovnakými ostatnými parametrami ako pre hru. Stránka ju skontroluje predtým, ako na ňu prejde (pozri **Na webe** v popise sekcie).

        **Limit:** `sso_start`, spoločný so spustením pre hru.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: Pokus.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: chýbajúci alebo chybne utvorený `codeChallenge` alebo akékoľvek iné pole (vrátane `redirectPort`).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: prihlásenie cez Google nie je na tomto serveri k dispozícii alebo nie je k dispozícii pre weby.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sso_start` (spoločný so spustením pre hru).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáza zostala zamknutá), `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Odovzdať serveru odpoveď od Google
      description: |-
        Odovzdá serveru `code` a `state`, ktoré Google poslal poslucháčovi hry alebo stránke webu, spolu s ID pokusu a overovacím reťazcom PKCE (verifier). ID pokusu je bez overovacieho reťazca nepoužiteľné a kód je nepoužiteľný bez vlastného overovacieho reťazca PKCE servera a tajného kľúča klienta.

        Server skontroluje pokus (neznámy, použitý alebo s vypršanou platnosťou: 410), potom overovací reťazec (nesprávny ponechá pokus použiteľný), potom pokus jednorazovo použije, skontroluje `state` a `iss`, vymení kód s Google a overí ID token. Odpoveď (200) je jedna z týchto:

        - `{ token, expiresAt, user }`: prihlásenie do prepojeného účtu prebehlo;
        - `{ mfaRequired, mfaToken, expiresIn }`: pokračujte cez `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: nový účet; pokračujte cez `POST /auth/sso/complete` do 10 minút. `suggestedUsername` pochádza z mena v Google alebo z adresy a je `""`, keď sa nič nehodí;
        - `{ needsPassword, linkTicket, username, expiresIn }`: účet s touto adresou má heslo; pokračujte cez `POST /auth/sso/google/link`. Zatiaľ nie je nič prepojené.

        **Limit:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Relácia, druhý krok alebo ďalší krok prvého prihlásenia cez Google.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Prihlásenie do prepojeného účtu prebehlo
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Dvojfaktorové overenie je zapnuté
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Nový hráč
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Adresu používa účet s heslom
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: overovací reťazec nezodpovedá výzve pokusu (pokus zostáva použiteľný). `sso_email_unverified`: Google adresu nepotvrdil. `registration_closed`. `account_disabled`. Iba pre prepojený účet: `banned` (s `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: prihlásenie cez Google nie je na tomto serveri k dispozícii.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: adresu používa aktívny účet bez hesla (odpoveď ho neuvádza).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: pokus je neznámy, už použitý alebo mu vypršala platnosť.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáza zostala zamknutá), `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Prepojiť Google s existujúcim účtom pomocou jeho hesla
      description: |-
        Keď `finish` odpovedal `needsPassword`: prepojí Google s existujúcim účtom pomocou hesla tohto účtu zadaného v hre. Odpoveďou (200) je relácia (prepojenie sa uloží a hráč sa prihlási) alebo, keď je zapnuté dvojfaktorové overenie, `{ mfaRequired, mfaToken, expiresIn }`: pokračujte cez `POST /auth/login/mfa` a prepojenie sa uloží až vtedy, keď tam kód prejde.

        Nesprávne heslo ponechá tiket použiteľný, celkovo na 5 pokusov. Pokus sa odpočíta tesne pred overením hesla: ani 429 `too_many_attempts`, ani 428 `pow_required` žiadny pokus neodpočítajú, zatiaľ čo odmietnutie frontom na hashovanie hesiel (503 `server_busy`, 429 `rate_limited`) už jeden odpočítalo a počíta sa ako zlyhanie účtu. Oneskorenie po neúspešných pokusoch používa to isté počítadlo ako `POST /auth/login`.

        **Limit:** `auth` (vrátane počítania na IPv6 /48). **Dôkaz práce:** ako pri `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Relácia alebo druhý krok prihlásenia.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: nesprávne heslo; tiket zostáva použiteľný, celkovo na 5 pokusov.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (s `until`), iba po zadaní správneho hesla.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: tento server neponúka prihlásenie cez Google.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: účet Google bol medzitým prepojený s iným účtom.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: neznámy alebo už použitý tiket či tiket s vypršanou platnosťou; 5. nesprávne heslo; účet, ktorého stav alebo adresa sa od `finish` zmenili; alebo účet, ktorého stav, adresa, heslo alebo dvojfaktorové overenie sa zmenili počas ukladania prepojenia. Začnite prihlásenie znova.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (oneskorenie po neúspešných pokusoch na účte) alebo `rate_limited` (limit `auth`, front na hashovanie hesiel).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: front na hashovanie hesiel alebo databáza zostala zamknutá (`retryAfter: 1`, nič sa neprepojilo). `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Vytvoriť účet pri prvom prihlásení cez Google
      description: |-
        Keď `finish` vrátil `needsUsername`: vytvorí účet so zvoleným používateľským menom (platia pravidlá registrácie) a prihlási ho. Účet nemá heslo: `hasPassword` je `false` a heslo mu nastaví „Zabudnuté heslo?“ (`POST /auth/password/forgot`).

        **Limit:** `auth` (vrátane počítania na IPv6 /48).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Účet je vytvorený a prihlásený.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: tento server neponúka prihlásenie cez Google.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (používateľské meno má niektorý účet alebo ho drží čakajúca registrácia s inou adresou), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: tiket je neznámy, už použitý alebo mu vypršala platnosť.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáza zostala zamknutá), `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Vypísať prihlásené zariadenia
      description: |-
        Aktívne relácie účtu (prihlásené zariadenia), zoradené od naposledy použitej. `current` označuje reláciu, ktorá posiela požiadavku. `lastSeenAt` sa aktualizuje najviac raz za 5 minút (neskôr, kým server výrazne zaostáva); `expiresAt` je absolútny koniec a limit nečinnosti môže reláciu ukončiť skôr.

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aktívne relácie.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sessions` alebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáza zostala zamknutá), `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Odhlásiť jedno zariadenie
      description: |-
        Odhlási jednu reláciu účtu; odhlásiť možno aj aktuálnu. WebSocket otvorený s touto reláciou sa zatvorí. Bez tela (alebo `{}`).

        **Limit:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Relácia je odhlásená.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: iné telo ako `{}` alebo `id`, ktoré nie je platne kódované pre URL; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: tento účet nemá aktívnu reláciu s týmto ID.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `sessions` alebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáza zostala zamknutá), `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Získať účet, jeho ratingy a aktívne sankcie
      description: |-
        Účet tak, ako ho vidí jeho hráč: zobrazenie účtu (aj `user` v každej odpovedi na prihlásenie), jeden záznam ratingu pre každú kategóriu, v ktorej hráč hral hodnotené partie, aktívne sankcie a pozastavenie účtu. Úroveň integrity zo systému proti podvádzaniu sa nikdy nezobrazuje.

        **Limit:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Účet.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized` alebo `invalid_token` (aj keď bol účet odstránený).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `account` alebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáza zostala zamknutá), `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Prijímať alebo odmietať priame výzvy
      description: |-
        Nastaví, či ostatní hráči môžu tohto hráča vyzvať podľa mena. Pri `none` sa priame výzvy odmietajú: vyzývajúci sa dozvie, že hráč nie je k dispozícii. Bez opätovnej autentifikácie.

        **Limit:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: Predvoľby, ktoré teraz platia.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `account` alebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáza zostala zamknutá), `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Zmeniť heslo
      description: |-
        Zmení heslo. Vyžaduje sa aktuálne heslo, ale nie druhý faktor, ani pri zapnutom dvojfaktorovom overení. Nové heslo sa riadi pravidlami registrácie (kontrolujú sa po aktuálnom hesle).

        Zmena má tieto účinky v jednej transakcii (všetky, alebo žiadny): odvolá všetky ostatné relácie (táto zostane prihlásená), zruší čakajúcu zmenu e-mailovej adresy, odkazy na resetovanie hesla tohto účtu prestanú fungovať a vlastníkovi príde e-mail.

        **Opätovná autentifikácia:** iba heslo. **Limity:** `reauth`, potom `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Heslo je zmenené.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (účet len s prihlásením cez Google), `weak_password` (s `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: nesprávne aktuálne heslo alebo resetovanie či zmena hesla, ktoré prebehli počas kontroly požiadavky.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neúspešné opätovné autentifikácie účtu) alebo `rate_limited` (limit `reauth` alebo `reauth_user`, kvóta účtu, front na hashovanie hesiel).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: front na hashovanie hesiel alebo databáza zostala zamknutá (`retryAfter: 1`, nič sa nezmenilo). `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Začať zapínanie dvojfaktorového overenia
      description: |-
        Uloží nový čakajúci tajný kľúč, ktorý nahradí prípadný skorší čakajúci kľúč, a vráti ho pre overovaciu aplikáciu (ako text a ako URI `otpauth://` na zobrazenie v podobe QR kódu). Dvojfaktorové overenie ešte nie je zapnuté: zapne ho `POST /account/mfa/totp/enable` s kódom z tohto kľúča.

        **Opätovná autentifikácia:** iba heslo. **Limity:** `reauth`, potom `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Čakajúci tajný kľúč.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (účet len s prihlásením cez Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (kontroluje sa pred heslom).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neúspešné opätovné autentifikácie účtu) alebo `rate_limited` (limit `reauth` alebo `reauth_user`, kvóta účtu, front na hashovanie hesiel).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (front na hashovanie hesiel alebo databáza zostala zamknutá), `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Dokončiť zapnutie dvojfaktorového overenia a získať kódy na obnovenie
      description: |-
        Zapne dvojfaktorové overenie kódom z čakajúceho tajného kľúča (presne 6 číslic). Heslo sa tu nevyžaduje; bolo zadané pri nastavení. Odpoveď obsahuje 10 kódov na obnovenie, zobrazených iba tento raz.

        **Limity:** `reauth`, potom `reauth_user`; nesprávny kód sa započíta do neúspešných opätovných autentifikácií účtu.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Dvojfaktorové overenie je zapnuté.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` nemá presne 6 číslic alebo telo porušuje schému; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: nesprávny kód (skontrolujte čas zariadenia).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: neexistuje čakajúci tajný kľúč (najprv zavolajte `POST /account/mfa/totp/setup`).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neúspešné opätovné autentifikácie účtu) alebo `rate_limited` (limit `reauth` alebo `reauth_user`, kvóta účtu).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (databáza zostala zamknutá), `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: Vypnúť dvojfaktorové overenie
      description: |-
        Vypne dvojfaktorové overenie. Tajný kľúč a kódy na obnovenie sa odstránia a vlastník dostane e-mail.

        **Opätovná autentifikácia:** heslo a kód z overovacej aplikácie alebo kód na obnovenie (vyžaduje sa jedno z `code` alebo `recoveryCode`). **Limity:** `reauth`, potom `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Dvojfaktorové overenie je vypnuté.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (účet len s prihlásením cez Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required` (chýba `code` aj `recoveryCode`, kontroluje sa pred heslom), `invalid_password`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
