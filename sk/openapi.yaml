      - Stránky nespúšťajú žiadny JavaScript a nenačítavajú žiadne externé zdroje. Posielajú sa s `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'`.
