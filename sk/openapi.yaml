  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Vypísať partie hráča s filtrami a stránkovaním
      description: |-
        Partie prihláseného hráča od najnovšej, filtrované a stránkované, s počtom partií, ktoré zodpovedajú filtru. Každý parameter dopytu je nepovinný a prázdna hodnota sa považuje za chýbajúcu.

        Stránkovanie: `next` z predchádzajúcej strany pošlite ako `before`; na poslednej strane je `next` `null`. `total` počíta partie zodpovedajúce filtru na všetkých stranách.

        **Limit:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: ID oficiálnej kategórie (`3+2` alebo `3%2B2`) alebo `custom` pre všetky partie s iným tempom hry.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Iba hodnotené (`true`) alebo nehodnotené (`false`) partie.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Iba partie vyhrané, prehrané alebo skončené remízou, z pohľadu hráča. Zrušené partie sa zobrazujú iba bez tohto filtra.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Jedna strana histórie.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` nie je ID partie), `invalid_limit` alebo `invalid_filter` (`category`, `rated` alebo `result`), každá s `field`, ktoré uvádza názov parametra.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `account_games` alebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (databáza zostala zamknutá; `retryAfter: 1` v tele, bez hlavičky `Retry-After`), `server_busy` (vyhľadanie relácie narazilo na zamknutú databázu), `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /games/{id}:
    get:
      operationId: getGame
      tags:
        - games
      summary: Získať záznam partie s ťahmi a hodinami
      description: |-
        Jeden záznam partie s ťahmi a hodinami. Bez tokenu alebo s tokenom hráča, ktorý partiu nehral, je odpoveď verejná. Keď partiu hral hráč, ktorému token patrí, odpoveď pridá `you` a `reportable`.

        **Limit:** `public_read` (na hráča s tokenom, na klienta bez neho).
      security:
