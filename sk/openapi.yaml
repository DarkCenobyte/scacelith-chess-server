  - name: games
    x-displayName: Partie a PGN
    description: |-
      Záznamy partií s ich ťahmi a hodinami a ich súbory PGN.

      **Kódy partií.** `status`: 1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (ukladajú sa iba skončené partie). `result`: `1-0`, `0-1`, `1/2-1/2` alebo `*` (zrušená). `reason` s názvom (`termination`) a slovami, ktorými končí text ťahov v súbore PGN (v súbore po anglicky, nižšie s prekladom); kódy 7, 14 a 21 sú remízy (hráč, ktorému vypršal čas, ktorý sa vzdal alebo ktorý partiu opustil, mal súpera, ktorý nemohol dať mat: FIDE 6.9 a 5.1.2; pravidlo uvádza `DESIGN.md` 6.3) a server nikdy neukončí partiu kódmi 4 a 13 (patria do spoločného zoznamu dôvodov):

      | Kód | `termination` | Slová v PGN |
      |---|---|---|
      | 1 | `Checkmate` | Checkmate (mat) |
      | 2 | `Resignation` | Resignation (vzdanie sa) |
      | 3 | `Timeout` | Loss on time (prehra na čas) |
      | 4 | `IllegalMoves` | Second illegal move (forfeit) (druhý nemožný ťah, prehra) |
      | 5 | `Stalemate` | Stalemate (pat) |
      | 6 | `InsufficientMaterial` | Dead position (insufficient material) (mŕtva pozícia, nedostatočný materiál) |
      | 7 | `TimeoutVsInsufficient` | Flag fall, but the opponent cannot checkmate (čas vypršal, ale súper nemôže dať mat) |
      | 8 | `FivefoldRepetition` | Fivefold repetition (päťnásobné opakovanie pozície) |
      | 9 | `SeventyFiveMoves` | 75-move rule (pravidlo 75 ťahov) |
      | 10 | `ThreefoldClaim` | Threefold repetition (claimed) (trojnásobné opakovanie pozície, na žiadosť) |
      | 11 | `FiftyMoveClaim` | 50-move rule (claimed) (pravidlo 50 ťahov, na žiadosť) |
      | 12 | `Agreement` | Draw by agreement (remíza dohodou) |
      | 13 | `IllegalMovesVsInsufficient` | Second illegal move, but the opponent cannot checkmate (druhý nemožný ťah, ale súper nemôže dať mat) |
      | 14 | `ResignationVsInsufficient` | Resignation, but the opponent cannot checkmate (vzdanie sa, ale súper nemôže dať mat) |
      | 20 | `Abandonment` | Abandoned (disconnected for too long) (opustenie partie, príliš dlhé odpojenie) |
      | 21 | `AbandonmentVsInsufficient` | Abandoned, but the opponent cannot checkmate (opustenie partie, ale súper nemôže dať mat) |
      | 22 | `Aborted` | Game aborted (partia zrušená) |
      | 23 | `NoShow` | Aborted: first move not played in time (zrušená: prvý ťah nebol zahraný včas) |
      | 24 | `Forfeit` | Forfeit (fair play violation) (kontumácia za porušenie pravidiel férovej hry) |
      | 25 | `ServerAborted` | Aborted by the server (zrušené serverom) |
      | 26 | `BothDisconnected` | Aborted: both players disconnected (zrušená: obaja hráči sa odpojili) |

      Kód 14 pribudol v protokole s vedľajšou verziou (minor) 1: klient napísaný pred touto verziou by mal neznámy kód zobraziť ako bežný koniec partie s jej `result`.
  - name: gifs
    x-displayName: Animované GIF-y
    description: |-
      Partia ako animovaný GIF na uchovanie alebo zdieľanie: šachovnica pri pohľade zhora, jedna snímka na každú pozíciu od začiatočnej po záverečnú, mená a ratingy hráčov nad šachovnicou, posledný ťah pod ňou a na poslednej snímke výsledok a spôsob, akým partia skončila.

      **Náklady, vyrovnávacia pamäť a kvóty.** GIF sa vytvára vo vlastnom vykresľovacom vlákne, nikdy nie vo vláknach, v ktorých bežia partie, a s najnižšou prioritou CPU: `GIF_THREADS` vlákien (predvolene `WORKERS`), ktoré sa spustia s prvým GIF-om a zastavia sa po minúte bez GIF-u. Na vlákno čaká až `GIF_QUEUE_MAX` (4 x `WORKERS`) GIF-ov, každý najviac `GIF_QUEUE_TIMEOUT_MS` (10 s); vykreslenie môže trvať `GIF_RENDER_TIMEOUT_MS` (30 s). Server uchováva vytvorené GIF-y vo vyrovnávacej pamäti s veľkosťou `GIF_CACHE_MB` MB (32 x `WORKERS`), pričom ako prvé z nej odchádzajú najdlhšie nepoužité; GIF z vyrovnávacej pamäte alebo GIF, ktorý sa práve vytvára pre inú požiadavku, nestojí žiadne vykreslenie. Kľúč vyrovnávacej pamäte zahŕňa všetko, čo mení obrázok, vrátane mien.

      Každá požiadavka sa započítava do `gif` (30 za minútu na hráča pre oba endpointy). GIF, ktorý treba vytvoriť, sa započítava aj do limitov vykresľovania: na hráča `GIF_USER_RENDERS_PER_MIN` (4) za minútu a `GIF_USER_RENDERS_PER_HOUR` (30) za hodinu; na klienta, so všetkými jeho účtami spolu, `GIF_IP_RENDERS_PER_MIN` (12) za minútu a `GIF_IP_RENDERS_PER_HOUR` (120) za hodinu a trojnásobok na IPv6 /48. Klient by si mal stiahnutý súbor ponechať a nežiadať ho znova a po 429 alebo 503 počkať `retryAfter`.

      Veľkosti: `small` (polia 32 px: 284 x 350 pixelov), `medium` (48 px: 424 x 515), `large` (72 px: 628 x 762); bez súradníc 268 x 342, 400 x 503 a 600 x 748. Začiatočná pozícia zostane zobrazená najmenej 1 s (alebo počas oneskorenia, ak je dlhšie), záverečná pozícia 3 s a GIF sa prehráva dookola; po prvej snímke sa ukladá iba časť obrázka, ktorá sa mení. Partia so 40 ťahmi zaberá približne 135, 205 a 325 KiB (small, medium, large), partia so 150 ťahmi 0,5, 0,8 a 1,2 MiB.
