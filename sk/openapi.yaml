        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Druh sankcie.
        reason:
          type:
            - string
            - 'null'
          description: Uvedený dôvod, ak existuje.
        startsAt:
          type: integer
          format: int64
          description: Začiatok (ms od epochy Unixu).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Koniec (ms od epochy Unixu), `null`, ak je sankcia trvalá.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Koniec pozastavenia (ms od epochy Unixu), `null`, ak je trvalé.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` na prijímanie priamych výziev podľa mena, `none` na ich odmietanie.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Aktuálne heslo.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Nové heslo; platia pravidlá pre heslá ako pri registrácii.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Heslo účtu.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Kód z čakajúceho tajného kľúča, presne 6 číslic.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Heslo účtu.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Nepovinné; vyžaduje sa pri dvojfaktorovom overení (alebo `recoveryCode`). Kód z overovacej aplikácie alebo kód na obnovenie.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Nepovinné. Kód na obnovenie (`xxxx-xxxx-xx`; na veľkosti písmen, medzerách a pomlčkách nezáleží).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Heslo účtu.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Kód z overovacej aplikácie (kód na obnovenie sa odmietne).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Nová adresa; odstránia sa medzery na začiatku a na konci, prevedie sa na malé písmená a potom sa skontroluje ako adresa pri registrácii.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Heslo účtu.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Nepovinné; vyžaduje sa pri dvojfaktorovom overení (alebo `recoveryCode`). Kód z overovacej aplikácie alebo kód na obnovenie.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Nepovinné. Kód na obnovenie.
    TotpSetup:
      type: object
      description: Čakajúci tajný kľúč pre overovaciu aplikáciu.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Tajný kľúč v base32 na zadanie do aplikácie.
        uri:
          type: string
          format: uri
          description: URI `otpauth://totp/...` na zobrazenie ako QR kód.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Počet sekúnd na krok.
    RecoveryCodeList:
      type: array
      description: 10 kódov na obnovenie, zobrazených iba tento raz. Každý funguje iba raz.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Jedna strana partie.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Meno v zázname partie (`deleted#<id>` pri odstránenom účte).
        rating:
          type:
            - integer
            - 'null'
          description: Rating na začiatku, `null`, ak nie je známy.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Rating po partii. Hodnotená partia ho má vždy; `null` iba pri partii, ktorá sa do ratingov nezapočítava (nehodnotená, s vlastným tempom hry, zrušená).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Zmena ratingu, `0`, keď pravidlá ratingu ponechajú rating bez zmeny (nulové skóre podľa FIDE, súper bez ratingu, prvé partie hráča bez ratingu); `null` ako pri `ratingAfter`.
    GameSummary:
      type: object
      description: Súhrn uloženej partie.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: ID partie.
        category:
          type: string
          description: ID oficiálnej kategórie (`3+2`) alebo `custom`.
        rated:
          type: boolean
          description: Či sa partia započítava do ratingov.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Tempo hry v sekundách (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (pozri kódy partií).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Kód dôvodu ukončenia (pozri kódy partií).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Výsledok, `*` pri zrušenej partii.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Počet polťahov.
        startedAt:
          type: integer
          format: int64
          description: Začiatok (ms od epochy Unixu).
        endedAt:
          type: integer
          format: int64
          description: Koniec (ms od epochy Unixu).
    Termination:
      type: string
      description: Názov dôvodu ukončenia (pozri kódy partií); `Unknown` pre kód, ktorý protokol nepozná.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Súhrn partie z pohľadu jedného hráča.
