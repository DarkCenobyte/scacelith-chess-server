  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Stiahnuť partiu ako súbor PGN
      description: |-
        Tá istá partia ako súbor PGN: jedna partia s koncami riadkov `\n` a text ťahov v riadkoch kratších ako 80 stĺpcov. Odpoveď je rovnaká s tokenom aj bez neho.

        Značky v tomto poradí: `Event` (`<SERVER_NAME> rated <category>` alebo `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (dátum začiatku v UTC), `Round`, `White`, `Black`, `Result` (`*` pri zrušenej partii), `UTCDate` a `UTCTime` (začiatok), `WhiteElo` a `BlackElo` (ratingy na začiatku alebo `-`), `WhiteRatingDiff` a `BlackRatingDiff` (zmeny, napríklad `+10` a `-10`, v každej hodnotenej partii, `+0`, keď pravidlá ratingu ponechajú rating bez zmeny; nehodnotená partia, partia s vlastným tempom hry a zrušená partia nemajú ani jednu z nich), `TimeControl` (v sekundách), `Termination` (štandardná hodnota PGN: `normal`; `time forfeit`, prekročenie času, aj keď sa skončí remízou; `abandoned`; `rules infraction`, druhý nemožný ťah alebo kontumácia za porušenie pravidiel férovej hry; `unterminated`, zrušená partia), `PlyCount`, `ScacelithGameId` (desiatkové ID).

        Každý ťah nesie `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: stav hodín hráča, ktorý ťahal, po ťahu a čas započítaný za ťah, v desatinách sekundy (orezané). Hodnota sa vynechá, keď ju záznam nemá. Za posledným ťahom nasleduje slovami dôvod ukončenia a potom výsledok.

        **Limit:** `public_read` (na hráča s tokenom, na klienta bez neho).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Súbor PGN.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'Text PGN v UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: nie je kladné celé číslo s najviac 16 číslicami (menšie ako 2^53); `invalid_request`: nie je platne kódované pre URL.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: bol poslaný token a nie je platný.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: taká partia neexistuje.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `public_read` alebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: okrem iného, keď uložené ťahy nemožno prehrať až po uložené ukončenie partie (server to zapíše do logu).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (databáza zostala zamknutá; `retryAfter: 1` v tele, bez hlavičky `Retry-After`), `server_busy` (vyhľadanie relácie narazilo na zamknutú databázu), `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Stiahnuť partiu z tohto servera ako animovaný GIF
      description: |-
        Partia ako animovaný GIF. Mená a ratingy sú tie zo záznamu partie (ratingy na začiatku, odstránený účet ako `deleted#<id>`), rovnako ako výsledok a spôsob ukončenia (`Resignation`, `Loss on time`...).

        Kontroly prebiehajú v tomto poradí: `gif_disabled`, možnosti obrázka (`size`, `orientation`, `delay`, `coords`), ID partie, partia, jej dĺžka.

        **Povinná relácia:** kvóty sa počítajú na účet. **Limity:** `gif` pri každej požiadavke; `gif_user_min`, `gif_user_hour`, `gif_ip_min` a `gif_ip_hour` iba vtedy, keď treba GIF vytvoriť (pozri popis sekcie). **Časový limit:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 sekúnd (predvolene 45 sekúnd).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 'Veľkosť obrázka: `small` (polia 32 px), `medium` (48 px) alebo `large` (72 px).'
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Strana, ktorá je dole na šachovnici.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Milisekundy na ťah (1 až 6 desiatkových číslic).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Či sa okolo šachovnice kreslia písmená stĺpcov a čísla radov (`1`), alebo nie (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` s `field` (`size`, `orientation`, `delay` alebo `coords`): hodnota mimo povolených. `invalid_game_id`. `invalid_request`: nie je platne kódované pre URL.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: taká partia neexistuje. `gif_disabled`: server má GIF-y vypnuté (`GIF_ENABLED=false`; žetón limitu `gif` sa vráti).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `gif`, limit vykresľovania alebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF sa nepodarilo vytvoriť (server zapíše dôvod do logu). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` s `retryAfter` (3 až 10 sekúnd) a `Retry-After`: front vykresľovania je plný alebo GIF čakal `GIF_QUEUE_TIMEOUT_MS` (10 sekúnd) na voľné vlákno; všetky žetóny limitov, ktoré požiadavka vzala, sa vrátia. `busy`: databáza zostala zamknutá (`retryAfter: 1` iba v tele). `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Vytvoriť animovaný GIF z ľubovoľnej partie poslanej ako PGN
      description: |-
        Ten istý obrázok ako `GET /games/{id}/gif` pre ľubovoľnú partiu poslanú ako text PGN: partiu uloženú hrou, export z inej stránky, ručne napísanú partiu. Použije sa iba prvá partia z textu.

        - Parser PGN prijíma to isté ako parser samotnej hry: každé PGN, ktoré tento server zapisuje, a bežné exporty iných stránok (komentáre, varianty, NAG a údaje o hodinách sa preskakujú; čísla ťahov a SAN sa čítajú tolerantne; značka `FEN` určuje východiskovú pozíciu, ak `SetUp` nie je `"0"`).
        - Mená a ratingy pochádzajú zo značiek `White`, `Black`, `WhiteElo` a `BlackElo`. Písmená s diakritikou o ňu prídu, ostatné znaky mimo tlačiteľných znakov ASCII sa zmenia na `?` a dlhé mená sa skrátia (48 znakov). Výsledok pochádza zo značky `Result`, inak z konca textu ťahov. Značka `Termination` sa zobrazí, ak nie je `normal`: vtedy o konci partie vypovie koncová pozícia (mat, pat).
        - Tento endpoint kontroluje telo sám: neznáme pole alebo `pgn`, ktoré chýba alebo nie je reťazec, vráti 400 `invalid_request` s `field`; nesprávna možnosť vráti 400 `invalid_option` (`delayMs` musí byť číslo JSON, `coords` boolovská hodnota; `null` sa odmieta).

        **Povinná relácia:** kvóty sa počítajú na účet. **Limity:** ako pri `GET /games/{id}/gif`. **Limit veľkosti tela:** 135 168 bajtov bez ohľadu na `HTTP_BODY_LIMIT` (PGN ako reťazec JSON vrátane escape sekvencií). **Časový limit:** predvolene 45 sekúnd.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Krátka ručne zadaná partia, bez súradníc
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: Súbor PGN so všetkými možnosťami
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` s `field` (neznáme pole alebo `pgn` chýba či nie je reťazec; bez `field`, keď telo nie je objekt); `invalid_json`; `invalid_option` s `field` (`size`, `orientation`, `delayMs` alebo `coords`); `invalid_pgn` s `line` a `column` (od 1, stĺpce v znakoch) a `message` parsera: nemožný alebo nejednoznačný ťah, poškodená značka, neznámy variant šachu, viac ako 65 536 bajtov.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: server má GIF-y vypnuté (`GIF_ENABLED=false`; žetón limitu `gif` sa vráti).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: telo väčšie ako 135 168 bajtov.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limit `gif`, limit vykresľovania alebo kvóta účtu.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF sa nepodarilo vytvoriť (server zapíše dôvod do logu). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` s `retryAfter` (3 až 10 sekúnd) a `Retry-After`: front vykresľovania je plný alebo GIF čakal na voľné vlákno príliš dlho; všetky žetóny limitov, ktoré požiadavka vzala, sa vrátia. `timeout`. Aj `server_busy` s `retryAfter` 2 až 5, keď server výrazne zaostáva (pozri úvod): požiadavka nebola vykonaná.'
