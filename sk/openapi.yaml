info:
  title: HTTPS API servera Scacelith
  version: "1.1.0"
  summary: HTTPS API každého servera Scacelith, oficiálneho aj komunitných serverov.
  description: |-
    Toto HTTPS API poskytuje každý server Scacelith, oficiálny `caissa.scacelith.com` aj ktorýkoľvek komunitný server. Hra ho používa na všetko mimo samotnej partie: registráciu a prihlásenie (vrátane dvojfaktorového overenia a prihlásenia cez Google), stránku účtu, históriu partií, sťahovanie PGN a animovaných GIF-ov partií, prihlásené zariadenia, stiahnutie údajov, odstránenie účtu a nahlásenia.

    Hra v reálnom čase (hľadanie súpera, výzvy, ťahy, hodiny) prebieha cez WebSocket toho istého servera (`wss://<host>/ws`), ktorý sa otvára s tokenom relácie z tohto API; popisuje ho `PROTOCOL.md`, nie táto stránka.

    Predvolené hodnoty uvedené nižšie platia pre server s nezmenenou konfiguráciou; komunitný server ich môže zmeniť (`CONFIG.md` uvádza každé nastavenie).

    ## Základná URL, port a transport

    - Oficiálny server: `https://caissa.scacelith.com/api/v1`, port TCP 443.
    - Komunitný server: `https://<SERVER_PUBLIC_HOST>[:<port>]/api/v1`. `API_PORT` je predvolene 443; za NAT alebo proxy je port, ktorý používajú hráči, `PUBLIC_API_PORT`.
    - WebSocket hry je predvolene na tom istom porte (`WS_PORT` ho presúva inam; `GET /info` oznámi klientovi, kde je).
    - HTTP/1.1 cez TLS. Pri `TLS_MODE=proxy` ukončuje TLS reverzná proxy pred serverom. `TLS_MODE=off` (čisté HTTP) je určené iba na lokálny vývoj.
    - Stránky HTML otvárané z odkazov v e-mailoch (`/verify-email`, `/reset-password`, `/confirm-email-change`) sú v koreni servera, mimo `/api/v1`. Endpointy kontroly stavu odpovedajú v koreni aj pod `/api/v1`. Prihlásenie cez Google nemá na serveri žiadnu stránku: Google pošle prehliadač späť priamo do hry, na `127.0.0.1`, alebo na stránku webu, ktorý prihlásenie začal (`GOOGLE_WEB_REDIRECT_URI`).
    - Koncová lomka sa ignoruje (`/api/v1/info/` je `/api/v1/info`) a parametre cesty sa dekódujú z kódovania URL (na parameter, ktorý nie je platne kódovaný pre URL, server odpovie 400 `invalid_request`).

    ## Požiadavky

    - **Telá JSON.** Požiadavky `POST`, `PUT` a `DELETE` nesú objekt JSON s `Content-Type: application/json`. Parameter `charset` s inou hodnotou ako UTF-8 sa odmieta, rovnako ako akýkoľvek iný typ obsahu (415 `unsupported_media_type`). Prázdne telo sa počíta ako `{}`, čo je presne to, čo prijímajú endpointy bez parametrov (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`).
    - **Veľkosť a čas.** Telo je obmedzené na `HTTP_BODY_LIMIT` bajtov (predvolene 16 384; `POST /gif` má vlastný limit 135 168 bajtov): 413 `payload_too_large`. Musí doraziť do 10 sekúnd: 408 `request_timeout`. Po ktorejkoľvek z týchto chýb server zatvorí spojenie.
    - **Prísne schémy.** Pole, ktoré endpoint nepozná, sa odmietne, pole neoznačené ako nepovinné je povinné a kontrolujú sa typy a dĺžky. Pri ktoromkoľvek z týchto zlyhaní server odpovie 400 `invalid_request` a `field` uvedie názov poľa (pri vnorenom poli v zápise s bodkami, napríklad `pow.nonce`). Reťazce nesmú obsahovať riadiace znaky. Dĺžky sa počítajú v kódových jednotkách UTF-16, takže znak mimo základnej viacjazyčnej roviny (Basic Multilingual Plane), napríklad emoji, sa počíta dvakrát. Na telo, ktoré nie je JSON, server odpovie 400 `invalid_json`. `POST /gif` a `POST /reports` kontrolujú svoje telá samy (pozri jednotlivé endpointy).
    - **Reťazce dopytu.** Platí prvý výskyt parametra, neznáme parametre sa ignorujú a `+` sa dekóduje na medzeru: endpointy, ktoré prijímajú kategóriu tempa hry, akceptujú `3%2B2` aj `3+2`.
    - **Metódy.** `HEAD` je `GET` bez tela. Na `OPTIONS` na existujúcej ceste server odpovie 204 s hlavičkou `Allow` (a s hlavičkami odpovede na predbežnú požiadavku CORS, pozri nižšie). Na akúkoľvek inú metódu, ktorú cesta nemá, odpovie 405 `method_not_allowed` s `Allow`.
    - **Cieľ požiadavky.** Nesmie presiahnuť 4096 znakov (414 `uri_too_long`). Požiadavka, ktorú vôbec nemožno analyzovať alebo ktorej hlavičková časť je príliš veľká či prichádza príliš pomaly, dostane prázdnu odpoveď 400, 431 alebo 408 a spojenie sa zatvorí.
    - **CORS: zoznam povolených, predvolene vypnutý.** API slúži hre, ktorá neposiela `Origin`. Keď je `CORS_ORIGINS` prázdne (predvolené nastavenie), nikdy sa neposiela žiadna hlavička `Access-Control-*`, takže žiadna webová stránka nemôže odpoveď prečítať. `CORS_ORIGINS` uvádza webové pôvody, ktorých stránky môžu volať API z prehliadača, každý presne tak, ako ho prehliadače posielajú v `Origin`: `https://host` alebo `https://host:port`, malými písmenami, bez cesty, koncovej lomky a predvoleného portu; `http://` iba pre `localhost`, `127.0.0.1` a `[::1]` (lokálny vývoj); bez zástupných znakov. Oficiálny server nastavuje pre svoj web `CORS_ORIGINS=https://scacelith.com,https://www.scacelith.com`. Potom:
      - Každá odpoveď pre cestu pod `/api/v1` okrem endpointov kontroly stavu, úspešná aj chybová (vrátane 429 vrstvy podľa adresy), nesie `Vary: Origin`. Keď sa `Origin` požiadavky bajt po bajte zhoduje s jedným z uvedených pôvodov, nesie aj `Access-Control-Allow-Origin: <that origin>` a, okrem odpovede na predbežnú požiadavku, `Access-Control-Expose-Headers: Retry-After, Content-Disposition`, aby stránka mohla prečítať kódy chýb, `Retry-After` a názvy súborov pri sťahovaní PGN a GIF.
      - Na predbežnú požiadavku (`OPTIONS` s `Access-Control-Request-Method`) z uvedeného pôvodu na existujúcu cestu server odpovie 204, bez tela, s `Allow`, `Access-Control-Allow-Origin`, `Access-Control-Allow-Methods` (metódy z `Allow`), `Access-Control-Allow-Headers: Authorization, Content-Type`, `Access-Control-Max-Age: 600` a `Vary: Origin`. Nepotrebuje token a nezapočítava sa do kvóty účtu ani do žiadneho limitu endpointu; ako každá požiadavka vezme jeden žetón vrstvy podľa adresy. Prehliadač opätovne využíva predbežnú požiadavku 10 minút, ale iba pre presne tú istú URL vrátane reťazca dopytu. Požiadavka bez `Authorization` a bez tela JSON, napríklad `GET /info` alebo `GET /leaderboard`, predbežnú požiadavku nepotrebuje.
      - Akákoľvek iná odpoveď na predbežnú požiadavku znamená neúspešnú predbežnú požiadavku, aj keď nesie hlavičky CORS: 404 pre cestu, ktorá neexistuje, alebo 429 vrstvy podľa adresy. Prehliadač potom požiadavku neodošle a stránka uvidí sieťovú chybu bez odpovede aj bez jej `Retry-After`.
      - `Access-Control-Allow-Credentials` sa nikdy neposiela, ani `Access-Control-Allow-Origin: *`: stránka posiela svoj token relácie v `Authorization: Bearer`, rovnako ako hra, a API nenastavuje žiadne cookie. Stránky HTML, endpointy kontroly stavu a prázdne odpovede na nečitateľné požiadavky nenesú žiadnu hlavičku CORS. WebSocket CORS nepoužíva: `WS_ALLOWED_ORIGINS` uvádza stránky, ktoré ho môžu otvoriť.
      - Stránka z neuvedeného pôvodu nič neprečíta a jej zápisy z iného webu (cross-site) sa nikdy neodošlú: telá JSON a `Authorization` vyžadujú predbežnú požiadavku, ktorej odpoveď nemá pre tento pôvod `Access-Control-Allow-Origin`. `Cross-Origin-Resource-Policy: same-origin` zostáva na každej odpovedi: vzťahuje sa iba na požiadavky `no-cors` (iný web vkladá odpoveď do svojej stránky), nikdy na požiadavky `cors` stránky z uvedeného pôvodu.

    ## Odpovede a chyby

    - Odpovede sú JSON v UTF-8, okrem sťahovania PGN (`application/x-chess-pgn`), animovaných GIF-ov (`image/gif`) a stránok HTML. Časy sú v milisekundách od 1970-01-01 UTC. ID sú celé čísla. ID partií majú až 16 číslic, ale zostávajú pod 2^53, takže ich číslo JSON (double) vyjadrí presne.
    - Každá odpoveď API nesie `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`, `X-Frame-Options: DENY`, `Cross-Origin-Resource-Policy: same-origin` a `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'` (stránky HTML majú vlastnú politiku). Pri `TLS_MODE=native` nesie aj `Strict-Transport-Security: max-age=31536000`. Odpovede, ktoré zapisuje sám poslucháč ešte pred API (`GET` a `HEAD` endpointov kontroly stavu, 429 vrstvy podľa adresy a 500 `internal_error`, keď API úplne zlyhá), nesú tie isté hlavičky okrem `Cross-Origin-Resource-Policy` a ich `Content-Type` je `application/json` bez parametra charset.
    - Odpoveď musí byť prečítaná do 60 sekúnd od chvíle, keď ju má server pripravenú, na čom záleží iba pri veľkých odpovediach (GIF, export údajov, dlhé PGN). Čas, ktorý server potrebuje na prípravu odpovede, sa nezapočítava ani do tohto limitu, ani do 30 sekúnd bez prijatého či odoslaného bajtu, po ktorých sa spojenie zatvorí.

    Chyby majú jeden tvar (schéma `Error`):

    ```json
    { "error": "snake_case_code", "message": "An English sentence.", "retryAfter": 30 }
    ```

    `message` je určené pre logy a ako záložný text; klient vyberá, čo zobrazí, podľa `error`. `retryAfter` (sekundy) je prítomné iba pri odmietnutiach, ktoré po čase pominú, a odpoveď potom nesie aj hlavičku `Retry-After` s rovnakou hodnotou; jedinou výnimkou je chyba 503 `busy` pri čítaní histórie, partií, hráčov a rebríčka, ktorá má iba toto pole. Niektoré chyby pridávajú polia: `field` (neplatný vstup), `reason` (`weak_password`, `pow_required`), `pow` (`pow_required`), `until` (`banned`), `line` a `column` (`invalid_pgn`).

    Chyby, ktoré môže vrátiť ktorýkoľvek endpoint:

    | Stav | `error` | Kedy |
    |---|---|---|
    | 400 | `invalid_request` | Telo porušuje schému endpointu (`field` uvádza kde), cieľ požiadavky alebo `Content-Length` má chybný formát, parameter cesty nie je platne kódovaný pre URL alebo bolo telo odrezané. |
    | 400 | `invalid_json` | Telo nie je JSON. |
    | 401 | `unauthorized` | Chýba hlavička `Authorization` na endpointe, ktorý vyžaduje reláciu. |
    | 401 | `invalid_token` | Token má chybný formát, vypršala jeho platnosť, bol odvolaný alebo patrí odstránenému účtu; aj na endpointoch, kde je relácia nepovinná. |
    | 404 | `not_found` | Takýto endpoint neexistuje. Používajú ho aj niektoré endpointy: takáto partia, hráč alebo relácia neexistuje. |
    | 405 | `method_not_allowed` | Cesta existuje pre iné metódy (pozri `Allow`). |
    | 408 | `request_timeout` | Telo nedorazilo do 10 sekúnd. |
    | 413 | `payload_too_large` | Telo presahuje `HTTP_BODY_LIMIT` (pre `POST /gif` 135 168 bajtov). |
    | 414 | `uri_too_long` | Cieľ požiadavky presahuje 4096 znakov. |
    | 415 | `unsupported_media_type` | Telo nie je `application/json` alebo jeho znaková sada nie je UTF-8. |
    | 429 | `rate_limited` | Limit počtu požiadaviek (pozri nižšie): `retryAfter` a k tomu hlavička `Retry-After`. |
    | 500 | `internal_error` | Neočakávané zlyhanie. Server ho zapíše do logu. |
    | 503 | `timeout` | Server neodpovedal do 30 sekúnd (pri exporte do 60 sekúnd, pri GIF-och s predvolenými nastaveniami do 45 sekúnd). |
    | 503 | `server_busy` | Vyhľadanie relácie alebo zmena účtu narazili na zamknutú databázu (`retryAfter` 1) alebo je front na hashovanie hesiel plný (pozri nižšie). Tiež s `retryAfter` 2 až 5, keď server výrazne zaostáva: pri `POST`, `PUT`, `PATCH` alebo `DELETE` čaká v databáze príliš veľa zápisov; pri akejkoľvek požiadavke stále beží príliš veľa skorších požiadaviek po uplynutí ich časového limitu alebo token relácie nebolo možné overiť do 5 sekúnd. Požiadavka nebola vykonaná a z jej limitov počtu požiadaviek sa nič neodpočítalo. |

    Endpointy na čítanie (história partií, partie, hráči, rebríček) a export odpovedajú 503 `busy` s `retryAfter: 1`, keď databáza zostala zamknutá.

    Endpointy, ktoré overujú alebo hashujú heslo, môžu odpovedať aj jednou z týchto chýb, obe s náhodným `retryAfter` 5 až 15 sekúnd:

    - 503 `server_busy`: front na hashovanie hesiel servera (`PASSWORD_HASH_QUEUE_MAX`) je plný alebo vypršal čas čakania.
    - 429 `rate_limited`: front je zaplnený aspoň do polovice a tento klient (adresa IPv4 alebo IPv6 /48) už v ňom má `PASSWORD_HASH_WAITERS_PER_SOURCE` čakajúcich hashov. Táto odpoveď 429 vráti žetóny limitov počtu požiadaviek, ktoré požiadavka spotrebovala.

    Nič sa nezmenilo a nezapočítal sa žiadny neúspešný pokus (okrem `POST /auth/sso/google/link`, pri ktorom sa pokus tiketu a zlyhanie účtu započítali ešte pred hashovaním) a odkaz na resetovanie hesla zostáva platný.

    Stránky HTML vracajú svoje chyby ako stránky HTML s rovnakými stavovými kódmi.

    ## Autentifikácia

    Endpointy, ktoré vyžadujú reláciu, prijímajú token typu bearer v hlavičke `Authorization` (schéma `bearerAuth`):

    ```
    Authorization: Bearer sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
    ```

    - **Získanie tokenu.** Token (`sct_`, za ktorým nasleduje 43 znakov base64url) vydáva `POST /auth/login`, potom `POST /auth/login/mfa`, keď je zapnuté dvojfaktorové overenie, ďalej `POST /auth/sso/google/finish` a `POST /auth/sso/google/link` (prihlásenie cez Google) a `POST /auth/sso/complete`. Každý z nich odpovedá `{ token, expiresAt, user }`. Server ukladá iba SHA-256 tokenu.
    - **Povinná relácia.** Na chýbajúcu hlavičku server odpovie 401 `unauthorized` s `WWW-Authenticate: Bearer realm="scacelith"`. Na neplatný token odpovie 401 `invalid_token` s `WWW-Authenticate: Bearer realm="scacelith", error="invalid_token"`. Klient by mal token, ktorý dostane `invalid_token`, zabudnúť a znova sa prihlásiť.
    - **Nepovinná relácia.** Pri `GET /games/{id}`, `GET /games/{id}/pgn`, `GET /players/{username}` a `GET /players/{username}/games` je relácia nepovinná. Bez hlavičky vracajú verejný pohľad; ak sa hlavička pošle, jej token musí byť platný.
    - **Zaneprázdnené úložisko.** Keď databáza počas overovania tokenu zostane zamknutá, endpoint, ktorý reláciu vyžaduje alebo prijíma, odpovie 503 `server_busy` s `retryAfter: 1` (a `Retry-After`); keď overenie trvá viac ako 5 sekúnd, odpovie 503 `server_busy` s `retryAfter` 2 až 5. V oboch prípadoch o tokene nebolo rozhodnuté: ponechajte si ho a pošlite požiadavku znova.
    - **Platnosť.** Relácia sa skončí pri tom, čo nastane skôr: `SESSION_MAX_DAYS` (90) dní po prihlásení (to je `expiresAt`) alebo `SESSION_IDLE_DAYS` (30) dní bez použitia. Každé použitie posunie limit nečinnosti; server zapisuje novú hodnotu najviac raz za 5 minút, na pozadí. Kým v jeho databáze čaká veľa zápisov, odkladá tento zápis na neskoršiu požiadavku, okrem poslednej hodiny pred limitom nečinnosti, takže používaná relácia nevyprší. Účet si ponecháva najviac `MAX_SESSIONS_PER_USER` (10) relácií: nové prihlásenie odvolá najstaršie relácie nad tento počet.
    - **Odvolanie.** Odhlásenie (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`) odvoláva relácie; rovnako aj zmena hesla (ostatné relácie), resetovanie hesla a odstránenie účtu (všetky relácie) a administrátor. Odvolanie cez API platí okamžite a WebSocket otvorený s odvolanou reláciou sa zatvorí. Zmena alebo resetovanie hesla a odstránenie účtu odvolávajú relácie v tej istej transakcii ako samotná zmena: keď niektorá z nich zlyhá, žiadna relácia nebola odvolaná a nič iné sa tiež nezmenilo. Server uchováva výsledky vyhľadania relácií vo vyrovnávacej pamäti 30 sekúnd, takže odvolanie administrátorským príkazom, ktorý beží ako samostatný proces, sa prejaví do 30 sekúnd.
    - **Rozsah.** Token patrí jednému serveru a otvára aj jeho WebSocket. Nikdy ho neposielajte inému serveru.

    ## Limity počtu požiadaviek a ďalšie obmedzenia

    Limity sa vzťahujú na jeden z dvoch rozsahov. **Klient:** adresa IPv4 alebo IPv6 /64 (v režime proxy pochádza adresa z `X-Forwarded-For`, ktorú poslala adresa z `TRUSTED_PROXIES`); niektoré limity počítajú aj každú IPv6 /48 ako celok, navyše ku každej z jej sietí /64. **Hráč:** prihlásený účet bez ohľadu na adresu; limit počítaný na hráča na endpointe, kde je relácia nepovinná, sa pri požiadavke bez tokenu počíta na klienta.

    Každý limit je vedro žetónov (token bucket), ktoré pojme `limit` požiadaviek a priebežne sa dopĺňa rýchlosťou `limit / window`; `retryAfter` je čas do ďalšieho žetónu. Limity označené ako *zdieľané* sa navyše počítajú v posuvnom okne rovnakej dĺžky, aby žiadne okno neobsahovalo o veľa viac ako `limit` požiadaviek. Každý limit sa počíta pre celý server. Keď jeden z limitov endpointu požiadavku odmietne, žetóny, ktoré pre túto požiadavku vzali jeho ostatné limity, sa vrátia. Na odmietnutie server odpovie 429 `rate_limited` s `retryAfter` a `Retry-After`.

    - **Vrstva podľa adresy.** Každá požiadavka (akákoľvek cesta a metóda vrátane endpointov kontroly stavu a prechodov na WebSocket) najprv vezme jeden žetón z kvóty svojho klienta: `HTTP_RATE_PER_IP` (600) za minútu s nárazovou kapacitou (burst) na pol minúty a `HTTP_RATE_PER_PREFIX` (4 x `HTTP_RATE_PER_IP`) pre IPv6 /48. Klient môže mať navyše najviac `IP_MAX_INFLIGHT` (32 x `WORKERS`) rozpracovaných požiadaviek (nad tento počet `retryAfter` 1). Klient, ktorý pokračuje aj po odmietnutiach, sa zablokuje: `ABUSE_BLOCK_REFUSALS_PER_MIN` (600) odmietnutí za jednu minútu ho zablokuje na 1 minútu, potom na 4, 16 a 60 minút pri každom ďalšom zablokovaní v priebehu 6 hodín. Odmietnutie limitmi `auth`, `auth_*` a `reauth` sa počíta za 5; odmietnutia limitmi počítanými na hráča sa nepočítajú nikdy. Adresy v `ABUSE_EXEMPT` túto vrstvu obchádzajú, ale nie kvótu účtu ani limity endpointov.
    - **Kvóta účtu.** Každá požiadavka, ktorá nesie platný token relácie, sa započítava aj do kvóty svojho účtu: `USER_RATE_PER_MIN` (120) za minútu pre všetky endpointy spolu, bez ohľadu na adresu, s nárazovou kapacitou (burst) na pol minúty.
    - **Limity endpointov:**

    | Limit | Predvolená hodnota | Počíta sa | Endpointy |
    |---|---|---|---|
    | `auth` | `AUTH_RATE_PER_IP` (20) / 10 min, zdieľaný | na klienta a `AUTH_RATE_PER_PREFIX` (5 x `AUTH_RATE_PER_IP`) na IPv6 /48 | `POST /auth/register`, `/auth/login`, `/auth/login/mfa`, `/auth/verify-email/resend`, `/auth/password/forgot`, `/auth/password/reset`, `/auth/sso/google/link`, `/auth/sso/complete`; `POST /verify-email`, `/reset-password`, `/confirm-email-change` |
    | `auth_register` | `AUTH_REGISTER_PER_HOUR` (10) / h, zdieľaný | na klienta, trojnásobok na IPv6 /48 | `POST /auth/register` |
    | `auth_mail` | `AUTH_MAIL_PER_HOUR` (10) / h, zdieľaný | na klienta, trojnásobok na IPv6 /48 | `POST /auth/verify-email/resend` |
    | `auth_forgot` | `AUTH_FORGOT_PER_HOUR` (3) / h, zdieľaný | na klienta, trojnásobok na IPv6 /48 | `POST /auth/password/forgot` |
    | `auth_forgot_day` | `AUTH_FORGOT_PER_DAY` (10) / 24 h, zdieľaný | na klienta, trojnásobok na IPv6 /48 | `POST /auth/password/forgot` |
    | `auth_reset` | `AUTH_RESET_PER_HOUR` (10) / h, zdieľaný | na klienta, trojnásobok na IPv6 /48 | `POST /auth/password/reset`, `POST /reset-password` |
    | `reauth` | hodnoty limitu `auth`, vlastné vedro, zdieľaný | na klienta a IPv6 /48 | `POST /account/password`, `/account/mfa/totp/setup`, `/account/mfa/totp/enable`, `/account/mfa/totp/disable`, `/account/mfa/recovery-codes`, `/account/email`, `/account/export`, `/account/delete` |
    | `reauth_user` | `AUTH_REAUTH_PER_USER` (10) / 10 min, zdieľaný | na hráča | tie isté endpointy ako `reauth` |
    | `account` | 60 / min | na hráča | `GET /account/me`, `PUT /account/preferences` |
    | `account_games` | 60 / min | na hráča | `GET /account/games` |
    | `account_export` | 5 / h, zdieľaný | na hráča | `POST /account/export` (kontroluje sa pred `reauth`; počíta sa každý pokus) |
    | `sessions` | 60 / min | na hráča | `POST /auth/logout`, `/auth/logout-all`, `GET /auth/sessions`, `DELETE /auth/sessions/{id}` |
    | `public_read` | 60 / min | na hráča (na klienta bez tokenu) | `GET /players/{username}`, `/players/{username}/games`, `/games/{id}`, `/games/{id}/pgn` (jedno vedro pre všetky štyri) |
    | `gif` | 30 / min | na hráča | `GET /games/{id}/gif`, `POST /gif` (jedno vedro pre oba) |
    | `gif_user_min`, `gif_user_hour` | `GIF_USER_RENDERS_PER_MIN` (4) / min a `GIF_USER_RENDERS_PER_HOUR` (30) / h, zdieľané | na hráča | tie isté dva, iba keď treba GIF vytvoriť (nie z vyrovnávacej pamäte) |
    | `gif_ip_min`, `gif_ip_hour` | `GIF_IP_RENDERS_PER_MIN` (12) / min a `GIF_IP_RENDERS_PER_HOUR` (120) / h, zdieľané | na klienta (všetky jeho účty spolu), trojnásobok na IPv6 /48 | tie isté, ako vyššie |
    | `reports` | 30 / h | na hráča | `POST /reports` |
    | `sso_start` | 30 / 10 min, zdieľaný | na klienta a 90 na IPv6 /48 | `POST /auth/sso/google/start`, `POST /auth/sso/google/web/start` (spolu) |
    | `sso_finish` | 30 / min | na klienta | `POST /auth/sso/google/finish` |
    | `page` | 60 / min | na klienta | `GET /verify-email`, `/reset-password`, `/confirm-email-change` |

    `GET /info` a `GET /leaderboard` nemajú vlastný limit: iba vrstvu podľa adresy. Endpoint s viacerými limitmi ich kontroluje v poradí uvedenom v jeho popise.

    Server spracúva požiadavku v tomto poradí: vrstva podľa adresy, potom endpointy kontroly stavu; priradenie endpointu; kontroly, či server výrazne nezaostáva (503 `server_busy`): príliš veľa skorších požiadaviek, ktoré stále bežia po uplynutí časového limitu, a pri `POST`, `PUT`, `PATCH` alebo `DELETE` nevybavené zápisy databázy; autentifikácia, do 5 sekúnd (inak 503 `server_busy`); kvóta účtu, keď požiadavka nesie reláciu; limity endpointu; telo; samotný endpoint (endpointy GIF uplatňujú svoje limity vykresľovania, iba keď majú GIF vytvoriť). Požiadavka odmietnutá pre svoj token teda nespotrebuje žiadne žetóny endpointu, zatiaľ čo požiadavka s neplatným telom ich spotrebuje.

    Ďalšie obmedzenia, ktoré uplatňujú samotné endpointy:

    - **Neúspešné prihlásenia na jedno prihlasovacie meno** (používateľské meno alebo e-mail): od `AUTH_FAILURES_PER_ACCOUNT` (5) zlyhaní musí každý pokus čakať dvakrát dlhšie ako predchádzajúci (2 s, 4 s atď., najviac 15 minút): 429 `too_many_attempts` s `retryAfter`. Počítadlo sa vynuluje po hodine bez zlyhaní.
    - **Neúspešné overenia druhého faktora pri prihlásení:** rovnaké pravidlo od 5. nesprávneho kódu účtu. Jeden krok prihlásenia prijme najviac 5 nesprávnych kódov.
    - **Kódy druhého faktora jedného účtu:** najviac `AUTH_MFA_PER_ACCOUNT` (10) kódov (kódov z overovacej aplikácie alebo kódov na obnovenie, správnych či nesprávnych) za 15 minút, z akejkoľvek adresy, pri prihlásení aj pri opätovných autentifikáciách; nad tento počet 429 `too_many_attempts` ešte pred overením kódu, takže kód na obnovenie sa nespotrebuje.
    - **Neúspešné opätovné autentifikácie účtu** (nesprávne heslo alebo kód): rovnaké pravidlo (429 `too_many_attempts`), spoločné pre všetky endpointy, ktoré vyžadujú opätovnú autentifikáciu.
    - **E-maily:** jeden potvrdzovací e-mail alebo e-mail na resetovanie hesla na adresu každých 5 minút (odpoveď zostáva rovnaká); jedno upozornenie „niekto sa pokúsil použiť vašu adresu“ na adresu za hodinu.
    - **Nahlásenia:** `REPORTS_PER_DAY` (5) na hráča za 24 hodín: 429 `report_limit`.

    ## Dôkaz práce

    `POST /auth/register` vždy vyžaduje dôkaz práce, keď je `POW_REGISTER_BITS` väčšie ako 0 (predvolene 18; `GET /info` ho uvádza ako `pow.register`). `POST /auth/login` a `POST /auth/sso/google/link` (jeden druh výzvy pre oba) ho vyžadujú iba počas 5 minút po tom, čo server zaznamená vlnu neúspešných prihlásení (`POW_LOGIN_TRIGGER_PER_MIN`, potom `POW_LOGIN_BITS`); klient sa to dozvie z odpovede.

    1. Na požiadavku bez dôkazu (alebo s odmietnutým dôkazom) server odpovie 428 `pow_required` s `reason` a výzvou `pow` `{ challenge, bits, expiresAt }`.
    2. Nájdite nonce: desiatkový reťazec s najviac 20 číslicami, pre ktorý `SHA-256(challenge + ":" + nonce)` začína `bits` nulovými bitmi (najvýznamnejší bit prvého bajtu ako prvý). 18 bitov si vyžaduje v priemere približne 260 000 hashov.
    3. Pošlite tú istú požiadavku znova s `"pow": { "challenge": "...", "nonce": "123456" }` v tele.

    Výzva platí 2 minúty a iba raz, pre jeden endpoint a jednu sieť klienta (adresu IPv4 alebo IPv6 /64). Je podpísaná, takže server si o nej nič neuchováva, kým sa nevráti. `reason` uvádza, prečo bol dôkaz odmietnutý: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` alebo `replayed`.

    ## Opätovná autentifikácia

    Zmeny účtu znova vyžadujú heslo a, keď je zapnuté dvojfaktorové overenie, aj druhý faktor:

    - iba heslo: `POST /account/password` a `POST /account/mfa/totp/setup`;
    - heslo a kód z overovacej aplikácie, pričom kód na obnovenie sa odmieta: `POST /account/mfa/recovery-codes`;
    - heslo a kód z overovacej aplikácie alebo kód na obnovenie: `POST /account/mfa/totp/disable`, `POST /account/email`, `POST /account/export` a `POST /account/delete`.

    V telách obsahuje `code` 6-ciferný kód z overovacej aplikácie a `recoveryCode` kód na obnovenie (`xxxx-xxxx-xx`; na veľkosti písmen, medzerách a pomlčkách nezáleží). Kód na obnovenie možno poslať aj v `code` tam, kde sa kódy na obnovenie prijímajú. Každý kód funguje raz: použitý kód z overovacej aplikácie sa odmieta až do nasledujúceho 30-sekundového kroku a kód na obnovenie po použití zaniká.

    | Stav | `error` | Kedy |
    |---|---|---|
    | 403 | `invalid_password` | Nesprávne heslo alebo bolo heslo počas vybavovania požiadavky resetované či zmenené (nič sa nezmenilo). |
    | 403 | `mfa_code_required` | Dvojfaktorové overenie je zapnuté a nebol poslaný ani `code`, ani `recoveryCode`. |
    | 403 | `invalid_code` | Nesprávny alebo už použitý kód. |
    | 400 | `password_not_set` | Účet len s prihlásením cez Google zatiaľ nemá heslo (nastaví ho „Zabudnuté heslo?“). |
    | 429 | `too_many_attempts` | Príliš veľa zlyhaní alebo príliš veľa vyskúšaných kódov na tomto účte. |
    | 503 / 429 | `server_busy` / `rate_limited` | Front na hashovanie hesiel je preťažený. |

    Nesprávne heslá a kódy sa započítavajú do počítadla zlyhaní účtu a zaznamenávajú sa ako bezpečnostné udalosti.

    ## Port metrík

    Okrem portu API server odpovedá cez čisté HTTP aj na porte metrík (`METRICS_PORT`, 9464, viazaný na `METRICS_BIND`, predvolene 127.0.0.1; ponechajte ho neverejný). Nie je súčasťou tohto API: `GET /healthz` odpovedá `ok`; `GET /readyz` odpovedá `ready` od dokončenia spustenia (každý shard znova prehral svoj žurnál a poslucháči sú naviazaní) až do začiatku vypínania, inak 503 `not ready`; `GET /metrics` poskytuje metriky Prometheus a pri nastavenom `METRICS_TOKEN` vyžaduje `Authorization: Bearer <token>` s presne týmto tokenom.
