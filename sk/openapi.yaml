components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Token relácie (`sct_` a za ním 43 znakov base64url) z odpovede na prihlásenie, v hlavičke `Authorization`: `Authorization: Bearer <token>`. Predpona je presne `Bearer` (rozlišujú sa veľké a malé písmená) a jedna medzera; hodnota bez nej alebo token, ktorý nemá 1 až 512 tlačiteľných znakov ASCII, dostane odpoveď 401 `invalid_token` ako každý iný neplatný token. Prázdna hlavička sa považuje za chýbajúcu.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: ID partie, kladné desiatkové celé číslo s najviac 16 číslicami bez úvodných núl, menšie ako 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: ID relácie, ako ho uvádza `GET /auth/sessions`, zapísané bez úvodných núl (`03` nie je relácia 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Používateľské meno hráča, bez ohľadu na veľkosť písmen. Server prijme každé meno s 2 až 24 znakmi z `[A-Za-z0-9_.-]` (najširšie pravidlo, aké kedy povoľoval).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: ID partie; vypíšu sa iba staršie partie. Pošlite `next` z predchádzajúcej strany. Prázdna hodnota sa považuje za chýbajúcu.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Veľkosť strany, 1 až 50. Väčšie číslo s najviac 3 číslicami sa považuje za 50; prázdna hodnota sa považuje za chýbajúcu.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: Token odkazu z e-mailu (43 znakov base64url). Ak chýba alebo je nesprávny, zobrazí sa stránka „link invalid or expired“ (odkaz je neplatný alebo mu vypršala platnosť).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Každá odpoveď servera zakazuje ukladanie do vyrovnávacej pamäte.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Počet sekúnd, ktoré treba počkať pred ďalším pokusom; rovnaká hodnota ako `retryAfter` v tele.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Výzva Bearer, s `error="invalid_token"` pri neplatnom tokene.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Server po tejto odpovedi zatvorí spojenie.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (s `field`, keď je chyba v niektorom poli tela) alebo `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Pole porušuje schému
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Telo nie je JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Slabé heslo
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: PGN, ktoré sa nedá prečítať
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (chýba hlavička `Authorization`) alebo `invalid_token` (token má chybný formát, vypršala jeho platnosť, bol odvolaný alebo patrí odstránenému účtu).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Bez relácie
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Neplatný token
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Požiadavka je odmietnutá.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Nesprávne heslo pri opätovnej autentifikácii
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Pozastavený účet
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found` alebo funkcia, ktorú tento server vypol.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: telo nedorazilo do 10 sekúnd. Server zatvorí spojenie.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Požiadavka je v konflikte so stavom servera.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: pokus o prihlásenie cez Google alebo tiket je neznámy, už použitý alebo mu vypršala platnosť; začnite prihlásenie znova.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: telo presahuje `HTTP_BODY_LIMIT` (predvolene 16 384 bajtov). Server zatvorí spojenie.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: cieľ požiadavky presahuje 4096 znakov.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: telo nie je `application/json` alebo jeho znaková sada nie je UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: partia má viac ako `GIF_MAX_PLIES` (600) polťahov.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: vyriešte výzvu `pow` a pošlite rovnakú požiadavku znova s `pow: { challenge, nonce }`. `reason` uvádza dôvod: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` alebo `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (limit počtu požiadaviek, kvóta účtu alebo front na hashovanie hesiel) alebo `too_many_attempts` (obmedzenie na úrovni účtu), s `retryAfter` a hlavičkou `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Limit počtu požiadaviek
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Príliš veľa neúspechov na tomto účte
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: neočakávané zlyhanie. Server ho zapíše do logu.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: nesprávny `state` alebo `iss`, alebo Google odmietol kód či poslal ID token, ktorý neprejde overením (vrátane kódu alebo ID tokenu druhého klienta, hry alebo webovej stránky). Nikdy neobsahuje text od Googlu.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` alebo `timeout`: skúste to znova po `retryAfter`, ak je uvedené.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Server je zaneprázdnený
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Databáza zostala zamknutá (čítanie)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Server potreboval príliš veľa času
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Animovaný GIF ako príloha.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` pre partiu z tohto servera, `attachment; filename="scacelith-game.gif"` pre PGN poslané cez `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Veľkosť súboru v bajtoch.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: Stránka HTML.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: Stránka HTML, ktorá vysvetľuje odmietnutie.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Formulár nedorazil do 10 sekúnd (stránka HTML). Server zatvorí spojenie.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: Stránka HTML, ktorá vysvetľuje konflikt.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Formulár presahuje `HTTP_BODY_LIMIT` (stránka HTML). Server zatvorí spojenie.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Telo nie je formulár (`application/x-www-form-urlencoded`) ani JSON alebo jeho znaková sada nie je UTF-8 (stránka HTML).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Limit počtu požiadaviek (stránka HTML), s `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: 'Neočakávané zlyhanie: stránka HTML s nadpisom „Server error“ (chyba servera). Server ho zapíše do logu.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: 'Server je zaneprázdnený (databáza zostala zamknutá alebo server výrazne zaostáva; s `Retry-After`) alebo potreboval príliš veľa času: stránka HTML s nadpisom „Server error“ (chyba servera).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: Jediný tvar každej chybovej odpovede JSON API.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Chybový kód v tvare `snake_case`. Klient podľa neho volí, čo zobrazí.
          examples:
            - rate_limited
        message:
          type: string
          description: Anglická veta určená pre logy a ako záložný text.
        retryAfter:
          type: integer
          minimum: 1
          description: Počet sekúnd, ktoré treba počkať pred ďalším pokusom; prítomné iba pri odmietnutiach, ktoré časom pominú. Odpoveď potom nesie aj hlavičku `Retry-After` s rovnakou hodnotou, okrem 503 `busy` pri čítaní histórie, partií, hráčov a rebríčka.
        field:
          type: string
          description: Pole alebo parameter dopytu, v ktorom je chyba (`invalid_request`, `invalid_option` a `invalid_cursor`, `invalid_limit` a `invalid_filter` z `GET /account/games`). Vnorené pole sa zapisuje s bodkou (`pow.nonce`).
        reason:
          type: string
          description: 'Dôvod: pravidlo, ktoré `weak_password` porušuje, alebo prečo bol dôkaz práce vyžiadaný či odmietnutý (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Iba `banned`: koniec pozastavenia (ms od epochy Unixu), `null` pri trvalom pozastavení.'
        line:
          type: integer
          minimum: 1
          description: 'Iba `invalid_pgn`: riadok chyby, od 1.'
        column:
          type: integer
          minimum: 1
          description: 'Iba `invalid_pgn`: stĺpec chyby, od 1, v znakoch.'
    PowChallenge:
      type: object
      description: Výzva dôkazu práce (`pow` z odpovede 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Podpísaná výzva, ktorú treba poslať späť bez zmeny.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Počet úvodných nulových bitov, ktoré musí mať `SHA-256(challenge + ":" + nonce)`.
        expiresAt:
          type: integer
          format: int64
          description: Kedy výzva vyprší (ms od epochy Unixu), 2 minúty po vydaní.
    PowAnswer:
      type: object
      description: Odpoveď na výzvu dôkazu práce.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: '`challenge` z odpovede 428 bez zmeny.'
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Desiatkový reťazec s najviac 20 číslicami taký, že `SHA-256(challenge + ":" + nonce)` začína `bits` nulovými bitmi.
    ServerInfo:
      type: object
      description: Čo klient potrebuje pred prihlásením alebo pripojením.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Názov servera (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: UUID, ktoré databáza dostane pri prvom spustení. Pri reštartoch zostáva rovnaké. Je `null`, keď ho databáza nevie poskytnúť.
        motd:
          type: string
          description: Správa dňa (`SERVER_MOTD`), môže byť prázdna.
        protocol:
          type: object
          description: Protokol WebSocket (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Najstaršia verzia protokolu, ktorú server podporuje.
            max:
              type: integer
              minimum: 1
              description: Najnovšia verzia protokolu, ktorú server podporuje.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'Odtlačok schémy protokolu (prvé 4 bajty SHA-256 jej kanonickej podoby ako celé číslo bez znamienka: `0xc649140f`, 3326678031, pre vedľajšiu verziu protokolu 2); iba informatívny, nikdy sa neporovnáva.'
            subprotocol:
              type: string
              description: Token podprotokolu WebSocket (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: Port WebSocketu, ktorý používajú hráči (`PUBLIC_WS_PORT`, inak `WS_PORT`, inak `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: Cesta WebSocketu.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Či možno vytvárať nové účty.
        emailVerification:
          type: boolean
          description: Či nové účty potvrdzujú svoju adresu (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Či sa hre ponúka prihlásenie cez Google.
            googleWeb:
              type: boolean
              description: Či sa prihlásenie cez Google ponúka aj webovej stránke (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: Dvojfaktorové overenie je vždy k dispozícii.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Bity dôkazu práce, ktoré vyžaduje registrácia (0, ak sa dôkaz nevyžaduje).
        categories:
          type: array
          description: Oficiálne (hodnotené) tempá hry (`RATED_CATEGORIES`) v poradí servera. Každé iné tempo hry je `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Pravidlá, ktoré môže klient skontrolovať pred odoslaním formulára.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: Najkratšie používateľské meno (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: Najdlhšie používateľské meno (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Regulárny výraz, ktorému musí zodpovedať nové používateľské meno.
            passwordMinLength:
              type: integer
              description: Najkratšie heslo v znakoch (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Najdlhšie heslo v bajtoch UTF-8.
            customTimeControls:
              type: boolean
              description: Či výzvy a súkromné partie môžu používať vlastné tempá hry.
            reportsPerDay:
              type: integer
              description: Koľko nahlásení môže hráč podať za 24 hodín (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Najväčšia správa WebSocketu, ktorú môže klient poslať, v bajtoch.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Oficiálne tempo hry.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 'ID kategórie: minúty a prírastok v sekundách (`3+2`).'
        baseSec:
          type: number
          minimum: 0
          description: Základný čas v sekundách.
        incSec:
          type: number
          minimum: 0
          description: Prírastok na ťah v sekundách.
    AccountView:
      type: object
      description: Účet tak, ako ho vidí jeho hráč (`user` v odpovediach na prihlásenie a v `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: ID účtu.
        username:
          type: string
          description: Používateľské meno.
        email:
          type: string
          format: email
          description: E-mailová adresa.
        emailVerified:
          type: boolean
          description: Či je adresa potvrdená.
        mfaEnabled:
          type: boolean
          description: Či je dvojfaktorové overenie zapnuté.
        googleLinked:
          type: boolean
          description: Či je prepojený účet Google.
        hasPassword:
          type: boolean
          description: '`false` pri účte vytvorenom cez Google, ktorý si ešte nenastavil heslo.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Či sa prijímajú priame výzvy podľa mena (pozri `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Kedy bol účet vytvorený (ms od epochy Unixu).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Posledné prihlásenie (ms od epochy Unixu) alebo `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Nová adresa pri zmene e-mailu, ktorá čaká na potvrdenie odkazom, alebo `null`.
    SessionAnswer:
      type: object
      description: Nová relácia.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Token relácie pre hlavičku `Authorization` a WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: Absolútny koniec relácie (ms od epochy Unixu); limit nečinnosti ju môže ukončiť skôr.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Druhý krok prihlásenia s dvojfaktorovým overením; pokračujte cez `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Token kroku pre `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Zostávajúce sekundy na dokončenie kroku.
    LoginAnswer:
      description: Relácia alebo druhý krok prihlásenia s dvojfaktorovým overením.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Prvé prihlásenie cez Google; pokračujte cez `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Tiket pre `POST /auth/sso/complete`, platný 10 minút.
        suggestedUsername:
          type: string
          description: Používateľské meno vytvorené z mena v účte Google alebo z adresy, alebo `""`, keď nič nevyhovuje.
    SsoNeedsPassword:
      type: object
      description: Adresu používa účet s heslom; pokračujte cez `POST /auth/sso/google/link`. Zatiaľ nie je nič prepojené.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Tiket pre `POST /auth/sso/google/link`.
        username:
          type: string
          description: Používateľské meno tohto účtu (vidí ho iba ten, kto Googlu preukázal vlastníctvo adresy).
        expiresIn:
          type: integer
          const: 600
          description: Počet sekúnd, počas ktorých tiket zostáva platný.
    SsoFinishAnswer:
      description: Odpoveď `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Pokus o prihlásenie cez Google.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Pokus, pre `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: URL Google, ktorú treba po kontrole otvoriť v systémovom prehliadači.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state`, ktorý musí Google poslať späť.'
        expiresIn:
          type: integer
          const: 600
          description: Počet sekúnd, počas ktorých pokus zostáva platný.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Používateľské meno; ďalej platia pravidlá servera (pozri popis).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: E-mailová adresa. Odstránia sa z nej medzery na začiatku a na konci a uloží sa malými písmenami.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Heslo; ďalej platia pravidlá pre heslá.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Používateľské meno alebo e-mailová adresa (akýkoľvek text so `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Nepovinné. Zobrazuje sa v zozname prihlásených zariadení (napríklad `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: '`mfaToken` z odpovede na prihlásenie (alebo na prihlásenie cez Google).'
        code:
          type: string
          maxLength: 32
          description: Nepovinné. 6-ciferný kód z overovacej aplikácie alebo kód na obnovenie.
        recoveryCode:
          type: string
          maxLength: 32
          description: Nepovinné. Kód na obnovenie. Vyžaduje sa jedno z `code` alebo `recoveryCode`.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: E-mailová adresa.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Parameter `token` z odkazu na resetovanie hesla.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Nové heslo; platia pravidlá pre heslá ako pri registrácii.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Výzva PKCE S256 z `codeVerifier` klienta (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Port poslucháča klienta na `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Výzva PKCE S256 z `codeVerifier` stránky (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`attemptId` z `POST /auth/sso/google/start`.'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: Verifikátor PKCE; jeho SHA-256 musí zodpovedať výzve poslanej do `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state` tak, ako ho Google poslal späť.'
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: '`code` tak, ako ho Google poslal späť (tlačiteľné znaky ASCII bez medzier).'
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Nepovinné. `iss` tak, ako ho Google poslal späť, ak ho poslal.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`linkTicket` z `finish`, platný 10 minút.'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Heslo účtu.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`ssoTicket` z `finish`, platný 10 minút.'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Používateľské meno; platia pravidlá registrácie.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Aktívne relácie, zoradené od naposledy použitej.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Aktívna relácia (prihlásené zariadenie).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: ID relácie pre `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: Prihlásenie (ms od epochy Unixu).
        lastSeenAt:
          type: integer
          format: int64
          description: Posledné použitie (ms od epochy Unixu), aktualizované najviac raz za 5 minút (neskôr, kým server výrazne zaostáva).
        expiresAt:
          type: integer
          format: int64
          description: Absolútny koniec (ms od epochy Unixu); limit nečinnosti môže reláciu ukončiť skôr.
        clientLabel:
          type:
            - string
            - 'null'
          description: '`clientLabel` z prihlásenia alebo `null`, ak ho prihlásenie neposlalo.'
        current:
          type: boolean
          description: Či ide o reláciu, ktorá posiela požiadavku.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Jeden záznam pre každú kategóriu, v ktorej hráč hral hodnotené partie.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Aktívne sankcie.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }` počas pozastavenia účtu, inak `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Záznam ratingu jednej kategórie.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: ID kategórie.
        rating:
          type: integer
          description: Rating.
        games:
          type: integer
          minimum: 0
          description: Partie odohrané v kategórii (započítané aj nezapočítané).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Najvyšší dosiahnutý rating.
        provisional:
          type: boolean
          description: '`true`, kým rating ešte nie je stanovený (fáza bez ratingu) alebo má menej ako `PROVISIONAL_GAMES` započítaných partií (hra ho zobrazuje ako `1510?`).'
    ActiveSanction:
      type: object
