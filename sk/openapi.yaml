          description: '`password_not_set` (účet len s prihlásením cez Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (neúspešné opätovné autentifikácie alebo príliš veľa vyskúšaných kódov na tomto účte) alebo `rate_limited` (limit `reauth` alebo `reauth_user`, kvóta účtu, front na hashovanie hesiel).'
        '500':
          $ref: '#/components/responses/InternalError'
