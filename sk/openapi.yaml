        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Farba hráča.
    HistoryGameSummary:
      description: Partia z histórie prihláseného hráča.
