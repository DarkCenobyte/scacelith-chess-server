      Dostupnosť a pripravenosť servera na účely monitorovania. Tieto endpointy odpovedajú na porte API ešte pred autentifikáciou a pred všetkými limitmi endpointov, ale ako každá požiadavka vezmú jeden žetón vrstvy podľa adresy; monitorovací hostiteľ môže byť uvedený v `ABUSE_EXEMPT`. Pre každý endpoint fungujú obe cesty: v koreni servera aj pod `/api/v1`.

