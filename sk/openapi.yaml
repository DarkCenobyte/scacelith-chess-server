      summary: Nahradiť kódy na obnovenie
      description: |-
        Nahradí kódy na obnovenie 10 novými; staré prestanú fungovať.

        **Opätovná autentifikácia:** heslo a kód z overovacej aplikácie v `code` (kód na obnovenie sa odmietne s 403 `invalid_code`). **Limity:** `reauth`, potom `reauth_user`.
      security:
