          description: Linkul este nevalid (și când a fost trimis la o adresă pe care contul nu o mai are).
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Limita `page` (o pagină HTML) sau nivelul per adresă (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
    post:
      operationId: submitResetPasswordPage
      tags:
        - pages
      summary: Setarea unei parole noi din formularul de resetare
      description: |-
        Formularul paginii de resetare; face ce face `POST /auth/password/reset`, într-o singură tranzacție: toate dispozitivele sunt deconectate, o schimbare de e-mail în așteptare este anulată, celelalte linkuri de resetare nu mai funcționează, adresa este considerată confirmată, iar titularul primește un e-mail.

        Se verifică mai întâi linkul, apoi faptul că cele două parole sunt identice, apoi regulile parolei. Când serverul este ocupat, formularul revine cu `Retry-After`, iar linkul rămâne valabil.

        **Limite:** `auth`, apoi `auth_reset` (partajată cu `POST /auth/password/reset`).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Parola este schimbată, iar toate dispozitivele sunt deconectate.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Din nou formularul, cu eroarea (parolele diferă, parolă slabă), linkul este nevalid sau formularul este nevalid (o pagină HTML).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Limita `auth` sau `auth_reset` (o pagină HTML), din nou formularul cu `Retry-After` când acest client are prea multe hash-uri de parolă în așteptare (linkul rămâne valabil) sau nivelul per adresă (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'Din nou formularul, cu `Retry-After`, când serverul este ocupat (coada de hashing a parolelor sau baza de date a rămas blocată); linkul rămâne valabil. Când serverul a rămas mult în urmă (vezi introducerea), în schimb o pagină „Server error” (eroare de server) cu `Retry-After` (între 2 și 5): nu s-a executat nimic, iar linkul rămâne valabil. De asemenea, la depășirea timpului maxim de procesare.'
