      summary: Verificarea faptului că procesul rulează
      description: |-
        Răspunde 200 `ok` cât timp procesul rulează. Funcționează și `HEAD`. Orice altă metodă primește răspunsul 405 `method_not_allowed` cu `Allow: GET, HEAD` (inclusiv `OPTIONS`).

        **Limite:** numai nivelul per adresă.
      security: []
