paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Obținerea numelui, versiunilor, porturilor și regulilor de înregistrare ale serverului
      description: |-
        Ce îi trebuie unui client înainte de a se autentifica sau de a se conecta: numele și id-ul serverului, versiunile protocolului WebSocket și locul unde se află WebSocket-ul, regulile de înregistrare, ritmurile de joc oficiale și limitele pe care un client le poate verifica înainte de a trimite un formular.

        **Limite:** doar nivelul per adresă.
      security: []
      responses:
        '200':
          description: Descrierea serverului.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: nivelul per adresă.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Crearea unui cont
      description: |-
        Creează un cont: după ce adresa sa de e-mail este confirmată prin linkul trimis la ea sau imediat, fără confirmarea adresei de e-mail.

        **Cu confirmarea adresei de e-mail** (`REQUIRE_EMAIL_VERIFICATION`, valoarea implicită): 202 `verification_sent`. Încă nu există niciun cont: înregistrarea așteaptă 24 de ore și între timp își rezervă numele de utilizator. La adresă se trimite un link valabil în aceste 24 de ore, cel mult unul per adresă la fiecare 5 minute (`POST /auth/verify-email/resend` trimite unul nou); contul este creat, cu adresa confirmată, când linkul este folosit (butonul paginii `/verify-email`), iar jucătorul se poate autentifica apoi. Până atunci, o autentificare cu acel nume de utilizator primește răspunsul `invalid_credentials`, ca pentru un cont necunoscut, iar profilul public nu există. O nouă înregistrare cu aceeași adresă o înlocuiește pe cea în așteptare. Răspunsul este același când un alt cont folosește deja adresa: atunci nu se trimite niciun link, proprietarul adresei primește în schimb o notificare (cel mult una pe oră), iar numele de utilizator este rezervat la fel, astfel încât nimic nu spune dacă adresa are un cont. O înregistrare al cărei link nu a fost folosit este eliminată după 24 de ore, iar numele său de utilizator devine din nou liber.

        **Fără confirmarea adresei de e-mail** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, contul este creat imediat și se poate autentifica.

        **Reguli.** `username`: între `USERNAME_MIN` și `USERNAME_MAX` caractere (de la 3 la 20), litere, cifre, `_` și `-`, începând cu o literă sau o cifră (`GET /info` le indică în `limits`); numele rezervate (`admin`, `moderator`, `deleted`…) și unele prefixe sunt refuzate; unic, fără a ține cont de literele mari sau mici. `email`: fără spațiile de la capete și stocat cu litere mici, ASCII simplu, cu un domeniu care conține un punct. `password`: cel puțin `PASSWORD_MIN_LENGTH` (10) caractere și cel mult 256 de octeți UTF-8; nu trebuie să conțină numele de utilizator sau partea locală a adresei de e-mail și nu trebuie să fie o parolă comună.

        **Erori**, verificate în această ordine: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; erorile cozii de hashing a parolelor; 409 `email_taken` (doar fără confirmarea adresei de e-mail).

        **Limite:** `auth`, apoi `auth_register` (10 înregistrări pe oră per client). **Dovadă de lucru:** întotdeauna, când `POW_REGISTER_BITS` este peste 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Prima încercare, fără dovadă de lucru
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Trimisă din nou cu dovada de lucru
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Contul este creat și se poate autentifica (fără confirmarea adresei de e-mail pe acest server).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Înregistrarea își așteaptă linkul de confirmare (sau adresa are deja un cont; răspunsul nu spune acest lucru).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (cu `field`), `invalid_json`, `invalid_username`, `invalid_email` sau `weak_password` cu `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` sau `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: înregistrarea este închisă pe acest server (`GET /info` indică `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: un cont are acest nume de utilizator sau îl rezervă o înregistrare în așteptare a altei adrese. `email_taken`: un alt cont folosește adresa (doar fără confirmarea adresei de e-mail).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limita `auth` sau `auth_register` ori coada de hashing a parolelor.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (coada de hashing a parolelor sau baza de date a rămas blocată), `timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Autentificarea cu parolă
      description: |-
        Efectuează autentificarea cu un nume de utilizator sau o adresă de e-mail și o parolă. Există două răspunsuri posibile, ambele cu codul 200: o sesiune sau, când autentificarea în doi pași este activată, un al doilea pas de finalizat în 5 minute cu `POST /auth/login/mfa`.

        Un cont necunoscut, o parolă greșită și un cont fără parolă primesc același răspuns, după același timp: 401 `invalid_credentials`. Verificările contului (`banned`, `email_unverified`) au loc doar după o parolă corectă. De la `AUTH_FAILURES_PER_ACCOUNT` (5) eșecuri pentru același identificator, fiecare încercare trebuie să aștepte (429 `too_many_attempts`).

        **Limită:** `auth`. **Dovadă de lucru:** doar în timpul unui val de autentificări eșuate (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: O sesiune sau al doilea pas al unei autentificări în doi pași.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Autentificare reușită
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Autentificarea în doi pași este activată
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: cont necunoscut, parolă greșită sau cont fără parolă.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Doar după o parolă corectă: `banned`, cu `until` (ms de la epoca Unix, `null` pentru o suspendare permanentă), sau `email_unverified` (un cont mai vechi a cărui adresă nu este încă confirmată).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (timpul de așteptare după eșecuri al acestui identificator) sau `rate_limited` (limita `auth`, coada de hashing a parolelor).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (coada de hashing a parolelor sau baza de date a rămas blocată), `timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Finalizarea unei autentificări cu al doilea factor
      description: |-
        Al doilea pas al unei autentificări în doi pași, după ce `POST /auth/login` sau o autentificare cu Google (`POST /auth/sso/google/finish` ori `POST /auth/sso/google/link`) a răspuns `mfaRequired`. Trimiteți `code` (un cod de 6 cifre din aplicația de autentificare sau un cod de recuperare) ori `recoveryCode`. Un cod de recuperare folosit aici dispare.

        Un pas acceptă cel mult 5 coduri greșite; pasul se încheie și când parola este resetată sau schimbată. După pasul parolei al unei asocieri Google, asocierea este stocată doar când codul trece aici.

        **Limite:** `auth` și cel mult `AUTH_MFA_PER_ACCOUNT` (10) coduri la 15 minute pentru cont, de la orice adresă; peste această limită, codul nu este verificat, astfel încât un cod de recuperare nu este consumat.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Un cod din aplicația de autentificare
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Un cod de recuperare
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Autentificare reușită.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: nu s-a trimis nici `code`, nici `recoveryCode` sau corpul încalcă schema; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: pasul a expirat, a fost folosit sau s-a încheiat după 5 coduri greșite ori parola a fost resetată sau schimbată de la primul pas (autentificați-vă din nou). `invalid_code`: un cod greșit sau deja folosit.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (cu `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: doar după pasul parolei al unei asocieri Google, contul Google a fost asociat între timp cu un alt cont.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: doar după pasul parolei al unei asocieri Google, contul s-a schimbat între timp; reîncepeți autentificarea.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: timpul de așteptare al contului după eșecuri sau cele `AUTH_MFA_PER_ACCOUNT` coduri ale sale din ultimele 15 minute au fost epuizate. `rate_limited`: limita `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` cu `retryAfter: 1`: baza de date a rămas blocată (după un pas de asociere Google, nu s-a asociat nimic: reîncepeți autentificarea). `timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
  /auth/logout:
    post:
      operationId: logOut
