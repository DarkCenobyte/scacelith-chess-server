        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (reautentificări eșuate ale contului) sau `rate_limited` (limita `reauth` sau `reauth_user`, bugetul contului, coada de hashing a parolelor).'
        '500':
