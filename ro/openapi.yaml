          description: 'Baza de date a rămas blocată (`Retry-After: 1`) sau serverul a rămas mult în urmă (`Retry-After` între 2 și 5, vezi introducerea): nu s-a schimbat nimic, iar linkul încă funcționează. De asemenea, la depășirea timpului maxim de procesare.'
  /healthz:
