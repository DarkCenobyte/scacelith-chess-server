                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: Noua adresă, așa cum a fost salvată.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: Un link de confirmare a fost trimis la noua adresă (sau adresa aparține altui cont; răspunsul nu spune acest lucru).
