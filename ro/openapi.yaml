      summary: Obținerea profilului public al unui jucător
      description: |-
        Profilul public al unui jucător: ratingurile în categoriile oficiale (în ordinea serverului) și numărul de partide. `games.total` numără toate partidele salvate, inclusiv cele amicale și cele anulate; `games.rated`, `wins`, `draws` și `losses` sunt însumate pe fișele de rating, deci numai partidele cu rating. Răspunsul este același cu sau fără token.

        **Limită:** `public_read` (per jucător cu token, per client fără).
      security:
