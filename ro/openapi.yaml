    get:
      operationId: getReadiness
      tags:
        - health
      summary: Verificarea faptului că serverul acceptă jucători
      description: |-
        Răspunde 200 `ready` când serverul acceptă jucători și 503 `not_ready` cât timp pornește sau se oprește. Funcționează și `HEAD`. Orice altă metodă primește răspunsul 405 `method_not_allowed` cu `Allow: GET, HEAD` (inclusiv `OPTIONS`).

        **Limite:** numai nivelul per adresă.
      security: []
      responses:
        '200':
          description: Serverul acceptă jucători.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
