          description: '`server_busy` (coada de hashing a parolelor sau baza de date a rămas blocată), `timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Listarea partidelor jucătorului, filtrate și paginate
      description: |-
        Partidele jucătorului autentificat, cele mai noi primele, filtrate și paginate, cu numărul de partide care corespund filtrului. Fiecare parametru de interogare este opțional, iar o valoare goală contează ca absentă.

        Paginare: transmiteți `next` al paginii anterioare ca `before`; `next` este `null` pe ultima pagină. `total` numără partidele care corespund filtrului, pe toate paginile.

        **Limită:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: Un id de categorie oficială (`3+2` sau `3%2B2`) ori `custom` pentru orice partidă cu alt ritm de joc.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Numai partidele cu rating (`true`) sau amicale (`false`).
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Numai partidele câștigate, pierdute sau încheiate cu remiză, din perspectiva jucătorului. Partidele anulate apar numai fără acest filtru.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: O pagină a istoricului.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` nu este un id de partidă), `invalid_limit` sau `invalid_filter` (`category`, `rated` ori `result`), fiecare cu `field` care numește parametrul.'
        '401':
