  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Descărcarea unei partide ca fișier PGN
      description: |-
        Aceeași partidă ca fișier PGN: o singură partidă, cu sfârșituri de linie `\n`, iar textul mutărilor în linii sub 80 de coloane. Răspunsul este același cu sau fără token.

        Taguri, în această ordine: `Event` (`<SERVER_NAME> rated <category>` sau `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (data de început, UTC), `Round`, `White`, `Black`, `Result` (`*` pentru o partidă anulată), `UTCDate` și `UTCTime` (începutul), `WhiteElo` și `BlackElo` (ratingurile la început sau `-`), `WhiteRatingDiff` și `BlackRatingDiff` (variațiile, de exemplu `+10` și `-10`, în fiecare partidă cu rating, `+0` când regulile de rating lasă ratingul neschimbat; o partidă amicală, personalizată sau anulată nu are niciunul dintre ele), `TimeControl` (în secunde), `Termination` (o valoare standard PGN: `normal`; `time forfeit`, expirarea timpului pe ceas, chiar și când partida se termină cu remiză; `abandoned`; `rules infraction`, o a doua mutare ilegală sau o pierdere din motive de fair-play; `unterminated`, o partidă anulată), `PlyCount`, `ScacelithGameId` (id-ul zecimal).

        Fiecare mutare poartă `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: ceasul celui care a mutat, după mutare, și timpul socotit pentru ea, în zecimi de secundă (trunchiat). O valoare este omisă când înregistrarea nu o are. După ultima mutare urmează motivul încheierii, în cuvinte, apoi rezultatul.

        **Limită:** `public_read` (per jucător cu token, per client fără).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Fișierul PGN.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'Textul PGN, în UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: nu este un număr întreg pozitiv de cel mult 16 cifre (sub 2^53); `invalid_request`: codificare URL nevalidă.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: a fost trimis un token și nu este valid.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: partida nu există.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limita `public_read` sau bugetul contului.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: printre altele, mutările salvate nu pot fi rejucate până la finalul salvat (serverul înregistrează eroarea în jurnal).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (baza de date a rămas blocată; `retryAfter: 1` în corp, fără antet `Retry-After`), `server_busy` (căutarea sesiunii a găsit baza de date blocată), `timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Descărcarea unei partide de pe acest server ca GIF animat
      description: |-
        Partida ca GIF animat. Numele și ratingurile sunt cele din înregistrarea partidei (ratingurile la început, un cont șters ca `deleted#<id>`), la fel ca rezultatul și modul de încheiere (`Resignation`, `Loss on time`…).

        Verificările se fac în această ordine: `gif_disabled`, opțiunile imaginii (`size`, `orientation`, `delay`, `coords`), id-ul partidei, partida, lungimea ei.

        **Sesiune obligatorie:** cotele se numără per cont. **Limite:** `gif` la fiecare cerere; `gif_user_min`, `gif_user_hour`, `gif_ip_min` și `gif_ip_hour` numai când GIF-ul trebuie generat (vezi descrierea secțiunii). **Timp maxim:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 secunde (implicit 45 de secunde).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 'Dimensiunea imaginii: `small` (câmpuri de 32 px), `medium` (48 px) sau `large` (72 px).'
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Partea aflată în josul tablei.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Milisecunde per mutare (de la 1 la 6 cifre zecimale).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Dacă literele coloanelor și numerele liniilor sunt desenate în jurul tablei (`1`) sau nu (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` cu `field` (`size`, `orientation`, `delay` sau `coords`): o valoare în afara celor permise. `invalid_game_id`. `invalid_request`: codificare URL nevalidă.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: partida nu există. `gif_disabled`: serverul a dezactivat GIF-urile (`GIF_ENABLED=false`; jetonul `gif` este restituit).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limita `gif`, o limită de randare sau bugetul contului.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF-ul nu a putut fi generat (serverul înregistrează motivul în jurnal). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` cu `retryAfter` (între 3 și 10 secunde) și `Retry-After`: coada de randare este plină sau GIF-ul a așteptat `GIF_QUEUE_TIMEOUT_MS` (10 secunde) un fir de execuție liber; toate jetoanele de limită consumate de cerere sunt restituite. `busy`: baza de date a rămas blocată (`retryAfter: 1` numai în corp). `timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Generarea unui GIF animat pentru orice partidă trimisă ca PGN
      description: |-
        Aceeași imagine ca `GET /games/{id}/gif`, pentru orice partidă trimisă ca text PGN: o partidă salvată de joc, un export de pe alt site, o partidă tastată de mână. Se folosește numai prima partidă din text.

        - Cititorul PGN acceptă ce acceptă și cititorul jocului: orice PGN scris de acest server și exporturile obișnuite ale altor site-uri (comentariile, variantele, NAG-urile și adnotările de ceas sunt ignorate; numerele mutărilor și SAN sunt citite cu toleranță; un tag `FEN` dă poziția de start, cu excepția cazului în care `SetUp` este `"0"`).
        - Numele și ratingurile provin din tagurile `White`, `Black`, `WhiteElo` și `BlackElo`. Literele accentuate își pierd accentele, celelalte caractere din afara ASCII imprimabil devin `?`, iar numele lungi sunt trunchiate (48 de caractere). Rezultatul provine din tagul `Result`, altfel din finalul textului mutărilor. Tagul `Termination` este afișat, cu excepția cazului în care este `normal`: atunci poziția finală spune povestea (mat, pat).
        - Acest endpoint își verifică singur corpul: un câmp necunoscut sau un `pgn` lipsă ori care nu este șir de caractere primește răspunsul 400 `invalid_request` cu `field`; o opțiune greșită primește răspunsul 400 `invalid_option` (`delayMs` trebuie să fie un număr JSON, `coords` un boolean; `null` este refuzat).

        **Sesiune obligatorie:** cotele se numără per cont. **Limite:** ca pentru `GET /games/{id}/gif`. **Dimensiune maximă a corpului:** 135.168 de octeți, indiferent de `HTTP_BODY_LIMIT` (PGN-ul ca șir JSON, inclusiv secvențele de escape). **Timp maxim:** implicit 45 de secunde.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: O partidă scurtă tastată, fără coordonate
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: Un fișier PGN cu toate opțiunile
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` cu `field` (un câmp necunoscut sau `pgn` lipsă ori care nu este șir de caractere; fără `field` când corpul nu este un obiect); `invalid_json`; `invalid_option` cu `field` (`size`, `orientation`, `delayMs` sau `coords`); `invalid_pgn` cu `line` și `column` (de la 1, coloanele în caractere) și `message` al cititorului: o mutare ilegală sau ambiguă, un tag deteriorat, o variantă de șah necunoscută, mai mult de 65.536 de octeți.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: serverul a dezactivat GIF-urile (`GIF_ENABLED=false`; jetonul `gif` este restituit).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: un corp de peste 135.168 de octeți.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limita `gif`, o limită de randare sau bugetul contului.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF-ul nu a putut fi generat (serverul înregistrează motivul în jurnal). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` cu `retryAfter` (între 3 și 10 secunde) și `Retry-After`: coada de randare este plină sau GIF-ul a așteptat prea mult un fir de execuție liber; toate jetoanele de limită consumate de cerere sunt restituite. `timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
  /players/{username}:
    get:
      operationId: getPlayer
      tags:
