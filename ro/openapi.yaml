      tags:
        - account
      summary: Schimbarea parolei
      description: |-
        Schimbă parola. Este necesară parola curentă, dar nu și un al doilea factor, nici măcar cu autentificarea în doi pași activată. Parola nouă respectă regulile înregistrării (verificate după parola curentă).

        Schimbarea are aceste efecte, într-o singură tranzacție (toate sau niciunul): revocă toate celelalte sesiuni (aceasta rămâne conectată), anulează o schimbare de e-mail în așteptare, face ca linkurile de resetare a parolei ale contului să nu mai funcționeze și îi trimite titularului un e-mail.

        **Reautentificare:** numai parola. **Limite:** `reauth`, apoi `reauth_user`.
