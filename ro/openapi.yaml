          description: '`rate_limited`: nivelul per adresă.'
        '503':
          description: Serverul pornește sau se oprește.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Un token de sesiune (`sct_` urmat de 43 de caractere base64url) dintr-un răspuns de autentificare, în antetul `Authorization`: `Authorization: Bearer <token>`. Prefixul este exact `Bearer` (sensibil la majuscule) și un spațiu; o valoare care nu îl are sau un token care nu are între 1 și 512 caractere ASCII imprimabile primește răspunsul 401 `invalid_token`, ca orice alt token nevalid. Un antet gol contează ca lipsa antetului.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: Id-ul partidei, un număr întreg zecimal pozitiv de cel mult 16 cifre, fără zerouri la început, sub 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: Id-ul sesiunii, așa cum îl dă `GET /auth/sessions`, scris fără zerouri la început (`03` nu este sesiunea 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Numele de utilizator al jucătorului, fără a ține cont de majuscule. Serverul acceptă orice nume de 2 până la 24 de caractere din `[A-Za-z0-9_.-]` (cea mai largă regulă pe care a permis-o vreodată).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Un id de partidă; sunt listate numai partidele mai vechi. Transmiteți `next` al paginii anterioare. O valoare goală contează ca absentă.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Dimensiunea paginii, de la 1 la 50. Un număr mai mare, de cel mult 3 cifre, contează ca 50; o valoare goală contează ca absentă.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: Tokenul linkului din e-mail (43 de caractere base64url). Un token lipsă sau greșit afișează pagina „link invalid or expired” (link nevalid sau expirat).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Fiecare răspuns al serverului interzice stocarea în cache.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Numărul de secunde de așteptat înainte de a încerca din nou; aceeași valoare ca `retryAfter` din corp.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Challenge-ul Bearer, cu `error="invalid_token"` pentru un token nevalid.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Serverul închide conexiunea după acest răspuns.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (cu `field` când un câmp al corpului este de vină) sau `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Un câmp încalcă schema
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Corpul nu este JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: O parolă slabă
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: Un PGN care nu poate fi citit
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (fără antet `Authorization`) sau `invalid_token` (tokenul este malformat, expirat, revocat sau aparține unui cont șters).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Nicio sesiune
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Un token nevalid
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Cererea este refuzată.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: O parolă greșită la reautentificare
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Un cont suspendat
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found` sau o funcție pe care acest server a dezactivat-o.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: corpul nu a sosit în 10 secunde. Serverul închide conexiunea.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Cererea intră în conflict cu starea serverului.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: tichetul sau încercarea de autentificare cu Google este necunoscută, folosită ori expirată; reîncepeți autentificarea.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: corpul depășește `HTTP_BODY_LIMIT` (implicit 16.384 de octeți). Serverul închide conexiunea.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: ținta cererii depășește 4096 de caractere.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: corpul nu este `application/json` sau setul său de caractere nu este UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: partida are mai multe semimutări decât `GIF_MAX_PLIES` (600).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: rezolvați challenge-ul `pow` și trimiteți din nou aceeași cerere cu `pow: { challenge, nonce }`. `reason` spune de ce: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` sau `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (o limită de frecvență, bugetul contului sau coada de hashing a parolelor) ori `too_many_attempts` (o restricție a contului), cu `retryAfter` și un antet `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: O limită de frecvență
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Prea multe eșecuri pe acest cont
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: o eroare neașteptată. Serverul o înregistrează în jurnal.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: un `state` sau un `iss` greșit ori Google a refuzat codul sau a trimis un ID token care nu trece verificarea (inclusiv un cod sau un ID token al celuilalt client, al jocului ori al site-ului web). Nu conține niciodată textul Google.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` sau `timeout`: încercați din nou după `retryAfter`, când este indicat.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Serverul este ocupat
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Baza de date a rămas blocată (o citire)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Serverul a avut nevoie de prea mult timp
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: GIF-ul animat, ca atașament.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` pentru o partidă de pe acest server, `attachment; filename="scacelith-game.gif"` pentru un PGN trimis cu `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Dimensiunea fișierului, în octeți.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: O pagină HTML.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: O pagină HTML care explică refuzul.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Formularul nu a sosit în 10 secunde (o pagină HTML). Serverul închide conexiunea.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: O pagină HTML care explică conflictul.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Formularul depășește `HTTP_BODY_LIMIT` (o pagină HTML). Serverul închide conexiunea.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Corpul nu este nici formular (`application/x-www-form-urlencoded`), nici JSON ori setul său de caractere nu este UTF-8 (o pagină HTML).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: O limită de frecvență (o pagină HTML), cu `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: O eroare neașteptată (o pagină HTML intitulată „Server error”, eroare de server). Serverul o înregistrează în jurnal.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Serverul este ocupat (baza de date a rămas blocată sau serverul a rămas mult în urmă; cu `Retry-After`) ori a avut nevoie de prea mult timp (o pagină HTML intitulată „Server error”, eroare de server).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: Forma unică a oricărui răspuns de eroare al API-ului JSON.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Codul de eroare `snake_case`. Pe baza lui, clientul alege ce afișează.
          examples:
            - rate_limited
        message:
          type: string
          description: O propoziție în engleză, destinată jurnalelor și folosită ca soluție de rezervă.
        retryAfter:
          type: integer
          minimum: 1
          description: Numărul de secunde de așteptat înainte de a încerca din nou; prezent numai la refuzurile care expiră cu timpul. Atunci răspunsul poartă și un antet `Retry-After` cu aceeași valoare, cu excepția răspunsului 503 `busy` al citirilor de istoric, partide, jucători și clasament.
        field:
          type: string
          description: Câmpul sau parametrul de interogare de vină (`invalid_request`, `invalid_option`, precum și `invalid_cursor`, `invalid_limit` și `invalid_filter` din `GET /account/games`). Un câmp imbricat este scris cu puncte (`pow.nonce`).
        reason:
          type: string
          description: 'Motivul: regula pe care o încalcă un `weak_password` sau de ce a fost cerută ori refuzată o dovadă de lucru (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Numai `banned`: sfârșitul suspendării (ms de la epoca Unix), `null` pentru o suspendare permanentă.'
        line:
          type: integer
          minimum: 1
          description: 'Numai `invalid_pgn`: linia erorii, de la 1.'
        column:
          type: integer
          minimum: 1
          description: 'Numai `invalid_pgn`: coloana erorii, de la 1, în caractere.'
    PowChallenge:
      type: object
      description: Un challenge de dovadă de lucru (`pow` dintr-un răspuns 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Challenge-ul semnat, de trimis înapoi neschimbat.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Numărul de biți zero inițiali pe care trebuie să-i aibă `SHA-256(challenge + ":" + nonce)`.
        expiresAt:
          type: integer
          format: int64
          description: Momentul în care expiră challenge-ul (ms de la epoca Unix), la 2 minute după emitere.
    PowAnswer:
      type: object
      description: Răspunsul la un challenge de dovadă de lucru.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: '`challenge` din răspunsul 428, așa cum a fost dat.'
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Un șir zecimal de cel mult 20 de cifre, astfel încât `SHA-256(challenge + ":" + nonce)` să înceapă cu `bits` biți zero.
    ServerInfo:
      type: object
      description: Ce îi trebuie unui client înainte de a se autentifica sau de a se conecta.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Numele serverului (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: Un UUID pe care baza de date îl primește la prima pornire. Rămâne același de la o repornire la alta. Este `null` când baza de date nu îl poate furniza.
        motd:
          type: string
          description: Mesajul zilei (`SERVER_MOTD`), eventual gol.
        protocol:
          type: object
          description: Protocolul WebSocket (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Cea mai veche versiune de protocol pe care o înțelege serverul.
            max:
              type: integer
              minimum: 1
              description: Cea mai nouă versiune de protocol pe care o înțelege serverul.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'Amprenta schemei protocolului (primii 4 octeți ai hash-ului SHA-256 al formei sale canonice, ca întreg fără semn: `0xc649140f`, 3326678031, pentru versiunea minoră 2 a protocolului); informativă, nu este comparată niciodată.'
            subprotocol:
              type: string
              description: Tokenul subprotocolului WebSocket (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: Portul WebSocket folosit de jucători (`PUBLIC_WS_PORT`, altfel `WS_PORT`, altfel `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: Calea WebSocket-ului.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Dacă se pot crea conturi noi.
        emailVerification:
          type: boolean
          description: Dacă conturile noi își confirmă adresa (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Dacă autentificarea cu Google este oferită jocului.
            googleWeb:
              type: boolean
              description: Dacă autentificarea cu Google este oferită și unui site web (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: Autentificarea în doi pași este întotdeauna disponibilă.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Biții de dovadă de lucru ceruți la înregistrare (0 dacă nu se cere).
        categories:
          type: array
          description: Ritmurile de joc oficiale, cu rating (`RATED_CATEGORIES`), în ordinea serverului. Orice alt ritm de joc este `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Regulile pe care un client le poate verifica înainte de a trimite un formular.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: Lungimea minimă a numelui de utilizator (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: Lungimea maximă a numelui de utilizator (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Expresia regulată căreia trebuie să-i corespundă un nume de utilizator nou.
            passwordMinLength:
              type: integer
              description: Lungimea minimă a parolei, în caractere (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Lungimea maximă a parolei, în octeți UTF-8.
            customTimeControls:
              type: boolean
              description: Dacă provocările și partidele private pot folosi ritmuri de joc personalizate.
            reportsPerDay:
              type: integer
              description: Câte rapoarte poate trimite un jucător în 24 de ore (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Dimensiunea maximă a unui mesaj WebSocket pe care îl poate trimite un client, în octeți.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Un ritm de joc oficial.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 'Id-ul categoriei: minutele și secundele de increment (`3+2`).'
        baseSec:
          type: number
          minimum: 0
          description: Timpul de bază, în secunde.
        incSec:
          type: number
          minimum: 0
          description: Incrementul per mutare, în secunde.
    AccountView:
      type: object
      description: Contul așa cum îl vede jucătorul său (`user` din răspunsurile de autentificare și din `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: Id-ul contului.
        username:
          type: string
          description: Numele de utilizator.
        email:
          type: string
          format: email
          description: Adresa de e-mail.
        emailVerified:
          type: boolean
          description: Dacă adresa este confirmată.
        mfaEnabled:
          type: boolean
          description: Dacă autentificarea în doi pași este activată.
        googleLinked:
          type: boolean
          description: Dacă este asociat un cont Google.
        hasPassword:
          type: boolean
          description: '`false` pentru un cont creat prin Google care nu și-a setat încă o parolă.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Dacă sunt acceptate provocările directe după nume (vezi `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Momentul creării contului (ms de la epoca Unix).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Ultima autentificare (ms de la epoca Unix) sau `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Noua adresă a unei schimbări de e-mail aflate în așteptarea linkului sau `null`.
    SessionAnswer:
      type: object
      description: O sesiune nouă.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Tokenul de sesiune, pentru antetul `Authorization` și pentru WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: Sfârșitul absolut al sesiunii (ms de la epoca Unix); limita de inactivitate o poate încheia mai devreme.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Al doilea pas al unei autentificări când autentificarea în doi pași este activată; continuați cu `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Tokenul pasului, pentru `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Secundele rămase pentru finalizarea pasului.
    LoginAnswer:
      description: O sesiune sau al doilea pas al unei autentificări când autentificarea în doi pași este activată.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: O primă autentificare cu Google; continuați cu `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Tichetul pentru `POST /auth/sso/complete`, valabil 10 minute.
        suggestedUsername:
          type: string
          description: Un nume de utilizator format din numele Google sau din adresă ori `""` când nimic nu se potrivește.
    SsoNeedsPassword:
      type: object
      description: Un cont cu parolă folosește adresa; continuați cu `POST /auth/sso/google/link`. Încă nu s-a asociat nimic.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Tichetul pentru `POST /auth/sso/google/link`.
        username:
          type: string
          description: Numele de utilizator al acelui cont (îl vede doar cineva care a dovedit în fața Google că deține adresa).
        expiresIn:
          type: integer
          const: 600
          description: Numărul de secunde cât tichetul rămâne valabil.
    SsoFinishAnswer:
      description: Răspunsul lui `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: O încercare de autentificare cu Google.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Încercarea, pentru `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: URL-ul Google de deschis în browserul sistemului, după verificare.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state` pe care Google trebuie să-l trimită înapoi.'
        expiresIn:
          type: integer
          const: 600
          description: Numărul de secunde cât încercarea rămâne valabilă.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Numele de utilizator; se aplică apoi regulile serverului (vezi descrierea).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Adresa de e-mail. Spațiile de la capete sunt eliminate, iar adresa este salvată cu litere mici.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Parola; se aplică apoi regulile parolei.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Numele de utilizator sau adresa de e-mail (orice text cu `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Opțional. Afișat în lista dispozitivelor conectate (de exemplu `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: '`mfaToken` din răspunsul de autentificare (sau din cel al unei autentificări cu Google).'
        code:
          type: string
          maxLength: 32
          description: Opțional. Un cod de 6 cifre din aplicația de autentificare sau un cod de recuperare.
        recoveryCode:
          type: string
          maxLength: 32
          description: Opțional. Un cod de recuperare. Este necesar unul dintre `code` și `recoveryCode`.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Adresa de e-mail.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Parametrul `token` al linkului de resetare.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Parola nouă; se aplică regulile de parolă ale înregistrării.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Challenge-ul PKCE S256 pentru `codeVerifier` al clientului (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Portul listenerului clientului, pe `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Challenge-ul PKCE S256 pentru `codeVerifier` al paginii (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`attemptId` din `POST /auth/sso/google/start`.'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: Verificatorul PKCE; hash-ul său SHA-256 trebuie să corespundă challenge-ului dat la `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state` așa cum l-a trimis înapoi Google.'
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: '`code` așa cum l-a trimis înapoi Google (ASCII imprimabil, fără spații).'
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Opțional. `iss` așa cum l-a trimis înapoi Google, dacă l-a trimis.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`linkTicket` din `finish`, valabil 10 minute.'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Parola contului.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`ssoTicket` din `finish`, valabil 10 minute.'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Numele de utilizator; se aplică regulile înregistrării.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Sesiunile active, cele folosite cel mai recent primele.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: O sesiune activă (un dispozitiv conectat).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: Id-ul sesiunii, pentru `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: Autentificarea (ms de la epoca Unix).
        lastSeenAt:
          type: integer
          format: int64
          description: Ultima utilizare (ms de la epoca Unix), actualizată cel mult o dată la 5 minute (mai târziu cât timp serverul a rămas mult în urmă).
        expiresAt:
          type: integer
          format: int64
          description: Sfârșitul absolut (ms de la epoca Unix); limita de inactivitate poate încheia sesiunea mai devreme.
        clientLabel:
          type:
            - string
            - 'null'
          description: '`clientLabel` al autentificării sau `null` când nu s-a trimis niciunul.'
        current:
          type: boolean
          description: Dacă aceasta este sesiunea care face cererea.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Câte o fișă pentru fiecare categorie în care jucătorul a jucat partide cu rating.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Sancțiunile active.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }` cât timp contul este suspendat, altfel `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Fișa de rating a unei categorii.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: Id-ul categoriei.
        rating:
          type: integer
          description: Ratingul.
        games:
          type: integer
          minimum: 0
          description: Partidele jucate în categorie (luate în calcul sau nu).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Cel mai mare rating atins.
        provisional:
          type: boolean
          description: '`true` cât timp ratingul nu a ieșit din faza fără rating sau are mai puțin de `PROVISIONAL_GAMES` partide luate în calcul (jocul îl afișează ca `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Tipul sancțiunii.
        reason:
          type:
            - string
            - 'null'
          description: Motivul indicat, dacă există.
        startsAt:
          type: integer
          format: int64
          description: Începutul (ms de la epoca Unix).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Sfârșitul (ms de la epoca Unix), `null` când sancțiunea este permanentă.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Sfârșitul suspendării (ms de la epoca Unix), `null` când este permanentă.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` pentru a accepta provocările directe după nume, `none` pentru a le refuza.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Parola curentă.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Parola nouă; se aplică regulile de parolă ale înregistrării.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Parola contului.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Un cod al secretului în așteptare, exact 6 cifre.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Parola contului.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Opțional; necesar cu autentificarea în doi pași (sau `recoveryCode`). Un cod din aplicația de autentificare sau un cod de recuperare.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Opțional. Un cod de recuperare (`xxxx-xxxx-xx`; majusculele, spațiile și cratimele nu contează).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Parola contului.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Un cod din aplicația de autentificare (un cod de recuperare este refuzat).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Noua adresă; spațiile de la capete sunt eliminate și este convertită la litere mici, apoi este verificată ca o adresă de înregistrare.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Parola contului.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Opțional; necesar cu autentificarea în doi pași (sau `recoveryCode`). Un cod din aplicația de autentificare sau un cod de recuperare.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Opțional. Un cod de recuperare.
    TotpSetup:
      type: object
      description: Secretul în așteptare pentru aplicația de autentificare.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Secretul în base32, de introdus în aplicație.
        uri:
          type: string
          format: uri
          description: URI-ul `otpauth://totp/...`, de afișat ca cod QR.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Secunde per pas.
    RecoveryCodeList:
      type: array
      description: Cele 10 coduri de recuperare, afișate doar de această dată. Fiecare funcționează o singură dată.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Una dintre părțile unei partide.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Numele din înregistrarea partidei (`deleted#<id>` pentru un cont șters).
        rating:
          type:
            - integer
            - 'null'
          description: Ratingul la început, `null` când nu este cunoscut.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Ratingul după partidă. O partidă cu rating îl are întotdeauna; `null` numai pentru o partidă care nu contează pentru rating (amicală, personalizată, anulată).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Variația ratingului, `0` când regulile de rating lasă ratingul neschimbat (regula FIDE a scorului zero, un adversar fără rating, primele partide ale unui jucător fără rating); `null` ca în cazul `ratingAfter`.
    GameSummary:
      type: object
      description: Rezumatul unei partide salvate.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Id-ul partidei.
        category:
          type: string
          description: Id-ul categoriei oficiale (`3+2`) sau `custom`.
        rated:
          type: boolean
          description: Dacă partida contează pentru rating.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Ritmul de joc în secunde (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (vezi codurile partidelor).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Codul motivului de încheiere (vezi codurile partidelor).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Rezultatul, `*` pentru o partidă anulată.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Numărul de semimutări.
        startedAt:
          type: integer
          format: int64
          description: Începutul (ms de la epoca Unix).
        endedAt:
          type: integer
          format: int64
          description: Sfârșitul (ms de la epoca Unix).
    Termination:
      type: string
      description: Numele motivului de încheiere (vezi codurile partidelor); `Unknown` pentru un cod pe care protocolul nu îl cunoaște.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Rezumatul unei partide din perspectiva unui jucător.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Partea jucătorului.
    HistoryGameSummary:
      description: O partidă din istoricul jucătorului autentificat.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Timpul de bază, în milisecunde.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Incrementul, în milisecunde.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: Rezultatul din perspectiva jucătorului.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Partidele paginii, cele mai noi primele.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Id-ul de transmis ca `before` pentru pagina următoare sau `null` pe ultima pagină.
        total:
          type: integer
          minimum: 0
          description: Numărul de partide care corespund filtrului, pe toate paginile.
    MoveRecord:
      type: object
      description: O semimutare a unei partide.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: Mutarea în notație UCI, cu `n`, `b`, `r` sau `q` adăugat pentru o promovare.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Timpul socotit pentru mutare (ms), `null` când înregistrarea nu îl are.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Ceasul celui care a mutat, după mutare (ms), `null` când înregistrarea nu îl are.
    PgnTagsView:
      type: object
      description: Principalele taguri PGN, pentru afișare. Aici `Termination` este numele motivului de încheiere; fișierul PGN folosește valorile standard PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` sau `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: Data de început, UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Ratingul la început sau `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Ratingul la început sau `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Înregistrarea unei partide, cu mutările și ceasurile ei. Are câmpurile unui rezumat de partidă, fără `color` și `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Timpul de bază, în milisecunde.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Incrementul, în milisecunde.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: Numele lui `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: Id-ul partidei a cărei revanșă este aceasta sau `null`.
            moves:
              type: array
              description: Câte o intrare pentru fiecare semimutare.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Numai când jucătorul tokenului a jucat această partidă; partea sa.
            reportable:
              type: boolean
              description: Numai când jucătorul tokenului a jucat această partidă; `true` când `POST /reports` ar accepta acum un raport despre adversar pentru această partidă (partida s-a încheiat în ultimele 7 zile, cota zilnică nu este epuizată, iar adversarul nu este deja raportat pentru această partidă).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Numele de utilizator, așa cum l-a scris jucătorul.
        createdAt:
          type: integer
          format: int64
          description: Momentul creării contului (ms de la epoca Unix).
        ratings:
          type: array
          description: Numai categoriile oficiale, în ordinea serverului.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Toate partidele salvate, inclusiv cele amicale și cele anulate.
            rated:
              type: integer
              minimum: 0
              description: Partidele cu rating, însumate pe fișele de rating.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Numele de utilizator, așa cum l-a scris jucătorul.
        games:
          type: array
          description: Partidele paginii, cele mai noi primele.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Id-ul ultimei partide ori de câte ori pagina este plină (pagina următoare poate fi atunci goală), altfel `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: Id-ul categoriei.
        minGames:
          type: integer
          minimum: 0
          description: Partidele luate în calcul de care are nevoie o fișă pentru a fi listată (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Momentul calculării clasamentului (ms de la epoca Unix).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: Textul PGN, cel mult 65.536 de octeți UTF-8. Se folosește numai prima partidă.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Opțional. Dimensiunea imaginii.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Opțional. Partea aflată în josul tablei.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Opțional. Milisecunde per mutare, un număr JSON cu valoare întreagă.
        coords:
          type: boolean
          default: true
          description: Opțional. Dacă literele coloanelor și numerele liniilor sunt desenate în jurul tablei.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Partida, ca număr întreg sau ca șir de 1 până la 16 cifre.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Numele de utilizator al adversarului, ca în înregistrarea partidei sau așa cum este acum, fără a ține cont de majuscule. Nu poate fi gol.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Despre ce este raportul.
        comment:
          type:
            - string
            - 'null'
          description: Opțional. Cel mult 500 de caractere după eliminarea caracterelor de control (altele decât tabulatorul și saltul de linie) și a spațiilor de la capetele textului.
    AccountExport:
      type: object
      description: Tot ce păstrează serverul despre cont (momentele în ms de la epoca Unix).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Momentul realizării exportului.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Ce conține fișierul și ce omite, în engleză simplă, pentru jucător.
          items:
            type: string
        account:
          description: Vizualizarea contului din `GET /account/me`, cu `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Adresa contului Google asociat sau `null`.
        ratings:
          type: array
          description: Fișele de rating complete.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Punctele de rating restituite după ce s-a constatat că un adversar a trișat, însumate pe zi UTC și pe categorie, cele mai noi primele. Nici partidele, nici trișorii nu sunt numiți.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Toate sesiunile salvate, cele mai noi primele, fără niciun token. Curățarea de retenție șterge o sesiune expirată, iar pe una deconectată, la o zi după deconectare.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Evenimentele de securitate, cele mai noi primele, păstrate `RETENTION_SECURITY_DAYS` zile.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Toate sancțiunile, inclusiv cele ridicate. Numele moderatorului nu este inclus niciodată.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Evenimentele de conduită înregistrate pentru partidele părăsite, anulate și cele la care jucătorul nu s-a prezentat, păstrate 30 de zile.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Rapoartele făcute de jucător.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Numărul de partide.
            list:
              type: array
              description: Toate partidele, cele mai noi primele, ca rezumate din `GET /account/games`. Mutările se află la `GET /games/{id}`, iar PGN-ul la `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: O fișă de rating completă.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Dacă jucătorul a ieșit din faza fără rating.
            countedGames:
              type: integer
              minimum: 0
              description: Partidele care au intrat în calculul ratingului.
            updatedAt:
              type: integer
              format: int64
              description: Momentul ultimei modificări a fișei.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: Ora 00:00 UTC a zilei (ms de la epoca Unix).
        category:
          type: string
        points:
          type: integer
          description: Punctele restituite în acea zi, în acea categorie.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Momentul deconectării sesiunii sau `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Adresa de la care s-a făcut autentificarea, ștearsă după `RETENTION_IP_DAYS` zile.
    SecurityEvent:
      type: object
      description: |-
        Un eveniment de securitate. `ip` este indicat numai pentru ceea ce s-a făcut în timpul unei sesiuni autentificate, cu parola contului (și al doilea factor) sau cu un link trimis la adresa sa: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` și `account_exported`; toate celelalte tipuri au `ip: null`, iar `ip` este șters după `RETENTION_IP_DAYS` zile.

        `detail` păstrează numai aceste câmpuri: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` și `method` (`password` sau `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` și `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Un eveniment `moderator_action` păstrează numai `{ action }`, pentru acțiunile `ban`, `unban`, `reset_mfa`, `verify_email` și `revoke_sessions` (celelalte acțiuni ale moderatorilor sunt omise). Toate celelalte tipuri au `detail: null`. Evenimentele `rating_refund` sunt omise: punctele lor se află în `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Tipul evenimentului (`login`, `password_changed`…).
        at:
          type: integer
          format: int64
          description: Momentul producerii.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: Numele public actual al jucătorului raportat.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Dacă raportul este încă deschis (nu se spune dacă jucătorul raportat a fost sancționat).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Tokenul linkului din e-mail (câmpul ascuns al formularului paginii).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Tokenul linkului de resetare (câmpul ascuns al formularului).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Parola nouă; se aplică regulile de parolă ale înregistrării.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Parola nouă, din nou; trebuie să fie identică.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: O pagină HTML în UTF-8 (`text/html; charset=utf-8`), fără JavaScript și fără resurse externe.
