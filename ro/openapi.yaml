                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: un corp diferit de `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limita `sessions` sau bugetul contului.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza de date a rămas blocată), `timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Retrimiterea linkului de confirmare
      description: |-
        Retrimite linkul de confirmare a adresei de e-mail. Răspunsul este 202 `accepted` indiferent de adresă, astfel încât nu spune niciodată dacă un cont sau o înregistrare o folosește.

        O cerere are efect cel mult o dată la 5 minute per adresă. O înregistrare în așteptare cu acea adresă primește din nou cele 24 de ore, indiferent dacă un alt cont folosește sau nu adresa, astfel încât numele său de utilizator rămâne rezervat la fel de mult în ambele cazuri. Un link se trimite doar pentru acea înregistrare, când adresa nu are niciun cont (un link nou, valabil 24 de ore, îl înlocuiește pe cel anterior), sau pentru un cont activ, neconfirmat, cu acea adresă.

        **Limite:** `auth`, apoi `auth_mail` (10 pe oră per client).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Acceptată (indiferent de adresă).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limita `auth` sau `auth_mail` (indiferent de adresă).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` cu `retryAfter: 1`: baza de date a rămas blocată în timpul căutării contului sau al stocării linkului unui cont neconfirmat (reînnoirea unei înregistrări în așteptare se face în măsura posibilului și nu face niciodată cererea să eșueze); cele 5 minute ale adresei încep totuși, așa că o nouă cerere în acest interval nu face nimic. `timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Trimiterea unui link de resetare a parolei
      description: |-
        Trimite un link de resetare a parolei, valabil o oră, care deschide pagina `/reset-password`. Răspunsul este 202 `accepted` indiferent de adresă. Un link este trimis doar unui cont activ, cel mult o dată la 5 minute per adresă. Un cont care folosește doar Google își setează astfel prima parolă.

        Recuperarea parolei are cele mai stricte limite ale API-ului, toate numărate pentru întregul server: 3 cereri pe oră (`AUTH_FORGOT_PER_HOUR`) și 10 la 24 de ore (`AUTH_FORGOT_PER_DAY`) per client (o adresă IPv4 sau un prefix IPv6 /64), de 3 ori aceste valori per prefix IPv6 /48, pe lângă limita `auth` (20 la 10 minute) și un singur e-mail per adresă la fiecare 5 minute. Nici 202, nici 429 nu spun dacă un cont folosește adresa. Setarea noii parole are propria limită (`auth_reset`).

        **Limite:** `auth`, `auth_forgot`, apoi `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Acceptată (indiferent de adresă).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limita `auth`, `auth_forgot` sau `auth_forgot_day` (indiferent de adresă).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` cu `retryAfter: 1`: baza de date a rămas blocată în timpul căutării contului sau al stocării linkului; cele 5 minute ale adresei încep totuși, așa că o nouă cerere în acest interval nu trimite niciun link. `timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Setarea unei parole noi cu tokenul unui link de resetare
      description: |-
        Setează o parolă nouă cu tokenul unui link de resetare (pagina `/reset-password` face același lucru). Parola nouă respectă regulile înregistrării.

        Resetarea are următoarele efecte, într-o singură tranzacție (toate sau niciunul): revocă toate sesiunile și anulează o schimbare de e-mail în așteptare; celelalte linkuri de resetare ale contului nu mai funcționează; adresa este considerată confirmată (linkul a dovedit-o); proprietarul primește un e-mail. Autentificarea în doi pași nu este afectată. După o eroare a cozii de hashing a parolelor, un 503 sau un 500, nu s-a schimbat nimic: parola veche și sesiunile rămân, iar linkul rămâne valabil.

        **Limite:** `auth`, apoi `auth_reset` (10 pe oră per client, 30 per prefix IPv6 /48, partajată cu pagina: fiecare încercare calculează hash-ul unei parole).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Parola este schimbată, iar toate sesiunile sunt deconectate.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: linkul este nevalid, folosit sau expirat ori a fost trimis la o adresă pe care contul nu o mai are. `weak_password` (cu `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limita `auth` sau `auth_reset` ori coada de hashing a parolelor.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: coada de hashing a parolelor sau baza de date a rămas blocată (`retryAfter: 1`, nu s-a schimbat nimic). `timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Începerea unei autentificări cu Google
      description: |-
        Începe o încercare de autentificare cu Google pentru challenge-ul PKCE și portul listenerului jocului pe `127.0.0.1`. Răspunsul conține URL-ul Google de deschis în browserul sistemului și `state` al încercării; încercarea este valabilă 10 minute.

        `authUrl` conține `client_id`, `redirect_uri` (construit din `redirectPort` și eticheta de origine a serverului), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 al verificatorului propriu al serverului pentru Google) cu `code_challenge_method=S256` și `prompt=select_account`. Jocul îl verifică înainte de a-l deschide (vezi descrierea secțiunii).

        **Limită:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Încercarea.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: autentificarea cu Google nu este oferită pe acest server.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limita `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza de date a rămas blocată), `timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Începerea unei autentificări cu Google pe un site web
      description: |-
        Începe o încercare de autentificare cu Google a unui site web pentru challenge-ul PKCE al paginii sale. Răspunsul este același ca pentru joc: URL-ul Google către care se navighează și `state` al încercării; încercarea este valabilă 10 minute. Disponibil când `GET /info` indică `sso.googleWeb: true`.

        `authUrl` conține `client_id` al site-ului web și `redirect_uri=GOOGLE_WEB_REDIRECT_URI`, cu aceiași alți parametri ca pentru joc. Pagina îl verifică înainte de a naviga la el (vezi **Pe un site web** în descrierea secțiunii).

        **Limită:** `sso_start`, partajată cu pornirea din joc.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: Încercarea.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: un `codeChallenge` lipsă sau malformat ori orice alt câmp (inclusiv `redirectPort`).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: autentificarea cu Google nu este oferită pe acest server sau nu este oferită site-urilor web.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limita `sso_start` (partajată cu pornirea din joc).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza de date a rămas blocată), `timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Transmiterea răspunsului Google către server
      description: |-
        Transmite serverului `code` și `state` trimise de Google listenerului jocului sau paginii site-ului web, împreună cu id-ul încercării și verificatorul PKCE. Un id de încercare este inutil fără verificator, iar codul este inutil fără verificatorul PKCE propriu al serverului și fără secretul clientului.

        Serverul verifică încercarea (necunoscută, folosită sau expirată: 410), apoi verificatorul (unul greșit lasă încercarea utilizabilă), apoi folosește încercarea o singură dată, verifică `state` și `iss`, face schimbul codului cu Google și verifică ID tokenul. Răspunsul (200) este unul dintre:

        - `{ token, expiresAt, user }`: autentificare în contul asociat;
        - `{ mfaRequired, mfaToken, expiresIn }`: continuați cu `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: un cont nou; continuați cu `POST /auth/sso/complete` în cel mult 10 minute. `suggestedUsername` provine din numele Google sau din adresă și este `""` când nu se potrivește nimic;
        - `{ needsPassword, linkTicket, username, expiresIn }`: contul cu acea adresă are parolă; continuați cu `POST /auth/sso/google/link`. Încă nu s-a asociat nimic.

        **Limită:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: O sesiune, un al doilea pas sau pasul următor al unei prime autentificări cu Google.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Autentificare în contul asociat
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Autentificarea în doi pași este activată
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Un jucător nou
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Un cont cu parolă folosește adresa
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: verificatorul nu corespunde challenge-ului încercării (încercarea rămâne utilizabilă). `sso_email_unverified`: Google nu a confirmat adresa. `registration_closed`. `account_disabled`. Doar pentru un cont asociat: `banned` (cu `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: autentificarea cu Google nu este oferită pe acest server.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: un cont activ fără parolă folosește adresa (contul nu este numit).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: o încercare necunoscută, folosită sau expirată.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limita `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza de date a rămas blocată), `timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Asocierea Google cu un cont existent prin parola acestuia
      description: |-
        După ce `finish` a răspuns `needsPassword`: asociază Google cu contul existent folosind parola acelui cont, introdusă în joc. Răspunsul (200) este o sesiune (asocierea este stocată, iar jucătorul este autentificat) sau, când autentificarea în doi pași este activată, `{ mfaRequired, mfaToken, expiresIn }`: continuați cu `POST /auth/login/mfa`, iar asocierea este stocată doar când un cod trece acolo.

        O parolă greșită lasă tichetul utilizabil, pentru 5 încercări în total. O încercare este consumată chiar înainte de verificarea parolei: un 429 `too_many_attempts` sau un 428 `pow_required` nu consumă niciuna, în timp ce un refuz al cozii de hashing a parolelor (503 `server_busy`, 429 `rate_limited`) a consumat deja una și contează ca un eșec al contului. Timpul de așteptare după eșecuri folosește același contor ca `POST /auth/login`.

        **Limită:** `auth` (cu numărarea sa per prefix IPv6 /48). **Dovadă de lucru:** ca pentru `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: O sesiune sau al doilea pas al autentificării.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: parolă greșită; tichetul se păstrează, pentru 5 încercări în total.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (cu `until`), numai după o parolă corectă.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: autentificarea cu Google nu este oferită pe acest server.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: între timp, contul Google a fost asociat cu un alt cont.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: un tichet necunoscut, folosit sau expirat, a 5-a parolă greșită, un cont a cărui stare sau adresă s-a schimbat de la `finish` încoace ori unul a cărui stare, adresă, parolă sau autentificare în doi pași s-a schimbat în timp ce asocierea era salvată. Reîncepeți autentificarea.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (timpul de așteptare al contului după eșecuri) sau `rate_limited` (limita `auth`, coada de hashing a parolelor).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: coada de hashing a parolelor sau baza de date a rămas blocată (`retryAfter: 1`, nu s-a asociat nimic). `timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Crearea contului la prima autentificare cu Google
      description: |-
        După ce `finish` a răspuns `needsUsername`: creează contul cu numele de utilizator ales (se aplică regulile înregistrării) și îl autentifică. Contul nu are parolă: `hasPassword` este `false`, iar „Ați uitat parola?” (`POST /auth/password/forgot`) îi dă una.

        **Limită:** `auth` (cu numărarea sa per prefix IPv6 /48).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Contul este creat și autentificat.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: autentificarea cu Google nu este oferită pe acest server.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (un cont are acest nume de utilizator sau îl rezervă o înregistrare în așteptare a altei adrese), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: un tichet necunoscut, folosit sau expirat.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: limita `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (baza de date a rămas blocată), `timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Listarea dispozitivelor conectate
      description: |-
        Sesiunile active ale contului (dispozitivele conectate), cele folosite cel mai recent primele. `current` marchează sesiunea care face cererea. `lastSeenAt` este actualizat cel mult o dată la 5 minute (mai târziu cât timp serverul a rămas mult în urmă); `expiresAt` este sfârșitul absolut, iar limita de inactivitate poate încheia sesiunea mai devreme.

        **Limită:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesiunile active.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
