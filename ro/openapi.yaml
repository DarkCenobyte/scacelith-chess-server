          description: '`busy` (baza de date a rămas blocată; `retryAfter: 1` în corp, fără antet `Retry-After`), `server_busy` (căutarea sesiunii a găsit baza de date blocată), `timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: Obținerea celor mai buni jucători dintr-o categorie
      description: |-
        Primele 100 de fișe de rating ale unei categorii oficiale cu cel puțin `minGames` (`PROVISIONAL_GAMES`) partide luate în calcul, fără conturile șterse și fără trișorii confirmați. Serverul recalculează fiecare clasament cel mult o dată la 10 secunde; `updatedAt` spune când. Pentru fiecare categorie rulează un singur calcul în același timp: între timp, celelalte cereri primesc lista anterioară sau așteaptă calculul când încă nu există niciuna.

        **Limite:** numai nivelul per adresă.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: Un id de categorie oficială (`3+2` sau `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: Câți jucători, de la 1 la 100. Un număr mai mare, de cel mult 3 cifre, contează ca 100; o valoare goală contează ca absentă.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: Clasamentul.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (lipsă sau nu este o categorie oficială), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: nivelul per adresă.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (baza de date a rămas blocată; `retryAfter: 1` în corp, fără antet `Retry-After`), `timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Raportarea adversarului dintr-o partidă recentă
      description: |-
        Raportează adversarul dintr-una dintre partidele proprii ale jucătorului, încheiată în ultimele 7 zile. Un raport nu modifică niciodată, de unul singur, un rating, o sancțiune sau un nivel de integritate. El crește prioritatea de examinare pe care o văd moderatorii și, cu excepția `abuse`, solicită analiza partidei de către motor.

        Un raport despre același adversar pentru aceeași partidă primește același răspuns și nu schimbă nimic; răspunsul nu spune niciodată nimic despre contul raportat. `GET /games/{id}` le spune dinainte jucătorilor partidei dacă un raport ar fi acceptat (`reportable`).

        Acest endpoint își verifică singur corpul, în ordinea `gameId`, `reported`, `category`, `comment`: un eșec primește răspunsul 400 `invalid_request` fără `field`. Câmpurile pe care nu le cunoaște sunt ignorate.

        **Limite:** `reports` (per jucător), apoi `REPORTS_PER_DAY` (5) rapoarte per jucător în 24 de ore (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Raportul este primit (sau fusese deja trimis).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (fără `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: nu este adversarul celui care raportează într-o partidă încheiată în ultimele 7 zile.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, cu un antet `Retry-After`): `REPORTS_PER_DAY` rapoarte în ultimele 24 de ore. `rate_limited`: limita `reports` sau bugetul contului.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (căutarea sesiunii a găsit baza de date blocată), `timeout`. De asemenea, `server_busy` cu `retryAfter` între 2 și 5 când serverul a rămas mult în urmă (vezi introducerea): cererea nu a fost executată.'
