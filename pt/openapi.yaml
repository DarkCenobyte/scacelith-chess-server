      description: |-
        Desativa a autenticação de dois fatores. O segredo e os códigos de recuperação são eliminados, e o titular recebe um e-mail.

        **Reautenticação:** a palavra-passe e um código da aplicação de autenticação ou um código de recuperação (é obrigatório um dos dois, `code` ou `recoveryCode`). **Limites:** `reauth` e depois `reauth_user`.
