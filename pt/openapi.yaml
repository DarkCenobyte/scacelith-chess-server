          description: '`server_busy` (a fila de hash das palavras-passe, ou a base de dados continuou bloqueada), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: Alterar o endereço de e-mail
      description: |-
        Altera o endereço de e-mail da conta. Os espaços no início e no fim de `newEmail` são removidos e o endereço é convertido em minúsculas; depois é verificado como um endereço de registo.

        **Com confirmação por e-mail** (a predefinição): 202 `verification_sent`. É enviada para o novo endereço uma ligação válida durante 24 horas; abre `/confirm-email-change`, e o endereço só muda quando o jogador carrega no botão dessa página. Até lá, `GET /account/me` mostra o novo endereço como `pendingEmail`. Um novo pedido substitui o pendente; uma alteração ou reposição da palavra-passe cancela-o. É enviada no máximo uma ligação para um mesmo novo endereço a cada 5 minutos, seja quem for que a peça (um pedido para a alteração já pendente mantém a ligação enviada antes, que continua válida); a resposta é a mesma. O endereço atual recebe um aviso de que foi pedida uma alteração para um endereço mascarado (`a***@example.org`). A resposta e `pendingEmail` são os mesmos quando outra conta já usa o novo endereço: nesse caso não é enviada nenhuma ligação, pelo que essa alteração nunca é concluída, e o titular desse endereço recebe, em vez disso, um aviso (no máximo um por hora).

        Quando a ligação é confirmada, o endereço muda e passa a contar como confirmado, os dispositivos mantêm a sessão iniciada, as ligações enviadas antes (confirmação, reposição da palavra-passe, outras alterações) deixam de funcionar e o endereço anterior é avisado, com o novo mascarado.

        **Sem confirmação por e-mail** (`REQUIRE_EMAIL_VERIFICATION=false`): o endereço muda de imediato (200 `email_changed`) e o endereço anterior é avisado. Se outra conta usar o endereço, a resposta é 409 `email_taken`, e o titular desse endereço recebe o aviso.

        **Reautenticação:** a palavra-passe e, com a autenticação de dois fatores, um código da aplicação de autenticação ou um código de recuperação. `invalid_email` e `same_email` são verificados antes da palavra-passe, pelo que não contam como falha. **Limites:** `reauth` e depois `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: O endereço mudou de imediato (sem confirmação por e-mail neste servidor).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: O novo endereço, tal como foi guardado.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: Foi enviada uma ligação de confirmação para o novo endereço (ou o endereço pertence a outra conta; a resposta não o revela).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email` (o endereço atual da conta), `password_not_set` (uma conta que só usa o Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` (também quando uma alteração ou reposição da palavra-passe se antecipou ao pedido: não é enviada nenhuma ligação), `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: apenas sem confirmação por e-mail.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (reautenticações falhadas, ou demasiados códigos tentados nesta conta), ou `rate_limited` (o limite `reauth` ou `reauth_user`, o orçamento da conta, a fila de hash das palavras-passe).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: a fila de hash das palavras-passe, ou a base de dados continuou bloqueada (`retryAfter: 1`: nada foi alterado, e o mesmo pedido pode ser enviado de novo). `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: Transferir os dados da conta
      description: |-
        Tudo o que o servidor conserva sobre a conta, num único ficheiro JSON para guardar (`format` `scacelith-account-export`, `version` 1). A exportação regista um evento de segurança (`account_exported`). O array `notes` do documento indica ao jogador, em inglês simples, o que fica de fora.

        **Nunca na exportação:** o hash da palavra-passe, o segredo da autenticação de dois fatores e os códigos de recuperação; nenhum token de sessão ou de ligação, nem o seu hash; os dados do sistema antibatota (nível e pontuação de integridade, anomalias, a análise das partidas, o peso de uma denúncia); as denúncias que outros jogadores fizeram sobre o jogador; as identidades dos moderadores; os dados privados de outros jogadores (os adversários aparecem pelo seu nome público e pela sua pontuação, nada indica se outro jogador foi sancionado, e não é incluído nenhum endereço IP que possa ser de outra pessoa).

        **Reautenticação:** a palavra-passe e, com a autenticação de dois fatores, um código da aplicação de autenticação ou um código de recuperação. **Limites:** `account_export` (5 por hora por jogador, para todo o servidor; todas as tentativas contam, incluindo as falhadas; verificado primeiro) e depois `reauth` e `reauth_user`. **Tempo máximo:** 60 segundos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
