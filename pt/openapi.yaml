        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a base de dados continuou bloqueada), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Alterar a palavra-passe
      description: |-
        Altera a palavra-passe. É necessária a palavra-passe atual, mas nenhum segundo fator, mesmo com a autenticação de dois fatores ativada. A nova palavra-passe segue as regras do registo (verificadas depois da palavra-passe atual).

        A alteração tem estes efeitos, numa única transação (todos ou nenhum): revoga todas as outras sessões (esta sessão continua iniciada), cancela uma alteração de e-mail pendente, faz com que as ligações de reposição da palavra-passe da conta deixem de funcionar e envia um e-mail ao titular.

        **Reautenticação:** apenas a palavra-passe. **Limites:** `reauth` e depois `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: A palavra-passe foi alterada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (uma conta que só usa o Google), `weak_password` (com `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: a palavra-passe atual está errada, ou ocorreu uma reposição ou alteração da palavra-passe enquanto o pedido era verificado.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (reautenticações falhadas da conta), ou `rate_limited` (o limite `reauth` ou `reauth_user`, o orçamento da conta, a fila de hash das palavras-passe).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: a fila de hash das palavras-passe, ou a base de dados continuou bloqueada (`retryAfter: 1`, nada foi alterado). `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Começar a ativar a autenticação de dois fatores
      description: |-
        Guarda um novo segredo de autenticação pendente, que substitui qualquer segredo pendente anterior, e devolve-o para a aplicação de autenticação (como texto e como URI `otpauth://` para mostrar como código QR). A autenticação de dois fatores ainda não fica ativada: `POST /account/mfa/totp/enable` ativa-a com um código deste segredo.

        **Reautenticação:** apenas a palavra-passe. **Limites:** `reauth` e depois `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
