      summary: Substituir os códigos de recuperação
      description: |-
        Substitui os códigos de recuperação por 10 novos; os antigos deixam de funcionar.

        **Reautenticação:** a palavra-passe e um código da aplicação de autenticação em `code` (um código de recuperação é recusado com 403 `invalid_code`). **Limites:** `reauth` e depois `reauth_user`.
