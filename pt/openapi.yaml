paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Obter o nome, as versões, as portas e as regras de registo do servidor
      description: |-
        Aquilo de que um cliente precisa antes de iniciar sessão ou de se ligar: o nome e o ID do servidor, as versões do protocolo WebSocket e onde se encontra o WebSocket, as regras de registo, os ritmos de jogo oficiais e os limites que um cliente pode verificar antes de enviar um formulário.

        **Limites:** apenas a camada por endereço.
      security: []
      responses:
        '200':
          description: A descrição do servidor.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: a camada por endereço.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Criar uma conta
      description: |-
        Cria uma conta: depois de o seu endereço de e-mail ser confirmado com a ligação enviada para ele, ou de imediato, sem confirmação por e-mail.

        **Com confirmação por e-mail** (`REQUIRE_EMAIL_VERIFICATION`, a predefinição): 202 `verification_sent`. Ainda não existe nenhuma conta: o registo fica pendente durante 24 horas e reserva entretanto o seu nome de utilizador. É enviada para o endereço uma ligação válida durante essas 24 horas, no máximo uma por endereço a cada 5 minutos (`POST /auth/verify-email/resend` envia uma nova); a conta é criada, com o endereço confirmado, quando a ligação é utilizada (o botão da página `/verify-email`), e o jogador pode então iniciar sessão. Até lá, um início de sessão com esse nome de utilizador recebe `invalid_credentials`, como no caso de uma conta desconhecida, e o perfil público não existe. Um novo registo com o mesmo endereço substitui o pendente. A resposta é a mesma quando outra conta já usa o endereço: nesse caso não é enviada nenhuma ligação, o titular dessa conta recebe um aviso em vez disso (no máximo um por hora) e o nome de utilizador é reservado da mesma forma, para que nada revele se o endereço tem uma conta. Um registo cuja ligação não foi utilizada é descartado ao fim de 24 horas, e o seu nome de utilizador fica novamente livre.

        **Sem confirmação por e-mail** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, a conta é criada de imediato e pode iniciar sessão.

        **Regras.** `username`: de `USERNAME_MIN` a `USERNAME_MAX` carateres (3 a 20), letras, algarismos, `_` e `-`, a começar por uma letra ou um algarismo (`GET /info` indica-os em `limits`); os nomes reservados (`admin`, `moderator`, `deleted`...) e alguns prefixos são recusados; único sem distinção entre maiúsculas e minúsculas. `email`: sem espaços no início e no fim e guardado em minúsculas, ASCII simples com um domínio com ponto. `password`: pelo menos `PASSWORD_MIN_LENGTH` (10) carateres e no máximo 256 bytes de UTF-8; não pode conter o nome de utilizador nem a parte local do e-mail, nem ser uma palavra-passe comum.

        **Erros**, verificados por esta ordem: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; os erros da fila de hash das palavras-passe; 409 `email_taken` (apenas sem confirmação por e-mail).

        **Limites:** `auth`, depois `auth_register` (10 registos por hora por cliente). **Prova de trabalho:** sempre, quando `POW_REGISTER_BITS` é superior a 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Primeira tentativa, sem prova de trabalho
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Enviado novamente com a prova de trabalho
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: A conta é criada e pode iniciar sessão (sem confirmação por e-mail neste servidor).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: O registo aguarda a sua ligação de confirmação (ou o endereço já tem uma conta; a resposta não o indica).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (com `field`), `invalid_json`, `invalid_username`, `invalid_email` ou `weak_password` com `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` ou `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: o registo de novas contas está fechado neste servidor (`GET /info` indica `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: uma conta tem o nome de utilizador, ou um registo pendente de outro endereço reserva-o. `email_taken`: outra conta usa o endereço (apenas sem confirmação por e-mail).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `auth` ou `auth_register`, ou a fila de hash das palavras-passe.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a fila de hash das palavras-passe, ou a base de dados permaneceu bloqueada), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Iniciar sessão com uma palavra-passe
      description: |-
        Inicia sessão com um nome de utilizador ou endereço de e-mail e uma palavra-passe. Há duas respostas possíveis, ambas com o estado 200: uma sessão ou, quando a autenticação de dois fatores está ativada, um segundo passo a concluir em 5 minutos com `POST /auth/login/mfa`.

        Uma conta desconhecida, uma palavra-passe errada e uma conta sem palavra-passe recebem a mesma resposta, após o mesmo tempo: 401 `invalid_credentials`. As verificações da conta (`banned`, `email_unverified`) só ocorrem depois de uma palavra-passe correta. A partir de `AUTH_FAILURES_PER_ACCOUNT` (5) falhas num mesmo identificador de início de sessão, cada tentativa tem de esperar (429 `too_many_attempts`).

        **Limite:** `auth`. **Prova de trabalho:** apenas durante uma vaga de inícios de sessão falhados (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Uma sessão, ou o segundo passo de um início de sessão com autenticação de dois fatores.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Sessão iniciada
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: A autenticação de dois fatores está ativada
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: conta desconhecida, palavra-passe errada ou uma conta sem palavra-passe.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Apenas depois de uma palavra-passe correta: `banned`, com `until` (ms desde a época Unix, `null` para uma suspensão permanente), ou `email_unverified` (uma conta mais antiga cujo endereço ainda não está confirmado).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (o atraso por falhas deste identificador de início de sessão), ou `rate_limited` (o limite `auth`, a fila de hash das palavras-passe).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a fila de hash das palavras-passe, ou a base de dados permaneceu bloqueada), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Concluir um início de sessão com um segundo fator
      description: |-
        O segundo passo de um início de sessão com autenticação de dois fatores, depois de `POST /auth/login` ou de um início de sessão com o Google (`POST /auth/sso/google/finish` ou `POST /auth/sso/google/link`) ter respondido `mfaRequired`. Envie `code` (um código de 6 algarismos da aplicação de autenticação, ou um código de recuperação) ou `recoveryCode`. Um código de recuperação utilizado aqui deixa de existir.

        Um passo aceita no máximo 5 códigos errados; o passo também termina quando a palavra-passe é reposta ou alterada. Depois do passo da palavra-passe de uma associação Google, a associação só é guardada quando o código é aceite aqui.

        **Limites:** `auth` e, no máximo, `AUTH_MFA_PER_ACCOUNT` (10) códigos a cada 15 minutos para a conta, a partir de qualquer endereço; acima disso, o código não é verificado, pelo que um código de recuperação não é gasto.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Um código da aplicação de autenticação
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Um código de recuperação
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Sessão iniciada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: não foi enviado `code` nem `recoveryCode`, ou o corpo viola o esquema; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: o passo expirou, já foi utilizado ou terminou após 5 códigos errados, ou a palavra-passe foi reposta ou alterada desde o primeiro passo (inicie sessão novamente). `invalid_code`: um código errado ou já utilizado.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (com `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: apenas após o passo da palavra-passe de uma associação Google, a conta Google foi entretanto associada a outra conta.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: apenas após o passo da palavra-passe de uma associação Google, a conta foi entretanto alterada; comece novamente o início de sessão.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: o atraso por falhas da conta, ou os seus `AUTH_MFA_PER_ACCOUNT` códigos dos últimos 15 minutos estão esgotados. `rate_limited`: o limite `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` com `retryAfter: 1`: a base de dados permaneceu bloqueada (após um passo de associação Google, nada foi associado: comece novamente o início de sessão). `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Terminar esta sessão
      description: |-
        Revoga a sessão do token utilizado. O WebSocket aberto com ela é fechado. Sem corpo (ou `{}`).

        **Limite:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessão terminada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: um corpo diferente de `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `sessions` ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a base de dados permaneceu bloqueada), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
        - sessions
      summary: Terminar todas as sessões
      description: |-
        Revoga todas as sessões da conta, incluindo esta. Os WebSockets abertos com elas são fechados. Sem corpo (ou `{}`).

        **Limite:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Todas as sessões foram terminadas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: um corpo diferente de `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `sessions` ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a base de dados permaneceu bloqueada), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Reenviar a ligação de confirmação
      description: |-
        Envia novamente a ligação de confirmação do e-mail. A resposta é 202 `accepted` seja qual for o endereço, para que nunca revele se uma conta ou um registo o usa.

        Um pedido produz efeito no máximo uma vez a cada 5 minutos por endereço. Um registo pendente com esse endereço recebe novamente as suas 24 horas, quer outra conta use o endereço quer não, para que o seu nome de utilizador fique reservado durante o mesmo tempo em ambos os casos. Só é enviada uma ligação para esse registo quando o endereço não tem conta (uma nova ligação, válida durante 24 horas, substitui a anterior), ou para uma conta ativa e não confirmada com esse endereço.

        **Limites:** `auth`, depois `auth_mail` (10 por hora por cliente).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Aceite (seja qual for o endereço).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `auth` ou `auth_mail` (seja qual for o endereço).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` com `retryAfter: 1`: a base de dados permaneceu bloqueada enquanto a conta era procurada ou a ligação de uma conta não confirmada era guardada (a renovação de um registo pendente é feita na medida do possível e nunca faz falhar o pedido); os 5 minutos do endereço começam a contar na mesma, pelo que um novo pedido dentro deles não faz nada. `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Enviar uma ligação de reposição da palavra-passe
      description: |-
        Envia uma ligação de reposição da palavra-passe, válida durante uma hora, que abre a página `/reset-password`. A resposta é 202 `accepted` seja qual for o endereço. Só é enviada uma ligação para uma conta ativa, no máximo uma vez a cada 5 minutos por endereço. É desta forma que uma conta que só inicia sessão com o Google define a sua primeira palavra-passe.

        A recuperação da palavra-passe tem os limites mais estritos da API, todos contados para todo o servidor: 3 pedidos por hora (`AUTH_FORGOT_PER_HOUR`) e 10 por 24 horas (`AUTH_FORGOT_PER_DAY`) por cliente (um endereço IPv4 ou um /64 IPv6), o triplo destes números por /48 IPv6, além do limite `auth` (20 a cada 10 minutos) e de um único e-mail por endereço a cada 5 minutos. Nem o 202 nem o 429 revelam se uma conta usa o endereço. A definição da nova palavra-passe tem um limite próprio (`auth_reset`).

        **Limites:** `auth`, `auth_forgot`, depois `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Aceite (seja qual for o endereço).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `auth`, `auth_forgot` ou `auth_forgot_day` (seja qual for o endereço).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` com `retryAfter: 1`: a base de dados permaneceu bloqueada enquanto a conta era procurada ou a ligação era guardada; os 5 minutos do endereço começam a contar na mesma, pelo que um novo pedido dentro deles não envia nenhuma ligação. `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Definir uma nova palavra-passe com o token de uma ligação de reposição
      description: |-
        Define uma nova palavra-passe com o token de uma ligação de reposição (a página `/reset-password` faz o mesmo). A nova palavra-passe segue as regras do registo.

        A reposição tem estes efeitos, numa única transação (todos ou nenhum): revoga todas as sessões e cancela uma alteração de e-mail pendente; as outras ligações de reposição da conta deixam de funcionar; o endereço passa a contar como confirmado (a ligação provou-o); o titular recebe um e-mail. A autenticação de dois fatores não é alterada. Após um erro da fila de hash das palavras-passe, um 503 ou um 500, nada mudou: a palavra-passe antiga e as sessões mantêm-se, e a ligação continua válida.

        **Limites:** `auth`, depois `auth_reset` (10 por hora por cliente, 30 por /48 IPv6, partilhado com a página: cada tentativa calcula o hash de uma palavra-passe).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: A palavra-passe foi alterada e todas as sessões foram terminadas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: a ligação é inválida, já foi utilizada ou expirou, ou foi enviada para um endereço que a conta já não tem. `weak_password` (com `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `auth` ou `auth_reset`, ou a fila de hash das palavras-passe.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: a fila de hash das palavras-passe, ou a base de dados permaneceu bloqueada (`retryAfter: 1`, nada mudou). `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Começar um início de sessão com o Google
      description: |-
        Começa uma tentativa de início de sessão com o Google para o desafio PKCE e a porta do serviço de escuta do jogo em `127.0.0.1`. A resposta indica o URL do Google a abrir no navegador do sistema e o `state` da tentativa; a tentativa é válida durante 10 minutos.

        `authUrl` contém `client_id`, `redirect_uri` (construído a partir de `redirectPort` e da etiqueta de origem do servidor), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 do verificador próprio do servidor para o Google) com `code_challenge_method=S256`, e `prompt=select_account`. O jogo verifica-o antes de o abrir (ver a descrição da secção).

        **Limite:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: A tentativa.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: o início de sessão com o Google não está disponível neste servidor.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a base de dados permaneceu bloqueada), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Começar um início de sessão com o Google num site
      description: |-
        Começa uma tentativa de início de sessão com o Google de um site para o desafio PKCE da sua página. A resposta é a mesma que para o jogo: o URL do Google para onde navegar e o `state` da tentativa; a tentativa é válida durante 10 minutos. Disponível quando `GET /info` indica `sso.googleWeb: true`.

        `authUrl` contém o `client_id` do site e `redirect_uri=GOOGLE_WEB_REDIRECT_URI`, com os mesmos outros parâmetros que para o jogo. A página verifica-o antes de navegar para ele (ver **Num site** na descrição da secção).

        **Limite:** `sso_start`, partilhado com o endpoint de início usado pelo jogo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: A tentativa.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: um `codeChallenge` em falta ou mal formado, ou qualquer outro campo (incluindo `redirectPort`).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: o início de sessão com o Google não está disponível neste servidor, ou não para sites.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `sso_start` (partilhado com o endpoint de início usado pelo jogo).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a base de dados permaneceu bloqueada), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Entregar ao servidor a resposta do Google
      description: |-
        Entrega ao servidor o `code` e o `state` que o Google enviou para o serviço de escuta do jogo ou para a página do site, com o ID da tentativa e o verificador PKCE. Um ID de tentativa é inútil sem o verificador, e o código é inútil sem o verificador PKCE próprio do servidor e o segredo do cliente.

        O servidor verifica a tentativa (desconhecida, já utilizada ou expirada: 410), depois o verificador (um verificador errado deixa a tentativa utilizável), depois usa a tentativa uma vez, verifica `state` e `iss`, troca o código com o Google e verifica o token de ID. A resposta (200) é uma das seguintes:

        - `{ token, expiresAt, user }`: sessão iniciada na conta associada;
        - `{ mfaRequired, mfaToken, expiresIn }`: continue com `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: uma nova conta; continue com `POST /auth/sso/complete` em 10 minutos. `suggestedUsername` vem do nome Google ou do endereço, e é `""` quando nada é adequado;
        - `{ needsPassword, linkTicket, username, expiresIn }`: a conta com esse endereço tem palavra-passe; continue com `POST /auth/sso/google/link`. Ainda nada está associado.

        **Limite:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Uma sessão, um segundo passo, ou o passo seguinte de um primeiro início de sessão com o Google.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Sessão iniciada na conta associada
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: A autenticação de dois fatores está ativada
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Um novo jogador
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Uma conta com palavra-passe usa o endereço
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: o verificador não corresponde ao desafio da tentativa (a tentativa continua utilizável). `sso_email_unverified`: o Google não confirmou o endereço. `registration_closed`. `account_disabled`. Apenas para uma conta associada: `banned` (com `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: o início de sessão com o Google não está disponível neste servidor.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: uma conta ativa sem palavra-passe usa o endereço (a conta não é indicada).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: uma tentativa desconhecida, já utilizada ou expirada.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a base de dados permaneceu bloqueada), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Associar o Google a uma conta existente com a respetiva palavra-passe
      description: |-
        Depois de `finish` ter respondido `needsPassword`: associa o Google à conta existente com a palavra-passe dessa conta, introduzida no jogo. A resposta (200) é uma sessão (a associação é guardada e o jogador inicia sessão) ou, quando a autenticação de dois fatores está ativada, `{ mfaRequired, mfaToken, expiresIn }`: continue com `POST /auth/login/mfa`, e a associação só é guardada quando um código for aceite aí.

        Uma palavra-passe errada deixa o ticket utilizável, num total de 5 tentativas. Uma tentativa é consumida imediatamente antes de a palavra-passe ser verificada: um 429 `too_many_attempts` ou um 428 `pow_required` não consome nenhuma, enquanto uma recusa da fila de hash das palavras-passe (503 `server_busy`, 429 `rate_limited`) já consumiu uma e conta como falha da conta. O atraso por falhas usa o mesmo contador que `POST /auth/login`.

        **Limite:** `auth` (com a sua contagem por /48 IPv6). **Prova de trabalho:** como para `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Uma sessão, ou o segundo passo do início de sessão.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: palavra-passe errada; o ticket continua válido, até 5 tentativas no total.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (com `until`), apenas depois de uma palavra-passe correta.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: o início de sessão com o Google não está disponível neste servidor.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: entretanto, a conta Google foi associada a outra conta.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: um ticket desconhecido, já usado ou expirado, a 5.ª palavra-passe errada, uma conta cujo estado ou endereço mudou desde `finish`, ou cujo estado, endereço, palavra-passe ou autenticação de dois fatores mudou enquanto a associação estava a ser guardada. Recomece o início de sessão.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (o tempo de espera da conta após falhas), ou `rate_limited` (o limite `auth`, a fila de hash das palavras-passe).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: a fila de hash das palavras-passe, ou a base de dados continuou bloqueada (`retryAfter: 1`, nada foi associado). `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Criar a conta de um primeiro início de sessão com o Google
      description: |-
        Depois de `finish` ter respondido `needsUsername`: cria a conta com o nome de utilizador escolhido (aplicam-se as regras do registo) e inicia sessão nela. A conta não tem palavra-passe: `hasPassword` é `false`, e «Esqueceu-se da palavra-passe?» (`POST /auth/password/forgot`) atribui-lhe uma.

        **Limite:** `auth` (com a sua contagem por /48 IPv6).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: A conta foi criada e tem sessão iniciada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: o início de sessão com o Google não está disponível neste servidor.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (uma conta tem esse nome de utilizador, ou um registo pendente de outro endereço reserva-o), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: um ticket desconhecido, já usado ou expirado.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a base de dados continuou bloqueada), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Listar os dispositivos com sessão iniciada
      description: |-
        As sessões ativas da conta (dispositivos com sessão iniciada), a começar pela usada mais recentemente. `current` assinala a sessão que faz o pedido. `lastSeenAt` é atualizado no máximo a cada 5 minutos (mais tarde enquanto o servidor estiver muito atrasado); `expiresAt` é o fim absoluto, e o limite de inatividade pode terminar a sessão mais cedo.

        **Limite:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: As sessões ativas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `sessions` ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a base de dados continuou bloqueada), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Terminar a sessão de um dispositivo
      description: |-
        Termina uma sessão da conta; a sessão atual também pode ser terminada. O WebSocket aberto com ela é fechado. Sem corpo (ou `{}`).

        **Limite:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: A sessão foi terminada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
