  - name: data-export
    x-displayName: Exportação de dados
    description: Tudo o que o servidor guarda sobre a conta, num único ficheiro JSON.
  - name: account-deletion
    x-displayName: Eliminação da conta
    description: Eliminar a conta definitivamente.
  - name: game-history
    x-displayName: Histórico de partidas
    description: As partidas do próprio jogador com sessão iniciada, filtradas e paginadas.
  - name: games
    x-displayName: Partidas e PGN
    description: |-
      Os registos das partidas, com os seus lances e relógios, e os respetivos ficheiros PGN.

      **Códigos das partidas.** `status`: 1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (só são guardadas as partidas terminadas). `result`: `1-0`, `0-1`, `1/2-1/2` ou `*` (anulada). `reason`, com o seu nome (`termination`) e as palavras que terminam o texto dos lances do ficheiro PGN (em inglês no ficheiro; a tradução segue entre parênteses); os códigos 7, 14 e 21 são empates (o jogador que ficou sem tempo, abandonou ou saiu da partida enfrentava um adversário que não podia dar mate: FIDE 6.9 e 5.1.2; `DESIGN.md` 6.3 indica a regra), e o servidor nunca termina uma partida com os códigos 4 e 13 (pertencem à lista comum de motivos):

      | Código | `termination` | Palavras no PGN |
      |---|---|---|
      | 1 | `Checkmate` | Checkmate (xeque-mate) |
      | 2 | `Resignation` | Resignation (abandono) |
      | 3 | `Timeout` | Loss on time (derrota por tempo) |
      | 4 | `IllegalMoves` | Second illegal move (forfeit) (segundo lance ilegal: derrota) |
      | 5 | `Stalemate` | Stalemate (afogamento) |
      | 6 | `InsufficientMaterial` | Dead position (insufficient material) (posição morta: material insuficiente) |
      | 7 | `TimeoutVsInsufficient` | Flag fall, but the opponent cannot checkmate (queda da bandeira, mas o adversário não pode dar mate) |
      | 8 | `FivefoldRepetition` | Fivefold repetition (quíntupla repetição) |
      | 9 | `SeventyFiveMoves` | 75-move rule (regra dos 75 lances) |
      | 10 | `ThreefoldClaim` | Threefold repetition (claimed) (tripla repetição reclamada) |
      | 11 | `FiftyMoveClaim` | 50-move rule (claimed) (regra dos 50 lances reclamada) |
      | 12 | `Agreement` | Draw by agreement (empate por acordo) |
      | 13 | `IllegalMovesVsInsufficient` | Second illegal move, but the opponent cannot checkmate (segundo lance ilegal, mas o adversário não pode dar mate) |
      | 14 | `ResignationVsInsufficient` | Resignation, but the opponent cannot checkmate (abandono, mas o adversário não pode dar mate) |
      | 20 | `Abandonment` | Abandoned (disconnected for too long) (saída da partida: desconexão demasiado longa) |
      | 21 | `AbandonmentVsInsufficient` | Abandoned, but the opponent cannot checkmate (saída da partida, mas o adversário não pode dar mate) |
      | 22 | `Aborted` | Game aborted (partida anulada) |
      | 23 | `NoShow` | Aborted: first move not played in time (anulada: primeiro lance não jogado a tempo) |
      | 24 | `Forfeit` | Forfeit (fair play violation) (derrota por falta: violação do fair play) |
      | 25 | `ServerAborted` | Aborted by the server (anulada pelo servidor) |
      | 26 | `BothDisconnected` | Aborted: both players disconnected (anulada: ambos os jogadores se desligaram) |

      O código 14 é novo na versão secundária 1 do protocolo: um cliente escrito antes dela deve mostrar um código desconhecido como um simples fim de partida, com o seu `result`.
  - name: gifs
    x-displayName: GIF animados
    description: |-
      Uma partida em GIF animado, para guardar ou partilhar: o tabuleiro visto de cima, um fotograma por posição, da posição inicial à posição final, os nomes e as pontuações Elo dos jogadores acima do tabuleiro, o último lance abaixo dele e, no último fotograma, o resultado e a forma como a partida terminou.

      **Custo, cache e quotas.** Um GIF é gerado numa thread de renderização própria, nunca nas threads que executam as partidas, e com a prioridade de CPU mais baixa: `GIF_THREADS` threads (`WORKERS` por predefinição), iniciadas com o primeiro GIF e paradas após um minuto sem nenhum. Até `GIF_QUEUE_MAX` (4 × `WORKERS`) GIF aguardam uma thread, no máximo `GIF_QUEUE_TIMEOUT_MS` (10 s) cada um; uma renderização pode durar `GIF_RENDER_TIMEOUT_MS` (30 s). O servidor guarda os GIF que gerou numa cache de `GIF_CACHE_MB` MB (32 × `WORKERS`), da qual saem primeiro os utilizados há mais tempo; um GIF da cache, ou um que esteja a ser gerado para outro pedido, não custa nenhuma renderização. A chave da cache abrange tudo o que altera a imagem, incluindo os nomes.

      Cada pedido conta em `gif` (30 por minuto por jogador para os dois endpoints). Um GIF que tenha de ser gerado conta também nos limites de renderização: por jogador, `GIF_USER_RENDERS_PER_MIN` (4) por minuto e `GIF_USER_RENDERS_PER_HOUR` (30) por hora; por cliente, todas as suas contas em conjunto, `GIF_IP_RENDERS_PER_MIN` (12) por minuto e `GIF_IP_RENDERS_PER_HOUR` (120) por hora, e o triplo por /48 IPv6. Um cliente deve guardar o ficheiro que transferiu em vez de o pedir novamente, e esperar `retryAfter` após um 429 ou um 503.

      Tamanhos: `small` (casas de 32 px: 284 × 350 píxeis), `medium` (48 px: 424 × 515), `large` (72 px: 628 × 762); sem coordenadas, 268 × 342, 400 × 503 e 600 × 748. A posição inicial fica pelo menos 1 s (o atraso, quando é mais longo), a posição final 3 s, e o GIF repete-se em ciclo; após o primeiro fotograma, só é guardada a parte da imagem que muda. Uma partida de 40 lances ocupa cerca de 135, 205 e 325 KiB (pequeno, médio, grande), uma de 150 lances 0,5, 0,8 e 1,2 MiB.
  - name: players
    x-displayName: Jogadores
    description: Perfis públicos e partidas recentes. Apenas dados públicos, nunca um endereço de e-mail, uma sessão, uma sanção ou um nível de integridade. Uma conta eliminada não tem perfil.
  - name: leaderboard
    x-displayName: Classificação
    description: Os melhores jogadores de cada categoria oficial.
  - name: reports
    x-displayName: Denúncias
    description: Denunciar aos moderadores o adversário de uma partida recente.
  - name: pages
    x-displayName: Páginas HTML
    description: |-
      Páginas para um navegador, abertas a partir das ligações dos e-mails. As suas ligações apontam para `https://<SERVER_PUBLIC_HOST>` (com `:<PUBLIC_API_PORT>` quando não é 443), fora de `/api/v1`.

      - As páginas não executam JavaScript nem carregam nenhum recurso externo. São servidas com `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'`.
      - Um `GET` apenas mostra um botão ou um formulário, para que um analisador de correio que abra a ligação não a gaste. A alteração acontece no `POST`: um formulário enviado como `application/x-www-form-urlencoded` (também é aceite um corpo JSON), com o token da ligação num campo oculto. Um campo indicado duas vezes é recusado.
      - Os erros (limites de pedidos, campos inválidos) também são páginas HTML, com o título «Request refused» (pedido recusado) ou, a partir de 500, «Server error» (erro do servidor). Apenas as falhas detetadas antes de a página ser identificada (um destino do pedido demasiado longo ou mal formado, a camada por endereço) recebem resposta em JSON.
