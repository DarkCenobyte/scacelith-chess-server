openapi: 3.1.1
info:
  title: API HTTPS do servidor Scacelith
  version: "1.1.0"
  summary: A API HTTPS de todos os servidores Scacelith, tanto do oficial como dos servidores da comunidade.
  description: |-
    Todos os servidores Scacelith, o oficial `caissa.scacelith.com` e qualquer servidor da comunidade, respondem a esta API HTTPS. O jogo usa-a para tudo o que fica fora de uma partida propriamente dita: a criação de conta e o início de sessão (incluindo a autenticação de dois fatores e o início de sessão com o Google), a página da conta, o histórico de partidas, as transferências de PGN e os GIF animados das partidas, os dispositivos com sessão iniciada, a transferência dos dados, a eliminação da conta e as denúncias.

    O jogo em direto (procura de adversário, desafios, lances, relógios) passa pelo WebSocket do mesmo servidor (`wss://<host>/ws`), aberto com um token de sessão desta API; está descrito em `PROTOCOL.md`, não aqui.

    Os valores predefinidos indicados abaixo são os de um servidor com a configuração inalterada; um servidor da comunidade pode alterá-los (`CONFIG.md` indica todas as definições).

    ## URL de base, porta e transporte

    - Servidor oficial: `https://caissa.scacelith.com/api/v1`, porta TCP 443.
    - Um servidor da comunidade: `https://<SERVER_PUBLIC_HOST>[:<port>]/api/v1`. `API_PORT` é 443 por predefinição; atrás de uma NAT ou de um proxy, a porta que os jogadores usam é `PUBLIC_API_PORT`.
    - O WebSocket do jogo está na mesma porta por predefinição (`WS_PORT` muda-o de porta; `GET /info` indica ao cliente onde se encontra).
    - HTTP/1.1 sobre TLS. Com `TLS_MODE=proxy`, um proxy inverso colocado à frente do servidor termina o TLS. `TLS_MODE=off` (HTTP simples) destina-se apenas ao desenvolvimento local.
    - As páginas HTML abertas a partir das ligações dos e-mails (`/verify-email`, `/reset-password`, `/confirm-email-change`) ficam na raiz do servidor, fora de `/api/v1`. Os endpoints de saúde respondem tanto na raiz como em `/api/v1`. O início de sessão com o Google não tem nenhuma página no servidor: o Google reencaminha o navegador para o próprio jogo, em `127.0.0.1`, ou para uma página do site que o iniciou (`GOOGLE_WEB_REDIRECT_URI`).
    - Uma barra final é ignorada (`/api/v1/info/` equivale a `/api/v1/info`) e os parâmetros de caminho são descodificados do formato URL (um parâmetro que não seja uma codificação URL válida recebe a resposta 400 `invalid_request`).

    ## Pedidos

    - **Corpos JSON.** Os pedidos `POST`, `PUT` e `DELETE` levam um objeto JSON com `Content-Type: application/json`. Um `charset` diferente de UTF-8 é recusado, tal como qualquer outro tipo de conteúdo (415 `unsupported_media_type`). Um corpo vazio conta como `{}`, que é o que recebem os endpoints sem parâmetros (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`).
    - **Tamanho e tempo.** Um corpo está limitado a `HTTP_BODY_LIMIT` bytes (16 384 por predefinição; `POST /gif` tem um limite próprio de 135 168 bytes): 413 `payload_too_large`. Tem de chegar em 10 segundos: 408 `request_timeout`. Depois de qualquer um destes erros, o servidor fecha a ligação.
    - **Esquemas estritos.** Um campo que o endpoint não conhece é recusado, um campo não marcado como opcional é obrigatório, e os tipos e os comprimentos são verificados. Qualquer uma destas falhas resulta em 400 `invalid_request`, com `field` a indicar o campo (com pontos, no caso de um campo aninhado, como `pow.nonce`). As cadeias de carateres não podem conter carateres de controlo. Os comprimentos contam unidades de código UTF-16, pelo que um caráter fora do Plano Multilingue Básico (um emoji) conta duas vezes. Um corpo que não seja JSON resulta em 400 `invalid_json`. `POST /gif` e `POST /reports` verificam eles próprios os seus corpos (ver cada endpoint).
    - **Cadeias de consulta.** Conta a primeira ocorrência de um parâmetro, os parâmetros desconhecidos são ignorados e um `+` é descodificado como espaço: os endpoints que recebem uma categoria de ritmo de jogo aceitam tanto `3%2B2` como `3+2`.
    - **Métodos.** `HEAD` é um `GET` sem o corpo. `OPTIONS` num caminho existente responde 204 com um cabeçalho `Allow` (e os cabeçalhos de uma verificação prévia CORS, ou preflight, descrita abaixo). Qualquer outro método que o caminho não tenha recebe a resposta 405 `method_not_allowed` com `Allow`.
    - **Destino do pedido.** Não pode exceder 4096 carateres (414 `uri_too_long`). Um pedido que não possa sequer ser analisado, ou cuja parte inicial (linha do pedido e cabeçalhos) seja demasiado grande ou chegue demasiado devagar, recebe uma resposta 400, 431 ou 408 vazia e a ligação é fechada.
    - **CORS: uma lista de permissões, desativada por predefinição.** A API serve o jogo, que não envia `Origin`. Com `CORS_ORIGINS` vazio (a predefinição), nunca é enviado nenhum cabeçalho `Access-Control-*`, pelo que nenhuma página web consegue ler uma resposta. `CORS_ORIGINS` enumera as origens web cujas páginas podem chamar a API a partir de um navegador, cada uma exatamente como os navegadores a enviam em `Origin`: `https://host` ou `https://host:port`, em minúsculas, sem caminho, sem barra final e sem a porta predefinida; `http://` apenas para `localhost`, `127.0.0.1` e `[::1]` (desenvolvimento local); sem carateres universais. O servidor oficial define `CORS_ORIGINS=https://scacelith.com,https://www.scacelith.com` para o seu site. Nesse caso:
      - Todas as respostas para um caminho em `/api/v1`, exceto as dos endpoints de saúde, tanto de sucesso como de erro (incluindo o 429 da camada por endereço), levam `Vary: Origin`. Quando o `Origin` do pedido é, byte a byte, uma das origens enumeradas, levam também `Access-Control-Allow-Origin: <that origin>` e, exceto na resposta a uma verificação prévia, `Access-Control-Expose-Headers: Retry-After, Content-Disposition`, para que a página consiga ler os códigos de erro, `Retry-After` e os nomes dos ficheiros das transferências de PGN e GIF.
      - Uma verificação prévia (`OPTIONS` com `Access-Control-Request-Method`) de uma origem enumerada num caminho existente recebe a resposta 204, sem corpo, com `Allow`, `Access-Control-Allow-Origin`, `Access-Control-Allow-Methods` (os métodos de `Allow`), `Access-Control-Allow-Headers: Authorization, Content-Type`, `Access-Control-Max-Age: 600` e `Vary: Origin`. Não precisa de token e não conta para nenhum orçamento de conta nem para nenhum limite de endpoint; como qualquer pedido, consome um token da camada por endereço. Um navegador reutiliza uma verificação prévia durante 10 minutos, mas apenas para esse URL exato, incluindo a cadeia de consulta. Um pedido sem `Authorization` e sem corpo JSON, como `GET /info` ou `GET /leaderboard`, não precisa de verificação prévia.
      - Qualquer outra resposta a uma verificação prévia é uma verificação prévia falhada, mesmo com os cabeçalhos CORS: um 404 para um caminho que não existe, ou o 429 da camada por endereço. O navegador não envia então o pedido, e a página vê um erro de rede, sem a resposta nem o seu `Retry-After`.
      - Nunca é enviado `Access-Control-Allow-Credentials`, nem `Access-Control-Allow-Origin: *`: uma página envia o seu token de sessão em `Authorization: Bearer`, tal como o jogo, e a API não define nenhum cookie. As páginas HTML, os endpoints de saúde e as respostas vazias aos pedidos impossíveis de analisar não levam nenhum cabeçalho CORS. O WebSocket não usa CORS: `WS_ALLOWED_ORIGINS` enumera as páginas que o podem abrir.
      - Uma página de uma origem não enumerada não lê nada, e as suas escritas entre sites nunca são enviadas: os corpos JSON e `Authorization` exigem uma verificação prévia, cuja resposta não tem `Access-Control-Allow-Origin` para essa origem. `Cross-Origin-Resource-Policy: same-origin` mantém-se em todas as respostas: aplica-se apenas aos pedidos `no-cors` (outro site que incorpora uma resposta), nunca aos pedidos `cors` de uma página enumerada.

    ## Respostas e erros

    - As respostas são JSON em UTF-8, exceto a transferência de PGN (`application/x-chess-pgn`), os GIF animados (`image/gif`) e as páginas HTML. Os instantes são milissegundos desde 1970-01-01 UTC. Os IDs são números inteiros. Os IDs das partidas têm até 16 algarismos, mas ficam abaixo de 2^53, pelo que um número JSON (um double) os representa exatamente.
    - Todas as respostas da API levam `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`, `X-Frame-Options: DENY`, `Cross-Origin-Resource-Policy: same-origin` e `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'` (as páginas HTML têm uma política própria). Com `TLS_MODE=native`, levam também `Strict-Transport-Security: max-age=31536000`. As respostas que o serviço de escuta escreve por si próprio, antes da API (as respostas a `GET` e `HEAD` dos endpoints de saúde, o 429 da camada por endereço e um 500 `internal_error` quando a API falha por completo), levam os mesmos cabeçalhos, exceto `Cross-Origin-Resource-Policy`, e o seu `Content-Type` é `application/json` sem charset.
    - Uma resposta tem de ser lida nos 60 segundos seguintes ao momento em que o servidor a tem pronta, o que só importa para as respostas grandes (um GIF, a exportação de dados, um PGN longo). O tempo que o servidor demora a preparar uma resposta não conta para este prazo nem para os 30 segundos sem nenhum byte recebido ou enviado ao fim dos quais uma ligação é fechada.

    Os erros têm uma única forma (o esquema `Error`):

    ```json
    { "error": "snake_case_code", "message": "An English sentence.", "retryAfter": 30 }
    ```

    `message` destina-se aos registos e serve de alternativa; um cliente escolhe o que mostrar a partir de `error`. `retryAfter` (em segundos) só está presente nas recusas que terminam com o passar do tempo, e a resposta leva então também um cabeçalho `Retry-After` com o mesmo valor; a única exceção é o 503 `busy` das leituras do histórico, das partidas, dos jogadores e da classificação, que tem apenas o campo. Alguns erros acrescentam campos: `field` (dados inválidos), `reason` (`weak_password`, `pow_required`), `pow` (`pow_required`), `until` (`banned`), `line` e `column` (`invalid_pgn`).

    Erros que qualquer endpoint pode devolver:

    | Estado | `error` | Quando |
    |---|---|---|
    | 400 | `invalid_request` | O corpo viola o esquema do endpoint (`field` indica onde), o destino do pedido ou `Content-Length` está mal formado, um parâmetro de caminho não é uma codificação URL válida, ou o corpo foi truncado. |
    | 400 | `invalid_json` | O corpo não é JSON. |
    | 401 | `unauthorized` | Falta o cabeçalho `Authorization` num endpoint que exige uma sessão. |
    | 401 | `invalid_token` | O token está mal formado, expirou, foi revogado ou pertence a uma conta eliminada; também nos endpoints em que a sessão é opcional. |
    | 404 | `not_found` | O endpoint não existe. Alguns endpoints também o usam: a partida, o jogador ou a sessão não existe. |
    | 405 | `method_not_allowed` | O caminho existe para outros métodos (ver `Allow`). |
    | 408 | `request_timeout` | O corpo não chegou em 10 segundos. |
    | 413 | `payload_too_large` | O corpo excede `HTTP_BODY_LIMIT` (135 168 bytes para `POST /gif`). |
    | 414 | `uri_too_long` | O destino do pedido excede 4096 carateres. |
    | 415 | `unsupported_media_type` | O corpo não é `application/json`, ou o seu charset não é UTF-8. |
    | 429 | `rate_limited` | Um limite de pedidos (ver abaixo): `retryAfter` e um cabeçalho `Retry-After`. |
    | 500 | `internal_error` | Uma falha inesperada. O servidor regista-a. |
    | 503 | `timeout` | O servidor não respondeu em 30 segundos (60 segundos para a exportação, 45 segundos para os GIF com as definições predefinidas). |
    | 503 | `server_busy` | Uma consulta de sessão ou uma alteração da conta encontrou a base de dados bloqueada (`retryAfter` 1), ou a fila de hash das palavras-passe está cheia (ver abaixo). Também, com um `retryAfter` de 2 a 5, quando o servidor está muito atrasado: para um `POST`, `PUT`, `PATCH` ou `DELETE`, a base de dados tem demasiadas escritas em espera; para qualquer pedido, demasiados pedidos anteriores continuam em execução para além do seu tempo limite, ou o token de sessão não pôde ser verificado em 5 segundos. O pedido não foi executado e os seus limites de pedidos não consumiram nada. |

    Os endpoints de leitura (histórico de partidas, partidas, jogadores, classificação) e a exportação respondem 503 `busy` com `retryAfter: 1` quando a base de dados permaneceu bloqueada.

    Os endpoints que verificam uma palavra-passe ou calculam o seu hash também podem responder com um destes erros, ambos com um `retryAfter` aleatório de 5 a 15 segundos:

    - 503 `server_busy`: a fila de hash das palavras-passe do servidor (`PASSWORD_HASH_QUEUE_MAX`) está cheia, ou o tempo de espera esgotou-se.
    - 429 `rate_limited`: com a fila já meio cheia, este cliente (um endereço IPv4 ou um /48 IPv6) já tem `PASSWORD_HASH_WAITERS_PER_SOURCE` hashes em espera. Este 429 devolve os tokens de limite de pedidos que o pedido consumiu.

    Nada foi alterado e nenhuma tentativa falhada foi contada (exceto em `POST /auth/sso/google/link`, cuja tentativa do ticket e cuja falha da conta foram contadas antes do hash), e uma ligação de reposição continua válida.

    As páginas HTML devolvem os seus erros como páginas HTML, com os mesmos códigos de estado.

    ## Autenticação

    Os endpoints que exigem uma sessão recebem um token bearer no cabeçalho `Authorization` (o esquema `bearerAuth`):

    ```
    Authorization: Bearer sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
    ```

    - **Obter um token.** Um token (`sct_` seguido de 43 carateres base64url) é devolvido por `POST /auth/login`, e depois por `POST /auth/login/mfa` quando a autenticação de dois fatores está ativada, por `POST /auth/sso/google/finish` e `POST /auth/sso/google/link` (início de sessão com o Google) e por `POST /auth/sso/complete`. Todos eles respondem `{ token, expiresAt, user }`. O servidor guarda apenas um hash SHA-256 do token.
    - **Sessão obrigatória.** A falta do cabeçalho resulta em 401 `unauthorized` com `WWW-Authenticate: Bearer realm="scacelith"`. Um token inválido resulta em 401 `invalid_token` com `WWW-Authenticate: Bearer realm="scacelith", error="invalid_token"`. Um cliente deve esquecer um token que receba `invalid_token` e iniciar sessão novamente.
    - **Sessão opcional.** Em `GET /games/{id}`, `GET /games/{id}/pgn`, `GET /players/{username}` e `GET /players/{username}/games`, a sessão é opcional. Sem o cabeçalho, estes endpoints devolvem a vista pública; se for enviado um cabeçalho, o seu token tem de ser válido.
    - **Armazenamento ocupado.** Quando a base de dados permanece bloqueada durante a verificação de um token, um endpoint que exige ou aceita uma sessão responde 503 `server_busy` com `retryAfter: 1` (e `Retry-After`); quando a verificação demora mais de 5 segundos, responde 503 `server_busy` com um `retryAfter` de 2 a 5. Em ambos os casos, o token não foi avaliado: mantenha-o e envie novamente o pedido.
    - **Duração.** Uma sessão termina no primeiro destes prazos: `SESSION_MAX_DAYS` (90) dias após o início de sessão (é o `expiresAt`) ou `SESSION_IDLE_DAYS` (30) dias sem utilização. Cada utilização adia o limite de inatividade; o servidor escreve o novo valor no máximo a cada 5 minutos, em segundo plano. Enquanto a sua base de dados tem muitas escritas em espera, adia essa escrita para um pedido posterior, exceto na última hora antes do limite de inatividade, pelo que uma sessão em utilização não expira. Uma conta mantém no máximo `MAX_SESSIONS_PER_USER` (10) sessões: um novo início de sessão revoga as mais antigas além desse número.
    - **Revogação.** Terminar sessão (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`) revoga sessões; o mesmo fazem uma alteração da palavra-passe (as outras sessões), uma reposição da palavra-passe e a eliminação da conta (todas as sessões), bem como um administrador. Uma revogação feita através da API produz efeito imediatamente, e o WebSocket aberto com uma sessão revogada é fechado. Uma alteração ou reposição da palavra-passe e a eliminação da conta revogam as sessões na mesma transação que a própria alteração: quando uma delas falha, nenhuma sessão foi revogada e também nada mais foi alterado. O servidor guarda em cache as consultas de sessão durante 30 segundos, pelo que uma revogação feita pelo comando de administração, um processo separado, produz efeito no prazo de 30 segundos.
    - **Âmbito.** Um token pertence a um único servidor e também abre o WebSocket desse servidor. Nunca o envie para outro servidor.

    ## Limites de pedidos e outras restrições

    Os limites aplicam-se a um de dois âmbitos. **Cliente:** um endereço IPv4, ou um /64 IPv6 (no modo proxy, o endereço vem de `X-Forwarded-For` enviado por um endereço de `TRUSTED_PROXIES`); alguns limites contam também cada /48 IPv6 no seu conjunto, além de cada uma das suas redes /64. **Jogador:** a conta com sessão iniciada, seja qual for o seu endereço; um limite contado por jogador num endpoint em que a sessão é opcional conta por cliente para um pedido sem token.

    Cada limite é um balde de tokens que comporta `limit` pedidos e se reabastece continuamente à taxa de `limit / window`; `retryAfter` é o tempo até ao próximo token. Os limites marcados como *partilhados* são também contados numa janela deslizante da mesma duração, para que nenhuma janela contenha muito mais de `limit` pedidos. Cada limite é contado para todo o servidor. Quando um dos limites de um endpoint recusa um pedido, os tokens que os seus outros limites consumiram para esse pedido são devolvidos. Uma recusa resulta em 429 `rate_limited` com `retryAfter` e `Retry-After`.

    - **Camada por endereço.** Todos os pedidos (qualquer caminho e método, incluindo os endpoints de saúde e as atualizações para WebSocket) consomem primeiro um token do orçamento do respetivo cliente: `HTTP_RATE_PER_IP` (600) por minuto com uma rajada de meio minuto, e `HTTP_RATE_PER_PREFIX` (4 × `HTTP_RATE_PER_IP`) para um /48 IPv6. Um cliente também pode ter no máximo `IP_MAX_INFLIGHT` (32 × `WORKERS`) pedidos em curso (acima desse número, `retryAfter` 1). Um cliente que insiste apesar das recusas é bloqueado: `ABUSE_BLOCK_REFUSALS_PER_MIN` (600) recusas num minuto bloqueiam-no durante 1 minuto, depois 4, 16 e 60 minutos a cada novo bloqueio no espaço de 6 horas. Uma recusa dos limites `auth`, `auth_*` e `reauth` conta 5; as recusas dos limites contados por jogador nunca contam. Os endereços indicados em `ABUSE_EXEMPT` estão isentos desta camada, mas não do orçamento da conta nem dos limites dos endpoints.
    - **Orçamento da conta.** Todos os pedidos que levam um token de sessão válido contam também para a respetiva conta: `USER_RATE_PER_MIN` (120) por minuto para todos os endpoints em conjunto, seja qual for o endereço, com uma rajada de meio minuto.
    - **Limites dos endpoints:**

    | Limite | Predefinição | Contado por | Endpoints |
    |---|---|---|---|
    | `auth` | `AUTH_RATE_PER_IP` (20) / 10 min, partilhado | cliente, e `AUTH_RATE_PER_PREFIX` (5 × `AUTH_RATE_PER_IP`) por /48 IPv6 | `POST /auth/register`, `/auth/login`, `/auth/login/mfa`, `/auth/verify-email/resend`, `/auth/password/forgot`, `/auth/password/reset`, `/auth/sso/google/link`, `/auth/sso/complete`; `POST /verify-email`, `/reset-password`, `/confirm-email-change` |
    | `auth_register` | `AUTH_REGISTER_PER_HOUR` (10) / hora, partilhado | cliente, o triplo por /48 IPv6 | `POST /auth/register` |
    | `auth_mail` | `AUTH_MAIL_PER_HOUR` (10) / hora, partilhado | cliente, o triplo por /48 IPv6 | `POST /auth/verify-email/resend` |
    | `auth_forgot` | `AUTH_FORGOT_PER_HOUR` (3) / hora, partilhado | cliente, o triplo por /48 IPv6 | `POST /auth/password/forgot` |
    | `auth_forgot_day` | `AUTH_FORGOT_PER_DAY` (10) / 24 horas, partilhado | cliente, o triplo por /48 IPv6 | `POST /auth/password/forgot` |
    | `auth_reset` | `AUTH_RESET_PER_HOUR` (10) / hora, partilhado | cliente, o triplo por /48 IPv6 | `POST /auth/password/reset`, `POST /reset-password` |
    | `reauth` | os valores de `auth`, num balde próprio, partilhado | cliente e /48 IPv6 | `POST /account/password`, `/account/mfa/totp/setup`, `/account/mfa/totp/enable`, `/account/mfa/totp/disable`, `/account/mfa/recovery-codes`, `/account/email`, `/account/export`, `/account/delete` |
    | `reauth_user` | `AUTH_REAUTH_PER_USER` (10) / 10 min, partilhado | jogador | os mesmos endpoints que `reauth` |
    | `account` | 60 / min | jogador | `GET /account/me`, `PUT /account/preferences` |
    | `account_games` | 60 / min | jogador | `GET /account/games` |
    | `account_export` | 5 / hora, partilhado | jogador | `POST /account/export` (verificado antes de `reauth`; todas as tentativas contam) |
    | `sessions` | 60 / min | jogador | `POST /auth/logout`, `/auth/logout-all`, `GET /auth/sessions`, `DELETE /auth/sessions/{id}` |
    | `public_read` | 60 / min | jogador (cliente sem token) | `GET /players/{username}`, `/players/{username}/games`, `/games/{id}`, `/games/{id}/pgn` (um único balde para os quatro) |
    | `gif` | 30 / min | jogador | `GET /games/{id}/gif`, `POST /gif` (um único balde para os dois) |
    | `gif_user_min`, `gif_user_hour` | `GIF_USER_RENDERS_PER_MIN` (4) / min e `GIF_USER_RENDERS_PER_HOUR` (30) / hora, partilhados | jogador | os mesmos dois, apenas quando o GIF tem de ser gerado (não vem da cache) |
    | `gif_ip_min`, `gif_ip_hour` | `GIF_IP_RENDERS_PER_MIN` (12) / min e `GIF_IP_RENDERS_PER_HOUR` (120) / hora, partilhados | cliente (todas as suas contas em conjunto), o triplo por /48 IPv6 | os mesmos, nas mesmas condições |
    | `reports` | 30 / hora | jogador | `POST /reports` |
    | `sso_start` | 30 / 10 min, partilhado | cliente, e 90 por /48 IPv6 | `POST /auth/sso/google/start`, `POST /auth/sso/google/web/start` (em conjunto) |
    | `sso_finish` | 30 / min | cliente | `POST /auth/sso/google/finish` |
    | `page` | 60 / min | cliente | `GET /verify-email`, `/reset-password`, `/confirm-email-change` |

    `GET /info` e `GET /leaderboard` não têm limite próprio: apenas a camada por endereço. Um endpoint com vários limites verifica-os pela ordem indicada na sua descrição.

    O servidor trata um pedido por esta ordem: a camada por endereço, depois os endpoints de saúde; a correspondência do endpoint; as verificações de que o servidor não está muito atrasado (503 `server_busy`): demasiados pedidos anteriores ainda em execução para além do seu tempo limite e, para um `POST`, `PUT`, `PATCH` ou `DELETE`, as escritas pendentes da base de dados; a autenticação, em 5 segundos (503 `server_busy` se demorar mais); o orçamento da conta, quando o pedido leva uma sessão; os limites do endpoint; o corpo; o próprio endpoint (os endpoints de GIF só consomem os seus limites de renderização quando têm um GIF para gerar). Assim, um pedido recusado por causa do seu token não gasta nenhum dos tokens do endpoint, e um pedido com um corpo inválido gasta-os.

    Outras restrições, aplicadas pelos próprios endpoints:

    - **Inícios de sessão falhados num mesmo identificador** (nome de utilizador ou e-mail): a partir de `AUTH_FAILURES_PER_ACCOUNT` (5) falhas, cada tentativa tem de esperar o dobro da anterior (2 s, 4 s e assim sucessivamente, até 15 minutos): 429 `too_many_attempts` com `retryAfter`. O contador volta a zero após uma hora sem falhas.
    - **Segundos fatores falhados no início de sessão:** a mesma regra, a partir do 5.º código errado da conta. Um passo de início de sessão aceita no máximo 5 códigos errados.
    - **Códigos de segundo fator de uma mesma conta:** no máximo `AUTH_MFA_PER_ACCOUNT` (10) códigos (da aplicação de autenticação ou de recuperação, certos ou errados) a cada 15 minutos, a partir de qualquer endereço, no início de sessão e nas reautenticações; acima disso, 429 `too_many_attempts` antes de o código ser verificado, pelo que um código de recuperação não é gasto.
    - **Reautenticações falhadas de uma conta** (palavra-passe ou código errados): a mesma regra (429 `too_many_attempts`), partilhada por todos os endpoints que reautenticam.
    - **E-mails:** um e-mail de confirmação ou de reposição por endereço a cada 5 minutos (a resposta mantém-se igual); um aviso «alguém tentou usar o seu endereço» por endereço e por hora.
    - **Denúncias:** `REPORTS_PER_DAY` (5) por jogador em 24 horas: 429 `report_limit`.

    ## Prova de trabalho

    `POST /auth/register` exige sempre uma prova de trabalho quando `POW_REGISTER_BITS` é superior a 0 (18 por predefinição; `GET /info` indica-o em `pow.register`). `POST /auth/login` e `POST /auth/sso/google/link` (um mesmo tipo de desafio para ambos) só a exigem durante os 5 minutos seguintes a uma vaga de inícios de sessão falhados detetada pelo servidor (`POW_LOGIN_TRIGGER_PER_MIN`, depois `POW_LOGIN_BITS`); o cliente fica a sabê-lo pela resposta.

    1. O pedido sem prova (ou com uma prova recusada) recebe a resposta 428 `pow_required` com `reason` e um desafio `pow` `{ challenge, bits, expiresAt }`.
    2. Encontre um nonce: uma cadeia decimal de no máximo 20 algarismos tal que `SHA-256(challenge + ":" + nonce)` comece por `bits` bits a zero (o bit mais significativo do primeiro byte primeiro). 18 bits exigem cerca de 260 000 hashes em média.
    3. Envie novamente o mesmo pedido com `"pow": { "challenge": "...", "nonce": "123456" }` no corpo.

    Um desafio é válido durante 2 minutos e uma única vez, para um único endpoint e uma única rede de cliente (um endereço IPv4 ou um /64 IPv6). É assinado, pelo que o servidor não guarda nada sobre ele até que regresse. `reason` indica porque é que uma prova foi recusada: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` ou `replayed`.

    ## Reautenticação

    As alterações da conta voltam a pedir a palavra-passe e, quando a autenticação de dois fatores está ativada, um segundo fator:

    - apenas a palavra-passe: `POST /account/password` e `POST /account/mfa/totp/setup`;
    - a palavra-passe e um código da aplicação de autenticação, sendo recusado um código de recuperação: `POST /account/mfa/recovery-codes`;
    - a palavra-passe e um código da aplicação de autenticação ou um código de recuperação: `POST /account/mfa/totp/disable`, `POST /account/email`, `POST /account/export` e `POST /account/delete`.

    Nos corpos, `code` contém um código de 6 algarismos da aplicação de autenticação e `recoveryCode` um código de recuperação (`xxxx-xxxx-xx`; maiúsculas e minúsculas, espaços e hífenes são indiferentes). Um código de recuperação também pode ser enviado em `code` onde os códigos de recuperação são aceites. Cada código funciona uma única vez: um código da aplicação já utilizado é recusado até ao intervalo de 30 segundos seguinte, e um código de recuperação deixa de existir depois de utilizado.

    | Estado | `error` | Quando |
    |---|---|---|
    | 403 | `invalid_password` | Palavra-passe errada, ou a palavra-passe foi reposta ou alterada enquanto o pedido estava em execução (nada foi alterado). |
    | 403 | `mfa_code_required` | A autenticação de dois fatores está ativada e não foi enviado `code` nem `recoveryCode`. |
    | 403 | `invalid_code` | Código errado ou já utilizado. |
    | 400 | `password_not_set` | Uma conta que só inicia sessão com o Google ainda não tem palavra-passe («Esqueceu-se da palavra-passe?» permite definir uma). |
    | 429 | `too_many_attempts` | Demasiadas falhas, ou demasiados códigos tentados, nesta conta. |
    | 503 / 429 | `server_busy` / `rate_limited` | A fila de hash das palavras-passe está ocupada. |

    As palavras-passe e os códigos falhados contam no contador de falhas da conta e são registados como eventos de segurança.

    ## Porta de métricas

    Além da porta da API, o servidor responde em HTTP simples na porta de métricas (`METRICS_PORT`, 9464, associada a `METRICS_BIND`, 127.0.0.1 por predefinição; mantenha-a privada). Não faz parte desta API: `GET /healthz` responde `ok`; `GET /readyz` responde `ready` depois de concluído o arranque (todas as partições voltaram a aplicar o seu diário e os serviços de escuta estão associados às respetivas portas) e até ao início do encerramento, caso contrário 503 `not ready`; `GET /metrics` fornece as métricas do Prometheus e, com `METRICS_TOKEN` definido, exige `Authorization: Bearer <token>` com exatamente esse token.
