        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a fila de hash das palavras-passe, ou a base de dados continuou bloqueada), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /account/mfa/recovery-codes:
    post:
