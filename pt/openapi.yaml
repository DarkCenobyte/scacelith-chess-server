  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: Eliminar a conta
      description: |-
        Elimina a conta; esta ação não pode ser anulada.

        - Todas as sessões são revogadas de imediato: a partir daí, o token recebe 401 `invalid_token`.
        - O nome de utilizador passa a ser `deleted#<id>`, na conta e em todos os registos de partidas.
        - São apagados: o endereço de e-mail, o hash da palavra-passe, o segredo de dois fatores e os códigos de recuperação, as sessões e os tokens de ligação, a associação ao Google, o registo de integridade do sistema antibatota e os endereços IP guardados com os eventos de segurança.
        - As pontuações e as partidas são conservadas. As partidas continuam legíveis com o nome anónimo, e `GET /players/{username}` responde com 404 para o nome anterior.

        **Reautenticação:** a palavra-passe e, com a autenticação de dois fatores, um código da aplicação de autenticação ou um código de recuperação. **Limites:** `reauth` e depois `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: A conta foi eliminada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (uma conta que só usa o Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (reautenticações falhadas, ou demasiados códigos tentados nesta conta), ou `rate_limited` (o limite `reauth` ou `reauth_user`, o orçamento da conta, a fila de hash das palavras-passe).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a fila de hash das palavras-passe, ou a base de dados continuou bloqueada), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Listar as partidas do jogador, filtradas e paginadas
      description: |-
        As partidas do jogador com sessão iniciada, da mais recente para a mais antiga, filtradas e paginadas, com o número de partidas que correspondem ao filtro. Todos os parâmetros de consulta são opcionais, e um valor vazio conta como ausente.

        Paginação: passe o `next` da página anterior como `before`; `next` é `null` na última página. `total` conta as partidas que correspondem ao filtro, em todas as páginas.

        **Limite:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: Um identificador de categoria oficial (`3+2`, ou `3%2B2`), ou `custom` para todas as partidas com outro ritmo de jogo.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Apenas partidas com Elo (`true`) ou amigáveis (`false`).
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Apenas as partidas ganhas, perdidas ou empatadas, do ponto de vista do jogador. As partidas anuladas só aparecem sem este filtro.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Uma página do histórico.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` não é um identificador de partida), `invalid_limit`, ou `invalid_filter` (`category`, `rated` ou `result`), cada um com `field` a indicar o parâmetro.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `account_games` ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (a base de dados continuou bloqueada; `retryAfter: 1` no corpo, sem cabeçalho `Retry-After`), `server_busy` (a procura da sessão encontrou a base de dados bloqueada), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /games/{id}:
