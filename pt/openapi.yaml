  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Transferir uma partida como ficheiro PGN
      description: |-
        A mesma partida como ficheiro PGN: uma única partida com finais de linha `\n`, e o texto dos lances em linhas com menos de 80 colunas. A resposta é a mesma com ou sem token.

        Etiquetas, por esta ordem: `Event` (`<SERVER_NAME> rated <category>` ou `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (a data UTC do início), `Round`, `White`, `Black`, `Result` (`*` para uma partida anulada), `UTCDate` e `UTCTime` (o início), `WhiteElo` e `BlackElo` (as pontuações no início, ou `-`), `WhiteRatingDiff` e `BlackRatingDiff` (as variações, como `+10` e `-10`, em todas as partidas com Elo, `+0` quando as regras de pontuação deixam a pontuação onde estava; uma partida amigável, personalizada ou anulada não tem nenhuma delas), `TimeControl` (em segundos), `Termination` (um valor da norma PGN: `normal`; `time forfeit`, uma queda de bandeira, também quando termina em empate; `abandoned`; `rules infraction`, um segundo lance ilegal ou uma derrota por violação do jogo limpo; `unterminated`, uma partida anulada), `PlyCount`, `ScacelithGameId` (o identificador decimal).

        Cada lance traz `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: o relógio de quem jogou, depois do lance, e o tempo descontado por esse lance, em décimas de segundo (truncadas). Um valor é omitido quando o registo não o tem. Depois do último lance, vem o motivo do fim por extenso e, a seguir, o resultado.

        **Limite:** `public_read` (por jogador com token, por cliente sem token).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: O ficheiro PGN.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'O texto PGN, em UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: não é um número inteiro positivo de no máximo 16 algarismos (inferior a 2^53); `invalid_request`: codificação de URL inválida.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: foi enviado um token que não é válido.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: a partida não existe.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `public_read` ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: entre outros casos, os lances guardados não podem ser reproduzidos até ao fim guardado (o servidor regista-o).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (a base de dados continuou bloqueada; `retryAfter: 1` no corpo, sem cabeçalho `Retry-After`), `server_busy` (a procura da sessão encontrou a base de dados bloqueada), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Transferir uma partida deste servidor como GIF animado
      description: |-
        A partida como GIF animado. Os nomes e as pontuações são os do registo da partida (as pontuações no início, uma conta eliminada como `deleted#<id>`), tal como o resultado e o fim da partida (`Resignation`, `Loss on time`...).

        As verificações são feitas por esta ordem: `gif_disabled`, as opções da imagem (`size`, `orientation`, `delay`, `coords`), o identificador da partida, a partida, a sua extensão.

        **Sessão obrigatória:** as quotas contam por conta. **Limites:** `gif` em todos os pedidos; `gif_user_min`, `gif_user_hour`, `gif_ip_min` e `gif_ip_hour` apenas quando o GIF tem de ser criado (ver a descrição da secção). **Tempo máximo:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 segundos (45 segundos por predefinição).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: O tamanho da imagem, `small` (casas de 32 px), `medium` (48 px) ou `large` (72 px).
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: O lado que fica na parte de baixo do tabuleiro.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Milissegundos por lance (de 1 a 6 algarismos decimais).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Se as letras das colunas e os números das filas são desenhados à volta do tabuleiro (`1`) ou não (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` com `field` (`size`, `orientation`, `delay` ou `coords`): um valor fora dos permitidos. `invalid_game_id`. `invalid_request`: codificação de URL inválida.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: a partida não existe. `gif_disabled`: o servidor desativou os GIF (`GIF_ENABLED=false`; o token de `gif` é devolvido).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `gif`, um limite de renderização ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: não foi possível criar o GIF (o servidor regista o motivo). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` com `retryAfter` (de 3 a 10 segundos) e `Retry-After`: a fila de renderização está cheia, ou o GIF esperou `GIF_QUEUE_TIMEOUT_MS` (10 segundos) por uma thread livre; todos os tokens de limite que o pedido consumiu são devolvidos. `busy`: a base de dados continuou bloqueada (`retryAfter: 1` apenas no corpo). `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Criar um GIF animado de qualquer partida enviada em PGN
      description: |-
        A mesma imagem que `GET /games/{id}/gif` para qualquer partida enviada como texto PGN: uma partida guardada pelo jogo, uma exportação de outro site, uma partida escrita à mão. Só é usada a primeira partida do texto.

        - O leitor de PGN aceita o mesmo que o leitor do próprio jogo: todos os PGN que este servidor escreve e as exportações habituais de outros sites (os comentários, as variantes, os NAG e as anotações de relógio são ignorados; os números dos lances e a notação SAN são lidos com tolerância; uma etiqueta `FEN` dá a posição inicial, a não ser que `SetUp` seja `"0"`).
        - Os nomes e as pontuações vêm das etiquetas `White`, `Black`, `WhiteElo` e `BlackElo`. As letras acentuadas perdem os acentos, os outros carateres fora do ASCII imprimível passam a `?`, e os nomes longos são cortados (48 carateres). O resultado vem da etiqueta `Result` ou, na sua falta, do fim do texto dos lances. A etiqueta `Termination` é mostrada a não ser que seja `normal`: nesse caso, é a posição final que conta a história (xeque-mate, afogamento).
        - Este endpoint verifica ele próprio o corpo: um campo desconhecido, ou um `pgn` em falta ou que não seja uma string, responde com 400 `invalid_request` com `field`; uma opção errada responde com 400 `invalid_option` (`delayMs` tem de ser um número JSON, e `coords` um booleano; `null` é recusado).

        **Sessão obrigatória:** as quotas contam por conta. **Limites:** como em `GET /games/{id}/gif`. **Tamanho máximo do corpo:** 135 168 bytes, seja qual for `HTTP_BODY_LIMIT` (o PGN como string JSON, incluindo os escapes). **Tempo máximo:** 45 segundos por predefinição.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Uma partida curta escrita à mão, sem coordenadas
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: Um ficheiro PGN com todas as opções
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` com `field` (um campo desconhecido, ou `pgn` em falta ou que não é uma string; sem `field` quando o corpo não é um objeto); `invalid_json`; `invalid_option` com `field` (`size`, `orientation`, `delayMs` ou `coords`); `invalid_pgn` com `line` e `column` (a partir de 1, colunas em carateres) e a `message` do leitor: um lance ilegal ou ambíguo, uma etiqueta danificada, uma variante desconhecida, mais de 65 536 bytes.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: o servidor desativou os GIF (`GIF_ENABLED=false`; o token de `gif` é devolvido).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: um corpo com mais de 135 168 bytes.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `gif`, um limite de renderização ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: não foi possível criar o GIF (o servidor regista o motivo). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` com `retryAfter` (de 3 a 10 segundos) e `Retry-After`: a fila de renderização está cheia, ou o GIF esperou demasiado tempo por uma thread livre; todos os tokens de limite que o pedido consumiu são devolvidos. `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /players/{username}:
    get:
      operationId: getPlayer
      tags:
        - players
      summary: Obter o perfil público de um jogador
      description: |-
        O perfil público de um jogador: as pontuações nas categorias oficiais (pela ordem do servidor) e as contagens de partidas. `games.total` conta todas as partidas guardadas, incluindo as amigáveis e as anuladas; `games.rated`, `wins`, `draws` e `losses` são somados sobre os registos de pontuação, portanto só contam as partidas com Elo. A resposta é a mesma com ou sem token.

        **Limite:** `public_read` (por jogador com token, por cliente sem token).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: O perfil.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
              example:
                username: alice
                createdAt: 1790882839743
                ratings:
                  - category: '3+2'
                    rating: 1510
                    provisional: true
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                games:
                  total: 3
                  rated: 2
                  wins: 1
                  draws: 1
                  losses: 0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`: não tem de 2 a 24 carateres de `[A-Za-z0-9_.-]`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: foi enviado um token que não é válido.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: o jogador não existe, ou a conta foi eliminada.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `public_read` ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (a base de dados continuou bloqueada; `retryAfter: 1` no corpo, sem cabeçalho `Retry-After`), `server_busy` (a procura da sessão encontrou a base de dados bloqueada), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /players/{username}/games:
