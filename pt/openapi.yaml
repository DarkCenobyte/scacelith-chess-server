tags:
  - name: server-info
    x-displayName: Informações do servidor
    description: O que um cliente precisa de saber antes de iniciar sessão ou de se ligar.
  - name: health
    x-displayName: Saúde
    description: |-
      Atividade e prontidão do servidor, para monitorização. Respondem na porta da API antes da autenticação e de qualquer limite de endpoint, mas, como qualquer pedido, consomem um token da camada por endereço; um anfitrião de monitorização pode ser incluído em `ABUSE_EXEMPT`. Ambos os caminhos funcionam para cada endpoint: na raiz do servidor e em `/api/v1`.

      A porta de métricas tem endpoints de saúde próprios, descritos na introdução.
  - name: auth
    x-displayName: Registo e início de sessão
    description: |-
      Criação de uma conta, início de sessão com uma palavra-passe (e um segundo fator), e-mails de confirmação e de reposição da palavra-passe.

      `POST /auth/login`, `POST /auth/login/mfa`, `POST /auth/sso/google/finish`, `POST /auth/sso/google/link` e `POST /auth/sso/complete` respondem com uma sessão `{ token, expiresAt, user }` (ou, no caso dos primeiros, com um segundo passo).
  - name: google-sign-in
    x-displayName: Início de sessão com o Google
    description: |-
      Disponível quando `GET /info` indica `sso.google: true`; caso contrário, todos os endpoints abaixo respondem 404 `sso_disabled`. Um site inicia sessão da mesma forma com o seu próprio cliente quando `sso.googleWeb` é true (abaixo, **Num site**). O jogo inicia sessão através do navegador do sistema com o fluxo para aplicações instaladas do RFC 8252 (um cliente do tipo «Desktop app», aplicação para computador): o Google reencaminha o navegador para um serviço de escuta do jogo em `127.0.0.1`, nunca para este servidor, e o jogo nunca vê uma credencial Google.

      1. O cliente fica à escuta em `127.0.0.1:0` (o sistema escolhe a porta) e cria um par PKCE: um `codeVerifier` de 43 a 128 carateres `[A-Za-z0-9._~-]` e `codeChallenge = BASE64URL(SHA-256(codeVerifier))`, que tem 43 carateres e não tem preenchimento.
      2. `POST /auth/sso/google/start`, com o desafio e a porta, devolve o URL do Google e o `state` da tentativa. O cliente verifica o URL (ver abaixo) e abre-o no navegador.
      3. O Google envia o navegador para `http://127.0.0.1:<port>/oauth2/google/<tag>?code=...&state=...`. O cliente aceita apenas o `state` da resposta de início e não envia nada depois de um redirecionamento com `error=`.
      4. `POST /auth/sso/google/finish` com o ID da tentativa, o `codeVerifier`, o `state` e o `code` (e `iss`, quando o Google o enviou).
      5. A resposta é uma sessão, um passo de autenticação de dois fatores (continue com `POST /auth/login/mfa`), `needsUsername` para um novo jogador (continue com `POST /auth/sso/complete`) ou `needsPassword` quando uma conta com palavra-passe usa o endereço (continue com `POST /auth/sso/google/link`).

      **A etiqueta de origem.** O URI de redirecionamento leva uma etiqueta do servidor que o jogador adicionou, para que o jogo recuse um URL que outro servidor obteve para os seus próprios jogadores. A origem é o anfitrião em minúsculas (um literal IPv6 entre parênteses retos), `:` e a porta decimal da API, sempre escrita, incluindo 443: o servidor usa `SERVER_PUBLIC_HOST` e a sua porta pública da API; o jogo, o endereço a que está ligado. A etiqueta é formada pelos primeiros 22 carateres do base64url (sem preenchimento) de SHA-256(UTF-8 `"scacelith-sso-origin-v1\n"` + origem). O URI de redirecionamento é `"http://127.0.0.1:" + port + "/oauth2/google/" + tag`: sempre o literal IPv4 e a porta do serviço de escuta do jogo (1024 a 65535). O servidor nunca aceita um URI, um anfitrião ou um caminho vindos do cliente.

      | Origem | Etiqueta |
      |---|---|
      | `play.scacelith.example:443` | `IhcScoV7eDOzTEcSnqPUPt` |
      | `localhost:8443` | `TFGx7zQ_8QlGZW5zpqznCr` |
      | `[::1]:8443` | `XToJm0DG5PjciEVmZa9Cho` |
      | `127.0.0.1:50443` | `3r653wM5ZjYsHcAJljmCwY` |

      Assim, o início de sessão com o Google só funciona para os jogadores que adicionaram o servidor exatamente com `SERVER_PUBLIC_HOST` e a sua porta pública da API.

      **O que o jogo verifica antes de abrir o navegador.** O `authUrl` começa exatamente por `https://accounts.google.com/o/oauth2/v2/auth?` e é ASCII imprimível com menos de 4096 carateres, e a sua cadeia de consulta tem exatamente um `response_type=code`, exatamente um `redirect_uri` igual ao URI que o jogo calcula a partir da sua porta e da sua etiqueta de origem, exatamente um `state` igual ao `state` da resposta, `code_challenge_method=S256` e um `code_challenge` de 43 carateres. Caso contrário, o jogo para o seu serviço de escuta e não abre nada. Só envia `finish` e `link` para o servidor que respondeu a `start`.

      **Num site.** Um site (o oficial: <https://scacelith.com/>) inicia sessão com um cliente do tipo «Web application» (aplicação Web) do mesmo projeto Google (`GOOGLE_WEB_CLIENT_ID`). O Google reencaminha o navegador para uma página do site configurada pelo administrador do servidor (`GOOGLE_WEB_REDIRECT_URI`, incluída nos URIs de redirecionamento autorizados do cliente, «Authorized redirect URIs»), e essa página envia o código para `finish`; também aqui o servidor não aceita nenhum URI de redirecionamento vindo do cliente.

      1. A página cria um par PKCE como acima, guarda o verificador no separador (`sessionStorage`) e envia `POST /auth/sso/google/web/start` com o desafio.
      2. Verifica o `authUrl` como o jogo faz, exceto que o seu `redirect_uri` tem de ser uma página da sua própria origem, e depois navega para ele. Nenhum script do Google é carregado.
      3. O Google envia o navegador para `GOOGLE_WEB_REDIRECT_URI?code=...&state=...`. A página aceita apenas o `state` da resposta de início e não envia nada depois de um redirecionamento com `error=`.
      4. `finish`, `link` e `complete` seguem-se como para o jogo. A tentativa memoriza que foi iniciada por um site: o código é trocado com o cliente e a página do site, e o token de ID tem de indicar esse cliente (um código ou um token de ID do cliente do jogo falha com 502 `sso_failed`, e vice-versa).

      Uma conta Google dá acesso à mesma conta Scacelith a partir do jogo e do site: a associação guarda o sujeito (subject) do Google (`sub`), que identifica a conta Google seja qual for o cliente. A origem do site tem de constar de `CORS_ORIGINS` (caso contrário, `check-config` emite um aviso).

      **A conta a que o início de sessão com o Google dá acesso:** a conta já associada a essa conta Google; caso contrário, uma conta ativa com o endereço que o Google confirmou (com palavra-passe, `finish` responde `needsPassword` e a associação só é guardada depois de passarem a palavra-passe e, a seguir, o segundo fator, quando está ativado; sem palavra-passe, 409 `sso_account_exists`); caso contrário, uma nova conta (`needsUsername`). Uma conta Google nunca é associada a uma conta existente apenas pelo seu endereço. O endereço da conta recebe um e-mail quando o início de sessão com o Google cria uma conta e quando é adicionado a uma conta existente.
