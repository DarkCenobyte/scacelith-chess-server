      description: |-
        As partidas recentes do jogador, da mais recente para a mais antiga, paginadas como o histórico, mas sem filtros nem total. `color` é o lado deste jogador. `next` é o identificador da última partida sempre que a página está cheia, pelo que a página seguinte pode estar vazia. O jogador é procurado primeiro: um jogador desconhecido dá 404, seja qual for a consulta.

        **Limite:** `public_read` (por jogador com token, por cliente sem token).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Uma página das partidas do jogador.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerGamesPage'
              example:
                username: alice
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                next: 4100000000001
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_cursor` (`before` não é um identificador de partida), `invalid_limit` (estes dois sem `field`).'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: foi enviado um token que não é válido.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: o jogador não existe, ou a conta foi eliminada.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: o limite `public_read` ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (a base de dados continuou bloqueada; `retryAfter: 1` no corpo, sem cabeçalho `Retry-After`), `server_busy` (a procura da sessão encontrou a base de dados bloqueada), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: Obter os melhores jogadores de uma categoria
      description: |-
        Os 100 melhores registos de pontuação de uma categoria oficial com pelo menos `minGames` (`PROVISIONAL_GAMES`) partidas contabilizadas, excluindo as contas eliminadas e os batoteiros confirmados. O servidor volta a calcular cada classificação no máximo a cada 10 segundos; `updatedAt` indica quando. Só é executado um cálculo de cada categoria de cada vez: entretanto, os outros pedidos recebem a lista anterior ou, quando ainda não há nenhuma, esperam pelo cálculo.

        **Limites:** apenas a camada por endereço.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: Um identificador de categoria oficial (`3+2`, ou `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: Quantos jogadores, de 1 a 100. Um número maior de até 3 algarismos conta como 100; um valor vazio conta como ausente.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: A classificação.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (em falta, ou não é uma categoria oficial), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: a camada por endereço.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (a base de dados continuou bloqueada; `retryAfter: 1` no corpo, sem cabeçalho `Retry-After`), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Denunciar o adversário de uma partida recente
      description: |-
        Denuncia o adversário de uma das partidas do próprio jogador que tenha terminado nos últimos 7 dias. Uma denúncia nunca altera, por si só, uma pontuação, uma sanção ou um nível de integridade. Aumenta a prioridade de revisão que os moderadores veem e, exceto para `abuse`, pede a análise da partida pelo motor.

        Uma denúncia do mesmo adversário pela mesma partida recebe a mesma resposta e não altera nada; a resposta nunca revela nada sobre a conta denunciada. `GET /games/{id}` indica antecipadamente aos jogadores da partida se uma denúncia seria aceite (`reportable`).

        Este endpoint verifica ele próprio o corpo, pela ordem `gameId`, `reported`, `category`, `comment`: uma falha responde com 400 `invalid_request` sem `field`. Os campos que não conhece são ignorados.

        **Limites:** `reports` (por jogador) e depois `REPORTS_PER_DAY` (5) denúncias por jogador em 24 horas (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: A denúncia foi recebida (ou já tinha sido apresentada).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (sem `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: não é o adversário do denunciante numa partida que tenha terminado nos últimos 7 dias.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, com um cabeçalho `Retry-After`): `REPORTS_PER_DAY` denúncias nas últimas 24 horas. `rate_limited`: o limite `reports` ou o orçamento da conta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a procura da sessão encontrou a base de dados bloqueada), `timeout`. Também `server_busy` com `retryAfter` de 2 a 5 quando o servidor está muito atrasado (ver a introdução): o pedido não foi executado.'
  /verify-email:
