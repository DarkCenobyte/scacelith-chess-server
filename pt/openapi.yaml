  /reset-password:
    servers:
      - url: https://caissa.scacelith.com
        description: O servidor oficial (as páginas ficam na raiz, fora de `/api/v1`).
      - url: https://{host}:{port}
        description: Qualquer servidor Scacelith (as páginas ficam na raiz, fora de `/api/v1`).
        variables:
          host:
            default: caissa.scacelith.com
            description: O nome de anfitrião público do servidor (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: A porta pública da API (`PUBLIC_API_PORT`, senão `API_PORT`).
    get:
      operationId: showResetPasswordPage
      tags:
        - pages
      summary: Mostrar o formulário de reposição da palavra-passe
      description: |-
        A página de uma ligação de reposição da palavra-passe: o formulário da nova palavra-passe (a palavra-passe duas vezes). O formulário é enviado para `POST /reset-password`.

        **Limite:** `page`.
      security: []
      parameters:
        - $ref: '#/components/parameters/LinkTokenQuery'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: O formulário da nova palavra-passe.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: A ligação é inválida (também quando foi enviada para um endereço que a conta já não tem).
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: O limite `page` (uma página HTML), ou a camada por endereço (`rate_limited` em JSON).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
    post:
      operationId: submitResetPasswordPage
      tags:
        - pages
      summary: Definir uma nova palavra-passe a partir do formulário de reposição
      description: |-
        O formulário da página de reposição; faz o mesmo que `POST /auth/password/reset`, numa única transação: a sessão é terminada em todos os dispositivos, uma alteração de e-mail pendente é cancelada, as outras ligações de reposição deixam de funcionar, o endereço passa a contar como confirmado e o titular recebe um e-mail.

        Primeiro é verificada a ligação, depois se as duas palavras-passe são iguais e, por fim, as regras de palavra-passe. Quando o servidor está ocupado, o formulário volta com `Retry-After` e a ligação continua válida.

        **Limites:** `auth` e depois `auth_reset` (partilhado com `POST /auth/password/reset`).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: A palavra-passe foi alterada, e a sessão foi terminada em todos os dispositivos.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: O formulário de novo com o erro (as palavras-passe são diferentes, uma palavra-passe fraca), a ligação é inválida, ou o formulário é inválido (uma página HTML).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: O limite `auth` ou `auth_reset` (uma página HTML), o formulário de novo com `Retry-After` quando este cliente tem demasiados hashes de palavras-passe em espera (a ligação continua válida), ou a camada por endereço (`rate_limited` em JSON).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'O formulário de novo com `Retry-After` quando o servidor está ocupado (a fila de hash das palavras-passe, ou a base de dados continuou bloqueada); a ligação continua válida. Quando o servidor está muito atrasado (ver a introdução), em vez disso, uma página «Server error» (erro do servidor) com `Retry-After` (de 2 a 5): nada foi executado e a ligação continua válida. Também o esgotamento do tempo limite de processamento.'
  /confirm-email-change:
    servers:
      - url: https://caissa.scacelith.com
        description: O servidor oficial (as páginas ficam na raiz, fora de `/api/v1`).
      - url: https://{host}:{port}
        description: Qualquer servidor Scacelith (as páginas ficam na raiz, fora de `/api/v1`).
        variables:
          host:
            default: caissa.scacelith.com
            description: O nome de anfitrião público do servidor (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: A porta pública da API (`PUBLIC_API_PORT`, senão `API_PORT`).
    get:
      operationId: showConfirmEmailChangePage
      tags:
        - pages
      summary: Mostrar a página de confirmação da alteração de e-mail
      description: |-
        A página de uma ligação de alteração de e-mail: mostra o novo endereço e o nome da conta, com um botão «Use this e-mail address» (usar este endereço de e-mail) que envia o formulário para `POST /confirm-email-change`.

        **Limite:** `page`.
      security: []
      parameters:
        - $ref: '#/components/parameters/LinkTokenQuery'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: A página com o novo endereço e o respetivo botão de confirmação.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: A ligação é inválida ou expirou (também quando o endereço da conta mudou desde o pedido).
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: O limite `page` (uma página HTML), ou a camada por endereço (`rate_limited` em JSON).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
    post:
      operationId: submitConfirmEmailChangePage
      tags:
        - pages
      summary: Confirmar o novo endereço de e-mail
      description: |-
        O formulário da página de alteração de e-mail. O endereço muda e passa a contar como confirmado; os dispositivos mantêm a sessão iniciada; as ligações enviadas antes (confirmação, reposição da palavra-passe, outras alterações) deixam de funcionar; o endereço anterior é avisado, com o novo mascarado.

        **Limite:** `auth`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: lZ50AvPxUwbGqQCwWPIO28ONray7SzW0Cl_sLImwF3Q
          application/json:
            schema:
              $ref: '#/components/schemas/LinkTokenForm'
            example:
              token: lZ50AvPxUwbGqQCwWPIO28ONray7SzW0Cl_sLImwF3Q
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: O endereço foi alterado.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: A ligação é inválida, já foi usada ou expirou, ou o formulário é inválido (uma página HTML).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '409':
          $ref: '#/components/responses/HtmlConflict'
          description: Entretanto, outra conta ficou com o endereço (uma página HTML).
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: O limite `auth` (uma página HTML), ou a camada por endereço (`rate_limited` em JSON).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'A base de dados continuou bloqueada (`Retry-After: 1`), ou o servidor está muito atrasado (`Retry-After` de 2 a 5, ver a introdução): nada foi alterado e a ligação continua a funcionar. Também o esgotamento do tempo limite de processamento.'
  /healthz:
    servers:
      - url: https://caissa.scacelith.com
        description: O servidor oficial, na raiz.
      - url: https://caissa.scacelith.com/api/v1
        description: O servidor oficial, em `/api/v1`.
      - url: https://{host}:{port}
        description: Qualquer servidor Scacelith, na raiz.
        variables:
          host:
            default: caissa.scacelith.com
            description: O nome de anfitrião público do servidor (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: A porta pública da API (`PUBLIC_API_PORT`, senão `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Qualquer servidor Scacelith, em `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: O nome de anfitrião público do servidor (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: A porta pública da API (`PUBLIC_API_PORT`, senão `API_PORT`).
    get:
      operationId: getLiveness
      tags:
        - health
      summary: Verificar se o processo está em execução
      description: |-
        Responde com 200 `ok` enquanto o processo estiver em execução. `HEAD` também funciona. Qualquer outro método responde com 405 `method_not_allowed` com `Allow: GET, HEAD` (incluindo `OPTIONS`).

        **Limites:** apenas a camada por endereço.
      security: []
      responses:
        '200':
          description: O processo está em execução.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
              example:
                status: ok
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: a camada por endereço.'
  /readyz:
    servers:
      - url: https://caissa.scacelith.com
        description: O servidor oficial, na raiz.
      - url: https://caissa.scacelith.com/api/v1
        description: O servidor oficial, em `/api/v1`.
      - url: https://{host}:{port}
        description: Qualquer servidor Scacelith, na raiz.
        variables:
          host:
            default: caissa.scacelith.com
            description: O nome de anfitrião público do servidor (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: A porta pública da API (`PUBLIC_API_PORT`, senão `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Qualquer servidor Scacelith, em `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: O nome de anfitrião público do servidor (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: A porta pública da API (`PUBLIC_API_PORT`, senão `API_PORT`).
    get:
      operationId: getReadiness
      tags:
        - health
      summary: Verificar se o servidor aceita jogadores
      description: |-
        Responde com 200 `ready` quando o servidor aceita jogadores, e com 503 `not_ready` enquanto está a arrancar ou a parar. `HEAD` também funciona. Qualquer outro método responde com 405 `method_not_allowed` com `Allow: GET, HEAD` (incluindo `OPTIONS`).

        **Limites:** apenas a camada por endereço.
      security: []
      responses:
        '200':
          description: O servidor aceita jogadores.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: a camada por endereço.'
        '503':
          description: O servidor está a arrancar ou a parar.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Um token de sessão (`sct_` seguido de 43 carateres base64url) obtido numa resposta de início de sessão, no cabeçalho `Authorization`: `Authorization: Bearer <token>`. O prefixo é exatamente `Bearer` (sensível a maiúsculas e minúsculas) seguido de um espaço; um valor que não o tenha, ou um token que não tenha de 1 a 512 carateres ASCII imprimíveis, responde com 401 `invalid_token`, como qualquer outro token inválido. Um cabeçalho vazio conta como ausência de cabeçalho.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: O identificador da partida, um número inteiro decimal positivo de no máximo 16 algarismos, sem zeros à esquerda, inferior a 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: O identificador da sessão, tal como `GET /auth/sessions` o fornece, escrito sem zeros à esquerda (`03` não é a sessão 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: O nome de utilizador do jogador, sem distinção entre maiúsculas e minúsculas. O servidor aceita qualquer nome com 2 a 24 carateres de `[A-Za-z0-9_.-]` (a regra mais ampla que alguma vez permitiu).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Um identificador de partida; só são listadas as partidas mais antigas. Passe o `next` da página anterior. Um valor vazio conta como ausente.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: O tamanho da página, de 1 a 50. Um número maior de até 3 algarismos conta como 50; um valor vazio conta como ausente.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: O token da ligação do e-mail (43 carateres base64url). Um token em falta ou errado mostra a página «link invalid or expired» (ligação inválida ou expirada).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Todas as respostas do servidor proíbem o armazenamento em cache.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Segundos a aguardar antes de tentar novamente; o mesmo valor que `retryAfter` no corpo.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: O desafio bearer, com `error="invalid_token"` para um token inválido.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: O servidor fecha a ligação depois desta resposta.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (com `field` quando o problema está num campo do corpo) ou `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Um campo viola o esquema
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: O corpo não é JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Uma palavra-passe fraca
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: Um PGN que não pode ser lido
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (sem cabeçalho `Authorization`) ou `invalid_token` (o token está mal formado, expirou, foi revogado ou pertence a uma conta eliminada).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Sem sessão
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Um token inválido
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: O pedido é recusado.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Uma palavra-passe errada na reautenticação
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Uma conta suspensa
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found`, ou uma funcionalidade que este servidor desativou.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: o corpo não chegou no prazo de 10 segundos. O servidor fecha a ligação.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: O pedido entra em conflito com o estado do servidor.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: a tentativa de início de sessão com o Google ou o ticket é desconhecido, já foi usado ou expirou; recomece o início de sessão.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: o corpo excede `HTTP_BODY_LIMIT` (16 384 bytes por predefinição). O servidor fecha a ligação.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: o destino do pedido excede 4096 carateres.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: o corpo não é `application/json`, ou o seu charset não é UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: a partida tem mais de `GIF_MAX_PLIES` (600) meios-lances.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: resolva o desafio `pow` e envie de novo o mesmo pedido com `pow: { challenge, nonce }`. `reason` indica o motivo: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` ou `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (um limite de pedidos, o orçamento da conta ou a fila de hash das palavras-passe) ou `too_many_attempts` (uma restrição própria da conta), com `retryAfter` e um cabeçalho `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Um limite de pedidos
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Demasiadas falhas nesta conta
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: uma falha inesperada. O servidor regista-a.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: um `state` ou um `iss` errado, ou o Google recusou o código ou enviou um token de ID que não passa na verificação (incluindo um código ou um token de ID do outro cliente, o do jogo ou o do site). Nunca inclui o texto do Google.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` ou `timeout`: tente novamente após `retryAfter`, quando for indicado.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: O servidor está ocupado
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: A base de dados continuou bloqueada (uma leitura)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: O servidor demorou demasiado tempo
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: O GIF animado, como anexo.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` para uma partida deste servidor, `attachment; filename="scacelith-game.gif"` para um PGN enviado com `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: O tamanho do ficheiro em bytes.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: Uma página HTML.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: Uma página HTML que explica a recusa.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: O formulário não chegou no prazo de 10 segundos (uma página HTML). O servidor fecha a ligação.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: Uma página HTML que explica o conflito.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: O formulário excede `HTTP_BODY_LIMIT` (uma página HTML). O servidor fecha a ligação.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: O corpo não é um formulário (`application/x-www-form-urlencoded`) nem JSON, ou o seu charset não é UTF-8 (uma página HTML).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Um limite de pedidos (uma página HTML), com `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Uma falha inesperada (uma página HTML intitulada «Server error», erro do servidor). O servidor regista-a.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: O servidor está ocupado (a base de dados continuou bloqueada, ou o servidor está muito atrasado; com `Retry-After`) ou demorou demasiado tempo (uma página HTML intitulada «Server error», erro do servidor).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: A forma única de todas as respostas de erro da API JSON.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: O código de erro em `snake_case`. É a partir dele que um cliente escolhe o que mostrar.
          examples:
            - rate_limited
        message:
          type: string
          description: Uma frase em inglês, destinada aos registos e a servir de alternativa.
        retryAfter:
          type: integer
          minimum: 1
          description: Segundos a aguardar antes de tentar novamente, presente apenas nas recusas que terminam com o tempo. A resposta traz então também um cabeçalho `Retry-After` com o mesmo valor, exceto o 503 `busy` das leituras do histórico, das partidas, dos jogadores e da classificação.
        field:
          type: string
          description: O campo ou parâmetro de consulta em causa (`invalid_request`, `invalid_option`, e `invalid_cursor`, `invalid_limit` e `invalid_filter` de `GET /account/games`). Um campo aninhado é escrito com pontos (`pow.nonce`).
        reason:
          type: string
          description: 'O motivo: a regra que um `weak_password` viola, ou a razão pela qual foi pedida ou recusada uma prova de trabalho (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Apenas `banned`: o fim da suspensão (ms desde a época Unix), `null` para uma suspensão permanente.'
        line:
          type: integer
          minimum: 1
          description: 'Apenas `invalid_pgn`: a linha do erro, a partir de 1.'
        column:
          type: integer
          minimum: 1
          description: 'Apenas `invalid_pgn`: a coluna do erro, a partir de 1, em carateres.'
    PowChallenge:
      type: object
      description: Um desafio de prova de trabalho (o `pow` de um 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: O desafio assinado, a devolver tal como está.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: O número de bits iniciais a zero que `SHA-256(challenge + ":" + nonce)` tem de ter.
        expiresAt:
          type: integer
          format: int64
          description: Quando o desafio expira (ms desde a época Unix), 2 minutos depois de ter sido emitido.
    PowAnswer:
      type: object
      description: A resposta a um desafio de prova de trabalho.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: O `challenge` da resposta 428, tal como foi fornecido.
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Uma string decimal de no máximo 20 algarismos tal que `SHA-256(challenge + ":" + nonce)` comece com `bits` bits a zero.
    ServerInfo:
      type: object
      description: Aquilo de que um cliente precisa antes de iniciar sessão ou de se ligar.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: O nome do servidor (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: Um UUID que a base de dados recebe no primeiro arranque. Mantém-se igual entre reinícios. É `null` quando a base de dados não o consegue fornecer.
        motd:
          type: string
          description: A mensagem do dia (`SERVER_MOTD`), possivelmente vazia.
        protocol:
          type: object
          description: O protocolo WebSocket (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: A versão mais antiga do protocolo que o servidor fala.
            max:
              type: integer
              minimum: 1
              description: A versão mais recente do protocolo que o servidor fala.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'A impressão digital do esquema do protocolo (os 4 primeiros bytes do SHA-256 da sua forma canónica, como inteiro sem sinal: `0xc649140f`, 3326678031, para a versão menor 2 do protocolo); informativa, nunca é comparada.'
            subprotocol:
              type: string
              description: O token do subprotocolo WebSocket (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: A porta WebSocket que os jogadores usam (`PUBLIC_WS_PORT`, senão `WS_PORT`, senão `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: O caminho do WebSocket.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Se é possível criar novas contas.
        emailVerification:
          type: boolean
          description: Se as novas contas confirmam o seu endereço (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Se o início de sessão com o Google é oferecido ao jogo.
            googleWeb:
              type: boolean
              description: Se o início de sessão com o Google também é oferecido a um site (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: A autenticação de dois fatores está sempre disponível.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Os bits de prova de trabalho que o registo exige (0 para nenhum).
        categories:
          type: array
          description: Os ritmos de jogo oficiais, com Elo (`RATED_CATEGORIES`), pela ordem do servidor. Qualquer outro ritmo de jogo é `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: As regras que um cliente pode verificar antes de enviar um formulário.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: O comprimento mínimo de um nome de utilizador (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: O comprimento máximo de um nome de utilizador (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: A expressão regular a que um novo nome de utilizador tem de corresponder.
            passwordMinLength:
              type: integer
              description: O comprimento mínimo de uma palavra-passe, em carateres (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: O comprimento máximo de uma palavra-passe, em bytes de UTF-8.
            customTimeControls:
              type: boolean
              description: Se os desafios e as partidas privadas podem usar ritmos de jogo personalizados.
            reportsPerDay:
              type: integer
              description: Quantas denúncias um jogador pode apresentar por cada 24 horas (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: A maior mensagem WebSocket que um cliente pode enviar, em bytes.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Um ritmo de jogo oficial.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: O identificador da categoria, minutos e segundos de incremento (`3+2`).
        baseSec:
          type: number
          minimum: 0
          description: O tempo base, em segundos.
        incSec:
          type: number
          minimum: 0
          description: O incremento por lance, em segundos.
    AccountView:
      type: object
      description: A conta tal como o seu jogador a vê (`user` das respostas de início de sessão e de `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: O identificador da conta.
        username:
          type: string
          description: O nome de utilizador.
        email:
          type: string
          format: email
          description: O endereço de e-mail.
        emailVerified:
          type: boolean
          description: Se o endereço está confirmado.
        mfaEnabled:
          type: boolean
          description: Se a autenticação de dois fatores está ativada.
        googleLinked:
          type: boolean
          description: Se há uma conta Google associada.
        hasPassword:
          type: boolean
          description: '`false` para uma conta criada através do Google que ainda não definiu uma palavra-passe.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Se são aceites desafios diretos pelo nome (ver `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Quando a conta foi criada (ms desde a época Unix).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: O último início de sessão (ms desde a época Unix), ou `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: O novo endereço de uma alteração de e-mail à espera da respetiva ligação, ou `null`.
    SessionAnswer:
      type: object
      description: Uma nova sessão.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: O token de sessão, para o cabeçalho `Authorization` e para o WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: O fim absoluto da sessão (ms desde a época Unix); o limite de inatividade pode terminá-la mais cedo.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: O segundo passo de um início de sessão com autenticação de dois fatores; continue com `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: O token do passo, para `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Segundos restantes para concluir o passo.
    LoginAnswer:
      description: Uma sessão, ou o segundo passo de um início de sessão com autenticação de dois fatores.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Um primeiro início de sessão com o Google; continue com `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: O ticket para `POST /auth/sso/complete`, válido durante 10 minutos.
        suggestedUsername:
          type: string
          description: Um nome de utilizador criado a partir do nome Google ou do endereço, ou `""` quando nada serve.
    SsoNeedsPassword:
      type: object
      description: Uma conta com palavra-passe usa o endereço; continue com `POST /auth/sso/google/link`. Ainda não foi associado nada.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: O ticket para `POST /auth/sso/google/link`.
        username:
          type: string
          description: O nome de utilizador dessa conta (só o vê quem comprovou junto do Google que o endereço é seu).
        expiresIn:
          type: integer
          const: 600
          description: Segundos durante os quais o ticket continua válido.
    SsoFinishAnswer:
      description: A resposta de `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Uma tentativa de início de sessão com o Google.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: A tentativa, para `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: O URL do Google a abrir no navegador do sistema, depois de verificado.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: O `state` que o Google tem de devolver.
        expiresIn:
          type: integer
          const: 600
          description: Segundos durante os quais a tentativa continua válida.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: O nome de utilizador; aplicam-se depois as regras do servidor (ver a descrição).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: O endereço de e-mail. Os espaços no início e no fim são removidos e é guardado em minúsculas.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: A palavra-passe; aplicam-se depois as regras de palavra-passe.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: O nome de utilizador, ou o endereço de e-mail (qualquer texto com `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Opcional. Mostrado na lista de dispositivos com sessão iniciada (por exemplo, `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: O `mfaToken` da resposta de início de sessão (ou da de um início de sessão com o Google).
        code:
          type: string
          maxLength: 32
          description: Opcional. Um código de 6 algarismos da aplicação de autenticação, ou um código de recuperação.
        recoveryCode:
          type: string
          maxLength: 32
          description: Opcional. Um código de recuperação. É necessário um dos dois, `code` ou `recoveryCode`.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: O endereço de e-mail.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: O parâmetro `token` da ligação de reposição.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: A nova palavra-passe; aplicam-se as regras de palavra-passe do registo.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: O desafio PKCE S256 do `codeVerifier` do cliente (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: A porta em que o cliente está à escuta em `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: O desafio PKCE S256 do `codeVerifier` da página (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: O `attemptId` de `POST /auth/sso/google/start`.
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: O verificador PKCE; o seu SHA-256 tem de corresponder ao desafio dado a `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: O `state` tal como o Google o devolveu.
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: O `code` tal como o Google o devolveu (ASCII imprimível sem espaços).
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Opcional. O `iss` tal como o Google o devolveu, quando o devolveu.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: O `linkTicket` de `finish`, válido durante 10 minutos.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: A palavra-passe da conta.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: O `ssoTicket` de `finish`, válido durante 10 minutos.
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: O nome de utilizador; aplicam-se as regras do registo.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: As sessões ativas, a começar pela usada mais recentemente.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Uma sessão ativa (um dispositivo com sessão iniciada).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: O identificador da sessão, para `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: O início de sessão (ms desde a época Unix).
        lastSeenAt:
          type: integer
          format: int64
          description: A última utilização (ms desde a época Unix), atualizada no máximo a cada 5 minutos (mais tarde enquanto o servidor estiver muito atrasado).
        expiresAt:
          type: integer
          format: int64
          description: O fim absoluto (ms desde a época Unix); o limite de inatividade pode terminar a sessão mais cedo.
        clientLabel:
          type:
            - string
            - 'null'
          description: O `clientLabel` do início de sessão, ou `null` quando não foi enviado nenhum.
        current:
          type: boolean
          description: Se esta é a sessão que faz o pedido.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Um registo por cada categoria em que o jogador jogou partidas com Elo.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: As sanções ativas.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }` enquanto a conta estiver suspensa; caso contrário, `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: O registo de pontuação de uma categoria.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: O identificador da categoria.
        rating:
          type: integer
          description: A pontuação.
        games:
          type: integer
          minimum: 0
          description: As partidas jogadas na categoria (contabilizadas ou não).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: A pontuação mais alta alcançada.
        provisional:
          type: boolean
          description: '`true` enquanto a pontuação ainda não estiver estabelecida ou tiver menos de `PROVISIONAL_GAMES` partidas contabilizadas (o jogo mostra-a como `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: O tipo de sanção.
        reason:
          type:
            - string
            - 'null'
          description: O motivo indicado, se existir.
        startsAt:
          type: integer
          format: int64
          description: O início (ms desde a época Unix).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: O fim (ms desde a época Unix), `null` quando a sanção é permanente.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: O fim da suspensão (ms desde a época Unix), `null` quando é permanente.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` para aceitar desafios diretos pelo nome, `none` para os recusar.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: A palavra-passe atual.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: A nova palavra-passe; aplicam-se as regras de palavra-passe do registo.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: A palavra-passe da conta.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Um código do segredo pendente, com exatamente 6 algarismos.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: A palavra-passe da conta.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Opcional; necessário com a autenticação de dois fatores (ou `recoveryCode`). Um código da aplicação de autenticação ou um código de recuperação.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Opcional. Um código de recuperação (`xxxx-xxxx-xx`; as maiúsculas e minúsculas, os espaços e os hífenes não importam).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: A palavra-passe da conta.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Um código da aplicação de autenticação (um código de recuperação é recusado).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: O novo endereço; os espaços no início e no fim são removidos e é convertido em minúsculas, e depois é verificado como um endereço de registo.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: A palavra-passe da conta.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Opcional; necessário com a autenticação de dois fatores (ou `recoveryCode`). Um código da aplicação de autenticação ou um código de recuperação.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Opcional. Um código de recuperação.
    TotpSetup:
      type: object
      description: O segredo pendente para a aplicação de autenticação.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: O segredo em base32, para introduzir na aplicação.
        uri:
          type: string
          format: uri
          description: O URI `otpauth://totp/...`, para mostrar como código QR.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Segundos por intervalo.
    RecoveryCodeList:
      type: array
      description: Os 10 códigos de recuperação, mostrados apenas desta vez. Cada um funciona uma única vez.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Um dos lados de uma partida.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: O nome no registo da partida (`deleted#<id>` para uma conta eliminada).
        rating:
          type:
            - integer
            - 'null'
          description: A pontuação no início, `null` quando é desconhecida.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: A pontuação depois da partida. Uma partida com Elo tem-na sempre; `null` apenas para uma partida que não conta para as pontuações (amigável, personalizada, anulada).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: A variação da pontuação, `0` quando as regras de pontuação deixam a pontuação onde estava (um resultado de zero pontos segundo a FIDE, um adversário sem pontuação estabelecida, as primeiras partidas de um jogador sem pontuação estabelecida); `null` nos mesmos casos que `ratingAfter`.
    GameSummary:
      type: object
      description: O resumo de uma partida guardada.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: O identificador da partida.
        category:
          type: string
          description: O identificador da categoria oficial (`3+2`), ou `custom`.
        rated:
          type: boolean
          description: Se a partida conta para as pontuações.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: O ritmo de jogo em segundos (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (ver os códigos das partidas).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: O código do motivo do fim (ver os códigos das partidas).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: O resultado, `*` para uma partida anulada.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: O número de meios-lances.
        startedAt:
          type: integer
          format: int64
          description: O início (ms desde a época Unix).
        endedAt:
          type: integer
          format: int64
          description: O fim (ms desde a época Unix).
    Termination:
      type: string
      description: O nome do motivo do fim (ver os códigos das partidas); `Unknown` para um código que o protocolo não conhece.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Um resumo de partida do ponto de vista de um jogador.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: O lado do jogador.
    HistoryGameSummary:
      description: Uma partida do histórico do jogador com sessão iniciada.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: O tempo base em milissegundos.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: O incremento em milissegundos.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: O desfecho do ponto de vista do jogador.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: As partidas da página, da mais recente para a mais antiga.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: O identificador a passar como `before` para a página seguinte, ou `null` na última página.
        total:
          type: integer
          minimum: 0
          description: O número de partidas que correspondem ao filtro, em todas as páginas.
    MoveRecord:
      type: object
      description: Um meio-lance de uma partida.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: O lance em notação UCI, com `n`, `b`, `r` ou `q` acrescentado numa promoção.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: O tempo descontado pelo lance (ms), `null` quando o registo não o tem.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: O relógio de quem jogou, depois do lance (ms), `null` quando o registo não o tem.
    PgnTagsView:
      type: object
      description: As principais etiquetas PGN, para apresentação. Aqui, `Termination` é o nome do motivo do fim; o ficheiro PGN usa os valores da norma PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` ou `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: A data UTC do início.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: A pontuação no início, ou `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: A pontuação no início, ou `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: O registo de uma partida com os seus lances e relógios. Tem os campos de um resumo de partida, sem `color` nem `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: O tempo base em milissegundos.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: O incremento em milissegundos.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: O nome de `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: O identificador da partida de que esta é a desforra, ou `null`.
            moves:
              type: array
              description: Uma entrada por meio-lance.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Apenas quando o jogador do token jogou esta partida; o seu lado.
            reportable:
              type: boolean
              description: Apenas quando o jogador do token jogou esta partida; `true` quando `POST /reports` aceitaria agora uma denúncia do adversário por esta partida (a partida terminou há menos de 7 dias, a quota diária não está esgotada e o adversário ainda não foi denunciado por esta partida).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: O nome de utilizador, tal como o jogador o escreveu.
        createdAt:
          type: integer
          format: int64
          description: Quando a conta foi criada (ms desde a época Unix).
        ratings:
          type: array
          description: Apenas as categorias oficiais, pela ordem do servidor.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Todas as partidas guardadas, incluindo as amigáveis e as anuladas.
            rated:
              type: integer
              minimum: 0
              description: As partidas com Elo, somadas sobre os registos de pontuação.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: O nome de utilizador, tal como o jogador o escreveu.
        games:
          type: array
          description: As partidas da página, da mais recente para a mais antiga.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: O identificador da última partida sempre que a página está cheia (a página seguinte pode então estar vazia); caso contrário, `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: O identificador da categoria.
        minGames:
          type: integer
          minimum: 0
          description: As partidas contabilizadas de que um registo precisa para ser listado (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Quando a classificação foi calculada (ms desde a época Unix).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: O texto PGN, no máximo 65 536 bytes de UTF-8. Só é usada a primeira partida.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Opcional. O tamanho da imagem.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Opcional. O lado que fica na parte de baixo do tabuleiro.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Opcional. Milissegundos por lance, um número JSON com valor inteiro.
        coords:
          type: boolean
          default: true
          description: Opcional. Se as letras das colunas e os números das filas são desenhados à volta do tabuleiro.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: A partida, como número inteiro ou como string de 1 a 16 algarismos.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: O nome de utilizador do adversário, tal como no registo da partida ou tal como é agora, sem distinção entre maiúsculas e minúsculas. Não pode estar em branco.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: O motivo da denúncia.
        comment:
          type:
            - string
            - 'null'
          description: Opcional. No máximo 500 carateres, depois de removidos os carateres de controlo (exceto a tabulação e a mudança de linha) e os espaços no início e no fim do texto.
    AccountExport:
      type: object
      description: Tudo o que o servidor conserva sobre a conta (datas em ms desde a época Unix).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Quando a exportação foi feita.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: O que o ficheiro contém e o que deixa de fora, em inglês simples, para o jogador.
          items:
            type: string
        account:
          description: A vista da conta de `GET /account/me`, com `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: O endereço da conta Google associada, ou `null`.
        ratings:
          type: array
          description: Os registos de pontuação completos.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Os pontos de Elo devolvidos depois de se ter apurado que um adversário fazia batota, somados por dia UTC e por categoria, do mais recente para o mais antigo. Nem as partidas nem os batoteiros são identificados.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Todas as sessões guardadas, da mais recente para a mais antiga, sem nenhum token. A limpeza de retenção elimina uma sessão expirada, e uma sessão terminada um dia depois do fim de sessão.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Os eventos de segurança, do mais recente para o mais antigo, conservados durante `RETENTION_SECURITY_DAYS` dias.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Todas as sanções, incluindo as levantadas. O nome do moderador nunca é incluído.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Os eventos de conduta registados para as partidas do jogador abandonadas, anuladas e sem primeiro lance a tempo, conservados durante 30 dias.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: As denúncias que o jogador fez.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: O número de partidas.
            list:
              type: array
              description: Todas as partidas, da mais recente para a mais antiga, como resumos de `GET /account/games`. Os lances estão em `GET /games/{id}` e o PGN em `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Um registo de pontuação completo.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Se o jogador já saiu da fase sem pontuação estabelecida.
            countedGames:
              type: integer
              minimum: 0
              description: As partidas que entraram no cálculo da pontuação.
            updatedAt:
              type: integer
              format: int64
              description: Quando o registo foi alterado pela última vez.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: As 00:00 UTC do dia (ms desde a época Unix).
        category:
          type: string
        points:
          type: integer
          description: Os pontos devolvidos nesse dia nessa categoria.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Quando a sessão foi terminada, ou `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: O endereço do início de sessão, apagado ao fim de `RETENTION_IP_DAYS` dias.
    SecurityEvent:
      type: object
      description: |-
        Um evento de segurança. `ip` só é indicado para o que foi feito com sessão iniciada, com a palavra-passe da conta (e o segundo fator) ou com uma ligação enviada para o seu endereço: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` e `account_exported`; todos os outros tipos têm `ip: null`, e `ip` é apagado ao fim de `RETENTION_IP_DAYS` dias.

        `detail` só conserva estes campos: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` e `method` (`password` ou `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` e `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Um evento `moderator_action` só conserva `{ action }`, para as ações `ban`, `unban`, `reset_mfa`, `verify_email` e `revoke_sessions` (as outras ações dos moderadores ficam de fora). Todos os outros tipos têm `detail: null`. Os eventos `rating_refund` ficam de fora: os seus pontos estão em `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: O tipo de evento (`login`, `password_changed`...).
        at:
          type: integer
          format: int64
          description: Quando aconteceu.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: O nome público atual do jogador denunciado.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Se a denúncia ainda está aberta (não é indicado se o jogador denunciado foi sancionado).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: O token da ligação do e-mail (o campo oculto do formulário da página).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: O token da ligação de reposição (o campo oculto do formulário).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: A nova palavra-passe; aplicam-se as regras de palavra-passe do registo.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: A nova palavra-passe outra vez; tem de ser igual.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: Uma página HTML em UTF-8 (`text/html; charset=utf-8`), sem JavaScript nem recursos externos.
