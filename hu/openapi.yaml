paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: A szerver nevének, verzióinak, portjainak és regisztrációs szabályainak lekérése
      description: |-
        Amire a kliensnek szüksége van, mielőtt bejelentkezik vagy csatlakozik: a szerver neve és azonosítója, a WebSocket-protokoll verziói és a WebSocket helye, a regisztrációs szabályok, a hivatalos játékidők, valamint azok a korlátok, amelyeket a kliens egy űrlap elküldése előtt ellenőrizhet.

        **Korlátok:** csak a címenkénti réteg.
      security: []
      responses:
        '200':
          description: A szerver leírása.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: a címenkénti réteg.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Fiók létrehozása
      description: |-
        Fiókot hoz létre: amint az e-mail-címét a címre küldött linkkel megerősítették, vagy e-mail-megerősítés nélkül azonnal.

        **E-mail-megerősítéssel** (`REQUIRE_EMAIL_VERIFICATION`, alapértelmezés): 202 `verification_sent`. Fiók még nem létezik: a regisztráció 24 órán át függőben van, és addig lefoglalja a felhasználónevet. A címre egy erre a 24 órára érvényes link megy ki, címenként legfeljebb 5 percenként egy (a `POST /auth/verify-email/resend` újat küld); a fiók a link használatakor (a `/verify-email` oldal gombjával) jön létre, megerősített címmel, és a játékos ezután bejelentkezhet. Addig az ezzel a felhasználónévvel történő bejelentkezés válasza `invalid_credentials`, mint egy ismeretlen fióknál, és a nyilvános profil nem létezik. Egy ugyanazzal a címmel történő új regisztráció felváltja a függőben lévőt. A válasz akkor is ugyanaz, ha a címet már egy másik fiók használja: ilyenkor nem megy ki link, helyette a cím tulajdonosa kap értesítést (legfeljebb óránként egyet), és a felhasználónév ugyanígy lefoglalódik, hogy semmi ne árulja el, tartozik-e fiók a címhez. Az a regisztráció, amelynek linkjét nem használták fel, 24 óra után törlődik, és a felhasználónév ismét szabad lesz.

        **E-mail-megerősítés nélkül** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, a fiók azonnal létrejön, és be lehet vele jelentkezni.

        **Szabályok.** `username`: `USERNAME_MIN`–`USERNAME_MAX` karakter (3–20), betűk, számjegyek, `_` és `-`, betűvel vagy számjeggyel kezdődően (a `GET /info` ezeket `limits` néven adja meg); a fenntartott neveket (`admin`, `moderator`, `deleted`...) és egyes előtagokat a szerver elutasítja; a kis- és nagybetűktől függetlenül egyedi. `email`: a széleiről levágott szóközökkel és kisbetűsen tárolva, egyszerű ASCII, pontot tartalmazó domainnel. `password`: legalább `PASSWORD_MIN_LENGTH` (10) karakter és legfeljebb 256 bájt UTF-8; nem tartalmazhatja a felhasználónevet vagy az e-mail-cím helyi részét, és nem lehet gyakori jelszó.

        **Hibák**, ebben a sorrendben ellenőrizve: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; a jelszóhashelési sor hibái; 409 `email_taken` (csak e-mail-megerősítés nélkül).

        **Korlátok:** `auth`, majd `auth_register` (kliensenként óránként 10 regisztráció). **Munkabizonyíték:** mindig, ha a `POW_REGISTER_BITS` 0-nál nagyobb.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Első kísérlet, munkabizonyíték nélkül
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Újraküldés munkabizonyítékkal
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: A fiók létrejött, és be lehet vele jelentkezni (ezen a szerveren nincs e-mail-megerősítés).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: A regisztráció a megerősítő linkre vár (vagy a címhez már tartozik fiók; a válasz ezt nem árulja el).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (`field` mezővel), `invalid_json`, `invalid_username`, `invalid_email` vagy `weak_password` `reason` mezővel: `too_short`, `too_long`, `contains_username`, `contains_email` vagy `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: ezen a szerveren a regisztráció le van zárva (a `GET /info` szerint `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: a felhasználónév már egy fiókhoz tartozik, vagy egy másik cím függőben lévő regisztrációja foglalja. `email_taken`: a címet egy másik fiók használja (csak e-mail-megerősítés nélkül).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: az `auth` vagy az `auth_register` korlát, vagy a jelszóhashelési sor.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a jelszóhashelési sor, vagy az adatbázis zárolva maradt), `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Bejelentkezés jelszóval
      description: |-
        Bejelentkezés felhasználónévvel vagy e-mail-címmel és jelszóval. Két lehetséges válasz van, mindkettő 200-as állapotkóddal: egy munkamenet, vagy bekapcsolt kétlépcsős azonosítás esetén egy második lépés, amelyet 5 percen belül kell befejezni a `POST /auth/login/mfa` kéréssel.

        Az ismeretlen fiók, a hibás jelszó és a jelszó nélküli fiók ugyanazt a választ kapja, ugyanannyi idő után: 401 `invalid_credentials`. A fiókellenőrzések (`banned`, `email_unverified`) csak helyes jelszó után következnek. Egy bejelentkezési névvel elkövetett `AUTH_FAILURES_PER_ACCOUNT` (5) sikertelen kísérlettől kezdve minden kísérletnek várnia kell (429 `too_many_attempts`).

        **Korlát:** `auth`. **Munkabizonyíték:** csak sikertelen bejelentkezések hulláma idején (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Egy munkamenet, vagy egy kétlépcsős azonosítású bejelentkezés második lépése.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Bejelentkezve
