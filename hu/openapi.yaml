  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Jelszó módosítása
      description: |-
        Módosítja a jelszót. A jelenlegi jelszó szükséges, második faktor viszont nem, bekapcsolt kétlépcsős azonosítás esetén sem. Az új jelszóra a regisztráció szabályai vonatkoznak (ellenőrzésük a jelenlegi jelszó után történik).

        A módosításnak a következő hatásai vannak, egyetlen tranzakcióban (vagy mind, vagy egyik sem): visszavonja az összes többi munkamenetet (ez a munkamenet bejelentkezve marad), törli a függőben lévő e-mail-cím-módosítást, érvényteleníti a fiók jelszó-visszaállító linkjeit, és e-mailt küld a tulajdonosnak.

        **Újrahitelesítés:** csak a jelszó. **Korlátok:** `reauth`, majd `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: A jelszó megváltozott.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (csak Google-bejelentkezést használó fiók), `weak_password` (`reason` mezővel), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: hibás jelenlegi jelszó, vagy olyan jelszó-visszaállítás vagy -módosítás, amely a kérés ellenőrzése közben történt.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (a fiók sikertelen újrahitelesítései), vagy `rate_limited` (a `reauth` vagy a `reauth_user` korlát, a fiókkeret, a jelszóhashelési sor).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: a jelszóhashelési sor, vagy az adatbázis zárolva maradt (`retryAfter: 1`, semmi sem változott). `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: A kétlépcsős azonosítás bekapcsolásának megkezdése
      description: |-
        Eltárol egy új, függőben lévő hitelesítő titkos kulcsot, amely felváltja a korábbi függőben lévőt, és visszaadja a hitelesítő alkalmazás számára (szövegként, valamint QR-kódként megjelenítendő `otpauth://` URI-ként). A kétlépcsős azonosítás még nincs bekapcsolva: a `POST /account/mfa/totp/enable` kapcsolja be ennek a titkos kulcsnak egy kódjával.

        **Újrahitelesítés:** csak a jelszó. **Korlátok:** `reauth`, majd `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
