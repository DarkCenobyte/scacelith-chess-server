          description: '`server_busy` (az adatbázis zárolva maradt), `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
