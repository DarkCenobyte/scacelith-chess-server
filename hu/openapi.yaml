        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: a `sessions` korlát vagy a fiókkeret.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (az adatbázis zárolva maradt), `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /account/me:
