      description: |-
        A bejelentkezett játékos játszmái, a legújabbal kezdve, szűrve és lapozva, a szűrőnek megfelelő játszmák számával. Minden lekérdezési paraméter elhagyható, és az üres érték hiányzónak számít.

        Lapozás: adja meg az előző oldal `next` értékét `before` paraméterként; az utolsó oldalon a `next` értéke `null`. A `total` a szűrőnek megfelelő játszmákat számolja, az összes oldalon együtt.

        **Korlát:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: Hivatalos kategória azonosítója (`3+2` vagy `3%2B2`), vagy `custom` minden más játékidejű játszmához.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Csak az értékelt (`true`) vagy a barátságos (`false`) játszmák.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Csak a megnyert, az elvesztett vagy a döntetlenre végződött játszmák, a játékos szemszögéből. A megszakított játszmák csak e szűrő nélkül jelennek meg.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
