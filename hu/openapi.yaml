        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Az alapidő ezredmásodpercben.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: A többletidő ezredmásodpercben.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: A kimenetel a játékos szemszögéből.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
