          description: '`server_busy` (a jelszóhashelési sor, vagy az adatbázis zárolva maradt), `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Bejelentkezés befejezése második faktorral
      description: |-
        Egy kétlépcsős azonosítású bejelentkezés második lépése, miután a `POST /auth/login` vagy egy Google-bejelentkezés (`POST /auth/sso/google/finish` vagy `POST /auth/sso/google/link`) `mfaRequired` választ adott. Küldje el a `code` (6 jegyű hitelesítő kód vagy helyreállító kód) vagy a `recoveryCode` mezőt. Az itt felhasznált helyreállító kód megszűnik.

        Egy lépés legfeljebb 5 hibás kódot fogad el; a lépés akkor is véget ér, ha a jelszót visszaállítják vagy módosítják. Egy Google-összekapcsolás jelszavas lépése után a kapcsolat csak akkor tárolódik, ha itt a kód sikeres.

        **Korlátok:** `auth`, valamint fiókonként 15 percenként legfeljebb `AUTH_MFA_PER_ACCOUNT` (10) kód, bármilyen címről; ezen felül a szerver nem ellenőrzi a kódot, így a helyreállító kód nem használódik el.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Hitelesítő kód
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Helyreállító kód
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Bejelentkezve.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: sem `code`, sem `recoveryCode` nem érkezett, vagy a törzs megsérti a sémát; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: a lépés lejárt, már felhasználták, vagy 5 hibás kód után véget ért, vagy a jelszót az első lépés óta visszaállították vagy módosították (jelentkezzen be újra). `invalid_code`: hibás vagy már felhasznált kód.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (`until` mezővel), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: csak egy Google-összekapcsolás jelszavas lépése után fordul elő: a Google-fiókot időközben egy másik fiókhoz kapcsolták.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: csak egy Google-összekapcsolás jelszavas lépése után fordul elő: a fiók időközben megváltozott; kezdje újra a bejelentkezést.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: a fiók hibakésleltetése, vagy elfogyott a fiók utolsó 15 percre jutó `AUTH_MFA_PER_ACCOUNT` kódja. `rate_limited`: az `auth` korlát.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` `retryAfter: 1` értékkel: az adatbázis zárolva maradt (Google-összekapcsolási lépés után semmi sem lett összekapcsolva: kezdje újra a bejelentkezést). `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /auth/logout:
