        reason:
          type:
            - string
            - 'null'
          description: A megadott indok, ha van.
        startsAt:
          type: integer
          format: int64
          description: A kezdet (Unix-idő, ms).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: A vége (Unix-idő, ms), végleges szankciónál `null`.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: A kitiltás vége (Unix-idő, ms), véglegesnél `null`.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` a név szerinti közvetlen kihívások fogadásához, `none` az elutasításukhoz.'
    PasswordChangeRequest:
      type: object
