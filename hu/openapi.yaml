  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Egy nemrégi játszma ellenfelének jelentése
      description: |-
        Jelenti a játékos egy saját, az elmúlt 7 napban befejeződött játszmájának ellenfelét. Egy jelentés önmagában soha nem változtat meg értékszámot, szankciót vagy integritási szintet. Megemeli a moderátorok által látott felülvizsgálati prioritást, és – az `abuse` kivételével – kéri a játszma gépi elemzését.

        Ugyanannak az ellenfélnek ugyanarra a játszmára vonatkozó jelentése ugyanazt a választ kapja, és nem változtat semmin; a válasz soha nem árul el semmit a jelentett fiókról. A `GET /games/{id}` előre megmondja a játszma játékosainak, hogy a szerver elfogadna-e egy jelentést (`reportable`).

        Ez a végpont maga ellenőrzi a törzsét, a következő sorrendben: `gameId`, `reported`, `category`, `comment`; hiba esetén a válasz 400 `invalid_request` `field` nélkül. Az ismeretlen mezőket figyelmen kívül hagyja.

        **Korlátok:** `reports` (játékosonként), majd játékosonként 24 óra alatt `REPORTS_PER_DAY` (5) jelentés (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: A jelentés beérkezett (vagy már korábban beérkezett).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (`field` nélkül), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: a jelentett játékos nem a jelentő ellenfele egy olyan játszmában, amely az elmúlt 7 napban fejeződött be.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, `Retry-After` fejléccel): `REPORTS_PER_DAY` jelentés az elmúlt 24 órában. `rate_limited`: a `reports` korlát vagy a fiókkeret.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a munkamenet keresésekor az adatbázis zárolva volt), `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /verify-email:
