components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Egy bejelentkezési válaszból kapott munkamenet-token (`sct_`, majd 43 base64url karakter) az `Authorization` fejlécben: `Authorization: Bearer <token>`. Az előtag pontosan `Bearer` (kis- és nagybetűérzékeny) és egy szóköz; az ilyen előtag nélküli értékre, illetve az 1–512 nyomtatható ASCII-karakterből nem álló tokenre a válasz 401 `invalid_token`, mint bármely más érvénytelen tokenre. Az üres fejléc hiányzó fejlécnek számít.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: 'A játszma azonosítója: legfeljebb 16 jegyű, kezdő nullák nélküli pozitív decimális egész szám, 2^53 alatt.'
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: A munkamenet azonosítója, ahogy a `GET /auth/sessions` megadja, kezdő nullák nélkül írva (a `03` nem a 3-as munkamenet).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: 'A játékos felhasználóneve, kis- és nagybetűtől függetlenül. A szerver bármely olyan nevet elfogad, amely 2–24 karakterből áll a következő készletből: `[A-Za-z0-9_.-]` (ez a valaha megengedett legtágabb szabály).'
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Játszmaazonosító; csak a régebbi játszmák jelennek meg a listában. Adja meg az előző oldal `next` értékét. Az üres érték hiányzónak számít.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Az oldalméret, 1–50. A legfeljebb 3 jegyű nagyobb szám 50-nek számít; az üres érték hiányzónak számít.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: Az e-mailben küldött link tokenje (43 base64url karakter). Hiányzó vagy hibás token esetén a „link invalid or expired” (a link érvénytelen vagy lejárt) oldal jelenik meg.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: A szerver minden válasza tiltja a gyorsítótárazást.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Az újrapróbálkozás előtt kivárandó másodpercek; ugyanaz az érték, mint a törzs `retryAfter` mezője.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: A Bearer-kihívás, érvénytelen tokennél `error="invalid_token"` paraméterrel.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: A szerver e válasz után lezárja a kapcsolatot.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (`field` mezővel, ha a törzs egy mezője hibás) vagy `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Egy mező nem felel meg a sémának
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: A törzs nem JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Gyenge jelszó
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: Beolvashatatlan PGN
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (nincs `Authorization` fejléc) vagy `invalid_token` (a token hibás formátumú, lejárt, visszavont, vagy törölt fiókhoz tartozik).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Nincs munkamenet
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Érvénytelen token
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: A szerver elutasítja a kérést.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Hibás jelszó újrahitelesítéskor
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Kitiltott fiók
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found`, vagy olyan funkció, amelyet ez a szerver kikapcsolt.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: a törzs nem érkezett meg 10 másodpercen belül. A szerver lezárja a kapcsolatot.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: A kérés ütközik a szerver állapotával.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: a Google-bejelentkezési kísérlet vagy jegy ismeretlen, már felhasznált vagy lejárt; kezdje újra a bejelentkezést.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: a törzs meghaladja a `HTTP_BODY_LIMIT` értékét (alapértelmezés szerint 16 384 bájt). A szerver lezárja a kapcsolatot.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: a kérés célja meghaladja a 4096 karaktert.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: a törzs nem `application/json`, vagy a karakterkészlete nem UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: a játszma több mint `GIF_MAX_PLIES` (600) féllépésből áll.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: oldja meg a `pow` kihívást, és küldje el újra ugyanazt a kérést `pow: { challenge, nonce }` mezővel. A `reason` megadja az okát: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` vagy `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (egy kéréskorlát, a fiókkeret vagy a jelszóhashelési sor) vagy `too_many_attempts` (a fiók korlátozása), `retryAfter` mezővel és `Retry-After` fejléccel.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Kéréskorlát
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Túl sok sikertelen próbálkozás ezen a fiókon
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: váratlan hiba. A szerver naplózza.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: hibás `state` vagy `iss`, vagy a Google elutasította a kódot, vagy olyan ID-tokent küldött, amelynek az ellenőrzése sikertelen (ide tartozik a másik kliens – a játék vagy a webhely – kódja vagy ID-tokenje is). Soha nem tartalmazza a Google szövegét.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` vagy `timeout`: próbálja újra a `retryAfter` által megadott idő elteltével, ha meg van adva.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: A szerver foglalt
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Az adatbázis zárolva maradt (olvasás)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: A szerver túl sokáig dolgozott
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Az animált GIF, mellékletként.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` a szerver egy játszmájánál, `attachment; filename="scacelith-game.gif"` a `POST /gif` végponttal küldött PGN-nél.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: A fájl mérete bájtban.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: HTML-oldal.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: Az elutasítást magyarázó HTML-oldal.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Az űrlap nem érkezett meg 10 másodpercen belül (HTML-oldal). A szerver lezárja a kapcsolatot.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: Az ütközést magyarázó HTML-oldal.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Az űrlap meghaladja a `HTTP_BODY_LIMIT` értékét (HTML-oldal). A szerver lezárja a kapcsolatot.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: A törzs sem űrlap (`application/x-www-form-urlencoded`), sem JSON, vagy a karakterkészlete nem UTF-8 (HTML-oldal).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Kéréskorlát (HTML-oldal), `Retry-After` fejléccel.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Váratlan hiba („Server error” – Szerverhiba – című HTML-oldal). A szerver naplózza.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: A szerver foglalt (az adatbázis zárolva maradt, vagy a szerver erősen le van maradva; `Retry-After` fejléccel), vagy túl sokáig dolgozott („Server error” – Szerverhiba – című HTML-oldal).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: A JSON API minden hibaválaszának egységes formája.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: A `snake_case` formátumú hibakód. A kliens ez alapján választja ki, mit jelenítsen meg.
          examples:
            - rate_limited
        message:
          type: string
          description: Egy angol mondat, naplókhoz és tartalékként.
        retryAfter:
          type: integer
          minimum: 1
          description: Az újrapróbálkozás előtt kivárandó másodpercek; csak az idővel megszűnő elutasításoknál van jelen. A válasz ilyenkor ugyanezzel az értékkel `Retry-After` fejlécet is tartalmaz, kivéve a 503 `busy` választ a korábbi játszmák, a játszmák, a játékosok és a ranglista lekérdezésekor.
        field:
          type: string
          description: A hibás mező vagy lekérdezési paraméter (`invalid_request`, `invalid_option`, valamint a `GET /account/games` `invalid_cursor`, `invalid_limit` és `invalid_filter` hibája). A beágyazott mező neve pontokkal tagolt (`pow.nonce`).
        reason:
          type: string
          description: 'Az ok: a szabály, amelyet egy `weak_password` megsért, vagy hogy miért kért vagy utasított el a szerver munkabizonyítékot (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Csak `banned` esetén: a kitiltás vége (Unix-idő, ms), végleges kitiltásnál `null`.'
        line:
          type: integer
          minimum: 1
          description: 'Csak `invalid_pgn` esetén: a hiba sora, 1-től számozva.'
        column:
          type: integer
          minimum: 1
          description: 'Csak `invalid_pgn` esetén: a hiba oszlopa, 1-től számozva, karakterben.'
    PowChallenge:
      type: object
      description: Munkabizonyíték-kihívás (egy 428 `pow_required` válasz `pow` mezője).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Az aláírt kihívás, változatlanul visszaküldendő.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: A kezdő nullabitek száma, amellyel a `SHA-256(challenge + ":" + nonce)` értéknek rendelkeznie kell.
        expiresAt:
          type: integer
          format: int64
          description: A kihívás lejárta (Unix-idő, ms), a kiadása után 2 perccel.
    PowAnswer:
      type: object
      description: Válasz egy munkabizonyíték-kihívásra.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: A 428-as válasz `challenge` mezője, változatlanul.
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Legfeljebb 20 jegyű decimális karakterlánc, amelyre a `SHA-256(challenge + ":" + nonce)` `bits` darab nullabittel kezdődik.
    ServerInfo:
      type: object
      description: Amire egy kliensnek szüksége van, mielőtt bejelentkezik vagy csatlakozik.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: A szerver neve (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: UUID, amelyet az adatbázis az első indításakor kap. Újraindítások után is ugyanaz marad. `null`, ha az adatbázis nem tudja megadni.
        motd:
          type: string
          description: A nap üzenete (`SERVER_MOTD`), lehet üres is.
        protocol:
          type: object
          description: A WebSocket-protokoll (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: A szerver által ismert legrégebbi protokollverzió.
            max:
              type: integer
              minimum: 1
              description: A szerver által ismert legújabb protokollverzió.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'A protokollséma ujjlenyomata (a kanonikus alakjából számított SHA-256 hash első 4 bájtja, előjel nélküli egész számként: `0xc649140f`, azaz 3326678031 a protokoll 2-es alverziójánál); tájékoztató jellegű, összehasonlításra soha nem használják.'
            subprotocol:
              type: string
              description: A WebSocket-alprotokoll tokenje (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: A játékosok által használt WebSocket-port (`PUBLIC_WS_PORT`, ennek hiányában `WS_PORT`, annak hiányában `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: A WebSocket útvonala.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Létrehozhatók-e új fiókok.
        emailVerification:
          type: boolean
          description: Meg kell-e erősíteniük az új fiókoknak a címüket (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Elérhető-e Google-bejelentkezés a játék számára.
            googleWeb:
              type: boolean
              description: Elérhető-e Google-bejelentkezés egy webhely számára is (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: A kétlépcsős azonosítás mindig elérhető.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: A regisztrációhoz szükséges munkabizonyíték-bitek száma (0, ha nincs).
        categories:
          type: array
          description: A hivatalos (értékelt) játékidők (`RATED_CATEGORIES`), a szerver sorrendjében. Minden más játékidő `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Szabályok, amelyeket a kliens egy űrlap elküldése előtt ellenőrizhet.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: A legrövidebb felhasználónév hossza (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: A leghosszabb felhasználónév hossza (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: A reguláris kifejezés, amelynek egy új felhasználónévnek meg kell felelnie.
            passwordMinLength:
              type: integer
              description: A legrövidebb jelszó hossza karakterben (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: A leghosszabb jelszó hossza UTF-8 bájtban.
            customTimeControls:
              type: boolean
              description: Használhatnak-e a kihívások és a privát játszmák egyéni játékidőt.
            reportsPerDay:
              type: integer
              description: Hány jelentést tehet egy játékos 24 óránként (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: A kliens által küldhető legnagyobb WebSocket-üzenet mérete bájtban.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Hivatalos játékidő.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 'A kategória azonosítója: percek és többletidő-másodpercek (`3+2`).'
        baseSec:
          type: number
          minimum: 0
          description: Az alapidő másodpercben.
        incSec:
          type: number
          minimum: 0
          description: A lépésenkénti többletidő másodpercben.
    AccountView:
      type: object
      description: A fiók úgy, ahogy a játékosa látja (a bejelentkezési válaszok és a `GET /account/me` `user` mezője).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: A fiók azonosítója.
        username:
          type: string
          description: A felhasználónév.
        email:
          type: string
          format: email
          description: Az e-mail-cím.
        emailVerified:
          type: boolean
          description: Meg van-e erősítve a cím.
        mfaEnabled:
          type: boolean
          description: Be van-e kapcsolva a kétlépcsős azonosítás.
        googleLinked:
          type: boolean
          description: Van-e kapcsolt Google-fiók.
        hasPassword:
          type: boolean
          description: '`false` a Google-on keresztül létrehozott olyan fióknál, amely még nem állított be jelszót.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Fogadja-e a fiók a név szerinti közvetlen kihívásokat (lásd `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: A fiók létrehozásának ideje (Unix-idő, ms).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Az utolsó bejelentkezés (Unix-idő, ms), vagy `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: A linkjére váró e-mail-cím-módosítás új címe, vagy `null`.
    SessionAnswer:
      type: object
      description: Új munkamenet.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: A munkamenet-token, az `Authorization` fejléchez és a WebSockethez.
        expiresAt:
          type: integer
          format: int64
          description: A munkamenet abszolút lejárata (Unix-idő, ms); az inaktivitási korlát korábban is megszüntetheti.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: 'Kétlépcsős azonosítással történő bejelentkezés második lépése; a folytatás: `POST /auth/login/mfa`.'
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: A lépés tokenje, a `POST /auth/login/mfa` számára.
        expiresIn:
          type: integer
          const: 300
          description: A lépés befejezéséig hátralévő másodpercek.
    LoginAnswer:
      description: Munkamenet, vagy kétlépcsős azonosítással történő bejelentkezés második lépése.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: 'Első Google-bejelentkezés; a folytatás: `POST /auth/sso/complete`.'
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: A jegy a `POST /auth/sso/complete` számára, 10 percig érvényes.
        suggestedUsername:
          type: string
          description: A Google-névből vagy a címből képzett felhasználónév, vagy `""`, ha semmi sem megfelelő.
    SsoNeedsPassword:
      type: object
      description: 'Egy jelszóval rendelkező fiók használja a címet; a folytatás: `POST /auth/sso/google/link`. Még semmi sincs összekapcsolva.'
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: A jegy a `POST /auth/sso/google/link` számára.
        username:
          type: string
          description: Az adott fiók felhasználóneve (csak az látja, aki a Google előtt igazolta a címet).
        expiresIn:
          type: integer
          const: 600
          description: Ennyi másodpercig érvényes a jegy.
    SsoFinishAnswer:
      description: A `POST /auth/sso/google/finish` válasza.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Google-bejelentkezési kísérlet.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: A kísérlet, a `POST /auth/sso/google/finish` számára.
        authUrl:
          type: string
          format: uri
          description: A rendszerböngészőben megnyitandó Google-URL, ellenőrzés után.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: A `state`, amelyet a Google-nak vissza kell küldenie.
        expiresIn:
          type: integer
          const: 600
          description: Ennyi másodpercig érvényes a kísérlet.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: A felhasználónév; ezt követően a szerver szabályai érvényesek (lásd a leírást).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Az e-mail-cím. A szerver levágja a kezdő és záró szóközöket, és kisbetűsen tárolja.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: A jelszó; ezt követően a jelszószabályok érvényesek.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: A felhasználónév vagy az e-mail-cím (bármely szöveg, amelyben van `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Nem kötelező. A bejelentkezett eszközök listájában jelenik meg (például `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: A bejelentkezési válasz (vagy egy Google-bejelentkezés válaszának) `mfaToken` mezője.
        code:
          type: string
          maxLength: 32
          description: Nem kötelező. 6 jegyű hitelesítő kód vagy helyreállító kód.
        recoveryCode:
          type: string
          maxLength: 32
          description: Nem kötelező. Helyreállító kód. A `code` és a `recoveryCode` közül az egyik szükséges.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Az e-mail-cím.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: A visszaállító link `token` paramétere.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Az új jelszó; a regisztráció jelszószabályai érvényesek.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: A kliens `codeVerifier` értékének S256 PKCE-kihívása (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: A kliens figyelőjének portja a `127.0.0.1` címen.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Az oldal `codeVerifier` értékének S256 PKCE-kihívása (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: A `POST /auth/sso/google/start` által adott `attemptId`.
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: A PKCE-ellenőrző (verifier); SHA-256 hashének egyeznie kell a `start` végpontnak megadott kihívással.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: A `state`, ahogy a Google visszaküldte.
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: A `code`, ahogy a Google visszaküldte (nyomtatható ASCII, szóközök nélkül).
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Nem kötelező. Az `iss`, ahogy a Google visszaküldte, ha visszaküldte.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: A `finish` által adott `linkTicket`, 10 percig érvényes.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: A fiók jelszava.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: A `finish` által adott `ssoTicket`, 10 percig érvényes.
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: A felhasználónév; a regisztráció szabályai érvényesek.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Az aktív munkamenetek, a legutóbb használttal kezdve.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Aktív munkamenet (bejelentkezett eszköz).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: A munkamenet azonosítója, a `DELETE /auth/sessions/{id}` számára.
        createdAt:
          type: integer
          format: int64
          description: A bejelentkezés ideje (Unix-idő, ms).
        lastSeenAt:
          type: integer
          format: int64
          description: Az utolsó használat ideje (Unix-idő, ms), legfeljebb 5 percenként frissül (később, amíg a szerver erősen le van maradva).
        expiresAt:
          type: integer
          format: int64
          description: Az abszolút lejárat (Unix-idő, ms); az inaktivitási korlát a munkamenetet korábban is megszüntetheti.
        clientLabel:
          type:
            - string
            - 'null'
          description: A bejelentkezéskor küldött `clientLabel`, vagy `null`, ha nem küldött ilyet.
        current:
          type: boolean
          description: Ez-e a kérést küldő munkamenet.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Egy rekord minden olyan kategóriához, amelyben a játékos értékelt játszmákat játszott.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Az aktív szankciók.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: 'Kitiltás alatt `{ until }`, egyébként `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Egy kategória értékszám-rekordja.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: A kategória azonosítója.
        rating:
          type: integer
          description: Az értékszám.
        games:
          type: integer
          minimum: 0
          description: A kategóriában játszott játszmák (akár beszámítottak, akár nem).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Az elért legmagasabb értékszám.
        provisional:
          type: boolean
          description: '`true`, amíg a rekord még az értékszám nélküli szakaszban van, vagy kevesebb mint `PROVISIONAL_GAMES` beszámított játszmán alapul (a játék `1510?` formában jeleníti meg).'
    ActiveSanction:
