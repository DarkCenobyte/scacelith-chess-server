  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: A fiók törlése
      description: |-
        Törli a fiókot; ez nem vonható vissza.

        - A szerver azonnal visszavon minden munkamenetet: a token ettől kezdve 401 `invalid_token` választ kap.
        - A felhasználónév `deleted#<id>` lesz, a fiókban és minden játszmarekordban.
        - Törlődnek: az e-mail-cím, a jelszóhash, a kétlépcsős azonosítás titkos kulcsa és a helyreállító kódok, a munkamenetek és a linktokenek, a Google-kapcsolat, a csalásellenes rendszer integritási rekordja, valamint a biztonsági eseményekkel együtt tárolt IP-címek.
        - Az értékszámok és a játszmák megmaradnak. A játszmák az anonim név alatt továbbra is olvashatók, a `GET /players/{username}` pedig 404-es választ ad a korábbi névre.

        **Újrahitelesítés:** a jelszó és – kétlépcsős azonosítás esetén – egy hitelesítő kód vagy egy helyreállító kód. **Korlátok:** `reauth`, majd `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: A fiók törölve.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (csak Google-bejelentkezést használó fiók), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (sikertelen újrahitelesítések, vagy túl sok kipróbált kód ezen a fiókon), vagy `rate_limited` (a `reauth` vagy a `reauth_user` korlát, a fiókkeret, a jelszóhashelési sor).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (a jelszóhashelési sor, vagy az adatbázis zárolva maradt), `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /account/games:
