      summary: A kétlépcsős azonosítás bekapcsolásának befejezése és a helyreállító kódok lekérése
      description: |-
        Bekapcsolja a kétlépcsős azonosítást a függőben lévő titkos kulcs egy kódjával (pontosan 6 számjegy). Itt nem kell jelszó; azt a beállításkor kellett megadni. A válasz 10 helyreállító kódot tartalmaz, amelyek csak most jelennek meg.

