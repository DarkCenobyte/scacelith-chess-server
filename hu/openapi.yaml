      description: |-
        A játszma animált GIF-ként. A nevek és az értékszámok a játszmarekordból származnak (az értékszámok a kezdéskor, törölt fiók `deleted#<id>` néven), és ugyanígy az eredmény és a befejezés módja is (`Resignation`, `Loss on time`…).

        Az ellenőrzések sorrendje: `gif_disabled`, a képbeállítások (`size`, `orientation`, `delay`, `coords`), a játszma azonosítója, a játszma, a hossza.

        **Munkamenet szükséges:** a kvóták fiókonként számítanak. **Korlátok:** `gif` minden kérésnél; `gif_user_min`, `gif_user_hour`, `gif_ip_min` és `gif_ip_hour` csak akkor, ha a GIF-et el kell készíteni (lásd a szakasz leírását). **Időkorlát:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 másodperc (alapértelmezés szerint 45 másodperc).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 'A kép mérete: `small` (32 px-es mezők), `medium` (48 px) vagy `large` (72 px).'
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: A tábla alján lévő fél.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Ezredmásodperc lépésenként (1–6 decimális számjegy).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: A vonalak betűi és a sorok számai megjelennek-e a tábla körül (`1`) vagy sem (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` `field` mezővel (`size`, `orientation`, `delay` vagy `coords`): a megengedetteken kívüli érték. `invalid_game_id`. `invalid_request`: érvénytelen URL-kódolás.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: nincs ilyen játszma. `gif_disabled`: a szerver kikapcsolta a GIF-eket (`GIF_ENABLED=false`; a `gif` token visszajár).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: a `gif` korlát, egy renderelési korlát vagy a fiókkeret.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: a GIF-et nem sikerült elkészíteni (a szerver naplózza az okát). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` `retryAfter` értékkel (3–10 másodperc) és `Retry-After` fejléccel: a renderelési sor megtelt, vagy a GIF `GIF_QUEUE_TIMEOUT_MS` (10 másodperc) ideig várt egy szabad szálra; a kérés által elvett minden korláttoken visszajár. `busy`: az adatbázis zárolva maradt (`retryAfter: 1` csak a törzsben). `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Animált GIF készítése bármely PGN-ként elküldött játszmáról
      description: |-
        Ugyanaz a kép, mint a `GET /games/{id}/gif` esetén, bármely PGN-szövegként elküldött játszmáról: a játék által mentett játszmáról, egy másik oldal exportjáról, kézzel begépelt játszmáról. A szerver csak a szöveg első játszmáját használja.

        - A PGN-beolvasó azt fogadja el, amit a játék saját beolvasója: minden PGN-t, amelyet ez a szerver ír, és más oldalak szokásos exportjait (a megjegyzéseket, a változatokat, a NAG-okat és az óra-annotációkat kihagyja; a lépésszámokat és a SAN-t engedékenyen olvassa; a `FEN` címke adja a kezdőállást, hacsak a `SetUp` értéke nem `"0"`).
        - A nevek és az értékszámok a `White`, `Black`, `WhiteElo` és `BlackElo` címkékből származnak. Az ékezetes betűk elveszítik az ékezetüket, a nyomtatható ASCII-n kívüli egyéb karakterekből `?` lesz, a hosszú neveket pedig a szerver levágja (48 karakter). Az eredmény a `Result` címkéből származik, ennek hiányában a lépésszöveg végéről. A `Termination` címke megjelenik, kivéve ha `normal`: ilyenkor a végállás magáért beszél (matt, patt).
        - Ez a végpont maga ellenőrzi a törzsét: ismeretlen mezőre, illetve hiányzó vagy nem karakterlánc típusú `pgn` mezőre a válasz 400 `invalid_request` `field` mezővel; hibás beállításra a válasz 400 `invalid_option` (a `delayMs` csak JSON-szám, a `coords` csak logikai érték lehet; a `null` nem elfogadott).

        **Munkamenet szükséges:** a kvóták fiókonként számítanak. **Korlátok:** mint a `GET /games/{id}/gif` esetén. **Törzsméret-korlát:** 135 168 bájt, a `HTTP_BODY_LIMIT` értékétől függetlenül (a PGN JSON-karakterláncként, az escape-szekvenciákkal együtt). **Időkorlát:** alapértelmezés szerint 45 másodperc.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Rövid, begépelt játszma, koordináták nélkül
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: PGN-fájl minden beállítással
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` `field` mezővel (ismeretlen mező, vagy a `pgn` hiányzik, illetve nem karakterlánc; `field` nélkül, ha a törzs nem objektum); `invalid_json`; `invalid_option` `field` mezővel (`size`, `orientation`, `delayMs` vagy `coords`); `invalid_pgn` `line` és `column` mezővel (1-től számozva, az oszlopok karakterben) és a beolvasó `message` üzenetével: szabálytalan vagy többértelmű lépés, hibás címke, ismeretlen sakkvariáns, 65 536 bájtnál több.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: a szerver kikapcsolta a GIF-eket (`GIF_ENABLED=false`; a `gif` token visszajár).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: 135 168 bájtnál nagyobb törzs.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: a `gif` korlát, egy renderelési korlát vagy a fiókkeret.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: a GIF-et nem sikerült elkészíteni (a szerver naplózza az okát). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` `retryAfter` értékkel (3–10 másodperc) és `Retry-After` fejléccel: a renderelési sor megtelt, vagy a GIF túl sokáig várt egy szabad szálra; a kérés által elvett minden korláttoken visszajár. `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /players/{username}:
