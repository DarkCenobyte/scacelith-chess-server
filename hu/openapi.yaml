      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: A jelenlegi jelszó.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Az új jelszó; a regisztráció jelszószabályai érvényesek.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: A fiók jelszava.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: A függőben lévő titkos kulcs egy kódja, pontosan 6 számjegy.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: A fiók jelszava.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Nem kötelező; kétlépcsős azonosítás esetén szükséges (vagy a `recoveryCode`). Hitelesítő kód vagy helyreállító kód.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Nem kötelező. Helyreállító kód (`xxxx-xxxx-xx`; a kis- és nagybetűk, a szóközök és a kötőjelek nem számítanak).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: A fiók jelszava.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Hitelesítő kód (helyreállító kódot a szerver elutasít).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Az új cím; a kezdő és záró szóközök levágása és kisbetűssé alakítás után úgy ellenőrződik, mint egy regisztrációs cím.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: A fiók jelszava.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Nem kötelező; kétlépcsős azonosítás esetén szükséges (vagy a `recoveryCode`). Hitelesítő kód vagy helyreállító kód.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Nem kötelező. Helyreállító kód.
    TotpSetup:
      type: object
      description: A függőben lévő titkos kulcs a hitelesítő alkalmazáshoz.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: A titkos kulcs base32 kódolással, az alkalmazásba való begépeléshez.
        uri:
          type: string
          format: uri
          description: Az `otpauth://totp/...` URI, QR-kódként való megjelenítéshez.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Egy időlépés hossza másodpercben.
    RecoveryCodeList:
      type: array
      description: A 10 helyreállító kód, amelyek csak most jelennek meg. Mindegyik egyszer használható.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Az egyik fél a játszmában.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: A név a játszmarekordban (törölt fióknál `deleted#<id>`).
        rating:
          type:
            - integer
            - 'null'
          description: Az értékszám a kezdéskor, ismeretlen esetén `null`.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Az értékszám a játszma után. Értékelt játszmánál mindig megvan; `null` csak olyan játszmánál, amely nem számít bele az értékszámokba (barátságos, egyéni, megszakított).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Az értékszám változása; `0`, ha az értékszám-szabályok változatlanul hagyják az értékszámot (a FIDE nulla pontos szabálya, értékszám nélküli ellenfél, egy értékszám nélküli játékos első játszmái); `null` ugyanott, ahol a `ratingAfter`.
    GameSummary:
      type: object
      description: Egy tárolt játszma összefoglalója.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: A játszma azonosítója.
        category:
          type: string
          description: A hivatalos kategória azonosítója (`3+2`), vagy `custom`.
        rated:
          type: boolean
          description: Beleszámít-e a játszma az értékszámokba.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: A játékidő másodpercben (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (lásd a játszmakódokat).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: A játszma végének okát jelző kód (lásd a játszmakódokat).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Az eredmény; megszakított játszmánál `*`.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: A féllépések száma.
        startedAt:
          type: integer
          format: int64
          description: A kezdés ideje (Unix-idő, ms).
        endedAt:
          type: integer
          format: int64
          description: A befejezés ideje (Unix-idő, ms).
    Termination:
      type: string
