          description: '`too_many_attempts` (a fiók sikertelen újrahitelesítései), vagy `rate_limited` (a `reauth` vagy a `reauth_user` korlát, a fiókkeret).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
