      description: |-
        Kijelentkezteti a fiók egy munkamenetét; az aktuális munkamenet is kijelentkeztethető. A vele megnyitott WebSocket bezárul. Nincs törzs (vagy `{}`).

        **Korlát:** `sessions`.
      security:
