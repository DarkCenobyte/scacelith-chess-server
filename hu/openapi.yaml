          description: '`rate_limited`: a `sessions` korlát vagy a fiókkeret.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (az adatbázis zárolva maradt), `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Megerősítő link újraküldése
      description: |-
        Újraküldi az e-mail-megerősítő linket. A válasz a címtől függetlenül 202 `accepted`, hogy soha ne árulja el, használja-e a címet fiók vagy regisztráció.

        Egy kérés címenként legfeljebb 5 percenként egyszer fejt ki hatást. Az ezzel a címmel függőben lévő regisztráció ismét 24 órát kap, akár használja a címet egy másik fiók, akár nem, hogy a felhasználónév mindkét esetben ugyanannyi ideig foglalt maradjon. Link csak ennek a regisztrációnak megy ki, ha a címhez nem tartozik fiók (az új, 24 óráig érvényes link felváltja az előzőt), vagy egy ezzel a címmel rendelkező aktív, meg nem erősített fióknak.

        **Korlátok:** `auth`, majd `auth_mail` (kliensenként óránként 10).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Elfogadva (a címtől függetlenül).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: az `auth` vagy az `auth_mail` korlát (a címtől függetlenül).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` `retryAfter: 1` értékkel: az adatbázis zárolva maradt a fiók keresése vagy egy meg nem erősített fiók linkjének tárolása közben (a függőben lévő regisztráció megújítása csak a lehetőségekhez mérten történik, és soha nem okozza a kérés meghiúsulását); a cím 5 perce ettől függetlenül elindul, így az ezen belül érkező új kérés nem csinál semmit. `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Jelszó-visszaállító link küldése
      description: |-
        Egy óráig érvényes jelszó-visszaállító linket küld, amely a `/reset-password` oldalt nyitja meg. A válasz a címtől függetlenül 202 `accepted`. Link csak aktív fióknak megy ki, címenként legfeljebb 5 percenként egyszer. Egy csak Google-bejelentkezést használó fiók így állítja be az első jelszavát.

        A jelszó-helyreállításnak vannak a legszigorúbb korlátai az API-ban, mindegyik a teljes szerverre számolva: kliensenként (egy IPv4-cím vagy egy IPv6 /64) óránként 3 kérés (`AUTH_FORGOT_PER_HOUR`) és 24 óránként 10 (`AUTH_FORGOT_PER_DAY`), IPv6 /48-anként ezek háromszorosa, az `auth` korláton (10 percenként 20) és a címenként 5 percenként egy levélen felül. Sem a 202-es, sem a 429-es válasz nem árulja el, hogy használja-e fiók a címet. Az új jelszó beállításának saját korlátja van (`auth_reset`).

        **Korlátok:** `auth`, `auth_forgot`, majd `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Elfogadva (a címtől függetlenül).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: az `auth`, az `auth_forgot` vagy az `auth_forgot_day` korlát (a címtől függetlenül).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` `retryAfter: 1` értékkel: az adatbázis zárolva maradt a fiók keresése vagy a link tárolása közben; a cím 5 perce ettől függetlenül elindul, így az ezen belül érkező új kérés nem küld linket. `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Új jelszó beállítása egy visszaállító link tokenjével
      description: |-
        Új jelszót állít be egy visszaállító link tokenjével (a `/reset-password` oldal ugyanezt teszi). Az új jelszóra a regisztráció szabályai vonatkoznak.

        A visszaállításnak a következő hatásai vannak, egyetlen tranzakcióban (vagy mind, vagy egyik sem): visszavonja az összes munkamenetet, és törli a függőben lévő e-mail-cím-módosítást; a fiók többi visszaállító linkje érvényét veszti; a cím megerősítettnek számít (a link ezt bizonyította); a tulajdonos levelet kap. A kétlépcsős azonosítás változatlan marad. Jelszóhashelési sor hibája, 503-as vagy 500-as válasz után semmi sem változott: a régi jelszó és a munkamenetek megmaradnak, a link pedig érvényes marad.

        **Korlátok:** `auth`, majd `auth_reset` (kliensenként óránként 10, IPv6 /48-anként 30, az oldallal közösen: minden kísérlet egy jelszó hashelésével jár).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: A jelszó megváltozott, és minden munkamenet ki lett jelentkeztetve.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: a link érvénytelen, már felhasználták vagy lejárt, vagy olyan címre küldték, amely már nem a fiókhoz tartozik. `weak_password` (`reason` mezővel). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: az `auth` vagy az `auth_reset` korlát, vagy a jelszóhashelési sor.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: a jelszóhashelési sor, vagy az adatbázis zárolva maradt (`retryAfter: 1`, semmi sem változott). `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Google-bejelentkezés indítása
      description: |-
        Google-bejelentkezési kísérletet indít a PKCE-kihíváshoz és a játék `127.0.0.1` címen futó figyelőjének portjához. A válasz megadja a rendszer böngészőjében megnyitandó Google URL-t és a kísérlet `state` értékét; a kísérlet 10 percig érvényes.

        Az `authUrl` a következőket tartalmazza: `client_id`, `redirect_uri` (a `redirectPort` értékből és a szerver eredetcímkéjéből összeállítva), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (a szerver saját, a Google felé használt PKCE-ellenőrzőjének S256 értéke) `code_challenge_method=S256` mellett, valamint `prompt=select_account`. A játék megnyitás előtt ellenőrzi (lásd a szakasz leírását).

        **Korlát:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: A kísérlet.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: ezen a szerveren nem érhető el a Google-bejelentkezés.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: az `sso_start` korlát.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (az adatbázis zárolva maradt), `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Google-bejelentkezés indítása webhelyen
      description: |-
        Egy webhely Google-bejelentkezési kísérletét indítja el az oldala PKCE-kihívásához. A válasz ugyanaz, mint a játék esetén: a Google URL, amelyre navigálni kell, és a kísérlet `state` értéke; a kísérlet 10 percig érvényes. Akkor érhető el, ha a `GET /info` szerint `sso.googleWeb: true`.

        Az `authUrl` a webhely `client_id` értékét és a `redirect_uri=GOOGLE_WEB_REDIRECT_URI` paramétert tartalmazza, a többi paraméter ugyanaz, mint a játéknál. Az oldal ellenőrzi, mielőtt odanavigál (lásd a szakasz leírásában: **Webhelyen**).

        **Korlát:** `sso_start`, a játék indításával közösen.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: A kísérlet.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: hiányzó vagy hibás formátumú `codeChallenge`, vagy bármilyen más mező (a `redirectPort` is).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: ezen a szerveren nem érhető el a Google-bejelentkezés, vagy webhelyek számára nem érhető el.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: az `sso_start` korlát (a játék indításával közös).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (az adatbázis zárolva maradt), `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: A Google válaszának átadása a szervernek
      description: |-
        Átadja a szervernek azt a `code` és `state` értéket, amelyet a Google a játék figyelőjének vagy a webhely oldalának küldött, a kísérlet azonosítójával és a PKCE-ellenőrzővel (verifier) együtt. A kísérlet azonosítója az ellenőrző nélkül használhatatlan, a kód pedig a szerver saját PKCE-ellenőrzője és klienstitka (client secret) nélkül használhatatlan.

        A szerver ellenőrzi a kísérletet (ismeretlen, felhasznált vagy lejárt: 410), majd az ellenőrzőt (hibás ellenőrző esetén a kísérlet használható marad), ezután egyszer felhasználja a kísérletet, ellenőrzi a `state` és az `iss` értéket, a Google-nél beváltja a kódot, és ellenőrzi az ID-tokent. A válasz (200) a következők egyike:

        - `{ token, expiresAt, user }`: bejelentkezés a kapcsolt fiókba;
        - `{ mfaRequired, mfaToken, expiresIn }`: folytatás a `POST /auth/login/mfa` kéréssel;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: új fiók; folytatás 10 percen belül a `POST /auth/sso/complete` kéréssel. A `suggestedUsername` a Google-névből vagy a címből származik, és `""`, ha semmi sem megfelelő;
        - `{ needsPassword, linkTicket, username, expiresIn }`: az ezzel a címmel rendelkező fióknak van jelszava; folytatás a `POST /auth/sso/google/link` kéréssel. Még semmi sincs összekapcsolva.

        **Korlát:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Egy munkamenet, egy második lépés, vagy egy első Google-bejelentkezés következő lépése.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Bejelentkezve a kapcsolt fiókba
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: A kétlépcsős azonosítás be van kapcsolva
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Új játékos
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: A címet egy jelszóval rendelkező fiók használja
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: az ellenőrző (verifier) nem egyezik a kísérlet kihívásával (a kísérlet használható marad). `sso_email_unverified`: a Google nem erősítette meg a címet. `registration_closed`. `account_disabled`. Csak kapcsolt fióknál: `banned` (`until` mezővel), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: ezen a szerveren nem érhető el a Google-bejelentkezés.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: a címet egy jelszó nélküli aktív fiók használja (a válasz nem nevezi meg).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: ismeretlen, felhasznált vagy lejárt kísérlet.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: az `sso_finish` korlát.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (az adatbázis zárolva maradt), `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Google-fiók összekapcsolása egy meglévő fiókkal annak jelszavával
      description: |-
        Miután a `finish` `needsPassword` választ adott: a Google-fiókot a meglévő fiókhoz kapcsolja annak a fióknak a játékban begépelt jelszavával. A válasz (200) egy munkamenet (a kapcsolat tárolódik, és a játékos bejelentkezik), vagy bekapcsolt kétlépcsős azonosítás esetén `{ mfaRequired, mfaToken, expiresIn }`: folytatás a `POST /auth/login/mfa` kéréssel, és a kapcsolat csak akkor tárolódik, ha ott egy kód sikeres.

        Hibás jelszó esetén a jegy használható marad, összesen 5 próbálkozásra. A szerver közvetlenül a jelszó ellenőrzése előtt von le egy próbálkozást: a 429 `too_many_attempts` és a 428 `pow_required` nem von le egyet sem, a jelszóhashelési sor elutasítása (503 `server_busy`, 429 `rate_limited`) viszont már levont egyet, és a fiók sikertelen kísérletének számít. A hibakésleltetés ugyanaz a számláló, mint a `POST /auth/login` esetén.

        **Korlát:** `auth` (az IPv6 /48-anként számolt értékével együtt). **Munkabizonyíték:** ugyanúgy, mint a `POST /auth/login` esetén.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Munkamenet, vagy a bejelentkezés második lépése.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: hibás jelszó; a jegy megmarad, összesen 5 próbálkozásig.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (`until` mezővel), csak helyes jelszó után.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: ez a szerver nem kínál Google-bejelentkezést.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: a Google-fiókot időközben egy másik fiókhoz kapcsolták.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: ismeretlen, már felhasznált vagy lejárt jegy, az 5. hibás jelszó, olyan fiók, amelynek az állapota vagy a címe megváltozott a `finish` óta, vagy olyan, amelynek az állapota, a címe, a jelszava vagy a kétlépcsős azonosítása megváltozott, miközben a Google-kapcsolat tárolása zajlott. Kezdje újra a bejelentkezést.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (a fiók hibakésleltetése), vagy `rate_limited` (az `auth` korlát, a jelszóhashelési sor).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: a jelszóhashelési sor, vagy az adatbázis zárolva maradt (`retryAfter: 1`, semmi sem lett összekapcsolva). `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Fiók létrehozása az első Google-bejelentkezéskor
      description: |-
        Miután a `finish` `needsUsername` választ adott: létrehozza a fiókot a választott felhasználónévvel (a regisztráció szabályai érvényesek), és bejelentkezteti. A fióknak nincs jelszava: a `hasPassword` értéke `false`, és az „Elfelejtette a jelszavát?” funkcióval (`POST /auth/password/forgot`) kaphat jelszót.

        **Korlát:** `auth` (az IPv6 /48-onkénti számlálásával együtt).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: A fiók létrejött, és be van jelentkezve.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: ez a szerver nem kínál Google-bejelentkezést.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (egy fiók már használja a felhasználónevet, vagy egy másik cím függőben lévő regisztrációja foglalja), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: ismeretlen, már felhasznált vagy lejárt jegy.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: az `auth` korlát.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (az adatbázis zárolva maradt), `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: A bejelentkezett eszközök listázása
      description: |-
        A fiók aktív munkamenetei (bejelentkezett eszközök), a legutóbb használttal kezdve. A `current` jelöli a kérést küldő munkamenetet. A `lastSeenAt` legfeljebb 5 percenként frissül (később, amíg a szerver erősen le van maradva); az `expiresAt` az abszolút lejárat, és az inaktivitási korlát a munkamenetet korábban is megszüntetheti.

        **Korlát:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Az aktív munkamenetek.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: a `sessions` korlát vagy a fiókkeret.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (az adatbázis zárolva maradt), `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
