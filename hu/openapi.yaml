        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: az `account` korlát vagy a fiókkeret.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (az adatbázis zárolva maradt), `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Közvetlen kihívások fogadása vagy elutasítása
      description: |-
        Beállítja, hogy más játékosok név szerint kihívhatják-e ezt a játékost. `none` értékkel a szerver elutasítja a közvetlen kihívásokat: a kihívó azt a tájékoztatást kapja, hogy a játékos nem érhető el. Nincs újrahitelesítés.

        **Korlát:** `account`.
      security:
