  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Játszma letöltése PGN-fájlként
      description: |-
        Ugyanaz a játszma PGN-fájlként: egyetlen játszma `\n` sorvégekkel, a lépések szövege 80 oszlopnál rövidebb sorokban. A válasz tokennel és token nélkül is ugyanaz.

        PGN-címkék, ebben a sorrendben: `Event` (`<SERVER_NAME> rated <category>` vagy `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (a kezdés dátuma UTC szerint), `Round`, `White`, `Black`, `Result` (megszakított játszmánál `*`), `UTCDate` és `UTCTime` (a kezdés), `WhiteElo` és `BlackElo` (az értékszámok a kezdéskor, vagy `-`), `WhiteRatingDiff` és `BlackRatingDiff` (a változások, például `+10` és `-10`, minden értékelt játszmában, `+0`, ha az értékszám-szabályok változatlanul hagyják az értékszámot; barátságos, egyéni játékidejű vagy megszakított játszmában egyik sincs), `TimeControl` (másodpercben), `Termination` (PGN-szabvány szerinti érték: `normal`; `time forfeit`, a zászló leesése, akkor is, ha döntetlennel végződik; `abandoned`; `rules infraction`, második szabálytalan lépés vagy a fair play megsértése miatti játszmavesztés; `unterminated`, megszakított játszma), `PlyCount`, `ScacelithGameId` (a decimális azonosító).

        Minden lépés mellett ott áll a `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: a lépő játékos órája a lépés után és a lépésre elszámolt idő, tizedmásodpercben (csonkolva). Egy érték kimarad, ha a rekordban nincs meg. Az utolsó lépés után a játszma végének oka következik szavakkal, majd az eredmény.

        **Korlát:** `public_read` (tokennel játékosonként, token nélkül kliensenként).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: A PGN-fájl.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'A PGN-szöveg, UTF-8 kódolással (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: nem legfeljebb 16 jegyű pozitív egész szám (2^53 alatt); `invalid_request`: érvénytelen URL-kódolás.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: a kérés tokent tartalmazott, de az érvénytelen.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: nincs ilyen játszma.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: a `public_read` korlát vagy a fiókkeret.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: többek között akkor, ha a tárolt lépések újrajátszása nem vezet el a tárolt befejezéshez (a szerver naplózza).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (az adatbázis zárolva maradt; `retryAfter: 1` a törzsben, `Retry-After` fejléc nélkül), `server_busy` (a munkamenet keresésekor az adatbázis zárolva volt), `timeout`. Továbbá `server_busy` 2–5 közötti `retryAfter` értékkel, ha a szerver erősen le van maradva (lásd a bevezetőt): a szerver nem hajtotta végre a kérést.'
  /games/{id}/gif:
