        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: A lépés UCI-jelöléssel; átváltozásnál a végére kerül egy `n`, `b`, `r` vagy `q`.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: A lépésre elszámolt idő (ms), `null`, ha a rekordban nincs meg.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: A lépő játékos órája a lépés után (ms), `null`, ha a rekordban nincs meg.
    PgnTagsView:
      type: object
      description: A fő PGN-címkék, megjelenítéshez. A `Termination` itt a játszma végét okozó ok neve; a PGN-fájl a PGN-szabvány szerinti értékeket használja.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` vagy `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: A kezdés dátuma UTC szerint.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Az értékszám a kezdéskor, vagy `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Az értékszám a kezdéskor, vagy `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Játszmarekord a lépéseivel és az óraállásaival. A játszma-összefoglaló mezőit tartalmazza, a `color` és az `outcome` kivételével.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Az alapidő ezredmásodpercben.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: A többletidő ezredmásodpercben.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: A `status` neve.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: Annak a játszmának az azonosítója, amelynek ez a visszavágója, vagy `null`.
            moves:
              type: array
              description: Féllépésenként egy bejegyzés.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Csak ha a token játékosa játszott ebben a játszmában; az ő színe.
            reportable:
              type: boolean
              description: Csak ha a token játékosa játszott ebben a játszmában; `true`, ha a `POST /reports` most elfogadná az ellenfél jelentését erre a játszmára (a játszma 7 napon belül fejeződött be, a napi kvóta nem fogyott el, és az ellenfelet még nem jelentették erre a játszmára).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: A felhasználónév, ahogy a játékos írta.
        createdAt:
          type: integer
          format: int64
          description: A fiók létrehozásának ideje (Unix-idő, ms).
        ratings:
          type: array
          description: Csak a hivatalos kategóriák, a szerver sorrendjében.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Minden tárolt játszma, a barátságosakat és a megszakítottakat is beleértve.
            rated:
              type: integer
              minimum: 0
              description: Értékelt játszmák, az értékszám-rekordokból összegezve.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: A felhasználónév, ahogy a játékos írta.
        games:
          type: array
          description: Az oldal játszmái, a legújabbal kezdve.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Az utolsó játszma azonosítója, ha az oldal megtelt (a következő oldal ekkor üres is lehet), egyébként `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: A kategória azonosítója.
        minGames:
          type: integer
          minimum: 0
          description: A listázáshoz egy rekordnak szükséges beszámított játszmák száma (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: A ranglista kiszámításának ideje (Unix-idő, ms).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: A PGN-szöveg, legfeljebb 65 536 bájt UTF-8 kódolásban. A szerver csak az első játszmát használja.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Nem kötelező. A kép mérete.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Nem kötelező. A tábla alján lévő fél.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Nem kötelező. Ezredmásodperc lépésenként, egész értékű JSON-szám.
        coords:
          type: boolean
          default: true
          description: Nem kötelező. Megjelennek-e a vonalak betűi és a sorok számai a tábla körül.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: A játszma, egész számként vagy 1–16 számjegyből álló karakterláncként.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Az ellenfél felhasználóneve, a játszmarekordban szereplő vagy a jelenlegi alakjában, kis- és nagybetűtől függetlenül. Nem lehet üres.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Mire vonatkozik a jelentés.
        comment:
          type:
            - string
            - 'null'
          description: Nem kötelező. Legfeljebb 500 karakter a vezérlőkarakterek (a tabulátor és a soremelés kivételével) eltávolítása, valamint a kezdő és záró szóközök levágása után.
    AccountExport:
      type: object
      description: Minden, amit a szerver a fiókról tárol (az időpontok Unix-időben, ms).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Az exportálás ideje.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Mit tartalmaz és mit hagy ki a fájl, egyszerű angol nyelven a játékos számára.
          items:
            type: string
        account:
          description: A `GET /account/me` fióknézete, `googleEmail` mezővel kiegészítve.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: A kapcsolt Google-fiók címe, vagy `null`.
        ratings:
          type: array
          description: A teljes értékszám-rekordok.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Az ellenfél csalásának megállapítása után visszakapott értékszámpontok, UTC-naponként és kategóriánként összesítve, a legújabbal kezdve. Sem a játszmák, sem a csalók nincsenek megnevezve.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Minden tárolt munkamenet, a legújabbal kezdve, tokenek nélkül. Az adatmegőrzési törlés eltávolítja a lejárt munkamenetet, a kijelentkeztetettet pedig a kijelentkeztetés után egy nappal.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: A biztonsági események, a legújabbal kezdve, `RETENTION_SECURITY_DAYS` napig megőrizve.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Minden szankció, a feloldottakat is beleértve. A moderátor neve soha nem szerepel benne.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: A játékos elhagyott, megszakított és első lépés nélkül maradt játszmáihoz rögzített magatartási események, 30 napig megőrizve.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: A játékos által tett jelentések.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: A játszmák száma.
            list:
              type: array
              description: Minden játszma, a legújabbal kezdve, a `GET /account/games` összefoglalóiként. A lépések a `GET /games/{id}` végponton érhetők el, a PGN a `GET /games/{id}/pgn` végponton.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Teljes értékszám-rekord.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Kilépett-e már a játékos az értékszám nélküli szakaszból.
            countedGames:
              type: integer
              minimum: 0
              description: Az értékszámba beszámított játszmák.
            updatedAt:
              type: integer
              format: int64
              description: A rekord utolsó módosításának ideje.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: A nap 00:00 UTC időpontja (Unix-idő, ms).
        category:
          type: string
        points:
          type: integer
          description: Az aznap, abban a kategóriában visszaadott pontok.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: A munkamenet kijelentkeztetésének ideje, vagy `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: A bejelentkezés IP-címe, `RETENTION_IP_DAYS` nap után törlődik.
    SecurityEvent:
      type: object
      description: |-
        Biztonsági esemény. Az `ip` csak a bejelentkezve, a fiók jelszavával (és második faktorral) vagy a fiók címére küldött linkkel végzett műveleteknél szerepel: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` és `account_exported`; minden más típusnál `ip: null`, és az `ip` `RETENTION_IP_DAYS` nap után törlődik.

        A `detail` csak ezeket a mezőket őrzi meg: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` és `method` (`password` vagy `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` és `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Egy `moderator_action` esemény csak a `{ action }` értéket őrzi meg, a `ban`, `unban`, `reset_mfa`, `verify_email` és `revoke_sessions` műveleteknél (a többi moderátori művelet kimarad). Minden más típusnál `detail: null`. A `rating_refund` események kimaradnak: a pontjaik a `ratingRefunds` mezőben vannak.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Az esemény típusa (`login`, `password_changed`…).
        at:
          type: integer
          format: int64
          description: Mikor történt.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: A jelentett játékos jelenlegi nyilvános neve.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Nyitott-e még a jelentés (az nem derül ki, hogy a jelentett játékost szankcionálták-e).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Az e-mailben küldött link tokenje (az oldal űrlapjának rejtett mezője).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: A visszaállító link tokenje (az űrlap rejtett mezője).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Az új jelszó; a regisztráció jelszószabályai érvényesek.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Az új jelszó még egyszer; meg kell egyeznie.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: UTF-8 kódolású HTML-oldal (`text/html; charset=utf-8`), JavaScript és külső erőforrások nélkül.
