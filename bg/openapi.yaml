  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Изтегляне на партия от този сървър като анимиран GIF
      description: |-
        Партията като анимиран GIF. Имената и рейтингите са тези от записа на партията (рейтингите в началото, изтрит акаунт като `deleted#<id>`), както и резултатът и краят (`Resignation`, `Loss on time`…).

        Проверките са в този ред: `gif_disabled`, опциите на изображението (`size`, `orientation`, `delay`, `coords`), идентификаторът на партията, партията, дължината ѝ.

        **Изисква се сесия:** квотите се броят по акаунт. **Лимити:** `gif` при всяка заявка; `gif_user_min`, `gif_user_hour`, `gif_ip_min` и `gif_ip_hour` само когато GIF файлът трябва да бъде създаден (вж. описанието на раздела). **Лимит за време:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 секунди (45 секунди по подразбиране).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 'Размерът на изображението: `small` (полета от 32 px), `medium` (48 px) или `large` (72 px).'
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Страната в долната част на дъската.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Милисекунди на ход (от 1 до 6 десетични цифри).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Дали буквите на вертикалите и цифрите на хоризонталите се изобразяват около дъската (`1`) или не (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` с `field` (`size`, `orientation`, `delay` или `coords`): стойност извън позволените. `invalid_game_id`. `invalid_request`: невалидно URL кодиране.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: няма такава партия. `gif_disabled`: сървърът е изключил GIF файловете (`GIF_ENABLED=false`; токенът от лимита `gif` се връща).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимитът `gif`, лимит за рендериране или бюджетът на акаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF файлът не можа да бъде създаден (сървърът записва причината в лога). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` с `retryAfter` (от 3 до 10 секунди) и `Retry-After`: опашката за рендериране е пълна или GIF файлът е чакал `GIF_QUEUE_TIMEOUT_MS` (10 секунди) за свободна нишка; всички токени на лимити, взети от заявката, се връщат. `busy`: базата данни остана заключена (`retryAfter: 1` само в тялото). `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Създаване на анимиран GIF от произволна партия, изпратена като PGN
      description: |-
        Същото изображение като `GET /games/{id}/gif` за произволна партия, изпратена като PGN текст: партия, записана от играта, експорт от друг сайт, партия, въведена на ръка. Използва се само първата партия от текста.

        - PGN четецът приема това, което приема собственият четец на играта: всеки PGN, който този сървър пише, и обичайните експорти от други сайтове (коментарите, вариантите, NAG и анотациите на часовника се пропускат; номерата на ходовете и SAN се четат толерантно; таг `FEN` задава началната позиция, освен ако `SetUp` е `"0"`).
        - Имената и рейтингите идват от таговете `White`, `Black`, `WhiteElo` и `BlackElo`. Буквите с диакритични знаци губят знаците си, другите знаци извън печатимия ASCII стават `?`, а дългите имена се съкращават (до 48 знака). Резултатът идва от тага `Result`, иначе от края на текста на ходовете. Тагът `Termination` се показва, освен ако е `normal`: тогава финалната позиция говори сама (мат, пат).
        - Тази крайна точка сама проверява тялото си: при непознато поле или когато `pgn` липсва или не е низ, отговорът е 400 `invalid_request` с `field`; при грешна опция отговорът е 400 `invalid_option` (`delayMs` трябва да е JSON число, `coords` – булева стойност; `null` се отказва).

        **Изисква се сесия:** квотите се броят по акаунт. **Лимити:** както за `GET /games/{id}/gif`. **Лимит за размера на тялото:** 135 168 байта, независимо от `HTTP_BODY_LIMIT` (PGN като JSON низ, включително екраниращите последователности). **Лимит за време:** 45 секунди по подразбиране.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Кратка партия, въведена на ръка, без координати
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: PGN файл с всички опции
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` с `field` (непознато поле или `pgn` липсва или не е низ; без `field`, когато тялото не е обект); `invalid_json`; `invalid_option` с `field` (`size`, `orientation`, `delayMs` или `coords`); `invalid_pgn` с `line` и `column` (от 1, колоните са в знаци) и `message` на четеца: неправилен или нееднозначен ход, повреден таг, непозната разновидност на шаха, повече от 65 536 байта.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: сървърът е изключил GIF файловете (`GIF_ENABLED=false`; токенът от лимита `gif` се връща).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: тяло над 135 168 байта.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимитът `gif`, лимит за рендериране или бюджетът на акаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF файлът не можа да бъде създаден (сървърът записва причината в лога). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` с `retryAfter` (от 3 до 10 секунди) и `Retry-After`: опашката за рендериране е пълна или GIF файлът е чакал твърде дълго за свободна нишка; всички токени на лимити, взети от заявката, се връщат. `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
