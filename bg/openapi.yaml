paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Получаване на името, версиите, портовете и правилата за регистрация на сървъра
      description: |-
        Каквото е нужно на клиента, преди да влезе или да се свърже: името и идентификаторът на сървъра, версиите на протокола WebSocket и къде се намира WebSocket, правилата за регистрация, официалните контроли на времето и ограниченията, които клиентът може да провери, преди да изпрати формуляр.

        **Лимити:** само слоят по адрес.
      security: []
      responses:
        '200':
          description: Описанието на сървъра.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: слоят по адрес.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Създаване на акаунт
      description: |-
        Създава акаунт: след като имейл адресът му бъде потвърден чрез изпратената до него връзка, или веднага, ако няма потвърждение по имейл.

        **С потвърждение по имейл** (`REQUIRE_EMAIL_VERIFICATION`, по подразбиране): 202 `verification_sent`. Акаунт все още не съществува: регистрацията чака 24 часа и междувременно резервира потребителското си име. До адреса се изпраща връзка, валидна през тези 24 часа, най-много една на адрес на всеки 5 минути (`POST /auth/verify-email/resend` изпраща нова); акаунтът се създава с вече потвърден адрес, когато връзката бъде използвана (бутонът на страницата `/verify-email`), и тогава играчът може да влезе. Дотогава при опит за вход с това потребителско име отговорът е `invalid_credentials`, както при непознат акаунт, а публичният профил не съществува. Нова регистрация със същия адрес заменя чакащата. Отговорът е същият, когато друг акаунт вече използва адреса: тогава не се изпраща връзка, а собственикът му получава известие (най-много едно на час), и потребителското име се резервира по същия начин, така че нищо да не издава дали адресът има акаунт. Регистрация, чиято връзка не е използвана, отпада след 24 часа и потребителското ѝ име отново става свободно.

        **Без потвърждение по имейл** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, акаунтът се създава веднага и с него може да се влезе.

        **Правила.** `username`: от `USERNAME_MIN` до `USERNAME_MAX` знака (от 3 до 20), букви, цифри, `_` и `-`, като започва с буква или цифра (`GET /info` ги дава като `limits`); запазените имена (`admin`, `moderator`, `deleted`…) и някои префикси се отказват; уникално без значение от главните и малките букви. `email`: без интервали в началото и края и съхраняван с малки букви, само ASCII, с домейн, съдържащ точка. `password`: поне `PASSWORD_MIN_LENGTH` (10) знака и най-много 256 байта в UTF-8; не трябва да съдържа потребителското име или локалната част на имейла и не трябва да е често срещана парола.

        **Грешки**, проверявани в този ред: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; грешките на опашката за хеширане на пароли; 409 `email_taken` (само без потвърждение по имейл).

        **Лимити:** `auth`, след това `auth_register` (10 регистрации на час на клиент). **Доказателство за работа:** винаги, когато `POW_REGISTER_BITS` е над 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Първи опит, без доказателство за работа
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Повторно изпращане с доказателството за работа
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Акаунтът е създаден и с него може да се влезе (на този сървър няма потвърждение по имейл).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Регистрацията чака връзката си за потвърждение (или адресът вече има акаунт; отговорът не издава кое от двете).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (с `field`), `invalid_json`, `invalid_username`, `invalid_email` или `weak_password` с `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` или `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: регистрацията на този сървър е затворена (`GET /info` съобщава `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: потребителското име принадлежи на акаунт или е резервирано от чакаща регистрация с друг адрес. `email_taken`: друг акаунт използва адреса (само без потвърждение по имейл).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимитът `auth` или `auth_register`, или опашката за хеширане на пароли.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (опашката за хеширане на пароли или базата данни остана заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Вход с парола
      description: |-
        Извършва вход с потребителско име или имейл адрес и парола. Възможни са два отговора, и двата със статус 200: сесия или, когато двуфакторното удостоверяване е включено, втора стъпка, която трябва да бъде завършена до 5 минути с `POST /auth/login/mfa`.

        Непознат акаунт, грешна парола и акаунт без парола получават един и същ отговор след едно и също време: 401 `invalid_credentials`. Проверките на акаунта (`banned`, `email_unverified`) идват едва след вярна парола. От `AUTH_FAILURES_PER_ACCOUNT` (5) неуспеха с едно име за вход нататък всеки опит трябва да изчака (429 `too_many_attempts`).

        **Лимит:** `auth`. **Доказателство за работа:** само по време на вълна от неуспешни опити за вход (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Сесия или втората стъпка на вход с двуфакторно удостоверяване.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Успешен вход
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Двуфакторното удостоверяване е включено
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: непознат акаунт, грешна парола или акаунт без парола.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Само след вярна парола: `banned` с `until` (мс от Unix епохата, `null` при постоянно блокиране) или `email_unverified` (по-стар акаунт, чийто адрес още не е потвърден).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (забавянето след неуспешни опити за това име за вход) или `rate_limited` (лимитът `auth`, опашката за хеширане на пароли).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (опашката за хеширане на пароли или базата данни остана заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Завършване на вход с втори фактор
      description: |-
        Втората стъпка на вход с двуфакторно удостоверяване, след като `POST /auth/login` или вход с Google (`POST /auth/sso/google/finish` или `POST /auth/sso/google/link`) е отговорил с `mfaRequired`. Изпратете `code` (6-цифрен код от приложението за удостоверяване или код за възстановяване) или `recoveryCode`. Код за възстановяване, използван тук, се изразходва.

        Една стъпка приема най-много 5 грешни кода; стъпката приключва и когато паролата бъде нулирана или сменена. След стъпката с паролата при свързване с Google свързването се съхранява само ако кодът бъде приет тук.

        **Лимити:** `auth` и най-много `AUTH_MFA_PER_ACCOUNT` (10) кода за 15 минути за акаунта, от всеки адрес; над това кодът не се проверява, така че кодът за възстановяване не се изразходва.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Код от приложението за удостоверяване
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Код за възстановяване
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Успешен вход.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: не е изпратен нито `code`, нито `recoveryCode`, или тялото нарушава схемата; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: стъпката е изтекла, вече е използвана или е приключила след 5 грешни кода, или паролата е нулирана или сменена след първата стъпка (влезте отново). `invalid_code`: грешен или вече използван код.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (с `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: само след стъпката с паролата при свързване с Google – междувременно акаунтът в Google е свързан с друг акаунт.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: само след стъпката с паролата при свързване с Google – междувременно акаунтът се е променил; започнете входа отначало.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: забавянето след неуспешни опити на акаунта или неговите `AUTH_MFA_PER_ACCOUNT` кода за последните 15 минути са изчерпани. `rate_limited`: лимитът `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` с `retryAfter: 1`: базата данни остана заключена (след стъпка на свързване с Google нищо не е свързано: започнете входа отначало). `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Изход от тази сесия
      description: |-
        Прекратява сесията на използвания токен. WebSocket връзката, отворена с него, се затваря. Без тяло (или `{}`).

        **Лимит:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешен изход.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: тяло, различно от `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимитът `sessions` или бюджетът на акаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (базата данни остана заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
        - sessions
      summary: Изход от всички сесии
      description: |-
        Прекратява всички сесии на акаунта, включително тази. WebSocket връзките, отворени с тях, се затварят. Без тяло (или `{}`).

        **Лимит:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешен изход от всички сесии.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: тяло, различно от `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимитът `sessions` или бюджетът на акаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (базата данни остана заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Повторно изпращане на връзката за потвърждение
      description: |-
        Изпраща отново връзката за потвърждение на имейла. Отговорът е 202 `accepted` независимо от адреса, така че никога да не издава дали акаунт или регистрация го използва.

        Заявката има действие най-много веднъж на 5 минути за даден адрес. Чакаща регистрация с този адрес получава отново своите 24 часа, независимо дали друг акаунт използва адреса, така че потребителското ѝ име да остава резервирано еднакво дълго и в двата случая. Връзка се изпраща само за тази регистрация, когато адресът няма акаунт (нова връзка, валидна 24 часа, заменя предишната), или за активен непотвърден акаунт с този адрес.

        **Лимити:** `auth`, след това `auth_mail` (10 на час на клиент).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Заявката е приета (независимо от адреса).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимитът `auth` или `auth_mail` (независимо от адреса).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` с `retryAfter: 1`: базата данни остана заключена, докато се търсеше акаунтът или се съхраняваше връзката на непотвърден акаунт (подновяването на чакаща регистрация се прави по възможност и никога не проваля заявката); 5-те минути на адреса въпреки това започват да текат, така че нова заявка в рамките им не прави нищо. `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Изпращане на връзка за нулиране на паролата
      description: |-
        Изпраща връзка за нулиране на паролата, валидна един час, която отваря страницата `/reset-password`. Отговорът е 202 `accepted` независимо от адреса. Връзка се изпраща само до активен акаунт, най-много веднъж на 5 минути за даден адрес. Акаунт само с вход с Google задава първата си парола по този начин.

        Възстановяването на паролата има най-строгите лимити в API, всички броени за целия сървър: 3 заявки на час (`AUTH_FORGOT_PER_HOUR`) и 10 за 24 часа (`AUTH_FORGOT_PER_DAY`) на клиент (IPv4 адрес или IPv6 /64), 3 пъти повече на IPv6 /48, в допълнение към лимита `auth` (20 за 10 минути) и към единия имейл на адрес на всеки 5 минути. Нито 202, нито 429 издава дали акаунт използва адреса. Задаването на новата парола има собствен лимит (`auth_reset`).

        **Лимити:** `auth`, `auth_forgot`, след това `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Заявката е приета (независимо от адреса).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимитът `auth`, `auth_forgot` или `auth_forgot_day` (независимо от адреса).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` с `retryAfter: 1`: базата данни остана заключена, докато се търсеше акаунтът или се съхраняваше връзката; 5-те минути на адреса въпреки това започват да текат, така че нова заявка в рамките им не изпраща връзка. `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Задаване на нова парола с токена от връзка за нулиране
      description: |-
        Задава нова парола с токена от връзка за нулиране (страницата `/reset-password` прави същото). Новата парола следва правилата за регистрация.

        Нулирането има следните последици, в една транзакция (всички или нито една): прекратява всички сесии и отменя чакаща смяна на имейла; другите връзки за нулиране на акаунта спират да работят; адресът се смята за потвърден (връзката го е доказала); собственикът получава имейл. Двуфакторното удостоверяване не се засяга. След грешка на опашката за хеширане на пароли, 503 или 500 нищо не е променено: старата парола и сесиите остават, а връзката остава валидна.

        **Лимити:** `auth`, след това `auth_reset` (10 на час на клиент, 30 на IPv6 /48, общ със страницата: всеки опит хешира парола).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Паролата е сменена и е извършен изход от всички сесии.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: връзката е невалидна, използвана или изтекла, или е изпратена до адрес, който акаунтът вече няма. `weak_password` (с `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимитът `auth` или `auth_reset`, или опашката за хеширане на пароли.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: опашката за хеширане на пароли или базата данни остана заключена (`retryAfter: 1`, нищо не е променено). `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Започване на вход с Google
      description: |-
        Започва опит за вход с Google за PKCE предизвикателството и порта на слушателя на играта на `127.0.0.1`. Отговорът дава URL адреса на Google, който да се отвори в системния браузър, и `state` на опита; опитът е валиден 10 минути.

        `authUrl` съдържа `client_id`, `redirect_uri` (съставен от `redirectPort` и етикета на произхода на сървъра), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 на собствения верификатор на сървъра за Google) с `code_challenge_method=S256` и `prompt=select_account`. Играта го проверява, преди да го отвори (вж. описанието на раздела).

        **Лимит:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Опитът.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: входът с Google не се предлага на този сървър.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимитът `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (базата данни остана заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Започване на вход с Google на уебсайт
      description: |-
        Започва опит за вход с Google от уебсайт за PKCE предизвикателството на неговата страница. Отговорът е същият като за играта: URL адресът на Google, към който да се премине, и `state` на опита; опитът е валиден 10 минути. Предлага се, когато `GET /info` съобщава `sso.googleWeb: true`.

        `authUrl` съдържа `client_id` на уебсайта и `redirect_uri=GOOGLE_WEB_REDIRECT_URI`, а останалите параметри са същите като за играта. Страницата го проверява, преди да премине към него (вж. **На уебсайт** в описанието на раздела).

        **Лимит:** `sso_start`, общ с началната заявка на играта.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: Опитът.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: липсващ `codeChallenge` или такъв с грешен формат, или което и да е друго поле (включително `redirectPort`).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: входът с Google не се предлага на този сървър или не се предлага на уебсайтове.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимитът `sso_start` (общ с началната заявка на играта).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (базата данни остана заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Предаване на отговора на Google на сървъра
      description: |-
        Предава на сървъра `code` и `state`, които Google е изпратил до слушателя на играта или до страницата на уебсайта, заедно с идентификатора на опита и PKCE верификатора. Идентификаторът на опита е безполезен без верификатора, а кодът е безполезен без собствения PKCE верификатор и клиентската тайна на сървъра.

        Сървърът проверява опита (непознат, използван или изтекъл: 410), след това верификатора (грешен верификатор оставя опита използваем), след това използва опита еднократно, проверява `state` и `iss`, обменя кода с Google и проверява ID токена. Отговорът (200) е един от следните:

        - `{ token, expiresAt, user }`: успешен вход в свързания акаунт;
        - `{ mfaRequired, mfaToken, expiresIn }`: продължете с `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: нов акаунт; продължете с `POST /auth/sso/complete` до 10 минути. `suggestedUsername` идва от името в Google или от адреса и е `""`, когато нищо не е подходящо;
        - `{ needsPassword, linkTicket, username, expiresIn }`: акаунтът с този адрес има парола; продължете с `POST /auth/sso/google/link`. Все още нищо не е свързано.

        **Лимит:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Сесия, втора стъпка или следващата стъпка на първи вход с Google.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Успешен вход в свързания акаунт
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Двуфакторното удостоверяване е включено
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Нов играч
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Акаунт с парола използва адреса
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: верификаторът не съответства на предизвикателството на опита (опитът остава използваем). `sso_email_unverified`: Google не е потвърдил адреса. `registration_closed`. `account_disabled`. Само за свързан акаунт: `banned` (с `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: входът с Google не се предлага на този сървър.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: активен акаунт без парола използва адреса (той не се посочва).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: непознат, използван или изтекъл опит.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимитът `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (базата данни остана заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Свързване на Google със съществуващ акаунт чрез паролата му
      description: |-
        След като `finish` е отговорил с `needsPassword`: свързва Google със съществуващия акаунт чрез паролата на този акаунт, въведена в играта. Отговорът (200) е сесия (свързването се съхранява и играчът влиза) или, когато двуфакторното удостоверяване е включено, `{ mfaRequired, mfaToken, expiresIn }`: продължете с `POST /auth/login/mfa`, като свързването се съхранява само когато там бъде приет код.

        Грешна парола оставя билета използваем, общо за 5 опита. Опит се отчита точно преди проверката на паролата: 429 `too_many_attempts` или 428 `pow_required` не отнемат опит, докато отказ от опашката за хеширане на пароли (503 `server_busy`, 429 `rate_limited`) вече е отнел един и се брои като неуспех на акаунта. Забавянето след неуспешни опити използва същия брояч като `POST /auth/login`.

        **Лимит:** `auth` (заедно с броенето му по мрежа IPv6 /48). **Доказателство за работа:** както при `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Сесия или втората стъпка на входа.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: грешна парола; билетът се запазва – общо за 5 опита.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (с `until`), само след правилна парола.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: входът с Google не се предлага на този сървър.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: междувременно акаунтът в Google е бил свързан с друг акаунт.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: непознат, използван или изтекъл билет, 5-ата грешна парола, акаунт, чийто статус или адрес се е променил след `finish`, или акаунт, чийто статус, адрес, парола или двуфакторно удостоверяване са се променили, докато свързването се съхраняваше. Започнете входа отначало.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (забавянето след неуспешни опити на акаунта) или `rate_limited` (лимитът `auth`, опашката за хеширане на пароли).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: опашката за хеширане на пароли или базата данни остана заключена (`retryAfter: 1`, нищо не е свързано). `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Създаване на акаунта при първи вход с Google
      description: |-
        След като `finish` е отговорил с `needsUsername`: създава акаунта с избраното потребителско име (важат правилата за регистрация) и извършва вход в него. Акаунтът няма парола: `hasPassword` е `false`, а „Забравена парола?“ (`POST /auth/password/forgot`) му задава парола.

        **Лимит:** `auth` (заедно с броенето му по мрежа IPv6 /48).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Акаунтът е създаден и входът е успешен.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: входът с Google не се предлага на този сървър.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (някой акаунт има това потребителско име или чакаща регистрация на друг адрес го е запазила), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: непознат, използван или изтекъл билет.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимитът `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (базата данни остана заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Списък на устройствата с активен вход
      description: |-
        Активните сесии на акаунта (устройствата с активен вход), като най-скоро използваната е първа. `current` отбелязва сесията, от която идва заявката. `lastSeenAt` се обновява най-много веднъж на 5 минути (по-късно, докато сървърът сериозно изостава); `expiresAt` е абсолютният край, а лимитът за неактивност може да прекрати сесията по-рано.

        **Лимит:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Активните сесии.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимитът `sessions` или бюджетът на акаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (базата данни остана заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Изход от едно устройство
      description: |-
        Извършва изход от една сесия на акаунта; това може да е и текущата сесия. WebSocket връзката, отворена с нея, се затваря. Без тяло (или `{}`).

        **Лимит:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Успешен изход от сесията.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: тяло, различно от `{}`, или `id`, което не е валидно URL кодиране; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: в този акаунт няма активна сесия с този идентификатор.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимитът `sessions` или бюджетът на акаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (базата данни остана заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Получаване на акаунта, рейтингите му и активните санкции
      description: |-
        Акаунтът такъв, какъвто го вижда неговият играч: изгледът на акаунта (също `user` във всеки отговор при вход), по един рейтингов запис за всяка категория, в която играчът е играл партии с рейтинг, активните санкции и блокирането. Нивото на доверие от античийт системата никога не се показва.

        **Лимит:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Акаунтът.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized` или `invalid_token` (и когато акаунтът е изтрит).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимитът `account` или бюджетът на акаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (базата данни остана заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Приемане или отказ на преки предизвикателства
      description: |-
        Задава дали другите играчи могат да предизвикват този играч по име. При `none` преките предизвикателства се отказват: на предизвикващия се съобщава, че играчът не е на разположение. Без повторно удостоверяване.

        **Лимит:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: Предпочитанията, които са в сила сега.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимитът `account` или бюджетът на акаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (базата данни остана заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Смяна на паролата
      description: |-
        Сменя паролата. Нужна е текущата парола, но не и втори фактор, дори при включено двуфакторно удостоверяване. Новата парола следва правилата за регистрация (проверява се след текущата парола).

        Промяната има следните последици в една транзакция (всички или нито една): прекратява всички други сесии (тази остава с активен вход), отменя чакаща смяна на имейла, връзките за нулиране на паролата на акаунта престават да работят и собственикът получава имейл.

        **Повторно удостоверяване:** само паролата. **Лимити:** `reauth`, след това `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Паролата е сменена.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (акаунт само с вход с Google), `weak_password` (с `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: грешна текуща парола или нулиране или смяна на паролата, настъпили, докато заявката се проверяваше.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (неуспешни повторни удостоверявания на акаунта) или `rate_limited` (лимитът `reauth` или `reauth_user`, бюджетът на акаунта, опашката за хеширане на пароли).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: опашката за хеширане на пароли или базата данни остана заключена (`retryAfter: 1`, нищо не е променено). `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Започване на включването на двуфакторното удостоверяване
      description: |-
        Записва нов чакащ таен ключ за приложението за удостоверяване, който заменя предишния чакащ ключ, ако има такъв, и го връща за приложението (като текст и като URI `otpauth://`, който да се покаже като QR код). Двуфакторното удостоверяване още не е включено: `POST /account/mfa/totp/enable` го включва с код от този таен ключ.

        **Повторно удостоверяване:** само паролата. **Лимити:** `reauth`, след това `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Чакащият таен ключ.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (акаунт само с вход с Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (проверява се преди паролата).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (неуспешни повторни удостоверявания на акаунта) или `rate_limited` (лимитът `reauth` или `reauth_user`, бюджетът на акаунта, опашката за хеширане на пароли).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (опашката за хеширане на пароли или базата данни остана заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Завършване на включването на двуфакторното удостоверяване и получаване на кодове за възстановяване
      description: |-
        Включва двуфакторното удостоверяване с код от чакащия таен ключ (точно 6 цифри). Тук не се иска парола; тя е въведена при настройката. Отговорът съдържа 10 кода за възстановяване, показани само този път.

        **Лимити:** `reauth`, след това `reauth_user`; грешен код се брои към неуспешните повторни удостоверявания на акаунта.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Двуфакторното удостоверяване е включено.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` не е точно 6 цифри или тялото нарушава схемата; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: грешен код (проверете часа на устройството).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: няма чакащ таен ключ (първо извикайте `POST /account/mfa/totp/setup`).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (неуспешни повторни удостоверявания на акаунта) или `rate_limited` (лимитът `reauth` или `reauth_user`, бюджетът на акаунта).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (базата данни остана заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: Изключване на двуфакторното удостоверяване
      description: |-
        Изключва двуфакторното удостоверяване. Тайният ключ и кодовете за възстановяване се изтриват, а собственикът получава имейл.

        **Повторно удостоверяване:** паролата и код от приложението за удостоверяване или код за възстановяване (задължително е едно от `code` или `recoveryCode`). **Лимити:** `reauth`, след това `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Двуфакторното удостоверяване е изключено.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (акаунт само с вход с Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required` (нито `code`, нито `recoveryCode`; проверява се преди паролата), `invalid_password`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (неуспешни повторни удостоверявания или твърде много опитани кодове за този акаунт) или `rate_limited` (лимитът `reauth` или `reauth_user`, бюджетът на акаунта, опашката за хеширане на пароли).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (опашката за хеширане на пароли или базата данни остана заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /account/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags:
        - two-step-verification
      summary: Подмяна на кодовете за възстановяване
      description: |-
        Заменя кодовете за възстановяване с 10 нови; старите престават да работят.

        **Повторно удостоверяване:** паролата и код от приложението за удостоверяване в `code` (код за възстановяване се отказва с 403 `invalid_code`). **Лимити:** `reauth`, след това `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodesRequest'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Новите кодове за възстановяване, показани само този път.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - recoveryCodes
                properties:
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (акаунт само с вход с Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code` (и за код за възстановяване).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (неуспешни повторни удостоверявания или твърде много опитани кодове за този акаунт) или `rate_limited` (лимитът `reauth` или `reauth_user`, бюджетът на акаунта, опашката за хеширане на пароли).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (опашката за хеширане на пароли или базата данни остана заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: Смяна на имейл адреса
      description: |-
        Сменя имейл адреса на акаунта. От `newEmail` се премахват интервалите в началото и в края и буквите му стават малки, след което той се проверява като адрес при регистрация.

        **С потвърждение по имейл** (по подразбиране): 202 `verification_sent`. Връзка, валидна 24 часа, се изпраща на новия адрес; тя отваря `/confirm-email-change`, а адресът се сменя едва когато играчът натисне бутона на тази страница. Дотогава `GET /account/me` показва новия адрес като `pendingEmail`. Нова заявка заменя чакащата; смяна или нулиране на паролата я отменя. На даден нов адрес се изпраща най-много една връзка на 5 минути, независимо кой я иска (заявка за вече чакащата смяна запазва изпратената по-рано връзка, която остава валидна); отговорът е същият. Текущият адрес получава известие, че е поискана смяна към маскиран адрес (`a***@example.org`). Отговорът и `pendingEmail` са същите, когато друг акаунт вече използва новия адрес: тогава не се изпраща връзка, така че тази смяна никога не завършва, а собственикът на този адрес вместо това получава известие (най-много едно на час).

        Когато връзката бъде потвърдена, адресът се сменя и се смята за потвърден, устройствата остават с активен вход, изпратените по-рано връзки (потвърждение, нулиране на паролата, други смени) престават да работят, а на предишния адрес се изпраща известие, в което новият адрес е маскиран.

        **Без потвърждение по имейл** (`REQUIRE_EMAIL_VERIFICATION=false`): адресът се сменя веднага (200 `email_changed`), а на предишния адрес се изпраща известие. Ако друг акаунт използва адреса, отговорът е 409 `email_taken`, а собственикът на този адрес получава известието.

        **Повторно удостоверяване:** паролата и, при двуфакторно удостоверяване, код от приложението за удостоверяване или код за възстановяване. `invalid_email` и `same_email` се проверяват преди паролата, така че не се броят за неуспех. **Лимити:** `reauth`, след това `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Адресът е сменен веднага (на този сървър няма потвърждение по имейл).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: Новият адрес, както е записан.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: Изпратена е връзка за потвърждение до новия адрес (или адресът принадлежи на друг акаунт; отговорът не казва кое от двете).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email` (текущият адрес на акаунта), `password_not_set` (акаунт само с вход с Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` (и когато смяна или нулиране на паролата е изпреварило заявката: не се изпраща връзка), `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: само без потвърждение по имейл.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (неуспешни повторни удостоверявания или твърде много опитани кодове за този акаунт) или `rate_limited` (лимитът `reauth` или `reauth_user`, бюджетът на акаунта, опашката за хеширане на пароли).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: опашката за хеширане на пароли или базата данни остана заключена (`retryAfter: 1`: нищо не е променено и същата заявка може да се изпрати отново). `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: Изтегляне на данните на акаунта
      description: |-
        Всичко, което сървърът пази за акаунта, като един JSON файл за записване (`format` `scacelith-account-export`, `version` 1). Експортът записва събитие по сигурността (`account_exported`). Масивът `notes` на документа казва на играча на прост английски какво е изключено.

        **Никога не влиза в експорта:** хешът на паролата, тайният ключ за двуфакторното удостоверяване и кодовете за възстановяване; който и да е токен на сесия или връзка или хеш на такъв токен; данните на античийт системата (нивото и оценката на доверие, аномалиите, анализът на партиите, тежестта на даден сигнал); сигналите, подадени от други играчи срещу играча; самоличността на модераторите; личните данни на други играчи (противниците се появяват с публичното си име и рейтинг, нищо не показва дали друг играч е бил санкциониран и не се включва IP адрес, който може да е на друг човек).

        **Повторно удостоверяване:** паролата и, при двуфакторно удостоверяване, код от приложението за удостоверяване или код за възстановяване. **Лимити:** `account_export` (5 на час на играч, за целия сървър; брои се всеки опит, включително неуспешните; проверява се първи), след това `reauth` и `reauth_user`. **Лимит за време:** 60 секунди.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
