    post:
      operationId: submitResetPasswordPage
      tags:
        - pages
      summary: Задаване на нова парола от формуляра за нулиране
      description: |-
        Формулярът на страницата за нулиране; прави същото като `POST /auth/password/reset`, в една транзакция: всички устройства излизат от акаунта, чакаща смяна на имейла се отменя, другите връзки за нулиране престават да работят, адресът се смята за потвърден и собственикът получава имейл.

        Първо се проверява връзката, след това дали двете пароли са еднакви, след това правилата за паролата. Когато сървърът е зает, формулярът се връща с `Retry-After` и връзката остава валидна.

        **Лимити:** `auth`, след това `auth_reset` (споделен с `POST /auth/password/reset`).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: Паролата е сменена и всички устройства са излезли от акаунта.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: Формулярът отново с грешката (паролите се различават, слаба парола), връзката е невалидна или формулярът е невалиден (HTML страница).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: Лимитът `auth` или `auth_reset` (HTML страница), формулярът отново с `Retry-After`, когато този клиент има твърде много чакащи хеширания на пароли (връзката остава валидна), или слоят по адрес (JSON `rate_limited`).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'Формулярът отново с `Retry-After`, когато сървърът е зает (опашката за хеширане на пароли или базата данни остана заключена); връзката остава валидна. Когато сървърът сериозно изостава (вж. въведението), вместо това страница „Server error“ („Грешка в сървъра“) с `Retry-After` (от 2 до 5): нищо не е изпълнено и връзката остава валидна. Също и изтичане на времето на обработчика.'
