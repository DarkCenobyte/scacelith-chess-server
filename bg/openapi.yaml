        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (неуспешни повторни удостоверявания или твърде много опитани кодове за този акаунт) или `rate_limited` (лимитът `account_export`, `reauth` или `reauth_user`, бюджетът на акаунта, опашката за хеширане на пароли).'
        '500':
          $ref: '#/components/responses/InternalError'
