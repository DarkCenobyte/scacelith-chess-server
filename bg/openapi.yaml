  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Подаване на сигнал срещу противника от скорошна партия
      description: |-
        Подава сигнал срещу противника от една от собствените партии на играча, завършила през последните 7 дни. Сигналът сам по себе си никога не променя рейтинг, санкция или ниво на доверие. Той повишава приоритета за преглед, който модераторите виждат, и, освен при `abuse`, изисква анализ на партията от шахматна програма.

        Сигнал срещу същия противник за същата партия получава същия отговор и не променя нищо; отговорът никога не казва нищо за акаунта, срещу който е подаден сигналът. `GET /games/{id}` казва предварително на играчите от партията дали сигналът би бил приет (`reportable`).

        Тази крайна точка сама проверява тялото си, в реда `gameId`, `reported`, `category`, `comment`: при неуспех отговорът е 400 `invalid_request` без `field`. Полетата, които не познава, се пренебрегват.

        **Лимити:** `reports` (по играч), след това `REPORTS_PER_DAY` (5) сигнала на играч за 24 часа (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Сигналът е получен (или вече е бил подаден).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (без `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: посоченият играч не е противник на подателя на сигнала в партия, завършила през последните 7 дни.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, със заглавка `Retry-After`): `REPORTS_PER_DAY` сигнала през последните 24 часа. `rate_limited`: лимитът `reports` или бюджетът на акаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (търсенето на сесията завари базата данни заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
