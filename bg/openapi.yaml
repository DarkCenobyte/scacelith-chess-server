        - players
      properties:
        category:
          type: string
          description: Идентификаторът на категорията.
        minGames:
          type: integer
          minimum: 0
          description: Зачетените партии, които са нужни на един запис, за да влезе в списъка (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Кога е изчислена класацията (мс от Unix епохата).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: Текстът на PGN, най-много 65 536 байта UTF-8. Използва се само първата партия.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Незадължително. Размерът на изображението.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Незадължително. Страната в долната част на дъската.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Незадължително. Милисекунди на ход, JSON число с цяла стойност.
        coords:
          type: boolean
          default: true
          description: Незадължително. Дали буквите на вертикалите и цифрите на хоризонталите се изобразяват около дъската.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Партията, като цяло число или като низ от 1 до 16 цифри.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Потребителското име на противника, както е в записа на партията или както е сега, без значение от регистъра на буквите. Не може да е празно.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: За какво е сигналът.
        comment:
          type:
            - string
            - 'null'
          description: Незадължително. Най-много 500 знака, след като се премахнат управляващите знаци (освен табулацията и новия ред) и интервалите в началото и в края на текста.
    AccountExport:
      type: object
      description: Всичко, което сървърът пази за акаунта (времената са в мс от Unix епохата).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Кога е направен експортът.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Какво съдържа файлът и какво изключва, на прост английски за играча.
          items:
            type: string
        account:
          description: Изгледът на акаунта от `GET /account/me`, с `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Адресът на свързания акаунт в Google или `null`.
        ratings:
          type: array
          description: Пълните рейтингови записи.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Рейтинговите точки, възстановени, след като е установено, че противник е мамил, сумирани по UTC ден и по категория, от най-новите. Не се посочват нито партиите, нито измамниците.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Всички записани сесии, от най-новата, без никакъв токен. Изчистването при изтичане на срока за съхранение изтрива изтеклата сесия, а сесията с извършен изход – ден след изхода.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Събитията по сигурността, от най-новото, пазени `RETENTION_SECURITY_DAYS` дни.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Всички санкции, включително отменените. Името на модератора никога не се включва.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Събитията за поведението, записани за партиите на играча с изоставяне, анулиране или неявяване, пазени 30 дни.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Сигналите, подадени от играча.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Броят на партиите.
            list:
              type: array
              description: Всички партии, от най-новата, като обобщения от `GET /account/games`. Ходовете са в `GET /games/{id}`, а PGN – в `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Пълен рейтингов запис.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Дали играчът е излязъл от фазата без рейтинг.
            countedGames:
              type: integer
              minimum: 0
              description: Партиите, които са влезли в рейтинга.
            updatedAt:
              type: integer
              format: int64
              description: Кога записът е променен за последен път.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: 00:00 UTC на деня (мс от Unix епохата).
        category:
          type: string
        points:
          type: integer
          description: Точките, възстановени през този ден в тази категория.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Кога е извършен изходът от сесията, или `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Адресът, от който е извършен входът, изтриван след `RETENTION_IP_DAYS` дни.
    SecurityEvent:
      type: object
      description: |-
        Събитие по сигурността. `ip` се дава само за действия, извършени с активен вход, с паролата на акаунта (и втория фактор) или с връзка, изпратена на адреса му: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` и `account_exported`; всеки друг вид има `ip: null`, а `ip` се изтрива след `RETENTION_IP_DAYS` дни.

        `detail` пази само тези полета: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` и `method` (`password` или `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` и `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Събитие `moderator_action` пази само `{ action }`, за действията `ban`, `unban`, `reset_mfa`, `verify_email` и `revoke_sessions` (другите действия на модераторите са изключени). Всеки друг вид има `detail: null`. Събитията `rating_refund` са изключени: точките им са в `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Видът на събитието (`login`, `password_changed`…).
        at:
          type: integer
          format: int64
          description: Кога се е случило.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
