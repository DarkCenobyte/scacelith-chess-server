    description: Приложения за удостоверяване (TOTP, RFC 6238) с SHA-1, 6 цифри, 30-секундни стъпки и толеранс от една стъпка в двете посоки, плюс еднократни кодове за възстановяване.
  - name: email-change
    x-displayName: Смяна на имейл адреса
