          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (базата данни остана заключена, със заглавка `Retry-After: 1`), `server_busy` (опашката за хеширане на пароли), `timeout` (60 секунди). Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: Изтриване на акаунта
      description: |-
        Изтрива акаунта; това не може да бъде отменено.

        - Всички сесии се прекратяват веднага: оттук нататък токенът получава 401 `invalid_token`.
        - Потребителското име става `deleted#<id>` в акаунта и във всеки запис на партия.
        - Изтриват се: имейл адресът, хешът на паролата, тайният ключ за двуфакторното удостоверяване и кодовете за възстановяване, сесиите и токените на връзките, свързването с Google, записът за доверие от античийт системата и IP адресите, записани със събитията по сигурността.
        - Рейтингите и партиите се запазват. Партиите остават достъпни за четене под анонимното име, а `GET /players/{username}` отговаря с 404 за предишното име.

        **Повторно удостоверяване:** паролата и, при двуфакторно удостоверяване, код от приложението за удостоверяване или код за възстановяване. **Лимити:** `reauth`, след това `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Акаунтът е изтрит.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (акаунт само с вход с Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (неуспешни повторни удостоверявания или твърде много опитани кодове за този акаунт) или `rate_limited` (лимитът `reauth` или `reauth_user`, бюджетът на акаунта, опашката за хеширане на пароли).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (опашката за хеширане на пароли или базата данни остана заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Списък на партиите на играча, с филтриране и страниране
      description: |-
        Партиите на влезлия играч, от най-новата, с филтриране и страниране, заедно с броя на партиите, които отговарят на филтъра. Всички параметри на заявката са незадължителни, а празна стойност се смята за липсваща.

        Страниране: подайте `next` на предишната страница като `before`; на последната страница `next` е `null`. `total` брои партиите, които отговарят на филтъра, във всички страници.

        **Лимит:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: Идентификатор на официална категория (`3+2` или `3%2B2`) или `custom` за всички партии с друга контрола на времето.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Само партии с рейтинг (`true`) или само приятелски партии (`false`).
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Само спечелените, загубените или завършилите реми партии, от гледна точка на играча. Анулираните партии се появяват само без този филтър.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Една страница от историята.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` не е идентификатор на партия), `invalid_limit` или `invalid_filter` (`category`, `rated` или `result`), всяко с `field`, което посочва параметъра.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимитът `account_games` или бюджетът на акаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (базата данни остана заключена; `retryAfter: 1` в тялото, без заглавка `Retry-After`), `server_busy` (търсенето на сесията завари базата данни заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /games/{id}:
    get:
      operationId: getGame
      tags:
        - games
      summary: Получаване на запис на партия с ходовете и часовниците
      description: |-
        Един запис на партия с ходовете и часовниците ѝ. Без токен или с токена на играч, който не е играл партията, отговорът е публичният. Когато играчът на токена е играл партията, отговорът добавя `you` и `reportable`.

        **Лимит:** `public_read` (по играч с токен, по клиент без токен).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Записът на партията.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameRecord'
              example:
                id: 4100000000001
                category: '3+2'
                rated: true
                timeControl: '180+2'
                white:
                  name: alice
                  rating: 1500
                  ratingAfter: 1510
                  ratingDiff: 10
                black:
                  name: bob
                  rating: 1520
                  ratingAfter: 1510
                  ratingDiff: -10
                status: 1
                reason: 2
                result: 1-0
                termination: Resignation
                plies: 2
                startedAt: 1790620205000
                endedAt: 1790620611000
                baseMs: 180000
                incMs: 2000
                statusName: WhiteWins
                rematchOf: null
                moves:
                  - uci: e2e4
                    spentMs: 0
                    clockMs: 180000
                  - uci: e7e5
                    spentMs: 1700
                    clockMs: 180300
                pgn:
                  Event: Scacelith rated 3+2
                  Site: caissa.scacelith.com
                  Date: '2026.09.28'
                  Round: '-'
                  White: alice
                  Black: bob
                  Result: 1-0
                  WhiteElo: 1500
                  BlackElo: 1520
                  TimeControl: '180+2'
                  Termination: Resignation
                  PlyCount: 2
                you: white
                reportable: true
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: не е положително цяло число от най-много 16 цифри (под 2^53); `invalid_request`: невалидно URL кодиране.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: изпратен е токен и той не е валиден.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: няма такава партия.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: лимитът `public_read` или бюджетът на акаунта.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (базата данни остана заключена; `retryAfter: 1` в тялото, без заглавка `Retry-After`), `server_busy` (търсенето на сесията завари базата данни заключена), `timeout`. Също `server_busy` с `retryAfter` от 2 до 5, когато сървърът сериозно изостава (вж. въведението): заявката не е изпълнена.'
  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Изтегляне на партия като PGN файл
      description: |-
        Същата партия като PGN файл: една партия с краища на редовете `\n` и текст на ходовете в редове под 80 колони. Отговорът е същият със или без токен.

        Тагове, в този ред: `Event` (`<SERVER_NAME> rated <category>` или `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (датата на началото по UTC), `Round`, `White`, `Black`, `Result` (`*` за анулирана партия), `UTCDate` и `UTCTime` (началото), `WhiteElo` и `BlackElo` (рейтингите в началото или `-`), `WhiteRatingDiff` и `BlackRatingDiff` (промените, например `+10` и `-10`, във всяка партия с рейтинг, `+0`, когато правилата за рейтинга оставят рейтинга непроменен; приятелска партия, партия с контрола по избор или анулирана партия нямат нито едното, нито другото), `TimeControl` (в секунди), `Termination` (стандартна стойност на PGN: `normal`; `time forfeit` – падане на флагчето, и когато партията завършва реми; `abandoned`; `rules infraction` – втори неправилен ход или служебна загуба заради нарушение на честната игра; `unterminated` – анулирана партия), `PlyCount`, `ScacelithGameId` (десетичният идентификатор).

        Всеки ход носи `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: показанието на часовника на играча, направил хода, след хода и времето, отчетено за хода, в десети от секундата (с отрязване). Стойност се пропуска, когато записът не я съдържа. След последния ход следва причината за края с думи, а след това резултатът.

        **Лимит:** `public_read` (по играч с токен, по клиент без токен).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: PGN файлът.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'Текстът на PGN, в UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
