                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (липсва или не е официална категория), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
