components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Токен на сесия (`sct_`, последван от 43 знака base64url) от отговор при вход, в заглавката `Authorization`: `Authorization: Bearer <token>`. Префиксът е точно `Bearer` (чувствителен към регистъра) и един интервал; на стойност без него или на токен, който не е от 1 до 512 печатими ASCII знака, отговорът е 401 `invalid_token`, както за всеки друг невалиден токен. Празна заглавка се смята за липсваща.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: Идентификаторът на партията – положително десетично цяло число от най-много 16 цифри без водещи нули, под 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: Идентификаторът на сесията, както го дава `GET /auth/sessions`, записан без водещи нули (`03` не е сесия 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Потребителското име на играча, без значение от регистъра на буквите. Сървърът приема всяко име от 2 до 24 знака от `[A-Za-z0-9_.-]` (най-широкото правило, което някога е позволявал).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Идентификатор на партия; изброяват се само по-старите партии. Подайте `next` на предишната страница. Празна стойност се смята за липсваща.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Размерът на страницата, от 1 до 50. По-голямо число от най-много 3 цифри се смята за 50; празна стойност се смята за липсваща.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: Токенът на връзката от имейла (43 знака base64url). При липсващ или грешен токен се показва страницата „link invalid or expired“ („връзката е невалидна или изтекла“).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Всеки отговор на сървъра забранява кеширането.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Секунди за изчакване преди нов опит; същата стойност като `retryAfter` в тялото.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Предизвикателството за удостоверяване bearer, с `error="invalid_token"` за невалиден токен.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Сървърът затваря връзката след този отговор.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (с `field`, когато грешката е в поле от тялото) или `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Поле нарушава схемата
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Тялото не е JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Слаба парола
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: PGN, който не може да бъде прочетен
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (няма заглавка `Authorization`) или `invalid_token` (токенът е с грешен формат, изтекъл, отменен или принадлежи на изтрит акаунт).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Няма сесия
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Невалиден токен
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Заявката е отказана.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Грешна парола при повторното удостоверяване
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Блокиран акаунт
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found` или функция, която този сървър е изключил.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: тялото не пристигна в рамките на 10 секунди. Сървърът затваря връзката.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Заявката е в конфликт със състоянието на сървъра.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: опитът за вход с Google или билетът е непознат, използван или изтекъл; започнете входа отначало.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: тялото надвишава `HTTP_BODY_LIMIT` (16 384 байта по подразбиране). Сървърът затваря връзката.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: целта на заявката надвишава 4096 знака.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: тялото не е `application/json` или кодировката му не е UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: партията има повече от `GIF_MAX_PLIES` (600) полухода.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: решете предизвикателството `pow` и изпратете отново същата заявка с `pow: { challenge, nonce }`. `reason` казва защо: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` или `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (лимит на честотата, бюджетът на акаунта или опашката за хеширане на пароли) или `too_many_attempts` (ограничение на акаунта), с `retryAfter` и заглавка `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Лимит на честотата
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Твърде много неуспехи в този акаунт
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: неочакван срив. Сървърът го записва в лога.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: грешен `state` или `iss`, или Google е отказал кода или е изпратил ID токен, който не минава проверката (включително код или ID токен на другия клиент – на играта или на уебсайта). Никога не съдържа текста на Google.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` или `timeout`: опитайте отново след `retryAfter`, когато е дадено.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Сървърът е зает
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Базата данни остана заключена (четене)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Сървърът се забави твърде много
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Анимираният GIF като прикачен файл.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` за партия от този сървър, `attachment; filename="scacelith-game.gif"` за PGN, изпратен с `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Размерът на файла в байтове.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: HTML страница.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: HTML страница, която обяснява отказа.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Формулярът не пристигна в рамките на 10 секунди (HTML страница). Сървърът затваря връзката.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: HTML страница, която обяснява конфликта.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Формулярът надвишава `HTTP_BODY_LIMIT` (HTML страница). Сървърът затваря връзката.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Тялото не е нито формуляр (`application/x-www-form-urlencoded`), нито JSON, или кодировката му не е UTF-8 (HTML страница).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Лимит на честотата (HTML страница), с `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Неочакван срив (HTML страница със заглавие „Server error“). Сървърът го записва в лога.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Сървърът е зает (базата данни остана заключена или сървърът сериозно изостава; с `Retry-After`) или се забави твърде много (HTML страница със заглавие „Server error“).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: Единствената форма на всеки отговор с грешка на JSON API.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Кодът на грешката в `snake_case`. По него клиентът избира какво да покаже.
          examples:
            - rate_limited
        message:
          type: string
          description: Изречение на английски, предназначено за логовете и като резервен вариант.
        retryAfter:
          type: integer
          minimum: 1
          description: Секунди за изчакване преди нов опит; присъства само при откази, които отпадат с времето. Тогава отговорът носи и заглавка `Retry-After` със същата стойност, с изключение на 503 `busy` при четенето на историята, на партиите, на играчите и на класацията.
        field:
          type: string
          description: Полето или параметърът на заявката, в който е грешката (`invalid_request`, `invalid_option`, както и `invalid_cursor`, `invalid_limit` и `invalid_filter` на `GET /account/games`). Вложено поле се записва с точка (`pow.nonce`).
        reason:
          type: string
          description: 'Защо: правилото, което `weak_password` нарушава, или защо е поискано или отказано доказателство за работа (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Само при `banned`: краят на блокирането (мс от Unix епохата), `null` при постоянно блокиране.'
        line:
          type: integer
          minimum: 1
          description: 'Само при `invalid_pgn`: редът на грешката, от 1.'
        column:
          type: integer
          minimum: 1
          description: 'Само при `invalid_pgn`: колоната на грешката, от 1, в знаци.'
    PowChallenge:
      type: object
      description: Предизвикателство за доказателство за работа (`pow` на 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Подписаното предизвикателство, което се връща такова, каквото е.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Броят на водещите нулеви битове, които `SHA-256(challenge + ":" + nonce)` трябва да има.
        expiresAt:
          type: integer
          format: int64
          description: Кога изтича предизвикателството (мс от Unix епохата) – 2 минути след издаването му.
    PowAnswer:
      type: object
      description: Отговорът на предизвикателство за доказателство за работа.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: '`challenge` от отговора 428, точно както е в него.'
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Десетичен низ от най-много 20 цифри, такъв, че `SHA-256(challenge + ":" + nonce)` да започва с `bits` нулеви бита.
    ServerInfo:
      type: object
      description: Какво е нужно на клиента, преди да влезе или да се свърже.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Името на сървъра (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: UUID, който базата данни получава при първото си стартиране. Той остава същият при рестартиране. Той е `null`, когато базата данни не може да го даде.
        motd:
          type: string
          description: Съобщението на деня (`SERVER_MOTD`), което може да е празно.
        protocol:
          type: object
          description: Протоколът на WebSocket (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Най-старата версия на протокола, която сървърът поддържа.
            max:
              type: integer
              minimum: 1
              description: Най-новата версия на протокола, която сървърът поддържа.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'Отпечатъкът на схемата на протокола (първите 4 байта от SHA-256 на каноничната ѝ форма, като цяло число без знак: `0xc649140f`, 3326678031, за минорна версия 2 на протокола); информативен, никога не се сравнява.'
            subprotocol:
              type: string
              description: Токенът на подпротокола на WebSocket (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: Портът на WebSocket, който играчите използват (`PUBLIC_WS_PORT`, иначе `WS_PORT`, иначе `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: Пътят на WebSocket.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Дали могат да се създават нови акаунти.
        emailVerification:
          type: boolean
          description: Дали новите акаунти потвърждават адреса си (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Дали на играта се предлага вход с Google.
            googleWeb:
              type: boolean
              description: Дали входът с Google се предлага и на уебсайт (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: Двуфакторното удостоверяване е винаги достъпно.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Битовете на доказателството за работа, които регистрацията изисква (0, ако не изисква).
        categories:
          type: array
          description: Официалните контроли на времето, тези с рейтинг (`RATED_CATEGORIES`), в реда на сървъра. Всяка друга контрола на времето е `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Правилата, които клиентът може да провери, преди да изпрати формуляр.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: Минималната дължина на потребителското име (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: Максималната дължина на потребителското име (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Регулярният израз, на който трябва да отговаря новото потребителско име.
            passwordMinLength:
              type: integer
              description: Минималната дължина на паролата, в знаци (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Максималната дължина на паролата, в байтове UTF-8.
            customTimeControls:
              type: boolean
              description: Дали предизвикателствата и частните партии могат да използват контроли на времето по избор.
            reportsPerDay:
              type: integer
              description: Колко сигнала може да подаде играч за 24 часа (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Най-голямото съобщение по WebSocket, което клиентът може да изпрати, в байтове.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Официална контрола на времето.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 'Идентификаторът на категорията: минути и секунди добавка (`3+2`).'
        baseSec:
          type: number
          minimum: 0
          description: Основното време, в секунди.
        incSec:
          type: number
          minimum: 0
          description: Добавката за ход, в секунди.
    AccountView:
      type: object
      description: Акаунтът такъв, какъвто го вижда неговият играч (`user` в отговорите при вход и в `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: Идентификаторът на акаунта.
        username:
          type: string
          description: Потребителското име.
        email:
          type: string
          format: email
          description: Имейл адресът.
        emailVerified:
          type: boolean
          description: Дали адресът е потвърден.
        mfaEnabled:
          type: boolean
          description: Дали двуфакторното удостоверяване е включено.
        googleLinked:
          type: boolean
          description: Дали е свързан акаунт в Google.
        hasPassword:
          type: boolean
          description: '`false` за акаунт, създаден чрез Google, който още не е задал парола.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Дали се приемат преки предизвикателства по име (вж. `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Кога е създаден акаунтът (мс от Unix епохата).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Последният вход (мс от Unix епохата) или `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Новият адрес при смяна на имейла, която чака своята връзка, или `null`.
    SessionAnswer:
      type: object
      description: Нова сесия.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Токенът на сесията, за заглавката `Authorization` и за WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: Абсолютният край на сесията (мс от Unix епохата); лимитът за неактивност може да я прекрати по-рано.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Втората стъпка на вход с двуфакторно удостоверяване; продължете с `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Токенът на стъпката, за `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Оставащите секунди за завършване на стъпката.
    LoginAnswer:
      description: Сесия или втората стъпка на вход с двуфакторно удостоверяване.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Първи вход с Google; продължете с `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Билетът за `POST /auth/sso/complete`, валиден 10 минути.
        suggestedUsername:
          type: string
          description: Потребителско име, образувано от името в Google или от адреса, или `""`, когато нищо не пасва.
    SsoNeedsPassword:
      type: object
      description: Акаунт с парола използва адреса; продължете с `POST /auth/sso/google/link`. Още нищо не е свързано.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Билетът за `POST /auth/sso/google/link`.
        username:
          type: string
          description: Потребителското име на този акаунт (вижда го само този, който е доказал адреса пред Google).
        expiresIn:
          type: integer
          const: 600
          description: Секундите, през които билетът остава валиден.
    SsoFinishAnswer:
      description: Отговорът на `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Опит за вход с Google.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Опитът, за `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: URL адресът на Google, който да се отвори в системния браузър, след като бъде проверен.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Стойността `state`, която Google трябва да върне.
        expiresIn:
          type: integer
          const: 600
          description: Секундите, през които опитът остава валиден.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Потребителското име; след това се прилагат правилата на сървъра (вж. описанието).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Имейл адресът. Интервалите в началото и в края се премахват и той се записва с малки букви.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Паролата; след това се прилагат правилата за паролата.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Потребителското име или имейл адресът (всеки текст с `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Незадължително. Показва се в списъка на устройствата с активен вход (например `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: '`mfaToken` от отговора при вход (или от отговора при вход с Google).'
        code:
          type: string
          maxLength: 32
          description: Незадължително. 6-цифрен код от приложението за удостоверяване или код за възстановяване.
        recoveryCode:
          type: string
          maxLength: 32
          description: Незадължително. Код за възстановяване. Нужно е едно от `code` и `recoveryCode`.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Имейл адресът.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Параметърът `token` на връзката за нулиране.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Новата парола; прилагат се правилата за паролата при регистрация.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: PKCE предизвикателството S256 на `codeVerifier` на клиента (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Портът на слушателя на клиента на `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: PKCE предизвикателството S256 на `codeVerifier` на страницата (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`attemptId` от `POST /auth/sso/google/start`.'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: PKCE верификаторът; неговият SHA-256 трябва да съвпада с предизвикателството, дадено на `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state` във вида, в който Google го е върнал.'
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: '`code` във вида, в който Google го е върнал (печатими ASCII знаци без интервали).'
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Незадължително. `iss` във вида, в който Google го е върнал, ако го е върнал.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`linkTicket` от `finish`, валиден 10 минути.'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Паролата на акаунта.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`ssoTicket` от `finish`, валиден 10 минути.'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Потребителското име; прилагат се правилата за регистрация.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Активните сесии, като най-скоро използваната е първа.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Активна сесия (устройство с активен вход).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: Идентификаторът на сесията, за `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: Входът (мс от Unix епохата).
        lastSeenAt:
          type: integer
          format: int64
          description: Последното използване (мс от Unix епохата), обновявано най-много веднъж на 5 минути (по-късно, докато сървърът сериозно изостава).
        expiresAt:
          type: integer
          format: int64
          description: Абсолютният край (мс от Unix епохата); лимитът за неактивност може да прекрати сесията по-рано.
        clientLabel:
          type:
            - string
            - 'null'
          description: '`clientLabel` при входа или `null`, когато не е изпратен такъв.'
        current:
          type: boolean
          description: Дали това е сесията, от която идва заявката.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: По един запис за всяка категория, в която играчът е играл партии с рейтинг.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Активните санкции.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }`, докато акаунтът е блокиран, иначе `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Рейтинговият запис на една категория.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: Идентификаторът на категорията.
        rating:
          type: integer
          description: Рейтингът.
        games:
          type: integer
          minimum: 0
          description: Партиите, изиграни в категорията (зачетени или не).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Най-високият достигнат рейтинг.
        provisional:
          type: boolean
          description: '`true`, докато рейтингът още не е установен или има по-малко от `PROVISIONAL_GAMES` зачетени партии (играта го показва като `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Видът на санкцията.
        reason:
          type:
            - string
            - 'null'
          description: Посочената причина, ако има такава.
        startsAt:
          type: integer
          format: int64
          description: Началото (мс от Unix епохата).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Краят (мс от Unix епохата), `null`, когато санкцията е постоянна.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Краят на блокирането (мс от Unix епохата), `null`, когато е постоянно.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all`, за да се приемат преки предизвикателства по име, `none`, за да се отказват.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Текущата парола.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Новата парола; прилагат се правилата за паролата при регистрация.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Паролата на акаунта.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Код от чакащия таен ключ, точно 6 цифри.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Паролата на акаунта.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Незадължително; нужно при двуфакторно удостоверяване (или `recoveryCode`). Код от приложението за удостоверяване или код за възстановяване.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Незадължително. Код за възстановяване (`xxxx-xxxx-xx`; главните и малките букви, интервалите и тиретата нямат значение).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Паролата на акаунта.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Код от приложението за удостоверяване (код за възстановяване се отказва).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Новият адрес; интервалите в началото и в края се премахват и буквите стават малки, след което той се проверява като адрес при регистрация.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Паролата на акаунта.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Незадължително; нужно при двуфакторно удостоверяване (или `recoveryCode`). Код от приложението за удостоверяване или код за възстановяване.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Незадължително. Код за възстановяване.
    TotpSetup:
      type: object
      description: Чакащият таен ключ за приложението за удостоверяване.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Тайният ключ в base32, за въвеждане в приложението.
        uri:
          type: string
          format: uri
          description: URI `otpauth://totp/...`, който да се покаже като QR код.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Секунди на стъпка.
    RecoveryCodeList:
      type: array
      description: 10-те кода за възстановяване, показани само този път. Всеки от тях работи веднъж.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Една от страните в партия.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Името в записа на партията (`deleted#<id>` за изтрит акаунт).
        rating:
          type:
            - integer
            - 'null'
          description: Рейтингът в началото, `null`, когато е неизвестен.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Рейтингът след партията. Партия с рейтинг винаги го има; `null` само за партия, която не се брои за рейтингите (приятелска, с контрола по избор, анулирана).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Промяната на рейтинга, `0`, когато правилата за рейтинга оставят рейтинга непроменен (нулевият резултат по правилата на FIDE, противник без рейтинг, първите партии на играч без рейтинг); `null` както при `ratingAfter`.
    GameSummary:
      type: object
      description: Обобщението на записана партия.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Идентификаторът на партията.
        category:
          type: string
          description: Идентификаторът на официалната категория (`3+2`) или `custom`.
        rated:
          type: boolean
          description: Дали партията се брои за рейтингите.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Контролата на времето в секунди (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (вж. кодовете на партиите).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Кодът на причината за края (вж. кодовете на партиите).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Резултатът, `*` за анулирана партия.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Броят на полуходовете.
        startedAt:
          type: integer
          format: int64
          description: Началото (мс от Unix епохата).
        endedAt:
          type: integer
          format: int64
          description: Краят (мс от Unix епохата).
    Termination:
      type: string
      description: Името на причината за края (вж. кодовете на партиите); `Unknown` за код, който протоколът не познава.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Обобщение на партия от гледна точка на един играч.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Страната на играча.
    HistoryGameSummary:
      description: Партия от историята на влезлия играч.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Основното време в милисекунди.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Добавката в милисекунди.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: Резултатът от гледна точка на играча.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Партиите на страницата, от най-новата.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Идентификаторът, който да се подаде като `before` за следващата страница, или `null` на последната страница.
        total:
          type: integer
          minimum: 0
          description: Броят на партиите, които отговарят на филтъра, във всички страници.
    MoveRecord:
      type: object
      description: Един полуход от партия.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: Ходът в нотация UCI, с добавено `n`, `b`, `r` или `q` при произвеждане.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Времето, отчетено за хода (мс), `null`, когато записът не го съдържа.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Часовникът на играча, направил хода, след хода (мс), `null`, когато записът не го съдържа.
    PgnTagsView:
      type: object
      description: Основните PGN тагове, за показване. `Termination` тук е името на причината за края; PGN файлът използва стандартните стойности на PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` или `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: Датата на началото по UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Рейтингът в началото или `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Рейтингът в началото или `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Запис на партия с ходовете и часовниците ѝ. Има полетата на обобщението на партия, без `color` и `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Основното време в милисекунди.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Добавката в милисекунди.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: Името на `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: Идентификаторът на партията, на която тази е реванш, или `null`.
            moves:
              type: array
              description: По един елемент за всеки полуход.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Само когато играчът на токена е играл тази партия; неговата страна.
            reportable:
              type: boolean
              description: Само когато играчът на токена е играл тази партия; `true`, когато `POST /reports` би приел сега сигнал срещу противника за тази партия (партията е завършила през последните 7 дни, дневната квота не е изчерпана и срещу противника още не е подаден сигнал за тази партия).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Потребителското име, както го е написал играчът.
        createdAt:
          type: integer
          format: int64
          description: Кога е създаден акаунтът (мс от Unix епохата).
        ratings:
          type: array
          description: Само официалните категории, в реда на сървъра.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Всички записани партии, включително приятелските и анулираните.
            rated:
              type: integer
              minimum: 0
              description: Партиите с рейтинг, сумирани от рейтинговите записи.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Потребителското име, както го е написал играчът.
        games:
          type: array
          description: Партиите на страницата, от най-новата.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Идентификаторът на последната партия винаги когато страницата е пълна (тогава следващата страница може да е празна), иначе `null`.
    Leaderboard:
      type: object
