          description: '`all` hyväksyy suorat haasteet nimellä, `none` hylkää ne.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Nykyinen salasana.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Uusi salasana; rekisteröitymisen salasanasäännöt pätevät.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Tilin salasana.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Odottavan salaisen avaimen koodi, tasan 6 numeroa.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Tilin salasana.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Valinnainen; tarvitaan, kun kaksivaiheinen vahvistus on käytössä (tai `recoveryCode`). Todennussovelluksen koodi tai palautuskoodi.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Valinnainen. Palautuskoodi (`xxxx-xxxx-xx`; kirjainkoolla, välilyönneillä ja yhdysmerkeillä ei ole merkitystä).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Tilin salasana.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Todennussovelluksen koodi (palautuskoodi hylätään).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Uusi osoite; alusta ja lopusta poistetaan välilyönnit ja se muutetaan pieniksi kirjaimiksi, minkä jälkeen se tarkistetaan kuten rekisteröitymisosoite.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Tilin salasana.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Valinnainen; tarvitaan, kun kaksivaiheinen vahvistus on käytössä (tai `recoveryCode`). Todennussovelluksen koodi tai palautuskoodi.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Valinnainen. Palautuskoodi.
    TotpSetup:
      type: object
      description: Odottava salainen avain todennussovellusta varten.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Salainen avain base32-muodossa, sovellukseen kirjoitettavaksi.
        uri:
          type: string
          format: uri
          description: '`otpauth://totp/...`-URI, joka näytetään QR-koodina.'
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Sekunteja jaksoa kohden.
    RecoveryCodeList:
      type: array
      description: 10 palautuskoodia, jotka näytetään vain tämän kerran. Kukin toimii kerran.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Yksi pelin osapuolista.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Nimi pelitietueessa (poistetulla tilillä `deleted#<id>`).
        rating:
          type:
            - integer
            - 'null'
          description: Vahvuusluku alussa, `null`, jos tuntematon.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Vahvuusluku pelin jälkeen. Pisteytetyssä pelissä se on aina; `null` vain pelille, joka ei vaikuta vahvuuslukuihin (pisteyttämätön, mukautettu, peruttu).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Vahvuusluvun muutos, `0`, kun vahvuuslukusäännöt jättävät vahvuusluvun ennalleen (FIDEn nollatulos, luokittelematon vastustaja, luokittelemattoman pelaajan ensimmäiset pelit); `null` samoin kuin `ratingAfter`.
    GameSummary:
      type: object
      description: Tallennetun pelin yhteenveto.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Pelin tunniste.
        category:
          type: string
          description: Virallisen peliaikaluokan tunniste (`3+2`) tai `custom`.
        rated:
          type: boolean
          description: Vaikuttaako peli vahvuuslukuihin.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Peliaika sekunteina (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (katso pelikoodit).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Päättymissyyn koodi (katso pelikoodit).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Tulos, perutulle pelille `*`.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Puolisiirtojen määrä.
        startedAt:
          type: integer
          format: int64
          description: Alkuhetki (Unix-aika, ms).
        endedAt:
          type: integer
          format: int64
          description: Päättymishetki (Unix-aika, ms).
    Termination:
      type: string
      description: Päättymissyyn nimi (katso pelikoodit); `Unknown` koodille, jota protokolla ei tunne.
      enum:
