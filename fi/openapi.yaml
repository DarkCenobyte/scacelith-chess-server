          description: '`invalid_request`: muu runko kuin `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `sessions`-rajoitus tai tilikohtainen budjetti.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (tietokanta pysyi lukittuna), `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Lähetä vahvistuslinkki uudelleen
      description: |-
        Lähettää sähköpostin vahvistuslinkin uudelleen. Vastaus on 202 `accepted` osoitteesta riippumatta, jotta se ei koskaan paljasta, käyttääkö jokin tili tai rekisteröityminen osoitetta.

        Pyyntö vaikuttaa enintään kerran 5 minuutissa osoitetta kohden. Osoitteella odottava rekisteröityminen saa jälleen täydet 24 tuntia riippumatta siitä, käyttääkö toinen tili osoitetta, jotta sen käyttäjänimi pysyy varattuna yhtä kauan kummassakin tapauksessa. Linkki lähetetään vain tälle rekisteröitymiselle, kun osoitteella ei ole tiliä (uusi, 24 tuntia voimassa oleva linkki korvaa edellisen), tai aktiiviselle vahvistamattomalle tilille, jolla on tämä osoite.

        **Rajoitukset:** `auth`, sitten `auth_mail` (10 tunnissa asiakasta kohden).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Hyväksytty (osoitteesta riippumatta).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth`- tai `auth_mail`-rajoitus (osoitteesta riippumatta).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` arvolla `retryAfter: 1`: tietokanta pysyi lukittuna, kun tiliä haettiin tai vahvistamattoman tilin linkkiä tallennettiin (odottavan rekisteröitymisen uusiminen tehdään parhaan yrityksen periaatteella eikä koskaan aiheuta pyynnön epäonnistumista); osoitteen 5 minuutin jakso alkaa silti, joten uusi pyyntö sen aikana ei tee mitään. `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Lähetä salasanan nollauslinkki
      description: |-
        Lähettää tunnin voimassa olevan salasanan nollauslinkin, joka avaa sivun `/reset-password`. Vastaus on 202 `accepted` osoitteesta riippumatta. Linkki lähetetään vain aktiiviselle tilille, enintään kerran 5 minuutissa osoitetta kohden. Pelkän Google-kirjautumisen tili asettaa ensimmäisen salasanansa tällä tavalla.

        Salasanan palautuksella on rajapinnan tiukimmat rajoitukset, jotka kaikki lasketaan koko palvelimen laajuisesti: 3 pyyntöä tunnissa (`AUTH_FORGOT_PER_HOUR`) ja 10 pyyntöä 24 tunnissa (`AUTH_FORGOT_PER_DAY`) asiakasta kohden (IPv4-osoite tai IPv6 /64), kolminkertaiset määrät IPv6 /48 -verkkoa kohden, ja lisäksi `auth`-rajoitus (20 pyyntöä 10 minuutissa) ja yksi sähköpostiviesti osoitetta kohden 5 minuutin välein. Kumpikaan vastauksista 202 ja 429 ei paljasta, käyttääkö jokin tili osoitetta. Uuden salasanan asettamisella on oma rajoituksensa (`auth_reset`).

        **Rajoitukset:** `auth`, `auth_forgot`, sitten `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Hyväksytty (osoitteesta riippumatta).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth`-, `auth_forgot`- tai `auth_forgot_day`-rajoitus (osoitteesta riippumatta).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` arvolla `retryAfter: 1`: tietokanta pysyi lukittuna, kun tiliä haettiin tai linkkiä tallennettiin; osoitteen 5 minuutin jakso alkaa silti, joten uusi pyyntö sen aikana ei lähetä linkkiä. `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Aseta uusi salasana nollauslinkin tokenilla
      description: |-
        Asettaa uuden salasanan nollauslinkin tokenilla (sivu `/reset-password` tekee saman). Uusi salasana noudattaa rekisteröitymisen sääntöjä.

        Nollauksella on nämä vaikutukset yhdessä transaktiossa (kaikki tai ei mitään): se mitätöi kaikki istunnot ja peruu odottavan sähköpostiosoitteen vaihdon; tilin muut nollauslinkit lakkaavat toimimasta; osoite katsotaan vahvistetuksi (linkki todisti sen); omistaja saa sähköpostiviestin. Kaksivaiheiseen vahvistukseen ei kosketa. Salasanatiivisteiden jonon virheen, vastauksen 503 tai vastauksen 500 jälkeen mitään ei muutettu: vanha salasana ja istunnot säilyvät, ja linkki pysyy voimassa.

        **Rajoitukset:** `auth`, sitten `auth_reset` (10 tunnissa asiakasta kohden, 30 IPv6 /48 -verkkoa kohden, yhteinen sivun kanssa: jokainen yritys tiivistää salasanan).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Salasana on vaihdettu, ja kaikki istunnot on kirjattu ulos.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: linkki on virheellinen, käytetty tai vanhentunut, tai se lähetettiin osoitteeseen, joka ei enää ole tilin osoite. `weak_password` (ja `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth`- tai `auth_reset`-rajoitus tai salasanatiivisteiden jono.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: salasanatiivisteiden jono, tai tietokanta pysyi lukittuna (`retryAfter: 1`, mitään ei muutettu). `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Aloita Google-kirjautuminen
      description: |-
        Aloittaa Google-kirjautumisyrityksen PKCE-haasteelle ja pelin kuuntelijan portille osoitteessa `127.0.0.1`. Vastaus antaa järjestelmän selaimessa avattavan Googlen URL:n ja yrityksen `state`-arvon; yritys on voimassa 10 minuuttia.

        `authUrl` sisältää parametrit `client_id`, `redirect_uri` (muodostettu arvosta `redirectPort` ja palvelimen alkuperätunnisteesta), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (palvelimen oman, Googlea varten luodun verifierin S256) ja `code_challenge_method=S256` sekä `prompt=select_account`. Peli tarkistaa sen ennen kuin avaa sen (katso osion kuvaus).

        **Rajoitus:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Yritys.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: tämä palvelin ei tarjoa Google-kirjautumista.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `sso_start`-rajoitus.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (tietokanta pysyi lukittuna), `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Aloita Google-kirjautuminen verkkosivustolla
      description: |-
        Aloittaa verkkosivuston Google-kirjautumisyrityksen sen sivun PKCE-haasteelle. Vastaus on sama kuin pelille: Googlen URL, johon siirrytään, ja yrityksen `state`-arvo; yritys on voimassa 10 minuuttia. Tarjolla, kun `GET /info` ilmoittaa `sso.googleWeb: true`.

        `authUrl` sisältää verkkosivuston `client_id`-arvon ja `redirect_uri=GOOGLE_WEB_REDIRECT_URI`, muut parametrit samoina kuin pelille. Sivu tarkistaa sen ennen kuin siirtyy siihen (katso **Verkkosivustolla** osion kuvauksessa).

        **Rajoitus:** `sso_start`, yhteinen pelin aloituksen kanssa.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: Yritys.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: puuttuva tai virheellisesti muodostettu `codeChallenge` tai mikä tahansa muu kenttä (`redirectPort` mukaan lukien).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: tämä palvelin ei tarjoa Google-kirjautumista tai ei tarjoa sitä verkkosivustoille.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `sso_start`-rajoitus (yhteinen pelin aloituksen kanssa).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (tietokanta pysyi lukittuna), `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Välitä Googlen vastaus palvelimelle
      description: |-
        Välittää palvelimelle `code`- ja `state`-arvot, jotka Google lähetti pelin kuuntelijalle tai verkkosivuston sivulle, yhdessä yrityksen tunnisteen ja PKCE-verifierin kanssa. Yrityksen tunniste on hyödytön ilman verifieriä, ja koodi on hyödytön ilman palvelimen omaa PKCE-verifieriä ja asiakassalaisuutta (client secret).

        Palvelin tarkistaa yrityksen (tuntematon, käytetty tai vanhentunut: 410), sitten verifierin (väärä verifier jättää yrityksen käyttökelpoiseksi), käyttää sitten yrityksen kerran, tarkistaa arvot `state` ja `iss`, vaihtaa koodin Googlen kanssa ja tarkistaa ID-tokenin. Vastaus (200) on jokin seuraavista:

        - `{ token, expiresAt, user }`: kirjautunut sisään liitettyyn tiliin;
        - `{ mfaRequired, mfaToken, expiresIn }`: jatka päätepisteellä `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: uusi tili; jatka päätepisteellä `POST /auth/sso/complete` 10 minuutin kuluessa. `suggestedUsername` muodostetaan Google-nimestä tai osoitteesta, ja se on `""`, kun mikään ei sovi;
        - `{ needsPassword, linkTicket, username, expiresIn }`: tilillä, jolla on tämä osoite, on salasana; jatka päätepisteellä `POST /auth/sso/google/link`. Mitään ei ole vielä liitetty.

        **Rajoitus:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Istunto, toinen vaihe tai ensimmäisen Google-kirjautumisen seuraava vaihe.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Kirjautunut sisään liitettyyn tiliin
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Kaksivaiheinen vahvistus on käytössä
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Uusi pelaaja
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Osoitetta käyttää tili, jolla on salasana
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: verifier ei vastaa yrityksen haastetta (yritys pysyy käyttökelpoisena). `sso_email_unverified`: Google ei ole vahvistanut osoitetta. `registration_closed`. `account_disabled`. Vain liitetylle tilille: `banned` (ja `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: tämä palvelin ei tarjoa Google-kirjautumista.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: osoitetta käyttää aktiivinen tili, jolla ei ole salasanaa (tiliä ei nimetä).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: tuntematon, käytetty tai vanhentunut yritys.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `sso_finish`-rajoitus.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (tietokanta pysyi lukittuna), `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Liitä Google olemassa olevaan tiliin sen salasanalla
      description: |-
        Kun `finish` on vastannut `needsPassword`: liittää Googlen olemassa olevaan tiliin tämän tilin salasanalla, joka kirjoitetaan pelissä. Vastaus (200) on istunto (liitos tallennetaan ja pelaaja kirjautuu sisään) tai, kun kaksivaiheinen vahvistus on käytössä, `{ mfaRequired, mfaToken, expiresIn }`: jatka päätepisteellä `POST /auth/login/mfa`, ja liitos tallennetaan vasta, kun koodi hyväksytään siellä.

        Väärä salasana jättää lipun käyttökelpoiseksi, yhteensä 5 yritykseen asti. Yrityskerta otetaan juuri ennen salasanan tarkistamista: 429 `too_many_attempts` tai 428 `pow_required` ei vie yhtään, kun taas salasanatiivisteiden jonon hylkäys (503 `server_busy`, 429 `rate_limited`) on jo vienyt yhden ja lasketaan tilin epäonnistumiseksi. Epäonnistumisviive on sama laskuri kuin päätepisteellä `POST /auth/login`.

        **Rajoitus:** `auth` (IPv6 /48 -laskentoineen). **Työtodiste:** kuten päätepisteellä `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Istunto tai kirjautumisen toinen vaihe.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: väärä salasana; lippu pysyy voimassa, kaikkiaan 5 yritykseen asti.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (ja `until`), vain oikean salasanan jälkeen.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: tämä palvelin ei tarjoa Google-kirjautumista.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: Google-tili liitettiin sillä välin toiseen tiliin.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: tuntematon, käytetty tai vanhentunut lippu, viides väärä salasana, tili, jonka tila tai osoite on muuttunut `finish`-kutsun jälkeen, tai tili, jonka tila, osoite, salasana tai kaksivaiheinen vahvistus muuttui liitosta tallennettaessa. Aloita kirjautuminen alusta.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (tilin epäonnistumisviive) tai `rate_limited` (`auth`-rajoitus, salasanatiivisteiden jono).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: salasanatiivisteiden jono, tai tietokanta pysyi lukittuna (`retryAfter: 1`, mitään ei liitetty). `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Luo tili ensimmäisen Google-kirjautumisen yhteydessä
      description: |-
        Kun `finish` on vastannut `needsUsername`: luo tilin valitulla käyttäjänimellä (rekisteröitymisen säännöt pätevät) ja kirjaa sen sisään. Tilillä ei ole salasanaa: `hasPassword` on `false`, ja ”Unohditko salasanan?” (`POST /auth/password/forgot`) antaa sille salasanan.

        **Rajoitus:** `auth` (myös sen IPv6 /48 -verkkokohtainen laskenta).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Tili on luotu ja kirjattu sisään.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: tämä palvelin ei tarjoa Google-kirjautumista.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (käyttäjänimi on jo jonkin tilin käytössä, tai toisen osoitteen odottava rekisteröityminen on varannut sen), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: tuntematon, käytetty tai vanhentunut lippu.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth`-rajoitus.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (tietokanta pysyi lukittuna), `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Listaa kirjautuneet laitteet
      description: |-
        Tilin aktiiviset istunnot (kirjautuneet laitteet), viimeksi käytetty ensin. `current` merkitsee istunnon, joka tekee pyynnön. `lastSeenAt` päivitetään enintään 5 minuutin välein (myöhemmin, kun palvelin on pahasti jäljessä); `expiresAt` on ehdoton päättymishetki, ja käyttämättömyysraja voi päättää istunnon aiemmin.

        **Rajoitus:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aktiiviset istunnot.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `sessions`-rajoitus tai tilikohtainen budjetti.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (tietokanta pysyi lukittuna), `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Kirjaa yksi laite ulos
      description: |-
        Kirjaa tilin yhden istunnon ulos; myös nykyisen istunnon voi kirjata ulos. Sillä avattu WebSocket suljetaan. Ei runkoa (tai `{}`).

        **Rajoitus:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Istunto on kirjattu ulos.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: muu runko kuin `{}` tai `id`, joka ei ole kelvollista URL-koodausta; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: tällä tilillä ei ole aktiivista istuntoa, jolla on tämä tunniste.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `sessions`-rajoitus tai tilikohtainen budjetti.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (tietokanta pysyi lukittuna), `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Hae tili, sen vahvuusluvut ja voimassa olevat seuraamukset
      description: |-
        Tili sellaisena kuin sen pelaaja näkee: tilinäkymä (myös jokaisen kirjautumisvastauksen `user`), yksi vahvuuslukutietue kutakin peliaikaluokkaa kohden, jossa pelaaja on pelannut pisteytettyjä pelejä, voimassa olevat seuraamukset ja porttikielto. Huijauksentorjunnan luotettavuustasoa ei koskaan näytetä.

        **Rajoitus:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tili.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized` tai `invalid_token` (myös kun tili on poistettu).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `account`-rajoitus tai tilikohtainen budjetti.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (tietokanta pysyi lukittuna), `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Hyväksy tai hylkää suorat haasteet
      description: |-
        Määrittää, voivatko muut pelaajat haastaa tämän pelaajan nimellä. Arvolla `none` suorat haasteet hylätään: haastajalle kerrotaan, että pelaaja ei ole tavoitettavissa. Ei uudelleentodennusta.

        **Rajoitus:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: Nyt voimassa olevat asetukset.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `account`-rajoitus tai tilikohtainen budjetti.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (tietokanta pysyi lukittuna), `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Vaihda salasana
      description: |-
        Vaihtaa salasanan. Nykyinen salasana tarvitaan, mutta toista tekijää ei, vaikka kaksivaiheinen vahvistus olisi käytössä. Uuden salasanan on noudatettava rekisteröitymisen sääntöjä (tarkistetaan nykyisen salasanan jälkeen).

        Vaihdolla on nämä vaikutukset yhdessä transaktiossa (kaikki tai ei mitään): se mitätöi kaikki muut istunnot (tämä istunto pysyy kirjautuneena), peruu odottavan sähköpostiosoitteen vaihdon, saa tilin salasanan nollauslinkit lakkaamaan toimimasta ja lähettää omistajalle sähköpostiviestin.

        **Uudelleentodennus:** vain salasana. **Rajoitukset:** `reauth`, sitten `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Salasana on vaihdettu.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (pelkän Google-kirjautumisen tili), `weak_password` (ja `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: väärä nykyinen salasana tai salasanan nollaus tai vaihto, joka tapahtui pyyntöä tarkistettaessa.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (tilin epäonnistuneet uudelleentodennukset) tai `rate_limited` (`reauth`- tai `reauth_user`-rajoitus, tilikohtainen budjetti, salasanatiivisteiden jono).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: salasanatiivisteiden jono, tai tietokanta pysyi lukittuna (`retryAfter: 1`, mitään ei muutettu). `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Aloita kaksivaiheisen vahvistuksen käyttöönotto
      description: |-
        Tallentaa uuden odottavan salaisen avaimen, joka korvaa mahdollisen aiemman odottavan avaimen, ja palauttaa sen todennussovellusta varten (tekstinä ja `otpauth://`-URI:na, joka näytetään QR-koodina). Kaksivaiheinen vahvistus ei ole vielä käytössä: `POST /account/mfa/totp/enable` ottaa sen käyttöön tämän avaimen koodilla.

        **Uudelleentodennus:** vain salasana. **Rajoitukset:** `reauth`, sitten `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Odottava salainen avain.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (pelkän Google-kirjautumisen tili), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (tarkistetaan ennen salasanaa).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (tilin epäonnistuneet uudelleentodennukset) tai `rate_limited` (`reauth`- tai `reauth_user`-rajoitus, tilikohtainen budjetti, salasanatiivisteiden jono).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (salasanatiivisteiden jono, tai tietokanta pysyi lukittuna), `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Viimeistele kaksivaiheisen vahvistuksen käyttöönotto ja hae palautuskoodit
      description: |-
        Ottaa kaksivaiheisen vahvistuksen käyttöön odottavan salaisen avaimen koodilla (tasan 6 numeroa). Salasanaa ei kysytä tässä; se annettiin määritysvaiheessa. Vastauksessa on 10 palautuskoodia, jotka näytetään vain tämän kerran.

        **Rajoitukset:** `reauth`, sitten `reauth_user`; väärä koodi lasketaan tilin epäonnistuneisiin uudelleentodennuksiin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Kaksivaiheinen vahvistus on käytössä.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` ei ole tasan 6 numeroa, tai runko rikkoo skeemaa; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: väärä koodi (tarkista laitteen kellonaika).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: odottavaa salaista avainta ei ole (kutsu ensin `POST /account/mfa/totp/setup`).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (tilin epäonnistuneet uudelleentodennukset) tai `rate_limited` (`reauth`- tai `reauth_user`-rajoitus, tilikohtainen budjetti).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (tietokanta pysyi lukittuna), `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: Poista kaksivaiheinen vahvistus käytöstä
      description: |-
        Poistaa kaksivaiheisen vahvistuksen käytöstä. Salainen avain ja palautuskoodit poistetaan, ja omistaja saa sähköpostiviestin.

        **Uudelleentodennus:** salasana sekä todennussovelluksen koodi tai palautuskoodi (joko `code` tai `recoveryCode` vaaditaan). **Rajoitukset:** `reauth`, sitten `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Kaksivaiheinen vahvistus on poistettu käytöstä.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (pelkän Google-kirjautumisen tili), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required` (ei `code`- eikä `recoveryCode`-kenttää; tarkistetaan ennen salasanaa), `invalid_password`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
