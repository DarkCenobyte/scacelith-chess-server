              type: integer
              format: int64
              minimum: 0
              description: Perusaika millisekunteina.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Lisäaika millisekunteina.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: Lopputulos pelaajan näkökulmasta.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Sivun pelit uusimmasta alkaen.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Tunniste, joka annetaan parametrina `before` seuraavaa sivua varten, tai viimeisellä sivulla `null`.
        total:
          type: integer
          minimum: 0
          description: Suodattimeen täsmäävien pelien määrä kaikilla sivuilla yhteensä.
    MoveRecord:
      type: object
      description: Pelin yksi puolisiirto.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: Siirto UCI-notaatiolla; korotuksessa loppuun lisätään `n`, `b`, `r` tai `q`.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Siirrolle laskettu aika (ms), `null`, jos tietueessa ei ole sitä.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Siirron tekijän kello siirron jälkeen (ms), `null`, jos tietueessa ei ole sitä.
    PgnTagsView:
      type: object
      description: Tärkeimmät PGN-tagit näyttämistä varten. `Termination` on tässä päättymissyyn nimi; PGN-tiedosto käyttää PGN-standardin arvoja.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` tai `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: Aloituspäivä UTC-aikana.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Vahvuusluku alussa tai `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Vahvuusluku alussa tai `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Pelitietue siirtoineen ja kelloineen. Siinä on pelin yhteenvedon kentät ilman kenttiä `color` ja `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Perusaika millisekunteina.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Lisäaika millisekunteina.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: '`status`-arvon nimi.'
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: Sen pelin tunniste, jonka uusintapeli tämä on, tai `null`.
            moves:
              type: array
              description: Yksi merkintä puolisiirtoa kohden.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Vain kun tokenin pelaaja pelasi tämän pelin; hänen puolensa.
            reportable:
              type: boolean
              description: Vain kun tokenin pelaaja pelasi tämän pelin; `true`, kun `POST /reports` ottaisi nyt vastaan ilmoituksen vastustajasta tästä pelistä (peli päättyi 7 päivän sisällä, päiväkiintiötä ei ole käytetty loppuun, eikä vastustajasta ole jo ilmoitettu tästä pelistä).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Käyttäjänimi sellaisena kuin pelaaja sen kirjoitti.
        createdAt:
          type: integer
          format: int64
          description: Milloin tili luotiin (Unix-aika, ms).
        ratings:
          type: array
          description: Vain viralliset peliaikaluokat palvelimen järjestyksessä.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Kaikki tallennetut pelit, myös pisteyttämättömät ja perutut.
            rated:
              type: integer
              minimum: 0
              description: Pisteytetyt pelit vahvuuslukutietueista summattuina.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Käyttäjänimi sellaisena kuin pelaaja sen kirjoitti.
        games:
          type: array
          description: Sivun pelit uusimmasta alkaen.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Viimeisen pelin tunniste aina, kun sivu on täynnä (seuraava sivu voi silloin olla tyhjä), muuten `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: Peliaikaluokan tunniste.
        minGames:
          type: integer
          minimum: 0
          description: Laskettujen pelien määrä, joka tietueella on oltava, jotta se listataan (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Milloin tulostaulu laskettiin (Unix-aika, ms).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: PGN-teksti, enintään 65 536 UTF-8-tavua. Vain ensimmäistä peliä käytetään.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Valinnainen. Kuvan koko.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Valinnainen. Puoli, joka näytetään laudan alalaidassa.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Valinnainen. Millisekunteja siirtoa kohden; JSON-luku, jonka arvo on kokonaisluku.
        coords:
          type: boolean
          default: true
          description: Valinnainen. Piirretäänkö linjojen kirjaimet ja rivien numerot laudan ympärille.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Peli kokonaislukuna tai 1–16 numeron merkkijonona.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Vastustajan käyttäjänimi sellaisena kuin se on pelitietueessa tai nyt, kirjainkoosta riippumatta. Se ei saa olla tyhjä.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Mitä ilmoitus koskee.
        comment:
          type:
            - string
            - 'null'
          description: Valinnainen. Enintään 500 merkkiä sen jälkeen, kun ohjausmerkit (sarkainta ja rivinvaihtoa lukuun ottamatta) on poistettu ja tekstin alusta ja lopusta on poistettu välilyönnit.
    AccountExport:
      type: object
      description: Kaikki, mitä palvelin säilyttää tilistä (ajat Unix-aikana, ms).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Milloin vienti tehtiin.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Mitä tiedosto sisältää ja mitä se jättää pois, selkeällä englannin kielellä pelaajalle.
          items:
            type: string
        account:
          description: Päätepisteen `GET /account/me` tilinäkymä sekä `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Liitetyn Google-tilin osoite tai `null`.
        ratings:
          type: array
          description: Täydelliset vahvuuslukutietueet.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Vahvuuslukupisteet, jotka palautettiin, kun vastustajan todettiin huijanneen, laskettuina yhteen UTC-päivittäin ja peliaikaluokittain, uusimmasta alkaen. Pelejä tai huijareita ei nimetä.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Kaikki tallennetut istunnot uusimmasta alkaen, ilman tokeneita. Säilytysajan siivous poistaa vanhentuneen istunnon ja uloskirjatun istunnon päivä uloskirjautumisen jälkeen.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Tietoturvatapahtumat uusimmasta alkaen; säilytetään `RETENTION_SECURITY_DAYS` päivää.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Kaikki seuraamukset, myös kumotut. Moderaattorin nimeä ei koskaan sisällytetä.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Pelaajan kesken jätetyistä, perutuista ja ilman ensimmäistä siirtoa jääneistä peleistä kirjatut käytöstapahtumat; säilytetään 30 päivää.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Pelaajan tekemät ilmoitukset.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Pelien määrä.
            list:
              type: array
              description: Kaikki pelit uusimmasta alkaen päätepisteen `GET /account/games` yhteenvetoina. Siirrot saa päätepisteestä `GET /games/{id}` ja PGN:n päätepisteestä `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Täydellinen vahvuuslukutietue.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Onko pelaaja jo ohittanut luokittelemattoman vaiheen.
            countedGames:
              type: integer
              minimum: 0
              description: Vahvuuslukuun lasketut pelit.
            updatedAt:
              type: integer
              format: int64
              description: Milloin tietue viimeksi muuttui.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: Päivän kello 00.00 UTC (Unix-aika, ms).
        category:
          type: string
        points:
          type: integer
          description: Sinä päivänä kyseisessä peliaikaluokassa palautetut pisteet.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Milloin istunto kirjattiin ulos, tai `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Kirjautumisen osoite; pyyhitään `RETENTION_IP_DAYS` päivän jälkeen.
    SecurityEvent:
      type: object
      description: |-
        Tietoturvatapahtuma. `ip` annetaan vain toimista, jotka tehtiin kirjautuneena, tilin salasanalla (ja toisella tekijällä) tai tilin osoitteeseen lähetetyllä linkillä: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` ja `account_exported`; kaikilla muilla lajeilla on `ip: null`, ja `ip` pyyhitään `RETENTION_IP_DAYS` päivän jälkeen.

        `detail` säilyttää vain nämä kentät: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` ja `method` (`password` tai `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` ja `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. `moderator_action`-tapahtuma säilyttää vain kentän `{ action }` toiminnoille `ban`, `unban`, `reset_mfa`, `verify_email` ja `revoke_sessions` (muut moderaattoritoiminnot jätetään pois). Kaikilla muilla lajeilla on `detail: null`. `rating_refund`-tapahtumat jätetään pois: niiden pisteet ovat kentässä `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Tapahtuman laji (`login`, `password_changed`...).
        at:
          type: integer
          format: int64
          description: Milloin se tapahtui.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: Ilmoitetun pelaajan nykyinen julkinen nimi.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Onko ilmoitus yhä avoin (sitä, saiko ilmoitettu pelaaja seuraamuksen, ei kerrota).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Sähköpostilinkin token (sivun lomakkeen piilokenttä).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Nollauslinkin token (lomakkeen piilokenttä).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Uusi salasana; rekisteröitymisen salasanasäännöt pätevät.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Uusi salasana uudelleen; sen on oltava sama.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: UTF-8-muotoinen HTML-sivu (`text/html; charset=utf-8`) ilman JavaScriptiä tai ulkoisia resursseja.
