        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Seuraamuksen laji.
        reason:
          type:
            - string
            - 'null'
          description: Annettu syy, jos sellainen on.
        startsAt:
          type: integer
          format: int64
          description: Alkuhetki (Unix-aika, ms).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Päättymishetki (Unix-aika, ms), `null`, kun seuraamus on pysyvä.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Porttikiellon päättymishetki (Unix-aika, ms), `null`, kun porttikielto on pysyvä.
    Preferences:
      type: object
      additionalProperties: false
      required:
