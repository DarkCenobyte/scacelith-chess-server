  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: Poista tili
      description: |-
        Poistaa tilin; tätä ei voi perua.

        - Kaikki istunnot mitätöidään heti: token saa siitä lähtien vastauksen 401 `invalid_token`.
        - Käyttäjänimeksi tulee `deleted#<id>` sekä tilissä että jokaisessa pelitietueessa.
        - Nämä pyyhitään: sähköpostiosoite, salasanan tiiviste, kaksivaiheisen vahvistuksen salainen avain ja palautuskoodit, istunnot ja linkkitokenit, Google-liitos, huijauksentorjunnan luotettavuustietue sekä tietoturvatapahtumien yhteydessä tallennetut IP-osoitteet.
        - Vahvuusluvut ja pelit säilytetään. Pelit pysyvät luettavina anonyymillä nimellä, ja `GET /players/{username}` vastaa entiselle nimelle 404.

        **Uudelleentodennus:** salasana ja, kun kaksivaiheinen vahvistus on käytössä, todennussovelluksen koodi tai palautuskoodi. **Rajoitukset:** `reauth`, sitten `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Tili on poistettu.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (pelkän Google-kirjautumisen tili), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (epäonnistuneita uudelleentodennuksia tai liian monta kokeiltua koodia tällä tilillä) tai `rate_limited` (`reauth`- tai `reauth_user`-rajoitus, tilikohtainen budjetti, salasanatiivisteiden jono).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (salasanatiivisteiden jono, tai tietokanta pysyi lukittuna), `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Listaa pelaajan pelit suodatettuina ja sivutettuina
      description: |-
        Kirjautuneen pelaajan pelit uusimmasta alkaen, suodatettuina ja sivutettuina, sekä suodattimeen täsmäävien pelien määrä. Kaikki kyselyparametrit ovat valinnaisia, ja tyhjä arvo tulkitaan puuttuvaksi.

        Sivutus: anna edellisen sivun `next` parametrina `before`; viimeisellä sivulla `next` on `null`. `total` laskee suodattimeen täsmäävät pelit kaikilta sivuilta.

        **Rajoitus:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: Virallisen peliaikaluokan tunniste (`3+2` tai `3%2B2`) tai `custom` kaikille peleille, joissa on muu peliaika.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Vain pisteytetyt (`true`) tai pisteyttämättömät (`false`) pelit.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Vain voitetut, hävityt tai tasapeliin päättyneet pelit pelaajan näkökulmasta. Perutut pelit näkyvät vain ilman tätä suodatinta.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Yksi sivu historiasta.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` ei ole pelin tunniste), `invalid_limit` tai `invalid_filter` (`category`, `rated` tai `result`); kussakin on `field`, joka nimeää parametrin.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `account_games`-rajoitus tai tilikohtainen budjetti.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (tietokanta pysyi lukittuna; `retryAfter: 1` rungossa, ei `Retry-After`-otsaketta), `server_busy` (istunnon haku löysi tietokannan lukittuna), `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /games/{id}:
    get:
      operationId: getGame
      tags:
