components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Istuntotoken (`sct_` ja sen perässä 43 base64url-merkkiä) kirjautumisvastauksesta `Authorization`-otsakkeessa: `Authorization: Bearer <token>`. Etuliite on tasan `Bearer` (kirjainkoolla on merkitystä) ja yksi välilyönti; arvo, jossa sitä ei ole, tai token, joka ei ole 1–512 tulostettavaa ASCII-merkkiä, saa vastauksen 401 `invalid_token` kuten mikä tahansa muu virheellinen token. Tyhjä otsake tulkitaan puuttuvaksi otsakkeeksi.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: 'Pelin tunniste: positiivinen kokonaisluku kymmenjärjestelmässä, enintään 16 numeroa ilman etunollia, alle 2^53.'
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: Istunnon tunniste sellaisena kuin `GET /auth/sessions` sen antaa, ilman etunollia kirjoitettuna (`03` ei ole istunto 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Pelaajan käyttäjänimi kirjainkoosta riippumatta. Palvelin hyväksyy minkä tahansa nimen, joka on 2–24 merkkiä joukosta `[A-Za-z0-9_.-]` (väljin sääntö, jonka se on koskaan sallinut).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Pelin tunniste; vain vanhemmat pelit listataan. Anna edellisen sivun `next`. Tyhjä arvo tulkitaan puuttuvaksi.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Sivun koko, 1–50. Suurempi enintään 3-numeroinen luku tulkitaan arvoksi 50; tyhjä arvo tulkitaan puuttuvaksi.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: Sähköpostilinkin token (43 base64url-merkkiä). Puuttuva tai väärä token näyttää sivun ”link invalid or expired” (linkki virheellinen tai vanhentunut).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Jokainen palvelimen vastaus kieltää välimuistiin tallentamisen.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Sekunnit, jotka on odotettava ennen uutta yritystä; sama arvo kuin rungon `retryAfter`.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Bearer-haaste; virheellisen tokenin kohdalla mukana on `error="invalid_token"`.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Palvelin sulkee yhteyden tämän vastauksen jälkeen.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (ja `field`, kun virhe on rungon kentässä) tai `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Kenttä rikkoo skeemaa
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Runko ei ole JSONia
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Heikko salasana
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: PGN, jota ei voi lukea
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (ei `Authorization`-otsaketta) tai `invalid_token` (token on virheellisesti muotoiltu, vanhentunut, mitätöity tai kuuluu poistetulle tilille).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Ei istuntoa
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Virheellinen token
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Pyyntö hylätään.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Väärä salasana uudelleentodennuksessa
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Porttikiellossa oleva tili
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found` tai toiminto, jonka tämä palvelin on poistanut käytöstä.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: runko ei saapunut 10 sekunnin kuluessa. Palvelin sulkee yhteyden.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Pyyntö on ristiriidassa palvelimen tilan kanssa.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: Google-kirjautumisen yritys tai lippu on tuntematon, käytetty tai vanhentunut; aloita kirjautuminen alusta.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: runko ylittää `HTTP_BODY_LIMIT`-rajan (oletuksena 16 384 tavua). Palvelin sulkee yhteyden.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: pyynnön kohde ylittää 4096 merkkiä.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: runko ei ole `application/json`, tai sen merkistö ei ole UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: pelissä on yli `GIF_MAX_PLIES` (600) puolisiirtoa.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: ratkaise `pow`-haaste ja lähetä sama pyyntö uudelleen kentän `pow: { challenge, nonce }` kanssa. `reason` kertoo syyn: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` tai `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (nopeusrajoitus, tilikohtainen budjetti tai salasanatiivisteiden jono) tai `too_many_attempts` (tilin hidastus), ja vastauksessa `retryAfter` sekä `Retry-After`-otsake.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Nopeusrajoitus
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Liian monta epäonnistumista tällä tilillä
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: odottamaton virhe. Palvelin kirjaa sen lokiin.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: väärä `state` tai `iss`, tai Google hylkäsi koodin tai lähetti ID-tokenin, joka ei läpäise tarkistusta (mukaan lukien toisen asiakkaan, pelin tai verkkosivuston, koodi tai ID-token). Vastaus ei koskaan sisällä Googlen tekstiä.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` tai `timeout`: yritä uudelleen `retryAfter`-ajan kuluttua, jos se on annettu.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Palvelin on ruuhkautunut
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Tietokanta pysyi lukittuna (luku)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Palvelin käytti liian kauan aikaa
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Animoitu GIF liitteenä.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` tämän palvelimen pelille, `attachment; filename="scacelith-game.gif"` päätepisteellä `POST /gif` lähetetylle PGN:lle.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Tiedoston koko tavuina.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: HTML-sivu.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: HTML-sivu, joka selittää hylkäyksen.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Lomake ei saapunut 10 sekunnin kuluessa (HTML-sivu). Palvelin sulkee yhteyden.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: HTML-sivu, joka selittää ristiriidan.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Lomake ylittää `HTTP_BODY_LIMIT`-rajan (HTML-sivu). Palvelin sulkee yhteyden.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Runko ei ole lomake (`application/x-www-form-urlencoded`) eikä JSON, tai sen merkistö ei ole UTF-8 (HTML-sivu).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Nopeusrajoitus (HTML-sivu) `Retry-After`-otsakkeen kanssa.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Odottamaton virhe (HTML-sivu, jonka otsikko on ”Server error”). Palvelin kirjaa sen lokiin.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Palvelin on ruuhkautunut (tietokanta pysyi lukittuna, tai palvelin on pahasti jäljessä; `Retry-After`-otsakkeen kanssa) tai se käytti liian kauan aikaa (HTML-sivu, jonka otsikko on ”Server error”).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: JSON-rajapinnan kaikkien virhevastausten ainoa muoto.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: '`snake_case`-muotoinen virhekoodi. Asiakas valitsee sen perusteella, mitä näyttää.'
          examples:
            - rate_limited
        message:
          type: string
          description: Englanninkielinen lause, tarkoitettu lokeihin ja varavaihtoehdoksi.
        retryAfter:
          type: integer
          minimum: 1
          description: Sekunnit, jotka on odotettava ennen uutta yritystä; mukana vain hylkäyksissä, jotka raukeavat ajan myötä. Vastauksessa on silloin myös `Retry-After`-otsake samalla arvolla, paitsi historian, pelien, pelaajien ja tulostaulun lukujen 503 `busy` -vastauksessa.
        field:
          type: string
          description: Virheellinen kenttä tai kyselyparametri (`invalid_request`, `invalid_option` sekä päätepisteen `GET /account/games` virheet `invalid_cursor`, `invalid_limit` ja `invalid_filter`). Sisäkkäinen kenttä merkitään pisteillä (`pow.nonce`).
        reason:
          type: string
          description: 'Syy: sääntö, jota `weak_password` rikkoo, tai miksi työtodistetta pyydettiin tai se hylättiin (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Vain `banned`: porttikiellon päättymishetki (Unix-aika, ms), `null` pysyvälle porttikiellolle.'
        line:
          type: integer
          minimum: 1
          description: 'Vain `invalid_pgn`: virheen rivi, 1:stä alkaen.'
        column:
          type: integer
          minimum: 1
          description: 'Vain `invalid_pgn`: virheen sarake, 1:stä alkaen, merkkeinä.'
    PowChallenge:
      type: object
      description: Työtodistehaaste (428 `pow_required` -vastauksen `pow`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Allekirjoitettu haaste, joka lähetetään takaisin sellaisenaan.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Alkunollabittien määrä, joka arvossa `SHA-256(challenge + ":" + nonce)` on oltava.
        expiresAt:
          type: integer
          format: int64
          description: Milloin haaste vanhenee (Unix-aika, ms), 2 minuuttia sen myöntämisen jälkeen.
    PowAnswer:
      type: object
      description: Vastaus työtodistehaasteeseen.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: 428-vastauksen `challenge` sellaisenaan kuin se annettiin.
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Enintään 20 numeron desimaalimerkkijono, jolla `SHA-256(challenge + ":" + nonce)` alkaa `bits` nollabitillä.
    ServerInfo:
      type: object
      description: Mitä asiakas tarvitsee ennen kuin se kirjautuu sisään tai muodostaa yhteyden.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Palvelimen nimi (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: UUID, jonka tietokanta saa ensimmäisellä käynnistyksellään. Se pysyy samana uudelleenkäynnistyksissä. Se on `null`, kun tietokanta ei pysty antamaan sitä.
        motd:
          type: string
          description: Päivän viesti (`SERVER_MOTD`), mahdollisesti tyhjä.
        protocol:
          type: object
          description: WebSocket-protokolla (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Vanhin protokollaversio, jota palvelin tukee.
            max:
              type: integer
              minimum: 1
              description: Uusin protokollaversio, jota palvelin tukee.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'Protokollaskeeman sormenjälki (sen kanonisen muodon SHA-256-tiivisteen 4 ensimmäistä tavua etumerkittömänä kokonaislukuna: `0xc649140f`, 3326678031, protokollan alaversiolle 2); vain tiedoksi, sitä ei koskaan verrata.'
            subprotocol:
              type: string
              description: WebSocket-aliprotokollan token (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: WebSocket-portti, jota pelaajat käyttävät (`PUBLIC_WS_PORT`, muuten `WS_PORT`, muuten `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: WebSocketin polku.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Voiko uusia tilejä luoda.
        emailVerification:
          type: boolean
          description: Vahvistavatko uudet tilit osoitteensa (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Tarjotaanko pelille Google-kirjautumista.
            googleWeb:
              type: boolean
              description: Tarjotaanko Google-kirjautumista myös verkkosivustolle (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: Kaksivaiheinen vahvistus on aina käytettävissä.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Rekisteröitymisen vaatimat työtodistebitit (0, jos työtodistetta ei vaadita).
        categories:
          type: array
          description: Viralliset (pisteytetyt) peliajat (`RATED_CATEGORIES`) palvelimen järjestyksessä. Mikä tahansa muu peliaika on `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Säännöt, jotka asiakas voi tarkistaa ennen lomakkeen lähettämistä.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: Käyttäjänimen vähimmäispituus (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: Käyttäjänimen enimmäispituus (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Säännöllinen lauseke, jota uuden käyttäjänimen on vastattava.
            passwordMinLength:
              type: integer
              description: Salasanan vähimmäispituus merkkeinä (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Salasanan enimmäispituus UTF-8-tavuina.
            customTimeControls:
              type: boolean
              description: Voivatko haasteet ja yksityiset pelit käyttää mukautettuja peliaikoja.
            reportsPerDay:
              type: integer
              description: Kuinka monta ilmoitusta pelaaja voi tehdä 24 tunnin aikana (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Suurin WebSocket-viesti, jonka asiakas voi lähettää, tavuina.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Virallinen peliaika.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 'Peliaikaluokan tunniste: minuutit ja lisäajan sekunnit (`3+2`).'
        baseSec:
          type: number
          minimum: 0
          description: Perusaika sekunteina.
        incSec:
          type: number
          minimum: 0
          description: Lisäaika siirtoa kohden sekunteina.
    AccountView:
      type: object
      description: Tili sellaisena kuin sen pelaaja näkee (kirjautumisvastausten ja `GET /account/me` -vastauksen `user`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: Tilin tunniste.
        username:
          type: string
          description: Käyttäjänimi.
        email:
          type: string
          format: email
          description: Sähköpostiosoite.
        emailVerified:
          type: boolean
          description: Onko osoite vahvistettu.
        mfaEnabled:
          type: boolean
          description: Onko kaksivaiheinen vahvistus käytössä.
        googleLinked:
          type: boolean
          description: Onko Google-tili liitetty.
        hasPassword:
          type: boolean
          description: '`false` Googlen kautta luodulle tilille, jolle ei ole vielä asetettu salasanaa.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Hyväksytäänkö suorat haasteet nimellä (katso `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Milloin tili luotiin (Unix-aika, ms).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Viimeisin kirjautuminen (Unix-aika, ms) tai `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Linkkiään odottavan sähköpostiosoitteen vaihdon uusi osoite tai `null`.
    SessionAnswer:
      type: object
      description: Uusi istunto.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Istuntotoken `Authorization`-otsaketta ja WebSocketia varten.
        expiresAt:
          type: integer
          format: int64
          description: Istunnon ehdoton päättymishetki (Unix-aika, ms); käyttämättömyysraja voi päättää sen aiemmin.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Kaksivaiheista vahvistusta käyttävän kirjautumisen toinen vaihe; jatka päätepisteellä `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Vaiheen token päätepistettä `POST /auth/login/mfa` varten.
        expiresIn:
          type: integer
          const: 300
          description: Sekunteja jäljellä vaiheen suorittamiseen.
    LoginAnswer:
      description: Istunto tai kaksivaiheista vahvistusta käyttävän kirjautumisen toinen vaihe.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Ensimmäinen Google-kirjautuminen; jatka päätepisteellä `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Lippu päätepistettä `POST /auth/sso/complete` varten, voimassa 10 minuuttia.
        suggestedUsername:
          type: string
          description: Google-nimestä tai osoitteesta muodostettu käyttäjänimi tai `""`, jos mikään ei sovi.
    SsoNeedsPassword:
      type: object
      description: Salasanallinen tili käyttää osoitetta; jatka päätepisteellä `POST /auth/sso/google/link`. Mitään ei ole vielä liitetty.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Lippu päätepistettä `POST /auth/sso/google/link` varten.
        username:
          type: string
          description: Kyseisen tilin käyttäjänimi (sen näkee vain joku, joka on todentanut osoitteen Googlelle).
        expiresIn:
          type: integer
          const: 600
          description: Sekunnit, jotka lippu pysyy voimassa.
    SsoFinishAnswer:
      description: Päätepisteen `POST /auth/sso/google/finish` vastaus.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Google-kirjautumisyritys.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Yritys päätepistettä `POST /auth/sso/google/finish` varten.
        authUrl:
          type: string
          format: uri
          description: Järjestelmän selaimessa avattava Googlen URL-osoite, kun se on tarkistettu.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state`, joka Googlen on lähetettävä takaisin.'
        expiresIn:
          type: integer
          const: 600
          description: Sekunnit, jotka yritys pysyy voimassa.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Käyttäjänimi; sitten palvelimen säännöt (katso kuvaus).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Sähköpostiosoite. Alusta ja lopusta poistetaan välilyönnit, ja se tallennetaan pienillä kirjaimilla.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Salasana; sitten salasanasäännöt.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Käyttäjänimi tai sähköpostiosoite (mikä tahansa teksti, jossa on `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Valinnainen. Näytetään kirjautuneiden laitteiden luettelossa (esimerkiksi `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: Kirjautumisvastauksen (tai Google-kirjautumisen vastauksen) `mfaToken`.
        code:
          type: string
          maxLength: 32
          description: Valinnainen. 6-numeroinen todennussovelluksen koodi tai palautuskoodi.
        recoveryCode:
          type: string
          maxLength: 32
          description: Valinnainen. Palautuskoodi. Joko `code` tai `recoveryCode` tarvitaan.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Sähköpostiosoite.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Nollauslinkin `token`-parametri.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Uusi salasana; rekisteröitymisen salasanasäännöt pätevät.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Asiakkaan `codeVerifier`-arvon S256-PKCE-haaste (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Asiakkaan kuuntelijan portti osoitteessa `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Sivun `codeVerifier`-arvon S256-PKCE-haaste (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: Päätepisteen `POST /auth/sso/google/start` palauttama `attemptId`.
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: PKCE-verifier; sen SHA-256-tiivisteen on vastattava päätepisteelle `start` annettua haastetta.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state` sellaisena kuin Google lähetti sen takaisin.'
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: '`code` sellaisena kuin Google lähetti sen takaisin (tulostettavaa ASCIIta ilman välilyöntejä).'
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Valinnainen. `iss` sellaisena kuin Google lähetti sen takaisin, jos lähetti.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: Päätepisteen `finish` palauttama `linkTicket`, voimassa 10 minuuttia.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Tilin salasana.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: Päätepisteen `finish` palauttama `ssoTicket`, voimassa 10 minuuttia.
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Käyttäjänimi; rekisteröitymisen säännöt pätevät.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Aktiiviset istunnot, viimeksi käytetty ensin.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Aktiivinen istunto (kirjautunut laite).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: Istunnon tunniste päätepistettä `DELETE /auth/sessions/{id}` varten.
        createdAt:
          type: integer
          format: int64
          description: Kirjautuminen (Unix-aika, ms).
        lastSeenAt:
          type: integer
          format: int64
          description: Viimeisin käyttö (Unix-aika, ms), päivitetään enintään 5 minuutin välein (myöhemmin, kun palvelin on pahasti jäljessä).
        expiresAt:
          type: integer
          format: int64
          description: Ehdoton päättymishetki (Unix-aika, ms); käyttämättömyysraja voi päättää istunnon aiemmin.
        clientLabel:
          type:
            - string
            - 'null'
          description: Kirjautumisen `clientLabel` tai `null`, jos sitä ei lähetetty.
        current:
          type: boolean
          description: Onko tämä pyynnön tekevä istunto.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Yksi tietue kutakin peliaikaluokkaa kohden, jossa pelaaja on pelannut pisteytettyjä pelejä.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Voimassa olevat seuraamukset.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }` porttikiellon aikana, muuten `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Yhden peliaikaluokan vahvuuslukutietue.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: Peliaikaluokan tunniste.
        rating:
          type: integer
          description: Vahvuusluku.
        games:
          type: integer
          minimum: 0
          description: Peliaikaluokassa pelatut pelit (lasketut ja laskemattomat).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Korkein saavutettu vahvuusluku.
        provisional:
          type: boolean
          description: '`true`, kun vahvuusluku on vielä luokittelemattomassa vaiheessa tai siinä on alle `PROVISIONAL_GAMES` laskettua peliä (peli näyttää sen muodossa `1510?`).'
    ActiveSanction:
      type: object
