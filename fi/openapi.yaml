  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Lataa peli PGN-tiedostona
      description: |-
        Sama peli PGN-tiedostona: yksi peli `\n`-rivinvaihdoin ja siirtoteksti alle 80 sarakkeen riveinä. Vastaus on sama tokenin kanssa tai ilman.

        Tagit tässä järjestyksessä: `Event` (`<SERVER_NAME> rated <category>` tai `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (aloituspäivä UTC-aikana), `Round`, `White`, `Black`, `Result` (`*` perutulle pelille), `UTCDate` ja `UTCTime` (alkuhetki), `WhiteElo` ja `BlackElo` (vahvuusluvut alussa tai `-`), `WhiteRatingDiff` ja `BlackRatingDiff` (muutokset, kuten `+10` ja `-10`, jokaisessa pisteytetyssä pelissä, `+0`, kun vahvuuslukusäännöt jättävät vahvuusluvun ennalleen; pisteyttämättömässä, mukautetussa tai perutussa pelissä kumpaakaan ei ole), `TimeControl` (sekunteina), `Termination` (PGN-standardin arvo: `normal`; `time forfeit`, lipun putoaminen, myös kun peli päättyy tasapeliin; `abandoned`; `rules infraction`, toinen laiton siirto tai reilun pelin rikkomuksesta tuomittu häviö; `unterminated`, peruttu peli), `PlyCount`, `ScacelithGameId` (tunniste desimaalilukuna).

        Jokaisessa siirrossa on `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: siirron tekijän kello siirron jälkeen ja siirrolle laskettu aika kymmenesosasekunteina (katkaistuna). Arvo jätetään pois, kun se puuttuu tietueesta. Viimeisen siirron jälkeen tulee päättymissyy sanoin ja sitten tulos.

        **Rajoitus:** `public_read` (pelaajakohtainen tokenin kanssa, asiakaskohtainen ilman).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: PGN-tiedosto.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'PGN-teksti UTF-8-muodossa (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: ei positiivinen enintään 16-numeroinen kokonaisluku (alle 2^53); `invalid_request`: ei kelvollista URL-koodausta.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: token lähetettiin, eikä se ole kelvollinen.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: peliä ei ole olemassa.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `public_read`-rajoitus tai tilikohtainen budjetti.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: muun muassa silloin, kun tallennettuja siirtoja ei voi toistaa tallennettuun päättymiseen asti (palvelin kirjaa sen lokiin).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (tietokanta pysyi lukittuna; `retryAfter: 1` rungossa, ei `Retry-After`-otsaketta), `server_busy` (istunnon haku löysi tietokannan lukittuna), `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Lataa tämän palvelimen peli animoituna GIF-kuvana
      description: |-
        Peli animoituna GIF-kuvana. Nimet ja vahvuusluvut ovat pelitietueen mukaiset (vahvuusluvut alussa, poistettu tili muodossa `deleted#<id>`), samoin tulos ja päättymistapa (`Resignation`, `Loss on time`...).

        Tarkistukset tehdään tässä järjestyksessä: `gif_disabled`, kuvan asetukset (`size`, `orientation`, `delay`, `coords`), pelin tunniste, peli, sen pituus.

        **Istunto vaaditaan:** kiintiöt lasketaan tilikohtaisesti. **Rajoitukset:** `gif` jokaisessa pyynnössä; `gif_user_min`, `gif_user_hour`, `gif_ip_min` ja `gif_ip_hour` vain, kun GIF täytyy tehdä (katso osion kuvaus). **Aikaraja:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 sekuntia (oletuksena 45 sekuntia).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 'Kuvan koko: `small` (32 px:n ruudut), `medium` (48 px) tai `large` (72 px).'
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Puoli, joka näytetään laudan alalaidassa.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Millisekunteja siirtoa kohden (1–6 numeroa kymmenjärjestelmässä).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Piirretäänkö linjojen kirjaimet ja rivien numerot laudan ympärille (`1`) vai ei (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option`, jossa on `field` (`size`, `orientation`, `delay` tai `coords`): sallittujen ulkopuolinen arvo. `invalid_game_id`. `invalid_request`: ei kelvollista URL-koodausta.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: peliä ei ole olemassa. `gif_disabled`: palvelin on poistanut GIF-kuvat käytöstä (`GIF_ENABLED=false`; `gif`-rajoituksen token palautetaan).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `gif`-rajoitus, renderöintirajoitus tai tilikohtainen budjetti.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF-kuvaa ei voitu tehdä (palvelin kirjaa syyn lokiin). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`, jossa on `retryAfter` (3–10 sekuntia) ja `Retry-After`: renderöintijono on täynnä, tai GIF odotti vapaata säiettä `GIF_QUEUE_TIMEOUT_MS` (10 sekuntia); kaikki pyynnön ottamat rajoitusten tokenit palautetaan. `busy`: tietokanta pysyi lukittuna (`retryAfter: 1` vain rungossa). `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Tee animoitu GIF mistä tahansa PGN-muodossa lähetetystä pelistä
      description: |-
        Sama kuva kuin `GET /games/{id}/gif` mille tahansa PGN-tekstinä lähetetylle pelille: pelisovelluksen tallentama peli, toisen sivuston vienti tai käsin kirjoitettu peli. Tekstistä käytetään vain ensimmäistä peliä.

        - PGN-lukija hyväksyy saman kuin pelisovelluksen oma lukija: kaikki tämän palvelimen kirjoittamat PGN:t ja muiden sivustojen tavalliset viennit (kommentit, muunnelmat, NAG-merkinnät ja kellomerkinnät ohitetaan; siirtonumerot ja SAN luetaan sallivasti; `FEN`-tagi antaa alkuaseman, ellei `SetUp` ole `"0"`).
        - Nimet ja vahvuusluvut otetaan tageista `White`, `Black`, `WhiteElo` ja `BlackElo`. Aksentilliset kirjaimet menettävät aksenttinsa, muut tulostettavan ASCIIn ulkopuoliset merkit muuttuvat merkiksi `?`, ja pitkät nimet katkaistaan (48 merkkiä). Tulos otetaan `Result`-tagista, muuten siirtotekstin lopusta. `Termination`-tagi näytetään, ellei se ole `normal`: silloin loppuasema kertoo tarinan (matti, patti).
        - Tämä päätepiste tarkistaa runkonsa itse: tuntematon kenttä tai puuttuva tai muu kuin merkkijonomuotoinen `pgn` saa vastauksen 400 `invalid_request`, jossa on `field`; virheellinen asetus saa vastauksen 400 `invalid_option` (`delayMs`-arvon on oltava JSON-luku, `coords`-arvon totuusarvo; `null` hylätään).

        **Istunto vaaditaan:** kiintiöt lasketaan tilikohtaisesti. **Rajoitukset:** kuten `GET /games/{id}/gif`. **Rungon kokoraja:** 135 168 tavua riippumatta `HTTP_BODY_LIMIT`-asetuksesta (PGN JSON-merkkijonona, sen escape-merkinnät mukaan lukien). **Aikaraja:** oletuksena 45 sekuntia.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Lyhyt käsin kirjoitettu peli ilman koordinaatteja
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: PGN-tiedosto kaikilla asetuksilla
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`, jossa on `field` (tuntematon kenttä tai `pgn` puuttuu tai ei ole merkkijono; ilman `field`-kenttää, kun runko ei ole objekti); `invalid_json`; `invalid_option`, jossa on `field` (`size`, `orientation`, `delayMs` tai `coords`); `invalid_pgn`, jossa on `line` ja `column` (1:stä alkaen, sarakkeet merkkeinä) sekä lukijan `message`: laiton tai moniselitteinen siirto, rikkinäinen tagi, tuntematon variantti, yli 65 536 tavua.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: palvelin on poistanut GIF-kuvat käytöstä (`GIF_ENABLED=false`; `gif`-rajoituksen token palautetaan).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: runko on yli 135 168 tavua.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `gif`-rajoitus, renderöintirajoitus tai tilikohtainen budjetti.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF-kuvaa ei voitu tehdä (palvelin kirjaa syyn lokiin). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`, jossa on `retryAfter` (3–10 sekuntia) ja `Retry-After`: renderöintijono on täynnä, tai GIF odotti liian kauan vapaata säiettä; kaikki pyynnön ottamat rajoitusten tokenit palautetaan. `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
