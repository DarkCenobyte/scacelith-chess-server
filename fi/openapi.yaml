paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Hae palvelimen nimi, versiot, portit ja rekisteröitymisen säännöt
      description: |-
        Mitä asiakas tarvitsee ennen kuin se kirjautuu sisään tai muodostaa yhteyden: palvelimen nimi ja tunniste, WebSocket-protokollan versiot ja WebSocketin sijainti, rekisteröitymisen säännöt, viralliset peliajat sekä rajat, jotka asiakas voi tarkistaa ennen lomakkeen lähettämistä.

        **Rajoitukset:** vain osoitekohtainen kerros.
      security: []
      responses:
        '200':
          description: Palvelimen kuvaus.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: osoitekohtainen kerros.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Luo tili
      description: |-
        Luo tilin: kun sen sähköpostiosoite on vahvistettu siihen lähetetyllä linkillä, tai heti, jos sähköpostivahvistusta ei käytetä.

        **Sähköpostivahvistuksen kanssa** (`REQUIRE_EMAIL_VERIFICATION`, oletus): 202 `verification_sent`. Tiliä ei vielä ole: rekisteröityminen odottaa 24 tuntia ja varaa käyttäjänimensä sillä välin. Osoitteeseen lähetetään linkki, joka on voimassa nämä 24 tuntia, enintään yksi osoitetta kohden 5 minuutin välein (`POST /auth/verify-email/resend` lähettää uuden); tili luodaan vahvistetulla osoitteella, kun linkkiä käytetään (sivun `/verify-email` painike), ja pelaaja voi sen jälkeen kirjautua sisään. Siihen asti kirjautuminen tällä käyttäjänimellä saa vastauksen `invalid_credentials` kuten tuntematon tili, eikä julkista profiilia ole. Uusi rekisteröityminen samalla osoitteella korvaa odottavan. Vastaus on sama, kun toinen tili jo käyttää osoitetta: linkkiä ei silloin lähetetä, vaan tilin omistaja saa ilmoituksen (enintään yhden tunnissa), ja käyttäjänimi varataan samalla tavalla, jotta mikään ei paljasta, onko osoitteella tiliä. Rekisteröityminen, jonka linkkiä ei käytetty, hylätään 24 tunnin kuluttua, ja sen käyttäjänimi vapautuu.

        **Ilman sähköpostivahvistusta** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, tili luodaan heti ja sillä voi kirjautua sisään.

        **Säännöt.** `username`: `USERNAME_MIN`–`USERNAME_MAX` merkkiä (3–20), kirjaimia, numeroita, `_` ja `-`, alkaa kirjaimella tai numerolla (`GET /info` antaa nämä kentässä `limits`); varatut nimet (`admin`, `moderator`, `deleted`...) ja jotkin etuliitteet hylätään; yksilöllinen kirjainkoosta riippumatta. `email`: alusta ja lopusta poistetaan tyhjät merkit, ja osoite tallennetaan pienillä kirjaimilla; pelkkää ASCIIta, ja verkkotunnuksessa on oltava piste. `password`: vähintään `PASSWORD_MIN_LENGTH` (10) merkkiä ja enintään 256 tavua UTF-8:aa; se ei saa sisältää käyttäjänimeä eikä sähköpostiosoitteen paikallista osaa, eikä se saa olla yleinen salasana.

        **Virheet** tässä tarkistusjärjestyksessä: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; salasanatiivisteiden jonon virheet; 409 `email_taken` (vain ilman sähköpostivahvistusta).

        **Rajoitukset:** `auth`, sitten `auth_register` (10 rekisteröitymistä tunnissa asiakasta kohden). **Työtodiste:** aina, kun `POW_REGISTER_BITS` on suurempi kuin 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Ensimmäinen yritys ilman työtodistetta
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Lähetetty uudelleen työtodisteen kanssa
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Tili on luotu, ja sillä voi kirjautua sisään (tällä palvelimella ei ole sähköpostivahvistusta).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Rekisteröityminen odottaa vahvistuslinkkiään (tai osoitteella on jo tili; vastaus ei kerro kumpi).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (ja `field`), `invalid_json`, `invalid_username`, `invalid_email` tai `weak_password` ja `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` tai `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: rekisteröityminen on suljettu tällä palvelimella (`GET /info` ilmoittaa `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: jollakin tilillä on tämä käyttäjänimi, tai toisen osoitteen odottava rekisteröityminen on varannut sen. `email_taken`: toinen tili käyttää osoitetta (vain ilman sähköpostivahvistusta).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: `auth`- tai `auth_register`-rajoitus tai salasanatiivisteiden jono.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (salasanatiivisteiden jono, tai tietokanta pysyi lukittuna), `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Kirjaudu sisään salasanalla
      description: |-
        Kirjautuu sisään käyttäjänimellä tai sähköpostiosoitteella ja salasanalla. Mahdollisia vastauksia on kaksi, kumpikin tilakoodilla 200: istunto tai, kun kaksivaiheinen vahvistus on käytössä, toinen vaihe, joka on suoritettava 5 minuutin kuluessa päätepisteellä `POST /auth/login/mfa`.

        Tuntematon tili, väärä salasana ja tili ilman salasanaa saavat saman vastauksen yhtä pitkän ajan jälkeen: 401 `invalid_credentials`. Tilin tarkistukset (`banned`, `email_unverified`) tehdään vasta oikean salasanan jälkeen. Samalla kirjautumisnimellä `AUTH_FAILURES_PER_ACCOUNT` (5) epäonnistumisesta alkaen jokaisen yrityksen on odotettava (429 `too_many_attempts`).

        **Rajoitus:** `auth`. **Työtodiste:** vain epäonnistuneiden kirjautumisten aallon aikana (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Istunto tai kaksivaiheista vahvistusta käyttävän kirjautumisen toinen vaihe.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Kirjautunut sisään
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Kaksivaiheinen vahvistus on käytössä
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: tuntematon tili, väärä salasana tai tili ilman salasanaa.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Vain oikean salasanan jälkeen: `banned` ja `until` (Unix-aika, ms; `null`, jos porttikielto on pysyvä) tai `email_unverified` (vanhempi tili, jonka osoitetta ei ole vielä vahvistettu).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (tämän kirjautumisnimen epäonnistumisviive) tai `rate_limited` (`auth`-rajoitus, salasanatiivisteiden jono).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (salasanatiivisteiden jono, tai tietokanta pysyi lukittuna), `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Viimeistele kirjautuminen toisella tekijällä
      description: |-
        Kaksivaiheista vahvistusta käyttävän kirjautumisen toinen vaihe sen jälkeen, kun `POST /auth/login` tai Google-kirjautuminen (`POST /auth/sso/google/finish` tai `POST /auth/sso/google/link`) vastasi `mfaRequired`. Lähetä `code` (todennussovelluksen 6-numeroinen koodi tai palautuskoodi) tai `recoveryCode`. Tässä käytetty palautuskoodi kuluu loppuun.

        Yksi vaihe hyväksyy enintään 5 väärää koodia; vaihe päättyy myös, kun salasana nollataan tai vaihdetaan. Google-liitoksen salasanavaiheen jälkeen liitos tallennetaan vasta, kun koodi hyväksytään tässä.

        **Rajoitukset:** `auth` sekä tilille enintään `AUTH_MFA_PER_ACCOUNT` (10) koodia 15 minuutissa mistä tahansa osoitteesta; sen yli koodia ei tarkisteta, joten palautuskoodi ei kulu.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Todennussovelluksen koodi
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Palautuskoodi
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Kirjautunut sisään.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: kumpaakaan kentistä `code` ja `recoveryCode` ei lähetetty, tai runko rikkoo skeemaa; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: vaihe vanheni, käytettiin tai päättyi 5 väärän koodin jälkeen, tai salasana on nollattu tai vaihdettu ensimmäisen vaiheen jälkeen (kirjaudu uudelleen sisään). `invalid_code`: väärä tai jo käytetty koodi.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (ja `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: vain Google-liitoksen salasanavaiheen jälkeen, kun Google-tili liitettiin sillä välin toiseen tiliin.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: vain Google-liitoksen salasanavaiheen jälkeen, kun tili muuttui sillä välin; aloita kirjautuminen alusta.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: tilin epäonnistumisviive, tai tilin `AUTH_MFA_PER_ACCOUNT` koodia viimeisten 15 minuutin ajalta on käytetty. `rate_limited`: `auth`-rajoitus.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` arvolla `retryAfter: 1`: tietokanta pysyi lukittuna (Google-liitoksen vaiheen jälkeen mitään ei liitetty: aloita kirjautuminen alusta). `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
