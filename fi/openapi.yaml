      summary: Hae pelitietue siirtoineen ja kelloineen
      description: |-
        Yksi pelitietue siirtoineen ja kelloineen. Ilman tokenia tai sellaisen pelaajan tokenilla, joka ei pelannut peliä, vastaus on julkinen. Kun tokenin pelaaja pelasi pelin, vastaukseen lisätään `you` ja `reportable`.

        **Rajoitus:** `public_read` (pelaajakohtainen tokenin kanssa, asiakaskohtainen ilman).
      security:
