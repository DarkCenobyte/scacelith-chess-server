      Palvelimen elossaolo ja valmius valvontaa varten. Nämä päätepisteet vastaavat API-portissa ennen todennusta ja kaikkia päätepisteiden rajoituksia, mutta kuten mikä tahansa pyyntö, ne ottavat yhden tokenin osoitekohtaisesta kerroksesta; valvontaisäntä voidaan lisätä luetteloon `ABUSE_EXEMPT`. Kumpikin polku toimii jokaiselle päätepisteelle: palvelimen juuressa ja polun `/api/v1` alla.

