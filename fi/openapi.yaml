      summary: Ilmoita äskeisen pelin vastustajasta
      description: |-
        Ilmoittaa vastustajasta jossakin pelaajan omista peleistä, joka päättyi viimeisten 7 päivän aikana. Ilmoitus ei koskaan itsessään muuta vahvuuslukua, seuraamusta tai luotettavuustasoa. Se nostaa moderaattorien näkemää tarkastelun prioriteettia ja pyytää pelin moottorianalyysin, paitsi kun syy on `abuse`.

        Samasta vastustajasta samasta pelistä tehty ilmoitus saa saman vastauksen eikä muuta mitään; vastaus ei koskaan kerro mitään ilmoitetusta tilistä. `GET /games/{id}` kertoo pelin pelaajille etukäteen, otettaisiinko ilmoitus vastaan (`reportable`).

        Tämä päätepiste tarkistaa runkonsa itse järjestyksessä `gameId`, `reported`, `category`, `comment`: virhe saa vastauksen 400 `invalid_request` ilman `field`-kenttää. Tuntemattomat kentät ohitetaan.

        **Rajoitukset:** `reports` (pelaajakohtainen), sitten `REPORTS_PER_DAY` (5) ilmoitusta pelaajaa kohden 24 tunnissa (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Ilmoitus on vastaanotettu (tai se oli jo tehty).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (ilman `field`-kenttää), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: ei ilmoittajan vastustaja pelissä, joka päättyi viimeisten 7 päivän aikana.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600` ja `Retry-After`-otsake): `REPORTS_PER_DAY` ilmoitusta viimeisten 24 tunnin aikana. `rate_limited`: `reports`-rajoitus tai tilikohtainen budjetti.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (istunnon haku löysi tietokannan lukittuna), `timeout`. Myös `server_busy`, jonka `retryAfter` on 2–5, kun palvelin on pahasti jäljessä (katso johdanto): pyyntöä ei suoritettu.'
