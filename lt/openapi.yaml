  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Atsisiųsti partiją PGN failu
      description: |-
        Ta pati partija PGN failu: viena partija, eilučių pabaigos `\n`, o ėjimų tekstas – eilutėmis, trumpesnėmis nei 80 stulpelių. Atsakymas toks pat su žetonu ir be jo.

        Žymės tokia tvarka: `Event` (`<SERVER_NAME> rated <category>` arba `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (pradžios data pagal UTC), `Round`, `White`, `Black`, `Result` (`*` nutrauktai partijai), `UTCDate` ir `UTCTime` (pradžia), `WhiteElo` ir `BlackElo` (reitingai pradžioje arba `-`), `WhiteRatingDiff` ir `BlackRatingDiff` (pokyčiai, pvz., `+10` ir `-10`, kiekvienoje reitinginėje partijoje; `+0`, kai pagal reitingo taisykles reitingas nepasikeičia; draugiška, pasirinktinės laiko kontrolės ar nutraukta partija jų neturi), `TimeControl` (sekundėmis), `Termination` (standartinė PGN reikšmė: `normal`; `time forfeit` – baigėsi laikas, taip pat kai partija baigiasi lygiosiomis; `abandoned`; `rules infraction` – antrasis neleistinas ėjimas arba techninis pralaimėjimas už sąžiningo žaidimo pažeidimą; `unterminated` – nutraukta partija), `PlyCount`, `ScacelithGameId` (dešimtainis ID).

        Prie kiekvieno ėjimo yra `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: ėjimą padariusio žaidėjo laikrodis po ėjimo ir už ėjimą įskaitytas laikas, dešimtosiomis sekundės dalimis (neapvalinant). Reikšmė praleidžiama, kai įraše jos nėra. Po paskutinio ėjimo žodžiais nurodoma pabaigos priežastis, tada rezultatas.

        **Riba:** `public_read` (vienam žaidėjui su žetonu, vienam klientui be jo).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: PGN failas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'PGN tekstas UTF-8 koduote (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: tai nėra teigiamas sveikasis skaičius, turintis ne daugiau kaip 16 skaitmenų (mažesnis nei 2^53); `invalid_request`: netinkama URL koduotė.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: išsiųstas žetonas negalioja.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: tokios partijos nėra.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: riba `public_read` arba paskyros biudžetas.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: be kita ko, kai išsaugotų ėjimų neįmanoma atkartoti iki išsaugotos pabaigos (serveris tai įrašo į žurnalą).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (duomenų bazė liko užrakinta; `retryAfter: 1` turinyje, be antraštės `Retry-After`), `server_busy` (ieškant seanso duomenų bazė buvo užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Atsisiųsti šio serverio partiją animuotu GIF
      description: |-
        Partija animuotu GIF. Vardai ir reitingai imami iš partijos įrašo (reitingai pradžioje, ištrinta paskyra – kaip `deleted#<id>`), kaip ir rezultatas bei pabaiga (`Resignation`, `Loss on time`...).

        Tikrinama tokia tvarka: `gif_disabled`, paveikslėlio parinktys (`size`, `orientation`, `delay`, `coords`), partijos ID, partija, jos ilgis.

        **Reikia seanso:** kvotos skaičiuojamos kiekvienai paskyrai. **Ribos:** `gif` – kiekvienai užklausai; `gif_user_min`, `gif_user_hour`, `gif_ip_min` ir `gif_ip_hour` – tik kai GIF reikia sugeneruoti (žr. skyriaus aprašą). **Laiko riba:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 sekundės (numatytoji – 45 sekundės).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 'Paveikslėlio dydis: `small` (32 px langeliai), `medium` (48 px) arba `large` (72 px).'
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: Kurios spalvos figūros rodomos lentos apačioje.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Milisekundės vienam ėjimui (nuo 1 iki 6 dešimtainių skaitmenų).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Ar aplink lentą piešiamos vertikalių raidės ir horizontalių skaičiai (`1`), ar ne (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` su `field` (`size`, `orientation`, `delay` ar `coords`): neleistina reikšmė. `invalid_game_id`. `invalid_request`: netinkama URL koduotė.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: tokios partijos nėra. `gif_disabled`: serveris išjungė GIF (`GIF_ENABLED=false`; ribos `gif` žetonas grąžinamas).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: riba `gif`, generavimo riba arba paskyros biudžetas.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF nepavyko sugeneruoti (serveris priežastį įrašo į žurnalą). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` su `retryAfter` (nuo 3 iki 10 sekundžių) ir `Retry-After`: generavimo eilė pilna arba GIF laukė laisvos gijos `GIF_QUEUE_TIMEOUT_MS` (10 sekundžių); visi užklausos paimti ribų žetonai grąžinami. `busy`: duomenų bazė liko užrakinta (`retryAfter: 1` tik turinyje). `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Sukurti animuotą GIF iš bet kurios PGN formatu atsiųstos partijos
      description: |-
        Toks pat paveikslėlis kaip `GET /games/{id}/gif` bet kuriai partijai, atsiųstai PGN tekstu: žaidimo išsaugotai partijai, kitos svetainės eksportui, ranka surinktai partijai. Naudojama tik pirmoji teksto partija.

        - PGN skaitytuvas priima tai, ką priima paties žaidimo skaitytuvas: kiekvieną šio serverio rašomą PGN ir įprastus kitų svetainių eksportus (komentarai, variantai, NAG ir laikrodžio anotacijos praleidžiami; ėjimų numeriai ir SAN skaitomi atlaidžiai; žymė `FEN` nurodo pradinę padėtį, nebent `SetUp` yra `"0"`).
        - Vardai ir reitingai imami iš žymių `White`, `Black`, `WhiteElo` ir `BlackElo`. Iš raidžių pašalinami diakritiniai ženklai, kiti simboliai už spausdinamų ASCII ribų tampa `?`, o ilgi vardai sutrumpinami (iki 48 simbolių). Rezultatas imamas iš žymės `Result`, o jei jos nėra – iš ėjimų teksto pabaigos. Žymė `Termination` rodoma, nebent ji yra `normal`: tada viską pasako galutinė padėtis (matas, patas).
        - Šis galinis punktas pats tikrina savo turinį: nežinomas laukas arba trūkstamas ar ne eilutės tipo `pgn` duoda atsakymą 400 `invalid_request` su `field`; netinkama parinktis – 400 `invalid_option` (`delayMs` turi būti JSON skaičius, `coords` – loginė reikšmė; `null` atmetama).

        **Reikia seanso:** kvotos skaičiuojamos kiekvienai paskyrai. **Ribos:** kaip `GET /games/{id}/gif`. **Turinio dydžio riba:** 135 168 baitai, nepriklausomai nuo `HTTP_BODY_LIMIT` (PGN kaip JSON eilutė, įskaitant jos kaitos sekas). **Laiko riba:** numatytoji – 45 sekundės.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Trumpa ranka surinkta partija, be koordinačių
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: PGN failas su visomis parinktimis
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` su `field` (nežinomas laukas arba trūksta `pgn` ar tai nėra eilutė; be `field`, kai turinys nėra objektas); `invalid_json`; `invalid_option` su `field` (`size`, `orientation`, `delayMs` ar `coords`); `invalid_pgn` su `line` ir `column` (skaičiuojant nuo 1, stulpeliai – simboliais) ir skaitytuvo `message`: neleistinas ar dviprasmis ėjimas, sugadinta žymė, nežinoma šachmatų atmaina, daugiau nei 65 536 baitai.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: serveris išjungė GIF (`GIF_ENABLED=false`; ribos `gif` žetonas grąžinamas).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: turinys didesnis nei 135 168 baitai.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: riba `gif`, generavimo riba arba paskyros biudžetas.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: GIF nepavyko sugeneruoti (serveris priežastį įrašo į žurnalą). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` su `retryAfter` (nuo 3 iki 10 sekundžių) ir `Retry-After`: generavimo eilė pilna arba GIF per ilgai laukė laisvos gijos; visi užklausos paimti ribų žetonai grąžinami. `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /players/{username}:
    get:
      operationId: getPlayer
      tags:
        - players
      summary: Gauti viešą žaidėjo profilį
      description: |-
        Viešas žaidėjo profilis: reitingai oficialiose kategorijose (serverio tvarka) ir partijų skaičiai. `games.total` apima visas išsaugotas partijas, įskaitant draugiškas ir nutrauktas; `games.rated`, `wins`, `draws` ir `losses` sumuojami pagal reitingo įrašus, taigi apima tik reitingines partijas. Atsakymas toks pat su žetonu ir be jo.

        **Riba:** `public_read` (vienam žaidėjui su žetonu, vienam klientui be jo).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Profilis.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
              example:
                username: alice
                createdAt: 1790882839743
                ratings:
                  - category: '3+2'
                    rating: 1510
                    provisional: true
                    games: 2
