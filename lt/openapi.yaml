      summary: Pakeisti atkūrimo kodus
      description: |-
        Vietoj atkūrimo kodų sukuria 10 naujų; senieji nustoja veikti.

        **Pakartotinis autentifikavimas:** slaptažodis ir autentifikavimo programėlės kodas lauke `code` (atkūrimo kodas atmetamas su 403 `invalid_code`). **Ribos:** `reauth`, tada `reauth_user`.
      security:
