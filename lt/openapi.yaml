        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: riba `sessions` arba paskyros biudžetas.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (duomenų bazė liko užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Dar kartą išsiųsti patvirtinimo nuorodą
      description: |-
        Dar kartą išsiunčia el. pašto patvirtinimo nuorodą. Atsakymas yra 202 `accepted`, kad ir koks būtų adresas, todėl jis niekada neatskleidžia, ar adresą naudoja paskyra ar registracija.

        Užklausa suveikia ne dažniau kaip kartą per 5 minutes vienam adresui. Šiuo adresu laukianti registracija vėl gauna visas 24 valandas, nepriklausomai nuo to, ar adresą naudoja kita paskyra, kad jos naudotojo vardas abiem atvejais liktų rezervuotas tiek pat laiko. Nuoroda siunčiama tik tai registracijai, kai adresu neužregistruota jokia paskyra (nauja, 24 valandas galiojanti nuoroda pakeičia ankstesnę), arba aktyviai, nepatvirtintai paskyrai su šiuo adresu.

        **Ribos:** `auth`, tada `auth_mail` (10 per valandą vienam klientui).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Priimta (kad ir koks būtų adresas).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: riba `auth` arba `auth_mail` (kad ir koks būtų adresas).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` su `retryAfter: 1`: duomenų bazė liko užrakinta ieškant paskyros arba išsaugant nepatvirtintos paskyros nuorodą (laukiančios registracijos pratęsimas atliekamas tik esant galimybei ir niekada nesukelia užklausos nesėkmės); adreso 5 minutės vis tiek prasideda, todėl nauja užklausa per jas nieko nepadaro. `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Išsiųsti slaptažodžio nustatymo iš naujo nuorodą
      description: |-
        Išsiunčia vieną valandą galiojančią slaptažodžio nustatymo iš naujo nuorodą, kuri atidaro puslapį `/reset-password`. Atsakymas yra 202 `accepted`, kad ir koks būtų adresas. Nuoroda siunčiama tik aktyviai paskyrai, ne dažniau kaip kartą per 5 minutes vienam adresui. Paskyra, prie kurios jungiamasi tik su Google, taip nusistato pirmąjį slaptažodį.

        Slaptažodžio atkūrimui taikomos griežčiausios API ribos, visos skaičiuojamos visam serveriui: 3 užklausos per valandą (`AUTH_FORGOT_PER_HOUR`) ir 10 per 24 valandas (`AUTH_FORGOT_PER_DAY`) vienam klientui (IPv4 adresui arba IPv6 /64), IPv6 /48 tinklui – 3 kartus daugiau, be to, dar taikoma riba `auth` (20 per 10 minučių) ir vienas laiškas vienam adresui kas 5 minutes. Nei 202, nei 429 neatskleidžia, ar adresą naudoja paskyra. Naujo slaptažodžio nustatymas turi savo ribą (`auth_reset`).

        **Ribos:** `auth`, `auth_forgot`, tada `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Priimta (kad ir koks būtų adresas).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: riba `auth`, `auth_forgot` arba `auth_forgot_day` (kad ir koks būtų adresas).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` su `retryAfter: 1`: duomenų bazė liko užrakinta ieškant paskyros arba išsaugant nuorodą; adreso 5 minutės vis tiek prasideda, todėl nauja užklausa per jas nuorodos neišsiunčia. `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Nustatyti naują slaptažodį su slaptažodžio nustatymo iš naujo nuorodos žetonu
      description: |-
        Nustato naują slaptažodį su slaptažodžio nustatymo iš naujo nuorodos žetonu (tą patį daro puslapis `/reset-password`). Naujam slaptažodžiui taikomos registracijos taisyklės.

        Nustatymas iš naujo turi šiuos padarinius vienoje transakcijoje (visi arba nė vieno): atšaukiami visi seansai ir laukiantis el. pašto keitimas; kitos paskyros slaptažodžio nustatymo iš naujo nuorodos nustoja veikti; adresas laikomas patvirtintu (nuoroda tai įrodė); savininkas gauna laišką. Dviejų veiksnių autentifikavimas nekeičiamas. Po slaptažodžių maišos eilės klaidos, 503 ar 500 niekas nepasikeitė: senasis slaptažodis ir seansai lieka, o nuoroda lieka galiojanti.

        **Ribos:** `auth`, tada `auth_reset` (10 per valandą vienam klientui, 30 IPv6 /48 tinklui, bendra su puslapiu: kiekvienas bandymas skaičiuoja slaptažodžio maišą).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: Slaptažodis pakeistas, visi seansai atjungti.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: nuoroda netinkama, panaudota arba nebegalioja, arba buvo išsiųsta adresu, kurio paskyra nebeturi. `weak_password` (su `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: riba `auth` arba `auth_reset` arba slaptažodžių maišos eilė.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: slaptažodžių maišos eilė arba duomenų bazė liko užrakinta (`retryAfter: 1`, niekas nepasikeitė). `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Pradėti prisijungimą su Google
      description: |-
        Pradeda prisijungimo su Google bandymą PKCE iššūkiui ir žaidimo klausytuvo prievadui adresu `127.0.0.1`. Atsakyme pateikiamas Google URL, kurį reikia atidaryti sistemos naršyklėje, ir bandymo `state`; bandymas galioja 10 minučių.

        `authUrl` apima `client_id`, `redirect_uri` (sudarytą iš `redirectPort` ir serverio kilmės žymės), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (paties serverio tikrintuvo, skirto Google, S256) su `code_challenge_method=S256` ir `prompt=select_account`. Žaidimas jį patikrina prieš atidarydamas (žr. skyriaus aprašą).

        **Riba:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: Bandymas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: šiame serveryje prisijungimas su Google nesiūlomas.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: riba `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (duomenų bazė liko užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /auth/sso/google/web/start:
    post:
      operationId: startGoogleWebSignIn
      tags:
        - google-sign-in
      summary: Pradėti prisijungimą su Google svetainėje
      description: |-
        Pradeda svetainės prisijungimo su Google bandymą jos puslapio PKCE iššūkiui. Atsakymas toks pat kaip žaidimui: Google URL, į kurį reikia pereiti, ir bandymo `state`; bandymas galioja 10 minučių. Siūlomas, kai `GET /info` nurodo `sso.googleWeb: true`.

        `authUrl` apima svetainės `client_id` ir `redirect_uri=GOOGLE_WEB_REDIRECT_URI`, o kiti parametrai tokie patys kaip žaidimo atveju. Puslapis jį patikrina prieš pereidamas į jį (žr. **Svetainėje** skyriaus apraše).

        **Riba:** `sso_start`, bendra su žaidimo pradžia.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoWebStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
      responses:
        '200':
          description: Bandymas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-web.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fscacelith.com%2Faccount%2Fgoogle%2F&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: trūksta `codeChallenge` arba jis netinkamo formato, arba pateiktas bet kuris kitas laukas (įskaitant `redirectPort`).'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: šiame serveryje prisijungimas su Google nesiūlomas arba nesiūlomas svetainėms.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: riba `sso_start` (bendra su žaidimo pradžia).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (duomenų bazė liko užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Perduoti Google atsakymą serveriui
      description: |-
        Perduoda serveriui `code` ir `state`, kuriuos Google atsiuntė žaidimo klausytuvui arba svetainės puslapiui, kartu su bandymo ID ir PKCE tikrintuvu. Bandymo ID be tikrintuvo nenaudingas, o kodas nenaudingas be paties serverio PKCE tikrintuvo ir kliento slaptojo rakto.

        Serveris patikrina bandymą (nežinomas, panaudotas ar nebegaliojantis: 410), tada tikrintuvą (neteisingas tikrintuvas palieka bandymą tinkamą naudoti), tada vieną kartą panaudoja bandymą, patikrina `state` ir `iss`, iškeičia kodą su Google ir patikrina ID žetoną. Atsakymas (200) yra vienas iš šių:

        - `{ token, expiresAt, user }`: prisijungta prie susietos paskyros;
        - `{ mfaRequired, mfaToken, expiresIn }`: tęskite su `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: nauja paskyra; per 10 minučių tęskite su `POST /auth/sso/complete`. `suggestedUsername` sudaromas iš Google vardo arba adreso ir yra `""`, kai niekas netinka;
        - `{ needsPassword, linkTicket, username, expiresIn }`: paskyra su šiuo adresu turi slaptažodį; tęskite su `POST /auth/sso/google/link`. Kol kas niekas nesusieta.

        **Riba:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Seansas, antrasis žingsnis arba kitas pirmojo prisijungimo su Google žingsnis.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Prisijungta prie susietos paskyros
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Dviejų veiksnių autentifikavimas įjungtas
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Naujas žaidėjas
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Adresą naudoja paskyra su slaptažodžiu
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: tikrintuvas neatitinka bandymo iššūkio (bandymas lieka tinkamas naudoti). `sso_email_unverified`: Google nepatvirtino adreso. `registration_closed`. `account_disabled`. Tik susietai paskyrai: `banned` (su `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: šiame serveryje prisijungimas su Google nesiūlomas.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: adresą naudoja aktyvi paskyra be slaptažodžio (ji neįvardijama).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: nežinomas, panaudotas arba nebegaliojantis bandymas.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: riba `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (duomenų bazė liko užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Susieti Google su esama paskyra jos slaptažodžiu
      description: |-
        Po to, kai `finish` atsakė `needsPassword`: susieja Google su esama paskyra naudojant tos paskyros slaptažodį, įvestą žaidime. Atsakymas (200) yra seansas (susiejimas išsaugotas ir prisijungta) arba, kai įjungtas dviejų veiksnių autentifikavimas, `{ mfaRequired, mfaToken, expiresIn }`: tęskite su `POST /auth/login/mfa`, o susiejimas išsaugomas tik tada, kai ten priimamas kodas.

        Neteisingas slaptažodis palieka bilietą tinkamą naudoti, iš viso 5 bandymams. Bandymas įskaičiuojamas prieš pat slaptažodžio patikrą: 429 `too_many_attempts` ar 428 `pow_required` bandymo neįskaičiuoja, o slaptažodžių maišos eilės atmetimas (503 `server_busy`, 429 `rate_limited`) bandymą jau įskaičiavo ir laikomas paskyros nesėkme. Delsa po nesėkmių naudoja tą patį skaitiklį kaip `POST /auth/login`.

        **Riba:** `auth` (su IPv6 /48 skaičiavimu). **Darbo įrodymas:** kaip ir `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Seansas arba antrasis prisijungimo žingsnis.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: neteisingas slaptažodis; bilietas lieka galioti, iš viso 5 bandymams.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (su `until`), tik po teisingo slaptažodžio.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: šiame serveryje prisijungimas su Google nesiūlomas.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: per tą laiką Google paskyra buvo susieta su kita paskyra.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: nežinomas, panaudotas arba nebegaliojantis bilietas, penktas neteisingas slaptažodis, paskyra, kurios būsena ar adresas pasikeitė po `finish`, arba paskyra, kurios būsena, adresas, slaptažodis ar dviejų veiksnių autentifikavimas pasikeitė, kol susiejimas buvo įrašomas. Pradėkite prisijungimą iš naujo.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (paskyros delsa po nesėkmių) arba `rate_limited` (riba `auth`, slaptažodžių maišos eilė).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: slaptažodžių maišos eilė arba duomenų bazė liko užrakinta (`retryAfter: 1`, niekas nesusieta). `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Sukurti paskyrą po pirmojo prisijungimo su Google
      description: |-
        Kai `finish` atsakė `needsUsername`: sukuria paskyrą su pasirinktu naudotojo vardu (taikomos registracijos taisyklės) ir atidaro jos seansą. Paskyra neturi slaptažodžio: `hasPassword` yra `false`, o „Pamiršote slaptažodį?“ (`POST /auth/password/forgot`) leidžia jį nustatyti.

        **Riba:** `auth` (su jos skaičiavimu pagal IPv6 /48).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Paskyra sukurta, jos seansas atidarytas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request`, `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: šiame serveryje prisijungimas su Google nesiūlomas.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (šį naudotojo vardą turi paskyra arba jį rezervavo laukianti kito adreso registracija), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: nežinomas, panaudotas arba nebegaliojantis bilietas.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: riba `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (duomenų bazė liko užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Gauti prisijungusių įrenginių sąrašą
      description: |-
        Aktyvūs paskyros seansai (prisijungę įrenginiai), pradedant paskiausiai naudotu. `current` žymi seansą, kuris siunčia užklausą. `lastSeenAt` atnaujinamas ne dažniau kaip kas 5 minutes (vėliau, kol serveris labai atsilieka); `expiresAt` yra galutinė pabaiga, o neveiklumo riba gali baigti seansą anksčiau.

        **Riba:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aktyvūs seansai.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: riba `sessions` arba paskyros biudžetas.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (duomenų bazė liko užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Atjungti vieną įrenginį
      description: |-
        Atjungia vieną paskyros seansą; galima atjungti ir dabartinį. Su juo atidarytas WebSocket uždaromas. Be turinio (arba `{}`).

        **Riba:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Seansas atjungtas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: turinys kitoks nei `{}` arba `id`, kuris nėra tinkamai URL užkoduotas; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: šioje paskyroje nėra aktyvaus seanso su šiuo ID.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: riba `sessions` arba paskyros biudžetas.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (duomenų bazė liko užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Gauti paskyrą, jos reitingus ir aktyvias sankcijas
      description: |-
        Paskyra taip, kaip ją mato jos žaidėjas: paskyros rodinys (taip pat kiekvieno prisijungimo atsakymo `user`), po vieną reitingo įrašą kiekvienai kategorijai, kurioje žaidėjas žaidė reitingines partijas, aktyvios sankcijos ir sustabdymas. Apsaugos nuo sukčiavimo sistemos nustatytas sąžiningumo lygis niekada nerodomas.

        **Riba:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paskyra.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized` arba `invalid_token` (taip pat, kai paskyra ištrinta).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: riba `account` arba paskyros biudžetas.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (duomenų bazė liko užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Priimti arba atmesti tiesioginius iššūkius
      description: |-
        Nustato, ar kiti žaidėjai gali mesti šiam žaidėjui iššūkį pagal vardą. Su `none` tiesioginiai iššūkiai atmetami: iššūkio siuntėjui pranešama, kad žaidėjas nepasiekiamas. Pakartotinis autentifikavimas nereikalingas.

        **Riba:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: Dabar galiojančios nuostatos.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: riba `account` arba paskyros biudžetas.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (duomenų bazė liko užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Pakeisti slaptažodį
      description: |-
        Pakeičia slaptažodį. Reikia dabartinio slaptažodžio, bet nereikia antrojo veiksnio, net kai įjungtas dviejų veiksnių autentifikavimas. Naujam slaptažodžiui taikomos registracijos taisyklės (tikrinama po dabartinio slaptažodžio).

        Pakeitimas sukelia šiuos padarinius vienoje transakcijoje (visus arba nė vieno): atšaukia visus kitus seansus (šis lieka prisijungęs), nutraukia laukiantį el. pašto adreso keitimą, padaro paskyros slaptažodžio nustatymo iš naujo nuorodas neveikiančias ir išsiunčia savininkui laišką.

        **Pakartotinis autentifikavimas:** tik slaptažodis. **Ribos:** `reauth`, tada `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: Slaptažodis pakeistas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (paskyra, kuri prisijungia tik per Google), `weak_password` (su `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: neteisingas dabartinis slaptažodis arba slaptažodis buvo nustatytas iš naujo ar pakeistas, kol užklausa buvo tikrinama.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (nesėkmingi paskyros pakartotiniai autentifikavimai) arba `rate_limited` (riba `reauth` ar `reauth_user`, paskyros biudžetas, slaptažodžių maišos eilė).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: slaptažodžių maišos eilė arba duomenų bazė liko užrakinta (`retryAfter: 1`, niekas nepakeista). `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Pradėti įjungti dviejų veiksnių autentifikavimą
      description: |-
        Įrašo naują laukiantį autentifikavimo slaptąjį raktą, kuris pakeičia bet kurį ankstesnį laukiantį, ir grąžina jį autentifikavimo programėlei (kaip tekstą ir kaip `otpauth://` URI, rodytiną QR kodu). Dviejų veiksnių autentifikavimas dar neįjungtas: `POST /account/mfa/totp/enable` jį įjungia su šio slaptojo rakto kodu.

        **Pakartotinis autentifikavimas:** tik slaptažodis. **Ribos:** `reauth`, tada `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: Laukiantis slaptasis raktas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (paskyra, kuri prisijungia tik per Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (tikrinama prieš slaptažodį).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (nesėkmingi paskyros pakartotiniai autentifikavimai) arba `rate_limited` (riba `reauth` ar `reauth_user`, paskyros biudžetas, slaptažodžių maišos eilė).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (slaptažodžių maišos eilė arba duomenų bazė liko užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: Baigti įjungti dviejų veiksnių autentifikavimą ir gauti atkūrimo kodus
      description: |-
        Įjungia dviejų veiksnių autentifikavimą su laukiančio slaptojo rakto kodu (lygiai 6 skaitmenys). Slaptažodžio čia neprašoma: jis buvo pateiktas nustatymo žingsnyje. Atsakyme yra 10 atkūrimo kodų, parodomų tik šį kartą.

        **Ribos:** `reauth`, tada `reauth_user`; neteisingas kodas įskaičiuojamas į paskyros nesėkmingus pakartotinius autentifikavimus.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Dviejų veiksnių autentifikavimas įjungtas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: `code` nėra lygiai 6 skaitmenys arba turinys pažeidžia schemą; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: neteisingas kodas (patikrinkite įrenginio laiką).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`; `mfa_setup_required`: nėra laukiančio slaptojo rakto (pirmiausia iškvieskite `POST /account/mfa/totp/setup`).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (nesėkmingi paskyros pakartotiniai autentifikavimai) arba `rate_limited` (riba `reauth` ar `reauth_user`, paskyros biudžetas).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (duomenų bazė liko užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /account/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags:
        - two-step-verification
      summary: Išjungti dviejų veiksnių autentifikavimą
      description: |-
        Išjungia dviejų veiksnių autentifikavimą. Slaptasis raktas ir atkūrimo kodai ištrinami, o savininkas gauna laišką.

        **Pakartotinis autentifikavimas:** slaptažodis ir autentifikavimo programėlės kodas arba atkūrimo kodas (būtinas vienas iš `code` ar `recoveryCode`). **Ribos:** `reauth`, tada `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Dviejų veiksnių autentifikavimas išjungtas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: mfa_disabled
              example:
                status: mfa_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (paskyra, kuri prisijungia tik per Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`mfa_code_required` (nėra nei `code`, nei `recoveryCode`; tikrinama prieš slaptažodį), `invalid_password`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_not_enabled`.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (nesėkmingi pakartotiniai autentifikavimai arba šioje paskyroje išbandyta per daug kodų) arba `rate_limited` (riba `reauth` ar `reauth_user`, paskyros biudžetas, slaptažodžių maišos eilė).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (slaptažodžių maišos eilė arba duomenų bazė liko užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /account/mfa/recovery-codes:
