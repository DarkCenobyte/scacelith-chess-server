          description: '`too_many_attempts` (nesėkmingi pakartotiniai autentifikavimai arba šioje paskyroje išbandyta per daug kodų) arba `rate_limited` (riba `account_export`, `reauth` ar `reauth_user`, paskyros biudžetas, slaptažodžių maišos eilė).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (duomenų bazė liko užrakinta, su antrašte `Retry-After: 1`), `server_busy` (slaptažodžių maišos eilė), `timeout` (60 sekundžių). Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: Ištrinti paskyrą
      description: |-
        Ištrina paskyrą; šio veiksmo atšaukti negalima.

        - Visi seansai iš karto atšaukiami: nuo tada žetonas gauna 401 `invalid_token`.
        - Naudotojo vardas tampa `deleted#<id>` paskyroje ir kiekviename partijos įraše.
        - Panaikinami: el. pašto adresas, slaptažodžio maiša, dviejų veiksnių autentifikavimo slaptasis raktas ir atkūrimo kodai, seansų ir nuorodų žetonai, susiejimas su Google, apsaugos nuo sukčiavimo sistemos sąžiningumo įrašas ir su saugos įvykiais saugomi IP adresai.
        - Reitingai ir partijos išsaugomi. Partijas galima toliau skaityti su anoniminiu vardu, o `GET /players/{username}` ankstesniam vardui atsako 404.

        **Pakartotinis autentifikavimas:** slaptažodis ir, jei įjungtas dviejų veiksnių autentifikavimas, autentifikavimo programėlės kodas arba atkūrimo kodas. **Ribos:** `reauth`, tada `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Paskyra ištrinta.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (paskyra, kuri prisijungia tik per Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (nesėkmingi pakartotiniai autentifikavimai arba šioje paskyroje išbandyta per daug kodų) arba `rate_limited` (riba `reauth` ar `reauth_user`, paskyros biudžetas, slaptažodžių maišos eilė).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (slaptažodžių maišos eilė arba duomenų bazė liko užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Gauti žaidėjo partijų sąrašą, filtruotą ir suskirstytą puslapiais
      description: |-
        Prisijungusio žaidėjo partijos, pradedant naujausia, filtruotos ir suskirstytos puslapiais, kartu su filtrą atitinkančių partijų skaičiumi. Visi užklausos eilutės parametrai neprivalomi, o tuščia reikšmė laikoma nenurodyta.

        Puslapiavimas: ankstesnio puslapio `next` perduokite kaip `before`; paskutiniame puslapyje `next` yra `null`. `total` nurodo filtrą atitinkančių partijų skaičių visuose puslapiuose.

        **Riba:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: Oficialios kategorijos ID (`3+2` arba `3%2B2`) arba `custom` – visoms partijoms su kita laiko kontrole.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Tik reitinginės (`true`) arba draugiškos (`false`) partijos.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Tik laimėtos, pralaimėtos arba lygiosiomis baigtos partijos žaidėjo požiūriu. Nutrauktos partijos rodomos tik be šio filtro.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Vienas istorijos puslapis.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` nėra partijos ID), `invalid_limit` arba `invalid_filter` (`category`, `rated` ar `result`), kiekviena su `field`, nurodančiu parametrą.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: riba `account_games` arba paskyros biudžetas.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (duomenų bazė liko užrakinta; `retryAfter: 1` turinyje, be antraštės `Retry-After`), `server_busy` (ieškant seanso duomenų bazė buvo užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /games/{id}:
