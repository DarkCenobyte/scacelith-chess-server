        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (nesėkmingi pakartotiniai autentifikavimai arba šioje paskyroje išbandyta per daug kodų) arba `rate_limited` (riba `reauth` ar `reauth_user`, paskyros biudžetas, slaptažodžių maišos eilė).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (slaptažodžių maišos eilė arba duomenų bazė liko užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: Pakeisti el. pašto adresą
      description: |-
        Pakeičia paskyros el. pašto adresą. Iš `newEmail` pašalinami tarpai pradžioje ir pabaigoje, raidės paverčiamos mažosiomis, tada adresas tikrinamas kaip registracijos adresas.

        **Su el. pašto patvirtinimu** (numatytasis būdas): 202 `verification_sent`. Naujuoju adresu išsiunčiama 24 valandas galiojanti nuoroda; ji atveria `/confirm-email-change`, o adresas pasikeičia tik tada, kai žaidėjas paspaudžia to puslapio mygtuką. Iki tol `GET /account/me` rodo naująjį adresą kaip `pendingEmail`. Nauja užklausa pakeičia laukiančią; slaptažodžio pakeitimas ar nustatymas iš naujo ją atšaukia. Tam pačiam naujam adresui per 5 minutes išsiunčiama ne daugiau kaip viena nuoroda, kad ir kas jos prašytų (užklausai dėl jau laukiančio keitimo paliekama anksčiau išsiųsta nuoroda, kuri lieka galioti); atsakymas nesiskiria. Dabartiniu adresu išsiunčiamas pranešimas, kad paprašyta pakeisti adresą į užmaskuotą adresą (`a***@example.org`). Atsakymas ir `pendingEmail` būna tokie patys, kai naująjį adresą jau naudoja kita paskyra: tada nuoroda nesiunčiama, todėl toks keitimas niekada neužbaigiamas, o to adreso savininkas vietoj to gauna pranešimą (ne dažniau kaip kartą per valandą).

        Kai nuoroda patvirtinama, adresas pasikeičia ir laikomas patvirtintu, įrenginiai lieka prisijungę, anksčiau išsiųstos nuorodos (patvirtinimo, slaptažodžio nustatymo iš naujo, kitų keitimų) nustoja veikti, o ankstesniu adresu apie tai pranešama, naująjį adresą užmaskavus.

        **Be el. pašto patvirtinimo** (`REQUIRE_EMAIL_VERIFICATION=false`): adresas pasikeičia iš karto (200 `email_changed`), o ankstesniu adresu apie tai pranešama. Jei adresą naudoja kita paskyra, atsakymas yra 409 `email_taken`, o to adreso savininkas gauna pranešimą.

        **Pakartotinis autentifikavimas:** slaptažodis ir, jei įjungtas dviejų veiksnių autentifikavimas, autentifikavimo programėlės kodas arba atkūrimo kodas. `invalid_email` ir `same_email` tikrinami prieš slaptažodį, todėl neįskaičiuojami kaip nesėkmės. **Ribos:** `reauth`, tada `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Adresas pakeistas iš karto (šiame serveryje el. pašto patvirtinimas nenaudojamas).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: Naujasis adresas toks, koks įrašytas.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: Naujuoju adresu išsiųsta patvirtinimo nuoroda (arba adresas priklauso kitai paskyrai; atsakymas to neatskleidžia).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email` (dabartinis paskyros adresas), `password_not_set` (paskyra, kuri prisijungia tik per Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` (taip pat, kai užklausą aplenkė slaptažodžio pakeitimas ar nustatymas iš naujo: nuoroda nesiunčiama), `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: tik be el. pašto patvirtinimo.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (nesėkmingi pakartotiniai autentifikavimai arba šioje paskyroje išbandyta per daug kodų) arba `rate_limited` (riba `reauth` ar `reauth_user`, paskyros biudžetas, slaptažodžių maišos eilė).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: slaptažodžių maišos eilė arba duomenų bazė liko užrakinta (`retryAfter: 1`: niekas nepakeista, tą pačią užklausą galima siųsti dar kartą). `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: Atsisiųsti paskyros duomenis
      description: |-
        Viskas, ką serveris saugo apie paskyrą, viename JSON faile, kurį galima įrašyti (`format` `scacelith-account-export`, `version` 1). Eksportuojant užregistruojamas saugos įvykis (`account_exported`). Dokumento masyvas `notes` paprasta anglų kalba paaiškina žaidėjui, kas neįtraukta.

        **Eksporte niekada nebūna:** slaptažodžio maišos, dviejų veiksnių autentifikavimo slaptojo rakto ir atkūrimo kodų; jokio seanso ar nuorodos žetono ir jokios jų maišos; apsaugos nuo sukčiavimo sistemos duomenų (sąžiningumo lygio ir balo, anomalijų, partijų analizės, pranešimo svorio); kitų žaidėjų pranešimų apie žaidėją; moderatorių tapatybių; kitų žaidėjų privačių duomenų (varžovai nurodomi viešu vardu ir reitingu, niekas neatskleidžia, ar kitam žaidėjui buvo skirta sankcija, ir neįtraukiamas joks IP adresas, kuris gali priklausyti kitam asmeniui).

        **Pakartotinis autentifikavimas:** slaptažodis ir, jei įjungtas dviejų veiksnių autentifikavimas, autentifikavimo programėlės kodas arba atkūrimo kodas. **Ribos:** `account_export` (5 per valandą vienam žaidėjui, visame serveryje; skaičiuojamas kiekvienas bandymas, įskaitant nesėkmingus; tikrinama pirmiausia), tada `reauth` ir `reauth_user`. **Laiko riba:** 60 sekundžių.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: Eksporto dokumentas kaip priedas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-account-<username>.json"`. Naudotojo vardo simboliai, kurie nėra raidės, skaitmenys, `_`, `.` ar `-`, pakeičiami į `_`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-account-[A-Za-z0-9_.-]+\.json"$'
              example: attachment; filename="scacelith-account-alice.json"
          content:
