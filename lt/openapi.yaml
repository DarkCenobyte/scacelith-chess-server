  /players/{username}/games:
    get:
      operationId: listPlayerGames
      tags:
        - players
      summary: Gauti žaidėjo paskutinių partijų sąrašą
      description: |-
        Paskutinės žaidėjo partijos, pradedant naujausia, suskirstytos puslapiais kaip istorija, bet be filtrų ir bendro skaičiaus. `color` yra šio žaidėjo spalva. `next` yra paskutinės partijos ID kiekvieną kartą, kai puslapis pilnas, todėl kitas puslapis gali būti tuščias. Pirmiausia ieškoma žaidėjo: nežinomam žaidėjui atsakoma 404, kad ir ką nurodytų užklausos eilutė.

        **Riba:** `public_read` (vienam žaidėjui su žetonu, vienam klientui be jo).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Vienas žaidėjo partijų puslapis.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerGamesPage'
              example:
                username: alice
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                next: 4100000000001
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_cursor` (`before` nėra partijos ID), `invalid_limit` (šios dvi – be `field`).'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: išsiųstas žetonas negalioja.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: tokio žaidėjo nėra arba paskyra ištrinta.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: riba `public_read` arba paskyros biudžetas.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (duomenų bazė liko užrakinta; `retryAfter: 1` turinyje, be antraštės `Retry-After`), `server_busy` (ieškant seanso duomenų bazė buvo užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: Gauti geriausius kategorijos žaidėjus
      description: |-
        100 geriausių oficialios kategorijos reitingo įrašų, turinčių bent `minGames` (`PROVISIONAL_GAMES`) įskaitytų partijų, neįtraukiant ištrintų paskyrų ir patvirtintų sukčių. Serveris kiekvieną lentelę perskaičiuoja ne dažniau kaip kas 10 sekundžių; `updatedAt` nurodo kada. Vienu metu vykdomas tik vienas kategorijos skaičiavimas: tuo metu kitos užklausos gauna ankstesnį sąrašą arba, jei sąrašo dar nėra, laukia skaičiavimo pabaigos.

        **Ribos:** tik adresų lygmuo.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: Oficialios kategorijos ID (`3+2` arba `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: Kiek žaidėjų, nuo 1 iki 100. Didesnis skaičius, turintis iki 3 skaitmenų, laikomas 100; tuščia reikšmė laikoma nenurodyta.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: Lyderių lentelė.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (nenurodyta arba ne oficiali kategorija), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: adresų lygmuo.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (duomenų bazė liko užrakinta; `retryAfter: 1` turinyje, be antraštės `Retry-After`), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Pranešti apie neseniai žaistos partijos varžovą
      description: |-
        Praneša apie varžovą vienoje iš paties žaidėjo partijų, pasibaigusių per pastarąsias 7 dienas. Pranešimas pats savaime niekada nekeičia reitingo, sankcijos ar sąžiningumo lygio. Jis padidina peržiūros prioritetą, kurį mato moderatoriai, ir, išskyrus `abuse`, užsako partijos analizę šachmatų varikliu.

        Pranešimas apie tą patį varžovą dėl tos pačios partijos gauna tokį pat atsakymą ir nieko nekeičia; atsakymas niekada nieko neatskleidžia apie paskyrą, apie kurią pranešama. `GET /games/{id}` iš anksto nurodo partijos žaidėjams, ar pranešimas būtų priimtas (`reportable`).

        Šis galinis punktas pats tikrina savo turinį tokia tvarka: `gameId`, `reported`, `category`, `comment`; nesėkmės atveju atsakoma 400 `invalid_request` be `field`. Nežinomi laukai ignoruojami.

        **Ribos:** `reports` (vienam žaidėjui), tada `REPORTS_PER_DAY` (5) pranešimai vienam žaidėjui per 24 valandas (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: Pranešimas gautas (arba jau buvo pateiktas).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (be `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: tai nėra pranešėjo varžovas partijoje, pasibaigusioje per pastarąsias 7 dienas.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, su antrašte `Retry-After`): per pastarąsias 24 valandas pateikta `REPORTS_PER_DAY` pranešimų. `rate_limited`: riba `reports` arba paskyros biudžetas.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (ieškant seanso duomenų bazė buvo užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
