          description: 'Duomenų bazė liko užrakinta (`Retry-After: 1`) arba serveris labai atsilieka (`Retry-After` nuo 2 iki 5, žr. įvadą): niekas nepakeista, nuoroda vis dar veikia. Taip pat, kai baigiasi doroklės skirtasis laikas.'
  /healthz:
    servers:
      - url: https://caissa.scacelith.com
        description: Oficialus serveris, šaknyje.
      - url: https://caissa.scacelith.com/api/v1
        description: Oficialus serveris, po `/api/v1`.
      - url: https://{host}:{port}
        description: Bet kuris Scacelith serveris, šaknyje.
        variables:
          host:
            default: caissa.scacelith.com
            description: Viešasis serverio pagrindinio kompiuterio vardas (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Viešasis API prievadas (`PUBLIC_API_PORT`, o jei jo nėra – `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Bet kuris Scacelith serveris, po `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: Viešasis serverio pagrindinio kompiuterio vardas (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Viešasis API prievadas (`PUBLIC_API_PORT`, o jei jo nėra – `API_PORT`).
    get:
      operationId: getLiveness
      tags:
        - health
      summary: Patikrinti, ar procesas veikia
      description: |-
        Atsako 200 `ok`, kol procesas veikia. Veikia ir `HEAD`. Bet kuris kitas metodas gauna atsakymą 405 `method_not_allowed` su `Allow: GET, HEAD` (įskaitant `OPTIONS`).

        **Ribos:** tik adresų lygmuo.
      security: []
      responses:
        '200':
          description: Procesas veikia.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
              example:
                status: ok
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: adresų lygmuo.'
  /readyz:
    servers:
      - url: https://caissa.scacelith.com
        description: Oficialus serveris, šaknyje.
      - url: https://caissa.scacelith.com/api/v1
        description: Oficialus serveris, po `/api/v1`.
      - url: https://{host}:{port}
        description: Bet kuris Scacelith serveris, šaknyje.
        variables:
          host:
            default: caissa.scacelith.com
            description: Viešasis serverio pagrindinio kompiuterio vardas (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Viešasis API prievadas (`PUBLIC_API_PORT`, o jei jo nėra – `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: Bet kuris Scacelith serveris, po `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: Viešasis serverio pagrindinio kompiuterio vardas (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: Viešasis API prievadas (`PUBLIC_API_PORT`, o jei jo nėra – `API_PORT`).
    get:
      operationId: getReadiness
      tags:
        - health
      summary: Patikrinti, ar serveris priima žaidėjus
      description: |-
        Atsako 200 `ready`, kai serveris priima žaidėjus, ir 503 `not_ready`, kol jis paleidžiamas ar stabdomas. Veikia ir `HEAD`. Bet kuris kitas metodas gauna atsakymą 405 `method_not_allowed` su `Allow: GET, HEAD` (įskaitant `OPTIONS`).

        **Ribos:** tik adresų lygmuo.
      security: []
      responses:
        '200':
          description: Serveris priima žaidėjus.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: adresų lygmuo.'
        '503':
          description: Serveris paleidžiamas arba stabdomas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Seanso žetonas (`sct_` ir 43 base64url simboliai) iš prisijungimo atsakymo, antraštėje `Authorization`: `Authorization: Bearer <token>`. Priešdėlis yra lygiai `Bearer` (skiriamos didžiosios ir mažosios raidės) ir vienas tarpas; reikšmė be jo arba žetonas, kurio ilgis nėra nuo 1 iki 512 spausdinamų ASCII simbolių, gauna atsakymą 401 `invalid_token` kaip ir bet kuris kitas netinkamas žetonas. Tuščia antraštė laikoma nenurodyta.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: Partijos ID – teigiamas dešimtainis sveikasis skaičius, turintis ne daugiau kaip 16 skaitmenų, be pradinių nulių, mažesnis nei 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: Seanso ID, kaip jį pateikia `GET /auth/sessions`, užrašytas be pradinių nulių (`03` nėra 3 seansas).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: Žaidėjo naudotojo vardas, neskiriant didžiųjų ir mažųjų raidžių. Serveris priima bet kurį vardą, kurį sudaro nuo 2 iki 24 simbolių iš `[A-Za-z0-9_.-]` (plačiausia kada nors leista taisyklė).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Partijos ID; pateikiamos tik senesnės partijos. Perduokite ankstesnio puslapio `next`. Tuščia reikšmė laikoma nenurodyta.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Puslapio dydis, nuo 1 iki 50. Didesnis skaičius, turintis iki 3 skaitmenų, laikomas 50; tuščia reikšmė laikoma nenurodyta.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: Laiško nuorodos žetonas (43 base64url simboliai). Jei jo nėra arba jis neteisingas, rodomas puslapis „link invalid or expired“ (nuoroda netinkama arba nebegalioja).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Kiekvienas serverio atsakymas draudžia jį saugoti talpykloje.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Kiek sekundžių palaukti prieš bandant dar kartą; ta pati reikšmė kaip `retryAfter` turinyje.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: Bearer autentifikavimo iššūkis, su `error="invalid_token"` netinkamam žetonui.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: Po šio atsakymo serveris uždaro ryšį.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (su `field`, kai klaida yra turinio lauke) arba `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Laukas pažeidžia schemą
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: Turinys nėra JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Silpnas slaptažodis
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: PGN, kurio neįmanoma perskaityti
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (nėra antraštės `Authorization`) arba `invalid_token` (žetonas netaisyklingas, nebegalioja, atšauktas arba priklauso ištrintai paskyrai).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Nėra seanso
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Netinkamas žetonas
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: Užklausa atmesta.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Neteisingas slaptažodis pakartotinio autentifikavimo metu
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Sustabdyta paskyra
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found` arba funkcija, kurią šis serveris išjungė.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: turinys negautas per 10 sekundžių. Serveris uždaro ryšį.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: Užklausa prieštarauja serverio būsenai.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: prisijungimo su Google bandymas ar bilietas nežinomas, panaudotas arba nebegalioja; pradėkite prisijungimą iš naujo.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: turinys viršija `HTTP_BODY_LIMIT` (numatytoji reikšmė – 16 384 baitai). Serveris uždaro ryšį.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: užklausos tikslas viršija 4096 simbolius.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: turinys nėra `application/json` arba jo koduotė nėra UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: partijoje yra daugiau nei `GIF_MAX_PLIES` (600) pusėjimių.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: išspręskite iššūkį `pow` ir dar kartą išsiųskite tą pačią užklausą su `pow: { challenge, nonce }`. `reason` nurodo priežastį: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` arba `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (užklausų dažnio riba, paskyros biudžetas arba slaptažodžių maišos eilė) arba `too_many_attempts` (paskyros stabdymas), su `retryAfter` ir antrašte `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Užklausų dažnio riba
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Per daug nesėkmių šioje paskyroje
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: netikėta klaida. Serveris ją įrašo į žurnalą.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: neteisingas `state` ar `iss` arba Google atmetė kodą ar atsiuntė ID žetoną, kurio nepavyksta patikrinti (įskaitant kito kliento – žaidimo ar svetainės – kodą ar ID žetoną). Jame niekada nebūna Google teksto.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` arba `timeout`: bandykite dar kartą po `retryAfter`, kai ši reikšmė pateikta.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: Serveris užimtas
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: Duomenų bazė liko užrakinta (skaitymas)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: Serveris per ilgai užtruko
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: Animuotas GIF kaip priedas.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` šio serverio partijai, `attachment; filename="scacelith-game.gif"` su `POST /gif` atsiųstam PGN.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: Failo dydis baitais.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: HTML puslapis.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: HTML puslapis, paaiškinantis atmetimo priežastį.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: Forma negauta per 10 sekundžių (HTML puslapis). Serveris uždaro ryšį.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: HTML puslapis, paaiškinantis konfliktą.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Forma viršija `HTTP_BODY_LIMIT` (HTML puslapis). Serveris uždaro ryšį.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: Turinys nėra nei forma (`application/x-www-form-urlencoded`), nei JSON, arba jo koduotė nėra UTF-8 (HTML puslapis).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Užklausų dažnio riba (HTML puslapis), su `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Netikėta klaida (HTML puslapis pavadinimu „Server error“ – serverio klaida). Serveris ją įrašo į žurnalą.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: Serveris užimtas (duomenų bazė liko užrakinta arba serveris labai atsilieka; su `Retry-After`) arba per ilgai užtruko (HTML puslapis pavadinimu „Server error“ – serverio klaida).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: Vienintelė visų JSON API klaidos atsakymų struktūra.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Klaidos kodas `snake_case` formatu. Pagal jį klientas pasirenka, ką rodyti.
          examples:
            - rate_limited
        message:
          type: string
          description: Sakinys anglų kalba, skirtas žurnalams ir kaip atsarginis variantas.
        retryAfter:
          type: integer
          minimum: 1
          description: Kiek sekundžių palaukti prieš bandant dar kartą; būna tik tuose atmetimuose, kurie laikui bėgant baigiasi. Tada atsakyme taip pat yra antraštė `Retry-After` su ta pačia reikšme, išskyrus 503 `busy` skaitant istoriją, partijas, žaidėjus ir lyderių lentelę.
        field:
          type: string
          description: Laukas arba užklausos eilutės parametras, kuriame klaida (`invalid_request`, `invalid_option`, taip pat `GET /account/games` klaidos `invalid_cursor`, `invalid_limit` ir `invalid_filter`). Įdėtinis laukas nurodomas su tašku (`pow.nonce`).
        reason:
          type: string
          description: 'Priežastis: taisyklė, kurią pažeidžia `weak_password`, arba kodėl darbo įrodymo buvo paprašyta ar jis atmestas (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Tik `banned`: sustabdymo pabaiga (Unix laikas, ms), `null`, jei sustabdyta visam laikui.'
        line:
          type: integer
          minimum: 1
          description: 'Tik `invalid_pgn`: klaidos eilutė, skaičiuojant nuo 1.'
        column:
          type: integer
          minimum: 1
          description: 'Tik `invalid_pgn`: klaidos stulpelis, skaičiuojant nuo 1, simboliais.'
    PowChallenge:
      type: object
      description: Darbo įrodymo iššūkis (atsakymo 428 `pow_required` laukas `pow`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: Pasirašytas iššūkis, kurį reikia grąžinti nepakeistą.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: Kiek pradinių nulinių bitų turi turėti `SHA-256(challenge + ":" + nonce)`.
        expiresAt:
          type: integer
          format: int64
          description: Kada iššūkis nustoja galioti (Unix laikas, ms) – praėjus 2 minutėms po jo išdavimo.
    PowAnswer:
      type: object
      description: Atsakymas į darbo įrodymo iššūkį.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: Atsakymo 428 `challenge`, toks, koks buvo pateiktas.
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Dešimtainė eilutė iš ne daugiau kaip 20 skaitmenų, su kuria `SHA-256(challenge + ":" + nonce)` prasideda `bits` nuliniais bitais.
    ServerInfo:
      type: object
      description: Ko klientui reikia prieš prisijungiant ar užmezgant ryšį.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: Serverio pavadinimas (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: UUID, kurį duomenų bazė gauna, kai paleidžiama pirmą kartą. Paleidus iš naujo jis nesikeičia. Jis yra `null`, kai duomenų bazė negali jo pateikti.
        motd:
          type: string
          description: Dienos pranešimas (`SERVER_MOTD`), gali būti tuščias.
        protocol:
          type: object
          description: WebSocket protokolas (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: Seniausia serverio palaikoma protokolo versija.
            max:
              type: integer
              minimum: 1
              description: Naujausia serverio palaikoma protokolo versija.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: 'Protokolo schemos kontrolinis kodas (pirmieji 4 jos kanoninės formos SHA-256 baitai kaip sveikasis skaičius be ženklo: `0xc649140f`, 3326678031, protokolo šalutinei versijai 2); tik informacinis, niekada nelyginamas.'
            subprotocol:
              type: string
              description: WebSocket subprotokolo identifikatorius (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: WebSocket prievadas, kurį naudoja žaidėjai (`PUBLIC_WS_PORT`, jei jo nėra – `WS_PORT`, jei ir jo nėra – `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: WebSocket kelias.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Ar galima kurti naujas paskyras.
        emailVerification:
          type: boolean
          description: Ar naujos paskyros turi patvirtinti savo adresą (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
            - googleWeb
          properties:
            google:
              type: boolean
              description: Ar žaidimui siūlomas prisijungimas su Google.
            googleWeb:
              type: boolean
              description: Ar prisijungimas su Google siūlomas ir svetainei (`POST /auth/sso/google/web/start`).
        mfa:
          type: boolean
          const: true
          description: Dviejų veiksnių autentifikavimas visada prieinamas.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Kiek darbo įrodymo bitų reikia registracijai (0 – nereikia).
        categories:
          type: array
          description: Oficialios (reitinginės) laiko kontrolės (`RATED_CATEGORIES`) serverio tvarka. Bet kuri kita laiko kontrolė yra `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Taisyklės, kurias klientas gali patikrinti prieš siųsdamas formą.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: Trumpiausio naudotojo vardo ilgis (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: Ilgiausio naudotojo vardo ilgis (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: Reguliarusis reiškinys, kurį turi atitikti naujas naudotojo vardas.
            passwordMinLength:
              type: integer
              description: Trumpiausio slaptažodžio ilgis simboliais (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: Ilgiausio slaptažodžio ilgis UTF-8 baitais.
            customTimeControls:
              type: boolean
              description: Ar iššūkiuose ir privačiose partijose galima naudoti pasirinktines laiko kontroles.
            reportsPerDay:
              type: integer
              description: Kiek pranešimų žaidėjas gali pateikti per 24 valandas (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: Didžiausias WebSocket pranešimas, kurį gali siųsti klientas, baitais.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 3326678031
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
          googleWeb: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Oficiali laiko kontrolė.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 'Kategorijos ID: minutės ir pridėtinio laiko sekundės (`3+2`).'
        baseSec:
          type: number
          minimum: 0
          description: Pagrindinis laikas sekundėmis.
        incSec:
          type: number
          minimum: 0
          description: Pridėtinis laikas už ėjimą sekundėmis.
    AccountView:
      type: object
      description: Paskyra taip, kaip ją mato jos žaidėjas (prisijungimo atsakymų ir `GET /account/me` laukas `user`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: Paskyros ID.
        username:
          type: string
          description: Naudotojo vardas.
        email:
          type: string
          format: email
          description: El. pašto adresas.
        emailVerified:
          type: boolean
          description: Ar adresas patvirtintas.
        mfaEnabled:
          type: boolean
          description: Ar įjungtas dviejų veiksnių autentifikavimas.
        googleLinked:
          type: boolean
          description: Ar susieta Google paskyra.
        hasPassword:
          type: boolean
          description: '`false` paskyrai, sukurtai per Google, kuri dar nenustatė slaptažodžio.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Ar priimami tiesioginiai iššūkiai pagal vardą (žr. `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Kada paskyra sukurta (Unix laikas, ms).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Paskutinis prisijungimas (Unix laikas, ms) arba `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: Naujas adresas, kai el. pašto adreso keitimas laukia patvirtinimo nuoroda, arba `null`.
    SessionAnswer:
      type: object
      description: Naujas seansas.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: Seanso žetonas antraštei `Authorization` ir WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: Galutinė seanso pabaiga (Unix laikas, ms); neveiklumo riba gali jį baigti anksčiau.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: Antrasis prisijungimo su dviejų veiksnių autentifikavimu žingsnis; tęskite su `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: Žingsnio žetonas, skirtas `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Kiek sekundžių liko žingsniui užbaigti.
    LoginAnswer:
      description: Seansas arba antrasis prisijungimo su dviejų veiksnių autentifikavimu žingsnis.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Pirmasis prisijungimas su Google; tęskite su `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Bilietas, skirtas `POST /auth/sso/complete`, galioja 10 minučių.
        suggestedUsername:
          type: string
          description: Naudotojo vardas, sudarytas iš Google vardo ar adreso, arba `""`, kai niekas netinka.
    SsoNeedsPassword:
      type: object
      description: Adresą naudoja paskyra su slaptažodžiu; tęskite su `POST /auth/sso/google/link`. Kol kas niekas nesusieta.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Bilietas, skirtas `POST /auth/sso/google/link`.
        username:
          type: string
          description: Tos paskyros naudotojo vardas (jį mato tik tas, kas Google įrodė, kad valdo šį adresą).
        expiresIn:
          type: integer
          const: 600
          description: Kiek sekundžių bilietas galioja.
    SsoFinishAnswer:
      description: '`POST /auth/sso/google/finish` atsakymas.'
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Prisijungimo su Google bandymas.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: Bandymas, skirtas `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: Google URL, kurį reikia atidaryti sistemos naršyklėje, kai jis patikrintas.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state`, kurį Google turi grąžinti.'
        expiresIn:
          type: integer
          const: 600
          description: Kiek sekundžių bandymas galioja.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Naudotojo vardas; po to taikomos serverio taisyklės (žr. aprašą).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: El. pašto adresas. Pašalinami tarpai pradžioje ir pabaigoje, saugomas mažosiomis raidėmis.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Slaptažodis; po to taikomos slaptažodžio taisyklės.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Naudotojo vardas arba el. pašto adresas (bet koks tekstas su `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Neprivalomas. Rodomas prisijungusių įrenginių sąraše (pvz., `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: Prisijungimo atsakymo (arba prisijungimo su Google atsakymo) `mfaToken`.
        code:
          type: string
          maxLength: 32
          description: Neprivalomas. 6 skaitmenų autentifikavimo programėlės kodas arba atkūrimo kodas.
        recoveryCode:
          type: string
          maxLength: 32
          description: Neprivalomas. Atkūrimo kodas. Reikia vieno iš `code` ir `recoveryCode`.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: El. pašto adresas.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: Nustatymo iš naujo nuorodos parametras `token`.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Naujas slaptažodis; taikomos registracijos slaptažodžio taisyklės.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Kliento `codeVerifier` S256 PKCE iššūkis (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Kliento klausytuvo prievadas adresu `127.0.0.1`.
    SsoWebStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Puslapio `codeVerifier` S256 PKCE iššūkis (`BASE64URL(SHA-256(codeVerifier))`).
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: '`attemptId` iš `POST /auth/sso/google/start`.'
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: PKCE tikrintuvas; jo SHA-256 turi atitikti iššūkį, pateiktą per `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: '`state`, toks, kokį grąžino Google.'
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: '`code`, toks, kokį grąžino Google (spausdinami ASCII simboliai be tarpų).'
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Neprivalomas. `iss`, toks, kokį grąžino Google, jei grąžino.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`linkTicket` iš `finish`, galioja 10 minučių.'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Paskyros slaptažodis.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: '`ssoTicket` iš `finish`, galioja 10 minučių.'
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Naudotojo vardas; taikomos registracijos taisyklės.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Aktyvūs seansai, pradedant paskiausiai naudotu.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Aktyvus seansas (prisijungęs įrenginys).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: Seanso ID, skirtas `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: Prisijungimas (Unix laikas, ms).
        lastSeenAt:
          type: integer
          format: int64
          description: Paskutinis naudojimas (Unix laikas, ms), atnaujinamas ne dažniau kaip kas 5 minutes (vėliau, kol serveris labai atsilieka).
        expiresAt:
          type: integer
          format: int64
          description: Galutinė pabaiga (Unix laikas, ms); neveiklumo riba gali baigti seansą anksčiau.
        clientLabel:
          type:
            - string
            - 'null'
          description: Prisijungimo metu pateiktas `clientLabel` arba `null`, jei jis nebuvo pateiktas.
        current:
          type: boolean
          description: Ar tai seansas, kuris siunčia užklausą.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Po vieną įrašą kiekvienai kategorijai, kurioje žaidėjas žaidė reitingines partijas.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Aktyvios sankcijos.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }`, kol paskyra sustabdyta, kitaip `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: Vienos kategorijos reitingo įrašas.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: Kategorijos ID.
        rating:
          type: integer
          description: Reitingas.
        games:
          type: integer
          minimum: 0
          description: Kategorijoje sužaistų partijų skaičius (įskaitytų ir neįskaitytų).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: Aukščiausias pasiektas reitingas.
        provisional:
          type: boolean
          description: '`true`, kol reitingas dar nenustatytas arba turi mažiau nei `PROVISIONAL_GAMES` įskaitytų partijų (žaidimas jį rodo kaip `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: Sankcijos rūšis.
        reason:
          type:
            - string
            - 'null'
          description: Nurodyta priežastis, jei yra.
        startsAt:
          type: integer
          format: int64
          description: Pradžia (Unix laikas, ms).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Pabaiga (Unix laikas, ms), `null`, kai sankcija neterminuota.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: Sustabdymo pabaiga (Unix laikas, ms), `null`, kai sustabdyta visam laikui.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` – priimti tiesioginius iššūkius pagal vardą, `none` – juos atmesti.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Dabartinis slaptažodis.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Naujas slaptažodis; taikomos registracijos slaptažodžio taisyklės.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Paskyros slaptažodis.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Laukiančio slaptojo rakto kodas, lygiai 6 skaitmenys.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Paskyros slaptažodis.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Neprivalomas; reikalingas, kai įjungtas dviejų veiksnių autentifikavimas (arba `recoveryCode`). Autentifikavimo programėlės kodas arba atkūrimo kodas.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Neprivalomas. Atkūrimo kodas (`xxxx-xxxx-xx`; raidžių dydis, tarpai ir brūkšneliai nesvarbūs).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Paskyros slaptažodis.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Autentifikavimo programėlės kodas (atkūrimo kodas atmetamas).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Naujas adresas; pašalinami tarpai pradžioje ir pabaigoje, raidės paverčiamos mažosiomis, tada tikrinamas kaip registracijos adresas.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Paskyros slaptažodis.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Neprivalomas; reikalingas, kai įjungtas dviejų veiksnių autentifikavimas (arba `recoveryCode`). Autentifikavimo programėlės kodas arba atkūrimo kodas.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Neprivalomas. Atkūrimo kodas.
    TotpSetup:
      type: object
      description: Laukiantis slaptasis raktas autentifikavimo programėlei.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Slaptasis raktas base32 formatu, kurį reikia įvesti į programėlę.
        uri:
          type: string
          format: uri
          description: URI `otpauth://totp/...`, kurį reikia parodyti kaip QR kodą.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Žingsnio trukmė sekundėmis.
    RecoveryCodeList:
      type: array
      description: 10 atkūrimo kodų, parodomų tik šį kartą. Kiekvienas veikia vieną kartą.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Viena partijos pusė.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: Vardas partijos įraše (`deleted#<id>` ištrintai paskyrai).
        rating:
          type:
            - integer
            - 'null'
          description: Reitingas pradžioje, `null`, kai nežinomas.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: Reitingas po partijos. Reitinginėje partijoje jis yra visada; `null` tik partijai, kuri neturi įtakos reitingams (draugiškai, pasirinktinės laiko kontrolės, nutrauktai).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: Reitingo pokytis; `0`, kai pagal reitingo taisykles reitingas nepasikeičia (FIDE nulinio rezultato taisyklė, varžovas be reitingo, pirmosios žaidėjo be reitingo partijos); `null` tais pačiais atvejais kaip `ratingAfter`.
    GameSummary:
      type: object
      description: Išsaugotos partijos santrauka.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Partijos ID.
        category:
          type: string
          description: Oficialios kategorijos ID (`3+2`) arba `custom`.
        rated:
          type: boolean
          description: Ar partija turi įtakos reitingams.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: Laiko kontrolė sekundėmis (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (žr. partijų kodus).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: Pabaigos priežasties kodas (žr. partijų kodus).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: Rezultatas; nutrauktai partijai – `*`.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: Pusėjimių skaičius.
        startedAt:
          type: integer
          format: int64
          description: Pradžia (Unix laikas, ms).
        endedAt:
          type: integer
          format: int64
          description: Pabaiga (Unix laikas, ms).
    Termination:
      type: string
      description: Pabaigos priežasties pavadinimas (žr. partijų kodus); `Unknown` – protokolui nežinomam kodui.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: Partijos santrauka vieno žaidėjo požiūriu.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: Žaidėjo spalva.
    HistoryGameSummary:
      description: Partija iš prisijungusio žaidėjo istorijos.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Pagrindinis laikas milisekundėmis.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Pridėtinis laikas milisekundėmis.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: Baigtis žaidėjo požiūriu.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Puslapio partijos, pradedant naujausia.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: ID, kurį reikia perduoti kaip `before` kitam puslapiui gauti, arba `null` paskutiniame puslapyje.
        total:
          type: integer
          minimum: 0
          description: Filtrą atitinkančių partijų skaičius visuose puslapiuose.
    MoveRecord:
      type: object
      description: Vienas partijos pusėjimis.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: Ėjimas UCI notacija; pėstininko virsmo atveju pridedama `n`, `b`, `r` arba `q`.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Už ėjimą įskaitytas laikas (ms), `null`, kai įraše jo nėra.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Ėjimą padariusio žaidėjo laikrodis po ėjimo (ms), `null`, kai įraše jo nėra.
    PgnTagsView:
      type: object
      description: Pagrindinės PGN žymės, skirtos rodyti. `Termination` čia yra pabaigos priežasties pavadinimas; PGN faile naudojamos standartinės PGN reikšmės.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` arba `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: '`SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: Pradžios data pagal UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: Reitingas pradžioje arba `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: Reitingas pradžioje arba `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: Partijos įrašas su ėjimais ir laikrodžiais. Jame yra partijos santraukos laukai, išskyrus `color` ir `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: Pagrindinis laikas milisekundėmis.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: Pridėtinis laikas milisekundėmis.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: '`status` pavadinimas.'
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: Partijos, kurios revanšas yra ši partija, ID arba `null`.
            moves:
              type: array
              description: Po vieną įrašą kiekvienam pusėjimiui.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: Tik kai žetono savininkas žaidė šią partiją; jo spalva.
            reportable:
              type: boolean
              description: Tik kai žetono savininkas žaidė šią partiją; `true`, kai `POST /reports` dabar priimtų pranešimą apie varžovą dėl šios partijos (partija baigėsi per pastarąsias 7 dienas, dienos kvota neišnaudota, o apie varžovą dėl šios partijos dar nepranešta).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: Naudotojo vardas, kaip jį užrašė žaidėjas.
        createdAt:
          type: integer
          format: int64
          description: Kada paskyra sukurta (Unix laikas, ms).
        ratings:
          type: array
          description: Tik oficialios kategorijos, serverio tvarka.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Visos išsaugotos partijos, įskaitant draugiškas ir nutrauktas.
            rated:
              type: integer
              minimum: 0
              description: Reitinginės partijos, susumuotos pagal reitingo įrašus.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: Naudotojo vardas, kaip jį užrašė žaidėjas.
        games:
          type: array
          description: Puslapio partijos, pradedant naujausia.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: Paskutinės partijos ID, kai puslapis pilnas (tada kitas puslapis gali būti tuščias), kitaip `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: Kategorijos ID.
        minGames:
          type: integer
          minimum: 0
          description: Kiek įskaitytų partijų reikia, kad įrašas būtų įtrauktas į sąrašą (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Kada lentelė apskaičiuota (Unix laikas, ms).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: PGN tekstas, ne daugiau kaip 65 536 UTF-8 baitai. Naudojama tik pirmoji partija.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Neprivalomas. Paveikslėlio dydis.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Neprivalomas. Kurios spalvos figūros rodomos lentos apačioje.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Neprivalomas. Milisekundės vienam ėjimui, JSON skaičius su sveikąja reikšme.
        coords:
          type: boolean
          default: true
          description: Neprivalomas. Ar aplink lentą piešiamos vertikalių raidės ir horizontalių skaičiai.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: Partija, nurodyta sveikuoju skaičiumi arba 1–16 skaitmenų eilute.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: Varžovo naudotojo vardas, kaip partijos įraše arba koks jis dabar, neskiriant didžiųjų ir mažųjų raidžių. Jis negali būti tuščias.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: Apie ką pranešama.
        comment:
          type:
            - string
            - 'null'
          description: Neprivalomas. Ne daugiau kaip 500 simbolių, pašalinus valdymo simbolius (išskyrus tabuliaciją ir eilutės lūžį) bei tarpus teksto pradžioje ir pabaigoje.
    AccountExport:
      type: object
      description: Viskas, ką serveris saugo apie paskyrą (laikai – Unix laikas, ms).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Kada atliktas eksportas.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: '`SERVER_NAME`.'
            host:
              type: string
              description: '`SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Kas yra faile ir kas į jį neįtraukta, paprasta anglų kalba žaidėjui.
          items:
            type: string
        account:
          description: '`GET /account/me` paskyros rodinys su `googleEmail`.'
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: Susietos Google paskyros adresas arba `null`.
        ratings:
          type: array
          description: Pilni reitingo įrašai.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Reitingo taškai, grąžinti nustačius, kad varžovas sukčiavo, susumuoti pagal UTC dieną ir kategoriją, pradedant naujausiais. Nei partijos, nei sukčiai neįvardijami.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Visi išsaugoti seansai, pradedant naujausiu, be jokių žetonų. Saugojimo termino valymas ištrina nebegaliojantį seansą, o atjungtą – praėjus dienai po atsijungimo.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Saugos įvykiai, pradedant naujausiu, saugomi `RETENTION_SECURITY_DAYS` dienų.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Visos sankcijos, įskaitant panaikintas. Moderatoriaus vardas niekada neįtraukiamas.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Elgesio įvykiai, užregistruoti dėl žaidėjo paliktų ir nutrauktų partijų bei partijų, kuriose jis laiku nepadarė pirmojo ėjimo, saugomi 30 dienų.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Žaidėjo pateikti pranešimai.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: Partijų skaičius.
            list:
              type: array
              description: Visos partijos, pradedant naujausia, kaip `GET /account/games` santraukos. Ėjimai pateikiami per `GET /games/{id}`, o PGN – per `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Pilnas reitingo įrašas.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Ar žaidėjas jau baigė etapą be reitingo.
            countedGames:
              type: integer
              minimum: 0
              description: Į reitingą įskaitytų partijų skaičius.
            updatedAt:
              type: integer
              format: int64
              description: Kada įrašas paskutinį kartą pasikeitė.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: Dienos 00:00 UTC (Unix laikas, ms).
        category:
          type: string
        points:
          type: integer
          description: Tą dieną toje kategorijoje grąžinti taškai.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Kada seansas atjungtas, arba `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: Prisijungimo adresas, ištrinamas po `RETENTION_IP_DAYS` dienų.
    SecurityEvent:
      type: object
      description: |-
        Saugos įvykis. `ip` pateikiamas tik veiksmams, atliktiems prisijungus, naudojant paskyros slaptažodį (ir antrąjį veiksnį) arba jos adresu išsiųstą nuorodą: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` ir `account_exported`; visų kitų rūšių įvykiai turi `ip: null`, o `ip` ištrinamas po `RETENTION_IP_DAYS` dienų.

        `detail` išsaugo tik šiuos laukus: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` ir `method` (`password` arba `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` ir `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Įvykis `moderator_action` išsaugo tik `{ action }` veiksmams `ban`, `unban`, `reset_mfa`, `verify_email` ir `revoke_sessions` (kiti moderatorių veiksmai neįtraukiami). Visų kitų rūšių įvykiai turi `detail: null`. Įvykiai `rating_refund` neįtraukiami: jų taškai yra lauke `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: Įvykio rūšis (`login`, `password_changed`...).
        at:
          type: integer
          format: int64
          description: Kada įvyko.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
