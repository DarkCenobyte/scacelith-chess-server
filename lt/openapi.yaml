paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Gauti serverio pavadinimą, versijas, prievadus ir registracijos taisykles
      description: |-
        Ko klientui reikia prieš prisijungiant ar užmezgant ryšį: serverio pavadinimas ir ID, WebSocket protokolo versijos ir kur yra WebSocket, registracijos taisyklės, oficialios laiko kontrolės ir ribos, kurias klientas gali patikrinti prieš siųsdamas formą.

        **Ribos:** tik adresų lygmuo.
      security: []
      responses:
        '200':
          description: Serverio aprašas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: adresų lygmuo.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Sukurti paskyrą
      description: |-
        Sukuria paskyrą: kai jos el. pašto adresas patvirtinamas juo išsiųsta nuoroda, arba iš karto, jei el. pašto patvirtinimas nenaudojamas.

        **Su el. pašto patvirtinimu** (`REQUIRE_EMAIL_VERIFICATION`, numatytasis variantas): 202 `verification_sent`. Paskyra dar nesukurta: registracija laukia 24 valandas ir tuo metu rezervuoja savo naudotojo vardą. Šiuo adresu siunčiama 24 valandas galiojanti nuoroda, ne dažniau kaip viena vienam adresui kas 5 minutes (`POST /auth/verify-email/resend` išsiunčia naują); paskyra sukuriama, o jos adresas patvirtinamas, kai nuoroda panaudojama (puslapio `/verify-email` mygtuku), ir tada žaidėjas gali prisijungti. Iki tol į prisijungimą tuo naudotojo vardu atsakoma `invalid_credentials`, kaip ir nežinomos paskyros atveju, o viešojo profilio nėra. Nauja registracija tuo pačiu adresu pakeičia laukiančiąją. Atsakymas toks pat ir tada, kai adresą jau naudoja kita paskyra: tada nuoroda nesiunčiama, o tos paskyros savininkas vietoj jos gauna pranešimą (ne dažniau kaip kartą per valandą), ir naudotojo vardas rezervuojamas taip pat, kad niekas neišduotų, ar adresu užregistruota paskyra. Registracija, kurios nuoroda nepanaudota, po 24 valandų panaikinama, ir jos naudotojo vardas vėl tampa laisvas.

        **Be el. pašto patvirtinimo** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`, paskyra sukuriama iš karto ir gali prisijungti.

        **Taisyklės.** `username`: nuo `USERNAME_MIN` iki `USERNAME_MAX` simbolių (nuo 3 iki 20), raidės, skaitmenys, `_` ir `-`, pirmasis simbolis – raidė arba skaitmuo (`GET /info` juos pateikia kaip `limits`); rezervuoti vardai (`admin`, `moderator`, `deleted`...) ir kai kurie priešdėliai atmetami; unikalus neatsižvelgiant į raidžių dydį. `email`: pradžioje ir pabaigoje pašalinami tarpai, saugomas mažosiomis raidėmis, tik ASCII simboliai, domene turi būti taškas. `password`: bent `PASSWORD_MIN_LENGTH` (10) simbolių ir ne daugiau kaip 256 UTF-8 baitai; jame negali būti naudotojo vardo ar el. pašto adreso vietinės dalies, ir jis negali būti dažnai naudojamas slaptažodis.

        **Klaidos**, tikrinamos tokia tvarka: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; slaptažodžių maišos eilės klaidos; 409 `email_taken` (tik be el. pašto patvirtinimo).

        **Ribos:** `auth`, tada `auth_register` (10 registracijų per valandą vienam klientui). **Darbo įrodymas:** visada, kai `POW_REGISTER_BITS` didesnis už 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Pirmasis bandymas, be darbo įrodymo
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Išsiųsta dar kartą su darbo įrodymu
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: Paskyra sukurta ir gali prisijungti (šiame serveryje el. pašto patvirtinimo nėra).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: Registracija laukia patvirtinimo nuorodos (arba šiuo adresu jau užregistruota paskyra; atsakymas to neatskleidžia).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (su `field`), `invalid_json`, `invalid_username`, `invalid_email` arba `weak_password` su `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` arba `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: šiame serveryje registracija uždaryta (`GET /info` nurodo `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: šis naudotojo vardas priklauso paskyrai arba jį rezervavo kito adreso laukianti registracija. `email_taken`: adresą naudoja kita paskyra (tik be el. pašto patvirtinimo).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: riba `auth` arba `auth_register` arba slaptažodžių maišos eilė.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (slaptažodžių maišos eilė arba duomenų bazė liko užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Prisijungti slaptažodžiu
      description: |-
        Prisijungiama naudotojo vardu arba el. pašto adresu ir slaptažodžiu. Galimi du atsakymai, abu su būsena 200: seansas arba, kai įjungtas dviejų veiksnių autentifikavimas, antrasis žingsnis, kurį reikia užbaigti per 5 minutes su `POST /auth/login/mfa`.

        Nežinoma paskyra, neteisingas slaptažodis ir paskyra be slaptažodžio gauna tą patį atsakymą po tiek pat laiko: 401 `invalid_credentials`. Paskyros patikros (`banned`, `email_unverified`) atliekamos tik po teisingo slaptažodžio. Nuo `AUTH_FAILURES_PER_ACCOUNT` (5) nesėkmių vienu prisijungimo vardu kiekvienas bandymas turi palaukti (429 `too_many_attempts`).

        **Riba:** `auth`. **Darbo įrodymas:** tik nesėkmingų prisijungimų bangos metu (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Seansas arba prisijungimo su dviejų veiksnių autentifikavimu antrasis žingsnis.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Prisijungta
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: Dviejų veiksnių autentifikavimas įjungtas
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: nežinoma paskyra, neteisingas slaptažodis arba paskyra be slaptažodžio.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Tik po teisingo slaptažodžio: `banned` su `until` (Unix laikas, ms; nuolatinio sustabdymo atveju – `null`) arba `email_unverified` (senesnė paskyra, kurios adresas dar nepatvirtintas).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (šio prisijungimo vardo delsa po nesėkmių) arba `rate_limited` (riba `auth`, slaptažodžių maišos eilė).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (slaptažodžių maišos eilė arba duomenų bazė liko užrakinta), `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Užbaigti prisijungimą antruoju veiksniu
      description: |-
        Prisijungimo su dviejų veiksnių autentifikavimu antrasis žingsnis po to, kai `POST /auth/login` arba prisijungimas su Google (`POST /auth/sso/google/finish` ar `POST /auth/sso/google/link`) atsakė `mfaRequired`. Siųskite `code` (6 skaitmenų autentifikavimo programėlės kodą arba atkūrimo kodą) arba `recoveryCode`. Čia panaudotas atkūrimo kodas išnyksta.

        Vienas žingsnis priima ne daugiau kaip 5 neteisingus kodus; žingsnis taip pat baigiasi, kai slaptažodis nustatomas iš naujo arba pakeičiamas. Po Google susiejimo slaptažodžio žingsnio susiejimas išsaugomas tik tada, kai kodas priimamas čia.

        **Ribos:** `auth` ir ne daugiau kaip `AUTH_MFA_PER_ACCOUNT` (10) kodų per 15 minučių paskyrai iš bet kurio adreso; viršijus kodas netikrinamas, todėl atkūrimo kodas nesunaudojamas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Autentifikavimo programėlės kodas
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Atkūrimo kodas
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Prisijungta.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: neišsiųstas nei `code`, nei `recoveryCode` arba turinys pažeidžia schemą; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: žingsnio galiojimas baigėsi, jis jau panaudotas arba baigėsi po 5 neteisingų kodų, arba nuo pirmojo žingsnio slaptažodis buvo nustatytas iš naujo ar pakeistas (prisijunkite iš naujo). `invalid_code`: neteisingas arba jau panaudotas kodas.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (su `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: tik po Google susiejimo slaptažodžio žingsnio – Google paskyra tuo metu buvo susieta su kita paskyra.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: tik po Google susiejimo slaptažodžio žingsnio – paskyra tuo metu pasikeitė; pradėkite prisijungimą iš naujo.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: paskyros delsa po nesėkmių arba išnaudoti jos `AUTH_MFA_PER_ACCOUNT` paskutinių 15 minučių kodai. `rate_limited`: riba `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` su `retryAfter: 1`: duomenų bazė liko užrakinta (po Google susiejimo žingsnio niekas nebuvo susieta: pradėkite prisijungimą iš naujo). `timeout`. Taip pat `server_busy` su `retryAfter` nuo 2 iki 5, kai serveris labai atsilieka (žr. įvadą): užklausa nebuvo vykdyta.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Atjungti šį seansą
      description: |-
        Atšaukia naudoto žetono seansą. Su juo atidarytas WebSocket ryšys uždaromas. Be turinio (arba `{}`).

        **Riba:** `sessions`.
      security:
        - bearerAuth: []
      responses:
