    description: |-
      Serverio gyvybingumas ir parengtis, skirti stebėsenai. Šie galiniai punktai atsako API prievade prieš autentifikavimą ir visas galinių punktų ribas, bet, kaip ir bet kuri užklausa, paima adresų lygmens žetoną; stebėsenos kompiuterį galima įrašyti į `ABUSE_EXEMPT`. Kiekvienam galiniam punktui veikia abu keliai: serverio šaknyje ir po `/api/v1`.

