      summary: تعيين كلمة مرور جديدة من نموذج إعادة التعيين
      description: |-
        نموذج صفحة إعادة التعيين؛ يفعل ما يفعله `POST /auth/password/reset`، في معاملة واحدة: يُسجَّل خروج كل الأجهزة، ويُلغى أي تغيير معلّق للبريد الإلكتروني، وتتوقف روابط إعادة التعيين الأخرى عن العمل، ويُعدّ العنوان مؤكَّدًا، ويتلقى صاحب الحساب رسالة.

        يُفحص الرابط أولًا، ثم تطابق كلمتي المرور، ثم قواعد كلمة المرور. وعندما يكون الخادم مشغولًا، يعود النموذج مع `Retry-After` ويبقى الرابط صالحًا.

        **الحدود:** `auth`، ثم `auth_reset` (مشترك مع `POST /auth/password/reset`).
      security: []
