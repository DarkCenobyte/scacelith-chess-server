                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: الحدّ `sessions` أو رصيد الحساب.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (بقيت قاعدة البيانات مقفلة)، `timeout`.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: تسجيل خروج جهاز واحد
      description: |-
        يسجّل الخروج من جلسة واحدة من جلسات الحساب؛ ويمكن تسجيل الخروج من الجلسة الحالية أيضًا. ويُغلق WebSocket الذي فُتح بها. بلا جسم (أو `{}`).

        **الحدّ:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: سُجّل الخروج من الجلسة.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: جسم غير `{}`، أو `id` ليس ترميز URL صالحًا؛ `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
