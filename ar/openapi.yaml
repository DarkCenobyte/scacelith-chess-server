        - two-step-verification
      summary: تعطيل المصادقة الثنائية
      description: |-
        يعطّل المصادقة الثنائية. ويُحذف السر ورموز الاسترداد، ويتلقى صاحب الحساب رسالة.

        **إعادة المصادقة:** كلمة المرور ورمز من تطبيق المصادقة أو رمز استرداد (يلزم أحد `code` أو `recoveryCode`). **الحدود:** `reauth`، ثم `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
