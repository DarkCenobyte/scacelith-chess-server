  - name: games
    x-displayName: المباريات وملفات PGN
    description: |-
      سجلات المباريات بنقلاتها وساعاتها، وملفات PGN الخاصة بها.

      **رموز المباريات.** `status`: 1 `WhiteWins`، 2 `BlackWins`، 3 `Draw`، 4 `Aborted` (لا تُخزَّن إلا المباريات المنتهية). `result`: `1-0` أو `0-1` أو `1/2-1/2` أو `*` (ملغاة). `reason`، مع اسمه (`termination`) والكلمات التي يُختم بها نص النقلات في ملف PGN؛ والرموز 7 و14 و21 تعادلات (اللاعب الذي نفد وقته أو استسلم أو ترك المباراة كان يواجه خصمًا لا يستطيع الإماتة: FIDE 6.9 و5.1.2؛ ويعطي `DESIGN.md` 6.3 القاعدة)، ولا ينهي الخادم أي مباراة بالرمزين 4 و13 (فهما من القائمة المشتركة للأسباب):

      | الرمز | `termination` | الكلمات في ملف PGN |
      |---|---|---|
      | 1 | `Checkmate` | Checkmate (كش مات) |
      | 2 | `Resignation` | Resignation (استسلام) |
      | 3 | `Timeout` | Loss on time (خسارة بالوقت) |
      | 4 | `IllegalMoves` | Second illegal move (forfeit) (خسارة بنقلة غير قانونية ثانية) |
      | 5 | `Stalemate` | Stalemate (جمود) |
      | 6 | `InsufficientMaterial` | Dead position (insufficient material) (وضع ميت لعدم كفاية المادة) |
      | 7 | `TimeoutVsInsufficient` | Flag fall, but the opponent cannot checkmate (انتهى الوقت، لكن الخصم لا يستطيع الإماتة) |
      | 8 | `FivefoldRepetition` | Fivefold repetition (التكرار الخماسي) |
      | 9 | `SeventyFiveMoves` | 75-move rule (قاعدة الـ 75 نقلة) |
      | 10 | `ThreefoldClaim` | Threefold repetition (claimed) (التكرار الثلاثي بمطالبة) |
      | 11 | `FiftyMoveClaim` | 50-move rule (claimed) (قاعدة الـ 50 نقلة بمطالبة) |
      | 12 | `Agreement` | Draw by agreement (تعادل بالاتفاق) |
      | 13 | `IllegalMovesVsInsufficient` | Second illegal move, but the opponent cannot checkmate (نقلة غير قانونية ثانية، لكن الخصم لا يستطيع الإماتة) |
      | 14 | `ResignationVsInsufficient` | Resignation, but the opponent cannot checkmate (استسلام، لكن الخصم لا يستطيع الإماتة) |
      | 20 | `Abandonment` | Abandoned (disconnected for too long) (مغادرة المباراة بانقطاع الاتصال مدة طويلة جدًا) |
      | 21 | `AbandonmentVsInsufficient` | Abandoned, but the opponent cannot checkmate (مغادرة المباراة، لكن الخصم لا يستطيع الإماتة) |
      | 22 | `Aborted` | Game aborted (أُلغيت المباراة) |
      | 23 | `NoShow` | Aborted: first move not played in time (أُلغيت: لم تُلعب النقلة الأولى في الوقت) |
      | 24 | `Forfeit` | Forfeit (fair play violation) (خسارة بقرار لانتهاك قواعد اللعب النظيف) |
      | 25 | `ServerAborted` | Aborted by the server (ألغاها الخادم) |
      | 26 | `BothDisconnected` | Aborted: both players disconnected (أُلغيت: انقطع اتصال اللاعبَين كليهما) |

      الرمز 14 جديد في الإصدار الفرعي 1 من البروتوكول: وعلى العميل المكتوب قبله أن يعرض الرمز غير المعروف كنهاية عادية للمباراة مع `result` الخاص بها.
  - name: gifs
    x-displayName: صور GIF المتحركة
    description: |-
      المباراة على شكل صورة GIF متحركة، للاحتفاظ بها أو لمشاركتها: الرقعة من الأعلى، وإطار لكل وضعية من البداية حتى الوضعية الأخيرة، واسما اللاعبَين وتصنيفاهما فوق الرقعة، والنقلة الأخيرة تحتها، وفي الإطار الأخير النتيجة وكيف انتهت المباراة.

      **التكلفة والتخزين المؤقت والحصص.** تُنشأ صورة GIF على خيط رسم خاص بها، لا على الخيوط التي تدير المباريات أبدًا، وبأدنى أولوية للمعالج: `GIF_THREADS` خيطًا (`WORKERS` افتراضيًا)، تبدأ مع أول صورة GIF وتتوقف بعد دقيقة من دون أي صورة. وتنتظر حتى `GIF_QUEUE_MAX` (4 x `WORKERS`) صورة GIF دورها للحصول على خيط، كلٌّ منها `GIF_QUEUE_TIMEOUT_MS` (10 ث) على الأكثر؛ ويجوز أن يستغرق الرسم `GIF_RENDER_TIMEOUT_MS` (30 ث). ويحتفظ الخادم بصور GIF التي أنشأها في ذاكرة تخزين مؤقت سعتها `GIF_CACHE_MB` ميغابايت (32 x `WORKERS`)، ويُستبعد منها الأقل استخدامًا مؤخرًا أولًا؛ ولا تكلّف صورة GIF المأخوذة من ذاكرة التخزين المؤقت، أو التي يجري إنشاؤها لطلب آخر، أي عملية رسم. ويعتمد مفتاح التخزين المؤقت على كل ما يغيّر الصورة، بما في ذلك الأسماء.

      يُحتسب كل طلب في `gif` (30 في الدقيقة لكل لاعب لنقطتي النهاية معًا). وصورة GIF التي يجب إنشاؤها تُحتسب أيضًا في حدود الرسم: لكل لاعب `GIF_USER_RENDERS_PER_MIN` (4) في الدقيقة و`GIF_USER_RENDERS_PER_HOUR` (30) في الساعة؛ ولكل عميل، بكل حساباته مجتمعة، `GIF_IP_RENDERS_PER_MIN` (12) في الدقيقة و`GIF_IP_RENDERS_PER_HOUR` (120) في الساعة، و3 أضعاف ذلك لكل IPv6 /48. وعلى العميل أن يحتفظ بالملف الذي نزّله بدلًا من طلبه مرة أخرى، وأن ينتظر `retryAfter` بعد 429 أو 503.

      الأحجام: `small` (مربعات 32 بكسل: 284 x 350 بكسل)، و`medium` (48 بكسل: 424 x 515)، و`large` (72 بكسل: 628 x 762)؛ ومن دون الإحداثيات 268 x 342 و400 x 503 و600 x 748. وتبقى وضعية البداية 1 ث على الأقل (أو مدة التأخير بين الإطارات إن كانت أطول)، والوضعية الأخيرة 3 ث، وتُعاد صورة GIF في حلقة؛ وبعد الإطار الأول لا يُخزَّن إلا الجزء المتغير من الصورة. وتشغل مباراة من 40 نقلة نحو 135 و205 و325 كيبيبايت (صغير، متوسط، كبير)، ومباراة من 150 نقلة 0.5 و0.8 و1.2 ميبيبايت.
