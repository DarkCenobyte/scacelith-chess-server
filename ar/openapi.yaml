      summary: الحصول على أفضل اللاعبين في فئة
      description: |-
        أفضل 100 سجل تصنيف في فئة رسمية، من بين السجلات التي تضم `minGames` (`PROVISIONAL_GAMES`) مباراة محتسبة على الأقل، مع استبعاد الحسابات المحذوفة والغشاشين المؤكَّد غشهم. ويعيد الخادم حساب كل لوحة مرة كل 10 ثوانٍ على الأكثر؛ ويبيّن `updatedAt` متى. ولا يجري إلا حساب واحد لكل فئة في الوقت نفسه: وفي أثنائه تتلقى الطلبات الأخرى القائمة السابقة، أو تنتظر الحساب حين لا توجد قائمة بعد.

        **الحدود:** طبقة الحدّ حسب العنوان فقط.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: معرّف فئة رسمية (`3+2` أو `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: عدد اللاعبين، من 1 إلى 100. والعدد الأكبر المكوّن من 3 أرقام على الأكثر يُعدّ 100؛ والقيمة الفارغة تُعدّ غائبة.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: لوحة المتصدرين.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (غائبة، أو ليست فئة رسمية)، `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: طبقة الحدّ حسب العنوان.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (بقيت قاعدة البيانات مقفلة؛ `retryAfter: 1` في الجسم، بلا ترويسة `Retry-After`)، `timeout`.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: الإبلاغ عن خصم مباراة حديثة
      description: |-
        يبلّغ عن الخصم في إحدى مباريات اللاعب نفسه انتهت خلال آخر 7 أيام. ولا يغيّر البلاغ وحده أبدًا تصنيفًا ولا عقوبة ولا مستوى نزاهة. بل يرفع أولوية المراجعة التي يراها المشرفون، ويطلب، باستثناء `abuse`، تحليل المباراة بالمحرّك.

        والبلاغ عن الخصم نفسه في المباراة نفسها يتلقى الرد نفسه ولا يغيّر شيئًا؛ ولا يكشف الرد أبدًا أي شيء عن الحساب المبلَّغ عنه. ويُعلم `GET /games/{id}` لاعبَي المباراة مسبقًا هل سيُقبل البلاغ (`reportable`).

        تفحص نقطة النهاية هذه جسمها بنفسها، بالترتيب `gameId`، `reported`، `category`، `comment`: ويكون الرد على أي إخفاق 400 `invalid_request` من دون `field`. وتُتجاهل الحقول التي لا تعرفها.

        **الحدود:** `reports` (لكل لاعب)، ثم `REPORTS_PER_DAY` (5) بلاغات لكل لاعب خلال 24 ساعة (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: استُلم البلاغ (أو كان قد قُدّم من قبل).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (من دون `field`)، `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: ليس خصم المبلِّغ في مباراة انتهت خلال آخر 7 أيام.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`، مع ترويسة `Retry-After`): `REPORTS_PER_DAY` بلاغًا في آخر 24 ساعة. `rate_limited`: الحدّ `reports` أو رصيد الحساب.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (وجد البحث عن الجلسة قاعدة البيانات مقفلة)، `timeout`. وكذلك `server_busy` مع `retryAfter` من 2 إلى 5: لدى قاعدة البيانات كتابات منتظرة أكثر مما ينبغي، ولم يُنفَّذ الطلب.'
