info:
  title: واجهة HTTPS API لخادم Scacelith
  version: "0.9.1"
  summary: 'واجهة HTTPS API المشتركة بين كل خوادم Scacelith: الخادم الرسمي والخوادم المجتمعية.'
  description: |-
    يستجيب لواجهة HTTPS API هذه كلُّ خادم Scacelith، سواء الخادم الرسمي `caissa.scacelith.com` أو أي خادم مجتمعي. وتستخدمها اللعبة في كل ما يقع خارج المباراة نفسها: إنشاء الحساب وتسجيل الدخول (بما في ذلك المصادقة الثنائية وGoogle)، وصفحة الحساب، وسجل المباريات، وتنزيل ملفات PGN وصور GIF المتحركة للمباريات، والأجهزة المسجَّل الدخول منها، وتنزيل البيانات، وحذف الحساب، والبلاغات.

    أما اللعب المباشر (البحث عن خصم، والتحديات، والنقلات، والساعات) فيمرّ عبر WebSocket الخاص بالخادم نفسه (`wss://<host>/ws`)، الذي يُفتح برمز جلسة مميَّز صادر عن هذه الواجهة؛ وهو موصوف في `PROTOCOL.md` لا هنا.

    القيم الافتراضية الواردة أدناه هي قيم خادم لم تُمَسّ إعداداته؛ وقد يغيّرها الخادم المجتمعي (يسمّي `CONFIG.md` كل إعداد).

    ## العنوان الأساسي والمنفذ وبروتوكول النقل

    - الخادم الرسمي: `https://caissa.scacelith.com/api/v1`، منفذ TCP رقم 443.
    - خادم مجتمعي: `https://<SERVER_PUBLIC_HOST>[:<port>]/api/v1`. قيمة `API_PORT` الافتراضية 443؛ وخلف NAT أو خادم وكيل، يكون المنفذ الذي يستخدمه اللاعبون هو `PUBLIC_API_PORT`.
    - يقع WebSocket الخاص باللعبة على المنفذ نفسه افتراضيًا (ينقله `WS_PORT` إلى منفذ آخر؛ ويُعلم `GET /info` العميلَ بمكانه).
    - HTTP/1.1 عبر TLS. مع `TLS_MODE=proxy` يُنهي خادمٌ وكيل عكسي اتصالَ TLS أمام الخادم. أما `TLS_MODE=off` (HTTP غير مشفَّر) فهو للتطوير المحلي فقط.
    - صفحات HTML التي تُفتح من روابط رسائل البريد الإلكتروني (`/verify-email` و`/reset-password` و`/confirm-email-change`) موجودة في جذر الخادم، خارج `/api/v1`. وتستجيب نقاط نهاية فحص السلامة في الجذر وتحت `/api/v1` كليهما. وليست لتسجيل الدخول عبر Google صفحة على الخادم: يعيد Google المتصفح إلى اللعبة نفسها، على `127.0.0.1`.
    - تُتجاهَل الشرطة المائلة في آخر المسار (`/api/v1/info/` هو `/api/v1/info`)، ويُفكّ ترميز URL في معاملات المسار (والمعامل الذي ليس ترميز URL صالحًا يكون الرد عليه 400 `invalid_request`).

    ## الطلبات

    - **أجسام JSON.** تحمل طلبات `POST` و`PUT` و`DELETE` كائن JSON مع `Content-Type: application/json`. وتُرفض أي قيمة `charset` غير UTF-8، وكذلك أي نوع محتوى آخر (415 `unsupported_media_type`). ويُعدّ الجسم الفارغ بمنزلة `{}`، وهو ما تتلقاه نقاط النهاية التي لا معاملات لها (`POST /auth/logout` و`POST /auth/logout-all` و`DELETE /auth/sessions/{id}`).
    - **الحجم والوقت.** يقتصر الجسم على `HTTP_BODY_LIMIT` بايت (16,384 افتراضيًا؛ ولـ `POST /gif` حدّه الخاص البالغ 135,168 بايت): 413 `payload_too_large`. ويجب أن يصل خلال 10 ثوانٍ: 408 `request_timeout`. وبعد أيٍّ من الخطأين يغلق الخادم الاتصال.
    - **مخططات صارمة.** يُرفض الحقل الذي لا تعرفه نقطة النهاية، والحقل غير الموسوم بأنه اختياري مطلوب، وتُفحص الأنواع والأطوال. وأيّ إخفاق من هذه يكون الرد عليه 400 `invalid_request`، مع `field` الذي يسمّي الحقل (بصيغة نقطية للحقل المتداخل، مثل `pow.nonce`). ولا يجوز أن تحتوي السلاسل النصية على محارف تحكّم. وتُحسب الأطوال بوحدات ترميز UTF-16، لذا يُحسب المحرف الواقع خارج المستوى متعدد اللغات الأساسي (كالرموز التعبيرية) مرتين. والجسم الذي ليس JSON يكون الرد عليه 400 `invalid_json`. أما `POST /gif` و`POST /reports` فتفحصان جسميهما بنفسيهما (راجع كل نقطة نهاية).
    - **سلاسل الاستعلام.** يُعتدّ بأول ظهور للمعامل، وتُتجاهل المعاملات غير المعروفة، ويُفكّ `+` إلى مسافة: فنقاط النهاية التي تتلقى فئة نظام وقت تقبل `3%2B2` و`3+2` كليهما.
    - **الطرق.** `HEAD` هو `GET` من دون الجسم. ويكون الرد على `OPTIONS` لمسار موجود 204 مع ترويسة `Allow` (ومع ترويسات الطلب التمهيدي لـ CORS، انظر أدناه). وأي طريقة أخرى لا يدعمها المسار يكون الرد عليها 405 `method_not_allowed` مع `Allow`.
    - **هدف الطلب.** لا يجوز أن يتجاوز 4096 محرفًا (414 `uri_too_long`). والطلب الذي يتعذّر تحليله أصلًا، أو الذي يكون رأسه كبيرًا جدًا أو يصل ببطء شديد، يتلقى ردًا فارغًا بالحالة 400 أو 431 أو 408 ويُغلق الاتصال.
    - **CORS: قائمة سماح، معطَّلة افتراضيًا.** تخدم الواجهة اللعبةَ، وهي لا ترسل `Origin`. وحين تكون `CORS_ORIGINS` فارغة (وهي القيمة الافتراضية) لا تُرسَل أي ترويسة `Access-Control-*` أبدًا، فلا تستطيع أي صفحة ويب قراءة أي رد. وتسرد `CORS_ORIGINS` أصول الويب التي يُسمح لصفحاتها باستدعاء الواجهة من متصفح، كلٌّ منها تمامًا كما ترسله المتصفحات في `Origin`: `https://host` أو `https://host:port`، بأحرف صغيرة، بلا مسار ولا شرطة مائلة في آخره ولا المنفذ الافتراضي؛ و`http://` فقط لـ `localhost` و`127.0.0.1` و`[::1]` (التطوير المحلي)؛ ولا محارف بدل. ويضبط الخادم الرسمي `CORS_ORIGINS=https://scacelith.com,https://www.scacelith.com` لموقعه على الويب. وعندئذ:
      - كل رد على مسار تحت `/api/v1` ما عدا نقاط نهاية فحص السلامة، ناجحًا كان أو خطأً (بما في ذلك 429 طبقة الحدّ حسب العنوان)، يحمل `Vary: Origin`. وحين يطابق `Origin` الطلب بايتًا ببايت أحد الأصول المدرجة، يحمل الرد أيضًا `Access-Control-Allow-Origin: <that origin>`، ويحمل كذلك `Access-Control-Expose-Headers: Retry-After, Content-Disposition` إلا في الرد على طلب تمهيدي، كي تقرأ الصفحة رموز الأخطاء و`Retry-After` وأسماء ملفات تنزيلات PGN وGIF.
      - الطلب التمهيدي (`OPTIONS` مع `Access-Control-Request-Method`) من أصل مدرج على مسار موجود يكون الرد عليه 204، بلا جسم، مع `Allow` و`Access-Control-Allow-Origin` و`Access-Control-Allow-Methods` (طرق `Allow`) و`Access-Control-Allow-Headers: Authorization, Content-Type` و`Access-Control-Max-Age: 600` و`Vary: Origin`. ولا يحتاج إلى رمز مميَّز، ولا يُحتسب من رصيد أي حساب ولا من أي حدّ لنقطة نهاية؛ لكنه، مثل أي طلب، يأخذ رمزًا من طبقة الحدّ حسب العنوان. ويعيد المتصفح استخدام الطلب التمهيدي مدة 10 دقائق، لكن لعنوان URL ذاته فقط، بما في ذلك سلسلة الاستعلام. أما الطلب الذي لا يحمل `Authorization` ولا جسم JSON، مثل `GET /info` أو `GET /leaderboard`، فلا يحتاج إلى طلب تمهيدي.
      - وأي رد آخر على طلب تمهيدي هو طلب تمهيدي فاشل، حتى مع ترويسات CORS: 404 لمسار غير موجود، أو 429 طبقة الحدّ حسب العنوان. وعندئذ لا يرسل المتصفح الطلب، وترى الصفحة خطأ شبكة، من دون الرد ومن دون `Retry-After` الخاص به.
      - لا تُرسَل `Access-Control-Allow-Credentials` أبدًا، ولا `Access-Control-Allow-Origin: *`: فالصفحة ترسل الرمز المميَّز لجلستها في `Authorization: Bearer`، كما تفعل اللعبة، والواجهة لا تضبط أي ملف تعريف ارتباط. ولا تحمل صفحات HTML ولا نقاط نهاية فحص السلامة ولا الردود الفارغة على الطلبات التي تتعذر قراءتها أي ترويسة CORS. ولا يستخدم WebSocket آلية CORS: إذ تسرد `WS_ALLOWED_ORIGINS` الصفحات التي يُسمح لها بفتحه.
      - صفحة الأصل غير المدرج لا تقرأ شيئًا، ولا تُرسَل كتاباتها العابرة للمواقع أبدًا: فأجسام JSON و`Authorization` تتطلب طلبًا تمهيديًا، لا يحمل الرد عليه `Access-Control-Allow-Origin` لذلك الأصل. وتبقى `Cross-Origin-Resource-Policy: same-origin` على كل رد: فهي لا تنطبق إلا على طلبات `no-cors` (موقع آخر يضمّن ردًا)، ولا تنطبق أبدًا على طلبات `cors` لصفحة مدرجة.

    ## الردود والأخطاء

    - الردود بصيغة JSON بترميز UTF-8، باستثناء تنزيل PGN (`application/x-chess-pgn`) وصور GIF المتحركة (`image/gif`) وصفحات HTML. والأوقات بالملّي ثانية منذ 1970-01-01 UTC. والمعرّفات أعداد صحيحة. وتصل معرّفات المباريات إلى 16 رقمًا لكنها تبقى دون 2^53، فيمثّلها عدد JSON (عدد عشري مزدوج الدقة) تمثيلًا دقيقًا.
    - يحمل كل رد من الواجهة `Cache-Control: no-store` و`X-Content-Type-Options: nosniff` و`Referrer-Policy: no-referrer` و`X-Frame-Options: DENY` و`Cross-Origin-Resource-Policy: same-origin` و`Content-Security-Policy: default-src 'none'; frame-ancestors 'none'` (ولصفحات HTML سياستها الخاصة). ومع `TLS_MODE=native` يحمل أيضًا `Strict-Transport-Security: max-age=31536000`.
    - يجب أن يُقرأ الرد خلال 60 ثانية من لحظة جاهزيته لدى الخادم، وهذا لا يهم إلا في الردود الكبيرة (صورة GIF، وتصدير البيانات، وملف PGN طويل). ولا يُحتسب الوقت الذي يستغرقه الخادم في إعداد الرد ضمن هذه المهلة، ولا ضمن مهلة الـ 30 ثانية التي يُغلق بعدها الاتصال إن لم يمرّ فيها أي بايت واردًا أو صادرًا.

    للأخطاء شكل واحد (المخطط `Error`):

    ```json
    { "error": "snake_case_code", "message": "An English sentence.", "retryAfter": 30 }
    ```

    الحقل `message` مخصّص للسجلات وللاستخدام الاحتياطي؛ أما ما يعرضه العميل فيختاره بناءً على `error`. ولا يوجد `retryAfter` (بالثواني) إلا في حالات الرفض التي تنتهي بمرور الوقت، ويحمل الرد حينها أيضًا ترويسة `Retry-After` بالقيمة نفسها؛ والاستثناء الوحيد هو الخطأ 503 `busy` في قراءات السجل والمباريات واللاعبين ولوحة المتصدرين، إذ لا يحمل إلا الحقل. وتضيف بعض الأخطاء حقولًا: `field` (مدخلات غير صالحة)، و`reason` (`weak_password` و`pow_required`)، و`pow` (`pow_required`)، و`until` (`banned`)، و`line` و`column` (`invalid_pgn`).

    الأخطاء التي قد تصدر عن أي نقطة نهاية:

    | الحالة | `error` | متى |
    |---|---|---|
    | 400 | `invalid_request` | يخالف الجسمُ مخطط نقطة النهاية (ويبيّن `field` الموضع)، أو يكون هدف الطلب أو `Content-Length` مشوّهًا، أو لا يكون معامل المسار ترميز URL صالحًا، أو يكون الجسم مبتورًا. |
    | 400 | `invalid_json` | الجسم ليس JSON. |
    | 401 | `unauthorized` | لا توجد ترويسة `Authorization` في نقطة نهاية تتطلب جلسة. |
    | 401 | `invalid_token` | الرمز المميَّز مشوّه، أو منتهي الصلاحية، أو مُبطَل، أو يخص حسابًا محذوفًا؛ ويصدر أيضًا في نقاط النهاية التي تكون فيها الجلسة اختيارية. |
    | 404 | `not_found` | لا توجد نقطة نهاية كهذه. وتستخدمه بعض نقاط النهاية أيضًا: لا توجد مباراة أو لاعب أو جلسة كهذه. |
    | 405 | `method_not_allowed` | المسار موجود لطرق أخرى (راجع `Allow`). |
    | 408 | `request_timeout` | لم يصل الجسم خلال 10 ثوانٍ. |
    | 413 | `payload_too_large` | يتجاوز الجسم `HTTP_BODY_LIMIT` (135,168 بايت لـ `POST /gif`). |
    | 414 | `uri_too_long` | يتجاوز هدف الطلب 4096 محرفًا. |
    | 415 | `unsupported_media_type` | الجسم ليس `application/json`، أو ترميز محارفه ليس UTF-8. |
    | 429 | `rate_limited` | حدّ معدّل (انظر أدناه): `retryAfter` مع ترويسة `Retry-After`. |
    | 500 | `internal_error` | إخفاق غير متوقع. يسجّله الخادم. |
    | 503 | `timeout` | لم يردّ الخادم خلال 30 ثانية (60 ثانية للتصدير، و45 ثانية لصور GIF مع الإعدادات الافتراضية). |
    | 503 | `server_busy` | وجد بحثٌ عن جلسة أو تعديلٌ على حساب قاعدةَ البيانات مقفلة (`retryAfter` 1)، أو أن طابور تجزئة كلمات المرور ممتلئ (انظر أدناه). وكذلك، لطلب `POST` أو `PUT` أو `PATCH` أو `DELETE`، لدى قاعدة البيانات كتابات منتظرة أكثر مما ينبغي: لم يُنفَّذ الطلب، ولم تأخذ حدود معدله شيئًا (`retryAfter` من 2 إلى 5). |

    تردّ نقاط نهاية القراءة (سجل المباريات، والمباريات، واللاعبون، ولوحة المتصدرين) ونقطة نهاية التصدير بالخطأ 503 `busy` مع `retryAfter: 1` عندما تظل قاعدة البيانات مقفلة.

    ويمكن لنقاط النهاية التي تتحقق من كلمة مرور أو تجزّئها أن تردّ أيضًا بأحد الخطأين التاليين، وكلاهما مع `retryAfter` عشوائي بين 5 و15 ثانية:

    - 503 `server_busy`: طابور تجزئة كلمات المرور في الخادم (`PASSWORD_HASH_QUEUE_MAX`) ممتلئ، أو نفدت مهلة الانتظار.
    - 429 `rate_limited`: بعد أن يمتلئ نصف الطابور، يكون لهذا العميل (عنوان IPv4 أو نطاق IPv6 /48) بالفعل `PASSWORD_HASH_WAITERS_PER_SOURCE` عملية تجزئة في الانتظار. ويعيد هذا الخطأ 429 رموز حدود المعدّل التي أخذها الطلب.

    في الحالتين لا يتغير شيء ولا تُحتسب أي محاولة فاشلة (باستثناء `POST /auth/sso/google/link`، الذي تكون محاولة التذكرة وإخفاق الحساب فيه قد احتُسبا قبل التجزئة)، ويبقى رابط إعادة التعيين صالحًا.

    وتعرض صفحات HTML أخطاءها على شكل صفحات HTML برموز الحالة نفسها.

    ## المصادقة

    تتلقى نقاط النهاية التي تتطلب جلسة رمزًا مميَّزًا من نوع Bearer في الترويسة `Authorization` (مخطط الأمان `bearerAuth`):

    ```
    Authorization: Bearer sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
    ```

    - **الحصول على رمز مميَّز.** يأتي الرمز المميَّز (`sct_` متبوعًا بـ 43 محرفًا بترميز base64url) من `POST /auth/login`، ثم من `POST /auth/login/mfa` إذا كانت المصادقة الثنائية مفعّلة، ومن `POST /auth/sso/google/finish` و`POST /auth/sso/google/link` (تسجيل الدخول عبر Google)، ومن `POST /auth/sso/complete`. وكلٌّ منها يردّ بـ `{ token, expiresAt, user }`. ولا يخزّن الخادم إلا تجزئة SHA-256 للرمز المميَّز.
    - **الجلسة المطلوبة.** غياب الترويسة يكون الرد عليه 401 `unauthorized` مع `WWW-Authenticate: Bearer realm="scacelith"`. والرمز المميَّز غير الصالح يكون الرد عليه 401 `invalid_token` مع `WWW-Authenticate: Bearer realm="scacelith", error="invalid_token"`. وعلى العميل أن ينسى الرمز المميَّز الذي يتلقى `invalid_token` وأن يسجّل الدخول من جديد.
    - **الجلسة الاختيارية.** الجلسة اختيارية في `GET /games/{id}` و`GET /games/{id}/pgn` و`GET /players/{username}` و`GET /players/{username}/games`. فمن دون الترويسة تردّ هذه النقاط بالعرض العام؛ وإذا أُرسلت الترويسة، فيجب أن يكون رمزها المميَّز صالحًا.
    - **مدة الصلاحية.** تنتهي الجلسة عند أسبق الأجلين: `SESSION_MAX_DAYS` (90) يومًا بعد تسجيل الدخول (وهذا هو `expiresAt`)، و`SESSION_IDLE_DAYS` (30) يومًا من دون استخدام. وكل استخدام يؤخّر حدّ الخمول؛ ويكتب الخادم القيمة الجديدة مرة كل 5 دقائق على الأكثر. ويحتفظ الحساب بـ `MAX_SESSIONS_PER_USER` (10) جلسات على الأكثر: فتسجيل دخول جديد يُبطل أقدم الجلسات الزائدة على هذا العدد.
    - **الإبطال.** يُبطل تسجيلُ الخروج (`POST /auth/logout` و`POST /auth/logout-all` و`DELETE /auth/sessions/{id}`) الجلسات؛ وكذلك يفعل تغيير كلمة المرور (الجلسات الأخرى)، وإعادة تعيين كلمة المرور وحذف الحساب (كل الجلسات)، والمسؤول. ويسري الإبطال عبر الواجهة فورًا، ويُغلق WebSocket الذي فُتح بجلسة مُبطَلة. ويجري الإبطال عند تغيير كلمة المرور أو إعادة تعيينها وعند حذف الحساب في المعاملة نفسها التي يجري فيها التغيير ذاته: فإذا فشلت إحداها، لم تُبطَل أي جلسة ولم يتغير أي شيء آخر كذلك. ويخزّن الخادم نتائج البحث عن الجلسات مؤقتًا مدة 30 ثانية، لذا فإن الإبطال بأمر الإدارة، وهو عملية منفصلة، يسري خلال 30 ثانية.
    - **النطاق.** ينتمي الرمز المميَّز إلى خادم واحد، ويفتح WebSocket الخاص به أيضًا. لا ترسله أبدًا إلى خادم آخر.

    ## حدود المعدّل وأشكال التقييد الأخرى

    تنطبق الحدود على أحد نطاقين. **العميل:** عنوان IPv4، أو شبكة IPv6 /64 (في وضع الخادم الوكيل، يُؤخذ العنوان من `X-Forwarded-For` المرسَل من عنوان مُدرَج في `TRUSTED_PROXIES`)؛ وتحتسب بعض الحدود أيضًا كل نطاق IPv6 /48 ككل، إضافةً إلى كل شبكة /64 فيه. **اللاعب:** الحساب المسجَّل الدخول، أيًّا كان عنوانه؛ والحدّ المحتسب لكل لاعب في نقطة نهاية تكون فيها الجلسة اختيارية يُحتسب لكل عميل في الطلب الذي لا يحمل رمزًا مميَّزًا.

    كل حدّ هو دلو رموز يتسع لـ `limit` طلبًا ويُعاد ملؤه باستمرار بمعدّل `limit / window`؛ و`retryAfter` هو الوقت المتبقي حتى الرمز التالي. وتُحتسب الحدود الموسومة بأنها *مشتركة* أيضًا على نافذة منزلقة بالطول نفسه، كي لا تضم أي نافذة أكثر من `limit` طلبًا بكثير. ويُحتسب كل حدّ على مستوى الخادم بأكمله. وعندما يرفض أحد حدود نقطة النهاية طلبًا، تُعاد الرموز التي أخذتها حدودها الأخرى لهذا الطلب. ويكون الرد على الرفض 429 `rate_limited` مع `retryAfter` و`Retry-After`.

    - **طبقة الحدّ حسب العنوان.** يأخذ كل طلب (أيًّا كان مساره وطريقته، بما في ذلك نقاط نهاية فحص السلامة وترقيات WebSocket) أولًا رمزًا واحدًا من رصيد عميله: `HTTP_RATE_PER_IP` (600) في الدقيقة مع دفعة تعادل نصف دقيقة، و`HTTP_RATE_PER_PREFIX` (4 x `HTTP_RATE_PER_IP`) لنطاق IPv6 /48. ولا يجوز أن يكون للعميل أكثر من `IP_MAX_INFLIGHT` (32 x `WORKERS`) طلبًا قيد المعالجة (`retryAfter` 1 عند التجاوز). والعميل الذي يواصل بعد رفض طلباته يُحجب: `ABUSE_BLOCK_REFUSALS_PER_MIN` (600) حالة رفض في دقيقة واحدة تحجبه 1 دقيقة، ثم 4 و16 و60 دقيقة عند كل حجب جديد خلال 6 ساعات. ويُحتسب رفض الحدود `auth` و`auth_*` و`reauth` بـ 5؛ أما الحدود المحتسبة لكل لاعب فلا تُحتسب أبدًا. وتتخطى العناوين المدرجة في `ABUSE_EXEMPT` هذه الطبقة، لكنها لا تتخطى رصيد الحساب ولا حدود نقاط النهاية.
    - **رصيد الحساب.** كل طلب يحمل رمز جلسة مميَّزًا صالحًا يُحتسب أيضًا على حسابه: `USER_RATE_PER_MIN` (120) في الدقيقة لكل نقاط النهاية مجتمعة، أيًّا كان العنوان، مع دفعة تعادل نصف دقيقة.
    - **حدود نقاط النهاية:**

    | الحدّ | القيمة الافتراضية | يُحتسب لكل | نقاط النهاية |
    |---|---|---|---|
    | `auth` | `AUTH_RATE_PER_IP` (20) / 10 دقائق، مشترك | عميل، و`AUTH_RATE_PER_PREFIX` (5 x `AUTH_RATE_PER_IP`) لكل IPv6 /48 | `POST /auth/register`، `/auth/login`، `/auth/login/mfa`، `/auth/verify-email/resend`، `/auth/password/forgot`، `/auth/password/reset`، `/auth/sso/google/link`، `/auth/sso/complete`؛ `POST /verify-email`، `/reset-password`، `/confirm-email-change` |
    | `auth_register` | `AUTH_REGISTER_PER_HOUR` (10) / ساعة، مشترك | عميل، و3 أضعاف ذلك لكل IPv6 /48 | `POST /auth/register` |
    | `auth_mail` | `AUTH_MAIL_PER_HOUR` (10) / ساعة، مشترك | عميل، و3 أضعاف ذلك لكل IPv6 /48 | `POST /auth/verify-email/resend` |
    | `auth_forgot` | `AUTH_FORGOT_PER_HOUR` (3) / ساعة، مشترك | عميل، و3 أضعاف ذلك لكل IPv6 /48 | `POST /auth/password/forgot` |
    | `auth_forgot_day` | `AUTH_FORGOT_PER_DAY` (10) / 24 ساعة، مشترك | عميل، و3 أضعاف ذلك لكل IPv6 /48 | `POST /auth/password/forgot` |
    | `auth_reset` | `AUTH_RESET_PER_HOUR` (10) / ساعة، مشترك | عميل، و3 أضعاف ذلك لكل IPv6 /48 | `POST /auth/password/reset`، `POST /reset-password` |
    | `reauth` | أرقام `auth` نفسها، بدلو مستقل، مشترك | عميل ونطاق IPv6 /48 | تعديلات الحساب التي تطلب كلمة المرور (راجع «إعادة المصادقة»)، و`POST /account/export` |
    | `reauth_user` | `AUTH_REAUTH_PER_USER` (10) / 10 دقائق، مشترك | لاعب | نقاط النهاية نفسها الخاضعة لـ `reauth` |
    | `account` | 60 / دقيقة | لاعب | `GET /account/me`، `PUT /account/preferences` |
    | `account_games` | 60 / دقيقة | لاعب | `GET /account/games` |
    | `account_export` | 5 / ساعة، مشترك | لاعب | `POST /account/export` (يُفحص قبل `reauth`؛ وكل محاولة تُحتسب) |
    | `sessions` | 60 / دقيقة | لاعب | `POST /auth/logout`، `/auth/logout-all`، `GET /auth/sessions`، `DELETE /auth/sessions/{id}` |
    | `public_read` | 60 / دقيقة | لاعب (أو عميل من دون رمز مميَّز) | `GET /players/{username}`، `/players/{username}/games`، `/games/{id}`، `/games/{id}/pgn` (دلو واحد للأربع) |
    | `gif` | 30 / دقيقة | لاعب | `GET /games/{id}/gif`، `POST /gif` (دلو واحد للاثنتين) |
    | `gif_user_min`، `gif_user_hour` | `GIF_USER_RENDERS_PER_MIN` (4) / دقيقة و`GIF_USER_RENDERS_PER_HOUR` (30) / ساعة، مشترك | لاعب | نقطتا النهاية نفسهما، فقط حين يجب رسم صورة GIF (لا أخذها من ذاكرة التخزين المؤقت) |
    | `gif_ip_min`، `gif_ip_hour` | `GIF_IP_RENDERS_PER_MIN` (12) / دقيقة و`GIF_IP_RENDERS_PER_HOUR` (120) / ساعة، مشترك | عميل (كل حساباته مجتمعة)، و3 أضعاف ذلك لكل IPv6 /48 | نقطتا النهاية نفسهما، كما سبق |
    | `reports` | 30 / ساعة | لاعب | `POST /reports` |
    | `sso_start` | 30 / 10 دقائق، مشترك | عميل، و90 لكل IPv6 /48 | `POST /auth/sso/google/start` |
    | `sso_finish` | 30 / دقيقة | عميل | `POST /auth/sso/google/finish` |
    | `page` | 60 / دقيقة | عميل | `GET /verify-email`، `/reset-password`، `/confirm-email-change` |

    ليس لـ `GET /info` و`GET /leaderboard` حدّ خاص بهما: لا تنطبق عليهما إلا طبقة الحدّ حسب العنوان. ونقطة النهاية ذات الحدود المتعددة تفحصها بالترتيب الوارد في وصفها.

    يعالج الخادم الطلب بهذا الترتيب: طبقة الحدّ حسب العنوان، ثم نقاط نهاية فحص السلامة؛ مطابقة نقطة النهاية؛ فحص الكتابات المنتظرة في قاعدة البيانات لطلبات `POST` و`PUT` و`PATCH` و`DELETE` (503 `server_busy`)؛ المصادقة؛ رصيد الحساب، إذا كان الطلب يحمل جلسة؛ حدود نقطة النهاية؛ الجسم؛ نقطة النهاية نفسها (لا تأخذ نقاط نهاية GIF حدود الرسم إلا حين تكون لديها صورة GIF عليها رسمها). وبذلك فإن الطلب المرفوض بسبب رمزه المميَّز لا يستهلك شيئًا من رموز نقطة النهاية، أما الطلب ذو الجسم غير الصالح فيستهلكها.

    أشكال تقييد أخرى، تردّ بها نقاط النهاية نفسها:

    - **محاولات تسجيل الدخول الفاشلة على اسم دخول واحد** (اسم المستخدم أو البريد الإلكتروني): ابتداءً من `AUTH_FAILURES_PER_ACCOUNT` (5) إخفاقات، يجب أن تنتظر كل محاولة ضعف مدة سابقتها (2 ث، 4 ث، وهكذا، حتى 15 دقيقة): 429 `too_many_attempts` مع `retryAfter`. ويُصفَّر العدّاد بعد ساعة بلا إخفاقات.
    - **العوامل الثانية الفاشلة عند تسجيل الدخول:** القاعدة نفسها ابتداءً من الرمز الخاطئ رقم 5 للحساب. ولا تقبل خطوة تسجيل الدخول الواحدة أكثر من 5 رموز خاطئة.
    - **رموز العامل الثاني لحساب واحد:** `AUTH_MFA_PER_ACCOUNT` (10) رموز على الأكثر (رموز تطبيق المصادقة أو رموز الاسترداد، صحيحةً كانت أو خاطئة) كل 15 دقيقة، من أي عنوان، عند تسجيل الدخول وفي عمليات إعادة المصادقة؛ وبعد تجاوزها يكون الرد 429 `too_many_attempts` قبل فحص الرمز، فلا يُستهلك رمز الاسترداد.
    - **عمليات إعادة المصادقة الفاشلة لحساب** (كلمة مرور أو رمز خاطئ): القاعدة نفسها (429 `too_many_attempts`)، مشتركةً بين كل نقاط النهاية التي تعيد المصادقة.
    - **رسائل البريد الإلكتروني:** رسالة تأكيد أو إعادة تعيين واحدة لكل عنوان كل 5 دقائق (ويبقى الرد كما هو)؛ وإشعار واحد من نوع "someone tried to use your address" (حاول أحدهم استخدام عنوانك) لكل عنوان كل ساعة.
    - **البلاغات:** `REPORTS_PER_DAY` (5) لكل لاعب خلال 24 ساعة: 429 `report_limit`.

    ## إثبات العمل

    يحتاج `POST /auth/register` دائمًا إلى إثبات عمل عندما تكون قيمة `POW_REGISTER_BITS` أكبر من 0 (18 افتراضيًا؛ ويعطيها `GET /info` في `pow.register`). أما `POST /auth/login` و`POST /auth/sso/google/link` (بنوع واحد من التحديات لكليهما) فلا يحتاجان إليه إلا مدة 5 دقائق بعد أن يرصد الخادم موجة من محاولات تسجيل الدخول الفاشلة (`POW_LOGIN_TRIGGER_PER_MIN`، ثم `POW_LOGIN_BITS`)؛ ويعرف العميل ذلك من الرد.

    1. يكون الرد على الطلب الخالي من الإثبات (أو الذي يحمل إثباتًا مرفوضًا) 428 `pow_required` مع `reason` وتحدٍّ `pow` بالشكل `{ challenge, bits, expiresAt }`.
    2. ابحث عن قيمة استخدام واحد: سلسلة عشرية من 20 رقمًا على الأكثر بحيث تبدأ `SHA-256(challenge + ":" + nonce)` بعدد `bits` من البتات الصفرية (البت الأعلى أهميةً من البايت الأول أولًا). وتتطلب 18 بتًا نحو 260,000 عملية تجزئة في المتوسط.
    3. أرسل الطلب نفسه مرة أخرى مع `"pow": { "challenge": "...", "nonce": "123456" }` في الجسم.

    يصلح التحدي مدة 2 دقيقة ولمرة واحدة فقط، لنقطة نهاية واحدة وشبكة عميل واحدة (عنوان IPv4 أو شبكة IPv6 /64). وهو موقَّع، فلا يحتفظ الخادم بأي شيء عنه حتى يعود إليه. ويبيّن `reason` سبب رفض الإثبات: `required` أو `malformed` أو `signature` أو `endpoint` أو `network` أو `expired` أو `bits` أو `work` أو `replayed`.

    ## إعادة المصادقة

    تطلب تعديلات الحساب كلمة المرور من جديد، وكذلك عاملًا ثانيًا إذا كانت المصادقة الثنائية مفعّلة:

    - كلمة المرور فقط: `POST /account/password` و`POST /account/mfa/totp/setup`؛
    - كلمة المرور ورمز من تطبيق المصادقة، مع رفض رموز الاسترداد: `POST /account/mfa/recovery-codes`؛
    - كلمة المرور ورمز من تطبيق المصادقة أو رمز استرداد: `POST /account/mfa/totp/disable` و`POST /account/email` و`POST /account/export` و`POST /account/delete`.

    في الأجسام، يحمل `code` رمز تطبيق المصادقة المكوّن من 6 أرقام، ويحمل `recoveryCode` رمز استرداد (`xxxx-xxxx-xx`؛ ولا أهمية لحالة الأحرف ولا للمسافات والشرطات). ويجوز أيضًا إرسال رمز الاسترداد في `code` حيث تُقبل رموز الاسترداد. وكل رمز يعمل مرة واحدة: يُرفض رمز تطبيق المصادقة المستخدَم حتى الخطوة الزمنية التالية ومدتها 30 ثانية، ويزول رمز الاسترداد بمجرد استخدامه.

    | الحالة | `error` | متى |
    |---|---|---|
    | 403 | `invalid_password` | كلمة مرور خاطئة، أو أن كلمة المرور أُعيد تعيينها أو غُيِّرت أثناء تنفيذ الطلب (لم يتغير شيء). |
    | 403 | `mfa_code_required` | المصادقة الثنائية مفعّلة ولم يُرسَل `code` ولا `recoveryCode`. |
    | 403 | `invalid_code` | رمز خاطئ أو مستخدَم من قبل. |
    | 400 | `password_not_set` | حساب يعتمد على Google وحده ليست له كلمة مرور بعد («نسيت كلمة المرور» يعيّن له واحدة). |
    | 429 | `too_many_attempts` | إخفاقات كثيرة جدًا، أو رموز كثيرة جدًا جُرّبت، على هذا الحساب. |
    | 503 / 429 | `server_busy` / `rate_limited` | طابور تجزئة كلمات المرور مشغول. |

    تُحتسب كلمات المرور والرموز الخاطئة في عدّاد إخفاقات الحساب، وتُسجَّل بوصفها أحداث أمان.

    ## منفذ المقاييس

    إلى جانب منفذ API، يستجيب الخادم بـ HTTP غير مشفَّر على منفذ المقاييس (`METRICS_PORT`، 9464، مربوط بـ `METRICS_BIND`، وهو 127.0.0.1 افتراضيًا؛ أبقِه خاصًا). وهو ليس جزءًا من هذه الواجهة: يردّ `GET /healthz` بـ `ok`؛ ويردّ `GET /readyz` بـ `ready` بعد اكتمال بدء التشغيل (أي بعد أن تعيد كل شريحة تنفيذ سجل عملياتها وتُربط المنافذ المستمعة) وحتى بدء الإيقاف، وإلا فيردّ بـ 503 `not ready`؛ ويقدّم `GET /metrics` مقاييس Prometheus، ويتطلب، عند تعيين `METRICS_TOKEN`، الترويسة `Authorization: Bearer <token>` بهذا الرمز المميَّز بعينه.
