        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (مع `field`)، أو `invalid_json`، أو `invalid_username`، أو `invalid_email`، أو `weak_password` مع `reason`: `too_short` أو `too_long` أو `contains_username` أو `contains_email` أو `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: التسجيل مغلق على هذا الخادم (يذكر `GET /info` القيمة `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: هناك حساب يحمل اسم المستخدم هذا، أو يحجزه طلب تسجيل منتظر بعنوان آخر. `email_taken`: يستخدم حساب آخر هذا العنوان (من دون تأكيد البريد الإلكتروني فقط).'
        '413':
