  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: تسجيل الدخول بكلمة مرور
      description: |-
        يسجّل الدخول باسم مستخدم أو عنوان بريد إلكتروني وكلمة مرور. هناك ردّان ممكنان، كلاهما بالحالة 200: جلسة، أو، إذا كانت المصادقة الثنائية مفعّلة، خطوة ثانية يجب إكمالها خلال 5 دقائق عبر `POST /auth/login/mfa`.

        يتلقى الحساب غير المعروف وكلمة المرور الخاطئة والحساب الذي لا كلمة مرور له الردَّ نفسه، بعد المدة نفسها: 401 `invalid_credentials`. ولا تأتي فحوص الحساب (`banned` و`email_unverified`) إلا بعد كلمة مرور صحيحة. وابتداءً من `AUTH_FAILURES_PER_ACCOUNT` (5) إخفاقات على اسم دخول واحد، يجب أن تنتظر كل محاولة (429 `too_many_attempts`).

        **الحدّ:** `auth`. **إثبات العمل:** فقط أثناء موجة من محاولات تسجيل الدخول الفاشلة (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: جلسة، أو الخطوة الثانية من تسجيل دخول بالمصادقة الثنائية.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: تم تسجيل الدخول
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: المصادقة الثنائية مفعّلة
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: حساب غير معروف، أو كلمة مرور خاطئة، أو حساب لا كلمة مرور له.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'بعد كلمة مرور صحيحة فقط: `banned`، مع `until` (بالملّي ثانية منذ حقبة يونكس، و`null` للحظر الدائم)، أو `email_unverified` (حساب قديم لم يُؤكَّد عنوانه بعد).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (مهلة الانتظار بعد إخفاقات اسم الدخول هذا)، أو `rate_limited` (الحدّ `auth`، أو طابور تجزئة كلمات المرور).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (طابور تجزئة كلمات المرور، أو بقيت قاعدة البيانات مقفلة)، `timeout`. وكذلك `server_busy` مع `retryAfter` من 2 إلى 5: لدى قاعدة البيانات كتابات منتظرة أكثر مما ينبغي، ولم يُنفَّذ الطلب.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: إكمال تسجيل الدخول بعامل ثانٍ
      description: |-
        الخطوة الثانية من تسجيل الدخول بالمصادقة الثنائية، بعد أن يردّ `POST /auth/login` أو تسجيل الدخول عبر Google (`POST /auth/sso/google/finish` أو `POST /auth/sso/google/link`) بـ `mfaRequired`. أرسل `code` (رمزًا من تطبيق المصادقة من 6 أرقام، أو رمز استرداد) أو `recoveryCode`. ورمز الاسترداد المستخدَم هنا يزول.

        لا تقبل الخطوة الواحدة أكثر من 5 رموز خاطئة؛ وتنتهي الخطوة أيضًا عند إعادة تعيين كلمة المرور أو تغييرها. وبعد خطوة كلمة المرور في ربط حساب Google، لا يُخزَّن الربط إلا إذا اجتاز الرمز الفحص هنا.

        **الحدود:** `auth`، و`AUTH_MFA_PER_ACCOUNT` (10) رموز على الأكثر كل 15 دقيقة للحساب، من أي عنوان؛ وبعد تجاوزها لا يُفحص الرمز، فلا يُستهلك رمز الاسترداد.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: رمز من تطبيق المصادقة
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: رمز استرداد
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: تم تسجيل الدخول.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: لم يُرسَل `code` ولا `recoveryCode`، أو يخالف الجسم المخطط؛ `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: انتهت صلاحية الخطوة، أو استُخدمت، أو انتهت بعد 5 رموز خاطئة، أو أُعيد تعيين كلمة المرور أو غُيّرت منذ الخطوة الأولى (سجّل الدخول من جديد). `invalid_code`: رمز خاطئ أو مستخدَم من قبل.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (مع `until`)، `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: بعد خطوة كلمة المرور في ربط حساب Google فقط، رُبط حساب Google بحساب آخر في الأثناء.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: بعد خطوة كلمة المرور في ربط حساب Google فقط، تغيّر الحساب في الأثناء؛ ابدأ من جديد من اللعبة.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: مهلة الانتظار بعد إخفاقات الحساب، أو استُنفدت رموزه الـ `AUTH_MFA_PER_ACCOUNT` في آخر 15 دقيقة. `rate_limited`: الحدّ `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` مع `retryAfter: 1`: بقيت قاعدة البيانات مقفلة (بعد خطوة ربط حساب Google، لم يُربط شيء: ابدأ من جديد من اللعبة). `timeout`. وكذلك `server_busy` مع `retryAfter` من 2 إلى 5: لدى قاعدة البيانات كتابات منتظرة أكثر مما ينبغي، ولم يُنفَّذ الطلب.'
