          description: '`too_many_attempts` (عمليات إعادة مصادقة فاشلة، أو رموز كثيرة جدًا جُرّبت على هذا الحساب)، أو `rate_limited` (الحدّ `reauth` أو `reauth_user`، أو رصيد الحساب، أو طابور تجزئة كلمات المرور).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (طابور تجزئة كلمات المرور، أو بقيت قاعدة البيانات مقفلة)، `timeout`. وكذلك `server_busy` مع `retryAfter` من 2 إلى 5: لدى قاعدة البيانات كتابات منتظرة أكثر مما ينبغي، ولم يُنفَّذ الطلب.'
