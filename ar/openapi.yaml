  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: تنزيل مباراة كملف PGN
      description: |-
        المباراة نفسها كملف PGN: مباراة واحدة بنهايات أسطر `\n`، ونص النقلات في أسطر أقل من 80 عمودًا. والرد نفسه مع رمز مميَّز أو من دونه.

        الوسوم، بهذا الترتيب: `Event` (`<SERVER_NAME> rated <category>` أو `<SERVER_NAME> casual <category>`)، و`Site` (`SERVER_PUBLIC_HOST`)، و`Date` (تاريخ البداية بتوقيت UTC)، و`Round`، و`White`، و`Black`، و`Result` (`*` للمباراة الملغاة)، و`UTCDate` و`UTCTime` (البداية)، و`WhiteElo` و`BlackElo` (التصنيفان عند البداية، أو `-`)، و`WhiteRatingDiff` و`BlackRatingDiff` (التغيّران، مثل `+10` و`-10`، في كل مباراة محتسبة، و`+0` حين تُبقي قواعد التصنيف التصنيفَ على حاله؛ ولا يوجد أيٌّ منهما في المباراة الودية أو المخصّصة أو الملغاة)، و`TimeControl` (بالثواني)، و`Termination` (قيمة قياسية في PGN: `normal`؛ و`time forfeit` لانتهاء الوقت، حتى عندما ينتهي بالتعادل؛ و`abandoned`؛ و`rules infraction` للنقلة غير القانونية الثانية أو للخسارة بقرار بسبب انتهاك قواعد اللعب النظيف؛ و`unterminated` للمباراة الملغاة)، و`PlyCount`، و`ScacelithGameId` (المعرّف العشري).

        تحمل كل نقلة `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: ساعة صاحب النقلة بعد النقلة، والوقت المحتسب عليها، بأعشار الثانية (مع الاقتطاع). وتُحذف القيمة إذا لم تكن في السجل. وبعد النقلة الأخيرة يأتي سبب النهاية بالكلمات، ثم النتيجة.

        **الحدّ:** `public_read` (لكل لاعب مع رمز مميَّز، ولكل عميل من دونه).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: ملف PGN.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: 'قيمة الترويسة: `attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'نص PGN، بترميز UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: ليس عددًا صحيحًا موجبًا من 16 رقمًا على الأكثر (أقل من 2^53)؛ `invalid_request`: ليس ترميز URL صالحًا.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: أُرسل رمز مميَّز وهو غير صالح.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: لا توجد مباراة كهذه.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: الحدّ `public_read` أو رصيد الحساب.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: ومن أسبابه أن النقلات المخزّنة لا يمكن إعادة تنفيذها حتى النهاية المخزّنة (ويسجّل الخادم ذلك).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (بقيت قاعدة البيانات مقفلة؛ `retryAfter: 1` في الجسم، بلا ترويسة `Retry-After`)، `server_busy` (وجد البحث عن الجلسة قاعدة البيانات مقفلة)، `timeout`.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: تنزيل مباراة من هذا الخادم كصورة GIF متحركة
      description: |-
        المباراة كصورة GIF متحركة. الأسماء والتصنيفات هي تلك الواردة في سجل المباراة (التصنيفات عند البداية، والحساب المحذوف باسم `deleted#<id>`)، وكذلك النتيجة وطريقة الانتهاء (`Resignation`، `Loss on time`...).

        تجري الفحوص بهذا الترتيب: `gif_disabled`، ثم خيارات الصورة (`size` و`orientation` و`delay` و`coords`)، ثم معرّف المباراة، ثم المباراة، ثم طولها.

        **الجلسة مطلوبة:** تُحتسب الحصص لكل حساب. **الحدود:** `gif` في كل طلب؛ و`gif_user_min` و`gif_user_hour` و`gif_ip_min` و`gif_ip_hour` فقط حين يجب إنشاء صورة GIF (راجع وصف القسم). **المهلة الزمنية:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 ثوانٍ (45 ثانية افتراضيًا).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 'حجم الصورة: `small` (مربعات 32 بكسل)، أو `medium` (48 بكسل)، أو `large` (72 بكسل).'
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: الجهة التي تكون في أسفل الرقعة.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: الملّي ثواني لكل نقلة (من 1 إلى 6 أرقام عشرية).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: هل تُرسم أحرف الأعمدة وأرقام الصفوف حول الرقعة (`1`) أم لا (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` مع `field` (`size` أو `orientation` أو `delay` أو `coords`): قيمة خارج القيم المسموح بها. `invalid_game_id`. `invalid_request`: ليس ترميز URL صالحًا.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: لا توجد مباراة كهذه. `gif_disabled`: عطّل الخادم صور GIF (`GIF_ENABLED=false`؛ ويُعاد رمز الحدّ `gif`).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: الحدّ `gif`، أو أحد حدود الرسم، أو رصيد الحساب.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: تعذّر إنشاء صورة GIF (ويسجّل الخادم السبب). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` مع `retryAfter` (من 3 إلى 10 ثوانٍ) و`Retry-After`: طابور الرسم ممتلئ، أو انتظرت صورة GIF مدة `GIF_QUEUE_TIMEOUT_MS` (10 ثوانٍ) خيطًا متاحًا؛ وتُعاد كل رموز الحدود التي أخذها الطلب. `busy`: بقيت قاعدة البيانات مقفلة (`retryAfter: 1` في الجسم فقط). `timeout`.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: إنشاء صورة GIF متحركة لأي مباراة تُرسَل بصيغة PGN
      description: |-
        الصورة نفسها التي ينتجها `GET /games/{id}/gif`، لأي مباراة تُرسَل كنص PGN: مباراة حفظتها اللعبة، أو ملف مصدَّر من موقع آخر، أو مباراة مكتوبة يدويًا. ولا تُستخدم إلا المباراة الأولى في النص.

        - يقبل قارئ PGN ما يقبله قارئ اللعبة نفسها: كل ملف PGN يكتبه هذا الخادم، والملفات المصدَّرة المعتادة من المواقع الأخرى (تُتخطّى التعليقات والمتغيرات ورموز NAG وتعليقات الساعة؛ وتُقرأ أرقام النقلات وترميز SAN بتساهل؛ ويعطي الوسم `FEN` وضعية البداية ما لم تكن قيمة `SetUp` هي `"0"`).
        - تؤخذ الأسماء والتصنيفات من الوسوم `White` و`Black` و`WhiteElo` و`BlackElo`. وتُجرَّد الأحرف ذات العلامات الصوتية من علاماتها، وتصبح المحارف الأخرى الواقعة خارج ASCII القابل للطباعة `?`، وتُقتطع الأسماء الطويلة (48 محرفًا). وتؤخذ النتيجة من الوسم `Result`، وإلا فمن نهاية نص النقلات. ويُعرض الوسم `Termination` ما لم تكن قيمته `normal`: إذ تروي الوضعية الأخيرة حينئذٍ ما حدث (كش مات، جمود).
        - تفحص نقطة النهاية هذه جسمها بنفسها: الحقل غير المعروف، أو غياب `pgn` أو كونه غير نصي، يكون الرد عليه 400 `invalid_request` مع `field`؛ والخيار الخاطئ يكون الرد عليه 400 `invalid_option` (يجب أن يكون `delayMs` عددًا في JSON، و`coords` قيمة منطقية؛ وتُرفض `null`).

        **الجلسة مطلوبة:** تُحتسب الحصص لكل حساب. **الحدود:** كما في `GET /games/{id}/gif`. **حدّ الجسم:** 135,168 بايت، أيًّا كانت قيمة `HTTP_BODY_LIMIT` (يُحتسب ملف PGN كسلسلة JSON، بما فيها محارف الهروب). **المهلة الزمنية:** 45 ثانية افتراضيًا.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: مباراة قصيرة مكتوبة يدويًا، من دون إحداثيات
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: ملف PGN مع كل الخيارات
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` مع `field` (حقل غير معروف، أو `pgn` غائب أو ليس سلسلة نصية؛ ومن دون `field` عندما لا يكون الجسم كائنًا)؛ `invalid_json`؛ `invalid_option` مع `field` (`size` أو `orientation` أو `delayMs` أو `coords`)؛ `invalid_pgn` مع `line` و`column` (بدءًا من 1، والأعمدة بالمحارف) و`message` من القارئ: نقلة غير قانونية أو ملتبسة، أو وسم معطوب، أو نوع شطرنج غير معروف، أو أكثر من 65,536 بايت.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: عطّل الخادم صور GIF (`GIF_ENABLED=false`؛ ويُعاد رمز الحدّ `gif`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: جسم يتجاوز 135,168 بايت.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: الحدّ `gif`، أو أحد حدود الرسم، أو رصيد الحساب.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: تعذّر إنشاء صورة GIF (ويسجّل الخادم السبب). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` مع `retryAfter` (من 3 إلى 10 ثوانٍ) و`Retry-After`: طابور الرسم ممتلئ، أو انتظرت صورة GIF طويلًا جدًا خيطًا متاحًا؛ وتُعاد كل رموز الحدود التي أخذها الطلب. `timeout`. وكذلك `server_busy` مع `retryAfter` من 2 إلى 5: لدى قاعدة البيانات كتابات منتظرة أكثر مما ينبغي، ولم يُنفَّذ الطلب.'
