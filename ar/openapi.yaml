          description: النموذج من جديد مع الخطأ (كلمتا المرور مختلفتان، أو كلمة مرور ضعيفة)، أو الرابط غير صالح، أو النموذج غير صالح (صفحة HTML).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: الحدّ `auth` أو `auth_reset` (صفحة HTML)، أو النموذج من جديد مع `Retry-After` عندما يكون لهذا العميل عدد كبير جدًا من عمليات تجزئة كلمات المرور في الانتظار (ويبقى الرابط صالحًا)، أو طبقة الحدّ حسب العنوان (`rate_limited` بصيغة JSON).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'النموذج من جديد مع `Retry-After` عندما يكون الخادم مشغولًا (طابور تجزئة كلمات المرور، أو بقيت قاعدة البيانات مقفلة)؛ ويبقى الرابط صالحًا. وحين يكون لدى قاعدة البيانات كتابات منتظرة أكثر مما ينبغي، تظهر بدلًا من ذلك صفحة "Server error" (خطأ في الخادم) مع `Retry-After` (من 2 إلى 5): لم يُنفَّذ شيء ويبقى الرابط صالحًا. وكذلك عند انتهاء مهلة معالج الطلب.'
