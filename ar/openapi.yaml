paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: الحصول على اسم الخادم وإصداراته ومنافذه وقواعد إنشاء الحساب
      description: |-
        ما يحتاج إليه العميل قبل أن يسجّل الدخول أو يتصل: اسم الخادم ومعرّفه، وإصدارات بروتوكول WebSocket ومكان WebSocket، وقواعد إنشاء الحساب، وأنظمة الوقت الرسمية، والحدود التي يستطيع العميل التحقق منها قبل إرسال نموذج.

        **الحدود:** طبقة الحدّ حسب العنوان فقط.
      security: []
      responses:
        '200':
          description: وصف الخادم.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: طبقة الحدّ حسب العنوان.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: إنشاء حساب
      description: |-
        ينشئ حسابًا: بعد تأكيد عنوان بريده الإلكتروني بالرابط المرسَل إليه، أو فورًا إذا لم يكن تأكيد البريد الإلكتروني مطلوبًا.

        **مع تأكيد البريد الإلكتروني** (`REQUIRE_EMAIL_VERIFICATION`، وهو الإعداد الافتراضي): 202 `verification_sent`. لا يوجد حساب بعد: ينتظر طلب التسجيل 24 ساعة ويحجز اسم المستخدم خلالها. ويُرسَل إلى العنوان رابط صالح طوال هذه الساعات الـ 24، بحد أقصى رابط واحد لكل عنوان كل 5 دقائق (يرسل `POST /auth/verify-email/resend` رابطًا جديدًا)؛ ويُنشأ الحساب، بعنوان مؤكَّد، عند استخدام الرابط (زر الصفحة `/verify-email`)، ويستطيع اللاعب عندئذٍ تسجيل الدخول. وحتى ذلك الحين يكون الرد على تسجيل الدخول باسم المستخدم هذا `invalid_credentials`، كما في الحساب غير المعروف، ولا يوجد ملف شخصي عام. وطلب التسجيل الجديد بالعنوان نفسه يحل محل الطلب المنتظر. ويكون الرد نفسه عندما يستخدم حساب آخر العنوان بالفعل: لا يُرسَل رابط حينئذٍ، بل يتلقى صاحب ذلك الحساب إشعارًا بدلًا منه (إشعارًا واحدًا في الساعة على الأكثر)، ويُحجز اسم المستخدم بالطريقة نفسها، كي لا يكشف شيءٌ هل للعنوان حساب. وطلب التسجيل الذي لم يُستخدم رابطه يُسقَط بعد 24 ساعة، ويصبح اسم المستخدم متاحًا من جديد.

        **من دون تأكيد البريد الإلكتروني** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`، ويُنشأ الحساب فورًا ويمكنه تسجيل الدخول.

        **القواعد.** `username`: من `USERNAME_MIN` إلى `USERNAME_MAX` محرفًا (من 3 إلى 20)، من الأحرف والأرقام و`_` و`-`، ويبدأ بحرف أو رقم (يعطيها `GET /info` في `limits`)؛ وتُرفض الأسماء المحجوزة (`admin` و`moderator` و`deleted`...) وبعض البادئات؛ وهو فريد بصرف النظر عن حالة الأحرف. `email`: تُزال المسافات من طرفيه ويُخزَّن بأحرف صغيرة، بمحارف ASCII عادية ونطاق يحتوي على نقطة. `password`: `PASSWORD_MIN_LENGTH` (10) محارف على الأقل و256 بايت من UTF-8 على الأكثر؛ ويجب ألا تحتوي على اسم المستخدم ولا على الجزء المحلي من عنوان البريد الإلكتروني، وألا تكون كلمة مرور شائعة.

        **الأخطاء**، وتُفحص بهذا الترتيب: 403 `registration_closed`؛ 400 `invalid_username`؛ 400 `invalid_email`؛ 400 `weak_password`؛ 409 `username_taken`؛ 428 `pow_required`؛ أخطاء طابور تجزئة كلمات المرور؛ 409 `email_taken` (من دون تأكيد البريد الإلكتروني فقط).

        **الحدود:** `auth`، ثم `auth_register` (10 تسجيلات في الساعة لكل عميل). **إثبات العمل:** دائمًا، عندما تكون قيمة `POW_REGISTER_BITS` أكبر من 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: المحاولة الأولى، من دون إثبات عمل
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: إعادة الإرسال مع إثبات العمل
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: أُنشئ الحساب ويمكنه تسجيل الدخول (لا تأكيد للبريد الإلكتروني على هذا الخادم).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: ينتظر طلب التسجيل استخدام رابط تأكيده (أو أن للعنوان حسابًا بالفعل؛ والرد لا يكشف ذلك).
          headers:
