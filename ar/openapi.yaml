  - name: pages
    x-displayName: صفحات HTML
    description: |-
      صفحات للمتصفح، تُفتح من روابط رسائل البريد الإلكتروني. تشير روابطها إلى `https://<SERVER_PUBLIC_HOST>` (مع `:<PUBLIC_API_PORT>` حين لا يكون 443)، خارج `/api/v1`.

      - لا تشغّل الصفحات أي شيفرة JavaScript ولا تحمّل أي مورد خارجي. وتُقدَّم مع `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'`.
      - لا يعرض `GET` إلا زرًّا أو نموذجًا، كي لا يستهلك ماسحُ البريد الذي يفتح الرابطَ هذا الرابط. ويحدث التغيير عند `POST`: نموذج يُرسَل بصيغة `application/x-www-form-urlencoded` (ويُقبل جسم JSON أيضًا)، مع الرمز المميَّز للرابط في حقل مخفي. ويُرفض الحقل المكرر.
      - الأخطاء (حدود المعدّل، والحقول غير الصالحة) هي أيضًا صفحات HTML، بعنوان "Request refused" (رُفض الطلب) أو، ابتداءً من 500، "Server error" (خطأ في الخادم). ولا تردّ بصيغة JSON إلا الإخفاقات التي تُكتشف قبل مطابقة الصفحة (هدف طلب طويل جدًا أو مشوّه، وطبقة الحدّ حسب العنوان).
