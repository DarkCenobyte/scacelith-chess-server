      summary: التحقق من أن العملية تعمل
      description: |-
        يردّ بـ 200 `ok` ما دامت العملية تعمل. ويعمل `HEAD` أيضًا. وأي طريقة أخرى يكون الرد عليها 405 `method_not_allowed` مع `Allow: GET, HEAD` (بما في ذلك `OPTIONS`).

        **الحدود:** طبقة الحدّ حسب العنوان فقط.
      security: []
      responses:
        '200':
          description: العملية تعمل.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
              example:
                status: ok
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: طبقة الحدّ حسب العنوان.'
  /readyz:
    servers:
      - url: https://caissa.scacelith.com
        description: الخادم الرسمي، في الجذر.
      - url: https://caissa.scacelith.com/api/v1
        description: الخادم الرسمي، تحت `/api/v1`.
      - url: https://{host}:{port}
        description: أي خادم Scacelith، في الجذر.
        variables:
          host:
            default: caissa.scacelith.com
            description: اسم المضيف العام للخادم (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: منفذ API العام (`PUBLIC_API_PORT`، وإلا فـ `API_PORT`).
      - url: https://{host}:{port}/api/v1
        description: أي خادم Scacelith، تحت `/api/v1`.
        variables:
          host:
            default: caissa.scacelith.com
            description: اسم المضيف العام للخادم (`SERVER_PUBLIC_HOST`).
          port:
            default: "443"
            description: منفذ API العام (`PUBLIC_API_PORT`، وإلا فـ `API_PORT`).
    get:
      operationId: getReadiness
      tags:
        - health
      summary: التحقق من أن الخادم يستقبل اللاعبين
      description: |-
        يردّ بـ 200 `ready` عندما يستقبل الخادم اللاعبين، وبـ 503 `not_ready` أثناء بدء تشغيله أو إيقافه. ويعمل `HEAD` أيضًا. وأي طريقة أخرى يكون الرد عليها 405 `method_not_allowed` مع `Allow: GET, HEAD` (بما في ذلك `OPTIONS`).

        **الحدود:** طبقة الحدّ حسب العنوان فقط.
      security: []
      responses:
        '200':
          description: الخادم يستقبل اللاعبين.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: طبقة الحدّ حسب العنوان.'
        '503':
          description: الخادم قيد بدء التشغيل أو الإيقاف.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: not_ready
              example:
                status: not_ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        رمز جلسة مميَّز (`sct_` متبوعًا بـ 43 محرفًا بترميز base64url) من رد تسجيل الدخول، في الترويسة `Authorization`: `Authorization: Bearer <token>`. والبادئة هي `Bearer` بالضبط (مع مراعاة حالة الأحرف) تليها مسافة واحدة؛ والقيمة التي لا تحملها، أو الرمز المميَّز الذي ليس من 1 إلى 512 محرفًا من محارف ASCII القابلة للطباعة، يكون الرد عليهما 401 `invalid_token` كأي رمز مميَّز آخر غير صالح. والترويسة الفارغة تُعدّ كأنها غير موجودة.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: معرّف المباراة، عدد صحيح عشري موجب من 16 رقمًا على الأكثر بلا أصفار بادئة، أقل من 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: معرّف الجلسة، كما يعطيه `GET /auth/sessions`، مكتوبًا بلا أصفار بادئة (`03` ليس الجلسة 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: اسم مستخدم اللاعب، بصرف النظر عن حالة الأحرف. ويقبل الخادم أي اسم من 2 إلى 24 محرفًا من `[A-Za-z0-9_.-]` (وهي أوسع قاعدة سمح بها في أي وقت).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: معرّف مباراة؛ ولا تُسرد إلا المباريات الأقدم منها. مرّر قيمة `next` من الصفحة السابقة. والقيمة الفارغة تُعدّ غائبة.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: حجم الصفحة، من 1 إلى 50. والعدد الأكبر المكوّن من 3 أرقام على الأكثر يُعدّ 50؛ والقيمة الفارغة تُعدّ غائبة.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: الرمز المميَّز لرابط البريد الإلكتروني (43 محرفًا بترميز base64url). وعند غيابه أو خطئه تُعرض صفحة "link invalid or expired" (الرابط غير صالح أو منتهي الصلاحية).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: كل ردود الخادم تمنع التخزين المؤقت.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: عدد الثواني التي يجب انتظارها قبل المحاولة من جديد؛ وهي القيمة نفسها الموجودة في `retryAfter` داخل الجسم.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: تحدي المصادقة من نوع Bearer، مع `error="invalid_token"` للرمز المميَّز غير الصالح.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: يغلق الخادم الاتصال بعد هذا الرد.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (مع `field` عندما يكون الخطأ في أحد حقول الجسم) أو `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: حقل يخالف المخطط
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: الجسم ليس JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: كلمة مرور ضعيفة
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: ملف PGN تتعذّر قراءته
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (لا توجد ترويسة `Authorization`) أو `invalid_token` (الرمز المميَّز مشوّه، أو منتهي الصلاحية، أو مُبطَل، أو يخص حسابًا محذوفًا).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: لا توجد جلسة
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: رمز مميَّز غير صالح
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: رُفض الطلب.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: كلمة مرور خاطئة عند إعادة المصادقة
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: حساب محظور
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found`، أو ميزة عطّلها هذا الخادم.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: لم يصل الجسم خلال 10 ثوانٍ. ويغلق الخادم الاتصال.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: يتعارض الطلب مع حالة الخادم.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: محاولة تسجيل الدخول عبر Google أو تذكرتها غير معروفة أو مستخدَمة أو منتهية الصلاحية؛ ابدأ من جديد من اللعبة.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: يتجاوز الجسم `HTTP_BODY_LIMIT` (16,384 بايت افتراضيًا). ويغلق الخادم الاتصال.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: يتجاوز هدف الطلب 4096 محرفًا.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: الجسم ليس `application/json`، أو ترميز محارفه ليس UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: في المباراة أكثر من `GIF_MAX_PLIES` (600) نصف نقلة.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: حُلّ التحدي `pow` وأرسل الطلب نفسه مرة أخرى مع `pow: { challenge, nonce }`. ويبيّن `reason` السبب: `required` أو `malformed` أو `signature` أو `endpoint` أو `network` أو `expired` أو `bits` أو `work` أو `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (حدّ معدّل، أو رصيد الحساب، أو طابور تجزئة كلمات المرور) أو `too_many_attempts` (تقييد خاص بالحساب)، مع `retryAfter` وترويسة `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: حدّ معدّل
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: إخفاقات كثيرة جدًا على هذا الحساب
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: إخفاق غير متوقع. يسجّله الخادم.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: قيمة `state` أو `iss` خاطئة، أو رفض Google رمز التفويض أو أرسل رمزًا مميَّزًا للهوية لا يجتاز التحقق. ولا يحمل الرد أبدًا نص Google.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy` أو `busy` أو `timeout`: حاول مجددًا بعد `retryAfter` حين يكون موجودًا.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: الخادم مشغول
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: بقيت قاعدة البيانات مقفلة (عملية قراءة)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: استغرق الخادم وقتًا طويلًا جدًا
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: صورة GIF المتحركة، على شكل مرفق.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` لمباراة من هذا الخادم، و`attachment; filename="scacelith-game.gif"` لملف PGN مرسَل عبر `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: حجم الملف بالبايت.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: صفحة HTML.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: صفحة HTML تشرح سبب الرفض.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: لم يصل النموذج خلال 10 ثوانٍ (صفحة HTML). ويغلق الخادم الاتصال.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: صفحة HTML تشرح التعارض.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: يتجاوز النموذج `HTTP_BODY_LIMIT` (صفحة HTML). ويغلق الخادم الاتصال.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: الجسم ليس نموذجًا (`application/x-www-form-urlencoded`) ولا JSON، أو ترميز محارفه ليس UTF-8 (صفحة HTML).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: حدّ معدّل (صفحة HTML)، مع `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: إخفاق غير متوقع (صفحة HTML بعنوان "Server error" (خطأ في الخادم)). ويسجّله الخادم.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: الخادم مشغول (بقيت قاعدة البيانات مقفلة، مع `Retry-After`) أو استغرق وقتًا طويلًا جدًا (صفحة HTML بعنوان "Server error" (خطأ في الخادم)).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: الشكل الوحيد لكل ردود الأخطاء في واجهة API بصيغة JSON.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: رمز الخطأ بصيغة `snake_case`. وبناءً عليه يختار العميل ما يعرضه.
          examples:
            - rate_limited
        message:
          type: string
          description: جملة بالإنجليزية، مخصّصة للسجلات وللاستخدام الاحتياطي.
        retryAfter:
          type: integer
          minimum: 1
          description: عدد الثواني التي يجب انتظارها قبل المحاولة من جديد، ولا يوجد إلا في حالات الرفض التي تنتهي بمرور الوقت. ويحمل الرد حينها أيضًا ترويسة `Retry-After` بالقيمة نفسها، باستثناء الخطأ 503 `busy` في قراءات السجل والمباريات واللاعبين ولوحة المتصدرين.
        field:
          type: string
          description: الحقل أو معامل الاستعلام الذي فيه الخطأ (`invalid_request` و`invalid_option`، و`invalid_cursor` و`invalid_limit` و`invalid_filter` في `GET /account/games`). ويُكتب الحقل المتداخل بصيغة نقطية (`pow.nonce`).
        reason:
          type: string
          description: 'السبب: القاعدة التي تخالفها كلمة المرور في `weak_password`، أو سبب طلب إثبات العمل أو رفضه (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'في `banned` فقط: نهاية الحظر (بالملّي ثانية منذ حقبة يونكس)، و`null` للحظر الدائم.'
        line:
          type: integer
          minimum: 1
          description: 'في `invalid_pgn` فقط: سطر الخطأ، بدءًا من 1.'
        column:
          type: integer
          minimum: 1
          description: 'في `invalid_pgn` فقط: عمود الخطأ، بدءًا من 1، بالمحارف.'
    PowChallenge:
      type: object
      description: تحدي إثبات العمل (الحقل `pow` في الرد 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: التحدي الموقَّع، ويُعاد إرساله كما هو.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: عدد البتات الصفرية البادئة التي يجب أن تكون في `SHA-256(challenge + ":" + nonce)`.
        expiresAt:
          type: integer
          format: int64
          description: وقت انتهاء صلاحية التحدي (بالملّي ثانية منذ حقبة يونكس)، بعد 2 دقيقة من إصداره.
    PowAnswer:
      type: object
      description: الإجابة عن تحدي إثبات العمل.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: قيمة `challenge` من الرد 428، كما أُعطيت.
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: سلسلة عشرية من 20 رقمًا على الأكثر بحيث تبدأ `SHA-256(challenge + ":" + nonce)` بعدد `bits` من البتات الصفرية.
    ServerInfo:
      type: object
      description: ما يحتاج إليه العميل قبل أن يسجّل الدخول أو يتصل.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: اسم الخادم (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: معرّف UUID تحصل عليه قاعدة البيانات عند أول تشغيل لها. ويبقى كما هو عبر عمليات إعادة التشغيل. ويكون `null` عندما يتعذّر على قاعدة البيانات تقديمه.
        motd:
          type: string
          description: رسالة اليوم (`SERVER_MOTD`)، وقد تكون فارغة.
        protocol:
          type: object
          description: بروتوكول WebSocket (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: أقدم إصدار من البروتوكول يدعمه الخادم.
            max:
              type: integer
              minimum: 1
              description: أحدث إصدار من البروتوكول يدعمه الخادم.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: بصمة مخطط البروتوكول (أول 4 بايتات من تجزئة SHA-256 لصيغته المعيارية، كعدد صحيح بلا إشارة)؛ للعلم فقط.
            subprotocol:
              type: string
              description: معرّف البروتوكول الفرعي لـ WebSocket (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: منفذ WebSocket الذي يستخدمه اللاعبون (`PUBLIC_WS_PORT`، وإلا فـ `WS_PORT`، وإلا فـ `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: مسار WebSocket.
        registration:
          type: string
          enum:
            - open
            - closed
          description: هل يمكن إنشاء حسابات جديدة.
        emailVerification:
          type: boolean
          description: هل تؤكد الحسابات الجديدة عناوينها (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
          properties:
            google:
              type: boolean
              description: هل يُتاح تسجيل الدخول عبر Google.
        mfa:
          type: boolean
          const: true
          description: المصادقة الثنائية متاحة دائمًا.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: عدد بتات إثبات العمل التي يتطلبها التسجيل (0 إن لم يكن مطلوبًا).
        categories:
          type: array
          description: أنظمة الوقت الرسمية (المحتسبة) (`RATED_CATEGORIES`)، بترتيب الخادم. وأي نظام وقت آخر يكون `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: القواعد التي يستطيع العميل التحقق منها قبل إرسال نموذج.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: الحد الأدنى لطول اسم المستخدم (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: الحد الأقصى لطول اسم المستخدم (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: التعبير النمطي الذي يجب أن يطابقه اسم المستخدم الجديد.
            passwordMinLength:
              type: integer
              description: الحد الأدنى لطول كلمة المرور، بالمحارف (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: الحد الأقصى لطول كلمة المرور، بالبايتات في ترميز UTF-8.
            customTimeControls:
              type: boolean
              description: هل يجوز للتحديات والمباريات الخاصة استخدام أنظمة وقت مخصّصة.
            reportsPerDay:
              type: integer
              description: عدد البلاغات التي يجوز للاعب تقديمها كل 24 ساعة (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: أكبر حجم لرسالة WebSocket يجوز للعميل إرسالها، بالبايت.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 1852590473
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: نظام وقت رسمي.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 'معرّف الفئة: الدقائق وثواني الزيادة (`3+2`).'
        baseSec:
          type: number
          minimum: 0
          description: الوقت الأساسي، بالثواني.
        incSec:
          type: number
          minimum: 0
          description: الزيادة لكل نقلة، بالثواني.
    AccountView:
      type: object
      description: الحساب كما يراه لاعبه (`user` في ردود تسجيل الدخول وفي `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: معرّف الحساب.
        username:
          type: string
          description: اسم المستخدم.
        email:
          type: string
          format: email
          description: عنوان البريد الإلكتروني.
        emailVerified:
          type: boolean
          description: هل العنوان مؤكَّد.
        mfaEnabled:
          type: boolean
          description: هل المصادقة الثنائية مفعّلة.
        googleLinked:
          type: boolean
          description: هل هناك حساب Google مرتبط.
        hasPassword:
          type: boolean
          description: '`false` للحساب المُنشأ عبر Google الذي لم يعيّن كلمة مرور بعد.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: هل تُقبل التحديات المباشرة بالاسم (راجع `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: وقت إنشاء الحساب (بالملّي ثانية منذ حقبة يونكس).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: آخر تسجيل دخول (بالملّي ثانية منذ حقبة يونكس)، أو `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: العنوان الجديد في تغيير للبريد الإلكتروني ينتظر استخدام رابطه، أو `null`.
    SessionAnswer:
      type: object
      description: جلسة جديدة.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: رمز الجلسة المميَّز، للترويسة `Authorization` ولـ WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: النهاية المطلقة للجلسة (بالملّي ثانية منذ حقبة يونكس)؛ وقد يُنهيها حدّ الخمول قبل ذلك.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: الخطوة الثانية من تسجيل دخول بالمصادقة الثنائية؛ تابِع بـ `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: الرمز المميَّز للخطوة، لاستخدامه في `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: الثواني المتبقية لإكمال الخطوة.
    LoginAnswer:
      description: جلسة، أو الخطوة الثانية من تسجيل دخول بالمصادقة الثنائية.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: أول تسجيل دخول عبر Google؛ تابِع بـ `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: التذكرة لاستخدامها في `POST /auth/sso/complete`، صالحة مدة 10 دقائق.
        suggestedUsername:
          type: string
          description: اسم مستخدم مشتق من الاسم في Google أو من العنوان، أو `""` إن لم يصلح شيء.
    SsoNeedsPassword:
      type: object
      description: يستخدم العنوانَ حسابٌ له كلمة مرور؛ تابِع بـ `POST /auth/sso/google/link`. لم يُربط شيء بعد.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: التذكرة لاستخدامها في `POST /auth/sso/google/link`.
        username:
          type: string
          description: اسم المستخدم لذلك الحساب (لا يراه إلا من أثبت ملكيته للعنوان لدى Google).
        expiresIn:
          type: integer
          const: 600
          description: عدد الثواني التي تبقى فيها التذكرة صالحة.
    SsoFinishAnswer:
      description: رد `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: محاولة تسجيل دخول عبر Google.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: المحاولة، لاستخدامها في `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: عنوان URL الخاص بـ Google الذي يُفتح في متصفح النظام، بعد التحقق منه.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: قيمة `state` التي يجب أن يعيدها Google.
        expiresIn:
          type: integer
          const: 600
          description: عدد الثواني التي تبقى فيها المحاولة صالحة.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: اسم المستخدم؛ وتنطبق عليه قواعد الخادم (راجع الوصف).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: عنوان البريد الإلكتروني. تُزال المسافات من طرفيه ويُخزَّن بأحرف صغيرة.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: كلمة المرور؛ وتنطبق عليها قواعد كلمات المرور.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: اسم المستخدم، أو عنوان البريد الإلكتروني (أي نص يحتوي على `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: اختياري. يُعرض في قائمة الأجهزة المسجَّل الدخول منها (مثل `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: قيمة `mfaToken` من رد تسجيل الدخول (أو من رد تسجيل الدخول عبر Google).
        code:
          type: string
          maxLength: 32
          description: اختياري. رمز تطبيق مصادقة من 6 أرقام، أو رمز استرداد.
        recoveryCode:
          type: string
          maxLength: 32
          description: اختياري. رمز استرداد. ويلزم أحد `code` و`recoveryCode`.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: عنوان البريد الإلكتروني.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: المعامل `token` في رابط إعادة التعيين.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: كلمة المرور الجديدة؛ وتنطبق عليها قواعد كلمات المرور في التسجيل.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: تحدي PKCE بطريقة S256 لقيمة `codeVerifier` الخاصة بالعميل (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: منفذ مستمع العميل على `127.0.0.1`.
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: قيمة `attemptId` من `POST /auth/sso/google/start`.
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: مُحقِّق PKCE؛ ويجب أن تطابق تجزئته SHA-256 التحدي المُعطى لـ `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: قيمة `state` كما أعادها Google.
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: قيمة `code` كما أعادها Google (محارف ASCII قابلة للطباعة بلا مسافات).
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: اختياري. قيمة `iss` كما أعادها Google، إن أعادها.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: قيمة `linkTicket` من `finish`، صالحة مدة 10 دقائق.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: كلمة مرور الحساب.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: قيمة `ssoTicket` من `finish`، صالحة مدة 10 دقائق.
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: اسم المستخدم؛ وتنطبق قواعد التسجيل.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: الجلسات النشطة، بدءًا بالأحدث استخدامًا.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: جلسة نشطة (جهاز مسجَّل الدخول منه).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: معرّف الجلسة، لاستخدامه في `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: وقت تسجيل الدخول (بالملّي ثانية منذ حقبة يونكس).
        lastSeenAt:
          type: integer
          format: int64
          description: آخر استخدام (بالملّي ثانية منذ حقبة يونكس)، ويُحدَّث مرة كل 5 دقائق على الأكثر.
        expiresAt:
          type: integer
          format: int64
          description: النهاية المطلقة (بالملّي ثانية منذ حقبة يونكس)؛ وقد يُنهي حدّ الخمول الجلسة قبل ذلك.
        clientLabel:
          type:
            - string
            - 'null'
          description: قيمة `clientLabel` المرسلة عند تسجيل الدخول، أو `null` إن لم تُرسَل أي قيمة.
        current:
          type: boolean
          description: هل هذه هي الجلسة التي تقدّم الطلب.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: سجل واحد لكل فئة لعب فيها اللاعب مباريات محتسبة.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: العقوبات السارية.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }` ما دام الحساب محظورًا، وإلا `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: سجل التصنيف لفئة واحدة.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: معرّف الفئة.
        rating:
          type: integer
          description: التصنيف.
        games:
          type: integer
          minimum: 0
          description: المباريات الملعوبة في الفئة (محتسبة أو غير محتسبة في التصنيف).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: أعلى تصنيف بلغه اللاعب.
        provisional:
          type: boolean
          description: '`true` ما دام اللاعب غير مصنَّف بعد في هذه الفئة، أو ما دامت له أقل من `PROVISIONAL_GAMES` مباراة محتسبة (وتعرضه اللعبة بالشكل `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: نوع العقوبة.
        reason:
          type:
            - string
            - 'null'
          description: السبب المذكور، إن وُجد.
        startsAt:
          type: integer
          format: int64
          description: البداية (بالملّي ثانية منذ حقبة يونكس).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: النهاية (بالملّي ثانية منذ حقبة يونكس)، و`null` عندما تكون العقوبة دائمة.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: نهاية الحظر (بالملّي ثانية منذ حقبة يونكس)، و`null` عندما يكون دائمًا.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` لقبول التحديات المباشرة بالاسم، و`none` لرفضها.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: كلمة المرور الحالية.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: كلمة المرور الجديدة؛ وتنطبق عليها قواعد كلمات المرور في التسجيل.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: كلمة مرور الحساب.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: رمز مولَّد من السر المعلّق، من 6 أرقام بالضبط.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: كلمة مرور الحساب.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: اختياري؛ ويلزم مع المصادقة الثنائية (أو `recoveryCode`). رمز من تطبيق المصادقة، أو رمز استرداد.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: اختياري. رمز استرداد (`xxxx-xxxx-xx`؛ ولا أهمية لحالة الأحرف ولا للمسافات والشرطات).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: كلمة مرور الحساب.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: رمز من تطبيق المصادقة (ويُرفض رمز الاسترداد).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: العنوان الجديد؛ تُزال المسافات من طرفيه ويُحوَّل إلى أحرف صغيرة، ثم يُفحص كما يُفحص عنوان التسجيل.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: كلمة مرور الحساب.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: اختياري؛ ويلزم مع المصادقة الثنائية (أو `recoveryCode`). رمز من تطبيق المصادقة، أو رمز استرداد.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: اختياري. رمز استرداد.
    TotpSetup:
      type: object
      description: السر المعلّق لتطبيق المصادقة.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: السر بترميز base32، لكتابته في التطبيق.
        uri:
          type: string
          format: uri
          description: عنوان URI بالصيغة `otpauth://totp/...`، لعرضه رمز QR.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: عدد الثواني في كل خطوة زمنية.
    RecoveryCodeList:
      type: array
      description: رموز الاسترداد الـ 10، تُعرض هذه المرة فقط. ويعمل كلٌّ منها مرة واحدة.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: جهة واحدة من المباراة.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: الاسم في سجل المباراة (`deleted#<id>` للحساب المحذوف).
        rating:
          type:
            - integer
            - 'null'
          description: التصنيف عند البداية، و`null` إن كان غير معروف.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: التصنيف بعد المباراة. ويوجد دائمًا في المباراة المحتسبة؛ ولا يكون `null` إلا في مباراة لا تُحتسب في التصنيفات (ودية، أو بنظام وقت مخصّص، أو ملغاة).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: تغيّر التصنيف، و`0` حين تُبقي قواعد التصنيف التصنيفَ على حاله (قاعدة النتيجة الصفرية لدى FIDE، أو خصم غير مصنَّف، أو المباريات الأولى للاعب غير مصنَّف)؛ ويكون `null` في الحالات نفسها التي يكون فيها `ratingAfter` كذلك.
    GameSummary:
      type: object
      description: ملخص مباراة مخزّنة.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: معرّف المباراة.
        category:
          type: string
          description: معرّف الفئة الرسمية (`3+2`)، أو `custom`.
        rated:
          type: boolean
          description: هل تُحتسب المباراة في التصنيفات.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: نظام الوقت بالثواني (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`، 2 `BlackWins`، 3 `Draw`، 4 `Aborted` (راجع رموز المباريات).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: رمز سبب النهاية (راجع رموز المباريات).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: النتيجة، و`*` للمباراة الملغاة.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: عدد أنصاف النقلات.
        startedAt:
          type: integer
          format: int64
          description: البداية (بالملّي ثانية منذ حقبة يونكس).
        endedAt:
          type: integer
          format: int64
          description: النهاية (بالملّي ثانية منذ حقبة يونكس).
    Termination:
      type: string
      description: اسم سبب النهاية (راجع رموز المباريات)؛ و`Unknown` للرمز الذي لا يعرفه البروتوكول.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: ملخص مباراة من جهة أحد اللاعبين.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: جهة اللاعب.
    HistoryGameSummary:
      description: مباراة من سجل اللاعب المسجَّل الدخول.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: الوقت الأساسي بالملّي ثانية.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: الزيادة بالملّي ثانية.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: النتيجة من جهة اللاعب.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: مباريات الصفحة، بدءًا بالأحدث.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: المعرّف الذي يُمرَّر في `before` للحصول على الصفحة التالية، أو `null` في الصفحة الأخيرة.
        total:
          type: integer
          minimum: 0
          description: عدد المباريات المطابقة لعامل التصفية، عبر كل الصفحات.
    MoveRecord:
      type: object
      description: نصف نقلة واحد من المباراة.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: النقلة بترميز UCI، مع إضافة `n` أو `b` أو `r` أو `q` عند الترقية.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: الوقت المحتسب على النقلة (بالملّي ثانية)، و`null` إن لم يكن في السجل.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: ساعة صاحب النقلة بعد النقلة (بالملّي ثانية)، و`null` إن لم تكن في السجل.
    PgnTagsView:
      type: object
      description: وسوم PGN الرئيسية، للعرض. و`Termination` هنا هو اسم سبب النهاية؛ أما ملف PGN فيستخدم القيم القياسية لـ PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` أو `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: 'القيمة `SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: تاريخ البداية بتوقيت UTC.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: التصنيف عند البداية، أو `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: التصنيف عند البداية، أو `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: سجل مباراة بنقلاتها وساعاتها. وله حقول ملخص المباراة، من دون `color` و`outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: الوقت الأساسي بالملّي ثانية.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: الزيادة بالملّي ثانية.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: اسم `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: معرّف المباراة التي تكون هذه المباراة إعادةً لها، أو `null`.
            moves:
              type: array
              description: عنصر واحد لكل نصف نقلة.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: فقط عندما يكون صاحب الرمز المميَّز قد لعب هذه المباراة؛ وهو جهته.
            reportable:
              type: boolean
              description: فقط عندما يكون صاحب الرمز المميَّز قد لعب هذه المباراة؛ و`true` عندما يقبل `POST /reports` الآن بلاغًا عن الخصم في هذه المباراة (انتهت المباراة خلال 7 أيام، ولم تُستنفد الحصة اليومية، ولم يُبلَّغ عن الخصم بعد في هذه المباراة).
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: اسم المستخدم، كما كتبه اللاعب.
        createdAt:
          type: integer
          format: int64
          description: وقت إنشاء الحساب (بالملّي ثانية منذ حقبة يونكس).
        ratings:
          type: array
          description: الفئات الرسمية فقط، بترتيب الخادم.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: كل مباراة مخزّنة، بما فيها الودية والملغاة.
            rated:
              type: integer
              minimum: 0
              description: المباريات المحتسبة، مجموعةً من سجلات التصنيف.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: اسم المستخدم، كما كتبه اللاعب.
        games:
          type: array
          description: مباريات الصفحة، بدءًا بالأحدث.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: معرّف آخر مباراة كلما امتلأت الصفحة (وقد تكون الصفحة التالية حينئذٍ فارغة)، وإلا `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: معرّف الفئة.
        minGames:
          type: integer
          minimum: 0
          description: عدد المباريات المحتسبة الذي يحتاج إليه السجل كي يُدرج في القائمة (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: وقت حساب اللوحة (بالملّي ثانية منذ حقبة يونكس).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: نص PGN، بحد أقصى 65,536 بايت من UTF-8. ولا تُستخدم إلا المباراة الأولى.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: اختياري. حجم الصورة.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: اختياري. الجهة التي تكون في أسفل الرقعة.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: اختياري. الملّي ثواني لكل نقلة، عدد في JSON ذو قيمة صحيحة.
        coords:
          type: boolean
          default: true
          description: اختياري. هل تُرسم أحرف الأعمدة وأرقام الصفوف حول الرقعة.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: المباراة، كعدد صحيح أو كسلسلة من 1 إلى 16 رقمًا.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: اسم مستخدم الخصم، كما في سجل المباراة أو كما هو الآن، بصرف النظر عن حالة الأحرف. ولا يجوز أن يكون فارغًا.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: موضوع البلاغ.
        comment:
          type:
            - string
            - 'null'
          description: اختياري. 500 محرف على الأكثر بعد إزالة محارف التحكم (عدا الجدولة ومحرف السطر الجديد) وإزالة المسافات من طرفي النص.
    AccountExport:
      type: object
      description: كل ما يحتفظ به الخادم عن الحساب (والأوقات بالملّي ثانية منذ حقبة يونكس).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: وقت إجراء التصدير.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: 'القيمة `SERVER_NAME`.'
            host:
              type: string
              description: 'القيمة `SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: ما يتضمنه الملف وما يستبعده، بلغة إنجليزية بسيطة موجّهة إلى اللاعب.
          items:
            type: string
        account:
          description: عرض الحساب الذي يعطيه `GET /account/me`، مع `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: عنوان حساب Google المرتبط، أو `null`.
        ratings:
          type: array
          description: سجلات التصنيف الكاملة.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: نقاط التصنيف المُعادة بعد ثبوت غش أحد الخصوم، مجموعةً لكل يوم (بتوقيت UTC) ولكل فئة، بدءًا بالأحدث. ولا تُذكر المباريات ولا الغشاشون.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: كل جلسة مخزّنة، بدءًا بالأحدث، من دون أي رمز مميَّز. وتحذف عملية التنظيف الدورية عند انتهاء مدة الاحتفاظ الجلسةَ المنتهية الصلاحية، والجلسةَ التي سُجّل الخروج منها بعد يوم من تسجيل الخروج.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: أحداث الأمان، بدءًا بالأحدث، ويُحتفظ بها مدة `RETENTION_SECURITY_DAYS`.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: كل العقوبات، بما فيها المرفوعة. ولا يُدرج اسم المشرف أبدًا.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: أحداث السلوك المسجَّلة لمباريات اللاعب المتروكة والملغاة وتلك التي لم يلعب فيها نقلته الأولى في الوقت، ويُحتفظ بها 30 يومًا.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: البلاغات التي قدّمها اللاعب.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: عدد المباريات.
            list:
              type: array
              description: كل مباراة، بدءًا بالأحدث، على شكل الملخصات التي يعطيها `GET /account/games`. والنقلات متاحة في `GET /games/{id}` وملف PGN في `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: سجل تصنيف كامل.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: هل تجاوز اللاعب مرحلة عدم التصنيف.
            countedGames:
              type: integer
              minimum: 0
              description: المباريات التي دخلت في حساب التصنيف.
            updatedAt:
              type: integer
              format: int64
              description: آخر وقت تغيّر فيه السجل.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: الساعة 00:00 بتوقيت UTC من اليوم (بالملّي ثانية منذ حقبة يونكس).
        category:
          type: string
        points:
          type: integer
          description: النقاط المُعادة في ذلك اليوم في تلك الفئة.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: وقت تسجيل الخروج من الجلسة، أو `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: عنوان تسجيل الدخول، ويُمحى بعد `RETENTION_IP_DAYS`.
    SecurityEvent:
      type: object
      description: |-
        حدث أمان. لا يُعطى `ip` إلا لما جرى أثناء تسجيل الدخول، أو بكلمة مرور الحساب (وعامله الثاني)، أو برابط أُرسل إلى عنوانه: `register`، و`email_verified`، و`login`، و`sso_login`، و`sso_linked`، و`sso_account_created`، و`recovery_code_used`، و`password_reset`، و`password_changed`، و`reauth_failed`، و`mfa_setup_started`، و`mfa_enabled`، و`mfa_disabled`، و`recovery_codes_regenerated`، و`session_revoked`، و`sessions_revoked_all`، و`email_change_requested`، و`email_changed`، و`email_change_refused`، و`account_exported`؛ أما كل الأنواع الأخرى فلها `ip: null`، ويُمحى `ip` بعد `RETENTION_IP_DAYS`.

        لا يحتفظ `detail` إلا بالحقول التالية: `login`: `method`؛ `sso_login` و`sso_account_created`: `provider`؛ `sso_linked`: `provider` و`method` (`password` أو `password+totp`)؛ `login_failed`: `failures`؛ `login_lockout`: `retryAfterMs`؛ `mfa_failed`: `attempts`؛ `recovery_code_used`: `remaining`؛ `reauth_failed`: `factor`؛ `session_revoked` و`sessions_revoked_all`: `reason`؛ `email_change_refused`: `reason`؛ `sanction_auto`: `kind` و`gameId` و`until`. ولا يحتفظ حدث `moderator_action` إلا بـ `{ action }`، للإجراءات `ban` و`unban` و`reset_mfa` و`verify_email` و`revoke_sessions` (وتُستبعد إجراءات المشرفين الأخرى). وكل الأنواع الأخرى لها `detail: null`. وتُستبعد أحداث `rating_refund`: فنقاطها موجودة في `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: نوع الحدث (`login`، `password_changed`...).
        at:
          type: integer
          format: int64
          description: وقت وقوعه.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: الاسم العام الحالي للاعب المبلَّغ عنه.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: هل ما زال البلاغ مفتوحًا (ولا يُذكر هل عوقب اللاعب المبلَّغ عنه).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: الرمز المميَّز لرابط البريد الإلكتروني (الحقل المخفي في نموذج الصفحة).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: الرمز المميَّز لرابط إعادة التعيين (الحقل المخفي في النموذج).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: كلمة المرور الجديدة؛ وتنطبق عليها قواعد كلمات المرور في التسجيل.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: كلمة المرور الجديدة مرة أخرى؛ ويجب أن تكون مطابقة.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: صفحة HTML بترميز UTF-8 (`text/html; charset=utf-8`)، من دون JavaScript ولا موارد خارجية.
