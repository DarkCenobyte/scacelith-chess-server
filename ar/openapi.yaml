  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: إعادة إرسال رابط التأكيد
      description: |-
        يعيد إرسال رابط تأكيد البريد الإلكتروني. ويكون الرد 202 `accepted` أيًّا كان العنوان، كي لا يكشف أبدًا هل يستخدمه حساب أو طلب تسجيل.

        لا يكون للطلب أثر إلا مرة واحدة على الأكثر كل 5 دقائق لكل عنوان. وطلب التسجيل المنتظر بهذا العنوان يستعيد مهلته البالغة 24 ساعة كاملة، سواء أكان حساب آخر يستخدم العنوان أم لا، كي يبقى اسم المستخدم محجوزًا المدة نفسها في الحالتين. ولا يُرسَل رابط إلا لطلب التسجيل هذا حين لا يكون للعنوان حساب (ويحل رابط جديد صالح 24 ساعة محل الرابط السابق)، أو لحساب نشط غير مؤكَّد بهذا العنوان.

        **الحدود:** `auth`، ثم `auth_mail` (10 في الساعة لكل عميل).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: مقبول (أيًّا كان العنوان).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: الحدّ `auth` أو `auth_mail` (أيًّا كان العنوان).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` مع `retryAfter: 1`: بقيت قاعدة البيانات مقفلة أثناء البحث عن الحساب (تجديد طلب التسجيل المنتظر يتم بقدر الإمكان ولا يُفشل الطلب أبدًا). `timeout`. وكذلك `server_busy` مع `retryAfter` من 2 إلى 5: لدى قاعدة البيانات كتابات منتظرة أكثر مما ينبغي، ولم يُنفَّذ الطلب.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: إرسال رابط لإعادة تعيين كلمة المرور
      description: |-
        يرسل رابطًا لإعادة تعيين كلمة المرور، صالحًا مدة ساعة واحدة، يفتح الصفحة `/reset-password`. ويكون الرد 202 `accepted` أيًّا كان العنوان. ولا يُرسَل الرابط إلا إلى حساب نشط، مرة كل 5 دقائق على الأكثر لكل عنوان. وبهذه الطريقة يعيّن الحساب المعتمد على Google وحده كلمة مروره الأولى.

        لاستعادة كلمة المرور أشد حدود الواجهة صرامة، وكلها تُحتسب على مستوى الخادم بأكمله: 3 طلبات في الساعة (`AUTH_FORGOT_PER_HOUR`) و10 طلبات في 24 ساعة (`AUTH_FORGOT_PER_DAY`) لكل عميل (عنوان IPv4 أو شبكة IPv6 /64)، و3 أضعاف هذه الأعداد لكل IPv6 /48، إضافةً إلى الحدّ `auth` (20 كل 10 دقائق) ورسالة واحدة لكل عنوان كل 5 دقائق. ولا يكشف الرد 202 ولا الرد 429 هل يستخدم حسابٌ هذا العنوان. ولتعيين كلمة المرور الجديدة حدّه الخاص (`auth_reset`).

        **الحدود:** `auth`، و`auth_forgot`، ثم `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: مقبول (أيًّا كان العنوان).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: الحدّ `auth` أو `auth_forgot` أو `auth_forgot_day` (أيًّا كان العنوان).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` مع `retryAfter: 1`: بقيت قاعدة البيانات مقفلة. `timeout`. وكذلك `server_busy` مع `retryAfter` من 2 إلى 5: لدى قاعدة البيانات كتابات منتظرة أكثر مما ينبغي، ولم يُنفَّذ الطلب.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: تعيين كلمة مرور جديدة بالرمز المميَّز لرابط إعادة التعيين
      description: |-
        يعيّن كلمة مرور جديدة بالرمز المميَّز لرابط إعادة التعيين (والصفحة `/reset-password` تفعل الشيء نفسه). وتخضع كلمة المرور الجديدة لقواعد التسجيل.

        لإعادة التعيين هذه الآثار، في معاملة واحدة (كلها أو لا شيء منها): تُبطل كل الجلسات وتلغي أي تغيير معلّق للبريد الإلكتروني؛ وتتوقف روابط إعادة التعيين الأخرى للحساب عن العمل؛ ويُعدّ العنوان مؤكَّدًا (فقد أثبته الرابط)؛ ويتلقى صاحب الحساب رسالة. ولا تُمَسّ المصادقة الثنائية. وبعد خطأ في طابور تجزئة كلمات المرور أو 503 أو 500، لا يكون قد تغيّر شيء: تبقى كلمة المرور القديمة والجلسات، ويبقى الرابط صالحًا.

        **الحدود:** `auth`، ثم `auth_reset` (10 في الساعة لكل عميل، و30 لكل IPv6 /48، مشترك مع الصفحة: فكل محاولة تجزّئ كلمة مرور).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: غُيّرت كلمة المرور وسُجّل الخروج من كل الجلسات.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: الرابط غير صالح، أو مستخدَم، أو منتهي الصلاحية، أو أُرسل إلى عنوان لم يعد للحساب. `weak_password` (مع `reason`). `invalid_request`، `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: الحدّ `auth` أو `auth_reset`، أو طابور تجزئة كلمات المرور.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: طابور تجزئة كلمات المرور، أو بقيت قاعدة البيانات مقفلة (`retryAfter: 1`، ولم يتغير شيء). `timeout`. وكذلك `server_busy` مع `retryAfter` من 2 إلى 5: لدى قاعدة البيانات كتابات منتظرة أكثر مما ينبغي، ولم يُنفَّذ الطلب.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: بدء تسجيل الدخول عبر Google
      description: |-
        يبدأ محاولة تسجيل دخول عبر Google لتحدي PKCE ولمنفذ مستمع اللعبة على `127.0.0.1`. ويعطي الرد عنوان URL الخاص بـ Google لفتحه في متصفح النظام، وقيمة `state` الخاصة بالمحاولة؛ وتصلح المحاولة مدة 10 دقائق.

        يحتوي `authUrl` على `client_id`، و`redirect_uri` (المبني من `redirectPort` ومن وسم أصل الخادم)، و`response_type=code`، و`scope=openid email profile`، و`state`، و`nonce`، و`code_challenge` (قيمة S256 لمُحقِّق الخادم الخاص به لدى Google) مع `code_challenge_method=S256`، و`prompt=select_account`. وتتحقق منه اللعبة قبل أن تفتحه (راجع وصف القسم).

        **الحدّ:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: المحاولة.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: تسجيل الدخول عبر Google غير متاح على هذا الخادم.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: الحدّ `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (بقيت قاعدة البيانات مقفلة)، `timeout`. وكذلك `server_busy` مع `retryAfter` من 2 إلى 5: لدى قاعدة البيانات كتابات منتظرة أكثر مما ينبغي، ولم يُنفَّذ الطلب.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: تسليم رد Google إلى الخادم
      description: |-
        يسلّم إلى الخادم قيمتي `code` و`state` اللتين أرسلهما Google إلى مستمع اللعبة، مع معرّف المحاولة ومُحقِّق PKCE. ولا فائدة من معرّف المحاولة من دون المُحقِّق، ولا فائدة من رمز التفويض من دون مُحقِّق PKCE الخاص بالخادم وسرّ العميل.

        يتحقق الخادم من المحاولة (غير معروفة أو مستخدَمة أو منتهية الصلاحية: 410)، ثم من المُحقِّق (المُحقِّق الخاطئ يُبقي المحاولة صالحة للاستخدام)، ثم يستخدم المحاولة مرة واحدة، ويتحقق من `state` و`iss`، ويستبدل رمز التفويض لدى Google، ويتحقق من الرمز المميَّز للهوية. والرد (200) واحد مما يلي:

        - `{ token, expiresAt, user }`: تم تسجيل الدخول إلى الحساب المرتبط؛
        - `{ mfaRequired, mfaToken, expiresIn }`: تابِع بـ `POST /auth/login/mfa`؛
        - `{ needsUsername, ssoTicket, suggestedUsername }`: حساب جديد؛ تابِع بـ `POST /auth/sso/complete` خلال 10 دقائق. ويُشتق `suggestedUsername` من الاسم في Google أو من العنوان، ويكون `""` إن لم يصلح شيء؛
        - `{ needsPassword, linkTicket, username, expiresIn }`: للحساب الذي يحمل هذا العنوان كلمة مرور؛ تابِع بـ `POST /auth/sso/google/link`. لم يُربط شيء بعد.

        **الحدّ:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: جلسة، أو خطوة ثانية، أو الخطوة التالية من أول تسجيل دخول عبر Google.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: تم تسجيل الدخول إلى الحساب المرتبط
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: المصادقة الثنائية مفعّلة
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: لاعب جديد
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: يستخدم العنوانَ حسابٌ له كلمة مرور
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: لا يطابق المُحقِّق تحدي المحاولة (وتبقى المحاولة صالحة للاستخدام). `sso_email_unverified`: لم يؤكد Google العنوان. `registration_closed`. `account_disabled`. وللحساب المرتبط فقط: `banned` (مع `until`)، `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: تسجيل الدخول عبر Google غير متاح على هذا الخادم.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: يستخدم العنوانَ حسابٌ نشط لا كلمة مرور له (ولا يُذكر اسمه).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: محاولة غير معروفة أو مستخدَمة أو منتهية الصلاحية.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: الحدّ `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (بقيت قاعدة البيانات مقفلة)، `timeout`. وكذلك `server_busy` مع `retryAfter` من 2 إلى 5: لدى قاعدة البيانات كتابات منتظرة أكثر مما ينبغي، ولم يُنفَّذ الطلب.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: ربط Google بحساب موجود بكلمة مروره
      description: |-
        بعد أن يردّ `finish` بـ `needsPassword`: يربط Google بالحساب الموجود بكلمة مرور ذلك الحساب، التي تُكتب في اللعبة. والرد (200) جلسة (يُخزَّن الربط ويُسجَّل دخول اللاعب)، أو، إذا كانت المصادقة الثنائية مفعّلة، `{ mfaRequired, mfaToken, expiresIn }`: تابِع بـ `POST /auth/login/mfa`، ولا يُخزَّن الربط إلا عندما يجتاز رمزٌ الفحصَ هناك.

        كلمة المرور الخاطئة تُبقي التذكرة صالحة للاستخدام، بما مجموعه 5 محاولات. وتُحتسب المحاولة قُبيل فحص كلمة المرور مباشرةً: فالرد 429 `too_many_attempts` أو 428 `pow_required` لا يستهلك أي محاولة، أما رفض طابور تجزئة كلمات المرور (503 `server_busy`، 429 `rate_limited`) فيكون قد استهلك محاولة ويُحتسب إخفاقًا للحساب. ومهلة الانتظار بعد الإخفاقات تستخدم العدّاد نفسه الذي يستخدمه `POST /auth/login`.

        **الحدّ:** `auth` (مع احتسابه لكل IPv6 /48). **إثبات العمل:** كما في `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: جلسة، أو الخطوة الثانية من تسجيل الدخول.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: كلمة مرور خاطئة؛ وتبقى التذكرة صالحة، بما مجموعه 5 محاولات.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (مع `until`)، بعد كلمة مرور صحيحة فقط.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: تسجيل الدخول عبر Google غير متاح على هذا الخادم.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: رُبط حساب Google بحساب آخر في الأثناء.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: تذكرة غير معروفة أو مستخدَمة أو منتهية الصلاحية، أو كلمة المرور الخاطئة رقم 5، أو حساب تغيّرت حالته أو عنوانه منذ `finish`، أو حساب تغيّرت حالته أو عنوانه أو كلمة مروره أو مصادقته الثنائية أثناء تخزين الربط. ابدأ من جديد من اللعبة.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (مهلة الانتظار بعد إخفاقات الحساب)، أو `rate_limited` (الحدّ `auth`، أو طابور تجزئة كلمات المرور).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: طابور تجزئة كلمات المرور، أو بقيت قاعدة البيانات مقفلة (`retryAfter: 1`، ولم يُربط شيء). `timeout`. وكذلك `server_busy` مع `retryAfter` من 2 إلى 5: لدى قاعدة البيانات كتابات منتظرة أكثر مما ينبغي، ولم يُنفَّذ الطلب.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: إنشاء الحساب عند أول تسجيل دخول عبر Google
      description: |-
        بعد أن يردّ `finish` بـ `needsUsername`: ينشئ الحساب باسم المستخدم المختار (وتنطبق قواعد التسجيل) ويسجّل دخوله. وليس للحساب كلمة مرور: قيمة `hasPassword` هي `false`، و«نسيت كلمة المرور» (`POST /auth/password/forgot`) يمنحه واحدة.

        **الحدّ:** `auth` (مع احتسابه لكل IPv6 /48).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: أُنشئ الحساب وسُجّل دخوله.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`، `invalid_request`، `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: تسجيل الدخول عبر Google غير متاح على هذا الخادم.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (هناك حساب يحمل اسم المستخدم هذا، أو يحجزه طلب تسجيل منتظر بعنوان آخر)، `sso_already_linked`، `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: تذكرة غير معروفة أو مستخدَمة أو منتهية الصلاحية.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: الحدّ `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (بقيت قاعدة البيانات مقفلة)، `timeout`. وكذلك `server_busy` مع `retryAfter` من 2 إلى 5: لدى قاعدة البيانات كتابات منتظرة أكثر مما ينبغي، ولم يُنفَّذ الطلب.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: عرض الأجهزة المسجَّل الدخول منها
      description: |-
        جلسات الحساب النشطة (الأجهزة المسجَّل الدخول منها)، بدءًا بالأحدث استخدامًا. ويميّز `current` الجلسة التي تقدّم الطلب. ويُحدَّث `lastSeenAt` مرة كل 5 دقائق على الأكثر؛ و`expiresAt` هو النهاية المطلقة، وقد يُنهي حدّ الخمول الجلسة قبل ذلك.

        **الحدّ:** `sessions`.
      security:
        - bearerAuth: []
