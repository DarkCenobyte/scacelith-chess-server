  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: تغيير عنوان البريد الإلكتروني
      description: |-
        يغيّر عنوان البريد الإلكتروني للحساب. تُزال المسافات من طرفي `newEmail` ويُحوَّل إلى أحرف صغيرة، ثم يُفحص كما يُفحص عنوان التسجيل.

        **مع تأكيد البريد الإلكتروني** (الإعداد الافتراضي): 202 `verification_sent`. يُرسَل إلى العنوان الجديد رابط صالح 24 ساعة؛ يفتح `/confirm-email-change`، ولا يتغير العنوان إلا حين يضغط اللاعب زر تلك الصفحة. وحتى ذلك الحين يعرض `GET /account/me` العنوان الجديد في `pendingEmail`. والطلب الجديد يحل محل الطلب المعلّق؛ ويلغيه تغيير كلمة المرور أو إعادة تعيينها. ولا يُرسَل إلى عنوان جديد بعينه أكثر من رابط واحد كل 5 دقائق، أيًّا كان الطالب (وطلبُ التغيير المعلّق أصلًا يُبقي الرابط المرسَل سابقًا، الذي يظل صالحًا)؛ ويبقى الرد كما هو. ويتلقى العنوان الحالي إشعارًا بأن تغييرًا إلى عنوان مُقنَّع (`a***@example.org`) قد طُلب. ويكون الرد و`pendingEmail` كما هما عندما يستخدم حساب آخر العنوان الجديد بالفعل: لا يُرسَل رابط حينئذٍ، فلا يكتمل ذلك التغيير أبدًا، ويتلقى صاحب ذلك العنوان إشعارًا (واحدًا في الساعة على الأكثر) بدلًا منه.

        عند تأكيد الرابط، يتغير العنوان ويُعدّ مؤكَّدًا، وتبقى الأجهزة مسجَّلة الدخول، وتتوقف الروابط المرسَلة سابقًا (التأكيد، وإعادة تعيين كلمة المرور، والتغييرات الأخرى) عن العمل، ويُبلَّغ العنوان السابق، مع إظهار العنوان الجديد مُقنَّعًا.

        **من دون تأكيد البريد الإلكتروني** (`REQUIRE_EMAIL_VERIFICATION=false`): يتغير العنوان فورًا (200 `email_changed`)، ويُبلَّغ العنوان السابق. وإذا كان حساب آخر يستخدم العنوان، فالرد 409 `email_taken`، ويتلقى صاحب ذلك العنوان الإشعار.

        **إعادة المصادقة:** كلمة المرور، ومع المصادقة الثنائية، رمز من تطبيق المصادقة أو رمز استرداد. ويُفحص `invalid_email` و`same_email` قبل كلمة المرور، فلا يُحتسب أيٌّ منهما إخفاقًا. **الحدود:** `reauth`، ثم `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: تغيّر العنوان فورًا (لا تأكيد للبريد الإلكتروني على هذا الخادم).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: العنوان الجديد، كما خُزّن.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: أُرسل رابط تأكيد إلى العنوان الجديد (أو أن العنوان يخص حسابًا آخر؛ والرد لا يكشف ذلك).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`، `same_email` (العنوان الحالي للحساب)، `password_not_set` (حساب يعتمد على Google وحده)، `invalid_request`، `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` (وكذلك عندما يسبق تغييرُ كلمة المرور أو إعادةُ تعيينها الطلبَ: فلا يُرسَل أي رابط)، `mfa_code_required`، `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: من دون تأكيد البريد الإلكتروني فقط.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (عمليات إعادة مصادقة فاشلة، أو رموز كثيرة جدًا جُرّبت على هذا الحساب)، أو `rate_limited` (الحدّ `reauth` أو `reauth_user`، أو رصيد الحساب، أو طابور تجزئة كلمات المرور).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: طابور تجزئة كلمات المرور، أو بقيت قاعدة البيانات مقفلة (`retryAfter: 1`: لم يتغير شيء، ويمكن إرسال الطلب نفسه مرة أخرى). `timeout`. وكذلك `server_busy` مع `retryAfter` من 2 إلى 5: لدى قاعدة البيانات كتابات منتظرة أكثر مما ينبغي، ولم يُنفَّذ الطلب.'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: تنزيل بيانات الحساب
      description: |-
        كل ما يحتفظ به الخادم عن الحساب، في ملف JSON واحد للحفظ (قيمة `format` هي `scacelith-account-export`، وقيمة `version` هي 1). ويسجّل التصدير حدث أمان (`account_exported`). وتشرح المصفوفة `notes` في المستند للاعب، بلغة إنجليزية بسيطة، ما الذي استُبعد منه.

        **لا يتضمن التصدير أبدًا:** تجزئة كلمة المرور، وسرّ المصادقة الثنائية ورموز الاسترداد؛ وأي رمز مميَّز لجلسة أو رابط، أو تجزئةً له؛ وبيانات نظام مكافحة الغش (مستوى النزاهة ودرجتها، والحالات الشاذة، وتحليل المباريات، ووزن البلاغ)؛ والبلاغات التي قدّمها لاعبون آخرون عن اللاعب؛ وهويات المشرفين؛ والبيانات الخاصة باللاعبين الآخرين (يظهر الخصوم باسمهم العام وتصنيفهم، ولا شيء يكشف هل عوقب لاعب آخر، ولا يُدرج أي عنوان IP قد يخص شخصًا آخر).

        **إعادة المصادقة:** كلمة المرور، ومع المصادقة الثنائية، رمز من تطبيق المصادقة أو رمز استرداد. **الحدود:** `account_export` (5 في الساعة لكل لاعب، على مستوى الخادم بأكمله؛ وكل محاولة تُحتسب، بما فيها الفاشلة؛ ويُفحص أولًا)، ثم `reauth` و`reauth_user`. **المهلة الزمنية:** 60 ثانية.
