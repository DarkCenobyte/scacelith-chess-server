      ولمنفذ المقاييس نقاط نهاية خاصة به لفحص السلامة، موصوفة في المقدمة.
  - name: auth
    x-displayName: إنشاء الحساب وتسجيل الدخول
    description: |-
      إنشاء حساب، وتسجيل الدخول بكلمة مرور (وعامل ثانٍ)، ورسائل التأكيد وإعادة تعيين كلمة المرور.

      تردّ نقاط النهاية `POST /auth/login` و`POST /auth/login/mfa` و`POST /auth/sso/google/finish` و`POST /auth/sso/google/link` و`POST /auth/sso/complete` بجلسة `{ token, expiresAt, user }` (أو بخطوة ثانية، في حالة نقاط النهاية الأولى منها).
  - name: google-sign-in
    x-displayName: تسجيل الدخول عبر Google
    description: |-
      يُتاح عندما يذكر `GET /info` القيمة `sso.google: true`؛ وإلا فإن كل نقطة نهاية أدناه تردّ بـ 404 `sso_disabled`. تسجّل اللعبة الدخول عبر متصفح النظام بتدفق التطبيقات المثبّتة الموصوف في RFC 8252 (عميل من نوع «تطبيق سطح المكتب»): يعيد Google المتصفح إلى مستمعٍ تابع للعبة على `127.0.0.1`، لا إلى هذا الخادم أبدًا، ولا ترى اللعبة أبدًا أي بيانات اعتماد لـ Google.

      1. يستمع العميل على `127.0.0.1:0` (يختار النظام المنفذ) وينشئ زوج PKCE: قيمة `codeVerifier` من 43 إلى 128 محرفًا من `[A-Za-z0-9._~-]`، و`codeChallenge = BASE64URL(SHA-256(codeVerifier))`، المكوّنة من 43 محرفًا بلا حشو.
      2. يعيد `POST /auth/sso/google/start`، مع التحدي والمنفذ، عنوان URL الخاص بـ Google وقيمة `state` الخاصة بالمحاولة. ويتحقق العميل من عنوان URL (انظر أدناه) ويفتحه في المتصفح.
      3. يرسل Google المتصفح إلى `http://127.0.0.1:<port>/oauth2/google/<tag>?code=...&state=...`. ولا يقبل العميل إلا قيمة `state` الواردة في رد البدء، ولا يرسل شيئًا بعد إعادة توجيه تحمل `error=`.
      4. يستدعي العميل `POST /auth/sso/google/finish` مع معرّف المحاولة، و`codeVerifier`، و`state`، و`code` (و`iss` إن أرسله Google).
      5. يكون الرد جلسة، أو خطوة مصادقة ثنائية (تابِع بـ `POST /auth/login/mfa`)، أو `needsUsername` للاعب جديد (تابِع بـ `POST /auth/sso/complete`)، أو `needsPassword` عندما يستخدم العنوانَ حسابٌ له كلمة مرور (تابِع بـ `POST /auth/sso/google/link`).

      **وسم الأصل.** يحمل عنوان URI لإعادة التوجيه وسمًا للخادم الذي أضافه اللاعب، كي ترفض اللعبة عنوان URL حصل عليه خادم آخر للاعبيه. والأصل هو اسم المضيف بأحرف صغيرة (وعنوان IPv6 الحرفي بين قوسين معقوفين)، ثم `:`، ثم منفذ API بالنظام العشري، مكتوبًا دائمًا، بما في ذلك 443: يأخذ الخادم `SERVER_PUBLIC_HOST` ومنفذ API العام الخاص به، وتأخذ اللعبة العنوان الذي تتصل به. والوسم هو أول 22 محرفًا من ترميز base64url (بلا حشو) لـ SHA-256(UTF-8 `"scacelith-sso-origin-v1\n"` + الأصل). وعنوان URI لإعادة التوجيه هو `"http://127.0.0.1:" + port + "/oauth2/google/" + tag`: دائمًا عنوان IPv4 الحرفي، ومنفذ مستمع اللعبة (من 1024 إلى 65535). ولا يأخذ الخادم أبدًا أي URI أو مضيف أو مسار من العميل.

      | الأصل | الوسم |
      |---|---|
      | `play.scacelith.example:443` | `IhcScoV7eDOzTEcSnqPUPt` |
      | `localhost:8443` | `TFGx7zQ_8QlGZW5zpqznCr` |
      | `[::1]:8443` | `XToJm0DG5PjciEVmZa9Cho` |
      | `127.0.0.1:50443` | `3r653wM5ZjYsHcAJljmCwY` |

      ولذلك لا يعمل تسجيل الدخول عبر Google إلا للاعبين الذين أضافوا الخادم باسم `SERVER_PUBLIC_HOST` ومنفذ API العام الخاص به بالضبط.

      **ما تتحقق منه اللعبة قبل فتح المتصفح.** يبدأ `authUrl` بـ `https://accounts.google.com/o/oauth2/v2/auth?` بالضبط، ويتكوّن من محارف ASCII قابلة للطباعة بطول أقل من 4096 محرفًا، ويحتوي استعلامه على `response_type=code` واحد بالضبط، و`redirect_uri` واحد بالضبط يساوي عنوان URI الذي تحسبه اللعبة من منفذها ووسم أصلها، و`state` واحد بالضبط يساوي قيمة `state` في الرد، و`code_challenge_method=S256`، و`code_challenge` من 43 محرفًا. وإلا فإن اللعبة توقف مستمعها ولا تفتح شيئًا. ولا ترسل `finish` و`link` إلا إلى الخادم الذي ردّ على `start`.

      **الحساب الذي يصل إليه تسجيل الدخول عبر Google:** الحساب المرتبط بالفعل بحساب Google هذا؛ وإلا فحساب نشط يحمل العنوان الذي أكّده Google (إن كانت له كلمة مرور، يردّ `finish` بـ `needsPassword` ولا يُخزَّن الربط إلا بعد اجتياز كلمة مروره، ثم عامله الثاني إن كان مفعّلًا؛ وإن لم تكن له كلمة مرور، فالرد 409 `sso_account_exists`)؛ وإلا فحساب جديد (`needsUsername`). ولا يُربط حساب Google أبدًا بحساب موجود بناءً على عنوانه وحده. ويتلقى عنوان الحساب رسالة عندما ينشئ تسجيل الدخول عبر Google حسابًا، وعندما يُضاف إلى حساب موجود.
