  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: تغيير كلمة المرور
      description: |-
        يغيّر كلمة المرور. وتلزم كلمة المرور الحالية، لكن لا يلزم عامل ثانٍ، حتى إن كانت المصادقة الثنائية مفعّلة. وتخضع كلمة المرور الجديدة لقواعد التسجيل (وتُفحص بعد كلمة المرور الحالية).

        للتغيير هذه الآثار، في معاملة واحدة (كلها أو لا شيء منها): يُبطل كل الجلسات الأخرى (وتبقى هذه الجلسة مسجَّلة الدخول)، ويلغي أي تغيير معلّق للبريد الإلكتروني، ويوقف عمل روابط إعادة تعيين كلمة المرور الخاصة بالحساب، ويرسل رسالة إلى صاحب الحساب.

        **إعادة المصادقة:** كلمة المرور فقط. **الحدود:** `reauth`، ثم `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: غُيّرت كلمة المرور.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (حساب يعتمد على Google وحده)، `weak_password` (مع `reason`)، `invalid_request`، `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: كلمة المرور الحالية خاطئة، أو حدثت إعادة تعيين لكلمة المرور أو تغيير لها أثناء فحص الطلب.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (عمليات إعادة مصادقة فاشلة للحساب)، أو `rate_limited` (الحدّ `reauth` أو `reauth_user`، أو رصيد الحساب، أو طابور تجزئة كلمات المرور).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: طابور تجزئة كلمات المرور، أو بقيت قاعدة البيانات مقفلة (`retryAfter: 1`، ولم يتغير شيء). `timeout`. وكذلك `server_busy` مع `retryAfter` من 2 إلى 5: لدى قاعدة البيانات كتابات منتظرة أكثر مما ينبغي، ولم يُنفَّذ الطلب.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: بدء تفعيل المصادقة الثنائية
      description: |-
        يخزّن سرَّ مصادقة جديدًا معلّقًا، يحل محل أي سرّ معلّق سابق، ويعيده لتطبيق المصادقة (نصًّا، وعلى شكل عنوان URI بالصيغة `otpauth://` لعرضه رمز QR). ولا تكون المصادقة الثنائية مفعّلة بعد: إذ يفعّلها `POST /account/mfa/totp/enable` برمز مولَّد من هذا السر.

        **إعادة المصادقة:** كلمة المرور فقط. **الحدود:** `reauth`، ثم `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: السرّ المعلّق.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (حساب يعتمد على Google وحده)، `invalid_request`، `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled` (يُفحص قبل كلمة المرور).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (عمليات إعادة مصادقة فاشلة للحساب)، أو `rate_limited` (الحدّ `reauth` أو `reauth_user`، أو رصيد الحساب، أو طابور تجزئة كلمات المرور).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (طابور تجزئة كلمات المرور، أو بقيت قاعدة البيانات مقفلة)، `timeout`. وكذلك `server_busy` مع `retryAfter` من 2 إلى 5: لدى قاعدة البيانات كتابات منتظرة أكثر مما ينبغي، ولم يُنفَّذ الطلب.'
  /account/mfa/totp/enable:
    post:
      operationId: enableTotp
      tags:
        - two-step-verification
      summary: إكمال تفعيل المصادقة الثنائية والحصول على رموز الاسترداد
      description: |-
        يفعّل المصادقة الثنائية برمز مولَّد من السر المعلّق (6 أرقام بالضبط). ولا تُطلب كلمة المرور هنا؛ فقد قُدّمت عند الإعداد. ويتضمن الرد 10 رموز استرداد، تُعرض هذه المرة فقط.

        **الحدود:** `reauth`، ثم `reauth_user`؛ ويُحتسب الرمز الخاطئ ضمن إخفاقات إعادة المصادقة للحساب.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: المصادقة الثنائية مفعّلة.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - recoveryCodes
                properties:
                  status:
                    const: mfa_enabled
                  recoveryCodes:
                    $ref: '#/components/schemas/RecoveryCodeList'
              example:
                status: mfa_enabled
                recoveryCodes:
                  - j7v5-3ezx-zn
                  - 4kqm-8w2p-hd
                  - x0ra-c6tn-5g
                  - mb3s-9yzj-k1
                  - 2hvd-pq7e-w8
                  - c5ng-0tka-xr
                  - zz4y-b1me-7q
                  - 8pjh-6dsw-3n
                  - t9xc-2gfk-0v
                  - q6wa-ner5-jy
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: ليس `code` مكوّنًا من 6 أرقام بالضبط، أو يخالف الجسم المخطط؛ `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_code`: رمز خاطئ (تحقّق من ساعة الجهاز).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`mfa_already_enabled`؛ `mfa_setup_required`: لا يوجد سرّ معلّق (استدعِ `POST /account/mfa/totp/setup` أولًا).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (عمليات إعادة مصادقة فاشلة للحساب)، أو `rate_limited` (الحدّ `reauth` أو `reauth_user`، أو رصيد الحساب).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (بقيت قاعدة البيانات مقفلة)، `timeout`. وكذلك `server_busy` مع `retryAfter` من 2 إلى 5: لدى قاعدة البيانات كتابات منتظرة أكثر مما ينبغي، ولم يُنفَّذ الطلب.'
  /account/mfa/totp/disable:
