  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: حذف الحساب
      description: |-
        يحذف الحساب؛ ولا يمكن التراجع عن ذلك.

        - تُبطَل كل الجلسات فورًا: ويتلقى الرمز المميَّز 401 `invalid_token` منذ ذلك الحين.
        - يصبح اسم المستخدم `deleted#<id>`، في الحساب وفي كل سجل مباراة.
        - تُمحى البيانات التالية: عنوان البريد الإلكتروني، وتجزئة كلمة المرور، وسرّ المصادقة الثنائية ورموز الاسترداد، والجلسات والرموز المميَّزة للروابط، والربط بـ Google، وسجل النزاهة لدى نظام مكافحة الغش، وعناوين IP المخزّنة مع أحداث الأمان.
        - يُحتفظ بالتصنيفات والمباريات. وتبقى المباريات قابلة للقراءة تحت الاسم المجهول، ويردّ `GET /players/{username}` بـ 404 للاسم السابق.

        **إعادة المصادقة:** كلمة المرور، ومع المصادقة الثنائية، رمز من تطبيق المصادقة أو رمز استرداد. **الحدود:** `reauth`، ثم `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: حُذف الحساب.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (حساب يعتمد على Google وحده)، `invalid_request`، `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`، `mfa_code_required`، `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (عمليات إعادة مصادقة فاشلة، أو رموز كثيرة جدًا جُرّبت على هذا الحساب)، أو `rate_limited` (الحدّ `reauth` أو `reauth_user`، أو رصيد الحساب، أو طابور تجزئة كلمات المرور).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (طابور تجزئة كلمات المرور، أو بقيت قاعدة البيانات مقفلة)، `timeout`. وكذلك `server_busy` مع `retryAfter` من 2 إلى 5: لدى قاعدة البيانات كتابات منتظرة أكثر مما ينبغي، ولم يُنفَّذ الطلب.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: عرض مباريات اللاعب، مع التصفية والتقسيم إلى صفحات
      description: |-
        مباريات اللاعب المسجَّل الدخول، بدءًا بالأحدث، مع التصفية والتقسيم إلى صفحات، وعدد المباريات المطابقة لعامل التصفية. وكل معاملات الاستعلام اختيارية، والقيمة الفارغة تُعدّ غائبة.

        التقسيم إلى صفحات: مرّر قيمة `next` من الصفحة السابقة في `before`؛ وتكون `next` مساوية لـ `null` في الصفحة الأخيرة. ويعدّ `total` المباريات المطابقة لعامل التصفية، عبر كل الصفحات.

        **الحدّ:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: معرّف فئة رسمية (`3+2` أو `3%2B2`)، أو `custom` لكل مباراة بنظام وقت آخر.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: المباريات المحتسبة (`true`) فقط، أو الودية (`false`) فقط.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: المباريات التي فاز بها اللاعب أو خسرها أو تعادل فيها فقط، من جهة اللاعب. ولا تظهر المباريات الملغاة إلا من دون عامل التصفية هذا.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: صفحة واحدة من السجل.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (ليس `before` معرّف مباراة)، أو `invalid_limit`، أو `invalid_filter` (`category` أو `rated` أو `result`)، وكلٌّ منها مع `field` الذي يسمّي المعامل.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: الحدّ `account_games` أو رصيد الحساب.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (بقيت قاعدة البيانات مقفلة؛ `retryAfter: 1` في الجسم، بلا ترويسة `Retry-After`)، `server_busy` (وجد البحث عن الجلسة قاعدة البيانات مقفلة)، `timeout`.'
