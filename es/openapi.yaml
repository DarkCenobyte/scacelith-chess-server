        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (la base de datos ha seguido bloqueada; `retryAfter: 1` en el cuerpo, sin encabezado `Retry-After`), `server_busy` (la búsqueda de la sesión encontró la base de datos bloqueada), `timeout`.'
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - leaderboard
      summary: Obtener los mejores jugadores de una categoría
      description: |-
        Los 100 mejores registros de puntuación de una categoría oficial con al menos `minGames` (`PROVISIONAL_GAMES`) partidas contabilizadas, excluidas las cuentas eliminadas y los tramposos confirmados. El servidor vuelve a calcular cada clasificación como máximo cada 10 segundos; `updatedAt` indica cuándo. Solo se ejecuta un cálculo por categoría a la vez: mientras tanto, las demás solicitudes reciben la lista anterior, o esperan al cálculo cuando todavía no hay ninguna.

        **Límites:** solo la capa por dirección.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          description: Un identificador de categoría oficial (`3+2`, o `3%2B2`).
          schema:
            type: string
            pattern: '^\s*[0-9]+[+ ][0-9]+\s*$'
          example: '3+2'
        - name: limit
          in: query
          required: false
          description: Cuántos jugadores, de 1 a 100. Un número mayor de hasta 3 cifras cuenta como 100; un valor vacío equivale a su ausencia.
          schema:
            type: integer
            minimum: 1
            maximum: 999
            default: 100
      responses:
        '200':
          description: La clasificación.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
              example:
                category: '3+2'
                minGames: 30
                updatedAt: 1790882839828
                players:
                  - rank: 1
                    username: bob
                    rating: 1874
                    games: 212
                    wins: 120
                    draws: 30
                    losses: 62
                    peak: 1901
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_category` (ausente, o no es una categoría oficial), `invalid_limit`.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: la capa por dirección.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (la base de datos ha seguido bloqueada; `retryAfter: 1` en el cuerpo, sin encabezado `Retry-After`), `timeout`.'
  /reports:
    post:
      operationId: reportPlayer
      tags:
        - reports
      summary: Denunciar al rival de una partida reciente
      description: |-
        Denuncia al rival de una de las partidas del propio jugador que haya terminado en los últimos 7 días. Una denuncia nunca cambia por sí sola una puntuación, una sanción ni un nivel de integridad. Aumenta la prioridad de revisión que ven los moderadores y, salvo para `abuse`, solicita el análisis de la partida con el motor.

        Una denuncia del mismo rival por la misma partida recibe la misma respuesta y no cambia nada; la respuesta nunca revela nada sobre la cuenta denunciada. `GET /games/{id}` indica de antemano a los jugadores de la partida si se aceptaría una denuncia (`reportable`).

        Este endpoint comprueba su cuerpo por sí mismo, en el orden `gameId`, `reported`, `category`, `comment`: un fallo responde 400 `invalid_request` sin `field`. Los campos que no conoce se ignoran.

        **Límites:** `reports` (por jugador) y después `REPORTS_PER_DAY` (5) denuncias por jugador en 24 horas (429 `report_limit`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            example:
              gameId: 4100000000001
              reported: bob
              category: cheating
              comment: engine-like play
      responses:
        '202':
          description: La denuncia se ha recibido (o ya se había presentado).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: received
              example:
                status: received
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (sin `field`), `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`report_not_allowed`: no es el rival del denunciante en una partida terminada en los últimos 7 días.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`report_limit` (`retryAfter: 3600`, con un encabezado `Retry-After`): `REPORTS_PER_DAY` denuncias en las últimas 24 horas. `rate_limited`: el límite `reports` o el presupuesto de la cuenta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la búsqueda de la sesión encontró la base de datos bloqueada), `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /verify-email:
    servers:
      - url: https://caissa.scacelith.com
        description: El servidor oficial (las páginas están en la raíz, fuera de `/api/v1`).
      - url: https://{host}:{port}
        description: Cualquier servidor de Scacelith (las páginas están en la raíz, fuera de `/api/v1`).
        variables:
          host:
            default: caissa.scacelith.com
            description: El nombre de host público del servidor (`SERVER_PUBLIC_HOST`).
