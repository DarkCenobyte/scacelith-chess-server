          description: '`server_busy` (la cola de hash de contraseñas, o la base de datos ha seguido bloqueada), `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /account/email:
    post:
      operationId: changeEmail
      tags:
        - email-change
      summary: Cambiar la dirección de correo
      description: |-
        Cambia la dirección de correo de la cuenta. A `newEmail` se le quitan los espacios de los extremos y se pasa a minúsculas; después se comprueba como una dirección de registro.

        **Con confirmación del correo** (el valor predeterminado): 202 `verification_sent`. Se envía a la nueva dirección un enlace válido durante 24 horas; abre `/confirm-email-change`, y la dirección solo cambia cuando el jugador pulsa el botón de esa página. Hasta entonces, `GET /account/me` muestra la nueva dirección como `pendingEmail`. Una nueva solicitud sustituye a la pendiente; un cambio o restablecimiento de contraseña la cancela. Como máximo se envía un enlace a una misma dirección nueva cada 5 minutos, sea quien sea quien lo pida (una solicitud para el cambio que ya está pendiente conserva el enlace enviado antes, que sigue siendo válido); la respuesta es la misma. La dirección actual recibe un aviso de que se ha solicitado un cambio a una dirección enmascarada (`a***@example.org`). La respuesta y `pendingEmail` son los mismos cuando otra cuenta ya usa la nueva dirección: en ese caso no se envía ningún enlace, de modo que ese cambio nunca se completa, y el titular de esa dirección recibe en su lugar un aviso (como máximo uno por hora).

        Cuando se confirma el enlace, la dirección cambia y se considera confirmada, los dispositivos mantienen la sesión iniciada, los enlaces enviados anteriormente (confirmación, restablecimiento de contraseña, otros cambios) dejan de funcionar, y se avisa a la dirección anterior, con la nueva enmascarada.

        **Sin confirmación del correo** (`REQUIRE_EMAIL_VERIFICATION=false`): la dirección cambia de inmediato (200 `email_changed`) y se avisa a la dirección anterior. Si otra cuenta usa la dirección, la respuesta es 409 `email_taken`, y el titular de esa dirección recibe el aviso.

        **Reautenticación:** la contraseña y, con la autenticación de dos factores, un código de la aplicación de autenticación o un código de recuperación. `invalid_email` y `same_email` se comprueban antes que la contraseña, por lo que no cuentan como fallo. **Límites:** `reauth` y después `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              newEmail: alice.new@example.org
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: La dirección ha cambiado de inmediato (este servidor no exige confirmación del correo).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - email
                properties:
                  status:
                    const: email_changed
                  email:
                    type: string
                    format: email
                    description: La nueva dirección, tal como se ha guardado.
              example:
                status: email_changed
                email: alice.new@example.org
        '202':
          description: Se ha enviado un enlace de confirmación a la nueva dirección (o la dirección pertenece a otra cuenta; la respuesta no lo revela).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_email`, `same_email` (la dirección actual de la cuenta), `password_not_set` (una cuenta que solo usa Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password` (también cuando un cambio o restablecimiento de contraseña se ha adelantado a la solicitud: no se envía ningún enlace), `mfa_code_required`, `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`: solo sin confirmación del correo.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (reautenticaciones fallidas, o demasiados códigos probados en esta cuenta), o `rate_limited` (el límite `reauth` o `reauth_user`, el presupuesto de la cuenta, la cola de hash de contraseñas).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: la cola de hash de contraseñas, o la base de datos ha seguido bloqueada (`retryAfter: 1`: no ha cambiado nada y se puede volver a enviar la misma solicitud). `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /account/export:
    post:
      operationId: exportAccountData
      tags:
        - data-export
      summary: Descargar los datos de la cuenta
      description: |-
        Todo lo que el servidor guarda sobre la cuenta, en un único archivo JSON para guardar (`format` `scacelith-account-export`, `version` 1). La exportación registra un evento de seguridad (`account_exported`). La matriz `notes` del documento indica al jugador, en un inglés sencillo, lo que queda fuera.

        **Nunca figura en la exportación:** el hash de la contraseña, el secreto de la autenticación de dos factores ni los códigos de recuperación; ningún token de sesión o de enlace, ni su hash; los datos del sistema antitrampas (nivel y puntuación de integridad, anomalías, el análisis de las partidas, el peso de una denuncia); las denuncias que otros jugadores hayan presentado contra el jugador; la identidad de los moderadores; los datos privados de otros jugadores (los rivales aparecen con su nombre público y su puntuación, nada indica si otro jugador ha sido sancionado, y no se incluye ninguna dirección IP que pueda pertenecer a otra persona).

        **Reautenticación:** la contraseña y, con la autenticación de dos factores, un código de la aplicación de autenticación o un código de recuperación. **Límites:** `account_export` (5 por hora y por jugador, para el servidor entero; todo intento cuenta, incluidos los fallidos; se comprueba primero), y después `reauth` y `reauth_user`. **Tiempo máximo:** 60 segundos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: El documento de exportación, como archivo adjunto.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: '`attachment; filename="scacelith-account-<username>.json"`. Los caracteres del nombre de usuario que no sean letras, cifras, `_`, `.` ni `-` se convierten en `_`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-account-[A-Za-z0-9_.-]+\.json"$'
              example: attachment; filename="scacelith-account-alice.json"
