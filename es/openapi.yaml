          description: '`invalid_game_id`: no es un entero positivo de 16 cifras como máximo (por debajo de 2^53); `invalid_request`: no es una codificación URL válida.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: se envió un token y no es válido.'
        '404':
          $ref: '#/components/responses/NotFound'
