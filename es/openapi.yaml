components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_[A-Za-z0-9_-]{43}
      description: |-
        Un token de sesión (`sct_` seguido de 43 caracteres base64url) obtenido de una respuesta de inicio de sesión, en el encabezado `Authorization`: `Authorization: Bearer <token>`. El prefijo es exactamente `Bearer` (se distinguen mayúsculas y minúsculas) seguido de un espacio; un valor que no lo tenga, o un token que no tenga de 1 a 512 caracteres ASCII imprimibles, responde 401 `invalid_token`, como cualquier otro token no válido. Un encabezado vacío equivale a no enviar el encabezado.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: El identificador de la partida, un entero decimal positivo de 16 cifras como máximo, sin ceros a la izquierda, por debajo de 2^53.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000001
    SessionId:
      name: id
      in: path
      required: true
      description: El identificador de la sesión, tal como lo da `GET /auth/sessions`, escrito sin ceros a la izquierda (`03` no es la sesión 3).
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    Username:
      name: username
      in: path
      required: true
      description: El nombre de usuario del jugador, sin distinguir mayúsculas de minúsculas. El servidor acepta cualquier nombre de 2 a 24 caracteres de `[A-Za-z0-9_.-]` (la regla más amplia que ha permitido nunca).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{2,24}$'
      example: alice
    BeforeQuery:
      name: before
      in: query
      required: false
      description: Un identificador de partida; solo se listan las partidas anteriores. Pase el `next` de la página anterior. Un valor vacío equivale a su ausencia.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      example: 4100000000002
    LimitQuery:
      name: limit
      in: query
      required: false
      description: El tamaño de la página, de 1 a 50. Un número mayor de hasta 3 cifras cuenta como 50; un valor vacío equivale a su ausencia.
      schema:
        type: integer
        minimum: 1
        maximum: 999
        default: 20
    LinkTokenQuery:
      name: token
      in: query
      required: false
      description: El token del enlace del correo (43 caracteres base64url). Si falta o es erróneo, se muestra la página «link invalid or expired» (enlace no válido o caducado).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: asfioO4P0r_Zn5DxWzcQuF6Drgxu7wXGjCyS-UFbTaw
  headers:
    CacheControl:
      description: Todas las respuestas del servidor prohíben el almacenamiento en caché.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Segundos que hay que esperar antes de volver a intentarlo; el mismo valor que `retryAfter` en el cuerpo.
      schema:
        type: integer
        minimum: 1
      example: 30
    WwwAuthenticate:
      description: El desafío Bearer, con `error="invalid_token"` para un token no válido.
      schema:
        type: string
        enum:
          - Bearer realm="scacelith"
          - Bearer realm="scacelith", error="invalid_token"
    ConnectionClose:
      description: El servidor cierra la conexión después de esta respuesta.
      schema:
        type: string
        const: close
  responses:
    BadRequest:
      description: '`invalid_request` (con `field` cuando el problema está en un campo del cuerpo) o `invalid_json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              summary: Un campo incumple el esquema
              value:
                error: invalid_request
                message: '"password" is required'
                field: password
            invalidJson:
              summary: El cuerpo no es JSON
              value:
                error: invalid_json
                message: The body is not valid JSON.
            weakPassword:
              summary: Una contraseña débil
              value:
                error: weak_password
                message: The password must have at least 10 characters.
                reason: too_short
            invalidPgn:
              summary: Un PGN que no se puede leer
              value:
                error: invalid_pgn
                message: illegal move 'Ke3'
                line: 1
                column: 13
    Unauthorized:
      description: '`unauthorized` (sin encabezado `Authorization`) o `invalid_token` (el token está mal formado, ha caducado, ha sido revocado o pertenece a una cuenta eliminada).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Sin sesión
              value:
                error: unauthorized
                message: Log in first.
            invalidToken:
              summary: Un token no válido
              value:
                error: invalid_token
                message: The session is invalid or has expired; log in again.
    Forbidden:
      description: La solicitud se ha rechazado.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPassword:
              summary: Una contraseña incorrecta en la reautenticación
              value:
                error: invalid_password
                message: Wrong password.
            banned:
              summary: Una cuenta suspendida
              value:
                error: banned
                message: This account is banned.
                until: 1791487639708
    NotFound:
      description: '`not_found`, o una función que este servidor ha desactivado.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No such game.
    RequestTimeout:
      description: '`request_timeout`: el cuerpo no llegó en un plazo de 10 segundos. El servidor cierra la conexión.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request_timeout
            message: The request body took too long.
    Conflict:
      description: La solicitud entra en conflicto con el estado del servidor.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: username_taken
            message: This username is already taken.
    Gone:
      description: '`sso_expired`: el intento o el ticket de inicio de sesión con Google es desconocido, ya se ha usado o ha caducado; vuelva a empezar desde el juego.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_expired
            message: This sign-in has expired; start again from Scacelith.
    PayloadTooLarge:
      description: '`payload_too_large`: el cuerpo supera `HTTP_BODY_LIMIT` (16 384 bytes de forma predeterminada). El servidor cierra la conexión.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The body must not exceed 16384 bytes.
    UriTooLong:
      description: '`uri_too_long`: el destino de la solicitud supera los 4096 caracteres.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: uri_too_long
            message: The URL is too long.
    UnsupportedMediaType:
      description: '`unsupported_media_type`: el cuerpo no es `application/json`, o su charset no es UTF-8.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: Content-Type must be application/json.
    UnprocessableContent:
      description: '`game_too_long`: la partida tiene más de `GIF_MAX_PLIES` (600) medias jugadas.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: game_too_long
            message: The game is too long for a GIF (742 plies, at most 600).
    PowRequired:
      description: '`pow_required`: resuelva el desafío `pow` y envíe de nuevo la misma solicitud con `pow: { challenge, nonce }`. `reason` indica el motivo: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` o `replayed`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: pow_required
            message: Proof of work required.
            reason: required
            pow:
              challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
              bits: 18
              expiresAt: 1790882991200
    TooManyRequests:
      description: '`rate_limited` (un límite de frecuencia, el presupuesto de la cuenta o la cola de hash de contraseñas) o `too_many_attempts` (una restricción de la cuenta), con `retryAfter` y un encabezado `Retry-After`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              summary: Un límite de frecuencia
              value:
                error: rate_limited
                message: Too many requests; try again later.
                retryAfter: 30
            tooManyAttempts:
              summary: Demasiados fallos en esta cuenta
              value:
                error: too_many_attempts
                message: Too many attempts; wait before trying again.
                retryAfter: 4
    InternalError:
      description: '`internal_error`: un fallo inesperado. El servidor lo registra.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error.
    BadGateway:
      description: '`sso_failed`: un `state` o un `iss` erróneo, o Google ha rechazado el código o ha enviado un token de ID que no supera la verificación. Nunca incluye el texto de Google.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: sso_failed
            message: Google sign-in could not be completed.
    ServiceUnavailable:
      description: '`server_busy`, `busy` o `timeout`: vuelva a intentarlo tras `retryAfter`, si se indica.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverBusy:
              summary: El servidor está ocupado
              value:
                error: server_busy
                message: The server is busy; try again in a few seconds.
                retryAfter: 9
            busy:
              summary: La base de datos ha seguido bloqueada (una lectura)
              value:
                error: busy
                message: Try again shortly.
                retryAfter: 1
            timeout:
              summary: El servidor ha tardado demasiado
              value:
                error: timeout
                message: The server took too long to answer; try again.
    GifFile:
      description: El GIF animado, como archivo adjunto.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Disposition:
          description: '`attachment; filename="scacelith-<id>.gif"` para una partida de este servidor, `attachment; filename="scacelith-game.gif"` para un PGN enviado con `POST /gif`.'
          schema:
            type: string
            pattern: '^attachment; filename="scacelith-([1-9][0-9]{0,15}|game)\.gif"$'
          example: attachment; filename="scacelith-4100000000001.gif"
        Content-Length:
          description: El tamaño del archivo en bytes.
          schema:
            type: integer
            minimum: 1
      content:
        image/gif:
          schema:
            type: string
            format: binary
    HtmlPage:
      description: Una página HTML.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlBadRequest:
      description: Una página HTML que explica el rechazo.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRequestTimeout:
      description: El formulario no llegó en un plazo de 10 segundos (una página HTML). El servidor cierra la conexión.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlConflict:
      description: Una página HTML que explica el conflicto.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: El formulario supera `HTTP_BODY_LIMIT` (una página HTML). El servidor cierra la conexión.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/ConnectionClose'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlUnsupportedMediaType:
      description: El cuerpo no es ni un formulario (`application/x-www-form-urlencoded`) ni JSON, o su charset no es UTF-8 (una página HTML).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlTooManyRequests:
      description: Un límite de frecuencia (una página HTML), con `Retry-After`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlInternalError:
      description: Un fallo inesperado (una página HTML titulada «Server error», error del servidor). El servidor lo registra.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServiceUnavailable:
      description: El servidor está ocupado (la base de datos ha seguido bloqueada, con `Retry-After`) o ha tardado demasiado (una página HTML titulada «Server error», error del servidor).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
  schemas:
    Error:
      type: object
      description: La forma única de todas las respuestas de error de la API JSON.
      required:
        - error
        - message
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: El código de error en `snake_case`. Un cliente elige qué mostrar a partir de él.
          examples:
            - rate_limited
        message:
          type: string
          description: Una frase en inglés, pensada para los registros y como último recurso.
        retryAfter:
          type: integer
          minimum: 1
          description: Segundos que hay que esperar antes de volver a intentarlo; solo está presente en los rechazos que expiran con el tiempo. En ese caso, la respuesta lleva también un encabezado `Retry-After` con el mismo valor, salvo el 503 `busy` de las lecturas del historial, de las partidas, de los jugadores y de la clasificación.
        field:
          type: string
          description: El campo o el parámetro de consulta erróneo (`invalid_request`, `invalid_option`, y `invalid_cursor`, `invalid_limit` e `invalid_filter` de `GET /account/games`). Un campo anidado se escribe con puntos (`pow.nonce`).
        reason:
          type: string
          description: 'El motivo: la regla que incumple una `weak_password`, o por qué se ha pedido o rechazado una prueba de trabajo (`pow_required`).'
          enum:
            - too_short
            - too_long
            - contains_username
            - contains_email
            - too_common
            - required
            - malformed
            - signature
            - endpoint
            - network
            - expired
            - bits
            - work
            - replayed
        pow:
          $ref: '#/components/schemas/PowChallenge'
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Solo con `banned`: el final de la suspensión (ms desde la época Unix), `null` para una suspensión permanente.'
        line:
          type: integer
          minimum: 1
          description: 'Solo con `invalid_pgn`: la línea del error, desde 1.'
        column:
          type: integer
          minimum: 1
          description: 'Solo con `invalid_pgn`: la columna del error, desde 1, en caracteres.'
    PowChallenge:
      type: object
      description: Un desafío de prueba de trabajo (el `pow` de un 428 `pow_required`).
      required:
        - challenge
        - bits
        - expiresAt
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,400}\.[A-Za-z0-9_-]{43}$'
          description: El desafío firmado, que se debe devolver tal cual.
        bits:
          type: integer
          minimum: 1
          maximum: 26
          description: El número de bits a cero iniciales que debe tener `SHA-256(challenge + ":" + nonce)`.
        expiresAt:
          type: integer
          format: int64
          description: Cuándo caduca el desafío (ms desde la época Unix), 2 minutos después de su emisión.
    PowAnswer:
      type: object
      description: La respuesta a un desafío de prueba de trabajo.
      additionalProperties: false
      required:
        - challenge
        - nonce
      properties:
        challenge:
          type: string
          minLength: 16
          maxLength: 512
          description: El `challenge` de la respuesta 428, tal como se recibió.
        nonce:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: Una cadena decimal de 20 cifras como máximo tal que `SHA-256(challenge + ":" + nonce)` empiece por `bits` bits a cero.
    ServerInfo:
      type: object
      description: Lo que un cliente necesita antes de iniciar sesión o de conectarse.
      required:
        - name
        - serverId
        - motd
        - protocol
        - wsPort
        - wsPath
        - registration
        - emailVerification
        - sso
        - mfa
        - pow
        - categories
        - limits
      properties:
        name:
          type: string
          description: El nombre del servidor (`SERVER_NAME`).
        serverId:
          type:
            - string
            - 'null'
          format: uuid
          description: Un UUID que la base de datos recibe en su primer arranque. Se mantiene igual entre reinicios. Es `null` cuando la base de datos no puede proporcionarlo.
        motd:
          type: string
          description: El mensaje del día (`SERVER_MOTD`), posiblemente vacío.
        protocol:
          type: object
          description: El protocolo WebSocket (`PROTOCOL.md`).
          required:
            - min
            - max
            - schema
            - subprotocol
          properties:
            min:
              type: integer
              minimum: 1
              description: La versión de protocolo más antigua que admite el servidor.
            max:
              type: integer
              minimum: 1
              description: La versión de protocolo más reciente que admite el servidor.
            schema:
              type: integer
              format: int64
              minimum: 0
              maximum: 4294967295
              description: La huella digital del esquema del protocolo (los 4 primeros bytes del SHA-256 de su forma canónica, como entero sin signo); a título informativo.
            subprotocol:
              type: string
              description: El nombre del subprotocolo WebSocket (`Sec-WebSocket-Protocol`).
        wsPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: El puerto del WebSocket que usan los jugadores (`PUBLIC_WS_PORT` o, en su defecto, `WS_PORT` o, en su defecto, `API_PORT`).
        wsPath:
          type: string
          const: /ws
          description: La ruta del WebSocket.
        registration:
          type: string
          enum:
            - open
            - closed
          description: Si se pueden crear cuentas nuevas.
        emailVerification:
          type: boolean
          description: Si las cuentas nuevas deben confirmar su dirección (`REQUIRE_EMAIL_VERIFICATION`).
        sso:
          type: object
          required:
            - google
          properties:
            google:
              type: boolean
              description: Si se ofrece el inicio de sesión con Google.
        mfa:
          type: boolean
          const: true
          description: La autenticación de dos factores siempre está disponible.
        pow:
          type: object
          required:
            - register
          properties:
            register:
              type: integer
              minimum: 0
              maximum: 26
              description: Los bits de prueba de trabajo que exige el registro (0 si no se exige ninguna).
        categories:
          type: array
          description: Los ritmos de juego oficiales (puntuables) (`RATED_CATEGORIES`), en el orden del servidor. Cualquier otro ritmo de juego es `custom`.
          items:
            $ref: '#/components/schemas/Category'
        limits:
          type: object
          description: Las reglas que un cliente puede comprobar antes de enviar un formulario.
          required:
            - usernameMin
            - usernameMax
            - usernamePattern
            - passwordMinLength
            - passwordMaxBytes
            - customTimeControls
            - reportsPerDay
            - wsMaxMessageBytes
          properties:
            usernameMin:
              type: integer
              description: La longitud mínima del nombre de usuario (`USERNAME_MIN`).
            usernameMax:
              type: integer
              description: La longitud máxima del nombre de usuario (`USERNAME_MAX`).
            usernamePattern:
              type: string
              description: La expresión regular que debe cumplir un nuevo nombre de usuario.
            passwordMinLength:
              type: integer
              description: La longitud mínima de la contraseña, en caracteres (`PASSWORD_MIN_LENGTH`).
            passwordMaxBytes:
              type: integer
              description: La longitud máxima de la contraseña, en bytes de UTF-8.
            customTimeControls:
              type: boolean
              description: Si los retos y las partidas privadas pueden usar ritmos de juego personalizados.
            reportsPerDay:
              type: integer
              description: Cuántas denuncias puede presentar un jugador cada 24 horas (`REPORTS_PER_DAY`).
            wsMaxMessageBytes:
              type: integer
              description: El mayor mensaje WebSocket que puede enviar un cliente, en bytes.
      example:
        name: Scacelith
        serverId: 07dd26af-672a-43af-a8af-34011c7e977b
        motd: ''
        protocol:
          min: 1
          max: 1
          schema: 1852590473
          subprotocol: scacelith.rt1
        wsPort: 443
        wsPath: /ws
        registration: open
        emailVerification: true
        sso:
          google: false
        mfa: true
        pow:
          register: 18
        categories:
          - id: '1+0'
            baseSec: 60
            incSec: 0
          - id: '3+2'
            baseSec: 180
            incSec: 2
        limits:
          usernameMin: 3
          usernameMax: 20
          usernamePattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          passwordMinLength: 10
          passwordMaxBytes: 256
          customTimeControls: true
          reportsPerDay: 5
          wsMaxMessageBytes: 512
    Category:
      type: object
      description: Un ritmo de juego oficial.
      required:
        - id
        - baseSec
        - incSec
      properties:
        id:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: 'El identificador de la categoría: minutos e incremento en segundos (`3+2`).'
        baseSec:
          type: number
          minimum: 0
          description: El tiempo base, en segundos.
        incSec:
          type: number
          minimum: 0
          description: El incremento por jugada, en segundos.
    AccountView:
      type: object
      description: La cuenta tal como la ve su jugador (`user` de las respuestas de inicio de sesión y de `GET /account/me`).
      required:
        - id
        - username
        - email
        - emailVerified
        - mfaEnabled
        - googleLinked
        - hasPassword
        - acceptChallenges
        - createdAt
        - lastLoginAt
        - pendingEmail
      properties:
        id:
          type: integer
          format: int64
          description: El identificador de la cuenta.
        username:
          type: string
          description: El nombre de usuario.
        email:
          type: string
          format: email
          description: La dirección de correo electrónico.
        emailVerified:
          type: boolean
          description: Si la dirección está confirmada.
        mfaEnabled:
          type: boolean
          description: Si la autenticación de dos factores está activada.
        googleLinked:
          type: boolean
          description: Si hay una cuenta de Google vinculada.
        hasPassword:
          type: boolean
          description: '`false` para una cuenta creada a través de Google que aún no ha definido una contraseña.'
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: Si se aceptan los retos directos por nombre (véase `PUT /account/preferences`).
        createdAt:
          type: integer
          format: int64
          description: Cuándo se creó la cuenta (ms desde la época Unix).
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
          description: El último inicio de sesión (ms desde la época Unix), o `null`.
        pendingEmail:
          type:
            - string
            - 'null'
          format: email
          description: La nueva dirección de un cambio de correo pendiente de su enlace, o `null`.
    SessionAnswer:
      type: object
      description: Una sesión nueva.
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: '^sct_[A-Za-z0-9_-]{43}$'
          description: El token de sesión, para el encabezado `Authorization` y el WebSocket.
        expiresAt:
          type: integer
          format: int64
          description: El final absoluto de la sesión (ms desde la época Unix); el límite de inactividad puede terminarla antes.
        user:
          $ref: '#/components/schemas/AccountView'
      example:
        token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
        expiresAt: 1798658839708
        user:
          id: 1
          username: alice
          email: alice@example.org
          emailVerified: true
          mfaEnabled: true
          googleLinked: false
          hasPassword: true
          acceptChallenges: all
          createdAt: 1790882839743
          lastLoginAt: 1790882839708
          pendingEmail: null
    MfaChallenge:
      type: object
      description: El segundo paso de un inicio de sesión con autenticación de dos factores; continúe con `POST /auth/login/mfa`.
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          pattern: '^mfa_[A-Za-z0-9_-]{43}$'
          description: El token del paso, para `POST /auth/login/mfa`.
        expiresIn:
          type: integer
          const: 300
          description: Segundos que quedan para completar el paso.
    LoginAnswer:
      description: Una sesión, o el segundo paso de un inicio de sesión con autenticación de dos factores.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
    SsoNeedsUsername:
      type: object
      description: Un primer inicio de sesión con Google; continúe con `POST /auth/sso/complete`.
      required:
        - needsUsername
        - ssoTicket
        - suggestedUsername
      properties:
        needsUsername:
          type: boolean
          const: true
        ssoTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: El ticket para `POST /auth/sso/complete`, válido durante 10 minutos.
        suggestedUsername:
          type: string
          description: Un nombre de usuario formado a partir del nombre de Google o de la dirección, o `""` cuando nada encaja.
    SsoNeedsPassword:
      type: object
      description: Una cuenta con contraseña usa la dirección; continúe con `POST /auth/sso/google/link`. Todavía no se ha vinculado nada.
      required:
        - needsPassword
        - linkTicket
        - username
        - expiresIn
      properties:
        needsPassword:
          type: boolean
          const: true
        linkTicket:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: El ticket para `POST /auth/sso/google/link`.
        username:
          type: string
          description: El nombre de usuario de esa cuenta (solo lo ve quien ha demostrado ante Google que la dirección es suya).
        expiresIn:
          type: integer
          const: 600
          description: Segundos durante los que el ticket sigue siendo válido.
    SsoFinishAnswer:
      description: La respuesta de `POST /auth/sso/google/finish`.
      oneOf:
        - $ref: '#/components/schemas/SessionAnswer'
        - $ref: '#/components/schemas/MfaChallenge'
        - $ref: '#/components/schemas/SsoNeedsUsername'
        - $ref: '#/components/schemas/SsoNeedsPassword'
    SsoStartAnswer:
      type: object
      description: Un intento de inicio de sesión con Google.
      required:
        - attemptId
        - authUrl
        - state
        - expiresIn
      properties:
        attemptId:
          type: string
          pattern: '^sso_[A-Za-z0-9_-]{43}$'
          description: El intento, para `POST /auth/sso/google/finish`.
        authUrl:
          type: string
          format: uri
          description: La URL de Google que se debe abrir en el navegador del sistema, una vez comprobada.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: El `state` que Google debe devolver.
        expiresIn:
          type: integer
          const: 600
          description: Segundos durante los que el intento sigue siendo válido.
    VerificationSentStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: verification_sent
    AcceptedStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: accepted
    LoggedOutStatus:
      type: object
      required:
        - status
      properties:
        status:
          const: logged_out
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: El nombre de usuario; se aplican además las reglas del servidor (véase la descripción).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: La dirección de correo electrónico. Se le quitan los espacios de los extremos y se guarda en minúsculas.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: La contraseña; se aplican además las reglas de contraseñas.
        pow:
          $ref: '#/components/schemas/PowAnswer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: El nombre de usuario o la dirección de correo electrónico (cualquier texto con `@`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    ClientLabel:
      type: string
      maxLength: 64
      description: Opcional. Se muestra en la lista de dispositivos con sesión iniciada (por ejemplo, `Scacelith 1.4 (Windows)`).
    MfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
      properties:
        mfaToken:
          type: string
          minLength: 1
          maxLength: 64
          description: El `mfaToken` de la respuesta de inicio de sesión (o de la de un inicio de sesión con Google).
        code:
          type: string
          maxLength: 32
          description: Opcional. Un código de 6 cifras de la aplicación de autenticación, o un código de recuperación.
        recoveryCode:
          type: string
          maxLength: 32
          description: Opcional. Un código de recuperación. Se necesita `code` o `recoveryCode`.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: La dirección de correo electrónico.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: El parámetro `token` del enlace de restablecimiento.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: La nueva contraseña; se aplican las reglas de contraseñas del registro.
    SsoStartRequest:
      type: object
      additionalProperties: false
      required:
        - codeChallenge
        - redirectPort
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: El desafío PKCE S256 del `codeVerifier` del cliente (`BASE64URL(SHA-256(codeVerifier))`).
        redirectPort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: El puerto en el que escucha el cliente en `127.0.0.1`.
    SsoFinishRequest:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - codeVerifier
        - state
        - code
      properties:
        attemptId:
          type: string
          minLength: 1
          maxLength: 64
          description: El `attemptId` de `POST /auth/sso/google/start`.
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: El verificador PKCE; su SHA-256 debe corresponder al desafío entregado a `start`.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: El `state` tal como lo devolvió Google.
        code:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[\x21-\x7E]+$'
          description: El `code` tal como lo devolvió Google (ASCII imprimible sin espacios).
        iss:
          type: string
          minLength: 1
          maxLength: 256
          description: Opcional. El `iss` tal como lo devolvió Google, si lo hizo.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SsoLinkRequest:
      type: object
      additionalProperties: false
      required:
        - linkTicket
        - password
      properties:
        linkTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: El `linkTicket` de `finish`, válido durante 10 minutos.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: La contraseña de la cuenta.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
        pow:
          $ref: '#/components/schemas/PowAnswer'
    SsoCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - ssoTicket
        - username
      properties:
        ssoTicket:
          type: string
          minLength: 1
          maxLength: 64
          description: El `ssoTicket` de `finish`, válido durante 10 minutos.
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: El nombre de usuario; se aplican las reglas del registro.
        clientLabel:
          $ref: '#/components/schemas/ClientLabel'
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          description: Las sesiones activas, primero las usadas más recientemente.
          items:
            $ref: '#/components/schemas/SessionEntry'
    SessionEntry:
      type: object
      description: Una sesión activa (un dispositivo con sesión iniciada).
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - clientLabel
        - current
      properties:
        id:
          type: integer
          format: int64
          description: El identificador de la sesión, para `DELETE /auth/sessions/{id}`.
        createdAt:
          type: integer
          format: int64
          description: El inicio de sesión (ms desde la época Unix).
        lastSeenAt:
          type: integer
          format: int64
          description: El último uso (ms desde la época Unix), actualizado como máximo cada 5 minutos.
        expiresAt:
          type: integer
          format: int64
          description: El final absoluto (ms desde la época Unix); el límite de inactividad puede terminar la sesión antes.
        clientLabel:
          type:
            - string
            - 'null'
          description: El `clientLabel` del inicio de sesión, o `null` si no se envió ninguno.
        current:
          type: boolean
          description: Si es la sesión que hace la solicitud.
    AccountMe:
      type: object
      required:
        - user
        - ratings
        - sanctions
        - ban
      properties:
        user:
          $ref: '#/components/schemas/AccountView'
        ratings:
          type: array
          description: Un registro por cada categoría en la que el jugador ha jugado partidas puntuables.
          items:
            $ref: '#/components/schemas/RatingSummary'
        sanctions:
          type: array
          description: Las sanciones activas.
          items:
            $ref: '#/components/schemas/ActiveSanction'
        ban:
          description: '`{ until }` mientras la cuenta está suspendida; si no, `null`.'
          oneOf:
            - $ref: '#/components/schemas/Ban'
            - type: 'null'
    RatingSummary:
      type: object
      description: El registro de puntuación de una categoría.
      required:
        - category
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
        - provisional
      properties:
        category:
          type: string
          description: El identificador de la categoría.
        rating:
          type: integer
          description: La puntuación.
        games:
          type: integer
          minimum: 0
          description: Las partidas jugadas en la categoría (contabilizadas o no).
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
          description: La puntuación más alta alcanzada.
        provisional:
          type: boolean
          description: '`true` mientras la puntuación aún no está establecida o tiene menos de `PROVISIONAL_GAMES` partidas contabilizadas (el juego la muestra como `1510?`).'
    ActiveSanction:
      type: object
      required:
        - kind
        - reason
        - startsAt
        - endsAt
      properties:
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
          description: El tipo de sanción.
        reason:
          type:
            - string
            - 'null'
          description: El motivo indicado, si lo hay.
        startsAt:
          type: integer
          format: int64
          description: El inicio (ms desde la época Unix).
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
          description: El final (ms desde la época Unix), `null` cuando la sanción es permanente.
    Ban:
      type: object
      required:
        - until
      properties:
        until:
          type:
            - integer
            - 'null'
          format: int64
          description: El final de la suspensión (ms desde la época Unix), `null` cuando es permanente.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - acceptChallenges
      properties:
        acceptChallenges:
          type: string
          enum:
            - all
            - none
          description: '`all` para aceptar los retos directos por nombre, `none` para rechazarlos.'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: La contraseña actual.
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: La nueva contraseña; se aplican las reglas de contraseñas del registro.
    PasswordOnlyRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: La contraseña de la cuenta.
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Un código del secreto pendiente, de exactamente 6 cifras.
    ReauthCredentials:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: La contraseña de la cuenta.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Opcional; necesario con la autenticación de dos factores (o bien `recoveryCode`). Un código de la aplicación de autenticación, o un código de recuperación.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Opcional. Un código de recuperación (`xxxx-xxxx-xx`; no importan las mayúsculas, los espacios ni los guiones).
    RecoveryCodesRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: La contraseña de la cuenta.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Un código de la aplicación de autenticación (un código de recuperación se rechaza).
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: La nueva dirección; se le quitan los espacios de los extremos, se pasa a minúsculas y después se comprueba como una dirección de registro.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: La contraseña de la cuenta.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Opcional; necesario con la autenticación de dos factores (o bien `recoveryCode`). Un código de la aplicación de autenticación, o un código de recuperación.
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Opcional. Un código de recuperación.
    TotpSetup:
      type: object
      description: El secreto pendiente para la aplicación de autenticación.
      required:
        - secret
        - uri
        - algorithm
        - digits
        - period
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: El secreto en base32, para escribirlo en la aplicación.
        uri:
          type: string
          format: uri
          description: La URI `otpauth://totp/...`, para mostrarla como código QR.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
          description: Segundos por intervalo.
    RecoveryCodeList:
      type: array
      description: Los 10 códigos de recuperación, que solo se muestran esta vez. Cada uno sirve una sola vez.
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: '^[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{4}-[0-9a-hjkmnp-tv-z]{2}$'
    PlayerSide:
      type: object
      description: Un bando de una partida.
      required:
        - name
        - rating
        - ratingAfter
        - ratingDiff
      properties:
        name:
          type: string
          description: El nombre en el registro de la partida (`deleted#<id>` para una cuenta eliminada).
        rating:
          type:
            - integer
            - 'null'
          description: La puntuación al inicio, `null` si se desconoce.
        ratingAfter:
          type:
            - integer
            - 'null'
          description: La puntuación después de la partida. Una partida puntuable siempre la tiene; `null` solo para una partida que no cuenta para las puntuaciones (amistosa, personalizada, anulada).
        ratingDiff:
          type:
            - integer
            - 'null'
          description: La variación de la puntuación, `0` cuando las reglas de puntuación dejan la puntuación donde estaba (la regla de la FIDE sobre los resultados de cero puntos, un rival sin puntuación, las primeras partidas de un jugador sin puntuación); `null` en los mismos casos que `ratingAfter`.
    GameSummary:
      type: object
      description: El resumen de una partida guardada.
      required:
        - id
        - category
        - rated
        - timeControl
        - white
        - black
        - status
        - reason
        - result
        - termination
        - plies
        - startedAt
        - endedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: El identificador de la partida.
        category:
          type: string
          description: El identificador de la categoría oficial (`3+2`), o `custom`.
        rated:
          type: boolean
          description: Si la partida cuenta para las puntuaciones.
        timeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
          description: El ritmo de juego en segundos (`180+2`).
        white:
          $ref: '#/components/schemas/PlayerSide'
        black:
          $ref: '#/components/schemas/PlayerSide'
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
          description: '1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (véanse los códigos de partida).'
        reason:
          type: integer
          minimum: 0
          maximum: 255
          description: El código del motivo del final (véanse los códigos de partida).
        result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
          description: El resultado, `*` para una partida anulada.
        termination:
          $ref: '#/components/schemas/Termination'
        plies:
          type: integer
          minimum: 0
          description: El número de medias jugadas.
        startedAt:
          type: integer
          format: int64
          description: El inicio (ms desde la época Unix).
        endedAt:
          type: integer
          format: int64
          description: El final (ms desde la época Unix).
    Termination:
      type: string
      description: El nombre del motivo del final (véanse los códigos de partida); `Unknown` para un código que el protocolo no conoce.
      enum:
        - Checkmate
        - Resignation
        - Timeout
        - IllegalMoves
        - Stalemate
        - InsufficientMaterial
        - TimeoutVsInsufficient
        - FivefoldRepetition
        - SeventyFiveMoves
        - ThreefoldClaim
        - FiftyMoveClaim
        - Agreement
        - IllegalMovesVsInsufficient
        - ResignationVsInsufficient
        - Abandonment
        - AbandonmentVsInsufficient
        - Aborted
        - NoShow
        - Forfeit
        - ServerAborted
        - BothDisconnected
        - Unknown
    PlayerGameSummary:
      description: El resumen de una partida desde el punto de vista de uno de los jugadores.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - color
          properties:
            color:
              type: string
              enum:
                - white
                - black
              description: El bando del jugador.
    HistoryGameSummary:
      description: Una partida del historial del jugador con la sesión iniciada.
      allOf:
        - $ref: '#/components/schemas/PlayerGameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - outcome
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: El tiempo base en milisegundos.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: El incremento en milisegundos.
            outcome:
              type: string
              enum:
                - win
                - loss
                - draw
                - aborted
              description: El desenlace desde el punto de vista del jugador.
    HistoryPage:
      type: object
      required:
        - games
        - next
        - total
      properties:
        games:
          type: array
          description: Las partidas de la página, de la más reciente a la más antigua.
          items:
            $ref: '#/components/schemas/HistoryGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: El identificador que se debe pasar como `before` para la página siguiente, o `null` en la última página.
        total:
          type: integer
          minimum: 0
          description: El número de partidas que cumplen el filtro, en todas las páginas.
    MoveRecord:
      type: object
      description: Una media jugada de una partida.
      required:
        - uci
        - spentMs
        - clockMs
      properties:
        uci:
          type: string
          pattern: '^[a-h][1-8][a-h][1-8][nbrq]?$'
          description: La jugada en notación UCI, con `n`, `b`, `r` o `q` añadido en caso de promoción.
        spentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: El tiempo descontado por la jugada (ms), `null` cuando el registro no lo tiene.
        clockMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: El reloj del jugador que mueve después de la jugada (ms), `null` cuando el registro no lo tiene.
    PgnTagsView:
      type: object
      description: Las principales etiquetas PGN, para mostrarlas. Aquí `Termination` es el nombre del motivo del final; el archivo PGN usa los valores del estándar PGN.
      required:
        - Event
        - Site
        - Date
        - Round
        - White
        - Black
        - Result
        - WhiteElo
        - BlackElo
        - TimeControl
        - Termination
        - PlyCount
      properties:
        Event:
          type: string
          description: '`<SERVER_NAME> rated <category>` o `<SERVER_NAME> casual <category>`.'
        Site:
          type: string
          description: 'El valor de `SERVER_PUBLIC_HOST`.'
        Date:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
          description: La fecha UTC de inicio.
        Round:
          type: string
          const: '-'
        White:
          type: string
        Black:
          type: string
        Result:
          type: string
          enum:
            - 1-0
            - 0-1
            - 1/2-1/2
            - '*'
        WhiteElo:
          description: La puntuación al inicio, o `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        BlackElo:
          description: La puntuación al inicio, o `"-"`.
          oneOf:
            - type: integer
            - type: string
              const: '-'
        TimeControl:
          type: string
          pattern: '^[0-9]+\+[0-9]+$'
        Termination:
          $ref: '#/components/schemas/Termination'
        PlyCount:
          type: integer
          minimum: 0
    GameRecord:
      description: El registro de una partida con sus jugadas y sus relojes. Tiene los campos del resumen de una partida, sin `color` ni `outcome`.
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - baseMs
            - incMs
            - statusName
            - rematchOf
            - moves
            - pgn
          properties:
            baseMs:
              type: integer
              format: int64
              minimum: 0
              description: El tiempo base en milisegundos.
            incMs:
              type: integer
              format: int64
              minimum: 0
              description: El incremento en milisegundos.
            statusName:
              type: string
              enum:
                - WhiteWins
                - BlackWins
                - Draw
                - Aborted
              description: El nombre de `status`.
            rematchOf:
              type:
                - integer
                - 'null'
              format: int64
              description: El identificador de la partida de la que esta es la revancha, o `null`.
            moves:
              type: array
              description: Una entrada por media jugada.
              items:
                $ref: '#/components/schemas/MoveRecord'
            pgn:
              $ref: '#/components/schemas/PgnTagsView'
            you:
              type: string
              enum:
                - white
                - black
              description: 'Solo cuando el jugador del token ha jugado esta partida: su bando.'
            reportable:
              type: boolean
              description: 'Solo cuando el jugador del token ha jugado esta partida: `true` cuando `POST /reports` aceptaría ahora una denuncia del rival por esta partida (la partida terminó hace menos de 7 días, la cuota diaria no se ha agotado y el rival aún no ha sido denunciado por esta partida).'
    PlayerProfile:
      type: object
      required:
        - username
        - createdAt
        - ratings
        - games
      properties:
        username:
          type: string
          description: El nombre de usuario, tal como lo escribió el jugador.
        createdAt:
          type: integer
          format: int64
          description: Cuándo se creó la cuenta (ms desde la época Unix).
        ratings:
          type: array
          description: Solo las categorías oficiales, en el orden del servidor.
          items:
            $ref: '#/components/schemas/RatingSummary'
        games:
          type: object
          required:
            - total
            - rated
            - wins
            - draws
            - losses
          properties:
            total:
              type: integer
              minimum: 0
              description: Todas las partidas guardadas, incluidas las amistosas y las anuladas.
            rated:
              type: integer
              minimum: 0
              description: Las partidas puntuables, sumadas a partir de los registros de puntuación.
            wins:
              type: integer
              minimum: 0
            draws:
              type: integer
              minimum: 0
            losses:
              type: integer
              minimum: 0
    PlayerGamesPage:
      type: object
      required:
        - username
        - games
        - next
      properties:
        username:
          type: string
          description: El nombre de usuario, tal como lo escribió el jugador.
        games:
          type: array
          description: Las partidas de la página, de la más reciente a la más antigua.
          items:
            $ref: '#/components/schemas/PlayerGameSummary'
        next:
          type:
            - integer
            - 'null'
          format: int64
          description: El identificador de la última partida siempre que la página está completa (en ese caso, la página siguiente puede estar vacía); si no, `null`.
    Leaderboard:
      type: object
      required:
        - category
        - minGames
        - updatedAt
        - players
      properties:
        category:
          type: string
          description: El identificador de la categoría.
        minGames:
          type: integer
          minimum: 0
          description: Las partidas contabilizadas que necesita un registro para figurar en la clasificación (`PROVISIONAL_GAMES`).
        updatedAt:
          type: integer
          format: int64
          description: Cuándo se calculó la clasificación (ms desde la época Unix).
        players:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - username
        - rating
        - games
        - wins
        - draws
        - losses
        - peak
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        rating:
          type: integer
        games:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        peak:
          type: integer
    GifRequest:
      type: object
      additionalProperties: false
      required:
        - pgn
      properties:
        pgn:
          type: string
          description: El texto PGN, como máximo 65 536 bytes en UTF-8. Solo se usa la primera partida.
        size:
          type: string
          enum:
            - small
            - medium
            - large
          default: medium
          description: Opcional. El tamaño de la imagen.
        orientation:
          type: string
          enum:
            - white
            - black
          default: white
          description: Opcional. El bando situado en la parte inferior del tablero.
        delayMs:
          type: integer
          minimum: 100
          maximum: 3000
          default: 500
          description: Opcional. Milisegundos por jugada, un número JSON con valor entero.
        coords:
          type: boolean
          default: true
          description: Opcional. Si se dibujan alrededor del tablero las letras de las columnas y los números de las filas.
    ReportRequest:
      type: object
      required:
        - gameId
        - reported
        - category
      properties:
        gameId:
          description: La partida, como entero o como cadena de 1 a 16 cifras.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: '^[0-9]{1,16}$'
        reported:
          type: string
          minLength: 1
          maxLength: 24
          description: El nombre de usuario del rival, tal como figura en el registro de la partida o tal como es ahora, sin distinguir mayúsculas de minúsculas. No puede estar en blanco.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
          description: El motivo de la denuncia.
        comment:
          type:
            - string
            - 'null'
          description: Opcional. Como máximo 500 caracteres, una vez eliminados los caracteres de control (salvo la tabulación y el salto de línea) y los espacios de los extremos.
    AccountExport:
      type: object
      description: Todo lo que el servidor guarda sobre la cuenta (marcas de tiempo en ms desde la época Unix).
      required:
        - format
        - version
        - exportedAt
        - server
        - notes
        - account
        - ratings
        - ratingRefunds
        - sessions
        - securityEvents
        - sanctions
        - conduct
        - reportsFiled
        - games
      properties:
        format:
          type: string
          const: scacelith-account-export
        version:
          type: integer
          const: 1
        exportedAt:
          type: integer
          format: int64
          description: Cuándo se hizo la exportación.
        server:
          type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: 'El valor de `SERVER_NAME`.'
            host:
              type: string
              description: 'El valor de `SERVER_PUBLIC_HOST`.'
        notes:
          type: array
          description: Lo que contiene el archivo y lo que deja fuera, explicado al jugador en un inglés sencillo.
          items:
            type: string
        account:
          description: La vista de la cuenta de `GET /account/me`, con `googleEmail`.
          allOf:
            - $ref: '#/components/schemas/AccountView'
            - type: object
              required:
                - googleEmail
              properties:
                googleEmail:
                  type:
                    - string
                    - 'null'
                  description: La dirección de la cuenta de Google vinculada, o `null`.
        ratings:
          type: array
          description: Los registros de puntuación completos.
          items:
            $ref: '#/components/schemas/ExportRating'
        ratingRefunds:
          type: array
          description: Los puntos de puntuación restituidos tras descubrirse que un rival hacía trampas, sumados por día UTC y por categoría, del más reciente al más antiguo. No se nombran ni las partidas ni a los tramposos.
          items:
            $ref: '#/components/schemas/RatingRefund'
        sessions:
          type: array
          description: Todas las sesiones guardadas, de la más reciente a la más antigua, sin ningún token. La depuración por plazo de conservación elimina las sesiones caducadas, y las sesiones cerradas un día después del cierre de sesión.
          items:
            $ref: '#/components/schemas/ExportSession'
        securityEvents:
          type: array
          description: Los eventos de seguridad, del más reciente al más antiguo, conservados durante `RETENTION_SECURITY_DAYS`.
          items:
            $ref: '#/components/schemas/SecurityEvent'
        sanctions:
          type: array
          description: Todas las sanciones, incluidas las levantadas. Nunca se incluye el nombre del moderador.
          items:
            $ref: '#/components/schemas/ExportSanction'
        conduct:
          type: array
          description: Los eventos de conducta registrados para las partidas del jugador abandonadas, anuladas o sin primera jugada a tiempo, conservados durante 30 días.
          items:
            $ref: '#/components/schemas/ConductEvent'
        reportsFiled:
          type: array
          description: Las denuncias que ha presentado el jugador.
          items:
            $ref: '#/components/schemas/FiledReport'
        games:
          type: object
          required:
            - total
            - list
          properties:
            total:
              type: integer
              minimum: 0
              description: El número de partidas.
            list:
              type: array
              description: Todas las partidas, de la más reciente a la más antigua, como los resúmenes de `GET /account/games`. Las jugadas están en `GET /games/{id}` y el PGN en `GET /games/{id}/pgn`.
              items:
                $ref: '#/components/schemas/HistoryGameSummary'
    ExportRating:
      description: Un registro de puntuación completo.
      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required:
            - rated
            - countedGames
            - updatedAt
          properties:
            rated:
              type: boolean
              description: Si el jugador ha salido de la fase sin puntuación establecida.
            countedGames:
              type: integer
              minimum: 0
              description: Las partidas que han entrado en el cálculo de la puntuación.
            updatedAt:
              type: integer
              format: int64
              description: Cuándo cambió el registro por última vez.
    RatingRefund:
      type: object
      required:
        - day
        - category
        - points
      properties:
        day:
          type: integer
          format: int64
          description: Las 00:00 UTC del día (ms desde la época Unix).
        category:
          type: string
        points:
          type: integer
          description: Los puntos restituidos ese día en esa categoría.
    ExportSession:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - revokedAt
        - clientLabel
        - ip
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        lastSeenAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        revokedAt:
          type:
            - integer
            - 'null'
          format: int64
          description: Cuándo se cerró la sesión, o `null`.
        clientLabel:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
          description: La dirección del inicio de sesión, que se borra al cabo de `RETENTION_IP_DAYS`.
    SecurityEvent:
      type: object
      description: |-
        Un evento de seguridad. `ip` solo se indica para lo que se hizo con la sesión iniciada, con la contraseña de la cuenta (y el segundo factor) o con un enlace enviado a su dirección: `register`, `email_verified`, `login`, `sso_login`, `sso_linked`, `sso_account_created`, `recovery_code_used`, `password_reset`, `password_changed`, `reauth_failed`, `mfa_setup_started`, `mfa_enabled`, `mfa_disabled`, `recovery_codes_regenerated`, `session_revoked`, `sessions_revoked_all`, `email_change_requested`, `email_changed`, `email_change_refused` y `account_exported`; todos los demás tipos tienen `ip: null`, e `ip` se borra al cabo de `RETENTION_IP_DAYS`.

        `detail` solo conserva estos campos: `login`: `method`; `sso_login`, `sso_account_created`: `provider`; `sso_linked`: `provider` y `method` (`password` o `password+totp`); `login_failed`: `failures`; `login_lockout`: `retryAfterMs`; `mfa_failed`: `attempts`; `recovery_code_used`: `remaining`; `reauth_failed`: `factor`; `session_revoked` y `sessions_revoked_all`: `reason`; `email_change_refused`: `reason`; `sanction_auto`: `kind`, `gameId`, `until`. Un evento `moderator_action` solo conserva `{ action }`, para las acciones `ban`, `unban`, `reset_mfa`, `verify_email` y `revoke_sessions` (las demás acciones de los moderadores quedan fuera). Todos los demás tipos tienen `detail: null`. Los eventos `rating_refund` quedan fuera: sus puntos figuran en `ratingRefunds`.
      required:
        - kind
        - at
        - ip
        - detail
      properties:
        kind:
          type: string
          description: El tipo de evento (`login`, `password_changed`...).
        at:
          type: integer
          format: int64
          description: Cuándo se produjo.
        ip:
          type:
            - string
            - 'null'
        detail:
          type:
            - object
            - 'null'
    ExportSanction:
      type: object
      required:
        - id
        - kind
        - reason
        - source
        - gameId
        - startsAt
        - endsAt
        - createdAt
        - liftedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - ban
            - mm_block
            - warning
        reason:
          type:
            - string
            - 'null'
        source:
          type: string
          enum:
            - auto
            - moderator
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        startsAt:
          type: integer
          format: int64
        endsAt:
          type:
            - integer
            - 'null'
          format: int64
        createdAt:
          type: integer
          format: int64
        liftedAt:
          type:
            - integer
            - 'null'
          format: int64
    ConductEvent:
      type: object
      required:
        - kind
        - at
      properties:
        kind:
          type: string
          enum:
            - abandon
            - abort
            - noshow
        at:
          type: integer
          format: int64
    FiledReport:
      type: object
      required:
        - gameId
        - reported
        - category
        - comment
        - createdAt
        - status
      properties:
        gameId:
          type:
            - integer
            - 'null'
          format: int64
        reported:
          type: string
          description: El nombre público actual del jugador denunciado.
        category:
          type: string
          enum:
            - cheating
            - abuse
            - other
        comment:
          type:
            - string
            - 'null'
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - open
            - closed
          description: Si la denuncia sigue abierta (no se indica si el jugador denunciado ha sido sancionado).
    LinkTokenForm:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: El token del enlace del correo (el campo oculto del formulario de la página).
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: El token del enlace de restablecimiento (el campo oculto del formulario).
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: La nueva contraseña; se aplican las reglas de contraseñas del registro.
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: De nuevo la nueva contraseña; debe coincidir.
    HtmlDocument:
      type: string
      contentMediaType: text/html
      description: Una página HTML en UTF-8 (`text/html; charset=utf-8`), sin JavaScript ni recursos externos.
