      summary: Terminar de activar la autenticación de dos factores y obtener los códigos de recuperación
      description: |-
        Activa la autenticación de dos factores con un código del secreto pendiente (exactamente 6 cifras). Aquí no se pide la contraseña: ya se dio en la configuración. La respuesta contiene 10 códigos de recuperación, que solo se muestran esta vez.

        **Límites:** `reauth` y después `reauth_user`; un código erróneo cuenta en los fallos de reautenticación de la cuenta.
      security:
        - bearerAuth: []
