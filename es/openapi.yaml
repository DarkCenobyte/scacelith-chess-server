  /account/delete:
    post:
      operationId: deleteAccount
      tags:
        - account-deletion
      summary: Eliminar la cuenta
      description: |-
        Elimina la cuenta; esta acción no se puede deshacer.

        - Todas las sesiones se revocan de inmediato: a partir de ese momento, el token recibe 401 `invalid_token`.
        - El nombre de usuario pasa a ser `deleted#<id>`, en la cuenta y en todos los registros de partidas.
        - Se borran: la dirección de correo, el hash de la contraseña, el secreto de la autenticación de dos factores y los códigos de recuperación, las sesiones y los tokens de enlace, el vínculo con Google, el registro de integridad del sistema antitrampas y las direcciones IP guardadas con los eventos de seguridad.
        - Las puntuaciones y las partidas se conservan. Las partidas siguen pudiendo consultarse con el nombre anónimo, y `GET /players/{username}` responde 404 para el nombre anterior.

        **Reautenticación:** la contraseña y, con la autenticación de dos factores, un código de la aplicación de autenticación o un código de recuperación. **Límites:** `reauth` y después `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthCredentials'
            example:
              password: correct horse battery
              code: '123456'
      responses:
        '200':
          description: La cuenta se ha eliminado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: deleted
              example:
                status: deleted
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (una cuenta que solo usa Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`, `mfa_code_required` o `invalid_code`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (reautenticaciones fallidas, o demasiados códigos probados en esta cuenta), o `rate_limited` (el límite `reauth` o `reauth_user`, el presupuesto de la cuenta, la cola de hash de contraseñas).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la cola de hash de contraseñas, o la base de datos ha seguido bloqueada), `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /account/games:
    get:
      operationId: listAccountGames
      tags:
        - game-history
      summary: Listar las partidas del jugador, filtradas y paginadas
      description: |-
        Las partidas del jugador con la sesión iniciada, de la más reciente a la más antigua, filtradas y paginadas, con el número de partidas que cumplen el filtro. Todos los parámetros de consulta son opcionales, y un valor vacío equivale a su ausencia.

        Paginación: pase el `next` de la página anterior como `before`; `next` es `null` en la última página. `total` cuenta las partidas que cumplen el filtro, en todas las páginas.

        **Límite:** `account_games`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          required: false
          description: Un identificador de categoría oficial (`3+2`, o `3%2B2`), o `custom` para todas las partidas con otro ritmo de juego.
          schema:
            type: string
            pattern: '^\s*([0-9]+[+ ][0-9]+|custom)\s*$'
          example: '3+2'
        - name: rated
          in: query
          required: false
          description: Solo las partidas puntuables (`true`) o amistosas (`false`).
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: result
          in: query
          required: false
          description: Solo las partidas ganadas, perdidas o en tablas, desde el punto de vista del jugador. Las partidas anuladas solo aparecen sin este filtro.
          schema:
            type: string
            enum:
              - win
              - loss
              - draw
      responses:
        '200':
          description: Una página del historial.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              example:
                games:
                  - id: 4100000000001
                    category: '3+2'
                    rated: true
                    timeControl: '180+2'
                    white:
                      name: alice
                      rating: 1500
                      ratingAfter: 1510
                      ratingDiff: 10
                    black:
                      name: bob
                      rating: 1520
                      ratingAfter: 1510
                      ratingDiff: -10
                    color: white
                    status: 1
                    reason: 2
                    result: 1-0
                    termination: Resignation
                    plies: 41
                    startedAt: 1790620205000
                    endedAt: 1790620611000
                    baseMs: 180000
                    incMs: 2000
                    outcome: win
                next: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_cursor` (`before` no es un identificador de partida), `invalid_limit`, o `invalid_filter` (`category`, `rated` o `result`), cada uno con `field` indicando el parámetro.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: el límite `account_games` o el presupuesto de la cuenta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (la base de datos ha seguido bloqueada; `retryAfter: 1` en el cuerpo, sin encabezado `Retry-After`), `server_busy` (la búsqueda de la sesión encontró la base de datos bloqueada), `timeout`.'
  /games/{id}:
    get:
      operationId: getGame
      tags:
        - games
      summary: Obtener el registro de una partida con sus jugadas y sus relojes
      description: |-
        El registro de una partida, con sus jugadas y sus relojes. Sin token, o con el token de un jugador que no jugó la partida, la respuesta es la pública. Cuando el jugador del token jugó la partida, la respuesta añade `you` y `reportable`.

        **Límite:** `public_read` (por jugador con token, por cliente sin él).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: El registro de la partida.
          headers:
