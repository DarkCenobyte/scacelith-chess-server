        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: el límite `public_read` o el presupuesto de la cuenta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (la base de datos ha seguido bloqueada; `retryAfter: 1` en el cuerpo, sin encabezado `Retry-After`), `server_busy` (la búsqueda de la sesión encontró la base de datos bloqueada), `timeout`.'
  /games/{id}/pgn:
    get:
      operationId: getGamePgn
      tags:
        - games
      summary: Descargar una partida como archivo PGN
      description: |-
        La misma partida como archivo PGN: una sola partida con finales de línea `\n`, y el texto de las jugadas en líneas de menos de 80 columnas. La respuesta es la misma con o sin token.

        Etiquetas, en este orden: `Event` (`<SERVER_NAME> rated <category>` o `<SERVER_NAME> casual <category>`), `Site` (`SERVER_PUBLIC_HOST`), `Date` (la fecha UTC de inicio), `Round`, `White`, `Black`, `Result` (`*` para una partida anulada), `UTCDate` y `UTCTime` (el inicio), `WhiteElo` y `BlackElo` (las puntuaciones al inicio, o `-`), `WhiteRatingDiff` y `BlackRatingDiff` (las variaciones, como `+10` y `-10`, en todas las partidas puntuables, `+0` cuando las reglas de puntuación dejan la puntuación donde estaba; una partida amistosa, personalizada o anulada no tiene ninguna de las dos), `TimeControl` (en segundos), `Termination` (un valor del estándar PGN: `normal`; `time forfeit`, una caída de bandera, también cuando termina en tablas; `abandoned`; `rules infraction`, una segunda jugada ilegal o una pérdida por infracción del juego limpio; `unterminated`, una partida anulada), `PlyCount`, `ScacelithGameId` (el identificador decimal).

        Cada jugada lleva `{[%clk h:mm:ss.f] [%emt h:mm:ss.f]}`: el reloj del jugador que mueve después de la jugada y el tiempo que se le descontó por ella, en décimas de segundo (truncadas). Un valor se omite cuando el registro no lo tiene. Tras la última jugada figura el motivo del final, en palabras, y después el resultado.

        **Límite:** `public_read` (por jugador con token, por cliente sin él).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: El archivo PGN.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              description: 'Siempre `attachment; filename="scacelith-<id>.pgn"`.'
              schema:
                type: string
                pattern: '^attachment; filename="scacelith-[1-9][0-9]{0,15}\.pgn"$'
              example: attachment; filename="scacelith-4100000000001.pgn"
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: 'El texto PGN, en UTF-8 (`Content-Type: application/x-chess-pgn; charset=utf-8`).'
              example: |
                [Event "Scacelith rated 3+2"]
                [Site "caissa.scacelith.com"]
                [Date "2026.09.28"]
                [Round "-"]
                [White "alice"]
                [Black "bob"]
                [Result "1-0"]
                [UTCDate "2026.09.28"]
                [UTCTime "18:30:05"]
                [WhiteElo "1500"]
                [BlackElo "1520"]
                [WhiteRatingDiff "+10"]
                [BlackRatingDiff "-10"]
                [TimeControl "180+2"]
                [Termination "normal"]
                [PlyCount "2"]
                [ScacelithGameId "4100000000001"]

                1. e4 {[%clk 0:03:00.0] [%emt 0:00:00.0]} 1... e5 {[%clk 0:03:00.3]
                [%emt 0:00:01.7]} {Resignation} 1-0
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_game_id`: no es un entero positivo de 16 cifras como máximo (por debajo de 2^53); `invalid_request`: no es una codificación URL válida.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_token`: se envió un token y no es válido.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: no existe esa partida.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: el límite `public_read` o el presupuesto de la cuenta.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`: entre otros casos, las jugadas guardadas no se pueden reproducir hasta el final guardado (el servidor lo registra).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`busy` (la base de datos ha seguido bloqueada; `retryAfter: 1` en el cuerpo, sin encabezado `Retry-After`), `server_busy` (la búsqueda de la sesión encontró la base de datos bloqueada), `timeout`.'
  /games/{id}/gif:
    get:
      operationId: getGameGif
      tags:
        - gifs
      summary: Descargar una partida de este servidor como GIF animado
      description: |-
        La partida como GIF animado. Los nombres y las puntuaciones son los del registro de la partida (las puntuaciones al inicio, una cuenta eliminada como `deleted#<id>`), y lo mismo ocurre con el resultado y el final (`Resignation`, `Loss on time`...).

        Las comprobaciones se hacen en este orden: `gif_disabled`, las opciones de la imagen (`size`, `orientation`, `delay`, `coords`), el identificador de la partida, la partida, su longitud.

        **Sesión obligatoria:** las cuotas se cuentan por cuenta. **Límites:** `gif` en cada solicitud; `gif_user_min`, `gif_user_hour`, `gif_ip_min` y `gif_ip_hour` solo cuando hay que crear el GIF (véase la descripción de la etiqueta). **Tiempo máximo:** `GIF_QUEUE_TIMEOUT_MS` + `GIF_RENDER_TIMEOUT_MS` + 5 segundos (45 segundos de forma predeterminada).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: size
          in: query
          required: false
          description: 'El tamaño de la imagen: `small` (casillas de 32 px), `medium` (48 px) o `large` (72 px).'
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: medium
        - name: orientation
          in: query
          required: false
          description: El bando situado en la parte inferior del tablero.
          schema:
            type: string
            enum:
              - white
              - black
            default: white
        - name: delay
          in: query
          required: false
          description: Milisegundos por jugada (de 1 a 6 cifras decimales).
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 500
        - name: coords
          in: query
          required: false
          description: Si se dibujan alrededor del tablero las letras de las columnas y los números de las filas (`1`) o no (`0`).
          schema:
            type: string
            enum:
              - '1'
              - '0'
            default: '1'
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_option` con `field` (`size`, `orientation`, `delay` o `coords`): un valor fuera de los permitidos. `invalid_game_id`. `invalid_request`: no es una codificación URL válida.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: no existe esa partida. `gif_disabled`: el servidor ha desactivado los GIF (`GIF_ENABLED=false`; se devuelve la ficha de `gif`).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: el límite `gif`, un límite de renderizado o el presupuesto de la cuenta.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: no se ha podido crear el GIF (el servidor registra el motivo). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` con `retryAfter` (de 3 a 10 segundos) y `Retry-After`: la cola de renderizado está llena, o el GIF ha esperado `GIF_QUEUE_TIMEOUT_MS` (10 segundos) a que quedara libre un hilo; se devuelven todas las fichas de límite que había tomado la solicitud. `busy`: la base de datos ha seguido bloqueada (`retryAfter: 1` solo en el cuerpo). `timeout`.'
  /gif:
    post:
      operationId: renderPgnGif
      tags:
        - gifs
      summary: Crear un GIF animado de cualquier partida enviada en PGN
      description: |-
        La misma imagen que `GET /games/{id}/gif` para cualquier partida enviada como texto PGN: una partida guardada por el juego, una exportación de otro sitio, una partida escrita a mano. Solo se usa la primera partida del texto.

        - El lector de PGN acepta lo mismo que el lector del propio juego: todo PGN que escribe este servidor y las exportaciones habituales de otros sitios (se omiten los comentarios, las variantes, los NAG y las anotaciones de reloj; los números de jugada y la notación SAN se leen con tolerancia; una etiqueta `FEN` indica la posición inicial salvo que `SetUp` sea `"0"`).
        - Los nombres y las puntuaciones proceden de las etiquetas `White`, `Black`, `WhiteElo` y `BlackElo`. Las letras acentuadas pierden el acento, los demás caracteres fuera del ASCII imprimible se convierten en `?`, y los nombres largos se recortan (48 caracteres). El resultado procede de la etiqueta `Result` o, en su defecto, del final del texto de las jugadas. La etiqueta `Termination` se muestra salvo que sea `normal`: en ese caso, la posición final lo dice todo (jaque mate, rey ahogado).
        - Este endpoint comprueba su cuerpo por sí mismo: un campo desconocido, o un `pgn` ausente o que no es una cadena, responde 400 `invalid_request` con `field`; una opción errónea responde 400 `invalid_option` (`delayMs` debe ser un número JSON y `coords` un booleano; `null` se rechaza).

        **Sesión obligatoria:** las cuotas se cuentan por cuenta. **Límites:** como en `GET /games/{id}/gif`. **Tamaño máximo del cuerpo:** 135 168 bytes, sea cual sea `HTTP_BODY_LIMIT` (el PGN como cadena JSON, con sus secuencias de escape). **Tiempo máximo:** 45 segundos de forma predeterminada.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifRequest'
            examples:
              short:
                summary: Una partida corta escrita a mano, sin coordenadas
                value:
                  pgn: 1. f3 e5 2. g4 Qh4# 0-1
                  coords: false
              options:
                summary: Un archivo PGN con todas las opciones
                value:
                  pgn: |
                    [White "alice"]
                    [Black "bob"]
                    [WhiteElo "1500"]
                    [BlackElo "1520"]
                    [Result "1-0"]

                    1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0
                  size: small
                  orientation: black
                  delayMs: 800
                  coords: true
      responses:
        '200':
          $ref: '#/components/responses/GifFile'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` con `field` (un campo desconocido, o `pgn` ausente o que no es una cadena; sin `field` cuando el cuerpo no es un objeto); `invalid_json`; `invalid_option` con `field` (`size`, `orientation`, `delayMs` o `coords`); `invalid_pgn` con `line` y `column` (desde 1, columnas en caracteres) y el `message` del lector: una jugada ilegal o ambigua, una etiqueta mal formada, una modalidad de ajedrez desconocida, más de 65 536 bytes.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`gif_disabled`: el servidor ha desactivado los GIF (`GIF_ENABLED=false`; se devuelve la ficha de `gif`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: '`payload_too_large`: un cuerpo de más de 135 168 bytes.'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: el límite `gif`, un límite de renderizado o el presupuesto de la cuenta.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`render_failed`: no se ha podido crear el GIF (el servidor registra el motivo). `internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` con `retryAfter` (de 3 a 10 segundos) y `Retry-After`: la cola de renderizado está llena, o el GIF ha esperado demasiado a que quedara libre un hilo; se devuelven todas las fichas de límite que había tomado la solicitud. `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /players/{username}:
