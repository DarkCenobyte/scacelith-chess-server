      description: |-
        La página de un enlace de confirmación del correo (registro, o correo de confirmación reenviado). Solo muestra un botón «Confirm my e-mail address» (confirmar mi dirección de correo), para que un analizador de correo que abra el enlace no lo consuma; el botón envía el formulario a `POST /verify-email`.

        **Límite:** `page`.
      security: []
