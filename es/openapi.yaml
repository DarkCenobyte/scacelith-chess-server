        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: El límite `auth` (una página HTML), o la capa por dirección (`rate_limited` en JSON).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'La base de datos ha seguido bloqueada (`Retry-After: 1`) o tiene demasiadas escrituras en espera (`Retry-After` de 2 a 5): no ha cambiado nada y el enlace sigue funcionando. También el tiempo máximo de tratamiento.'
  /reset-password:
    servers:
      - url: https://caissa.scacelith.com
        description: El servidor oficial (las páginas están en la raíz, fuera de `/api/v1`).
      - url: https://{host}:{port}
