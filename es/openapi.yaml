paths:
  /info:
    get:
      operationId: getServerInfo
      tags:
        - server-info
      summary: Obtener el nombre, las versiones, los puertos y las reglas de registro del servidor
      description: |-
        Lo que un cliente necesita antes de iniciar sesión o de conectarse: el nombre y el identificador del servidor, las versiones del protocolo WebSocket y dónde está el WebSocket, las reglas de registro, los ritmos de juego oficiales y los límites que un cliente puede comprobar antes de enviar un formulario.

        **Límites:** solo la capa por dirección.
      security: []
      responses:
        '200':
          description: La descripción del servidor.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: la capa por dirección.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`timeout`.'
  /auth/register:
    post:
      operationId: registerAccount
      tags:
        - auth
      summary: Crear una cuenta
      description: |-
        Crea una cuenta: en cuanto se confirma su dirección de correo con el enlace que se le envía, o de inmediato si no se exige confirmación del correo.

        **Con confirmación del correo** (`REQUIRE_EMAIL_VERIFICATION`, el valor predeterminado): 202 `verification_sent`. Todavía no existe ninguna cuenta: el registro queda pendiente durante 24 horas y, entretanto, reserva su nombre de usuario. Se envía a la dirección un enlace válido durante esas 24 horas, como máximo uno por dirección cada 5 minutos (`POST /auth/verify-email/resend` envía uno nuevo); la cuenta se crea, con su dirección confirmada, cuando se usa el enlace (el botón de la página `/verify-email`), y entonces el jugador puede iniciar sesión. Hasta ese momento, un inicio de sesión con ese nombre de usuario responde `invalid_credentials`, como para una cuenta desconocida, y el perfil público no existe. Un nuevo registro con la misma dirección sustituye al pendiente. La respuesta es la misma cuando otra cuenta ya usa la dirección: en ese caso no se envía ningún enlace, sino que su titular recibe un aviso (como máximo uno por hora), y el nombre de usuario queda reservado de la misma manera, de modo que nada revela si la dirección tiene una cuenta. Un registro cuyo enlace no se ha usado se descarta al cabo de 24 horas, y su nombre de usuario vuelve a quedar libre.

        **Sin confirmación del correo** (`REQUIRE_EMAIL_VERIFICATION=false`): 201 `ready`; la cuenta se crea de inmediato y puede iniciar sesión.

        **Reglas.** `username`: de `USERNAME_MIN` a `USERNAME_MAX` caracteres (de 3 a 20), letras, cifras, `_` y `-`, empezando por una letra o una cifra (`GET /info` los indica en `limits`); se rechazan los nombres reservados (`admin`, `moderator`, `deleted`...) y algunos prefijos; único sin distinguir mayúsculas de minúsculas. `email`: sin espacios en los extremos y guardado en minúsculas, en ASCII simple y con un dominio que contenga un punto. `password`: al menos `PASSWORD_MIN_LENGTH` (10) caracteres y como máximo 256 bytes en UTF-8; no debe contener el nombre de usuario ni la parte local del correo, ni ser una contraseña común.

        **Errores**, comprobados en este orden: 403 `registration_closed`; 400 `invalid_username`; 400 `invalid_email`; 400 `weak_password`; 409 `username_taken`; 428 `pow_required`; los errores de la cola de hash de contraseñas; 409 `email_taken` (solo sin confirmación del correo).

        **Límites:** `auth` y después `auth_register` (10 registros por hora y por cliente). **Prueba de trabajo:** siempre, cuando `POW_REGISTER_BITS` es mayor que 0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              first:
                summary: Primer intento, sin prueba de trabajo
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
              withPow:
                summary: Nuevo envío con la prueba de trabajo
                value:
                  username: alice
                  email: alice@example.org
                  password: correct horse battery
                  pow:
                    challenge: eyJ2IjoxLCJlIjoicmVnaXN0ZXIiLCJiIjoxOCwieCI6MTc5MDg4Mjk5MTIwMH0.6Ku_D7kw3S69OYxj-9KxsXszRCwz6ECnOQ-B6-v2erM
                    nonce: '123456'
      responses:
        '201':
          description: La cuenta se ha creado y puede iniciar sesión (este servidor no exige confirmación del correo).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ready
              example:
                status: ready
        '202':
          description: El registro espera a que se use su enlace de confirmación (o la dirección ya tiene una cuenta; la respuesta no lo revela).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSentStatus'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request` (con `field`), `invalid_json`, `invalid_username`, `invalid_email`, o `weak_password` con `reason`: `too_short`, `too_long`, `contains_username`, `contains_email` o `too_common`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`: el registro está cerrado en este servidor (`GET /info` indica `registration: closed`).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken`: una cuenta tiene ese nombre de usuario, o lo reserva un registro pendiente de otra dirección. `email_taken`: otra cuenta usa la dirección (solo sin confirmación del correo).'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: el límite `auth` o `auth_register`, o la cola de hash de contraseñas.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la cola de hash de contraseñas, o la base de datos ha seguido bloqueada), `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /auth/login:
    post:
      operationId: logIn
      tags:
        - auth
      summary: Iniciar sesión con contraseña
      description: |-
        Inicia sesión con un nombre de usuario o una dirección de correo y una contraseña. Hay dos respuestas posibles, ambas con el estado 200: una sesión o, cuando la autenticación de dos factores está activada, un segundo paso que debe completarse en 5 minutos con `POST /auth/login/mfa`.

        Una cuenta desconocida, una contraseña incorrecta y una cuenta sin contraseña reciben la misma respuesta, tras el mismo tiempo: 401 `invalid_credentials`. Las comprobaciones de la cuenta (`banned`, `email_unverified`) solo se hacen tras una contraseña correcta. A partir de `AUTH_FAILURES_PER_ACCOUNT` (5) fallos con un mismo nombre de inicio de sesión, cada intento debe esperar (429 `too_many_attempts`).

        **Límite:** `auth`. **Prueba de trabajo:** solo durante una oleada de inicios de sesión fallidos (428 `pow_required`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: alice
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Una sesión, o el segundo paso de un inicio de sesión con autenticación de dos factores.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
              examples:
                session:
                  summary: Sesión iniciada
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: false
                      hasPassword: true
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: La autenticación de dos factores está activada
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: cuenta desconocida, contraseña incorrecta o cuenta sin contraseña.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Solo tras una contraseña correcta: `banned`, con `until` (ms desde la época Unix; `null` para una suspensión permanente), o `email_unverified` (una cuenta antigua cuya dirección aún no está confirmada).'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (el retardo por fallos de este nombre de inicio de sesión), o `rate_limited` (el límite `auth`, la cola de hash de contraseñas).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la cola de hash de contraseñas, o la base de datos ha seguido bloqueada), `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /auth/login/mfa:
    post:
      operationId: logInWithSecondFactor
      tags:
        - auth
      summary: Completar un inicio de sesión con un segundo factor
      description: |-
        El segundo paso de un inicio de sesión con autenticación de dos factores, después de que `POST /auth/login` o un inicio de sesión con Google (`POST /auth/sso/google/finish` o `POST /auth/sso/google/link`) haya respondido `mfaRequired`. Envíe `code` (un código de 6 cifras de la aplicación de autenticación, o un código de recuperación) o `recoveryCode`. Un código de recuperación usado aquí deja de existir.

        Un paso acepta como máximo 5 códigos erróneos; el paso también termina cuando se restablece o se cambia la contraseña. Tras el paso de la contraseña de una vinculación con Google, el vínculo solo se guarda cuando el código se acepta aquí.

        **Límites:** `auth`, y como máximo `AUTH_MFA_PER_ACCOUNT` (10) códigos cada 15 minutos para la cuenta, desde cualquier dirección; por encima, el código no se comprueba, de modo que no se gasta ningún código de recuperación.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
            examples:
              authenticator:
                summary: Un código de la aplicación de autenticación
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  code: '123456'
              recovery:
                summary: Un código de recuperación
                value:
                  mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                  recoveryCode: j7v5-3ezx-zn
      responses:
        '200':
          description: Sesión iniciada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: no se envió ni `code` ni `recoveryCode`, o el cuerpo incumple el esquema; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_mfa_token`: el paso ha caducado, ya se ha usado o terminó tras 5 códigos erróneos, o la contraseña se ha restablecido o cambiado desde el primer paso (vuelva a iniciar sesión). `invalid_code`: un código erróneo o ya usado.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (con `until`), `email_unverified`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: solo tras el paso de la contraseña de una vinculación con Google; entretanto, la cuenta de Google se ha vinculado a otra cuenta.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: solo tras el paso de la contraseña de una vinculación con Google; entretanto, la cuenta ha cambiado; vuelva a empezar desde el juego.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts`: el retardo por fallos de la cuenta, o se han agotado sus `AUTH_MFA_PER_ACCOUNT` códigos de los últimos 15 minutos. `rate_limited`: el límite `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` con `retryAfter: 1`: la base de datos ha seguido bloqueada (tras un paso de vinculación con Google, no se ha vinculado nada: vuelva a empezar desde el juego). `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /auth/logout:
    post:
      operationId: logOut
      tags:
        - sessions
      summary: Cerrar esta sesión
      description: |-
        Revoca la sesión del token utilizado. El WebSocket abierto con ella se cierra. Sin cuerpo (o `{}`).

        **Límite:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesión cerrada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: un cuerpo distinto de `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: el límite `sessions` o el presupuesto de la cuenta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la base de datos ha seguido bloqueada), `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /auth/logout-all:
    post:
      operationId: logOutEverywhere
      tags:
        - sessions
      summary: Cerrar todas las sesiones
      description: |-
        Revoca todas las sesiones de la cuenta, incluida esta. Los WebSockets abiertos con ellas se cierran. Sin cuerpo (o `{}`).

        **Límite:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Se han cerrado todas las sesiones.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutStatus'
              example:
                status: logged_out
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: un cuerpo distinto de `{}`; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: el límite `sessions` o el presupuesto de la cuenta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la base de datos ha seguido bloqueada), `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      tags:
        - auth
      summary: Reenviar el enlace de confirmación
      description: |-
        Vuelve a enviar el enlace de confirmación del correo. La respuesta es 202 `accepted` sea cual sea la dirección, de modo que nunca revela si una cuenta o un registro la usan.

        Una solicitud surte efecto como máximo una vez cada 5 minutos por dirección. Un registro pendiente con esa dirección recupera sus 24 horas, la use o no otra cuenta, para que su nombre de usuario siga reservado el mismo tiempo en ambos casos. Solo se envía un enlace para ese registro cuando la dirección no tiene cuenta (un nuevo enlace, válido durante 24 horas, sustituye al anterior), o para una cuenta activa y sin confirmar con esa dirección.

        **Límites:** `auth` y después `auth_mail` (10 por hora y por cliente).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Aceptada (sea cual sea la dirección).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: el límite `auth` o `auth_mail` (sea cual sea la dirección).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` con `retryAfter: 1`: la base de datos ha seguido bloqueada mientras se buscaba la cuenta (la renovación de un registro pendiente se hace en la medida de lo posible y nunca hace fallar la solicitud). `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      summary: Enviar un enlace de restablecimiento de contraseña
      description: |-
        Envía un enlace de restablecimiento de contraseña, válido durante una hora, que abre la página `/reset-password`. La respuesta es 202 `accepted` sea cual sea la dirección. Solo se envía un enlace a una cuenta activa, como máximo una vez cada 5 minutos por dirección. Una cuenta que solo usa Google define así su primera contraseña.

        La recuperación de la contraseña tiene los límites más estrictos de la API, todos contados para el servidor entero: 3 solicitudes por hora (`AUTH_FORGOT_PER_HOUR`) y 10 cada 24 horas (`AUTH_FORGOT_PER_DAY`) por cliente (una dirección IPv4 o un prefijo IPv6 /64), el triple de esas cifras por prefijo IPv6 /48, además del límite `auth` (20 cada 10 minutos) y de un único correo por dirección cada 5 minutos. Ni el 202 ni el 429 revelan si una cuenta usa la dirección. La definición de la nueva contraseña tiene su propio límite (`auth_reset`).

        **Límites:** `auth`, `auth_forgot` y después `auth_forgot_day`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: alice@example.org
      responses:
        '202':
          description: Aceptada (sea cual sea la dirección).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedStatus'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: el límite `auth`, `auth_forgot` o `auth_forgot_day` (sea cual sea la dirección).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` con `retryAfter: 1`: la base de datos ha seguido bloqueada. `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Definir una nueva contraseña con el token de un enlace de restablecimiento
      description: |-
        Define una nueva contraseña con el token de un enlace de restablecimiento (la página `/reset-password` hace lo mismo). La nueva contraseña sigue las reglas del registro.

        El restablecimiento tiene estos efectos, en una sola transacción (todos o ninguno): revoca todas las sesiones y cancela un cambio de correo pendiente; los demás enlaces de restablecimiento de la cuenta dejan de funcionar; la dirección se considera confirmada (el enlace lo ha demostrado); el titular recibe un correo. La autenticación de dos factores no se modifica. Tras un error de la cola de hash de contraseñas, un 503 o un 500, no ha cambiado nada: la contraseña anterior y las sesiones se mantienen, y el enlace sigue siendo válido.

        **Límites:** `auth` y después `auth_reset` (10 por hora y por cliente, 30 por prefijo IPv6 /48, compartido con la página: cada intento calcula el hash de una contraseña).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
      responses:
        '200':
          description: La contraseña se ha cambiado y se han cerrado todas las sesiones.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_reset
              example:
                status: password_reset
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_token`: el enlace no es válido, ya se ha usado o ha caducado, o se envió a una dirección que la cuenta ya no tiene. `weak_password` (con `reason`). `invalid_request`, `invalid_json`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: el límite `auth` o `auth_reset`, o la cola de hash de contraseñas.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: la cola de hash de contraseñas, o la base de datos ha seguido bloqueada (`retryAfter: 1`, sin ningún cambio). `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /auth/sso/google/start:
    post:
      operationId: startGoogleSignIn
      tags:
        - google-sign-in
      summary: Comenzar un inicio de sesión con Google
      description: |-
        Comienza un intento de inicio de sesión con Google para el desafío PKCE y el puerto en el que escucha el juego en `127.0.0.1`. La respuesta da la URL de Google que se debe abrir en el navegador del sistema y el `state` del intento; el intento es válido durante 10 minutos.

        `authUrl` contiene `client_id`, `redirect_uri` (construida a partir de `redirectPort` y de la etiqueta de origen del servidor), `response_type=code`, `scope=openid email profile`, `state`, `nonce`, `code_challenge` (S256 del verificador propio del servidor ante Google) con `code_challenge_method=S256`, y `prompt=select_account`. El juego la comprueba antes de abrirla (véase la descripción de la etiqueta).

        **Límite:** `sso_start`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoStartRequest'
            example:
              codeChallenge: 6e7diXEYxG7OTYw7STfNOltEeLxAilPthC_txzaE0xA
              redirectPort: 51234
      responses:
        '200':
          description: El intento.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStartAnswer'
              example:
                attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
                authUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234567890-abc.apps.googleusercontent.com&redirect_uri=http%3A%2F%2F127.0.0.1%3A51234%2Foauth2%2Fgoogle%2FIhcScoV7eDOzTEcSnqPUPt&response_type=code&scope=openid%20email%20profile&state=yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ&nonce=gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU&code_challenge=ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc&code_challenge_method=S256&prompt=select_account
                state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
                expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: este servidor no ofrece el inicio de sesión con Google.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: el límite `sso_start`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la base de datos ha seguido bloqueada), `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /auth/sso/google/finish:
    post:
      operationId: finishGoogleSignIn
      tags:
        - google-sign-in
      summary: Transmitir al servidor la respuesta de Google
      description: |-
        Transmite al servidor el `code` y el `state` que Google envió al puerto de escucha del juego, junto con el identificador del intento y el verificador PKCE. Un identificador de intento no sirve de nada sin el verificador, y el código no sirve de nada sin el verificador PKCE propio del servidor y su secreto de cliente.

        El servidor comprueba el intento (desconocido, ya usado o caducado: 410), después el verificador (uno erróneo deja el intento utilizable), y luego consume el intento, comprueba `state` e `iss`, canjea el código con Google y verifica el token de ID. La respuesta (200) es una de estas:

        - `{ token, expiresAt, user }`: sesión iniciada en la cuenta vinculada;
        - `{ mfaRequired, mfaToken, expiresIn }`: continúe con `POST /auth/login/mfa`;
        - `{ needsUsername, ssoTicket, suggestedUsername }`: una cuenta nueva; continúe con `POST /auth/sso/complete` en un plazo de 10 minutos. `suggestedUsername` procede del nombre de Google o de la dirección, y es `""` cuando nada encaja;
        - `{ needsPassword, linkTicket, username, expiresIn }`: la cuenta con esa dirección tiene contraseña; continúe con `POST /auth/sso/google/link`. Todavía no se ha vinculado nada.

        **Límite:** `sso_finish`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoFinishRequest'
            example:
              attemptId: sso_ogvVEL75n7q90NIFsh-4zXVt-izc3WRbghsd6HDOtNQ
              codeVerifier: Sb5SaoX0ByHGjJ0XQkEqaaPaJYx2BId4ncTT8tLM6W8
              state: yBjjEhGgqHdeqhUAzyx9jE2IhQ56bec53iRA7RvKRzQ
              code: 4/0AVMBsJhR2x7cKq9vT1pLmN3oW8yZ5aB6dE7fG8hJ
              iss: https://accounts.google.com
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Una sesión, un segundo paso o el paso siguiente de un primer inicio de sesión con Google.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoFinishAnswer'
              examples:
                session:
                  summary: Sesión iniciada en la cuenta vinculada
                  value:
                    token: sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
                    expiresAt: 1798658839708
                    user:
                      id: 1
                      username: alice
                      email: alice@example.org
                      emailVerified: true
                      mfaEnabled: false
                      googleLinked: true
                      hasPassword: false
                      acceptChallenges: all
                      createdAt: 1790882839743
                      lastLoginAt: 1790882839708
                      pendingEmail: null
                mfaRequired:
                  summary: La autenticación de dos factores está activada
                  value:
                    mfaRequired: true
                    mfaToken: mfa_m4wXAVhYCMWG0PX7MLcIpBeccBFg0oxPvoRujzGWjO8
                    expiresIn: 300
                needsUsername:
                  summary: Un jugador nuevo
                  value:
                    needsUsername: true
                    ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
                    suggestedUsername: alice
                needsPassword:
                  summary: Una cuenta con contraseña usa la dirección
                  value:
                    needsPassword: true
                    linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
                    username: alice
                    expiresIn: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_verifier`: el verificador no corresponde al desafío del intento (el intento sigue siendo utilizable). `sso_email_unverified`: Google no ha confirmado la dirección. `registration_closed`. `account_disabled`. Solo para una cuenta vinculada: `banned` (con `until`), `email_unverified`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: este servidor no ofrece el inicio de sesión con Google.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_account_exists`: una cuenta activa sin contraseña usa la dirección (no se indica cuál).'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: un intento desconocido, ya usado o caducado.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: el límite `sso_finish`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la base de datos ha seguido bloqueada), `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /auth/sso/google/link:
    post:
      operationId: linkGoogleAccount
      tags:
        - google-sign-in
      summary: Vincular Google a una cuenta existente con su contraseña
      description: |-
        Después de que `finish` haya respondido `needsPassword`: vincula Google a la cuenta existente con la contraseña de esa cuenta, introducida en el juego. La respuesta (200) es una sesión (el vínculo se guarda y el jugador inicia sesión) o, cuando la autenticación de dos factores está activada, `{ mfaRequired, mfaToken, expiresIn }`: continúe con `POST /auth/login/mfa`; el vínculo solo se guarda cuando allí se acepta un código.

        Una contraseña incorrecta deja el ticket utilizable, hasta 5 intentos en total. Un intento se descuenta justo antes de comprobar la contraseña: un 429 `too_many_attempts` o un 428 `pow_required` no descuentan ninguno, mientras que un rechazo de la cola de hash de contraseñas (503 `server_busy`, 429 `rate_limited`) ya ha descontado uno y cuenta como un fallo de la cuenta. El retardo por fallos usa el mismo contador que `POST /auth/login`.

        **Límite:** `auth` (con su recuento por prefijo IPv6 /48). **Prueba de trabajo:** como en `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkRequest'
            example:
              linkTicket: sso_ZfEI6iZjePTHbnbevupaD9O7GjBCzcL-GJu2XGOdFGc
              password: correct horse battery
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: Una sesión, o el segundo paso del inicio de sesión.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`invalid_credentials`: una contraseña incorrecta; el ticket sigue siendo válido, hasta 5 intentos en total.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`banned` (con `until`), solo tras una contraseña correcta.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: este servidor no ofrece el inicio de sesión con Google.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sso_already_linked`: entretanto, la cuenta de Google se ha vinculado a otra cuenta.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: un ticket desconocido, ya usado o caducado, la 5.ª contraseña incorrecta, una cuenta cuyo estado o dirección ha cambiado desde `finish`, o cuyo estado, dirección, contraseña o autenticación de dos factores ha cambiado mientras se guardaba el vínculo. Vuelva a empezar desde el juego.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PowRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (el retardo por fallos de la cuenta), o `rate_limited` (el límite `auth`, la cola de hash de contraseñas).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: la cola de hash de contraseñas, o la base de datos ha seguido bloqueada (`retryAfter: 1`, no se ha vinculado nada). `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /auth/sso/complete:
    post:
      operationId: completeGoogleSignUp
      tags:
        - google-sign-in
      summary: Crear la cuenta de un primer inicio de sesión con Google
      description: |-
        Después de que `finish` haya respondido `needsUsername`: crea la cuenta con el nombre de usuario elegido (se aplican las reglas del registro) e inicia su sesión. La cuenta no tiene contraseña: `hasPassword` es `false`, y «¿Olvidó su contraseña?» (`POST /auth/password/forgot`) le asigna una.

        **Límite:** `auth` (con su recuento por prefijo IPv6 /48).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoCompleteRequest'
            example:
              ssoTicket: sso_gYIKKhwnz1AqWfFxOC3R-ZvCACw06q74fEMtGEOJQWU
              username: alice
              clientLabel: Scacelith 1.4 (Windows)
      responses:
        '200':
          description: La cuenta se ha creado y tiene la sesión iniciada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_username`, `invalid_request` o `invalid_json`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`registration_closed`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`sso_disabled`: este servidor no ofrece el inicio de sesión con Google.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`username_taken` (una cuenta tiene ese nombre de usuario, o lo reserva un registro pendiente de otra dirección), `sso_already_linked`, `email_taken`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`sso_expired`: un ticket desconocido, ya usado o caducado.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: el límite `auth`.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la base de datos ha seguido bloqueada), `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - sessions
      summary: Listar los dispositivos con sesión iniciada
      description: |-
        Las sesiones activas de la cuenta (dispositivos con sesión iniciada), primero las usadas más recientemente. `current` marca la sesión que hace la solicitud. `lastSeenAt` se actualiza como máximo cada 5 minutos; `expiresAt` es el final absoluto, y el límite de inactividad puede terminar la sesión antes.

        **Límite:** `sessions`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Las sesiones activas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 3
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Laptop
                    current: false
                  - id: 1
                    createdAt: 1790882839708
                    lastSeenAt: 1790882839708
                    expiresAt: 1798658839708
                    clientLabel: Scacelith 1.4 (Windows)
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: el límite `sessions` o el presupuesto de la cuenta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la base de datos ha seguido bloqueada), `timeout`.'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - sessions
      summary: Cerrar la sesión de un dispositivo
      description: |-
        Cierra una sesión de la cuenta; también se puede cerrar la sesión actual. El WebSocket abierto con ella se cierra. Sin cuerpo (o `{}`).

        **Límite:** `sessions`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: La sesión se ha cerrado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: revoked
              example:
                status: revoked
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`invalid_request`: un cuerpo distinto de `{}`, o un `id` que no es una codificación URL válida; `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`: ninguna sesión activa con este identificador en esta cuenta.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: el límite `sessions` o el presupuesto de la cuenta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la base de datos ha seguido bloqueada), `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /account/me:
    get:
      operationId: getAccount
      tags:
        - account
      summary: Obtener la cuenta, sus puntuaciones y sus sanciones activas
      description: |-
        La cuenta tal como la ve su jugador: la vista de la cuenta (también el `user` de todas las respuestas de inicio de sesión), un registro de puntuación por cada categoría en la que el jugador ha jugado partidas puntuables, las sanciones activas y la suspensión. El nivel de integridad del sistema antitrampas nunca se muestra.

        **Límite:** `account`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: La cuenta.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMe'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.org
                  emailVerified: true
                  mfaEnabled: true
                  googleLinked: false
                  hasPassword: true
                  acceptChallenges: all
                  createdAt: 1790882871478
                  lastLoginAt: 1790882902200
                  pendingEmail: alice.new@example.org
                ratings:
                  - category: '3+2'
                    rating: 1510
                    games: 2
                    wins: 1
                    draws: 1
                    losses: 0
                    peak: 1510
                    provisional: true
                sanctions: []
                ban: null
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`, o `invalid_token` (también cuando la cuenta se ha eliminado).'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: el límite `account` o el presupuesto de la cuenta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la base de datos ha seguido bloqueada), `timeout`.'
  /account/preferences:
    put:
      operationId: updatePreferences
      tags:
        - account
      summary: Aceptar o rechazar los retos directos
      description: |-
        Indica si otros jugadores pueden retar a este jugador por su nombre. Con `none`, los retos directos se rechazan: al retador se le indica que el jugador no está disponible. Sin reautenticación.

        **Límite:** `account`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              acceptChallenges: none
      responses:
        '200':
          description: Las preferencias ya en vigor.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - preferences
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preferences'
              example:
                preferences:
                  acceptChallenges: none
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`rate_limited`: el límite `account` o el presupuesto de la cuenta.'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy` (la base de datos ha seguido bloqueada), `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /account/password:
    post:
      operationId: changePassword
      tags:
        - account
      summary: Cambiar la contraseña
      description: |-
        Cambia la contraseña. Se necesita la contraseña actual, pero ningún segundo factor, aunque la autenticación de dos factores esté activada. La nueva contraseña sigue las reglas del registro (se comprueban después de la contraseña actual).

        El cambio tiene estos efectos, en una sola transacción (todos o ninguno): revoca todas las demás sesiones (esta sigue iniciada), cancela un cambio de correo pendiente, invalida los enlaces de restablecimiento de contraseña de la cuenta y envía un correo al titular.

        **Reautenticación:** solo la contraseña. **Límites:** `reauth` y después `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              currentPassword: correct horse battery
              newPassword: a much better passphrase
      responses:
        '200':
          description: La contraseña se ha cambiado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: password_changed
              example:
                status: password_changed
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (una cuenta que solo usa Google), `weak_password` (con `reason`), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`: una contraseña actual incorrecta, o un restablecimiento o cambio de contraseña que se produjo mientras se comprobaba la solicitud.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_attempts` (reautenticaciones fallidas de la cuenta), o `rate_limited` (el límite `reauth` o `reauth_user`, el presupuesto de la cuenta, la cola de hash de contraseñas).'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`server_busy`: la cola de hash de contraseñas, o la base de datos ha seguido bloqueada (`retryAfter: 1`, sin ningún cambio). `timeout`. Además, `server_busy` con `retryAfter` de 2 a 5: la base de datos tiene demasiadas escrituras en espera, y la solicitud no se ha ejecutado.'
  /account/mfa/totp/setup:
    post:
      operationId: startTotpSetup
      tags:
        - two-step-verification
      summary: Empezar a activar la autenticación de dos factores
      description: |-
        Guarda un nuevo secreto pendiente para la aplicación de autenticación, que sustituye a cualquier otro pendiente anterior, y lo devuelve para la aplicación de autenticación (como texto y como URI `otpauth://` para mostrar en forma de código QR). La autenticación de dos factores aún no está activada: `POST /account/mfa/totp/enable` la activa con un código de este secreto.

        **Reautenticación:** solo la contraseña. **Límites:** `reauth` y después `reauth_user`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOnlyRequest'
            example:
              password: correct horse battery
      responses:
        '200':
          description: El secreto pendiente.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
              example:
                secret: OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH
                uri: otpauth://totp/Scacelith:alice?secret=OCKJVMPMMKMPLBSIYLN6QQRMKIPC2VLH&issuer=Scacelith&algorithm=SHA1&digits=6&period=30
                algorithm: SHA1
                digits: 6
                period: 30
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`password_not_set` (una cuenta que solo usa Google), `invalid_request`, `invalid_json`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`invalid_password`.'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
