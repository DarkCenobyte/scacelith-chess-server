      summary: Mostrar el formulario de restablecimiento de contraseña
      description: |-
        La página de un enlace de restablecimiento de contraseña: el formulario de nueva contraseña (la contraseña dos veces). El formulario se envía a `POST /reset-password`.

        **Límite:** `page`.
      security: []
      parameters:
        - $ref: '#/components/parameters/LinkTokenQuery'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: El formulario de nueva contraseña.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: El enlace no es válido (también cuando se envió a una dirección que la cuenta ya no tiene).
        '414':
          $ref: '#/components/responses/UriTooLong'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: El límite `page` (una página HTML), o la capa por dirección (`rate_limited` en JSON).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
    post:
      operationId: submitResetPasswordPage
      tags:
        - pages
      summary: Definir una nueva contraseña desde el formulario de restablecimiento
      description: |-
        El formulario de la página de restablecimiento; hace lo mismo que `POST /auth/password/reset`, en una sola transacción: se cierra la sesión en todos los dispositivos, se cancela un cambio de correo pendiente, los demás enlaces de restablecimiento dejan de funcionar, la dirección se considera confirmada y el titular recibe un correo.

        Primero se comprueba el enlace, después que las dos contraseñas coinciden y, por último, las reglas de contraseñas. Cuando el servidor está ocupado, el formulario vuelve con `Retry-After` y el enlace sigue siendo válido.

        **Límites:** `auth` y después `auth_reset` (compartido con `POST /auth/password/reset`).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordForm'
            example:
              token: A0ATfmXCDKFC8UkSxLJCD85K7au5nMIrZ2P3K-1VWQg
              newPassword: a much better passphrase
              confirmPassword: a much better passphrase
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
          description: La contraseña se ha cambiado y se ha cerrado la sesión en todos los dispositivos.
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
          description: El formulario de nuevo con el error (las contraseñas no coinciden, una contraseña débil), el enlace no es válido, o el formulario no es válido (una página HTML).
        '408':
          $ref: '#/components/responses/HtmlRequestTimeout'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '414':
          $ref: '#/components/responses/UriTooLong'
        '415':
          $ref: '#/components/responses/HtmlUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/HtmlTooManyRequests'
          description: El límite `auth` o `auth_reset` (una página HTML), el formulario de nuevo con `Retry-After` cuando este cliente tiene demasiados hashes de contraseña en espera (el enlace sigue siendo válido), o la capa por dirección (`rate_limited` en JSON).
        '500':
          $ref: '#/components/responses/HtmlInternalError'
        '503':
          $ref: '#/components/responses/HtmlServiceUnavailable'
          description: 'El formulario de nuevo con `Retry-After` cuando el servidor está ocupado (la cola de hash de contraseñas, o la base de datos ha seguido bloqueada); el enlace sigue siendo válido. Cuando la base de datos tiene demasiadas escrituras en espera, en su lugar una página «Server error» (error del servidor) con `Retry-After` (de 2 a 5): no se ha ejecutado nada y el enlace sigue siendo válido. También el tiempo máximo de tratamiento.'
