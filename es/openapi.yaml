tags:
  - name: server-info
    x-displayName: Información del servidor
    description: Lo que un cliente necesita saber antes de iniciar sesión o de conectarse.
  - name: health
    x-displayName: Estado del servicio
    description: |-
      Estado de actividad (liveness) y de disponibilidad (readiness) del servidor, para la supervisión. Estos endpoints responden en el puerto de la API antes de la autenticación y de cualquier límite de endpoint, pero, como cualquier solicitud, toman una ficha de la capa por dirección; un equipo de supervisión puede incluirse en `ABUSE_EXEMPT`. Las dos rutas funcionan para cada endpoint: en la raíz del servidor y bajo `/api/v1`.

      El puerto de métricas tiene sus propios endpoints de estado, descritos en la introducción.
  - name: auth
    x-displayName: Registro e inicio de sesión
    description: |-
      Creación de una cuenta, inicio de sesión con contraseña (y un segundo factor), correos de confirmación y de restablecimiento de contraseña.

      `POST /auth/login`, `POST /auth/login/mfa`, `POST /auth/sso/google/finish`, `POST /auth/sso/google/link` y `POST /auth/sso/complete` responden con una sesión `{ token, expiresAt, user }` (o, en el caso de los primeros, con un segundo paso).
  - name: google-sign-in
    x-displayName: Inicio de sesión con Google
    description: |-
      Disponible cuando `GET /info` indica `sso.google: true`; en caso contrario, todos los endpoints siguientes responden 404 `sso_disabled`. El juego inicia sesión a través del navegador del sistema con el flujo para aplicaciones instaladas de la RFC 8252 (un cliente de tipo «App de escritorio»): Google devuelve el navegador a un puerto de escucha del juego en `127.0.0.1`, nunca a este servidor, y el juego nunca ve ninguna credencial de Google.

      1. El cliente escucha en `127.0.0.1:0` (el sistema elige el puerto) y genera un par PKCE: un `codeVerifier` de 43 a 128 caracteres `[A-Za-z0-9._~-]` y `codeChallenge = BASE64URL(SHA-256(codeVerifier))`, que tiene 43 caracteres y no lleva relleno.
      2. `POST /auth/sso/google/start`, con el desafío y el puerto, devuelve la URL de Google y el `state` del intento. El cliente comprueba la URL (véase más abajo) y la abre en el navegador.
      3. Google envía el navegador a `http://127.0.0.1:<port>/oauth2/google/<tag>?code=...&state=...`. El cliente solo acepta el `state` de la respuesta de inicio, y no envía nada tras una redirección con `error=`.
      4. `POST /auth/sso/google/finish` con el identificador del intento, el `codeVerifier`, el `state` y el `code` (y `iss` si Google lo envió).
      5. La respuesta es una sesión, un paso de autenticación de dos factores (continúe con `POST /auth/login/mfa`), `needsUsername` para un jugador nuevo (continúe con `POST /auth/sso/complete`), o `needsPassword` cuando una cuenta con contraseña usa la dirección (continúe con `POST /auth/sso/google/link`).

      **La etiqueta de origen.** La URI de redirección lleva una etiqueta del servidor que añadió el jugador, de modo que el juego rechaza una URL que otro servidor haya obtenido para sus propios jugadores. El origen es el host en minúsculas (un literal IPv6 entre corchetes), `:` y el puerto decimal de la API, siempre escrito, 443 incluido: el servidor toma `SERVER_PUBLIC_HOST` y su puerto público de la API; el juego, la dirección a la que está conectado. La etiqueta son los 22 primeros caracteres del base64url (sin relleno) de SHA-256(UTF-8 `"scacelith-sso-origin-v1\n"` + origen). La URI de redirección es `"http://127.0.0.1:" + port + "/oauth2/google/" + tag`: siempre el literal IPv4, y el puerto en el que escucha el juego (de 1024 a 65535). El servidor nunca toma del cliente ninguna URI, host ni ruta.

      | Origen | Etiqueta |
      |---|---|
      | `play.scacelith.example:443` | `IhcScoV7eDOzTEcSnqPUPt` |
      | `localhost:8443` | `TFGx7zQ_8QlGZW5zpqznCr` |
      | `[::1]:8443` | `XToJm0DG5PjciEVmZa9Cho` |
      | `127.0.0.1:50443` | `3r653wM5ZjYsHcAJljmCwY` |

      Así pues, el inicio de sesión con Google solo funciona para los jugadores que añadieron el servidor exactamente con `SERVER_PUBLIC_HOST` y su puerto público de la API.

      **Lo que comprueba el juego antes de abrir el navegador.** La `authUrl` empieza exactamente por `https://accounts.google.com/o/oauth2/v2/auth?` y es ASCII imprimible de menos de 4096 caracteres, y su consulta tiene exactamente un `response_type=code`, exactamente un `redirect_uri` igual a la URI que el juego calcula a partir de su puerto y de su etiqueta de origen, exactamente un `state` igual al `state` de la respuesta, `code_challenge_method=S256` y un `code_challenge` de 43 caracteres. En caso contrario, el juego deja de escuchar y no abre nada. Solo envía `finish` y `link` al servidor que respondió a `start`.

      **A qué cuenta da acceso el inicio de sesión con Google:** a la cuenta ya vinculada a esa cuenta de Google; si no la hay, a una cuenta activa con la dirección que Google ha confirmado (con contraseña, `finish` responde `needsPassword` y el vínculo solo se guarda cuando se superan su contraseña y, después, su segundo factor si está activado; sin contraseña, 409 `sso_account_exists`); si tampoco la hay, a una cuenta nueva (`needsUsername`). Una cuenta de Google nunca se vincula a una cuenta existente solo por su dirección. La dirección de la cuenta recibe un correo cuando el inicio de sesión con Google crea una cuenta y cuando se añade a una cuenta existente.
  - name: sessions
    x-displayName: Sesiones
    description: Los dispositivos con sesión iniciada de la cuenta, y el cierre de sesión.
  - name: account
    x-displayName: Cuenta
    description: La vista de la cuenta, sus preferencias y su contraseña.
  - name: two-step-verification
    x-displayName: Autenticación de dos factores
    description: Aplicaciones de autenticación (TOTP, RFC 6238), con SHA-1, 6 cifras, intervalos de 30 segundos y un intervalo de tolerancia en cada sentido, además de códigos de recuperación de un solo uso.
  - name: email-change
    x-displayName: Cambio de dirección de correo
    description: Cambio de la dirección de la cuenta, confirmado con un enlace enviado a la nueva dirección.
  - name: data-export
    x-displayName: Exportación de datos
    description: Todo lo que el servidor guarda sobre la cuenta, en un único archivo JSON.
  - name: account-deletion
    x-displayName: Eliminación de la cuenta
    description: Eliminación definitiva de la cuenta.
  - name: game-history
    x-displayName: Historial de partidas
    description: Las partidas del propio jugador con la sesión iniciada, filtradas y paginadas.
  - name: games
    x-displayName: Partidas y PGN
    description: |-
      Los registros de las partidas, con sus jugadas y sus relojes, y sus archivos PGN.

      **Códigos de partida.** `status`: 1 `WhiteWins`, 2 `BlackWins`, 3 `Draw`, 4 `Aborted` (solo se guardan las partidas terminadas). `result`: `1-0`, `0-1`, `1/2-1/2` o `*` (anulada). `reason`, con su nombre (`termination`) y las palabras que cierran el texto de jugadas del archivo PGN; los códigos 7, 14 y 21 son tablas (el jugador que se quedó sin tiempo, que se rindió o que abandonó la partida tenía enfrente a un rival que no podía dar mate: FIDE 6.9 y 5.1.2; `DESIGN.md` 6.3 da la regla), y el servidor nunca termina una partida con los códigos 4 y 13 (pertenecen a la lista común de motivos):

      | Código | `termination` | Palabras en el PGN (en inglés) — traducción |
      |---|---|---|
      | 1 | `Checkmate` | Checkmate — jaque mate |
      | 2 | `Resignation` | Resignation — abandono |
      | 3 | `Timeout` | Loss on time — derrota por tiempo |
      | 4 | `IllegalMoves` | Second illegal move (forfeit) — segunda jugada ilegal (partida perdida) |
      | 5 | `Stalemate` | Stalemate — rey ahogado |
      | 6 | `InsufficientMaterial` | Dead position (insufficient material) — posición muerta (material insuficiente) |
      | 7 | `TimeoutVsInsufficient` | Flag fall, but the opponent cannot checkmate — caída de bandera, pero el rival no puede dar mate |
      | 8 | `FivefoldRepetition` | Fivefold repetition — quíntuple repetición |
      | 9 | `SeventyFiveMoves` | 75-move rule — regla de los 75 movimientos |
      | 10 | `ThreefoldClaim` | Threefold repetition (claimed) — triple repetición (reclamada) |
      | 11 | `FiftyMoveClaim` | 50-move rule (claimed) — regla de los 50 movimientos (reclamada) |
      | 12 | `Agreement` | Draw by agreement — tablas de mutuo acuerdo |
      | 13 | `IllegalMovesVsInsufficient` | Second illegal move, but the opponent cannot checkmate — segunda jugada ilegal, pero el rival no puede dar mate |
      | 14 | `ResignationVsInsufficient` | Resignation, but the opponent cannot checkmate — abandono, pero el rival no puede dar mate |
      | 20 | `Abandonment` | Abandoned (disconnected for too long) — partida abandonada (desconexión demasiado larga) |
      | 21 | `AbandonmentVsInsufficient` | Abandoned, but the opponent cannot checkmate — partida abandonada, pero el rival no puede dar mate |
      | 22 | `Aborted` | Game aborted — partida anulada |
      | 23 | `NoShow` | Aborted: first move not played in time — anulada: primera jugada no realizada a tiempo |
      | 24 | `Forfeit` | Forfeit (fair play violation) — partida perdida (infracción del juego limpio) |
      | 25 | `ServerAborted` | Aborted by the server — anulada por el servidor |
      | 26 | `BothDisconnected` | Aborted: both players disconnected — anulada: ambos jugadores se desconectaron |

      El código 14 es nuevo en la versión menor 1 del protocolo: un cliente escrito antes de ella debería mostrar un código desconocido como un simple final de partida, con su `result`.
  - name: gifs
    x-displayName: GIF animados
    description: |-
      Una partida en forma de GIF animado, para conservarla o compartirla: el tablero visto desde arriba, un fotograma por posición desde el inicio hasta la posición final, los nombres y las puntuaciones de los jugadores encima del tablero, la última jugada debajo y, en el último fotograma, el resultado y cómo terminó la partida.

      **Coste, caché y cuotas.** Un GIF se crea en un hilo de renderizado propio, nunca en los hilos que ejecutan las partidas, y con la prioridad de CPU más baja: `GIF_THREADS` hilos (`WORKERS` de forma predeterminada), que se inician con el primer GIF y se detienen tras un minuto sin ninguno. Hasta `GIF_QUEUE_MAX` (4 x `WORKERS`) GIF pueden esperar un hilo, como máximo `GIF_QUEUE_TIMEOUT_MS` (10 s) cada uno; un renderizado puede durar `GIF_RENDER_TIMEOUT_MS` (30 s). El servidor guarda los GIF que ha creado en una caché de `GIF_CACHE_MB` MB (32 x `WORKERS`), de la que salen primero los usados hace más tiempo; un GIF de la caché, o uno que se está creando para otra solicitud, no cuesta ningún renderizado. La clave de la caché incluye todo lo que cambia la imagen, nombres incluidos.

      Toda solicitud cuenta en `gif` (30 por minuto y por jugador para los dos endpoints). Un GIF que hay que crear cuenta además en los límites de renderizado: por jugador, `GIF_USER_RENDERS_PER_MIN` (4) por minuto y `GIF_USER_RENDERS_PER_HOUR` (30) por hora; por cliente, con todas sus cuentas juntas, `GIF_IP_RENDERS_PER_MIN` (12) por minuto y `GIF_IP_RENDERS_PER_HOUR` (120) por hora, y el triple por prefijo IPv6 /48. Un cliente debe conservar el archivo que ha descargado en lugar de volver a pedirlo, y esperar `retryAfter` tras un 429 o un 503.

      Tamaños: `small` (casillas de 32 px: 284 x 350 píxeles), `medium` (48 px: 424 x 515), `large` (72 px: 628 x 762); sin coordenadas, 268 x 342, 400 x 503 y 600 x 748. La posición inicial se muestra al menos 1 s (o el retardo indicado, si es mayor), la posición final 3 s, y el GIF se reproduce en bucle; a partir del segundo fotograma solo se guarda la parte de la imagen que cambia. Una partida de 40 jugadas ocupa unos 135, 205 y 325 KiB (small, medium, large), y una de 150 jugadas, 0,5; 0,8 y 1,2 MiB.
  - name: players
    x-displayName: Jugadores
    description: 'Perfiles públicos y partidas recientes. Solo datos públicos: nunca una dirección de correo, una sesión, una sanción ni un nivel de integridad. Una cuenta eliminada no tiene perfil.'
  - name: leaderboard
    x-displayName: Clasificación
    description: Los mejores jugadores de cada categoría oficial.
  - name: reports
    x-displayName: Denuncias
    description: Denuncia del rival de una partida reciente ante los moderadores.
  - name: pages
    x-displayName: Páginas HTML
    description: |-
      Páginas para un navegador, que se abren desde los enlaces de los correos. Sus enlaces apuntan a `https://<SERVER_PUBLIC_HOST>` (con `:<PUBLIC_API_PORT>` cuando no es 443), fuera de `/api/v1`.

      - Las páginas no ejecutan JavaScript ni cargan ningún recurso externo. Se sirven con `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'`.
      - Un `GET` solo muestra un botón o un formulario, para que un analizador de correo que abra el enlace no lo consuma. El cambio se produce con `POST`: un formulario enviado como `application/x-www-form-urlencoded` (también se acepta un cuerpo JSON), con el token del enlace en un campo oculto. Se rechaza un campo que aparezca dos veces.
      - Los errores (límites de frecuencia, campos no válidos) también son páginas HTML, tituladas «Request refused» (solicitud rechazada) o, a partir de 500, «Server error» (error del servidor). Solo responden en JSON los fallos detectados antes de identificar la página (un destino de solicitud demasiado largo o mal formado, la capa por dirección).
