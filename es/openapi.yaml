openapi: 3.1.1
info:
  title: API HTTPS del servidor de Scacelith
  version: "0.9.1"
  summary: 'La API HTTPS de todos los servidores de Scacelith: el oficial y los de la comunidad.'
  description: |-
    Todos los servidores de Scacelith, el oficial `caissa.scacelith.com` y cualquier servidor de la comunidad, responden a esta API HTTPS. El juego la usa para todo lo que queda fuera de la partida propiamente dicha: el registro y el inicio de sesión (incluidos la autenticación de dos factores y Google), la página de la cuenta, el historial de partidas, las descargas PGN y los GIF animados de las partidas, los dispositivos con sesión iniciada, la descarga de los datos, la eliminación de la cuenta y las denuncias.

    El juego en directo (emparejamiento, retos, jugadas, relojes) pasa por el WebSocket del mismo servidor (`wss://<host>/ws`), que se abre con un token de sesión de esta API; se describe en `PROTOCOL.md`, no aquí.

    Los valores predeterminados que se indican a continuación son los de un servidor con la configuración sin modificar; un servidor de la comunidad puede cambiarlos (`CONFIG.md` enumera todos los ajustes).

    ## URL base, puerto y transporte

    - Servidor oficial: `https://caissa.scacelith.com/api/v1`, puerto TCP 443.
    - Un servidor de la comunidad: `https://<SERVER_PUBLIC_HOST>[:<port>]/api/v1`. `API_PORT` es 443 de forma predeterminada; detrás de un NAT o de un proxy, el puerto que usan los jugadores es `PUBLIC_API_PORT`.
    - El WebSocket del juego está en el mismo puerto de forma predeterminada (`WS_PORT` lo traslada; `GET /info` indica al cliente dónde está).
    - HTTP/1.1 sobre TLS. Con `TLS_MODE=proxy`, un proxy inverso situado delante del servidor termina TLS. `TLS_MODE=off` (HTTP sin cifrar) es solo para desarrollo local.
    - Las páginas HTML que se abren desde los enlaces de los correos (`/verify-email`, `/reset-password`, `/confirm-email-change`) están en la raíz del servidor, fuera de `/api/v1`. Los endpoints de estado responden tanto en la raíz como bajo `/api/v1`. El inicio de sesión con Google no tiene ninguna página en el servidor: Google devuelve el navegador al propio juego, en `127.0.0.1`.
    - Una barra final se ignora (`/api/v1/info/` equivale a `/api/v1/info`), y los parámetros de ruta se decodifican como URL (un parámetro que no es una codificación URL válida responde 400 `invalid_request`).

    ## Solicitudes

    - **Cuerpos JSON.** Las solicitudes `POST`, `PUT` y `DELETE` llevan un objeto JSON con `Content-Type: application/json`. Se rechaza un `charset` distinto de UTF-8, y también cualquier otro tipo de contenido (415 `unsupported_media_type`). Un cuerpo vacío cuenta como `{}`, que es lo que reciben los endpoints sin parámetros (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`).
    - **Tamaño y tiempo.** Un cuerpo está limitado a `HTTP_BODY_LIMIT` bytes (16 384 de forma predeterminada; `POST /gif` tiene su propio límite de 135 168 bytes): 413 `payload_too_large`. Debe llegar en un plazo de 10 segundos: 408 `request_timeout`. Tras cualquiera de estos dos errores, el servidor cierra la conexión.
    - **Esquemas estrictos.** Se rechaza cualquier campo que el endpoint no conozca, todo campo no marcado como opcional es obligatorio, y se comprueban los tipos y las longitudes. Cualquiera de estos fallos responde 400 `invalid_request`, con `field` indicando el campo (con puntos si está anidado, como `pow.nonce`). Las cadenas no pueden contener caracteres de control. Las longitudes cuentan unidades de código UTF-16, por lo que un carácter fuera del plano multilingüe básico (un emoji) cuenta doble. Un cuerpo que no es JSON responde 400 `invalid_json`. `POST /gif` y `POST /reports` comprueban sus cuerpos por sí mismos (véase cada endpoint).
    - **Cadenas de consulta.** Cuenta la primera aparición de un parámetro, los parámetros desconocidos se ignoran y un `+` se decodifica como un espacio: los endpoints que reciben una categoría de ritmo de juego aceptan tanto `3%2B2` como `3+2`.
    - **Métodos.** `HEAD` es `GET` sin el cuerpo. `OPTIONS` sobre una ruta existente responde 204 con un encabezado `Allow` (y los encabezados de una solicitud preliminar CORS, más abajo). Cualquier otro método que la ruta no tenga responde 405 `method_not_allowed` con `Allow`.
    - **Destino de la solicitud.** No puede superar los 4096 caracteres (414 `uri_too_long`). Una solicitud que no se puede analizar en absoluto, o cuya línea de solicitud y encabezados son demasiado grandes o llegan demasiado despacio, recibe una respuesta 400, 431 o 408 vacía, y se cierra la conexión.
    - **CORS: una lista de orígenes permitidos, desactivada por defecto.** La API está al servicio del juego, que no envía `Origin`. Con `CORS_ORIGINS` vacío (el valor por defecto) nunca se envía ningún encabezado `Access-Control-*`, de modo que ninguna página web puede leer una respuesta. `CORS_ORIGINS` enumera los orígenes web cuyas páginas pueden llamar a la API desde un navegador, cada uno exactamente como lo envían los navegadores en `Origin`: `https://host` o `https://host:port`, en minúsculas, sin ruta, sin barra final y sin el puerto por defecto; `http://` solo para `localhost`, `127.0.0.1` y `[::1]` (desarrollo local); sin comodines. El servidor oficial fija `CORS_ORIGINS=https://scacelith.com,https://www.scacelith.com` para su sitio web. Entonces:
      - Toda respuesta para una ruta bajo `/api/v1`, salvo los endpoints de estado, tanto de éxito como de error (incluido el 429 de la capa por dirección), lleva `Vary: Origin`. Cuando el `Origin` de la solicitud es, byte a byte, uno de los orígenes de la lista, lleva además `Access-Control-Allow-Origin: <that origin>` y, salvo en la respuesta a una solicitud preliminar, `Access-Control-Expose-Headers: Retry-After, Content-Disposition`, para que la página pueda leer los códigos de error, `Retry-After` y los nombres de archivo de las descargas PGN y GIF.
      - Una solicitud preliminar (`OPTIONS` con `Access-Control-Request-Method`) de un origen de la lista sobre una ruta existente responde 204, sin cuerpo, con `Allow`, `Access-Control-Allow-Origin`, `Access-Control-Allow-Methods` (los métodos de `Allow`), `Access-Control-Allow-Headers: Authorization, Content-Type`, `Access-Control-Max-Age: 600` y `Vary: Origin`. No necesita token y no cuenta para ningún presupuesto de cuenta ni para ningún límite de endpoint; como cualquier solicitud, toma una ficha de la capa por dirección. Un navegador reutiliza una solicitud preliminar durante 10 minutos, pero solo para esa URL exacta, cadena de consulta incluida. Una solicitud sin `Authorization` y sin cuerpo JSON, como `GET /info` o `GET /leaderboard`, no necesita solicitud preliminar.
      - Cualquier otra respuesta a una solicitud preliminar es una solicitud preliminar fallida, aunque lleve los encabezados CORS: un 404 para una ruta que no existe, o el 429 de la capa por dirección. Entonces el navegador no envía la solicitud, y la página ve un error de red, sin la respuesta ni su `Retry-After`.
      - Nunca se envía `Access-Control-Allow-Credentials`, ni `Access-Control-Allow-Origin: *`: una página envía su token de sesión en `Authorization: Bearer`, como el juego, y la API no fija ninguna cookie. Las páginas HTML, los endpoints de estado y las respuestas vacías a las solicitudes que no se pueden analizar no llevan ningún encabezado CORS. El WebSocket no usa CORS: `WS_ALLOWED_ORIGINS` enumera las páginas que pueden abrirlo.
      - Una página de un origen que no está en la lista no lee nada, y sus escrituras entre sitios nunca se envían: los cuerpos JSON y `Authorization` exigen una solicitud preliminar, cuya respuesta no lleva `Access-Control-Allow-Origin` para ese origen. `Cross-Origin-Resource-Policy: same-origin` sigue en todas las respuestas: solo se aplica a las solicitudes `no-cors` (otro sitio que incrusta una respuesta), nunca a las solicitudes `cors` de una página de la lista.

    ## Respuestas y errores

    - Las respuestas son JSON en UTF-8, salvo la descarga PGN (`application/x-chess-pgn`), los GIF animados (`image/gif`) y las páginas HTML. Las marcas de tiempo son milisegundos desde el 1970-01-01 UTC. Los identificadores son enteros. Los identificadores de partida tienen hasta 16 cifras, pero se mantienen por debajo de 2^53, de modo que un número JSON (un double) los representa con exactitud.
    - Todas las respuestas de la API llevan `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`, `X-Frame-Options: DENY`, `Cross-Origin-Resource-Policy: same-origin` y `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'` (las páginas HTML tienen su propia política). Con `TLS_MODE=native` llevan también `Strict-Transport-Security: max-age=31536000`.
    - Una respuesta debe leerse en los 60 segundos siguientes al momento en que el servidor la tiene lista, lo que solo importa para las respuestas grandes (un GIF, la exportación de datos, un PGN largo). El tiempo que tarda el servidor en preparar una respuesta no cuenta ni para este plazo ni para los 30 segundos sin ningún byte de entrada ni de salida tras los cuales se cierra una conexión.

    Los errores tienen una única forma (el esquema `Error`):

    ```json
    { "error": "snake_case_code", "message": "An English sentence.", "retryAfter": 30 }
    ```

    `message` está pensado para los registros y como último recurso; un cliente elige qué mostrar a partir de `error`. `retryAfter` (en segundos) solo está presente en los rechazos que expiran con el tiempo, y en ese caso la respuesta lleva también un encabezado `Retry-After` con el mismo valor; la única excepción es el 503 `busy` de las lecturas del historial, de las partidas, de los jugadores y de la clasificación, que solo tiene el campo. Algunos errores añaden campos: `field` (entrada no válida), `reason` (`weak_password`, `pow_required`), `pow` (`pow_required`), `until` (`banned`), `line` y `column` (`invalid_pgn`).

    Errores que puede devolver cualquier endpoint:

    | Estado | `error` | Cuándo |
    |---|---|---|
    | 400 | `invalid_request` | El cuerpo incumple el esquema del endpoint (`field` indica dónde), el destino de la solicitud o `Content-Length` está mal formado, un parámetro de ruta no es una codificación URL válida, o el cuerpo llegó cortado. |
    | 400 | `invalid_json` | El cuerpo no es JSON. |
    | 401 | `unauthorized` | Falta el encabezado `Authorization` en un endpoint que necesita una sesión. |
    | 401 | `invalid_token` | El token está mal formado, ha caducado, ha sido revocado o pertenece a una cuenta eliminada; también en los endpoints donde la sesión es opcional. |
    | 404 | `not_found` | No existe ese endpoint. Algunos endpoints también lo usan: no existe esa partida, ese jugador o esa sesión. |
    | 405 | `method_not_allowed` | La ruta existe para otros métodos (véase `Allow`). |
    | 408 | `request_timeout` | El cuerpo no llegó en un plazo de 10 segundos. |
    | 413 | `payload_too_large` | El cuerpo supera `HTTP_BODY_LIMIT` (135 168 bytes para `POST /gif`). |
    | 414 | `uri_too_long` | El destino de la solicitud supera los 4096 caracteres. |
    | 415 | `unsupported_media_type` | El cuerpo no es `application/json`, o su charset no es UTF-8. |
    | 429 | `rate_limited` | Un límite de frecuencia (véase más abajo): `retryAfter` más un encabezado `Retry-After`. |
    | 500 | `internal_error` | Un fallo inesperado. El servidor lo registra. |
    | 503 | `timeout` | El servidor no respondió en 30 segundos (60 segundos para la exportación, 45 segundos para los GIF con los ajustes predeterminados). |
    | 503 | `server_busy` | Una búsqueda de sesión o un cambio en la cuenta encontró la base de datos bloqueada (`retryAfter` 1), o la cola de hash de contraseñas está llena (véase más abajo). Además, para un `POST`, `PUT`, `PATCH` o `DELETE`, la base de datos tiene demasiadas escrituras en espera: la solicitud no se ejecutó y sus límites de frecuencia no tomaron nada (`retryAfter` de 2 a 5). |

    Los endpoints de lectura (historial de partidas, partidas, jugadores, clasificación) y la exportación responden 503 `busy` con `retryAfter: 1` cuando la base de datos ha seguido bloqueada.

    Los endpoints que comprueban una contraseña o calculan su hash también pueden responder uno de estos dos errores, ambos con un `retryAfter` aleatorio de 5 a 15 segundos:

    - 503 `server_busy`: la cola de hash de contraseñas del servidor (`PASSWORD_HASH_QUEUE_MAX`) está llena, o se agotó la espera.
    - 429 `rate_limited`: con la cola ya medio llena, este cliente (una dirección IPv4 o un prefijo IPv6 /48) ya tiene `PASSWORD_HASH_WAITERS_PER_SOURCE` hashes en espera. Este 429 devuelve las fichas de límite de frecuencia que había tomado la solicitud.

    No se ha cambiado nada ni se ha contado ningún intento fallido (salvo en `POST /auth/sso/google/link`, cuyo intento con el ticket y cuyo fallo de cuenta ya se habían contado antes del hash), y un enlace de restablecimiento sigue siendo válido.

    Las páginas HTML devuelven sus errores como páginas HTML, con los mismos códigos de estado.

    ## Autenticación

    Los endpoints que necesitan una sesión reciben un token Bearer en el encabezado `Authorization` (el esquema `bearerAuth`):

    ```
    Authorization: Bearer sct_L_8GDd7uzfQ3QQWtqrsWXDTsFWzRwIvJcwIGHhjWPS8
    ```

    - **Obtener un token.** Un token (`sct_` seguido de 43 caracteres base64url) se obtiene de `POST /auth/login`, y después de `POST /auth/login/mfa` cuando la autenticación de dos factores está activada; de `POST /auth/sso/google/finish` y `POST /auth/sso/google/link` (inicio de sesión con Google), y de `POST /auth/sso/complete`. Todos ellos responden `{ token, expiresAt, user }`. El servidor solo guarda un SHA-256 del token.
    - **Sesión obligatoria.** Si falta el encabezado, la respuesta es 401 `unauthorized` con `WWW-Authenticate: Bearer realm="scacelith"`. Un token no válido recibe 401 `invalid_token` con `WWW-Authenticate: Bearer realm="scacelith", error="invalid_token"`. Un cliente debe olvidar todo token que reciba `invalid_token` y volver a iniciar sesión.
    - **Sesión opcional.** En `GET /games/{id}`, `GET /games/{id}/pgn`, `GET /players/{username}` y `GET /players/{username}/games` la sesión es opcional. Sin el encabezado, responden con la vista pública; si se envía el encabezado, su token debe ser válido.
    - **Duración.** Una sesión termina en el primero de estos dos plazos: `SESSION_MAX_DAYS` (90) días después del inicio de sesión (esto es `expiresAt`) o `SESSION_IDLE_DAYS` (30) días sin uso. Cada uso aplaza el límite de inactividad; el servidor escribe el nuevo valor como máximo cada 5 minutos. Una cuenta conserva como máximo `MAX_SESSIONS_PER_USER` (10) sesiones: un nuevo inicio de sesión revoca las más antiguas que superen ese número.
    - **Revocación.** Cerrar sesión (`POST /auth/logout`, `POST /auth/logout-all`, `DELETE /auth/sessions/{id}`) revoca sesiones; también lo hacen un cambio de contraseña (las demás sesiones), un restablecimiento de contraseña y la eliminación de la cuenta (todas las sesiones), así como un administrador. Una revocación desde la API surte efecto de inmediato, y el WebSocket abierto con una sesión revocada se cierra. Un cambio o un restablecimiento de contraseña y la eliminación de la cuenta revocan en la misma transacción que el propio cambio: si uno de ellos falla, no se ha revocado ninguna sesión ni ha cambiado nada más. El servidor guarda en caché las búsquedas de sesión durante 30 segundos, de modo que una revocación mediante el comando de administración, que es un proceso aparte, surte efecto en un plazo de 30 segundos.
    - **Alcance.** Un token pertenece a un único servidor y también abre su WebSocket. No lo envíe nunca a otro servidor.

    ## Límites de frecuencia y otras restricciones

    Los límites se aplican en uno de dos ámbitos. **Cliente:** una dirección IPv4, o un prefijo IPv6 /64 (en modo proxy, la dirección procede de `X-Forwarded-For` enviado por una dirección de `TRUSTED_PROXIES`); algunos límites cuentan además cada prefijo IPv6 /48 en su conjunto, aparte de cada una de sus redes /64. **Jugador:** la cuenta con la sesión iniciada, sea cual sea su dirección; un límite contado por jugador en un endpoint donde la sesión es opcional se cuenta por cliente para una solicitud sin token.

    Cada límite es un cubo de fichas (token bucket) con capacidad para `limit` solicitudes, que se rellena de forma continua a razón de `limit / window`; `retryAfter` es el tiempo que falta hasta la siguiente ficha. Los límites marcados como *compartidos* se cuentan además sobre una ventana deslizante de la misma duración, para que ninguna ventana contenga muchas más de `limit` solicitudes. Todos los límites se cuentan para el servidor entero. Cuando uno de los límites de un endpoint rechaza una solicitud, se devuelven las fichas que sus otros límites habían tomado para esa solicitud. Un rechazo responde 429 `rate_limited` con `retryAfter` y `Retry-After`.

    - **Capa por dirección.** Toda solicitud (cualquier ruta y método, incluidos los endpoints de estado y las actualizaciones a WebSocket) toma primero una ficha del presupuesto de su cliente: `HTTP_RATE_PER_IP` (600) por minuto con una ráfaga de medio minuto, y `HTTP_RATE_PER_PREFIX` (4 x `HTTP_RATE_PER_IP`) para un prefijo IPv6 /48. Además, un cliente puede tener como máximo `IP_MAX_INFLIGHT` (32 x `WORKERS`) solicitudes en curso (`retryAfter` 1 por encima). Un cliente que insiste tras sus rechazos queda bloqueado: `ABUSE_BLOCK_REFUSALS_PER_MIN` (600) rechazos en un minuto lo bloquean durante 1 minuto, y después durante 4, 16 y 60 minutos con cada nuevo bloqueo en un plazo de 6 horas. Un rechazo de los límites `auth`, `auth_*` y `reauth` cuenta por 5; los límites contados por jugador nunca cuentan. Las direcciones de `ABUSE_EXEMPT` se saltan esta capa, pero no el presupuesto de la cuenta ni los límites de los endpoints.
    - **Presupuesto de la cuenta.** Toda solicitud que lleva un token de sesión válido cuenta también contra su cuenta: `USER_RATE_PER_MIN` (120) por minuto para todos los endpoints juntos, sea cual sea la dirección, con una ráfaga de medio minuto.
    - **Límites por endpoint:**

    | Límite | Valor predeterminado | Se cuenta por | Endpoints |
    |---|---|---|---|
    | `auth` | `AUTH_RATE_PER_IP` (20) / 10 min, compartido | cliente, y `AUTH_RATE_PER_PREFIX` (5 x `AUTH_RATE_PER_IP`) por prefijo IPv6 /48 | `POST /auth/register`, `/auth/login`, `/auth/login/mfa`, `/auth/verify-email/resend`, `/auth/password/forgot`, `/auth/password/reset`, `/auth/sso/google/link`, `/auth/sso/complete`; `POST /verify-email`, `/reset-password`, `/confirm-email-change` |
    | `auth_register` | `AUTH_REGISTER_PER_HOUR` (10) / hora, compartido | cliente; el triple por prefijo IPv6 /48 | `POST /auth/register` |
    | `auth_mail` | `AUTH_MAIL_PER_HOUR` (10) / hora, compartido | cliente; el triple por prefijo IPv6 /48 | `POST /auth/verify-email/resend` |
    | `auth_forgot` | `AUTH_FORGOT_PER_HOUR` (3) / hora, compartido | cliente; el triple por prefijo IPv6 /48 | `POST /auth/password/forgot` |
    | `auth_forgot_day` | `AUTH_FORGOT_PER_DAY` (10) / 24 horas, compartido | cliente; el triple por prefijo IPv6 /48 | `POST /auth/password/forgot` |
    | `auth_reset` | `AUTH_RESET_PER_HOUR` (10) / hora, compartido | cliente; el triple por prefijo IPv6 /48 | `POST /auth/password/reset`, `POST /reset-password` |
    | `reauth` | las cifras de `auth`, en un cubo propio, compartido | cliente y prefijo IPv6 /48 | los cambios en la cuenta que piden la contraseña (véase Reautenticación), y `POST /account/export` |
    | `reauth_user` | `AUTH_REAUTH_PER_USER` (10) / 10 min, compartido | jugador | los mismos endpoints que `reauth` |
    | `account` | 60 / min | jugador | `GET /account/me`, `PUT /account/preferences` |
    | `account_games` | 60 / min | jugador | `GET /account/games` |
    | `account_export` | 5 / hora, compartido | jugador | `POST /account/export` (se comprueba antes que `reauth`; todo intento cuenta) |
    | `sessions` | 60 / min | jugador | `POST /auth/logout`, `/auth/logout-all`, `GET /auth/sessions`, `DELETE /auth/sessions/{id}` |
    | `public_read` | 60 / min | jugador (cliente si no hay token) | `GET /players/{username}`, `/players/{username}/games`, `/games/{id}`, `/games/{id}/pgn` (un solo cubo para los cuatro) |
    | `gif` | 30 / min | jugador | `GET /games/{id}/gif`, `POST /gif` (un solo cubo para los dos) |
    | `gif_user_min`, `gif_user_hour` | `GIF_USER_RENDERS_PER_MIN` (4) / min y `GIF_USER_RENDERS_PER_HOUR` (30) / hora, compartidos | jugador | los mismos dos, solo cuando hay que crear el GIF (no cuando sale de la caché) |
    | `gif_ip_min`, `gif_ip_hour` | `GIF_IP_RENDERS_PER_MIN` (12) / min y `GIF_IP_RENDERS_PER_HOUR` (120) / hora, compartidos | cliente (todas sus cuentas juntas); el triple por prefijo IPv6 /48 | los mismos, como en la fila anterior |
    | `reports` | 30 / hora | jugador | `POST /reports` |
    | `sso_start` | 30 / 10 min, compartido | cliente, y 90 por prefijo IPv6 /48 | `POST /auth/sso/google/start` |
    | `sso_finish` | 30 / min | cliente | `POST /auth/sso/google/finish` |
    | `page` | 60 / min | cliente | `GET /verify-email`, `/reset-password`, `/confirm-email-change` |

    `GET /info` y `GET /leaderboard` no tienen límite propio: solo la capa por dirección. Un endpoint con varios límites los comprueba en el orden indicado en su descripción.

    El servidor trata una solicitud en este orden: la capa por dirección y, a continuación, los endpoints de estado; la identificación del endpoint; para un `POST`, `PUT`, `PATCH` o `DELETE`, la comprobación de las escrituras en espera de la base de datos (503 `server_busy`); la autenticación; el presupuesto de la cuenta, cuando la solicitud lleva una sesión; los límites del endpoint; el cuerpo; el propio endpoint (los endpoints de GIF solo toman sus límites de renderizado cuando tienen un GIF que crear). Así, una solicitud rechazada por su token no gasta ninguna ficha del endpoint, y una solicitud con un cuerpo no válido sí las gasta.

    Otras restricciones, que aplican los propios endpoints:

    - **Inicios de sesión fallidos con un mismo nombre de inicio de sesión** (nombre de usuario o correo electrónico): a partir de `AUTH_FAILURES_PER_ACCOUNT` (5) fallos, cada intento debe esperar el doble que el anterior (2 s, 4 s, y así sucesivamente, hasta 15 minutos): 429 `too_many_attempts` con `retryAfter`. El contador se reinicia tras una hora sin fallos.
    - **Segundos factores fallidos al iniciar sesión:** la misma regla a partir del 5.º código erróneo de la cuenta. Un mismo paso de inicio de sesión acepta como máximo 5 códigos erróneos.
    - **Códigos de segundo factor de una cuenta:** como máximo `AUTH_MFA_PER_ACCOUNT` (10) códigos (de la aplicación de autenticación o de recuperación, correctos o erróneos) cada 15 minutos, desde cualquier dirección, al iniciar sesión y en las reautenticaciones; por encima, 429 `too_many_attempts` antes de comprobar el código, de modo que no se gasta ningún código de recuperación.
    - **Reautenticaciones fallidas de una cuenta** (contraseña o código erróneos): la misma regla (429 `too_many_attempts`), compartida por todos los endpoints que piden reautenticación.
    - **Correos:** un correo de confirmación o de restablecimiento por dirección cada 5 minutos (la respuesta no cambia); un aviso «alguien ha intentado usar su dirección» por dirección y por hora.
    - **Denuncias:** `REPORTS_PER_DAY` (5) por jugador en 24 horas: 429 `report_limit`.

    ## Prueba de trabajo

    `POST /auth/register` exige siempre una prueba de trabajo cuando `POW_REGISTER_BITS` es mayor que 0 (18 de forma predeterminada; `GET /info` lo indica como `pow.register`). `POST /auth/login` y `POST /auth/sso/google/link` (un mismo tipo de desafío para ambos) solo la exigen durante los 5 minutos siguientes a una oleada de inicios de sesión fallidos detectada por el servidor (`POW_LOGIN_TRIGGER_PER_MIN`, y entonces `POW_LOGIN_BITS`); el cliente lo sabe por la respuesta.

    1. La solicitud sin prueba (o con una prueba rechazada) responde 428 `pow_required` con `reason` y un desafío `pow` `{ challenge, bits, expiresAt }`.
    2. Encuentre un nonce: una cadena decimal de 20 cifras como máximo tal que `SHA-256(challenge + ":" + nonce)` empiece por `bits` bits a cero (empezando por el bit más significativo del primer byte). 18 bits requieren unos 260 000 hashes de media.
    3. Envíe de nuevo la misma solicitud con `"pow": { "challenge": "...", "nonce": "123456" }` en el cuerpo.

    Un desafío es válido durante 2 minutos y una sola vez, para un endpoint y una red de cliente (una dirección IPv4 o un prefijo IPv6 /64). Está firmado, así que el servidor no guarda nada sobre él hasta que vuelve. `reason` indica por qué se rechazó una prueba: `required`, `malformed`, `signature`, `endpoint`, `network`, `expired`, `bits`, `work` o `replayed`.

    ## Reautenticación

    Los cambios en la cuenta vuelven a pedir la contraseña y, cuando la autenticación de dos factores está activada, un segundo factor:

    - solo la contraseña: `POST /account/password` y `POST /account/mfa/totp/setup`;
    - la contraseña y un código de la aplicación de autenticación, sin admitir códigos de recuperación: `POST /account/mfa/recovery-codes`;
    - la contraseña y un código de la aplicación de autenticación o un código de recuperación: `POST /account/mfa/totp/disable`, `POST /account/email`, `POST /account/export` y `POST /account/delete`.

    En los cuerpos, `code` contiene un código de 6 cifras de la aplicación de autenticación y `recoveryCode`, un código de recuperación (`xxxx-xxxx-xx`; no importan las mayúsculas, los espacios ni los guiones). También se puede enviar un código de recuperación en `code` allí donde se admiten códigos de recuperación. Cada código sirve una sola vez: un código de la aplicación ya usado se rechaza hasta el siguiente intervalo de 30 segundos, y un código de recuperación deja de existir en cuanto se usa.

    | Estado | `error` | Cuándo |
    |---|---|---|
    | 403 | `invalid_password` | Contraseña incorrecta, o la contraseña se restableció o se cambió mientras se procesaba la solicitud (no se ha cambiado nada). |
    | 403 | `mfa_code_required` | La autenticación de dos factores está activada y no se envió ni `code` ni `recoveryCode`. |
    | 403 | `invalid_code` | Código erróneo o ya usado. |
    | 400 | `password_not_set` | Una cuenta que solo usa Google aún no tiene contraseña («¿Olvidó su contraseña?» permite crear una). |
    | 429 | `too_many_attempts` | Demasiados fallos, o demasiados códigos probados, en esta cuenta. |
    | 503 / 429 | `server_busy` / `rate_limited` | La cola de hash de contraseñas está saturada. |

    Las contraseñas y los códigos fallidos cuentan en el contador de fallos de la cuenta y se registran como eventos de seguridad.

    ## Puerto de métricas

    Además del puerto de la API, el servidor responde en HTTP sin cifrar en el puerto de métricas (`METRICS_PORT`, 9464, vinculado a `METRICS_BIND`, 127.0.0.1 de forma predeterminada; manténgalo privado). No forma parte de esta API: `GET /healthz` responde `ok`; `GET /readyz` responde `ready` una vez completado el arranque (cada partición ha vuelto a aplicar su diario y los puertos de escucha están vinculados) y hasta que empieza el apagado, y en caso contrario 503 `not ready`; `GET /metrics` sirve las métricas de Prometheus y, si se ha definido `METRICS_TOKEN`, exige `Authorization: Bearer <token>` con ese token exacto.
